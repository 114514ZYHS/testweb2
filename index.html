<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYHS 的主页</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub {
        color: #57606a;
        font-size: 16px;
        margin-bottom: 30px;
    }
    .nav-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    .nav-item {
        display: block;
        background: #ffffff;
        border: 1px solid #d0d7de;
        padding: 16px 20px;
        text-decoration: none;
        color: #0969da;
        font-weight: 500;
        transition: background 0.15s;
        background: rgba(255, 255, 255, 0.82);
    }
    .nav-item:hover {
        background: #f6f8fa;
        background: rgba(246, 248, 250, 0.92);
    }
    .nav-item .desc {
        display: block;
        font-weight: normal;
        font-size: 14px;
        color: #57606a;
        margin-top: 4px;
    }
    .nav-item.wide { grid-column: 1 / -1; }
    .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 14px;
        color: #8b949e;
        border-top: 1px solid #d0d7de;
        padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { filter: brightness(0.32); }
        .nav-item { background: #161b22; border-color: #30363d; color: #58a6ff; background: rgba(22, 27, 34, 0.85); }
        .nav-item:hover { background: #1c2128; background: rgba(28, 33, 40, 0.92); }
        .nav-item .desc { color: #8b949e; }
        .footer { border-top-color: #30363d; color: #8b949e; }
        .sub { color: #8b949e; }
    }
    @media (max-width: 500px) {
        .nav-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

        </a>

        </a>
        <a href="/Blog/index.html" class="nav-item">

            <span class="desc">随笔与记录</span>
        </a>
        <a href="/Download/" class="nav-item">
            下载中心
            <span class="desc">浏览并下载文件</span>
        </a>
        <a href="/分片下载.html" class="nav-item">
            分片下载

        </a>
        <a href="/TXT/index.html" class="nav-item">
            小说阅读
            <span class="desc">自动扫描 TXT · 可调字号 · 夜读模式 · 翻页</span>
        </a>
        <a href="/我的世界网页/index.html" class="nav-item">
            我的世界网页版

        </a>
        <a href="/工具/index.html" class="nav-item">

    </div>

    <div class="footer">4444442.xyz · ZYHS</div>
