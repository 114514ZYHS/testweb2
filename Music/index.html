<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 16px;
        color: #0969da;
        text-decoration: none;
        font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub {
        color: #57606a;
        font-size: 16px;
        margin-bottom: 24px;
    }

    /* ---- 播放器 ---- */
    .player {
        background: #ffffff;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #d0d7de;
        padding: 20px 22px;
        margin-bottom: 20px;
    }
    .now-title {
        font-size: 19px;
        font-weight: 600;
        color: #1e1e1e;
        margin-bottom: 3px;
        word-break: break-word;
    }
    .now-meta {
        font-size: 13px;
        color: #8b949e;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        margin-bottom: 16px;
    }
    .seek-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
    }
    .time {
        font-size: 12px;
        color: #57606a;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        min-width: 40px;
    }
    .time.right { text-align: right; }
    .seek {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: #e1e4e8;
        outline: none;
        cursor: pointer;
        border-radius: 0;
    }
    .seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        background: #0969da;
        cursor: pointer;
        border-radius: 0;
    }
    .seek::-moz-range-thumb {
        width: 13px;
        height: 13px;
        background: #0969da;
        cursor: pointer;
        border: none;
        border-radius: 0;
    }
    .ctrls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    button.ctl {
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 16px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        background: rgba(255, 255, 255, 0.85);
        color: #24292e;
        cursor: pointer;
        border-radius: 0;
    }
    button.ctl:hover { background: #f6f8fa; background: rgba(246, 248, 250, 0.95); }
    button.ctl:disabled { opacity: 0.45; cursor: default; }
    button.ctl.play {
        background: #2da44e;
        border-color: #2da44e;
        color: #fff;
        min-width: 92px;
    }
    button.ctl.play:hover { background: #22863a; border-color: #22863a; }
    button.ctl.on {
        background: #0969da;
        border-color: #0969da;
        color: #fff;
    }
    .vol-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        font-size: 13px;
        color: #57606a;
    }
    .vol {
        -webkit-appearance: none;
        appearance: none;
        width: 90px;
        height: 5px;
        background: #e1e4e8;
        outline: none;
        cursor: pointer;
        border-radius: 0;
    }
    .vol::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 11px;
        height: 11px;
        background: #0969da;
        cursor: pointer;
        border-radius: 0;
    }
    .vol::-moz-range-thumb {
        width: 11px; height: 11px; background: #0969da; border: none; border-radius: 0;
    }

    /* ---- 列表 ---- */
    .list-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
    }
    .list-head .lbl {
        font-size: 18px;
        font-weight: 600;
    }
    .list-head .cnt {
        font-size: 13px;
        color: #57606a;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .tracks {
        background: #ffffff;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #d0d7de;
    }
    .track {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        border-bottom: 1px solid #e1e4e8;
        cursor: pointer;
        user-select: none;
    }
    .track:last-child { border-bottom: none; }
    .track:hover { background: #f6f8fa; background: rgba(246, 248, 250, 0.95); }
    .track.active { background: #ddf4e4; background: rgba(221, 244, 228, 0.95); }
    .track .no {
        font-size: 13px;
        color: #8b949e;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        min-width: 24px;
    }
    .track.active .no { color: #1a7f37; font-weight: 600; }
    .track .name {
        flex: 1;
        font-size: 15px;
        color: #1e1e1e;
        word-break: break-word;
    }
    .track.active .name { color: #1a7f37; font-weight: 600; }
    .track .tag {
        font-size: 11px;
        padding: 2px 8px;
        background: #e9ecef;
        color: #57606a;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        white-space: nowrap;
    }
    .track .dur {
        font-size: 12px;
        color: #8b949e;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        min-width: 38px;
        text-align: right;
    }
    .note {
        margin-top: 16px;
        font-size: 13px;
        color: #57606a;
        line-height: 1.7;
    }
    .note b { color: #1e1e1e; }
    .footer {
        margin-top: 36px;
        text-align: center;
        font-size: 14px;
        color: #8b949e;
        border-top: 1px solid #d0d7de;
        padding-top: 16px;
        line-height: 1.9;
    }
    .footer a { color: #0969da; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .player, .tracks { background: #161b22; border-color: #30363d; background: rgba(22, 27, 34, 0.94); }
        .now-title { color: #c9d1d9; }
        .track { border-bottom-color: #30363d; }
        .track:hover { background: #1c2128; }
        .track.active { background: rgba(26, 58, 36, 0.95); }
        .track .name { color: #c9d1d9; }
        .track .tag { background: #30363d; color: #8b949e; }
        button.ctl { background: #161b22; border-color: #30363d; color: #c9d1d9; background: rgba(22, 27, 34, 0.85); }
        button.ctl:hover { background: #1c2128; }
        .seek, .vol { background: #30363d; }
        .footer { border-top-color: #30363d; color: #8b949e; }
        .note { color: #8b949e; }
        .note b { color: #c9d1d9; }
    }
    @media (max-width: 560px) {
        .ctrls { gap: 8px; }
        button.ctl { padding: 7px 12px; font-size: 13px; }
        button.ctl.play { min-width: 78px; }
        .vol-wrap { margin-left: 0; }
        .track { padding: 11px 14px; gap: 10px; }
        .track .tag { display: none; }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    <h1>Music</h1>
    <div class="sub">点歌台 · 点击列表播放</div>

    <div class="player">
        <div class="now-title" id="nowTitle">未选择曲目</div>
        <div class="now-meta" id="nowMeta">点击下方列表任意一首开始播放</div>

        <div class="seek-row">
            <span class="time" id="tCur">0:00</span>
            <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1">
            <span class="time right" id="tDur">0:00</span>
        </div>

        <div class="ctrls">
            <button class="ctl" id="btnPrev">上一首</button>
            <button class="ctl play" id="btnPlay">播放</button>
            <button class="ctl" id="btnNext">下一首</button>
            <button class="ctl" id="btnMode">顺序播放</button>
            <div class="vol-wrap">
                <span>音量</span>
                <input type="range" class="vol" id="vol" min="0" max="100" value="80" step="1">
            </div>
        </div>
    </div>

    <div class="list-head">
        <span class="lbl">曲目列表</span>
        <span class="cnt" id="cnt"></span>
    </div>
    <div class="tracks" id="tracks"></div>

    <div class="note">
        <b>说明</b>：全部曲目均为知识共享（CC）或公有领域授权，可自由使用，来源为 Free Music Archive
        与 Incompetech（Kevin MacLeod）。文件存放在本站 <b>/Music/</b> 目录下。
    </div>

    <div class="footer">
        4444442.xyz · ZYHS<br>
        <a href="https://freemusicarchive.org" target="_blank" rel="noopener">Free Music Archive</a> ·
        <a href="https://incompetech.com" target="_blank" rel="noopener">Incompetech</a>
    </div>

<script>
var MUSIC_LIST = [{"title": "Enthusiast", "cat": "电子", "author": "Tours", "src": "tours_enthusiast.mp3", "kb": 7123, "dur": ""}, {"title": "Night Owl", "cat": "电子", "author": "Broke For Free", "src": "night_owl.mp3", "kb": 7865, "dur": ""}];
var TRACKS = MUSIC_LIST;

var audio = new Audio();
audio.preload = 'metadata';

var idx = -1;
var mode = 0;                       // 0 顺序 / 1 单曲 / 2 随机
var MODE_TXT = ['顺序播放', '单曲循环', '随机播放'];
var seeking = false;

var elTitle = document.getElementById('nowTitle');
var elMeta = document.getElementById('nowMeta');
var elCur = document.getElementById('tCur');
var elDur = document.getElementById('tDur');
var elSeek = document.getElementById('seek');
var elPlay = document.getElementById('btnPlay');
var elMode = document.getElementById('btnMode');
var elVol = document.getElementById('vol');
var elTracks = document.getElementById('tracks');
var elCnt = document.getElementById('cnt');

function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60);
    var r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
}

function render() {
    elTracks.innerHTML = '';
    elCnt.textContent = TRACKS.length + ' 首';
    for (var i = 0; i < TRACKS.length; i++) {
        (function (i) {
            var t = TRACKS[i];
            var row = document.createElement('div');
            row.className = 'track' + (i === idx ? ' active' : '');
            row.setAttribute('data-i', i);

            var no = document.createElement('span');
            no.className = 'no';
            no.textContent = i === idx ? '▶' : (i + 1);
            row.appendChild(no);

            var nm = document.createElement('span');
            nm.className = 'name';
            nm.textContent = t.title;
            row.appendChild(nm);

            var tg = document.createElement('span');
            tg.className = 'tag';
            tg.textContent = t.cat || '';
            row.appendChild(tg);

            var du = document.createElement('span');
            du.className = 'dur';
            du.textContent = t.dur || '';
            row.appendChild(du);

            row.onclick = function () { playAt(i); };
            elTracks.appendChild(row);
        })(i);
    }
}

function loadAt(i, autoplay) {
    if (i < 0 || i >= TRACKS.length) return;
    idx = i;
    var t = TRACKS[i];
    audio.src = t.src;
    elTitle.textContent = t.title;
    elMeta.textContent = (t.cat ? t.cat + ' · ' : '') + (t.author || '未知作者');
    render();
    if (autoplay) audio.play().catch(function () {});
}

function playAt(i) {
    if (i === idx && !audio.paused) { audio.pause(); return; }
    if (i === idx && audio.src) { audio.play().catch(function () {}); return; }
    loadAt(i, true);
}

function next(auto) {
    if (TRACKS.length === 0) return;
    if (mode === 1 && auto) { audio.currentTime = 0; audio.play().catch(function(){}); return; }
    var n;
    if (mode === 2) {
        if (TRACKS.length === 1) n = 0;
        else { do { n = Math.floor(Math.random() * TRACKS.length); } while (n === idx); }
    } else {
        n = idx + 1;
        if (n >= TRACKS.length) {
            if (!auto) n = 0;                 // 手动下一首：回到开头
            else { audio.pause(); return; }   // 自动播完：停止
        }
    }
    loadAt(n, true);
}

function prev() {
    if (TRACKS.length === 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    var n = idx - 1;
    if (n < 0) n = TRACKS.length - 1;
    loadAt(n, true);
}

/* ---- 事件 ---- */
elPlay.onclick = function () {
    if (idx < 0) { if (TRACKS.length) loadAt(0, true); return; }
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
};

document.getElementById('btnNext').onclick = function () { next(false); };
document.getElementById('btnPrev').onclick = prev;

elMode.onclick = function () {
    mode = (mode + 1) % 3;
    elMode.textContent = MODE_TXT[mode];
    elMode.className = 'ctl' + (mode === 0 ? '' : ' on');
};

audio.onplay = function () { elPlay.textContent = '暂停'; };
audio.onpause = function () { elPlay.textContent = '播放'; };

audio.onloadedmetadata = function () {
    elDur.textContent = fmt(audio.duration);
    if (idx >= 0 && TRACKS[idx]) {
        TRACKS[idx].dur = fmt(audio.duration);
        var rows = elTracks.querySelectorAll('.track');
        if (rows[idx]) rows[idx].querySelector('.dur').textContent = fmt(audio.duration);
    }
};

audio.ontimeupdate = function () {
    elCur.textContent = fmt(audio.currentTime);
    if (!seeking && audio.duration) {
        elSeek.value = Math.round((audio.currentTime / audio.duration) * 1000);
    }
};

audio.onended = function () { next(true); };

elSeek.oninput = function () { seeking = true; };
elSeek.onchange = function () {
    if (audio.duration) audio.currentTime = (elSeek.value / 1000) * audio.duration;
    seeking = false;
};

elVol.oninput = function () { audio.volume = elVol.value / 100; };
audio.volume = 0.8;

/* 键盘：空格播放/暂停，左右切歌 */
document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space') { e.preventDefault(); elPlay.click(); }
    else if (e.code === 'ArrowRight') { next(false); }
    else if (e.code === 'ArrowLeft') { prev(); }
});

render();
</script>
</body>
</html>
