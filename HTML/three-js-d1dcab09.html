<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ 工具 ============ */
let _seed = 20240607;
function srand() { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + srand() * (b - a);
const TAU = Math.PI * 2;
function lerp(a, b, t) { return a + (b - a) * t; }
function makeNoise(seed) {
  const p = new Uint8Array(512); const perm = [];
  for (let i = 0; i < 256; i++) perm[i] = i;
  let s = seed;
  for (let i = 255; i > 0; i--) { const j = (s = (s * 16807) % 2147483647) % (i + 1);
    const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = (h, x, y) => { const a = (h & 7) * Math.PI / 4; return Math.cos(a) * x + Math.sin(a) * y; };
  return function (x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const f = t => t * t * t * (t * (t * 6 - 15) + 10);
    const u = f(x), v = f(y);
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    return lerp(v, lerp(u, g(aa, x, y), g(ba, x - 1, y)), lerp(u, g(ab, x, y - 1), g(bb, x - 1, y - 1)));
  };
}
const noise2 = makeNoise(77);
function makeTex(size, draw, { srgb = true, repeat = 1 } = {}) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d'); draw(ctx, size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function grain(ctx, size, alpha, tint) {
  const img = ctx.getImageData(0, 0, size, size); const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const n = (noise2(x * .11, y * .11) * .6 + noise2(x * .03, y * .03) * .4);
    const i = (y * size + x) * 4;
    const k = 1 + (n - .5) * alpha;
    d[i] = Math.min(255, d[i] * k + (tint ? tint[0] * n * alpha * .5 : 0));
    d[i + 1] = Math.min(255, d[i + 1] * k + (tint ? tint[1] * n * alpha * .5 : 0));
    d[i + 2] = Math.min(255, d[i + 2] * k + (tint ? tint[2] * n * alpha * .5 : 0));
  }
  ctx.putImageData(img, 0, 0);
}
function streaks(ctx, size, count, alpha) {
  for (let i = 0; i < count; i++) {
    const x = srand() * size, w = rr(2, 14), h = rr(size * .2, size * .9);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `rgba(90,88,80,${alpha})`); g.addColorStop(1, 'rgba(90,88,80,0)');
    ctx.save(); ctx.translate(x, srand() * size * .3);
    ctx.fillStyle = g; ctx.fillRect(-w / 2, 0, w, h); ctx.restore();
  }
}

/* ============ 渲染器 / 场景 / 相机 / 后期 ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcbd3d2, 0.014);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 300);
camera.position.set(-6.5, 13.0, 17.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.0, 0.5, -1.5);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3.5; controls.maxDistance = 48;
controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.12;
controls.update();

const _pr = renderer.getPixelRatio();
const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(innerWidth * _pr, innerHeight * _pr, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.11, 0.62, 0.78);
composer.addPass(bloom);
const filmPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: innerWidth / innerHeight } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uAspect; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - .5; q.x *= uAspect;
      float d = length(q);
      /* 暗角 */
      c.rgb *= mix(.54, 1., smoothstep(1.02, .28, d));
      /* 烟雨调色：阴影偏青、高光微暖、整体降饱和 */
      float l = dot(c.rgb, vec3(.299, .587, .114));
      vec3 tint = mix(vec3(.85, .95, .99), vec3(1.06, 1.0, .93), smoothstep(.20, .88, l));
      c.rgb *= mix(vec3(1.), tint, .62);
      c.rgb = mix(vec3(l), c.rgb, .87);
      /* 湿空气：轻提黑位、柔化对比，像隔着一层水汽 */
      c.rgb = c.rgb * .93 + .035;
      c.rgb = mix(c.rgb, c.rgb * c.rgb * (3. - 2. * c.rgb), .17);
      /* 缓慢流动的湿雾扰动 */
      float haze = vnoise(vUv * vec2(3.2, 2.0) + vec2(uTime * .013, uTime * .006));
      c.rgb += (haze - .5) * .02;
      /* 胶片颗粒 */
      c.rgb += hash(vUv * vec2(1920., 1080.) + fract(uTime) * 7.) * .026 - .013;
      gl_FragColor = c;
    }`
});
composer.addPass(filmPass);
composer.addPass(new OutputPass());

const uTime = { value: 0 };

/* ============ 日夜状态 ============ */
const DN = {
  day: {
    skyTop: new THREE.Color(0x93a7b4), skyHor: new THREE.Color(0xd6dcd6),
    sunCol: new THREE.Color(0xdfeaf2), sunI: 1.1, sunPos: new THREE.Vector3(-16, 24, 14),
    hemiSky: new THREE.Color(0xbfc9cc), hemiGnd: new THREE.Color(0x6a7260), hemiI: 0.66,
    fog: new THREE.Color(0xc7d0d3), fogD: 0.0125, expo: 0.95,
    waterDeep: new THREE.Color(0x215a62),
    bloom: 0.11, moon: 0.0, paperEm: 0.05, flameOp: 0.12,
    mistC: new THREE.Color(0xdfe2da), mistO: 0.85,
    rainC: new THREE.Color(0xaebdc8), rainO: 0.16
  },
  night: {
    skyTop: new THREE.Color(0x0a1320), skyHor: new THREE.Color(0x1c2a38),
    sunCol: new THREE.Color(0x8fa8cc), sunI: 0.3, sunPos: new THREE.Vector3(14, 20, -12),
    hemiSky: new THREE.Color(0x1a2836), hemiGnd: new THREE.Color(0x0a0d10), hemiI: 0.25,
    fog: new THREE.Color(0x141d2b), fogD: 0.019, expo: 1.12,
    waterDeep: new THREE.Color(0x07131c),
    bloom: 0.3, moon: 1.0, paperEm: 1.1, flameOp: 0.9,
    mistC: new THREE.Color(0x25313d), mistO: 0.55,
    rainC: new THREE.Color(0x4e5c72), rainO: 0.09
  }
};
let dnT = 1.0, dnTarget = 1.0;

/* ============ 天空穹顶 ============ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: DN.day.skyTop.clone() }, uHor: { value: DN.day.skyHor.clone() },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color(0xffffff) },
    uMoon: { value: 0 }, uTime: uTime
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform vec3 uTop,uHor,uSunDir,uSunCol; uniform float uMoon,uTime; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.03; a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y*.5+.5, 0., 1.);
      vec3 col = mix(uHor, uTop, pow(h, .8));
      vec2 uv = d.xz / (abs(d.y)+.25);
      float cl = fbm(uv*1.4 + uTime*.008);
      float cl2 = fbm(uv*3.1 - uTime*.014);
      col = mix(col, uHor*1.02, smoothstep(.5,.02,abs(d.y-.12))*(cl*.5+cl2*.2));
      float ang = distance(d, normalize(uSunDir));
      float disc = smoothstep(.035,.028,ang);
      float glow = pow(max(1.-ang*2.2,0.),3.)*.4;
      float moonDisc = smoothstep(.014,.011,ang);
      col += uSunCol*(glow + disc*.5 + moonDisc*2.6*uMoon);
      if(uMoon>.05 && moonDisc>0.){ col = mix(col, uSunCol*2.2, moonDisc*.85); }
      col += (hash(gl_FragCoord.xy) - .5) * (1.2/255.0);
      gl_FragColor = vec4(col, 1.);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 48, 32), skyMat));

function buildEnv(isDay) {
  const s = new THREE.Scene();
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const cx = cv.getContext('2d');
  const g = cx.createLinearGradient(0, 0, 0, 64);
  if (isDay) { g.addColorStop(0, '#9fb0bb'); g.addColorStop(0.6, '#d0d8d2'); g.addColorStop(1, '#5a6354'); }
  else { g.addColorStop(0, '#0c1522'); g.addColorStop(0.6, '#1a2836'); g.addColorStop(1, '#05070a'); }
  cx.fillStyle = g; cx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  s.add(new THREE.Mesh(new THREE.SphereGeometry(10, 16, 12), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
  if (!isDay) {
    const warm = new THREE.Mesh(new THREE.SphereGeometry(.8, 8, 8),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 2.2, .9) }));
    warm.position.set(0, 0, 6); s.add(warm);
  }
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(s, 0.03); pm.dispose();
  return rt.texture;
}
const envDay = buildEnv(true), envNight = buildEnv(false);
scene.environment = envDay;

/* ============ 远山剪影 ============ */
const world = new THREE.Group(); scene.add(world);
function ridge(zPos, ry, baseH, amp, col, seed) {
  const n = makeNoise(seed);
  const pts = [];
  for (let x = -130; x <= 130; x += 8) {
    const h = baseH + Math.abs(n(x * .045, 7.3)) * amp + Math.abs(n(x * .012, 2.1)) * amp * .7;
    pts.push([x, h]);
  }
  const sh = new THREE.Shape();
  sh.moveTo(-130, -4); sh.lineTo(-130, pts[0][1]);
  for (const [x, y] of pts) sh.lineTo(x, y);
  sh.lineTo(130, -4); sh.closePath();
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh),
    new THREE.MeshBasicMaterial({ color: col, fog: true }));
  m.position.set(0, 0, zPos); m.rotation.y = ry;
  world.add(m);
}
ridge(-95, 0, 3, 10, 0x93a6ae, 11);
ridge(-80, 0, 1, 6, 0x87999f, 23);
ridge(95, Math.PI, 2.5, 8, 0x93a6ae, 37);

/* ============ 灯光 ============ */
const sun = new THREE.DirectionalLight(0xdfeaf2, 1.1);
sun.position.set(-16, 24, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target); sun.target.position.set(-2, 0, 0);
const hemi = new THREE.HemisphereLight(0xbfc9cc, 0x6a7260, 0.66);
scene.add(hemi);

const lamps = [];
function addLamp(light, max) { light.intensity = 0; scene.add(light); if (light.target) scene.add(light.target); lamps.push({ light, max }); return light; }
const hallSpot = addLamp(new THREE.SpotLight(0xffb063, 0, 9, 1.05, 0.9, 1.8), 55);
hallSpot.position.set(-7.5, 3.5, -6.6); hallSpot.target.position.set(-7.5, 0.4, -7.0);
const hallSpot2 = addLamp(new THREE.SpotLight(0xffb063, 0, 8, 1.1, 1, 1.8), 26);
hallSpot2.position.set(-8.5, 3.4, -4.8); hallSpot2.target.position.set(-8.2, 0.4, -5.2);
const studyPt = addLamp(new THREE.PointLight(0xffa95c, 0, 4.5, 1.9), 14); studyPt.position.set(-11.2, 1.9, -6.6);
const bedPt = addLamp(new THREE.PointLight(0xff9a50, 0, 3.5, 1.9), 6); bedPt.position.set(-4.2, 2.1, -6.6);
const corrPt1 = addLamp(new THREE.PointLight(0xffa95c, 0, 6, 1.9), 9); corrPt1.position.set(-0.5, 2.3, -3.2);
const corrPt2 = addLamp(new THREE.PointLight(0xffa95c, 0, 6, 1.9), 9); corrPt2.position.set(3.2, 2.3, -1.0);
const pavPt = addLamp(new THREE.PointLight(0xffa95c, 0, 6, 1.9), 11); pavPt.position.set(3.3, 2.0, 1.5);
const eavePt1 = addLamp(new THREE.PointLight(0xffb063, 0, 8, 1.8), 15); eavePt1.position.set(-10.4, 2.6, -2.6);
const eavePt2 = addLamp(new THREE.PointLight(0xffb063, 0, 8, 1.8), 15); eavePt2.position.set(-4.6, 2.6, -2.6);
const gatePt = addLamp(new THREE.PointLight(0xffa050, 0, 6, 1.9), 7); gatePt.position.set(-14, 1.9, 12);

/* ============ 材质库 ============ */
const M = {};
M.timber = new THREE.MeshStandardMaterial({
  map: makeTex(512, (c, s) => {
    const bg = c.createLinearGradient(0, 0, s, s);
    bg.addColorStop(0, '#8f7456'); bg.addColorStop(.5, '#876c50'); bg.addColorStop(1, '#7d6349');
    c.fillStyle = bg; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 130; i++) {
      const y = srand() * s;
      c.strokeStyle = `rgba(${(52 + srand() * 46) | 0},${(38 + srand() * 32) | 0},${(26 + srand() * 22) | 0},${rr(.04, .22)})`;
      c.lineWidth = rr(.6, 4.2); c.beginPath(); c.moveTo(0, y);
      for (let x = 0; x <= s; x += 24) c.lineTo(x, y + Math.sin(x * .018 + i * 1.7) * rr(.6, 5.5));
      c.stroke();
    }
    /* 顺纹长条与深色细纹 */
    for (let i = 0; i < 26; i++) {
      const x = srand() * s;
      c.strokeStyle = `rgba(48,34,22,${rr(.05, .16)})`;
      c.lineWidth = rr(.8, 2.4); c.beginPath(); c.moveTo(x, 0);
      for (let y = 0; y <= s; y += 32) c.lineTo(x + Math.sin(y * .02 + i) * rr(1, 6), y);
      c.stroke();
    }
    for (let i = 0; i < 11; i++) {
      const x = srand() * s, y = srand() * s;
      c.fillStyle = 'rgba(56,40,26,.5)'; c.beginPath(); c.ellipse(x, y, rr(4, 10), rr(8, 22), 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(40,28,18,.42)'; c.lineWidth = 1.5;

    varying vec3 vW;

  fragmentShader: `
    uniform float uTime; uniform vec3 uSkyTop,uSkyHor,uDeep,uSunDir,uSunCol;
    uniform vec3 uLp[6]; uniform vec3 uLc[6];
    uniform sampler2D uShore; uniform vec2 uShoreOff; uniform vec2 uShoreSize;
    varying vec3 vW;
    #include <common>
    #include <fog_pars_fragment>
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);

    void main(){
      vec2 q = vW.xz;
      float t = uTime;
      /* ---- 多尺度、多方向波叠加 → 水面法线 ---- */
      float sx = 0., sz = 0.;
      sx += cos(q.x*1.30 + t*.70)*.40;        sz += cos(q.y*1.75 - t*.55)*.44;
      sx += cos((q.x+q.y)*.78 + t*.92)*.22;   sz += cos((q.x+q.y)*.78 + t*.92)*.20;
      sx += cos((q.x-q.y)*1.65 - t*.80)*.15;  sz -= cos((q.x-q.y)*1.65 - t*.80)*.15;
      sx += cos(q.x*4.1 - q.y*3.4 + t*1.45)*.075; sz += cos(q.y*4.7 + q.x*2.9 - t*1.25)*.075;
      sx += (vnoise(q*7.0 + vec2(t*.55, -t*.4)) - .5)*.22;
      sz += (vnoise(q*7.0 + vec2(-t*.35, t*.6) + 31.7) - .5)*.22;
      /* ---- 雨点涟漪：两个随机相位网格的扩散圆环 ---- */
      for(int k=0;k<3;k++){
        float fk = float(k);
        float cs = 2.2 + fk*.9;
        vec2 g = floor(q/cs + fk*17.3), f = fract(q/cs + fk*17.3);
        vec2 c = vec2(hash(g + fk*7.1), hash(g + fk*3.7));
        vec2 dv = f - c;
        float ph = fract(t*(.62 - fk*.13) + hash(g + fk*11.3)*9.7);
        float ring = smoothstep(.24,.0,abs(length(dv)*cs - ph*1.0)) * exp(-ph*3.4);
        sx += ring * dv.x * 7.5; sz += ring * dv.y * 7.5;

      vec3 n = normalize(vec3(-sx*.36, 1., -sz*.36));
      vec3 V = normalize(cameraPosition - vW);
      vec3 R = reflect(-V, n);
      /* ---- 环境反射：天空 + 日月高光 ---- */
      vec3 sky = mix(uSkyHor, uSkyTop, clamp(R.y*1.18 + .05, 0., 1.));
      sky += uSunCol * pow(max(dot(R, normalize(uSunDir)), 0.), 48.) * .30;
      float fres = .085 + .915 * pow(1. - max(dot(V, n), 0.), 3.1);
      /* ---- 水体：岸边浅透、中间深邃 ---- */
      float shore = texture2D(uShore, (vW.xz - uShoreOff) / uShoreSize).r;
      float depth = smoothstep(.28, .80, shore);
      vec3 body = mix(uDeep*1.9, uDeep, depth) + uSkyHor*.05; // 浅处稍亮，深处沉青
      body += vec3(.05,.075,.07) * smoothstep(.75, 1.2, abs(sx)+abs(sz)) * (1.-depth*.6);
      vec3 col = mix(body, sky, clamp(fres, 0., .93));
      /* ---- 阳光/月光碎金 + 灯火倒影 ---- */
      vec3 nS = normalize(vec3(n.x*.55, n.y, n.z*.55));
      vec3 H = normalize(normalize(uSunDir) + V);
      col += uSunCol * pow(max(dot(nS, H), 0.), 16.) * .09;   // 宽阔水面光泽
      col += uSunCol * pow(max(dot(nS, H), 0.), 210.) * 2.1;
      col += uSunCol * pow(max(dot(nS, H), 0.), 820.) * 2.6;
      for(int i=0;i<6;i++){
        vec3 Lp = uLp[i] - vW; float d2 = length(Lp);
        if(d2 > .01 && uLc[i].r+uLc[i].g+uLc[i].b > .001){

      col += uSkyHor * smoothstep(.62,.22,shore) * .10;       // 岸边浅水微光

      gl_FragColor = vec4(col, alpha);
      #include <fog_fragment>
    }`

function tileProfile() {
  const s = new THREE.Shape();
  const r = .075, half = .105;
  s.moveTo(-half, .012);
  s.lineTo(-r - .004, .012);
  s.quadraticCurveTo(-r - .006, r * .82, 0, r + .012);
  s.quadraticCurveTo(r + .006, r * .82, r + .004, .012);
  s.lineTo(half, .012);
  s.lineTo(half, 0);
  s.lineTo(-half, 0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false, steps: 1 });
  g.translate(0, 0, -.5);
  return g;
}

}

function lattice(w, h, kind) {
  const parts = [];
  const bar = .022, depth = .03;
  if (kind === 'grid') {
    const nx = Math.max(2, Math.round(w / .11)), ny = Math.max(2, Math.round(h / .11));
    for (let i = 0; i <= nx; i++) { const g = new THREE.BoxGeometry(bar, h, depth); g.translate(i * w / nx, h / 2, 0); parts.push(g); }
    for (let j = 0; j <= ny; j++) { const g = new THREE.BoxGeometry(w, bar, depth); g.translate(w / 2, j * h / ny, 0); parts.push(g); }
  } else {
    const n = Math.max(4, Math.round(w / .14));
    for (let i = 0; i < n; i++) {
      const off = (i / (n - 1) - .5);
      for (const sgn of [1, -1]) {
        const g = new THREE.BoxGeometry(w * 1.25, bar, depth);
        g.rotateZ(sgn * .7);
        g.translate(w / 2, h / 2 + off * h * .85, 0);
        parts.push(g);
      }
    }
  }
  return mergeGeometries(parts);
}
function geishaDoor(w, h, kind = 'grid') {
  const parts = [];
  const st = .055, hLat = h * .46, hWaist = .16;
  const hSkirt = h - hLat - hWaist - st * 4;
  for (const sx of [0, w - st]) { const g = new THREE.BoxGeometry(st, h, .055); g.translate(sx + st / 2, h / 2, 0); parts.push(g); }
  const yLatB = h - st - hLat - st, yWaistB = yLatB - hWaist - st;
  for (const yc of [h - st / 2, yLatB + st / 2, yWaistB + st / 2, st / 2]) {
    const g = new THREE.BoxGeometry(w, st, .055); g.translate(w / 2, yc, 0); parts.push(g);
  }
  const lat = lattice(w - st * 2, hLat, kind);
  lat.translate(st, h - st - hLat, -.015); parts.push(lat);
  const wg = new THREE.BoxGeometry(w - st * 2 + .04, hWaist, .04); wg.translate(w / 2, yWaistB + st + hWaist / 2, 0); parts.push(wg);
  const sk = new THREE.BoxGeometry(w - st * 2 + .04, hSkirt, .04); sk.translate(w / 2, st + hSkirt / 2, 0); parts.push(sk);
  const sk2 = new THREE.BoxGeometry(w - st * 2 - .12, hSkirt - .12, .045); sk2.translate(w / 2, st + hSkirt / 2, -.008); parts.push(sk2);
  return mergeGeometries(parts);
}
function doorGroup(nDoors, totalW, h, openSet, kind = 'grid', baseY = 0, flipSet = null) {
  flipSet = flipSet || new Set();
  const g = new THREE.Group();
  const dw = totalW / nDoors;
  const geo = geishaDoor(dw, h, kind);
  const paperGeo = new THREE.BoxGeometry(dw - .14, h * .46 - .02, .008);
  for (let i = 0; i < nDoors; i++) {
    const hingeRight = flipSet.has(i);
    const pivot = new THREE.Group();
    pivot.position.set(-totalW / 2 + (hingeRight ? (i + 1) : i) * dw, baseY, 0); g.add(pivot);
    const off = hingeRight ? -dw / 2 : dw / 2;
    const d = new THREE.Mesh(geo, M.furniture);
    d.position.set(hingeRight ? -dw : 0, 0, 0); d.castShadow = d.receiveShadow = true; pivot.add(d);
    const pp = new THREE.Mesh(paperGeo, M.paper);
    pp.position.set(off, h - .055 - h * .46 / 2, -.038); pivot.add(pp);
    if (openSet.has(i)) { pivot.rotation.y = openSet.get(i); pivot.position.z -= .035; }
  }
  return g;
}
const openMap = (pairs) => { const m = new Map(); for (const [i, a] of pairs) m.set(i, a); return m; };

function inkPainting(w, h, opts = {}) {
  const t = makeTex(512, (c, s) => {
    c.fillStyle = opts.bg || '#e5dfcc'; c.fillRect(0, 0, s, s);
    grain(c, s, .04);
    const W = s, H = s;
    for (const [xBase, yBase, amp, col] of [[.2, .55, .16, 'rgba(70,86,90,.28)'], [.35, .42, .22, 'rgba(60,76,80,.4)'], [.55, .3, .26, 'rgba(45,60,62,.55)']]) {
      c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const y = H * yBase - Math.abs(Math.sin(x * .008 + xBase * 20) * H * amp * .5) - noise2(x * .02 + xBase * 9, 0) * H * amp;
        c.lineTo(x, y);
      }
      c.lineTo(W, H); c.closePath(); c.fill();
    }
    c.fillStyle = 'rgba(38,42,36,.7)'; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) c.lineTo(x, H * .88 - noise2(x * .03, 5) * H * .07 - (x > W * .55 ? (x - W * .55) * .12 : 0));
    c.lineTo(W, H); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(30,30,28,.85)'; c.lineWidth = 3;
    c.strokeRect(W * .62, H * .76, 40, 34);
    c.beginPath(); c.moveTo(W * .62 - 12, H * .76); c.lineTo(W * .62 + 20, H * .7); c.lineTo(W * .62 + 52, H * .76); c.stroke();
    c.strokeStyle = 'rgba(30,32,28,.6)'; c.lineWidth = 2;
    for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(W * .3, H * .86);
      c.quadraticCurveTo(W * .3 + rr(-30, 30), H * .8, W * .3 + rr(-60, 60), H * .66 - rr(0, 50)); c.stroke(); }
    c.fillStyle = 'rgba(40,36,30,.75)'; c.font = '22px "Noto Serif SC", serif';
    c.fillText('烟雨开天色', W * .06, H * .14);
    c.fillText('湖山入卷来', W * .06, H * .14 + 30);
    c.fillStyle = 'rgba(150,50,40,.85)'; c.fillRect(W * .06, H * .14 + 46, 14, 14);
    if (opts.border) { c.strokeStyle = 'rgba(60,50,36,.6)'; c.lineWidth = 10; c.strokeRect(5, 5, W - 10, H - 10); }
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: t, roughness: .92, envMapIntensity: .1 }));
  m.receiveShadow = true; return m;
}
function calligraphyStrip(text, w, h) {
  const t = makeTex(256, (c, s) => {
    c.fillStyle = '#e8e2cf'; c.fillRect(0, 0, s, s); grain(c, s, .05);
    c.fillStyle = '#26221c'; c.textAlign = 'center';
    const chars = text.split('');
    const fs = s / (chars.length + 1.2);
    c.font = `${fs}px "Noto Serif SC", serif`;
    chars.forEach((ch, i) => c.fillText(ch, s / 2, fs * (i + 1.05)));
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: t, roughness: .92, envMapIntensity: .1 }));
}
function namePlate(text) {
  return makeTex(512, (c, s) => {
    c.fillStyle = '#1f1a14'; c.fillRect(0, 0, s, s);
    grain(c, s, .1);
    c.fillStyle = '#c9a45a'; c.textAlign = 'center';
    c.font = `${s * .3}px "Noto Serif SC", serif`;
    c.fillText(text, s / 2, s * .62);
    c.strokeStyle = '#c9a45a'; c.lineWidth = 6; c.strokeRect(10, 10, s - 20, s - 20);
  });
}

function flameSprite(scale = 1) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const c = cv.getContext('2d');
  const gr = c.createRadialGradient(32, 36, 2, 32, 30, 30);
  gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(.3, 'rgba(255,180,80,.9)');
  gr.addColorStop(1, 'rgba(255,120,30,0)');
  c.fillStyle = gr; c.beginPath(); c.ellipse(32, 32, 16, 26, 0, 0, TAU); c.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .15 }));
  sp.userData.base = scale;
  return sp;
}

function leafTexture(kind) {
  return makeTex(256, (c, s) => {
    c.clearRect(0, 0, s, s);
    const base = kind === 'red' ? ['#5e3a28', '#8a4a30', '#a05237', '#6e3f2c', '#7d4530'] :
      kind === 'pine' ? ['#2e4a34', '#38553c', '#28402c', '#33503a'] :
        kind === 'blossom' ? ['#f0d6e0', '#e8c0d2', '#f6e4ea', '#e4b4c8', '#f2dce6'] :
        ['#3c5a30', '#48683a', '#34502c', '#42603a', '#527044'];
    const leaves = kind === 'pine' ? 9 : 7;
    for (let i = 0; i < leaves; i++) {
      const cx = s / 2 + rr(-s * .3, s * .3), cy = s / 2 + rr(-s * .28, s * .28);
      const r = s * rr(.09, .14);
      c.save(); c.translate(cx, cy);
      if (kind === 'pine') {
        for (let k = 0; k < 7; k++) {
          const a = k / 7 * TAU;
          c.strokeStyle = base[i % base.length]; c.lineWidth = 3;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 1.4, Math.sin(a) * r * 1.4); c.stroke();
        }
      } else {
        c.rotate(srand() * TAU);
        c.fillStyle = base[i % base.length];
        c.beginPath(); c.ellipse(0, 0, r, r * rr(.5, .75), 0, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(-r, 0); c.lineTo(r, 0); c.stroke();
      }
      c.restore();
    }
  });
}

{

    if (!pointInPool(px, pz)) { px = p.x; pz = p.z; }

/* --- 荷花 --- */
{
  const parts = [];
  const rings = [[8, .105, .32, -.62, .085], [7, .085, .26, -.38, .06], [5, .062, .2, -.16, .04]];
  for (const [n, w, len, tilt, bend] of rings) {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + (n === 7 ? .3 : 0);
      const p = new THREE.PlaneGeometry(w, len, 2, 4);
      const pp = p.attributes.position;
      for (let k = 0; k < pp.count; k++) {
        const y = pp.getY(k) / len + .5;
        pp.setZ(k, Math.pow(y, 1.8) * bend);
      }
      p.translate(0, len / 2, 0);
      p.rotateX(tilt);
      p.rotateY(a);
      parts.push(p);
    }
  }
  const stem = new THREE.CylinderGeometry(.009, .012, .2, 5); stem.translate(0, -.1, 0); parts.push(stem);
  const flowerGeo = mergeGeometries(parts);
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xe9a8bd, roughness: .58, side: THREE.DoubleSide,
    emissive: 0x35121e, emissiveIntensity: .14 });
  const im = inst(flowerGeo, petalMat, 16, world);
  const coreGeo = new THREE.SphereGeometry(.035, 8, 6); coreGeo.scale(1, .6, 1);
  const coreIm = inst(coreGeo, new THREE.MeshStandardMaterial({ color: 0xd9c86a, roughness: .7 }), 16, world);
  const col = new THREE.Color(); let n = 0, guard = 0;
  while (n < 16 && guard++ < 500) {
    const px = rr(-2.2, 4.8), pz = rr(3.4, 9.8);
    if (!pointInPool(px, pz)) continue;
    if (Math.hypot(px - 4.6, pz - 2.6) < 2.6) continue;
    const sc = rr(.8, 1.3), ry = srand() * TAU;
    setI(im, n, px, -.02, pz, 0, ry, 0, sc);
    setI(coreIm, n, px, .1 * sc - .02, pz, 0, ry, 0, sc);
    im.setColorAt(n, col.setHSL(rr(.92, .97), rr(.3, .5), rr(.72, .86))); n++;
  }
  im.count = n; coreIm.count = n; im.instanceColor.needsUpdate = true;
}

const fp = { active: false, yaw: 0, pitch: 0, pos: new THREE.Vector3(), keys: {}, eyeY: 1.62, locked: false };
function onStep(x, z) {
  for (const s of STEPS) if (Math.hypot(x - s.x, z - s.z) < s.r) return s;
  return null;
}
function groundHeight(x, z) {
  const st = onStep(x, z); if (st) return st.y;
  if (x > 2.4 && x < 6.8 && z > 0.8 && z < 4.5) return .6;
  if (x > 3.4 && x < 5.4 && z > -0.1 && z < 0.8) return .3;
