/* ============================================================
   9.  SKY LIFE  —  clouds, gulls, whale, fish, buoys, crab
   ============================================================ */

// ------------------------------------------------------------
//  clouds  (shader-driven drift, mode 1)
// ------------------------------------------------------------
const CLOUDS = [
  { x: -2.55, y: 3.48, z:  0.30, r: 0.78, h: 0.26, seed: 11, spd: 0.055, ph: 0.0 },
  { x:  1.15, y: 3.74, z: -0.42, r: 0.92, h: 0.28, seed: 23, spd: 0.041, ph: 1.9 },
  { x:  3.25, y: 3.40, z:  0.70, r: 0.62, h: 0.22, seed: 37, spd: 0.068, ph: 3.4 },
  { x: -4.30, y: 3.34, z: -0.80, r: 0.68, h: 0.23, seed: 41, spd: 0.050, ph: 5.1 },
  { x:  0.05, y: 4.06, z:  0.55, r: 0.55, h: 0.18, seed: 53, spd: 0.077, ph: 2.4 },
  { x: -0.65, y: 3.30, z: -0.20, r: 0.72, h: 0.23, seed: 61, spd: 0.061, ph: 4.3 },
];

function buildClouds() {
  const g = new VoxelGrid(0.082);
  const V = g.vox;
  const WHITE = [0xffffff, 0xf6f8ff, 0xe9eef8];
  const GREY  = [0xcfd6e4, 0xb9c2d4, 0xdde3ef];
  const WARM  = [0xffe4c4, 0xffd3a8, 0xf7c79a];
  for (const c of CLOUDS) {
    const N = Math.ceil(c.r / V) + 1;
    const NH = Math.ceil(c.h / V) + 1;
    for (let i = -N; i <= N; i++) for (let j = -NH; j <= NH; j++) for (let k = -N; k <= N; k++) {
      const dx = i / N, dz = k / N, dy = j / NH;
      const d = Math.sqrt(dx * dx + dz * dz * 1.25 + dy * dy * 1.9);
      const n = fbm3(i * 0.16 + c.seed * 7, j * 0.30, k * 0.16, 4, c.seed);
      const th = 1.05 - d + (n - 0.5) * 0.95;
      if (th < 0.0) continue;
      // fluffy edges fade
      let col;
      if (dy > 0.30) col = WHITE[Math.floor(hash3(i, j, k, c.seed) * WHITE.length)];
      else if (dy < -0.35) col = GREY[Math.floor(hash3(i, j, k, c.seed + 5) * GREY.length)];
      else col = (hash3(i, j, k, c.seed + 9) > 0.62)
        ? WARM[Math.floor(hash3(i, j, k, c.seed + 3) * WARM.length)]
        : WHITE[Math.floor(hash3(i, j, k, c.seed + 1) * WHITE.length)];
      const dens = sat(th * 1.6);
      g.set(Math.round(c.x / V) + i, Math.round(c.y / V) + j, Math.round(c.z / V) + k, col,
        { j: 0.05, rou: 0.98, seed: c.seed,
          emi: 0x8090b0, emiS: 0.05 + dens * 0.10,
          anim: [c.ph, c.spd, 0, 0] });
    }
  }
  return g;
}

// ------------------------------------------------------------
//  seagulls  (one InstancedMesh per bird, wings flap in the shader)
// ------------------------------------------------------------
function buildGullVoxels(g, phase, seed) {
  const V = g.vox;
  const BODY = [0xfbfbf7, 0xeef0ee, 0xe2e6ea];
  const WING = [0xf2f4f4, 0xdde3e8, 0xc4ced8];
  const TIP  = [0x2c3238, 0x3a4046];
  const BEAK = 0xe8a12c, FOOT = 0xdc8a3a;

  // ---- body ----
  g.ellipsoid(0, 0, 0, 5.0, 2.6, 2.6, 0xfbfbf7, { j: 0.05, rou: 0.92, seed });
  g.ellipsoid(-4.4, 0.4, 0, 2.6, 1.9, 1.9, 0xe6eaee, { j: 0.05, rou: 0.92, seed: seed + 1 });
  // tail fan
  for (let i = 0; i < 8; i++) {
    const t = i / 7 - 0.5;
    for (let q = 0; q < 6; q++) {
      g.set(-6 - q, Math.round(t * q * 0.42), Math.round(t * (3 + q * 0.7)),
        q > 3 ? 0xbac4ce : 0xeef2f6, { j: 0.05, rou: 0.93, seed });
    }
  }
  // ---- head + neck ----
  g.ellipsoid(5.2, 1.7, 0, 3.0, 2.5, 2.5, 0xffffff, { j: 0.04, rou: 0.9, seed });
  g.ellipsoid(4.0, 1.2, 0, 2.6, 2.2, 2.2, 0xf4f6f8, { j: 0.04, rou: 0.9, seed });
  // beak
  for (let q = 0; q < 4; q++) g.set(7 + q, 1 + Math.round(q * 0.12), 0, q > 2 ? 0xc9821c : BEAK, { j: 0.05, rou: 0.6, seed });
  g.set(11, 1, 0, 0xb8751a, { j: 0.04, rou: 0.6, seed });
  // eye
  g.set(5, 3, 2, 0x22262c, { j: 0.03, rou: 0.3, seed });
  g.set(5, 3, -2, 0x22262c, { j: 0.03, rou: 0.3, seed });

  // ---- wings (anim: [side, span, phase, 0]) ----
  for (const side of [-1, 1]) {
    const SEG = 22;
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const zz = side * (2.0 + t * 15.0);
      const xx = 1.6 - t * 5.4 + Math.pow(t, 2.4) * 1.6;
      const yy = t * 1.5 - t * t * 0.5;
      const wid = 3.0 - t * 1.7;
      const dark = t > 0.78;
      for (let w = 0; w < widthSteps(wid); w++) {
        const off = w - (widthSteps(wid) - 1) / 2;
        const col = dark ? TIP[0] : (t > 0.5 ? WING[1] : WING[0]);
        g.set(Math.round(xx + off * 0.9), Math.round(yy), Math.round(zz),
          col, { j: 0.05, rou: 0.93, seed, anim: [side, t, phase, 0] });
        if (Math.abs(off) < 1) g.set(Math.round(xx + off * 0.9), Math.round(yy) - 1, Math.round(zz),
          dark ? 0x1e2429 : 0xd4dae0, { j: 0.05, rou: 0.94, seed, anim: [side, t, phase, 0] });
      }
    }
    // shoulder coverts
    for (let q = 0; q < 5; q++)
      g.set(Math.round(1.0 - q * 0.2), Math.round(0.3 + q * 0.15), Math.round(side * (2.5 + q * 1.1)),
        0xe8eef4, { j: 0.05, rou: 0.92, seed, anim: [side, q / 6, phase, 0] });
  }
  // tucked feet
  for (const side of [-1, 1]) for (let q = 0; q < 3; q++)
    g.set(-2 - q, -3, Math.round(side * (1 + q * 0.35)), FOOT, { j: 0.05, rou: 0.8, seed });
  return g;
}
function widthSteps(w) { return Math.max(1, Math.round(w)); }

// ------------------------------------------------------------
//  humpback whale  (mode 7 = tail sway)
// ------------------------------------------------------------
function buildWhaleVoxels(g) {
  const V = g.vox;
  const DARK = [0x2f3d4a, 0x27333f, 0x384856, 0x1e2833];
  const LITE = [0xa9b6be, 0xbcc7cd, 0x93a2ac];
  const N = 34;
  for (let i = -N; i <= N; i++) {
    const t = (i + N) / (2 * N);                 // 0 = tail, 1 = nose
    const bodyR = Math.sin(Math.pow(t, 0.55) * PI * 0.98 + 0.04) * 8.4;
    if (bodyR < 0.6) continue;
    const yOff = Math.sin(t * PI) * 1.2 - 0.5;
    const steps = Math.ceil(bodyR);
    for (let a = -steps; a <= steps; a++) for (let b = -steps; b <= steps; b++) {
      const d = Math.hypot(a, b * 1.16) / bodyR;
      if (d > 1) continue;
      const shell = d > 0.72;
      if (!shell && Math.abs(i) > 4) continue;
      const belly = (b > bodyR * 0.28);
      let col = belly ? LITE[Math.floor(hash3(i, a, b, 3) * 3)] : DARK[Math.floor(hash3(i, a, b, 5) * 4)];
      if (t > 0.86 && b < 0) col = LITE[1];
      const kn = fbm3(i * 0.35, a * 0.35, b * 0.35, 2, 71);
      if (kn > 0.70) col = 0x46596a;
      g.set(i, Math.round(yOff + a), b, col, { j: 0.08, rou: 0.72, met: 0.06, seed: 61,
        anim: [0, 0, 0, sat(1 - t)] });
    }
  }
  // dorsal fin
  for (let q = 0; q < 6; q++) for (let w = -1; w <= 1; w++)
    g.set(2 + q * 0.9, Math.round(5.4 + q * 1.1), w, DARK[0], { j: 0.07, rou: 0.7, seed: 63, anim: [0,0,0,0.2] });
  // pectoral fins
  for (const side of [-1, 1]) {
    for (let q = 0; q < 10; q++) {
      const t = q / 9;
      const xx = -1.5 - t * 8.0;
      const yy = -2.6 - t * 2.2;
      const zz = side * (5.5 + t * 6.5);
      for (let w = -1; w <= 1; w++)
        g.set(Math.round(xx), Math.round(yy), Math.round(zz) + w * side,
          w === 0 ? DARK[1] : LITE[2], { j: 0.07, rou: 0.72, seed: 65, anim: [0, 0, 0, 0.3] });
    }
  }
  // tail flukes
  for (const side of [-1, 1]) {
    for (let q = 0; q <= 9; q++) {
      const t = q / 9;
      const xx = -N - 1 - t * 6.0;
      const zz = side * (t * 10.5);
      const yy = -t * 0.6;
      for (let w = -1; w <= 1; w++)
        g.set(Math.round(xx - t * 1.5), Math.round(yy), Math.round(zz),
          t > 0.6 ? DARK[3] : DARK[0], { j: 0.07, rou: 0.72, seed: 67, anim: [0, 0, 0, 0.02] });
    }
  }
  // ventral pleats
  for (let i = 4; i < 22; i++) for (let w = -5; w <= 5; w++)
    g.set(i, Math.round(-4.2 + Math.sin(i * 0.2) * 0.8), w, LITE[0], { j: 0.06, rou: 0.75, seed: 69, anim: [0,0,0,0.01] });
  // blowhole
  g.set(N - 6, 8, 0, 0x1a222a, { j: 0.04, rou: 0.6, seed: 71, anim: [0,0,0,0.5] });
  return g;
}

// ------------------------------------------------------------
//  schooling fish  (mode 2)
// ------------------------------------------------------------
const SCHOOLS = [
  { x: -3.4, y: -1.65, z:  1.10, n: 34, seed: 101, col: 0x7fd4e8, r: 0.85 },
  { x:  0.60, y: -2.35, z: -1.90, n: 30, seed: 202, col: 0xf2c14e, r: 0.70 },
  { x: -6.60, y: -2.05, z: -1.35, n: 26, seed: 303, col: 0xe8798f, r: 0.78 },
  { x:  6.10, y: -1.20, z:  1.55, n: 24, seed: 404, col: 0x8ce0a8, r: 0.62 },
];

function buildFishSchool() {
  const g = new VoxelGrid(0.034);
  const V = g.vox;
  for (const S of SCHOOLS) {
    for (let i = 0; i < S.n; i++) {
      const a = hash1(i * 7 + S.seed) * TAU;
      const rr = hash1(i * 13 + S.seed) * 1.4;
      const px = S.x + Math.cos(a) * rr * 0.9;
      const pz = S.z + Math.sin(a) * rr * 0.55;
      const py = S.y + (hash1(i * 17 + S.seed) - 0.5) * 1.1;
      const ph = a;
      const up = 0.3 + hash1(i * 19 + S.seed) * 0.7;
      const dark = 0.55 + hash1(i * 23 + S.seed) * 0.5;
      const col = new THREE.Color(S.col).multiplyScalar(dark);
      const cx = Math.round(px / V), cy = Math.round(py / V), cz = Math.round(pz / V);
      const anim = [ph, up, hash1(i * 29 + S.seed), 0];
      // body
      const N = 5;
      for (let q = -N; q <= N; q++) {
        const t = (q + N) / (2 * N);
        const r = Math.sin(Math.pow(t, 0.7) * PI) * 1.8;
        if (r < 0.4) continue;
        const steps = Math.ceil(r);
        for (let b = -steps; b <= steps; b++) for (let c = -steps; c <= steps; c++) {
          if (b * b + c * c > r * r + 0.5) continue;
          const c2 = (b > 0) ? col.clone().lerp(new THREE.Color(0xffffff), 0.35) : col;
          g.set(cx + q, cy + b, cz + c, c2.getHex(), { j: 0.07, rou: 0.42, met: 0.15, seed: i, anim });
        }
      }
      // tail
      for (let q = 1; q <= 4; q++)
        g.set(cx - N - q, cy + (q > 2 ? 1 : 0), cz, col.getHex(), { j: 0.06, rou: 0.5, seed: i, anim });
      // eye
      g.set(cx + N - 1, cy + 1, cz + 1, 0x101418, { j: 0.03, rou: 0.2, seed: i, anim });
      g.set(cx + N - 1, cy + 1, cz - 1, 0x101418, { j: 0.03, rou: 0.2, seed: i, anim });
    }
  }
  return g;
}

// ------------------------------------------------------------
//  buoys + crab  (CPU-animated small props)
// ------------------------------------------------------------
function buildBuoyVoxels(g, seed) {
  const V = g.vox;
  const RED = [0xd4453a, 0xba3329, 0xe05b4a], WHT = [0xf2efe6, 0xdedacf];
  const rings = 9;
  for (let k = -rings; k <= rings; k++) {
    const t = k / rings;
    const r = 3.2 * Math.cos(t * 1.25);
    if (r < 0.6) continue;
    const n = Math.ceil(r);
    const band = (Math.abs(Math.round(t * 4)) % 2 === 0);
    for (let a = -n; a <= n; a++) for (let b = -n; b <= n; b++) {
      if (a * a + b * b > r * r + 0.6) continue;
      if (a * a + b * b < (r - 1.4) * (r - 1.4)) continue;
      const col = band ? RED[Math.floor(hash3(k, a, b, seed) * 3)] : WHT[Math.floor(hash3(k, a, b, seed + 2) * 2)];
      g.set(a, k, b, col, { j: 0.07, rou: 0.7, seed });
    }
  }
  for (let k = rings + 1; k <= rings + 3; k++)
    g.set(0, k, 0, 0x554b3c, { j: 0.06, rou: 0.9, seed });
  g.set(0, rings + 4, 0, 0xffcf70, { j: 0.03, rou: 0.3, emi: 0xffb04a, emiS: 1.7 });
  // mooring ring + line tail
  for (let a = 0; a < 16; a++) {
    const t = a / 16 * TAU;
    g.set(Math.round(Math.cos(t) * 2.4), -rings - 1, Math.round(Math.sin(t) * 2.4), 0x8a7a5a, { j: 0.06, met: 0.6, rou: 0.5, seed });
  }
  return g;
}

function buildCrabVoxels(g, seed) {
  const V = g.vox;
  const SHELL = 0xd0563c, SHELL2 = 0xb8422c, CLAW = 0xe07a52, LEG = 0xa83a26;
  g.ellipsoid(0, 0, 0, 5, 2.6, 4, SHELL, { j: 0.08, rou: 0.55, met: 0.1, seed });
  g.ellipsoid(1, 1.4, 0, 4, 1.6, 3.2, SHELL2, { j: 0.08, rou: 0.55, seed });
  // eyes
  for (const s of [-1, 1]) {
    g.set(5, 2, s * 1.6, 0x1a1210, { j: 0.03, rou: 0.4, seed });
    g.set(5, 3, s * 1.6, 0x1a1210, { j: 0.03, rou: 0.4, seed });
  }
  // claws
  for (const s of [-1, 1]) {
    for (let q = 0; q < 4; q++) g.set(5 + q, 1, Math.round(s * (2.5 + q * 0.5)), CLAW, { j: 0.07, rou: 0.5, seed });
    for (let q = 0; q < 5; q++) {
      g.set(8 + q, 1 + Math.round(q * 0.2), Math.round(s * (4.5 + q * 0.7)), s > 0 ? SHELL : SHELL2, { j: 0.07, rou: 0.5, seed });
      g.set(8 + q, 2 + Math.round(q * 0.2), Math.round(s * (4.5 + q * 0.7)), 0xc44a30, { j: 0.07, rou: 0.5, seed });
    }
    g.set(13, 2, Math.round(s * 8), 0xf0a080, { j: 0.05, rou: 0.45, seed });
  }
  // legs
  for (const s of [-1, 1]) for (let q = 0; q < 4; q++) {
    const bx = 2 - q * 2.5;
    for (let k = 0; k < 3; k++)
      g.set(bx - k, -1 - Math.round(k * 0.5), Math.round(s * (3 + q * 0.4 + k * 0.8)), LEG, { j: 0.07, rou: 0.6, seed });
  }
  return g;
}

// ------------------------------------------------------------
//  spray / foam particle system (voxel-ish instanced cubes)
// ------------------------------------------------------------
class SpraySystem {
  constructor(max, vox) {
    this.max = max;
    this.vox = vox;
    this.pos = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.life = new Float32Array(max);
    this.ttl = new Float32Array(max);
    this.size = new Float32Array(max);
    this.head = 0;
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.35, metalness: 0.0,
      transparent: true, depthWrite: false, flatShading: true,
      emissive: 0x9fc8dd, emissiveIntensity: 0.25,
    });
    this.mesh = new THREE.InstancedMesh(geo, mat, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 14;
    this.mesh.count = max;
    const m = new THREE.Matrix4();
    m.makeScale(0, 0, 0);
    for (let i = 0; i < max; i++) this.mesh.setMatrixAt(i, m);
    this.mesh.instanceMatrix.needsUpdate = true;
    this._m = new THREE.Matrix4();
    this._q = new THREE.Quaternion();
    this._s = new THREE.Vector3();
    this._p = new THREE.Vector3();
  }
  emit(x, y, z, vx, vy, vz, size, ttl) {
    const i = this.head;
    this.head = (this.head + 1) % this.max;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
    this.life[i] = ttl; this.ttl[i] = ttl; this.size[i] = size;
  }
  update(dt, gravity, level) {
    const m = this._m, s = this._s, p = this._p;
    for (let i = 0; i < this.max; i++) {
      if (this.life[i] <= 0) {
        s.set(0, 0, 0); p.set(0, -999, 0);
        m.compose(p, this._q.identity(), s);
        this.mesh.setMatrixAt(i, m);
        continue;
      }
      this.life[i] -= dt;
      const t = sat(this.life[i] / this.ttl[i]);
      this.vel[i * 3 + 1] -= gravity * dt;
      this.vel[i * 3] *= (1 - 1.2 * dt);
      this.vel[i * 3 + 2] *= (1 - 1.2 * dt);
      this.pos[i * 3] += this.vel[i * 3] * dt;
      this.pos[i * 3 + 1] += this.vel[i * 3 + 1] * dt;
      this.pos[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
      // clip to the bottle
      const R = bottleInnerRadius(this.pos[i * 3]) - this.size[i];
      const rr = Math.hypot(this.pos[i * 3 + 1], this.pos[i * 3 + 2]);
      if (rr > R) { this.life[i] = 0; }
      if (this.pos[i * 3 + 1] < level - 0.02 && this.vel[i * 3 + 1] < 0) {
        const k = 0.10;
        this.pos[i * 3 + 1] = level + 0.005;
        this.vel[i * 3 + 1] *= -0.28;
        this.vel[i * 3] *= 0.55; this.vel[i * 3 + 2] *= 0.55;
        if (Math.abs(this.vel[i * 3 + 1]) < 0.12) this.life[i] = Math.min(this.life[i], 0.12);
      }
      const sz = this.size[i] * (0.35 + 0.75 * Math.pow(t, 0.35));
      s.set(sz, sz, sz);
      p.set(this.pos[i * 3], this.pos[i * 3 + 1], this.pos[i * 3 + 2]);
      m.compose(p, this._q, s);
      this.mesh.setMatrixAt(i, m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

/* ==================== 10-desk.js ==================== */
/* ============================================================
   10.  THE WRITING DESK  —  table top, cradle, books, spyglass, lamp
   ============================================================ */

const DESK = {
  y   : -5.62,          // top surface
  w   : 22.8,
  d   : 10.4,
  cx  : 1.90,
  thick: 0.62,
  cradle: { x: [-5.55, 5.55], h: 1.00, w: 1.35 },
};

const PAL_MAHOG = [0x4b2d1a, 0x583722, 0x3b2312, 0x66402a, 0x33200f];
const PAL_MAHOG2 = [0x6e442a, 0x7c5232, 0x5f3a22];
const PAL_BRASS = [0xc9a24a, 0xb8912f, 0xd9b761, 0x9f7d28, 0xe0c479];

function woodColor(wx, wy, wz, seed) {
  const g1 = fbm3(wx * 0.20, wy * 11.0, wz * 0.95, 4, seed);
  const g2 = fbm3(wx * 1.10, wy * 34.0, wz * 3.10, 2, seed + 7);
  const t = sat(g1 * 0.70 + g2 * 0.30);
  if (t > 0.62) return PAL_MAHOG2[Math.floor(hash3(wx * 9, wy * 9, wz * 9, seed) * PAL_MAHOG2.length)];
  return PAL_MAHOG[Math.floor(hash3(wx * 9, wy * 9, wz * 9, seed + 3) * PAL_MAHOG.length)];
}

// ------------------------------------------------------------
//  table top + wooden cradle
// ------------------------------------------------------------
function buildDeskVoxels(g) {
  const V = g.vox;
  const x0 = DESK.cx - DESK.w * 0.5, x1 = DESK.cx + DESK.w * 0.5;
  const z0 = -DESK.d * 0.5, z1 = DESK.d * 0.5;
  const i0 = Math.round(x0 / V), i1 = Math.round(x1 / V);
  const j0 = Math.round(z0 / V), j1 = Math.round(z1 / V);
  const kTop = Math.round(DESK.y / V);
  const kBot = kTop - Math.round(DESK.thick / V);

  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const wx = i * V, wz = j * V;
    const edge = (i === i0 || i === i1 || j === j0 || j === j1);
    g.set(i, kTop, j, woodColor(wx, kTop * V, wz, 3), { j: 0.06, rou: 0.58, seed: 3 });
    if (edge) {
      for (let k = kTop - 1; k >= kBot; k--) {
        const dark = (k === kBot);
        g.set(i, k, j, dark ? 0x24140c : woodColor(wx, k * V, wz, 5), { j: 0.07, rou: 0.78, seed: 5 });
      }
    }
  }

  // ---- carved rope moulding under the top ----
  for (let j = j0 + 1; j <= j1 - 1; j++) for (let i = i0 + 1; i <= i1 - 1; i++) {
    if (i % 3 === 0) g.set(i, kBot - 1, j, 0x35200f, { j: 0.06, rou: 0.85 });
  }

  // ---- cradle: two saddles + a spine + nameplate ----
  const C = DESK.cradle;
  const kBase = kTop + 1;
  const kTopCradle = Math.round((-BOT.r) / V);            // where the bottle rests
  // base plate
  for (let i = Math.round(C.x[0] * 0.82 / V); i <= Math.round(C.x[1] * 0.82 / V); i++) {
    for (let j = -Math.round(C.w * 0.62 / V); j <= Math.round(C.w * 0.62 / V); j++) {
      const n = Math.max(Math.abs(i - 0), Math.abs(j)); 
      const onEdge = (Math.abs(i) === Math.round(C.x[1] * 0.82 / V)) || (Math.abs(j) === Math.round(C.w * 0.62 / V));
      g.set(i, kBase, j, woodColor(i * V, kBase * V, j * V, 11), { j: 0.07, rou: 0.74, seed: 11 });
      if (onEdge) for (let k = kBase - 1; k >= kBase - 3; k--)

      for (let k = k0; k <= k1; k++) {
        const onY = (k === k0 || k === k1), corner = onX && onZ;
        if (!onX && !onZ && !onY) continue;
        const plank = (k % 3 === 0);
        let hex = corner ? 0x3a2414 : (plank ? 0x54371f : 0x6a4526);
        if (onY && !corner) hex = plank ? 0x4a2f1a : 0x5c3c22;
        raw(i, k, j, hex, O_WOOD);
      }
    }
    for (const s2 of [-1, 1]) {
      const hx = cx + s2 * (hw + 0.07);
      for (let q = 0; q <= 16; q++) {
        const aa = -PI * 0.5 + (q / 16) * PI;
        put(hx + s2 * 0.18 * Math.cos(aa), GY + 0.48 + 0.18 * Math.sin(aa), cz, 0x9a7a4a, O_ROPE);
      }
    }
    glint(cx + hw + 0.16, GY + 0.66, cz, 0xffc060, 0.08);
  }

  // ====================  clay jug  ====================
  {
    const cx = 11.40, cz = 1.45;
    const JT = [[0, 0.17], [0.18, 0.31], [0.42, 0.355], [0.66, 0.325], [0.84, 0.235], [0.94, 0.155], [1, 0.17]];
    const jr = (t) => {
      t = clamp(t, 0, 1);
      for (let q = 0; q < JT.length - 1; q++)
        if (t <= JT[q + 1][0]) return lerp(JT[q][1], JT[q + 1][1], (t - JT[q][0]) / (JT[q + 1][0] - JT[q][0]));
      return JT[JT.length - 1][1];
    };
    vcyl(cx, GY, GY + 0.64, cz, (y) => jr((y - GY) / 0.64),
      (k, a, b, d, an, r) => (d > r - V * 1.5 ? (k === R(GY + 0.64) ? 0x6a462a : 0xa86e46) : null), O_CLAY, 0);
    for (let q = 0; q <= 24; q++) {
      const aa = -PI * 0.42 + (q / 24) * PI * 0.84;
      for (const dz2 of [0, V, -V])
        put(cx - 0.30 - Math.cos(aa) * 0.075, GY + 0.36 + Math.sin(aa) * 0.20, cz + dz2, 0x9a6440, O_CLAY);
    }
    glint(cx + 0.16, GY + 0.58, cz + 0.20, 0xffd08a, 0.10);
  }

  // ====================  loose parchment, a rolled tube, an old ink pot  ====================
  plainSheet(0.30, -3.20, 0.92, 0.72,  0.16, 0.008, 101);
  plainSheet(0.36, -3.14, 0.88, 0.68, -0.22, 0.017, 103);
  plainSheet(0.24, -3.24, 0.84, 0.66,  0.05, 0.026, 105);
  {
    const cx = 9.95, cz = -4.40, ang = -0.62, len = 0.95, r = 0.095;
    const dx = Math.cos(ang), dz = Math.sin(ang);
    tube(cx, GY + r, cz, dx, 0, dz, -len, len, r + 0.03, V * 1.1, () => r,
      (t, d, rr, an) => (d > rr - V * 1.25 ? 0xdccda6 : 0xc9b892), O_PARCH);
    tube(cx, GY + r, cz, dx, 0, dz, -0.055, 0.055, r + 0.05, 0, () => r + 0.045, () => 0x9e2b28, O_ROPE);
  }
  {
    const cx = 4.95, cz = -3.60;
    vcyl(cx, GY, GY + 0.13, cz, (y) => lerp(0.145, 0.12, (y - GY) / 0.13),
      (k, a, b, d, an, r) => (d > r - V * 1.4 ? 0x2a2a30 : (k === R(GY + 0.13) ? 0x100c12 : null)),
      { j: 0.05, met: 0.16, rou: 0.18, seed: 75 }, 0);
    ringY(cx, GY + 0.14, cz, 0.138, 0.028, 0, () => 0xb8912f, O_BRASS);
    glint(cx + 0.10, GY + 0.15, cz + 0.07, 0xffc060, 0.12);
  }

  // ====================  shells, sea-glass and sand dollars  ====================
  function scallop(cx, cz, s, seed) {
    for (let q = 0; q < 96; q++) {
      const t = q / 95;
      const aa = -PI * 0.55 + t * PI * 1.10;
      const rr = 0.17 * s * (0.55 + 0.45 * Math.sin(t * PI));
      const px = cx + Math.cos(aa) * rr, pz = cz + Math.sin(aa) * rr * 0.9;
      const c = (q % 4 === 0) ? 0xe0c0b4 : ((q % 4 === 2) ? 0xf4e2d8 : 0xecd2c6);
      raw(R(px), R(GY + 0.025 + Math.sin(t * PI) * 0.02), R(pz), c,
        { j: 0.07, rou: 0.52, met: 0.06, seed: seed });
    }
  }
  function sandDollar(cx, cz, s, seed) {
    disc(cx, GY + 0.02, cz, 0, 0.17 * s, (a, b, d, an) => {
      const rn = d / (0.17 * s);
      if (rn > 0.94) return 0xd0bd9c;
      for (let q = 0; q < 5; q++)
        if (Math.abs(Math.sin(an - q * TAU / 5 - 0.3)) * rn < 0.055 && rn < 0.72) return 0xc8b490;
      return 0xe8dcc0;
    }, { j: 0.06, rou: 0.72, seed: seed });
  }
  function seaGlass(cx, cz, s, seed) {
    if (!free(cx, GY + 0.02, cz)) return;
    const cols = [0x7fc4b0, 0x9fd8c8, 0xbfd8e8, 0xc8e0d0];
    g.ellipsoid(R(cx), R(GY + 0.02), R(cz), 0.11 * s / V, 0.055 / V, 0.09 * s / V,
      cols[Math.floor(hash1(seed) * 4)], { j: 0.09, rou: 0.22, met: 0.12, seed: seed });
  }
  scallop(11.90, 4.46, 1.00, 201);
  scallop(12.26, 4.16, 0.78, 203);
  scallop(-6.62, -2.62, 0.85, 205);
  sandDollar(11.52, 4.74, 1.00, 207);
  sandDollar(3.90, 4.62, 0.90, 209);
  sandDollar(4.28, 4.34, 0.72, 211);
  seaGlass(12.06, 4.68, 1.00, 213);
  seaGlass(3.62, 4.80, 0.90, 215);
  seaGlass(9.30, 4.96, 0.85, 217);
  seaGlass(12.18, -0.30, 0.95, 219);
  for (let i = 0; i < 26; i++) {
    const a = hash1(i * 31 + 3) * TAU;
    const rr = 3.2 + hash1(i * 17 + 5) * 6.5;
    const x = 2.2 + Math.cos(a) * rr;
    const z = Math.sin(a) * rr * 0.55 + (hash1(i * 7) - 0.5) * 1.6;
    if (x < -8.2 || x > 12.1 || Math.abs(z) > 4.9) continue;
    if (Math.abs(x) < 5.95 && Math.abs(z) < 1.55) continue;
    if (!free(x, GY + 0.02, z)) continue;
    seedProp(g, x, GY + 0.02, z, i);
  }

  return { lampPos };
}

function seedProp(g, x, y, z, i) {
  const V = g.vox;
  const k = Math.floor(hash1(i * 53 + 11) * 5);
  const col = [
    [0xf2e6d2, 0xe0d0b6, 0xfff2e0],
    [0xf0c8c0, 0xe0aa9e, 0xffdcd4],
    [0xcfe0d8, 0xb8cdc4, 0xe6f0ea],
    [0xd8c0e0, 0xc0a8cc, 0xe8d8f0],
    [0xe8d0a0, 0xd0b482, 0xf4e0bc],
  ][k];
  const n = 2 + Math.floor(hash1(i * 13) * 4);
  for (let q = 0; q < n; q++) {
    const a = hash1(i * 29 + q) * TAU;
    const rr = hash1(i * 37 + q) * 0.12;
    g.ellipsoid(Math.round((x + Math.cos(a) * rr) / V), Math.round(y / V), Math.round((z + Math.sin(a) * rr) / V),
      0.055 / V, 0.035 / V, 0.055 / V, col[q % 3], { j: 0.08, rou: 0.42, met: q === 2 ? 0.3 : 0.1, seed: i });
  }
}

const _tmpCol = new THREE.Color();

function applySkyKey(t) {
  let i = 0;
  while (i < SKY_KEYS.length - 2 && t > SKY_KEYS[i + 1].t) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
  const k = smootherstep(a.t, b.t, t);

  Sky.top.setHex(a.top).lerp(_tmpCol.setHex(b.top), k);
  Sky.horizon.setHex(a.hor).lerp(_tmpCol.setHex(b.hor), k);
  Sky.ground.setHex(a.bot).lerp(_tmpCol.setHex(b.bot), k);
  Sky.sunTint.setHex(a.tint).lerp(_tmpCol.setHex(b.tint), k);

  const sunI = lerp(a.sun, b.sun, k);
  const ambI = lerp(a.amb, b.amb, k);
  const exp  = lerp(a.exp, b.exp, k);

  // sun / moon direction
  const ang = (t - 0.25) * TAU;
  Sky.sunDir.set(Math.cos(ang) * 0.86, Math.sin(ang), 0.40).normalize();
  Sky.moonDir.copy(Sky.sunDir).multiplyScalar(-1);

  // how "night" it is (used for stars, lamps, bloom)
  const elev = Sky.sunDir.y;
  Sky.night = sat(1 - smoothstep(-0.22, 0.16, elev));
  Sky.sunI  = sunI * sat(smoothstep(-0.16, 0.05, elev) * 0.55 + 0.45);
  Sky.exposure = exp;
  return { sunI, ambI, exp };
}

//  room backdrop  —  a warm panelled study seen from inside
// ------------------------------------------------------------
const ROOM = {
  cx: 0, cy: 11.6, cz: -5,
  hx: 45, hy: 18.4, hz: 45,
  win: [7.0, 24.0, 0.4, 16.2],       // window aperture, world x0,x1,y0,y1
};

function buildRoomBackdrop() {
  const u = Object.assign(skyUniforms(), {
    uHalf  : { value: new THREE.Vector3(ROOM.hx, ROOM.hy, ROOM.hz) },
    uOrigin: { value: new THREE.Vector3(ROOM.cx, ROOM.cy, ROOM.cz) },
    uWin   : { value: new THREE.Vector4(ROOM.win[0], ROOM.win[1], ROOM.win[2], ROOM.win[3]) },
  });
  const mat = new THREE.ShaderMaterial({
    uniforms: u, side: THREE.BackSide, depthWrite: false, depthTest: true,
    vertexShader: /* glsl */`
      varying vec3 vP; varying vec3 vW;
      void main(){
        vP = position;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      ${GLSL_SKY}
      uniform vec3 uHalf, uOrigin;
      uniform vec4 uWin;
      varying vec3 vP; varying vec3 vW;

      float rh(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
      float rn(vec2 p){
        vec2 i = floor(p), f = fract(p); vec2 k = f * f * (3.0 - 2.0 * f);
        return mix(mix(rh(i), rh(i + vec2(1.0, 0.0)), k.x), mix(rh(i + vec2(0.0, 1.0)), rh(i + vec2(1.0, 1.0)), k.x), k.y);
      }
      float rfbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * rn(p); p *= 2.05; a *= 0.5; } return s; }

      vec3 timber(vec2 uv, vec3 base, float rows, float seed){
        float g = rfbm(uv * 0.34 + seed);
        float grain = rfbm(vec2(uv.x * 5.0, uv.y * 0.35) + seed * 3.0);
        vec3 c = base * (0.66 + 0.62 * g) * (0.88 + 0.28 * grain);
        float s = fract(uv.y * rows);
        c *= 1.0 - 0.20 * smoothstep(0.05, 0.0, s) - 0.20 * smoothstep(0.95, 1.0, s);
        c *= 1.0 - 0.34 * step(0.965, fract(uv.x * 0.52 + seed));
        return c;
      }

      vec3 leatherCol(float h){
        vec3 p0 = vec3(0.128, 0.034, 0.026);
        vec3 p1 = vec3(0.050, 0.072, 0.104);
        vec3 p2 = vec3(0.058, 0.076, 0.040);
        vec3 p3 = vec3(0.152, 0.102, 0.040);
        vec3 p4 = vec3(0.042, 0.040, 0.042);
        vec3 p5 = vec3(0.180, 0.146, 0.104);
        vec3 p6 = vec3(0.092, 0.044, 0.056);
        float k = h * 7.0;
        vec3 c = p0;
        if (k >= 1.0) c = p1;
        if (k >= 2.0) c = p2;
        if (k >= 3.0) c = p3;
        if (k >= 4.0) c = p4;
        if (k >= 5.0) c = p5;
        if (k >= 6.0) c = p6;
        return c;
      }

      vec3 bookWall(vec2 uv, float seed){
        float rowH = 3.30;
        float sh = floor(uv.y / rowH);
        float y = uv.y - sh * rowH;
        vec3 board = vec3(0.092, 0.055, 0.032) * (0.75 + 0.55 * rn(uv * 7.0));
        if (y < 0.24) return board;
        if (y > rowH - 0.18) return vec3(0.018, 0.012, 0.008);
        float cell = 0.82;
        float cx = floor(uv.x / cell);
        float ff = fract(uv.x / cell);
        float h1 = rh(vec2(cx, sh * 3.1) + seed);
        float h2 = rh(vec2(cx * 2.3, sh * 1.7 + 11.0) + seed);
        float h3 = rh(vec2(cx * 5.1, sh * 0.7 + 23.0) + seed);
        if (h3 > 0.92) return vec3(0.026, 0.017, 0.012);
        float bw = 0.44 + h1 * 0.30;
        if (ff > bw) return vec3(0.024, 0.016, 0.010);
        float top = 0.24 + (0.58 + h2 * 0.33) * (rowH - 0.42);
        if (y > top) return vec3(0.020, 0.013, 0.009);
        vec3 col = leatherCol(h1 * 0.84 + h2 * 0.16);
        col *= 0.62 + 0.46 * rfbm(vec2(cx * 1.5, y * 3.0) + seed);
        col = mix(col, vec3(dot(col, vec3(0.30, 0.55, 0.15))), 0.32);
        col *= 0.80;
        float band = step(0.42, y) * (1.0 - step(0.48, y))
                   + step(0.74, y) * (1.0 - step(0.79, y));
        col = mix(col, col * 1.25 + vec3(0.035, 0.024, 0.008), clamp(band, 0.0, 1.0) * 0.7);
        if (y > top - 0.42 && y < top - 0.26 && ff < bw * 0.70)
          col = mix(col, vec3(0.20, 0.145, 0.048), 0.62);
        return col * (0.62 + 0.38 * smoothstep(0.0, 0.09, ff));
      }

      void main(){
        vec3 q = vP;
        vec3 col;
        float dCam = length(vW - cameraPosition);
        float back  = smoothstep(uHalf.z * 0.55, uHalf.z * 0.92, q.z);
        float sideL = smoothstep(uHalf.x * 0.55, uHalf.x * 0.92, -q.x);
        float sideR = smoothstep(uHalf.x * 0.55, uHalf.x * 0.92, q.x);

        if (q.y < -uHalf.y * 0.86) {
          // ---------- floor ----------
          vec2 uv = vec2(q.x, q.z) * 0.55;
          col = timber(uv, vec3(0.125, 0.072, 0.042), 3.4, 1.7) * 0.9;
          float rug = smoothstep(15.0, 12.5, length(vec2(q.x - 1.0, q.z + 3.0) * vec2(0.62, 1.0)));
          vec3 rc = mix(vec3(0.115, 0.036, 0.030), vec3(0.175, 0.062, 0.046), rfbm(uv * 1.4));
          rc = mix(rc, vec3(0.135, 0.095, 0.052), smoothstep(0.62, 0.72, rn(uv * 2.2)));
          col = mix(col, rc * (0.85 + 0.35 * rfbm(uv * 3.0)), rug * 0.9);
        } else if (q.y > uHalf.y * 0.86) {
          // ---------- ceiling ----------
          col = timber(vec2(q.x, q.z) * 0.30, vec3(0.062, 0.041, 0.027), 1.0, 3.3) * 0.80;
        } else if (sideL > sideR && sideL > back) {
          // ---------- left wall: a run of bookcases under a panelled wall ----------
          col = timber(vec2(q.z * 0.34, q.y), vec3(0.152, 0.090, 0.053), 1.30, 5.1);
          float band = smoothstep(-3.6, -1.4, q.y) * (1.0 - smoothstep(8.2, 10.0, q.y));
          if (band > 0.01) {
            col = mix(col, bookWall(vec2(q.z * 0.80, q.y + 3.4), 11.0), band);
            float div = step(0.955, fract(q.z / 4.6));
            col = mix(col, vec3(0.075, 0.046, 0.028), div * band);
          }
          col = mix(col, vec3(0.085, 0.050, 0.030),
                    1.0 - smoothstep(uHalf.y * 0.66, uHalf.y * 0.92, q.y));
        } else if (sideR > back) {
          // ---------- right wall: panelling ----------
          col = timber(vec2(q.z * 0.34, q.y), vec3(0.150, 0.088, 0.052), 1.30, 5.1);
          col = mix(col, vec3(0.070, 0.042, 0.026), smoothstep(uHalf.y * 0.30, uHalf.y * 0.05, q.y));
          col = mix(vec3(0.045, 0.028, 0.018), col, smoothstep(uHalf.y * 0.70, uHalf.y * 0.96, q.y));
        } else {
          // ---------- back wall: panelling, bookcases, window ----------
          col = timber(vec2(q.x * 0.30, q.y), vec3(0.185, 0.108, 0.060), 1.15, 9.3);
          col = mix(col, vec3(0.085, 0.052, 0.032), smoothstep(-2.0, -4.4, q.y) * 0.85);
          col = mix(col, vec3(0.085, 0.052, 0.032), smoothstep(9.5, 12.0, q.y) * 0.7);

          float shelfMask = (1.0 - smoothstep(uWin.x - 1.8, uWin.x - 0.2, vW.x)) *
                            smoothstep(12.0, 13.2, vW.y) * (1.0 - smoothstep(24.0, 25.4, vW.y));
          if (shelfMask > 0.5) col = bookWall(vec2(vW.x * 0.86, (vW.y - 11.4) * 1.05), 21.0);

          if (vW.x > uWin.x && vW.x < uWin.y && vW.y > uWin.z && vW.y < uWin.w) {
            vec2 wuv = vec2((vW.x - uWin.x) / (uWin.y - uWin.x), (vW.y - uWin.z) / (uWin.w - uWin.z));
            vec3 dir = normalize(vW - cameraPosition);
            vec3 sky2 = skyLook(dir) * 1.70;

            float el = dir.y;
            float ang = atan(dir.z, dir.x);

            // ---- the far town, three depth layers with aerial haze ----
            float aF = ang * 15.0, iF = floor(aF), uF = fract(aF);
            float aM = ang * 27.0, iM = floor(aM), uM = fract(aM);
            float aN = ang * 46.0, iN = floor(aN), uN = fract(aN);
            float gF = 1.0 - abs(uF * 2.0 - 1.0);
            float gM = 1.0 - abs(uM * 2.0 - 1.0);
            float gN = 1.0 - abs(uN * 2.0 - 1.0);
            float h1 = 0.006 + 0.050 * rn(vec2(iF, 3.0))
                             + 0.013 * rn(vec2(iF * 2.7, 9.0))
                             + 0.022 * gF * step(0.52, rn(vec2(iF, 31.0)));
            float h2 = -0.018 + 0.042 * rn(vec2(iM, 17.0))
                              + 0.011 * rn(vec2(iM * 3.1, 21.0))
                              + 0.018 * gM * step(0.58, rn(vec2(iM, 37.0)));
            float h3 = -0.058 + 0.028 * rn(vec2(iN, 29.0))
                              + 0.014 * gN * step(0.62, rn(vec2(iN, 43.0)));

            vec3 skyH = mix(uSkyHorizon, uSkyTop, 0.12) * 1.35;
            vec3 farC  = mix(skyH, vec3(0.118, 0.100, 0.124), 0.66);
            vec3 midC  = mix(farC, vec3(0.058, 0.050, 0.064), 0.72);
            vec3 nearC = vec3(0.026, 0.024, 0.032);

            float m1 = smoothstep(h1 + 0.007, h1 - 0.005, el);
            float m2 = smoothstep(h2 + 0.006, h2 - 0.005, el);
            float m3 = smoothstep(h3 + 0.005, h3 - 0.005, el);
            sky2 = mix(sky2, farC, m1);
            sky2 = mix(sky2, midC, m2 * 0.94);
            sky2 = mix(sky2, nearC, m3);

            // domed clock tower on the middle layer
            float ta = ang - 0.42;
            float tower = smoothstep(0.030, 0.010, abs(ta)) *
                          smoothstep(h2 + 0.085, h2 + 0.070, el);
            float dome = smoothstep(0.016, 0.004, length(vec2(ta * 1.5, (el - h2 - 0.090) * 1.0)));
            sky2 = mix(sky2, midC * 0.85, tower * 0.9);
            sky2 = mix(sky2, midC * 1.15, dome * 0.9);

            // ---- lit windows ----
            vec2 wc = vec2(ang * 190.0, el * 135.0);
            vec2 wf = fract(wc) - 0.5;
            float on = step(0.87, rh(floor(wc) + 3.0));
            float winx = on * smoothstep(0.30, 0.13, length(wf));
            sky2 += vec3(1.0, 0.70, 0.32) * winx * (0.04 + uNight * 1.25) * max(m2, m3 * 0.9);

            // ---- masts and rigging along the quay ----
            float mast = step(0.968, rn(vec2(floor(ang * 330.0), 7.0)));
            float mastBand = smoothstep(h3 + 0.105, h3 + 0.006, el) * smoothstep(h3 - 0.004, h3 + 0.012, el);
            sky2 = mix(sky2, nearC * 1.7, mast * mastBand * 0.95);

            // ---- glazing bars, then the frame ----
            float mull = step(abs(wuv.x - 0.5), 0.014) + step(abs(wuv.y - 0.46), 0.012)
                       + step(abs(wuv.y - 0.74), 0.011) + step(abs(wuv.x - 0.25), 0.006)
                       + step(abs(wuv.x - 0.75), 0.006);
            sky2 = mix(sky2, vec3(0.052, 0.032, 0.019), clamp(mull, 0.0, 1.0));
            float frame = smoothstep(0.030, 0.0, wuv.x) + smoothstep(0.970, 1.0, wuv.x)
                        + smoothstep(0.030, 0.0, wuv.y) + smoothstep(0.970, 1.0, wuv.y);
            sky2 = mix(sky2, vec3(0.145, 0.090, 0.048), clamp(frame, 0.0, 1.0));

            // a faint sheen so the aperture reads as glass
            float sheen = smoothstep(0.55, 1.0, wuv.x + wuv.y * 0.42);
            sky2 += vec3(0.055, 0.050, 0.044) * sheen * 0.7;

            col = sky2;
          }
        }

        col *= 0.86;
        col = mix(col, vec3(0.070, 0.046, 0.032), smoothstep(38.0, 118.0, dCam) * 0.58);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(ROOM.hx * 2, ROOM.hy * 2, ROOM.hz * 2), mat);
  m.position.set(ROOM.cx, ROOM.cy, ROOM.cz);
  m.frustumCulled = false;
  m.renderOrder = -200;
  return m;
}

/** Sturdy legs carrying the writing table down to the floor. */
function buildTableBase() {
  const grp = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x2e1c10, roughness: 0.80, metalness: 0.0, flatShading: true });
  const top = DESK.y - DESK.thick;
  const foot = ROOM.cy - ROOM.hy + 0.4;
  const h = top - foot;
  for (const [lx, lz] of [[-7.4, -2.9], [-7.4, 2.9], [10.4, -2.9], [10.4, 2.9]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.85, h, 0.85), wood);
    leg.position.set(lx, foot + h * 0.5, lz);
    grp.add(leg);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.30, 1.15), wood);
    cap.position.set(lx, top - 0.17, lz);
    grp.add(cap);
  }
  for (const lz of [-2.9, 2.9]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(17.8, 0.42, 0.42), wood);
    rail.position.set(1.5, foot + h * 0.30, lz);

    rail2.position.set(1.5, foot + h * 0.76, lz);
    grp.add(rail2);
  }
  grp.renderOrder = -10;
  return grp;
}

// ------------------------------------------------------------
//  frame update for the sky + lights
// ------------------------------------------------------------
function updateDay(dt, realTime) {
  if (DayCycle.speed > 0) {
    DayCycle.t = (DayCycle.t + dt * DayCycle.base * DayCycle.speed) % 1;
    if (DayCycle.t < 0) DayCycle.t += 1;
  }
  const k = applySkyKey(DayCycle.t);
  const storm = Sky.storm;

  // storm dims and greys the whole sky
  if (storm > 0.001) {
    Sky.top.lerp(_tmpCol.setHex(0x33393f), storm * 0.86);
    Sky.horizon.lerp(_tmpCol.setHex(0x4e4c46), storm * 0.78);
    Sky.ground.lerp(_tmpCol.setHex(0x14181c), storm * 0.70);
    Sky.sunTint.lerp(_tmpCol.setHex(0x8e949c), storm * 0.80);
    const dim = 1 - storm * 0.30;
    Sky.top.multiplyScalar(dim); Sky.horizon.multiplyScalar(dim);
  }

  const sunUp = sat(smoothstep(-0.16, 0.06, Sky.sunDir.y));

  // ---- lights ----
  sunLight.color.copy(Sky.sunTint);
  sunLight.intensity = k.sunI * 0.60 * (1 - storm * 0.58);
  sunLight.position.copy(Sky.sunDir).multiplyScalar(40);
  sunLight.position.y = Math.max(sunLight.position.y, 3);

  moonFill.color.setHex(0x6d8ac8);
  moonFill.intensity = (1 - sunUp) * 0.22 * (1 - storm * 0.5);
  moonFill.position.copy(Sky.moonDir).multiplyScalar(40);
  moonFill.position.y = Math.max(moonFill.position.y, 3);

  hemiLight.color.copy(Sky.horizon).lerp(_tmpCol.setHex(0x7fa8d8), 0.35);
  hemiLight.groundColor.copy(Sky.ground).lerp(_tmpCol.setHex(0x2a1a10), 0.5);
  hemiLight.intensity = (0.26 + k.ambI * 0.46) * (1 - storm * 0.36);
  ambient.intensity = 0.10 + Sky.night * 0.10 + storm * 0.05;

  // ---- interior lamp: brighter at night, flickering softly ----
  const lampBoost = 1 + Sky.night * 1.35;
  const flick = 1 + Math.sin(realTime * 11.3) * 0.020 + Math.sin(realTime * 27.7) * 0.013;
  lampLight.intensity = 46 * lampBoost * flick;
  lampLight.color.setHex(0xffa444);
  roomWarm.intensity = 0.30 + Sky.night * 0.42 + storm * 0.22;

  // ---- beacon ----
  const beaconPulse = 0.80 + 0.20 * Math.abs(Math.sin(realTime * 1.05));
  beaconLight.intensity = (2.2 + Sky.night * 5.2) * beaconPulse;
  beaconLight.color.setHex(0xffd070);

  // ---- treasure ----
  const tp = 0.75 + 0.25 * Math.sin(realTime * 0.9) * Math.sin(realTime * 0.37 + 1.3);
  treasureLight.intensity = (1.4 + Sky.night * 3.4) * tp;
  treasureLight.color.setHex(0xffb848);

  // exposure & bloom
  const expo = k.exp * 1.06 * (1 - storm * 0.05);
  renderer.toneMappingExposure = expo;
  Sky.exposure = expo;
  finalPass.uniforms.uExposure.value = expo;
  bloom.strength = lerp(0.24, 0.55, Sky.night) * (1 - storm * 0.25);
  bloom.smooth = 0.34;
  bloom.threshold = lerp(1.06, 0.72, Sky.night) * (1 - storm * 0.18);

  finalPass.uniforms.uAberration.value = 0.9 + Sky.night * 0.5;
  finalPass.uniforms.uVignette.value = 0.06 + Sky.night * 0.10 + storm * 0.10;
  finalPass.uniforms.uTime.value = realTime;

  // emissive boost at night so lamps read as real light sources
  const emisMul = 1.0 + Sky.night * 1.05;
  for (const mat of VOX_MATERIALS) {
    mat.userData.u.uEmisMul && (mat.userData.u.uEmisMul.value = emisMul);
  }
  syncSkyUniforms();
  return k;
}

function phaseName(t) {
  let n = PHASE_NAMES[0][1];
  for (const [tt, nm] of PHASE_NAMES) if (t >= tt) n = nm;
  return n;
}

/* ============================================================
   12.  INTERACTION  —  orbit, zoom, idle-resume, storm key, time lapse
   ============================================================ */

const Cam = {
  pivot: new THREE.Vector3(1.80, -0.10, 0),
  dist: 42, minDist: 12, maxDist: 90,
  yaw: -1.30, pitch: 0.135,
  gYaw: -1.30, gPitch: 0.135, gDist: 42,
  idle: 0, idleDelay: 4.2, auto: true, autoSpeed: 0.048,
  dragging: false, lastX: 0, lastY: 0, vYaw: 0, vPitch: 0,
  px: 0, py: 0,
  shake: new THREE.Vector2(),
};
const PITCH_MIN = -0.075, PITCH_MAX = 0.70;

/** Distance that makes the whole bottle just fill the viewport. */
function fitViewDistance() {
  const aspect = clamp(window.innerWidth / Math.max(1, window.innerHeight), 0.55, 3.2);
  const vFov = clamp(camera.fov, 18, 70) * PI / 180;
  const halfW = 15.6, halfH = 7.8;
  const t = Math.max(0.12, Math.tan(vFov / 2));
  const dH = halfH / t;
  const dW = halfW / (t * aspect);
  return clamp(Math.max(dH, dW) * 1.045, 16, 72);
}

let stormTarget = 0;
let stormAmount = 0;
let lightning = 0;
let lightningTimer = 4 + Math.random() * 6;

function initControls() {
  const el = renderer.domElement;
  const pointers = new Map();
  let pinchStart = 0, pinchDist0 = 0;

  const onDown = (e) => {
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    Cam.dragging = true;
    Cam.idle = 0;
    Cam.auto = false;
    document.body.classList.add('dragging');
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      pinchDist0 = Cam.gDist;
    }
  };
  const onMove = (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStart > 1) {
        Cam.gDist = clamp(pinchDist0 * (pinchStart / Math.max(1, d)), Cam.minDist, Cam.maxDist);
      }
      return;
    }
    const k = 0.0042 * (1 + (Cam.gDist - 20) / 60);
    Cam.gYaw += dx * k;
    Cam.gPitch = clamp(Cam.gPitch + dy * k * 0.85, PITCH_MIN, PITCH_MAX);
    Cam.vYaw = dx * k;
    Cam.vPitch = dy * k;
  };
  const onUp = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      Cam.dragging = false;
      Cam.idle = 0;
      document.body.classList.remove('dragging');
    }
  };

  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const s = Math.exp(e.deltaY * 0.0011);
    Cam.gDist = clamp(Cam.gDist * s, Cam.minDist, Cam.maxDist);
    Cam.idle = 0;
    Cam.auto = false;
  }, { passive: false });

  // ---------- keyboard ----------
  const keys = new Set();
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); stormTarget = 1; }
    if (e.code === 'KeyR') resetView();
    if (e.code === 'Digit1' || e.code === 'Numpad1') setSpeed(1);
    if (e.code === 'Digit2' || e.code === 'Numpad2') setSpeed(4);
    if (e.code === 'Digit3' || e.code === 'Numpad3') setSpeed(12);
    if (e.code === 'Digit0' || e.code === 'KeyP') setSpeed(0);
    keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { e.preventDefault(); stormTarget = 0; }
    keys.delete(e.code);
  });
  window.addEventListener('blur', () => { stormTarget = 0; });

  // ---------- HUD: time-lapse buttons ----------
  document.querySelectorAll('#clock .btn').forEach((b) => {
    b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.sp)));
  });
  // a touch on the HUD should not start an orbit drag
  document.querySelectorAll('.hud').forEach((h) => {
    h.addEventListener('pointerdown', (e) => e.stopPropagation());
  });
}

function setSpeed(v) {
  DayCycle.speed = v;
  document.querySelectorAll('#clock .btn').forEach((b) => {
    b.classList.toggle('on', parseFloat(b.dataset.sp) === v);
  });
  document.getElementById('speedTxt').textContent = v === 0 ? '暂停' : `×${v}`;
}

function resetView() {
  Cam.gYaw = -1.30; Cam.gPitch = 0.135; Cam.gDist = Cam.fitDist;
  Cam.auto = true; Cam.idle = 0;
}

function initCameraFit() {
  Cam.fitDist = fitViewDistance();
  Cam.dist = Cam.gDist = Cam.fitDist;
  Cam.minDist = Cam.fitDist * 0.40;
  Cam.maxDist = Cam.fitDist * 1.08;
}

function updateCamera(dt, realTime) {
  if (!Cam.dragging) {
    Cam.idle += dt;
    if (Cam.idle > Cam.idleDelay) Cam.auto = true;
  }
  if (Cam.auto && !Cam.dragging) {
    Cam.gYaw += Cam.autoSpeed * dt;
    Cam.gPitch += (0.145 - Cam.gPitch) * Math.min(1, dt * 0.4);
    Cam.gDist += (Cam.fitDist - Cam.gDist) * Math.min(1, dt * 0.30);
  }
  // inertia after release
  if (!Cam.dragging) {
    Cam.vYaw *= Math.pow(0.02, dt);
    Cam.vPitch *= Math.pow(0.02, dt);
    Cam.gYaw += Cam.vYaw * dt * 4.0;
    Cam.gPitch = clamp(Cam.gPitch + Cam.vPitch * dt * 4.0, PITCH_MIN, PITCH_MAX);
  }

  const k = 1 - Math.pow(0.0018, dt);
  Cam.yaw   += (Cam.gYaw   - Cam.yaw)   * k;
  Cam.pitch += (Cam.gPitch - Cam.pitch) * k;
  Cam.dist  += (Cam.gDist  - Cam.dist)  * (1 - Math.pow(0.006, dt));

  // subtle handheld shake during a storm
  const sq = stormAmount * stormAmount;
  Cam.shake.set(Math.sin(realTime * 21.3) * 0.06 * sq + Math.sin(realTime * 13.1) * 0.03 * sq,
                Math.cos(realTime * 17.7) * 0.05 * sq);

  const cp = Math.cos(Cam.pitch + Cam.shake.y);
  const sp = Math.sin(Cam.pitch + Cam.shake.y);
  const cy = Cam.yaw + Cam.shake.x;
  const x = Cam.pivot.x + Math.cos(cy) * cp * Cam.dist;
  const y = Cam.pivot.y + sp * Cam.dist;
  const z = Cam.pivot.z + Math.sin(cy) * cp * Cam.dist;
  camera.position.set(x, y, z);
  camera.lookAt(Cam.pivot.x, Cam.pivot.y + 0.35, Cam.pivot.z);
}

function updateStorm(dt, realTime) {
  const tgt = stormTarget;
  const rate = tgt > stormAmount ? 0.55 : 0.42;
  stormAmount += (tgt - stormAmount) * Math.min(1, dt * rate * 2.2);
  if (Math.abs(stormAmount - tgt) < 0.002) stormAmount = tgt;
  Sky.storm = stormAmount;

  // ---- lightning ----
  if (stormAmount > 0.55) {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
      lightning = 1;
      lightningTimer = 2.4 + Math.random() * 7.5;
    }
  } else {
    lightningTimer = Math.max(lightningTimer, 1.6);
  }
  lightning = Math.max(0, lightning - dt * 3.4);
  const flick = lightning * (0.55 + 0.45 * Math.random());
  if (flick > 0.01) {
    Sky.top.lerp(_tmpCol.setRGB(1.6, 1.7, 2.0), flick * 0.72);
    Sky.horizon.lerp(_tmpCol.setRGB(1.5, 1.6, 1.9), flick * 0.6);
    Sky.sunTint.lerp(_tmpCol.setRGB(1.8, 1.9, 2.2), flick * 0.5);
    ambient.intensity += flick * 0.6;
  }
  return stormAmount;
}

const G = {};

/** Remove any voxel whose centre escapes the inner glass surface. */
function clipToBottle(g, margin) {
  const V = g.vox;
  const m = margin === undefined ? 0.015 : margin;
  let removed = 0;
  for (let i = 0; i < g.n; i++) {
    if (g.dead[i]) continue;
    const x = g.px[i] * V, y = g.py[i] * V, z = g.pz[i] * V;
    const R = bottleInnerRadius(x);
    if (R <= 0.06) { g.dead[i] = 1; removed++; continue; }
    if (Math.hypot(y, z) > R - m) { g.dead[i] = 1; removed++; }
  }
  return removed;
}
function clipToRange(g, x0, x1) {
  const V = g.vox;
  for (let i = 0; i < g.n; i++) {
    if (g.dead[i]) continue;
    const x = g.px[i] * V;
    if (x < x0 || x > x1) g.dead[i] = 1;
  }
}

/** radial blob used for the hand-made contact shadows */
function makeBlobShadowTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(0,0,0,1)');
  g.addColorStop(0.42, 'rgba(0,0,0,0.68)');
  g.addColorStop(0.74, 'rgba(0,0,0,0.20)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ============================================================
//  world update
// ============================================================
const _e = new THREE.Euler();
const _q = new THREE.Quaternion();
const _p = new THREE.Vector3();
const _sc = new THREE.Vector3(1, 1, 1);
const _nrm = new THREE.Vector3();
const _tmpV = new THREE.Vector3();

function updateWorld(dt, time, storm) {
  const amp = lerp(OCEAN.calm.amp, OCEAN.storm.amp, storm);
  const frq = lerp(OCEAN.calm.freq, OCEAN.storm.freq, storm);
  const spd = lerp(OCEAN.calm.speed, OCEAN.storm.speed, storm);

  // ---- water uniforms ----
  const wu = G.water.userData.uniforms;
  wu.uTime.value = time;
  wu.uAmp.value = amp;
  wu.uFrq.value = frq;
  wu.uSpd.value = spd;
  wu.uChop.value = storm;
  wu.uQuant.value = lerp(OCEAN.quant, OCEAN.quant * 1.5, storm);
  G.godRays.userData.uniforms.uTime.value = time;
  G.godRays.userData.uniforms.uChop.value = storm;
  G.godRays.visible = Sky.sunI > 0.05 && Sky.sunDir.y > -0.05;

  // ---- bottle rocks on its cradle ----
  const sq = storm * storm;
  const sk = 0.078 * sq;
  G.pivot.rotation.x = (Math.sin(time * 1.62) * 0.55 + Math.sin(time * 2.91) * 0.30) * sk;
  G.pivot.rotation.z = (Math.cos(time * 1.31) * 0.50 + Math.sin(time * 2.23) * 0.26) * sk;
  G.pivot.rotation.y = Math.sin(time * 0.88) * sk * 0.50;
  G.pivot.position.y = -3.25 + Math.sin(time * 1.15) * 0.02 * sq;
  G.pivot.position.x = Math.sin(time * 1.31) * 0.035 * sq;

  // ---- ship physics: four-point wave sampling ----
  {
    const a = time * SHIP.speed + 0.35;
    const cx = SHIP.orbitCx + Math.cos(a) * SHIP.orbitRx;
    const cz = SHIP.orbitCz + Math.sin(a) * SHIP.orbitRz;
    const heading = Math.atan2(Math.cos(a) * SHIP.orbitRz, -Math.sin(a) * SHIP.orbitRx);
    const fx = Math.cos(heading), fz = Math.sin(heading);
    const rx = -Math.sin(heading), rz = Math.cos(heading);
    const HL = 1.62, HB = 0.62;
    const hFR = waveHeightJS(cx + fx * HL + rx * HB, cz + fz * HL + rz * HB, time, amp, frq, spd);
    const hFL = waveHeightJS(cx + fx * HL - rx * HB, cz + fz * HL - rz * HB, time, amp, frq, spd);
    const hSR = waveHeightJS(cx - fx * HL + rx * HB, cz - fz * HL + rz * HB, time, amp, frq, spd);
    const hSL = waveHeightJS(cx - fx * HL - rx * HB, cz - fz * HL - rz * HB, time, amp, frq, spd);

    const heave = (hFR + hFL + hSR + hSL) * 0.25;
    const bowAvg = (hFR + hFL) * 0.5, sternAvg = (hSR + hSL) * 0.5;
    const rightAvg = (hFR + hSR) * 0.5, leftAvg = (hFL + hSL) * 0.5;
    let pitchT = Math.atan2(bowAvg - sternAvg, 2 * HL);
    let rollT  = -Math.atan2(rightAvg - leftAvg, 2 * HB);
    pitchT = clamp(pitchT, -0.34, 0.34);
    rollT  = clamp(rollT, -0.30, 0.30);

    const k = 1 - Math.pow(0.0009, dt);
    G.shipHeave = (G.shipHeave === undefined ? heave : G.shipHeave + (heave - G.shipHeave) * k);
    G.shipPitch = (G.shipPitch === undefined ? pitchT : G.shipPitch + (pitchT - G.shipPitch) * k);
    G.shipRoll  = (G.shipRoll  === undefined ? rollT  : G.shipRoll  + (rollT  - G.shipRoll ) * k);
    G.shipYaw   = (G.shipYaw   === undefined ? heading: G.shipYaw   + (heading - G.shipYaw) * (1 - Math.pow(0.2, dt)));

    G.shipMesh.mesh.position.set(cx, WATER_Y + G.shipHeave - 0.01, cz);

    // never let the topmast leave the glass, whatever the sea state
    const Rlim = bottleInnerRadius(cx) - 0.34;
    const mt = G.shipData.mastTop;
    let roll = G.shipRoll, pitch = G.shipPitch;
    for (let it = 0; it < 14; it++) {
      _e.set(roll, -G.shipYaw, pitch, 'YXZ');
      _q.setFromEuler(_e);
      _p.copy(mt).applyQuaternion(_q);
      if (Math.hypot(_p.y + WATER_Y + G.shipHeave, _p.z + cz) < Rlim) break;
      roll *= 0.88; pitch *= 0.88;
    }
    G.shipRoll = roll; G.shipPitch = pitch;

    _e.set(G.shipRoll, -G.shipYaw, G.shipPitch, 'YXZ');
    G.shipMesh.mesh.quaternion.setFromEuler(_e);

    G.shipWorld = { x: cx, z: cz, fx, fz, rx, rz, heading, heave: G.shipHeave };
    G.shipMesh.mesh.updateMatrixWorld(true);

    // ---- bow spray + wake ----
    const bowW = new THREE.Vector3().copy(G.shipData.bow).applyMatrix4(G.shipMesh.mesh.matrixWorld);
    const stW  = new THREE.Vector3().copy(G.shipData.stern).applyMatrix4(G.shipMesh.mesh.matrixWorld);
    const rate = 16 + storm * 60;
    G.sprayAcc += dt * rate;
    const speed = SHIP.speed * SHIP.orbitR;
    while (G.sprayAcc >= 1) {
      G.sprayAcc -= 1;
      const side = Math.random() < 0.5 ? -1 : 1;
      const j = 0.5 + Math.random() * 0.9;
      G.spray.emit(
        bowW.x + (Math.random() - 0.5) * 0.16,
        Math.max(WATER_Y + heave * 0.5, bowW.y) + 0.03,
        bowW.z + (Math.random() - 0.5) * 0.16,
        fx * speed * 1.0 + rx * side * j * (0.55 + storm * 1.5) + (Math.random() - 0.5) * 0.4,
        0.55 + Math.random() * 0.75 + storm * 1.1,
        fz * speed * 1.0 + rz * side * j * (0.55 + storm * 1.5) + (Math.random() - 0.5) * 0.4,
        0.032 + Math.random() * 0.046 + storm * 0.030,
        0.55 + Math.random() * 0.55
      );
    }
    G.wakeAcc += dt * (7 + storm * 22);
    while (G.wakeAcc >= 1) {
      G.wakeAcc -= 1;
      const side = Math.random() < 0.5 ? -1 : 1;
      G.spray.emit(
        stW.x + rx * side * 0.16 + (Math.random() - 0.5) * 0.30,
        WATER_Y + heave * 0.6 + 0.02,
        stW.z + rz * side * 0.16 + (Math.random() - 0.5) * 0.30,
        -fx * 0.12 + rx * side * 0.16 + (Math.random() - 0.5) * 0.24,
        0.06 + Math.random() * 0.22,
        -fz * 0.12 + rz * side * 0.16 + (Math.random() - 0.5) * 0.24,
        0.038 + Math.random() * 0.060,
        0.7 + Math.random() * 0.8
      );
    }
  }

  // ---- gulls ----
  for (let i = 0; i < G.gulls.length; i++) {
    const gu = G.gulls[i];
    const o = gu.orb;
    const a = time * o.spd + o.ph;
    const x = o.cx + Math.cos(a) * o.rx;
    const z = o.cz + Math.sin(a) * o.rz;
    const y = o.y + Math.sin(time * o.bob + o.ph * 2.1) * o.ba;
    const tx = -Math.sin(a) * o.rx * Math.sign(o.spd);
    const tz = Math.cos(a) * o.rz * Math.sign(o.spd);
    const hd = Math.atan2(tz, tx);
    _e.set(-0.44 * Math.sign(o.spd), -hd, 0, 'YXZ');
    _q.setFromEuler(_e);
    _p.set(x, y, z);
    gu.mesh.matrix.compose(_p, _q, _sc);
    gu.mesh.matrixAutoUpdate = false;
    gu.mesh.matrixWorldNeedsUpdate = true;
  }

  // ---- whale: a slow arc that breaches every cycle ----
  {
    const T = 15.5;
    const tt = ((time + 6.0) % T) / T;
    let wx, wy, wz, wpitch, visible = true;
    if (tt < 0.46) {
      const u = tt / 0.46;
      wx = -6.35 + u * 2.4;
      wz = 1.60 - Math.sin(u * PI) * 1.05;
      wy = -1.75 - Math.sin(u * PI) * 0.55;
      wpitch = -Math.sin(u * PI * 2) * 0.22;
    } else if (tt < 0.80) {
      const u = (tt - 0.46) / 0.34;
      wx = -3.95 + u * 3.3;
      wz = 0.55 + u * 0.55;
      wy = -2.0 + Math.sin(u * PI) * 3.45;
      wpitch = (0.5 - u) * 2.55;
      // splash on entry
      if (G.whalePrevY !== undefined && G.whalePrevY < WATER_Y && wy >= WATER_Y) {
        for (let q = 0; q < 46; q++) {
          const s = (Math.random() - 0.5) * 2;
          G.spray.emit(wx + (Math.random() - 0.5) * 0.5, WATER_Y + 0.05, wz + (Math.random() - 0.5) * 0.4,
            s * 1.1, 1.3 + Math.random() * 1.9, (Math.random() - 0.5) * 1.2,
            0.035 + Math.random() * 0.06, 0.9 + Math.random() * 0.7);
        }
      }
    } else {
      const u = (tt - 0.80) / 0.20;
      wx = -0.65 + u * 1.1;
      wz = 1.10 - u * 0.35;
      wy = -2.0 - u * 0.9;
      wpitch = -1.1 + u * 0.9;
      visible = false;
    }
    G.whalePrevY = wy;
    G.whale.mesh.visible = visible || tt > 0.36;
    G.whale.mesh.matrixAutoUpdate = false;
    _e.set(0, 0, wpitch, 'YXZ');
    _q.setFromEuler(_e);
    _p.set(wx, wy, wz);
    G.whale.mesh.matrix.compose(_p, _q, _sc);
    G.whale.mesh.matrixWorldNeedsUpdate = true;
  }

  // ---- fish schools circle their own origins (shader mode 2) ----
  {
    const u = G.fish.mesh.material.userData.u;
    const idx = Math.floor(time / 13.0) % SCHOOLS.length;
    const S = SCHOOLS[idx];
    u.uOrigin.value.lerp(_tmpV.set(S.x, S.y, S.z), Math.min(1, dt * 1.2));
  }

  // ---- buoys bob on the swell ----
  {
    for (let i = 0; i < 2; i++) {
      const b = G.buoys[i].mesh;
      const bx = i === 0 ? -6.35 : 6.55;
      const bz = i === 0 ? 2.05 : -1.85;
      const h = waveHeightJS(bx, bz, time, amp, frq, spd);
      waveNormalJS(bx, bz, time, amp, frq, spd, _nrm);
      _e.set(-_nrm.z * 0.42, time * 0.10 + i * 1.7, _nrm.x * 0.42, 'YXZ');
      _q.setFromEuler(_e);
      _p.set(bx + Math.sin(time * 1.1 + i * 2.3) * 0.05, WATER_Y + h - 0.13, bz);
      b.matrix.compose(_p, _q, _sc);
      b.matrixWorldNeedsUpdate = true;
    }
  }

  // ---- per-material time ----
  for (const m of VOX_MATERIALS) {
    m.userData.u.uTime.value = time;
    m.userData.u.uNight.value = Sky.night;
    if (m.userData.u.uStorm) m.userData.u.uStorm.value = storm;
  }

  // ---- spray ----
  G.spray.update(dt, 2.4, WATER_Y);

  // ---- storm: whitecaps tearing off the open water ----
  if (storm > 0.22) {
    G.stormAcc = (G.stormAcc || 0) + dt * (storm - 0.22) * 120;
    while (G.stormAcc >= 1) {
      G.stormAcc -= 1;
      const a2 = Math.random() * TAU, rr2 = 0.8 + Math.random() * 6.4;
      const px = Math.cos(a2) * rr2 * 1.10, pz = Math.sin(a2) * rr2 * 0.68;
      if (bottleInnerRadius(px) < Math.abs(pz) + 1.1) continue;
      const h = waveHeightJS(px, pz, time, amp, frq, spd);
      G.spray.emit(px, WATER_Y + h + 0.02, pz,
        (Math.random() - 0.5) * 0.8, 0.9 + Math.random() * 2.0, (Math.random() - 0.5) * 0.8,
        0.028 + Math.random() * 0.042, 0.8 + Math.random() * 0.8);
    }
  }

  // ---- the beacon sweeps the sea ----
  {
    const t = time * 0.62;
    if (G.beam) {
      G.beam.rotation.y = t;
      const bp = G.beam.position;
      const Rl = bottleInnerRadius(bp.x) - 0.10;
      const yMax = Math.abs(bp.y) + 0.60;
      const room = Math.sqrt(Math.max(0.16, Rl * Rl - yMax * yMax));
      const reach = Math.max(0.35, Math.min(2.60, room - Math.abs(bp.z)));
      G.beam.scale.z = reach / 2.60;
      G.beamU.uLen.value = 2.60;
      G.beamU.uTime.value = time;
      G.beamU.uNight.value = Sky.night;
    }
    const lp = G.lampPos3;
    beaconLight.position.set(lp.x + Math.cos(t) * 0.34, lp.y, lp.z + Math.sin(t) * 0.34);
  }

  // ---- ambient drips: a few bubbles escape near the island ----
  if (Math.random() < dt * (5 + storm * 26)) {
    const px = ISLE.x + (Math.random() - 0.5) * 4.0;
    const pz = ISLE.z + (Math.random() - 0.5) * 3.4;
    if (bottleInnerRadius(px) > Math.abs(pz) + 0.6)
      G.spray.emit(px, -3.6 + Math.random() * 0.6, pz, 0, 0.25 + Math.random() * 0.3, 0,
        0.024 + Math.random() * 0.024, 3.6 + Math.random() * 3.0);
  }
}

// ============================================================
//  main loop
// ============================================================
let _last = performance.now();
let _time = 0;
let _fpsAcc = 0, _fpsN = 0, _fps = 60, _prCooldown = 3;
const _phaseTxt = document.getElementById('phaseTxt');
const _timeFill = document.getElementById('timeFill');

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  let dt = (now - _last) / 1000;
  _last = now;
  if (dt > 0.06) dt = 0.06;
  _time += dt;

  // adaptive resolution: only ever step down, and re-sync the composer when we do
  _fpsAcc += dt; _fpsN++;
  if (_fpsAcc > 0.8) {
    _fps = _fpsN / _fpsAcc;
    _fpsAcc = 0; _fpsN = 0;
    const target = Math.min(window.devicePixelRatio, 2);
    const pr = renderer.getPixelRatio();
    if (_fps < 48 && pr > 0.74 && _prCooldown <= 0) {
      renderer.setPixelRatio(Math.max(0.74, pr - 0.18));
      resize();
      _prCooldown = 2.5;
    } else if (_fps > 58 && pr < target - 0.05 && _prCooldown <= 0) {
      renderer.setPixelRatio(Math.min(target, pr + 0.1));
      resize();
      _prCooldown = 3.0;
    }
  }
  _prCooldown -= dt;

  const storm = updateStorm(dt, _time);
  updateDay(dt, _time);
  updateCamera(dt, _time);
  updateWorld(dt, _time, storm);

  renderer.info.reset();
  composer.render();

  _phaseTxt.textContent = phaseName(DayCycle.t);
  _timeFill.style.width = `${(DayCycle.t * 100).toFixed(1)}%`;
}

// ============================================================
boot()
  .then(() => {
    document.getElementById('load').classList.add('gone');
    setTimeout(() => { const l = document.getElementById('load'); if (l) l.remove(); }, 1400);
    tick();
  })
  .catch((err) => {
    console.error(err);
    loadMsg.textContent = '构建失败：' + (err && err.message ? err.message : err);
    loadMsg.style.color = '#e08a6a';
    loadBar.style.background = '#c0392b';
  });

</script>
