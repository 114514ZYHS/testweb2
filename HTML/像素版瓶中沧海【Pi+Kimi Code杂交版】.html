/* ============================================================
   7.  THE SEA FLOOR  —  chest, anchor, amphora, coral, kelp, bubbles
   ============================================================ */

const PAL_GOLD = [0xffcf58, 0xf0b93c, 0xffe28a, 0xd9a02a, 0xfff0b8];

/** true when a ball of radius `rad` around (x,y,z) stays clear of the inner glass */
function glassRoom(x, y, z, rad) {
  const r = rad || 0, m = r + 0.16;
  for (let d = -1; d <= 1; d++) {
    const R = bottleInnerRadius(x + d * r);
    if (R <= m || Math.hypot(y, z) > R - m) return false;
  }
  return true;
}

/** slide a centre back toward the bottle axis until a ball of radius `maxR` fits */
function glassPull(cx, cy, cz, maxR) {
  const R = Math.min(bottleInnerRadius(cx - maxR), bottleInnerRadius(cx), bottleInnerRadius(cx + maxR));
  const m = maxR + 0.16;
  if (R <= m) return null;
  const d = Math.hypot(cy, cz), lim = R - m;
  if (d <= lim) return [cy, cz];
  const k = lim / Math.max(1e-4, d);
  return [cy * k, cz * k];
}

/** a random spot in the deep water volume, `rad` clear of the glass */
function deepSpot(i, seed, yLo, yHi, rad, minIsle) {
  const x = (hash1(i * 7 + seed) * 2 - 1) * 9.6;
  const y = lerp(yLo, yHi, hash1(i * 13 + seed + 1));
  const R = Math.min(bottleInnerRadius(x - rad), bottleInnerRadius(x), bottleInnerRadius(x + rad));
  const lim = R - 0.17 - rad;
  if (lim <= 0.22) return null;
  const zm = Math.sqrt(Math.max(0, lim * lim - y * y));
  if (zm < 0.16) return null;
  const z = (hash1(i * 29 + seed + 2) * 2 - 1) * zm * 0.94;
  if (minIsle && Math.hypot(x - ISLE.x, z - ISLE.z) < minIsle) return null;
  return [x, y, z];
}

/** ellipsoid() only emits cells when given the colour-override callback */
function blob(g, cx, cy, cz, rx, ry, rz, hex, o) {
  g.ellipsoid(cx, cy, cz, rx, ry, rz, hex, o, () => undefined);
}

// ------------------------------------------------------------
//  treasure chest
// ------------------------------------------------------------
function buildChest(g, cx, cy, cz, rot) {
  const V = g.vox;
  const cs = Math.cos(rot), sn = Math.sin(rot);
  const toW = (u, v, w) => ({ x: cx + u * cs - w * sn, y: cy + v, z: cz + u * sn + w * cs });
  const cell = (u, v, w) => {
    const p = toW(u, v, w);
    return [Math.round(p.x / V), Math.round(p.y / V), Math.round(p.z / V)];
  };
  const put = (u, v, w, hex, o) => {
    const c = cell(u, v, w);
    g.set(c[0], c[1], c[2], hex, o);
  };
  const WOOD = [0x6d4a2a, 0x7d5832, 0x5c3e23, 0x8a6337];
  const WOODB = [0x4c3119, 0x563a20, 0x41280f];
  const IRON = [0x4a4740, 0x585349, 0x3b3833];
  const BRASS = [0xc79b4a, 0xb0863a, 0xdcb066];
  const GEMS = [0x39d3c0, 0xd94a7a, 0x6a7ce0, 0x6fe07a, 0xf0d24a];
  const W = 0.42, D = 0.28, Hh = 0.28;
  const nU = Math.round(W / V), nD = Math.round(D / V), nH = Math.round(Hh / V);

  // ---- hull: plank walls, iron bands, iron rim, carved end panels ----
  for (let k = 0; k <= nH; k++) {
    for (let a = -nU; a <= nU; a++) for (let b = -nD; b <= nD; b++) {
      const end = Math.abs(Math.abs(a) - nU) < 1, side = Math.abs(Math.abs(b) - nD) < 1;
      if (!end && !side && k !== 0) continue;
      const u = a * V, w = b * V;
      const grain = fbm3(u * 11, k * 1.9, w * 11, 2, 3);
      const bandU = Math.abs(Math.abs(u) - W * 0.62) < V * 1.05 || Math.abs(Math.abs(u) - W * 0.24) < V * 1.05;
      let hex, opt;
      if (end && side) {
        hex = pickFrom(IRON, u, k, w, 6); opt = { j: 0.06, met: 0.82, rou: 0.36, seed: 6 };
      } else if (k === nH) {
        hex = pickFrom(IRON, u, k, w, 5); opt = { j: 0.06, met: 0.80, rou: 0.38, seed: 5 };
      } else if (side && bandU) {
        hex = pickFrom(IRON, u, k, w, 5); opt = { j: 0.06, met: 0.80, rou: 0.38, seed: 5 };
      } else if (k === 0) {
        hex = pickFrom(WOODB, u, k, w, 3); opt = { j: 0.08, rou: 0.93, seed: 1 };
      } else if (end) {
        const dia = Math.abs(k - nH * 0.5) / (nH * 0.5) + Math.abs(b) / nD;
        hex = dia < 0.48 ? pickFrom(WOODB, u, k, w, 4) : (dia < 1.0 ? pickFrom(WOOD, u, k, w, 4) : pickFrom(WOODB, u, k, w, 4));
        opt = { j: 0.10, rou: 0.88, seed: 4 };
      } else {
        hex = grain > 0.58 ? pickFrom(WOODB, u, k, w, 3) : pickFrom(WOOD, u, k, w, 3);
        opt = { j: 0.09, rou: grain > 0.58 ? 0.94 : 0.84, seed: 1 };
      }
      put(u, k * V, w, hex, opt);
    }
  }
  // ---- brass corner plates ----
  for (const su of [-1, 1]) for (const sw of [-1, 1]) {
    for (let k = 1; k <= 3; k++)
      put(su * W, k * V, sw * D, pickFrom(BRASS, su, k, sw, 7), { j: 0.05, met: 0.88, rou: 0.30, seed: 7 });
  }
  // ---- keyhole escutcheon + hasp on the front face ----
  const kEsc = Math.round(nH * 0.42);
  put(0, kEsc * V, D, BRASS[1], { j: 0.05, met: 0.9, rou: 0.28, seed: 8 });
  put(0, (kEsc + 1) * V, D, pickFrom(BRASS, 0, 1, D, 8), { j: 0.05, met: 0.9, rou: 0.28, seed: 8 });
  put(0, kEsc * V - V, D, pickFrom(BRASS, 0, 2, D, 8), { j: 0.05, met: 0.9, rou: 0.28, seed: 8 });
  put(0, (kEsc + 2) * V, D, 0x1a1712, { j: 0.05, met: 0.4, rou: 0.38 });
  // ---- open lid, hinged along the back top edge ----
  const ang = 1.72;
  const lc = Math.cos(ang), ls = Math.sin(ang);
  const nS = Math.max(5, Math.round(2 * D / V));
  for (let s = 0; s <= nS; s++) {
    const b = s * V;
    for (let a = -nU; a <= nU; a++) {
      const u = a * V;
      const crown = 0.028 * (1 - (u / W) * (u / W));
      const bandU = Math.abs(Math.abs(u) - W * 0.62) < V * 1.05 || Math.abs(Math.abs(u) - W * 0.24) < V * 1.05;
      const rim = (s === 0 || s === nS);
      for (let t = 0; t < 2; t++) {
        const off = t * 0.058;
        const gr = fbm3(u * 11, t * 3.1, b * 11, 2, 3);
        let hex, opt;
        if (bandU || rim) { hex = pickFrom(IRON, u, t, b, 6); opt = { j: 0.06, met: 0.80, rou: 0.38, seed: 6 }; }
        else {
          hex = gr > 0.58 ? pickFrom(WOODB, u, t, b, 3) : pickFrom(WOOD, u, t, b, 3);
          opt = { j: 0.09, rou: gr > 0.58 ? 0.94 : 0.84, seed: 1 };
        }
        put(u, Hh + crown + b * ls + off * lc, -D + b * lc - off * ls, hex, opt);
      }
    }
  }
  // hinge knuckles
  for (const su of [-3, 3]) for (let q = 1; q <= 2; q++)
    put(su * V, Hh + q * V * 0.2, -D - q * V, pickFrom(IRON, su, q, 1, 9), { j: 0.06, met: 0.84, rou: 0.34, seed: 9 });

  // ---- hoard: layered coins ----
  const COIN = { j: 0.10, met: 0.94, rou: 0.20, emi: 0xffb030, emiS: 0.62 };
  const coin = (u, v, w, hex, bump) => {
    const c = cell(u, v, w);
    for (const [da, db] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]])
      g.set(c[0] + da, c[1], c[2] + db, hex, COIN);
    if (bump) g.set(c[0], c[1] + 1, c[2], hex, COIN);
  };
  const IU = nU - 1, IW = nD - 1;
  for (let layer = 0; layer < 4; layer++) {
    const yl = 0.035 + layer * 0.052;
    const shrink = 1 - layer * 0.20;
    for (let a = -IU; a <= IU; a++) for (let b = -IW; b <= IW; b++) {
      if ((a * a) / (IU * IU) + (b * b) / (IW * IW) > shrink * shrink) continue;
      if (hash3(a, layer * 7, b, 21) < 0.22) continue;
      const jy = (hash3(a * 3, layer, b * 5, 23) - 0.5) * 0.016;
      coin(a * V, yl + jy, b * V, pickFrom(PAL_GOLD, a, layer, b, 7), hash3(a, layer, b, 29) > 0.55);
    }
  }
  // ---- gold bars ----
  for (let i = 0; i < 6; i++) {
    const ba = (hash1(i * 13 + 2) - 0.5) * 2 * (IU - 1.5);
    const bb = (hash1(i * 17 + 5) - 0.5) * 2 * (IW - 1.2);
    for (let da = -2; da <= 1; da++) for (let db = -1; db <= 0; db++) {
      if (Math.abs(ba + da) > IU || Math.abs(bb + db) > IW) continue;
      for (let k = 0; k < 2; k++)
        put((ba + da) * V, 0.205 + k * V, (bb + db) * V, pickFrom(PAL_GOLD, i, k, da, 11),
          { j: 0.09, met: 0.95, rou: 0.17, emi: 0xffc040, emiS: 0.55 });
    }
  }
  // ---- pearl strands draped over the heap ----
  for (let st = 0; st < 2; st++) {
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const aa = (-0.26 + t * 0.52) * (st ? 1 : 0.72);
      const bb = (st ? 0.02 : 0.13) + Math.sin(t * PI) * 0.05;
      const yy = 0.17 + Math.sin(t * PI) * (st ? 0.15 : 0.11);
      const c = cell(aa, yy, bb);
      g.set(c[0], c[1], c[2], 0xf6ecf0,
        { j: 0.04, met: 0.15, rou: 0.22, emi: 0xffd8e8, emiS: 0.45 });
    }
  }
  // ---- jewelled crown ----
  const cr = 0.085, cyy = 0.30;
  for (let q = 0; q < 14; q++) {
    const th = q / 14 * TAU, aa = Math.cos(th) * cr, bb = Math.sin(th) * cr;
    for (let k = 0; k <= 1; k++)
      put(aa, cyy + k * V, bb, k ? pickFrom(PAL_GOLD, q, 0, 0, 13) : 0xd8a838,
        { j: 0.06, met: 0.94, rou: 0.18, emi: 0xffc860, emiS: 0.5 });
  }
  for (let q = 0; q < 5; q++) {
    const th = q / 5 * TAU, aa = Math.cos(th) * cr, bb = Math.sin(th) * cr;
    for (let k = 2; k <= 3; k++)
      put(aa, cyy + k * V, bb, q % 2 ? 0xffe9a0 : 0xd8a838,
        { j: 0.06, met: 0.94, rou: 0.18, emi: 0xffc860, emiS: 0.55 });
    put(aa, cyy + 4 * V, bb, GEMS[q % GEMS.length],
      { j: 0.05, met: 0.1, rou: 0.07, emi: GEMS[q % GEMS.length], emiS: 1.2 });
  }
  // ---- gold goblet ----
  const ga = -0.19, gb = -0.05;
  for (let k = 0; k <= 1; k++) put(ga, cyy + k * V, gb, 0xd8a838, { j: 0.06, met: 0.94, rou: 0.2, emi: 0xffc860, emiS: 0.45 });
  for (let q = 0; q < 8; q++) {
    const th = q / 8 * TAU;
    put(ga + Math.cos(th) * 0.05, cyy + 2 * V, gb + Math.sin(th) * 0.05, 0xe6bd52,
      { j: 0.06, met: 0.94, rou: 0.18, emi: 0xffc860, emiS: 0.5 });
    put(ga + Math.cos(th) * 0.04, cyy - V, gb + Math.sin(th) * 0.04, 0xd8a838,
      { j: 0.06, met: 0.94, rou: 0.2, emi: 0xffc860, emiS: 0.4 });
  }
  // ---- cut gems ----
  for (let i = 0; i < 12; i++) {
    const aa = (hash1(i * 19 + 3) - 0.5) * 0.62, bb = (hash1(i * 23 + 7) - 0.5) * 0.36;
    const yy = 0.22 + hash1(i * 29 + 11) * 0.10;
    const hex = GEMS[i % GEMS.length];
    const c = cell(aa, yy, bb);
    const o = { j: 0.05, met: 0.1, rou: 0.06, emi: hex, emiS: 1.15 };
    g.set(c[0], c[1], c[2], hex, o);
    if (hash1(i * 31) > 0.45) g.set(c[0], c[1] + 1, c[2], hex, o);
  }
  // ---- spilled coins around the base ----
  for (let i = 0; i < 78; i++) {
    const ang = hash1(i * 7 + 3) * TAU;
    const rr = 0.40 + hash1(i * 13 + 7) * 0.54;
    const aa = Math.cos(ang) * rr, bb = Math.sin(ang) * rr * 0.78;
    const vv = -0.02 - hash1(i * 3) * 0.13;
    const c = cell(aa, vv, bb);
    if (!glassRoom(c[0] * V, c[1] * V, c[2] * V, 0.05)) continue;
    const hex = pickFrom(PAL_GOLD, i, 0, i * 3, 2);
    const cl = c[1];
    for (const [da, db] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]])
      g.set(c[0] + da, cl, c[2] + db, hex, { j: 0.10, met: 0.94, rou: 0.20, emi: 0xffa828, emiS: 0.55 });
    if (hash1(i * 37) > 0.62) g.set(c[0], cl - 1, c[2], hex, { j: 0.10, met: 0.94, rou: 0.20, emi: 0xffa828, emiS: 0.45 });
  }
  const lp = toW(0, 0.34, 0);
  return { lightPos: new THREE.Vector3(lp.x, lp.y, lp.z) };
}

// ------------------------------------------------------------
//  sunken admiralty anchor
// ------------------------------------------------------------
function buildAnchor(g, cx, cy, cz, rot, scale) {
  const V = g.vox;
  const cs = Math.cos(rot), sn = Math.sin(rot);
  const toW = (u, v, w) => ({ x: cx + u * cs - w * sn, y: cy + v, z: cz + u * sn + w * cs });
  const IRON = [0x35332f, 0x44413b, 0x26241f, 0x4f4b44];
  const RUST = [0x5a3f2c, 0x6b4a30, 0x4a3324];
  const BARN = [0xcfc3ad, 0xe0d6c0, 0xb8a891];
  const WEED = [0x2f6a4e, 0x3d7d58, 0x245540];
  const s = scale || 1;
  const put = (u, v, w, hex, o) => {
    const p = toW(u * s, v * s, w * s);
    g.set(Math.round(p.x / V), Math.round(p.y / V), Math.round(p.z / V), hex,
      o || { j: 0.09, met: 0.82, rou: 0.45, seed: 6 });
  };
  const iron = (u, v, w, seed) => put(u, v, w, pickFrom(IRON, Math.round(u * 40), Math.round(v * 40), Math.round(w * 40), seed),
    { j: 0.08, met: 0.84, rou: 0.44, seed });
  const growth = (u, v, w, seed) => {
    const n = hash3(Math.round(u * 60), Math.round(v * 60), Math.round(w * 60), seed);
    if (n > 0.88) put(u, v, w, pickFrom(BARN, u, v, w, seed), { j: 0.10, rou: 0.68, seed });
    else if (n < 0.14) put(u, v, w, pickFrom(WEED, u, v, w, seed), { j: 0.11, rou: 0.94, seed });
  };

  // ---- shank ----
  const kTop = 0.86, kBot = -0.54;
  for (let v = kBot; v <= kTop + 1e-6; v += V) {
    for (const [da, db] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const u = da * V, w = db * V;
      iron(u, v, w, 7);
      growth(u, v, w, 21);
    }
  }
  // ---- stock ----
  for (let w = -0.62; w <= 0.62 + 1e-6; w += V) {
    const taper = 1 - Math.abs(w / 0.62) * 0.35;
    for (const da of [-1, 0, 1]) iron(da * V, 0.60, w, 11);
    put(0, 0.60 + V * taper, w, pickFrom(IRON, 0, 2, w * 30, 11), { j: 0.08, met: 0.84, rou: 0.44, seed: 11 });
  }
  put(0, 0.60, 0.62 + V * 2, pickFrom(IRON, 1, 2, 3, 11), { j: 0.08, met: 0.85, rou: 0.4, seed: 11 });
  put(0, 0.60, -0.62 - V * 2, pickFrom(IRON, 2, 2, 3, 11), { j: 0.08, met: 0.85, rou: 0.4, seed: 11 });
  // ---- shackle + ring ----
  for (let q = 0; q < 26; q++) {
    const t = q / 26 * TAU;
    const u = Math.cos(t) * 0.085, v = 1.00 + Math.sin(t) * 0.085;
    iron(u, v, 0, 13);
    iron(u, v, V, 13);
  }
  for (let q = 0; q <= 10; q++) {
    const t = q / 10;
    put(0.055 - t * 0.11, 0.74 + Math.sin(t * PI) * 0.10, 0, pickFrom(IRON, q, 1, 0, 15), { j: 0.08, met: 0.84, rou: 0.44, seed: 15 });
    put(0.055 - t * 0.11, 0.74 + Math.sin(t * PI) * 0.10, V, pickFrom(IRON, q, 2, 0, 15), { j: 0.08, met: 0.84, rou: 0.44, seed: 15 });
  }
  // ---- crown ----
  blob(g, Math.round(cx / V), Math.round((cy + kBot * s) / V), Math.round(cz / V),
    0.075 * s / V, 0.070 * s / V, 0.075 * s / V, IRON[1], { j: 0.09, met: 0.84, rou: 0.46, seed: 6 });
  // ---- arms ----
  for (const side of [-1, 1]) {
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const ph = t * 1.62;
      const u = side * Math.sin(ph) * 0.90;
      const v = kBot + (1 - Math.cos(ph)) * 0.78;
      const thick = t > 0.82 ? 0.5 : 1;
      put(u, v, 0, pickFrom(IRON, i, side, 0, 17), { j: 0.08, met: 0.84, rou: 0.44, seed: 17 });
      put(u, v, V * thick, pickFrom(IRON, i, side, 1, 17), { j: 0.08, met: 0.84, rou: 0.44, seed: 17 });
      put(u, v, -V * thick, pickFrom(IRON, i, side, 2, 17), { j: 0.08, met: 0.84, rou: 0.44, seed: 17 });
      growth(u, v, V * thick, 19);
    }
    // fluke plate
    const fu = side * 0.899, fv = 0.278;
    for (let du = -3; du <= 3; du++) for (let dv = -3; dv <= 3; dv++) {
      const q = Math.hypot(du * 0.8, dv);
      if (q > 3.1 || (du * side < -1 && dv < 0)) continue;
      for (const dw of [-V, V])
        put(fu + du * V, fv + dv * V, dw, pickFrom(IRON, du, dv, side, 19), { j: 0.08, met: 0.86, rou: 0.4, seed: 19 });
    }
    growth(fu - side * 2 * V, fv - 2 * V, V * side, 23);
  }
  // ---- cable running off toward the shallows ----
  const p0 = toW(0, 1.06 * s, 0);
  const p1 = { x: cx + 1.70, y: cy + 1.80, z: cz - 0.60 };
  g.rope(Math.round(p0.x / V), Math.round(p0.y / V), Math.round(p0.z / V),
    Math.round(p1.x / V), Math.round(p1.y / V), Math.round(p1.z / V), 5,
    pickFrom(RUST, 1, 2, 3, 25), { j: 0.11, rou: 0.96, seed: 25 });
  return null;
}

// ------------------------------------------------------------
//  amphora
// ------------------------------------------------------------
function buildAmphora(g, cx, cy, cz, yaw, tilt, scale, seed) {
  const V = g.vox;
  const s = scale || 1;
  const CLAY = [0xb5703f, 0xa3623a, 0xc47e49, 0x8f5432, 0xcb8a55];
  const DECO = [0x3a3228, 0x4a4034, 0x2c2620];
  const BARN = [0xd6c9b2, 0xbfae94, 0xe4d8c4];
  const WEED = [0x2f6a4e, 0x3d7d58, 0x245540];
  const fit = glassPull(cx, cy, cz, 0.34 * s);
  if (!fit) return;
  const YC = fit[0], ZC = fit[1];
  const H = 0.74 * s;
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const xf = (lx, ly, lz) => {
    const x1 = lx * ct - ly * st;
    const y1 = lx * st + ly * ct;
    return [cx + x1 * cyw - lz * syw, YC + y1, ZC + x1 * syw + lz * cyw];
  };
  // pointed foot -> belly -> shoulder -> neck -> flared lip
  const prof = (t) => {
    let r;
    if (t < 0.10) r = 0.016 + t / 0.10 * 0.046;
    else if (t < 0.32) r = 0.062 + Math.sin((t - 0.10) / 0.22 * PI * 0.5) * 0.142;
    else if (t < 0.58) r = 0.204 - Math.sin((t - 0.32) / 0.26 * PI * 0.5) * 0.056;
    else if (t < 0.80) r = 0.148 - (t - 0.58) / 0.22 * 0.086;
    else if (t < 0.92) r = 0.062 + (t - 0.80) / 0.12 * 0.010;
    else r = 0.072 + (t - 0.92) / 0.08 * 0.048;
    return r * s;
  };
  const N = 32;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const rr = prof(t);
    if (rr < 0.005) continue;
    const ly = t * H - H * 0.5;
    const steps = Math.max(8, Math.round(rr / V * 6.2));
    for (let a = 0; a < steps; a++) {
      const th = a / steps * TAU;
      const lz = Math.cos(th) * rr, lx = Math.sin(th) * rr;
      const n = fbm3(lx * 7, ly * 7, lz * 7, 2, seed);
      const enc = fbm3(lx * 14 + 4, ly * 12, lz * 14, 2, seed + 40);
      let col, rou = 0.88;
      if (t > 0.40 && t < 0.50) { col = n > 0.5 ? DECO[0] : DECO[1]; rou = 0.62; }
      else if (enc > 0.64) { col = pickFrom(BARN, lx, ly, lz, seed); rou = 0.70; }
      else if (enc < 0.38) { col = pickFrom(WEED, lx, ly, lz, seed + 3); rou = 0.94; }
      else col = n > 0.62 ? 0x8f5432 : (n < 0.38 ? 0xcb8a55 : CLAY[Math.floor(hash3(a, i, 0, seed) * CLAY.length)]);
      const P = xf(lx, ly, lz);
      g.set(Math.round(P[0] / V), Math.round(P[1] / V), Math.round(P[2] / V), col, { j: 0.09, rou, seed });
      const P2 = xf(lx * 0.80, ly, lz * 0.80);
      g.set(Math.round(P2[0] / V), Math.round(P2[1] / V), Math.round(P2[2] / V), 0x50331f, { j: 0.07, rou: 0.94, seed });
      if (enc > 0.80 && t > 0.12 && t < 0.74) {
        const P3 = xf(lx * 1.11, ly, lz * 1.11);
        g.set(Math.round(P3[0] / V), Math.round(P3[1] / V), Math.round(P3[2] / V),
          pickFrom(BARN, lx, ly, lz, seed + 7), { j: 0.10, rou: 0.68, seed });
      }
    }
  }
  // pointed toe below the foot
  for (let k = 1; k <= 2; k++) {
    const P = xf(0, -H * 0.5 - k * V * 0.9, 0);
    g.set(Math.round(P[0] / V), Math.round(P[1] / V), Math.round(P[2] / V), 0x8f5432, { j: 0.09, rou: 0.9, seed });
  }
  // two handles spanning shoulder to lip
  for (const side of [-1, 1]) {
    for (let i = 0; i <= 14; i++) {
      const t = i / 14;
      const bulge = Math.sin(t * PI);
      const ly = 0.22 * H + t * 0.25 * H;
      const lz = side * (0.115 * s + bulge * 0.078 * s);
      for (const [da, db] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const P = xf(da * V, ly + db * V, lz);
        g.set(Math.round(P[0] / V), Math.round(P[1] / V), Math.round(P[2] / V),
          CLAY[Math.floor(hash3(i, da, db, seed) * CLAY.length)], { j: 0.09, rou: 0.87, seed });
      }
    }
  }
  // dark oily interior just under the lip
  const Pm = xf(0, H * 0.42, 0);
  blob(g, Math.round(Pm[0] / V), Math.round(Pm[1] / V), Math.round(Pm[2] / V),
    0.012 / V + 1.4, 0.9, 0.012 / V + 1.4, 0x241c14,
    { j: 0.05, met: 0.25, rou: 0.34, seed });
}

// ------------------------------------------------------------
//  coral reef builders
// ------------------------------------------------------------
function coralBranchy(g, cx, cy, cz, h, col, seed, thick) {
  const V = g.vox;
  const stack = [];
  stack.push({ x: cx, y: cy, z: cz, dx: 0, dy: 1, dz: 0, len: h, r: thick, d: 0 });
  let guard = 0;
  while (stack.length && guard++ < 900) {
    const b = stack.pop();
    const steps = Math.max(2, Math.round(b.len / V));
    let px = b.x, py = b.y, pz = b.z;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      px += b.dx * V; py += b.dy * V; pz += b.dz * V;
      const r = b.r * (1 - t * 0.45);
      const R = Math.max(1, Math.round(r / V));
      for (let a = -R; a <= R; a++) for (let bb = -R; bb <= R; bb++) for (let c = -R; c <= R; c++) {
        if (a * a + bb * bb + c * c > R * R + 1) continue;
        const n = hash3(Math.round(px * 30) + a, Math.round(py * 30) + bb, Math.round(pz * 30) + c, seed);
        const cc = n > 0.72 ? col.tip : (n > 0.28 ? col.main : col.dark);
        g.set(Math.round(px / V) + a, Math.round(py / V) + bb, Math.round(pz / V) + c, cc,
          { j: 0.09, rou: 0.82, seed, emi: col.emi, emiS: col.emiS || 0.15 });
      }
    }
    if (b.d < 3) {
      const nB = 2 + (hash3(Math.round(px * 20), b.d, Math.round(pz * 20), seed) > 0.45 ? 1 : 0);
      for (let k = 0; k < nB; k++) {
        const a = hash3(k * 13, b.d * 7, seed, 5) * TAU;
        const spread = 0.42 + hash3(k * 7, seed, b.d, 9) * 0.55;
        let nx = b.dx + Math.cos(a) * spread, ny = b.dy * 0.86 + 0.16, nz = b.dz + Math.sin(a) * spread;
        const L = Math.hypot(nx, ny, nz) || 1;
        stack.push({ x: px, y: py, z: pz, dx: nx / L, dy: ny / L, dz: nz / L,
          len: b.len * (0.60 + hash3(k, b.d, seed, 11) * 0.14),
          r: b.r * 0.72, d: b.d + 1 });
      }
    }
  }
}

function coralFan(g, cx, cy, cz, r, col, seed) {
  const V = g.vox;
  const ang0 = hash1(seed) * TAU;
  const tilt = (hash1(seed + 1) - 0.5) * 0.5;
  const N = 15;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const a = ang0 + (t - 0.5) * 1.9;
    const len = r * (1 - Math.abs(t - 0.5) * 0.55);
    const steps = Math.round(len / V);
    for (let s = 0; s <= steps; s++) {
      const u = s / steps;
      const px = cx + Math.cos(a) * u * len * Math.cos(tilt);
      const pz = cz + Math.sin(a) * u * len * Math.cos(tilt);
      const py = cy + u * len * Math.sin(tilt) + Math.sin(u * PI) * 0.05;
      const thick = (1 - u * 0.6) * 1.4;
      const R = Math.max(0, Math.round(thick));
      for (let bb = -R; bb <= R; bb++)
        g.set(Math.round(px / V), Math.round(py / V) + bb, Math.round(pz / V),
          bb === 0 ? col.main : (bb > 0 ? col.tip : col.dark), { j: 0.10, rou: 0.84, seed, emi: col.emi, emiS: 0.1 });
    }
  }
}

function coralBrain(g, cx, cy, cz, r, col, seed) {
  const V = g.vox;
  const R = Math.round(r / V);
  for (let a = -R; a <= R; a++) for (let b = -R; b <= R; b++) for (let c = -R; c <= R; c++) {
    const d = Math.sqrt(a * a + b * b * 1.55 + c * c);
    if (d > R) continue;
    if (d < R - 1.6) continue;
    const w = fbm3(a * 0.5, b * 0.9, c * 0.5, 3, seed);
    const col2 = w > 0.58 ? col.tip : (w > 0.42 ? col.main : col.dark);
    g.set(Math.round(cx / V) + a, Math.round(cy / V) + b, Math.round(cz / V) + c, col2,
      { j: 0.08, rou: 0.86, seed, emi: col.emi, emiS: 0.12 });
  }
}

function coralTubes(g, cx, cy, cz, n, col, seed, hMax) {
  const V = g.vox;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + hash1(seed + i) * 0.6;
    const rr = 0.035 + hash1(seed * 3 + i) * 0.06;
    const h = 0.10 + hash1(seed * 7 + i) * hMax;
    const bx = cx + Math.cos(a) * (0.02 + hash1(seed + i * 5) * 0.14);
    const bz = cz + Math.sin(a) * (0.02 + hash1(seed + i * 5) * 0.14);
    const steps = Math.round(h / V);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const rad = rr * (1 - t * 0.22);
      const Rr = Math.max(1, Math.round(rad / V));
      for (let dx = -Rr; dx <= Rr; dx++) for (let dz = -Rr; dz <= Rr; dz++) {
        if (dx * dx + dz * dz > Rr * Rr) continue;
        const rim = (dx * dx + dz * dz) > (Rr - 1) * (Rr - 1);
        g.set(Math.round(bx / V) + dx, Math.round((cy + t * h) / V), Math.round(bz / V) + dz,
          rim ? col.tip : col.main, { j: 0.09, rou: 0.83, seed, emi: col.emi, emiS: 0.12 });
      }
    }
    // glowing mouth
    g.set(Math.round(bx / V), Math.round((cy + h) / V), Math.round(bz / V), col.tip,
      { j: 0.03, rou: 0.5, emi: col.emi || 0xffd090, emiS: 0.9 });
  }
}

// --- table / plate coral ---
function coralTable(g, cx, cy, cz, r, col, seed) {
  const V = g.vox;
  const hy = 0.09 + hash1(seed) * 0.15;
  const st = Math.max(2, Math.round(hy / V));
  for (let s = 0; s <= st; s++)
    g.set(Math.round(cx / V), Math.round((cy + s * V) / V), Math.round(cz / V), col.dark,
      { j: 0.09, rou: 0.87, seed });
  const ci = Math.round(cx / V), cj = Math.round(cz / V), ck = Math.round((cy + hy) / V);
  const R = r / V, M = Math.ceil(R) + 1;
  for (let a = -M; a <= M; a++) for (let b = -M; b <= M; b++) {
    const d = Math.hypot(a, b);
    if (d > R) continue;
    const th = Math.atan2(b, a);
    if (d > R * (1 + Math.sin(th * 3 + seed) * 0.15)) continue;
    const k = ck + Math.round(Math.sin(th * 2.3 + seed * 0.7) * 1.2);
    const edge = d > R * 0.74;
    g.set(ci + a, k, cj + b, edge ? col.tip : col.main,
      { j: 0.09, rou: 0.84, seed, emi: col.emi, emiS: edge ? 0.26 : 0.12 });
  }
}

// --- staghorn thicket ---
function staghornArm(g, cx, cy, cz, a, lean, h, col, seed) {
  const V = g.vox;
  const st = Math.max(3, Math.round(h / V));
  const ca = Math.cos(a), sa = Math.sin(a);
  for (let s = 0; s <= st; s++) {
    const t = s / st;
    const rr = lean * h * t * t;
    const x = cx + ca * rr, z = cz + sa * rr, y = cy + h * t;
    const w = t < 0.55 ? 1 : 0;
    for (let d = -w; d <= w; d++) {
      const n = hash3(Math.round(x * 40), s, d, seed);
      g.set(Math.round(x / V) + d, Math.round(y / V), Math.round(z / V),
        t > 0.78 ? col.tip : (n > 0.72 ? col.dark : col.main),
        { j: 0.10, rou: 0.85, seed, emi: col.emi, emiS: t > 0.78 ? 0.28 : 0.1 });
    }
  }
}
function coralStaghorn(g, cx, cy, cz, h, col, seed) {
  const nB = 4 + Math.floor(hash1(seed) * 4);
  for (let i = 0; i < nB; i++) {
    const a = (i / nB) * TAU + hash1(seed * 3 + i) * 0.9;
    const lean = 0.25 + hash1(seed * 5 + i) * 0.45;
    const hh = h * (0.55 + hash1(seed * 11 + i) * 0.6);
    staghornArm(g, cx, cy, cz, a, lean, hh, col, seed + i * 17);
    if (hash1(seed * 13 + i) > 0.34) {
      const rr = lean * hh * 0.30;
      for (const sw of [-1, 1])
        staghornArm(g, cx + Math.cos(a) * rr, cy + hh * 0.55, cz + Math.sin(a) * rr,
          a + sw * 0.55, lean * 0.72, hh * 0.5, col, seed + i * 17 + sw * 7);
    }
  }
}

// --- whip corals ---
function coralWhip(g, cx, cy, cz, h, col, seed) {
  const V = g.vox;
  const nW = 2 + Math.floor(hash1(seed) * 3);
  for (let i = 0; i < nW; i++) {
    const a = hash1(seed * 5 + i) * TAU;
    const bend = 0.35 + hash1(seed * 7 + i) * 0.55;
    const hh = h * (0.6 + hash1(seed * 11 + i) * 0.5);
    const ca = Math.cos(a), sa = Math.sin(a);
    const st = Math.max(3, Math.round(hh / V));
    for (let s = 0; s <= st; s++) {
      const t = s / st;
      const rr = bend * hh * t * t;
      const x = Math.round((cx + ca * rr) / V), z = Math.round((cz + sa * rr) / V), y = Math.round((cy + hh * t) / V);
      g.set(x, y, z, t > 0.66 ? col.tip : (t < 0.2 ? col.dark : col.main),
        { j: 0.10, rou: 0.86, seed: i, emi: col.emi, emiS: t > 0.66 ? 0.3 : 0.1 });
      if (t < 0.3) g.set(x, y, z + 1, col.dark, { j: 0.10, rou: 0.86, seed: i });
    }
  }
}

// --- tube sponge cluster ---
function coralSponge(g, cx, cy, cz, n, col, seed, hMax) {
  const V = g.vox;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + hash1(seed + i * 3) * 0.5;
    const rr = 0.04 + hash1(seed * 5 + i) * 0.11;
    const bx = cx + Math.cos(a) * rr, bz = cz + Math.sin(a) * rr;
    const h = 0.10 + hash1(seed * 7 + i) * hMax;
    const st = Math.max(2, Math.round(h / V));
    for (let s = 0; s <= st; s++) {
      const t = s / st;
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
        const dd = dx * dx + dz * dz;
        if (dd > 1) continue;
        g.set(Math.round(bx / V) + dx, Math.round((cy + t * h) / V), Math.round(bz / V) + dz,
          dd === 0 && s < st ? col.dark : col.main,
          { j: 0.09, rou: 0.84, seed, emi: col.emi, emiS: 0.1 });
      }
    }
    g.set(Math.round(bx / V), Math.round((cy + h) / V), Math.round(bz / V), col.tip,
      { j: 0.04, rou: 0.55, emi: col.tip, emiS: 0.8 });
  }
}

// --- anemone ---
function coralAnemone(g, cx, cy, cz, r, col, seed) {
  const V = g.vox;
  const base = Math.max(1, Math.round(r / V * 0.5));
  blob(g, Math.round(cx / V), Math.round(cy / V), Math.round(cz / V), base + 0.6, base * 0.7, base + 0.6,
    col.dark, { j: 0.10, rou: 0.88, seed });
  const nT = 11 + Math.floor(hash1(seed) * 6);
  for (let i = 0; i < nT; i++) {
    const a = i / nT * TAU + hash1(seed + i) * 0.5;
    const rr = r * (0.45 + hash1(seed * 3 + i) * 0.6);
    const hh = r * (0.85 + hash1(seed * 5 + i) * 0.8);
    for (let s = 1; s <= 3; s++) {
      const t = s / 3;
      const rad = rr * (0.35 + t * 0.75);
      g.set(Math.round((cx + Math.cos(a) * rad) / V),
        Math.round((cy + base * V * 0.5 + hh * t * t) / V),
        Math.round((cz + Math.sin(a) * rad) / V),
        t > 0.72 ? col.tip : col.main,
        { j: 0.09, rou: 0.82, seed, emi: col.emi, emiS: t > 0.72 ? 0.45 : 0.14 });
    }
  }
}

// --- latticed sea fan ---
function coralLattice(g, cx, cy, cz, r, col, seed) {
  const V = g.vox;
  const a0 = hash1(seed) * TAU;
  const c0 = Math.cos(a0), s0 = Math.sin(a0);
  const nW = Math.max(3, Math.round(r / V)), nH = Math.max(3, Math.round(r * 1.25 / V));
  for (let k = 0; k < Math.max(1, Math.round(r * 0.55 / V)); k++)
    g.set(Math.round(cx / V), Math.round((cy + k * V) / V), Math.round(cz / V), col.dark,
      { j: 0.10, rou: 0.88, seed });
  for (let i = -nW; i <= nW; i++) for (let j = 0; j <= nH; j++) {
    const u = i / nW, v = j / nH;
    const d = Math.hypot(u, (v - 0.08) / 1.04);
    if (d > 1) continue;
    if (v < 0.20 && Math.abs(u) > 0.44) continue;
    const rib = Math.abs(((i + nW * 3) % 3) - 1) < 0.6;
    const arc = Math.abs(((j + 2) % 3) - 1) < 0.6;
    const n = fbm3(i * 0.9, j * 0.9, seed * 0.1, 2, seed);
    if (!rib && !arc && n < 0.62) continue;
    const w = u * r;
    const lx = Math.round((cx - s0 * w + c0 * (0.22 * v * r)) / V);
    const lz = Math.round((cz + c0 * w + s0 * (0.22 * v * r)) / V);
    const ly = Math.round((cy + v * r * 1.2) / V);
    const hex = d > 0.86 ? col.tip : (n > 0.6 ? col.dark : col.main);
    g.set(lx, ly, lz, hex, { j: 0.10, rou: 0.85, seed, emi: col.emi, emiS: d > 0.86 ? 0.22 : 0.1 });
    if (rib) g.set(lx + Math.round(c0), ly, lz + Math.round(s0), hex,
      { j: 0.10, rou: 0.85, seed, emi: col.emi, emiS: 0.1 });
  }
}

// --- soft coral cluster ---
function coralSoft(g, cx, cy, cz, n, col, seed) {
  const V = g.vox;
  for (let i = 0; i < n; i++) {
    const a = hash1(seed * 3 + i) * TAU;
    const rr = 0.03 + hash1(seed * 5 + i) * 0.12;
    const x = Math.round((cx + Math.cos(a) * rr) / V), z = Math.round((cz + Math.sin(a) * rr) / V);
    const h = 0.05 + hash1(seed * 7 + i) * 0.13;
    const st = Math.max(1, Math.round(h / V));
    for (let s = 1; s <= st; s++)
      g.set(x, Math.round((cy + s * V) / V), z, col.dark, { j: 0.10, rou: 0.88, seed });
    blob(g, x, Math.round((cy + h + V * 0.5) / V), z, 1.4, 1.6, 1.4, col.main,
      { j: 0.10, rou: 0.84, seed, emi: col.emi, emiS: 0.16 });
    g.set(x, Math.round((cy + h + V * 2.2) / V), z, col.tip,
      { j: 0.08, rou: 0.80, seed, emi: col.emi, emiS: 0.32 });
  }
}

// --- small supporting reef bits ---
function reefRock(g, x, y, z, r, seed) {
  const V = g.vox;
  const R = r / V, M = Math.ceil(R);
  const ci = Math.round(x / V), ck = Math.round(y / V), cj = Math.round(z / V);
  const pal = [0x40474a, 0x353c40, 0x4b5356, 0x585043, 0x3a4245];
  for (let a = -M; a <= M; a++) for (let b = -M; b <= M; b++) for (let c = -M; c <= M; c++) {
    const d = Math.sqrt(a * a + b * b * 1.7 + c * c);
    if (d > R) continue;
    const n = fbm3(a * 0.8, b * 1.2, c * 0.8, 2, seed);
    if (d > R * 0.72 || n > 0.5)
      g.set(ci + a, ck + b, cj + c, pickFrom(pal, a, b, c, seed), { j: 0.11, rou: 0.95, seed });
  }
}

function reefUrchin(g, x, y, z, r, seed) {
  const V = g.vox;
  const col = pickFrom([0x2a2a3a, 0x3a2a3a, 0x1e2a2e, 0x3a3026], x, y, z, seed);
  const rr = Math.max(r / V, 0.95);
  blob(g, Math.round(x / V), Math.round(y / V), Math.round(z / V), rr, rr * 0.8, rr,
    col, { j: 0.08, rou: 0.72, seed });
  for (let i = 0; i < 12; i++) {
    const sa = hash1(seed * 17 + i) * TAU, sb = Math.acos(1 - 2 * hash1(seed * 23 + i));
    const dx = Math.sin(sb) * Math.cos(sa), dy = Math.cos(sb), dz = Math.sin(sb) * Math.sin(sa);
    for (let q = 1; q <= 3; q++) {
      const sr = r * (0.8 + q * 0.3);
      g.set(Math.round((x + dx * sr) / V), Math.round((y + dy * sr) / V), Math.round((z + dz * sr) / V),
        col, { j: 0.10, rou: 0.70, seed });
    }
  }
}

function reefShell(g, x, y, z, r, seed) {
  const V = g.vox;
  const col = pickFrom([0xf0dcc0, 0xe0c49a, 0xf7e8d4, 0xdfc8b0], x, y, z, seed);
  const a0 = hash1(seed) * TAU;
  const nD = Math.max(3, Math.round(r / V)), nA = 8;
  const ci = Math.round(x / V), cj = Math.round(z / V), ck = Math.round(y / V);
  for (let j = 0; j <= nD; j++) for (let i = 0; i < nA; i++) {
    const t = j / nD;
    const ang = a0 + (i / (nA - 1) - 0.5) * 1.85 * (0.4 + t * 0.7);
    const dd = r * t;
    const rib = (i % 2) === 0;
    g.set(Math.round((x + Math.cos(ang) * dd) / V), ck + (rib ? 1 : 0) + Math.round(t * 1.2),
      Math.round((z + Math.sin(ang) * dd) / V), rib ? col : 0xd8c0a0,
      { j: 0.08, met: 0.1, rou: 0.55, seed });
  }
  g.set(ci, ck, cj, 0xc8b090, { j: 0.08, rou: 0.6, seed });
}

// ------------------------------------------------------------
//  coral reef gardens — shelf / mid / deep strata
// ------------------------------------------------------------
function buildReef(g) {
  const V = g.vox;

  // ---- 1. bright shallow shelf hugging the island ----
  for (let i = 0; i < 26; i++) {
    const a = hash1(i * 17 + 3) * TAU;
    const rr = ISLE.r * (1.22 + hash1(i * 29 + 5) * 0.72);
    const x = ISLE.x + Math.cos(a) * rr * 1.10;
    const z = ISLE.z + Math.sin(a) * rr;
    const y = -1.55 - hash1(i * 43 + 9) * 0.80;
    const rad = 0.40 + hash1(i * 13) * 0.34;
    if (Math.hypot(x - ISLE.x, z - ISLE.z) < ISLE.r * 1.24) continue;
    if (!glassRoom(x, y, z, rad)) continue;
    const col = CORAL_SPIKES[Math.floor(hash1(i * 3 + 1) * CORAL_SPIKES.length)];
    const kind = Math.floor(hash1(i * 41 + 7) * 9);
    if (kind === 0 || kind === 1) coralTable(g, x, y, z, 0.11 + hash1(i * 5) * 0.13, col, i + 610);
    else if (kind === 2) coralStaghorn(g, x, y, z, 0.26 + hash1(i * 7) * 0.30, col, i + 630);
    else if (kind === 3) coralAnemone(g, x, y, z, 0.09 + hash1(i * 11) * 0.07, col, i + 640);
    else if (kind === 4) coralSponge(g, x, y, z, 3 + Math.floor(hash1(i * 19) * 3), col, i + 650, 0.15);
    else if (kind === 5) coralBrain(g, x, y + 0.05, z, 0.10 + hash1(i * 23) * 0.07, col, i + 660);
    else if (kind === 6) coralSoft(g, x, y, z, 5 + Math.floor(hash1(i * 31) * 3), col, i + 670);
    else if (kind === 7) coralBranchy(g, x, y, z, 0.22 + hash1(i) * 0.26, col, i + 680, 0.030);
    else coralTubes(g, x, y, z, 4 + Math.floor(hash1(i * 37) * 4), col, i + 690, 0.15);
    if (hash1(i * 53) > 0.58) reefRock(g, x, y - rad * 0.55, z, 0.07 + hash1(i * 59) * 0.06, i + 700);
    if (hash1(i * 61) > 0.72) reefUrchin(g, x + 0.16, y + 0.04, z - 0.10, 0.05, i + 710);
  }

  // ---- 2. mid band: dense mixed growth ----
  for (let i = 0; i < 32; i++) {
    const p = deepSpot(i, 300, -3.35, -2.60, 0.60, ISLE.r * 1.30);
    if (!p) continue;
    const x = p[0], y = p[1], z = p[2];
    const col = CORAL_SPIKES[Math.floor(hash1(i * 9 + 4) * CORAL_SPIKES.length)];
    const kind = Math.floor(hash1(i * 53 + 11) * 11);
    if (kind === 0) coralBranchy(g, x, y, z, 0.28 + hash1(i * 3) * 0.34, col, i + 310, 0.036);
    else if (kind === 1) coralStaghorn(g, x, y, z, 0.30 + hash1(i * 5) * 0.32, col, i + 320);
    else if (kind === 2) coralLattice(g, x, y, z, 0.16 + hash1(i * 7) * 0.12, col, i + 330);
    else if (kind === 3) coralWhip(g, x, y, z, 0.42 + hash1(i * 11) * 0.34, col, i + 340);
    else if (kind === 4) coralSponge(g, x, y, z, 4 + Math.floor(hash1(i * 13) * 4), col, i + 350, 0.20);
    else if (kind === 5) coralAnemone(g, x, y, z, 0.10 + hash1(i * 17) * 0.08, col, i + 360);
    else if (kind === 6) coralFan(g, x, y, z, 0.24 + hash1(i * 19) * 0.20, col, i + 370);
    else if (kind === 7) coralTable(g, x, y, z, 0.12 + hash1(i * 23) * 0.14, col, i + 380);
    else if (kind === 8) coralSoft(g, x, y, z, 6 + Math.floor(hash1(i * 29) * 4), col, i + 390);
    else if (kind === 9) coralBrain(g, x, y + 0.06, z, 0.11 + hash1(i * 31) * 0.09, col, i + 400);
    else coralTubes(g, x, y, z, 5 + Math.floor(hash1(i * 37) * 5), col, i + 410, 0.22);
    if (hash1(i * 43) > 0.55) reefRock(g, x, y - 0.20, z, 0.08 + hash1(i * 47) * 0.07, i + 420);
  }

  // ---- 3. deep: sparse tall silhouettes ----
  for (let i = 0; i < 22; i++) {
    const p = deepSpot(i, 700, -4.20, -3.55, 0.72, ISLE.r * 1.24);
    if (!p) continue;
    const x = p[0], y = p[1], z = p[2];
    const col = CORAL_SPIKES[Math.floor(hash1(i * 21 + 8) * CORAL_SPIKES.length)];
    const kind = Math.floor(hash1(i * 67 + 13) * 7);
    if (kind === 0) coralWhip(g, x, y, z, 0.50 + hash1(i * 3) * 0.36, col, i + 710);
    else if (kind === 1) coralLattice(g, x, y, z, 0.20 + hash1(i * 7) * 0.16, col, i + 720);
    else if (kind === 2) coralBrain(g, x, y + 0.07, z, 0.13 + hash1(i * 11) * 0.10, col, i + 730);
    else if (kind === 3) coralBranchy(g, x, y, z, 0.26 + hash1(i * 13) * 0.30, col, i + 740, 0.034);
    else if (kind === 4) coralSoft(g, x, y, z, 5 + Math.floor(hash1(i * 17) * 4), col, i + 750);
    else if (kind === 5) coralTubes(g, x, y, z, 4 + Math.floor(hash1(i * 19) * 5), col, i + 760, 0.24);
    else coralFan(g, x, y, z, 0.22 + hash1(i * 23) * 0.20, col, i + 770);
    if (hash1(i * 29) > 0.40) reefRock(g, x, y - 0.22, z, 0.09 + hash1(i * 31) * 0.08, i + 780);
  }

  // ---- 4. growth clinging to the island's submerged flank ----
  for (let i = 0; i < 20; i++) {
    const a = hash1(i * 61 + 3) * TAU;
    const rr = ISLE.r * (1.10 + hash1(i * 43 + 7) * 0.62);
    const x = ISLE.x + Math.cos(a) * rr * 1.10;
    const z = ISLE.z + Math.sin(a) * rr;
    const y = -2.30 - hash1(i * 29 + 11) * 1.70;
    const rad = 0.44 + hash1(i * 17 + 5) * 0.30;
    if (!glassRoom(x, y, z, rad)) continue;
    const col = CORAL_SPIKES[(i + 5) % CORAL_SPIKES.length];
    const kind = Math.floor(hash1(i * 71 + 9) * 8);
    if (kind === 0) reefRock(g, x, y, z, 0.10 + hash1(i * 3) * 0.10, i + 800);
    else if (kind === 1) coralSponge(g, x, y + 0.06, z, 4 + Math.floor(hash1(i * 5) * 3), col, i + 810, 0.18);
    else if (kind === 2) coralAnemone(g, x, y + 0.04, z, 0.09 + hash1(i * 7) * 0.07, col, i + 820);
    else if (kind === 3) coralFan(g, x, y, z, 0.22 + hash1(i * 11) * 0.18, col, i + 830);
    else if (kind === 4) coralLattice(g, x, y, z, 0.15 + hash1(i * 13) * 0.12, col, i + 840);
    else if (kind === 5) coralBranchy(g, x, y, z, 0.20 + hash1(i * 19) * 0.24, col, i + 850, 0.028);
    else if (kind === 6) coralSoft(g, x, y, z, 5 + Math.floor(hash1(i * 23) * 3), col, i + 860);
    else coralTubes(g, x, y, z, 4 + Math.floor(hash1(i * 31) * 4), col, i + 870, 0.17);
  }

  // ---- 5. small supporting life between the gardens ----
  for (let i = 0; i < 24; i++) {
    const p = deepSpot(i, 900, -4.20, -2.60, 0.26, ISLE.r * 1.28);
    if (!p) continue;
    const x = p[0], y = p[1], z = p[2];
    const kind = Math.floor(hash1(i * 71 + 5) * 4);
    if (kind === 0) reefRock(g, x, y, z, 0.07 + hash1(i * 13) * 0.09, i + 910);
    else if (kind === 1) reefUrchin(g, x, y, z, 0.045 + hash1(i * 17) * 0.03, i + 920);
    else if (kind === 2) reefShell(g, x, y, z, 0.06 + hash1(i * 19) * 0.05, i + 930);
    else coralSoft(g, x, y, z, 3 + Math.floor(hash1(i * 23) * 3),
      CORAL_SPIKES[Math.floor(hash1(i * 27) * CORAL_SPIKES.length)], i + 940);
  }
}

// ------------------------------------------------------------
//  kelp forest / sea-grass that sways in the current
// ------------------------------------------------------------
function buildKelp(g) {
  const V = g.vox;
  const KELP = [0x2f7a52, 0x26674a, 0x3f9a63, 0x1d5340, 0x4fae6e];
  const BLADE = [0x3f9a63, 0x4fae6e, 0x57b877, 0x357f55, 0x2d6b48];
  const BULB = [0x8fae4a, 0x7c9c3e, 0xa8c05e];
  const GRASS = [0x4f9a4a, 0x62a854, 0x3f8038, 0x76b862];
  const fits = (x, y0, z0, h, spread) => {
    const R = Math.min(bottleInnerRadius(x - spread), bottleInnerRadius(x), bottleInnerRadius(x + spread));
    const m = spread + 0.17;
    if (R <= m) return false;
    if (Math.hypot(y0, z0) > R - m) return false;
    const sway = 0.010 + 0.55 * h * h;
    if (Math.hypot(y0 + h, z0 + sway * 0.8) > R - m) return false;
    return true;
  };

  // ---- kelp clumps: deep corridor + island flank ----
  const clump = (x0, z0, y0, hBase, nS, cs, spread) => {
    for (let k = 0; k < nS; k++) {
      const h = hBase * (0.50 + hash1(cs * 53 + k * 3) * 0.80);
      const bx = x0 + (hash1(cs * 17 + k) - 0.5) * 0.30;
      const bz = z0 + (hash1(cs * 29 + k) - 0.5) * 0.26;
      const by = y0 + hash1(cs * 61 + k) * 0.12;
      if (!fits(bx, by, bz, h, spread)) continue;
      const ph = hash1(cs * 41 + k * 7) * TAU;
      const st = Math.max(3, Math.round(h / V));
      for (let s = 0; s <= st; s++) {
        const t = s / st;
        const wdt = (1 - t) * (0.5 + hash1(cs * 5 + k) * 1.2) + 0.22;
        const R = Math.max(0, Math.round(wdt * 0.75));
        const lean = Math.sin(t * 1.7 + ph) * 0.09 * t;
        const px = Math.round((bx + lean) / V), pz = Math.round((bz + lean * 0.4) / V);
        for (let d = -R; d <= R; d++) {
          g.set(px + d, Math.round((by + t * h) / V), pz,
            KELP[Math.floor(hash3(s, d, cs * 13 + k, 2) * KELP.length)],
            { j: 0.11, rou: 0.95, seed: cs * 7 + k, anim: [ph, t, wdt, 0] });
        }
        // broad fronds
        if (s % 3 === 1 && t > 0.10) {
          const fa = hash1(cs * 71 + k * 5 + s) * TAU;
          const fl = 0.06 + hash1(cs * 83 + s) * 0.10;
          for (const sgn of [-1, 1]) {
            const nf = 1 + Math.round(fl / V);
            for (let q = 1; q <= nf; q++) {
              const tt = q / nf;
              g.set(Math.round((bx + lean + Math.cos(fa) * sgn * fl * tt) / V),
                Math.round((by + t * h + tt * V * 0.8) / V),
                Math.round((bz + lean * 0.4 + Math.sin(fa) * sgn * fl * tt) / V),
                BLADE[Math.floor(hash3(q, s, sgn + 3, cs + k) * BLADE.length)],
                { j: 0.12, rou: 0.96, seed: cs + k, anim: [ph, Math.min(1, t + tt * 0.05), wdt * 0.8, 0] });
            }
          }
        }
        // pneumatocyst floats
        if (s % 5 === 2 && t > 0.25) {
          const fa = hash1(cs * 89 + k * 11 + s) * TAU;
          g.set(Math.round((bx + lean + Math.cos(fa) * 0.035) / V), Math.round((by + t * h) / V),
            Math.round((bz + lean * 0.4 + Math.sin(fa) * 0.035) / V),
            BULB[Math.floor(hash1(s * 7 + k) * BULB.length)],
            { j: 0.10, rou: 0.72, seed: cs + k, anim: [ph, t, wdt * 0.6, 0] });
        }
      }
    }
  };

  for (let c = 0; c < 24; c++) {
    const x0 = (hash1(c * 23 + 11) * 2 - 1) * 7.6;
    const z0 = (hash1(c * 13 + 5) * 2 - 1) * 1.5;
    const y0 = SEABED_Y + 0.14 + hash1(c * 7) * 0.24;
    if (Math.hypot(x0 - ISLE.x, z0 - ISLE.z) < ISLE.r * 1.34) continue;
    clump(x0, z0, y0, 0.50 + hash1(c * 37) * 1.25, 3 + Math.floor(hash1(c * 19) * 4), c, 0.20);
  }
  // kelp skirting the island's submerged flank
  for (let c = 0; c < 13; c++) {
    const a = hash1(c * 43 + 17) * TAU;
    const rr = ISLE.r * (1.30 + hash1(c * 53 + 3) * 0.85);
    const x0 = ISLE.x + Math.cos(a) * rr * 1.10;
    const z0 = ISLE.z + Math.sin(a) * rr;
    const y0 = -3.30 + hash1(c * 61 + 7) * 1.35;
    if (Math.hypot(x0 - ISLE.x, z0 - ISLE.z) < ISLE.r * 1.28) continue;
    clump(x0, z0, y0, 0.55 + hash1(c * 37) * 1.00, 3 + Math.floor(hash1(c * 19) * 3), c + 300, 0.24);
  }

  // ---- sea-grass tufts ----
  for (let i = 0; i < 32; i++) {
    const p = deepSpot(i, 1200, -4.20, -2.30, 0.24, 0);
    if (!p) continue;
    const x = p[0], y = p[1], z = p[2];
    const ph = hash1(i * 37) * TAU;
    const nB = 5 + Math.floor(hash1(i * 17) * 6);
    for (let b = 0; b < nB; b++) {
      const a = hash1(i * 23 + b) * TAU;
      const hh = 0.07 + hash1(i * 29 + b) * 0.17;
      const lean = 0.04 + hash1(i * 31 + b) * 0.10;
      const st = Math.max(2, Math.round(hh / V));
      for (let s = 0; s <= st; s++) {
        const t = s / st;
        g.set(Math.round((x + Math.cos(a) * lean * t) / V), Math.round((y + t * hh) / V),
          Math.round((z + Math.sin(a) * lean * t) / V),
          GRASS[Math.floor(hash3(b, s, i, 6) * GRASS.length)],
          { j: 0.12, rou: 0.97, seed: i, anim: [ph, t, 0.6, 0] });
      }
    }
  }
}

// ------------------------------------------------------------
//  starfish, shells, urchins, crabs, cucumbers, pebbles
// ------------------------------------------------------------
function buildSeaFloorProps(g) {
  const V = g.vox;
  const PEBBLE = [0x6a6258, 0x585048, 0x7a7168, 0x4a443c, 0x8a8078];
  for (let i = 0; i < 40; i++) {
    const p = deepSpot(i, 1500, -4.20, -2.40, 0.24, 0);
    if (!p) continue;
    const x = p[0], y = p[1], z = p[2];
    const ci = Math.round(x / V), cj = Math.round(z / V), ck = Math.round(y / V);
    const aa = hash1(i * 5 + 2) * TAU;
    const ca = Math.cos(aa), sa = Math.sin(aa);
    const kind = Math.floor(hash1(i * 71 + 3) * 8);
    if (kind === 0) {
      // starfish: disc + five tapering arms
      const r0 = 0.075 + hash1(i * 13) * 0.05;
      const col = CORAL_SPIKES[(i + 3) % CORAL_SPIKES.length];
      blob(g, ci, ck, cj, 1.1, 0.9, 1.1, col.main, { j: 0.09, rou: 0.82, emi: col.emi, emiS: 0.2 });
      for (let arm = 0; arm < 5; arm++) {
        const ar = aa + arm / 5 * TAU;
        const sca = Math.cos(ar), ssa = Math.sin(ar);
        const st = Math.max(3, Math.round(r0 / V));
        for (let s = 1; s <= st; s++) {
          const t = s / st, rad = r0 * t, w = t < 0.55 ? 1 : 0;
          for (let d = -w; d <= w; d++) {
            g.set(Math.round((x + sca * rad) / V) + Math.round(-ssa * d),
              ck + (t > 0.82 ? 1 : 0),
              Math.round((z + ssa * rad) / V) + Math.round(sca * d),
              t > 0.72 ? col.tip : col.main, { j: 0.09, rou: 0.80, emi: col.emi, emiS: 0.24 });
          }
        }
      }
    } else if (kind === 1) {
      // scallop shell
      reefShell(g, x, y, z, 0.075 + hash1(i * 17) * 0.06, i + 1510);
    } else if (kind === 2) {
      // urchin
      reefUrchin(g, x, y, z, 0.05 + hash1(i * 19) * 0.035, i + 1520);
    } else if (kind === 3) {
      // sea cucumber
      const col = pickFrom([0x5a4a3a, 0x6a5a42, 0x4a3f34, 0x7a6a52], x, y, z, i);
      const st = Math.max(4, Math.round((0.09 + hash1(i * 7) * 0.08) / V));
      for (let s = 0; s <= st; s++) {
        const t = s / st;
        const R = Math.max(1, Math.round((0.012 + Math.sin(t * PI) * 0.028) / V * 1.6));
        for (let d = -R; d <= R; d++) for (let e = -R; e <= R; e++) {
          if (d * d + e * e > R * R) continue;
          g.set(Math.round((x + ca * t * 0.18) / V) + Math.round(-sa * d),
            ck + Math.round(e * 0.6), Math.round((z + sa * t * 0.18) / V) + Math.round(ca * d),
            col, { j: 0.10, rou: 0.88, emi: 0x2a1c10, emiS: 0.08 });
        }
      }
    } else if (kind === 4) {
      // small crab
      const col = [0xc0483a, 0xa83a2e, 0xd0604a, 0x9c5a3a][i % 4];
      for (let du = -2; du <= 2; du++) for (let dw = -1; dw <= 1; dw++) {
        const hh = Math.abs(du) < 2 ? 1 : 0;
        for (let dk = 0; dk <= hh; dk++)
          g.set(ci + Math.round(ca * du - sa * dw), ck + dk, cj + Math.round(sa * du + ca * dw),
            col, { j: 0.09, rou: 0.70, seed: i });
      }
      for (const side of [-1, 1]) {
        for (let q = 0; q < 3; q++) for (let s2 = 1; s2 <= 2; s2++) {
          const u = (q - 1) * 1.7 + side * s2 * 0.9, wv = side * s2 * 1.2;
          g.set(ci + Math.round(ca * u - sa * wv), ck - (s2 > 1 ? 1 : 0), cj + Math.round(sa * u + ca * wv),
            col, { j: 0.09, rou: 0.72, seed: i });
        }
        for (let s2 = 1; s2 <= 2; s2++) {
          const u = -side * (2.4 + s2 * 0.7), wv = side * (0.6 + s2 * 0.7);
          g.set(ci + Math.round(ca * u - sa * wv), ck + 1, cj + Math.round(sa * u + ca * wv),
            0xe0d0b8, { j: 0.07, rou: 0.55, seed: i });
        }
      }
    } else if (kind === 5) {
      // brittle star
      const col = pickFrom([0x8a7a5a, 0x9c8a64, 0x6a5c46], x, y, z, i);
      blob(g, ci, ck, cj, 1.0, 0.8, 1.0, col, { j: 0.09, rou: 0.8, emi: 0x2a2410, emiS: 0.12 });
      for (let arm = 0; arm < 5; arm++) {
        const ar = aa + arm / 5 * TAU + 0.3;
        const sca = Math.cos(ar), ssa = Math.sin(ar);
        for (let s = 1; s <= 8; s++) {
          const t = s / 8, rad = 0.10 * t;
          const wob = Math.round(Math.sin(t * 4 + arm) * 0.6);
          g.set(Math.round((x + sca * rad) / V) + wob, ck + (t > 0.85 ? 1 : 0),
            Math.round((z + ssa * rad) / V) + wob * -1,
            t > 0.8 ? 0xe8dcc0 : col, { j: 0.10, rou: 0.78, emi: 0x2a2410, emiS: 0.1 });
        }
      }
    } else if (kind === 6) {
      // spiralling shell
      const col = pickFrom([0xe0c8a0, 0xd0b488, 0xf0e0c0, 0xc0a078], x, y, z, i);
      const n = 18;
      for (let q = 0; q <= n; q++) {
        const t = q / n;
        const th = t * 2.6 * TAU;
        const rad = 0.014 + t * 0.048;
        const px = ci + Math.round(ca * Math.cos(th) * rad / V * 1.2 - sa * Math.sin(th) * rad / V * 1.2);
        const pz = cj + Math.round(sa * Math.cos(th) * rad / V * 1.2 + ca * Math.sin(th) * rad / V * 1.2);
        const py = ck + Math.round((1 - t) * 0.075 / V);
        g.set(px, py, pz, col, { j: 0.08, met: 0.08, rou: 0.5, emi: 0x2a2010, emiS: 0.12 });
        if (t > 0.75) g.set(px, py, pz + 1, col, { j: 0.08, met: 0.08, rou: 0.5 });
      }
    } else {
      // pebble cluster
      const nb = 4 + Math.floor(hash1(i * 41) * 5);
      for (let q = 0; q < nb; q++) {
        const pa = hash1(i * 31 + q) * TAU, pr = hash1(i * 37 + q) * 0.17;
        blob(g, Math.round((x + Math.cos(pa) * pr) / V), ck + Math.round(hash1(i * 43 + q) * 2),
          Math.round((z + Math.sin(pa) * pr) / V), 1.3, 0.9, 1.3,
          pickFrom(PEBBLE, pa, q, pr, i), { j: 0.10, rou: 0.94, seed: i + q });
      }
    }
  }
}

// ------------------------------------------------------------
//  bubbles (shader-animated vents + ambient drift)
// ------------------------------------------------------------
function buildBubbles() {
  const g = new VoxelGrid(0.030);
  const V = g.vox;
  // a bubble wraps over the whole [-4.30, 0.30] rise, so the entire column must be inside
  const fits = (x, z, rad) => {
    if (islandHeightAt(x, z) > -10) return false;      // would rise through the island
    for (const dx of [-0.14, 0.14]) {
      const R = bottleInnerRadius(x + dx) - 0.12;
      if (R <= 1.0) return false;
      for (const dz of [-0.14, 0.14])
        if (Math.hypot(4.30 + rad, z + dz) > R) return false;
    }
    return true;
  };
  const puff = (x, y, z, rad, hex, opt) => {
    const r = Math.max(rad, 0.95);
    blob(g, x / V, y / V, z / V, r, r, r, hex, opt);
  };

  // ---- vents: tight columns of graded bubbles ----
  let nv = 0;
  for (let i = 0; i < 90 && nv < 8; i++) {
    const vx = (hash1(i * 17 + 5) * 2 - 1) * 7.2;
    const vz = (hash1(i * 23 + 9) * 2 - 1) * 1.5;
    if (!fits(vx, vz, 0.07)) continue;
    nv++;
    const seed = i * 131 + 7;
    const nB = 13 + Math.floor(hash1(seed) * 6);
    for (let q = 0; q < nB; q++) {
      const t = q / (nB - 1);
      const y = lerp(-4.16, -0.52, t) + (hash1(seed + q * 7) - 0.5) * 0.16;
      const wob = 0.05 + t * 0.26;
      const px = vx + (hash1(seed * 3 + q * 11) - 0.5) * wob;
      const pz = vz + (hash1(seed * 5 + q * 13) - 0.5) * wob;
      const sz = 0.45 + t * 1.30 + hash1(seed * 7 + q) * 0.45;
      const rad = sz * V;
      if (!fits(px, pz, rad)) continue;
      puff(px, y, pz, sz, 0xdff4ff, {
        j: 0.05, rou: 0.06, met: 0.0, emi: 0x2a5a78, emiS: 0.72,
        anim: [hash1(seed * 11 + q) * TAU, 0.30 + hash1(seed * 13 + q) * 1.10, sz / 1.9, 0],
      });
    }
  }

  // ---- ambient drift bubbles ----
  for (let i = 0; i < 260; i++) {
    const x = (hash1(i * 31 + 5) * 2 - 1) * 7.4;
    const z = (hash1(i * 47 + 9) * 2 - 1) * 1.6;
    const y = -4.15 + hash1(i * 13) * 3.5;
    const sz = 0.40 + hash1(i * 19) * 0.95;
    const rad = sz * V;
    if (!fits(x, z, rad)) continue;
    puff(x, y, z, sz, 0xdff4ff, {
      j: 0.05, rou: 0.07, met: 0.0, emi: 0x2a5a78, emiS: 0.62,
      anim: [hash1(i * 7) * TAU, 0.25 + hash1(i * 11) * 1.30, sz / 1.9, 0],
    });
  }
  return g;
}

/* ============================================================
   8.  THE SHIP  —  three-masted square-rigger
   Local frame:  +X = bow,  +Y = up,  y = 0 is the waterline.
   ============================================================ */

const SHIP = {
  len      : 4.30,
  halfBeam : 0.67,
  draft    : 0.30,
  deckBase : 0.30,
  mastTop  : 2.46,
  orbitCx  : ISLE.x,
  orbitCz  : ISLE.z,
  orbitRx  : 4.20,
  orbitRz  : 2.88,
  speed    : 0.094,
};
SHIP.orbitR = SHIP.orbitRz;

const PAL_HULL_DEEP = [0x241a13, 0x2d2118, 0x1b130d, 0x302319];
const PAL_HULL_BOOT = [0x7d2e22, 0x8d3a2b, 0x6b2419, 0x953f2c];
const PAL_HULL_OCH  = [0x9a6c3c, 0x8a5f34, 0xa8783f, 0x7d5630, 0x936a3e];
const PAL_DECK      = [0xb89468, 0xc0a074, 0xab8760, 0xc9a87e, 0xa58057];
const PAL_TIMBER    = [0x6b4d2e, 0x7a5836, 0x5b4026, 0x85633d];
const PAL_SAIL      = [0xf6eeda, 0xfbf5e6, 0xeee3c8, 0xe4d8ba];
const PAL_GOLDTRIM  = [0xc9a24a, 0xd9b761, 0xb8912f];
const ROPE_COL      = [0xa8987a, 0x9c8a66, 0xb8a884];

const RED_TRIM = 0xa8372a;
const RED_DARK = 0x82271d;

function buildShip() {
  const g = new VoxelGrid(VOX);
  const V = VOX;
  const L = SHIP.len;
  const n = Math.round(L / V);
  const x0 = -L * 0.5;
  const HB = SHIP.halfBeam;
  const DRAFT = SHIP.draft;

  const hullHW = (t) => {
    const bow = Math.pow(Math.max(0, (t - 0.56) / 0.44), 1.75);
    const stn = Math.pow(Math.max(0, (0.17 - t) / 0.17), 1.55);
    return HB * (1 - bow * 0.945) * (1 - stn * 0.50);
  };
  const keelY = (t) => -DRAFT + Math.sin(t * PI) * 0.032;
  const deckY = (t) => SHIP.deckBase
    + Math.pow(Math.max(0, (0.18 - t) / 0.18), 1.45) * 0.295
    + Math.pow(Math.max(0, (t - 0.62) / 0.38), 1.70) * 0.250;

  const hullAt = (t) => ({ hw: hullHW(t), dy: deckY(t), ky: keelY(t) });
  const widthAt = (h, wy) => {
    const vt = sat((Math.min(wy, h.dy) - h.ky) / Math.max(0.001, h.dy - h.ky));
    return h.hw * (0.26 + 0.74 * Math.pow(vt, 0.42));
  };

  // ==========================================================
  //  HULL
  // ==========================================================
  const RAIL = 4;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const ix = Math.round(x0 / V) + i;
    const h = hullAt(t);
    const kBot = Math.round(h.ky / V), kTop = Math.round(h.dy / V);
    const mDeck = Math.max(0, Math.round(h.hw / V));
    for (let k = kBot; k <= kTop + RAIL; k++) {
      const wy = k * V;
      const above = k > kTop;
      const m = above ? mDeck : Math.max(0, Math.round(widthAt(h, wy) / V));
      for (let j = -m; j <= m; j++) {
        const jm = Math.abs(j);
        const skin = (jm >= m - 1);
        if (above) {
          if (!skin) continue;
        } else if (!skin && k !== kTop && k !== kBot) continue;
        let col, opt;
        if (above) {
          col = pickFrom(PAL_HULL_OCH, i, k, j, 13);
          opt = { j: 0.09, rou: 0.90, seed: 13 };
          if (k === kTop + RAIL) { col = 0x4c3520; opt = { j: 0.07, rou: 0.86 }; }
          else if (k === kTop + RAIL - 1) col = 0x8a6238;
          if (k <= kTop + 2 && (i % 9 === 4 || i % 9 === 5)) { col = 0x120c07; opt = { j: 0.04, rou: 0.96 }; }
        } else if (k === kTop) {
          col = pickFrom(PAL_DECK, i, k, j, 21);
          opt = { j: 0.07, rou: 0.87, seed: 21 };
          if (i % 5 === 0) { col = 0x8a6b46; opt = { j: 0.06, rou: 0.90 }; }
          if (jm === m) { col = 0x4c3520; opt = { j: 0.07, rou: 0.87 }; }
        } else if (k <= kBot) {
          col = 0x3a2a1c; opt = { j: 0.10, rou: 0.94, seed: 17 };
        } else if (wy < -0.055) {
          col = pickFrom(PAL_HULL_DEEP, i, k, j, 17);
          opt = { j: 0.10, rou: 0.94, seed: 17 };
        } else if (wy < 0.012) {
          col = pickFrom(PAL_HULL_BOOT, i, k, j, 19);
          opt = { j: 0.08, rou: 0.88, seed: 19 };
        } else {
          col = pickFrom(PAL_HULL_OCH, i, k, j, 13);
          opt = { j: 0.09, rou: 0.90, seed: 13 };
          const waleK = Math.round((h.dy - 0.115) / V);
          if (k === waleK || k === waleK - 1) { col = 0x51351f; opt = { j: 0.07, rou: 0.88 }; }
        }
        g.set(ix, k, j, col, opt);
      }
    }
  }

  // ==========================================================
  //  BOW — stem, head rails, gilt figurehead
  // ==========================================================
  const bowI = Math.round((x0 + L) / V);
  const bowDY = deckY(1.0);
  let stemTopK = 0;
  {
    const kb = Math.round(keelY(1.0) / V), kt = Math.round((bowDY + 0.46) / V);
    stemTopK = kt;
    for (let k = kb; k <= kt; k++) {
      const f = (k - kb) / Math.max(1, kt - kb);
      const outI = bowI + Math.round(f * 0.30 / V);
      for (let j = -1; j <= 1; j++) {
        const gilt = k >= kt - 1;
        g.set(outI, k, j, gilt ? pickFrom(PAL_GOLDTRIM, k, j, 0, 33) : 0x4c3520,
          { j: 0.07, rou: gilt ? 0.32 : 0.90, met: gilt ? 0.82 : 0, seed: 33 });
      }
    }
    const fk = kt + 1, fi = bowI + Math.round(0.30 / V);
    g.ellipsoid(fi, fk + 2, 0, 0.085 / V, 0.10 / V, 0.07 / V, 0xc9a24a, { j: 0.06, met: 0.9, rou: 0.30 });
    g.ellipsoid(fi + 1, fk + 3, 0, 0.055 / V, 0.06 / V, 0.05 / V, 0xd9b761, { j: 0.05, met: 0.92, rou: 0.26 });
    for (const s of [-1, 1]) for (let q = 0; q < 4; q++)
      g.set(fi - 1 - q, fk + 3 + q, s, 0xc9a24a, { j: 0.06, met: 0.9, rou: 0.32 });
    g.set(fi + 2, fk + 3, 0, 0xe0c479, { j: 0.04, met: 0.95, rou: 0.22, emi: 0x2a1c06, emiS: 0.5 });
    for (const s of [-1, 1]) {
      g.rope(fi + 1, fk + 1, s * 1, bowI - Math.round(0.55 / V), Math.round(deckY(0.86) / V) + 1,
        s * Math.round(hullHW(0.86) * 0.92 / V), 0.02, 0x6b4d2e, { j: 0.07, rou: 0.90 });
      g.rope(fi + 1, fk - 2, s * 1, bowI - Math.round(0.62 / V), Math.round(deckY(0.84) / V),
        s * Math.round(hullHW(0.84) * 0.95 / V), 0.03, 0x8a6238, { j: 0.07, rou: 0.90 });
    }
  }

  // ==========================================================
  //  STERN — transom gallery, rudder, lantern
  // ==========================================================
  const sternI = Math.round(x0 / V);
  const sDY = deckY(0);
  const sHW = hullHW(0);
  {
    const kTop = Math.round(sDY / V);
    const mS = Math.round(sHW / V);
    for (let k = kTop - 5; k <= kTop + 4; k++) {
      const wI = 2 + Math.floor((k - (kTop - 5)) / 5);
      for (let j = -mS; j <= mS; j++) {
        const jm = Math.abs(j);
        const isWin = (jm % 5 === 2) && k > kTop && k <= kTop + 2;
        let col, opt;
        if (isWin) { col = 0xffd88a; opt = { j: 0.04, rou: 0.22, emi: 0xffb54a, emiS: 1.35 }; }
        else if (k === kTop + 4) { col = pickFrom(PAL_GOLDTRIM, k, j, 0, 29); opt = { j: 0.05, met: 0.85, rou: 0.30 }; }
        else if (k === kTop + 3) { col = 0xd9b761; opt = { j: 0.04, met: 0.9, rou: 0.26 }; }
        else if (jm === mS) { col = 0x4c3520; opt = { j: 0.07, rou: 0.88 }; }
        else { col = pickFrom(PAL_HULL_OCH, k, j, 0, 13); opt = { j: 0.08, rou: 0.90 }; }
        g.set(sternI - wI, k, j, col, opt);
      }
    }
    for (let j = -Math.round(mS * 0.55); j <= Math.round(mS * 0.55); j++) {
      if (Math.abs(j) % 3 === 2) continue;
      g.paint(sternI - 1, kTop + 2, j, 0xd9b761, { j: 0.04, met: 0.9, rou: 0.26 });
    }
    const rI = sternI - 2;
    for (let k = Math.round(-DRAFT * 0.98 / V); k <= Math.round((sDY + 0.02) / V); k++)
      for (let j = -1; j <= 1; j++) g.set(rI, k, j, 0x4a3320, { j: 0.08, rou: 0.90 });
    for (let q = 0; q < 7; q++) g.set(rI - 1, Math.round((sDY + 0.10) / V) + q, 0, 0x5d4028, { j: 0.07, rou: 0.90 });
    const lk = kTop + 6;
    g.set(sternI - 3, lk, 0, 0xffe9b0, { j: 0.03, rou: 0.20, emi: 0xffb54a, emiS: 2.1 });
    for (const d of [[-1, 0], [1, 0], [0, -1], [0, 1]])
      g.set(sternI - 3 + d[0], lk, d[1], 0x8a6a2c, { j: 0.05, met: 0.8, rou: 0.3 });
    g.set(sternI - 3, lk - 2, 0, 0x8a6a2c, { j: 0.05, met: 0.8, rou: 0.3 });
    g.set(sternI - 3, lk + 1, 0, 0xd8b45a, { j: 0.04, met: 0.95, rou: 0.22 });
  }

  // ==========================================================
  //  GUN PORTS
  // ==========================================================
  for (let p = 0; p < 7; p++) {
    const t = 0.22 + p * 0.098;
    if (t > 0.93) continue;
    const ix = Math.round(x0 / V) + Math.round(t * n);
    const h = hullAt(t);
    const kBand = Math.round((h.dy - 0.115) / V);
    for (const side of [-1, 1]) {
      const m = Math.round((h.hw * 0.995) / V);
      for (let b = -1; b <= 1; b++)
        for (let q = 0; q < 2; q++) g.set(ix - q, kBand + b, side * m, 0x140e09, { j: 0.05, rou: 0.96 });
      for (let q = 0; q < 4; q++)
        for (let a = -1; a <= 1; a++)
          g.set(ix + q - 1, kBand + a, side * (m + (q === 0 ? 0 : 1)),
            a === 0 ? 0xc9a24a : 0x8a6a2c, { j: 0.06, met: 0.9, rou: 0.28 });
    }
  }

  // ==========================================================
  //  CHANNELS
  // ==========================================================
  const channels = [];
  for (const t of [0.175, 0.44, 0.69]) {
    const ix = Math.round(x0 / V) + Math.round(t * n);
    const h = hullAt(t);
    const k = Math.round((h.dy - 0.02) / V);
    const m = Math.round(h.hw / V);
    for (const side of [-1, 1]) {
      for (let q = 1; q <= 3; q++)
        for (let b = -3; b <= 3; b++)
          g.set(ix + b, k - 2, side * (m + q), pickFrom(PAL_TIMBER, b, q, side, 37), { j: 0.08, rou: 0.9, seed: 37 });
      for (let b = -1; b <= 1; b++)
        g.set(ix + b * 3, k - 1, side * (m + 4), 0xc9a24a, { j: 0.05, met: 0.85, rou: 0.32 });
    }
    channels.push({ t, ix, hw: h.hw, dy: h.dy });
  }

  // ==========================================================
  //  DECK FURNITURE
  // ==========================================================
  const deckKAt = (u) => Math.round(deckY((u - x0) / L) / V);
  const deckPut = (u, w, hex, opt, hgt) => {
    const k = deckKAt(u) + 1;
    for (let q = 0; q < (hgt || 1); q++) g.set(Math.round(u / V), k + q, Math.round(w / V), hex, opt);
  };
  for (const hx of [-0.75, 0.05]) {
    for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) {
      const rr = Math.hypot(a, b);
      if (rr > 3.6) continue;
      const edge = rr > 2.4;
      g.set(Math.round(hx / V) + a, deckKAt(hx) + 1, b, edge ? 0x4a3320 : 0x2e2018, { j: 0.07, rou: 0.92 });
      if (edge) g.set(Math.round(hx / V) + a, deckKAt(hx) + 2, b, 0x6b4d2e, { j: 0.07, rou: 0.90 });
    }
  }
  for (let k = 0; k < 5; k++) {
    const r = k < 4 ? 2 : 1;
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++)
      if (a * a + b * b <= r * r + 0.6)
        deckPut(1.12 + a * V, b * V, k === 4 ? 0x8a6a2c : 0x6d4b2b,
          { j: 0.08, rou: 0.88, met: k === 4 ? 0.5 : 0, seed: 41 });
  }
  for (let q = 0; q < 7; q++) deckPut(1.12 - 0.20 - q * V * 0.7, 0, 0x6d4b2b, { j: 0.07, rou: 0.90 });
  for (const [dx, dz] of [[-0.42, 0.42], [-0.42, -0.42], [0.62, 0.40], [0.62, -0.40]]) {
    const k = deckKAt(dx) + 1;
    for (let q = 0; q < 7; q++)
      g.set(Math.round(dx / V) + q, k + 1, Math.round(dz / V), q > 5 ? 0xc9a24a : 0x35342f,
        { j: 0.06, met: 0.88, rou: 0.34, seed: 43 });
    for (const s of [-1, 1]) for (let q = 0; q < 2; q++)
      g.set(Math.round(dx / V) + q * 2, k, Math.round(dz / V) + s, 0x6d4b2b, { j: 0.07, rou: 0.90 });
  }
  for (let i = 0; i < 10; i++) {
    const bx = -1.35 + hash1(i * 7 + 1) * 0.42;
    const bz = (hash1(i * 11 + 3) - 0.5) * 0.52;
    const k = deckKAt(bx) + 1;
    for (let q = 0; q < 3; q++) for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      if (a * a + b * b > 2) continue;
      g.set(Math.round(bx / V) + a, k + q, Math.round(bz / V) + b,
        q === 1 ? 0x6a5a3a : 0x7d5a30, { j: 0.09, rou: 0.88, met: q === 1 ? 0.45 : 0, seed: 47 });
    }
  }
  for (let i = 0; i < 3; i++) {
    const bx = 1.62 + i * 0.24, bz = -0.30 + hash1(i * 5) * 0.5;
    const k = deckKAt(bx) + 1;
    for (let q = 0; q < 3; q++) for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++)
      if (Math.abs(a) === 2 || Math.abs(b) === 2 || q === 2)
        g.set(Math.round(bx / V) + a, k + q, Math.round(bz / V) + b,
          q === 2 ? 0x8a6a3a : 0x6b4d2e, { j: 0.09, rou: 0.90, seed: 49 });
  }
  {
    const bx = -0.10, k = deckKAt(bx) + 1;
    for (let q = -5; q <= 5; q++) {
      const f = q / 5;
      const hwv = Math.max(1, Math.round(0.16 * Math.sqrt(Math.max(0, 1 - f * f)) / V));
      for (let s = -hwv; s <= hwv; s++)
        g.set(Math.round(bx / V) + q, k + 2, s, (Math.abs(s) === hwv) ? 0x6f4b2c : 0x9a7248,
          { j: 0.08, rou: 0.90, seed: 51 });
      for (const s of [-hwv, hwv])
        g.set(Math.round(bx / V) + q, k + 1, s, 0x5a3c23, { j: 0.08, rou: 0.92, seed: 51 });
    }
    for (let q = 0; q < 8; q++)
      g.set(Math.round(bx / V) + 3, k + 1, 0, 0xc0ab84, { j: 0.08, rou: 0.96 });
  }
  deckPut(0.30, 0.0, 0x8a6a2c, { j: 0.05, met: 0.9, rou: 0.28 }, 2);
  deckPut(0.30, 0.0, 0xd8b45a, { j: 0.04, met: 1, rou: 0.2, emi: 0xffb040, emiS: 0.9 }, 3);

  // ==========================================================
  //  MASTS
  // ==========================================================
  const MASTS = [
    { t: 0.175, h: 1.74, r: 1 },
    { t: 0.440, h: 2.06, r: 2 },
    { t: 0.690, h: 1.92, r: 2 },
  ];
  const mastInfo = [];
  for (const M of MASTS) {
    const mx = x0 + M.t * L;
    const dy = deckY(M.t);
    const i = Math.round(mx / V);
    const kBase = Math.round(dy / V) - 4;
    const kTop = Math.round((dy + M.h) / V);
    for (let k = kBase; k <= kTop; k++) {
      const t = sat((k * V - dy) / M.h);
      const r = (t < 0.45) ? M.r : Math.max(1, M.r - 1);
      for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) {
        if (a * a + b * b > r * r + 0.6) continue;
        const ring = r > 1 && (a * a + b * b) >= (r - 1) * (r - 1);
        g.set(i + a, k, b, ring ? 0x7a5836 : 0x63482c, { j: 0.08, rou: 0.92, seed: 53 });
      }
      if (Math.round((k * V - dy) / 0.30) !== Math.round(((k + 1) * V - dy) / 0.30)) {
        for (let a = -r - 1; a <= r + 1; a++) for (let b = -r - 1; b <= r + 1; b++)
          if (a * a + b * b <= (r + 1) * (r + 1) + 0.6)
            g.set(i + a, k, b, 0x4a4740, { j: 0.05, met: 0.7, rou: 0.50 });
      }
    }
    const platK = Math.round((dy + M.h * 0.60) / V);
    for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) {
      const rr = Math.hypot(a, b);
      if (rr > 3.4) continue;
      g.set(i + a, platK, b, pickFrom(PAL_TIMBER, a, b, platK, 57), { j: 0.08, rou: 0.90, seed: 57 });
      if (rr > 2.3) g.set(i + a, platK + 1, b, 0x4c3520, { j: 0.08, rou: 0.90 });
    }
    mastInfo.push({ x: mx, deckY: dy, top: dy + M.h, t: M.t, platK, m: M, i });
  }

  // ==========================================================
  //  YARDS + SQUARE SAILS
  // ==========================================================
  function yard(mx, y, halfW, lifts) {
    const nw = Math.max(2, Math.round(halfW / V));
    const i = Math.round(mx / V), k = Math.round(y / V);
    for (let b = -nw; b <= nw; b++) {
      for (let q = 0; q <= (nw > 10 ? 1 : 0); q++)
        g.set(i, k + q, b, Math.abs(b) > nw - 2 ? 0x8a6a3a : (b % 3 === 0 ? 0x5d4028 : 0x6b4d2e),
          { j: 0.08, rou: 0.90, seed: 61 });
      if (Math.abs(b) > nw - 2) for (let q = 1; q <= 3; q++) g.set(i, k - q, b, 0x8a6a3a, { j: 0.06, rou: 0.88 });
    }
    if (lifts) {
      g.rope(i, (y + 0.17) / V, -nw, i, k, 0, 0.01, ROPE_COL[1], { j: 0.07, rou: 0.95 });
      g.rope(i, (y + 0.17) / V, nw, i, k, 0, 0.01, ROPE_COL[1], { j: 0.07, rou: 0.95 });
    }
  }

  function squareSail(mx, topY, botY, halfW, bulge, striped, seed, taper) {
    const hgt = topY - botY;
    const nb = Math.max(4, Math.round(hgt / V));
    const nw = Math.max(4, Math.round(halfW / V));
    const i0 = Math.round(mx / V);
    for (let a = 0; a <= nb; a++) {
      const v = a / nb;
      const y = topY - v * hgt;
      const hwid = halfW * (1.0 + (taper || 0.10) * v);
      const k = Math.round(y / V);
      for (let b = -nw; b <= nw; b++) {
        const u = b / nw;
        const bl = Math.sin((u * 0.5 + 0.5) * PI) * Math.sin(Math.pow(v, 0.60) * PI * 0.94);
        const i = i0 + Math.round(bulge * bl / V);
        const j = Math.round(u * hwid / V);
        const row = Math.floor(v * 9);
        const stripe = striped && (row === 1 || row === 3 || row === 6);
        let col = stripe ? (row === 3 ? RED_TRIM : RED_DARK) : pickFrom(PAL_SAIL, i, k, j, seed);
        if (!stripe && b % 5 === 0) col = 0xe6dcc0;
        if (Math.abs(u) > 0.95) col = 0xbfae8c;
        const opt = { j: 0.05, rou: 0.95, seed };
        g.set(i, k, j, col, opt);
        if (v > 0.03 && v < 0.97) g.set(i + 1, k, j, col, opt);
      }
    }
    const kB = Math.round(botY / V), kT = Math.round(topY / V);
    for (let b = -nw; b <= nw; b++) {
      const u = b / nw;
      const j = Math.round(u * halfW / V);
      g.set(i0, kB - 1, j, 0xbfae8c, { j: 0.07, rou: 0.95 });
      g.set(i0, kT + 1, j, 0xbfae8c, { j: 0.07, rou: 0.95 });
    }
  }

  const M0 = mastInfo[1], M2 = mastInfo[2], M1 = mastInfo[0];

  yard(M0.x, M0.deckY + 1.14, 0.66, true);
  squareSail(M0.x, M0.deckY + 1.10, M0.deckY + 0.17, 0.62, 0.155, true, 101, 0.12);
  yard(M0.x, M0.deckY + 1.70, 0.50, true);
  squareSail(M0.x, M0.deckY + 1.66, M0.deckY + 1.18, 0.46, 0.115, true, 103, 0.10);
  yard(M0.x, M0.deckY + 2.02, 0.33, true);
  squareSail(M0.x, M0.deckY + 1.99, M0.deckY + 1.72, 0.30, 0.075, false, 105, 0.08);

  yard(M2.x, M2.deckY + 1.02, 0.58, true);
  squareSail(M2.x, M2.deckY + 0.98, M2.deckY + 0.17, 0.55, 0.140, true, 201, 0.12);
  yard(M2.x, M2.deckY + 1.56, 0.42, true);
  squareSail(M2.x, M2.deckY + 1.52, M2.deckY + 1.06, 0.39, 0.100, false, 203, 0.10);
  yard(M2.x, M2.deckY + 1.88, 0.27, true);
  squareSail(M2.x, M2.deckY + 1.85, M2.deckY + 1.60, 0.24, 0.065, false, 205, 0.08);

  yard(M1.x, M1.deckY + 1.42, 0.32, true);
  squareSail(M1.x, M1.deckY + 1.38, M1.deckY + 1.00, 0.29, 0.085, false, 301, 0.09);

  // spanker: fore-and-aft sail aft of the mizzen
  {
    const gaffY = M1.deckY + 1.16;
    const footA = M1.deckY + 0.16, footB = M1.deckY + 0.34;
    const reach = 0.62;
    const nq = 13;
    for (let q = 0; q <= nq; q++) {
      const u = q / nq;
      const xx = M1.x - u * reach;
      const yTop = gaffY + u * 0.10;
      const yBot = lerp(footA, footB, u);
      const steps = Math.max(1, Math.round((yTop - yBot) / V));
      const i = Math.round(xx / V);
      for (let s = 0; s <= steps; s++) {
        const v = s / steps;
        const k = Math.round(lerp(yTop, yBot, v) / V);
        const col = (v < 0.12) ? RED_DARK : pickFrom(PAL_SAIL, i, k, q, 401);
        g.set(i, k, 0, col, { j: 0.06, rou: 0.94, seed: 401 });
        g.set(i, k, 1, col, { j: 0.06, rou: 0.94, seed: 401 });
        g.set(i, k, -1, col, { j: 0.06, rou: 0.94, seed: 401 });
      }
    }
    for (let q = 0; q <= nq; q++) {
      const u = q / nq;
      g.set(Math.round((M1.x - u * reach) / V), Math.round((gaffY + u * 0.10) / V) + 1, 0, 0x6b4d2e, { j: 0.07, rou: 0.90 });
      g.set(Math.round((M1.x - u * reach) / V), Math.round(lerp(footA, footB, u) / V) - 1, 0, 0x6b4d2e, { j: 0.07, rou: 0.90 });
    }
  }

  // ==========================================================
  //  BOWSPRIT + JIBS
  // ==========================================================
  const bsSteps = Math.round(0.90 / V);
  const bsTipI = bowI + bsSteps;
  const bsTipY = bowDY + 0.10 + 0.90 * 0.40;
  for (let q = 0; q <= bsSteps; q++) {
    const t = q / bsSteps;
    const by = Math.round((bowDY + 0.10 + t * 0.36) / V);
    const r = t > 0.72 ? 0 : 1;
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++)
      g.set(bowI + q, by + a, b, r ? 0x5d4028 : 0x6b4d2e, { j: 0.08, rou: 0.90 });
  }

  function jib(i0, y0, i1, y1, i2, y2, seed) {
    const nq = Math.max(4, Math.round(Math.hypot((i1 - i0) * V, y1 - y0) / V));
    for (let q = 0; q <= nq; q++) {
      const s = q / nq;
      const ax = lerp(i0, i1, s), ay = lerp(y0, y1, s);
      const bx = lerp(i0, i2, s), by = lerp(y0, y2, s);
      const nb = Math.max(2, Math.round(Math.hypot((bx - ax) * V, by - ay) / V));
      for (let b = 0; b <= nb; b++) {
        const u = b / nb;
        const i = Math.round(lerp(ax, bx, u));
        const k = Math.round(lerp(ay, by, u) / V);
        const col = pickFrom(PAL_SAIL, i, k, q, seed);
        g.set(i, k, 0, col, { j: 0.05, rou: 0.95, seed });
        if (b % 6 === 0) g.set(i, k, 1, 0xd8cdb2, { j: 0.05, rou: 0.95, seed });
      }
    }
  }
  jib(bowI + Math.round(bsSteps * 0.94), bsTipY,
    bowI - Math.round(0.12 / V), deckY(0.92) + 0.40,
    Math.round(M2.x / V), M2.deckY + M2.m.h * 0.86, 210);
  jib(bowI + Math.round(bsSteps * 0.68), bsTipY - 0.02,
    bowI - Math.round(0.06 / V), deckY(0.90) + 0.20,
    Math.round(M2.x / V), M2.deckY + M2.m.h * 0.54, 215);

  // ==========================================================
  //  RIGGING
  // ==========================================================
  const R = (x1, y1, z1, x2, y2, z2, sag, hex) =>
    g.rope(x1 / V, y1 / V, z1 / V, x2 / V, y2 / V, z2 / V, sag, hex, { j: 0.07, rou: 0.95 });

  for (const M of mastInfo) {
    const hy = M.deckY;
    const ch = channels.find((c) => Math.abs(c.t - M.t) < 0.07) || channels[1];
    const cw = ch.hw * 0.98;
    const top = hy + M.m.h * 0.94;
    for (const side of [-1, 1]) {
      for (let q = 0; q < 2; q++)
        R(M.x + 0.03, top, 0, M.x - 0.10 + q * 0.20, hy - 0.02, side * cw, 0.012, ROPE_COL[(q + 1) % 3]);
      for (let r = 1; r <= 4; r++) {
        const t = r / 5;
        const yy = hy + t * M.m.h * 0.88;
        const zz = side * (0.03 + cw * t);
        R(M.x - 0.10, yy, zz, M.x + 0.10, yy, zz * 0.97, 0.0, ROPE_COL[1]);
      }
    }
  }
  const bsTipX = bsTipI * V;
  const sternX = sternI * V;
  R(M2.x, M2.deckY + M2.m.h * 0.98, 0, bsTipX, bsTipY, 0, 0.05, ROPE_COL[0]);
  R(M0.x, M0.deckY + M0.m.h * 0.99, 0, bsTipX, bsTipY + 0.05, 0, 0.09, ROPE_COL[0]);
  R(M0.x, M0.deckY + M0.m.h * 0.60, 0, bsTipX, bsTipY + 0.02, 0, 0.06, ROPE_COL[2]);
  R(M1.x, M1.deckY + M1.m.h * 0.98, 0, M0.x, M0.deckY + M0.m.h * 0.50, 0, 0.04, ROPE_COL[1]);
  R(M0.x, M0.deckY + M0.m.h * 0.99, 0, sternX + 0.10, sDY + 0.16, 0, 0.05, ROPE_COL[0]);
  R(M1.x, M1.deckY + M1.m.h * 0.99, 0, sternX - 0.06, sDY + 0.34, 0, 0.05, ROPE_COL[0]);
  R(M2.x, M2.deckY + M2.m.h * 0.99, 0, x0 + L * 0.30, deckY(0.30) + 0.10, 0, 0.05, ROPE_COL[1]);
  for (const [M, wy, hw] of [[M0, M0.deckY + 1.14, 0.66], [M2, M2.deckY + 1.02, 0.58], [M1, M1.deckY + 1.42, 0.32]]) {
    for (const s of [-1, 1])
      R(M.x, wy, s * hw, M.x + 0.46, M.deckY + 0.14, s * hullHW(M.t) * 1.02, 0.03, ROPE_COL[2]);
    R(M.x, wy - 0.03, hw * 0.9, M.x, wy - 0.12, 0, 0.03, ROPE_COL[1]);
  }

  // ==========================================================
  //  FLAGS + MASTHEAD TRUCKS
  // ==========================================================
  const fK = Math.round((M1.deckY + M1.m.h) / V) + 1;
  const fI = Math.round(M1.x / V);
  for (let q = 0; q < 13; q++) {
    const wob = Math.round(Math.sin(q * 0.55) * 0.8);
    for (let a = 0; a <= 4; a++)
      g.set(fI - 1 - q, fK - a + Math.round(wob * 0.2), wob, (a % 2 === 0) ? RED_TRIM : 0xe8dcc0,
        { j: 0.08, rou: 0.95, seed: 71 });
  }
  for (const M of mastInfo) {
    const k = Math.round((M.deckY + M.m.h * 0.86) / V);
    g.set(M.i, k, 0, 0xd8b45a, { j: 0.04, met: 0.95, rou: 0.24, emi: 0x3a2a08, emiS: 0.6 });
  }

  return {
    grid: g,
    mastInfo,
    bow: new THREE.Vector3(L * 0.5 + 0.22, 0.12, 0),
    stern: new THREE.Vector3(-L * 0.5 - 0.20, 0.08, 0),
    mastTop: new THREE.Vector3(mastInfo[1].x, mastInfo[1].top, 0),
    halfLen: L * 0.5 + 0.24,
    halfBeam: HB,
    topY: mastInfo[1].top,
    stemTopY: stemTopK * V,
  };
}
