/* ============================================================
   4.  THE GLASS BOTTLE  (lathe shell + custom glass shader)
   ============================================================ */

/** Revolve a {x, r} profile around the X axis.  Normals are analytic. */
function latheXGeometry(profile, segs) {
  const n = profile.length;
  const vcount = n * segs;
  const pos = new Float32Array(vcount * 3);
  const nrm = new Float32Array(vcount * 3);
  const uvs = new Float32Array(vcount * 2);
  const idx = new Uint32Array((n - 1) * segs * 6);

  for (let i = 0; i < n; i++) {
    const p = profile[i];
    const pm = profile[Math.max(0, i - 1)];
    const pp = profile[Math.min(n - 1, i + 1)];
    let dx = pp.x - pm.x, dr = pp.r - pm.r;
    let nx = -dr, nr = dx;
    const L = Math.hypot(nx, nr) || 1;
    nx /= L; nr /= L;
    for (let j = 0; j < segs; j++) {
      const t = j / segs * TAU;
      const c = Math.cos(t), s = Math.sin(t);
      const k = (i * segs + j);
      pos[k * 3] = p.x; pos[k * 3 + 1] = p.r * c; pos[k * 3 + 2] = p.r * s;
      nrm[k * 3] = nx;  nrm[k * 3 + 1] = nr * c;  nrm[k * 3 + 2] = nr * s;
      uvs[k * 2] = j / segs; uvs[k * 2 + 1] = i / (n - 1);
    }
  }
  let w = 0;
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < segs; j++) {
    const a = i * segs + j;
    const b = i * segs + (j + 1) % segs;
    const c = (i + 1) * segs + j;
    const d = (i + 1) * segs + (j + 1) % segs;
    // outward winding (matches the analytic normals above)
    idx[w++] = a; idx[w++] = b; idx[w++] = d;
    idx[w++] = a; idx[w++] = d; idx[w++] = c;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

/** Full closed glass shell: outer wall + lip ring + inner wall. */
function buildBottleShellGeometry(segs = 104, N = 156) {
  const xS = -BOT.bodyHalf - BOT.r + 0.004;
  const xE = bottleOuterEnd();
  const profile = [];
  for (let i = 0; i <= N; i++) {
    const x = lerp(xS, xE, i / N);
    profile.push({ x, r: bottleOuterRadius(x) });
  }
  // lip roll
  const rLipIn = bottleInnerRadius(xE - 0.01);
  profile.push({ x: xE, r: lerp(BOT.lipR, rLipIn, 0.34) });
  profile.push({ x: xE - 0.02, r: rLipIn });
  // inner wall, walking back
  for (let i = N; i >= 0; i--) {
    const x = lerp(xS, xE, i / N);
    const r = bottleInnerRadius(x);
    if (r < 0.02) continue;
    profile.push({ x, r });
  }
  return latheXGeometry(profile, segs);
}

// ------------------------------------------------------------
//  glass material
// ------------------------------------------------------------
const glassUniforms = Object.assign(skyUniforms(), {
  uIntensity : { value: 1.0 },
  uFillDir   : { value: new THREE.Vector3(-0.55, 0.35, 0.75).normalize() },
  uFillColor : { value: new THREE.Color(0xffb877) },
  uFillDir2  : { value: new THREE.Vector3(0.25, 0.9, -0.35).normalize() },
  uFillColor2: { value: new THREE.Color(0x9fc4ff) },
  uScratch   : { value: 0.5 },
});

function makeGlassMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: glassUniforms,
    side: THREE.DoubleSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      varying vec3 vWPos;
      varying vec3 vNrm;
      varying vec3 vObjP;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWPos = wp.xyz;
        vObjP = position;
        vNrm = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      ${GLSL_SKY}
      uniform float uIntensity, uScratch;
      uniform vec3 uFillDir, uFillColor, uFillDir2, uFillColor2;
      varying vec3 vWPos, vNrm, vObjP;

      float hash13(vec3 p){
        p = fract(p*0.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z);
      }
      float noise3(vec3 p){
        vec3 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        float n000=hash13(i), n100=hash13(i+vec3(1,0,0)), n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
        float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1)), n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
        return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
                   mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y), f.z);
      }

      void main(){
        vec3 N = normalize(vNrm);
        vec3 V = normalize(cameraPosition - vWPos);
        float nv = abs(dot(N, V));
        float fres = pow(1.0 - nv, 3.1);

        vec3 R = reflect(-V, N);
        vec3 refl = skyLook(R);

        // glass is a thin optical element: mostly transparent, strong grazing reflection
        vec3 col = mix(vec3(dot(refl, vec3(0.2126,0.7152,0.0722))), refl, 0.66) * (0.026 + fres * 1.02);

        // long soft reflection streaks from the room's window / lamp
        float st1 = pow(max(dot(R, normalize(vec3(0.22, 0.30, 0.93))), 0.0), 26.0);
        float st2 = pow(max(dot(R, normalize(vec3(-0.55, 0.36, 0.75))), 0.0), 18.0);
        col += vec3(1.15, 0.92, 0.66) * st1 * 0.55;
        col += vec3(1.30, 0.72, 0.36) * st2 * 0.42;

        // key specular (sun / moon)
        vec3 L1 = normalize(uSunDir);
        vec3 H1 = normalize(L1 + V);
        col += uSunTint * pow(max(dot(N, H1), 0.0), 1500.0) * 18.0 * max(uSunDir.y + 0.10, 0.0);
        col += uSunTint * pow(max(dot(N, H1), 0.0), 120.0) * 0.55;

        // room lights (warm lamp left, cool window right)
        vec3 H2 = normalize(normalize(uFillDir) + V);
        col += uFillColor * pow(max(dot(N, H2), 0.0), 420.0) * 2.6;
        vec3 H3 = normalize(normalize(uFillDir2) + V);
        col += uFillColor2 * pow(max(dot(N, H3), 0.0), 220.0) * 0.85;

        // micro-scratches: fine grazing glints
        float sc = noise3(vObjP * 26.0) * 0.6 + noise3(vObjP * 84.0) * 0.4;
        col += vec3(1.0, 0.94, 0.86) * pow(fres, 1.4) * sc * 0.22 * uScratch;

        // thick glass punt: absorbs, tints and kills the grazing glint
        float punt = smoothstep(-6.2, -10.4, vObjP.x);
        col *= mix(1.0, 0.34, punt);
        float thick = smoothstep(-3.4, -5.2, vObjP.x) * 0.55;
        col *= mix(vec3(1.0), vec3(0.84, 0.97, 0.90), thick);

        col *= uIntensity;
        gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
      }
    `,
  });
}

// ------------------------------------------------------------
//  inner sky dome (a lathe that hugs the inside of the glass)
// ------------------------------------------------------------
const domeUniforms = null; // built lazily below

function buildInnerDome() {
  const segs = 88, N = 170;
  const xS = bottleInnerEnd();
  const xE = BOT.neckX - 0.35;
  const profile = [];
  profile.push({ x: xS, r: 0.001 });
  for (let i = 1; i <= N; i++) {
    const x = lerp(xS, xE, i / N);
    const r = Math.max(0.001, bottleInnerRadius(x) * 0.995);
    profile.push({ x, r });
  }
  const geo = latheXGeometry(profile, segs);
  const u = Object.assign(skyUniforms(), {
    uDeepTop   : { value: new THREE.Color(0x2ea3be) },
    uDeepMid   : { value: new THREE.Color(0x154a68) },
    uDeepBot   : { value: new THREE.Color(0x05182c) },
    uWaterY    : { value: WATER_Y },
    uBottleY   : { value: 0.0 },
    uCenter    : { value: new THREE.Vector3(-1.0, 0, 0) },
    uCaustic   : { value: 1.0 },
    uSkyDome   : { value: 1.0 },
  });
  const mat = new THREE.ShaderMaterial({
    uniforms: u,
    side: THREE.BackSide,
    transparent: false,
    depthWrite: true,
    depthTest: true,
    vertexShader: /* glsl */`
      varying vec3 vWPos;
      varying vec3 vObjP;
      varying vec3 vNrm;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWPos = wp.xyz; vObjP = position;
        vNrm = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      ${GLSL_SKY}
      uniform vec3 uDeepTop, uDeepMid, uDeepBot, uCenter;
      uniform float uWaterY, uCaustic, uSkyDome, uBottleY;
      varying vec3 vWPos, vObjP, vNrm;

      void main(){
        // direction from the bottle centre to this shell fragment
        vec3 d = normalize(vWPos - (uCenter + vec3(0.0, uBottleY, 0.0)));
        vec3 c = skyLook(d) * uSkyDome;
        vec3 dd = normalize(d);

        // ---- stars + moon ----
        if (uNight > 0.02 && dd.y > 0.0) {
          vec2 sp = vec2(atan(dd.z, dd.x) * 5.6, asin(clamp(dd.y, -1.0, 1.0)) * 5.6);
          vec2 gi = floor(sp * 12.0);
          float h = hash21s(gi);
          if (h > 0.958) {
            vec2 gf = fract(sp * 12.0) - 0.5;
            float tw = 0.65 + 0.35 * sin(uSkySunI * 0.0 + h * 91.0);
            c += vec3(0.92, 0.95, 1.0) * smoothstep(0.085, 0.0, dot(gf, gf)) * (h - 0.958) * 30.0 * uNight * tw;
          }
          float md = max(dot(dd, normalize(-uSunDir)), 0.0);
          c += vec3(0.86, 0.90, 1.00) * pow(md, 1200.0) * 7.0 * uNight;
          c += vec3(0.46, 0.58, 0.86) * pow(md, 22.0) * 0.16 * uNight;
        }

        // ---- clouds painted onto the dome ----
        if (dd.y > 0.02) {
          vec2 uv = dd.xz / max(dd.y, 0.06);
          float cl = fbm2(uv * 1.25 + vec2(uSkySunI * 0.0));
          float cm = smoothstep(0.52, 0.80, cl) * smoothstep(0.02, 0.30, dd.y);
          float lit = smoothstep(0.40, 0.85, cl);
          vec3 cloudCol = mix(vec3(0.60,0.61,0.67), vec3(1.62,1.58,1.56), lit) * (1.0 - uNight*0.86);
          cloudCol *= mix(vec3(1.0), vec3(1.20,0.93,0.76), clamp((1.0-abs(normalize(uSunDir).y))*0.9, 0.0, 1.0)*0.70);
          c = mix(c, cloudCol, cm * 0.30);
        }

        // ---- below the waterline: deep volume ----
        float depth = (uWaterY - vObjP.y);
        float below = smoothstep(uWaterY + 0.30, uWaterY - 0.50, vObjP.y);
        vec3 deep = mix(uDeepTop, uDeepMid, smoothstep(0.0, 2.6, depth));
        deep = mix(deep, uDeepBot, smoothstep(2.2, 4.8, depth));
        // god-rays / caustics shimmer
        float g = fbm2(vec2(vObjP.x * 0.7 + uSkySunI, vObjP.z * 0.7 - uSkySunI) + uSkySunI);
        deep += uSunTint * pow(max(uSunDir.y, 0.0), 0.5) * g * 0.34 * uCaustic * (1.0 - uNight * 0.85);
        // the solid glass punt holds water all the way down: keep it from
        // reading as an empty sky-coloured pocket
        float puntMask = smoothstep(-7.6, -11.2, vObjP.x);
        below = max(below, puntMask * 0.92);
        c = mix(c, deep, below);

        gl_FragColor = vec4(c, 1.0);
      }
    `,
  });
  // animate the uv offsets through uSkySunI (cheap) — real time comes from uTime below
  u.uTime = { value: 0 };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = -40;
  mesh.frustumCulled = false;
  return mesh;
}

/* ------------------------------------------------------------
   cork, wax seal, twine and hanging tag — neck dressing
   ------------------------------------------------------------ */
function buildCorkAndSeal(g) {
  const corkCol = [0xa8834f, 0x946f3f, 0xbb9663, 0x7d5c32, 0xc9ab7c];
  const neckR = BOT.neckR;
  // the cork is buried in the neck and mushrooms out past the lip
  const xIn = BOT.neckX + 0.30, xOut = BOT.mouthX + 0.52;
  const c0 = Math.round(xIn / VOX), c1 = Math.round(xOut / VOX);
  for (let ix = c0; ix <= c1; ix++) {
    const xw = ix * VOX;
    const t = (xw - xIn) / (xOut - xIn);
    let rr = (neckR - 0.16) * (1 + smoothstep(0.60, 0.86, t) * 0.22);
    rr *= 1 + (fbm3(xw * 11.0, 0, 0, 2, 7) - 0.5) * 0.10;
    if (t > 0.86) rr *= 1 - smoothstep(0.90, 1.0, t) * 0.16;
    const n = Math.ceil(rr / VOX) + 1;
    for (let iy = -n; iy <= n; iy++) for (let iz = -n; iz <= n; iz++) {
      const y = iy * VOX, z = iz * VOX;
      const d = Math.hypot(y, z) / rr;
      if (d > 1) continue;
      const ang = Math.atan2(z, y);
      const ring = fbm3(Math.cos(ang) * 5.0, Math.sin(ang) * 5.0, xw * 3.4, 2, 3);
      const grain = fbm3(xw * 26, y * 26, z * 26, 3, 3);
      let ci = Math.min(4, Math.max(0, Math.floor(grain * 5.4)));
      g.set(ix, iy, iz, corkCol[ci], { j: 0.09, rou: 0.96, seed: 11 });
      if (ring > 0.62) g.paint(ix, iy, iz, 0x6d4e2b, { j: 0.09, rou: 0.98 });
      else if (ring < 0.36) g.paint(ix, iy, iz, 0xcbb287, { j: 0.07, rou: 0.93 });
      if (d > 0.86) g.paint(ix, iy, iz, 0x8a6c40, { j: 0.08, rou: 0.97 });
    }
  }

  // ---- red wax: a stamped cap on the cork face + a collar with drips ----
  const WAX_R = [0xa8121b, 0xc41f22, 0x8d0f16, 0xd8382e];
  const wx0 = BOT.mouthX - 0.06, wx1 = xOut + 0.16;
  const w0 = Math.round(wx0 / VOX), w1 = Math.round(wx1 / VOX);
  for (let ix = w0; ix <= w1; ix++) {
    const xw = ix * VOX;
    const t = sat((xw - wx0) / (wx1 - wx0));
    let rr = (neckR - 0.16) * (1 + smoothstep(0.55, 0.88, t) * 0.24) + 0.055;
    // the outer end is a flat stamped disc
    if (t > 0.72) rr = lerp(rr, (neckR - 0.16) * 1.20 + 0.10, smoothstep(0.72, 0.90, t));
    const lobe = 1 + (fbm3(Math.cos(t * 6.0) * 4.0, Math.sin(t * 6.0) * 4.0, xw * 6.0, 3, 41) - 0.5) * 0.14;
    if (t > 0.30 && t < 0.86) rr *= lobe;
    const n = Math.ceil(rr / VOX) + 1;
    for (let iy = -n; iy <= n; iy++) for (let iz = -n; iz <= n; iz++) {
      const y = iy * VOX, z = iz * VOX;
      const ang = Math.atan2(z, y);
      const d = Math.hypot(y, z) / rr;
      const lump = fbm3(Math.cos(ang) * 7.0, Math.sin(ang) * 7.0, xw * 8.0, 3, 43);
      if (d > 1 - lump * 0.07) continue;
      const facet = fbm3(xw * 12, y * 12, z * 12, 2, 5);
      const c = WAX_R[Math.min(3, Math.floor(facet * 4.6))];
      g.set(ix, iy, iz, c, { j: 0.05, rou: 0.24, met: 0.03, seed: 9 });
    }
  }
  // drips crawling back over the lip and down the shoulder
  for (let k = 0; k < 11; k++) {
    const a = hash1(k * 37 + 5) * TAU;
    const len = 0.22 + hash1(k * 13 + 7) * 0.60;
    const rNeck = bottleOuterRadius(BOT.mouthX - 0.06) + 0.045;
    for (let q = 0; q < Math.round(len / VOX); q++) {
      const xw = BOT.mouthX - 0.06 - q * VOX;
      const Rr = bottleOuterRadius(xw) + 0.045;
      const wdt = 2 + Math.round(hash1(k * 11 + q) * 1.6);
      for (let b = -wdt; b <= wdt; b++) {
        const th = a + b * (VOX * 0.7) / Math.max(0.4, Rr);
        const iy = Math.round(Math.sin(th) * Rr / VOX);
        const iz = Math.round(Math.cos(th) * Rr / VOX);
        g.set(Math.round(xw / VOX), iy, iz, WAX_R[(k + b) % 4], { j: 0.09, rou: 0.26, met: 0.03, seed: 9 });
      }
      void rNeck;
    }
  }
  // gold impression on the wax face
  const fx = Math.round((xOut + 0.14) / VOX);
  for (let iy = -14; iy <= 14; iy++) for (let iz = -14; iz <= 14; iz++) {
    const r = Math.hypot(iy, iz);
    if (r > 13) continue;
    const ang = Math.atan2(iz, iy) + PI;
    const petal = Math.abs(Math.sin(ang * 6.5));
    if (r < 4.2) {
      g.set(fx + 1, iy, iz, 0xd9b761, { j: 0.05, met: 0.9, rou: 0.26, emi: 0x2a1c06, emiS: 0.55 });
    } else if (petal > 0.42 && r < 12.2) {
      g.set(fx + 1, iy, iz, 0xc9a24a, { j: 0.06, met: 0.86, rou: 0.30, emi: 0x241806, emiS: 0.35 });
    } else if (r < 12.6) {
      g.set(fx + 1, iy, iz, 0x8d0f16, { j: 0.05, rou: 0.28, met: 0.03 });
    }
  }
  return { mouthX: BOT.mouthX, corkEnd: xOut };
}

/** Twine wrapped round the neck with a small hand-lettered tag. */
function buildNeckTwine(g) {
  const ropeCols = [0xc9b48a, 0xb8a276, 0x9d8a63];
  const neckRAt = (x) => Math.min(bottleOuterRadius(x), BOT.neckR + 0.30) + 0.05;
  // coils hugging the narrow part of the neck
  for (let k = 0; k < 6; k++) {
    const cx = BOT.neckX + 1.86 + k * 0.24;
    if (cx > BOT.mouthX - 0.06) break;
    const rr = neckRAt(cx);
    const steps = Math.max(24, Math.round(TAU * rr / (VOX * 0.55)));
    for (let a = 0; a < steps; a++) {
      const th = a / steps * TAU;
      const iy = Math.round(Math.sin(th) * rr / VOX);
      const iz = Math.round(Math.cos(th) * rr / VOX);
      g.set(Math.round(cx / VOX), iy, iz, ropeCols[Math.floor(hash3(iy, iz, k, 3) * 3)], { j: 0.11, rou: 0.96 });
    }
  }
  // a few turns running along the neck and up over the wax
  for (let k = 0; k < 4; k++) {
    const th = k / 4 * TAU + 0.4;
    const n = Math.round((BOT.mouthX + 0.22 - (BOT.neckX + 1.72)) / VOX);
    for (let q = 0; q <= n; q++) {
      const xw = (BOT.neckX + 1.72) + q * VOX;
      const rr = neckRAt(xw);
      const iy = Math.round(Math.sin(th) * rr / VOX);
      const iz = Math.round(Math.cos(th) * rr / VOX);
      g.set(Math.round(xw / VOX), iy, iz, ropeCols[(k + q) % 3], { j: 0.11, rou: 0.96 });
    }
  }

  // ---- hanging tag: a small wooden plaque on a loop of twine ----
  const aX = BOT.neckX + 2.10;
  const aR = neckRAt(aX);
  const tagX = aX + 0.24, tagY = -1.86, tagZ = 0.42;
  const anchorY = -aR * 0.86, anchorZ = aR * 0.48;
  for (let s = 0; s < 2; s++) {
    const z0 = anchorZ + (s === 0 ? -0.09 : 0.09);
    const z1 = tagZ + (s === 0 ? -0.18 : 0.18);
    g.rope(aX / VOX, anchorY / VOX, z0 / VOX, tagX / VOX, (tagY + 0.30) / VOX, z1 / VOX,
      (tagY - anchorY) * 0.12 / VOX, ropeCols[s], { j: 0.10, rou: 0.96 });
  }
  const tx = Math.round(tagX / VOX), tz = Math.round(tagZ / VOX), ty = Math.round(tagY / VOX);
  const w = 5, h = 7;
  for (let i = -w; i <= w; i++) for (let j = -h; j <= h; j++) {
    if (j > h - 2 && Math.abs(i) < 2) continue;                 // hanging notch
    const edge = (Math.abs(i) >= w || Math.abs(j) >= h);
    g.set(tx + j, ty + i, tz, edge ? 0x8a6b45 : 0xdcc7a0, { j: 0.08, rou: 0.88, seed: 4 });
    g.set(tx + j, ty + i, tz + 1, edge ? 0x7a5c3c : 0xcdb68c, { j: 0.08, rou: 0.90, seed: 4 });
  }
  for (let j = -h + 2; j <= h - 3; j++) {
    const row = j - (-h + 2);
    if (row % 2 === 1) continue;
    const half = (row < 4 ? 3 : 2);
    for (let i = -half; i <= half; i++) {
      if (hash3(i, j, 0, 77) < 0.20) continue;
      g.paint(tx + j, ty + i, tz + 1, 0x5f472a, { j: 0.05 });
    }
  }
  // brass eyelet
  g.set(tx - h + 1, ty + h - 1, tz, 0xb8912f, { j: 0.04, met: 0.9, rou: 0.3 });
  g.set(tx - h + 1, ty + h - 1, tz + 1, 0xb8912f, { j: 0.04, met: 0.9, rou: 0.3 });
  return { x: tagX, y: tagY, z: tagZ };
}

/* ==================== 05-water.js ==================== */
/* ============================================================
   5.  THE OCEAN  —  voxel-stepped wave surface + water volume
   ============================================================ */

const OCEAN = {
  cell    : 0.196,
  skirt   : 0.52,          // how far each water column hangs down
  quant   : 0.050,         // vertical step of the voxel water
  spanX   : [-12.38, 9.35],
  margin  : 0.30,
  calm    : { amp: 0.290, freq: 1.02, speed: 1.00 },
  storm   : { amp: 0.640, freq: 1.30, speed: 1.85 },
};

/** CPU twin of the GLSL wave — used by the ship buoyancy + splash emitters. */
function waveHeightJS(px, pz, t, amp, frq, spd) {
  const x = px * frq, z = pz * frq, tt = t * spd;
  let h = 0;
  h += Math.sin(x * 1.05 + tt * 0.85) * 0.42;
  h += Math.sin(z * 0.92 - tt * 0.72) * 0.38;
  h += Math.sin((x * 0.62 + z * 0.48) + tt * 1.15) * 0.30;
  h += Math.sin((x * 2.35 - z * 1.75) - tt * 1.90) * 0.14;
  h += Math.sin((x * 1.60 + z * 2.90) + tt * 2.40) * 0.10;
  h += Math.sin((x * 4.40 + z * 3.60) + tt * 3.30) * 0.055;
  return h * amp;
}
function waveNormalJS(px, pz, t, amp, frq, spd, out) {
  const e = 0.10;
  const hx = waveHeightJS(px + e, pz, t, amp, frq, spd) - waveHeightJS(px - e, pz, t, amp, frq, spd);
  const hz = waveHeightJS(px, pz + e, t, amp, frq, spd) - waveHeightJS(px, pz - e, t, amp, frq, spd);
  out.set(-hx / (2 * e), 1, -hz / (2 * e)).normalize();
  return out;
}

const GLSL_WAVE = /* glsl */`
  uniform float uAmp;
  uniform float uFrq;
  uniform float uSpd;
  uniform float uQuant;
  uniform float uChop;

  float waveH(vec2 p, float t) {
    vec2 q = p * uFrq;
    float tt = t * uSpd;
    float h = 0.0;
    h += sin(q.x * 1.05 + tt * 0.85) * 0.42;
    h += sin(q.y * 0.92 - tt * 0.72) * 0.38;
    h += sin((q.x * 0.62 + q.y * 0.48) + tt * 1.15) * 0.30;
    h += sin((q.x * 2.35 - q.y * 1.75) - tt * 1.90) * 0.14;
    h += sin((q.x * 1.60 + q.y * 2.90) + tt * 2.40) * 0.10;
    h += sin((q.x * 4.40 + q.y * 3.60) + tt * 3.30) * 0.055;
    return h * uAmp;
  }
  vec3 waveN(vec2 p, float t, float e) {
    float hx = waveH(p + vec2(e,0.0), t) - waveH(p - vec2(e,0.0), t);
    float hz = waveH(p + vec2(0.0,e), t) - waveH(p - vec2(0.0,e), t);
    return normalize(vec3(-hx/(2.0*e)*0.42, 1.0, -hz/(2.0*e)*0.42));
  }
`;

function buildWaterSurface() {
  const CELL = OCEAN.cell, H = CELL * 0.5;
  const x0 = OCEAN.spanX[0], x1 = OCEAN.spanX[1];
  const nx = Math.ceil((x1 - x0) / CELL);
  const nz = Math.ceil((IN_R * 2 + OCEAN.margin * 2) / CELL);
  const z0 = -(nz * CELL) * 0.5;

  // ---- collect valid cells -------------------------------------
  const cells = [];
  for (let i = 0; i < nx; i++) {
    const cx = x0 + (i + 0.5) * CELL;
    const R = bottleInnerRadius(cx);
    if (R <= WATER_Y + 0.05) continue;
    const w = Math.sqrt(Math.max(0, R * R - WATER_Y * WATER_Y));
    for (let j = 0; j < nz; j++) {
      const cz = z0 + (j + 0.5) * CELL;
      if (Math.abs(cz) > w * 0.965) continue;
      cells.push(cx, cz);
    }
  }
  const nc = cells.length / 2;

  const VPC = 20;                                  // verts per cell
  const total = nc * VPC;
  const pos  = new Float32Array(total * 3);
  const nrm  = new Float32Array(total * 3);
  const aCell = new Float32Array(total * 2);
  const aSide = new Float32Array(total);
  const aTop  = new Float32Array(total);
  const idx  = new Uint32Array(nc * (6 + 4 * 6));

  let v = 0, w = 0;
  const pushV = (x, y, z, nx_, ny_, nz_, cx, cz, side, top) => {
    pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z;
    nrm[v * 3] = nx_; nrm[v * 3 + 1] = ny_; nrm[v * 3 + 2] = nz_;
    aCell[v * 2] = cx; aCell[v * 2 + 1] = cz;
    aSide[v] = side; aTop[v] = top;
    v++;
  };

  for (let c = 0; c < nc; c++) {
    const cx = cells[c * 2], cz = cells[c * 2 + 1];
    // ---- top quad ----
    const b = v;
    pushV(cx - H, 0, cz - H, 0, 1, 0, cx, cz, 0, 1);
    pushV(cx + H, 0, cz - H, 0, 1, 0, cx, cz, 0, 1);
    pushV(cx + H, 0, cz + H, 0, 1, 0, cx, cz, 0, 1);
    pushV(cx - H, 0, cz + H, 0, 1, 0, cx, cz, 0, 1);
    idx[w++] = b; idx[w++] = b + 2; idx[w++] = b + 1;
    idx[w++] = b; idx[w++] = b + 3; idx[w++] = b + 2;

    // ---- 4 side skirts ----
    const SIDES = [
      // side, normal, cornerA, cornerB
      [1,  1, 0,  [ H, -H], [ H,  H]],
      [2, -1, 0,  [-H,  H], [-H, -H]],
      [3,  0, 1,  [ H,  H], [-H,  H]],
      [4,  0,-1,  [-H, -H], [ H, -H]],
    ];
    for (const [sd, nx_, nz_, ca, cb] of SIDES) {
      const b2 = v;
      pushV(cx + ca[0], 0, cz + ca[1], nx_, 0, nz_, cx, cz, sd, 1);
      pushV(cx + cb[0], 0, cz + cb[1], nx_, 0, nz_, cx, cz, sd, 1);
      pushV(cx + cb[0], 0, cz + cb[1], nx_, 0, nz_, cx, cz, sd, 0);
      pushV(cx + ca[0], 0, cz + ca[1], nx_, 0, nz_, cx, cz, sd, 0);
      // winding so the face points outward
      if (sd === 1 || sd === 4) {
        idx[w++] = b2; idx[w++] = b2 + 2; idx[w++] = b2 + 1;
        idx[w++] = b2; idx[w++] = b2 + 3; idx[w++] = b2 + 2;
      } else {
        idx[w++] = b2; idx[w++] = b2 + 1; idx[w++] = b2 + 2;
        idx[w++] = b2; idx[w++] = b2 + 2; idx[w++] = b2 + 3;
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('aCell', new THREE.BufferAttribute(aCell, 2));
  geo.setAttribute('aSide', new THREE.BufferAttribute(aSide, 1));
  geo.setAttribute('aTop', new THREE.BufferAttribute(aTop, 1));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeBoundingSphere();

  const u = Object.assign(skyUniforms(), {
    uAmp   : { value: OCEAN.calm.amp },
    uFrq   : { value: OCEAN.calm.freq },
    uSpd   : { value: OCEAN.calm.speed },
    uQuant : { value: OCEAN.quant },
    uChop  : { value: 0 },
    uTime  : { value: 0 },
    uCell  : { value: CELL },
    uH     : { value: H },
    uSkirt : { value: OCEAN.skirt },
    uWaterY: { value: WATER_Y },
    uDeep  : { value: new THREE.Color(0x1b5578) },
    uShallow:{ value: new THREE.Color(0x3fb0bc) },
    uFoam  : { value: new THREE.Color(0xf2f6f4) },
    uSunDir2:{ value: new THREE.Vector3() },
    uTexel : { value: 1 },
  });

  const mat = new THREE.ShaderMaterial({
    uniforms: u,
    transparent: true,
    depthWrite: true,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      precision highp float;
      ${GLSL_SKY}
      ${GLSL_WAVE}
      uniform float uTime, uH, uSkirt, uWaterY;
      attribute vec2 aCell;
      attribute float aSide;
      attribute float aTop;
      varying vec3 vWorld, vNrm, vBoxPos, vLocal;
      varying float vTopH, vFoam, vSide, vDown;

      void main(){
        float h = waveH(aCell, uTime);
        h = floor(h / uQuant + 0.5) * uQuant;

        vec3 p = position;
        vec3 n = normal;
        if (aSide < 0.5) {
          p.y = h;
          n = waveN(aCell, uTime, 0.11);
          vNrm = n;
          vFoam = 0.0;
          vDown = 0.0;
        } else {
          p.y = h - (1.0 - aTop) * uSkirt;
          p.xz += n.xz * 0.0026;
          vNrm = normal;
          vFoam = 0.0;
          vDown = 1.0 - aTop;
        }
        vSide = aSide;
        vTopH = h;

        // ---- keep the surface level in WORLD space while the bottle rocks ----
        vec4 wp = modelMatrix * vec4(p, 1.0);
        float groundY = modelMatrix[3][1];
        wp.y = groundY + uWaterY + p.y;

        vWorld = wp.xyz;
        vBoxPos = p;
        // bottle-local position (model matrix is rigid: inverse == R^T, -R^T T)
        mat3 R = mat3(modelMatrix);
        mat3 Rt = mat3(R[0][0], R[1][0], R[2][0],
                       R[0][1], R[1][1], R[2][1],
                       R[0][2], R[1][2], R[2][2]);
        vLocal = Rt * (wp.xyz - modelMatrix[3].xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      ${GLSL_SKY}
      ${GLSL_WAVE}
      uniform float uTime, uCell, uH, uSkirt, uWaterY;
      uniform vec3 uDeep, uShallow, uFoam;
      varying vec3 vWorld, vNrm, vBoxPos, vLocal;
      varying float vTopH, vFoam, vSide, vDown;

      float bottleRAt(float x) {
        float ax = abs(x);
        if (x < -7.75) {
          float d = -7.75 - x;
          return max(0.0, sqrt(max(0.0, 21.3444 - d * d)) - 0.20);
        }
        if (ax > 7.75) {
          float t = clamp((ax - 7.75) / 2.60, 0.0, 1.0);
          return mix(4.565, 1.265, t * t * (3.0 - 2.0 * t));
        }
        return 4.565;
      }

      void main(){
        // never let the (always-horizontal) surface poke through the glass
        if (length(vLocal.yz) > bottleRAt(vLocal.x) - 0.015) discard;
        vec3 N = normalize(vNrm);
        vec3 V = normalize(cameraPosition - vWorld);
        if (dot(N, V) < 0.0) N = -N;

        float crest = clamp(vTopH / max(0.02, uAmp) * 0.5 + 0.5, 0.0, 1.0);
        float slope = length(waveN(vBoxPos.xz, uTime, 0.11).xz) * 2.0;

        // ---- colour: shallow teal -> deep blue, foam on the crests ----
        vec3 base = mix(uDeep, uShallow, 0.34 + pow(crest, 1.7) * 0.66);
        if (vSide > 0.5) base = mix(uDeep, base, 0.35);

        // ---- reflection ----
        vec3 R = reflect(-V, N);
        vec3 refl = skyLook(R);
        float fres = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 3.0);
        float facing = clamp(dot(N, V), 0.0, 1.0);

        float foamN = fbm2(vBoxPos.xz * 3.1 + vec2(uTime * 0.09, -uTime * 0.06));
        float foam = smoothstep(0.88, 1.22, crest * 0.58 + slope * 0.55 + foamN * 0.22 - uChop * 0.18);
        foam *= smoothstep(0.0, 0.25, uChop + 0.35);

        vec3 col = mix(base, refl * 0.86, clamp(0.14 + fres * 0.72, 0.0, 0.86));
        col += uSunTint * pow(max(dot(N, normalize(uSunDir)), 0.0), 90.0) * 1.25 * uSkySunI;

        // foam caps + trails
        col = mix(col, uFoam * (0.82 + 0.30 * foamN), foam * 0.80);
        col = mix(col, uFoam * 0.70, smoothstep(0.86, 1.15, slope) * 0.24);

        // translucency: looking straight down you see into the water
        float alpha = mix(0.60, 0.90, fres);
        alpha = mix(alpha, 1.0, foam * 0.85);
        if (vSide > 0.5) {
          // the vertical face of each water column reads as translucent surf:
          // bright foam collar at the crest, fading into the body of the water
          float fd = clamp(vDown, 0.0, 1.0);
          float collar = (1.0 - smoothstep(0.0, 0.24, fd)) * smoothstep(0.52, 0.96, crest);
          vec3 surf = mix(mix(uDeep, uShallow, 0.62), uFoam, collar * 0.72);
          surf += uSunTint * collar * 0.25 * uSkySunI;
          col = mix(col, surf, 0.62 + collar * 0.22);
          float sm = mix(0.88, 0.03, fd * fd * (3.0 - 2.0 * fd));
          alpha = max(alpha * sm, collar * 0.34);
        }

        gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
      }
    `,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 12;
  mesh.userData.uniforms = u;
  mesh.userData.cellCount = nc;
  return mesh;
}

// ------------------------------------------------------------
//  underwater caustic light shafts (cheap additive quads)
// ------------------------------------------------------------
function buildGodRays() {
  const grp = new THREE.Group();
  const u = Object.assign(skyUniforms(), {
    uTime: { value: 0 }, uChop: { value: 0 },
  });
  const mat = new THREE.ShaderMaterial({
    uniforms: u, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `
      varying vec2 vUv; varying vec3 vW;
      void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz;
        gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `
      precision highp float;
      ${GLSL_SKY}
      uniform float uTime, uChop;
      varying vec2 vUv; varying vec3 vW;
      void main(){
        float edge = smoothstep(0.0,0.40,vUv.x)*smoothstep(1.0,0.60,vUv.x);
        float fall = pow(1.0 - vUv.y, 2.3);
        float w = fbm2(vec2(vUv.x*3.1 + uTime*0.06, vUv.y*1.3 - uTime*0.03));
        float amt = edge * fall * (0.26 + w*0.70) * 0.105;
        amt *= (0.30 + max(uSunDir.y,0.0)) * uSkySunI;
        gl_FragColor = vec4(uSunTint * amt, amt);
      }`,
  });
  for (let i = 0; i < 12; i++) {
    const ang = hash1(i * 31 + 11) * TAU;
    const cx = Math.cos(ang) * (1.1 + hash1(i * 17 + 9) * 6.2);
    const cz0 = Math.sin(ang) * (1.0 + hash1(i * 41 + 3) * 2.2);
    const wdt = 0.26 + hash1(i * 13 + 5) * 0.46;
    // every shaft has to fit inside the glass, corners included
    const R = bottleInnerRadius(cx) - 0.24 - wdt;
    if (R <= 0.7) continue;
    const cz = cz0 * (R * 0.62 / 3.2);
    const vmax = Math.sqrt(Math.max(0.05, R * R - cz * cz)) * 0.94;
    const yTop = Math.min(WATER_Y + 0.10, vmax);
    const yBot = Math.max(WATER_Y - (1.5 + hash1(i * 7 + 3) * 2.6), -vmax);
    const h = yTop - yBot;
    if (h < 0.9) continue;
    const geo = new THREE.PlaneGeometry(wdt, h, 1, 4);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(cx, (yTop + yBot) * 0.5, cz);
    m.rotation.y = hash1(i * 23 + 1) * TAU;
    m.rotation.x = (hash1(i * 29 + 2) - 0.5) * 0.10;
    m.renderOrder = 8;
    grp.add(m);
  }
  grp.userData.uniforms = u;
  return grp;
}

/* ==================== 06-island.js ==================== */
/* ============================================================
   6.  THE CORAL ISLAND  —  terrain, lighthouse, cabin, palms, dock
   ============================================================ */

const ISLE = { x: 2.95, z: 0.14, r: 2.10, h: 1.30, base: WATER_Y - 0.20 };

const PAL_ROCK   = [0x6d6358, 0x7c7166, 0x5a5148, 0x877b6d, 0x4e463f];
const PAL_SAND   = [0xe6d5a8, 0xd9c391, 0xf0e2bc, 0xcbb382];
const PAL_GRASS  = [0x4f7a37, 0x40672c, 0x608a42, 0x365c26, 0x6f9a4d];
const PAL_REEF   = [0x2a4a52, 0x33585e, 0x223f4a, 0x3c6468, 0x1c3540];
const PAL_CORAL  = [0xb04a48, 0xc07450, 0x9c4c7c, 0xac4058, 0xc09040, 0x7c4a92, 0xd07464];

function islandHeightAt(x, z) {
  const dx = x - ISLE.x, dz = z - ISLE.z;
  const ang = Math.atan2(dz, dx);
  const wob = 1 + (fbm3(Math.cos(ang) * 2.3, 0, Math.sin(ang) * 2.3, 3, 3) - 0.5) * 0.46;
  const rr = Math.hypot(dx / 1.14, dz) / (ISLE.r * wob);
  if (rr > 1.09) return -99;
  if (rr > 1.0) {
    return lerp(0, -0.30, smootherstep(0, 1, (rr - 1.0) / 0.09));
  }
  const t = rr;
  let h = Math.pow(1 - t * t, 0.62) * ISLE.h;
  h += (fbm3(dx * 1.9, 0.5, dz * 1.9, 3, 5) - 0.5) * 0.30 * (1 - t * 0.35);
  // lighthouse plateau
  const lx = dx - 0.52, lz = dz + 0.40;
  h += Math.exp(-(lx * lx + lz * lz) / 0.46) * 0.34;
  // cabin terrace
  const cx2 = dx + 1.00, cz2 = dz - 0.44;
  h += Math.exp(-(cx2 * cx2 * 1.15 + cz2 * cz2) / 0.56) * 0.20;
  // a small ridge toward the dock
  const dx3 = dx + 1.35, dz3 = dz + 0.72;
  h += Math.exp(-(dx3 * dx3 * 2.2 + dz3 * dz3 * 2.2) / 0.30) * 0.08;
  return Math.max(h, -1.6);
}
function islandWorldY(x, z) { return ISLE.base + islandHeightAt(x, z); }

function pickFrom(arr, x, y, z, s) {
  return arr[Math.min(arr.length - 1, Math.floor(hash3(Math.round(x * 37), Math.round(y * 37), Math.round(z * 37), s) * arr.length))];
}

// ------------------------------------------------------------
//  terrain shell  (height-field, so only the exposed skin is emitted)
// ------------------------------------------------------------
function buildIslandTerrain(g) {
  const V = g.vox;
  const R = 1.62;
  const i0 = Math.round((ISLE.x - ISLE.r * 1.20 * R) / V), i1 = Math.round((ISLE.x + ISLE.r * 1.20 * R) / V);
  const j0 = Math.round((ISLE.z - ISLE.r * R) / V),        j1 = Math.round((ISLE.z + ISLE.r * R) / V);
  const cache = new Map();
  const HV = (i, j) => {
    const k = (i + 4096) * 16384 + (j + 4096);
    let v = cache.get(k);
    if (v === undefined) { v = islandHeightAt(i * V, j * V); cache.set(k, v); }
    return v;
  };

  const STEP = Math.max(1, Math.round(0.055 / V));
  for (let j = j0; j <= j1; j += STEP) {
    for (let i = i0; i <= i1; i += STEP) {
      const ht = HV(i, j);
      if (ht < -10) continue;
      let hm = Math.min(ht, HV(i + STEP, j), HV(i - STEP, j), HV(i, j + STEP), HV(i, j - STEP));
      if (hm < -10) hm = ht - 0.85;
      const wx = i * V, wz = j * V;
      const yTop = ISLE.base + ht;
      const yBot = ISLE.base + Math.min(hm, ht - 0.04);
      const k0 = Math.round(yBot / V), k1 = Math.round(yTop / V);
      for (let k = k0; k <= k1; k++) {
        const wy = k * V;
        let hex, opt;
        if (wy < WATER_Y - 0.14) {
          // submerged reef rock
          const n = fbm3(wx * 3.4, wy * 3.4, wz * 3.4, 2, 13);
          hex = pickFrom(PAL_REEF, wx, wy, wz, 3);
          opt = { j: 0.10, rou: 0.94, seed: 3 };
          if (n > 0.70) { hex = pickFrom(PAL_CORAL, wx, wy, wz, 9); opt = { j: 0.09, rou: 0.82, seed: 9 }; }
          else if (n > 0.55) { hex = 0x4e4a44; opt = { j: 0.10, rou: 0.92, seed: 4 }; }
        } else if (wy < WATER_Y + 0.20) {
          hex = pickFrom(PAL_SAND, wx, wy, wz, 11);
          opt = { j: 0.055, rou: 0.92, seed: 11 };
          if (fbm3(wx * 6, wy * 6, wz * 6, 2, 17) > 0.66) hex = 0xc0a878;
        } else {
          const slope = (ht - hm) / Math.max(0.001, V * 3);
          const gn = fbm3(wx * 2.6, wy * 2.2, wz * 2.6, 3, 19);
          if (slope > 0.55 || gn < 0.36) {
            hex = pickFrom(PAL_ROCK, wx, wy, wz, 5);
            opt = { j: 0.09, rou: 0.95, seed: 5 };
          } else {
            hex = pickFrom(PAL_GRASS, wx, wy, wz, 7);
            opt = { j: 0.10, rou: 0.98, seed: 7 };
          }
          if (wy > WATER_Y + 0.22 && gn > 0.74) { hex = 0x7fa85a; opt = { j: 0.12, rou: 0.98 }; }
        }
        // only the top twice as many layers as the exposed step
        const isSurface = (k >= k1 - Math.max(0, Math.round((ht - hm) / V)) - 2);
        if (!isSurface) continue;
        for (let di = 0; di < STEP; di++) for (let dj = 0; dj < STEP; dj++)
          g.set(i + di, k, j + dj, hex, opt);
      }
    }
  }
}

// ------------------------------------------------------------
//  lighthouse
// ------------------------------------------------------------
function buildLighthouse(g, cx, cy, cz) {
  const V = g.vox;
  const RED = [0xc4362f, 0xa82a25, 0xd94b40];
  const WHT = [0xe8e2d6, 0xd6cfc0, 0xf3eee4];
  const STONE = [0x7a7168, 0x6a615a, 0x88807a];
  const KB = Math.round(cy / V);
  const ci = Math.round(cx / V), cj = Math.round(cz / V);

  // ---- stone plinth ----
  const baseR = 0.60, baseH = 0.22;
  for (let k = 0; k <= Math.round(baseH / V); k++) {
    const r = baseR * (1 - k * 0.035);
    g.cyl(cx / V, KB + k, cz / V, r / V, KB + k, KB + k, 0x6a615a, null, (x, y, z, dx, dz, d) => {
      const n = fbm3(x * 5, y * 5, z * 5, 2, 21);
      return n > 0.58 ? pickFrom(STONE, x, y, z, 2) : 0x5f574f;
    });
  }
  const y0 = KB + Math.round(baseH / V);
  const towerH = 1.02;
  const kTop = y0 + Math.round(towerH / V);
  const bandH = Math.max(1, Math.round(0.26 / V));
  for (let k = y0; k <= kTop; k++) {
    const t = (k - y0) / (kTop - y0);
    const r = lerp(0.40, 0.29, t);
    const band = Math.floor((k - y0) / bandH) % 2;
    const pal = band ? RED : WHT;
    for (let a = 0; a < 128; a++) {
      const ang = a / 128 * TAU;
      const rr = r + (fbm3(Math.cos(ang) * 4, k * 0.6, Math.sin(ang) * 4, 2, 23) - 0.5) * 0.010;
      g.set(ci + Math.round(Math.cos(ang) * rr / V), k, cj + Math.round(Math.sin(ang) * rr / V),
        pickFrom(pal, a, k, 0, 8), { j: 0.07, rou: 0.88 });
      g.set(ci + Math.round(Math.cos(ang) * (rr - 0.05) / V), k, cj + Math.round(Math.sin(ang) * (rr - 0.05) / V),
        0x3a332e, { j: 0.06, rou: 0.95 });
    }
  }
  // ---- gallery ----
  const gk = kTop;
  for (let k = gk; k <= gk + Math.round(0.08 / V); k++)
    g.cyl(cx / V, k, cz / V, 0.52 / V, k, k, 0x5b5148, null,
      (x, y, z, dx, dz, d) => (d > 0.52 / V - 1.6 ? 0x4a423a : null));
  for (let a = 0; a < 18; a++) {
    const t = a / 18 * TAU;
    for (let k = 0; k < Math.round(0.16 / V); k++)
      g.set(ci + Math.round(Math.cos(t) * 0.50 / V), gk + Math.round(0.08 / V) + k,
        cj + Math.round(Math.sin(t) * 0.50 / V), 0x8f8a80, { j: 0.07, met: 0.6, rou: 0.45 });
  }
  // ---- lantern room ----
  const lk0 = gk + Math.round(0.08 / V) + Math.round(0.17 / V);
  const lk1 = lk0 + Math.round(0.32 / V);
  const lr = 0.33;
  for (let k = lk0; k <= lk1; k++) {
    for (let a = 0; a < 72; a++) {
      const t = a / 72 * TAU;
      const post = (a % 9 === 0);
      g.set(ci + Math.round(Math.cos(t) * lr / V), k, cj + Math.round(Math.sin(t) * lr / V),
        post ? 0xb08a3a : 0x2a3f52,
        post ? { j: 0.06, met: 0.85, rou: 0.28 } : { j: 0.05, rou: 0.12, met: 0.1, emi: 0xffcf7a, emiS: 0.55 });
    }
  }
  const lampK = Math.round((lk0 + lk1) / 2);
  g.ellipsoid(cx / V, lampK, cz / V, 5, 5, 5, 0xffe9a8, { j: 0.03, rou: 0.4, emi: 0xffc861, emiS: 2.4, seed: 5 });
  // ---- red cap ----
  const capN = Math.round(0.20 / V);
  for (let k = 0; k <= capN; k++) {
    const t = k / capN;
    const r = 0.40 * Math.sqrt(Math.max(0, 1 - t * t * 0.92));
    if (r < 0.05) continue;
    g.ellipsoid(cx / V, lk1 + 1 + k, cz / V, r / V, 0.5, r / V, 0xa8291f,
      { j: 0.07, rou: 0.62, seed: 12 }, (x, y, z, dx, dy, dz, d) => (d > 0.55 ? 0xb93a2a : 0x8c1f18));
  }
  const finK = lk1 + 1 + capN + 1;
  for (let k = 0; k < Math.round(0.16 / V); k++)
    g.set(ci, finK + k, cj, 0xb08a3a, { j: 0.05, met: 0.9, rou: 0.3 });
  g.set(ci, finK + Math.round(0.16 / V), cj, 0xd8b45a, { j: 0.05, met: 1, rou: 0.22, emi: 0x3a2a08, emiS: 0.6 });

  return {
    lampY: (lampK + 0.5) * V,
    lampPos: new THREE.Vector3(cx, (lampK + 0.5) * V, cz),
    topY: (finK + 3) * V,
  };
}

// ------------------------------------------------------------
//  fisherman's cabin
// ------------------------------------------------------------
function buildCabin(g, cx, cy, cz, rot) {
  const V = g.vox;
  const WALL = [0x9a9086, 0x8a8178, 0xa89e93, 0x776f67];
  const W = 0.56, D = 0.44, Hh = 0.40, roofH = 0.30;
  const KB = Math.round(cy / V);
  const cs = Math.cos(rot), sn = Math.sin(rot);
  const put = (u, v, w, hex, o) => {
    const x = cx + (u * cs - w * sn);
    const z = cz + (u * sn + w * cs);
    g.set(Math.round(x / V), KB + Math.round(v / V), Math.round(z / V), hex, o);
  };
  const k1 = Math.round(Hh / V);

  for (let k = 0; k <= k1; k++) {
    for (let a = -Math.round(W / V); a <= Math.round(W / V); a++)
      for (let b = -Math.round(D / V); b <= Math.round(D / V); b++) {
        const onEdge = (Math.abs(Math.abs(a) - Math.round(W / V)) < 1) || (Math.abs(Math.abs(b) - Math.round(D / V)) < 1);
        if (!onEdge) continue;
        put(a * V, k * V, b * V, pickFrom(WALL, a, k, b, 4), { j: 0.09, rou: 0.95, seed: 2 });
      }
  }
  for (const [su, sw] of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
    for (let k = 0; k <= k1; k++) put(su * W, k * V, sw * D, 0x4a3423, { j: 0.07, rou: 0.9 });

  // warm windows + shutters
  for (const [u, w, side] of [[W * 1.02, 0.10, 0], [-W * 1.02, -0.10, 1], [0.12, D * 1.02, 2], [-0.14, -D * 1.02, 3]]) {
    for (let k = Math.round(0.14 / V); k <= Math.round(0.30 / V); k++)
      for (let a = -1; a <= 1; a++) {
        const q = (side < 2) ? [u, w + a * V] : [u + a * V, w];
        put(q[0], k * V, q[1], 0xffd88a, { j: 0.04, rou: 0.25, met: 0.0, emi: 0xffb54a, emiS: 1.6 });
      }
    for (let k = Math.round(0.12 / V); k <= Math.round(0.32 / V); k++)
      for (const a of [-2, 2]) {
        const q = (side < 2) ? [u, w + a * V] : [u + a * V, w];
        put(q[0], k * V, q[1], 0x7c4b2c, { j: 0.08, rou: 0.85 });
      }
  }

  // gable roof
  const rk = Math.round(roofH / V);
  for (let k = k1 + 1; k <= k1 + rk; k++) {
    const t = (k - k1) / rk;
    const wdt = W * (1 - t * 0.92) + 0.05;
    for (let a = -Math.round(wdt / V) - 1; a <= Math.round(wdt / V) + 1; a++)
      for (let b = -Math.round(D / V) - 1; b <= Math.round(D / V) + 1; b++) {
        const onEdge = (Math.abs(Math.abs(b) - Math.round(D / V) - 1) < 1) || (k === k1 + rk) ||
                       (Math.abs(Math.abs(a) - Math.round(wdt / V)) < 1.2);
        if (!onEdge) continue;
        const n = fbm3(a * 0.7, k * 0.8, b * 0.7, 2, 43);
        put(a * V, k * V, b * V, n > 0.55 ? 0x8a5a34 : (n > 0.35 ? 0x74492a : 0x9b6a3e),
          { j: 0.10, rou: 0.96, seed: 6 });
      }
  }
  for (let b = -Math.round(D / V) - 1; b <= Math.round(D / V) + 1; b++) {
    put(0, (k1 + rk) * V, b * V, 0x50372a, { j: 0.08, rou: 0.9 });
    put(0, (k1 + rk + 2) * V, b * V, 0x3f2b20, { j: 0.08, rou: 0.9 });
  }
  // chimney
  const cpx = W * 0.52, cpz = -D * 0.52;
  for (let k = k1; k <= k1 + rk + Math.round(0.14 / V); k++)
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      if (Math.abs(a) < 1 && Math.abs(b) < 1 && k < k1 + rk) continue;
      put(cpx + a * V, k * V, cpz + b * V, (Math.abs(a) === 1 || Math.abs(b) === 1) ? 0x6d6055 : 0x53483f,
        { j: 0.09, rou: 0.96 });
    }
  return { doorX: cx, doorZ: cz };
}

// ------------------------------------------------------------
//  palm trees
// ------------------------------------------------------------
function buildPalm(g, bx, by, bz, h, leanA, leanT, seed, scale) {
  const V = g.vox;
  scale = scale || 1;
  const n = Math.round(h / V);
  const bend = leanT * h * 0.55;
  const tipX = bx + Math.cos(leanA) * bend, tipZ = bz + Math.sin(leanA) * bend;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const px = bx + Math.cos(leanA) * bend * t * t;
    const pz = bz + Math.sin(leanA) * bend * t * t;
    const py = by + t * h;
    const r = lerp(0.115, 0.075, t) * scale;
    const k = Math.round(py / V), ix = Math.round(px / V), iz = Math.round(pz / V);
    const rr = Math.ceil(r / V);
    for (let a = -rr; a <= rr; a++) for (let b = -rr; b <= rr; b++) {
      if (a * a + b * b > rr * rr + 0.5) continue;
      const ring = Math.abs(Math.hypot(a, b) - rr) < 1.4;
      const nseg = Math.floor(t * n / Math.max(1, Math.round(0.22 / V)));
      const c = ring ? 0x8a6a3e : (nseg % 2 ? 0x6b512e : 0x7d5f38);
      g.set(ix + a, k, iz + b, c, { j: 0.08, rou: 0.94, seed });
    }
  }
  // ---- fronds ----
  const tipY = by + h;
  const NC = 9;
  for (let c = 0; c < NC; c++) {
    const a = c / NC * TAU + hash1(seed * 31 + c) * 0.55;
    const len = (0.62 + hash1(seed * 17 + c * 7) * 0.30) * scale;
    const drop = (0.30 + hash1(seed * 13 + c * 5) * 0.24) * scale;
    const segs = Math.round(len / V);
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const rr = t * len;
      const px = tipX + Math.cos(a) * rr;
      const pz = tipZ + Math.sin(a) * rr;
      const py = tipY + 0.06 - drop * t * t - t * 0.02;
      const wid = (Math.sin(t * PI) * 0.115 + 0.022) * scale;
      const side = Math.max(1, Math.round(wid / V));
      const k = Math.round(py / V);
      const ix = Math.round(px / V), iz = Math.round(pz / V);
      const dark = hash3(s, c, seed, 3) > 0.5;
      for (let q = -side; q <= side; q++) {
        const qx = Math.round(ix + (-Math.sin(a)) * q * 0.9);
        const qz = Math.round(iz + (Math.cos(a)) * q * 0.9);
        const cc = dark ? 0x2f6b2c : (Math.abs(q) === side ? 0x3f7f37 : 0x4e913f);
        g.set(qx, k, qz, cc, { j: 0.11, rou: 0.99, seed: seed * 3 });
      }
      // drooping tip
      if (t > 0.88) g.set(ix, k - 1, iz, 0x2f6b2c, { j: 0.10, rou: 0.99 });
    }
  }
  // coconuts
  for (let c = 0; c < 4; c++) {
    const a = c / 4 * TAU + hash1(seed * 7) * 1.2;
    g.ellipsoid(Math.round((tipX + Math.cos(a) * 0.09) / V), Math.round((tipY - 0.07) / V),
      Math.round((tipZ + Math.sin(a) * 0.09) / V), 1.6, 1.6, 1.6, 0x5c4322, { j: 0.09, rou: 0.9 });
  }
  return { tipX, tipY, tipZ };
}

// ------------------------------------------------------------
//  dock + rowing boat
// ------------------------------------------------------------
function buildDock(g, x0, z0, dirX, dirZ, len, y) {
  const V = g.vox;
  const dxn = dirX, dzn = dirZ;
  const px = -dzn, pz = dxn;
  const n = Math.round(len / V);
  // deck planks
  for (let i = 0; i <= n; i++) {
    const cx = x0 + dxn * i * V, cz = z0 + dzn * i * V;
    for (let w = -4; w <= 4; w++) {
      const qx = cx + px * w * V, qz = cz + pz * w * V;
      const cc = (i % 2) ? 0x6b4a2c : 0x7c5734;
      g.set(Math.round(qx / V), Math.round(y / V), Math.round(qz / V), cc, { j: 0.09, rou: 0.92, seed: 8 });
    }
  }
  // piles
  for (let i = 0; i <= n; i += Math.max(1, Math.round(0.55 / V))) {
    const cx = x0 + dxn * i * V, cz = z0 + dzn * i * V;
    for (const w of [-4, 4]) {
      const qx = Math.round((cx + px * w * V) / V), qz = Math.round((cz + pz * w * V) / V);
      for (let k = Math.round((y - 0.70) / V); k <= Math.round((y + 0.14) / V); k++)
        g.set(qx, k, qz, 0x4b3524, { j: 0.09, rou: 0.94, seed: 2 });
    }
  }
  // a lantern at the end
  const ex = x0 + dxn * len, ez = z0 + dzn * len;
  const lx = Math.round(ex / V), lz = Math.round(ez / V), ly = Math.round((y + 0.16) / V);
  for (let k = 0; k < 4; k++) g.set(lx, ly + k, lz, 0x4a3a28, { j: 0.06, rou: 0.9 });
  g.set(lx, ly + 4, lz, 0xffd98a, { j: 0.03, rou: 0.3, emi: 0xffb54a, emiS: 2.2 });
  g.set(lx, ly + 5, lz, 0x8a6a3a, { j: 0.05, met: 0.7, rou: 0.4 });
  return { endX: ex, endZ: ez };
}

function buildRowboat(g, cx, cy, cz, rot, seed) {
  const V = g.vox;
  const cs = Math.cos(rot), sn = Math.sin(rot);
  const L = 0.46, W = 0.20;
  const toW = (u, w) => [cx + u * cs - w * sn, cz + u * sn + w * cs];
  const n = Math.round(L / V);
  for (let i = -n; i <= n; i++) {
    const t = i / n;
    const hw = W * Math.sqrt(Math.max(0, 1 - t * t)) * 0.92 + 0.028;
    const ky = Math.round((cy + Math.abs(t) * 0.075) / V);
    const m = Math.round(hw / V);
    for (let j = -m; j <= m; j++) {
      const [wx, wz] = toW(i * V, j * V);
      const edge = Math.abs(Math.abs(j) - m) < 1.2;
      const hullY = ky - (edge ? 3 : 0);
      g.set(Math.round(wx / V), hullY, Math.round(wz / V), edge ? 0x6f4b2c : 0x8a6238,
        { j: 0.09, rou: 0.9, seed });
      if (edge) for (let k = 1; k <= 3; k++)
        g.set(Math.round(wx / V), hullY - k, Math.round(wz / V), k > 2 ? 0x5a3c23 : 0x7a5530, { j: 0.09, rou: 0.92 });
    }
  }
  // thwarts
  for (const t of [-0.35, 0.15, 0.6]) {
    const i = Math.round(t * n);
    const hw = W * Math.sqrt(Math.max(0, 1 - t * t)) * 0.92;
    const m = Math.round(hw / V);
    for (let j = -m; j <= m; j++) {
      const [wx, wz] = toW(i * V, j * V);
      g.set(Math.round(wx / V), Math.round((cy + 0.06 + Math.abs(t) * 0.075) / V), Math.round(wz / V), 0x9a7248, { j: 0.08, rou: 0.9 });
    }
  }
  // oars
  for (const s of [-1, 1]) {
    const a = rot + s * 0.6;
    for (let q = 0; q < 11; q++) {
      const u = Math.cos(a) * (0.18 + q * 0.032), w = Math.sin(a) * (0.18 + q * 0.032);
      const [wx, wz] = toW(u, w);
      g.set(Math.round(wx / V), Math.round((cy + 0.13) / V), Math.round(wz / V), 0x8a7248, { j: 0.07, rou: 0.88 });
    }
  }
  // coiled rope
  for (let a = 0; a < 26; a++) {
    const t = a / 26 * TAU;
    const [wx, wz] = toW(-0.30 + Math.cos(t) * 0.055, Math.sin(t) * 0.055);
    g.set(Math.round(wx / V), Math.round((cy + 0.05) / V), Math.round(wz / V), 0xc0ab84, { j: 0.08, rou: 0.96 });
    g.set(Math.round(wx / V), Math.round((cy + 0.10) / V), Math.round(wz / V), 0xa8946f, { j: 0.08, rou: 0.96 });
  }
}
