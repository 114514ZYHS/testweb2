<script type="module">
import * as THREE from 'three';

/* ============================================================
   瓶中沧海 · Ocean in a Bottle
   Voxel diorama inside a horizontal glass bottle — Three.js r160
   ============================================================ */

// ---------- tiny utils ----------
let _seed = 20260920;
function rnd(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function rr(a, b){ return a + (b - a) * rnd(); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function smoothstep(a, b, x){ const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function damp(cur, tgt, lambda, dt){ return lerp(cur, tgt, 1 - Math.exp(-lambda * dt)); }

// ---------- core dimensions (world units) ----------
const VOX   = 0.040;              // voxel edge length
const BODY_R = 0.85;              // bottle outer body radius
const IN_R  = 0.80;               // bottle inner radius (glass ~0.05 thick)
const WATER_Y = -0.42;            // inner sea level (world Y)
const BOTTLE_C = new THREE.Vector3(0, 0, 0);   // bottle axis center
const ISLE_C = { x: -0.15, z: 0.0 };            // island center (x,z)

// bottle lathe profile: [radius, axial x]  (outer glass surface)
const BTL_PROFILE = [
  [0.000, -1.620], [0.155, -1.620], [0.186, -1.548], [0.192, -1.430],
  [0.300, -1.220], [0.440, -1.000], [0.580, -0.800], [0.700, -0.620],
  [0.790, -0.450], [0.845, -0.220], [0.850,  0.100], [0.845,  0.420],
  [0.820,  0.720], [0.770,  0.960], [0.680,  1.140], [0.550,  1.260],
  [0.360,  1.350], [0.160,  1.400], [0.000,  1.415],
];
const GLASS_T = 0.050;                       // glass wall thickness
const RAMP_N = 192, RAMP_X0 = -1.62, RAMP_X1 = 1.415;
const RAMP = new Float32Array(RAMP_N);
(function buildRamp(){
  for (let i = 0; i < RAMP_N; i++){
    const x = RAMP_X0 + (RAMP_X1 - RAMP_X0) * i / (RAMP_N - 1);
    RAMP[i] = interiorRadiusAt(x);
  }
})();
function interiorRadiusAt(x){
  for (let i = 0; i < BTL_PROFILE.length - 1; i++){
    const a = BTL_PROFILE[i], b = BTL_PROFILE[i + 1];
    if (x >= a[1] && x <= b[1]){
      const t = (x - a[1]) / Math.max(1e-5, b[1] - a[1]);
      return Math.max(0.06, lerp(a[0], b[0], t) - GLASS_T);
    }
  }
  return 0.10;
}
function innerR(x){
  const t = clamp((x - RAMP_X0) / (RAMP_X1 - RAMP_X0), 0, 1) * (RAMP_N - 1);
  const i = Math.min(RAMP_N - 2, Math.floor(t));
  return lerp(RAMP[i], RAMP[i + 1], t - i);
}
function innerTopY(x){ return innerR(x); }              // dome height above axis
function innerBotY(x, z){ return -Math.sqrt(Math.max(0.0016, innerR(x) * innerR(x) - z * z)); }
function innerChordZ(x, y){ return Math.sqrt(Math.max(0, innerR(x) * innerR(x) - y * y)); }
// data texture twin of the interior radius table (for shaders)
const RAMP_TEX = (() => {
  const d = new Uint8Array(RAMP_N);
  for (let i = 0; i < RAMP_N; i++) d[i] = Math.round(clamp(RAMP[i] / 1.0, 0, 1) * 255);
  const t = new THREE.DataTexture(d, RAMP_N, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
})();
const GLSL_INNER_TEX = `
float innerR(float x){
  float u = clamp((x - ${RAMP_X0.toFixed(3)}) / ${(RAMP_X1 - RAMP_X0).toFixed(3)}, 0.0, 1.0);
  return texture2D(uRamp, vec2(u, 0.5)).r;
}`;

// ---------- palette ----------
const C = {
  sand:     0xd8c088, sandDark: 0xb59a68, sandWet: 0x8f7a52,
  rock:     0x7d6f63, rockDark: 0x5c534a, rockPale: 0x948a7c,
  coralPink: 0xe08a9a, coralOra: 0xe2915f, coralPur: 0x9a7ab8, coralRed: 0xc25b55,
  grass:    0x6f9a4e, grassDk: 0x527a3a,
  hull:     0x40301f, hullMid: 0x59422c, deck: 0x9a7a50, trim: 0xc9a45a,
  mast:     0x6b4e30, yard: 0x7d5c38,
  wood:     0x8a6335, woodDark: 0x5f4526, woodPale: 0xa87f4c,
  gold:     0xf0c257, goldDk: 0xc9962e,
  white:    0xf2ede2, cream: 0xe9dfc8, canvas: 0xe6ddc9,
  red:      0xb03a2e, redDeep: 0x8a2b22, navy: 0x2e4a6b,
  ink:      0x2a2620, lampWarm: 0xffc06a, glassEdge: 0xcfeaff,
  whale:    0x3c5878, whaleBelly: 0x6d84a0, bird: 0xe8e6de, birdWing: 0x8f9298,
  fish:     0x7fa8c4, fishOra: 0xe08a4a, crab: 0xc65b3a, leaf: 0x5f9a48, leafDk: 0x4a7d3a,
  buoyRed:  0xc04a38, buoyWhite: 0xeee9dc,
};

// ---------- procedural canvas textures ----------
function cnv(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function texFrom(c, repX = 1, repY = 1){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function drawWoodTable(){
  const c = cnv(1024, 1024), g = c.getContext('2d');
  g.fillStyle = '#5a4128'; g.fillRect(0, 0, 1024, 1024);
  const planks = 7, pw = 1024 / planks;
  for (let i = 0; i < planks; i++){
    const tone = 0.82 + rnd() * 0.36;
    const r = Math.floor(94 * tone), gg = Math.floor(66 * tone), b = Math.floor(42 * tone);
    g.fillStyle = `rgb(${r},${gg},${b})`;
    g.fillRect(i * pw + 2, 0, pw - 4, 1024);
    // grain
    for (let k = 0; k < 90; k++){
      const y = rnd() * 1024, x = i * pw + rnd() * pw;
      const w = 60 + rnd() * 260, h2 = rnd() * 1.6 + 0.4;
      g.strokeStyle = `rgba(${30 + rnd() * 40 | 0},${22 + rnd() * 26 | 0},${12 + rnd() * 16 | 0},${0.10 + rnd() * 0.22})`;
      g.lineWidth = h2;
      g.beginPath();
      g.moveTo(x, y);
      g.bezierCurveTo(x + w * 0.3, y + rr(-4, 4), x + w * 0.7, y + rr(-4, 4), x + w, y + rr(-3, 3));
      g.stroke();
    }
    // knots
    if (rnd() < 0.75){
      const kx = i * pw + pw * rr(0.3, 0.7), ky = rnd() * 1024, kr = 8 + rnd() * 16;
      for (let ring = 0; ring < 6; ring++){
        g.strokeStyle = `rgba(40,28,16,${0.30 - ring * 0.04})`;
        g.lineWidth = 1.6;
        g.beginPath(); g.ellipse(kx, ky, kr + ring * 4.5, (kr + ring * 4.5) * 0.42, rr(-0.3, 0.3), 0, Math.PI * 2); g.stroke();
      }
    }
    // plank seam
    g.fillStyle = 'rgba(20,14,8,0.55)'; g.fillRect(i * pw, 0, 2, 1024);
  }
  return c;
}
function drawSailStriped(){
  const c = cnv(512, 256), g = c.getContext('2d');
  g.fillStyle = '#e9e2d0'; g.fillRect(0, 0, 512, 256);
  // woven noise
  for (let i = 0; i < 5200; i++){
    g.fillStyle = `rgba(${rnd() < 0.5 ? 120 : 255},${rnd() < 0.5 ? 110 : 250},${rnd() < 0.5 ? 90 : 235},${0.05 + rnd() * 0.08})`;
    g.fillRect(rnd() * 512, rnd() * 256, 2, 2);
  }
  // red bands
  const bands = [[26, 34], [96, 30], [166, 26]];
  for (const [y, h] of bands){
    g.fillStyle = '#a93226'; g.fillRect(0, y, 512, h);
    g.fillStyle = 'rgba(60,10,8,0.35)'; g.fillRect(0, y, 512, 3); g.fillRect(0, y + h - 3, 512, 3);
    g.fillStyle = 'rgba(255,220,200,0.16)'; g.fillRect(0, y + 2, 512, 4);
    for (let i = 0; i < 900; i++){ g.fillStyle = `rgba(140,30,24,${0.10 + rnd() * 0.14})`; g.fillRect(rnd() * 512, y + rnd() * h, 2, 2); }
  }
  // seams
  g.strokeStyle = 'rgba(90,80,60,0.35)'; g.lineWidth = 1;
  for (let x = 0; x < 512; x += 42){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 256); g.stroke(); }
  const t = texFrom(c); return t;
}
function drawSailPlain(){
  const c = cnv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#e3dccb'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++){
    g.fillStyle = `rgba(${rnd() < 0.5 ? 130 : 245},${rnd() < 0.5 ? 120 : 240},${rnd() < 0.5 ? 100 : 225},${0.05 + rnd() * 0.08})`;
    g.fillRect(rnd() * 256, rnd() * 256, 2, 2);
  }
  g.strokeStyle = 'rgba(150,60,40,0.5)'; g.lineWidth = 2;
  g.strokeRect(6, 6, 244, 244);
  g.strokeStyle = 'rgba(90,80,60,0.3)'; g.lineWidth = 1;
  for (let x = 32; x < 256; x += 32){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 256); g.stroke(); }
  return texFrom(c);
}
function drawTag(){
  const c = cnv(256, 384), g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 384);
  grd.addColorStop(0, '#7a4a28'); grd.addColorStop(0.5, '#653d1e'); grd.addColorStop(1, '#543115');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 384);
  for (let i = 0; i < 2400; i++){
    g.fillStyle = `rgba(30,16,6,${0.06 + rnd() * 0.12})`;
    g.fillRect(rnd() * 256, rnd() * 384, 2, 2);
  }
  g.strokeStyle = '#c9a45a'; g.lineWidth = 6; g.strokeRect(14, 14, 228, 356);
  g.strokeStyle = 'rgba(240,200,120,0.5)'; g.lineWidth = 1.5; g.strokeRect(22, 22, 212, 340);
  // hole
  g.fillStyle = '#2a1a0c'; g.beginPath(); g.arc(128, 46, 15, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#c9a45a'; g.lineWidth = 3; g.beginPath(); g.arc(128, 46, 15, 0, Math.PI * 2); g.stroke();
  // characters
  g.fillStyle = '#f0d49a';
  g.font = '600 92px "Songti SC","STSong","Noto Serif SC",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('沧', 128, 180);
  g.fillText('海', 128, 292);
  g.font = 'italic 20px Georgia,serif'; g.fillStyle = '#caa86e';
  g.fillText('OCEAN', 128, 342);
  return c;
}
function radialTex(inner, mid){
  const c = cnv(128, 128), g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 1, 64, 64, 63);
  grd.addColorStop(0, inner); grd.addColorStop(0.35, mid); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function sunDiscTex(){
  const c = cnv(256, 256), g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 8, 128, 128, 126);
  grd.addColorStop(0, 'rgba(255,252,240,1)');
  grd.addColorStop(0.22, 'rgba(255,238,200,0.98)');
  grd.addColorStop(0.5, 'rgba(255,196,120,0.55)');
  grd.addColorStop(1, 'rgba(255,150,70,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function moonDiscTex(){
  const c = cnv(256, 256), g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 6, 128, 128, 124);
  grd.addColorStop(0, 'rgba(235,242,255,1)');
  grd.addColorStop(0.30, 'rgba(210,224,250,0.9)');
  grd.addColorStop(0.62, 'rgba(150,175,225,0.28)');
  grd.addColorStop(1, 'rgba(110,140,200,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  g.globalCompositeOperation = 'destination-out';
  for (const [x, y, r] of [[96, 92, 16], [150, 130, 22], [118, 168, 12], [170, 84, 9], [82, 140, 8]]){
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX = {
  table: null, sailStripe: null, sailPlain: null, tag: null,
  warmGlow: null, goldGlow: null, blueGlow: null, sun: null, moon: null,
};
function buildTextures(){
  TEX.table = texFrom(drawWoodTable(), 3, 3);
  TEX.sailStripe = drawSailStriped();
  TEX.sailPlain = drawSailPlain();
  TEX.tag = texFrom(drawTag());
  TEX.warmGlow = radialTex('rgba(255,214,150,0.9)', 'rgba(255,160,70,0.35)');
  TEX.goldGlow = radialTex('rgba(255,226,150,0.95)', 'rgba(255,180,60,0.4)');
  TEX.blueGlow = radialTex('rgba(190,220,255,0.9)', 'rgba(120,160,240,0.35)');
  TEX.sun = sunDiscTex();
  TEX.moon = moonDiscTex();
}

// ---------- voxel grid ----------
const KX = 512, KY = 512, KZ = 512;
class Vox {
  constructor(){ this.m = new Map(); }
  static key(x, y, z){
    return ((x + 256) * KX + (y + 256)) * KZ + (z + 256);
  }
  set(x, y, z, c){
    x |= 0; y |= 0; z |= 0;
    if (x < -250 || x > 250 || y < -250 || y > 250 || z < -250 || z > 250) return this;
    this.m.set(Vox.key(x, y, z), new THREE.Color(c)); return this;
  }
  has(x, y, z){ return this.m.has(Vox.key(x | 0, y | 0, z | 0)); }
  get(x, y, z){ return this.m.get(Vox.key(x | 0, y | 0, z | 0)); }
  del(x, y, z){ this.m.delete(Vox.key(x | 0, y | 0, z | 0)); }
  box(x0, y0, z0, x1, y1, z1, c){
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) this.set(x, y, z, c);
    return this;
  }
  boxIf(x0, y0, z0, x1, y1, z1, c, fn){
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
      if (fn(x, y, z)) this.set(x, y, z, c);
    return this;
  }
  cylY(cx, cz, y0, y1, radiusFn, colorFn){
    const rm = Math.ceil(radiusFn(Math.max(y0, y1)));
    for (let y = y0; y <= y1; y++){
      const r = radiusFn(y);
      for (let x = Math.floor(cx - rm); x <= cx + rm; x++)
        for (let z = Math.floor(cz - rm); z <= cz + rm; z++){
          const d = Math.hypot(x - cx, z - cz);
          if (d <= r) this.set(x, y, z, colorFn(x, y, z, d / Math.max(r, 0.001)));
        }
    }
    return this;
  }
  blob(cx, cy, cz, rx, ry, rz, c, jitter = 0.18){
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++)
      for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
        for (let z = Math.floor(cz - rz); z <= cz + rz; z++){
          const d = Math.hypot((x - cx) / rx, (y - cy) / ry, (z - cz) / rz);
          if (d <= 1 + (rnd() - 0.5) * jitter) this.set(x, y, z, c);
        }
    return this;
  }
  count(){ return this.m.size; }
  cells(){
    const out = [];
    for (const [k, c] of this.m){
      const z = (k % KZ) - 256, y = (((k / KZ) | 0) % KY) - 256, x = (((k / KZ / KY) | 0)) - 256;
      out.push([x, y, z, c]);
    }
    return out;
  }
}
// baked ambient occlusion per voxel
function aoAt(v, x, y, z){
  let s = 0;
  if (v.has(x + 1, y, z)) s += 1.0; if (v.has(x - 1, y, z)) s += 1.0;
  if (v.has(x, y + 1, z)) s += 1.0; if (v.has(x, y - 1, z)) s += 1.0;
  if (v.has(x, y, z + 1)) s += 1.0; if (v.has(x, y, z - 1)) s += 1.0;
  for (const [ax, ay] of [[1, 1], [1, -1], [-1, 1], [-1, -1]])
    for (const a of [0, 1, 2]){
      const p = [x, y, z]; p[a] += ax;
      const q = [x, y, z]; q[(a + 1) % 3] += ay;
      if (v.has(p[0], p[1], p[2]) && v.has(q[0], q[1], q[2])) s += 0.06;
    }
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1])
    if (v.has(x + sx, y + sy, z) && v.has(x + sx, y, z + sz) && v.has(x, y + sy, z + sz)) s += 0.03;
  return clamp(1 - s * 0.088, 0.42, 1.0);
}
const BOX = new THREE.BoxGeometry(1, 1, 1);
// instanced voxel mesh (the heavy lifters)
function buildInstanced(vox, { size = VOX, shadow = true, tint = null, colorJit = 0.055 } = {}){
  const cells = vox.cells();
  const geo = BOX;
  const mat = tint ? tint : makeVoxMaterial({ shadow });
  const im = new THREE.InstancedMesh(geo, mat, cells.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(size, size, size), p = new THREE.Vector3();
  const col = new THREE.Color();
  for (let i = 0; i < cells.length; i++){
    const [x, y, z, c] = cells[i];
    p.set(x * size, y * size, z * size);
    m4.compose(p, q, sc);
    im.setMatrixAt(i, m4);
    const ao = aoAt(vox, x, y, z);
    const j = 1 + (rnd() - 0.5) * 2 * colorJit;
    col.copy(c).multiplyScalar(ao * j);
    im.setColorAt(i, col);
  }
  im.castShadow = shadow; im.receiveShadow = shadow;
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.frustumCulled = true;
  im.computeBoundingSphere();
  return im;
}
// merged voxel mesh (small movers)
function buildMerged(vox, { size = VOX, mat = null, shadow = true, jitterOnly = true } = {}){
  const cells = vox.cells();
  const parts = [];
  for (const [x, y, z, c] of cells){
    const g = new THREE.BoxGeometry(size, size, size);
    g.translate(x * size, y * size, z * size);
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    const cc = c.clone().multiplyScalar(jitterOnly ? (1 + (rnd() - 0.5) * 0.1) : aoAt(vox, x, y, z));
    for (let i = 0; i < n; i++){ arr[i * 3] = cc.r; arr[i * 3 + 1] = cc.g; arr[i * 3 + 2] = cc.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    parts.push(g);
  }
  const geo = parts.length ? mergeGeometries(parts) : new THREE.BoxGeometry(0.001, 0.001, 0.001);
  parts.forEach(g => g.dispose());
  const m = new THREE.Mesh(geo, mat || makeVoxMaterial({ shadow }));
  m.castShadow = shadow; m.receiveShadow = shadow;
  return m;
}

// ---------- shared uniforms ----------
const UNI = {
  uTime:      { value: 0 },
  uWaterY:    { value: WATER_Y },
  uStorm:     { value: 0 },
  uShallowCol:{ value: new THREE.Color(0x2f9d8f) },
  uDeepCol:   { value: new THREE.Color(0x0a2a4a) },
  uFlash:     { value: 0 },
};

// ---------- underwater tint + caustics patch for standard materials ----------
function patchUnderwater(sh){
  sh.uniforms.uWaterY = UNI.uWaterY;
  sh.uniforms.uTime = UNI.uTime;
  sh.uniforms.uStorm = UNI.uStorm;
  sh.uniforms.uShallowCol = UNI.uShallowCol;
  sh.uniforms.uDeepCol = UNI.uDeepCol;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
    .replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vWPos = ( modelMatrix * instanceMatrix * vec4( transformed, 1.0 ) ).xyz;
      #else
        vWPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
      #endif`);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWPos;
      uniform float uWaterY; uniform float uTime; uniform float uStorm;
      uniform vec3 uShallowCol; uniform vec3 uDeepCol;
      float causticP(vec2 p, float t){
        float v = 0.0;
        for (int i = 0; i < 3; i++){
          float fi = float(i);
          vec2 q = p * (1.0 + fi * 0.75) + vec2(t * (0.045 + fi * 0.02), t * 0.03);
          float w = pow(1.0 - abs(sin(q.x) * cos(q.y * 1.31 + fi * 1.7)), 6.0);
          v += w;
        }
        return v / 3.0;
      }`)
    .replace('#include <dithering_fragment>', `{
        float depth = clamp((uWaterY - vWPos.y) / 0.80, 0.0, 1.0);
        if (depth > 0.004) {
          vec3 wc = mix(uShallowCol, uDeepCol, pow(depth, 0.85));
          float caus = causticP(vWPos.xz * 2.6, uTime);
          wc += vec3(0.55, 0.75, 0.72) * caus * 0.30 * (1.0 - depth) * (1.0 - 0.6 * uStorm);
          float lum = dot(outgoingLight, vec3(0.28, 0.62, 0.10));
          outgoingLight = mix(outgoingLight, wc * (0.24 + lum * 1.35), depth * 0.60);
        }
      }
      #include <dithering_fragment>`);
}
function makeVoxMaterial({ shadow = true, rough = 0.82, metal = 0.05, water = true } = {}){
  const m = new THREE.MeshStandardMaterial({ roughness: rough, metalness: metal });
  if (water) m.onBeforeCompile = patchUnderwater;
  m.customProgramCacheKey = () => 'voxUw';
  return m;
}

};
MAT.gold.onBeforeCompile = patchUnderwater;
MAT.iron.onBeforeCompile = patchUnderwater;

// world-grid helper (cells of VOX, origin at bottle center)
function setW(v, wx, wy, wz, c){ v.set(Math.round(wx / VOX), Math.round(wy / VOX), Math.round(wz / VOX), c); }

// ---------- world registries (filled by builders) ----------
const GLASS_PANES = [];   // cabin window world panes [wx, wy, wz, dir]
const LANTERNS = [];      // lantern world positions
const CRAB_SPOTS = [];    // wet-sand world positions for crabs
let LAMP_POS = new THREE.Vector3(0, 0, 0);

// ============================================================
// ISLAND  (world-space voxel build; waterline = WATER_Y)
// ============================================================
const ISLE = { cx: -0.15, cz: 0.0, ax: 0.44, az: 0.31, shore: -0.335, peak: 0.245 };
function knollH(wx, wz){ return 0.17 * Math.exp(-(((wx - 0.13) ** 2 + (wz + 0.10) ** 2) / 0.013)); }
function isleH(wx, wz){
  const dx = (wx - ISLE.cx) / ISLE.ax, dz = (wz - ISLE.cz) / ISLE.az;
  const e = Math.hypot(dx, dz);
  if (e > 1) return null;
  let h = ISLE.shore + (1 - e * e) * (ISLE.peak - ISLE.shore);
  h += Math.sin(wx * 7.3 + 1.3) * Math.cos(wz * 8.1) * 0.026;
  h += Math.sin(wx * 15.0 + 2.1) * 0.013;
  h += knollH(wx, wz);
  return h;
}
function buildIsland(){
  const v = new Vox();
  for (let wx = -0.62; wx <= 0.62; wx += VOX){
    for (let wz = -0.44; wz <= 0.44; wz += VOX){
      const h = isleH(wx, wz);
      if (h === null) continue;
      const bot = innerBotY(wx, wz) - 0.016;          // sink slightly into the glass curve
      const gx = Math.round(wx / VOX), gz = Math.round(wz / VOX);
      const gyTop = Math.round(h / VOX), gyBot = Math.round(bot / VOX);
      for (let gy = gyBot; gy <= gyTop; gy++){
        const y = gy * VOX;
        const r = rnd();
        let c;
        if (y >= h - VOX)                        c = y > WATER_Y + 0.004 ? C.sand : C.sandWet;
        else if (y >= h - 3 * VOX)               c = y > WATER_Y - 0.008 ? (r < 0.7 ? C.sand : C.sandDark) : (r < 0.5 ? C.rock : C.sandWet);
        else if (y > WATER_Y)                    c = y > WATER_Y - 0.055 ? (r < 0.5 ? C.sandWet : C.rock) : C.rockDark;
        else                                     c = y < WATER_Y - 0.22 ? C.rockDark : (r < 0.3 ? C.rockPale : C.rockDark);
        if (y > WATER_Y + 0.045 && r < 0.55)     c = r < 0.3 ? C.grass : C.grassDk;      // green crown
        if (Math.abs(y - h) < VOX && r < 0.18 && y > WATER_Y + 0.02) c = C.sand;         // beach flecks
        v.set(gx, gy, gz, c);
        if (c === C.sandWet && y > WATER_Y - 0.03 && y < WATER_Y + 0.02 && rnd() < 0.02)
          CRAB_SPOTS.push([wx, y, wz]);
      }
    }
  }
  // coral shelves on the underwater slopes + a few above the shore
  for (let i = 0; i < 30; i++){
    const a = rnd() * Math.PI * 2, rad = rr(0.55, 1.0);
    const wx = ISLE.cx + Math.cos(a) * ISLE.ax * rad, wz = ISLE.cz + Math.sin(a) * ISLE.az * rad;
    const h = isleH(wx, wz);
    if (h === null || h < WATER_Y - 0.16 || h > WATER_Y + 0.03) continue;
    const col = [C.coralPink, C.coralOra, C.coralPur, C.coralRed][Math.floor(rnd() * 4)];
    const hh = 0.03 + rnd() * 0.06;
    v.cylY(wx / VOX, wz / VOX, Math.round(h / VOX), Math.round((h + hh) / VOX),
      (y) => (y * VOX < h + 0.005 ? 1.4 : 0.8), () => col);
    if (rnd() < 0.4) v.set(Math.round(wx / VOX) + 1, Math.round((h + hh) / VOX), Math.round(wz / VOX), col);
    if (rnd() < 0.4) v.set(Math.round(wx / VOX), Math.round((h + hh) / VOX), Math.round(wz / VOX) + 1, col);
  }
  // grass tufts on the crown
  for (let i = 0; i < 46; i++){
    const a = rnd() * Math.PI * 2, rad = rr(0.0, 0.85);
    const wx = ISLE.cx + Math.cos(a) * ISLE.ax * rad, wz = ISLE.cz + Math.sin(a) * ISLE.az * rad;
    const h = isleH(wx, wz);
    if (h === null || h < WATER_Y + 0.05) continue;
    const gy = Math.round(h / VOX);
    v.set(Math.round(wx / VOX), gy + 1, Math.round(wz / VOX), rnd() < 0.5 ? C.grass : C.grassDk);
    if (rnd() < 0.4) v.set(Math.round(wx / VOX), gy + 2, Math.round(wz / VOX), C.grassDk);
  }
  // shoreline rocks
  for (let i = 0; i < 9; i++){
    const a = rnd() * Math.PI * 2, rad = rr(0.78, 0.97);
    const wx = ISLE.cx + Math.cos(a) * ISLE.ax * rad, wz = ISLE.cz + Math.sin(a) * ISLE.az * rad;
    const h = isleH(wx, wz);
    if (h === null || h < WATER_Y - 0.04) continue;
    v.blob(wx / VOX, h / VOX, wz / VOX, rr(1, 2.1), rr(0.8, 1.5), rr(1, 2.1),
      rnd() < 0.5 ? C.rock : C.rockDark, 0.25);
  }
  buildLighthouseW(v);
  buildCabinW(v, -0.36, 0.22);
  buildPalmW(v, -0.45, 0.05, 0.42);
  buildPalmW(v, -0.05, 0.27, 0.38);
  buildPalmW(v, -0.44, -0.13, 0.36);
  buildDockW(v, 0.27, -0.02);
  buildTreasureIsleW(v, -0.44, -0.18);
  buildSignpostW(v, 0.23, 0.10);
  return v;
}
// ---- lighthouse (world coords) ----
function buildLighthouseW(v){
  const bx = 0.13, bz = -0.10;
  const base = (isleH(bx, bz) ?? 0) + 0.004;
  const topY = base + 0.40;
  const toC = (y) => Math.round(y / VOX);
  // stone base
  for (let y = base - 0.055; y <= base + 0.012; y += VOX){
    const r = 0.135 - (y - (base - 0.055)) * 0.35;
    v.cylY(bx / VOX, bz / VOX, toC(y), toC(y), () => r / VOX, () => (rnd() < 0.25 ? C.rockPale : C.rock));
  }
  // tower with red/white bands
  for (let y = base + 0.012; y <= topY; y += VOX){
    const t = (y - base) / (topY - base);
    const r = lerp(0.095, 0.082, t);
    const band = Math.floor((y - base) / 0.072) % 2 === 0;
    const col = band ? C.red : C.white;
    v.cylY(bx / VOX, bz / VOX, toC(y), toC(y), () => r / VOX,
      (x, yy, z, d) => (rnd() < 0.09 ? (band ? C.redDeep : C.rockPale) : col));
  }
  // gallery + lamp room + roof
  const gy = topY + 0.006;
  v.cylY(bx / VOX, bz / VOX, toC(gy), toC(gy), () => 0.125 / VOX, () => C.iron);
  for (let a = 0; a < 8; a++){
    const px = bx + Math.cos(a / 8 * Math.PI * 2) * 0.115, pz = bz + Math.sin(a / 8 * Math.PI * 2) * 0.115;
    v.set(Math.round(px / VOX), toC(gy + 0.02), Math.round(pz / VOX), C.iron);
  }
  v.cylY(bx / VOX, bz / VOX, toC(gy + 0.02), toC(gy + 0.075), () => 0.098 / VOX,
    (x, yy, z, d) => (yy % 2 === 0 ? C.trim : C.ink));
  v.cylY(bx / VOX, bz / VOX, toC(gy + 0.085), toC(gy + 0.085), () => 0.108 / VOX, () => C.trim);
  for (let y = gy + 0.095; y <= gy + 0.13; y += VOX){
    const r = 0.10 * (1 - (y - gy - 0.095) / 0.04);
    v.cylY(bx / VOX, bz / VOX, toC(y), toC(y), () => Math.max(0.4, r) / VOX, () => C.redDeep);
  }
  v.set(toC(bx), toC(gy + 0.15), toC(bz), C.gold);
  v.set(toC(bx), toC(gy + 0.185), toC(bz), C.gold);
  LAMP_POS.set(bx, gy + 0.05, bz);
}
// ---- cabin ----
function buildCabinW(v, cx, cz){
  const base = (isleH(cx, cz) ?? 0) - 0.004;
  const w = 0.30, d = 0.22, hh = 0.155;
  const x0 = cx - w / 2, z0 = cz - d / 2;
  const gx0 = Math.round(x0 / VOX), gx1 = Math.round((x0 + w) / VOX);
  const gz0 = Math.round(z0 / VOX), gz1 = Math.round((z0 + d) / VOX);
  const gy0 = Math.round(base / VOX);
  const gyT = gy0 + Math.round(hh / VOX);
  for (let gx = gx0; gx <= gx1; gx++) for (let gz = gz0; gz <= gz1; gz++){
    const edge = gx === gx0 || gx === gx1 || gz === gz0 || gz === gz1;
    if (!edge){ v.set(gx, gy0, gz, C.woodDark); continue; }
    for (let gy = gy0 + 1; gy <= gyT; gy++)
      v.set(gx, gy, gz, rnd() < 0.3 ? C.woodPale : C.wood);
  }
  // windows on three walls + door
  const wy = gy0 + 2, wy2 = gy0 + 3;
  for (const gx of [gx0 + 3, gx0 + 4]){
    v.set(gx, wy, gz0, 0x27303c); v.set(gx, wy2, gz0, 0x27303c);
    v.set(gx, wy, gz1, 0x27303c); v.set(gx, wy2, gz1, 0x27303c);
  }
  v.set(gx0, wy, gz0 + 2, 0x27303c); v.set(gx0, wy2, gz0 + 2, 0x27303c);
  v.box(gx1 - 1, gy0 + 1, gz1, gx1 - 1, gy0 + 3, gz1, C.woodDark);
  GLASS_PANES.push([(gx0 + 3.5) * VOX, (wy + 0.5) * VOX, gz0 * VOX - 0.002, 'z-'],
                   [(gx0 + 3.5) * VOX, (wy + 0.5) * VOX, gz1 * VOX + 0.002, 'z+'],
                   [gx0 * VOX - 0.002, (wy + 0.5) * VOX, (gz0 + 2.5) * VOX, 'x-']);
  // gable roof
  const nR = 4;
  for (let i = 0; i < nR; i++){
    v.box(gx0 - 1 + i, gyT + 1 + i, gz0 - 1, gx1 + 1 - i, gyT + 1 + i, gz1 + 1,
      i === nR - 1 ? C.woodDark : C.redDeep);
  }
  for (let i = 0; i < 3; i++){
    v.box(gx0 - 1, gyT + 1 + i, gz0 + 1 + i, gx1 + 1, gyT + 1 + i, gz1 - 1 - i, C.redDeep);
  }
  // chimney
  v.box(gx0 + 1, gyT + 1, gz0 + 1, gx0 + 1, gyT + 4, gz0 + 1, C.rock);
  v.set(gx0 + 1, gyT + 5, gz0 + 1, C.rockDark);
}
// ---- palm ----
function buildPalmW(v, cx, cz, len){
  const h0 = (isleH(cx, cz) ?? 0);
  const lean = { x: rr(-0.16, 0.16), z: rr(-0.16, 0.16) };
  let x = cx, z = cz;
  const n = Math.round(len / VOX);
  for (let i = 0; i < n; i++){
    x += lean.x * VOX; z += lean.z * VOX;
    const y = h0 + 0.01 + i * VOX;
    v.set(Math.round(x / VOX), Math.round(y / VOX), Math.round(z / VOX), i % 3 === 2 ? C.woodDark : C.wood);
    if (i % 4 === 3) v.set(Math.round(x / VOX) + 1, Math.round(y / VOX), Math.round(z / VOX), C.woodDark);
  }
  const tx = Math.round(x / VOX), ty = Math.round((h0 + len) / VOX), tz = Math.round(z / VOX);
  for (let f = 0; f < 6; f++){
    const a = f / 6 * Math.PI * 2 + rr(-0.2, 0.2);
    for (let s = 0; s < 5; s++){
      const fx = tx + Math.round(Math.cos(a) * s * 1.05);
      const fz = tz + Math.round(Math.sin(a) * s * 1.05);
      const fy = ty + Math.max(0, 2 - Math.floor(s * 0.5));
      v.set(fx, fy, fz, s >= 3 ? C.leafDk : C.leaf);
      if (s >= 2) v.set(fx, fy - 1, fz, C.woodDark);
    }
  }
  v.blob(tx, ty - 1, tz, 0.8, 0.8, 0.8, C.woodDark, 0.4);
  v.set(tx - 1, ty - 1, tz, C.woodDark);
}
// ---- dock + skiff + lantern ----
function buildDockW(v, cx, cz){
  const deckY = WATER_Y + 0.075;
  const n = 8;
  for (let i = 0; i < n; i++){
    const x = cx + i * VOX;
    const gx = Math.round(x / VOX);
    const gyD = Math.round(deckY / VOX);
    v.box(gx, gyD, Math.round((cz - 0.05) / VOX), gx, gyD, Math.round((cz + 0.05) / VOX),
      i % 3 === 0 ? C.woodDark : C.wood);
    v.set(gx, gyD - 1, Math.round((cz - 0.05) / VOX), C.woodDark);
    v.set(gx, gyD - 1, Math.round((cz + 0.05) / VOX), C.woodDark);
    if (i % 3 === 2){
      for (let gy = gyD - 1; gy >= Math.round(innerBotY(x, cz) / VOX); gy--){
        v.set(gx, gy, Math.round((cz - 0.06) / VOX), C.woodDark);
        v.set(gx, gy, Math.round((cz + 0.06) / VOX), C.woodDark);
      }
    }
  }
  // skiff moored at the end
  const sx = cx + (n + 1) * VOX, sz = cz - 0.13;
  for (let i = -2; i <= 2; i++){
    const hw = Math.abs(i) === 2 ? 0 : 1;
    const gx = Math.round((sx + i * VOX) / VOX), gyS = Math.round((WATER_Y + 0.012) / VOX);
    v.box(gx, gyS, Math.round((sz - hw * VOX) / VOX), gx, gyS, Math.round((sz + hw * VOX) / VOX),
      i % 2 ? C.woodDark : C.wood);
    v.set(gx, gyS - 1, Math.round(sz / VOX), C.hullMid);
  }
  // lantern on the shore post
  const lx = cx - VOX * 2, lz = cz + 0.07;
  const gyL = Math.round((WATER_Y + 0.075) / VOX);
  v.set(Math.round(lx / VOX), gyL + 1, Math.round(lz / VOX), C.iron);
  v.set(Math.round(lx / VOX), gyL + 2, Math.round(lz / VOX), C.lampWarm);
  LANTERNS.push(new THREE.Vector3(lx, WATER_Y + 0.095, lz));
}
// ---- island treasure + signpost ----
function buildTreasureIsleW(v, cx, cz){
  const h = (isleH(cx, cz) ?? 0);
  const y = Math.round((h - 0.005) / VOX);
  const gx = Math.round(cx / VOX), gz = Math.round(cz / VOX);
  v.box(gx, y, gz, gx + 3, y + 2, gz + 2, C.woodDark);
  v.box(gx + 1, y + 3, gz, gx + 2, y + 3, gz + 1, C.gold);
  for (let x = gx; x <= gx + 3; x++) v.set(x, y + 1, gz, C.goldDk);
  v.set(gx + 3, y + 2, gz + 2, C.gold);
  for (let i = 0; i < 14; i++){

// SAILBOAT  (local grid, origin at deck center, waterline at gy = -d)
// ============================================================
function buildBoat(){
  const v = new Vox();
  const L = 9;
  const deck = [];
  for (let gx = -L; gx <= L; gx++){
    const t = Math.abs(gx) / L;
    let hw = 2.4 * Math.pow(1 - Math.pow(t, 3.6), 0.34);
    if (gx < -7.5) hw *= 0.94;
    const hwi = Math.max(0, Math.round(hw));
    let d = Math.round(3.2 * Math.pow(Math.max(0, 1 - t * 0.85), 0.75)) + 1;
    deck[gx + L] = { hw: hwi, d };
    for (let gz = -hwi; gz <= hwi; gz++){
      for (let gy = -d; gy <= 0; gy++){
        let c;
        if (gy === 0)            c = C.deck;
        else if (gy === -1 && Math.abs(gz) === hwi) c = C.red;
        else if (gy === -d && Math.abs(gz) === hwi) c = C.hull;
        else if (Math.abs(gz) === hwi){
          const plank = ((gx + L + gy) % 3 === 0) ? C.hull : C.hullMid;
          c = gy < -d + 1 ? C.hull : plank;
        }
        else if (gy === -d)      c = C.hull;
        else                     c = (Math.abs(gz) === hwi - 1 && rnd() < 0.5) ? C.hullMid : C.hull;
        if (gy === -d) c = C.hull;
        if (gy === 0 && (gx === 2 || gx === 3) && (gz === -1 || gz === 1)) c = C.woodDark;  // hatches
        v.set(gx, gy, gz, c);
      }
    }
  }
  // gold trim line along the sheer
  for (let gx = -L; gx <= L; gx++){
    const hwi = deck[gx + L].hw;
    if (hwi > 0) v.set(gx, 0, hwi, C.trim), v.set(gx, 0, -hwi, C.trim);
  }
  // stern castle + rail + lantern
  v.box(-L, 1, -2, -L + 2, 2, 2, C.hullMid);
  v.box(-L, 3, -1, -L + 1, 3, 1, C.woodDark);
  v.set(-L + 1, 4, 0, C.lampWarm);
  v.set(-L + 1, 5, 0, C.iron);
  for (let gx = -L + 3; gx <= L - 1; gx += 3){
    v.set(gx, 1, -2, C.woodDark); v.set(gx, 1, 2, C.woodDark);
  }
  v.box(-L + 3, 1, -2, L - 1, 1, 2, C.woodDark).del(-L + 3, 1, 0);
  for (let gx = -L + 3; gx <= L - 1; gx += 3) v.set(gx, 1, -2, C.woodDark), v.set(gx, 1, 2, C.woodDark);
  // bowsprit
  for (let i = 1; i <= 4; i++) v.set(L + i, 0, 0, C.mast);
  v.set(L + 5, -1, 0, C.mast), v.set(L + 4, -1, 0, C.mast);
  // anchor stowed at bow
  v.set(L - 1, 1, 2, C.iron); v.set(L - 1, 0, 2, C.iron); v.set(L - 1, -1, 2, C.iron);
  // masts & yards
  const masts = [
    { gx: -4, h: 13, crow: false, yards: [{ gy: 9, span: 3 }] },
    { gx:  0, h: 16, crow: true,  yards: [{ gy: 11, span: 5 }, { gy: 8, span: 4 }] },
    { gx:  5, h: 14, crow: false, yards: [{ gy: 10, span: 5 }, { gy: 7, span: 4 }] },
  ];
  for (const m of masts){
    for (let gy = 1; gy <= m.h; gy++) v.set(m.gx, gy, 0, gy === m.h ? C.trim : C.mast);
    v.box(m.gx - 1, m.h, -1, m.gx + 1, m.h, 1, C.mast);
    if (m.crow){
      v.box(m.gx - 1, 9, -1, m.gx + 1, 9, 1, C.mast);
      v.box(m.gx - 1, 10, -1, m.gx + 1, 11, 1, C.woodDark);
      v.set(m.gx, 11, 0, C.woodDark); v.set(m.gx - 1, 11, 0, C.woodDark); v.set(m.gx + 1, 11, 0, C.woodDark);
    }
    for (const y of m.yards){
      for (let gz = -y.span; gz <= y.span; gz++) v.set(m.gx, y.gy, gz, gz === 0 ? C.trim : C.yard);
      v.set(m.gx, y.gy - 1, 0, C.yard);   // parrel
    }
  }
  v.set(0, 17, 0, C.mast);                 // flag pole
  return { vox: v, masts, L };
}
// rigging lines for the boat (local grid coords -> world via group)
function buildRigging(meta){
  const pts = [];
  const push = (ax, ay, az, bx, by, bz) => pts.push(ax, ay, az, bx, by, bz);
  for (const m of meta.masts){
    const top = m.h;
    // shrouds
    push(m.gx, top - 0.5, 0, m.gx - 1.5, 0.5, -2.4);
    push(m.gx, top - 0.5, 0, m.gx + 1.5, 0.5, -2.4);
    push(m.gx, top - 0.5, 0, m.gx - 1.5, 0.5, 2.4);
    push(m.gx, top - 0.5, 0, m.gx + 1.5, 0.5, 2.4);
    // ratlines
    for (let gy = 2; gy < top - 1; gy += 3){
      push(m.gx, gy, -2.2, m.gx, gy, -0.6);
      push(m.gx, gy, 0.6, m.gx, gy, 2.2);

function buildWhale(){
  const v = new Vox();
  for (let gx = -6; gx <= 6; gx++){
    const t = (gx + 6) / 12;
    const ry = 2.1 * Math.sin(Math.pow(t, 0.62) * Math.PI) + 0.6;
    const rz = 2.1 * Math.sin(Math.pow(t, 0.62) * Math.PI) + 0.6;
    const head = gx > 2 ? 1.12 : 1.0;
    for (let gy = -3; gy <= 3; gy++){
      for (let gz = -3; gz <= 3; gz++){
        const d = Math.hypot((gy) / (ry * head), (gz) / (rz * head));
        if (d > 1) continue;
        let c = gy < -1 ? C.whaleBelly : C.whale;
        if (gx === -6 || gx === 6) c = C.whale;
        if (rnd() < 0.07) c = C.whaleBelly;
        if (gy === 3 && rnd() < 0.4) c = 0x54708f;   // dorsal ridge light
        if (gx === 4 && gy === -2 && Math.abs(gz) <= 1) c = 0x241d18; // mouth line
        v.set(gx, gy, gz, c);
      }
    }
  }
  // eye
  v.set(3, 1, 2, C.ink); v.set(3, 1, -2, C.ink);
  // pectoral fins
  for (const s of [1, -1]){
    for (let i = 0; i < 3; i++){
      v.set(0 - i, -1 - (i > 1 ? 1 : 0), s * (2 + i), C.whale);
      v.set(0 - i, -2 - (i > 1 ? 1 : 0), s * (2 + i), C.whaleBelly);
    }
  }
  // tail stock + fluke
  for (let gx = 7; gx <= 8; gx++) for (let gy = -1; gy <= 1; gy++) v.set(gx, gy, 0, C.whale);
  for (let gx = 9; gx <= 11; gx++){
    const w = Math.min(3, gx - 8);
    for (let gz = -w; gz <= w; gz++) for (let gy = -1; gy <= 1; gy++) v.set(gx, gy, gz, C.whale);
  }
  // blowhole spout rim
  v.set(-5, 3, 0, 0x2c4258); v.set(-5, 2, 0, 0x2c4258);
  return v;
}

function buildSea(){
  const geo = new THREE.PlaneGeometry(2.3, 1.75, 128, 96);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: UNI.uTime, uWaterY: UNI.uWaterY, uStorm: UNI.uStorm,
      uAmp: { value: 1.0 }, uTS: { value: 1.0 },
      uRamp: { value: RAMP_TEX },
      uSunDir: { value: new THREE.Vector3(0, 1, 0) },
      uSunCol: { value: new THREE.Color(0xffd9a0) },
      uSkyTop: { value: new THREE.Color(0x3a6ea8) },
      uSkyHor: { value: new THREE.Color(0xf0a878) },
      uShallowCol: UNI.uShallowCol, uDeepCol: UNI.uDeepCol,
      uNight: { value: 0 }, uFlash: UNI.uFlash,
      uIsleC: { value: new THREE.Vector2(-0.15, 0.0) },
      uIsleAB: { value: new THREE.Vector2(0.46, 0.33) },
    },
    vertexShader: `
      uniform float uTime; uniform float uAmp; uniform float uTS;
      varying vec3 vWP; varying vec3 vN; varying float vH;
      ${GLSL_INNER_TEX}
      ${waveGLSL()}
      void main(){
        vec3 p = position;
        float t = uTime * uTS;
        float h = waveH(p.xz, t);
        float hx = waveH(p.xz + vec2(0.045, 0.0), t);
        float hz = waveH(p.xz + vec2(0.0, 0.045), t);
        p.y = h * uAmp;
        vN = normalize(vec3(-(hx - h) / 0.045, 1.0, -(hz - h) / 0.045));
        vH = h * uAmp;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vWP = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uWaterY; uniform float uStorm; uniform float uAmp;
      uniform float uTS; uniform vec3 uSunDir; uniform vec3 uSunCol;
      uniform vec3 uSkyTop; uniform vec3 uSkyHor; uniform vec3 uShallowCol; uniform vec3 uDeepCol;
      uniform float uNight; uniform float uFlash;
      uniform vec2 uIsleC; uniform vec2 uIsleAB;
      varying vec3 vWP; varying vec3 vN; varying float vH;
      ${GLSL_INNER_TEX}
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
                   mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
      }
      void main(){
        // clip to the bottle interior lens
        float r = innerR(vWP.x);
        if (vWP.z * vWP.z + uWaterY * uWaterY > r * r - 0.0032) discard;
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        float h = vH / 0.020;
        float steep = clamp(length(vec2(dFdx(h), dFdy(h))) * 1.6, 0.0, 1.0);
        float foam = smoothstep(0.28 + 0.26 * uStorm, 0.90, h);
        foam += smoothstep(0.62, 1.35, steep) * 0.9 * (0.35 + uStorm);
        float fn = noise(vWP.xz * 26.0 + uTime * 0.6 * uTS);
        foam = clamp(foam * (0.55 + 0.75 * fn), 0.0, 1.0);
        // surf line where the swell meets the island shore
        vec2 q = (vWP.xz - uIsleC) / uIsleAB;
        float d = length(q);
        float surf = smoothstep(0.86, 0.99, d) * (1.0 - smoothstep(1.0, 1.10, d));
        float surfN = noise(vWP.xz * 18.0 + uTime * 1.1);
        foam = clamp(foam + surf * (0.35 + 0.5 * surfN) * (0.5 + 0.9 * uStorm), 0.0, 1.0);
        // body color: deep teal with sky sheen
        vec3 deep = mix(uShallowCol * 0.9, uDeepCol, clamp(h * 0.5 + 0.35, 0.0, 1.0));
        deep = mix(deep, uDeepCol * 0.7, 0.45 * uStorm);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
        vec3 skyRef = mix(uSkyHor, uSkyTop, 0.55);
        vec3 col = mix(deep, skyRef, fres * 0.55);
        // sun glitter
        vec3 H = normalize(uSunDir + V);
        float spec = pow(max(dot(N, H), 0.0), 220.0);
        float sparkle = pow(max(dot(N, H), 0.0), 40.0) * (0.35 + 0.65 * fn);
        col += uSunCol * (spec * 1.5 + sparkle * 0.35) * (1.0 - 0.75 * uNight);
        // caustic shimmer on the surface
        float caus = pow(1.0 - abs(sin(vWP.x * 7.0 + uTime * 0.5) * cos(vWP.z * 8.0 - uTime * 0.4)), 6.0);
        col += uSunCol * caus * 0.05;
        col = mix(col, vec3(0.96, 0.98, 1.0), foam * 0.9);
        col += vec3(1.0) * uFlash * 0.25;
        float alpha = clamp(0.70 + 0.28 * pow(1.0 - max(dot(N, V), 0.0), 1.4) + foam * 0.06, 0.0, 1.0);
        gl_FragColor = vec4(col, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = WATER_Y;
  mesh.renderOrder = 3;
  return mesh;
}
// underwater volume (interior shell below the sea level, gradient + caustics)
function buildSeaBody(){
  const innerProfile = BTL_PROFILE.map(p => [Math.max(0.045, p[0] - GLASS_T), p[1]]);
  const geo = latheGeo(innerProfile, 72);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: UNI.uTime, uWaterY: UNI.uWaterY, uStorm: UNI.uStorm,
      uShallowCol: UNI.uShallowCol, uDeepCol: UNI.uDeepCol,
      uSkyHor: { value: new THREE.Color(0xf0a878) },
      uFlash: UNI.uFlash, uNight: { value: 0 },
    },
    vertexShader: `
      varying vec3 vWP; varying vec3 vN;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWP = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uWaterY; uniform float uStorm;
      uniform vec3 uShallowCol; uniform vec3 uDeepCol; uniform vec3 uSkyHor;
      uniform float uFlash; uniform float uNight;
      varying vec3 vWP; varying vec3 vN;
      void main(){
        if (vWP.y > uWaterY) discard;
        vec3 V = normalize(cameraPosition - vWP);
        float depth = clamp((uWaterY - vWP.y) / 0.72, 0.0, 1.0);
        vec3 col = mix(uShallowCol * 0.85, uDeepCol, pow(depth, 0.72));
        col = mix(col, uDeepCol * 0.55, 0.4 * uStorm);
        // distant haze toward the far shell
        float fres = pow(1.0 - abs(dot(normalize(vN), V)), 2.0);
        col = mix(col, mix(uSkyHor, uDeepCol, 0.4), fres * 0.14);
        float caus = pow(1.0 - abs(sin(vWP.x * 6.0 + uTime * 0.4) * cos(vWP.z * 7.0 - uTime * 0.35)), 5.0);
        col += vec3(0.45, 0.62, 0.6) * caus * 0.10 * (1.0 - depth) * (1.0 - 0.7 * uStorm);
        col += vec3(1.0) * uFlash * 0.12;
        float alpha = mix(0.10, 0.36, pow(depth, 0.8));
        gl_FragColor = vec4(col, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  return mesh;
}
// sky dome inside the bottle (same shell, above water) + sun / moon / stars
function buildInnerSky(){
  const innerProfile = BTL_PROFILE.map(p => [Math.max(0.045, p[0] - GLASS_T), p[1]]);
  const geo = latheGeo(innerProfile, 72);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uWaterY: UNI.uWaterY, uNight: { value: 0 },
      uTop: { value: new THREE.Color(0x2e4f86) },
      uMid: { value: new THREE.Color(0x7fa8cc) },
      uHor: { value: new THREE.Color(0xf2b184) },
      uStorm: UNI.uStorm, uFlash: UNI.uFlash,
    },
    vertexShader: `
      varying vec3 vWP;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWP = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uWaterY; uniform float uNight; uniform float uStorm; uniform float uFlash;
      uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHor;
      varying vec3 vWP;
      void main(){
        if (vWP.y < uWaterY) discard;
        float h = clamp((vWP.y - uWaterY) / 0.72, 0.0, 1.0);
        vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.42, h));
        col = mix(col, uTop, smoothstep(0.30, 1.0, h));
        col = mix(col, vec3(0.16, 0.17, 0.22), uStorm * 0.85);
        col += vec3(0.9, 0.93, 1.0) * uFlash * 0.35;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.DoubleSide,
    depthWrite: false, depthTest: false,
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = -1;
  return m;
}

function buildUnderwater(){
  const v = new Vox();
  const place = (x, z, y0) => innerBotY(x, z) + y0;   // y0 = how high above the glass curve
  // --- sunken treasure chest with golden glow ---
  {
    const x = 0.34, z = -0.05, by = place(x, z, 0.005);
    const gy0 = Math.round(by / VOX);
    const gx0 = Math.round(x / VOX), gz0 = Math.round(z / VOX);
    for (let dx = 0; dx <= 4; dx++) for (let dz = 0; dz <= 3; dz++) for (let dy = 0; dy <= 2; dy++){
      let c = C.woodDark;
      if (dy === 2) c = C.wood;
      if (dx === 0 || dx === 4 || dz === 0 || dz === 3) c = C.wood;
      if ((dx === 0 || dx === 4) && dz <= 1) c = C.goldDk;
      if ((dz === 0 || dz === 3) && dx <= 1) c = C.goldDk;
      if (dy === 2 && (dx === 1 || dx === 3)) c = C.gold;
      v.set(gx0 + dx, gy0 + dy, gz0 + dz, c);
    }
    // spilled coins
    for (let i = 0; i < 10; i++){
      v.set(gx0 + Math.round(rr(-3, 7)), gy0 + (rnd() < 0.6 ? 0 : 1), gz0 + Math.round(rr(-3, 6)),
        rnd() < 0.8 ? C.gold : C.goldDk);
    }
    v.__chestWorld = new THREE.Vector3(x, gy0 * VOX + 2.6 * VOX, z);
  }
  // --- anchor ---
  {
    const x = -0.40, z = 0.13, by = place(x, z, 0.005);
    const gy0 = Math.round(by / VOX), gx0 = Math.round(x / VOX), gz0 = Math.round(z / VOX);
    v.box(gx0, gy0 + 7, gz0, gx0, gy0 + 7, gz0, C.iron);          // ring top
    v.set(gx0 + 1, gy0 + 8, gz0, C.iron); v.set(gx0, gy0 + 8, gz0, C.iron); v.set(gx0, gy0 + 8, gz0 + 1, C.iron);
    v.box(gx0 - 1, gy0 + 6, gz0, gx0 + 1, gy0 + 6, gz0, C.iron);  // stock
    v.box(gx0, gy0 + 1, gz0, gx0, gy0 + 6, gz0, C.iron);          // shank
    v.box(gx0 - 2, gy0 + 1, gz0, gx0 + 2, gy0 + 1, gz0, C.iron);  // arms
    v.set(gx0 - 2, gy0 + 2, gz0, C.iron); v.set(gx0 + 2, gy0 + 2, gz0, C.iron);
    v.set(gx0 - 2, gy0, gz0, C.iron);   v.set(gx0 + 2, gy0, gz0, C.iron);   // flukes
    v.set(gx0 - 3, gy0 + 1, gz0, C.iron); v.set(gx0 + 3, gy0 + 1, gz0, C.iron);
  }
  // --- amphora ---
  {
    const x = 0.30, z = 0.24, by = place(x, z, 0.005);
    const gy0 = Math.round(by / VOX), gx0 = Math.round(x / VOX), gz0 = Math.round(z / VOX);
    for (let dy = 0; dy <= 6; dy++){
      const r = dy === 0 ? 2.0 : dy <= 3 ? 2.2 : dy <= 5 ? 1.5 : 0.8;
      v.cylY(gx0, gz0, gy0 + dy, gy0 + dy, () => r, (a, b, c2, d) => {
        let col = d > 0.78 ? 0x9a5f3a : 0xb8744a;
        if (dy >= 4) col = d > 0.7 ? 0x7d4a2c : 0x94603a;
        if (dy <= 1 && rnd() < 0.5) col = 0x5f7a4a;              // algae
        return col;
      });
    }
    // handles
    v.set(gx0 - 2, gy0 + 5, gz0, 0xb8744a); v.set(gx0 + 2, gy0 + 5, gz0, 0xb8744a);
    v.set(gx0 - 2, gy0 + 6, gz0, 0x9a5f3a); v.set(gx0 + 2, gy0 + 6, gz0, 0x9a5f3a);
    v.__amphoraWorld = new THREE.Vector3(x, gy0 * VOX + 3 * VOX, z);
  }
  // --- coral fans on the deep curve ---
  const fans = [
    [-0.58, -0.18, 0.5], [-0.30, 0.30, 0.7], [0.50, 0.10, 0.6], [0.05, -0.34, 0.55], [-0.72, 0.05, 0.4],
  ];
  for (const [x, z, s] of fans){
    const by = place(x, z, 0.004);
    const gy0 = Math.round(by / VOX), gx0 = Math.round(x / VOX), gz0 = Math.round(z / VOX);
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++){
      const col = [C.coralPink, C.coralOra, C.coralPur, C.coralRed][Math.floor(rnd() * 4)];
      const ox = Math.round(rr(-2, 2)), oz = Math.round(rr(-2, 2));
      const hh = 2 + Math.floor(rnd() * 3 * s);
      v.cylY(gx0 + ox, gz0 + oz, gy0, gy0 + hh, (y) => (y === gy0 ? 1.2 : 0.7), () => col);
      if (rnd() < 0.5) v.set(gx0 + ox + 1, gy0 + hh, gz0 + oz, col);
      if (rnd() < 0.5) v.set(gx0 + ox, gy0 + hh, gz0 + oz + 1, col);
    }
  }
  // --- scattered deep rocks (kept inside the bowl, below the surface) ---
  for (let i = 0; i < 16; i++){
    const x = rr(-0.70, 0.55), z = rr(-0.45, 0.45);
    const by = innerBotY(x, z);
    if (by > WATER_Y - 0.12) continue;                  // must sit in deep water
    v.blob(x / VOX, (by + 0.004) / VOX, z / VOX, rr(0.8, 2.0), rr(0.6, 1.4), rr(0.8, 2.0),
      rnd() < 0.5 ? C.rockDark : C.rock, 0.3);
  }
  return v;
}

// STAND (托架) — world-grid voxels
// ============================================================
function buildStand(){
  const v = new Vox();
  const TABLE_Y = -1.0;
  const cradleR = 0.862;
  for (const fx of [-0.36, 0.55]){
    // cradle arc following the bottle bottom
    for (let z = -0.63; z <= 0.63; z += VOX * 0.5){
      const yc = -Math.sqrt(Math.max(0.02, cradleR * cradleR - z * z));
      const gx = Math.round(fx / VOX), gy = Math.round(yc / VOX), gz = Math.round(z / VOX);
      v.set(gx, gy, gz, C.wood);
      v.set(gx, gy, gz + 1, C.woodDark);
    }
    // ribs down to the table + feet
    for (const z of [-0.60, -0.40, -0.20, 0, 0.20, 0.40, 0.60]){
      const yc = -Math.sqrt(Math.max(0.02, cradleR * cradleR - z * z));
      const gx = Math.round(fx / VOX), gz = Math.round(z / VOX);
      for (let y = yc; y > TABLE_Y; y -= VOX){
        const gy = Math.round(y / VOX);
        v.set(gx, gy, gz, C.woodDark);
        if (Math.abs(z) > 0.5) v.set(gx, gy, gz, C.wood);
      }
      v.box(gx - 1, Math.round(TABLE_Y / VOX), gz - 1, gx + 1, Math.round(TABLE_Y / VOX), gz + 1, C.wood); // foot
    }
    // decorative arch cut on the outer face
    for (let z = -0.45; z <= 0.45; z += VOX * 0.5){
      const yy = -Math.sqrt(Math.max(0.02, 0.28 * 0.28 - z * z)) - 0.32;
      const gz = Math.round(z / VOX);
      v.set(Math.round(fx / VOX), Math.round(yy / VOX), gz, C.woodPale);
    }
  }
  // stretcher braces between the frames
  for (const z of [-0.42, 0.42, 0]){
    const gz = Math.round(z / VOX);
    for (let x = -0.36; x <= 0.55; x += VOX * 0.5){
      v.set(Math.round(x / VOX), Math.round((TABLE_Y + 0.055) / VOX), gz, C.woodDark);
    }
  }
  return v;
}

function buildTelescope(){

function makePoints(n, colorMode){
  const pos = new Float32Array(n * 3), life = new Float32Array(n), max = new Float32Array(n),
        size = new Float32Array(n), col = new Float32Array(n * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aLife', new THREE.BufferAttribute(life, 1));
  g.setAttribute('aMax', new THREE.BufferAttribute(max, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  const m = new THREE.ShaderMaterial({
    uniforms: { uPix: { value: renderer.getPixelRatio() }, uTime: UNI.uTime },
    vertexShader: `
      attribute float aLife; attribute float aMax; attribute float aSize; attribute vec3 aCol;
      uniform float uPix; varying float vL; varying vec3 vC;
      void main(){
        vL = aMax > 0.0 ? clamp(aLife / aMax, 0.0, 1.0) : 0.0;
        vC = aCol;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPix * (0.6 + vL * 0.8) * 240.0 / max(0.05, -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vL; varying vec3 vC;
      void main(){
        if (vL <= 0.001) discard;
        vec2 d = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.12, length(d)) * vL;
        gl_FragColor = vec4(vC, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false,
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  p.renderOrder = 5;
  const sys = {
    points: p, n, geo: g,
    vel: new Float32Array(n * 3), maxL: max, life, size,
    cursor: 0, colorMode,
    spawn(x, y, z, vx, vy, vz, lifeT, sizeT, c){
      const i = this.cursor; this.cursor = (this.cursor + 1) % this.n;
      const P = g.attributes.position.array;
      P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z;
      this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
      this.life[i] = lifeT; this.maxL[i] = lifeT; this.size[i] = sizeT;
      const C = g.attributes.aCol.array;
      C[i * 3] = c.r; C[i * 3 + 1] = c.g; C[i * 3 + 2] = c.b;
    },
    update(dt, drag){
      const P = g.attributes.position.array;
      for (let i = 0; i < this.n; i++){
        if (this.life[i] <= 0) continue;
        this.life[i] -= dt;
        if (this.life[i] <= 0){ this.maxL[i] = 0; continue; }
        this.vel[i * 3 + 1] -= drag * dt;
        P[i * 3] += this.vel[i * 3] * dt;
        P[i * 3 + 1] += this.vel[i * 3 + 1] * dt;
        P[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
      }
      g.attributes.position.needsUpdate = true;
      g.attributes.aLife.needsUpdate = true;
      g.attributes.aMax.needsUpdate = true;
      g.attributes.aSize.needsUpdate = true;
      g.attributes.aCol.needsUpdate = true;
    },
  };
  return sys;
}

  [ 4.5, 0x0a1030, 0x182550, 0x4a3a68, 0x9ab4e8, 0.12, 0.18, 0.82],
  [ 6.0, 0x1c2f5e, 0x6a5a8a, 0xe8905a, 0xffb070, 0.50, 0.30, 0.42],
  [ 7.5, 0x3a6ea8, 0x8fb8d8, 0xf8c898, 0xffd9a8, 1.30, 0.55, 0.12],
  [12.0, 0x4a90d9, 0xa8cfe8, 0xdceaf2, 0xfff4e0, 1.75, 0.75, 0.00],
  [16.0, 0x4a90d9, 0x9cc8e0, 0xe8d8b8, 0xffe8c0, 1.45, 0.60, 0.06],
  [18.0, 0x35406e, 0xa05a6a, 0xff8a4a, 0xff9a50, 0.85, 0.40, 0.38],
  [19.5, 0x1a2246, 0x3a3a68, 0x8a4a5a, 0xc98a70, 0.32, 0.25, 0.78],
  [21.0, 0x0a1030, 0x121e42, 0x1d2a52, 0x9ab4e8, 0.13, 0.18, 1.00],
  [24.0, 0x0a1030, 0x111d40, 0x1d2a52, 0x9ab4e8, 0.10, 0.16, 1.00],
];
const KCOL = TOD_KEYS.map(k => [k[0], new THREE.Color(k[1]), new THREE.Color(k[2]), new THREE.Color(k[3]), new THREE.Color(k[4]), k[5], k[6], k[7]]);
let tod = 18.35;
let night = 0, sunDir = new THREE.Vector3(0, 1, 0), sunI = 1;
function sampleTOD(t){
  let i = 0;
  for (let k = 1; k < KCOL.length; k++) if (t >= KCOL[k][0]) i = k;
  const a = KCOL[i], b = KCOL[Math.min(i + 1, KCOL.length - 1)];
  const f = smoothstep(0, 1, clamp((t - a[0]) / Math.max(1e-3, b[0] - a[0]), 0, 1));
  return { a, b, f };
}
function updateSky(dt){
  const { a, b, f } = sampleTOD(tod);
  const top = a[1].clone().lerp(b[1], f), mid = a[2].clone().lerp(b[2], f), hor = a[3].clone().lerp(b[3], f);
  const sc = a[4].clone().lerp(b[4], f);
  sunI = lerp(a[5], b[5], f); night = lerp(a[7], b[7], f);
  const hemiI = lerp(a[6], b[6], f);
  skyDome.material.uniforms.uTop.value.copy(top);
  skyDome.material.uniforms.uMid.value.copy(mid);
  skyDome.material.uniforms.uHor.value.copy(hor);
  sea.material.uniforms.uSkyTop.value.copy(top).lerp(hor, 0.35);
  sea.material.uniforms.uSkyHor.value.copy(hor);
  sea.material.uniforms.uSunCol.value.copy(sc);
  sea.material.uniforms.uNight.value = night;
  seaBody.material.uniforms.uSkyHor.value.copy(hor);
  seaBody.material.uniforms.uNight.value = night;
  UNI.uShallowCol.value.setHex(night > 0.5 ? 0x16606b : 0x2f9d8f).lerp(new THREE.Color(0x2f9d8f), 1 - night);
  UNI.uDeepCol.value.setHex(0x0a2a4a).multiplyScalar(1 - night * 0.45);
  // sun / moon arc (in the YZ plane through the bottle axis)
  const sunUp = tod > 6 && tod < 18;
  const phi = ((sunUp ? tod - 6 : tod - 18) / 12) * Math.PI;
  sunDir.set(sunUp ? 0.16 : -0.16, Math.sin(phi), Math.cos(phi)).normalize();
  const moonDir = sunDir.clone().multiplyScalar(-1);
  sea.material.uniforms.uSunDir.value.copy(sunUp ? sunDir : moonDir);
  sunSprite.position.set(sunDir.x * 0.70, sunDir.y * 0.70, sunDir.z * 0.70);
  sunSprite.material.opacity = smoothstep(-0.06, 0.10, sunDir.y) * (1 - 0.85 * storm);
  moonSprite.position.set(moonDir.x * 0.70, moonDir.y * 0.70, moonDir.z * 0.70);
  moonSprite.material.opacity = smoothstep(-0.04, 0.12, moonDir.y) * (1 - 0.7 * storm);
  // lights
  const lightDir = sunUp ? sunDir : moonDir;
  sunLight.position.copy(lightDir).multiplyScalar(6).add(new THREE.Vector3(0, 0, 0));
  sunLight.target.position.set(0, -0.1, 0);
  const isDay = sunUp && sunDir.y > 0;
  sunLight.color.copy(sc);
  sunLight.intensity = isDay ? sunI * (1 - 0.82 * storm) : 0.16 * (1 - storm * 0.5) + flashVal * 0.5;
  hemi.color.copy(skyDome.material.uniforms.uMid.value).lerp(new THREE.Color(0xf0a878), 0.25);
  hemi.groundColor.copy(new THREE.Color(0x3a3028)).multiplyScalar(0.5 + 0.5 * (1 - night));
  hemi.intensity = hemiI * (1 - 0.55 * storm) + flashVal * 0.4;
  keyLight.intensity = 1.45 * (1 - 0.25 * storm) + flashVal * 1.2;
  fillLight.intensity = 0.4 * (1 - 0.3 * storm);
  starMat.uniforms.uNight.value = night * (1 - storm * 0.92);
  // practical lights
  lampCabin.intensity = night * 1.25;
  lampChest.intensity = 0.35 + night * 1.0;
  lampDock.intensity = night * 1.05;
  cabinWinMat.opacity = night * 0.95;
  beamMat.uniforms.uNight.value = night;
  lampGlow.material.opacity = 0.25 + night * 0.75;
  dockGlow.material.opacity = night * 0.9;
  boatLampGlow.material.opacity = night * 0.85;
  chestGlow.material.opacity = 0.35 + night * 0.65;
  for (const b of buoys) b.glow.material.opacity = night * 0.8;
}

let storm = 0, stormHold = false, flashVal = 0, flashTimer = 0, nextStrike = 3, flashSecond = 0;
const flashDiv = document.getElementById('flash');
const boltGrp = new THREE.Group();
const boltMat = new THREE.LineBasicMaterial({ color: 0xdfe8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const boltGeo = new THREE.BufferGeometry();
const bolt = new THREE.Line(boltGeo, boltMat);
bolt.frustumCulled = false; bolt.renderOrder = 4;
const bolt2 = new THREE.Line(boltGeo, new THREE.LineBasicMaterial({
  color: 0xb9ccff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
bolt2.frustumCulled = false; bolt2.renderOrder = 4;
bolt2.scale.set(1.012, 1.0, 1.012);
boltGrp.add(bolt, bolt2); contents.add(boltGrp);
function newBolt(){
  const n = 14, pts = [];
  let x = rr(-1.1, 1.1), y = 0.72, z = rr(-0.4, 0.4);
  const ex = x + rr(-0.2, 0.2);
  for (let i = 0; i < n; i++){
    pts.push(x, y, z);
    const t = i / (n - 1);
    x = lerp(x + rr(-0.05, 0.05), ex, t);
    y = lerp(0.72, WATER_Y + 0.02, t) + rr(-0.02, 0.02);
    z = lerp(z, rr(-0.2, 0.2), t);
  }
  pts.push(x, WATER_Y + 0.02, z);
  boltGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
}
function updateStorm(dt){
  storm = damp(storm, stormHold ? 1 : 0, 2.4, dt);
  sea.material.uniforms.uAmp.value = 1 + storm * 3.2;
  sea.material.uniforms.uTS.value = 1 + storm * 0.55;
  seaBody.material.uniforms.uStorm.value = storm;
  rainSys.mat.opacity = storm * 0.42;
  cloudMat.color.setHex(0xffffff).lerp(new THREE.Color(0x4a5266), storm * 0.9);
  // bottle wobble on its cradle — inner sea stays level (contents unaffected)
  const A1 = lerp(0.006, 0.030, storm), A2 = lerp(0.002, 0.014, storm);
  bottle.rotation.z = A1 * Math.sin(tNow * 1.1) + A2 * Math.sin(tNow * 2.9 + 1.3);
  bottle.rotation.y = lerp(0.003, 0.016, storm) * Math.sin(tNow * 0.8 + 2.1)
                    + lerp(0.002, 0.010, storm) * Math.sin(tNow * 3.3);
  bottle.position.y = lerp(0.0, 0.006, storm) * Math.sin(tNow * 7.3);
  // tag sway
  const tg = bottle.userData.tagGrp;
  tg.rotation.z = Math.sin(tNow * 1.7) * 0.12 * (0.4 + storm);
  tg.rotation.x = Math.cos(tNow * 1.3) * 0.10 * (0.4 + storm);
  // lightning (double-blink pattern)
  if (storm > 0.45){
    flashTimer -= dt;
    if (flashTimer <= 0){
      flashVal = 1; flashTimer = rr(0.16, 0.4);
      flashSecond = 0.10;                       // second, weaker pulse
      nextStrike -= 1;
      if (nextStrike <= 0){
        nextStrike = rr(1, 2);
        newBolt();
        boltMat.opacity = 1.0;
        bolt2 && (bolt2.material.opacity = 0.6);
      }
      flashDiv.style.opacity = (0.16 + rnd() * 0.14) * storm;
    } else flashVal = Math.max(0, flashVal - dt * 8);
    if (flashSecond > 0){ flashSecond -= dt; if (flashSecond <= 0) flashVal = Math.max(flashVal, 0.45); }
    if (boltMat.opacity > 0) boltMat.opacity = Math.max(0, boltMat.opacity - dt * 3.2);
    if (bolt2 && bolt2.material.opacity > 0) bolt2.material.opacity = Math.max(0, bolt2.material.opacity - dt * 2.4);
  } else {
    flashVal *= Math.max(0, 1 - dt * 6);
    boltMat.opacity = Math.max(0, boltMat.opacity - dt * 6);
    if (bolt2) bolt2.material.opacity = Math.max(0, bolt2.material.opacity - dt * 6);
  }
  flashDiv.style.opacity = parseFloat(flashDiv.style.opacity || 0) * Math.max(0, 1 - dt * 5);
  UNI.uFlash.value = flashVal * 0.9;
  // rain streaks
  for (const d of rainSys.data){
    d.y -= d.v * dt * (1 + storm);
    if (d.y < WATER_Y - 0.1){
      d.y = rr(0.45, 0.78); d.x = rr(-1.3, 1.3); d.z = rr(-0.55, 0.55);
      if (innerR(d.x) < Math.hypot(d.y, d.z) + 0.05) d.z *= 0.6;
    }
  }
  const P = rainSys.geo.attributes.position.array;
  for (let i = 0; i < rainSys.data.length; i++){
    const d = rainSys.data[i];
    P[i * 6] = d.x; P[i * 6 + 1] = d.y; P[i * 6 + 2] = d.z;
    P[i * 6 + 3] = d.x + 0.012 * storm; P[i * 6 + 4] = d.y - d.len; P[i * 6 + 5] = d.z;
  }
  rainSys.geo.attributes.position.needsUpdate = true;
}

const boat = { ang: 0.6, h: 0, pitch: 0, roll: 0, x: 0, z: 0 };
const boatTS = () => sea.material.uniforms.uTS.value;
const boatAmp = () => sea.material.uniforms.uAmp.value;
function updateBoat(dt, t){
  boat.ang += dt * (0.34 - 0.16 * storm) * (1 + 0.12 * Math.sin(t * 0.5));
  const Rb = 0.30 + 0.035 * Math.sin(t * 0.23) + 0.02 * Math.sin(t * 0.41 + 1.3);
  boat.x = ISLE_C.x + Math.sin(boat.ang) * Rb;
  boat.z = ISLE_C.z + Math.cos(boat.ang) * Rb;
  const ts = boatTS(), amp = boatAmp();
  const fwd = new THREE.Vector3(Math.cos(boat.ang), 0, -Math.sin(boat.ang));
  const rgt = new THREE.Vector3(fwd.z, 0, -fwd.x);
  const S = (off) => waveH(boat.x + fwd.x * off.x + rgt.x * off.z, boat.z + fwd.z * off.x + rgt.z * off.z, t * ts, amp);
  const bowP = S({ x: 0.30, z: 0.09 }), bowS = S({ x: 0.30, z: -0.09 });
  const stP = S({ x: -0.30, z: 0.09 }), stS = S({ x: -0.30, z: -0.09 });
  const bow = (bowP + bowS) / 2, stn = (stP + stS) / 2, prt = (bowP + stP) / 2, lft = (bowS + stS) / 2;
  const hT = (bowP + bowS + stP + stS) / 4;
  const pT = Math.atan2((bow - stn) / 0.60, 1) * 1.15;
  const rT = Math.atan2((prt - lft) / 0.18, 1) * 1.05;
  boat.h = damp(boat.h, hT, 10, dt);
  boat.pitch = damp(boat.pitch, pT, 8, dt);
  boat.roll = damp(boat.roll, rT, 7, dt);
  boatGrp.position.set(boat.x, WATER_Y + 0.032 + boat.h, boat.z);
  boatGrp.rotation.y = boat.ang + Math.sin(t * 0.45) * 0.05;
  boatGrp.rotation.x = boat.roll;
  boatGrp.rotation.z = boat.pitch;
  // bow spray + wake
  const bowW = new THREE.Vector3(boat.x + fwd.x * 0.40, WATER_Y + 0.02 + boat.h, boat.z + fwd.z * 0.40);
  const sprayN = (2 + 10 * storm) | 0;
  for (let i = 0; i < sprayN; i++){
    const sp = rr(0.06, 0.30) * (1 + storm);
    spraySys.spawn(
      bowW.x + rgt.x * rr(-0.08, 0.08), bowW.y + rr(0, 0.03), bowW.z + rgt.z * rr(-0.08, 0.08),
      fwd.x * sp + rgt.x * rr(-0.06, 0.06) + rr(-0.05, 0.05), rr(0.10, 0.34) * (1 + storm * 0.6), fwd.z * sp + rgt.z * rr(-0.06, 0.06) + rr(-0.05, 0.05),
      rr(0.35, 0.8), rr(0.012, 0.030) * (1 + storm * 0.5),
      new THREE.Color(0.95, 0.98, 1.0));
  }
  const stW = new THREE.Vector3(boat.x - fwd.x * 0.42, WATER_Y + 0.012, boat.z - fwd.z * 0.42);
  for (let i = 0; i < 3; i++){
    spraySys.spawn(
      stW.x + rgt.x * rr(-0.10, 0.10), stW.y + rr(0, 0.015), stW.z + rgt.z * rr(-0.10, 0.10),
      -fwd.x * rr(0.0, 0.05) + rgt.x * rr(-0.08, 0.08), rr(0.02, 0.08), -fwd.z * rr(0.0, 0.05) + rgt.z * rr(-0.08, 0.08),
      rr(1.0, 2.2), rr(0.03, 0.075),
      new THREE.Color(0.82, 0.92, 0.99));
  }
}
// bubbles from the deep
function updateBubbles(dt, t){
  for (let i = 0; i < 5; i++){
    const src = rnd() < 0.5 ? uwVox.__chestWorld : (rnd() < 0.5 ? uwVox.__amphoraWorld
      : new THREE.Vector3(rr(-0.7, 0.7), 0, rr(-0.45, 0.45)));

      src.x + rr(-0.03, 0.03), src.y + rr(-0.02, 0.05), src.z + rr(-0.03, 0.03),

const birds = [];
for (let i = 0; i < 6; i++){
  birds.push({ r: i < 3 ? 0.50 : 0.60, h: [0.10, 0.26, 0.40][i % 3] + rr(-0.03, 0.03), ph: rnd() * Math.PI * 2, spd: rr(0.22, 0.34) * (i % 2 ? 1 : -1) });
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1);
function updateBirds(t){
  for (let i = 0; i < birds.length; i++){
    const b = birds[i];
    const a = b.ph + t * b.spd;
    const x = Math.cos(a) * b.r, z = Math.sin(a) * b.r;
    const y = b.h + Math.sin(t * 1.4 + b.ph) * 0.035;
    // keep inside the dome
    const ch = innerChordZ(x, y);
    const zz = clamp(z, -ch + 0.05, ch - 0.05);
    _e.set(0, Math.PI / 2 + a, -Math.sign(b.spd) * 0.42);
    _q.setFromEuler(_e);
    _v.set(x, y, zz); _m4.compose(_v, _q, _s);
    birdBodyIM.setMatrixAt(i, _m4);
    // wings flap around the shoulder
    const flap = Math.sin(t * 9 + b.ph * 3) * 0.85;
    for (let w = 0; w < 2; w++){
      _e.set(w === 0 ? flap : -flap, Math.PI / 2 + a, -Math.sign(b.spd) * 0.42);
      _q.setFromEuler(_e);
      _v.set(x, y + 0.006, zz + (w === 0 ? 0.026 : -0.026)); _m4.compose(_v, _q, _s);
      birdWingIM.setMatrixAt(i * 2 + w, _m4);
    }
  }
  birdBodyIM.instanceMatrix.needsUpdate = true;
  birdWingIM.instanceMatrix.needsUpdate = true;
}
const fishes = [];
for (let i = 0; i < 30; i++) fishes.push({ ph: i * 0.42, rr: 0.05 + rnd() * 0.11, dy: rr(-0.09, 0.09), spd: rr(0.16, 0.24), orange: rnd() < 0.18 });
function updateFish(t, dt){
  for (let i = 0; i < fishes.length; i++){
    const f = fishes[i];
    const a = f.ph + t * f.spd;
    const R = 0.09;
    const x = 0.10 + Math.cos(a) * (R + f.rr * 0.6);
    const z = 0.24 + Math.sin(a) * (R + f.rr * 0.6);
    const y = -0.58 + f.dy + Math.sin(t * 2.2 + f.ph) * 0.015;
    _e.set(0, Math.PI / 2 + a, Math.sin(t * 6 + f.ph) * 0.08);
    _q.setFromEuler(_e);
    _v.set(x, y, z); _m4.compose(_v, _q, _s);
    fishIM.setMatrixAt(i, _m4);
  }
  fishIM.instanceMatrix.needsUpdate = true;
}
// whale breach state machine
const whale = { st: 'idle', t: 3.5, x0: 0.5, x1: -0.5, z: 0.24 };
const _col = new THREE.Color(0.8, 0.95, 1.0);
function updateWhale(dt, t){
  whale.t -= dt;
  if (whale.st === 'idle'){
    whaleGrp.visible = false;
    if (whale.t <= 0){
      whale.st = 'launch'; whale.t = 1.15;
      whale.x0 = rnd() < 0.5 ? 0.55 : -0.55;
      whale.x1 = -whale.x0;
      whale.z = rr(-0.24, 0.24);
    }
    return;
  }
  whaleGrp.visible = true;
  if (whale.st === 'launch'){
    const u = 1 - whale.t / 1.15;
    const x = lerp(whale.x0, whale.x1, u);
    const y = WATER_Y + 0.62 * Math.pow(Math.sin(Math.PI * clamp(u * 1.02, 0, 1)), 0.85);
    whaleGrp.position.set(x, y, whale.z);
    whaleGrp.rotation.y = Math.PI;
    whaleGrp.rotation.z = -1.15 * Math.sin(Math.PI * u);
    if (whale.t <= 0){ whale.st = 'fall'; whale.t = 0.85; }
  } else if (whale.st === 'fall'){
    const u = 1 - whale.t / 0.85;
    const x = lerp(whale.x1, whale.x1 * 0.55, u);
    const y = WATER_Y + 0.55 * Math.pow(Math.sin(Math.PI * clamp((1 - u) * 1.02, 0, 1)), 0.85);
    whaleGrp.position.set(x, y, whale.z);
    whaleGrp.rotation.z = 0.9 * Math.sin(Math.PI * u) - 0.3;
    if (whale.t <= 0){
      whale.st = 'idle'; whale.t = rr(9, 15); whaleGrp.visible = false;
      for (let i = 0; i < 46; i++){
        const a = rnd() * Math.PI * 2, sp = rr(0.1, 0.5);
        spraySys.spawn(whale.x1 * 0.55, WATER_Y + 0.02, whale.z,
          Math.cos(a) * sp, rr(0.2, 0.55), Math.sin(a) * sp,
          rr(0.6, 1.3), rr(0.02, 0.06), _col);
      }
    }
  }
}
// clouds drift + storm behaviour
function updateClouds(dt, t){
  for (const c of clouds){
    c.mesh.position.x += c.spd * dt * (1 + storm * 1.6);
    if (c.mesh.position.x > 0.62) c.mesh.position.x = -0.62;
    if (c.mesh.position.x < -0.62) c.mesh.position.x = 0.62;
    const ty = lerp(c.y0, 0.30, storm * 0.85);
    c.mesh.position.y = damp(c.mesh.position.y, ty, 2, dt);
    const ch = innerChordZ(c.mesh.position.x, c.mesh.position.y);
    c.mesh.position.z = clamp(c.mesh.position.z, -ch + 0.06, ch - 0.06);
  }
}
// buoys bob with the swell
function updateBuoys(t){
  const ts = boatTS(), amp = boatAmp();
  for (const b of buoys){
    const h = waveH(b.x, b.z, t * ts, amp);
    const hx = waveH(b.x + 0.06, b.z, t * ts, amp), hz = waveH(b.x, b.z + 0.06, t * ts, amp);
    b.mesh.position.set(b.x, WATER_Y + h + 0.012, b.z);
    b.mesh.rotation.x = Math.atan2(hz - h, 0.06) * 1.2;
    b.mesh.rotation.z = -Math.atan2(hx - h, 0.06) * 1.2;
    b.glow.position.set(b.x, WATER_Y + h + 0.06, b.z);
  }
}
// crabs scuttle
function updateCrabs(dt, t){
  for (const c of crabs){
    c.t -= dt;
    if (c.t <= 0 && c.hop === 0){ c.hop = 0.42; c.tx = c.home.x + rr(-0.06, 0.06); c.tz = c.home.z + rr(-0.06, 0.06); c.t = rr(2, 5); }
    if (c.hop > 0){
      c.hop -= dt;
      const u = 1 - clamp(c.hop / 0.42, 0, 1);
      const e = u * u * (3 - 2 * u);
      c.mesh.position.x = lerp(c.mesh.position.x, c.tx, e * 0.35);
      c.mesh.position.z = lerp(c.mesh.position.z, c.tz, e * 0.35);
      c.mesh.position.y = lerp(c.home.y, c.home.y + 0.02, Math.sin(u * Math.PI) * 0.8);
      c.mesh.rotation.y += dt * 2.2;
      if (c.hop <= 0) c.mesh.position.y = c.home.y;
    }
  }
}
// lighthouse beam sweep
function updateBeam(t){
  beamGrp.rotation.y = -t * 0.55;
  beam.rotation.y = 0;
}

// ============================================================
const ctrl = {
  az: 0.65, po: 1.28, dist: 4.9, tAz: 0.65, tPo: 1.28, tDist: 4.9,
  azV: 0, poV: 0, idle: 0, dragging: false, lx: 0, ly: 0,
};
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  ctrl.dragging = true; ctrl.idle = 0; ctrl.lx = e.clientX; ctrl.ly = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!ctrl.dragging) return;
  const dx = e.clientX - ctrl.lx, dy = e.clientY - ctrl.ly;
  ctrl.lx = e.clientX; ctrl.ly = e.clientY;
  ctrl.tAz -= dx * 0.0052;
  ctrl.tPo = clamp(ctrl.tPo - dy * 0.0042, 0.62, 2.30);
  ctrl.azV = -dx * 0.0052 * 12;
  ctrl.idle = 0;
});
canvas.addEventListener('pointerup', (e) => { ctrl.dragging = false; ctrl.idle = 0; });
canvas.addEventListener('pointercancel', () => { ctrl.dragging = false; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  ctrl.tDist = clamp(ctrl.tDist * (1 + e.deltaY * 0.0011), 2.9, 8.2);
  ctrl.idle = 0;
}, { passive: false });
// pinch zoom
let pinchD = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2){
    pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    ctrl.dragging = false;
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchD){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    ctrl.tDist = clamp(ctrl.tDist * pinchD / Math.max(1, d), 2.9, 8.2);
    pinchD = d; ctrl.idle = 0;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchD = 0; });
function updateCamera(dt, t){
  ctrl.idle += dt;
  if (!ctrl.dragging && ctrl.idle > 4.2) ctrl.tAz += dt * 0.075;
  ctrl.azV *= Math.max(0, 1 - dt * 5);
  ctrl.tAz += ctrl.azV * dt;
  ctrl.az = damp(ctrl.az, ctrl.tAz, 9, dt);
  ctrl.po = damp(ctrl.po, ctrl.tPo, 9, dt);
  ctrl.dist = damp(ctrl.dist, ctrl.tDist, 6, dt);
  const intro = clamp(introT / 2.6, 0, 1);
  const d = lerp(7.6, ctrl.dist, 1 - Math.pow(1 - intro, 3));
  const po = lerp(1.02, ctrl.po, 1 - Math.pow(1 - intro, 3));
  camera.position.set(
    Math.sin(ctrl.az) * Math.sin(po) * d,
    Math.cos(po) * d,
    Math.cos(ctrl.az) * Math.sin(po) * d
  );
  // gentle handheld breathing
  camera.position.y += Math.sin(t * 0.5) * 0.012 + Math.sin(t * 0.83) * 0.006;
  camera.lookAt(0, -0.06, 0);
}

window.__dbg = {
  ctrl, get tod(){ return tod; }, setTod(v){ tod = v; }, setSpeed,
  setStorm(v){ stormHold = v; }, get storm(){ return storm; },
  scene, camera, renderer,
  refs: { islandMesh, uwMesh, skyDome, sea, seaBody, boatGrp, whaleGrp, whale, islandVox, uwVox, stars, contents, bottle },
  info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
};
// ============================================================
// UI
// ============================================================
let todSpeed = 1;                 // 0 = paused
const btns = { x1: document.getElementById('x1'), x4: document.getElementById('x4'), x12: document.getElementById('x12'), pause: document.getElementById('pauseBtn'), storm: document.getElementById('stormBtn') };
function setSpeed(v){
  todSpeed = v;
  btns.x1.classList.toggle('on', v === 1);
  btns.x4.classList.toggle('on', v === 4);
  btns.x12.classList.toggle('on', v === 12);
  btns.pause.classList.toggle('on', v === 0);
}
btns.x1.onclick = () => setSpeed(1);
btns.x4.onclick = () => setSpeed(4);
btns.x12.onclick = () => setSpeed(12);
btns.pause.onclick = () => setSpeed(0);
const setStorm = (v) => { stormHold = v; btns.storm.classList.toggle('armed', v); };
btns.storm.addEventListener('pointerdown', () => setStorm(true));
btns.storm.addEventListener('pointerup', () => setStorm(false));
btns.storm.addEventListener('pointerleave', () => setStorm(false));
btns.storm.addEventListener('click', () => { if (!stormHold) setStorm(!storm); });
addEventListener('keydown', (e) => { if (e.code === 'Space'){ e.preventDefault(); setStorm(true); } });
addEventListener('keyup', (e) => { if (e.code === 'Space') setStorm(false); });
const phaseTxt = document.getElementById('phaseTxt'), todTxt = document.getElementById('todTxt');
function phaseName(){
  if (tod < 4.6) return '子夜';
  if (tod < 6.2) return '黎明';
  if (tod < 10.5) return '清晨';
  if (tod < 14) return '正午';
  if (tod < 16.5) return '午后';
  if (tod < 18.6) return '黄昏';
  if (tod < 20.4) return '入夜';
  return '子夜';
}

// ============================================================
// MAIN LOOP
// ============================================================
const clock = new THREE.Clock();
let tNow = 0, introT = 0, fpsAcc = 0, fpsN = 0, fpsShown = 0, qTimer = 0, quality = 0;
const QUAL = [
  { pr: 1.75, rt: 0.62 },
  { pr: 1.35, rt: 0.5 },
  { pr: 1.0,  rt: 0.42 },
];
function applyQuality(){
  const q = QUAL[quality];
  renderer.setPixelRatio(Math.min(devicePixelRatio, q.pr));
  onResize();
}
function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  glassRT.setSize(Math.floor(w * pr * QUAL[quality].rt), Math.floor(h * pr * QUAL[quality].rt));
  const glassMat = bottle.userData.glass.material;
  glassMat.uniforms.uRes.value.set(w * pr, h * pr);
  starMat.uniforms.uPix.value = pr;
  spraySys.points.material.uniforms.uPix.value = pr;
  bubbleSys.points.material.uniforms.uPix.value = pr;
}
addEventListener('resize', onResize);
applyQuality();

const fpsTxt = document.getElementById('fpsTxt');
function frame(dt){
  tNow += dt; introT += dt;
  UNI.uTime.value = tNow;
  tod += dt * (24 / 132) * todSpeed;
  if (tod >= 24) tod -= 24;
  updateSky(dt);
  updateStorm(dt);
  updateBoat(dt, tNow);
  updateBubbles(dt, tNow);
  updateBirds(tNow);
  updateFish(tNow, dt);
  updateWhale(dt, tNow);
  updateClouds(dt, tNow);
  updateBuoys(tNow);
  updateCrabs(dt, tNow);
  updateBeam(tNow);
  spraySys.update(dt, 0.55);
  bubbleSys.update(dt, 0.0);
  updateCamera(dt, tNow);
  // clock readout
  const hh = Math.floor(tod), mm = Math.floor((tod - hh) * 60);
  todTxt.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  phaseTxt.textContent = storm > 0.5 ? '风暴' : phaseName();
  // render: refraction pass (no glass) then main pass
  bottle.userData.glass.visible = false;
  bottle.userData.shell.visible = false;
  renderer.setRenderTarget(glassRT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  bottle.userData.glass.visible = true;
  bottle.userData.shell.visible = true;
  bottle.userData.glass.material.uniforms.uRT.value = glassRT.texture;
  renderer.render(scene, camera);
  // fps + adaptive quality
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){
    fpsShown = Math.round(fpsN / fpsAcc);
    fpsTxt.textContent = fpsShown + ' FPS';
    fpsAcc = 0; fpsN = 0;
    qTimer += 0.5;
    if (qTimer > 3 && fpsShown < 45 && quality < QUAL.length - 1){
      quality++; applyQuality(); qTimer = 0;
    }
  }
}
function loop(){
  requestAnimationFrame(loop);
  window.__frame = (window.__frame || 0) + 1;
  try {
    frame(Math.min(0.05, clock.getDelta()));
  } catch (e) {
    window.__loopErr = (e && e.stack) ? String(e.stack) : String(e);
  }
}
window.__dbg.step = (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) frame(dt); };
loop();

} catch (e) { window.__loadErr = (e && e.stack) ? String(e.stack) : String(e); }

</script>

</body>
