<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#01060e;color:#e9f6ff;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#game{position:absolute;left:0;top:0;display:block;width:100%;height:100%}
.layer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
#hud{display:none}
#hud.on{display:block}
#left{position:absolute;left:14px;top:12px;width:296px;padding:11px 14px 8px;border-radius:14px;
  background:linear-gradient(180deg,rgba(0,12,24,.82),rgba(0,8,18,.62));
  border:1px solid rgba(130,215,250,.30);box-shadow:0 8px 26px rgba(0,0,0,.5)}
#stage{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;text-shadow:0 2px 8px #000}
#stageName{font-size:22px;font-weight:800;letter-spacing:.04em;color:#ffffff;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#stageNo{font-size:11.5px;font-weight:700;color:#0a1e2a;background:#6fe0ff;letter-spacing:.1em;
  border-radius:5px;padding:2px 7px}
.row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tag{font-size:13px;font-weight:700;letter-spacing:.02em;color:#eaf8ff;width:32px;text-align:right;
  flex:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.bar{position:relative;height:15px;flex:1;background:rgba(0,8,16,.88);
  border:1px solid rgba(160,225,255,.55);border-radius:8px;overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
.bar.xpb{height:9px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 10px rgba(255,255,255,.12)}
#barHp{background:linear-gradient(90deg,#ff2942,#ff7a86)}
#barFd{background:linear-gradient(90deg,#ff8f2e,#ffdc7a)}
#barBo{background:linear-gradient(90deg,#22b8ff,#a5f0ff)}
#barXp{background:linear-gradient(90deg,#00e29b,#d3ff72)}
#right{position:absolute;right:14px;top:12px;text-align:right;padding:9px 16px 11px;border-radius:14px;

#combo{font-size:15px;font-weight:700;color:#ffd257;height:20px;transition:transform .1s}
#depth{font-size:12.5px;font-weight:600;color:#bfe6fa;margin-top:3px}
#bossWrap{position:absolute;left:50%;top:16px;width:min(52vw,520px);transform:translateX(-50%);
  display:none}
#bossWrap.on{display:block}
#bossName{text-align:center;font-size:13px;letter-spacing:.3em;color:#ff8fa3;margin-bottom:5px;
  text-shadow:0 0 12px rgba(255,60,90,.7)}
#bossBar{height:11px;background:rgba(30,0,10,.6);border:1px solid rgba(255,110,140,.45);

#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,0) scale(.8);opacity:0;

#toast.on{opacity:1;transform:translate(-50%,-10px) scale(1)}

  border:1px solid rgba(130,210,245,.28);box-shadow:0 4px 18px rgba(0,0,0,.45);transition:opacity .5s}
.panel{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;

.panel.hide{display:none}
h1{font-size:min(9vw,62px);font-weight:900;letter-spacing:.16em;line-height:1;
  background:linear-gradient(180deg,#ffffff,#5fd8ff 60%,#1d7fb8);

  filter:drop-shadow(0 6px 22px rgba(0,180,255,.45))}
.sub{margin-top:10px;font-size:12.5px;letter-spacing:.42em;color:#6fb4d8}
.btn{margin-top:26px;pointer-events:auto;cursor:pointer;border:none;border-radius:40px;
  padding:14px 46px;font-size:17px;font-weight:800;letter-spacing:.22em;color:#022033;
  background:linear-gradient(180deg,#8fefff,#22b6f0);
  box-shadow:0 8px 24px rgba(0,170,255,.35),inset 0 -3px 0 rgba(0,0,0,.16);
  font-family:inherit;transition:transform .12s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:translateY(1px) scale(.98)}
.keys{margin-top:24px;font-size:12.5px;color:#9dc4d8;line-height:2;text-align:center}
.keys b{color:#ffd257;font-weight:700}
.kbd{display:inline-block;min-width:22px;padding:1px 7px;margin:0 2px;border-radius:5px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#eaf7ff;font-size:11.5px}
.btnrow{display:flex;gap:13px;align-items:center;margin-top:26px;flex-wrap:wrap;justify-content:center}
.btnrow .btn{margin-top:0}
.btn.small{padding:11px 24px;font-size:14px;letter-spacing:.14em;margin-top:0}
.btn.ghost{background:rgba(10,40,64,.5);color:#a9dcf2;border:1px solid rgba(130,215,250,.5);
  box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ptitle{font-size:min(7vw,32px);letter-spacing:.34em;color:#d3f2ff;font-weight:800;margin-bottom:6px;
  text-shadow:0 2px 16px rgba(0,0,0,.75)}
.psub{font-size:11.5px;letter-spacing:.2em;color:#79b6d4;margin-bottom:14px}
#setBody{width:min(94vw,660px);max-height:60vh;overflow-y:auto;overflow-x:hidden;padding-right:6px}
#setBody::-webkit-scrollbar{width:6px}
#setBody::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:3px}
#setBody::-webkit-scrollbar-thumb{background:rgba(120,210,245,.4);border-radius:3px}
.sec{font-size:11px;font-weight:700;letter-spacing:.32em;color:#6fd0f5;margin:15px 2px 7px}
.sec:first-child{margin-top:2px}
.srow{display:flex;align-items:center;gap:14px;padding:9px 13px;margin-bottom:6px;border-radius:11px;

.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-size:14.5px;font-weight:600;color:#eaf8ff}

.sw{width:50px;height:27px;border-radius:14px;background:rgba(0,12,24,.8);

.sl span{font-size:12.5px;font-weight:600;color:#bfe6fa;width:46px;text-align:right}
.setFoot{display:flex;gap:11px;align-items:center;margin-top:16px;flex-wrap:wrap;justify-content:center}
#overTitle{font-size:min(8vw,52px);font-weight:900;letter-spacing:.2em;color:#ff5a6e;

#overSub{margin-top:8px;font-size:13px;color:#9fc7dc;letter-spacing:.1em}
#stats{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));gap:12px 26px;

.stat span{font-size:10.5px;letter-spacing:.16em;color:#7fa9c0}
#best{margin-top:16px;font-size:12.5px;color:#ffd257;letter-spacing:.14em}
#pauseP h2{font-size:34px;letter-spacing:.34em;color:#bfe9ff;font-weight:800}

</head>

<script>
(function(){
'use strict';
/* ============================ 工具 ============================ */
var TAU=Math.PI*2, PI=Math.PI;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){if(b===undefined){b=a;a=0;}return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(rnd(a,b));}
function pick(a){return a[(Math.random()*a.length)|0];}
function angNorm(a){a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI;}
function angDiff(a,b){return angNorm(b-a);}
function dist(ax,ay,bx,by){var dx=bx-ax,dy=by-ay;return Math.sqrt(dx*dx+dy*dy);}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function expApp(cur,to,rate,dt){return lerp(cur,to,1-Math.pow(1-rate,dt*60));}
function hexv(h,i){return parseInt(h.substr(1+i*2,2),16);}
function mix(c1,c2,t){var r=Math.round(lerp(hexv(c1,0),hexv(c2,0),t)),g=Math.round(lerp(hexv(c1,1),hexv(c2,1),t)),b=Math.round(lerp(hexv(c1,2),hexv(c2,2),t));return 'rgb('+r+','+g+','+b+')';}
function rgba(c,a){return 'rgba('+hexv(c,0)+','+hexv(c,1)+','+hexv(c,2)+','+a+')';}

/* ============================ 画布 ============================ */
var cvs=document.getElementById('game');
var ctx=cvs.getContext('2d');
var VW=960,VH=600,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=Math.max(320,window.innerWidth||960); VH=Math.max(240,window.innerHeight||600);
  cvs.width=Math.floor(VW*DPR); cvs.height=Math.floor(VH*DPR);
  cvs.style.width=VW+'px'; cvs.style.height=VH+'px';
}
window.addEventListener('resize',resize); resize();

/* ============================ 音效（纯合成） ============================ */
var AU={c:null,m:null,nb:null,on:true};
function auInit(){
  if(AU.c)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    AU.c=new AC(); AU.m=AU.c.createGain(); AU.m.gain.value=0.3; AU.m.connect(AU.c.destination);
    var n=Math.floor(AU.c.sampleRate*0.7), b=AU.c.createBuffer(1,n,AU.c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    AU.nb=b;
  }catch(e){AU.c=null;}
}
function tone(f,dur,type,vol,to,delay){
  if(!AU.c||!AU.on)return;
  try{
    var t=AU.c.currentTime+(delay||0),o=AU.c.createOscillator(),g=AU.c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(24,to),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+dur+0.06);
  }catch(e){}
}
function nz(dur,vol,freq,q,delay){
  if(!AU.c||!AU.on||!AU.nb)return;
  try{
    var t=AU.c.currentTime+(delay||0),s=AU.c.createBufferSource(),f=AU.c.createBiquadFilter(),g=AU.c.createGain();
    s.buffer=AU.nb; f.type='bandpass'; f.frequency.value=freq||900; f.Q.value=q||1.1;
    g.gain.setValueAtTime(Math.max(0.0002,vol||0.2),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.m); s.start(t); s.stop(t+dur+0.05);
  }catch(e){}
}
var SFX={
  chomp:function(big){nz(0.10,big?0.34:0.2,big?420:900,1.4);tone(big?150:260,0.11,'square',0.10,big?60:110);},
  hurt:function(){tone(180,0.34,'sawtooth',0.2,52);nz(0.2,0.2,320,0.9);},
  coin:function(){tone(1180,0.07,'square',0.10);tone(1760,0.12,'square',0.09,null,0.06);},
  heal:function(){tone(520,0.1,'sine',0.13);tone(780,0.16,'sine',0.12,null,0.08);},
  evolve:function(){var s=[330,440,554,660,880];for(var i=0;i<s.length;i++)tone(s[i],0.3,'triangle',0.16,null,i*0.08);nz(0.5,0.12,600,0.6);},
  gold:function(){var s=[660,880,1100,1320];for(var i=0;i<s.length;i++)tone(s[i],0.25,'square',0.11,null,i*0.05);},
  splash:function(){nz(0.3,0.24,1500,0.5);},
  boom:function(){nz(0.55,0.4,180,0.5);tone(90,0.6,'sine',0.28,30);},
  zap:function(){nz(0.09,0.22,3000,3);tone(1400,0.07,'square',0.07,300);},
  roar:function(){tone(70,1.4,'sawtooth',0.25,42);tone(105,1.2,'square',0.10,60);nz(1.2,0.14,240,0.5);},
  boost:function(){nz(0.24,0.10,520,0.7);}
};

var SKIN=[
 {a:'#6d8ea6',b:'#f0f8fb',f:'#5b7d95'},
 {a:'#4f7893',b:'#e9f5fa',f:'#40667f'},
 {a:'#5b7ba8',b:'#eaf2fb',f:'#48648e'},
 {a:'#6b7350',b:'#f3f1de',f:'#565c3e'},
 {a:'#78909f',b:'#fdfefe',f:'#5f7684'},
 {a:'#3d4a5c',b:'#c9d6e0',f:'#2e3947'},

var SP={
 sardine :{n:'沙丁鱼',tier:1,len:24,h:.34,xp:2, food:3.2,sc:6,  spd:80, ai:'school',sh:'fish', c1:'#8ec8e8',c2:'#f2fbff',fear:170,band:[60,2600]},
 clown   :{n:'小丑鱼',tier:1,len:30,h:.46,xp:3, food:4.2,sc:10, spd:66, ai:'wander',sh:'fish', c1:'#ff8b3b',c2:'#fff2dd',fear:200,band:[60,1500],stripe:1},

var SUI={};
function mk(tag,cls,parent){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(parent)parent.appendChild(e);
  return e;
}
function buildSettings(){
  var body=D.setBody; if(!body)return;
  body.innerHTML='';
  for(var i=0;i<SCHEMA.length;i++){
    var it=SCHEMA[i];
    if(it.t==='sec'){ var sc=mk('div','sec',body); sc.textContent=it.n; continue; }
    var row=mk('div','srow',body);
    var nm=mk('div','nm',row);
    var bb=mk('b',null,nm); bb.textContent=it.n;
    if(it.d){ var ii=mk('i',null,nm); ii.textContent=it.d; }
    if(it.t==='seg'){
      var seg=mk('div','seg',row), btns=[];
      for(var j=0;j<it.o.length;j++)(function(key,val,label){
        var b2=mk('button',null,seg);
        b2.id='set-'+key+'-'+val; b2.textContent=label;
        b2.addEventListener('click',function(){ S[key]=val; saveSettings(); syncSettings(); SFX.coin(); },false);
        btns.push([val,b2]);
      })(it.k,it.o[j][0],it.o[j][1]);
      SUI[it.k]={t:'seg',b:btns};
    }else if(it.t==='sw'){
      (function(key){
        var sw=mk('div','sw',row); sw.id='sw-'+key; mk('em',null,sw);
        sw.addEventListener('click',function(){ S[key]=S[key]?0:1; saveSettings(); syncSettings(); SFX.coin(); },false);
        SUI[key]={t:'sw',e:sw};
      })(it.k);
    }else if(it.t==='sl'){
      (function(cfg){
        var wrap=mk('div','sl',row);
        var inp=mk('input',null,wrap);
        inp.type='range'; inp.id='sl-'+cfg.k;
        inp.min=cfg.min; inp.max=cfg.max; inp.step=cfg.step; inp.value=S[cfg.k];
        var val=mk('span',null,wrap);
        inp.addEventListener('input',function(){
          var v=parseInt(inp.value,10); if(isNaN(v))v=DEF[cfg.k];
          S[cfg.k]=clamp(v,cfg.min,cfg.max); saveSettings(); syncSettings();
        },false);
        SUI[cfg.k]={t:'sl',e:inp,v:val,suf:cfg.suf||''};
      })(it);
    }
  }
  syncSettings();
}
function syncSettings(){
  for(var k in SUI){
    var u=SUI[k];
    if(u.t==='seg'){
      for(var i=0;i<u.b.length;i++){
        if(u.b[i][0]===S[k])u.b[i][1].classList.add('act'); else u.b[i][1].classList.remove('act');
      }
    }else if(u.t==='sw'){
      if(S[k])u.e.classList.add('on'); else u.e.classList.remove('on');
    }else{
      u.e.value=S[k]; u.v.textContent=S[k]+u.suf;
    }
  }
}
function openSettings(from){
  G.setFrom=from||'menu'; G.setOpen=true;
  buildSettingsOnce(); syncSettings();
  show(D.menu,false); show(D.pauseP,false); show(D.over,false); show(D.settings,true);

function part(x,y,vx,vy,life,size,color,type){
  if(type==='blood'&&!S.blood){color='#cfeaff';type='dot';}
  if(PQ<1&&Math.random()>PQ)return;
  if(parts.length>1100)parts.shift();
  parts.push({x:x,y:y,vx:vx,vy:vy,l:life,m:life,s:size,c:color,t:type||'dot',r:rnd(TAU),vr:rnd(-6,6)});
}
function burst(x,y,n,color,spd,size,type){
  for(var i=0;i<n;i++){var a=rnd(TAU),s=rnd(spd*0.3,spd);
    part(x+rnd(-6,6),y+rnd(-6,6),Math.cos(a)*s,Math.sin(a)*s,rnd(0.35,0.95),rnd(size*0.5,size),color,type);}
}
function bubbles(x,y,n,size){
  for(var i=0;i<n;i++)part(x+rnd(-14,14),y+rnd(-14,14),rnd(-24,24),rnd(-70,-24),rnd(0.7,1.9),rnd(1.6,size||5),'#cfeeff','bub');
}
function pop(x,y,txt,color,size){

}

}
function stg(){return STAGES[P.stage];}
function playerRad(){return P.len*stg().bite;}

function evolveCheck(){
  while(P.stage<STAGES.length-1&&P.xp>=stg().xp){
    P.xp-=stg().xp; P.stage++;
    var s=stg(); P.tier=s.tier; P.len=s.len; P.mhp=s.hp; P.hp=s.hp; P.food=Math.min(100,P.food+30);
    SFX.evolve(); G.flash=0.6; G.flashC='#7df0ff'; G.shake=Math.max(G.shake,16);
    toast('进化 → '+s.n,'#8ef7ff');
    burst(P.x,P.y,60,'#9ff3ff',420,7,'spark');
    for(var i=0;i<3;i++)part(P.x,P.y,0,0,0.9+i*0.2,P.len*0.7,'#7ff0ff','ring');
  }
}
function addScore(v){ G.score+=Math.round(v*(1+Math.min(G.combo,20)*0.05)*(G.gold>0?3:1)); }

function damage(dmg,src){
  if(P.inv>0||G.gold>0||G.state!=='play')return;
  dmg=dmg*diff().dmg;
  P.hp-=dmg; P.inv=0.95; P.hitT=0.35;
  G.shake=Math.max(G.shake,8+dmg*0.35); G.flash=0.5; G.flashC='#ff2b4a';
  G.combo=0; SFX.hurt();
  burst(P.x,P.y,14,'#ff3b5c',180,5,'dot');
  pop(P.x,P.y-P.len*0.4,'-'+Math.round(dmg),'#ff6b7f',20);
  if(src){var a=Math.atan2(P.y-src.y,P.x-src.x);P.vx+=Math.cos(a)*240;P.vy+=Math.sin(a)*240;}
  if(P.hp<=0){P.hp=0;gameOver();}
}
function heal(v){ P.hp=Math.min(P.mhp,P.hp+v); }

function doEat(e,i){
  var sp=e.sp;
  ents.splice(i,1);
  if(e.sch){e.sch.n--;}
  var big=sp.len>P.len*0.5;
  G.eaten++; G.combo++; G.comboT=2.6; if(G.combo>G.bestCombo)G.bestCombo=G.combo;
  P.xp+=sp.xp; P.food=Math.min(100,P.food+sp.food); P.eatT=0.22; P.mouth=1;
  addScore(sp.sc);
  heal(sp.food*0.35);
  SFX.chomp(big); G.shake=Math.max(G.shake,big?9:3.5);

/* ============================ 生成 ============================ */
function viewR(){return Math.sqrt(VW*VW+VH*VH)/2/cam.z;}
function weightOf(sp){
  if(sp.kind==='p')return 0;
  var d=sp.tier-P.tier;
  var w;
  if(sp.key==='mine')w=0.5;
  else if(d>2)w=0.10;
  else if(d>0)w=0.75*diff().threat;
  else if(d>=-2)w=1.25;
  else w=0.4;
  if(sp.key==='whale')w*=0.25;
  if(sp.key==='diver')w*=0.7;
  if(sp.key==='bird')w*=0.8;
  return w;
}
function spawnAt(key,x,y){
  var sp=SP[key];
  var e={sp:sp,x:x,y:y,vx:0,vy:0,ang:rnd(TAU),len:sp.len*rnd(0.86,1.16),t:rnd(TAU),
    wt:rnd(0.4,2.4),inf:0,st:0,cd:rnd(1,3),sch:null,so:0,ph:rnd(TAU),hit:0};
  if(sp.key!=='bird')e.y=clamp(e.y,60,W.h-24);
  ents.push(e); return e;
}
function spawnNear(key){
  var sp=SP[key],R=viewR();
  var b=sp.band, y;
  if(sp.key==='crab')y=W.h-18;
  else if(sp.key==='bird')y=rnd(b[0],b[1]);
  else y=clamp(P.y+rnd(-820,820),b[0],b[1]);
  var side=Math.random()<0.5?-1:1;
  var x=P.x+side*rnd(R*0.72,R*1.15);
  if(x<80||x>W.w-80){x=P.x-side*rnd(R*0.75,R*1.2);}
  x=clamp(x,60,W.w-60);
  if(sp.key==='school'){}
  var e=spawnAt(key,x,y);
  return e;
}
function spawnSchool(){
  var R=viewR();
  var side=Math.random()<0.5?-1:1;
  var sx=clamp(P.x+side*rnd(R*0.8,R*1.3),100,W.w-100);
  var sy=clamp(P.y+rnd(-700,700),120,W.h-160);
  var sc={x:sx,y:sy,ang:rnd(TAU),t:rnd(TAU),n:0,wt:0};
  schools.push(sc);
  var n=rndi(7,15);
  for(var i=0;i<n;i++){
    var e=spawnAt('sardine',sx+rnd(-70,70),sy+rnd(-50,50));
    e.sch=sc; e.so=rnd(TAU); e.sr=rnd(12,64); sc.n++;
  }
}
function targetCount(){return 80+P.stage*8;}
function spawnLoop(dt){
  G.spawnT-=dt;
  if(G.spawnT>0)return;
  G.spawnT=0.28;
  var guard=0;
  while(ents.length<targetCount()&&guard++<6){
    if(Math.random()<0.28){spawnSchool();continue;}
    var pool=[],tot=0,i,w;
    for(i=0;i<PREY.length;i++){
      var sp=SP[PREY[i]];
      if(sp.key==='sardine')continue;
      w=weightOf(sp); if(w<=0)continue;
      tot+=w; pool.push([PREY[i],tot]);
    }
    var r=Math.random()*tot,keyp=pool.length?pool[pool.length-1][0]:'clown';
    for(i=0;i<pool.length;i++){if(r<=pool[i][1]){keyp=pool[i][0];break;}}
    spawnNear(keyp);
  }
  // 拾取物
  if(Math.random()<0.34&&countKind('p')<9){
    var pk=Math.random()<0.72?'coin':'heal';
    spawnNear(pk);
  }
  G.orbT-=0.28;
  if(G.orbT<=0&&G.gold<=0){G.orbT=rnd(38,60);spawnNear('orb');}
}
function countKind(k){var c=0;for(var i=0;i<ents.length;i++)if(ents[i].sp.kind===k)c++;return c;}
function cull(){
  var R=viewR()*2.2+900;
  for(var i=ents.length-1;i>=0;i--){
    var e=ents[i];
    if(!isFinite(e.x)||!isFinite(e.y)||dist(e.x,e.y,P.x,P.y)>R){ if(e.sch)e.sch.n--; ents.splice(i,1); }
  }
  for(var j=schools.length-1;j>=0;j--)
    if(schools[j].n<=0||dist(schools[j].x,schools[j].y,P.x,P.y)>R)schools.splice(j,1);
}

/* ============================ 实体 AI ============================ */
function faceVel(e,dt,rate){
  var sp2=e.vx*e.vx+e.vy*e.vy;
  if(sp2>25){var a=Math.atan2(e.vy,e.vx);e.ang+=clamp(angDiff(e.ang,a),-(rate||6)*dt,(rate||6)*dt);}
}
function updateSchools(dt){
  for(var i=0;i<schools.length;i++){
    var s=schools[i]; s.t+=dt; s.wt-=dt;
    if(s.wt<=0){s.wt=rnd(1.6,4.2);s.ang=rnd(TAU);}
    var dx=P.x-s.x,dy=P.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<340){s.ang=Math.atan2(-dy,-dx);}
    var sp=d<340?122:64;
    s.x+=Math.cos(s.ang)*sp*dt; s.y+=Math.sin(s.ang)*sp*dt;
    s.x=clamp(s.x,120,W.w-120); s.y=clamp(s.y,140,W.h-200);
  }
}
function updateEnt(e,dt){
  var sp=e.sp; e.t+=dt; if(e.hit>0)e.hit-=dt;
  var dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  var pa=Math.atan2(dy,dx);
  var scared=sp.fear>0&&d<sp.fear&&sp.tier<=P.tier;
  var spd=sp.spd, ai=sp.ai;
  if(ai==='school'){
    var s=e.sch;
    if(!s){ai='wander';}
    else{
      var tx=s.x+Math.cos(e.so+s.t*0.6)*e.sr, ty=s.y+Math.sin(e.so+s.t*0.9)*e.sr*0.6;
      var a=Math.atan2(ty-e.y,tx-e.x);
      var sv=(d<300?134:74);
      e.vx=expApp(e.vx,Math.cos(a)*sv,0.14,dt); e.vy=expApp(e.vy,Math.sin(a)*sv,0.14,dt);
    }
  }
  if(ai==='wander'||ai==='flee'){
    e.wt-=dt;
    if(e.wt<=0){e.wt=rnd(1.1,3.2);e.ang2=(Math.random()<0.5?0:PI)+rnd(-0.42,0.42);}
    if(e.ang2===undefined)e.ang2=rnd(TAU);
    var av=e.ang2, vv=spd*0.45;
    if(scared){av=pa+PI;vv=spd*(ai==='flee'?1.06:0.92);}
    e.vx=expApp(e.vx,Math.cos(av)*vv,scared?0.16:0.07,dt);
    e.vy=expApp(e.vy,Math.sin(av)*vv,scared?0.16:0.07,dt);
  }
  else if(ai==='ground'){
    e.wt-=dt; if(e.wt<=0){e.wt=rnd(1.4,3.4);e.dir=Math.random()<0.5?-1:1;}
    if(e.dir===undefined)e.dir=1;
    var gv=scared?spd*2.1:spd*0.5;
    if(scared)e.dir=(dx>0?-1:1);
    e.vx=expApp(e.vx,e.dir*gv,0.12,dt);
    e.y=expApp(e.y,W.h-16,0.1,dt); e.vy=0; e.ang=0;
  }
  else if(ai==='drift'){
    e.vx=Math.sin(e.t*0.6+e.ph)*22;
    e.vy=Math.sin(e.t*1.4+e.ph)*16-10;
    e.ang=0;
  }
  else if(ai==='puffer'){
    e.inf=expApp(e.inf,d<230?1:0,0.1,dt);
    e.wt-=dt; if(e.wt<=0){e.wt=rnd(1.2,2.8);e.ang2=(Math.random()<0.5?0:PI)+rnd(-0.4,0.4);}
    if(e.ang2===undefined)e.ang2=rnd(TAU);
    var pv=scared?spd*1.1:spd*0.4, pang=scared?pa+PI:e.ang2;
    e.vx=expApp(e.vx,Math.cos(pang)*pv*(1-e.inf*0.55),0.09,dt);
    e.vy=expApp(e.vy,Math.sin(pang)*pv*(1-e.inf*0.55),0.09,dt);
  }
  else if(ai==='bird'){
    if(e.dir===undefined)e.dir=Math.random()<0.5?-1:1;
    e.st-=dt;
    if(e.st<=0){e.st=rnd(2.5,6);e.dive=(Math.random()<0.4);}
    if(e.by===undefined)e.by=rnd(-520,-160);
    var ty2=e.dive?-40:e.by;
    if(P.y<40&&d<300){ty2=-560;}
    e.vx=expApp(e.vx,e.dir*spd,0.05,dt);
    e.vy=expApp(e.vy,clamp((ty2-e.y)*1.6,-260,260),0.08,dt);
    if(e.x<60)e.dir=1; if(e.x>W.w-60)e.dir=-1;
  }
  else if(ai==='diver'){
    e.wt-=dt; if(e.wt<=0){e.wt=rnd(1.6,3.6);e.ang2=rnd(-0.6,0.6)+(Math.random()<0.5?0:PI);}
    if(e.ang2===undefined)e.ang2=0;
    var dv=scared?spd*1.35:spd*0.45, dang=scared?pa+PI:e.ang2;
    e.vx=expApp(e.vx,Math.cos(dang)*dv,0.1,dt);
    e.vy=expApp(e.vy,Math.sin(dang)*dv,0.1,dt);
    if(Math.random()<dt*(scared?7:2))bubbles(e.x+Math.cos(e.ang)*10,e.y-8,1,3.5);
  }
  else if(ai==='eel'){
    e.wt-=dt; if(e.wt<=0){e.wt=rnd(2,4);e.ang2=(Math.random()<0.5?0:PI)+rnd(-0.5,0.5);}
    if(e.ang2===undefined)e.ang2=rnd(TAU);
    e.vx=expApp(e.vx,Math.cos(e.ang2)*spd*0.4,0.05,dt);
    e.vy=expApp(e.vy,Math.sin(e.ang2)*spd*0.4,0.05,dt);
    e.zap=0;
    if(d<190&&sp.tier>P.tier){
      e.zap=1; e.cd-=dt;
      if(e.cd<=0){e.cd=0.85;damage(sp.dmg,e);SFX.zap();
        for(var z=0;z<6;z++)part(lerp(e.x,P.x,z/6),lerp(e.y,P.y,z/6),0,0,0.2,4,'#dcffa0','spark');}
    }
  }
  else if(ai==='hunt'){
    var aggro=sp.tier>P.tier;
    if(aggro&&d<900){
      var hv=spd*(d<400?1.15:0.9);
      e.vx=expApp(e.vx,Math.cos(pa)*hv,0.1,dt); e.vy=expApp(e.vy,Math.sin(pa)*hv,0.1,dt);
      if(d<220&&Math.random()<dt*3)e.mouth=1;
    }else if(!aggro&&d<sp.fear){
      e.vx=expApp(e.vx,Math.cos(pa+PI)*spd*1.15,0.13,dt);
      e.vy=expApp(e.vy,Math.sin(pa+PI)*spd*1.15,0.13,dt);
    }else{
      e.wt-=dt; if(e.wt<=0){e.wt=rnd(1.6,4);e.ang2=(Math.random()<0.5?0:PI)+rnd(-0.5,0.5);}
      if(e.ang2===undefined)e.ang2=rnd(TAU);
      e.vx=expApp(e.vx,Math.cos(e.ang2)*spd*0.42,0.05,dt);
      e.vy=expApp(e.vy,Math.sin(e.ang2)*spd*0.42,0.05,dt);
    }
    e.mouth=Math.max(0,(e.mouth||0)-dt*2);
  }
  else if(ai==='sqai'){
    var want=340;
    var kv=(d<want?-1:0.5)*spd*0.8;
    e.vx=expApp(e.vx,Math.cos(pa)*kv,0.06,dt); e.vy=expApp(e.vy,Math.sin(pa)*kv-16,0.06,dt);
    e.cd-=dt;
    if(d<700&&e.cd<=0&&sp.tier>P.tier){e.cd=rnd(2.2,3.6);shoot(e.x,e.y,pa,220,'ink',9);}
  }
  else if(ai==='whale'){
    if(e.dir===undefined)e.dir=Math.random()<0.5?-1:1;
    e.vx=expApp(e.vx,e.dir*spd,0.02,dt);
    e.vy=expApp(e.vy,Math.sin(e.t*0.35+e.ph)*22,0.02,dt);
    if(e.x<200)e.dir=1; if(e.x>W.w-200)e.dir=-1;
    if(Math.random()<dt*2)bubbles(e.x+Math.cos(e.ang)*e.len*0.3,e.y-e.len*0.15,1,4);
  }
  else if(ai==='mine'){
    e.vx=Math.sin(e.t*0.8+e.ph)*10; e.vy=Math.cos(e.t*0.6+e.ph)*8; e.ang=0;
  }
  else if(ai==='bob'){
    e.vx=Math.sin(e.t*0.9+e.ph)*14; e.vy=Math.sin(e.t*1.5+e.ph)*12; e.ang=0;
  }
  e.x+=e.vx*dt; e.y+=e.vy*dt;
  if(sp.key==='bird'){ e.y=clamp(e.y,-620,-16); }
  else if(sp.ai!=='ground'){
    if(e.y<sp.band[0]-40&&sp.kind!=='p'){e.vy+=90*dt;}
    e.y=clamp(e.y,sp.key==='jelly'?60:70,W.h-18);
  }
  e.x=clamp(e.x,40,W.w-40);
  if(ai!=='ground'&&ai!=='drift'&&ai!=='mine'&&ai!=='bob')faceVel(e,dt,sp.key==='bird'?9:5);
}
function shoot(x,y,a,sp,type,dmg){
  shots.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:4,t:type,d:dmg,r:type==='ink'?13:8,ph:rnd(TAU)});
}
function updateShots(dt){
  for(var i=shots.length-1;i>=0;i--){
    var s=shots[i]; s.l-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    var a=Math.atan2(P.y-s.y,P.x-s.x);
    s.vx=expApp(s.vx,Math.cos(a)*200,0.02,dt); s.vy=expApp(s.vy,Math.sin(a)*200,0.02,dt);
    if(dist(s.x,s.y,P.x,P.y)<playerRad()+s.r){
      damage(s.d,s); G.ink=Math.min(2.4,G.ink+1.3); shots.splice(i,1); continue;
    }
    if(s.l<=0)shots.splice(i,1);
  }
}

/* ============================ BOSS ============================ */
function bossSpawn(){
  BOSS.on=true; BOSS.dieT=0; BOSS.t=0; BOSS.hurt=0;
  BOSS.max=520+G.bossN*260; BOSS.hp=BOSS.max; G.bossN++;
  var side=Math.random()<0.5?-1:1;
  BOSS.x=clamp(P.x+side*rnd(700,1000),300,W.w-300);
  BOSS.y=clamp(P.y+rnd(200,700),900,W.h-360);
  BOSS.vx=0;BOSS.vy=0;BOSS.face=0;BOSS.atk=rnd(2.5,4);BOSS.pts=[];
  BOSS.arms=[];
  for(var i=0;i<7;i++)BOSS.arms.push({o:(i-3)*0.34,ph:rnd(TAU),len:rnd(0.9,1.25)});
  SFX.roar(); toast('深渊克拉肯 出现！','#ff6b8a'); G.shake=Math.max(G.shake,18);
  if(D.bossWrap)D.bossWrap.classList.add('on');
}
function bossEnd(){
  BOSS.on=false; if(D.bossWrap)D.bossWrap.classList.remove('on');
}
function bossUpdate(dt){
  if(!BOSS.on)return;
  BOSS.t+=dt; if(BOSS.hurt>0)BOSS.hurt-=dt;
  if(BOSS.dieT>0){
    BOSS.dieT-=dt;
    BOSS.y+=24*dt;
    if(Math.random()<dt*22)burst(BOSS.x+rnd(-120,120),BOSS.y+rnd(-120,120),6,'#ffb95c',260,7,'spark');
    if(BOSS.dieT<=0){
      SFX.boom(); G.shake=Math.max(G.shake,28); G.flash=0.6; G.flashC='#ffd257';
      burst(BOSS.x,BOSS.y,90,'#ff9d5c',520,11,'spark');
      burst(BOSS.x,BOSS.y,50,'#c8203f',380,9,'blood');
      for(var i=0;i<10;i++)spawnAt('coin',BOSS.x+rnd(-190,190),BOSS.y+rnd(-150,150));
      spawnAt('orb',BOSS.x,BOSS.y-50);
      G.score+=2500; G.bossKill++; P.xp+=520; evolveCheck();
      toast('击杀 深渊克拉肯 +2500','#ffd257');
      bossEnd();
    }
    return;
  }
  var dx=P.x-BOSS.x,dy=P.y-BOSS.y,d=Math.sqrt(dx*dx+dy*dy)||1,pa=Math.atan2(dy,dx);
  BOSS.face+=clamp(angDiff(BOSS.face,pa),-1.4*dt,1.4*dt);
  var want=d<380?-0.55:(d>760?0.95:0.15);
  BOSS.vx=expApp(BOSS.vx,Math.cos(pa)*116*want,0.03,dt);
  BOSS.vy=expApp(BOSS.vy,Math.sin(pa)*116*want-10,0.03,dt);
  BOSS.x+=BOSS.vx*dt; BOSS.y+=BOSS.vy*dt;
  BOSS.x=clamp(BOSS.x,260,W.w-260); BOSS.y=clamp(BOSS.y,620,W.h-260);
  BOSS.atk-=dt;
  if(BOSS.atk<=0){
    BOSS.atk=rnd(2.6,4.2)*(BOSS.hp/BOSS.max<0.4?0.66:1);
    for(var j=-1;j<=1;j++)shoot(BOSS.x+Math.cos(pa)*90,BOSS.y+Math.sin(pa)*90,pa+j*0.26,235,'ink',11);
    SFX.zap();
  }
  // 触手节点
  BOSS.pts=[];
  var R=112,SEG=9;
  for(var a=0;a<BOSS.arms.length;a++){
    var arm=BOSS.arms[a], ang=BOSS.face+arm.o, px=BOSS.x+Math.cos(ang)*R*0.7, py=BOSS.y+Math.sin(ang)*R*0.7;
    var pts=[[px,py]];
    var segl=34*arm.len;
    for(var s2=1;s2<=SEG;s2++){
      var u=s2/SEG;
      var aa=ang+Math.sin(BOSS.t*2.4+arm.ph+u*3.4)*0.55*u+arm.o*0.6*u;
      px+=Math.cos(aa)*segl; py+=Math.sin(aa)*segl;
      pts.push([px,py]);
      if(s2>2&&P.inv<=0&&G.gold<=0&&dist(px,py,P.x,P.y)<28+playerRad()*0.8){
        damage(15,{x:px,y:py});
      }
    }
    BOSS.pts.push(pts);
  }
  // 头部判定
  var hd=dist(BOSS.x,BOSS.y,P.x,P.y);
  if(hd<R+playerRad()*0.9){
    if(P.boosting||G.gold>0){
      if(P.bcd<=0&&BOSS.hurt<=0){
        var dm=(G.gold>0?46:26)+P.stage*4;
        BOSS.hp-=dm; BOSS.hurt=0.28; P.bcd=0.32; P.hitT=0.18;
        SFX.chomp(true); G.shake=Math.max(G.shake,11);
        burst(P.x,P.y,16,'#c8203f',240,6,'blood');
        pop(BOSS.x,BOSS.y-90,'-'+dm,'#ff9d5c',22);
        var ka=Math.atan2(P.y-BOSS.y,P.x-BOSS.x);
        P.vx=Math.cos(ka)*300; P.vy=Math.sin(ka)*300;
        if(BOSS.hp<=0){BOSS.hp=0;BOSS.dieT=1.4;SFX.roar();}
      }
    }else damage(20,BOSS);
  }
}

/* ============================ 玩家更新 ============================ */
function autoPilot(dt){
  var best=null,bd=1e9,bdist=1e9,i,e,d,sc2;
  var flee=null,fd=1e9;
  for(i=0;i<ents.length;i++){
    e=ents[i]; d=dist(e.x,e.y,P.x,P.y);
    if(e.sp.key==='mine'){ if(d<fd*0.7){fd=d;flee=e;} continue; }
    if(e.sp.kind==='p'||e.sp.tier<=P.tier){
      sc2=d-(e.sp.xp||0)*4;
      if(sc2<bd&&d<1500){bd=sc2;bdist=d;best=e;}
    }
    else if(((e.sp.dmg||0)>0||(e.sp.sting||0)>0)&&d<fd){fd=d;flee=e;}
  }
  var a;
  if(flee&&fd<300)a=Math.atan2(P.y-flee.y,P.x-flee.x);
  else if(best)a=Math.atan2(best.y-P.y,best.x-P.x);
  else a=P.ang+Math.sin(G.t*0.5)*0.6+(P.y>W.h-500?-0.6:0)+(P.y<160?0.6:0);
  IN.aang=a; IN.down=!!(best&&bdist<560&&bdist>70&&P.boost>24);
}
function updatePlayer(dt){
  var st=stg();
  if(IN.auto)autoPilot(dt);
  var kx=0,ky=0,K=IN.keys;
  if(S.control!=='mouse'){
    if(K['a']||K['arrowleft'])kx-=1;
    if(K['d']||K['arrowright'])kx+=1;
    if(K['w']||K['arrowup'])ky-=1;
    if(K['s']||K['arrowdown'])ky+=1;
  }
  var want=P.ang,has=false;
  if(kx||ky){want=Math.atan2(ky,kx);has=true;}
  else if(IN.auto){want=IN.aang;has=true;}
  else if(IN.has&&S.control!=='keys'){
    var sx=VW/2+(P.x-cam.x)*cam.z, sy=VH/2+(P.y-cam.y)*cam.z;
    var ddx=IN.mx-sx, ddy=IN.my-sy;
    if(ddx*ddx+ddy*ddy>400){want=Math.atan2(ddy,ddx);has=true;}
  }
  if(has&&!IN.auto&&S.autopilot==='assist'){
    var at=null,ad2=1e9,aa,ai,ae,adf;
    for(ai=0;ai<ents.length;ai++){
      ae=ents[ai];
      if(ae.sp.kind!=='p'&&(ae.sp.tier>P.tier||ae.sp.key==='mine'))continue;
      adf=dist(ae.x,ae.y,P.x,P.y);
      if(adf>620||adf>=ad2)continue;
      aa=Math.atan2(ae.y-P.y,ae.x-P.x);
      if(Math.abs(angDiff(want,aa))<0.6){ad2=adf;at=ae;}
    }
    if(at)want=want+angDiff(want,Math.atan2(at.y-P.y,at.x-P.x))*0.55;
  }
  var air=P.y<0;
  var pressed=((S.control!=='keys')&&IN.down)||((S.control!=='mouse')&&(K[' ']||K['shift']));
  if(S.boostMode!=='toggle')IN.btog=false;
  var wantBoost=(S.boostMode==='toggle'?IN.btog:pressed)&&P.boost>2&&!air;
  if(P.boost<=2)IN.btog=false;
  P.boosting=wantBoost;
  if(wantBoost){
    P.boost=Math.max(0,P.boost-42*dt);
    if(Math.random()<dt*30)bubbles(P.x-Math.cos(P.ang)*P.len*0.45,P.y-Math.sin(P.ang)*P.len*0.45,1,4);
    if(Math.random()<dt*3)SFX.boost();
  }else P.boost=Math.min(100,P.boost+(air?26:17)*dt);

  var turn=st.turn*((S.turn||100)/100)*(air?0.9:1)*(P.boosting?0.82:1);
  var da=clamp(angDiff(P.ang,want),-turn*dt,turn*dt);
  P.ang+=da;
  if(air&&has)P.spin+=da;

  var spd=st.spd*(P.boosting?1.9:1)*(G.gold>0?1.28:1);
  if(air){
    P.vy+=1180*dt; P.vx*=(1-0.16*dt);
    if(!has)P.ang+=clamp(angDiff(P.ang,Math.atan2(P.vy,P.vx)),-3*dt,3*dt);
  }else{
    var tx=Math.cos(P.ang)*spd, ty=Math.sin(P.ang)*spd;
    var k=P.boosting?5.2:3.1;
    P.vx=expApp(P.vx,tx,k*0.05,dt); P.vy=expApp(P.vy,ty,k*0.05,dt);
    P.vy+=34*dt;
  }
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  P.vel=Math.sqrt(P.vx*P.vx+P.vy*P.vy);
  // 出入水
  if(air&&!P.air){P.air=true;P.spin=0;SFX.splash();
    for(var i=0;i<18;i++)part(P.x+rnd(-30,30),2,rnd(-160,160),rnd(-260,-60),rnd(0.4,1),rnd(2,6),'#dff4ff','bub');}
  if(!air&&P.air){
    P.air=false; SFX.splash(); G.shake=Math.max(G.shake,Math.min(12,P.vel*0.02));
    for(var j=0;j<26;j++)part(P.x+rnd(-40,40),2,rnd(-220,220),rnd(-300,-80),rnd(0.4,1.1),rnd(2,7),'#e8f8ff','bub');
    var sp2=Math.floor(Math.abs(P.spin)/TAU);
    if(sp2>0){var bonus=sp2*260;G.score+=bonus;P.boost=100;
      pop(P.x,P.y-40,sp2+'x 翻滚 +'+bonus,'#ffd257',22);SFX.gold();toast('空 中 翻 滚 x'+sp2,'#ffd257');}
    P.spin=0;
  }
  if(P.y>W.h-P.len*0.3){P.y=W.h-P.len*0.3;P.vy=Math.min(P.vy,0);
    if(Math.random()<dt*30)part(P.x,W.h-6,rnd(-40,40),rnd(-30,-6),0.7,rnd(3,9),'#c9b58f','dot');}
  if(P.x<70){P.x=70;P.vx=Math.abs(P.vx)*0.4;}
  if(P.x>W.w-70){P.x=W.w-70;P.vx=-Math.abs(P.vx)*0.4;}
  if(P.y<-W.sky+40){P.y=-W.sky+40;P.vy=Math.abs(P.vy)*0.3;}
  // 饥饿 / 状态
  if(G.gold>0){ G.gold-=dt; if(G.gold<=0){G.gold=0;toast('狂暴结束','#9fd8ff');} }
  else{
    P.food-=st.drain*dt*(P.boosting?1.7:1)*diff().drain;
    if(P.food<=0){P.food=0;P.hp-=10*dt;if(P.hp<=0){P.hp=0;gameOver();return;}}
    else if(P.food>25&&P.hp<P.mhp)P.hp=Math.min(P.mhp,P.hp+1.6*dt);
  }
  if(P.inv>0)P.inv-=dt;
  if(P.hitT>0)P.hitT-=dt;
  if(P.bcd>0)P.bcd-=dt;
  if(P.eatT>0)P.eatT-=dt;
  P.mouth=Math.max(0,P.mouth-dt*2.6);
  if(P.boosting)P.mouth=Math.max(P.mouth,0.45);
  P.swim+=dt*(4+Math.min(P.vel,600)*0.019);
  if(G.gold>0&&Math.random()<dt*40)
    part(P.x+rnd(-P.len*0.3,P.len*0.3),P.y+rnd(-P.len*0.14,P.len*0.14),rnd(-20,20),rnd(-40,-10),0.7,rnd(2,5),'#ffd257','spark');
  if(Math.random()<dt*(P.boosting?9:2.2))
    bubbles(P.x+Math.cos(P.ang)*P.len*0.42,P.y+Math.sin(P.ang)*P.len*0.42,1,3.5);
}
function collide(){
  var pr=playerRad();
  for(var i=ents.length-1;i>=0;i--){
    var e=ents[i],sp=e.sp;
    var er=e.len*sp.rad*(1+(e.inf||0)*0.5);
    var d=dist(P.x,P.y,e.x,e.y);
    var suck=(sp.kind==='p'||G.gold>0||(sp.tier<=P.tier&&sp.key!=='mine'));
    if(suck&&d<pr*2.1+er&&d>1){
      var pull=Math.min(0.5,(pr*2.1+er-d)/(pr*2.1)*0.30);
      e.x+=(P.x-e.x)*pull; e.y+=(P.y-e.y)*pull;
      d=dist(P.x,P.y,e.x,e.y);
    }
    if(!(d<=pr+er))continue;
    if(sp.kind==='p'){ collect(e); ents.splice(i,1); continue; }
    var edible = G.gold>0 ? true : (sp.tier<=P.tier&&sp.key!=='mine');
    if(edible)doEat(e,i);
    else{
      if(sp.key==='mine'){
        SFX.boom(); damage(sp.dmg,e); G.shake=Math.max(G.shake,22);
        burst(e.x,e.y,44,'#ffb95c',420,9,'spark');
        burst(e.x,e.y,16,'#5a6470',200,7,'chunk');
        ents.splice(i,1); continue;
      }
      if(sp.key==='jelly'){ damage(sp.sting,e); continue; }
      if(sp.dmg>0)damage(sp.dmg,e);
    }
  }
}

function baseZoom(){
  var z=Math.min(VW/1180,VH/700);
  return clamp(z,0.52,1.6);
}
function updateCam(dt){
  var tz=baseZoom()*(1.02-P.stage*0.052)*(P.boosting?0.965:1);
  cam.z=expApp(cam.z,tz,0.05,dt);
  var tx=P.x+P.vx*0.22, ty=P.y+P.vy*0.16;
  cam.x=expApp(cam.x,tx,0.11,dt); cam.y=expApp(cam.y,ty,0.11,dt);
  var hw=VW/2/cam.z, hh=VH/2/cam.z;
  cam.x=(hw*2>W.w)?W.w/2:clamp(cam.x,hw,W.w-hw);
  var top=-W.sky, bot=W.h;
  cam.y=(hh*2>bot-top)?(top+bot)/2:clamp(cam.y,top+hh,bot-hh);
  if(G.shake>0){G.shake=Math.max(0,G.shake-dt*30);
    var sm=(S.shake||0)/100;
    cam.sx=rnd(-G.shake,G.shake)*sm;cam.sy=rnd(-G.shake,G.shake)*sm;}
  else{cam.sx=0;cam.sy=0;}
}
function updateParts(dt){
  var i,p;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i]; p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
    if(p.t==='bub'){p.vy-=52*dt;p.vx*=0.985;p.vx+=Math.sin(p.y*0.05+p.r)*8*dt;}
    else if(p.t==='blood'){p.vx*=0.94;p.vy*=0.94;p.vy+=16*dt;}
    else if(p.t==='chunk'){p.vy+=90*dt;p.vx*=0.98;}
    else if(p.t==='spark'){p.vx*=0.93;p.vy*=0.93;}
    else{p.vx*=0.96;p.vy*=0.96;}
  }
  for(i=pops.length-1;i>=0;i--){
    pops[i].l-=dt*1.1; pops[i].y-=34*dt;
    if(pops[i].l<=0)pops.splice(i,1);
  }
}
function update(dt){
  G.t+=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  if(G.flash>0)G.flash-=dt*1.8;
  if(G.ink>0)G.ink-=dt*0.5;
  updatePlayer(dt);
  if(G.state==='over')return;
  updateSchools(dt);
  for(var i=0;i<ents.length;i++)updateEnt(ents[i],dt);
  updateShots(dt);
  bossUpdate(dt);

  spawnLoop(dt);
  cull();
  if(!BOSS.on&&P.stage>=3){
    G.bossT-=dt;
    if(G.bossT<=0){G.bossT=rnd(95,130);bossSpawn();}
  }
  updateParts(dt);
  if(G.t>7&&D.hint&&D.hint.style.opacity!=='0')D.hint.style.opacity='0';
}

/* ============================ 渲染：环境 ============================ */
var STOPS=[[-760,'#0b3358'],[-140,'#63c4e6'],[0,'#31a9da'],[420,'#1b88bf'],[1100,'#0f6096'],
           [1900,'#083f68'],[2700,'#04223c'],[3600,'#010c18']];
function waterCol(y){
  if(y<=STOPS[0][0])return STOPS[0][1];
  for(var i=1;i<STOPS.length;i++){
    if(y<=STOPS[i][0]){var t=(y-STOPS[i-1][0])/(STOPS[i][0]-STOPS[i-1][0]);return mix(STOPS[i-1][1],STOPS[i][1],t);}
  }
  return STOPS[STOPS.length-1][1];
}
function sX(x){return x*cam.z+(VW/2-cam.x*cam.z+cam.sx);}
function sY(y){return y*cam.z+(VH/2-cam.y*cam.z+cam.sy);}
function camApply(){ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*(VW/2-cam.x*cam.z+cam.sx),DPR*(VH/2-cam.y*cam.z+cam.sy));}
function screenApply(){ctx.setTransform(DPR,0,0,DPR,0,0);}
function vis(x,y,r){
  var l=cam.x-VW/2/cam.z-r,rr=cam.x+VW/2/cam.z+r,t=cam.y-VH/2/cam.z-r,b=cam.y+VH/2/cam.z+r;
  return x>l&&x<rr&&y>t&&y<b;
}
function drawBG(){
  screenApply();
  var top=cam.y-VH/2/cam.z, bot=cam.y+VH/2/cam.z;
  var g=ctx.createLinearGradient(0,0,0,VH);
  for(var i=0;i<=8;i++){var t=i/8;g.addColorStop(t,waterCol(lerp(top,bot,t)));}
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  var surf=sY(0);
  if(surf>-40){
    // 天空
    var sg=ctx.createLinearGradient(0,Math.max(0,surf-VH),0,surf);
    sg.addColorStop(0,'#0e2f52'); sg.addColorStop(0.55,'#2f79a8'); sg.addColorStop(1,'#a8dcf0');
    ctx.fillStyle=sg; ctx.fillRect(0,-2,VW,surf+2);
    var sunx=VW*0.74, suny=surf-VH*0.42;
    var rg=ctx.createRadialGradient(sunx,suny,4,sunx,suny,Math.max(60,VH*0.42));
    rg.addColorStop(0,'rgba(255,246,214,0.95)'); rg.addColorStop(0.18,'rgba(255,224,150,0.42)');
    rg.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,-2,VW,surf+2);
    // 水面
    ctx.beginPath(); ctx.moveTo(0,surf+140); ctx.lineTo(0,surf);
    for(var x=0;x<=VW;x+=14){
      var wy=surf+Math.sin((x+cam.x*cam.z)*0.018+G.t*1.6)*3.2*cam.z+Math.sin((x)*0.005-G.t*0.9)*2.4*cam.z;
      ctx.lineTo(x,wy);
    }
    ctx.lineTo(VW,surf+140); ctx.closePath();
    var wg=ctx.createLinearGradient(0,surf-6,0,surf+120);
    wg.addColorStop(0,'rgba(210,245,255,0.75)'); wg.addColorStop(0.12,'rgba(120,205,235,0.35)');
    wg.addColorStop(1,'rgba(40,150,200,0)');
    ctx.fillStyle=wg; ctx.fill();
  }
  // 光柱
  camApply();
  if(S.shafts&&cam.y-VH/2/cam.z<1900){
    ctx.globalCompositeOperation='lighter';
    var base=Math.floor(cam.x/520)*520;
    for(var i2=-2;i2<=6;i2++){
      var bx=base+i2*520+Math.sin(i2*2.1)*160;
      var sw=150+Math.sin(G.t*0.4+i2*1.3)*62;
      var off=Math.sin(G.t*0.24+i2*1.7)*90;
      var gg=ctx.createLinearGradient(bx,0,bx+off*2,1750);
      gg.addColorStop(0,'rgba(185,238,255,0.10)');
      gg.addColorStop(0.45,'rgba(150,220,255,0.032)');
      gg.addColorStop(1,'rgba(120,200,255,0)');
      ctx.fillStyle=gg;
      ctx.beginPath();
      ctx.moveTo(bx-sw*0.35,0); ctx.lineTo(bx+sw*0.35,0);
      ctx.lineTo(bx+off+sw*1.5,1750); ctx.lineTo(bx+off-sw*1.5,1750);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
}
function drawDecor(){
  camApply();
  var i,o;
  // 悬浮微粒
  ctx.fillStyle='rgba(190,230,255,0.30)';
  for(i=0;i<decor.dust.length;i++){
    o=decor.dust[i];
    var dx2=o.x+Math.sin(G.t*0.25+o.ph)*26, dy2=o.y+Math.cos(G.t*0.2+o.ph)*20-((G.t*o.v)%600);
    if(!vis(dx2,dy2,10))continue;
    ctx.fillRect(dx2,dy2,o.s,o.s);
  }
  // 岩石
  for(i=0;i<decor.rock.length;i++){
    o=decor.rock[i];
    if(!vis(o.x,o.y,260))continue;
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(o.s,o.s);
    ctx.beginPath(); ctx.moveTo(o.p[0][0],o.p[0][1]);
    for(var j=1;j<o.p.length;j++)ctx.lineTo(o.p[j][0],o.p[j][1]);
    ctx.closePath();
    var dep=clamp(o.y/W.h,0,1);
    ctx.fillStyle=mix('#33506a','#0a1826',dep*0.9);
    ctx.fill();
    ctx.strokeStyle='rgba(150,205,240,0.10)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(o.p[0][0],o.p[0][1]);
    for(var j2=1;j2<Math.ceil(o.p.length/2);j2++)ctx.lineTo(o.p[j2][0],o.p[j2][1]-6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 海草
  for(i=0;i<decor.kelp.length;i++){
    o=decor.kelp[i];
    if(!vis(o.x,o.y-o.h*0.5,o.h))continue;
    var sw2=Math.sin(G.t*1.1+o.ph)*0.28;
    ctx.strokeStyle=o.c; ctx.lineWidth=o.w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(o.x,o.y);
    ctx.quadraticCurveTo(o.x+sw2*o.h*0.5,o.y-o.h*0.55,o.x+sw2*o.h,o.y-o.h);
    ctx.stroke();
  }
  // 珊瑚
  for(i=0;i<decor.coral.length;i++){
    o=decor.coral[i];
    if(!vis(o.x,o.y,120))continue;
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(o.s,o.s);
    ctx.strokeStyle=o.c; ctx.lineWidth=7; ctx.lineCap='round';
    for(var b=0;b<5;b++){
      var a3=-PI/2+(b-2)*0.36+Math.sin(G.t*0.8+o.ph+b)*0.05;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(Math.cos(a3)*22,Math.sin(a3)*30,Math.cos(a3)*36,Math.sin(a3)*54);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 海床
  var sbY=W.h;
  if(sY(sbY)<VH+40){
    ctx.fillStyle='#1a2433';
    ctx.beginPath(); ctx.moveTo(cam.x-VW/cam.z,sbY);
    for(var xx=-1;xx<=1;xx+=0.05)ctx.lineTo(cam.x+xx*VW/cam.z,sbY-8+Math.sin((cam.x+xx*VW/cam.z)*0.004)*10);
    ctx.lineTo(cam.x+VW/cam.z,sbY+400); ctx.lineTo(cam.x-VW/cam.z,sbY+400);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(150,190,220,0.05)';
    ctx.fillRect(cam.x-VW/cam.z,sbY-10,VW*2/cam.z,7);
  }
}
/* ============================ 渲染：生物形状 ============================ */
function bodyPath(g,L,H,wag,ph,ex){
  var n=18,i,u,x,s,h; ex=ex||1;
  g.beginPath();
  for(i=0;i<=n;i++){
    u=i/n; x=-L*0.5+u*L;
    s=Math.sin(ph+u*2.4)*wag*Math.pow(1-u,1.7);
    h=H*(0.10+0.9*Math.sin(Math.pow(u,1.22)*PI))*(1-0.52*smooth((u-0.80)/0.20));
    if(i===0)g.moveTo(x,s-h); else g.lineTo(x,s-h);
  }
  for(i=n;i>=0;i--){
    u=i/n; x=-L*0.5+u*L;
    s=Math.sin(ph+u*2.4)*wag*Math.pow(1-u,1.7);
    h=H*(0.10+0.9*Math.sin(Math.pow(u,1.22)*PI))*(1-0.52*smooth((u-0.80)/0.20));
    g.lineTo(x,s+h*ex);
  }
  g.closePath();
}
function spineY(u,wag,ph){return Math.sin(ph+u*2.4)*wag*Math.pow(1-u,1.7);}
function tailFin(g,L,H,wag,ph,up,lo){
  var s0=Math.sin(ph)*wag,x0=-L*0.5;
  g.beginPath(); g.moveTo(x0+L*0.02,s0-H*0.12);
  g.quadraticCurveTo(x0-L*0.09,s0-H*up*0.65,x0-L*0.17,s0-H*up);
  g.quadraticCurveTo(x0-L*0.05,s0-H*0.3,x0-L*0.02,s0);
  g.quadraticCurveTo(x0-L*0.07,s0+H*lo*0.45,x0-L*0.13,s0+H*lo);
  g.quadraticCurveTo(x0-L*0.04,s0+H*0.25,x0+L*0.02,s0+H*0.12);
  g.closePath();
}
function eyeAt(g,x,y,r,dark){
  g.fillStyle=dark?'#0a0f16':'#ffffff';
  g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  if(!dark){g.fillStyle='#0a0f16';g.beginPath();g.arc(x+r*0.22,y,r*0.55,0,TAU);g.fill();}
  g.fillStyle='rgba(255,255,255,0.9)';
  g.beginPath(); g.arc(x+r*0.45,y-r*0.4,r*0.28,0,TAU); g.fill();
}

function drawEnt(e){
  var sp=e.sp,L=e.len,H=e.len*sp.h*0.5,g=ctx;
  var ph=e.t*(sp.ai==='drift'||sp.ai==='bob'?1.2:6.5)+e.ph;
  var wag=H*0.75;
  var dAng=e.ang;
  if(sp.sh==='sqd'||sp.sh==='bsqd'){var bse=Math.cos(e.ang)<0?PI:0;dAng=bse+clamp(angDiff(bse,e.ang),-0.55,0.55);}
  g.save(); g.translate(e.x,e.y); g.rotate(dAng);
  if(Math.cos(e.ang)<0)g.scale(1,-1);
  var grd=g.createLinearGradient(0,-H*1.1,0,H*1.1);
  grd.addColorStop(0,sp.c1); grd.addColorStop(0.62,sp.c1); grd.addColorStop(1,sp.c2);
  var sh=sp.sh;
  if(e.hit>0){g.globalAlpha=0.9;}
  if(sh==='fish'||sh==='marl'||sh==='shk'||sh==='orca'){
    var up=sh==='fish'?1.5:1.9, lo=sh==='fish'?1.0:0.85;
    g.fillStyle=sp.c1; tailFin(g,L,H,wag,ph,up,lo); g.fill();
    // 背鳍
    var du=sh==='fish'?0.42:0.46, dy=spineY(du,wag,ph);
    g.beginPath(); g.moveTo(-L*0.5+du*L,dy-H*0.85);
    g.quadraticCurveTo(-L*0.5+du*L-L*0.02,dy-H*(sh==='marl'?3.1:2.1),
                       -L*0.5+du*L-L*0.16,dy-H*(sh==='marl'?1.4:1.5));
    g.quadraticCurveTo(-L*0.5+du*L-L*0.1,dy-H*0.8,-L*0.5+du*L-L*0.14,dy-H*0.7);
    g.closePath(); g.fillStyle=sp.c1; g.fill();
    // 胸鳍
    g.fillStyle=sp.c1;
    g.beginPath(); g.moveTo(L*0.06,H*0.45);
    g.quadraticCurveTo(L*0.0,H*1.5,-L*0.16,H*1.55);
    g.quadraticCurveTo(-L*0.02,H*0.75,-L*0.02,H*0.45);
    g.closePath(); g.fill();
    g.fillStyle=grd; bodyPath(g,L,H,wag,ph,1); g.fill();
    g.strokeStyle='rgba(2,16,28,0.34)'; g.lineWidth=Math.max(1,L*0.012);
    bodyPath(g,L,H,wag,ph,1); g.stroke();
    if(sh==='marl'){g.strokeStyle=sp.c1;g.lineWidth=Math.max(1.4,H*0.16);
      g.beginPath();g.moveTo(L*0.48,0);g.lineTo(L*0.78,0);g.stroke();}
    if(sh==='orca'){
      g.fillStyle=sp.c2;
      g.beginPath();g.ellipse(L*0.24,H*0.42,L*0.2,H*0.42,0,0,TAU);g.fill();
      g.beginPath();g.ellipse(L*0.3,-H*0.34,L*0.08,H*0.2,0,0,TAU);g.fill();
      g.beginPath();g.ellipse(-L*0.12,H*0.5,L*0.16,H*0.3,0,0,TAU);g.fill();
    }
    if(sp.stripe){g.fillStyle='rgba(255,255,255,0.85)';
      for(var s3=0;s3<3;s3++){g.save();g.translate(L*(0.28-s3*0.2),0);g.rotate(0.16);
        g.fillRect(-L*0.035,-H*0.95,L*0.07,H*1.9);g.restore();}}
    if(sh==='shk'||sh==='orca'){
      g.fillStyle='rgba(10,14,20,0.75)';
      g.beginPath();g.moveTo(L*0.44,H*0.1);
      g.quadraticCurveTo(L*0.3,H*(e.mouth>0.2?0.85:0.5),L*0.14,H*0.34);
      g.quadraticCurveTo(L*0.3,H*0.36,L*0.44,H*0.1); g.closePath(); g.fill();
    }
    eyeAt(g,L*0.34,-H*0.28,Math.max(1.6,H*0.17),sh==='orca');
  }
  else if(sh==='crab'){
    var R=L*0.42;
    g.strokeStyle=sp.c1; g.lineWidth=Math.max(1.6,R*0.13); g.lineCap='round';
    for(var i=0;i<3;i++){
      var la=0.5+i*0.42, sw3=Math.sin(e.t*7+i)*0.22;
      g.beginPath();g.moveTo(-R*0.5,0);g.lineTo(-R*(1.0+i*0.1),R*(0.5+sw3));g.stroke();
      g.beginPath();g.moveTo(R*0.5,0);g.lineTo(R*(1.0+i*0.1),R*(0.5-sw3));g.stroke();
    }
    g.fillStyle=grd;
    g.beginPath(); g.ellipse(0,0,R,R*0.72,0,0,TAU); g.fill();
    g.fillStyle=sp.c1;
    for(var c2=-1;c2<=1;c2+=2){
      g.save(); g.translate(c2*R*0.95,-R*0.35); g.rotate(c2*Math.sin(e.t*5)*0.2);
      g.beginPath(); g.ellipse(0,0,R*0.42,R*0.3,c2*0.5,0,TAU); g.fill();
      g.restore();
    }
    eyeAt(g,-R*0.3,-R*0.5,R*0.16,true); eyeAt(g,R*0.3,-R*0.5,R*0.16,true);
  }
  else if(sh==='sqd'||sh==='bsqd'){
    var ML=L*0.55,MW=L*sp.h*0.55;
    g.strokeStyle=sp.c1; g.lineWidth=Math.max(2,MW*0.22); g.lineCap='round';
    var na=sh==='bsqd'?7:5;
    for(var t2=0;t2<na;t2++){
      var o2=(t2-(na-1)/2)*0.26;
      g.beginPath(); g.moveTo(-ML*0.35,o2*MW*0.5);
      g.quadraticCurveTo(-ML*0.9,o2*MW+Math.sin(e.t*4+t2)*MW*0.5,
                         -ML*1.6,o2*MW*1.6+Math.sin(e.t*4+t2*1.4)*MW*0.9);
      g.stroke();
    }
    g.fillStyle=grd;
    g.beginPath(); g.moveTo(ML*0.9,0);
    g.quadraticCurveTo(ML*0.2,-MW,-ML*0.4,-MW*0.55);
    g.quadraticCurveTo(-ML*0.6,0,-ML*0.4,MW*0.55);
    g.quadraticCurveTo(ML*0.2,MW,ML*0.9,0);
    g.closePath(); g.fill();
    g.fillStyle=sp.c2;
    g.beginPath();g.moveTo(ML*0.1,-MW*0.75);g.lineTo(ML*0.55,-MW*1.5);g.lineTo(ML*0.5,-MW*0.55);g.closePath();g.fill();
    g.beginPath();g.moveTo(ML*0.1,MW*0.75);g.lineTo(ML*0.55,MW*1.5);g.lineTo(ML*0.5,MW*0.55);g.closePath();g.fill();
    eyeAt(g,-ML*0.12,-MW*0.34,Math.max(2,MW*0.2),false);
  }
  else if(sh==='jelly'){
    var R2=L*0.45, pu=1+Math.sin(e.t*2.2+e.ph)*0.13;
    g.globalAlpha=0.62;
    g.strokeStyle=sp.c2; g.lineWidth=Math.max(1.4,R2*0.1); g.lineCap='round';
    for(var t3=0;t3<6;t3++){
      var xo=(t3-2.5)*R2*0.3;
      g.beginPath(); g.moveTo(xo,R2*0.4);
      g.quadraticCurveTo(xo+Math.sin(e.t*3+t3)*R2*0.5,R2*1.3,xo+Math.sin(e.t*2.4+t3)*R2*0.8,R2*2.2);
      g.stroke();
    }
    var jg=g.createRadialGradient(0,-R2*0.2,R2*0.1,0,0,R2*1.2);
    jg.addColorStop(0,sp.c2); jg.addColorStop(1,rgba(sp.c1,0.25));
    g.fillStyle=jg;
    g.beginPath(); g.ellipse(0,0,R2*pu,R2*0.85/pu,0,PI,TAU); g.fill();
    g.beginPath(); g.ellipse(0,0,R2*pu,R2*0.4,0,0,PI); g.fill();
    g.globalAlpha=1;
  }
  else if(sh==='puff'){
    var R3=L*0.34*(1+e.inf*0.55);
    g.fillStyle=sp.c1;
    var nsp=16;
    for(var s4=0;s4<nsp;s4++){
      var a4=s4/nsp*TAU, sl=R3*(0.18+e.inf*0.55);
      g.beginPath(); g.moveTo(Math.cos(a4)*R3*0.96,Math.sin(a4)*R3*0.96);
      g.lineTo(Math.cos(a4+0.1)*(R3+sl),Math.sin(a4+0.1)*(R3+sl));
      g.lineTo(Math.cos(a4+0.2)*R3*0.96,Math.sin(a4+0.2)*R3*0.96);
      g.closePath(); g.fill();
    }
    g.fillStyle=sp.c1;
    g.beginPath();g.moveTo(-R3*0.8,0);g.lineTo(-R3*1.6,-R3*0.5);g.lineTo(-R3*1.5,R3*0.5);g.closePath();g.fill();
    var pg=g.createRadialGradient(-R3*0.2,-R3*0.3,R3*0.15,0,0,R3*1.1);
    pg.addColorStop(0,sp.c2); pg.addColorStop(1,sp.c1);
    g.fillStyle=pg; g.beginPath(); g.arc(0,0,R3,0,TAU); g.fill();
    eyeAt(g,R3*0.42,-R3*0.28,R3*0.2,false);
  }
  else if(sh==='bird'){
    var BL=L*0.5,fl=Math.sin(e.t*11)*0.8;
    g.fillStyle=sp.c2;
    for(var wg2=-1;wg2<=1;wg2+=2){

    g.beginPath(); g.arc(BL*0.62,-BL*0.14,BL*0.26,0,TAU); g.fill();
    g.fillStyle='#ffb03a';

    eyeAt(g,BL*0.7,-BL*0.22,BL*0.08,true);
  }
  else if(sh==='turt'){
    var TR=L*0.4;
    g.fillStyle=sp.c2;
    for(var f2=0;f2<4;f2++){
      var fx=(f2<2?TR*0.55:-TR*0.6),fy=(f2%2?TR*0.55:-TR*0.55);

    g.fillStyle='#4a5560';
    g.beginPath(); g.ellipse(-DL*0.35,-DL*0.34,DL*0.3,DL*0.16,0.3,0,TAU); g.fill();

    g.fillStyle='rgba(150,225,255,0.85)';
    g.beginPath(); g.arc(DL*0.68,-DL*0.12,DL*0.2,0,TAU); g.fill();
    g.strokeStyle=sp.c1; g.lineWidth=Math.max(1.5,DL*0.11); g.lineCap='round';
    g.beginPath(); g.moveTo(DL*0.2,DL*0.1);
    g.quadraticCurveTo(DL*0.6,DL*0.4+Math.sin(e.t*6)*DL*0.2,DL*0.9,DL*0.25); g.stroke();

  else if(sh==='eel'){

    g.strokeStyle=sp.c1; g.lineWidth=EH*2; g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    for(var q=0;q<=12;q++){
      var u3=q/12,xq=-EL*0.5+u3*EL,yq=Math.sin(e.t*7-u3*6.4)*EH*2.4*(0.35+u3*0.65);

    g.stroke();

    if(e.zap){
      g.strokeStyle='rgba(220,255,160,'+(0.4+Math.random()*0.5)+')'; g.lineWidth=Math.max(1,EH*0.4);
      for(var z2=0;z2<3;z2++){
        g.beginPath(); g.moveTo(0,0);
        var za=rnd(TAU),zr=rnd(EL*0.4,EL*0.9);

  else if(sh==='whale'){

  else if(sh==='mine'){
    var MR=L*0.4;

  }
  else if(sh==='coin'||sh==='heal'||sh==='orb'){
    var PR=L*0.5,bob=Math.sin(e.t*2.4+e.ph);
    g.globalCompositeOperation='lighter';
    var og=g.createRadialGradient(0,0,PR*0.2,0,0,PR*2.4);
    og.addColorStop(0,rgba(sp.c1,0.55)); og.addColorStop(1,rgba(sp.c1,0));
    g.fillStyle=og; g.beginPath(); g.arc(0,0,PR*2.4,0,TAU); g.fill();
    g.globalCompositeOperation='source-over';
    if(sh==='coin'){
      g.save(); g.scale(Math.abs(Math.cos(e.t*2.2))*0.85+0.15,1);
      g.fillStyle=sp.c1; g.beginPath(); g.arc(0,0,PR,0,TAU); g.fill();
      g.fillStyle=sp.c2; g.beginPath(); g.arc(0,0,PR*0.66,0,TAU); g.fill();
      g.restore();
    }else if(sh==='heal'){
      g.fillStyle=sp.c1;
      g.save(); g.rotate(bob*0.2);
      g.fillRect(-PR*0.24,-PR*0.8,PR*0.48,PR*1.6);
      g.fillRect(-PR*0.8,-PR*0.24,PR*1.6,PR*0.48);
      g.restore();
      g.fillStyle=sp.c2; g.beginPath(); g.arc(0,0,PR*0.2,0,TAU); g.fill();
    }else{

function drawShark(){
  var g=ctx,st=stg(),L=P.len,H=L*0.29,sk=SKIN[P.stage],i;
  var wag=H*(0.5+Math.min(P.vel,760)/760*0.6);
  var ph=P.swim;
  if(P.inv>0&&Math.floor(P.inv*14)%2===0&&G.gold<=0)return;
  g.save(); g.translate(P.x,P.y); g.rotate(P.ang);
  if(Math.cos(P.ang)<-0.05)P.flip=true; else if(Math.cos(P.ang)>0.05)P.flip=false;
  if(P.flip)g.scale(1,-1);
  {
    g.globalCompositeOperation='lighter';
    var glg=g.createRadialGradient(0,0,L*0.1,0,0,L*0.85);
    var gc=G.gold>0?'#ffcf4d':(P.stage>=6?'#4fe0ff':'#8ad8ff');
    var ga=G.gold>0?0.34:(P.stage>=6?0.30:0.15);
    glg.addColorStop(0,rgba(gc,ga)); glg.addColorStop(1,rgba(gc,0));
    g.fillStyle=glg; g.beginPath(); g.arc(0,0,L*0.85,0,TAU); g.fill();
    g.globalCompositeOperation='source-over';
  }
  // 尾
  g.fillStyle=sk.f; tailFin(g,L,H,wag,ph,2.05,1.15); g.fill();
  // 背鳍
  var du=0.44,dy=spineY(du,wag,ph),dx3=-L*0.5+du*L;
  g.beginPath(); g.moveTo(dx3+L*0.06,dy-H*0.88);
  g.quadraticCurveTo(dx3-L*0.01,dy-H*2.5,dx3-L*0.15,dy-H*1.85);
  g.quadraticCurveTo(dx3-L*0.09,dy-H*0.9,dx3-L*0.13,dy-H*0.82);
  g.closePath(); g.fill();
  // 小背鳍
  g.beginPath(); g.moveTo(-L*0.3,spineY(0.2,wag,ph)-H*0.5);
  g.lineTo(-L*0.38,spineY(0.12,wag,ph)-H*1.0); g.lineTo(-L*0.4,spineY(0.1,wag,ph)-H*0.42);
  g.closePath(); g.fill();
  // 胸鳍
  g.beginPath(); g.moveTo(L*0.1,H*0.5);
  g.quadraticCurveTo(L*0.02,H*1.9,-L*0.22,H*1.9);
  g.quadraticCurveTo(-L*0.03,H*0.9,-L*0.02,H*0.5);
  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-L*0.2,H*0.45);
  g.quadraticCurveTo(-L*0.28,H*1.05,-L*0.36,H*0.95);
  g.quadraticCurveTo(-L*0.3,H*0.6,-L*0.3,H*0.42);
  g.closePath(); g.fill();
  // 身体
  var bg=g.createLinearGradient(0,-H*1.15,0,H*1.15);
  bg.addColorStop(0,mix(sk.a,'#000000',0.18)); bg.addColorStop(0.5,sk.a);
  bg.addColorStop(0.72,mix(sk.a,sk.b,0.55)); bg.addColorStop(1,sk.b);
  g.fillStyle=bg; bodyPath(g,L,H,wag,ph,1.05); g.fill();
  g.strokeStyle=G.gold>0?'rgba(255,214,90,0.9)':'rgba(2,10,20,0.72)';
  g.lineWidth=Math.max(1.8,L*0.021); bodyPath(g,L,H,wag,ph,1.05); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.20)'; g.lineWidth=Math.max(1,L*0.008);
  g.beginPath();
  for(var ri=2;ri<=13;ri++){var ru=ri/18,rx=-L*0.5+ru*L;
    var rh=H*(0.10+0.9*Math.sin(Math.pow(ru,1.22)*PI))*(1-0.52*smooth((ru-0.80)/0.20));
    var rs=spineY(ru,wag,ph);
    if(ri===2)g.moveTo(rx,rs-rh*0.92);else g.lineTo(rx,rs-rh*0.92);}
  g.stroke();
  if(P.hitT>0){g.fillStyle='rgba(255,90,110,0.5)';bodyPath(g,L,H,wag,ph,1.05);g.fill();}
  // 花纹
  if(P.stage===3){
    g.fillStyle='rgba(40,45,30,0.45)';
    for(i=0;i<6;i++){var sx4=L*(0.28-i*0.115);
      g.save();g.translate(sx4,spineY((sx4+L*0.5)/L,wag,ph));g.rotate(0.1);
      g.fillRect(-L*0.018,-H*0.95,L*0.036,H*1.1);g.restore();}
  }
  if(P.stage===6){
    g.fillStyle='rgba(120,255,240,0.5)';
    for(i=0;i<7;i++){var gx=L*(0.3-i*0.1),gy=spineY((gx+L*0.5)/L,wag,ph);
      g.beginPath();g.arc(gx,gy+H*0.25,Math.max(1.4,H*0.075),0,TAU);g.fill();}
    g.fillStyle=sk.f;
    for(i=0;i<5;i++){var kx=-L*0.05-i*L*0.07,ky=spineY((kx+L*0.5)/L,wag,ph);
      g.beginPath();g.moveTo(kx,ky-H*0.75);g.lineTo(kx-L*0.02,ky-H*1.25);g.lineTo(kx+L*0.03,ky-H*0.7);
      g.closePath();g.fill();}

  if(P.stage===2){

  // 鳃
  g.strokeStyle='rgba(20,30,40,0.35)'; g.lineWidth=Math.max(1,H*0.07);
  for(i=0;i<5;i++){
    var gx2=L*0.16-i*L*0.038;
    g.beginPath(); g.moveTo(gx2,-H*0.42); g.quadraticCurveTo(gx2-H*0.12,0,gx2,H*0.42); g.stroke();
  }
  // 嘴
  var mo=P.mouth;
  g.save(); g.translate(L*0.16,H*0.2); g.rotate(mo*0.5);
  g.fillStyle='#2c0a12';
  g.beginPath(); g.moveTo(0,-H*0.06);
  g.lineTo(L*0.34,-H*0.22); g.lineTo(L*0.33,H*0.08);
  g.quadraticCurveTo(L*0.16,H*0.16,0,-H*0.06); g.closePath(); g.fill();
  g.fillStyle='#ffffff';
  for(i=0;i<6;i++){
    var tx2=L*0.05+i*L*0.046, th=H*0.105;
    g.beginPath(); g.moveTo(tx2,-H*0.09-i*H*0.012);

    g.closePath(); g.fill();
  }
  g.restore();
  g.fillStyle='#ffffff';
  for(i=0;i<5;i++){
    var ux=L*0.21+i*L*0.045;
    g.beginPath(); g.moveTo(ux,H*0.15); g.lineTo(ux+L*0.015,H*0.15); g.lineTo(ux+L*0.0075,H*0.15-H*0.10);
    g.closePath(); g.fill();
  }
  g.restore();
}

    }

/* ============================ 主循环 ============================ */
var last=0,acc=0,fpsA=60;
function frame(ts){
  requestAnimationFrame(frame);
  if(typeof ts!=='number')ts=(window.performance&&window.performance.now)?window.performance.now():Date.now();
  if(!last)last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(!(dt>0))dt=0.0001;
  if(dt>0.05)dt=0.05;
  fpsA=fpsA+((1/Math.max(dt,0.0001))-fpsA)*0.06;
  if(G.state==='play')update(dt);
  else if(G.state==='menu'){
    IN.auto=true; P.food=100; P.hp=P.mhp; P.xp=0;
    update(dt);
  }else{ G.t+=dt; updateParts(dt); }
  updateCam(dt);
  render();
  updateHUD(dt);
}

function ambient(){
