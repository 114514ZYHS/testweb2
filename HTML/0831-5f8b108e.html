<!DOCTYPE html>
<html lang="zh-CN">

<title>糖豆人 · 终极淘汰赛（网页版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0b26;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;
 font-family:"Baloo 2",ui-rounded,"Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#c{position:fixed;inset:0;display:block}
.layer{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.hidden{display:none!important}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:100%}
/* ---------- buttons ---------- */
.btn{pointer-events:auto;cursor:pointer;display:inline-block;padding:13px 40px;margin:8px 7px;border:0;border-radius:999px;
 font-family:inherit;font-size:21px;font-weight:900;letter-spacing:3px;color:#6b3400;
 background:linear-gradient(#ffe27a,#ffb302);box-shadow:0 8px 0 #d17f00,0 16px 26px rgba(0,0,0,.4);
 transition:transform .07s,box-shadow .07s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #d17f00,0 6px 12px rgba(0,0,0,.35)}
.btn.pink{color:#fff;background:linear-gradient(#ff9ccd,#ff3f9a);box-shadow:0 8px 0 #bf1c68,0 16px 26px rgba(0,0,0,.4)}
.btn.pink:active{box-shadow:0 2px 0 #bf1c68,0 6px 12px rgba(0,0,0,.35)}
.btn.blue{color:#fff;background:linear-gradient(#8fe0ff,#25a6f0);box-shadow:0 8px 0 #0f6ea8,0 16px 26px rgba(0,0,0,.4)}
.btn.blue:active{box-shadow:0 2px 0 #0f6ea8,0 6px 12px rgba(0,0,0,.35)}
.btn.sm{font-size:16px;padding:9px 24px;letter-spacing:1px}
/* ---------- title screen ---------- */
#title{background:radial-gradient(120% 90% at 50% 10%,rgba(143,107,255,.42) 0%,rgba(70,44,150,.62) 45%,rgba(24,14,60,.86) 100%)}
#title:after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 12% 78%,rgba(255,255,255,.13) 0 60px,transparent 61px),
 radial-gradient(circle at 86% 70%,rgba(255,255,255,.1) 0 90px,transparent 91px),
 radial-gradient(circle at 68% 18%,rgba(255,255,255,.08) 0 130px,transparent 131px)}
.logo{position:relative;z-index:2;font-size:clamp(40px,8.4vw,110px);font-weight:900;letter-spacing:4px;line-height:.98;
 color:#fff;-webkit-text-stroke:min(1.6vw,9px) #3a1d7a;paint-order:stroke fill;
 text-shadow:0 10px 0 #3a1d7a,0 18px 36px rgba(0,0,0,.5);animation:bob 2.6s ease-in-out infinite}
.logo em{display:block;font-style:normal;font-size:.42em;letter-spacing:12px;color:#ffe27a;-webkit-text-stroke:min(.9vw,5px) #3a1d7a;margin-top:6px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(1.2deg)}}
.sub{position:relative;z-index:2;margin:18px auto 6px;font-size:clamp(13px,1.7vw,18px);font-weight:700;letter-spacing:2px;color:#ffd9ee;opacity:.95}
.keys{position:relative;z-index:2;margin:18px auto 0;max-width:640px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px}
.keys span{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.28);border-radius:14px;padding:7px 13px;font-size:14px;font-weight:800;letter-spacing:1px}
.keys b{color:#ffe27a}
/* ---------- round card ---------- */
#card{background:rgba(24,12,58,.55);backdrop-filter:blur(7px)}
.cardBox{position:relative;display:inline-block;padding:26px 60px 30px;border-radius:34px;
 background:linear-gradient(#fff6fb,#ffd9ec);color:#57155f;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 -8px 0 rgba(0,0,0,.08);
 border:7px solid #fff;animation:cardIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardIn{0%{transform:scale(.4) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.cardKind{font-size:15px;font-weight:900;letter-spacing:7px;color:#ff4fa3}
.cardName{font-size:clamp(30px,5.4vw,60px);font-weight:900;letter-spacing:3px;margin:2px 0 6px;color:#3c1170;
 -webkit-text-stroke:2px #fff;paint-order:stroke fill}
.cardDesc{font-size:16px;font-weight:700;letter-spacing:1px;color:#8a3a86;max-width:460px;margin:0 auto}
.cardTag{display:inline-block;margin-top:14px;padding:8px 22px;border-radius:999px;background:#ffd23f;color:#7a4600;font-weight:900;letter-spacing:2px;font-size:16px;box-shadow:0 5px 0 #d79b00}
#count{margin-top:26px;font-size:clamp(70px,15vw,180px);font-weight:900;color:#fff;-webkit-text-stroke:min(1.2vw,8px) #ff3f9a;paint-order:stroke fill;
 text-shadow:0 12px 30px rgba(0,0,0,.5);line-height:1}
.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}35%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
/* ---------- HUD ---------- */
#hud{z-index:4}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;gap:10px}
.pill{background:rgba(22,12,48,.55);border:3px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 18px;
 font-weight:900;font-size:15px;letter-spacing:2px;backdrop-filter:blur(6px);text-shadow:0 2px 3px rgba(0,0,0,.5);white-space:nowrap}
.pill i{font-style:normal;color:#ffe27a}
#qual{background:rgba(22,12,48,.55);border:3px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 18px 10px;backdrop-filter:blur(6px);min-width:230px;text-align:center}
#qualTop{display:flex;justify-content:space-between;font-size:13px;font-weight:900;letter-spacing:2px;opacity:.9}
#qualBar{margin-top:6px;height:14px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid rgba(255,255,255,.18)}
#qualFill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ffe27a,#ff9d3f);transition:width .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 12px #ffb02faa}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px;gap:10px}

/* ---------- banner / stamps ---------- */
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(42px,10vw,124px);font-weight:900;letter-spacing:6px;
 color:#fff;-webkit-text-stroke:min(1.1vw,8px) #2b1264;paint-order:stroke fill;text-shadow:0 14px 34px rgba(0,0,0,.55)}

@keyframes stampIn{0%{transform:scale(3.4) rotate(-16deg);opacity:0}55%{transform:scale(.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
/* ---------- results ---------- */

.rTitle{font-size:clamp(30px,6vw,68px);font-weight:900;letter-spacing:5px;color:#ffe27a;-webkit-text-stroke:min(.8vw,6px) #3a1d7a;paint-order:stroke fill;margin-bottom:6px}

 border-radius:16px;padding:8px 14px;margin:7px 0;font-weight:800;letter-spacing:1px;font-size:15px;animation:slide .35s ease-out both}

.rRow .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);font-size:14px}
.rRow .dot{width:20px;height:20px;border-radius:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.rRow .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rRow .tag{font-size:13px;padding:4px 12px;border-radius:999px;background:#31d17a;color:#04381c}
.rRow .tag.no{background:#ff5d7d;color:#480715}
/* ---------- misc ---------- */
#sound{position:absolute;top:14px;right:16px;pointer-events:auto;cursor:pointer;width:42px;height:42px;border-radius:50%;
 display:grid;place-items:center;font-size:19px;background:rgba(22,12,48,.55);border:3px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
#fps{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.35;letter-spacing:1px}
/* ---------- touch ---------- */
#touch{z-index:6}
#joy{position:absolute;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);
 border:4px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff,#ffb9dd);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.tbtn{position:absolute;right:26px;width:84px;height:84px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;
 font-size:15px;font-weight:900;letter-spacing:1px;color:#5b2b00;background:linear-gradient(#ffe27a,#ffb302);box-shadow:0 7px 0 #d17f00}
#bJump{bottom:104px}
#bDive{bottom:16px;right:124px;color:#fff;background:linear-gradient(#8fe0ff,#25a6f0);box-shadow:0 7px 0 #0f6ea8;width:74px;height:74px;font-size:14px}
.tbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #d17f00}
</style>

<body>
<canvas id="c"></canvas>

<!-- HUD -->

<!-- 标题 -->

    <div><button class="btn" id="btnPlay">开始游戏</button><button class="btn blue sm" id="btnSolo">自由练习</button></div>
    <div class="keys">
      <span><b>WASD</b> / 方向键 移动</span><span><b>空格</b> 跳跃</span><span><b>Shift</b> 飞扑</span>
      <span><b>鼠标拖动 / Q E</b> 转视角</span><span><b>R</b> 重来</span><span><b>M</b> 静音</span>
    </div>
  </div>
  <div id="sound">🔊</div>
</div>
<div class="layer" id="fpsLayer"><div id="fps"></div></div>
<script>
'use strict';
/* ============================================================================
   糖豆人 · 终极淘汰赛  —  单文件网页版
   零依赖：自研透视投影 + 画家算法 3D 渲染器 / 刚体近似物理 / Bot AI
   ========================================================================= */

/* ---------------------------------------------------------------- 基础数学 */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = n => (Math.random() * n) | 0;
const pick  = a => a[(Math.random() * a.length) | 0];
const sign  = v => v < 0 ? -1 : 1;
function angNorm(a){ a %= TAU; if (a > PI) a -= TAU; if (a < -PI) a += TAU; return a; }
function angLerp(a, b, t){ return a + angNorm(b - a) * t; }
function approach(cur, tgt, step){ const d = tgt - cur; return Math.abs(d) <= step ? tgt : cur + sign(d) * step; }
function dist2(ax, az, bx, bz){ const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; }
function hex2rgb(h){ return [(h >> 16) & 255, (h >> 8) & 255, h & 255]; }
function shade(c, k){
  const r = c[0] * k | 0, g = c[1] * k | 0, b = c[2] * k | 0;
  return 'rgb(' + (r > 255 ? 255 : r) + ',' + (g > 255 ? 255 : g) + ',' + (b > 255 ? 255 : b) + ')';
}
function mixHex(a, b, t){
  const A = hex2rgb(a), B = hex2rgb(b);
  return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
}

/* ---------------------------------------------------------------- 画布相机 */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });
let W = 960, H = 540, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 960; H = window.innerHeight || 540;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const NEAR = 0.25, FAR = 210;
const cam = { x: 0, y: 9, z: -14, yaw: 0, pitch: -0.3, fov: 1.02, f: 600, sy: 0, cy: 1, sp: 0, cp: 1, shake: 0 };
function camPrep(){
  cam.sy = Math.sin(cam.yaw); cam.cy = Math.cos(cam.yaw);
  cam.sp = Math.sin(cam.pitch); cam.cp = Math.cos(cam.pitch);
  cam.f  = (H * 0.5) / Math.tan(cam.fov * 0.5);
}
/* 世界 -> 相机空间（Y 上，Z 前） */
function toCam(px, py, pz, o){
  const dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;
  const x = dx * cam.cy - dz * cam.sy;
  const z = dx * cam.sy + dz * cam.cy;
  o.x = x; o.y = dy * cam.cp - z * cam.sp; o.z = dy * cam.sp + z * cam.cp;
  return o;
}
const _t1 = { x: 0, y: 0, z: 0 }, _t2 = { x: 0, y: 0, z: 0 };
function camDepth(px, py, pz){ toCam(px, py, pz, _t1); return Math.sqrt(_t1.x * _t1.x + _t1.y * _t1.y + _t1.z * _t1.z); }

/* ---------------------------------------------------------------- 绘制队列 */
let Q = [], qn = 0;
function qpush(d, f){
  if (qn < Q.length){ const it = Q[qn]; it.d = d; it.f = f; } else Q.push({ d: d, f: f });
  qn++;
}
function qflush(){
  game.faces = qn;
  const list = Q.slice(0, qn);
  list.sort((a, b) => b.d - a.d);
  for (let i = 0; i < list.length; i++) list[i].f();
  qn = 0;
}

const _sx = new Float64Array(16), _sy = new Float64Array(16);
/* 相机空间多边形：近裁剪 + 投影 + 填充 */
function polyCam(v, fill, stroke, lw){
  let out = v, n = v.length, needClip = false;
  for (let i = 0; i < n; i++) if (v[i].z < NEAR){ needClip = true; break; }
  if (needClip){
    out = [];
    for (let i = 0; i < n; i++){
      const a = v[i], b = v[(i + 1) % n], ai = a.z >= NEAR, bi = b.z >= NEAR;
      if (ai) out.push(a);
      if (ai !== bi){
        const t = (NEAR - a.z) / (b.z - a.z);
        out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: NEAR });
      }
    }
    if (out.length < 3) return;
  }
  const n2 = out.length, px = _sx, py = _sy;
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (let i = 0; i < n2 && i < 16; i++){
    const p = out[i], k = cam.f / p.z;
    const X = W * 0.5 + p.x * k, Y = H * 0.5 - p.y * k;
    px[i] = X; py[i] = Y;
    if (X < minx) minx = X; if (X > maxx) maxx = X;
    if (Y < miny) miny = Y; if (Y > maxy) maxy = Y;
  }
  if (maxx < -2 || minx > W + 2 || maxy < -2 || miny > H + 2) return;   // 屏幕外
  ctx.beginPath();
  for (let i = 0; i < n2 && i < 16; i++){ if (i) ctx.lineTo(px[i], py[i]); else ctx.moveTo(px[i], py[i]); }
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.lineWidth = lw || 1; ctx.strokeStyle = stroke; ctx.stroke(); }
}

/* ---------------------------------------------------------------- 光照/立方体 */
const LX = 0.36, LY = 0.87, LZ = -0.33;
const SX = [-1, 1, 1, -1, -1, 1, 1, -1], SY = [-1, -1, 1, 1, -1, -1, 1, 1], SZ = [-1, -1, -1, -1, 1, 1, 1, 1];
const FACES = [
  [0, 3, 2, 1,  0, 0, -1], [4, 5, 6, 7,  0, 0, 1],
  [0, 4, 7, 3, -1, 0,  0], [1, 2, 6, 5,  1, 0, 0],
  [3, 7, 6, 2,  0, 1,  0], [0, 1, 5, 4,  0, -1, 0]
];
const _wv = []; for (let i = 0; i < 8; i++) _wv.push({ x: 0, y: 0, z: 0 });
const _cv = []; for (let i = 0; i < 8; i++) _cv.push({ x: 0, y: 0, z: 0 });

/* 绘制盒体（可绕 Y 旋转）。col:[r,g,b]  top:[r,g,b] 可选顶面色 */
function pushBox(x, y, z, hx, hy, hz, ry, col, top, alpha, noTop){
  const cr = Math.cos(ry || 0), sr = Math.sin(ry || 0);
  for (let i = 0; i < 8; i++){
    const lx = SX[i] * hx, ly = SY[i] * hy, lz = SZ[i] * hz;
    const wx = x + lx * cr - lz * sr, wz = z + lx * sr + lz * cr, wy = y + ly;
    _wv[i].x = wx; _wv[i].y = wy; _wv[i].z = wz;
    toCam(wx, wy, wz, _cv[i]);
  }
  for (let fi = 0; fi < 6; fi++){
    const F = FACES[fi];
    const nx0 = F[4], ny = F[5], nz0 = F[6];
    const nx = nx0 * cr - nz0 * sr, nz = nx0 * sr + nz0 * cr;
    const a = _wv[F[0]], b = _wv[F[1]], c2 = _wv[F[2]], d = _wv[F[3]];
    const cx = (a.x + b.x + c2.x + d.x) * .25, cy = (a.y + b.y + c2.y + d.y) * .25, cz = (a.z + b.z + c2.z + d.z) * .25;
    if (nx * (cx - cam.x) + ny * (cy - cam.y) + nz * (cz - cam.z) > 0) continue; // 背面剔除
    const ca = _cv[F[0]], cb = _cv[F[1]], cc = _cv[F[2]], cd = _cv[F[3]];
    if (ca.z < NEAR && cb.z < NEAR && cc.z < NEAR && cd.z < NEAR) continue;
    if (noTop && ny > 0.5) continue;
    const nl = nx * LX + ny * LY + nz * LZ;
    let k = 0.60 + 0.40 * (nl > 0 ? nl : 0);
    if (ny < -0.5) k = 0.42;
    const base = (ny > 0.5 && top) ? top : col;
    const fill = shade(base, k);
    const vs = [{ x: ca.x, y: ca.y, z: ca.z }, { x: cb.x, y: cb.y, z: cb.z }, { x: cc.x, y: cc.y, z: cc.z }, { x: cd.x, y: cd.y, z: cd.z }];
    const dep = Math.sqrt((cx - cam.x) * (cx - cam.x) + (cy - cam.y) * (cy - cam.y) + (cz - cam.z) * (cz - cam.z));
    qpush(dep, () => {
      if (alpha != null){ ctx.globalAlpha = alpha; polyCam(vs, fill, fill, 1); ctx.globalAlpha = 1; }
      else polyCam(vs, fill, fill, 1);
    });
  }
}

/* 绘制柱体 / 棱柱 */
function pushCyl(x, y, z, r, h, sides, col, top, ry){
  ry = ry || 0;
  const pts = [], cpt = [];
  for (let i = 0; i < sides; i++){
    const a = ry + i / sides * TAU;
    pts.push({ x: x + Math.cos(a) * r, z: z + Math.sin(a) * r });
  }
  for (let i = 0; i < sides; i++){
    const p = pts[i], q = pts[(i + 1) % sides];
    const mx = (p.x + q.x) * .5, mz = (p.z + q.z) * .5;
    let nx = mx - x, nz = mz - z; const l = Math.hypot(nx, nz) || 1; nx /= l; nz /= l;
    if (nx * (mx - cam.x) + nz * (mz - cam.z) > 0) continue;
    const nl = nx * LX + nz * LZ, k = 0.58 + 0.36 * (nl > 0 ? nl : 0);
    const fill = shade(col, k);
    const vs = [toCam(p.x, y, p.z, {}), toCam(q.x, y, q.z, {}), toCam(q.x, y + h, q.z, {}), toCam(p.x, y + h, p.z, {})];
    const dep = camDepth(mx, y + h * .5, mz);
    qpush(dep, () => polyCam(vs, fill, fill, 1));
  }
  // 顶盖
  if (cam.y > y + h - 0.2){
    const vs = pts.map(p => toCam(p.x, y + h, p.z, {}));
    const fill = shade(top || col, 1.0);
    qpush(camDepth(x, y + h, z), () => polyCam(vs, fill, fill, 1));
  }
  if (cam.y < y + 0.2){
    const vs = pts.map(p => toCam(p.x, y, p.z, {})).reverse();
    const fill = shade(col, .42);
    qpush(camDepth(x, y, z), () => polyCam(vs, fill, fill, 1));
  }
}

/* 朝上的平面四边形（地砖用，省下 2/3 的面） */
function pushQuad(x, y, z, hx, hz, col){
  const a = toCam(x - hx, y, z - hz, {}), b = toCam(x + hx, y, z - hz, {});
  const c = toCam(x + hx, y, z + hz, {}), d = toCam(x - hx, y, z + hz, {});
  if (a.z < NEAR && b.z < NEAR && c.z < NEAR && d.z < NEAR) return;
  const fill = shade(col, .95), vs = [a, b, c, d];
  // 深度取"最远角 + 偏置"：地面永远先画，不会盖住站在上面的糖豆人
  let dep = 0;
  for (let i = 0; i < 4; i++){ const p = vs[i], q = p.x * p.x + p.y * p.y + p.z * p.z; if (q > dep) dep = q; }
  qpush(Math.sqrt(dep) + 1.5, () => polyCam(vs, fill, fill, 1));
}
/* 球（贴片渲染，带高光） */
function pushSphere(x, y, z, r, col, glow){
  toCam(x, y, z, _t1);
  if (_t1.z < NEAR + r) return;
  const k = cam.f / _t1.z, sx = W * .5 + _t1.x * k, sy = H * .5 - _t1.y * k, sr = r * k;
  if (sx < -sr * 2 || sx > W + sr * 2 || sy < -sr * 2 || sy > H + sr * 2) return;
  const dep = Math.sqrt(_t1.x * _t1.x + _t1.y * _t1.y + _t1.z * _t1.z);
  const c0 = shade(col, 1.25), c1 = shade(col, 0.95), c2 = shade(col, 0.5);
  qpush(dep, () => {
    const g = ctx.createRadialGradient(sx - sr * .35, sy - sr * .4, sr * .1, sx, sy, sr);
    g.addColorStop(0, c0); g.addColorStop(.55, c1); g.addColorStop(1, c2);
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fillStyle = g; ctx.fill();
    if (glow){ ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke(); }
  });
}

/* 屏幕空间自定义绘制（角色/粒子/文字），d = 深度 */
function pushCustom(x, y, z, fn){
  toCam(x, y, z, _t1);
  if (_t1.z < NEAR) return;
  const dep = Math.sqrt(_t1.x * _t1.x + _t1.y * _t1.y + _t1.z * _t1.z);
  const k = cam.f / _t1.z;
  const sx = W * .5 + _t1.x * k, sy = H * .5 - _t1.y * k;
  if (sx < -400 || sx > W + 400 || sy < -400 || sy > H + 400) return;
  qpush(dep, () => fn(sx, sy, k, dep));
}

/* 地面影子 */
function pushShadow(x, y, z, r, a){
  toCam(x, y + 0.02, z, _t1);
  if (_t1.z < NEAR) return;
  const k = cam.f / _t1.z, sx = W * .5 + _t1.x * k, sy = H * .5 - _t1.y * k, sr = r * k;
  const dep = Math.sqrt(_t1.x * _t1.x + _t1.y * _t1.y + _t1.z * _t1.z) - 0.05;
  qpush(dep, () => {
    ctx.save(); ctx.globalAlpha = a;
    ctx.beginPath(); ctx.ellipse(sx, sy, sr, sr * 0.42, 0, 0, TAU);
    ctx.fillStyle = '#241a3d'; ctx.fill(); ctx.restore();
  });
}

/* ---------------------------------------------------------------- 天空盒 */
const CLOUDS = [];
for (let i = 0; i < 26; i++){
  const a = Math.random() * TAU, d = rand(160, 320);
  CLOUDS.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, y: rand(38, 96), s: rand(14, 34), p: Math.random() * TAU });
}
let skyTop = '#63c8ff', skyBot = '#ffd8ef', sunX = 0.72, sunY = 0.16;
function drawSky(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, skyTop); g.addColorStop(.62, mixCss(skyTop, skyBot, .7)); g.addColorStop(1, skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 太阳
  const px = W * sunX + Math.sin(cam.yaw) * 0, py = H * sunY - cam.pitch * H * 0.55;
  const sg = ctx.createRadialGradient(px, py, 6, px, py, H * .42);
  sg.addColorStop(0, 'rgba(255,255,235,.95)'); sg.addColorStop(.12, 'rgba(255,246,190,.55)'); sg.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(px, py, H * .42, 0, TAU); ctx.fill();
  // 云（真 3D，最远处自动排序在最后）
  for (let i = 0; i < CLOUDS.length; i++){
    const c = CLOUDS[i];
    const wx = cam.x + c.x, wz = cam.z + c.z;
    toCam(wx, c.y + Math.sin(t * .2 + c.p) * 2, wz, _t1);
    if (_t1.z < 1) continue;
    const k = cam.f / _t1.z, sx = W * .5 + _t1.x * k, sy = H * .5 - _t1.y * k, sr = c.s * k;
    if (sx < -sr * 3 || sx > W + sr * 3 || sy > H + sr) continue;
    ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, TAU);
    ctx.arc(sx - sr * 1.1, sy + sr * .28, sr * .68, 0, TAU);
    ctx.arc(sx + sr * 1.05, sy + sr * .3, sr * .6, 0, TAU);
    ctx.arc(sx + sr * .35, sy - sr * .5, sr * .6, 0, TAU);
    ctx.fill(); ctx.restore();
  }
}
function mixCss(a, b, t){
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return 'rgb(' + Math.round(lerp(pa[0], pb[0], t)) + ',' + Math.round(lerp(pa[1], pb[1], t)) + ',' + Math.round(lerp(pa[2], pb[2], t)) + ')';
}

   世界 / 关卡
   ========================================================================= */
const world = {
  objs: [], cols: [], dyn: [], slime: [], hexLayers: [], fruits: [], doors: [],
  spawn: { x: 0, z: 0, y: 0.2, spread: 8 },
  checkpoints: [], waypoints: [], finishZ: 1e9, killY: -30, mode: 'race',
  goalCol: null, sunAngle: 0
};
function resetWorld(){
  world.objs = []; world.cols = []; world.dyn = []; world.slime = []; world.hexLayers = [];
  world.fruits = []; world.doors = []; world.checkpoints = []; world.waypoints = [];
  world.finishZ = 1e9; world.killY = -30;
}
/* --- 建造工具 --- */
function addBox(o){
  o.type = 'box'; o.ry = o.ry || 0;
  world.objs.push(o);
  if (o.solid !== false) world.cols.push(o);
  if (o.update) world.dyn.push(o);
  return o;
}
function addVis(o){ o.type = o.type || 'box'; o.ry = o.ry || 0; world.objs.push(o); return o; }
function addCol(o){ o.type = o.type || 'box'; o.ry = o.ry || 0; world.cols.push(o); return o; }

/* 地板：视觉切成棋盘小块，碰撞用一整块厚盒 */
function addFloor(x0, z0, x1, z1, y, cA, cB, tile, edgeCol){
  const w = x1 - x0, d = z1 - z0; tile = tile || 5;
  const nx = Math.max(1, Math.round(w / tile)), nz = Math.max(1, Math.round(d / tile));
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++){
    const c = ((i + j) & 1) ? cA : cB;
    addVis({ type: 'quad', x: x0 + w * (i + .5) / nx, y: y, z: z0 + d * (j + .5) / nz, hx: w / nx / 2, hy: .1, hz: d / nz / 2, col: c });
  }
  if (edgeCol !== null){
    const ec = edgeCol || PAL.edge;
    addVis({ x: (x0 + x1) / 2, y: y - .62, z: (z0 + z1) / 2, hx: w / 2 + .2, hy: .56, hz: d / 2 + .2, col: ec, top: ec, noTop: true });
  }
  addCol({ x: (x0 + x1) / 2, y: y - 3, z: (z0 + z1) / 2, hx: w / 2, hy: 3, hz: d / 2 });
  return { x0: x0, z0: z0, x1: x1, z1: z1, y: y };
}
/* 直栏杆（沿 z 或 x） */
function addRail(x, z, len, ry, y, h, col){
  addBox({ x: x, y: y + h / 2, z: z, hx: len / 2, hy: h / 2, hz: .4, ry: ry, col: col || PAL.rail, top: col || PAL.railTop });
}
function addSlime(x0, z0, x1, z1, y){ world.slime.push({ x0: x0, z0: z0, x1: x1, z1: z1, y: y }); }

/* 旋转横杆 */
function addSpinner(x, y, z, arms, len, w, thick){
  const pivot = { x: x, z: z, w: w };
  addVis({ type: 'cyl', x: x, y: y - 1.2, z: z, r: 1.1, h: 2.2, sides: 12, col: PAL.metal, top: PAL.metalTop });
  for (let i = 0; i < arms; i++){
    const base = i / arms * TAU;
    const bar = addBox({
      x: x, y: y, z: z, hx: len / 2, hy: (thick || 1) / 2, hz: .55, ry: base,
      col: PAL.bar, top: PAL.barTop, spin: pivot, base: base, px: x, pz: z, ang: 0,
      update: function (dt, t){
        const a = base + t * w;
        this.ry = a;
        this.x = this.px + Math.cos(a) * (len / 2 - len / 2);
        this.z = this.pz;
      }
    });
    bar.x = x; bar.z = z;
  }
  return pivot;
}
/* 来回推杆 */
function addPusher(x, y, z, range, speed, phase, w, d){
  const o = addBox({
    x: x, y: y, z: z, hx: (w || 3.5) / 2, hy: 1.1, hz: (d || 1.1) / 2, col: PAL.push, top: PAL.pushTop,
    cx0: x, range: range, sp: speed, ph: phase || 0, vx: 0,
    update: function (dt, t){
      const nx = this.cx0 + Math.sin(t * this.sp + this.ph) * this.range;
      this.vx = (nx - this.x) / Math.max(dt, .0001); this.x = nx;
    }
  });
  addVis({ type: 'cyl', x: x, y: y - 2.4, z: z, r: .5, h: 1.4, sides: 8, col: PAL.metal });
  return o;
}
/* 移动平台 */
function addPlatform(x, y, z, hx, hz, ax, az, speed, phase, col){
  return addBox({
    x: x, y: y, z: z, hx: hx, hy: .45, hz: hz, col: col || PAL.plat, top: col || PAL.platTop,
    ox: x, oz: z, ax: ax, az: az, sp: speed, ph: phase || 0, vx: 0, vz: 0, carry: true,
    update: function (dt, t){
      const nx = this.ox + Math.sin(t * this.sp + this.ph) * this.ax;
      const nz = this.oz + Math.cos(t * this.sp + this.ph) * this.az;
      this.vx = (nx - this.x) / Math.max(dt, .0001); this.vz = (nz - this.z) / Math.max(dt, .0001);
      this.x = nx; this.z = nz;
    }
  });
}
/* 斜坡（沿 z 升高） */
function addSlope(x0, x1, z0, z1, y0, y1, cA, cB){
  addCol({ type: 'slope', x0: x0, x1: x1, z0: z0, z1: z1, y0: y0, y1: y1, x: (x0 + x1) / 2, z: (z0 + z1) / 2, y: (y0 + y1) / 2, hx: (x1 - x0) / 2, hy: 0, hz: (z1 - z0) / 2 });
  const n = Math.max(2, Math.round((z1 - z0) / 3));
  for (let j = 0; j < n; j++){
    const t0 = j / n, t1 = (j + 1) / n;
    const za = z0 + (z1 - z0) * t0, zb = z0 + (z1 - z0) * t1;
    const ya = y0 + (y1 - y0) * t0, yb = y0 + (y1 - y0) * t1;
    addVis({ type: 'wedge', x0: x0, x1: x1, z0: za, z1: zb, y0: ya, y1: yb, col: (j & 1) ? cA : cB, x: (x0 + x1) / 2, z: (za + zb) / 2, y: (ya + yb) / 2, hx: (x1 - x0) / 2, hy: 2, hz: (zb - za) / 2 });
  }
}
/* 沿斜坡的分段护栏 */
function addSlopeRail(x, z0, z1, y0, y1, h, col){
  const n = Math.max(3, Math.round((z1 - z0) / 2));
  const seg = (z1 - z0) / n;
  for (let i = 0; i < n; i++){
    const t0 = (i + .5) / n;
    const z = z0 + (z1 - z0) * t0, y = y0 + (y1 - y0) * t0;
    addBox({ x: x, y: y + h / 2, z: z, hx: .38, hy: h / 2 + (y1 - y0) / n * .6, hz: seg * .62, ry: 0,
      col: col || PAL.rail, top: col || PAL.railTop });
  }
}
/* 终点拱门 */
function addArch(x, y, z, w, label){

}

/* ============================== 关卡 3：六角迷阵（决赛） ================== */
const HEXR = 2.35, HEXFADE = 2.2;
function hexKey(q, r){ return q + ',' + r; }
function hexPos(q, r){ return { x: HEXR * Math.sqrt(3) * (q + r / 2), z: HEXR * 1.5 * r }; }
function hexRound(q, r){
  let x = q, z = r, y = -q - r;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
function hexAt(layer, x, z){
  const q = (Math.sqrt(3) / 3 * x - z / 3) / HEXR, r = (2 / 3 * z) / HEXR;
  const p = hexRound(q, r);
  return layer.map[hexKey(p[0], p[1])];
}
function buildHex(){
  resetWorld(); PAL = PALETTES.hex; world.mode = 'hex';
  skyTop = PAL.sky[0]; skyBot = PAL.sky[1];
  world.spawn = { x: 0, z: 0, y: 17.6, spread: 7 };
  world.killY = -6;
  const cols = [[255, 214, 240], [186, 224, 255], [255, 236, 168], [200, 255, 214], [226, 208, 255]];
  const rings = 5;
  for (let L = 0; L < 5; L++){
    const layer = { y: 17 - L * 4, map: {}, list: [], col: cols[L] };
    for (let q = -rings; q <= rings; q++){
      for (let r = -rings; r <= rings; r++){
        if (Math.abs(q + r) > rings) continue;
        const p = hexPos(q, r);
        const t = { q: q, r: r, x: p.x, z: p.z, y: layer.y, alive: true, timer: -1, drop: 0, col: layer.col, layer: L };
        layer.map[hexKey(q, r)] = t; layer.list.push(t);
      }
    }
    // 预计算 6 个方向的邻居（用于隐藏看不见的侧面）
    for (const t of layer.list){
      t.nb = [];
      for (let i = 0; i < 6; i++){
        const a = PI / 6 + (i + .5) / 6 * TAU;
        t.nb.push(hexAt(layer, t.x + Math.cos(a) * HEXR * 1.732, t.z + Math.sin(a) * HEXR * 1.732) || null);
      }
    }
    world.hexLayers.push(layer);
  }
  world.qualify = 1; world.timeLimit = 999;
  world.title = '六角迷阵'; world.kind = 'FINAL · 生存';
  world.desc = '踩过的六角砖会消失，掉到最底层之外就出局。活到最后！';
}

/* ---------------------------------------------------------------- 世界更新 */
let worldT = 0;
function updateWorld(dt){
  worldT += dt;
  for (let i = 0; i < world.dyn.length; i++){
    const o = world.dyn[i];
    if (o.update) o.update(dt, worldT);
  }
  // 旋转杆：位置固定，靠 ry 旋转；接触速度由 spin 计算
  // 水果
  if (world.mode === 'race' && (game.state === 'play' || game.state === 'title')){
    world.fruitTimer = (world.fruitTimer || 0) - dt;
    if (world.fruitTimer <= 0 && world.fruitZone){
      world.fruitTimer = rand(.85, 1.7);
      const fz = world.fruitZone;
      world.fruits.push({
        x: rand(fz.x0 + 1, fz.x1 - 1), z: fz.z1 - 1, y: fz.y1 + 1.4, r: rand(.9, 1.45),
        vz: -rand(6, 9), vx: rand(-1.1, 1.1), spin: 0,
        col: pick([[255, 90, 90], [255, 170, 60], [120, 220, 110], [255, 220, 90], [230, 120, 255]])
      });
    }
    const fz = world.fruitZone;
    for (let i = world.fruits.length - 1; i >= 0; i--){
      const f = world.fruits[i];
      f.vz -= 8.5 * dt; f.z += f.vz * dt; f.x += f.vx * dt; f.spin += dt * 6;
      if (f.x < fz.x0 + f.r){ f.x = fz.x0 + f.r; f.vx = Math.abs(f.vx); }
      if (f.x > fz.x1 - f.r){ f.x = fz.x1 - f.r; f.vx = -Math.abs(f.vx); }
      const t = clamp((f.z - fz.z0) / (fz.z1 - fz.z0), 0, 1);
      f.y = fz.y0 + (fz.y1 - fz.y0) * t + f.r;
      if (f.z < fz.z0 - 4) world.fruits.splice(i, 1);
    }
  }
  // 六角砖
  for (const layer of world.hexLayers){
    for (const t of layer.list){
      if (t.timer > 0){
        t.timer -= dt;
        if (t.timer <= 0){ t.alive = false; t.drop = 0.001; }
      }
      if (t.drop > 0){ t.drop += dt * (2.2 + t.drop * 6); }
    }
  }
  // 门
  for (const d of world.doors){ if (d.shake > 0) d.shake = Math.max(0, d.shake - dt * 4); }
}

/* 某点的地面高度（用于影子 / AI 探路） */
function groundAt(x, z, fromY){
  let best = -1e9;
  const cols = world.cols;
  for (let i = 0; i < cols.length; i++){
    const c = cols[i];
    if (c.dead) continue;
    if (c.type === 'slope'){
      if (x >= c.x0 && x <= c.x1 && z >= c.z0 && z <= c.z1){
        const t = (z - c.z0) / (c.z1 - c.z0), y = c.y0 + (c.y1 - c.y0) * t;
        if (y <= fromY + .8 && y > best) best = y;
      }
      continue;
    }
    let dx = x - c.x, dz = z - c.z;
    if (c.ry){ const cr = Math.cos(c.ry), sr = Math.sin(c.ry); const lx = dx * cr + dz * sr; dz = -dx * sr + dz * cr; dx = lx; }
    if (dx > -c.hx && dx < c.hx && dz > -c.hz && dz < c.hz){
      const y = c.y + c.hy;
      if (y <= fromY + .8 && y > best) best = y;
    }
  }
  for (const layer of world.hexLayers){
    if (layer.y > fromY + .8) continue;
    const t = hexAt(layer, x, z);
    if (t && t.alive && layer.y > best) best = layer.y;
  }
  return best;
}

/* ---------------------------------------------------------------- 世界绘制 */
function drawWorld(t){
  const objs = world.objs;
  for (let i = 0; i < objs.length; i++){
    const o = objs[i];
    if (o.hidden) continue;
    const dx = o.x - cam.x, dz = o.z - cam.z, dy = o.y - cam.y;
    const d2 = dx * dx + dz * dz + dy * dy;
    if (d2 > FAR * FAR) continue;
    if (o.type === 'quad') pushQuad(o.x, o.y, o.z, o.hx, o.hz, o.col);
    else if (o.type === 'cyl') pushCyl(o.x, o.y - o.h / 2, o.z, o.r, o.h, o.sides || 10, o.col, o.top, o.ry);
    else if (o.type === 'wedge') pushWedge(o);
    else {
      if (o.door && o.broken) continue;
      if (o.doorTrim && o.doorTrim.broken) continue;
      let ox = o.x, oz = o.z;
      if (o.shake > 0){ ox += Math.sin(t * 40) * o.shake * .25; }
      // 相机贴脸/穿模的物体：淡出或跳过，避免整屏被一块颜色糊住
      let alpha = o.alpha;
      {
        let ldx = cam.x - ox, ldz = cam.z - oz;
        if (o.ry){ const cr2 = Math.cos(o.ry), sr2 = Math.sin(o.ry); const t2 = ldx * cr2 + ldz * sr2; ldz = -ldx * sr2 + ldz * cr2; ldx = t2; }
        const ex = Math.abs(ldx) - o.hx, ey = Math.abs(cam.y - o.y) - o.hy, ez = Math.abs(ldz) - o.hz;
        const sd = Math.max(ex, Math.max(ey, ez));
        if (sd < .25) continue;
        if (sd < 1.5) alpha = Math.min(alpha == null ? 1 : alpha, .22 + (sd - .25) * .45);
      }
      pushBox(ox, o.y, oz, o.hx, o.hy, o.hz, o.ry, o.col, o.top, alpha, o.noTop);
      if (o.label) pushLabel(o.x, o.y, o.z, o.label);
    }
  }
  // 粘液池
  for (const s of world.slime){
    const nx = Math.max(1, Math.round((s.x1 - s.x0) / 6)), nz = Math.max(1, Math.round((s.z1 - s.z0) / 6));
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++){
      const w = (s.x1 - s.x0) / nx, d = (s.z1 - s.z0) / nz;
      const cx = s.x0 + w * (i + .5), cz = s.z0 + d * (j + .5);
      const wob = Math.sin(t * 2.2 + i * .7 + j * 1.1) * .22;
      const c = mixHex(0xe0247f, 0xff7ec0, (Math.sin(t * 1.6 + i + j) * .5 + .5) * .8);
      const ct = mixHex(0xff5cae, 0xffc2e2, (Math.sin(t * 2.1 + i * .5 - j) * .5 + .5));
      pushBox(cx, s.y + wob, cz, w / 2, 1.6, d / 2, 0, c, ct, .95);
    }
  }
  // 水果
  for (const f of world.fruits){
    pushSphere(f.x, f.y, f.z, f.r, f.col);
    pushShadow(f.x, groundAt(f.x, f.z, f.y) + .03, f.z, f.r * .9, .28);
  }
  // 六角砖
  for (const layer of world.hexLayers){
    for (const tl of layer.list){
      if (!tl.alive && tl.drop > 4) continue;
      const y = tl.y - (tl.drop > 0 ? tl.drop * tl.drop * 2.2 : 0);
      let col = tl.col;
      if (tl.timer > 0){
        const f = 1 - tl.timer / HEXFADE;
        col = mixHex(0xffffff, 0xff4f8f, Math.min(1, f + Math.sin(worldT * 26) * .25));
      }
      const alpha = tl.drop > 0 ? Math.max(0, 1 - tl.drop * .55) : 1;
      pushHex(tl.x, y, tl.z, HEXR * .97, .55, col, alpha, tl);
    }
  }
}
function pushHex(x, y, z, r, h, col, alpha, tile){
  const pts = [];
  for (let i = 0; i < 6; i++){ const a = PI / 6 + i / 6 * TAU; pts.push({ x: x + Math.cos(a) * r, z: z + Math.sin(a) * r }); }
  // 侧面（邻居还在时不必画）
  for (let i = 0; i < 6; i++){
    if (tile && tile.nb && tile.nb[i] && tile.nb[i].alive && tile.drop <= 0) continue;
    const p = pts[i], q = pts[(i + 1) % 6];
    const mx = (p.x + q.x) * .5, mz = (p.z + q.z) * .5;
    let nx = mx - x, nz = mz - z; const l = Math.hypot(nx, nz) || 1; nx /= l; nz /= l;
    if (nx * (mx - cam.x) + nz * (mz - cam.z) > 0) continue;
    const k = .5 + .3 * Math.max(0, nx * LX + nz * LZ);
    const fill = shade(col, k);
    const vs = [toCam(p.x, y - h, p.z, {}), toCam(q.x, y - h, q.z, {}), toCam(q.x, y, q.z, {}), toCam(p.x, y, p.z, {})];
    qpush(camDepth(mx, y - h * .5, mz), () => { if (alpha < 1) ctx.globalAlpha = alpha; polyCam(vs, fill, fill, 1); ctx.globalAlpha = 1; });
  }
  const vs = pts.map(p => toCam(p.x, y, p.z, {}));
  const fill = shade(col, 1.02), edge = shade(col, .72);
  let dep = 0;
  for (const p of vs){ const q = p.x * p.x + p.y * p.y + p.z * p.z; if (q > dep) dep = q; }
  qpush(Math.sqrt(dep) + 1.0, () => { if (alpha < 1) ctx.globalAlpha = alpha; polyCam(vs, fill, edge, 2); ctx.globalAlpha = 1; });
}
function pushWedge(o){
  // 斜面块：x0..x1 宽，z0..z1 长，y0->y1 高
  const A = { x: o.x0, y: o.y0, z: o.z0 }, B = { x: o.x1, y: o.y0, z: o.z0 };
  const C = { x: o.x1, y: o.y1, z: o.z1 }, D = { x: o.x0, y: o.y1, z: o.z1 };
  const bot = -3;
  const top = [toCam(A.x, A.y, A.z, {}), toCam(B.x, B.y, B.z, {}), toCam(C.x, C.y, C.z, {}), toCam(D.x, D.y, D.z, {})];
  const fill = shade(o.col, .98);
  qpush(camDepth(o.x, (o.y0 + o.y1) / 2, o.z), () => polyCam(top, fill, fill, 1));
  const sideL = [toCam(A.x, A.y, A.z, {}), toCam(D.x, D.y, D.z, {}), toCam(D.x, bot, D.z, {}), toCam(A.x, bot, A.z, {})];
  const sideR = [toCam(B.x, B.y, B.z, {}), toCam(B.x, bot, B.z, {}), toCam(C.x, bot, C.z, {}), toCam(C.x, C.y, C.z, {})];
  const fs = shade(o.col, .66);
  if (cam.x < o.x0) qpush(camDepth(o.x0, (o.y0 + o.y1) / 2, o.z), () => polyCam(sideL, fs, fs, 1));
  if (cam.x > o.x1) qpush(camDepth(o.x1, (o.y0 + o.y1) / 2, o.z), () => polyCam(sideR, fs, fs, 1));
}
function pushLabel(x, y, z, txt){
  pushCustom(x, y, z, (sx, sy, k) => {
    const fs = clamp(k * 1.1, 8, 60);
    ctx.save(); ctx.font = '900 ' + fs + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = fs * .22; ctx.strokeStyle = 'rgba(60,20,80,.85)'; ctx.strokeText(txt, sx, sy);
    ctx.fillStyle = '#fff'; ctx.fillText(txt, sx, sy); ctx.restore();
  });
}
/* ============================================================================

let beans = [], player = null;

function makeBean(i, isPlayer){

function spawnBeans(n, playerIn){

    b.x = sp.x + gx * 2.6 + rand(-.35, .35);
    b.z = sp.z - gz * 2.6 + rand(-.35, .35);

/* ---------------------------------------------------------------- 物理常量 */
const GRAV = 30, JUMPV = 11.2, RUN = 7.4, ACC = 52, AIRACC = 20, FRIC = 14, MAXFALL = 34;

function updateBean(b, dt, t){
  if (b.dead) return;
  if (b.eliminated){
    b.deadT = (b.deadT || 0) + dt;
    if (b.deadT > 2.2){ b.dead = true; return; }
  }
  b.px = b.x; b.py = b.y; b.pz = b.z;
  const inp = b.in;
  if (b.stun > 0) b.stun -= dt;
  if (b.hitT > 0) b.hitT -= dt;
  const ctrl = b.stun <= 0 && b.state !== 'prone' && !b.eliminated && !b.finished;

  // 目标速度
  let tx = 0, tz = 0;
  if (ctrl){
    const m = Math.hypot(inp.mx, inp.mz);
    if (m > .001){
      const spd = RUN * b.ai.skill * (b.state === 'dive' ? .35 : 1);
      tx = inp.mx / m * spd; tz = inp.mz / m * spd;
      b.yaw = angLerp(b.yaw, Math.atan2(inp.mx, inp.mz), 1 - Math.exp(-16 * dt));
    }
  }
  const acc = (b.grounded ? ACC : AIRACC) * dt;
  if (b.state === 'dive' || b.state === 'prone'){
    // 飞扑中只有轻微控制
    b.vx += (tx - b.vx) * Math.min(1, 2.2 * dt);
    b.vz += (tz - b.vz) * Math.min(1, 2.2 * dt);
    if (b.grounded){
      const f = Math.exp(-4.5 * dt); b.vx *= f; b.vz *= f;
    }
  } else {
    b.vx = approach(b.vx, tx, acc);
    b.vz = approach(b.vz, tz, acc);
    if (b.grounded && tx === 0 && tz === 0){
      const f = Math.exp(-FRIC * dt); b.vx *= f; b.vz *= f;
    }
  }
  // 跳跃 / 飞扑
  if (b.grounded) b.coyote = .12; else b.coyote -= dt;
  if (inp.jump) b.jumpBuf = .16; else b.jumpBuf -= dt;
  if (b.jumpBuf > 0 && b.coyote > 0 && ctrl && b.state !== 'dive'){
    b.vy = JUMPV; b.grounded = false; b.coyote = 0; b.jumpBuf = 0;
    b.state = 'air'; b.anim.sq = 1.35;
    if (b.isPlayer) sfx('jump'); else if (Math.random() < .25) sfx('jump', .25);
    puff(b.x, b.y, b.z, 6, .5);
  }
  if (inp.dive && ctrl && b.state !== 'dive' && b.state !== 'prone' && b.diveT <= 0){
    const s = Math.hypot(b.vx, b.vz);
    const dx = s > 1 ? b.vx / s : Math.sin(b.yaw), dz = s > 1 ? b.vz / s : Math.cos(b.yaw);
    b.vx = dx * (Math.max(s, RUN * .8) + 4.2); b.vz = dz * (Math.max(s, RUN * .8) + 4.2);
    if (b.grounded) b.vy = 6.2; else b.vy = Math.max(b.vy, 1.5);
    b.state = 'dive'; b.diveT = .35; b.yaw = Math.atan2(dx, dz);
    if (b.isPlayer) sfx('dive');
  }
  if (b.diveT > 0) b.diveT -= dt;

  // 重力
  b.vy -= GRAV * dt;
  if (b.vy < -MAXFALL) b.vy = -MAXFALL;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;

  const wasGround = b.grounded;
  b.grounded = false; b.groundObj = null;
  collideBean(b, dt);
  // 落地
  if (b.grounded && !wasGround){
    if (b.state === 'dive'){ b.state = 'prone'; b.st = .55; puff(b.x, b.y, b.z, 8, .8); if (b.isPlayer) sfx('land'); }
    else { b.state = 'idle'; b.anim.sq = .72; if (b.vy < -9) puff(b.x, b.y, b.z, 5, .5); }
  }
  if (b.state === 'prone'){
    b.st -= dt;
    if (b.st <= 0 && b.grounded) b.state = 'idle';
  } else if (!b.grounded && b.state !== 'dive') b.state = 'air';
  else if (b.grounded && b.state === 'dive' && b.diveT <= 0) { b.state = 'prone'; b.st = .45; }

  // 粘液 / 掉落
  if (world.mode !== 'hex'){
    for (const s of world.slime){
      if (b.x > s.x0 && b.x < s.x1 && b.z > s.z0 && b.z < s.z1 && b.y < s.y + 1.1){ splash(b); respawnBean(b); break; }
    }
  }
  if (b.y < world.killY){
    if (world.mode === 'hex') eliminateBean(b, '掉出场地');
    else respawnBean(b);
  }
  // 检查点
  for (let i = 0; i < world.checkpoints.length; i++){
    if (b.z > world.checkpoints[i].z && i + 1 > b.cp) b.cp = i + 1;
  }
  // 终点
  if (!b.finished && !b.eliminated && b.z > world.finishZ && world.mode !== 'hex') finishBean(b);

  // 动画
  const sp = Math.hypot(b.vx, b.vz);
  b.anim.ph += dt * (2.5 + sp * 1.5);
  b.anim.sq += (1 - b.anim.sq) * Math.min(1, dt * 11);
  b.anim.blink -= dt;
  if (b.anim.blink < 0){ b.anim.blink = rand(1.6, 5.5); b.anim.eye = .16; }
  if (b.anim.eye > 0) b.anim.eye -= dt;
  b.wobble = lerp(b.wobble, clamp(sp / RUN, 0, 1), Math.min(1, dt * 6));
  if ((game.frame + b.id) % 6 === 0) b.shadowY = groundAt(b.x, b.z, b.y + .3);
}

/* ---------------------------------------------------------------- 碰撞 */
function collideBean(b, dt){
  const cols = world.cols, half = b.h * .5, cy = b.y + half;
  for (let it = 0; it < 2; it++){
    for (let i = 0; i < cols.length; i++){
      const c = cols[i];
      if (c.dead || (c.door && c.broken)) continue;
      if (c.type === 'slope'){
        if (it) continue;
        if (b.x > c.x0 - b.r && b.x < c.x1 + b.r && b.z > c.z0 && b.z < c.z1){
          const tt = clamp((b.z - c.z0) / (c.z1 - c.z0), 0, 1);
          const gy = c.y0 + (c.y1 - c.y0) * tt;
          if (b.y < gy + .45 && b.y > gy - 4){
            b.y = gy; if (b.vy < 0) b.vy = 0;
            b.grounded = true; b.groundObj = c;
          }
        }
        continue;
      }
      let dx = b.x - c.x, dz = b.z - c.z;
      const dy = (b.y + half) - c.y;
      const rr = c.hx + c.hz + b.r + 1;
      if (dx * dx + dz * dz > rr * rr) continue;
      if (Math.abs(dy) > c.hy + half) continue;
      let cr = 1, sr = 0;
      if (c.ry){ cr = Math.cos(c.ry); sr = Math.sin(c.ry); }
      const lx = dx * cr + dz * sr, lz = -dx * sr + dz * cr;
      const ex = c.hx + b.r, ez = c.hz + b.r, ey = c.hy + half;
      const ox = ex - Math.abs(lx), oz = ez - Math.abs(lz), oy = ey - Math.abs(dy);
      if (ox <= 0 || oz <= 0 || oy <= 0) continue;

      // 纸门：撞碎
      if (c.door && c.fake){ breakDoor(c, b); continue; }
      // 接触速度（旋转杆 / 推杆 / 移动平台）
      let cvx = c.vx || 0, cvz = c.vz || 0;
      if (c.spin){ const rx = b.x - c.spin.x, rz = b.z - c.spin.z; cvx = c.spin.w * rz; cvz = -c.spin.w * rx; }

      const stepUp = dy > 0 && oy <= .62 && b.vy <= .2;   // 小台阶：优先向上解算
      if (stepUp || (oy <= ox && oy <= oz)){
        if (dy > 0){
          b.y = c.y + c.hy;
          if (b.vy < 0) b.vy = 0;
          b.grounded = true; b.groundObj = c;
          if (c.carry || c.spin || c.vx){ b.x += cvx * dt; b.z += cvz * dt; }
        } else {
          b.y = c.y - c.hy - b.h;
          if (b.vy > 0) b.vy = -1;
        }
      } else if (ox <= oz){
        const push = lx > 0 ? ox : -ox;
        b.x += push * cr; b.z += push * sr;
        const vl = b.vx * cr + b.vz * sr;
        if ((push > 0 && vl < 0) || (push < 0 && vl > 0)){ b.vx -= vl * cr; b.vz -= vl * sr; }
        hitDynamic(b, c, cvx, cvz);
      } else {
        const push = lz > 0 ? oz : -oz;
        b.x += -push * sr; b.z += push * cr;
        const vl = -b.vx * sr + b.vz * cr;
        if ((push > 0 && vl < 0) || (push < 0 && vl > 0)){ b.vx += vl * sr; b.vz -= vl * cr; }
        hitDynamic(b, c, cvx, cvz);
      }
    }
  }
  // 六角砖
  if (world.hexLayers.length){
    for (const layer of world.hexLayers){
      const ly = layer.y;
      if (b.py >= ly - .06 && b.y <= ly + .02 && b.vy <= 0.01){
        const t = hexAt(layer, b.x, b.z);
        if (t && t.alive){
          b.y = ly; b.vy = 0; b.grounded = true; b.groundObj = t;
          if (t.timer < 0){ t.timer = HEXFADE; if (b.isPlayer) sfx('crack'); }
        }
      } else if (b.grounded && Math.abs(b.y - ly) < .02){
        const t = hexAt(layer, b.x, b.z);
        if (t && t.alive && t.timer < 0) t.timer = HEXFADE;
      }
    }
  }
  // 边界兜底
  if (world.mode === 'doors' || world.mode === 'race'){
    if (b.x < -60) b.x = -60; if (b.x > 60) b.x = 60;
  }
}
function hitDynamic(b, c, cvx, cvz){
  const s = Math.hypot(cvx, cvz);
  if (s > 1.5){
    b.vx += cvx * 1.25; b.vz += cvz * 1.25;
    if (b.grounded || b.y < c.y + c.hy) b.vy = Math.max(b.vy, 2.8 + Math.min(s * .22, 3.2));
    if (b.state !== 'dive'){ b.state = 'prone'; b.st = .5; }
    b.stun = .42; b.hitT = .3;
    if (b.isPlayer){ sfx('bonk'); cam.shake = Math.min(1, .35 + s * .04); }
    puff(b.x, b.y + .6, b.z, 7, .8, [255, 240, 160]);
  } else if (c.door && !c.fake && Math.hypot(b.vx, b.vz) > 4.5){
    b.vx *= -.35; b.vz *= -.35; b.stun = .3; c.shake = .5;
    if (b.state !== 'prone'){ b.state = 'prone'; b.st = .35; }
    if (b.isPlayer){ sfx('bonk'); cam.shake = .4; }
  }
}
/* 糖豆人互撞 */
function beanCollisions(dt){
  for (let i = 0; i < beans.length; i++){
    const a = beans[i]; if (a.dead) continue;
    for (let j = i + 1; j < beans.length; j++){
      const b = beans[j]; if (b.dead) continue;
      if (Math.abs(a.y - b.y) > 1.5) continue;
      let dx = b.x - a.x, dz = b.z - a.z;
      let d2 = dx * dx + dz * dz;
      const rr = a.r + b.r;
      if (d2 > rr * rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), nx = dx / d, nz = dz / d, pen = rr - d;
      a.x -= nx * pen * .5; a.z -= nz * pen * .5;
      b.x += nx * pen * .5; b.z += nz * pen * .5;
      const rv = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      if (rv < 0){
        const imp = -rv * .62;
        a.vx -= nx * imp; a.vz -= nz * imp;
        b.vx += nx * imp; b.vz += nz * imp;
        const strong = Math.abs(rv);
        if (strong > 7){
          const victim = (a.state === 'dive') ? b : (b.state === 'dive' ? a : (Math.random() < .5 ? a : b));
          if (victim.state !== 'prone'){ victim.state = 'prone'; victim.st = .45; victim.stun = .35; }
          puff((a.x + b.x) / 2, (a.y + b.y) / 2 + .6, (a.z + b.z) / 2, 6, .7, [255, 255, 200]);
          if (a.isPlayer || b.isPlayer){ sfx('bump'); cam.shake = Math.max(cam.shake, .25); }
        }
      }
    }
  }
}
/* 水果撞人 */
function fruitCollisions(){
  for (const f of world.fruits){
    for (const b of beans){
      if (b.dead || b.eliminated) continue;
      const dx = b.x - f.x, dz = b.z - f.z, dy = (b.y + .6) - f.y;
      const rr = f.r + b.r;
      if (dx * dx + dz * dz + dy * dy * .5 < rr * rr){
        const d = Math.hypot(dx, dz) || 1;
        b.vx += dx / d * 4 + f.vx * .8; b.vz += dz / d * 2.5 + f.vz * .8;
        b.vy = Math.max(b.vy, 4.5);
        b.state = 'prone'; b.st = .6; b.stun = .5; b.hitT = .35;
        f.vx += -dx / d * .8;
        puff(b.x, b.y + .7, b.z, 8, 1, f.col);
        if (b.isPlayer){ sfx('bonk'); cam.shake = .6; }
      }
    }
  }
}
function breakDoor(d, b){
  d.broken = true; d.dead = true;
  sfx('door');
  for (let i = 0; i < 16; i++)
    parts.push({
      x: d.x + rand(-d.hx, d.hx), y: d.y + rand(-d.hy, d.hy), z: d.z, r: rand(.18, .42),
      vx: rand(-3, 3), vy: rand(1, 7), vz: rand(1, 5) * sign(b.vz || 1), life: rand(.8, 1.6), col: d.col, g: 22
    });
  if (b.isPlayer) cam.shake = .35;
  b.vx *= .82; b.vz *= .82;
}
function splash(b){
  for (let i = 0; i < 14; i++)
    parts.push({ x: b.x + rand(-.6, .6), y: b.y + rand(0, .5), z: b.z + rand(-.6, .6), r: rand(.12, .34), vx: rand(-3, 3), vy: rand(2, 7), vz: rand(-3, 3), life: rand(.5, 1), col: PAL.slime || [255, 90, 170], g: 20 });
  if (b.isPlayer) sfx('splash');
}
function respawnBean(b){
  const cp = world.checkpoints[Math.max(0, b.cp - 1)] || { x: world.spawn.x, y: world.spawn.y, z: world.spawn.z };
  b.x = cp.x + rand(-2.5, 2.5); b.y = cp.y + 1.2; b.z = cp.z + rand(-1.5, 1.5);
  b.px = b.x; b.py = b.y; b.pz = b.z;
  b.vx = b.vy = b.vz = 0; b.stun = .35; b.state = 'idle'; b.spawnT = .6;
  if (b.isPlayer){ banner('掉下去了！', 'elim', .9); cam.shake = .3; }
}
function eliminateBean(b, why){
  if (b.eliminated || b.qualified) return;
  b.eliminated = true; b.deadT = 0; b.stun = 99;
  b.place = beans.filter(x => !x.eliminated).length + 1;
  if (b.isPlayer) onPlayerOut(false);
  else if (world.mode === 'hex') feed(b.name + ' 出局了 · 第 ' + b.place + ' 名');
}
function finishBean(b){
  if (b.finished || b.eliminated) return;
  b.finished = true; b.finishT = game.time;
  if (game.qualified >= world.qualify){   // 名额已满，晚了一步
    b.eliminated = true;
    b.place = world.qualify + (game.lateOut = (game.lateOut || 0) + 1);
    if (b.isPlayer) onPlayerOut(false);
    return;
  }
  b.qualified = true;
  b.place = ++game.qualified;
  b.vx *= .3; b.vz *= .3;
  confettiWorld(b.x, b.y + 2, b.z);
  if (b.isPlayer){ onPlayerOut(true); sfx('qualify'); if (game.practice) game.fillT = Math.min(game.fillT, 4); }
  else { sfx('pass', .3); feed(b.name + ' 晋级！ #' + b.place); }
  if (game.qualified >= world.qualify) game.fillT = Math.min(game.fillT, 2.2);
}

/* ---------------------------------------------------------------- AI */
function aiInput(b, dt){
  const ai = b.ai, inp = b.in;
  inp.jump = false; inp.dive = false;
  if (b.eliminated || b.dead){ inp.mx = inp.mz = 0; return; }
  if (b.finished){
    inp.mx = 0; inp.mz = Math.random() < .5 ? .4 : 0;
    if (Math.random() < .01) inp.jump = true;
    return;
  }
  ai.jumpCd -= dt;
  let tx = b.x, tz = b.z;

  if (world.mode === 'hex'){
    ai.retarget -= dt;
    const layer = currentLayer(b);
    if (layer){
      const cur = hexAt(layer, b.x, b.z);
      if (ai.retarget <= 0 || !ai.tt || !ai.tt.alive || (cur && cur.timer > 0 && cur.timer < .45)){
        ai.tt = pickHexTarget(b, layer);
        ai.retarget = rand(.5, 1.1);
      }
      if (ai.tt){ tx = ai.tt.x; tz = ai.tt.z; }
    } else { tx = 0; tz = 0; }
    const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz) || 1;
    inp.mx = dx / d; inp.mz = dz / d;
    if (d < .6){ ai.retarget = 0; }
    if (ai.jumpCd <= 0 && Math.random() < .012 * b.ai.skill){ inp.jump = true; ai.jumpCd = 1.2; }
    return;
  }

  // 竞速：沿路点前进
  const wps = world.waypoints;
  while (ai.wp < wps.length - 1 && b.z > wps[ai.wp][1] - 1.5) ai.wp++;
  let wp = wps[Math.min(ai.wp, wps.length - 1)];
  tx = wp[0] + ai.off * (Math.abs(wp[0]) > 1 ? .25 : 1); tz = wp[1];

  if (world.mode === 'doors'){
    // 选门：优先已被撞碎的门
    let rowZ = 1e9, row = -1;
    for (let i = 0; i < world.doorRows.length; i++){
      if (world.doorRows[i] > b.z - .5){ rowZ = world.doorRows[i]; row = i; break; }
    }
    if (row >= 0){
      const cands = world.doors.filter(d => d.row === row);
      const open = cands.filter(d => d.broken);
      if (open.length){
        let best = open[0], bd = 1e9;
        for (const o of open){ const dd = Math.abs(o.x - b.x); if (dd < bd){ bd = dd; best = o; } }
        ai.doors[row] = best;
      } else if (!ai.doors[row] || ai.doors[row].broken === false && Math.random() < .004){
        ai.doors[row] = pick(cands);
      }
      const d = ai.doors[row];
      if (d){
        const lined = Math.abs(b.x - d.x) < 1.15;
        tx = d.x + rand(-.15, .15);
        tz = lined ? rowZ + 4 : (b.z > rowZ - 3.2 ? rowZ - 3.6 : rowZ - 3.2);
        if (lined && rowZ - b.z < 5 && ai.jumpCd <= 0 && Math.random() < .02){ inp.dive = true; ai.jumpCd = 1.5; }
      }
    }
  }

  const dx = tx - b.x, dz = tz - b.z, d = Math.hypot(dx, dz) || 1;
  inp.mx = dx / d; inp.mz = dz / d;
  // 卡住检测：后退 + 横移绕开
  ai.stuckT = (ai.stuckT || 0) + dt;
  if (ai.stuckT > .8){
    const moved = Math.abs(b.z - (ai.lastZ == null ? b.z : ai.lastZ)) + Math.abs(b.x - (ai.lastX == null ? b.x : ai.lastX));
    ai.lastZ = b.z; ai.lastX = b.x; ai.stuckT = 0;
    if (moved < .8){
      ai.stuck = (ai.stuck || 0) + 1;
      if (ai.stuck >= 2){ ai.avoidT = rand(.45, .9); ai.avoidDir = Math.random() < .5 ? -1 : 1; ai.stuck = 0; }
    } else ai.stuck = 0;
  }
  if (ai.avoidT > 0){
    ai.avoidT -= dt;
    const m = Math.hypot(1, .55);
    inp.mx = ai.avoidDir / m; inp.mz = -.55 / m;
    if (Math.random() < .04) inp.jump = true;
    return;
  }
  // 前方悬空 -> 跳
  if (b.grounded && ai.jumpCd <= 0){
    for (const probe of [1.7, 2.8]){
      const gy = groundAt(b.x + inp.mx * probe, b.z + inp.mz * probe, b.y + .5);
      if (gy < b.y - 1.4){ inp.jump = true; ai.jumpCd = .55; break; }
    }
  }

  // 附近危险（旋转杆/推杆/水果）-> 跳或扑
  if (b.grounded && ai.jumpCd <= 0){
    for (const c of world.cols){
      if (!c.spin && !c.sp) continue;
      const dd = dist2(b.x, b.z, c.x + Math.cos(c.ry || 0) * 0, c.z);
      if (c.spin){
        const rx = b.x - c.spin.x, rz = b.z - c.spin.z;
        const dist = Math.hypot(rx, rz);
        if (dist < c.hx + 2){
          const barA = c.ry, pa = Math.atan2(rz, rx);
          let diff = Math.abs(angNorm(pa - barA)); diff = Math.min(diff, Math.abs(PI - diff));
          if (diff < .5 && Math.random() < .5 * b.ai.skill){ inp.jump = true; ai.jumpCd = .7; }
        }
      } else if (dd < 12 && Math.random() < .2 * b.ai.skill){ inp.jump = true; ai.jumpCd = .9; }
    }
    for (const f of world.fruits){
      if (dist2(b.x, b.z, f.x, f.z) < 20 && f.z > b.z && Math.random() < .35 * b.ai.skill){ inp.jump = true; ai.jumpCd = .6; break; }
    }
  }
  // 冲刺飞扑
  if (world.finishZ - b.z < 8 && b.grounded && ai.jumpCd <= 0 && Math.random() < .04){ inp.dive = true; ai.jumpCd = 1.2; }
  if (Math.random() < .0015) inp.dive = true;
}
function currentLayer(b){
  let best = null, bd = 1e9;
  for (const L of world.hexLayers){
    const d = Math.abs(b.y - L.y);
    if (b.y >= L.y - .3 && d < bd){ bd = d; best = L; }
  }
  return best;
}
function pickHexTarget(b, layer){
  let best = null, bestScore = -1e9;
  for (let i = 0; i < 14; i++){
    const t = pick(layer.list);
    if (!t || !t.alive || t.timer > 0) continue;
    const d = Math.hypot(t.x - b.x, t.z - b.z);
    if (d < 1.2 || d > 14) continue;
    let nb = 0;
    const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    for (const dd of dirs){ const n = layer.map[hexKey(t.q + dd[0], t.r + dd[1])]; if (n && n.alive && n.timer < 0) nb++; }
    const score = nb * 2.2 - d * .35 - Math.hypot(t.x, t.z) * .16 + rand(0, 1.6);
    if (score > bestScore){ bestScore = score; best = t; }
  }
  return best;
}

/* ---------------------------------------------------------------- 角色绘制 */
function drawBean(b){
  if (b.dead && b.deadT > 1.4) return;
  const sqY = b.anim.sq, sqX = 1 / Math.sqrt(sqY);
  // 影子
  const gy = b.shadowY;
  if (gy > -900){
    const hAbove = clamp(b.y - gy, 0, 6);
    pushShadow(b.x, gy, b.z, b.r * (1.55 - hAbove * .12), .34 * (1 - hAbove / 7));
  }
  pushCustom(b.x, b.y + b.h * .5, b.z, (sx, sy, k) => {
    const h = b.h * k * sqY, w = b.r * 2.05 * k * sqX;
    const rel = angNorm(b.yaw - cam.yaw);
    let face = -Math.cos(rel);          // 1 = 正对镜头
    const side = Math.sin(rel);
    ctx.save();
    ctx.translate(sx, sy);
    let tilt = 0, scaleY = 1;
    if (b.state === 'dive' || b.state === 'prone'){
      tilt = -side * .5;
      scaleY = .58 + .1 * Math.abs(face);
      ctx.translate(0, h * .22);
    }
    if (b.stun > 0 && b.state !== 'prone') tilt += Math.sin(game.time * 40) * .12;
    ctx.rotate(tilt);
    const bw = w * (b.state === 'dive' || b.state === 'prone' ? 1.22 : 1), bh = h * scaleY;

function beanPath(w, h){

  ctx.quadraticCurveTo(w / 2, h / 2, w / 2, h / 2 - rb);
  ctx.lineTo(w / 2, -h / 2 + rt);
  ctx.quadraticCurveTo(w / 2, -h / 2, 0, -h / 2);

function drawBeanBody(b, w, h, face, side, k){
  const c = b.col, dark = shade(c, .55), mid = shade(c, .82), lite = shade(c, 1.16);

function drawHat(b, w, h, face, side){

function updateParts(dt){

    p.vy -= (p.g || 12) * dt;

/* ---------------------------------------------------------------- 音效 */
let AC = null, master = null, musicGain = null, musicNext = 0, musicStep = 0;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = game.mute ? 0 : .55; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = .3; musicGain.connect(master);
  } catch (e){ AC = null; }
}
function tone(freq, dur, type, vol, slideTo, when, dest){
  if (!AC) return;
  const t0 = (when || AC.currentTime);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol == null ? .18 : vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0008, t0 + dur);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol, when){
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol == null ? .2 : vol;
  s.connect(g); g.connect(master); s.start(when || AC.currentTime);
}
function sfx(name, v){
  if (!AC || game.mute) return;
  const V = v == null ? 1 : v;
  switch (name){
    case 'jump': tone(420, .16, 'sine', .16 * V, 760); break;
    case 'dive': tone(300, .22, 'triangle', .16 * V, 620); break;
    case 'land': noise(.09, .07 * V); break;
    case 'bump': tone(180, .1, 'square', .12 * V, 90); noise(.06, .06 * V); break;
    case 'bonk': tone(120, .18, 'sawtooth', .14 * V, 60); noise(.1, .1 * V); break;
    case 'door': noise(.22, .18 * V); tone(90, .2, 'square', .1 * V, 40); break;
    case 'splash': noise(.3, .16 * V); tone(700, .3, 'sine', .1 * V, 180); break;
    case 'crack': tone(900, .08, 'square', .05 * V, 1400); break;
    case 'beep': tone(660, .13, 'square', .18 * V); break;
    case 'go': tone(880, .3, 'square', .2 * V, 1320); break;
    case 'pass': tone(880, .1, 'sine', .08 * V, 1180); break;
    case 'qualify':
      [0, .1, .2, .34].forEach((d, i) => tone([660, 880, 1100, 1320][i], .3, 'triangle', .17, null, (AC.currentTime + d)));
      break;
    case 'out': tone(400, .5, 'sawtooth', .16 * V, 90); break;
    case 'win':
      [0, .12, .24, .36, .5].forEach((d, i) => tone([523, 659, 784, 1046, 1318][i], .45, 'triangle', .2, null, AC.currentTime + d));
      break;
  }
}
const MUS_BASS = [0, 0, 7, 7, 5, 5, 3, 3], MUS_ARP = [0, 4, 7, 12, 7, 4, 0, 4];
function musicTick(){
  if (!AC || game.mute || game.state === 'title') return;
  const now = AC.currentTime;
  if (musicNext < now) musicNext = now + .05;
  while (musicNext < now + .3){
    const s = musicStep % 16, bar = Math.floor(musicStep / 16) % 4;
    const root = 55 * Math.pow(2, (MUS_BASS[bar * 2 % 8] + 3) / 12) * 2;
    if (s % 4 === 0) tone(root, .18, 'triangle', .14, null, musicNext, musicGain);
    if (s % 2 === 1) tone(root * 4 * Math.pow(2, MUS_ARP[s % 8] / 12), .1, 'square', .05, null, musicNext, musicGain);
    if (s % 8 === 4) noise(.05, .04, musicNext);
    musicStep++; musicNext += .125;
  }
}

    const t = e.touches[0]; if (!t) return;
    const r = el.joy.getBoundingClientRect ? el.joy.getBoundingClientRect() : { left: 0, top: 0, width: 130, height: 130 };
    let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);

  const m = Math.hypot(ix, iz);
  if (m > 1){ ix /= m; iz /= m; }
  const s = Math.sin(cam.yaw), c = Math.cos(cam.yaw);
  inp.mx = iz * s + ix * c;
  inp.mz = iz * c - ix * s;
  inp.jump = !!(keys.Space);
  inp.dive = !!(keys.ShiftLeft || keys.ShiftRight || keys.ControlLeft);
}

/* ---------------------------------------------------------------- 相机 */
function camTarget(){
  if (game.state === 'title'){
    let lead = beans[0];
    for (const b of beans) if (b && b.z > lead.z) lead = b;
    return lead;
  }
  if (player && !player.dead) return player;
  if (game.spectate && !game.spectate.dead) return game.spectate;
  const alive = beans.filter(b => !b.dead);
  game.spectate = alive.length ? alive[0] : beans[0];
  return game.spectate || beans[0];
}
function trackTarget(t){
  const wps = world.waypoints;
  if (!wps || !wps.length) return null;
  for (let i = 0; i < wps.length; i++)
    if (wps[i][1] > t.z + 5) return { x: wps[i][0], z: wps[i][1] };
  return { x: 0, z: t.z + 20 };
}
function updateCamera(dt){
  const t = camTarget();
  if (!t) return;
  if (mouseLook > 0) mouseLook -= dt;
  cam.dist = cam.dist || 8.6;
  let ty = t.y + 1.35;
  if (game.state === 'title'){
    cam.yaw += dt * .12;
    cam.pitch = lerp(cam.pitch, -.22, .02);
  } else if (game.state === 'ceremony'){
    cam.yaw += dt * .5; cam.pitch = lerp(cam.pitch, -.18, .05);
  } else if (mouseLook <= 0 && world.mode !== 'hex'){
    // 缓慢回正到“赛道前进方向”（不跟随速度，避免被撞飞后视角乱转）
    const w = trackTarget(t);
    if (w){
      const want = Math.atan2(w.x - t.x, w.z - t.z);
      cam.yaw = angLerp(cam.yaw, want, 1 - Math.exp(-1.3 * dt));
    }
  }
  const d = game.state === 'ceremony' ? 7 : cam.dist;
  const hgt = game.state === 'title' ? 5 : 3.6;
  const wx = t.x - Math.sin(cam.yaw) * d, wz = t.z - Math.cos(cam.yaw) * d, wy = ty + hgt;
  const k = 1 - Math.exp(-(game.state === 'play' ? 9 : 4) * dt);
  cam.x = lerp(cam.x, wx, k); cam.y = lerp(cam.y, wy, k); cam.z = lerp(cam.z, wz, k);
  // 不要穿地
  const g = groundAt(cam.x, cam.z, cam.y);
  if (g > -900 && cam.y < g + 1.1) cam.y = g + 1.1;
  // 俯仰自动看向目标
  const dx = t.x - cam.x, dy = ty - cam.y, dz = t.z - cam.z;
  const flat = Math.hypot(dx, dz);
  const want = Math.atan2(dy, flat);
  cam.pitch = lerp(cam.pitch, clamp(want, -1.1, .4), 1 - Math.exp(-6 * dt));
  if (cam.shake > 0){
    cam.shake = Math.max(0, cam.shake - dt * 2.2);
    cam.x += rand(-1, 1) * cam.shake * .28; cam.y += rand(-1, 1) * cam.shake * .22; cam.z += rand(-1, 1) * cam.shake * .28;
  }
}

/* ---------------------------------------------------------------- UI */
let bannerT = 0;
function banner(txt, cls, dur){
  if (!el.banner) return;
  el.banner.textContent = txt;
  el.banner.className = cls || '';
  el.banner.classList.add('stampIn');
  el.banner.style.display = 'block';
  bannerT = dur || 1.6;
  setTimeout(() => el.banner.classList.remove('stampIn'), 620);
}
function hideBanner(){ if (el.banner) el.banner.style.display = 'none'; }
function show(n, v){ if (el[n]) el[n].classList[v ? 'remove' : 'add']('hidden'); }
function fmtTime(s){
  s = Math.max(0, Math.ceil(s));
  return (s / 60 | 0) + ':' + ('0' + (s % 60)).slice(-2);
}
function updateHUD(){
  if (!el.hud) return;
  el.roundName.textContent = (game.round < 2 ? '第 ' + (game.round + 1) + ' 关' : '决 赛') + ' · ' + world.title;
  if (world.mode === 'hex'){
    el.qualText.textContent = '存活 ' + game.alive;
    el.qualFill.style.width = (100 - game.alive / Math.max(1, game.roster.length) * 100) + '%';
    el.timer.textContent = '最后一人获胜';
  } else {
    el.qualText.textContent = game.qualified + ' / ' + world.qualify;
    el.qualFill.style.width = clamp(game.qualified / world.qualify * 100, 0, 100) + '%';
    el.timer.textContent = fmtTime(game.timeLeft);
  }
  el.rank.innerHTML = '糖豆人 <i>' + beans.filter(b => !b.eliminated).length + '</i>';
  if (player && !player.eliminated){
    if (player.qualified) el.pos.textContent = '已晋级 #' + player.place;
    else {
      let r = 1;
      for (const b of beans){ if (b === player || b.eliminated) continue; if (b.qualified || b.z > player.z) r++; }
      game.playerRank = r;
      el.pos.textContent = '第 ' + r + ' 名';
    }
  } else el.pos.textContent = '观 战';
}

/* ---------------------------------------------------------------- 回合流程 */
const ROUNDS = [
  { build: buildRace, n: 20 },
  { build: buildDoors, n: 0 },
  { build: buildHex, n: 0 }
];
function makeRoster(n){
  const idx = [];
  for (let i = 0; i < COSTUME.length; i++) idx.push(i);
  for (let i = idx.length - 1; i > 0; i--){ const j = randi(i + 1); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  const list = [];
  for (let i = 0; i < n; i++){
    const ci = idx[i % idx.length], c = COSTUME[ci];
    list.push({
      id: i, isPlayer: i === 0, name: i === 0 ? '你' : NAMES[(ci + i) % NAMES.length],
      col: c, col2: mixHex(0x3a2b5c, (c[0] << 16 | c[1] << 8 | c[2]), .5),
      hat: i === 0 ? 'cap' : pick(HATS), hatCol: pick(COSTUME), skill: i === 0 ? 1 : rand(.82, 1.04)
    });
  }
  return list;
}
function spawnRoster(){
  beans = [];
  const sp = world.spawn, n = game.roster.length, cols = Math.min(5, Math.max(2, Math.ceil(Math.sqrt(n))));
  for (let i = 0; i < n; i++){
    const p = game.roster[i], b = makeBean(p.id, p.isPlayer);
    b.name = p.name; b.col = p.col; b.col2 = p.col2; b.hat = p.hat; b.hatCol = p.hatCol; b.ai.skill = p.skill;
    if (world.mode === 'hex'){
      const a = i / n * TAU + rand(-.15, .15), rr = rand(8, 13);
      b.x = sp.x + Math.cos(a) * rr; b.z = sp.z + Math.sin(a) * rr; b.y = sp.y;
    } else {
      const gx = (i % cols) - (cols - 1) / 2, gz = Math.floor(i / cols);
      b.x = sp.x + gx * 2.7 + rand(-.3, .3); b.z = sp.z - gz * 2.7 + rand(-.3, .3); b.y = sp.y;
    }
    b.px = b.x; b.py = b.y; b.pz = b.z;
    b.yaw = world.mode === 'hex' ? Math.atan2(-b.x, -b.z) : 0;
    beans.push(b);
  }
  if (game.debugZ){
    for (const b of beans){ b.z += game.debugZ; b.y = groundAt(b.x, b.z, 60) + .3; b.pz = b.z; b.py = b.y; }
  }
  player = null;
  for (const b of beans) if (b.isPlayer) player = b;
  game.alive = beans.length;
  game.spectate = null;
}
function startGame(practice){
  game.practice = !!practice;
  game.round = 0;
  game.roster = makeRoster(practice ? 12 : 20);
  show('title', false);
  startRound();
}
function startRound(){
  const R = ROUNDS[game.round];
  R.build();
  if (game.practice){ world.qualify = 99; world.timeLimit = 999; }
  spawnRoster();
  game.qualified = 0; game.roundT = 0; game.timeLeft = world.timeLimit; game.fillT = 1e9;
  game.playerDone = false; game.playerOut = false; game.endT = 0; game.winner = null;
  game.lastPlace = 0; game.lastCount = -1; game.lateOut = 0;
  parts = []; confetti = []; feeds = [];
  cam.x = world.spawn.x; cam.z = world.spawn.z - 12; cam.y = world.spawn.y + 6; cam.yaw = 0; cam.pitch = -.2;
  show('hud', true); show('result', false); hideBanner();
  el.cardKind.textContent = world.kind;
  el.cardName.textContent = world.title;
  el.cardDesc.textContent = world.desc;
  el.cardTag.textContent = world.mode === 'hex' ? '最后 1 人获胜' : ('前 ' + world.qualify + ' 名晋级');
  el.count.textContent = '';
  show('card', true);
  game.state = 'intro';
  game.introT = game.fast ? 1.35 : 4.2;
  updateHUD();
  if (isTouch) showTouch();
}
function restartRound(){ startRound(); }
function beginPlay(){
  game.state = 'play';
  show('card', false);
  banner('开 始 !', 'go', 1.1);
  sfx('go');
}
function onPlayerOut(qualified){
  if (qualified){
    game.playerDone = true;
    banner('晋 级 !', 'qual', 2.2);
    confettiScreen(160);
  } else {
    game.playerOut = true;
    banner('被 淘 汰', 'elim', 2.2);
    sfx('out');
    game.endT = 2.4;
  }
}
function endRound(){
  if (game.state === 'over' || game.state === 'ceremony') return;
  // 未完成的按进度排名淘汰
  game.lastPlace = game.qualified;
  const rest = beans.filter(b => !b.qualified && !b.eliminated);
  rest.sort((a, b) => (b.z - a.z));
  for (const b of rest){
    if (world.mode !== 'hex'){ b.eliminated = true; b.place = ++game.lastPlace; }
  }
  // 只有晋级者进入下一关
  const ok = {};
  for (const b of beans) if (b.qualified && !b.eliminated) ok[b.id] = 1;
  const next = game.roster.filter(p => ok[p.id]);
  if (next.length) game.roster = next;
  game.state = 'over';
  if (document.exitPointerLock) document.exitPointerLock();
  showResult();
}
function showResult(){
  const isFinal = world.mode === 'hex';
  const win = isFinal && player && !player.eliminated && game.winner === player;
  const passed = player && player.qualified && !player.eliminated;
  show('hud', false);
  show('result', true);
  if (isFinal){
    el.rTitle.textContent = win ? '👑 冠 军 !' : '决赛结束';
    el.rSub.textContent = win ? '你拿到了那顶王冠！' : (game.winner ? game.winner.name + ' 抢走了王冠' : '');
  } else if (passed){
    el.rTitle.textContent = '晋 级 成 功 !';
    el.rSub.textContent = '你以第 ' + player.place + ' 名冲过终点';
  } else {
    el.rTitle.textContent = '被 淘 汰';
    el.rSub.textContent = '再来一次，冠军就在前方！';
  }
  const list = beans.slice().sort((a, b) => {
    const pa = a.place || 999, pb = b.place || 999;
    if (a.qualified !== b.qualified) return a.qualified ? -1 : 1;
    return pa - pb;
  });
  let html = '';
  for (let i = 0; i < list.length; i++){
    const b = list[i];
    const ok = isFinal ? (b === game.winner) : b.qualified;
    html += '<div class="rRow' + (b.isPlayer ? ' me' : '') + '" style="animation-delay:' + (i * .035) + 's">' +
      '<div class="num">' + (b.place || '-') + '</div>' +
      '<div class="dot" style="background:rgb(' + b.col[0] + ',' + b.col[1] + ',' + b.col[2] + ')"></div>' +
      '<div class="nm">' + b.name + (b.isPlayer ? ' （你）' : '') + '</div>' +
      '<div class="tag' + (ok ? '' : ' no') + '">' + (ok ? (isFinal ? '冠军' : '晋级') : '淘汰') + '</div></div>';
  }
  el.rList.innerHTML = html;
  const last = isFinal || !passed;
  el.rBtn.textContent = last ? '再 玩 一 次' : '下 一 关';
  el.rBtn.onclick = () => {
    show('result', false);
    if (last){ game.state = 'title'; show('title', true); initTitle(); }
    else { game.round++; startRound(); }
  };
  if (isFinal && win){ confettiScreen(300); sfx('win'); }
  else if (passed) sfx('qualify');
  else sfx('out');
}
function checkRoundEnd(dt){
  if (world.mode === 'hex'){
    const alive = beans.filter(b => !b.eliminated);
    game.alive = alive.length;
    if (alive.length <= 1 && game.state === 'play'){
      const w = alive[0];
      if (w){ w.crown = true; w.place = 1; w.qualified = true; game.winner = w; }
      game.state = 'ceremony'; game.ceremonyT = 4.2;
      if (w && w.isPlayer){ banner('胜 利 !', 'qual', 3); confettiScreen(260); sfx('win'); }
      else { banner(w ? w.name + ' 获胜' : '结束', 'elim', 3); sfx('out'); }
      game.spectate = w;
    }
    return;
  }
  if (game.qualified >= world.qualify && game.fillT > 100) game.fillT = 2.4;
  if (game.fillT < 100){ game.fillT -= dt; if (game.fillT <= 0) endRound(); }
  game.timeLeft -= dt;
  if (game.timeLeft <= 0) endRound();
  if (game.playerOut){ game.endT -= dt; if (game.endT <= 0) endRound(); }
}

/* ---------------------------------------------------------------- 标题演示 */
function initTitle(){
  buildRace();
  game.roster = makeRoster(14);
  for (const p of game.roster) p.isPlayer = false;
  spawnRoster();
  game.state = 'title'; game.qualified = 0; game.alive = beans.length;
  world.qualify = 99; game.practice = false;
  cam.x = 0; cam.y = 8; cam.z = -16; cam.yaw = 0; cam.pitch = -.2;
  show('hud', false); show('card', false); show('result', false);
  hideBanner();
}

/* ---------------------------------------------------------------- 主循环 */
function step(dt){
  game.dt = dt;
  game.time += dt;
  musicTick();
  if (bannerT > 0){ bannerT -= dt; if (bannerT <= 0) hideBanner(); }

  if (game.state === 'intro'){
    game.introT -= dt;
    const n = Math.ceil(game.introT - 1.2);
    if (n !== game.lastCount && n >= 0){
      game.lastCount = n;
      if (n > 0){ el.count.textContent = n; el.count.className = 'pop'; sfx('beep'); setTimeout(() => el.count.className = '', 500); }
    }
    if (game.introT <= 1.2 && game.state === 'intro') beginPlay();
    updateWorld(dt);
    for (const b of beans){ b.in.mx = 0; b.in.mz = 0; b.in.jump = false; b.in.dive = false; updateBean(b, dt, game.time); }
    beanCollisions(dt);
  } else if (game.state === 'play'){
    game.roundT += dt;
    updateWorld(dt);
    for (const b of beans){
      if (b.isPlayer && !b.dead && !b.finished) readPlayerInput(b);
      else aiInput(b, dt);
      updateBean(b, dt, game.time);
    }
    beanCollisions(dt);
    if (world.mode === 'race') fruitCollisions();
    checkRoundEnd(dt);
    if (game.frame % 5 === 0) updateHUD();
  } else if (game.state === 'title' || game.state === 'over' || game.state === 'ceremony'){
    updateWorld(dt);
    for (const b of beans){ aiInput(b, dt); updateBean(b, dt, game.time); }
    beanCollisions(dt);
    if (world.mode === 'race' && game.state === 'title') fruitCollisions();
    if (game.state === 'ceremony'){
      game.ceremonyT -= dt;
      if (game.winner){ if (game.frame % 6 === 0) confettiWorld(game.winner.x, game.winner.y + 2.5, game.winner.z); }
      if (game.ceremonyT <= 0){ game.state = 'over'; showResult(); }
    }
    if (game.state === 'title'){
      // 演示：跑完就重开
      let done = 0;
      for (const b of beans) if (b.z > world.finishZ - 2) done++;
      if (done > 3) initTitle();
    }
  }
  updateParts(dt);
  updateCamera(dt);
}
function render(){
  camPrep();
  drawSky(game.time);
  drawWorld(game.time);
  for (const b of beans){
    if (b.dead){ b.deadT = (b.deadT || 0) + game.dt; if (b.deadT > 1.4) continue; }
    drawBean(b);
  }
  drawParts();
  qflush();
  drawConfetti();
  if (game.state === 'play' || game.state === 'ceremony') drawFeeds();
  // 出局淡入淡出
  if (game.state === 'play' && player && player.eliminated){
    ctx.fillStyle = 'rgba(120,0,40,.18)'; ctx.fillRect(0, 0, W, H);
  }
}
let lastNow = 0, acc = 0;
function frame(now){
  const raw = (now - lastNow) / 1000;
  lastNow = now;
  let dt = raw;
  if (!isFinite(dt) || dt <= 0) dt = .016;
  if (dt > .05) dt = .05;
  game.frame++;
  game.fps = lerp(game.fps, 1 / dt, .05);
  step(dt);
  render();
  if (el.fps && game.frame % 20 === 0) el.fps.textContent = Math.round(game.fps) + ' FPS · ' + (game.faces || 0) + ' 面';
  requestAnimationFrame(frame);
}
function toggleMute(){
  game.mute = !game.mute;
  if (master) master.gain.value = game.mute ? 0 : .55;
  if (el.sound) el.sound.textContent = game.mute ? '🔇' : '🔊';
}
/* ---------------------------------------------------------------- 启动 */
function boot(){
  bindTouch();
  if (el.btnPlay) el.btnPlay.onclick = () => { initAudio(); startGame(false); };
  if (el.btnSolo) el.btnSolo.onclick = () => { initAudio(); startGame(true); };
  if (el.sound) el.sound.onclick = () => { initAudio(); toggleMute(); };
  if ('ontouchstart' in window) { isTouch = true; }
  let h = '';
  try { h = (location.hash || '').replace('#', ''); } catch (e){}
  const hp = h.split(/[+,]/);
  if (hp.indexOf('fast') >= 0) game.fast = true;
  for (const s of hp) if (/^z-?[0-9]+$/.test(s)) game.debugZ = +s.slice(1);
  h = hp[0];
  if (h === 'r1' || h === 'r2' || h === 'r3'){
    const idx = +h[1] - 1;
    game.roster = makeRoster(idx === 0 ? 20 : (idx === 1 ? 10 : 6));
    game.round = idx; show('title', false); startRound();
  } else initTitle();
  requestAnimationFrame(frame);
}
boot();
