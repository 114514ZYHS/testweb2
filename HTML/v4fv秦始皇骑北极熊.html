<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>秦始皇骑北极熊 · 光影沙盘</title>
<style>
:root{--panel:rgba(16,20,30,.86);--line:rgba(255,255,255,.10);--txt:#e9eef8;--dim:#94a3bd;--gold:#e0b95d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 820px at 28% -12%,#1b2436,#070a10 62%);color:var(--txt);
  font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:flex;overflow:hidden}
.stage{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:16px}
canvas{display:block;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.65);cursor:crosshair;touch-action:none}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:#a6b6cd;
  background:rgba(8,12,20,.55);border:1px solid var(--line);padding:6px 14px;border-radius:999px;pointer-events:none}
.panel{width:318px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:20px 18px 28px;overflow:auto}
h1{margin:0 0 2px;font-size:19px;letter-spacing:1px}
h1 small{display:block;font-size:12px;color:var(--dim);letter-spacing:3px;font-weight:400;margin-top:3px}
.badge{margin:14px 0 18px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);
  display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.badge b{color:var(--gold);font-size:15px;letter-spacing:2px}
.ctl{display:block;margin:0 0 15px}
.ctl span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.ctl b{color:var(--txt);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;outline:none;
  background:linear-gradient(90deg,#e0b95d,#5b7fb4);opacity:.9}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid #e0b95d;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #e0b95d;cursor:pointer}
.sec{margin:20px 0 10px;font-size:11px;letter-spacing:2px;color:#6d7c95}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 auto;min-width:64px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--txt);font-size:12.5px;font-family:inherit;transition:.15s}
button:hover{background:rgba(224,185,93,.18);border-color:rgba(224,185,93,.5)}
.toggles{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.tg{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);cursor:pointer}
.tg input{accent-color:#e0b95d;width:15px;height:15px}
.tip{margin:18px 0 0;font-size:11.5px;color:#5f6d84;line-height:1.7}
</style>
</head>
<body>
<div class="stage"><canvas id="cv"></canvas><div class="hint">在画面上拖动 = 直接搬动太阳　·　滚轮 = 调高度角</div></div>
<aside class="panel">
  <h1>秦皇北极熊<small>SUN · SNOW · BANNER</small></h1>
  <div class="badge"><span>此刻天时</span><b id="tod">正午</b></div>
  <div id="ctls"></div>
  <div class="sec">预设天时</div>
  <div class="row">
    <button data-p="dawn">破晓</button><button data-p="noon">正午</button><button data-p="dusk">落日</button>
    <button data-p="back">逆光</button><button data-p="night">极夜</button>
  </div>
  <div class="sec">开关</div>
  <div class="toggles">
    <label class="tg"><input type="checkbox" id="t_auto">自动昼夜循环</label>
    <label class="tg"><input type="checkbox" id="t_march" checked>北极熊行进</label>
    <label class="tg"><input type="checkbox" id="t_rays" checked>丁达尔光束</label>
  </div>
  <div class="sec">导出</div>
  <div class="row"><button id="shot">保存 PNG</button><button id="reset">重置全部</button></div>
  <p class="tip">玄鸟负日，白熊踏雪。<br>拖动天空即可任意搬动太阳：毛色高光、旗面明暗、雪地投影的方向与长度会一并跟着变。</p>
</aside>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var off=document.createElement('canvas'), octx=off.getContext('2d');
var W=1000,H=620,HZ=386,GY=512;
off.width=W; off.height=H;
var g=ctx, SIL=false, SILC='#000';
var hasFilter=(typeof ctx.filter==='string');

var S={az:-46,elev:19,power:1.1,amb:.58,wind:1,snow:.55};
var T={auto:false,march:true,rays:true};
var DEF=JSON.parse(JSON.stringify(S));

/* ================= 工具 ================= */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(e0,e1,x){var t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);}
function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function css(c,a){ if(a===undefined)a=1;
  return 'rgba('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+','+a+')';}
var seed=20250601;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}

/* ================= 光照 ================= */
var SUN=[255,240,215],AMB=[150,180,220],I=1,LX=-.6,LY=-.8,sunX=300,sunY=200,day=1;
var mnX=700,mnY=200,mw=0,lightX=300,lightY=200;
function skyZ(){var e=S.elev;
  if(e<=-6)return [7,11,28];
  if(e<2)  return mix([7,11,28],[28,44,88],sstep(-6,2,e));
  if(e<10) return mix([28,44,88],[54,90,144],sstep(2,10,e));
  return mix([54,90,144],[34,112,204],sstep(10,45,e));}
function skyH(){var e=S.elev;
  if(e<=-8)return [16,26,54];
  if(e<0)  return mix([16,26,54],[126,68,84],sstep(-8,0,e));
  if(e<8)  return mix([126,68,84],[255,156,78],sstep(0,8,e));
  return mix([255,156,78],[202,230,255],sstep(8,42,e));}
function computeLight(){
  var e=S.elev,r=e*Math.PI/180;
  sunX=W/2+Math.sin(S.az*Math.PI/180)*Math.cos(r*.5)*W*.62;
  sunY=HZ-Math.sin(r)*(HZ+60);
  day=sstep(-7,7,e);
  // 日落之后由月亮接手：悬在对侧天空，成为新的光源
  mw=1-clamp(day*1.7,0,1);
  mnX=W-sunX; mnY=HZ-108-46*sstep(0,-12,e);
  lightX=lerp(sunX,mnX,mw); lightY=lerp(sunY,mnY,mw);
  SUN=mix([255,248,232],[255,126,52],sstep(24,1,e));
  SUN=mix(SUN,[168,192,246],mw);
  I=S.power*(.95*day+.3*mw);
  AMB=mix(mix(skyH(),skyZ(),.45),[56,80,136],mw*.8);
  var dx=lightX-500,dy=lightY-320,m=Math.sqrt(dx*dx+dy*dy)||1;
  LX=dx/m; LY=dy/m;
}
function shade(base,n){
  var d=clamp(n,0,1.9),k=.66*S.amb;
  return [base[0]*(AMB[0]/255*k+SUN[0]/255*I*d),
          base[1]*(AMB[1]/255*k+SUN[1]/255*I*d),
          base[2]*(AMB[2]/255*k+SUN[2]/255*I*d)];
}
function lgrad(x,y,r,base,hi,lo){
  if(hi===undefined)hi=1.05; if(lo===undefined)lo=-.06;
  var gr=g.createLinearGradient(x+LX*r,y+LY*r,x-LX*r,y-LY*r);
  gr.addColorStop(0,css(shade(base,hi)));
  gr.addColorStop(.44,css(shade(base,hi*.46)));
  gr.addColorStop(1,css(shade(base,lo)));
  return gr;
}
function paint(p,style){g.fillStyle=SIL?SILC:style;g.fill(p);}
function stroke(p,style,w){g.strokeStyle=SIL?SILC:style;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.stroke(p);}
/* 迎光侧边缘光：渐变实现，绝不描内轮廓（复合路径也安全） */
function rim(p,cx,cy,r,base,k){
  if(SIL)return; if(k===undefined)k=1;
  g.save(); g.clip(p);
  var gr=g.createLinearGradient(cx+LX*r,cy+LY*r,cx+LX*r*.40,cy+LY*r*.40);
  gr.addColorStop(0,css(shade(base,2.15),clamp(.6*I*k,0,.85)));
  gr.addColorStop(1,css(shade(base,2.15),0));
  g.fillStyle=gr; g.fillRect(cx-r*2.2,cy-r*2.2,r*4.4,r*4.4);
  g.restore();
}
/* 单一轮廓专用的细亮边 */
function edge(p,base,w,k){
  if(SIL)return; if(k===undefined)k=1;
  g.save(); g.clip(p);
  g.strokeStyle=css(shade(base,2.3),clamp(.46*I*k,0,.7));
  g.lineWidth=w||6; g.lineJoin='round';
  g.translate(LX*2.4,LY*2.4); g.stroke(p); g.restore();
}
function ao(x,y,rx,ry,a){
  if(SIL)return;
  var gr=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  gr.addColorStop(0,'rgba(38,58,100,'+a+')'); gr.addColorStop(1,'rgba(38,58,100,0)');
  g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill();
}

/* ================= 色板 ================= */
var FUR=[242,243,246],FUR2=[200,208,224],SNOW=[242,246,253];
var ROBE=[24,23,31],ROBE2=[44,42,58],RED=[146,26,34],GOLD=[216,170,74],
    SKIN=[236,200,168],HAIR=[30,28,32],BEARD=[58,54,60],JADE=[228,240,236];

/* ================= 背景 ================= */
var stars=[],berg=[],flakes=[];
(function init(){
  for(var i=0;i<200;i++)stars.push({x:rnd()*W,y:rnd()*(HZ-6),r:rnd()*1.5+.3,p:rnd()*TAU});
  for(var j=0;j<7;j++)berg.push({x:rnd()*(W+160)-80,w:120+rnd()*230,h:28+rnd()*70});
  berg.sort(function(a,b){return b.h-a.h;});
  for(var k=0;k<280;k++)flakes.push({x:rnd()*W,y:rnd()*H,z:.3+rnd()*1,s:rnd()*TAU});
})();
function drawSky(t){
  var z=skyZ(),h=skyH();
  var gr=ctx.createLinearGradient(0,0,0,HZ+40);
  gr.addColorStop(0,css(z)); gr.addColorStop(.58,css(mix(z,h,.5))); gr.addColorStop(1,css(h));
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,HZ+42);
  var sa=1-day;
  if(sa>.02){
    for(var i=0;i<stars.length;i++){var s=stars[i];
      var tw=.5+.5*Math.sin(t*1.7+s.p);
      ctx.fillStyle='rgba(255,255,255,'+(sa*tw*.92).toFixed(3)+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(var b=0;b<3;b++){
      var pa=new Path2D(),base=76+b*40,x;
      pa.moveTo(-40,base);
      for(x=-40;x<=W+40;x+=26)pa.lineTo(x,base+Math.sin(x*.006+t*.32+b)*24+Math.sin(x*.017-t*.19)*10);
      for(x=W+40;x>=-40;x-=26)pa.lineTo(x,base+62+Math.sin(x*.006+t*.32+b)*24+Math.sin(x*.017-t*.19)*10);
      pa.closePath();
      var ag=ctx.createLinearGradient(0,base,0,base+62);
      ag.addColorStop(0,'rgba(80,255,190,0)');
      ag.addColorStop(.45,'rgba(96,240,180,'+(sa*.15).toFixed(3)+')');
      ag.addColorStop(1,'rgba(150,110,255,0)');
      ctx.fillStyle=ag; ctx.fill(pa);
    }
    ctx.restore();
  }
}
function drawSun(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  if(day>.03){
    var col=SUN, R=32+16*(1-sstep(0,26,S.elev)), big=R*10;
    var gl=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,big);
    gl.addColorStop(0,css(col,.9*day)); gl.addColorStop(.13,css(col,.36*day));
    gl.addColorStop(.42,css(col,.09*day)); gl.addColorStop(1,css(col,0));
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(sunX,sunY,big,0,TAU); ctx.fill();
    ctx.fillStyle=css(mix(col,[255,255,255],.6),.97*day);
    ctx.beginPath(); ctx.arc(sunX,sunY,R,0,TAU); ctx.fill();
  }
  if(mw>.03){
    var mc=[226,236,255], MR=23, mb=MR*7;
    var ml=ctx.createRadialGradient(mnX,mnY,0,mnX,mnY,mb);
    ml.addColorStop(0,css(mc,.5*mw)); ml.addColorStop(.14,css(mc,.16*mw));
    ml.addColorStop(.45,css(mc,.07*mw)); ml.addColorStop(1,css(mc,0));
    ctx.fillStyle=ml; ctx.beginPath(); ctx.arc(mnX,mnY,mb,0,TAU); ctx.fill();
    ctx.fillStyle=css([242,246,255],.95*mw);
    ctx.beginPath(); ctx.arc(mnX,mnY,MR,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(mnX+11,mnY-8,MR*.84,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='lighter';
  }
  ctx.restore();
}
function drawClouds(t){
  for(var i=0;i<4;i++){
    var cx=((i*281+t*6*(1+i*.15))%(W+460))-230, cy=52+i*40, s=.75+i*.2;
    var p=new Path2D();
    p.ellipse(cx,cy,104*s,17*s,0,0,TAU);
    p.ellipse(cx+56*s,cy-9*s,60*s,14*s,0,0,TAU);
    p.ellipse(cx-62*s,cy+4*s,52*s,11*s,0,0,TAU);
    var gr=ctx.createLinearGradient(cx+LX*100,cy+LY*26,cx-LX*100,cy-LY*26);
    gr.addColorStop(0,css(shade([250,248,250],.85),.4));
    gr.addColorStop(1,css(shade([158,166,190],.16),.26));
    ctx.fillStyle=gr; ctx.fill(p);
  }
}
function drawBergs(){
  for(var i=0;i<berg.length;i++){
    var b=berg[i],p=new Path2D();
    p.moveTo(b.x-b.w/2,HZ+3);
    p.lineTo(b.x-b.w*.2,HZ-b.h);
    p.lineTo(b.x-b.w*.02,HZ-b.h*.62);
    p.lineTo(b.x+b.w*.17,HZ-b.h*.88);
    p.lineTo(b.x+b.w/2,HZ+3);
    p.closePath();
    var far=[228,238,252];
    var gr=ctx.createLinearGradient(b.x+LX*b.w*.55,HZ-b.h,b.x-LX*b.w*.55,HZ);
    gr.addColorStop(0,css(shade(far,1.15)));
    gr.addColorStop(.46,css(shade(far,.4)));
    gr.addColorStop(1,css(shade(far,.14)));
    ctx.fillStyle=gr; ctx.fill(p);
  }
  var hg=ctx.createLinearGradient(0,HZ-52,0,HZ+4);
  hg.addColorStop(0,css(skyH(),0)); hg.addColorStop(1,css(skyH(),.34));
  ctx.fillStyle=hg; ctx.fillRect(0,HZ-52,W,58);
  ctx.fillStyle=css(shade(SNOW,.75),.7); ctx.fillRect(0,HZ-1.5,W,3);
}
function drawGround(){
  var gr=ctx.createLinearGradient(0,HZ,0,H);
  gr.addColorStop(0,css(mix(shade(SNOW,.32),shade(SUN,.45),.22)));
  gr.addColorStop(.22,css(shade(SNOW,.62)));
  gr.addColorStop(1,css(shade(SNOW,.86)));
  ctx.fillStyle=gr; ctx.fillRect(0,HZ,W,H-HZ);
  if(I>.05&&(S.elev<36||mw>.2)){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    var gx=lerp(sunX,mnX,mw);
    var sp=ctx.createLinearGradient(gx,HZ,gx,H);
    sp.addColorStop(0,css(SUN,clamp(.32*I,0,.5))); sp.addColorStop(1,css(SUN,0));
    ctx.fillStyle=sp;
    ctx.beginPath(); ctx.moveTo(gx-30,HZ); ctx.lineTo(gx+30,HZ);
    ctx.lineTo(gx+170,H); ctx.lineTo(gx-170,H); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  var dr=[[140,436,290,16],[830,428,250,13],[520,566,440,46],[70,600,380,54],[960,584,320,42]];
  for(var i=0;i<dr.length;i++){
    var d=dr[i],p=new Path2D();
    p.ellipse(d[0],d[1],d[2],d[3],0,0,TAU);
    var g2=ctx.createLinearGradient(d[0]+LX*d[2]*.5,d[1]+LY*d[3]*2.4,d[0]-LX*d[2]*.5,d[1]-LY*d[3]*2.4);
    g2.addColorStop(0,css(shade(SNOW,1.02),.95)); g2.addColorStop(1,css(shade(SNOW,.3),.9));
    ctx.fillStyle=g2; ctx.fill(p);
  }
  ctx.strokeStyle=css(shade(SNOW,.16),.26); ctx.lineWidth=1.2;
  for(var k=0;k<8;k++){
    var y=HZ+16+k*k*1.9, p3=new Path2D(); p3.moveTo(0,y);
    for(var x=0;x<=W;x+=40)p3.lineTo(x,y+Math.sin(x*.011+k)*(2+k*.55));
    ctx.stroke(p3);
  }
  for(var f=1;f<=6;f++){
    var fx=350-f*66, fy=524+f*7, a=clamp(.15-f*.019,0,.2)*(.3+.7*day);
    ctx.fillStyle='rgba(58,86,132,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(fx,fy,17-f,7-f*.5,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fx-26,fy+10,15-f,6-f*.5,0,0,TAU); ctx.fill();
  }
}

/* ================= 主角 ================= */
function bearLeg(hx,hy,len,w,a,base){
  var p=new Path2D();
  p.moveTo(-w*.5,0);
  p.bezierCurveTo(-w*.6,len*.45,-w*.58,len*.78,-w*.52,len-7);
  p.quadraticCurveTo(-w*.54,len,-w*.2,len);
  p.lineTo(w*.28,len);
  p.quadraticCurveTo(w*.6,len,w*.54,len-10);
  p.bezierCurveTo(w*.6,len*.78,w*.58,len*.45,w*.5,0);
  p.closePath();
  var paw=new Path2D(); paw.ellipse(w*.04,len-5,w*.64,w*.3,0,0,TAU);
  g.save(); g.translate(hx,hy); g.rotate(a);
  paint(p,lgrad(0,len*.55,w*1.25,base));
  edge(p,base,4,.8);
  paint(paw,lgrad(0,len-3,w*.7,base,.85,-.02));
  if(!SIL){
    g.fillStyle=css(shade([44,50,70],.12),.42);
    for(var c=0;c<3;c++){ g.beginPath(); g.ellipse(-w*.28+c*w*.28,len-2,3.2,4.4,0,0,TAU); g.fill(); }
  }
  g.restore();
}
function torsoPath(){
  var p=new Path2D();
  p.moveTo(298,394);
  p.bezierCurveTo(296,346,328,318,386,314);
  p.bezierCurveTo(452,308,530,320,592,314);
  p.bezierCurveTo(630,311,654,328,662,352);
  p.bezierCurveTo(676,378,670,408,648,426);
  p.bezierCurveTo(604,446,466,452,396,438);
  p.bezierCurveTo(340,426,300,422,298,392);
  p.closePath();
  return p;
}
function drawBear(t){
  var ph=T.march?t*3.1:0, sw=T.march?Math.sin(ph):0;
  var bob=T.march?Math.abs(Math.sin(ph))*3.4:0;
  g.save(); g.translate(0,-bob);
  bearLeg(576,388,126,40,.22*sw,FUR2);
  bearLeg(374,394,120,46,-.22*sw,FUR2);
  bearLeg(612,392,122,50,-.22*sw,FUR);
  bearLeg(398,398,116,58,.22*sw,FUR);
  var body=torsoPath();
  paint(body,lgrad(492,378,182,FUR));
  if(!SIL){
    g.save(); g.clip(body);
    ao(410,444,96,44,.32); ao(618,438,86,42,.28);
    var bg2=g.createLinearGradient(0,392,0,452);
    bg2.addColorStop(0,'rgba(66,94,148,0)'); bg2.addColorStop(1,'rgba(66,94,148,.32)');
    g.fillStyle=bg2; g.fillRect(280,392,420,72);
    g.strokeStyle=css(shade(FUR,.5),.28); g.lineWidth=2;
    for(var i=0;i<7;i++){
      var fx=336+i*46, fy=416+Math.sin(i*1.3)*8;
      g.beginPath(); g.moveTo(fx,fy); g.quadraticCurveTo(fx-9,fy+13,fx-20,fy+22); g.stroke();
    }
    g.restore();
  }

  }
  computeLight();
  ctx.setTransform(view.dpr*view.s,0,0,view.dpr*view.s,0,0);
  ctx.clearRect(0,0,W,H);
  drawSky(t); drawSun(); drawClouds(t); drawBergs(); drawGround();
  drawShadow(t); drawHero(t);
  drawFlakes(t,dt); drawRays(); drawGrade();
  requestAnimationFrame(frame);
}

/* ================= 交互 ================= */
var CTL=[['az','太阳方位角','°',-95,95,1],['elev','太阳高度角','°',-12,88,1],
         ['power','阳光强度','',0,1.8,.01],['amb','环境光','',0,1.2,.01],
         ['wind','风力·旗帜','',0,2.2,.01],['snow','风雪','',0,1.5,.01]];
var box=document.getElementById('ctls');
CTL.forEach(function(c){
  var w=document.createElement('label'); w.className='ctl';
  w.innerHTML='<span>'+c[1]+'<b id="v_'+c[0]+'"></b></span>';
  var inp=document.createElement('input');
  inp.type='range'; inp.min=c[3]; inp.max=c[4]; inp.step=c[5]; inp.id='r_'+c[0]; inp.value=S[c[0]];
  inp.addEventListener('input',function(){S[c[0]]=parseFloat(inp.value);syncUI();});
  w.appendChild(inp); box.appendChild(w);
});
function todName(){
  var e=S.elev;
  if(e<-6)return '极夜'; if(e<1)return '晨昏'; if(e<8)return '金辉';
  if(e<20)return '斜阳'; if(e<50)return '晴昼'; return '正午';
}
function syncUI(){
  CTL.forEach(function(c){
    var v=S[c[0]];
    document.getElementById('v_'+c[0]).textContent=c[2]?Math.round(v)+c[2]:v.toFixed(2);
    document.getElementById('r_'+c[0]).value=v;
  });
  document.getElementById('tod').textContent=todName();
}
var PRE={dawn:{az:-78,elev:6,power:1.3,amb:.5},noon:{az:-16,elev:64,power:1.15,amb:.62},
  dusk:{az:70,elev:3,power:1.45,amb:.48},back:{az:-88,elev:13,power:1.6,amb:.4},
  night:{az:44,elev:-9,power:1,amb:.6}};
[].forEach.call(document.querySelectorAll('[data-p]'),function(b){
  b.addEventListener('click',function(){
    var p=PRE[b.getAttribute('data-p')],k;
    for(k in p)S[k]=p[k];
    document.getElementById('t_auto').checked=false; T.auto=false; syncUI();
  });
});
document.getElementById('t_auto').addEventListener('change',function(){T.auto=this.checked;});
document.getElementById('t_march').addEventListener('change',function(){T.march=this.checked;});
document.getElementById('t_rays').addEventListener('change',function(){T.rays=this.checked;});
document.getElementById('reset').addEventListener('click',function(){
  for(var k in DEF)S[k]=DEF[k];
  T.auto=false; document.getElementById('t_auto').checked=false; syncUI();
});
document.getElementById('shot').addEventListener('click',function(){
  var a=document.createElement('a');
  a.download='qin-polarbear.png'; a.href=cv.toDataURL('image/png'); a.click();
});
var drag=false;
function setSun(ev){
  var r=cv.getBoundingClientRect();
  var px=(ev.clientX-r.left)/(r.width/W), py=(ev.clientY-r.top)/(r.height/H);
  S.elev=clamp(Math.asin(clamp((HZ-py)/(HZ+60),-.22,1))*180/Math.PI,-12,88);
  var rad=S.elev*Math.PI/180;
  S.az=clamp(Math.asin(clamp((px-W/2)/(Math.cos(rad*.5)*W*.62),-1,1))*180/Math.PI,-95,95);
  T.auto=false; document.getElementById('t_auto').checked=false; syncUI();
}
cv.addEventListener('pointerdown',function(e){drag=true;cv.setPointerCapture(e.pointerId);setSun(e);});
cv.addEventListener('pointermove',function(e){if(drag)setSun(e);});
cv.addEventListener('pointerup',function(){drag=false;});
cv.addEventListener('wheel',function(e){e.preventDefault();S.elev=clamp(S.elev-e.deltaY*.03,-12,88);syncUI();},{passive:false});

resize(); syncUI(); requestAnimationFrame(frame);
})();
</script>
