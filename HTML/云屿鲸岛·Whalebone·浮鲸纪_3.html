<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鲸屿 · 云上浮城</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Outfit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07111c; }
    body { font-family: Outfit, "Noto Serif SC", serif; color: #f8f3e8; }
    canvas { display: block; }
    .serif { font-family: "Noto Serif SC", serif; }
    #loader { transition: opacity .8s ease, visibility .8s; }
    #loader.hide { opacity: 0; visibility: hidden; }
    .grain { position: fixed; inset: 0; pointer-events: none; opacity: .07; z-index: 8; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 7; background: radial-gradient(circle at 55% 44%, transparent 35%, rgba(2,9,16,.18) 72%, rgba(2,7,12,.68) 115%); }
    .ui { text-shadow: 0 2px 18px rgba(0,0,0,.4); }
    .line { width: 42px; height: 1px; background: rgba(255,255,255,.55); }
    .glass { background: rgba(8,18,26,.24); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .compass-ring { animation: breathe 3.8s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .6; } }
    @keyframes loadbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    #load-line { transform-origin: left; animation: loadbar 2.1s cubic-bezier(.2,.8,.2,1) forwards; }
    @media (max-width: 700px) { .desktop-note { display:none; } .hero-copy { bottom: 5.5rem !important; left: 1.25rem !important; } }
  </style>
</head>
<body>
  <div id="stage" class="fixed inset-0"></div>
  <div class="grain"></div><div class="vignette"></div>

  <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#07111c]">
    <div class="relative w-16 h-10 mb-8">
      <div class="absolute left-0 top-4 w-12 h-5 rounded-[50%] bg-[#b7cad1]"></div>
      <div class="absolute right-0 top-2 w-7 h-3 rotate-[-18deg] rounded-[50%] bg-[#b7cad1]"></div>
      <div class="absolute left-2 top-8 w-3 h-px bg-[#b7cad1]/60"></div>
    </div>
    <div class="serif text-xl tracking-[.45em] ml-[.45em]">鲸屿</div>
    <div class="w-36 h-px bg-white/15 mt-5 overflow-hidden"><div id="load-line" class="h-full bg-[#e7bf7c]"></div></div>
    <div class="text-[9px] tracking-[.32em] text-white/35 mt-3">AWAKENING THE SKY</div>
  </div>

  <header class="ui fixed z-10 top-0 left-0 right-0 flex items-center justify-between px-5 py-5 md:px-9 md:py-7 pointer-events-none">
    <div class="flex items-center gap-4">
      <div class="serif text-2xl font-black tracking-[.24em]">鲸屿</div>
      <div class="hidden sm:block h-7 w-px bg-white/30"></div>
      <div class="hidden sm:block text-[9px] leading-[1.5] tracking-[.2em] text-white/55">AERIA CETUS<br>SKYBORNE TOWNSHIP</div>
    </div>
    <div class="flex items-center gap-3 text-[10px] tracking-[.25em] text-white/65">
      <span class="w-1.5 h-1.5 rounded-full bg-[#d9b875] shadow-[0_0_12px_#d9b875]"></span>
      LIVE SCENE
    </div>
  </header>

  <main class="ui hero-copy fixed z-10 bottom-10 left-9 max-w-sm pointer-events-none">
    <div class="flex items-center gap-3 mb-4"><div class="line"></div><span class="text-[10px] tracking-[.3em] text-[#eed69c]">云海航行纪 · 047</span></div>
    <h1 class="serif text-3xl md:text-5xl font-bold leading-tight tracking-[.08em]">风托起的故乡</h1>
    <p class="mt-3 max-w-xs text-xs md:text-sm font-light leading-6 text-white/66">古鲸巡游在暮光与云海之间。镇上的钟楼、风帆和每一道水渠，都随它的呼吸缓缓起伏。</p>
  </main>

  <aside class="desktop-note ui fixed z-10 right-9 top-1/2 -translate-y-1/2 flex flex-col items-center gap-4 pointer-events-none">
    <span class="text-[8px] tracking-[.28em] text-white/45 [writing-mode:vertical-rl]">DRAG TO ORBIT</span>
    <div class="compass-ring w-9 h-9 rounded-full border border-white/30 flex items-center justify-center"><div class="w-1 h-1 rounded-full bg-[#e7bf7c]"></div></div>
    <span class="text-[8px] tracking-[.2em] text-white/50">SCROLL</span>
  </aside>

  <div class="fixed z-10 bottom-7 right-5 md:right-9 flex gap-2">
    <button id="sound" class="glass w-10 h-10 rounded-full text-[10px] tracking-widest text-white/70 hover:bg-white/10 transition pointer-events-auto" aria-label="切换环境音">音</button>
    <button id="reset" class="glass px-4 h-10 rounded-full text-[9px] tracking-[.2em] text-white/70 hover:bg-white/10 transition pointer-events-auto">归航</button>
  </div>

  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const stage = document.getElementById('stage');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8c9eaa);
    scene.fog = new THREE.FogExp2(0x9fabb3, 0.0125);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    stage.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, .1, 500);
    camera.position.set(28, 17, 33);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = .045;
    controls.minDistance = 24;
    controls.maxDistance = 64;
    controls.maxPolarAngle = Math.PI * .58;
    controls.minPolarAngle = Math.PI * .18;
    controls.autoRotate = true;
    controls.autoRotateSpeed = .24;

    scene.add(new THREE.HemisphereLight(0xbad8e5, 0x34402e, 2.5));
    const sun = new THREE.DirectionalLight(0xffd7a1, 5.2);
    sun.position.set(-28, 32, 18); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28; sun.shadow.camera.right = 28; sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -20;
    sun.shadow.bias = -.0003; scene.add(sun);
    const rim = new THREE.DirectionalLight(0x82bada, 2.2); rim.position.set(25, 4, -22); scene.add(rim);

    const world = new THREE.Group();
    world.rotation.y = -.16;
    scene.add(world);

    function mat(color, rough=.75, metal=0) { return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }); }
    const whaleMat = mat(0x314f5b, .68);
    const bellyMat = mat(0x66818a, .9);
    const mossMat = mat(0x465d3d, 1);
    const mossLight = mat(0x71825a, 1);
    const stoneMat = mat(0x767b72, .94);
    const darkWood = mat(0x372a22, .88);
    const plaster = [mat(0xcbbd9f,.92), mat(0xa99375,.95), mat(0xd1c8b1,.96), mat(0x8f9a8a,.95)];
    const roofMats = [mat(0x70443d,.88), mat(0x3f5960,.86), mat(0x7b633d,.9), mat(0x4b493f,.92)];
    const brass = mat(0x9e793b,.34,.55);
    const waterMat = new THREE.MeshPhysicalMaterial({color:0x9dd9df, roughness:.12, metalness:.05, transparent:true, opacity:.72, transmission:.18});

    function mesh(geometry, material, parent=world, cast=true, receive=true) {
      const o = new THREE.Mesh(geometry, material); o.castShadow=cast; o.receiveShadow=receive; parent.add(o); return o;
    }

    // Whale anatomy: overlapping tapered volumes preserve a muscular, organic silhouette.
    const whale = new THREE.Group(); world.add(whale);
    const body = mesh(new THREE.SphereGeometry(1, 72, 40), whaleMat, whale); body.scale.set(12.8, 4.25, 4.9); body.position.set(-1.2, -.2, 0);
    const belly = mesh(new THREE.SphereGeometry(1, 64, 32, 0, Math.PI*2, Math.PI*.48, Math.PI*.52), bellyMat, whale); belly.scale.set(11.6, 4.05, 4.72); belly.position.set(-.8,-.28,0);
    const head = mesh(new THREE.SphereGeometry(1, 56, 32), whaleMat, whale); head.scale.set(6.7,3.75,4.75); head.position.set(8.25,.15,0);
    head.rotation.z=-.05;
    // Lower jaw and throat grooves.
    const jaw = mesh(new THREE.SphereGeometry(1,48,24), bellyMat,whale); jaw.scale.set(5.8,1.28,4.3); jaw.position.set(9.1,-2.1,.05);
    for(let i=0;i<10;i++){
      const groove=mesh(new THREE.TorusGeometry(3.25-i*.035,.025,5,40,Math.PI*.72),mat(0x425f68,.9),whale,false,false);
      groove.scale.set(1.35,.48,1); groove.rotation.set(Math.PI/2,0,-Math.PI/2); groove.position.set(7.4+i*.31,-2.55,-.02);
    }
    // Eyes sit slightly forward and outward.
    [-1,1].forEach(side=>{
      const eye=mesh(new THREE.SphereGeometry(.16,20,12),mat(0x080b0c,.18),whale); eye.position.set(10.65,.65,side*4.28);
      const glint=mesh(new THREE.SphereGeometry(.043,10,8),mat(0xffffff,.1),whale,false,false); glint.position.set(10.72,.71,side*4.39);
    });
    // Pectoral fins are flattened and angled downward, as if trimming lift.
    [-1,1].forEach(side=>{
      const fin=mesh(new THREE.SphereGeometry(1,36,18),whaleMat,whale); fin.scale.set(5.6,.42,1.35); fin.position.set(2.5,-2.5,side*4.35); fin.rotation.set(side*.08,side*.24,side*.56);
      fin.userData.side=side; fin.userData.base=fin.rotation.z;
    });
    // Narrow peduncle and broad asymmetric tail flukes.
    const tailStock=mesh(new THREE.CapsuleGeometry(1.2,5.4,12,24),whaleMat,whale); tailStock.rotation.z=Math.PI/2; tailStock.scale.set(1,1,.72); tailStock.position.set(-13.2,.3,0);
    const tailPivot=new THREE.Group(); tailPivot.position.set(-16.2,.35,0); whale.add(tailPivot);
    [-1,1].forEach(side=>{
      const fluke=mesh(new THREE.SphereGeometry(1,36,18),whaleMat,tailPivot); fluke.scale.set(3.25,.5,2.65); fluke.position.set(-.45,0,side*2.15); fluke.rotation.y=side*.42; fluke.rotation.z=side*.08;
    });

    // Moss mantle follows the whale's dorsal curve instead of floating as a flat island.
    const mantle=mesh(new THREE.SphereGeometry(1,64,30,0,Math.PI*2,0,Math.PI*.43),mossMat,whale); mantle.scale.set(10.5,3.8,4.35); mantle.position.set(-1.6,.22,0);
    const meadow=mesh(new THREE.SphereGeometry(1,56,24,0,Math.PI*2,0,Math.PI*.36),mossLight,whale); meadow.scale.set(7.5,3.9,3.7); meadow.position.set(-.2,.42,0);
    // Small clumps soften the biome edge.
    const tuftGeo=new THREE.ConeGeometry(.13,.5,5);
    for(let i=0;i<150;i++){
      const a=Math.random()*Math.PI*2, rx=(Math.random()-.5)*18;
      const z=Math.sin(a)*Math.sqrt(Math.max(0,1-(rx*rx/100)))*3.7;
      const y=3.65-(rx*rx/75)-(z*z/28)+Math.random()*.24;
      if(y<2.15) continue;
      const t=mesh(tuftGeo, Math.random()>.5?mossMat:mossLight, whale, false, true);
      t.position.set(rx-1,y,z); t.rotation.z=(Math.random()-.5)*.28; t.scale.y=.5+Math.random();
    }

    const town=new THREE.Group(); town.position.y=.05; whale.add(town);
    function terrainY(x,z){ return 4.08 - (x*x/72) - (z*z/23); }
    function building(x,z,w,h,d,roofType=0){
      const g=new THREE.Group(); g.position.set(x,terrainY(x,z)+h/2,z); town.add(g);
      const base=mesh(new THREE.BoxGeometry(w,h,d),plaster[Math.floor(Math.random()*plaster.length)],g); base.position.y=0;
      // Timber framing gives readable construction logic.
      const beam=.075;
      [-1,1].forEach(s=>{ const b=mesh(new THREE.BoxGeometry(beam,h*.92,beam),darkWood,g); b.position.set(s*(w/2+.012),0,d/2+.015); });
      const cross=mesh(new THREE.BoxGeometry(w+.1,beam,beam),darkWood,g); cross.position.set(0,0,d/2+.02);
      const roof=mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,h*.45,roofType?6:4),roofMats[Math.floor(Math.random()*roofMats.length)],g);
      roof.position.y=h*.66; roof.rotation.y=roofType?0:Math.PI*.25;
      const winMat=new THREE.MeshStandardMaterial({color:0xffc66c,emissive:0xe68a32,emissiveIntensity:2.4,roughness:.5});
      const win=mesh(new THREE.PlaneGeometry(w*.22,h*.2),winMat,g,false,false); win.position.set(0,.05,d/2+.026);
      const sill=mesh(new THREE.BoxGeometry(w*.3,.06,.11),darkWood,g); sill.position.set(0,-h*.08,d/2+.05);
      return g;
    }
    const homes=[[-5,-2.1,1.3,1.6,1.1],[-5.8,.2,1.1,1.45,1],[-4.2,2.0,1.35,1.7,1.1],[-2.5,-2.35,1.2,1.4,1],[-2.1,2.25,1.15,1.55,1.1],[.1,-2.35,1.3,1.7,1.1],[.7,2.4,1.25,1.5,1.05],[3.2,-1.8,1.4,1.75,1.15],[4.1,1.5,1.1,1.35,1],[6,-.4,1.2,1.5,1]];
    homes.forEach((v,i)=>building(...v,i%3===0?1:0));
    // Curved main path conforms to the back.
    const pathPoints=[]; for(let i=0;i<30;i++){ const x=-7+i*.48; const z=Math.sin(i*.38)*.42; pathPoints.push(new THREE.Vector3(x,terrainY(x,z)+.08,z)); }
    const path=mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pathPoints),80,.22,7,false),stoneMat,town,false,true);

    // Clock tower, the town's visual and structural anchor.
    const tower=new THREE.Group(); tower.position.set(0,terrainY(0,0),0); town.add(tower);
    const towerBase=mesh(new THREE.CylinderGeometry(.92,1.12,4.7,8),plaster[0],tower); towerBase.position.y=2.35;
    for(let y=.6;y<4.4;y+=.8){ const band=mesh(new THREE.CylinderGeometry(1.02,1.02,.09,8),darkWood,tower); band.position.y=y; }
    const towerRoof=mesh(new THREE.ConeGeometry(1.35,2.1,8),roofMats[1],tower); towerRoof.position.y=5.7;
    const clockMat=mat(0xe2d5ad,.45);
    [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(a=>{
      const c=mesh(new THREE.CylinderGeometry(.48,.48,.07,32),clockMat,tower); c.rotation.set(Math.PI/2,0,a); c.position.set(Math.sin(a)*.94,4.35,Math.cos(a)*.94);
      const hand=mesh(new THREE.BoxGeometry(.045,.39,.04),darkWood,c); hand.position.y=.08; hand.rotation.z=.5;
    });
    const vane=mesh(new THREE.CylinderGeometry(.035,.035,1.5,8),brass,tower); vane.position.y=7.45;
    const arrow=mesh(new THREE.ConeGeometry(.12,.55,5),brass,tower); arrow.rotation.z=-Math.PI/2; arrow.position.set(.25,7.75,0);

    // Water tank feeds two channels and waterfalls over the flank.
    const cistern=mesh(new THREE.CylinderGeometry(1.15,1.35,.36,28),stoneMat,town); cistern.position.set(-6.8,terrainY(-6.8,1.8)+.18,1.8);
    const basin=mesh(new THREE.CylinderGeometry(.92,.92,.13,28),waterMat,town,false,false); basin.position.copy(cistern.position); basin.position.y+=.22;
    const falls=[];
    [[-6.9,2.6],[-3.3,-3.65],[4.1,3.4]].forEach(([x,z],idx)=>{
      const y=terrainY(x,Math.max(-3,Math.min(3,z)))+.1;
      const stream=mesh(new THREE.CylinderGeometry(.13+idx*.025,.055,7.5,9,8,true),waterMat,town,false,false);
      stream.position.set(x,y-3.65,z); stream.userData.flow=idx*Math.PI*.8; falls.push(stream);
      const mist=mesh(new THREE.SphereGeometry(.65,16,10),new THREE.MeshBasicMaterial({color:0xd7edf0,transparent:true,opacity:.15,depthWrite:false}),town,false,false);
      mist.position.set(x,y-7.2,z); mist.scale.set(1.4,.4,1.2);
    });

    // Windmill responds continuously to airflow.
    const mill=new THREE.Group(); mill.position.set(5.25,terrainY(5.25,2.1),2.1); mill.rotation.y=-.35; town.add(mill);
    const millBody=mesh(new THREE.CylinderGeometry(.52,.76,2.6,10),plaster[2],mill); millBody.position.y=1.3;
    const millCap=mesh(new THREE.ConeGeometry(.88,.9,10),roofMats[2],mill); millCap.position.y=3;
    const rotor=new THREE.Group(); rotor.position.set(0,2.25,.68); mill.add(rotor);
    const hub=mesh(new THREE.CylinderGeometry(.16,.16,.28,16),brass,rotor); hub.rotation.x=Math.PI/2;
    for(let i=0;i<4;i++){
      const blade=mesh(new THREE.BoxGeometry(.17,1.35,.07),darkWood,rotor); blade.position.y=.72; blade.rotation.z=i*Math.PI/2;
      const sail=mesh(new THREE.PlaneGeometry(.38,.92),new THREE.MeshStandardMaterial({color:0xd6c9a8,side:THREE.DoubleSide,roughness:.95}),blade); sail.position.set(.12,.2,.05);
    }

    // Mooring mast, ropes and hanging lanterns communicate believable wind and weight.
    const mast=mesh(new THREE.CylinderGeometry(.07,.11,5.5,10),darkWood,town); mast.position.set(-7.8,terrainY(-7.8,-1.1)+2.6,-1.1);
    const ropeMat=new THREE.LineBasicMaterial({color:0x5d4d3c,transparent:true,opacity:.85});
    const ropes=[];
    for(let i=0;i<5;i++){
      const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()]);
      const line=new THREE.Line(lineGeo,ropeMat); town.add(line); line.userData.phase=i*1.1; ropes.push(line);
    }
    const lanterns=[];
    homes.slice(0,7).forEach((v,i)=>{
      const l=mesh(new THREE.SphereGeometry(.1,10,8),new THREE.MeshStandardMaterial({color:0xffb34e,emissive:0xff8a25,emissiveIntensity:4}),town,false,false);
      l.position.set(v[0]+.55,terrainY(v[0],v[1])+.45,v[1]+.65); lanterns.push(l);
    });

    // Distant balloon reinforces scale and drifts independently of the whale.
    const balloon=new THREE.Group(); balloon.position.set(-17,13,-13); scene.add(balloon);
    const envelope=mesh(new THREE.SphereGeometry(1,28,20),mat(0x9f594b,.74),balloon); envelope.scale.set(1.35,1.8,1.35);
    for(let i=0;i<8;i++){ const rib=mesh(new THREE.TorusGeometry(1.36,.025,5,42,Math.PI),brass,balloon); rib.scale.y=1.35; rib.rotation.set(0,i*Math.PI/4,Math.PI/2); }
    const basket=mesh(new THREE.BoxGeometry(.7,.5,.6),darkWood,balloon); basket.position.y=-2.35;
    [-.35,.35].forEach(x=>[-.3,.3].forEach(z=>{ const r=mesh(new THREE.CylinderGeometry(.012,.012,1.25,5),darkWood,balloon); r.position.set(x,-1.6,z); }));

    // Layered cloud sprites create a deep, continuously moving cloud ocean.
    function cloudTexture(){
      const c=document.createElement('canvas'); c.width=c.height=256; const ctx=c.getContext('2d');
      const g=ctx.createRadialGradient(128,128,8,128,128,124); g.addColorStop(0,'rgba(255,255,255,.94)'); g.addColorStop(.35,'rgba(242,246,244,.78)'); g.addColorStop(.72,'rgba(210,224,229,.28)'); g.addColorStop(1,'rgba(190,210,218,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
    }
    const cloudTex=cloudTexture(), clouds=[];
    for(let i=0;i<75;i++){
      const sm=new THREE.SpriteMaterial({map:cloudTex,color:i%5===0?0xe7c2ad:0xdde8e8,transparent:true,opacity:.28+Math.random()*.35,depthWrite:false});
      const s=new THREE.Sprite(sm); const ring=30+Math.random()*115, a=Math.random()*Math.PI*2;
      s.position.set(Math.cos(a)*ring,-10-Math.random()*10,Math.sin(a)*ring); const scale=16+Math.random()*24; s.scale.set(scale,scale*.48,1); s.userData.speed=.09+Math.random()*.16; scene.add(s); clouds.push(s);
    }
    // Sparse atmospheric motes catch the light near the town.
    const pCount=420, pos=new Float32Array(pCount*3);
    for(let i=0;i<pCount;i++){ pos[i*3]=(Math.random()-.5)*38; pos[i*3+1]=Math.random()*18-5; pos[i*3+2]=(Math.random()-.5)*24; }
    const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const motes=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffe0a0,size:.055,transparent:true,opacity:.55,depthWrite:false})); world.add(motes);

    // A periodic breath plume rises fast, spreads, then falls away under gravity and crosswind.
    const blowhole=mesh(new THREE.TorusGeometry(.17,.045,8,20),mat(0x172f37,.96),whale); blowhole.rotation.x=Math.PI/2; blowhole.position.set(8.25,3.88,0);
    const breathCount=42, breathData=new Float32Array(breathCount*3), breathPhase=[];
    for(let i=0;i<breathCount;i++) breathPhase.push(i*.045+Math.random()*.12);
    const breathGeo=new THREE.BufferGeometry(); breathGeo.setAttribute('position',new THREE.BufferAttribute(breathData,3));
    const breath=new THREE.Points(breathGeo,new THREE.PointsMaterial({color:0xe9f6f4,size:.18,transparent:true,opacity:.58,depthWrite:false,sizeAttenuation:true})); whale.add(breath);

    const clock=new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t=clock.getElapsedTime();
      // A long, low-amplitude body cycle reads as mass rather than hovering jitter.
      world.position.y=Math.sin(t*.42)*.34;
      world.rotation.z=Math.sin(t*.3)*.012;
      whale.rotation.z=Math.sin(t*.42-.6)*.012;
      tailPivot.rotation.z=Math.sin(t*.85)*.1;
      tailPivot.rotation.y=Math.sin(t*.43)*.045;
      whale.children.filter(o=>o.userData.side).forEach(f=>f.rotation.z=f.userData.base+Math.sin(t*.55+f.userData.side)*.035);
      rotor.rotation.z=-t*1.35;
      vane.rotation.y=Math.sin(t*.28)*.4;
      falls.forEach((f,i)=>{ f.material.opacity=.62+Math.sin(t*2.8+f.userData.flow)*.09; f.scale.x=1+Math.sin(t*3+i)*.08; });
      ropes.forEach((r,i)=>{
        const p=.13*Math.sin(t*1.1+r.userData.phase);
        const arr=r.geometry.attributes.position.array;
        arr[0]=-7.8; arr[1]=terrainY(-7.8,-1.1)+5.2; arr[2]=-1.1;
        arr[3]=-6.7+i*2.45; arr[4]=1.4+p; arr[5]=-4.5-Math.abs(2-i)*.5;
        arr[6]=-5.7+i*2.25; arr[7]=-1.4; arr[8]=-5.8; r.geometry.attributes.position.needsUpdate=true;
      });
      lanterns.forEach((l,i)=>l.scale.setScalar(1+Math.sin(t*3.2+i)*.06));
      balloon.position.y=13+Math.sin(t*.32)*.55; balloon.rotation.z=Math.sin(t*.23)*.025;
      clouds.forEach(c=>{ c.position.x+=c.userData.speed*.012; if(c.position.x>120)c.position.x=-120; });
      motes.rotation.y=t*.012; motes.position.y=Math.sin(t*.25)*.25;
      const breathPos=breath.geometry.attributes.position.array;
      for(let i=0;i<breathCount;i++){
        const age=(t+breathPhase[i])%7;
        if(age<2.1){
          breathPos[i*3]=8.25-age*.48+Math.sin(i*12.7)*age*.12;
          breathPos[i*3+1]=3.95+age*3.6-age*age*.72;
          breathPos[i*3+2]=Math.cos(i*9.3)*age*.22;
        } else { breathPos[i*3+1]=-100; }
      }
      breath.geometry.attributes.position.needsUpdate=true;
      controls.update(); renderer.render(scene,camera);
    }

    function resetView(){ camera.position.set(28,17,33); controls.target.set(0,3.5,0); controls.autoRotate=true; }
    document.getElementById('reset').addEventListener('click',resetView);
    controls.addEventListener('start',()=>controls.autoRotate=false);

    // Lightweight synthesized wind ambience; begins only after user interaction.
    let audioCtx, source, gain, sounding=false;
    document.getElementById('sound').addEventListener('click',()=>{
      const btn=document.getElementById('sound');
      if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        const length=audioCtx.sampleRate*2, buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate), data=buffer.getChannelData(0);
        let last=0; for(let i=0;i<length;i++){ const white=Math.random()*2-1; data[i]=(last*.985+white*.015)*.7; last=data[i]; }
        source=audioCtx.createBufferSource(); source.buffer=buffer; source.loop=true;
        const filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=430; filter.Q.value=.42;
        gain=audioCtx.createGain(); gain.gain.value=0; source.connect(filter).connect(gain).connect(audioCtx.destination); source.start();
      }
      sounding=!sounding; gain.gain.cancelScheduledValues(audioCtx.currentTime); gain.gain.linearRampToValueAtTime(sounding ? .065 : 0,audioCtx.currentTime+.5);
      btn.style.color=sounding?'#eed69c':''; btn.textContent=sounding?'静':'音';
    });

    addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
    animate();
    setTimeout(()=>document.getElementById('loader').classList.add('hide'),2100);
  </script>
