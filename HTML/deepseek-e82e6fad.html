<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>回声 ECHO · 第一人称像素恐怖短片</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <!-- 256x144 的低分辨率画布，靠 CSS 放大并保持像素硬边 -->
  <canvas id="screen" width="256" height="144"></canvas>

  <!-- 纯 CSS 的 CRT 扫描线 + 暗角 + 闪烁 -->
  <div id="overlay"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="rec"><i></i>REC&nbsp;·&nbsp;03:07</div>
    <div id="card"><div class="ct"></div><div class="cs"></div></div>
    <div id="sub"></div>
    <div id="hint"></div>
  </div>

  <div id="title">
    <div class="t1">回&nbsp;声</div>
    <div class="t2">E&nbsp;C&nbsp;H&nbsp;O</div>
    <div class="t3">第一人称像素恐怖短片</div>
    <div class="t4">点 击 开 始</div>
    <div class="t5">建议佩戴耳机 · 拖动鼠标可环视</div>
  </div>
</div>
<script src="game.js"></script>

<!-- source: deepdemos.top | author: yyh_001 | title: deepseek恐怖短片 《回声》 -->
</body>
</html>
