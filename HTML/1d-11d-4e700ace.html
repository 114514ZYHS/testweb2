<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>N维几何体 · 1D–11D · 增强材质管线</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#01030a}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#bfe0ff;-webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #stage.gaming{cursor:crosshair}

  #shapeSwitch{
    position:fixed;top:14px;right:14px;display:flex;gap:4px;padding:4px;
    background:rgba(6,18,38,.8);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(70,160,255,.25);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,60,160,.3);z-index:11;
  }
  .shapeb{
    padding:8px 12px;border-radius:8px;border:none;background:transparent;
    color:#8ec8ff;font-size:12px;font-weight:600;cursor:pointer;
    transition:.2s;font-family:inherit;letter-spacing:.04em;
  }
  .shapeb:hover{background:rgba(70,160,255,.15)}
  .shapeb.active{
    background:linear-gradient(135deg,rgba(30,140,255,.5),rgba(0,220,255,.35));
    color:#e6faff;box-shadow:0 0 12px rgba(50,180,255,.45);
  }

  #panel{
    position:fixed;top:14px;left:14px;width:322px;
    max-height:calc(100dvh - 28px);
    display:flex;flex-direction:column;
    background:rgba(6,18,38,.82);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(70,160,255,.25);border-radius:14px;
    box-shadow:0 10px 40px rgba(0,60,160,.35),inset 0 1px 0 rgba(140,210,255,.12);
    font-size:12px;color:#bfe0ff;z-index:10;overflow:hidden;
    transition:max-height .35s cubic-bezier(.4,0,.2,1);
  }
  #panel.collapsed{max-height:46px}
  #panelHead{
    display:flex;align-items:center;gap:8px;padding:13px 14px;flex:0 0 auto;
    border-bottom:1px solid rgba(70,160,255,.15);
  }
  #panelHead .dot{
    width:7px;height:7px;border-radius:50%;background:#4fd8ff;
    box-shadow:0 0 10px #4fd8ff,0 0 20px #2a9dff;
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  #panelHead h1{font-size:11.5px;font-weight:600;letter-spacing:.14em;color:#9fd4ff;flex:1}
  #collapseBtn{
    width:22px;height:22px;border-radius:6px;cursor:pointer;
    background:rgba(70,160,255,.12);border:1px solid rgba(70,160,255,.25);
    color:#8ec8ff;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  #collapseBtn:hover{background:rgba(70,160,255,.28)}

  #panelBody{overflow-y:auto;overflow-x:hidden;flex:1 1 auto;padding-bottom:6px}
  #panelBody::-webkit-scrollbar{width:5px}
  #panelBody::-webkit-scrollbar-thumb{background:rgba(70,160,255,.35);border-radius:3px}
  #panelBody::-webkit-scrollbar-track{background:transparent}

  .group{padding:10px 14px 2px}
  .gtitle{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:#5c9fd6;font-weight:600;margin-bottom:9px;
    display:flex;align-items:center;gap:6px;
  }
  .gtitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(70,160,255,.3),transparent)}

  .slider{margin-bottom:9px}
  .slabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;color:#9ccaf0}
  .slabel sub{font-size:9px}
  .sval{color:#62d8ff;font-variant-numeric:tabular-nums;font-size:11px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    outline:none;cursor:pointer;background:linear-gradient(90deg,#0a2f5c,#1e7fd0);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#a8e4ff,#3aa0ff);
    box-shadow:0 0 10px rgba(70,180,255,.9);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:none;border-radius:50%;background:#5cc4ff;
    box-shadow:0 0 10px rgba(70,180,255,.9);cursor:pointer;
  }

  .dimrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}
  .dimb{
    padding:7px 0;border-radius:7px;cursor:pointer;
    background:rgba(70,160,255,.1);border:1px solid rgba(70,160,255,.25);
    color:#8ec8ff;font-size:11px;font-weight:600;
    font-family:inherit;transition:.15s;letter-spacing:.02em;
  }
  .dimb:hover{background:rgba(70,160,255,.22)}
  .dimb.active{
    background:linear-gradient(135deg,rgba(30,140,255,.6),rgba(0,220,255,.4));
    border-color:rgba(90,220,255,.8);color:#e6faff;
    box-shadow:0 0 12px rgba(50,180,255,.5);
  }

  .patrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}
  .patb{
    padding:7px 0;border-radius:7px;cursor:pointer;
    background:rgba(70,160,255,.1);border:1px solid rgba(70,160,255,.25);
    color:#8ec8ff;font-size:10.5px;font-weight:600;
    font-family:inherit;transition:.15s;
  }
  .patb:hover{background:rgba(70,160,255,.22)}
  .patb.active{
    background:linear-gradient(135deg,rgba(255,140,60,.5),rgba(255,220,80,.35));
    border-color:rgba(255,200,100,.7);color:#fff5e0;
    box-shadow:0 0 12px rgba(255,180,60,.4);
  }

  .swrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 0;color:#9ccaf0;cursor:pointer;user-select:none;
  }
  .sw{
    width:34px;height:18px;border-radius:9px;position:relative;
    background:rgba(70,160,255,.15);border:1px solid rgba(70,160,255,.3);
    transition:.25s;flex:0 0 auto;

  .sw::after{

    border-radius:50%;background:#5a8fc0;transition:.25s;
  }
  .sw.on{background:rgba(60,200,255,.3);border-color:rgba(90,220,255,.7)}

  .infobox{
    margin-top:6px;padding:8px 10px;border-radius:8px;

  }
  .infobox b{color:#a8e0ff;font-weight:600}

  .warnbox{
    margin-top:4px;padding:6px 10px;border-radius:7px;
    background:rgba(120,80,20,.3);border:1px solid rgba(255,180,60,.3);
    font-size:10px;color:#ffd28a;line-height:1.5;
  }

  #panelFoot{
    display:grid;grid-template-columns:1.4fr 1fr;gap:7px;
    padding:10px 14px 12px;flex:0 0 auto;border-top:1px solid rgba(70,160,255,.15);
  }
  #panelFoot button{
    padding:8px 6px;border-radius:9px;cursor:pointer;font-size:11.5px;
    font-weight:600;letter-spacing:.04em;
    background:rgba(70,160,255,.12);color:#9fd4ff;
    border:1px solid rgba(70,160,255,.28);transition:.2s;font-family:inherit;
  }
  #panelFoot button:hover{background:rgba(70,160,255,.26);color:#d6efff}
  #panelFoot button.primary{
    background:linear-gradient(135deg,rgba(30,140,255,.5),rgba(0,220,255,.35));
    border-color:rgba(90,220,255,.6);color:#e6faff;
    box-shadow:0 0 16px rgba(50,180,255,.3);
  }
  #panelFoot button.primary:hover{box-shadow:0 0 26px rgba(50,200,255,.55)}

  #hint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11px;color:rgba(120,180,230,.55);letter-spacing:.06em;
    pointer-events:none;white-space:nowrap;z-index:5;
  }
  @media (max-width:640px){
    #panel{width:calc(100vw - 28px);max-height:44dvh}
    #hint{font-size:10px}
    #shapeSwitch{top:auto;bottom:52px;right:14px}
    .shapeb{padding:6px 9px;font-size:11px}
    .dimrow,.patrow{grid-template-columns:repeat(6,1fr);gap:3px}
    .dimb{font-size:10px;padding:6px 0}
    .patb{font-size:9.5px;padding:6px 0}
  }
</style>

<body>

<canvas id="stage"></canvas>

<div id="shapeSwitch">
  <button class="shapeb active" data-shape="hypercube">超立方体</button>
  <button class="shapeb" data-shape="simplex">单纯形</button>
  <button class="shapeb" data-shape="cross">正轴体</button>
</div>

<div id="panel">
  <div id="panelHead">
    <span class="dot"></span>
    <h1>N-D GEOMETRY · ENHANCED</h1>
    <button id="collapseBtn" title="折叠 / 展开">−</button>
  </div>
  <div id="panelBody"></div>
  <div id="panelFoot">
    <button id="btnGame" class="primary">▶ 开始游戏</button>
    <button id="btnPause">⏸ 暂停</button>
  </div>
</div>

<div id="hint">拖动旋转视角 · 空格 / 点击 开火</div>

<script>
(function () {
'use strict';

/* ============================================================================
 * 基础工具
 * ========================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
const AXIS_NAMES = ['X','Y','Z','W','V','U','T','S','R','Q','P'];
const MAX_DIM = 11;

const TILE_SIZE = 256;         // 纹理 tile 尺寸（2 的幂，GPU 友好）
const NOISE_GRID = 32;         // 噪声格点尺寸

// 世界空间主光源方向（已归一化，指向光源）
const LIGHT = (() => {
  const x = -0.45, y = -0.72, z = 0.62;
  const l = Math.sqrt(x*x + y*y + z*z);
  return [x/l, y/l, z/l];
})();

/* ============================================================================
 * 画布
 * ========================================================================== */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, DPR = 1, bgGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  bgGrad = ctx.createRadialGradient(W * .5, H * .5, 0, W * .5, H * .5, Math.max(W, H) * .78);
  bgGrad.addColorStop(0.00, '#0a1c3d');
  bgGrad.addColorStop(0.42, '#050d20');
  bgGrad.addColorStop(1.00, '#01030a');
}
window.addEventListener('resize', resize);

/* ============================================================================
 * 程序化纹理系统
 *   - 值噪声 + FBM（分形布朗运动）
 *   - 所有 tile 一次性预渲染并缓存（P0：纹理预渲染 + 缓存）
 * ========================================================================== */
const PATTERN_KEYS   = ['checker','stripes','dots','grid','noise','solid'];
const PATTERN_LABELS = ['棋盘','斜纹','圆点','网格','噪声','纯色'];

const DRAWERS = {};

/* ---------- 值噪声 + FBM ---------- */
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function makeValueNoise(gridSize, seed) {
  const rnd = makeRng(seed);
  const g = new Float32Array(gridSize * gridSize);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const gs = gridSize;
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % gs) + gs) % gs, x1 = (x0 + 1) % gs;
    const y0 = ((yi % gs) + gs) % gs, y1 = (y0 + 1) % gs;
    const a = g[y0 * gs + x0], b = g[y0 * gs + x1];
    const c = g[y1 * gs + x0], d = g[y1 * gs + x1];
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  };
}

function fbm(noise, x, y, octaves, lac, gain) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise(x * f, y * f) * amp;
    norm += amp;
    amp *= gain;
    f *= lac;
  }
  return norm > 0 ? sum / norm : 0;
}

/* ---------- 各纹理绘制器 ---------- */
DRAWERS.checker = function (g, s) {
  const n = 8, cell = s / n;
  g.fillStyle = '#06193a';
  g.fillRect(0, 0, s, s);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      if ((x + y) & 1) {
        const grd = g.createLinearGradient(x * cell, y * cell, (x + 1) * cell, (y + 1) * cell);
        grd.addColorStop(0, 'rgba(130,230,255,0.80)');
        grd.addColorStop(1, 'rgba(50,140,225,0.55)');
        g.fillStyle = grd;
        g.fillRect(x * cell, y * cell, cell, cell);
      }
    }
  }
  // 细描边强化棋盘格
  g.strokeStyle = 'rgba(20,60,110,0.5)';
  g.lineWidth = 1;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * cell, 0); g.lineTo(i * cell, s); g.stroke();
    g.beginPath(); g.moveTo(0, i * cell); g.lineTo(s, i * cell); g.stroke();
  }
};

DRAWERS.stripes = function (g, s) {
  g.fillStyle = '#062044';
  g.fillRect(0, 0, s, s);
  g.save();
  g.translate(s / 2, s / 2);
  g.rotate(Math.PI / 4);
  g.translate(-s, -s);
  const period = 18;
  for (let i = 0; i < s * 2 / period + 1; i++) {
    const grd = g.createLinearGradient(i * period, 0, (i + 1) * period, 0);
    grd.addColorStop(0,   'rgba(70,170,255,0.15)');
    grd.addColorStop(0.5, 'rgba(140,235,255,0.68)');
    grd.addColorStop(1,   'rgba(70,170,255,0.15)');
    g.fillStyle = grd;
    g.fillRect(i * period, 0, period, s * 2);
  }
  g.restore();
};

DRAWERS.dots = function (g, s) {
  g.clearRect(0, 0, s, s);
  const n = 6, cell = s / n;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const off = ((x + y) & 1) ? cell * 0.5 : 0;
      const cx = x * cell + cell * 0.5 + off;
      const cy = y * cell + cell * 0.5;
      const r  = cell * 0.17;
      const grd = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r * 1.6);
      grd.addColorStop(0,    'rgba(200,250,255,0.95)');
      grd.addColorStop(0.45, 'rgba(110,215,255,0.72)');
      grd.addColorStop(1,    'rgba(50,140,225,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(cx, cy, r * 1.6, 0, TAU);
      g.fill();
    }
  }
};

DRAWERS.grid = function (g, s) {
  g.clearRect(0, 0, s, s);
  const n = 8, cell = s / n;
  // 主线
  g.strokeStyle = 'rgba(120,220,255,0.62)';
  g.lineWidth = 2;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * cell, 0); g.lineTo(i * cell, s); g.stroke();
    g.beginPath(); g.moveTo(0, i * cell); g.lineTo(s, i * cell); g.stroke();
  }
  // 子线
  g.strokeStyle = 'rgba(80,170,240,0.22)';
  g.lineWidth = 1;
  const sub = 4;
  for (let i = 0; i <= n * sub; i++) {
    const p = i * cell / sub;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, s); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(s, p); g.stroke();
  }
};

let _noiseImageData = null;
DRAWERS.noise = function (g, s) {
  if (!_noiseImageData) {
    const n1 = makeValueNoise(NOISE_GRID, 1337);
    const n2 = makeValueNoise(NOISE_GRID * 2, 4242);
    const img = g.createImageData(s, s);
    const d = img.data;
    for (let y = 0; y < s; y++) {
      for (let x = 0; x < s; x++) {
        const u = x / s * 4, v = y / s * 4;
        const base = fbm(n1, u, v, 5, 2.0, 0.5);
        const det  = fbm(n2, u * 2.4, v * 2.4, 3, 2.0, 0.5);
        const t = clamp(base * 0.72 + det * 0.28, 0, 1);
        const t2 = t * t * (3 - 2 * t);         // smoothstep 增强对比
        const i = (y * s + x) * 4;
        d[i]     = 30 + t2 * 70;                // R
        d[i + 1] = 90 + t2 * 145;               // G
        d[i + 2] = 170 + t2 * 85;               // B
        d[i + 3] = 45 + t2 * 190;               // A
      }
    }
    _noiseImageData = img;
  }
  g.putImageData(_noiseImageData, 0, 0);
};

DRAWERS.solid = function (g, s) { g.clearRect(0, 0, s, s); };

/* ---------- Tile 缓存 ---------- */
const tileCache = {};
function getTile(key) {
  if (tileCache[key]) return tileCache[key];
  const c = document.createElement('canvas');
  c.width = c.height = TILE_SIZE;
  const g = c.getContext('2d');
  (DRAWERS[key] || DRAWERS.solid)(g, TILE_SIZE);
  tileCache[key] = c;
  return c;
}

// Pattern 对象缓存（依赖主 ctx，因此单独持有）
const patternObjects = {};
function ensurePatterns() {
  for (const k of PATTERN_KEYS) {
    if (!patternObjects[k]) {
      patternObjects[k] = ctx.createPattern(getTile(k), 'repeat');
    }
  }
}

/* ============================================================================
 * 几何构建器（与原实现保持一致）
 * ========================================================================== */
function buildHypercube(n) {
  const count = 1 << n;
  const verts = [];
  for (let i = 0; i < count; i++) {
    const v = new Array(n);
    for (let j = 0; j < n; j++) v[j] = (i >> j) & 1 ? 1 : -1;
    verts.push(v);
  }
  const edges = [];
  for (let i = 0; i < count; i++) {
    for (let j = i + 1; j < count; j++) {
      const x = i ^ j;
      if (x !== 0 && (x & (x - 1)) === 0) edges.push([i, j]);
    }
  }
  const faces = [];
  if (n >= 2) {
    for (let a = 0; a < n; a++) {
      for (let b = a + 1; b < n; b++) {
        const aBit = 1 << a, bBit = 1 << b;
        const numFixed = 1 << (n - 2);
        for (let m = 0; m < numFixed; m++) {
          let base = 0, mi = 0;
          for (let k = 0; k < n; k++) {
            if (k === a || k === b) continue;
            if ((m >> mi) & 1) base |= (1 << k);
            mi++;
          }
          faces.push([base, base | aBit, base | aBit | bBit, base | bBit]);
        }
      }
    }
  }
  return { verts, edges, faces };
}

function buildSimplex(n) {
  const count = n + 1;
  const verts = [];
  for (let i = 0; i < count; i++) {
    const v = new Array(n);
    for (let k = 0; k < n; k++) {
      const denom = Math.sqrt((k + 1) * (k + 2));
      if (i <= k) v[k] = 1 / denom;
      else if (i === k + 1) v[k] = -(k + 1) / denom;
      else v[k] = 0;
    }
    verts.push(v);
  }
  const centroid = new Array(n).fill(0);
  for (const v of verts) for (let k = 0; k < n; k++) centroid[k] += v[k] / count;
  for (const v of verts) for (let k = 0; k < n; k++) v[k] -= centroid[k];

  let curR = 0;
  for (const v of verts) {
    let d2 = 0;
    for (let k = 0; k < n; k++) d2 += v[k] * v[k];
    const d = Math.sqrt(d2);
    if (d > curR) curR = d;
  }
  const targetR = Math.sqrt(n);
  if (curR > 1e-9) {
    const sc = targetR / curR;
    for (const v of verts) for (let k = 0; k < n; k++) v[k] *= sc;
  }

  const edges = [];
  for (let i = 0; i < count; i++)
    for (let j = i + 1; j < count; j++) edges.push([i, j]);

  const faces = [];
  for (let i = 0; i < count; i++)
    for (let j = i + 1; j < count; j++)
      for (let k = j + 1; k < count; k++) faces.push([i, j, k]);

  return { verts, edges, faces };
}

function buildCross(n) {
  const count = 2 * n;
  const verts = [];
  const targetR = Math.sqrt(n);
  for (let i = 0; i < n; i++) {
    const v1 = new Array(n).fill(0); v1[i] = targetR;
    const v2 = new Array(n).fill(0); v2[i] = -targetR;
    verts.push(v1, v2);
  }
  const edges = [];
  for (let i = 0; i < count; i++)
    for (let j = i + 1; j < count; j++)
      if (Math.floor(i / 2) !== Math.floor(j / 2)) edges.push([i, j]);

  const faces = [];
  if (n >= 3) {
    for (let a = 0; a < n; a++)
      for (let b = a + 1; b < n; b++)
        for (let c = b + 1; c < n; c++)
          for (let s1 = 0; s1 < 2; s1++)
            for (let s2 = 0; s2 < 2; s2++)
              for (let s3 = 0; s3 < 2; s3++)
                faces.push([2*a + s1, 2*b + s2, 2*c + s3]);
  }
  return { verts, edges, faces };
}

const SHAPE_BUILDERS = {
  hypercube: buildHypercube,
  simplex:   buildSimplex,
  cross:     buildCross
};

/* ============================================================================
 * 全局状态（使用 TypedArray 避免 GC 抖动）
 * ========================================================================== */
const state = {
  n: 4,
  shape: 'hypercube',

  vertCount: 0,
  vertData: null,      // Float64Array(vertCount * n)
  edgeData: null,      // Int32Array(edgeCount * 2)
  faces: [],
  planes: [],
  axisDist: [],
  world3: null,        // Float64Array(vertCount * 3)  — 3D 世界坐标（用于法线）
  screen: [],          // {x, y, depth, near, ok}
  _out: null,          // Float64Array(n)  — 顶点变换复用缓冲

  pattern: 'noise',
  maxFaces: 400,
  minFaceArea: 24
};

const params = {
  camR: 8.0,
  fov: 50,
  timeScale: 1.0,
  glow: 1.0,
  edgeW: 1.4,
  vertSize: 0.9,
  faceAlpha: 0.85,
  faceOn: true,
  texOn: true,
  texRepeat: 4,
  showVerts: true,
  autoOrbit: false,
  paused: false,
  // —— 新增：光照
  lightOn: true,
  lightIntensity: 0.9,
  rimStrength: 0.55
};

let t4 = 0;
let camYaw = 0.55;
let camPitch = 0.32;
let last = performance.now();

/* ============================================================================
 * 默认角速度 & 高维降速
 * ========================================================================== */
function getDefaultSpeeds(n) {
  if (n === 1) return [];
  if (n === 2) return [0.30];
  if (n === 3) return [0.28, 0.00, 0.42];
  const s = new Array(n * (n - 1) / 2).fill(0);
  let idx = 0;
  for (let a = 0; a < n; a++) {
    for (let b = a + 1; b < n; b++) {
      if (b - a === 1) s[idx] = 0.28 + (a % 3) * 0.06;
      else if (a === 0 && b === n - 1) s[idx] = 0.35;
      idx++;
    }
  }
  return s;
}

function getAutoTimeFactor(n) {
  if (n <= 4) return 1.0;
  if (n === 5) return 0.85;
  if (n === 6) return 0.70;
  if (n === 7) return 0.55;
  if (n === 8) return 0.40;
  if (n === 9) return 0.30;
  if (n === 10) return 0.20;
  return 0.15;
}

/* ============================================================================
 * 几何重建
 * ========================================================================== */
function rebuildGeometry(n, shapeKey) {
  state.n = n;
  state.shape = shapeKey || state.shape;

  const geom = SHAPE_BUILDERS[state.shape](n);

  // —— 顶点 → Float64Array
  const vc = geom.verts.length;
  state.vertCount = vc;
  const vd = new Float64Array(vc * n);
  for (let i = 0; i < vc; i++) {
    const v = geom.verts[i];
    const base = i * n;
    for (let k = 0; k < n; k++) vd[base + k] = v[k];
  }
  state.vertData = vd;
  state._out = new Float64Array(n);
  state.world3 = new Float64Array(vc * 3);

  // —— 边 → Int32Array
  const ec = geom.edges.length;
  const ed = new Int32Array(ec * 2);
  for (let i = 0; i < ec; i++) {
    ed[i * 2] = geom.edges[i][0];
    ed[i * 2 + 1] = geom.edges[i][1];
  }
  state.edgeData = ed;

  // —— 面（保留对象数组）
  state.faces = geom.faces;

  // —— 旋转平面
  const speeds = getDefaultSpeeds(n);
  const planes = [];
  let si = 0;
  for (let a = 0; a < n; a++) {
    for (let b = a + 1; b < n; b++) {
      planes.push({
        a, b,
        name: AXIS_NAMES[a] + AXIS_NAMES[b],
        w: speeds[si] || 0,
        phi: 0,
        c: 1, s: 0           // 每帧预计算的 cos/sin
      });
      si++;
    }
  }
  state.planes = planes;

  // —— 投影视距
  const axisDist = new Array(n).fill(1);
  for (let k = 3; k < n; k++) axisDist[k] = 3.0 + (k - 3) * 0.9;
  state.axisDist = axisDist;

  // —— 屏幕缓存
  state.screen = new Array(vc);
  for (let i = 0; i < vc; i++) {
    state.screen[i] = { x: 0, y: 0, depth: 1, near: 0.5, ok: true };
  }

  // —— 高维自动降载
  if (n >= 10)      { state.maxFaces = 300; state.minFaceArea = 60; }
  else if (n >= 8)  { state.maxFaces = 500; state.minFaceArea = 40; }
  else if (n >= 6)  { state.maxFaces = 600; state.minFaceArea = 30; }
  else              { state.maxFaces = 400; state.minFaceArea = 24; }
}

/* ============================================================================
 * 投影（核心优化）
 *   P0：预计算每帧的 cos/sin，避免 V×P 次三角函数
 *   P0：TypedArray 复用，零分配
 *   P1：链式投影合并为单一标量累积
 * ========================================================================== */
function project() {
  const n = state.n;
  const V = state.vertData;
  const N = state.vertCount;
  const planes = state.planes;
  const axisDist = state.axisDist;
  const screen = state.screen;
  const world3 = state.world3;
  const out = state._out;

  const focal = (H * 0.5) / Math.tan(params.fov * Math.PI / 360);
  const cx = W * 0.5, cy = H * 0.5;
  const cyaw = Math.cos(camYaw), syaw = Math.sin(camYaw);
  const cpit = Math.cos(camPitch), spit = Math.sin(camPitch);
  const camR = params.camR;

  // —— 每帧一次性预计算旋转平面的三角函数
  const P = planes.length;
  for (let pi = 0; pi < P; pi++) {
    const p = planes[pi];
    const th = p.w * t4 + p.phi;
    p.c = Math.cos(th);
    p.s = Math.sin(th);
  }

  // —— 小维度专用缩放
  const m = Math.min(W, H);
  let vscale;
  if (n === 1)      vscale = 0.35 * Math.min(W, H * 2.2) * camR / focal;
  else if (n === 2) vscale = 0.30 * m * camR / (1.4 * focal);
  else if (n === 3) vscale = 0.36 * m * camR / (1.7 * focal);
  else              vscale = 1.0;

  // —— 链式投影视距倒数缓存
  const invAxis = new Array(n);
  for (let k = 3; k < n; k++) invAxis[k] = axisDist[k];

  for (let i = 0; i < N; i++) {
    const base = i * n;
    for (let k = 0; k < n; k++) out[k] = V[base + k];

    // —— SO(n) 旋转（使用预计算的 cos/sin）
    for (let pi = 0; pi < P; pi++) {
      const p = planes[pi];
      const a = out[p.a], b = out[p.b];
      out[p.a] = p.c * a - p.s * b;
      out[p.b] = p.s * a + p.c * b;
    }

    // —— 链式投影：从 n 维折叠到 3 维
    //    合并为一个标量乘子（利用各维度独立缩放的性质）
    let S = 1;
    for (let k = n - 1; k >= 3; k--) {
      const d = axisDist[k];
      let denom = d - S * out[k];
      if (Math.abs(denom) < 0.05) denom = 0.05;
      S *= d / denom;
    }

    const qx = out[0] * S * vscale;
    const qy = out[1] * S * vscale;
    const qz = out[2] * S * vscale;

    // —— 3D 相机变换（yaw → pitch）
    const x1 = qx * cyaw - qz * syaw;
    const z1 = qx * syaw + qz * cyaw;
    const y2 = qy * cpit - z1 * spit;
    const z2 = qy * spit + z1 * cpit;

    const depth = camR - z2;
    const invD = focal / Math.max(depth, 0.15);

    const s = screen[i];
    s.x = cx + x1 * invD;
    s.y = cy - y2 * invD;
    s.depth = depth;
    s.ok = depth > 0.1;

    // —— 保存 3D 世界坐标（供法线光照使用）
    const w3 = i * 3;
    world3[w3]     = qx;
    world3[w3 + 1] = qy;
    world3[w3 + 2] = qz;
  }

  // —— 深度归一化
  let dMin = Infinity, dMax = -Infinity;
  for (let i = 0; i < N; i++) {
    const d = screen[i].depth;
    if (d < dMin) dMin = d;
    if (d > dMax) dMax = d;
  }
  const dRange = dMax - dMin;
  if (dRange > 1e-6) {
    const inv = 1 / dRange;
    for (let i = 0; i < N; i++) {
      screen[i].near = (dMax - screen[i].depth) * inv;
    }
  } else {
    for (let i = 0; i < N; i++) screen[i].near = 0.5;
  }
}

/* ============================================================================
 * 面收集 —— 含 Lambert + 边缘光（P0：法线光照）
 * ========================================================================== */
function polyArea(pts, nf) {
  let a = 0;
  for (let i = 0; i < nf; i++) {
    const p = pts[i], q = pts[(i + 1) % nf];
    a += p.x * q.y - q.x * p.y;
  }
  return Math.abs(a) * 0.5;
}

function collectFaces() {
  const out = [];
  if (!params.faceOn || state.n < 2 || state.faces.length === 0) return out;

  const screen = state.screen;
  const world3 = state.world3;
  const minArea = state.minFaceArea;
  const lightOn = params.lightOn;
  const LI = params.lightIntensity;
  const rimK = params.rimStrength;

  // —— 相机世界位置（由 yaw/pitch/camR 反解）
  const cyaw = Math.cos(camYaw), syaw = Math.sin(camYaw);
  const cpit = Math.cos(camPitch), spit = Math.sin(camPitch);
  const camR = params.camR;
  const camX = syaw * camR * cpit;
  const camY = camR * spit;
  const camZ = cyaw * camR * cpit;

  const LX = LIGHT[0], LY = LIGHT[1], LZ = LIGHT[2];
  const faces = state.faces;

  for (let fi = 0; fi < faces.length; fi++) {
    const f = faces[fi];
    const nf = f.length;

    let ok = true;
    let cx = 0, cy = 0, cd = 0, cn = 0;
    const pts = new Array(nf);
    for (let i = 0; i < nf; i++) {
      const s = screen[f[i]];
      if (!s.ok) { ok = false; break; }
      pts[i] = s;
      cx += s.x; cy += s.y; cd += s.depth; cn += s.near;
    }
    if (!ok) continue;

    const area = polyArea(pts, nf);
    if (area < minArea) continue;

    const fcd = cd / nf;
    const fcn = cn / nf;

    // —— 光照计算
    let light = 0.72;
    if (lightOn && nf >= 3) {
      const i0 = f[0] * 3, i1 = f[1] * 3, i2 = f[2] * 3;
      const ax = world3[i1]     - world3[i0];
      const ay = world3[i1 + 1] - world3[i0 + 1];
      const az = world3[i1 + 2] - world3[i0 + 2];
      const bx = world3[i2]     - world3[i0];
      const by = world3[i2 + 1] - world3[i0 + 1];
      const bz = world3[i2 + 2] - world3[i0 + 2];

      let nx = ay * bz - az * by;
      let ny = az * bx - ax * bz;
      let nz = ax * by - ay * bx;
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);

      if (nl > 1e-9) {
        nx /= nl; ny /= nl; nz /= nl;

        // 面中心的世界坐标
        let wx = 0, wy = 0, wz = 0;
        for (let i = 0; i < nf; i++) {
          const wi = f[i] * 3;
          wx += world3[wi];
          wy += world3[wi + 1];
          wz += world3[wi + 2];
        }
        wx /= nf; wy /= nf; wz /= nf;

        // 视线方向
        let vx = camX - wx, vy = camY - wy, vz = camZ - wz;
        const vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
        vx /= vl; vy /= vl; vz /= vl;

        // 让法线朝向相机（双面渲染）
        let ndv = nx * vx + ny * vy + nz * vz;
        if (ndv < 0) { nx = -nx; ny = -ny; nz = -nz; ndv = -ndv; }

        const ndl = Math.max(0, nx * LX + ny * LY + nz * LZ);
        const rim = Math.pow(1 - ndv, 2.2) * rimK;

        let raw = 0.30 + ndl * 0.78 + rim;
        raw = clamp(raw, 0, 1.6);
        light = 0.72 * (1 - LI) + raw * LI;
      }
    }

    out.push({
      f, pts, nf, area,
      depth: fcd,
      near: fcn,
      light: clamp(light, 0, 1.6)
    });
  }

  out.sort((a, b) => b.depth - a.depth);
  if (out.length > state.maxFaces) out.length = state.maxFaces;
  return out;
}

/* ============================================================================
 * 纹理映射 —— 单个三角形的仿射 UV → 屏幕
 *   使用 setTransform + transform 合并，避免嵌套
 * ========================================================================== */
function applyUV(p0, p1, p2, u0, v0, u1, v1, u2, v2, k) {
  const du1x = u1 - u0, du1y = v1 - v0;
  const du2x = u2 - u0, du2y = v2 - v0;
  const det = du1x * du2y - du1y * du2x;
  if (Math.abs(det) < 1e-10) return;

  const dx1 = p1.x - p0.x, dy1 = p1.y - p0.y;
  const dx2 = p2.x - p0.x, dy2 = p2.y - p0.y;

  const invDet = 1 / det;
  const a = (dx1 * du2y - dx2 * du1y) * invDet;
  const c = (-dx1 * du2x + dx2 * du1x) * invDet;
  const b = (dy1 * du2y - dy2 * du1y) * invDet;
  const d = (-dy1 * du2x + dy2 * du1x) * invDet;
  const e = p0.x - a * u0 - c * v0;
  const f = p0.y - b * u0 - d * v0;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.transform(a * k, b * k, c * k, d * k, e, f);
}

/* ============================================================================
 * 面绘制
 * ========================================================================== */
function drawFace(entry) {
  const pts = entry.pts;
  const nf = entry.nf;
  const near = entry.near;
  const light = entry.light;

  const hue = 205 + (1 - near) * 22;
  const baseLum = 8 + near * 18;
  const lum = baseLum * (0.45 + light * 0.95);
  const alpha = (0.06 + near * 0.28) * params.faceAlpha * (0.5 + light * 0.75);

  // —— 基础填充
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < nf; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = 'hsla(' + hue + ',88%,' + lum.toFixed(1) + '%,' + alpha.toFixed(3) + ')';
  ctx.fill();

  // —— 纹理叠加
  if (params.texOn && state.pattern !== 'solid' && entry.area > 40) {
    const pat = patternObjects[state.pattern];
    if (pat) {
      const S = params.texRepeat;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < nf; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.clip();

      ctx.globalAlpha = clamp((0.32 + near * 0.52) * (0.35 + light * 0.85), 0, 1);
      ctx.fillStyle = pat;

      const k = 1 / (TILE_SIZE * S);

      if (nf === 3) {
        applyUV(pts[0], pts[1], pts[2], 0, 0, 1, 0, 0.5, 1, k);
        ctx.fillRect(0, 0, TILE_SIZE * S, TILE_SIZE * S);
      } else if (nf >= 4) {
        applyUV(pts[0], pts[1], pts[2], 0, 0, 1, 0, 1, 1, k);
        ctx.fillRect(0, 0, TILE_SIZE * S, TILE_SIZE * S);
        applyUV(pts[0], pts[2], pts[3], 0, 0, 1, 1, 0, 1, k);
        ctx.fillRect(0, 0, TILE_SIZE * S, TILE_SIZE * S);
      }

      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
  }

  // —— 轮廓描边
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < nf; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  const outLum = Math.min(lum + 40 + light * 26, 92);
  const outAlpha = (0.15 + near * 0.35) * (0.45 + light * 0.8);
  ctx.strokeStyle = 'hsla(' + hue + ',100%,' + outLum.toFixed(1) + '%,' + outAlpha.toFixed(3) + ')';
  ctx.lineWidth = 0.6;
  ctx.stroke();
}

/* ============================================================================
 * 边渲染 —— 批量 Path2D 分档（P1：批量路径合并）
 * ========================================================================== */
const NL = 14;                       // 亮度档位数
const _paths = new Array(NL);
for (let i = 0; i < NL; i++) _paths[i] = new Path2D();

function drawEdges() {
  const n = state.n;
  const screen = state.screen;
  const E = state.edgeData;
  const ec = E.length / 2;

  const gl = params.glow;
  const ew = params.edgeW;

  // —— 质量分级
  const layers = n >= 9 ? 1 : n >= 7 ? 2 : 3;

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // ============ 低边数：逐条绘制（保留精确颜色） ============
  if (ec < 320) {
    for (let i = 0; i < ec; i++) {
      const A = screen[E[i * 2]];
      const B = screen[E[i * 2 + 1]];
      if (!A.ok || !B.ok) continue;

      const wn = (A.near + B.near) * 0.5;
      const bright = 0.24 + 0.76 * wn;
      const hue = 202 + (1 - wn) * 24;
      const lum = 40 + wn * 32;
      const lw = ew * (0.6 + 0.75 * wn);

      if (layers >= 3) {
        ctx.strokeStyle = 'hsla(' + hue + ',100%,' + lum + '%,' + (0.06 * bright * gl) + ')';
        ctx.lineWidth = lw * 7;
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      }
      if (layers >= 2) {
        ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (lum + 10) + '%,' + (0.18 * bright * gl) + ')';
        ctx.lineWidth = lw * 3;
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      }
      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + Math.min(lum + 34, 88) + '%,' + (0.92 * bright) + ')';
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
    return;
  }

  // ============ 高边数：Path2D 分档批量绘制 ============
  for (let i = 0; i < NL; i++) _paths[i] = new Path2D();

  for (let i = 0; i < ec; i++) {
    const A = screen[E[i * 2]];
    const B = screen[E[i * 2 + 1]];
    if (!A.ok || !B.ok) continue;

    const nr = (A.near + B.near) * 0.5;
    let lvl = (nr * NL) | 0;
    if (lvl < 0) lvl = 0;
    else if (lvl >= NL) lvl = NL - 1;

    const p = _paths[lvl];
    p.moveTo(A.x, A.y);
    p.lineTo(B.x, B.y);
  }

  for (let lvl = 0; lvl < NL; lvl++) {
    const path = _paths[lvl];
    const nr = (lvl + 0.5) / NL;
    const bright = 0.24 + 0.76 * nr;
    const hue = 202 + (1 - nr) * 24;
    const lum = 40 + nr * 32;
    const lw = ew * (0.6 + 0.75 * nr);

    if (layers >= 3) {
      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + lum + '%,' + (0.06 * bright * gl) + ')';
      ctx.lineWidth = lw * 7;
      ctx.stroke(path);
    }
    if (layers >= 2) {
      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (lum + 10) + '%,' + (0.18 * bright * gl) + ')';
      ctx.lineWidth = lw * 3;
      ctx.stroke(path);
    }
    ctx.strokeStyle = 'hsla(' + hue + ',100%,' + Math.min(lum + 34, 88) + '%,' + (0.92 * bright) + ')';
    ctx.lineWidth = lw;
    ctx.stroke(path);
  }
}

/* ============================================================================
 * 顶点渲染 —— 按数量自适应质量
 * ========================================================================== */
function drawVertices() {
  const N = state.vertCount;
  if (N > 1200) return;                // 超高维顶点过密，直接跳过

  const screen = state.screen;
  const gl = params.glow;
  const vs = params.vertSize;
  const useGrad = N <= 256;            // 少量顶点才用 radialGradient

  for (let i = 0; i < N; i++) {
    const s = screen[i];
    if (!s.ok) continue;

    const wn = s.near;
    const hue = 202 + (1 - wn) * 24;
    const r = vs * (1.7 + 3.0 * wn) *
              clamp(params.camR / Math.max(s.depth, 1), 0.55, 1.7);

    if (useGrad) {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 5);
      g.addColorStop(0,    'hsla(' + hue + ',100%,72%,' + (0.45 * gl) + ')');
      g.addColorStop(0.34, 'hsla(' + hue + ',100%,62%,' + (0.14 * gl) + ')');
      g.addColorStop(1,    'hsla(' + hue + ',100%,55%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 5, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = 'hsla(' + hue + ',100%,62%,' + (0.18 * gl * wn) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 2.6, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = 'hsla(' + hue + ',100%,' + (78 + wn * 16) + '%,1)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, TAU);
    ctx.fill();
  }
}

/* ============================================================================
 * 主渲染
 * ========================================================================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  project();

  const n = state.n;

  // —— 面
  if (params.faceOn && n >= 2) {
    const visible = collectFaces();
    for (let i = 0; i < visible.length; i++) drawFace(visible[i]);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // —— 边
  drawEdges();

  // —— 顶点
  if (params.showVerts) drawVertices();

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================================
 * 小游戏（保持原逻辑）
 * ========================================================================== */
const game = {
  on: false, score: 0, combo: 0, best: 0,
  targetIdx: -1,
  ring: { x: 0, y: 0, r: 70, pulse: 0 },
  roundT: 0, roundLen: 5.0, grace: 0,
  msg: '', msgT: 0, flash: 0, flashColor: '110,240,255'
};

function placeRing() {
  const m = Math.min(W, H);
  const spread = m * 0.16;
  game.ring.x = W * 0.5 + (Math.random() * 2 - 1) * spread;
  game.ring.y = H * 0.5 + (Math.random() * 2 - 1) * spread;
  game.ring.r = m * 0.085;
  game.ring.pulse = 0;
  game.grace = 1.1;
}

function nextRound() {
  game.targetIdx = Math.floor(Math.random() * state.vertCount);
  game.roundT = 0;
  placeRing();
}

function startGame() {
  game.on = true;
  game.score = 0;
  game.combo = 0;
  game.msg = '';
  game.msgT = 0;
  nextRound();
  canvas.classList.add('gaming');
  document.getElementById('btnGame').textContent = '↻ 重新开始';
}

function stopGame() {
  game.on = false;
  game.best = Math.max(game.best, game.score);
  canvas.classList.remove('gaming');
  document.getElementById('btnGame').textContent = '▶ 开始游戏';
}

function fire() {
  if (!game.on) return;
  const s = state.screen[game.targetIdx];
  if (!s || !s.ok) return;

  const dx = s.x - game.ring.x;
  const dy = s.y - game.ring.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const r = game.ring.r;

  if (dist <= r) {
    const acc = 1 - dist / r;
    const tbon = Math.max(0, 1 - game.roundT / game.roundLen);
    const mult = 1 + game.combo * 0.12;
    const pts = Math.round((60 + 150 * acc + 55 * tbon) * mult);
    game.score += pts;
    game.combo++;
    game.msg = '命中 +' + pts + '  精度 ' + (acc * 100).toFixed(0) + '%';
    game.flashColor = '110,240,255';
  } else {
    game.combo = 0;
    game.msg = '脱靶  偏差 ' + dist.toFixed(0) + 'px';
    game.flashColor = '255,95,145';
  }
  game.flash = 1;
  game.msgT = 1.1;
  nextRound();
}

function updateGame(dt) {
  if (!game.on) return;
  game.roundT += dt;
  game.ring.pulse += dt;
  if (game.msgT > 0) game.msgT -= dt;
  if (game.flash > 0) game.flash -= dt * 2.6;

  const s = state.screen[game.targetIdx];
  if (!s) return;

  game.grace -= dt;
  if (game.grace <= 0) {
    const dx = s.x - game.ring.x, dy = s.y - game.ring.y;
    if (dx * dx + dy * dy > game.ring.r * game.ring.r) placeRing();
  }

  if (game.roundT > game.roundLen) {
    game.combo = 0;
    game.msg = '超时';
    game.msgT = 1.0;
    game.flash = 1;
    game.flashColor = '255,160,60';
    nextRound();
  }
}

function drawGame() {
  if (!game.on) return;
  const s = state.screen[game.targetIdx];
  if (!s || !s.ok) return;

  const R = game.ring.r;
  const pulse = 1 + Math.sin(game.ring.pulse * 5) * 0.035;
  const dx = s.x - game.ring.x;
  const dy = s.y - game.ring.y;
  const inside = (dx * dx + dy * dy) <= R * R;

  ctx.globalCompositeOperation = 'lighter';

  ctx.save();
  ctx.setLineDash([4, 7]);
  ctx.strokeStyle = inside ? 'rgba(150,255,225,.5)' : 'rgba(90,160,230,.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(game.ring.x, game.ring.y);
  ctx.stroke();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(game.ring.x, game.ring.y, R * pulse, 0, TAU);
  ctx.strokeStyle = inside ? 'rgba(150,255,225,.95)' : 'rgba(90,200,255,.6)';
  ctx.lineWidth = inside ? 3 : 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(game.ring.x, game.ring.y, R * 0.32 * pulse, 0, TAU);
  ctx.strokeStyle = 'rgba(90,200,255,.16)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const hr = 9 + 5 * Math.sin(game.ring.pulse * 9);
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, hr * 3.4);
  g.addColorStop(0,    'rgba(255,248,190,.95)');
  g.addColorStop(0.32, 'rgba(255,205,70,.4)');
  g.addColorStop(1,    'rgba(255,180,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, hr * 3.4, 0, TAU);
  ctx.fill();

  if (game.flash > 0) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(' + game.flashColor + ',' + (game.flash * 0.16) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const tfrac = Math.max(0, 1 - game.roundT / game.roundLen);
  const barW = Math.min(W * 0.56, 520);
  const bx = (W - barW) * 0.5, by = 30;

  ctx.fillStyle = 'rgba(40,110,190,.28)';
  ctx.fillRect(bx, by, barW, 5);
  ctx.fillStyle = tfrac > 0.35 ? 'rgba(110,220,255,.92)' : 'rgba(255,120,150,.95)';
  ctx.fillRect(bx, by, barW * tfrac, 5);

  const shapeName = state.shape === 'hypercube' ? '超立方体'
                  : state.shape === 'simplex' ? '单纯形' : '正轴体';

  ctx.font = '600 14px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle = 'rgba(180,228,255,.92)';
  ctx.fillText('SCORE  ' + game.score + '   ·   ' + state.n + 'D ' + shapeName, W * 0.5, by - 12);

  if (game.combo > 1) {
    ctx.fillStyle = 'rgba(255,215,120,.95)';
    ctx.fillText('×' + game.combo + ' COMBO', W * 0.5, by + 26);
  }

  if (game.msgT > 0) {
    ctx.globalAlpha = Math.min(1, game.msgT / 0.3);
    ctx.font = '600 19px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillStyle = '#a8e8ff';
    ctx.fillText(game.msg, W * 0.5, H - 74);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================================
 * 主循环
 * ========================================================================== */
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!params.paused) {
    const factor = getAutoTimeFactor(state.n);
    t4 += dt * params.timeScale * factor;
    if (params.autoOrbit) camYaw += dt * 0.22 * factor;
  }

  render();
  updateGame(dt);
  drawGame();

  requestAnimationFrame(loop);
}

/* ============================================================================
 * UI 构建
 * ========================================================================== */
function sliderHTML(key, label, value, min, max, step) {
  const dec = (String(step).split('.')[1] || '').length;
  return '<div class="slider">' +
    '<div class="slabel"><span>' + label + '</span>' +
    '<span class="sval" data-val="' + key + '">' + value.toFixed(dec) + '</span></div>' +
    '<input type="range" min="' + min + '" max="' + max + '" step="' + step +
    '" value="' + value + '" data-bind="' + key + '">' +
  '</div>';
}

function swrowHTML(key, label, on) {
  return '<div class="swrow" data-sw="' + key + '"><span>' + label + '</span>' +
         '<div class="sw' + (on ? ' on' : '') + '"></div></div>';
}

function buildPanel() {
  const body = document.getElementById('panelBody');
  const n = state.n;
  const C2 = (n * (n - 1)) / 2;
  const vertCount = state.vertCount;
  const edgeCount = state.edgeData ? state.edgeData.length / 2 : 0;
  const faceCount = state.faces.length;
  const factor = getAutoTimeFactor(n);
  const shapeName = state.shape === 'hypercube' ? '超立方体'
                  : state.shape === 'simplex' ? '单纯形' : '正轴体';

  let html = '';

  /* 维度 */
  html += '<div class="group"><div class="gtitle">维度选择 · 1D – 11D</div><div class="dimrow">';
  for (let d = 1; d <= MAX_DIM; d++) {
    html += '<button class="dimb' + (d === n ? ' active' : '') + '" data-dim="' + d + '">' + d + 'D</button>';
  }
  html += '</div>';
  html += '<div class="infobox">' +
    '<b>' + shapeName + '</b> &nbsp;·&nbsp; ' + n + 'D<br>' +
    '<b>顶点</b> ' + vertCount + ' &nbsp;·&nbsp; ' +
    '<b>边</b> ' + edgeCount + ' &nbsp;·&nbsp; ' +
    '<b>面</b> ' + faceCount + '<br>' +
    '<b>SO(' + n + ') 平面</b> ' + C2 +
    '</div>';
  if (factor < 1) {
    html += '<div class="warnbox">⚡ 高维性能优化：时间流速自动 ×' + factor.toFixed(2) + '</div>';
  }
  html += '</div>';

  /* 材质 */
  html += '<div class="group"><div class="gtitle">面材质纹理 · 程序化</div>';
  html += '<div class="patrow">';
  PATTERN_KEYS.forEach((k, i) => {
    html += '<button class="patb' + (k === state.pattern ? ' active' : '') +
            '" data-pat="' + k + '">' + PATTERN_LABELS[i] + '</button>';
  });
  html += '</div>';
  html += swrowHTML('faceOn', '渲染面', params.faceOn);
  html += swrowHTML('texOn', '纹理叠加', params.texOn);
  html += sliderHTML('faceAlpha', '面不透明度', params.faceAlpha, 0, 1, 0.01);
  html += sliderHTML('texRepeat', '纹理重复数', params.texRepeat, 1, 12, 1);
  html += sliderHTML('minFaceArea', '面最小屏幕面积', state.minFaceArea, 4, 200, 1);
  html += sliderHTML('maxFaces', '最大面渲染数', state.maxFaces, 50, 1200, 10);
  html += '</div>';

  /* 光照 */
  html += '<div class="group"><div class="gtitle">光照模型 · Lambert + Rim</div>';
  html += swrowHTML('lightOn', '启用光照', params.lightOn);
  html += sliderHTML('lightIntensity', '光照强度', params.lightIntensity, 0, 1, 0.01);
  html += sliderHTML('rimStrength', '边缘光强度', params.rimStrength, 0, 1.2, 0.01);
  html += '</div>';

  /* 旋转平面 */
  html += '<div class="group"><div class="gtitle">旋转角速度 ω (rad/s) · ' +
          state.planes.length + ' 个平面</div>';
  if (state.planes.length === 0) {
    html += '<div class="infobox">1D 无旋转平面。</div>';
  } else {
    state.planes.forEach((p, i) => {
      html += sliderHTML('plane-' + i, 'ω<sub>' + p.name + '</sub>', p.w, -1.5, 1.5, 0.01);
    });
  }
  html += '</div>';

  /* 投影与相机 */
  html += '<div class="group"><div class="gtitle">投影与相机</div>';
  for (let k = n - 1; k >= 3; k--) {
    html += sliderHTML('axisdist-' + k,
      (k + 1) + 'D→' + k + 'D 视距 d<sub>' + (k + 1) + '</sub>',
      state.axisDist[k], 1.3, 12, 0.01);
  }
  html += sliderHTML('camR', '相机距离 R', params.camR, 3, 25, 0.1);
  html += sliderHTML('fov', '视场角 FOV°', params.fov, 20, 100, 1);
  html += sliderHTML('timeScale', '时间流速 (基准)', params.timeScale, 0, 3, 0.01);
  html += '</div>';

  /* 线条与光效 */
  html += '<div class="group"><div class="gtitle">线条与光效</div>';
  html += sliderHTML('glow', '辉光强度', params.glow, 0, 2, 0.01);
  html += sliderHTML('edgeW', '边宽', params.edgeW, 0.4, 4, 0.05);
  html += sliderHTML('vertSize', '顶点大小', params.vertSize, 0.3, 3, 0.05);
  html += '</div>';

  /* 显示 */
  html += '<div class="group"><div class="gtitle">显示选项</div>';
  html += swrowHTML('showVerts', '显示顶点', params.showVerts);
  html += swrowHTML('autoOrbit', '相机自动环绕', params.autoOrbit);
  html += '</div>';

  body.innerHTML = html;
  bindPanelEvents();
}

function applyParam(key, v) {
  if (key.indexOf('plane-') === 0) {
    const idx = parseInt(key.slice(6), 10);
    if (state.planes[idx]) state.planes[idx].w = v;
  } else if (key.indexOf('axisdist-') === 0) {
    const k = parseInt(key.slice(10), 10);
    if (k >= 3 && k < state.n) state.axisDist[k] = v;
  } else if (key === 'minFaceArea') {
    state.minFaceArea = v;
  } else if (key === 'maxFaces') {
    state.maxFaces = v;
  } else {
    params[key] = v;
  }
}

function bindPanelEvents() {
  document.querySelectorAll('#panelBody [data-bind]').forEach(function (inp) {
    const key = inp.dataset.bind;
    const sval = document.querySelector('#panelBody [data-val="' + key + '"]');
    const dec = (inp.step.split('.')[1] || '').length;

    inp.addEventListener('input', function () {
      const v = parseFloat(inp.value);
      applyParam(key, v);
      if (sval) sval.textContent = v.toFixed(dec);
    });
  });

  document.querySelectorAll('#panelBody [data-sw]').forEach(function (row) {
    row.addEventListener('click', function () {
      const key = row.dataset.sw;
      params[key] = !params[key];
      row.querySelector('.sw').classList.toggle('on', params[key]);
    });
  });

  document.querySelectorAll('#panelBody .dimb').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const d = parseInt(btn.dataset.dim, 10);
      if (d !== state.n) setDimension(d);
    });
  });

  document.querySelectorAll('#panelBody .patb').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.pattern = btn.dataset.pat;
      ensurePatterns();
      document.querySelectorAll('#panelBody .patb').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

/* ============================================================================
 * 维度/形状切换
 * ========================================================================== */
function resetCamera(d) {
  if (d === 1)      { camYaw = 0;    camPitch = 0; }
  else if (d === 2) { camYaw = 0.42; camPitch = 0.22; }
  else              { camYaw = 0.55; camPitch = 0.32; }
}

function setDimension(d) {
  if (game.on) stopGame();
  rebuildGeometry(d, state.shape);
  buildPanel();
  resetCamera(d);
}

function setShape(key) {
  if (game.on) stopGame();
  state.shape = key;
  document.querySelectorAll('#shapeSwitch .shapeb').forEach(b => {
    b.classList.toggle('active', b.dataset.shape === key);
  });
  rebuildGeometry(state.n, key);
  buildPanel();
  resetCamera(state.n);
}

/* ============================================================================
 * 交互
 * ========================================================================== */
let dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', function (e) {
  if (game.on) { fire(); return; }
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.style.cursor = 'grabbing';
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  camYaw -= dx * 0.0075;
  camPitch += dy * 0.0075;
  camPitch = clamp(camPitch, -Math.PI * 0.48, Math.PI * 0.48);
});

function endDrag() {
  dragging = false;
  canvas.style.cursor = game.on ? 'crosshair' : 'grab';
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space') {
    e.preventDefault();
    if (game.on) fire(); else startGame();
  } else if (e.code === 'KeyP') {
    document.getElementById('btnPause').click();
  } else if (e.code === 'KeyR') {
    resetCamera(state.n);
  }
});

document.getElementById('collapseBtn').addEventListener('click', function () {
  const panel = document.getElementById('panel');
  panel.classList.toggle('collapsed');
  this.textContent = panel.classList.contains('collapsed') ? '+' : '−';
});

document.getElementById('btnGame').addEventListener('click', function () {
  if (game.on) stopGame(); else startGame();
});

document.getElementById('btnPause').addEventListener('click', function () {
  params.paused = !params.paused;
  this.textContent = params.paused ? '▶ 继续' : '⏸ 暂停';
});

document.querySelectorAll('#shapeSwitch .shapeb').forEach(function (b) {
  b.addEventListener('click', function () { setShape(b.dataset.shape); });
});

/* ============================================================================
 * 启动
 * ========================================================================== */
resize();

// 预渲染所有程序化纹理 tile（一次性开销，之后零成本）
for (const k of PATTERN_KEYS) getTile(k);
ensurePatterns();

rebuildGeometry(4, 'hypercube');
buildPanel();
resetCamera(4);

requestAnimationFrame(function (t) {
  last = t;
  requestAnimationFrame(loop);
});

})();
</script>
