<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- 粗糙边缘滤镜 -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 半调网点 -->
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- 斜线条纹 -->
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#F1FAEE" stroke-width="1" opacity="0.06"/>
    </pattern>

    <!-- 行星裁剪 -->
    <clipPath id="planetClip">
      <circle cx="360" cy="420" r="150"/>
    </clipPath>
  </defs>

  <!-- ===== 底纸：深色画布 ===== -->
  <rect width="1200" height="800" fill="#0d1117"/>

  <!-- ===== 拼贴色块层 ===== -->
  <polygon points="0,0 340,0 120,340" fill="#1D3557" opacity="0.85" filter="url(#rough)"/>
  <polygon points="0,0 260,0 80,260" fill="#264653" opacity="0.5"/>
  <polygon points="1200,800 900,800 1100,500" fill="#E9C46A" opacity="0.75" filter="url(#rough)"/>
  <polygon points="1200,800 980,800 1200,620" fill="#E63946" opacity="0.85"/>
  <polygon points="0,800 240,800 0,560" fill="#457B9D" opacity="0.35" filter="url(#rough)"/>
  <polygon points="1200,0 1020,0 1200,160" fill="#E63946" opacity="0.6" filter="url(#rough)"/>
  <polygon points="1200,0 1080,0 1200,120" fill="#F4A261" opacity="0.4"/>

  <!-- 撕裂纸条 -->
  <path d="M 0,280 Q 200,260 400,300 Q 600,340 800,290 Q 1000,240 1200,280 L 1200,310 Q 1000,270 800,320 Q 600,370 400,330 Q 200,290 0,310 Z" 
        fill="#E63946" opacity="0.25"/>

  <!-- 斜线切割 -->
  <line x1="0" y1="0" x2="450" y2="450" stroke="#E63946" stroke-width="8" opacity="0.5"/>
  <line x1="750" y1="800" x2="1200" y2="350" stroke="#F4A261" stroke-width="5" opacity="0.4"/>
  <line x1="200" y1="800" x2="700" y2="400" stroke="#F1FAEE" stroke-width="2" opacity="0.2"/>

  <!-- ===== 星空 ===== -->
  <g>
    <circle cx="90" cy="100" r="2.5" fill="#F1FAEE"/>
    <circle cx="330" cy="70" r="1.8" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="580" cy="130" r="3" fill="#F1FAEE"/>
    <circle cx="830" cy="90" r="1.8" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="1080" cy="220" r="2.2" fill="#F1FAEE"/>
    <circle cx="60" cy="380" r="2" fill="#F1FAEE" opacity="0.6"/>
    <circle cx="480" cy="280" r="1.8" fill="#F1FAEE" opacity="0.9"/>
    <circle cx="920" cy="340" r="2.5" fill="#F1FAEE"/>
    <circle cx="1140" cy="480" r="1.8" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="140" cy="520" r="2.2" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="440" cy="660" r="1.8" fill="#F1FAEE"/>
    <circle cx="740" cy="740" r="2.2" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="1020" cy="680" r="2.5" fill="#F1FAEE"/>
    <circle cx="70" cy="230" r="1.8" fill="#F1FAEE" opacity="0.5"/>
    <circle cx="280" cy="190" r="2.2" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="680" cy="230" r="1.8" fill="#F1FAEE" opacity="0.6"/>
    <circle cx="880" cy="430" r="2.2" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="1120" cy="580" r="1.5" fill="#F1FAEE" opacity="0.6"/>
    <circle cx="520" cy="550" r="1.8" fill="#F1FAEE" opacity="0.7"/>

    <g fill="#F1FAEE" opacity="0.9">
      <path d="M 180,180 Q 180,192 192,192 Q 180,192 180,204 Q 180,192 168,192 Q 180,192 180,180 Z"/>
      <path d="M 680,110 Q 680,125 695,125 Q 680,125 680,140 Q 680,125 665,125 Q 680,125 680,110 Z" fill="#E63946"/>
      <path d="M 980,260 Q 980,275 995,275 Q 980,275 980,290 Q 980,275 965,275 Q 980,275 980,260 Z"/>
      <path d="M 380,480 Q 380,492 392,492 Q 380,492 380,504 Q 380,492 368,492 Q 380,492 380,480 Z" fill="#F1FAEE" opacity="0.7"/>
      <path d="M 830,520 Q 830,535 845,535 Q 830,535 830,550 Q 830,535 815,535 Q 830,535 830,520 Z"/>
      <path d="M 1080,620 Q 1080,632 1092,632 Q 1080,632 1080,644 Q 1080,632 1068,632 Q 1080,632 1080,620 Z" fill="#E63946"/>
    </g>
  </g>

  <!-- ===== 太阳（拼贴风格） ===== -->
  <g>
    <circle cx="980" cy="180" r="100" fill="#E9C46A" opacity="0.15" filter="url(#rough)"/>
    <circle cx="980" cy="180" r="75" fill="#F4A261" opacity="0.3" filter="url(#rough)"/>
    <circle cx="980" cy="180" r="55" fill="#F4A261" filter="url(#rough)"/>
    <circle cx="980" cy="180" r="42" fill="#E9C46A"/>
    <circle cx="980" cy="180" r="28" fill="#F1FAEE"/>
    <polygon points="960,160 985,155 975,180" fill="#E63946" opacity="0.35"/>
    <polygon points="1000,200 1020,195 1010,215" fill="#F4A261" opacity="0.5"/>
    <circle cx="980" cy="180" r="10" fill="#E63946" opacity="0.3"/>
    <circle cx="980" cy="180" r="65" fill="none" stroke="#E9C46A" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.5"/>
  </g>

  <!-- ===== 土星（完整环带，不再被截断） ===== -->
  <g>
    <circle cx="360" cy="420" r="200" fill="#E9C46A" opacity="0.06"/>

    <!-- ===== 环的后半部分（在行星后方，完整椭圆） ===== -->
    <g transform="translate(360, 420) rotate(-15)">
      <ellipse rx="360" ry="88" fill="none" stroke="#264653" stroke-width="22" opacity="0.9"/>
      <ellipse rx="340" ry="82" fill="none" stroke="#E9C46A" stroke-width="28" opacity="0.95"/>
      <ellipse rx="318" ry="76" fill="none" stroke="#E63946" stroke-width="14" opacity="0.85"/>
      <ellipse rx="296" ry="70" fill="none" stroke="#F4A261" stroke-width="24" opacity="0.9"/>
      <ellipse rx="274" ry="64" fill="none" stroke="#264653" stroke-width="18" opacity="0.7"/>
      <ellipse rx="252" ry="58" fill="none" stroke="#F1FAEE" stroke-width="12" opacity="0.6"/>
      <ellipse rx="232" ry="52" fill="none" stroke="#E9C46A" stroke-width="9" opacity="0.7"/>
    </g>

    <!-- ===== 行星本体（遮住后方环带中间部分） ===== -->
    <circle cx="360" cy="420" r="150" fill="#1D3557"/>

    <!-- 行星表面纹理 -->
    <g clip-path="url(#planetClip)">
      <polygon points="210,340 510,340 510,370 210,370" fill="#E9C46A" opacity="0.25"/>
      <polygon points="210,390 510,390 510,415 210,415" fill="#F1FAEE" opacity="0.12"/>
      <polygon points="210,440 510,440 510,465 210,465" fill="#E63946" opacity="0.2"/>
      <polygon points="210,490 510,490 510,520 210,520" fill="#F4A261" opacity="0.18"/>
      <polygon points="210,540 510,540 510,560 210,560" fill="#E9C46A" opacity="0.22"/>

      <polygon points="280,320 330,340 300,380" fill="#E63946" opacity="0.4"/>
      <polygon points="440,460 400,490 430,520" fill="#E9C46A" opacity="0.35"/>
      <polygon points="320,480 360,470 340,510" fill="#F1FAEE" opacity="0.15"/>
      <line x1="230" y1="420" x2="490" y2="420" stroke="#F1FAEE" stroke-width="1.5" opacity="0.2"/>
      <line x1="260" y1="330" x2="460" y2="510" stroke="#F4A261" stroke-width="1.5" opacity="0.2"/>

      <circle cx="360" cy="420" r="150" fill="#000000" opacity="0.4"/>
      <circle cx="400" cy="420" r="150" fill="#000000" opacity="0.15"/>
      <ellipse cx="310" cy="360" rx="55" ry="35" fill="#ffffff" opacity="0.05" transform="rotate(-30 310 360)"/>
    </g>

    <!-- ===== 环的前半部分（在行星前方，完整下半弧，延伸到行星外） ===== -->
    <g transform="translate(360, 420) rotate(-15)">
      <path d="M -360,0 A 360,88 0 0,0 360,0" fill="none" stroke="#264653" stroke-width="22" opacity="0.95"/>
      <path d="M -340,0 A 340,82 0 0,0 340,0" fill="none" stroke="#E9C46A" stroke-width="28" opacity="0.95"/>
      <path d="M -318,0 A 318,76 0 0,0 318,0" fill="none" stroke="#E63946" stroke-width="14" opacity="0.9"/>
      <path d="M -296,0 A 296,70 0 0,0 296,0" fill="none" stroke="#F4A261" stroke-width="24" opacity="0.9"/>
      <path d="M -274,0 A 274,64 0 0,0 274,0" fill="none" stroke="#264653" stroke-width="18" opacity="0.75"/>
      <path d="M -252,0 A 252,58 0 0,0 252,0" fill="none" stroke="#F1FAEE" stroke-width="12" opacity="0.65"/>
      <path d="M -232,0 A 232,52 0 0,0 232,0" fill="none" stroke="#E9C46A" stroke-width="9" opacity="0.75"/>
      
      <!-- 赛道标线（虚线，强调赛道属性） -->
      <path d="M -296,0 A 296,70 0 0,0 296,0" fill="none" stroke="#F1FAEE" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.5"/>
    </g>

    <!-- 环的高光 -->
    <path d="M 20,486 A 340,82 0 0,0 700,486" fill="none" stroke="#F1FAEE" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- ===== 渡渡鸟 + 自行车（骑在土星环赛道上） ===== -->
  <g transform="translate(520, 490) rotate(-15)">
    <!-- 颠簸浮动 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-3; 0,0; 0,3; 0,0" dur="1.2s" repeatCount="indefinite"/>

      <!-- 后轮 -->
      <g transform="translate(-38,0)">
        <circle r="22" fill="none" stroke="#F1FAEE" stroke-width="5"/>
        <circle r="17" fill="none" stroke="#E63946" stroke-width="1.8" opacity="0.8"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="10.6" y1="-10.6" x2="-10.6" y2="10.6" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
        </g>
        <circle r="3.5" fill="#E9C46A"/>
      </g>

      <!-- 前轮 -->
      <g transform="translate(38,0)">
        <circle r="22" fill="none" stroke="#F1FAEE" stroke-width="5"/>
        <circle r="17" fill="none" stroke="#E63946" stroke-width="1.8" opacity="0.8"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
          <line x1="10.6" y1="-10.6" x2="-10.6" y2="10.6" stroke="#F1FAEE" stroke-width="1.2" opacity="0.9"/>
        </g>
        <circle r="3.5" fill="#E9C46A"/>
      </g>

      <!-- 车架 -->
      <g stroke="#F1FAEE" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="0"   y1="0"   x2="-38" y2="0"/>
        <line x1="-31" y1="-52" x2="-38" y2="0"/>
        <line x1="-31" y1="-52" x2="0"   y2="0"/>
        <line x1="0"   y1="0"   x2="31"  y2="-46"/>
        <line x1="-31" y1="-52" x2="31"  y2="-46"/>
        <line x1="31"  y1="-46" x2="38"  y2="0"/>
      </g>

      <!-- 车座 -->
      <polygon points="-31,-55 -22,-52 -24,-48 -33,-51" fill="#E63946"/>

      <!-- 车把 -->
      <line x1="31" y1="-46" x2="34" y2="-56" stroke="#F1FAEE" stroke-width="4" stroke-linecap="round"/>
      <path d="M 26 -60 L 40 -54" stroke="#F1FAEE" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- 曲柄踏板 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
        <circle r="9" fill="none" stroke="#F1FAEE" stroke-width="2.5"/>
        <circle r="2.8" fill="#E9C46A"/>
        <line x1="0" y1="0" x2="12"  y2="0" stroke="#F1FAEE" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="12"  cy="0" r="3.5" fill="#E63946"/>
        <line x1="0" y1="0" x2="-12" y2="0" stroke="#F1FAEE" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="-12" cy="0" r="3.5" fill="#264653"/>
      </g>

      <!-- 远侧腿 -->
      <path fill="none" stroke="#1D3557" stroke-width="5" stroke-linecap="round"
            d="M -28,-65 Q -12,-38 -8,0">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M -28,-65 Q -12,-38 -8,0; M -28,-65 Q 0,-38 12,0; M -28,-65 Q -12,-38 -8,0"/>
      </path>

      <!-- 渡渡鸟身体 -->
      <g>
        <polygon points="-60,-98 -82,-110 -86,-94" fill="#264653"/>
        <polygon points="-63,-94 -78,-103 -82,-90" fill="#E63946" opacity="0.6"/>

        <ellipse cx="-38" cy="-90" rx="30" ry="34" fill="#E9C46A" transform="rotate(-15 -38 -90)"/>
        <ellipse cx="-32" cy="-80" rx="19" ry="22" fill="#F1FAEE" opacity="0.2" transform="rotate(-15 -32 -80)"/>

        <ellipse cx="-52" cy="-94" rx="13" ry="22" fill="#1D3557" transform="rotate(-20 -52 -94)"/>
        <path d="M -60 -103 L -44 -98 L -55 -82 Z" fill="#E9C46A" opacity="0.4"/>

        <path d="M -33 -110 Q -27 -132 -20 -140" fill="none" stroke="#E9C46A" stroke-width="16" stroke-linecap="round"/>

        <circle cx="-17" cy="-146" r="15.5" fill="#E9C46A"/>

        <polygon points="-6,-152 16,-146 -4,-140" fill="#E63946"/>
        <polygon points="-6,-152 16,-146 -4,-140" fill="#F4A261" opacity="0.5"/>

        <circle cx="-13" cy="-152" r="3.8" fill="#0d1117"/>
        <circle cx="-14" cy="-153" r="1.2" fill="#F1FAEE"/>

        <line x1="-24" y1="-160" x2="-20" y2="-169" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-17" y1="-162" x2="-13" y2="-173" stroke="#E63946" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- 近侧腿 -->
      <path fill="none" stroke="#F1FAEE" stroke-width="5" stroke-linecap="round"
            d="M -24,-65 Q 0,-38 12,0">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M -24,-65 Q 0,-38 12,0; M -24,-65 Q -12,-38 -8,0; M -24,-65 Q 0,-38 12,0"/>
      </path>
    </g>
  </g>

  <!-- ===== 先锋派排版 ===== -->
  <g fill="#F1FAEE" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="50" y="720" font-size="28" letter-spacing="5" opacity="0.95">COSMOS</text>
    <text x="50" y="750" font-size="13" letter-spacing="7" opacity="0.65">1969</text>
    <text x="1030" y="58" font-size="20" letter-spacing="3.5" opacity="0.9">SATURN</text>
    <text x="1030" y="82" font-size="11" letter-spacing="2.5" opacity="0.6">MISSION</text>
  </g>

  <!-- 构成主义装饰圆环 -->
  <circle cx="130" cy="640" r="70" fill="none" stroke="#F1FAEE" stroke-width="2" opacity="0.25"/>
  <circle cx="130" cy="640" r="50" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.45"/>
  <circle cx="130" cy="640" r="32" fill="none" stroke="#E9C46A" stroke-width="1" opacity="0.65"/>

  <!-- 拼贴装饰碎片 -->
  <polygon points="1050,700 1120,720 1080,760" fill="#E63946" opacity="0.4"/>
  <polygon points="80,180 120,160 100,200" fill="#E9C46A" opacity="0.3"/>

  <!-- 全局纹理覆盖 -->
  <rect width="100%" height="100%" fill="url(#dots)" pointer-events="none"/>
  <rect width="100%" height="100%" fill="url(#stripes)" pointer-events="none"/>
</svg>
