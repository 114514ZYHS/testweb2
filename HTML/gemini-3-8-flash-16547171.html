<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>齐天大圣 飞越九霄 - 孙悟空开飞机 2D 动画</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;600;800;900&display=swap');

    .font-chinese-title {
      font-family: 'Ma Shan Zheng', cursive, 'Noto Sans SC', sans-serif;
    }
    .font-cartoon {
      font-family: 'ZCOOL KuaiLe', cursive, 'Noto Sans SC', sans-serif;
    }

    /* 飞机螺旋桨旋转 */
    @keyframes spin-propeller {
      0% { transform: scaleY(1); opacity: 0.95; }
      25% { transform: scaleY(0.25) scaleX(1.05); opacity: 0.6; }
      50% { transform: scaleY(-0.85); opacity: 0.9; }
      75% { transform: scaleY(0.15) scaleX(1.1); opacity: 0.5; }
      100% { transform: scaleY(1); opacity: 0.95; }
    }
    .propeller-spin {
      transform-origin: 508px 255px;
      animation: spin-propeller 0.07s linear infinite;
    }

    /* 尾喷火焰脉冲 */
    @keyframes jet-flame {
      0%, 100% { transform: scale(1) skewX(0deg); opacity: 0.85; }
      50% { transform: scale(1.25, 0.9) skewX(-2deg); opacity: 1; }
    }
    .jet-fire {
      transform-origin: 140px 260px;
      animation: jet-flame 0.12s ease-in-out infinite alternate;
    }

    /* 孙悟空眨眼 */
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96%, 98% { transform: scaleY(0.08); }
    }
    .wukong-blink {
      transform-origin: 325px 200px;
      animation: blink 3.5s infinite;
    }

    /* 金箍棒金光闪烁 */
    @keyframes golden-glow {
      0%, 100% { filter: drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 10px #ff9900); }
      50% { filter: drop-shadow(0 0 12px #ffff33) drop-shadow(0 0 25px #ff5500); }
    }
    .ruyi-bang-glow {
      animation: golden-glow 1.5s ease-in-out infinite;
    }

    /* 凤翅紫金冠翎子飘扬 */
    @keyframes feather-flutter {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(6deg) skewX(4deg); }
      100% { transform: rotate(-3deg); }
    }
    .feather-left {
      transform-origin: 295px 145px;
      animation: feather-flutter 1.1s ease-in-out infinite alternate;
    }
    .feather-right {
      transform-origin: 325px 148px;
      animation: feather-flutter 0.9s ease-in-out infinite alternate-reverse;
    }

    /* 红色披风随风狂舞 */
    @keyframes cape-wave {
      0% { transform: rotate(0deg) skewY(0deg) scaleX(1); }
      25% { transform: rotate(-5deg) skewY(-8deg) scaleX(1.08); }
      50% { transform: rotate(3deg) skewY(5deg) scaleX(0.96); }
      75% { transform: rotate(-4deg) skewY(-6deg) scaleX(1.04); }
      100% { transform: rotate(0deg) skewY(0deg) scaleX(1); }
    }
    .cape-flutter {
      transform-origin: 275px 230px;
      animation: cape-wave 0.8s ease-in-out infinite;
    }

    /* 背景云朵分层视差滑动 */
    @keyframes sky-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }

    .cloud-layer-far {
      animation: sky-scroll 24s linear infinite;
    }
    .cloud-layer-mid {
      animation: sky-scroll 13s linear infinite;
    }
    .cloud-layer-near {
      animation: sky-scroll 7s linear infinite;
    }

    /* 飞机机身悬浮颠簸动画 */
    @keyframes plane-bobbing {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      20% { transform: translate(-3px, -12px) rotate(-1.5deg); }
      40% { transform: translate(5px, 6px) rotate(1.2deg); }
      60% { transform: translate(-4px, -18px) rotate(-2deg); }
      80% { transform: translate(4px, 4px) rotate(0.8deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .plane-idle {
      animation: plane-bobbing 3.2s ease-in-out infinite;
    }

    /* 祥云环绕飞机 */
    @keyframes cloud-ring {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }

    /* 按钮微动特效 */
    .btn-press:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- 顶部导航 & 状态条 -->
  <header class="w-full bg-slate-900/80 backdrop-blur border-b border-amber-500/30 px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/30 border border-yellow-200">
        <i class="fa-solid fa-plane-up text-slate-950 font-bold text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-chinese-title tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-orange-400 font-bold drop-shadow">
          齐天大圣・筋斗云号重型战机
        </h1>
        <p class="text-xs text-amber-200/70">Wukong Fighter Jet · 东方神话 × 赛博奇幻 2D SVG 动画</p>
      </div>
    </div>

    <!-- 快捷飞行仪表/状态 -->
    <div class="flex items-center gap-2 md:gap-4 text-xs font-mono">
      <div class="hidden sm:flex flex-col items-end px-3 py-1 bg-slate-800/80 rounded-lg border border-slate-700">
        <span class="text-slate-400">法力充能</span>
        <span id="manaText" class="text-amber-400 font-bold text-sm">100,000 里/时</span>
      </div>
      <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/40 px-3 py-1.5 rounded-lg text-amber-300 font-cartoon">
        <i class="fa-solid fa-bolt animate-pulse text-yellow-400"></i>
        <span id="flightStateText">超音速巡航中</span>
      </div>
    </div>
  </header>

  <!-- 主视窗容器 -->
  <main class="flex-1 flex flex-col items-center justify-center p-2 md:p-6 relative max-w-7xl mx-auto w-full">
    
    <!-- 舞台外壳 -->
    <div class="relative w-full aspect-[16/9] max-h-[70vh] rounded-2xl overflow-hidden shadow-2xl shadow-amber-500/10 border-2 border-amber-500/40 bg-gradient-to-b from-sky-950 via-indigo-950 to-slate-950">
      
      <!-- 主 SVG 画布 (所有的角色、飞机、云彩、特效均在此矢量渲染) -->
      <svg id="wukongCanvas" viewBox="0 0 1200 675" class="w-full h-full block cursor-crosshair" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        
        <defs>
          <!-- 渐变：天空背景 -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0b1a38" />
            <stop offset="35%" stop-color="#182c5a" />
            <stop offset="70%" stop-color="#462c66" />
            <stop offset="100%" stop-color="#d95e34" />
          </linearGradient>

          <!-- 太阳渐变 -->
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff5cc" />
            <stop offset="30%" stop-color="#ffb703" />
            <stop offset="70%" stop-color="#fb8500" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#fb8500" stop-opacity="0" />
          </radialGradient>

          <!-- 祥云金色渐变 -->
          <linearGradient id="goldCloudGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe699" stop-opacity="0.95" />
            <stop offset="50%" stop-color="#fdbb2d" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#e07a14" stop-opacity="0.75" />
          </linearGradient>

          <!-- 筋斗云高光渐变 -->
          <linearGradient id="somersaultGrad" x1="0" y1="0" x2="1" y2="0.6">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#fff1aa" />
            <stop offset="90%" stop-color="#ffcc33" />
            <stop offset="100%" stop-color="#ff9900" />
          </linearGradient>

          <!-- 机身中国红大漆渐变 -->
          <linearGradient id="planeHullGrad" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0%" stop-color="#e63946" />
            <stop offset="30%" stop-color="#c1121f" />
            <stop offset="75%" stop-color="#780000" />
            <stop offset="100%" stop-color="#400202" />
          </linearGradient>

          <!-- 机身黄金镶边渐变 -->
          <linearGradient id="goldTrimGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff9d2" />
            <stop offset="40%" stop-color="#ffd700" />
            <stop offset="80%" stop-color="#e6ac00" />
            <stop offset="100%" stop-color="#996e00" />
          </linearGradient>

          <!-- 金箍棒金属渐变 -->
          <linearGradient id="bangMetalGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff4444" />
            <stop offset="30%" stop-color="#cc1111" />
            <stop offset="50%" stop-color="#ff6666" />
            <stop offset="70%" stop-color="#880000" />
            <stop offset="100%" stop-color="#440000" />
          </linearGradient>

          <!-- 金箍棒两端金箍渐变 -->
          <linearGradient id="bangGoldCap" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff099" />
            <stop offset="40%" stop-color="#ffd700" />
            <stop offset="70%" stop-color="#ffaa00" />
            <stop offset="100%" stop-color="#bb7700" />
          </linearGradient>

          <!-- 驾驶舱风挡玻璃反光渐变 -->
          <linearGradient id="canopyGlass" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
            <stop offset="0%" stop-color="#a0e9ff" stop-opacity="0.85" />
            <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
            <stop offset="75%" stop-color="#0284c7" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#0369a1" stop-opacity="0.75" />
          </linearGradient>

          <!-- 尾喷等离子火焰渐变 -->
          <linearGradient id="jetFlameGrad" x1="1" y1="0.5" x2="0" y2="0.5">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#ffff33" />
            <stop offset="60%" stop-color="#ff5500" stop-opacity="0.9" />
            <stop offset="90%" stop-color="#9900ff" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </linearGradient>

          <!-- 猴毛毛发渐变 -->
          <linearGradient id="furGrad" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#d4924b" />
            <stop offset="60%" stop-color="#a86523" />
            <stop offset="100%" stop-color="#733c06" />
          </linearGradient>

          <!-- 猴脸粉润肤色 -->
          <linearGradient id="faceGrad" x1="0.3" y1="0" x2="0.7" y2="1">
            <stop offset="0%" stop-color="#ffdfd3" />
            <stop offset="100%" stop-color="#fca590" />
          </linearGradient>

          <!-- 滤镜：强烈发光 -->
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <!-- 滤镜：金光烈焰 -->
          <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 1. 天空背景 -->
        <rect width="1200" height="675" fill="url(#skyGrad)" />

        <!-- 远景：霞光夕阳/朝阳与浮岛天宫轮廓 -->
        <g id="celestialBackdrop">
          <!-- 巨大仙界太阳 -->
          <circle cx="1020" cy="220" r="160" fill="url(#sunGrad)" opacity="0.85" />

          <!-- 天宫南天门/仙山远景剪影 -->
          <path d="M 850 490 Q 920 420 980 470 T 1100 440 L 1200 480 L 1200 675 L 850 675 Z" fill="#2d1d4d" opacity="0.45" />
          <!-- 悬浮仙山群 -->
          <g opacity="0.4" fill="#3c2262">
            <!-- 悬浮岛1 -->
            <path d="M 120 420 Q 180 390 260 410 Q 300 425 280 450 Q 230 480 180 470 Q 130 460 120 420 Z" />
            <polygon points="170,410 178,380 188,410" fill="#2d1a49" />
            <!-- 悬浮岛2 -->
            <path d="M 680 460 Q 750 430 820 450 Q 840 475 790 510 Q 730 520 690 490 Z" />
          </g>
        </g>

        <!-- 2. 远景云海 (平移速度最慢) -->
        <g class="cloud-layer-far" opacity="0.45">
          <!-- 拼合双倍宽度以实现无缝循环 (1200px + 1200px) -->
          <g>
            <path d="M 0 520 C 100 480 200 560 300 510 C 400 470 520 530 650 490 C 780 460 880 540 1000 500 C 1100 460 1180 520 1250 510 L 1250 675 L 0 675 Z" fill="#713f7c" />
            <path d="M 1200 520 C 1300 480 1400 560 1500 510 C 1600 470 1720 530 1850 490 C 1980 460 2080 540 2200 500 C 2300 460 2380 520 2450 510 L 2450 675 L 1200 675 Z" fill="#713f7c" />
          </g>
        </g>

        <!-- 3. 中景祥云层 (经典如意卷云纹) -->
        <g class="cloud-layer-mid" opacity="0.75">
          <g fill="url(#goldCloudGrad)">
            <!-- 组1 -->
            <g transform="translate(0, 0)">
              <!-- 传统祥云大朵 -->
              <path d="M -50 360 Q 20 280 100 320 Q 170 260 260 310 Q 340 270 420 330 Q 500 310 560 370 Q 520 440 400 440 Q 300 450 200 430 Q 90 450 -20 420 Z" />
              <path d="M 600 420 Q 680 340 760 380 Q 840 330 920 370 Q 1000 340 1070 400 Q 1020 470 910 470 Q 790 480 710 460 Z" />
            </g>
            <!-- 组2 重复平移用于无缝连接 -->
            <g transform="translate(1200, 0)">
              <path d="M -50 360 Q 20 280 100 320 Q 170 260 260 310 Q 340 270 420 330 Q 500 310 560 370 Q 520 440 400 440 Q 300 450 200 430 Q 90 450 -20 420 Z" />
              <path d="M 600 420 Q 680 340 760 380 Q 840 330 920 370 Q 1000 340 1070 400 Q 1020 470 910 470 Q 790 480 710 460 Z" />
            </g>
          </g>
        </g>

        <!-- 4. 速度风线 (超光速穿梭感) -->
        <g id="speedLines" stroke="#ffffff" stroke-dasharray="120 80" opacity="0.45" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="80" x2="2400" y2="80" class="cloud-layer-near" />
          <line x1="200" y1="160" x2="2600" y2="160" class="cloud-layer-mid" />
          <line x1="50" y1="280" x2="2450" y2="280" class="cloud-layer-near" stroke-width="3" />
          <line x1="300" y1="410" x2="2700" y2="410" class="cloud-layer-near" />
          <line x1="100" y1="560" x2="2500" y2="560" class="cloud-layer-mid" stroke-width="4" opacity="0.6" stroke="#fed7aa" />
          <line x1="450" y1="620" x2="2850" y2="620" class="cloud-layer-near" stroke-width="2" />
        </g>

        <!-- 5. 核心主角：孙悟空 与 其座驾【筋斗云号·齐天战机】 -->
        <!-- 该组通过平滑 JS 跟踪鼠标 / 触摸，默认带呼吸摇摆动画 -->
        <g id="flightMasterGroup" transform="translate(180, 70)">
          
          <g id="planeInner" class="plane-idle">
            
            <!-- A. 飞机尾部特效：等离子三昧真火喷射 -->
            <g id="jetExhaust" transform="translate(20, 10)">
              <!-- 主焰流 -->
              <polygon points="175,255 175,285 10,295 -40,270 10,245" fill="url(#jetFlameGrad)" class="jet-fire" />
              <!-- 内核白热焰 -->
              <polygon points="175,262 175,278 70,275 40,270 70,265" fill="#ffffff" filter="url(#glow)" class="jet-fire" opacity="0.95" />
              <!-- 尾部喷口激波环 (Shock diamonds) -->
              <ellipse cx="120" cy="270" rx="6" ry="12" fill="#fff" opacity="0.75" />
              <ellipse cx="70" cy="270" rx="5" ry="9" fill="#ffea00" opacity="0.7" />
              <ellipse cx="20" cy="270" rx="3" ry="6" fill="#ff5500" opacity="0.5" />
            </g>

            <!-- B. 筋斗云底盘气垫 / 云雾翻腾包裹机身 -->
            <g id="somersaultUnderVehicle" opacity="0.95">
              <!-- 底座如意金云波浪 -->
              <path d="M 180 320 C 220 345 280 350 340 330 C 400 310 460 335 520 320 C 560 310 590 280 560 260 C 530 240 480 250 450 255 C 380 240 300 245 230 270 C 180 285 150 300 180 320 Z" fill="url(#somersaultGrad)" filter="url(#glow)" />
              
              <!-- 祥云漩涡花纹 (中国传统如意云头纹) -->
              <path d="M 230 300 Q 250 280 275 295 T 300 315" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
              <path d="M 350 315 Q 380 290 410 305 T 440 325" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
              <path d="M 470 300 Q 500 275 525 295" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
              
              <!-- 云团高光小球团 -->
              <circle cx="210" cy="315" r="22" fill="#ffffff" opacity="0.7" />
              <circle cx="270" cy="335" r="28" fill="#ffffff" opacity="0.6" />
              <circle cx="360" cy="340" r="25" fill="#ffffff" opacity="0.6" />
              <circle cx="470" cy="325" r="26" fill="#ffffff" opacity="0.7" />
            </g>

            <!-- C. 战机机身主翼 (后侧机翼) -->
            <g id="backWing">
              <polygon points="320,230 210,130 270,120 430,230" fill="#a00c19" stroke="#ffd700" stroke-width="3" stroke-linejoin="round" />
              <!-- 金色回字纹饰 / 翼尖小翼 -->
              <polygon points="210,130 270,120 255,100 200,105" fill="url(#goldTrimGrad)" />
            </g>

            <!-- D. 战机机身本体 (流线型重装战机，兼具传统龙鳞雕文与未来感) -->
            <g id="planeFuselage">
              <!-- 尾翼 (垂直尾翼) -->
              <polygon points="190,240 140,110 210,110 260,230" fill="url(#planeHullGrad)" stroke="#ffb703" stroke-width="3.5" stroke-linejoin="round" />
              <!-- 尾翼金色齐天印章 -->
              <circle cx="180" cy="155" r="18" fill="#ffeaa7" stroke="#d63031" stroke-width="2" />
              <text x="180" y="162" font-size="16" font-family="'Ma Shan Zheng', serif" font-weight="bold" fill="#c0392b" text-anchor="middle">齐天</text>
              
              <!-- 飞机后机体与喷气管连接段 -->
              <path d="M 170 240 L 230 230 L 250 285 L 170 280 Z" fill="#2b2d42" stroke="#fbbf24" stroke-width="2" />

              <!-- 机腹主舱体 -->
              <path d="M 220 285 C 320 300 450 295 560 270 C 600 260 620 250 620 245 C 620 240 590 230 530 220 C 420 200 320 210 240 240 Z" fill="url(#planeHullGrad)" stroke="#ffe600" stroke-width="3.5" />

              <!-- 机身金黄祥云龙鳞拉花 -->
              <path d="M 330 265 Q 380 250 430 265 T 530 250" fill="none" stroke="url(#goldTrimGrad)" stroke-width="5" stroke-linecap="round" />
              <path d="M 310 278 Q 360 265 410 278 T 490 268" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

              <!-- 机首雷达罩 / 迎角尖锥 (形似佛门宝珠/金刚杵) -->
              <polygon points="560,235 650,250 560,265" fill="url(#goldTrimGrad)" stroke="#d97706" stroke-width="2" />
              <!-- 迎角针探头 -->
              <line x1="645" y1="250" x2="685" y2="250" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
              <circle cx="685" cy="250" r="3.5" fill="#fff" />
            </g>

            <!-- E. 驾驶员：美猴王・齐天大圣 孙悟空 ！！！ -->
            <g id="sunWukongPilot">
              
              <!-- 红色英雄披风 (迎风呼啸) -->
              <g class="cape-flutter">
                <!-- 披风阴影与里布 -->
                <path d="M 285 240 C 230 230 150 210 70 240 C 130 265 200 275 285 265 Z" fill="#990000" />
                <!-- 披风正红面料 -->
                <path d="M 285 235 C 220 210 130 190 40 220 C 100 250 190 270 290 260 Z" fill="#e60000" stroke="#ffcc00" stroke-width="2" />
                <path d="M 60 225 Q 160 235 275 245" stroke="#ffdd59" stroke-width="2" fill="none" opacity="0.8" />
              </g>

              <!-- 锁子黄金甲 躯干与肩甲 -->
              <g id="wukongBody">
                <!-- 身体甲胄 -->
                <rect x="295" y="220" width="55" height="50" rx="10" fill="url(#goldTrimGrad)" stroke="#a67c00" stroke-width="2" />
                <!-- 护心宝镜 (明光铠) -->
                <ellipse cx="322" cy="245" rx="14" ry="12" fill="#ffffff" stroke="#ffaa00" stroke-width="3" filter="url(#glow)" opacity="0.85" />
                <!-- 肩披锦澜红襟 -->
                <path d="M 285 220 Q 320 230 355 220 L 350 238 Q 320 245 290 238 Z" fill="#d90429" stroke="#ffd700" stroke-width="1.5" />
              </g>

              <!-- 孙悟空头部全套 -->
              <g id="wukongHead">

  <!-- 交互逻辑脚本 -->
  <script>
    // 基础元素引用
    const svgCanvas = document.getElementById('wukongCanvas');
    const flightMasterGroup = document.getElementById('flightMasterGroup');
    const planeInner = document.getElementById('planeInner');
    const laserBeamGroup = document.getElementById('laserBeamGroup');

    const flightStateText = document.getElementById('flightStateText');
    const autoPilotToggle = document.getElementById('autoPilotToggle');
    const btnAcrobatic = document.getElementById('btnAcrobatic');
    const btnSpeedBoost = document.getElementById('btnSpeedBoost');
    const btnLaserFire = document.getElementById('btnLaserFire');
    const btnSoundToggle = document.getElementById('btnSoundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const aimCrosshair = document.getElementById('aimCrosshair');

    // 状态量
    let soundEnabled = true;
    let autoPilot = true;
    let isAcrobatic = false;
    let isBoosting = false;

    // 飞机坐标与动力学插值
    let currentX = 220;
    let currentY = 120;
    let targetX = 220;
    let targetY = 120;
    let currentRoll = 0;
    let targetRoll = 0;

    // Web Audio API 极简神话引擎声与激光音效
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放激光音效
    function playLaserSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.warn(e);
      }
    }

    // 播放加速空爆音效
    function playBoostSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.warn(e);
      }
    }

    // 切换音效按钮
    btnSoundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.className = 'fa-solid fa-volume-high';
        soundText.textContent = '仙界引擎音效: 开';
        initAudio();
      } else {
        soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
        soundText.textContent = '仙界引擎音效: 关';
      }
    });

    // 自动巡航开关
    autoPilotToggle.addEventListener('change', (e) => {
      autoPilot = e.target.checked;
      flightStateText.textContent = autoPilot ? '大圣自律巡航中' : '手动驭风飞行中';
    });

    // 将屏幕坐标映射到 SVG 坐标 (0~1200, 0~675)
    function getSvgCoordinates(clientX, clientY) {
      const rect = svgCanvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 1200;
      const y = ((clientY - rect.top) / rect.height) * 675;
      return { x, y };
    }

    // 鼠标与触摸交互
    function handlePointerMove(e) {
      if (autoPilot) return; // 若处于自动巡航，不打断动画
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const pos = getSvgCoordinates(clientX, clientY);

      // 限制在合理屏幕视野内 (保留机身尺寸)
      targetX = Math.max(80, Math.min(pos.x - 360, 520));
      targetY = Math.max(40, Math.min(pos.y - 230, 320));

      // 根据垂直移动趋势计算俯仰角
      const dy = targetY - currentY;
      targetRoll = Math.max(-16, Math.min(16, dy * 0.25));

      // 准星跟随
      aimCrosshair.setAttribute('transform', `translate(${Math.min(pos.x + 240, 1100)}, ${pos.y})`);
    }

    svgCanvas.addEventListener('mousemove', handlePointerMove);
    svgCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointerMove(e);
    }, { passive: false });

    // 点击画布发射激光
    svgCanvas.addEventListener('click', fireLaser);

    // 发射如意金箍棒神光
    function fireLaser() {
      playLaserSound();
      laserBeamGroup.style.opacity = '1';
      flashOverlay.style.opacity = '0.7';

      // 产生后坐力
      currentX -= 25;

      setTimeout(() => {
        laserBeamGroup.style.opacity = '0';
        flashOverlay.style.opacity = '0';
      }, 220);
    }
    btnLaserFire.addEventListener('click', fireLaser);

    // 特技 1: 360 度筋斗云后空翻
    btnAcrobatic.addEventListener('click', () => {
      if (isAcrobatic) return;
      isAcrobatic = true;
      playBoostSound();
      flightStateText.textContent = '翻筋斗云特技中！';
      
      const startRoll = currentRoll;
      let startProgress = 0;
      const duration = 1200; // ms
      const startTime = performance.now();

      function rollLoop(now) {
        const elapsed = now - startTime;
        const p = Math.min(1, elapsed / duration);
        // easeInOutBack 或者平滑 360 度
        const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        currentRoll = ease * -360;

        // 翻滚轨迹同时向上画一个圆形循环
        const arch = Math.sin(p * Math.PI) * -120;
        flightMasterGroup.setAttribute(
          'transform',
          `translate(${currentX}, ${currentY + arch}) rotate(${currentRoll}, 380, 240)`
        );

        if (p < 1) {
          requestAnimationFrame(rollLoop);
        } else {
          currentRoll = 0;
          isAcrobatic = false;
          flightStateText.textContent = autoPilot ? '大圣自律巡航中' : '手动驭风飞行中';
        }
      }
      requestAnimationFrame(rollLoop);
    });

    // 特技 2: 十万八千里爆发加速
    btnSpeedBoost.addEventListener('click', () => {
      if (isBoosting) return;
      isBoosting = true;
      playBoostSound();
      flightStateText.textContent = '十万八千里・神速突进！';
      manaText.textContent = '1,080,000 里/时 (极速)';
      manaText.className = 'text-red-400 font-bold text-sm animate-pulse';

      // 机身剧烈前冲
      const prevX = targetX;
      targetX += 160;

      // 尾喷火焰激增
      const jetFire = document.querySelectorAll('.jet-fire');
      jetFire.forEach(el => el.style.transform = 'scale(2.2, 1.4)');

      setTimeout(() => {
        targetX = prevX;
        jetFire.forEach(el => el.style.transform = '');
        isBoosting = false;
        manaText.textContent = '100,000 里/时';
        manaText.className = 'text-amber-400 font-bold text-sm';
        flightStateText.textContent = autoPilot ? '大圣自律巡航中' : '手动驭风飞行中';
      }, 1600);
    });

    // 主动画循环：平滑阻尼插值 (Lerp) 与自律巡航
    let frameCount = 0;
    function mainLoop(time) {
      frameCount++;

      if (autoPilot && !isAcrobatic) {
        // 大圣自律智能飞行：优雅平滑的八字环绕机动
        const t = time * 0.0015;
        targetX = 180 + Math.sin(t * 0.8) * 70;
        targetY = 110 + Math.cos(t * 1.2) * 55;
        targetRoll = Math.cos(t * 1.2) * 8;

        // 准星微动
        aimCrosshair.setAttribute(
          'transform',
          `translate(${860 + Math.sin(t) * 40}, ${250 + Math.cos(t * 1.5) * 30})`
        );
      }

      if (!isAcrobatic) {
        // 平滑插值机身位移
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;
        currentRoll += (targetRoll - currentRoll) * 0.1;

        flightMasterGroup.setAttribute(
          'transform',
          `translate(${currentX.toFixed(2)}, ${currentY.toFixed(2)}) rotate(${currentRoll.toFixed(2)}, 380, 240)`
        );
      }

      requestAnimationFrame(mainLoop);
    }
    requestAnimationFrame(mainLoop);
  </script>
