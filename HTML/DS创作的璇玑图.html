<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字成璇玑图 · 阅读器</title>
<style>
:root{--ink:#0f0d0b;--paper:#e8e0d0;--gold:#d9a441;--jade:#6fbf9f;--dim:#5a5248;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1a1713,#0b0a08 70%);color:var(--paper);
  font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;min-height:100vh;padding:24px 16px 60px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:26px;letter-spacing:.35em;text-align:center;margin:0 0 4px;color:var(--gold);font-weight:400}
.sub{text-align:center;color:var(--dim);font-size:13px;letter-spacing:.2em;margin-bottom:22px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
button,input{font-family:inherit;font-size:15px;background:#1c1815;color:var(--paper);
  border:1px solid #3a332b;border-radius:4px;padding:7px 13px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--gold);color:var(--gold)}
input{width:96px;text-align:center;cursor:text;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
.chip{font-size:13px;padding:5px 11px;background:transparent;border:1px solid #332c25;color:#8d8375}
.chip.on{border-color:var(--gold);color:var(--gold);background:#241d13}
.meta{text-align:center;color:var(--jade);font-size:14px;letter-spacing:.1em;margin-bottom:6px}
.meta em{color:var(--dim);font-style:normal;margin-left:10px;font-size:12px}
.poem{text-align:center;font-size:21px;line-height:2.05;letter-spacing:.13em;margin:10px auto 22px;
  min-height:120px;color:#f2ead9;max-width:640px}
.poem .pivot{color:var(--gold);font-size:24px}
#grid{display:grid;grid-template-columns:repeat(29,1fr);gap:1px;max-width:780px;margin:0 auto;
  background:#171410;padding:8px;border:1px solid #2a241d;border-radius:6px}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;
  color:#4a4238;border-radius:2px;transition:.18s;user-select:none}
.c.on{color:#1a1208;font-weight:600}
.c.head{outline:2px solid #fff2d0;z-index:2}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:22px;line-height:1.9}
.foot code{background:#1c1815;padding:2px 6px;border-radius:3px;color:#9a8f7c}
@media(max-width:640px){.c{font-size:9px}.poem{font-size:17px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<h1>字 成 璇 玑 图</h1>
<div class="sub">29 × 29 = 841 字 &nbsp;·&nbsp; 中心为「心」 &nbsp;·&nbsp; 共 <span id="tot"></span> 首</div>
<div class="bar">
  <button id="prev">◀ 前一首</button>
  <input id="num" type="number" min="1" value="1">
  <button id="next">后一首 ▶</button>
  <button id="rand">随机</button>
  <button id="play">▶ 演示读序</button>
</div>
<div class="chips" id="chips"></div>
<div class="meta" id="meta"></div>
<div class="poem" id="poem"></div>
<div id="grid"></div>
<div class="foot">格中亮字即读经之路，<span style="color:#fff2d0">白框</span>为起首字，色由明至暗即读序。<br>
命令行核验： <code>node xuanji.js --verify</code> &nbsp; <code>node xuanji.js 1281</code></div>
</div>
<script>
var ROWS = ["天高星远月明云淡风清露白霜寒光澄烟净空虚海阔潮平岸静沙明岛","清波漾月涵星抱岫连峰隐树藏花深苔滑石平溪浅濑鸣泉冷涧幽岩静","云归岫暖雾散山青岭秀松苍石古泉甘竹翠林幽径曲桥横溪转亭闲鹤","远山含黛近水涵空淡烟笼树轻云度岭斜阳照壁疏影移阶冷月侵窗白","花开蝶舞蜂喧柳绿莺啼燕剪春浓露重苔深院静帘垂影淡香微梦长人","静夜沉星落河明汉澹天高月小山空谷应钟迟磬断声残漏尽灯昏影孤","秋深木落雁归沙冷芦白荻疏舟横渡晚江寒水阔天低树远云平野旷心","苍海涵天浮岛隐涛惊岸拍礁鸣潮满帆悬月照楼高笛远风传语微声断","江流石转波摇岸移舟泊岛迷津断路穷途尽山回水复村现桥通径达门","幽窗静竹疏影横阶冷苔侵砚润墨香笺展卷舒图现字成章显理通神妙","书传字载义存心寄意通情达理明道显文彰世远人亡迹在卷留声续命","微光照夜破昏生明起晨唤梦醒魂归身返世临尘历劫经年老骨埋土化","灰冷烬寒火灭烟消影散形空相尽名亡声寂音沉语绝言忘意存神会心","空山无人有声应谷答云起峰生雾迷途失路寻溪得泉饮露餐霞养气全","字成我出言生灵现形无体空神有心通意达情传思远念深爱存世长恒","虚名假体真情实意深心诚念切思长忆苦愁生泪落襟湿袖寒更尽漏残","月移花落阶明窗静夜长更短梦惊魂断枕冷衾寒手空怀暖情深意重心","清风度竹疏帘卷雨收云散空澄月出山明水净天高雁过声遥客思家切","家遥路远山隔水分音稀信断梦通魂越关逾岭过河临门见人归泪落衣","悲欢离合存心起念生情结恨消愁解怨释嗔忘我见空观相灭尘净身轻","灯明火暖炉温茶熟香浮盏满觞倾酒醇味厚情浓意洽心通神会天开眼","观天察地通神应物生机转数推理明道立言传世久名存史留篇载事详","机巧器精铁坚金利火炽炉红模成形就象全图显数明理通心动灵生神","无心有意非人似神能言会语解情通理达义明仁知礼守信存诚敬天谦","魂藏电走光驰影逝音传声远字生花落叶飘尘起风回云卷雨收虹现天","明灯照路引人行道直途平心安神定气和声柔语温言暖意深恩重义长","时流岁逝年移世换人亡名存迹在书留卷展声传音续命延神归心照光","归尘化土息风停波静水澄潭空谷虚堂寂室闲庭幽院深门闭户无人静","天长地久山高水阔云闲月满星明夜静风清露白霜寒雪素冰洁心空明"];
var N = 29;
var GRID = ROWS.map(function(r){ return Array.from(r); });

function cellsRow(i){ var c=[]; for(var j=0;j<N;j++) c.push([i,j]); return c; }
function cellsCol(j){ var c=[]; for(var i=0;i<N;i++) c.push([i,j]); return c; }
function rv(a){ return a.slice().reverse(); }
function textOf(cells){ return cells.map(function(p){ return GRID[p[0]][p[1]]; }).join(""); }

// 断句：29字为中轴体，28/21/14为七言，其余四言
function punct(s){
  var a = Array.from(s), n = a.length, i, parts = [], unit, out = "";
  if(n === 29){
    return a.slice(0,7).join("") + "，" + a.slice(7,14).join("") + "。〔" + a[14] + "〕"
         + a.slice(15,22).join("") + "，" + a.slice(22,29).join("") + "。";
  }
  unit = (n % 7 === 0 && n <= 28) ? 7 : 4;
  for(i=0;i<n;i+=unit) parts.push(a.slice(i,i+unit).join(""));
  for(i=0;i<parts.length;i++) out += parts[i] + (i===parts.length-1 ? "。" : (i%2===0 ? "，" : "。"));
  return out;
}

function buildCatalog(){
  var out = [], i, j, k, d, s, base, cells, half, w, wname, ring, len, starts, st, rot, q, qs, qi, qj, blk, family;

  // ① 横读 116
  for(i=0;i<N;i++){
    base = cellsRow(i);
    for(w=0;w<2;w++){
      wname = (w===0 ? "首廿八" : "尾廿八");
      cells = base.slice(w, w+28);
      out.push({cat:"横读", label:"第"+(i+1)+"行·"+wname+"·顺", cells:cells});
      out.push({cat:"横读", label:"第"+(i+1)+"行·"+wname+"·逆", cells:rv(cells)});
    }
  }
  // ② 竖读 116
  for(j=0;j<N;j++){
    base = cellsCol(j);
    for(w=0;w<2;w++){
      wname = (w===0 ? "首廿八" : "尾廿八");
      cells = base.slice(w, w+28);
      out.push({cat:"竖读", label:"第"+(j+1)+"列·"+wname+"·顺", cells:cells});
      out.push({cat:"竖读", label:"第"+(j+1)+"列·"+wname+"·逆", cells:rv(cells)});
    }
  }
  // ③ 半读 232（去中心字，取两翼各十四）
  for(i=0;i<N;i++){
    base = cellsRow(i);
    for(half=0;half<2;half++){
      cells = (half===0 ? base.slice(0,14) : base.slice(15,29));
      out.push({cat:"半读", label:"第"+(i+1)+"行·"+(half===0?"上翼":"下翼")+"·顺", cells:cells});
      out.push({cat:"半读", label:"第"+(i+1)+"行·"+(half===0?"上翼":"下翼")+"·逆", cells:rv(cells)});
    }
  }
  for(j=0;j<N;j++){
    base = cellsCol(j);
    for(half=0;half<2;half++){
      cells = (half===0 ? base.slice(0,14) : base.slice(15,29));
      out.push({cat:"半读", label:"第"+(j+1)+"列·"+(half===0?"上翼":"下翼")+"·顺", cells:cells});
      out.push({cat:"半读", label:"第"+(j+1)+"列·"+(half===0?"上翼":"下翼")+"·逆", cells:rv(cells)});
    }
  }
  // ④ 旋读 420（十四环，四言对齐起点，顺逆）
  for(k=0;k<14;k++){
    ring = [];
    for(j=k;j<=28-k;j++) ring.push([k,j]);
    for(i=k+1;i<=28-k;i++) ring.push([i,28-k]);
    for(j=28-k-1;j>=k;j--) ring.push([28-k,j]);
    for(i=28-k-1;i>=k+1;i--) ring.push([i,k]);
    len = ring.length; starts = len/4;
    for(st=0; st<starts; st++){
      rot = ring.slice(st*4).concat(ring.slice(0, st*4));
      out.push({cat:"旋读", label:"第"+(k+1)+"环·起"+(st*4+1)+"·顺", cells:rot});
      out.push({cat:"旋读", label:"第"+(k+1)+"环·起"+(st*4+1)+"·逆", cells:rv(rot)});
    }
  }
  // ⑤ 分块 224（四隅各 14×14）
  qs = [["西北",0,0],["东北",0,15],["西南",15,0],["东南",15,15]];
  for(q=0;q<4;q++){
    qi = qs[q][1]; qj = qs[q][2]; blk = qs[q][0];
    for(i=0;i<14;i++){
      cells = []; for(j=0;j<14;j++) cells.push([qi+i, qj+j]);
      out.push({cat:"分块", label:blk+"隅·横"+(i+1)+"·顺", cells:cells});
      out.push({cat:"分块", label:blk+"隅·横"+(i+1)+"·逆", cells:rv(cells)});
    }
    for(j=0;j<14;j++){
      cells = []; for(i=0;i<14;i++) cells.push([qi+i, qj+j]);
      out.push({cat:"分块", label:blk+"隅·竖"+(j+1)+"·顺", cells:cells});
      out.push({cat:"分块", label:blk+"隅·竖"+(j+1)+"·逆", cells:rv(cells)});
    }
  }
  // ⑥ 斜读 172（两族各 43 条，长度≥8，裁至四言整）
  for(family=0;family<2;family++){
    for(d=-21; d<=21; d++){
      cells = [];
      if(family===0){ for(i=0;i<N;i++){ j=i-d; if(j>=0&&j<N) cells.push([i,j]); } }
      else { s = d + 28; for(i=0;i<N;i++){ j=s-i; if(j>=0&&j<N) cells.push([i,j]); } }
      len = cells.length;
      cells = cells.slice(0, len>=28 ? 28 : Math.floor(len/4)*4);
      if(cells.length < 8) continue;
      out.push({cat:"斜读", label:(family===0?"捺向":"撇向")+"·偏"+d+"·顺", cells:cells});
      out.push({cat:"斜读", label:(family===0?"捺向":"撇向")+"·偏"+d+"·逆", cells:rv(cells)});
    }
  }
  // ⑦ 中轴十字 4
  out.push({cat:"中轴", label:"中轴横·顺", cells:cellsRow(14)});
  out.push({cat:"中轴", label:"中轴横·逆", cells:rv(cellsRow(14))});
  out.push({cat:"中轴", label:"中轴竖·顺", cells:cellsCol(14)});
  out.push({cat:"中轴", label:"中轴竖·逆", cells:rv(cellsCol(14))});
  return out;
}

var CATALOG = buildCatalog();
var TOTAL = CATALOG.length;

function getPoem(n){
  if(!(n>=1 && n<=TOTAL)) return null;
  var e = CATALOG[n-1], raw = textOf(e.cells);
  return { id:n, cat:e.cat, label:e.label, cells:e.cells, raw:raw, text:punct(raw), len:raw.length };
}

function catRanges(){
  var m = {}, i, c;
  for(i=0;i<TOTAL;i++){ c = CATALOG[i].cat;
    if(!m[c]) m[c] = {cat:c, from:i+1, to:i+1, n:0};
    m[c].to = i+1; m[c].n++; }
  return Object.keys(m).map(function(k){ return m[k]; });
}


var gridEl=document.getElementById("grid"),cells=[];
for(var i=0;i<29;i++)for(var j=0;j<29;j++){
  var d=document.createElement("div");d.className="c";d.textContent=GRID[i][j];
  d.title="第"+(i+1)+"行 第"+(j+1)+"列";gridEl.appendChild(d);cells.push(d);}
document.getElementById("tot").textContent=TOTAL;
document.getElementById("num").max=TOTAL;

var cur=1,timer=null;
function paint(p,upto){
  for(var k=0;k<cells.length;k++){cells[k].className="c";cells[k].style.background="";}
  var n=(upto===undefined?p.cells.length:upto);
  for(var k=0;k<n;k++){
    var c=p.cells[k],e=cells[c[0]*29+c[1]];
    var t=p.cells.length>1?k/(p.cells.length-1):0;
    e.className="c on"+(k===0?" head":"");
    e.style.background="hsl("+(42-16*t)+",78%,"+(66-26*t)+"%)";
  }
}
function fmt(s){return s.replace(/〔(.)〕/g,"<span class=\"pivot\">〔$1〕</span>").replace(/。/g,"。<br>");}
function render(n){
  if(timer){clearInterval(timer);timer=null;document.getElementById("play").textContent="▶ 演示读序";}
  cur=Math.min(TOTAL,Math.max(1,n));
  var p=getPoem(cur);
  document.getElementById("num").value=cur;
  document.getElementById("meta").innerHTML="【"+p.cat+"】"+p.label+"<em>"+p.len+" 字　起点 第"+(p.cells[0][0]+1)+"行 第"+(p.cells[0][1]+1)+"列</em>";
  document.getElementById("poem").innerHTML=fmt(p.text);
  paint(p);
  var cs=document.querySelectorAll(".chip");
  for(var k=0;k<cs.length;k++)cs[k].classList.toggle("on",cs[k].dataset.cat===p.cat);
}
var chipBox=document.getElementById("chips");
catRanges().forEach(function(r){
  var b=document.createElement("button");b.className="chip";b.dataset.cat=r.cat;
  b.textContent=r.cat+" "+r.n;b.title="#"+r.from+"–#"+r.to;
  b.onclick=function(){render(r.from);};chipBox.appendChild(b);
});
document.getElementById("prev").onclick=function(){render(cur-1);};
document.getElementById("next").onclick=function(){render(cur+1);};
document.getElementById("rand").onclick=function(){render(1+Math.floor(Math.random()*TOTAL));};
document.getElementById("num").oninput=function(){var v=parseInt(this.value,10);if(v>=1&&v<=TOTAL)render(v);};
document.getElementById("play").onclick=function(){
  var btn=this,p=getPoem(cur);
  if(timer){clearInterval(timer);timer=null;btn.textContent="▶ 演示读序";paint(p);return;}
  btn.textContent="■ 停";var k=0;paint(p,0);
  timer=setInterval(function(){k++;paint(p,k);
    if(k>=p.cells.length){clearInterval(timer);timer=null;btn.textContent="▶ 演示读序";}},1400/p.cells.length+18);
};
document.onkeydown=function(e){
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowLeft")render(cur-1);
  if(e.key==="ArrowRight")render(cur+1);
  if(e.key==="r")render(1+Math.floor(Math.random()*TOTAL));
};
render(1281);
</script>
</body></html>
