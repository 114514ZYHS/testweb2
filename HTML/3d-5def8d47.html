/* ══════════════════════════════════════════════════════════════
   0. 基础工具
   ══════════════════════════════════════════════════════════════ */
let _seed = 20260911;
const rnd = () => (_seed = (_seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

/* 场景尺度 */
const S = 9.0;              // 底座半宽（正方形）
const Y_STONE = 1.06;       // 石砌层顶
const Y_WOOD = 1.34;        // 木夹层顶
const Y_GROUND = 1.44;      // 前院（下层）地面

const TERR_Z = 0.95;        // 台地前缘

const TERR_HX = S - 0.04, TERR_R = 0.9;                   // 台地半宽 / 圆角半径

/* 台地顶面轮廓（与底座 plate 的圆角矩形一致），四角为圆角而非直角 */
function onTerrace(x, z) {
  const cz = (-S + 0.04 + TERR_Z) / 2, hz = (TERR_Z + S - 0.04) / 2;
  const dx = Math.max(0, Math.abs(x) - (TERR_HX - TERR_R));
  const dz = Math.max(0, Math.abs(z - cz) - (hz - TERR_R));
  return dx * dx + dz * dz <= TERR_R * TERR_R;
}

/* ══════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════

function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function noiseFill(g, w, h, colors, count, rmin, rmax, alpha = 0.5) {
  for (let i = 0; i < count; i++) {
    g.globalAlpha = alpha * rr(0.5, 1);
    g.fillStyle = colors[ri(0, colors.length - 1)];
    const x = rr(0, w), y = rr(0, h), r = rr(rmin, rmax);
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

/* 地面：整块 18×18 世界的俯视图（上=后=神社方向） */
function groundTexture() {

  g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, py(TERR_Z + 0.1)); g.lineTo(0, py(TERR_Z + 0.1)); g.closePath();

  g.globalAlpha = 1;

  g.save();

  g.moveTo(px(-2.0), py(TERR_Z + 0.2));
  g.lineTo(px(2.0), py(TERR_Z + 0.2));
  g.lineTo(px(2.3), py(8.9));
  g.lineTo(px(-2.3), py(8.9));
  g.closePath();
  g.fillStyle = '#cbb188'; g.fill();
  g.clip();
  noiseFill(g, W, H, ['#d6bd93', '#bfa77e', '#c9b087', '#dbc7a2'], 1500, 3, 14, 0.5);
  g.restore();
  /* 台阶位置 */
  g.globalAlpha = 0.9; g.fillStyle = '#c3ab84';
  g.fillRect(px(-2.2), py(TERR_Z), px(2.2) - px(-2.2), py(STAIR_Z1 + 0.5) - py(TERR_Z));
  g.globalAlpha = 1;

  g.save();
  g.beginPath();
  g.moveTo(px(-1.9), py(5.9));
  g.quadraticCurveTo(px(-3.6), py(5.4), px(-4.9), py(4.7));
  g.lineTo(px(-5.2), py(5.3));
  g.quadraticCurveTo(px(-3.7), py(6.1), px(-2.0), py(6.7));
  g.closePath();
  g.fillStyle = '#c9b189'; g.fill();
  g.restore();
  /* 侧边小路：通绘马架 */
  g.save();
  g.beginPath();
  g.moveTo(px(1.9), py(4.2));
  g.quadraticCurveTo(px(3.4), py(3.9), px(4.6), py(3.5));
  g.lineTo(px(4.9), py(4.1));
  g.quadraticCurveTo(px(3.6), py(4.6), px(2.0), py(4.9));
  g.closePath();
  g.fillStyle = '#c9b189'; g.fill();
  g.restore();
  /* 磨损斑块 */
  for (let i = 0; i < 90; i++) {
    const x = rr(-8.4, 8.4), z = rr(-8.4, 8.6);
    g.globalAlpha = rr(0.05, 0.16);
    g.fillStyle = srand_state(i) > 0.5 ? '#b9a077' : '#d5c19b';
    g.beginPath(); g.ellipse(px(x), py(z), rr(20, 90), rr(16, 70), rr(0, 3), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  /* 苔痕 / 草色斑块 */
  for (let i = 0; i < 120; i++) {
    const x = rr(-8.8, 8.8), z = rr(-8.6, 8.8);
    g.globalAlpha = rr(0.08, 0.22);
    g.fillStyle = ['#6f9f52', '#7cae5d', '#86b966'][ri(0, 2)];
    g.beginPath(); g.ellipse(px(x), py(z), rr(24, 110), rr(20, 90), rr(0, 3), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  /* 细碎落叶色点 */
  for (let i = 0; i < 700; i++) {
    const x = rr(-8.6, 8.6), z = rr(-8.6, 8.8);
    g.globalAlpha = rr(0.25, 0.6);
    g.fillStyle = ['#b98a4e', '#c99a5c', '#9d7a44', '#d8a86e', '#c76d5c'][ri(0, 4)];
    g.fillRect(px(x), py(z), rr(2, 5), rr(2, 4));
  }
  g.globalAlpha = 1;
  return c;
}
function srand_state(i) { return (Math.sin(i * 12.9898) * 43758.5453) % 1 + 0.5; }

/* 木纹 */
function woodTexture(base = '#c09263', dark = '#8d6741') {
  const W = 256, H = 256, c = cvs(W, H), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    g.globalAlpha = rr(0.05, 0.22);
    g.strokeStyle = rnd() > 0.5 ? dark : '#dbb488';
    g.lineWidth = rr(1, 3.5);
    g.beginPath();
    const y0 = rr(0, H);
    g.moveTo(0, y0);
    g.bezierCurveTo(W * 0.3, y0 + rr(-9, 9), W * 0.66, y0 + rr(-9, 9), W, y0 + rr(-6, 6));
    g.stroke();
  }
  g.globalAlpha = 0.5;
  for (let i = 0; i < 5; i++) { g.fillStyle = dark; g.fillRect(0, i * (H / 5), W, 2); }
  g.globalAlpha = 1;
  return c;
}

  g.fillStyle = '#3d4350'; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 16) {
    g.fillStyle = 'rgba(255,255,255,0.055)'; g.fillRect(x, 0, 8, H);
    g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(x + 12, 0, 4, H);
  }
  for (let y = 0; y < H; y += 64) { g.fillStyle = 'rgba(0,0,0,0.14)'; g.fillRect(0, y, W, 5); }

}
/* 白灰泥墙 */

/* 树皮 */

  const W = 128, H = 256, c = cvs(W, H), g = c.getContext('2d');
  g.fillStyle = '#8a6746'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) {

    g.lineWidth = rr(1, 3);

}
/* 叶片 / 花瓣 / 光点 / 云 */
function leafSprite(kind) {
  const W = 64, H = 64, c = cvs(W, H), g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  if (kind === 'petal') {
    g.fillStyle = '#f6c6d8';
    g.beginPath(); g.ellipse(32, 34, 15, 22, 0, 0, TAU); g.fill();
    g.fillStyle = '#eeb0c7';
    g.beginPath(); g.ellipse(38, 38, 10, 15, 0.3, 0, TAU); g.fill();
    g.strokeStyle = '#dc9cb4'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(32, 14); g.lineTo(32, 54); g.stroke();
  } else {
    g.fillStyle = kind === 'red' ? '#cf6a4e' : '#d9a154';
    g.beginPath();
    g.moveTo(32, 8); g.quadraticCurveTo(52, 22, 34, 56); g.quadraticCurveTo(12, 22, 32, 8);
    g.fill();
    g.strokeStyle = 'rgba(120,70,40,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(32, 12); g.lineTo(32, 54); g.stroke();

}
function dotSprite(inner = 'rgba(255,255,255,0.95)', outer = 'rgba(190,225,255,0)') {
  const W = 64, c = cvs(W, W), g = c.getContext('2d');

  grd.addColorStop(0, inner); grd.addColorStop(0.45, 'rgba(220,240,255,0.45)'); grd.addColorStop(1, outer);

  grd.addColorStop(0, 'rgba(30,24,34,0.78)');
  grd.addColorStop(0.5, 'rgba(35,28,40,0.42)');
  grd.addColorStop(1, 'rgba(40,32,48,0)');

function cloudSprite() {
  const W = 256, H = 128, c = cvs(W, H), g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) {
    const x = rr(40, W - 40), y = rr(46, H - 34), r = rr(16, 42);
    const grd = g.createRadialGradient(x, y - r * 0.2, 0, x, y, r);
    grd.addColorStop(0, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.6, 'rgba(255,252,250,0.55)');
    grd.addColorStop(1, 'rgba(255,250,250,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

/* ══════════════════════════════════════════════════════════════
   3. 三渲二材质体系 / 描边 / 几何装配
   ══════════════════════════════════════════════════════════════ */
const GRAD = (() => {
  const steps = [0.0, 0.30, 0.58, 0.83, 1.0];
  const d = new Uint8Array(steps.length * 4);
  steps.forEach((s, i) => { const v = Math.round(255 * s); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; });
  const t = new THREE.DataTexture(d, steps.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();

function toon(color, o = {}) {

}
const outlineCache = new Map();

  const k = thickness + '|' + color;
  if (!outlineCache.has(k)) outlineCache.set(k, new THREE.ShaderMaterial({
    uniforms: { uT: { value: thickness }, uC: { value: new THREE.Color(color) } },
    vertexShader: `uniform float uT;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vec3 n = normalize(normalMatrix * normal);
        mv.xyz += n * uT;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform vec3 uC; void main(){ gl_FragColor = vec4(uC,1.0); }`,
    side: THREE.BackSide
  }));
  return outlineCache.get(k);
}

const M = {

  wood: toon(0xc09263),
  woodDark: toon(0x8a6440),

/* 顶点色（用于同一材质下的多色合并体） */
function tint(g, c) {

  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b; }

const _v = a => new THREE.Vector3().fromArray(a || [0, 0, 0]);

  const m = new THREE.Matrix4().compose(
    _v(pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...(rot || [0, 0, 0]))), _v(scale || [1, 1, 1]));

const swayMats = [];
function sway(mat, o = {}) {
  const amp = o.amp ?? 0.07, freq = o.freq ?? 1.25, hh = o.h ?? 1.0, ph = o.phase ?? 0;
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = { value: 0 };
    sh.uniforms.uAmp = { value: amp };
    sh.uniforms.uFreq = { value: freq };
    sh.uniforms.uH = { value: hh };
    sh.uniforms.uPh = { value: ph };
    sh.vertexShader = `uniform float uTime,uAmp,uFreq,uH,uPh;\n` + sh.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         vec3 ip = (instanceMatrix * vec4(0.0,0.0,0.0,1.0)).xyz;
       #else
         vec3 ip = vec3(uPh*3.1, 0.0, uPh*2.3);
       #endif
       float wgt = clamp(transformed.y/uH, 0.0, 1.0); wgt *= wgt;
       transformed.x += sin(uTime*uFreq + ip.x*0.85 + ip.z*1.15) * uAmp * wgt;
       transformed.z += cos(uTime*uFreq*0.82 + ip.x*1.25 + ip.z*0.65) * uAmp * 0.72 * wgt;`
    );
    mat.userData.shader = sh;
  };
  mat.customProgramCacheKey = () => 'sway';
  swayMats.push(mat);
  return mat;
}

/* 圆角矩形轮廓采样（用于石砌块排布） */
function roundRectPerimeter(h, r, step, cb) {
  const c = h - r, seg = 2 * c, quad = Math.PI * r / 2;
  const total = 4 * seg + 4 * quad, n = Math.max(8, Math.round(total / step));
  for (let i = 0; i < n; i++) {
    const d = i * total / n;
    let x, z, nx, nz;
    if (d < seg) { x = -c + d; z = h; nx = 0; nz = 1; }
    else if (d < seg + quad) { const a = (d - seg) / r; x = c + r * Math.sin(a); z = c + r * Math.cos(a); nx = Math.sin(a); nz = Math.cos(a); }
    else if (d < 2 * seg + quad) { const a = d - seg - quad; x = h; z = c - a; nx = 1; nz = 0; }
    else if (d < 2 * seg + 2 * quad) { const a = (d - 2 * seg - quad) / r; x = c + r * Math.cos(a); z = -c - r * Math.sin(a); nx = Math.cos(a); nz = -Math.sin(a); }
    else if (d < 3 * seg + 2 * quad) { const a = d - 2 * seg - 2 * quad; x = c - a; z = -h; nx = 0; nz = -1; }
    else if (d < 3 * seg + 3 * quad) { const a = (d - 3 * seg - 2 * quad) / r; x = -c - r * Math.sin(a); z = -c - r * Math.cos(a); nx = -Math.sin(a); nz = -Math.cos(a); }
    else if (d < 4 * seg + 3 * quad) { const a = d - 3 * seg - 3 * quad; x = -h; z = -c + a; nx = -1; nz = 0; }
    else { const a = (d - 4 * seg - 3 * quad) / r; x = -c - r * Math.cos(a); z = c + r * Math.sin(a); nx = -Math.cos(a); nz = Math.sin(a); }
    cb(x, z, nx, nz, d);
  }
}
/* 圆角矩形 Shape（局部坐标 x = 世界 x，y = -世界 z） */
function roundRectShape(hx, y0, y1, r) {
  const s = new THREE.Shape();
  const cz = (y0 + y1) / 2, hz = (y1 - y0) / 2;
  /* 两个方向的圆角圆心各自退让 r，矩形非正方形时才不会切成斜边 */
  const cx = Math.max(0.001, hx - r), cy = Math.max(0.001, hz - r);
  s.moveTo(-cx, cz + hz);
  s.lineTo(cx, cz + hz);
  s.absarc(cx, cz + cy, r, Math.PI / 2, 0, true);
  s.lineTo(hx, cz - cy);
  s.absarc(cx, cz - cy, r, 0, -Math.PI / 2, true);
  s.lineTo(-cx, cz - hz);
  s.absarc(-cx, cz - cy, r, -Math.PI / 2, -Math.PI, true);
  s.lineTo(-hx, cz + cy);
  s.absarc(-cx, cz + cy, r, Math.PI, Math.PI / 2, true);
  return s;
}
/* 歇山/庑殿顶（含厚度） */
function hipRoofGeo(w, d, h, rl, t) {
  const pos = [];
  const P = (...pts) => pts.forEach(p => pos.push(p[0], p[1], p[2]));
  const quad = (a, b, c, e) => P(a, b, c, a, c, e);
  const A = [-w / 2, 0, -d / 2], B = [w / 2, 0, -d / 2], C = [w / 2, 0, d / 2], D = [-w / 2, 0, d / 2];
  const R1 = [-rl / 2, h, 0], R2 = [rl / 2, h, 0];
  const A2 = [-w / 2, -t, -d / 2], B2 = [w / 2, -t, -d / 2], C2 = [w / 2, -t, d / 2], D2 = [-w / 2, -t, d / 2];
  const R12 = [-rl / 2, h - t, 0], R22 = [rl / 2, h - t, 0];
  quad(D, C, R2, R1);
  quad(B, A, R1, R2);
  P(A, D, R1); P(C, B, R2);
  quad(R12, R22, C2, D2);
  quad(R22, R12, A2, B2);
  P(R12, D2, A2); P(R22, B2, C2);
  quad(A2, D2, D, A); quad(D2, C2, C, D); quad(C2, B2, B, C); quad(B2, A2, A, B);
  const g = new THREE.BufferGeometry();
  const f = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 3) { f[i] = pos[i]; f[i + 1] = pos[i + 1]; f[i + 2] = pos[i + 2]; }
  g.setAttribute('position', new THREE.BufferAttribute(f, 3));
  const uv = new Float32Array((f.length / 3) * 2);
  for (let i = 0, j = 0; i < f.length; i += 3, j += 2) { uv[j] = f[i] * 0.4; uv[j + 1] = f[i + 2] * 0.4; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
/* 三角截面（用于双坡屋顶、破风） */
function prismGeo(w, h, d) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
  g.translate(0, 0, -d / 2);
  return g.toNonIndexed();
}

/* 由俯视轮廓挤出的一块板：world z ∈ [z0,z1]，y ∈ [y0,y1] */
function plate(hx, z0, z1, y0, y1, r, mat) {
  const sh = roundRectShape(hx, -z1, -z0, r);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: y1 - y0, bevelEnabled: false });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.y = y0;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function buildBase() {

  /* 石砌块（沿圆角矩形外轮廓无缝排布，三层） */

  const rows = [
    { y: 0.20, h: 0.30, inset: 0.02 },
    { y: 0.55, h: 0.32, inset: 0.0 },
    { y: 0.90, h: 0.30, inset: 0.02 },
  ];
  const step = 0.84;
  const perRow = rows.map((row, k) => {
    const list = [];
    let i = 0;
    roundRectPerimeter(S - 0.03, 0.9, step, (x, z, nx, nz) => {
      const off = row.inset;
      list.push(mk(blockGeo, [x + nx * (0.085 - off), row.y + rr(-0.01, 0.01), z + nz * (0.085 - off)],

        [step * rr(0.99, 1.02) - off * 2, row.h * rr(0.94, 1.0), 0.19 + off],
        new THREE.Color().setHSL(0.09, rr(0.008, 0.025), rr(0.55, 0.64) + (i++ % 2) * 0.02)));
    });
    return list;
  });
  const stones = asm(perRow.flat(), M.vcol, { cast: false });
  g.add(stones);

  /* 木制夹层 */
  const woodLayers = [
    { y0: Y_STONE, y1: Y_STONE + 0.10, hx: S - 0.02, mat: M.woodDark },
    { y0: Y_STONE + 0.10, y1: Y_STONE + 0.20, hx: S - 0.10, mat: M.wood },
    { y0: Y_STONE + 0.20, y1: Y_WOOD, hx: S - 0.02, mat: M.woodLight },
  ];
  woodLayers.forEach(L => {
    const m = plate(L.hx, -L.hx, L.hx, L.y0, L.y1, 0.9, L.mat);
    m.add(new THREE.Mesh(m.geometry, outlineMat(0.018)));
    g.add(m);
  });
  /* 底面木托 */
  const foot = plate(S - 0.34, -S + 0.34, S - 0.34, 0.0, 0.16, 0.72, M.woodDark);
  g.add(foot);

  /* 地面板：下层（前院） */
  const cap = plate(S, -S, S, Y_GROUND - 0.11, Y_GROUND, 0.9, M.earth);
  cap.add(new THREE.Mesh(cap.geometry, outlineMat(0.02)));
  g.add(cap);

  /* 地面贴图平面（世界坐标 UV） */
  const gTex = tex(groundTexture(), 1 / (2 * S), 1 / (2 * S));
  gTex.offset.set(0.5, 0.5);
  const groundMat = toon(0xffffff, { map: gTex });
  const gTop = new THREE.Mesh(new THREE.ShapeGeometry(roundRectShape(S + 0.002, -S - 0.002, S + 0.002, 0.9), 24), groundMat);
  gTop.rotation.x = -Math.PI / 2;
  gTop.position.y = Y_GROUND + 0.004;
  gTop.receiveShadow = true;
  g.add(gTop);

  /* 上层台地（院内） */
  const terr = plate(S - 0.04, -S + 0.04, TERR_Z, Y_GROUND - 0.11, Y_TERR, 0.9, M.earth);
  g.add(terr);
  const tTop = new THREE.Mesh(new THREE.ShapeGeometry(roundRectShape(S - 0.038, -TERR_Z - 0.002, S - 0.038, 0.9), 24), groundMat);
  tTop.rotation.x = -Math.PI / 2;
  tTop.position.y = Y_TERR + 0.004;
  tTop.receiveShadow = true;
  g.add(tTop);

  /* 挡土墙石砌 */
  const wallParts = [];
  const bw = 0.8;
  const hasBank = bx => onTerrace(bx, TERR_Z - 0.07);   // 台地圆角之外已无土坡可挡
  for (let i = 0; i < 3; i++) {
    for (let x = -S + 0.5; x < S - 0.4; x += bw) {
      const bx = x + bw / 2 + (i % 2 ? bw / 2 : 0);
      /* 先取随机量再判断，保证随机序列与旧版一致 */
      const rotY = rr(-0.02, 0.02), sy = 0.17 * rr(0.9, 1.0), sat = rr(0.008, 0.025), li = rr(0.54, 0.62);
      if (Math.abs(x + bw / 2) < 2.35) continue;
      if (!hasBank(bx)) continue;
      wallParts.push(mk(blockGeo, [bx, Y_GROUND + 0.02 + i * 0.185, TERR_Z + 0.13],
        [0, rotY, 0], [bw * 0.94, sy, 0.24], new THREE.Color().setHSL(0.09, sat, li)));
    }

  g.add(asm(wallParts, M.vcol, { cast: true }));
  /* 挡土墙压顶木 */
  const cap2 = [];
  for (let x = -S + 0.4; x < S - 0.3; x += 1.2) {
    if (Math.abs(x) < 2.4) continue;
    if (!hasBank(x + 0.6)) continue;
    cap2.push(mk(G.box(1.15, 0.09, 0.42), [x + 0.6, Y_TERR + 0.045, TERR_Z + 0.15], [0, 0, 0], [1, 1, 1], 0xd6b184));
  }
  g.add(asm(cap2, M.vcol, { outline: 0.012 }));

  /* 石阶（中央） */
  const stepN = 3, stepD = (STAIR_Z1 - STAIR_Z0) / stepN, stepH = (Y_TERR - Y_GROUND) / stepN;
  const stairParts = [];
  for (let i = 0; i < stepN; i++) {
    const y = Y_GROUND + (i + 1) * stepH;
    const z = STAIR_Z0 + (stepN - 1 - i) * stepD + stepD / 2;
    stairParts.push(mk(G.box(4.3, stepH + 0.02, stepD + 0.02), [0, y - stepH / 2, z], [0, 0, 0], [1, 1, 1], 0xc9c5ba));
    stairParts.push(mk(G.box(4.5, 0.055, stepD + 0.08), [0, y - 0.02, z], [0, 0, 0], [1, 1, 1], 0xd8d4c9));
  }
  g.add(asm(stairParts, M.vcol, { outline: 0.014 }));
  return g;
}

/* 地面高度查询 */
function groundHeightAt(x, z) {
  if (onTerrace(x, z)) return Y_TERR;
  if (Math.abs(x) < 2.35 && z < STAIR_Z1) {
    const t = clamp((z - STAIR_Z0) / (STAIR_Z1 - STAIR_Z0), 0, 1);
    const stepH = (Y_TERR - Y_GROUND) / 3;
    return Y_TERR - Math.ceil(t * 3) * stepH;
  }
  let h = Y_GROUND;
  if (Math.abs(x) < 1.72 && z > 2.2 && z < 8.7) h += 0.032;      // 参道石板
  return h;
}

function buildSando() {
  const g = new THREE.Group();
  const slab = G.box(1, 0.07, 1);
  const parts = [];
  for (let row = 0; row < 10; row++) {
    const z = 2.62 + row * 0.655;
    for (let c = -1; c <= 1; c += 2) {
      const x = c * 0.815;
      const w = rr(1.42, 1.5), d = rr(0.56, 0.62);
      const tone = new THREE.Color().setHSL(0.12, rr(0.05, 0.1), rr(0.68, 0.79));
      parts.push(mk(slab, [x + rr(-0.03, 0.03), Y_GROUND + 0.016 + rr(-0.004, 0.004), z + rr(-0.02, 0.02)],
        [0, rr(-0.035, 0.035), 0], [w, 1, d], tone));
      /* 缝隙间的小碎石 */
      if (rnd() < 0.28) {
        parts.push(mk(G.dod(rr(0.05, 0.09)), [rr(-1.6, 1.6), Y_GROUND + 0.03, z + rr(-0.3, 0.3)],
          [rr(0, 3), rr(0, 3), rr(0, 3)], [1, 0.6, 1], new THREE.Color().setHSL(0.1, 0.05, rr(0.66, 0.8))));
      }
    }
  }
  g.add(asm(parts, M.vcol, { outline: 0.013 }));
  /* 参道两侧踏石边线 */
  const edge = [];
  for (let row = 0; row < 11; row++) {
    const z = 2.4 + row * 0.64;
    [-1.95, 1.95].forEach(x => {
      edge.push(mk(G.dod(rr(0.17, 0.24)), [x + rr(-0.06, 0.06), Y_GROUND + 0.05, z],
        [rr(0, 3), rr(0, 3), rr(0, 3)], [1, rr(0.5, 0.7), 1],
        new THREE.Color().setHSL(0.1, rr(0.03, 0.07), rr(0.66, 0.78))));
    });
  }
  g.add(asm(edge, M.vcol, { outline: 0.013, oc: 0x463a42 }));
  return g;
}

      setFrame(F_IDX.sweep[idx]);
      R.t += dt;
      if (R.t > 5.0) { R.state = 'pause'; R.t = 0; R.frameT = 0; }
      break;
    }
    case 'pause': {
      R.frameT += dt;
      const n = F_IDX.idle.length;
      const idx = Math.floor(R.frameT * 2.6) % n;
      setFrame(F_IDX.idle[idx]);
      R.t += dt;
      if (R.t > 1.15) {
        R.t = 0; R.frameT = 0; R.round++;
        R.facing *= -1;                       // 左右交替
        if (R.round % 2 === 0) {
          /* 起跳换位 */
          const cand = [];
          for (let i = 0; i < SPOTS.length; i++) if (i !== R.spot) cand.push(i);
          const next = cand[ri(0, cand.length - 1)];
          R.jumpFrom = { x: R.x, z: R.z };
          R.jumpTo = { x: SPOTS[next][0], z: SPOTS[next][1] };
          R.spot = next;
          R.state = 'prep'; R.t = 0;
          R.facing = R.jumpTo.x >= R.jumpFrom.x ? 1 : -1;
        } else {
          R.state = 'sweep'; R.t = 0; R.frameT = 0; R.frame = -1;
        }
      }
      break;
    }
    case 'prep': {
      setFrame(F_IDX.crouch);
      R.t += dt;
      if (R.t > 0.42) { R.state = 'air'; R.t = 0; }
      break;
    }
    case 'air': {
      R.t += dt;
      const T = 0.66, t = clamp(R.t / T, 0, 1);
      R.x = lerp(R.jumpFrom.x, R.jumpTo.x, t);
      R.z = lerp(R.jumpFrom.z, R.jumpTo.z, t);
      R.y = Math.sin(t * Math.PI) * R.jumpH;
      setFrame(t < 0.34 ? F_IDX.launch : (t < 0.72 ? F_IDX.airUp : F_IDX.airDown));
      if (R.t > T) { R.state = 'land'; R.t = 0; }
      break;
    }
    case 'land': {
      setFrame(F_IDX.land);
      R.t += dt;
      if (R.t > 0.2) { R.state = 'settle'; R.t = 0; }
      break;
    }
    case 'settle': {
      setFrame(F_IDX.recover);
      R.t += dt;
      if (R.t > 0.26) { R.state = 'sweep'; R.t = 0; R.frameT = 0; R.frame = -1; }
      break;
    }
  }
  /* 位置与朝向 */
  reimuMesh.position.set(R.x, groundY + R.y, R.z);
  const camDir = new THREE.Vector3().subVectors(camera.position, reimuMesh.position);
  const rotY = Math.atan2(camDir.x, camDir.z);
  reimuMesh.rotation.y = rotY;
  const screenRight = new THREE.Vector3(Math.cos(rotY), 0, -Math.sin(rotY));
  const facingVec = new THREE.Vector3(Math.sin(rotY + Math.PI / 2) * 0 + R.facing, 0, 0);
  const fx = new THREE.Vector3(R.facing, 0, 0);
  /* 让“朝向”在世界空间中生效：按相机右向投影决定翻转 */
  const dot = fx.dot(screenRight);
  const targetScale = dot < 0 ? -1 : 1;
  R.scaleX = lerp(R.scaleX, targetScale, 1 - Math.pow(0.001, dt));
  reimuMesh.scale.set(R.scaleX * (1 + (R.state === 'land' ? 0.0 : 0)), 1, 1);
  /* 轻微呼吸缩放 */
  const br = 1 + Math.sin(time * 1.6) * 0.008;
  reimuMesh.scale.y = R.state === 'air' ? 1 : br;
  /* 影子：高度越高越大越淡 */
  const h = Math.max(0, R.y);
  blob.position.set(R.x, groundY + 0.014, R.z);
  const bs = 0.72 + h * 0.75;
  blob.scale.set(bs, bs, 1);
  blob.material.opacity = 0.46 * clamp(1 - h / 1.5, 0.06, 1);
  /* 材质受光跟随场景 */
  reimuMat.uniforms.uLightDir.value.copy(sun.position).normalize();
  reimuMat.uniforms.uLightCol.value.copy(sun.color).lerp(new THREE.Color(0xffffff), 0.35);
  reimuMat.uniforms.uAmb.value = 0.52 + hemi.intensity * 0.32;
  reimuMat.uniforms.uInt.value = 0.30 + sun.intensity * 0.24;
}

/* ══════════════════════════════════════════════════════════════
   11. 循环
   ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let elapsed = 0;
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _e = new THREE.Euler(), _m = new THREE.Matrix4();
const tmpColor = new THREE.Color();
const sunBase = new THREE.Color(0xfff0d4), sunWarm = new THREE.Color(0xffd9a8);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* 光影缓变 */
  const cyc = Math.sin(elapsed * 0.017) * 0.5 + 0.5;      // 0..1 慢循环
  const az = lerp(-0.62, -0.28, cyc), el = lerp(0.86, 0.62, cyc);
  const R0 = 20;
  sun.position.set(Math.sin(az) * R0 * Math.cos(el), Math.sin(el) * R0, Math.cos(az) * R0 * Math.cos(el));
  sun.intensity = lerp(1.72, 1.44, cyc);
  sun.color.copy(sunBase).lerp(sunWarm, cyc);
  hemi.intensity = lerp(0.58, 0.66, cyc);
  fill.intensity = lerp(0.26, 0.34, cyc);
  scene.fog.color.copy(tmpColor.setHex(0xdfeaf6).lerp(new THREE.Color(0xf3e6d8), cyc * 0.6));

  /* 摆动材质 */
  for (const m of swayMats) { const sh = m.userData.shader; if (sh) sh.uniforms.uTime.value = elapsed; }
  /* 纸垂 */
  shrineAnims.shide.forEach(s => {
    s.o.rotation.z = Math.sin(elapsed * 1.35 + s.ph) * s.amp;
    s.o.rotation.x = Math.sin(elapsed * 1.1 + s.ph * 1.7) * s.amp * 0.6;
  });
  /* 绘马 */
  shrineAnims.ema.forEach(e => {
    e.o.rotation.z = Math.sin(elapsed * 1.5 + e.ph) * e.amp;
    e.o.rotation.x = Math.sin(elapsed * 1.15 + e.ph * 0.6) * e.amp * 0.5;
  });
  /* 铃绳 */
  shrineAnims.ropes.forEach(r => {
    r.o.rotation.z = Math.sin(elapsed * 0.85 + r.ph) * r.amp;
    r.o.rotation.x = Math.sin(elapsed * 0.62 + r.ph * 1.4) * r.amp * 0.8;
  });
  /* 灯笼闪烁 */
  shrineAnims.lanterns.forEach(l => {
    const f = 0.62 + 0.38 * (0.5 + 0.5 * Math.sin(elapsed * l.sp * 2.1 + l.ph)) * (0.85 + 0.15 * Math.sin(elapsed * 7.3 + l.ph * 3));
    l.glow.material.opacity = 0.18 + 0.24 * f * (0.4 + 0.6 * (1 - cyc));
    l.glow.material.color.setRGB(1.0, 0.78 + 0.12 * f, 0.52 + 0.1 * f);
  });
  /* 云 */
  clouds.forEach(c => {
    c.userData.a += c.userData.sp * dt * 0.06;
    c.position.set(Math.cos(c.userData.a) * c.userData.r, c.position.y, Math.sin(c.userData.a) * c.userData.r);
  });
  /* 空中花瓣 */
  flyState.forEach((f, i) => {
    f.y -= f.sp * dt;
    if (f.y < groundHeightAt(f.x, f.z) + 0.05) {
      f.y = rr(5.2, 7.2); f.x = rr(-8, 8); f.z = rr(-8, 8);
    }
    f.r += f.rs * dt * 1.5;
    const x = f.x + Math.sin(elapsed * f.sw + f.ph) * 0.85;
    const z = f.z + Math.cos(elapsed * f.sw * 0.8 + f.ph) * 0.7;
    _e.set(f.r, f.r * 0.6, f.r * 0.4);
    _q.setFromEuler(_e);
    _p.set(x, f.y, z);
    _s.setScalar(f.s);
    _m.compose(_p, _q, _s);
    flyPetal.setMatrixAt(i, _m);
    flyPetal.setColorAt(i, tmpColor.set(f.pink ? 0xf7c9da : 0xd8a860));
  });
  flyPetal.instanceMatrix.needsUpdate = true;
  if (flyPetal.instanceColor) flyPetal.instanceColor.needsUpdate = true;
  /* 落叶物理 */
  {
    let moved = false;
    leafState.forEach(L => {
      if (Math.abs(L.vx) > 0.001 || Math.abs(L.vz) > 0.001) {
        L.x += L.vx * dt; L.z += L.vz * dt;
        L.rot += L.spin * dt;
        const damp = Math.pow(0.02, dt);
        L.vx *= damp; L.vz *= damp; L.spin *= damp;
        if (Math.abs(L.vx) < 0.01) L.vx = 0;
        if (Math.abs(L.vz) < 0.01) L.vz = 0;
        L.x = clamp(L.x, -8.6, 8.6); L.z = clamp(L.z, -8.6, 8.6);
        L.y = groundHeightAt(L.x, L.z) + 0.012;
        moved = true;
      }
    });
    if (moved) syncLeaves();
  }
  /* 灵气 */
  {
    for (let i = 0; i < SPIRIT_N; i++) {
      const d = spiritData[i];
      const t = elapsed * d.sp + d.ph;
      spiritPos[i * 3] = d.x + Math.sin(t * 0.8) * d.amp;
      spiritPos[i * 3 + 1] = d.y0 + Math.sin(t * 0.55) * 0.75 + (elapsed * d.sp * 0.35 % 3.0);
      spiritPos[i * 3 + 2] = d.z + Math.cos(t * 0.7) * d.amp;
    }
    spiritGeo.attributes.position.needsUpdate = true;
    spiritMat.uniforms.uTime.value = elapsed;
  }
  updateDust(dt);
  updateReimu(dt, elapsed);
  if (window.__z) {
    window.__z.frames++;
    const now = performance.now();
    if (!window.__z._mark) { window.__z._mark = now; window.__z._fc = 0; }
    window.__z._fc++;
    if (now - window.__z._mark > 1000) {
      window.__z.fps = Math.round(window.__z._fc * 1000 / (now - window.__z._mark));
      window.__z._mark = now; window.__z._fc = 0;
    }
  }

  controls.target.x = clamp(controls.target.x, -4, 4);
  controls.target.y = clamp(controls.target.y, 0.6, 6);
  controls.target.z = clamp(controls.target.z, -5, 5);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 调试入口（无 UI 元素，仅挂载对象） */
/* 调试入口：无任何 UI 元素，仅供控制台查看/调参 */
window.__z = { THREE, scene, camera, renderer, world, atlasCanvas, reimu, controls, shrineAnims, groundHeightAt,
  look(px, py, pz, tx, ty, tz) { camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update(); },
  forceJump(toIdx) {
    const R = reimu, next = toIdx === undefined ? (R.spot + 3) % SPOTS.length : toIdx;
    R.jumpFrom = { x: R.x, z: R.z };
    R.jumpTo = { x: SPOTS[next][0], z: SPOTS[next][1] };
    R.spot = next;
    R.facing = R.jumpTo.x >= R.jumpFrom.x ? 1 : -1;
    R.state = 'prep'; R.t = 0;
    return R.jumpTo;
  },
  fps: 0, frames: 0,
  /* 确定性步进：用于离线验证动画状态机，不依赖实际帧率 */
  step(dt, n = 1) {
    const trace = [];
    for (let i = 0; i < n; i++) {
      updateReimu(dt, (this.simT = (this.simT || 0) + dt));
      trace.push({ s: reimu.state, x: +reimu.x.toFixed(2), z: +reimu.z.toFixed(2), y: +reimu.y.toFixed(3), f: reimu.facing });
    }
    return trace;
  } };
