'use strict';
/* ============ 电车难题 · 单文件Demo  (柴油朋克×深夜霓虹, 内容占位矢量美术) ============ */
/* 数据与逻辑全部静态表驱动，后续平移到 Godot 时一一对应。 */
/* ========================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280, H=720;
/* 高分屏清晰化：画布内部分辨率 ×2 再缩放显示 */
const DPR=(typeof window!=='undefined'&&window.devicePixelRatio&&window.devicePixelRatio>=1.5)?2:1;
if(DPR>1){cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);}
(function fit(){
  function rs(){const s=Math.min(innerWidth/W, innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
  addEventListener('resize',rs);rs();
})();
/* ---------- 工具 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const sum=a=>a.reduce((x,y)=>x+y,0);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rndi(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
/* ---------- 调色板（柴油朋克·深夜霓虹） ---------- */
const COL={
  bg:'#0a0e17', panel:'#0d1322', panel2:'#111a2e', line:'#1d2c4d',
  txt:'#e8f1ff', dim:'#8fa3c8', deep:'#55617e',
  warn:'#ffd166', bad:'#ff5a5a', good:'#6dff9e',
  horn:'#ffb648', steel:'#b9c6d9', steam:'#9fb6d9'
};
/* ---------- 输入 ---------- */
const mouse={x:0,y:0,down:false,clicked:false,hover:false};
let btns=[];                 // 每帧注册的可点按钮
let hoverId=null;
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*(W/r.width);mouse.y=(e.clientY-r.top)*(H/r.height);});
cv.addEventListener('mousedown',e=>{mouse.down=true;});
cv.addEventListener('mouseup',e=>{mouse.down=false;mouse.clicked=true;});
cv.addEventListener('mouseleave',()=>{mouse.x=-99;mouse.y=-99;});
function btn(x,y,w,h,label,fn,opt={}){
  const over=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  btns.push({x,y,w,h,label,opt,over,fn});   // 不立即触发：交给同帧顶层层级裁决
  return over;
}
/* ---------- 绘制原语 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function panel(x,y,w,h,opt={}){
  const r=opt.r??10, a=opt.a??0.92, fill=opt.fill??COL.panel;
  ctx.globalAlpha=a; rr(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=opt.stroke??COL.line; ctx.lineWidth=1; ctx.stroke();
  if(opt.glow){ctx.save();ctx.shadowColor=opt.glow;ctx.shadowBlur=14;rr(x,y,w,h,r);ctx.strokeStyle=opt.glow;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
  ctx.globalAlpha=1;
}
function txt(s,x,y,size,color='#e8f1ff',opt={}){
  ctx.font=(opt.bold?'bold ':'')+size+'px '+ (opt.font??'"Segoe UI","Microsoft YaHei",sans-serif');
  ctx.textAlign=opt.align??'left'; ctx.textBaseline=opt.base??'top';
  if(opt.glow){ctx.save();ctx.shadowColor=opt.glow;ctx.shadowBlur=12;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();}
  else{ctx.fillStyle=color;ctx.fillText(s,x,y);}
}
function glowText(s,x,y,size,color,blur=14,align='center',base='top'){
  ctx.save();ctx.font=(size>0?'bold ':'')+Math.abs(size)+'px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign=align;ctx.textBaseline=base;ctx.shadowColor=color;ctx.shadowBlur=blur;
  ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();
}
function hudBtn(x,y,w,h,label,color,fn,sub){
  const over=btn(x,y,w,h,label,fn);
  rr(x,y,w,h,8);ctx.fillStyle=over?color:color+'88';ctx.fill();
  ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;ctx.stroke();
  txt(label,x+w/2,y+h/2-7,15,'#0a0e17',{align:'center',base:'middle',bold:true});
  if(sub)txt(sub,x+w/2,y+h-3,10,'#0a0e17',{align:'center',base:'middle'});
}
function bar(x,y,w,h,ratio,color,opt={}){
  ratio=clamp(ratio,0,1);
  rr(x,y,w,h,opt.r??4);ctx.fillStyle=opt.back??'#1a2333';ctx.fill();
  if(ratio>0){const bw=Math.max(2,w*ratio);rr(x+1,y+1,bw-2,h-2,(opt.r??4)-1);ctx.fillStyle=color;ctx.fill();}
  if(opt.glow){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=8;rr(x+1,y+1,Math.max(2,w*ratio)-2,h-2,(opt.r??4)-1);ctx.strokeStyle=color;ctx.lineWidth=1;ctx.stroke();ctx.restore();}
  ctx.strokeStyle='#2a3a5a';ctx.lineWidth=1;rr(x,y,w,h,opt.r??4);ctx.stroke();
}
/* 点击音效占位（正式版接音频） */
let sfx=(k)=>{}; /* 第N块会注入WebAudio实现 */
/* ---------- 进度 ---------- */
let now=0,lastT=0;
function loop(t){
  const dt=clamp((t-lastT)/1000,0,0.05); lastT=t; now=t;
  step(dt); draw();
  mouse.clicked=false; mouse.hover=false;
  requestAnimationFrame(loop);
}
/* 子类实现 step/draw —— 放在后续脚本块 */

function recalc(r){
  const st={spd:0,ram:0,acc:1,hp:0,deck:0,coin:0,wdmg:0,wrate:0,pen:0,stall:0,restore:0,

            splashChance:0,approachCut:0,cabUp:0,shopCut:0};
  for(const s of SLOTS){const p=r.equip[s.id];if(!p)continue;applySt(st,p.def.st,p.q);}
  // 收藏
  const c=r.collect;
  st.wdmg+=c.wdmg; st.spd+=c.spd; st.stall+=c.stall; st.boardSlow+=c.boardSlow;
  st.cabCut+=c.cabCut; st.luck+=c.luck; st.crit+=c.crit; st.critMul+=c.critMul;
  // 诅咒
  if(r.curse){if(r.curse.kind==='coin')st.coin-=r.curse.v;else if(r.curse.kind==='hp')st.hp-=r.curse.v;}
  // —— 阵营羁绊(先统计再叠加，避免回环) ——
  r.catCount={};for(const s of SLOTS){const p=r.equip[s.id];if(p)r.catCount[p.cat]=(r.catCount[p.cat]||0)+1;}
  const cnt=id=>r.catCount[id]||0;
  if(cnt('red')>=3){st.ram=Math.round(st.ram*1.22+6);st.restore+=0.04;}
  if(cnt('blue')>=3){st.wrate+=0.25;st.splashChance+=0.25;}
  if(cnt('steel')>=3){st.hp+=70;st.cabCut+=0.3;st.boardSlow+=0.12;}
  if(cnt('junk')>=3){st.coin+=0.3;}
  if(cnt('ice')>=3){st.approachCut+=0.15;}
  if(cnt('para')>=3){st.spd+=0.25;st.crit+=0.2;}

  const lvA=id=>(r.catLv&&r.catLv[id])||0;
  st.ram+=4*lvA('red');st.restore+=0.005*lvA('red');
  st.wrate+=0.04*lvA('blue');st.splashChance+=0.01*lvA('blue');
  st.hp+=18*lvA('steel');st.cabCut+=0.02*lvA('steel');st.boardSlow+=0.01*lvA('steel');
  st.coin+=0.06*lvA('junk');
  st.approachCut+=0.03*lvA('ice');
  st.spd+=0.04*lvA('para');st.crit+=0.02*lvA('para');
  r.st=st;
  r.hpMax=110+(r.bonusHp||0)+st.hp;
  if(r.hp>r.hpMax)r.hp=r.hpMax;
  r.deck=4+st.deck;
  r.equipList=SLOTS.map(s=>r.equip[s.id]).filter(Boolean);
  return st;
}

function applySt(out,st,q){

function qroll(r,base){
  // 品质权重：随区域与幸运漂移
  let w=[70,22,7,1]; const shift=(r.st.luck||0)*4+Math.floor((r.zone-1)/2);
  w=[Math.max(10,w[0]-shift*6),w[1]+shift*2,w[2]+shift*2,Math.min(14,w[3]+shift*1)];
  let t=sum(w),x=Math.random()*t,q=0;
  for(let i=0;i<4;i++){x-=w[i];if(x<=0){q=i;break;}}

}

  const forceFight=seg>=1&&!r._segFight;
  const types=[];
  if(forceFight||chance(0.55))types.push('battle');
  types.push(pick(['shop','event']));
  if(chance(0.6))types.push(pick(['repair','event','shop']));

}
function rollStarters(){

<script>

'use strict';
/* ============ 第4块：战斗系统 ============ */
/* 只露出“裁决号”车头：短车身 → 给右侧怪物留足空间 */
const G={FRONT:472,CAB:150,TURRET:335,ROOF:468,TRAIN_TOP:452,TRAIN_BOT:612,RAIL:628};
/* ---------- 怪物定义 ---------- */
const MDEFS=[
 {id:'aunt',name:'挡路阿伯',hp:26,armor:0,spd:150,board:55,size:1,coin:3,cab:6,color:'#c9a06c',tags:[],w:40,h:46},
 {id:'commuter',name:'暴怒通勤客',hp:60,armor:2,spd:205,board:122,size:1,coin:5,cab:11,color:'#e07b5a',tags:[],w:42,h:52},
 {id:'ticket',name:'检票员',hp:55,armor:0,spd:140,board:95,size:1,coin:6,cab:9,color:'#6ea8fe',tags:['ranged'],w:40,h:48},
 {id:'cement',name:'水泥裹脚青年',hp:145,armor:14,spd:62,board:26,size:1,coin:7,cab:8,color:'#8f9bb3',tags:[],w:46,h:60},
 {id:'miner',name:'拾荒矿工',hp:42,armor:0,spd:190,board:85,size:1,coin:11,cab:7,color:'#b6f34c',tags:[],w:42,h:48},
 {id:'kamikaze',name:'自爆苦力',hp:58,armor:0,spd:250,board:150,size:1,coin:5,cab:8,color:'#ffd166',tags:['explode'],w:40,h:46},
 {id:'crab',name:'钢筋棘刺蟹',hp:82,armor:22,spd:185,board:72,size:1,coin:7,cab:10,color:'#b08cff',tags:['reflect'],w:52,h:42},
 {id:'hanger',name:'轨道上吊者',hp:52,armor:0,spd:0,board:0,size:1,coin:0,cab:0,color:'#9fb6ff',tags:['float'],w:40,h:64,steal:12},
 {id:'signal',name:'雾中号志灯',hp:85,armor:0,spd:55,board:70,size:1,coin:8,cab:6,color:'#ffb648',tags:['summon'],w:48,h:60},
 {id:'stationmaster',name:'双头站长',hp:460,armor:18,spd:118,board:42,size:2,coin:30,cab:17,color:'#c66fe0',tags:[],w:66,h:76},
 {id:'midnight',name:'午夜乘客',hp:280,armor:8,spd:235,board:168,size:1,coin:22,cab:25,color:'#ff4f8b',tags:[],w:44,h:60},
 {id:'worm',name:'车厢蠕虫',hp:70,armor:6,spd:90,board:40,size:1,coin:0,cab:8,color:'#c66fe0',tags:[],w:38,h:34},
 {id:'stowaway',name:'偷渡者列车',hp:660,armor:34,spd:70,board:0,size:3,coin:48,cab:18,color:'#8b9dc3',tags:['train'],w:120,h:64},
];
const MDMAP={};MDEFS.forEach(d=>MDMAP[d.id]=d);
/* ---------- 战斗上下文 ---------- */
let BAT=null;
function newBattle(r,kind,bossId){
  const b={kind,            // 'fight'|'boss'
    t:0, travel:0, len:kind==='boss'?0:6400+Math.min(12,r.zone)*520,
    enemies:[], parts:[], coins:[], fx:[], embers:[], trails:[],
    evIdx:0, events:[], spawnedAll:false,
    sc:{hp:hpMul(r.zone),dmg:dmgMul(r.zone)},
    maxV:0, speedCur:0,
    wCd:0, hornCd:0, hornT:0, freezeAll:0, frenzyT:0,
    catT:{}, deckUsed:0, catUsed:false, blackUsed:false,
    shieldT:999, saveArmed:false, junkT:5, iceFreezeT:8, zapT:6,
    gained:[], done:false, failed:false, overT:0,
    whistleUsed:false,
    boss:null, judge:null, judgeChoice:null, screenShake:0,
  };
  b.maxV = 300*(1+r.st.spd*0.7);
  b.speedCur = b.maxV;
  if(kind==='boss')setupBoss(b,r,bossId);
  else buildEvents(b,r);
  b.hornCd=0; b.shieldT = (r.st.shieldCd>0?0:999);
  return b;
}
/* 普通战斗事件(按行进距离触发) */
function buildEvents(b,r){
  const z=r.zone, ev=[], len=b.len;
  const p1=['aunt','commuter','miner'];
  const p2=p1.concat(['ticket','cement']);
  const p3=p2.concat(['kamikaze','crab','hanger']);
  const p4=p3.concat(['signal']);
  const pool=pickZPool(z);
  const nW=3+Math.min(5,Math.ceil(z/2));          // 波数
  const budget=Math.round(9+ z*1.15);
  let placed=0;
  for(let i=0;i<nW&&placed<budget;i++){
    const d=120+ (len-320)*(i+ (Math.random()<.5?0: .35))/(nW+0.0) + rnd(-40,40);
    const cnt=Math.min(budget-placed, 2+ (z>=4?1:0)+ (i%2===0&&z>=7?1:0));
    ev.push({d,kind:'wave',cnt}); placed+=cnt;
  }
  if(z>=4&&chance(.55))ev.push({d:len*.42,kind:'elite',def:pick(['stationmaster','midnight'])});
  if(z>=8&&chance(.4))ev.push({d:len*.3,kind:'elite',def:'stowaway'});
  if(z>=12&&chance(.5))ev.push({d:len*.65,kind:'elite',def:'midnight'});
  // 路上拾取
  const nC=3+rndi(0,3), nP=1+(chance(.7)?1:0);
  for(let i=0;i<nC;i++)ev.push({d:rnd(140,len-140),kind:'coin',v:rndi(7,15)});
  for(let i=0;i<nP;i++)ev.push({d:rnd(200,len-200),kind:'part'});
  ev.sort((a,b2)=>a.d-b2.d);
  b.events=ev;
  function pickZPool(z){
    if(z<=1)return p1;
    if(z<=2)return p2;
    if(z<=4)return p3;
    if(z<=6)return p4.concat(p1);
    if(z<=9)return p4.concat(['commuter','cement','kamikaze']);
    return p4.concat(['crab','kamikaze','midnight','stationmaster']);
  }
}
/* ---------- 怪物实例 ---------- */
function spawnTrack(b,defId,x,opts={}){
  const d=MDMAP[defId]; if(!d)return null;
  const r=RUN;
  let hp=d.hp*b.sc.hp;
  if(b.kind!=='boss'&&!b.whistleUsed&&r.collect.whistle){hp*=0.75;b.whistleUsed=true;}
  const e={d,st:'track',x:x??G.FRONT+520+rnd(0,300),y:G.RAIL-10,hp:Math.round(hp),maxHp:Math.round(hp),
    spd:d.spd*(1-(r.st.approachCut||0)), boardSpd:d.board, walk:0,ramCd:0,pushT:0,slow:0,frz:0,sumT:rnd(2,5),
    cabDmg:d.cab*b.sc.dmg, size:d.size, shootT:0, bob:rnd(0,6), drift:true, hitOnce:false};
  if(d.tags.includes('float')){e.y=300+rnd(0,120);e.floatY=e.y;e.hover=true;}
  b.enemies.push(e);return e;
}
function spawnBoard(b,defId,x,carryHp){
  const d=MDMAP[defId];if(!d)return null;
  const r=RUN;
  if(b.deckUsed+d.size>r.deck)return null;
  const fresh=Math.round(d.hp*b.sc.hp*0.9);
  const hp0=(carryHp&&carryHp>0)?Math.max(1,Math.min(fresh,Math.round(carryHp))):fresh;
  const e={d,st:'board',x:x??G.FRONT-24,y:G.ROOF,hp:hp0,maxHp:fresh,
    boardSpd:d.board*(1-(r.st.boardSlow||0)),walk:0,slow:0,frz:0,cabDmg:d.cab*b.sc.dmg,size:d.size,drift:false};
  b.deckUsed+=d.size;b.enemies.push(e);return e;
}
function deckFree(b){return RUN.deck-b.deckUsed;}
/* ---------- 伤害与死亡 ---------- */
function fxText(b,x,y,s,color){b.fx.push({x,y,s,color,t:0,life:1.4});}
function hurtTrain(b,amt,src){
  const r=RUN;
  amt=Math.round(amt);
  if(!isFinite(amt))amt=0;
  if(amt<=0)return;
  if(src==='cab'&&b.saveArmed){b.saveArmed=false;fxText(b,300,300,'时间倒带——袭击被取消!','#FF4FD8');ghostRam(b);return;}
  if(src==='cab'&&b.shieldT<=0&&RUN.st.shieldCd>0){b.shieldT=RUN.st.shieldCd;fxText(b,300,300,'回滚匣·免疫!','#38B6FF');return;}
  if(src==='cab'&&RUN.collect.cat>0&&!b.catUsed){b.catUsed=true;fxText(b,300,300,'扳手猫挡住了袭击! (每场一次)','#ffd166');return;}
  hpNote(b,'-'+amt,'#ff6a5a');
  r.hp-=amt;b.screenShake=Math.min(10,b.screenShake+3);
  if(r.hp<=0){r.hp=0;
    if(!b.blackUsed&&r.collect.blackbox){b.blackUsed=true;r.hp=Math.round(r.hpMax*0.35);hpNote(b,'复活+'+Math.round(r.hpMax*0.35),'#6dff9e');fxText(b,640,330,'黑匣子紧急重启!','#6dff9e');return;}
    b.failed=true;b.overT=1;}
}
function killEnemy(b,e,cause){
  const r=RUN;
  e.dead=true;
  r.stats.kills++;
  if(cause==='ram'){r.stats.ramKills++;sfx&&sfx('ramKill');if(r.st.restore>0){const h=Math.round(r.hpMax*r.st.restore);r.hp=Math.min(r.hpMax,r.hp+h);hpNote(b,'+'+h,'#6dff9e');fxText(b,e.x,e.st==='board'?350:430,'+'+h,'#6dff9e');}}
  if(e.d.tags.includes('explode')&&cause==='ram'){hurtTrain(b,12*b.sc.dmg,'explode');fxText(b,e.x,380,'自爆! -12','#ffd166');b.screenShake=Math.max(b.screenShake,5);}
  // 掉钱：Boss全额；撞击处刑全额；武器补刀车顶怪六成(被“甩”到车头前)
  if(e.isBoss||cause==='ram'||e.st==='board'){
    let v=e.isBoss
      ? Math.round((e.d.coin||90)*(1+0.2*(r.zone-1)))
      : Math.round(e.d.coin*(0.9+0.05*(r.zone-1))*(1+0.4*e.size)*(e.st==='board'?0.6:1));
    if(e.isBoss)b.coins.push({x:G.FRONT+40,y:540,v,drift:true});
    else if(e.st==='board')b.coins.push({x:G.FRONT+40+rnd(0,40),y:538,v,drift:true});
    else b.coins.push({x:e.x+20,y:560,v,drift:true});
  }
  // 奇美拉弱点：击杀车顶蠕虫可震落主体装甲片
  if(b.boss&&b.boss.d.id==='chimera'&&!b.boss.dead&&e.st==='board'&&cause!=='ram'){
    b.boss.hp-=100;fxText(b,b.boss.x,b.boss.y-40,'装甲片震落! 主体-100','#c66fe0');
    if(b.boss.hp<=0){b.boss.hp=0;}
  }
  // —— 配件掉落（概率低；精英/Boss/偷渡列车必掉，品质更高）——
  if(!e.d.tags.includes('float')){
    const eliteDrop=e.isBoss||e.d.tags.includes('train')||e.d.id==='stationmaster'||e.d.id==='midnight';
    if(e.isBoss){
      const p=makePart(rollPartDef(),Math.min(3,qroll(r,1)+1));givePart(r,p);fxText(b,e.x,300,'Boss掉落:'+p.def.name,'#ffc94d');
      if(chance(0.5)){giveCollect(r);fxText(b,e.x,340,'获得收藏品!','#FF4FD8');}
    }else if(eliteDrop){
      const p=makePart(rollPartDef(),Math.min(3,qroll(r,1)));givePart(r,p);fxText(b,e.x,300,'精英掉落:'+p.def.name,'#b06cff');
    }else if(chance(0.05+(r.st.luck||0)*0.03)){
      const p=makePart(rollPartDef(),partDropRoll(r));givePart(r,p);fxText(b,e.x,330,'掉落:'+p.def.name,'#ffc94d');
    }
    if(r.collect.ticket&&chance(0.04)){givePart(r,makePart(rollPartDef(),0));}
  }
  if(e.st==='board')b.deckUsed-=e.size;
}
function givePart(r,p){
  if(!benchAdd(r,p)){addMoney(r,sellPrice(p.def,p.q));return null;}
  if(scr==='battle'&&BAT)BAT.gained.push(p);
  return p;
}
function ghostRam(b){
  const dmg=(32+RUN.st.ram)*0.8;
  for(const e of b.enemies)if(!e.dead){e.hp-=dmg;if(e.hp<=0)killEnemy(b,e,'skill');}
  fxText(b,640,300,'幽灵列车冲撞!','#FF4FD8');
}
/* ---------- 撞击 ---------- */
function resolveRam(b,e){
  const r=RUN, st=r.st;
  // 撞击力量随当前车速波动：越快越痛（撞完减速 → 需要引擎/泄压阀回速）
  const spF=clamp((b.speedCur/(b.maxV||1))*1.1,0.55,1.3);
  let dmg=(32+st.ram)*spF*(0.9+0.2*Math.random());
  dmg=Math.round(dmg);
  const effArmor=Math.max(0,Math.round(e.d.armor*(1-st.pen)));
  dmg=Math.max(1,dmg-effArmor);
  if(e.frz>0){dmg=1e9;}          // 冻结中被撞必杀
  e.hp-=dmg;
  // 抹除
  if(e.hp>0&&st.erase>0&&chance(st.erase)){e.hp=0;fxText(b,e.x,300,'存在性抹除!','#FF4FD8');}
  sparks(b,G.FRONT-10,570,Math.min(26,6+Math.round(dmg/14)));
  fxText(b,G.FRONT-60,430,e.hp<=0?'处刑! -'+dmg:'冲击 -'+dmg,'#ffb648');
  sfx&&sfx('ram');
  b.screenShake=Math.max(b.screenShake,e.isBoss?10:5+Math.min(5,dmg/30));
  // 反震
  if(e.hp>0&&e.d.tags.includes('reflect')&&!(e.frz>0)){hurtTrain(b,Math.round(8*(1-st.reflectCut)*b.sc.dmg),'reflect');fxText(b,e.x,380,'反震!','#b08cff');}
  if(e.hp<=0){killEnemy(b,e,'ram');return;}
  // 撞击未死 → 硬直(降速，等引擎回速)
  const stallAmt=0.24*(1-(st.stall||0));
  b.speedCur*=(1-stallAmt);
  if(b.speedCur<0.5)b.speedCur=0.5;
  const frozen=e.frz>0;
  if(e.isBoss){e.ramCd=9999;return;}       // Boss的第一撞在 bossMove 里继续处理击飞/扒车
  if(frozen){e.x+=70;e.pushT=0.9;e.ramCd=1.4;return;}
  if(e.d.tags.includes('train')){e.x+=90;e.pushT=0.9;e.ramCd=1.3;return;}
  if(st.freezeOnRam>0){e.frz=Math.max(e.frz,st.freezeOnRam);fxText(b,e.x,340,'霜封!','#5EF0E0');e.x+=80;e.ramCd=1.6;return;}
  /* 没被撞死 */
  if(!e.hitOnce){
    // 第一撞未死：被高速撞击击飞到屏幕右侧，随后折返狂奔
    e.hitOnce=true;
    const d=e.d.size>=2?340:480;
    e.kbV=d/0.85; e.pushT=0.85;
    e.x=Math.min(W+80,e.x+30);
    e.ramCd=0.6;
    fxText(b,e.x,340,'被撞飞!!','#ffd166');
    sfx&&sfx('knock');
    b.screenShake=Math.max(b.screenShake,7);
    return;
  }
  // 第二撞及以后仍不死 → 扒上车(甲板有位置)；否则继续被创
  if(deckFree(b)>=e.size){

function sparks(b,x,y,n){for(let i=0;i<n;i++)b.embers.push({x,y,vx:rnd(-120,120),vy:rnd(-300,-40),t:0,life:rnd(.3,.7),c:'#ffd166'});}
/* ---------- 武器自动索敌 ---------- */
function updateWeapon(b,dt){
  const r=RUN,p=r.equip.weapon;
  if(!p){b.wCd=0;return;}
  const w=p.def.w;
  let rate=w.rps*(1+r.st.wrate||0);
  if(b.frenzyT>0)rate*=3;
  b.wCd-=dt;
  if(b.wCd>0)return;
  const tgt=pickTarget(b,w.rng);
  if(!tgt){b.wCd=0; if(!b.wMaxCd)b.wMaxCd=0.1; return;} // 无目标=满弹待发
  b.wCd=1/rate;b.wMaxCd=1/rate;
  fireShot(b,p,tgt);
}
function pickTarget(b,rng){
  // 索敌优先级：车顶(甲板) > 飞天(浮空) > 地面轨道怪
  const lo=G.TURRET-rng, hi=G.TURRET+rng;
  let board=null,fly=null,gnd=null;
  for(const e of b.enemies){
    if(e.dead)continue;
    if(e.st==='board'&&e.x>=lo&&e.x<=hi){if(!board||e.x<board.x)board=e;continue;}
    if(e.st==='track'&&e.d.tags&&e.d.tags.includes('float')&&e.x>=lo&&e.x<=hi+90){if(!fly||e.x<fly.x)fly=e;continue;}
    if(e.st==='track'&&(!e.d.tags||!e.d.tags.includes('float'))&&e.x>=G.FRONT-30&&e.x<=hi){if(!gnd||e.x<gnd.x)gnd=e;}
  }
  return board||fly||gnd;
}
function fireShot(b,p,tgt){
  const r=RUN,w=p.def.w,st=r.st;
  let dmg=w.dmg*QM[p.q]*(1+st.wdmg)*1.35; // 武器加强(原'激光刮痧')
  let crit=w.crit===1||chance(st.crit);
  if(crit)dmg*=(2+(st.critMul||0));
  dmg*=rnd(0.9,1.1);
  dmg-=Math.max(0,Math.round((tgt.d.armor*0.5)*(1-(w.pen2||0)))); // 弹丸穿甲效率50%，慢速大口径更吃香
  dmg=Math.max(1,Math.round(dmg));
  const c=CATMAP[p.cat].color;
  sfx&&sfx('shot');tracers(b,G.TURRET,G.ROOF-16,tgt,dmg,c,crit);
  applyDamage(b,tgt,dmg,'weapon',{splash:w.splash,slow:w.slow,chain:w.chain});
  // 阵营3件特效注入
  if(cntCat('blue')>=3&&st.splashChance>0&&chance(st.splashChance)){
    for(const e2 of b.enemies)if(e2!==tgt&&!e2.dead&&Math.abs(e2.x-tgt.x)<70)applyDamage(b,e2,Math.max(1,Math.round(dmg*0.5)),'weapon',{});
  }
  if(cntCat('ice')>=3){ // 寒潮：命中必带霜缓
    if(tgt.slow<tgt.d&&tgt.slow<3)tgt.slow=2;
  }
  if(w.doub&&chance(w.doub)){const t2=pickTarget(b,w.rng);if(t2)applyDamage(b,t2,dmg,'weapon',{});}
  if(w.refund&&tgt.hp-dmg<=0){addMoney(r,2);}
  function cntCat(id){return r.catCount[id]||0;}
}
function applyDamage(b,e,dmg,src,opt={}){
  if(e.dead)return;
  if(e.isBoss&&e.wImmune&&src==='weapon'){fxText(b,e.x,e.y-40,'相位/装甲免疫','#9fb6ff');return;}
  if(e.frz>0&&opt.shatter){} 
  e.hp-=dmg;
  if(opt.slow&&e.slow<3)e.slow=2;
  if(e.hp<=0)killEnemy(b,e,src);
  if(opt.splash){
    for(const e2 of b.enemies){
      if(e2===e||e2.dead)continue;
      const dx=e2.st==='board'?Math.abs(e2.x-e.x):Math.abs(e2.x-e.x);
      if(dx<opt.splash){const d2=Math.max(1,Math.round(dmg*0.55));e2.hp-=d2;if(opt.slow&&e2.slow<3)e2.slow=2;if(e2.hp<=0)killEnemy(b,e2,src);}
    }
  }
  if(opt.chain&&opt.chain>0){
    let from=e;
    for(let i=0;i<opt.chain;i++){
      let nx=null;
      for(const e2 of b.enemies)if(!e2.dead&&e2!==from&&Math.abs(e2.x-from.x)<190){if(!nx||Math.abs(e2.x-from.x)<Math.abs(nx.x-from.x))nx=e2;}
      if(!nx)break;
      nx.hp-=Math.max(1,Math.round(dmg*0.7));if(nx.hp<=0)killEnemy(b,nx,src);from=nx;
    }
  }
}
function tracers(b,x0,y0,e,dmg,c,crit){
  const tx=e.st==='board'?e.x:e.x;

/* ---------- 阵营5件特殊动作 ---------- */
function runAbilities(b,dt){

    if(nx){nx.hp-=Math.max(1,Math.round(14*b.sc.dmg*(1+r.st.wdmg)));fxText(b,nx.x,300,'⚡','#38B6FF');if(nx.hp<=0)killEnemy(b,nx,'skill');}}}
  function cdOf(id){return {red:10,blue:9,steel:12,ice:14,para:18,junk:5}[id]||10;}
}

      for(const e2 of b.enemies)if(e2!==e&&!e2.dead&&Math.abs(e2.x-e.x)<90){e2.hp-=Math.round(dmg*0.5);if(e2.hp<=0)killEnemy(b,e2,'skill');}

  }

/* ---------- Boss 定义与脑 ---------- */
function setupBoss(b,r,id){
  const z=r.zone;
  const defs={
    gate:{name:'卫戍巨像·站长老闸门',hp:820,armor:12,cab:14,coin:90,color:'#FFB648',w:150,h:150},
    ghost:{name:'幽灵列车·班次404',hp:700,armor:8,cab:12,coin:90,color:'#9fb6ff',w:170,h:120},
    chimera:{name:'货运奇美拉·千足编组',hp:1140,armor:16,cab:10,coin:90,color:'#c66fe0',w:200,h:110},
    judge:{name:'电车难题·裁决者',hp:1200,armor:9,cab:18,coin:120,color:'#e8f1ff',w:180,h:170},
  };
  const d=defs[id];
  const hp=Math.round(d.hp*(1+0.085*(z-1)));

    x:G.FRONT+640,y:G.RAIL-80,hp,hp0:hp,maxHp:hp,spd:0,pushT:0,ramCd:0,slow:0,frz:0,cling:false,hitOnce:false,
    cabDmg:d.cab*hpMul(z),size:3,halt:true,brainT:2,phase:'A',phTimer:0,summonT:3,wImmune:false,ghostOn:false,drift:true};
  b.boss=e;b.enemies.push(e);

}
function updateBoss(b,dt){
  const e=b.boss;if(!e)return;
  const r=RUN;
  e.brainT-=dt;
  const bossId=(e.d.id);
  if(!e.cling)return; // 入场阶段不执行召唤/阶段(先等那一下冲撞)
  if(bossId==='gate'){
    if(e.brainT<=0){e.brainT=4.5;
      const frac=e.hp/e.maxHp;

    }
  }else if(bossId==='ghost'){
    e.phTimer=(e.phTimer||0)-dt;
    if(e.phase==='solid'&&e.phTimer<=0){e.phase='ghost';e.wImmune=true;e.phTimer=2.2;fxText(b,640,230,'虚化·炮火失效 & 加速逼近 2.6s','#9fb6ff');}
    else if(e.phase==='ghost'&&e.phTimer<=0){e.phase='solid';e.wImmune=false;e.phTimer=4.4;fxText(b,640,230,'实化·可输出窗口 4.0s','#ffd166');}
    if(e.brainT<=0){e.brainT=4.5;
      for(let i=0;i<2;i++){
        const w=spawnBoard(b,pick(['commuter','aunt','cement']),G.FRONT-40);
        if(w){w.pushT=0;w.kbV=0;}   // 幽灵乘客只会朝驾驶室爬
      }
      fxText(b,e.x-70,200,'幽灵乘客爬上机车','#9fb6ff');
    }
  }else if(bossId==='chimera'){
    if(e.summonT<=0){e.summonT=4.5;
      if(!spawnBoard(b,'worm'))spawnTrack(b,'worm',G.FRONT+120+rnd(0,120));
      fxText(b,e.x-80,200,'放出车厢蠕虫','#c66fe0');
    }else e.summonT-=dt;
  }else if(bossId==='judge'){
    if(e.summonT<=0){e.summonT=5.5;
      spawnTrack(b,'aunt');if(chance(.35))spawnBoard(b,'commuter');}
    else e.summonT-=dt;
    // 阶段→道德审判
    if(b.judge&&!b.judge.wait){
      const frac=e.hp/e.maxHp;
      if(b.judge.done<b.judge.th.length&&frac<=b.judge.th[b.judge.done]&&frac>0.001){
        b.judge.done++;b.judge.wait=true;b.judgeChoice=[];
      }
    }
    if(b.judge&&b.judge.wait){return;} // 暂停(由界面处理)
  }
}
/* ---------- 战斗主更新 ---------- */
function stepBattle(dt){
  const b=BAT,r=RUN;
  if(!b)return;
  b.t+=dt;
  b.overT-=dt;
  if(b.abilityAnim)b.animT=(b.animT||0)-dt;
  b.screenShake=Math.max(0,b.screenShake-dt*20);
  for(const f of b.fx.slice()){f.t+=dt;if(f.t>f.life)b.fx.splice(b.fx.indexOf(f),1);}
  for(const m of b.embers.slice()){m.t+=dt;if(m.t>m.life)b.embers.splice(b.embers.indexOf(m),1);}
  // 判定结束
  if(b.done){return;}
  if(b.failed){return;}
  if(b.judge&&b.judge.wait){drawJudgeLater=false;return;} // 暂停战斗直到选择
  // 速度(新引擎在 newBattle 设定 maxV/speedCur；此处统一)
  const st=r.st;
  const maxV=b.maxV||(300*(1+st.spd));
  b.maxV=maxV;
  b.speedCur= b.speedCur??maxV;
  b.speedCur+=(maxV-b.speedCur)*Math.min(1,dt*(0.55*(st.acc||1)));
  b.speedCur=clamp(b.speedCur,0.35,maxV);
  const travel=b.speedCur*dt;
  b.travel+=travel;
  // 全局冻结计时
  if(b.freezeAll>0)b.freezeAll-=dt;
  // 事件触发
  while(b.evIdx<b.events.length&&b.travel>=b.events[b.evIdx].d){
    const ev=b.events[b.evIdx++];execEvent(b,ev);
  }
  if(b.evIdx>=b.events.length)b.spawnedAll=true;
  // 更新敌人
  updateEnemies(b,dt,travel);
  // 武器/能力/主动
  updateWeapon(b,dt);
  runAbilities(b,dt);
  // 汽笛冷却
  if(b.hornCd>0)b.hornCd-=dt;if(b.hornT>0)b.hornT-=dt;
  if(b.frenzyT>0)b.frenzyT-=dt;
  // 回滚匣计时
  if(r.st.shieldCd>0){b.shieldT-=dt;}
  // Boss脑
  if(b.kind==='boss'&&b.boss&&!b.boss.dead)updateBoss(b,dt);
  // 驾驶室袭击/boss推进车头撞击
  bossPoke(b,dt);
  // 结束条件(普通)
  if(b.kind==='fight'){
    const noEnemies=!b.enemies.some(e=>!e.dead);
    if(b.spawnedAll&&noEnemies&&b.travel>=b.len*0.45){b.done=true;b.overT=0.4;battleReward(b);}
    if(b.travel>=b.len*1.9&&!b.enemies.some(e=>!e.dead)){b.done=true;battleReward(b);}
  }
  if(b.kind==='boss'){
    if(b.boss&&b.boss.dead){b.done=true;battleReward(b);fxText(b,640,150,'Boss 击破!','#ffd166');}
  }
  // 超时兜底(普通战)：拖太久则放生残敌直接结算
  if(b.kind==='fight'&&b.t>95){
    for(const e of b.enemies)if(!e.dead)e.dead=true;
    if(!b.done){b.done=true;battleReward(b);fxText(b,640,200,'时间到·甩下残敌清站','#9fb6c9');}
  }
}
function bossPoke(b,dt){
  const be=b.boss;if(!be||be.dead)return;
  if(be.d.id==='gate'){be.pokeT=(be.pokeT||0)+dt;if(be.pokeT>3.0){be.pokeT=0;const dm=Math.round(7*b.sc.dmg);hurtTrain(b,dm,'boss');fxText(b,G.FRONT,300,'闸门冲撞 -'+dm,'#ffb648');}}
  if(be.d.id==='ghost'){if(be.phase==='ghost')return;be.pokeT=(be.pokeT||0)+dt;if(be.pokeT>3.2){be.pokeT=0;const dm=Math.round(5*b.sc.dmg);hurtTrain(b,dm,'boss');fxText(b,G.FRONT,300,'幽灵头槌 -'+dm,'#9fb6ff');}}
  if(be.d.id==='judge'&&!(b.judge&&b.judge.wait)){be.pokeT=(be.pokeT||0)+dt;if(be.pokeT>3.6){be.pokeT=0;const dm=Math.round(8*b.sc.dmg);hurtTrain(b,dm,'boss');fxText(b,G.FRONT,300,'法槌震击 -'+dm,'#e8f1ff');}}
}
function execEvent(b,ev){
  if(ev.kind==='wave'){
    const pool=poolByZone();
    const n=ev.cnt;
    for(let i=0;i<n;i++){spawnTrack(b,pick(pool),G.FRONT+420+rnd(0,700)+i*30);}
  }else if(ev.kind==='elite'){
    const e=spawnTrack(b,ev.def,G.FRONT+620+rnd(0,200));
    if(e)fxText(b,e.x,230,'⚠ '+e.d.name,'#ff8a8a');

    b.coins.push({x:G.FRONT+300+rnd(0,500),y:560,v:Math.round(ev.v*(1+(RUN.st.coin||0))),drift:true});
  }else if(ev.kind==='part'){
    b.partsTrack.push({x:G.FRONT+300+rnd(0,400),y:540,opened:false});
  }
  function poolByZone(){
    const z=RUN.zone;
    if(z<=1)return ['aunt','commuter','miner'];
    if(z<=2)return ['aunt','commuter','ticket','miner','cement'];
    if(z<=4)return ['commuter','ticket','kamikaze','crab','hanger','miner'];
    if(z<=7)return ['commuter','kamikaze','crab','hanger','signal','miner'];
    return ['commuter','kamikaze','crab','hanger','signal','midnight','cement','stationmaster'];
  }
}
function updateEnemies(b,dt,travel){
  const r=RUN;
  for(const e of b.enemies.slice()){
    if(e.dead)continue;
    if(e.burn>0){e.burn-=dt;e.hp-=e.burnDps*dt;if(e.hp<=0){killEnemy(b,e,'skill');continue;}}
    if(e.slow>0)e.slow-=dt;
    if(e.frz>0)e.frz-=dt;
    if(e.ramCd>0)e.ramCd-=dt;
    const frozen=(e.frz>0||b.freezeAll>0);
    if(e.isBoss){bossMove(b,e,dt,travel);continue;}   // Boss: 入场→被冲撞→扒上机车
    if(e.st==='board'){
      if(frozen)continue;
      if(e.pushT>0){e.pushT-=dt;continue;}
      const slow=e.slow>0?0.55:1;
      e.x-=e.boardSpd*slow*dt;
      if(e.x<=G.CAB+6){cabStrike(b,e);continue;}
      continue;

/* ===== WebAudio 合成音效(无素材依赖) ===== */
let AC=null, muted=false;
function ensureAC(){ if(typeof window==='undefined')return null;
  const ACtor=window.AudioContext||window.webkitAudioContext; if(!ACtor)return null;
  if(!AC){try{AC=new ACtor();}catch(e){return null;}}
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function _tone(freq,dur,type,vol,delay,slide){
  vol=Math.max(0,Math.min(1,vol*(window.sfxVol===undefined?1:window.sfxVol)));
  if(muted)return; const ac=ensureAC(); if(!ac)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(delay||0);
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(28,freq+slide),t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function sfxImpl(k){
  switch(k){
    case 'ram': _tone(85,0.16,'square',0.55,0,-40); _tone(48,0.34,'sawtooth',0.6,0.01,-26); break;
    case 'ramKill': _tone(150,0.13,'square',0.42,0,-90); _tone(52,0.24,'triangle',0.5,0.03); break;
    case 'knock': _tone(240,0.12,'triangle',0.4,0,-150); break;
    case 'board': _tone(320,0.09,'square',0.3,0,120); _tone(90,0.35,'sawtooth',0.42,0.06,-50); break;
    case 'cab': _tone(150,0.4,'sawtooth',0.55,0,-110); break;
    case 'horn': _tone(130,0.65,'sawtooth',0.32,0,0); _tone(262,0.6,'square',0.16,0.06,0); break;
    case 'shot': _tone(950,0.045,'square',0.05,0,-500); break;
    case 'coin': _tone(1250,0.06,'sine',0.11,0,260); break;
    case 'box': _tone(600,0.07,'sine',0.2,0,200); _tone(900,0.09,'sine',0.16,0.05,150); break;
    case 'zap2': _tone(1650,0.06,'sine',0.11,0,-500); _tone(820,0.08,'square',0.08,0.03,320); break;
    case 'boom': _tone(55,0.5,'sawtooth',0.65,0,-18); _tone(160,0.25,'square',0.3,0.03,-60); break;
    case 'buy': _tone(700,0.07,'sine',0.15,0); _tone(1050,0.1,'sine',0.12,0.06); break;

  }
}

<script>

'use strict';
/* ============ 第6块：抉择推进(Boss强制版) 与 收尾 ============ */
function genCandidates(r){
  const z=r.zone;
  if(z===1)return [{type:'battle'}];                 // 首区教学战斗
  if(isBossZone(z))return [];                        // Boss区由强制卡处理
  const seg=(z-1)%4;
  const forceFight=!r._segFight;                     // 每段内至少1场战斗
  const opts=forceFight?['battle']:[];
  const pool=['shop','event','repair','battle'];
  shuffle(pool);
  // 有诅咒时修复更高权重
  if(r.curse&&!opts.includes('repair'))pool.push('repair');
  for(const t of pool){if(!opts.includes(t))opts.push(t);if(opts.length>=3)break;}
  shuffle(opts);
  return opts.slice(0,3).map(t=>({type:t}));
}
function goZone(r,type){
  if(type==='battle'){startZoneFight(r);}
  else if(type==='shop'){openShop(r);}
  else if(type==='event'){openEvent(r);}
  else if(type==='repair'){setScr('repair');}
  else if(type==='boss'){startBoss(r);}
}

<script>
'use strict';
/* ===== v0.5 主菜单 / 设置(暂停) / 介绍Wiki / 音乐循环 ===== */
let pauseOpen=false, wikiBack='title', pauseFrom='choose';
const MUSIC_LIST=['music/电车难题1.mp3','music/电车难题2.mp3','music/电车难题3.mp3','music/电车难题4.mp3'];
let MUS=null,musIdx=0,musTimer=null,musStarted=false;
function musicVolVal(){const v=(typeof window!=='undefined')?window.musicVol:undefined;return (typeof v==='number'&&isFinite(v))?Math.max(0,Math.min(1,v)):1;}
function musicTry(){ if(!MUS||typeof Audio==='undefined')return; const a=MUS[musIdx]; if(a&&a.paused){const p=a.play(); if(p&&p.catch)p.catch(()=>{});} }
function musicStart(){
  if(musStarted)return; musStarted=true;
  if(typeof Audio==='undefined')return;
  try{
    MUS=MUSIC_LIST.map(f=>{const a=new Audio(f);a.preload='auto';a.loop=false;a.volume=musicVolVal();return a;});
    playMus(0);
  }catch(e){MUS=null;}
}
function playMus(i){
  if(!MUS)return; musIdx=((i%MUS.length)+MUS.length)%MUS.length;
  const a=MUS[musIdx]; a.volume=musicVolVal(); a.currentTime=0;
  const p=a.play(); if(p&&p.catch)p.catch(()=>{});
  a.onended=function(){ if(musTimer)clearTimeout(musTimer); musTimer=setTimeout(function(){playMus(musIdx+1);},3000); };
}
function musicApply(){ if(MUS)MUS.forEach(a=>{a.volume=musicVolVal();}); }
function musicStop(){ if(MUS)MUS.forEach(a=>{try{a.pause();}catch(e){}}); }
if(typeof window!=='undefined'&&cv){
  cv.addEventListener('mousedown',function(){ musicStart(); musicTry(); });
  window.addEventListener('keydown',function(){ musicStart(); musicTry(); });

}

let wikiSection=0, wikiScroll=0;
const WIKI_SECS=['玩法与机制','配件一览','收藏品一览','羁绊一览','怪物与Boss','事件一览'];
function wikiLines(){
  const lines=[];
  if(wikiSection===0){
    const M=[
      "—— 核心玩法 ——",
      "列车冲撞 -> 击飞 -> 折返 -> 二次撞击扒车；车顶怪用武器补刀。",

      "—— 掉落机制 ——",
      "撞死/补刀掉落配件；路上的黄“配件箱”驶过即拾取并立刻消失。",
      "黄色光点=资金袋；精英/列车/Boss 必掉更高品质配件。",
      "—— 车顶机制 ——",
      "基础4格(大怪2格)；怪摸到驾驶室=破袭扣耐久并被顶开。",

      "—— 羁绊 ——",
      "同阵营已装配≥3件激活基础加成，≥5件解锁大招。",

      "—— 黑匣子 ——",
      "车体首次归零以35%耐久复活一次。",
    ];

  } else if(wikiSection===1){
    CATS.forEach(ct=>{

  } else {
    EVENTS.forEach(ev=>{lines.push("◆ "+ev.name+"："+(ev.t||"").slice(0,44));});
  }
  return lines;
}
