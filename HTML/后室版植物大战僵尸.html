function bgChaos(g) {
  /* 重塑的混乱：白色墙纸、红色地板，房间正在被重新拼合 */
  bgRoomBase(g, {
    wall: '#dcdcd2', stripe: 'rgba(255,255,250,0.3)', dot: 'rgba(150,148,138,0.14)',
    seed: 61, mold: 4, drips: 5,
    moldColor: 'rgba(110,104,92,0.3)', dripColor: 'rgba(120,112,100,0.26)',
    floor1: '#8a1c1c', floor2: '#751414', floor3: '#3a0808',
    base: '#a8a89c', baseTop: 'rgba(255,255,250,0.3)',
    joint: 'rgba(40,6,6,0.4)', fieldBase: '#9a2222', fieldSeam: 'rgba(36,4,4,0.45)', fieldJoint: 'rgba(40,6,6,0.2)', fieldDirt: 'rgba(20,2,2,0.32)'
  });
  /* 拼错的墙纸：一块块错位贴上去的（都压在墙带里） */
  const cWallBot = bgFloorLine();
  const cBand = cWallBot - FIELD_TOP;
  for (let i = 0; i < 9; i++) {
    const px = (i * 231.7) % W;
    const pw = 60 + (i * 37) % 120;
    const ph = Math.min(40 + (i * 53) % 90, Math.max(8, cBand - 8));
    const py = FIELD_TOP + 3 + artNoise(i, 5) * Math.max(0, cBand - ph - 6);
    g.save();
    g.translate(px + pw / 2, py + ph / 2);
    g.rotate(((i % 5) - 2) * 0.035);
    g.fillStyle = i % 2 ? 'rgba(246,246,240,0.5)' : 'rgba(206,206,196,0.42)';
    g.fillRect(-pw / 2, -ph / 2, pw, ph);
    g.strokeStyle = 'rgba(120,116,104,0.35)'; g.lineWidth = 1.4;
    g.strokeRect(-pw / 2, -ph / 2, pw, ph);
    for (let k = 0; k < 4; k++) {
      g.fillStyle = 'rgba(180,178,168,0.18)';
      g.fillRect(-pw / 2 + k * (pw / 4), -ph / 2, 5, ph);
    }
    g.restore();
  }
  /* 露出来的木龙骨（墙带够高才画） */
  if (cBand > 80) {
    g.strokeStyle = 'rgba(90,70,44,0.5)'; g.lineWidth = 5;
    for (let i = 0; i < 5; i++) {
      const px = 140 + i * 180;
      g.beginPath(); g.moveTo(px, FIELD_TOP + 24); g.lineTo(px + 6, cWallBot - 20); g.stroke();
    }
  }
  /* 红地毯上的拖痕与椅脚印 */
  g.strokeStyle = 'rgba(30,4,4,0.35)'; g.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const px = 90 + i * 230, py = FIELD_TOP + 250 + (i % 2) * 120;
    g.beginPath();
    g.moveTo(px, py);
    g.quadraticCurveTo(px + 60, py + 20, px + 130, py - 6);
    g.stroke();
  }
  for (let i = 0; i < 16; i++) {
    const px = 60 + (i * 173.3) % (W - 120);
    const py = FIELD_TOP + 220 + (i * 61.7) % 260;
    bgStain(g, px, py, 9 + (i % 4) * 4, 'rgba(28,4,4,0.3)', 200 + i, 3);
  }
}

function bgRed(g) {
  /* 红色房间：一切的最后 */
  const wallBot = bgFloorLine();
  const bandH = wallBot - FIELD_TOP;
  bgRect(g, 0, FIELD_TOP, W, FIELD_H, bgGrad(g, 0, FIELD_TOP, 0, H,
    [[0, '#4a0d0d'], [0.3, '#7a1a1a'], [0.62, '#4a0a0a'], [1, '#180202']]));
  /* 墙带：深红的墙纸竖纹 */
  for (let x = 0; x < W; x += 30) bgRect(g, x, FIELD_TOP, 14, Math.max(2, bandH), 'rgba(150,40,40,0.07)');
  /* 尽头的门：在墙带里透出一道光 */
  const dx = W / 2;
  bgRect(g, dx - 74, FIELD_TOP + 1, 148, Math.max(3, bandH - 2), 'rgba(14,1,1,0.75)');
  bgRect(g, dx - 62, FIELD_TOP + 2, 124, Math.max(2, bandH - 4), 'rgba(255,132,100,0.42)');
  bgRect(g, dx - 62, FIELD_TOP + 2, 124, 2, 'rgba(255,190,170,0.35)');
  /* 门口的光洒在地上 */
  g.fillStyle = 'rgba(255,130,100,0.09)';
  g.beginPath();
  g.moveTo(dx - 62, wallBot);
  g.lineTo(dx + 62, wallBot);
  g.lineTo(dx + 210, H);
  g.lineTo(dx - 210, H);
  g.closePath();
  g.fill();
  /* 两侧的管线（到墙脚为止） */
  for (let s = -1; s <= 1; s += 2) {
    const px = s < 0 ? 46 : W - 52;
    bgRect(g, px, FIELD_TOP, 8, Math.max(4, bandH), 'rgba(60,10,10,0.7)');
    bgRect(g, px, FIELD_TOP, 2, Math.max(4, bandH), 'rgba(200,90,70,0.10)');
    if (bandH > 60) for (let i = 0; i < 4; i++) bgRect(g, px - 4, FIELD_TOP + 40 + i * 96, 16, 7, 'rgba(40,6,6,0.8)');
  }
  bgBaseboard(g, wallBot, '#3a0808', 'rgba(255,140,110,0.12)');
  /* 地面（红地毯） */
  bgRect(g, 0, wallBot + 11, W, H - wallBot - 11, bgGrad(g, 0, wallBot, 0, H,
    [[0, '#5a0e0e'], [0.5, '#430808'], [1, '#1c0202']]));
  bgFloor(g, 0, wallBot + 14, W, H, 44, 'rgba(20,2,2,0.45)', 14);
  /* 大块阴影与水渍（小一点、淡一点，别糊成洞） */
  for (let i = 0; i < 34; i++) {
    const px = (i * 163.7) % W;
    const py = wallBot + 20 + (i * 113.3) % (H - wallBot - 30);
    bgStain(g, px, py, 10 + (i % 4) * 10, 'rgba(12,0,0,0.2)', 300 + i, 5);
  }
  /* 场地 */
  bgField(g, '#5e1212', 'rgba(18,2,2,0.5)', 'rgba(20,2,2,0.2)', 'rgba(16,2,2,0.35)');
  /* 血迹一样的拖痕 */
  g.strokeStyle = 'rgba(120,12,12,0.3)'; g.lineWidth = 6;
  for (let i = 0; i < 3; i++) {
    const py = gridY + 40 + i * 150;
    g.beginPath();
    g.moveTo(gridX + 40, py);
    g.quadraticCurveTo(gridX + 300, py + 26, gridX + 640, py - 14);
    g.stroke();
  }
}

function bgStatic(level) {
  const key = level + '|' + rows + '|' + gridY;
  if (bgCacheKey === key && bgCacheCv) return bgCacheCv;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  if (level === 1) bgFishbone(g);
  else if (level === 2) bgRoom(g);
  else if (level <= 5) bgYellow(g, level);
  else if (level === 6) bgBeige(g);
  else if (level <= 8) bgChaos(g);
  else bgRed(g);
  bgCacheCv = cv; bgCacheKey = key;
  return cv;
}

/* 每帧的动态部分：灯管、光锥、飘尘 */
const BG_LIGHT = {
  1: { tube: '245,238,180', glow: 0.20, cone: 0.05, n: 5, bad: 0.5 },
  2: { tube: '240,232,170', glow: 0.20, cone: 0.05, n: 6, bad: 0.55 },
  3: { tube: '255,248,190', glow: 0.24, cone: 0.06, n: 7, bad: 0.6 },
  4: { tube: '250,242,180', glow: 0.21, cone: 0.05, n: 7, bad: 0.6 },
  5: { tube: '240,230,170', glow: 0.17, cone: 0.04, n: 7, bad: 0.65 },
  6: { tube: '255,245,210', glow: 0.20, cone: 0.05, n: 7, bad: 0.6 },
  7: { tube: '255,255,250', glow: 0.26, cone: 0.06, n: 7, bad: 0.55 },
  8: { tube: '255,255,250', glow: 0.24, cone: 0.06, n: 7, bad: 0.6 },
  9: { tube: '255,120,95', glow: 0.22, cone: 0.06, n: 7, bad: 0.4 }
};

function bgLights(level) {
  const L = BG_LIGHT[level] || BG_LIGHT[3];
  const t = G.time;
  /* 灯管挂在墙上（墙带很窄时自动上移，别掉到地面上） */
  const ly = Math.min(FIELD_TOP + 16, bgFloorLine() - 9);
  for (let i = 0; i < L.n; i++) {
    const lx = 60 + i * (W - 120) / (L.n - 1);
    /* 老灯管的抽搐：偶尔暗一下 */
    const buzz = Math.sin(t * (1.6 + i * 0.7) + i * 2.1) * 0.5 + 0.5;
    const stutter = Math.sin(t * (17 + i * 3) + i) > (1 - L.bad * 0.25) ? 0.25 : 1;
    const flick = (0.55 + buzz * 0.45) * stutter;
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 155);
    lg.addColorStop(0, 'rgba(' + L.tube + ',' + (L.glow * flick) + ')');
    lg.addColorStop(0.45, 'rgba(' + L.tube + ',' + (L.glow * 0.35 * flick) + ')');
    lg.addColorStop(1, 'rgba(' + L.tube + ',0)');
    ctx.fillStyle = lg;
    ctx.fillRect(lx - 155, ly - 155, 310, 310);
    /* 光锥落到地上（只在部分灯管下，且很淡，别糊住场地） */
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(' + L.tube + ',' + (L.cone * 0.5 * flick) + ')';
      ctx.beginPath();
      ctx.moveTo(lx - 34, ly + 4);
      ctx.lineTo(lx + 34, ly + 4);
      ctx.lineTo(lx + 62, H);
      ctx.lineTo(lx - 62, H);
      ctx.closePath();
      ctx.fill();
    }
    /* 灯管本体 */
    ctx.fillStyle = 'rgba(' + L.tube + ',' + (0.85 * flick) + ')';
    ctx.fillRect(lx - 38, ly - 3, 76, 6);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * flick) + ')';
    ctx.fillRect(lx - 34, ly - 2, 68, 2);
    ctx.fillStyle = 'rgba(30,26,14,0.8)';
    ctx.fillRect(lx - 44, ly - 7, 8, 14);
    ctx.fillRect(lx + 36, ly - 7, 8, 14);
  }
  /* 飘尘：慢慢往下落 */
  ctx.fillStyle = 'rgba(230,220,170,0.10)';
  for (let i = 0; i < 26; i++) {
    const px = (artNoise(i, 1) * W + t * (4 + artNoise(i, 2) * 8)) % W;
    const py = FIELD_TOP + ((artNoise(i, 3) * FIELD_H + t * (6 + artNoise(i, 4) * 12)) % FIELD_H);
    const s = 1 + artNoise(i, 5) * 1.8;
    ctx.fillRect(px, py, s, s);
  }
}

/* 障碍格：闷在房间里的杂物堆 */
function drawObstacles() {
  for (const o of obstacles) {
    const x = gridX + o.c * CELL_W;
    const y = gridY + o.r * CELL_H;
    const sd = o.r * 7.3 + o.c * 3.1;
    /* 影子：贴着箱底 */
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(x + CELL_W / 2 + 3, y + CELL_H - 12, CELL_W * 0.4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    /* 箱体 */
    const bx = x + 11, by = y + 20, bw = CELL_W - 22, bh = CELL_H - 34;
    ctx.fillStyle = '#332a1a';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(255,240,200,0.05)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.strokeStyle = 'rgba(10,8,4,0.9)';
    ctx.lineWidth = 2.4;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    /* 箱顶（一点透视） */
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + 7, by - 9);
    ctx.lineTo(bx + bw + 7, by - 9);
    ctx.lineTo(bx + bw, by);
    ctx.closePath();
    ctx.fillStyle = '#453824';
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,8,4,0.9)';
    ctx.stroke();
    /* 胶带与标签 */
    ctx.fillStyle = 'rgba(190,180,150,0.13)';
    ctx.fillRect(bx + bw * 0.42, by, 6, bh);
    ctx.fillRect(bx + 2, by + bh * 0.42, bw - 4, 5);
    ctx.fillStyle = 'rgba(220,210,170,0.1)';
    ctx.fillRect(bx + 6, by + 8, 14, 10);
    /* 霉与裂口 */
    ctx.fillStyle = 'rgba(30,34,16,0.35)';
    ctx.beginPath();
    ctx.ellipse(bx + 12 + artNoise(sd, 1) * (bw - 24), by + 14 + artNoise(sd, 2) * (bh - 28),
      8 + artNoise(sd, 3) * 8, 6 + artNoise(sd, 4) * 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,20,10,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.3, by + 4);
    ctx.lineTo(bx + bw * 0.34, by + bh * 0.5);
    ctx.lineTo(bx + bw * 0.26, by + bh - 4);
    ctx.stroke();
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(210,190,120,0.055)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) {
    const x = gridX + c * CELL_W;
    ctx.beginPath(); ctx.moveTo(x, gridY); ctx.lineTo(x, gridY + rows * CELL_H); ctx.stroke();
  }
  for (let r = 0; r <= rows; r++) {
    const y = gridY + r * CELL_H;
    ctx.beginPath(); ctx.moveTo(gridX, y); ctx.lineTo(gridX + COLS * CELL_W, y); ctx.stroke();
  }
}


/* ============================================================
   植物绘制
   ============================================================ */
function drawPlants() {
  for (const p of G.plants) {
    if (p.dead) continue;
    switch(p.type) {
      case 'pea':      drawPea(p); break;
      case 'sun':      drawSunflower(p); break;
      case 'cherry':   drawCherry(p); break;
      case 'wall':     drawWall(p); break;
      case 'potato':   drawPotato(p); break;
      case 'ice':      drawIce(p); break;
      case 'chomper':  drawChomper(p); break;
      case 'repeater': drawRepeater(p); break;
    }
  }
}

/* ============================================================
   静物画稿（重绘）
   ------------------------------------------------------------
   造型参考《植物大战僵尸》原作剪影，按设定稿的「静物化」描述重画：
   五官扭曲、身体僵直、失温尸色、与器物融合、撕裂的大嘴。
   全部为 canvas 矢量路径（无外部图片）；绘制期不消耗 Math.random。
   ============================================================ */

/* 确定性噪声：绘制期的"随机"都用它，避免影响战斗随机流 */
function artNoise(seed, i) {
  const x = Math.sin((seed || 0) * 127.1 + (i || 0) * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

const ART = {
  ink: '#171a0e',
  inkSoft: 'rgba(12,14,8,0.5)',
  dead: '#0a0b07',          /* 黑掉的眼 / 增生 */
  pea:     ['#6f9c3d', '#4d7327', '#93c25c', '#314f1b'],
  stem:    ['#4a7229', '#2f4d1c'],
  petal:   ['#e4bd47', '#ab8429', '#f7e08d'],
  face:    ['#8b5f2e', '#5f3f1c', '#bb8c4c'],
  cherry:  ['#8f2318', '#59100a', '#a8382a'],
  nut:     ['#b38b53', '#7c5b30', '#d8b980'],
  nutCore: '#8f9aa2',
  spud:    ['#b89b5d', '#826a38', '#ddc28a'],
  dirt:    ['#5b4227', '#3d2c19'],
  ice:     ['#bcd9e6', '#7e9cb2', '#e8f5fb'],
  corpse:  '#93a1b0',
  mortis:  '#7d6b93',
  chomp:   ['#8b50a9', '#5c2f77', '#b579cd'],
  maw:     '#33102c',
  mawIn:   '#c98fb0',
  gum:     '#7d2a48',
  tooth:   '#f1ebd4',
  metal:   ['#b9bdc0', '#7e8489', '#e6eaec'],
  metalDark: '#4e5459'
};

/* 填充 + 可选描边 */
function artShape(color, ink, lw) {
  ctx.fillStyle = color;
  ctx.fill();
  if (ink !== null && ink !== undefined) {
    ctx.strokeStyle = ink; ctx.lineWidth = lw === undefined ? 2 : lw; ctx.stroke();
  }
}
function artE(x, y, rx, ry, rot, color, ink, lw) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  artShape(color, ink, lw);
}
function artShadow(cx, cy, rx, ry, alpha) {
  ctx.fillStyle = 'rgba(0,0,0,' + (alpha === undefined ? 0.4 : alpha) + ')';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
/* 叶片：从 (x,y) 向 rot 方向伸出 len 长、wid 宽的叶子 */
function artLeaf(x, y, len, wid, rot, c1, c2, lw) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.45, wid, 0, 0);
  ctx.closePath();
  artShape(c1, ART.ink, lw === undefined ? 2 : lw);
  ctx.beginPath();
  ctx.moveTo(len * 0.1, 0); ctx.quadraticCurveTo(len * 0.5, -wid * 0.25, len * 0.88, 0);
  ctx.strokeStyle = c2; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.restore();
}
/* 扭曲的叶子：长歪、一侧鼓起、叶脉也跟着弯 —— 静物的叶子是"拧"着长的 */
function artTwistedLeaf(x, y, len, wid, rot, bend, c1, c2, lw) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.38, -wid * 1.25 + bend, len, bend * 0.8);
  ctx.quadraticCurveTo(len * 0.5, wid * 0.7 + bend * 0.4, 0, 0);
  ctx.closePath();
  artShape(c1, ART.ink, lw === undefined ? 1.8 : lw);
  ctx.strokeStyle = c2; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(len * 0.08, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid * 0.15 + bend, len * 0.9, bend * 0.8);
  ctx.stroke();
  /* 拧出来的褶皱 */
  ctx.strokeStyle = 'rgba(20,30,10,0.28)'; ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(len * 0.3, -wid * 0.5); ctx.lineTo(len * 0.42, wid * 0.35);
  ctx.stroke();
  ctx.restore();
}
/* 带描边的茎 */
function artStem(x0, y0, x1, y1, bow, w, c1, c2) {
  const mx = (x0 + x1) / 2 + bow;
  const my = (y0 + y1) / 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = ART.ink; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(mx, my, x1, y1); ctx.stroke();
  ctx.strokeStyle = c1; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(mx, my, x1, y1); ctx.stroke();
  ctx.strokeStyle = c2; ctx.lineWidth = Math.max(1.2, w * 0.3);
  ctx.beginPath(); ctx.moveTo(x0 - w * 0.22, y0); ctx.quadraticCurveTo(mx - w * 0.22, my, x1 - w * 0.22, y1); ctx.stroke();
}
/* 炮口：管身 + 外翻口沿 + 深色内孔（朝右） */
function artMuzzle(x, y, rot, len, r, tube, rim, bore) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.8);
  ctx.lineTo(len, -r);
  ctx.lineTo(len, r);
  ctx.lineTo(0, r * 0.8);
  ctx.closePath();
  artShape(tube, ART.ink, 2.2);
  ctx.beginPath();
  ctx.moveTo(len * 0.15, -r * 0.72);
  ctx.lineTo(len * 0.9, -r * 0.9);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.stroke();
  artE(len + 1.5, 0, r * 0.4, r, 0, rim, ART.ink, 2);
  artE(len + 2.5, 0, r * 0.24, r * 0.7, 0, bore, null);
  ctx.restore();
}
/* 炮口尖端在格子坐标系里的位置
   —— 画稿与子弹发射点共用这一个函数，子弹就不会和枪口错位 */
function artMuzzleTip(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t0 = G ? G.time : 0;
  const rot = (x, y, a) => ({ x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) });
  if (p.type === 'ice') {
    const ti = t0 * 4 + p.bob;
    const jit = Math.sin(ti * 17) * 1.5 + Math.sin(ti * 29) * 0.7;
    const shiver = Math.sin(ti * 3) * 0.7;
    const o = rot(13 + 16.5 * Math.cos(-0.06), -4 + 16.5 * Math.sin(-0.06), jit * 0.035);
    return { x: cx + shiver + jit * 0.9 + o.x, y: cy - 16 - jit * 0.5 + o.y, rot: jit * 0.035 - 0.06 };
  }
  const t = t0 * 1.4 + p.bob;
  const sway = Math.sin(t) * 2;
  const rep = p.type === 'repeater';
  const headY = rep ? -18 : -16;
  const mx = rep ? 14 : 13, my = rep ? -6 : -4, mr = rep ? -0.05 : -0.08;
  const a = sway * 0.012;
  const o = rot(mx + 17.5 * Math.cos(mr), my + 17.5 * Math.sin(mr), a);
  return { x: cx + sway + o.x, y: cy + headY + o.y, rot: a + mr };
}

/* 开火瞬间的枪口闪光（读 p.muzzle，由 update 在开火时置位） */
function artMuzzleFlash(p) {
  if (!(p.muzzle > 0)) return;
  const tip = artMuzzleTip(p);
  const ice = p.type === 'ice';
  const col = ice ? '205,242,255' : (p.type === 'repeater' ? '200,245,140' : '228,255,180');
  const k = Math.max(0, Math.min(1, p.muzzle / 0.14));
  const R = (ice ? 20 : 15) * (0.55 + k * 0.45);
  const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, R);
  g.addColorStop(0, 'rgba(' + col + ',' + (0.45 * k) + ')');
  g.addColorStop(1, 'rgba(' + col + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(tip.x - R, tip.y - R, R * 2, R * 2);
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(tip.rot);
  /* 短促的火舌：四道朝前的尖刺，不是一坨光斑 */
  ctx.fillStyle = 'rgba(' + col + ',' + (0.8 * k) + ')';
  for (let i = 0; i < 4; i++) {
    const a = (i - 1.5) * 0.4;
    const L = (11 + k * 7) * (i === 1 || i === 2 ? 1.15 : 0.85);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * L - 1.5, Math.sin(a) * L - 1.3);
    ctx.lineTo(Math.cos(a) * L + 1.5, Math.sin(a) * L + 1.3);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * k) + ')';
  ctx.beginPath(); ctx.arc(1.5, 0, 2.4 * (0.6 + k * 0.5), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
/* 黑掉的、眼睛似的增生：豌豆家族的"脸"由这些构成 */
function artEyeGrowth(x, y, r, rot, deep) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.beginPath();
  ctx.moveTo(-r, -r * 0.25);
  ctx.quadraticCurveTo(-r * 0.6, -r * 1.15, r * 0.25, -r * 0.9);
  ctx.quadraticCurveTo(r * 1.1, -r * 0.55, r * 0.85, r * 0.35);
  ctx.quadraticCurveTo(r * 0.45, r * 1.15, -r * 0.4, r * 0.8);
  ctx.quadraticCurveTo(-r * 1.15, r * 0.5, -r, -r * 0.25);
  ctx.closePath();
  artShape(deep ? '#050603' : ART.dead, null);
  ctx.strokeStyle = 'rgba(30,36,18,0.75)'; ctx.lineWidth = 1.2; ctx.stroke();
  /* 眼里那点还没死透的反光 */
  ctx.fillStyle = 'rgba(150,175,95,0.22)';
  ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.35, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
/* 顺着脸淌下来的一道黑 */
function artEyeDrip(x, y, w, len, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.beginPath();
  ctx.moveTo(-w, 0);
  ctx.quadraticCurveTo(-w * 0.5, len * 0.6, -w * 0.25, len);
  ctx.quadraticCurveTo(0, len * 1.15, w * 0.25, len * 0.8);
  ctx.quadraticCurveTo(w * 0.7, len * 0.35, w, 0);
  ctx.closePath();
  artShape(ART.dead, null);
  ctx.restore();
}
/* 身后的脸形阴影（樱桃炸弹的"凝固的死寂"） */

/* ============================================================
   植物
   ============================================================ */

function drawPea(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 1.4 + p.bob;
  const sway = Math.sin(t) * 2.0;
  const flash = p.flash > 0;
  const P = ART.pea;

  artShadow(cx, p.y + CELL_H - 11, 25, 7);
  /* 拧着长出来的叶子 */
  artTwistedLeaf(cx - 3, p.y + CELL_H - 25, -19, 7.5, 0.55, 6, P[1], P[3]);
  artTwistedLeaf(cx + 4, p.y + CELL_H - 22, 20, 7, -0.32, -7, P[0], P[3]);
  artTwistedLeaf(cx + 1, p.y + CELL_H - 34, 15, 5.5, -1.3, 7, P[1], P[3], 1.6);
  artTwistedLeaf(cx - 2, p.y + CELL_H - 40, -12, 5, 1.15, -5, P[1], P[3], 1.5);
  artStem(cx, p.y + CELL_H - 17, cx + sway, cy - 2, sway * 0.5, 7, P[1], P[0]);

  /* 茎上也长着眼睛似的东西 */
  artEyeGrowth(cx - 2 + sway * 0.4, cy + 22, 2.6, 0.3);
  artEyeGrowth(cx + 3, cy + 30, 1.9, -0.4);
  artEyeGrowth(cx - 1, p.y + CELL_H - 30, 2.2, 0.8);

  ctx.save();
  ctx.translate(cx + sway, cy - 16);
  ctx.rotate(sway * 0.012);

  artTwistedLeaf(-13, -14, -13, 6, 0.6, 5, P[0], P[3], 1.8);

  /* 头 */
  artE(0, 0, 21, 23, 0, flash ? P[2] : P[0], ART.ink, 2.6);
  artE(3, 4, 17, 19, 0, P[1], null);
  /* 病斑 */
  ctx.fillStyle = 'rgba(40,58,20,0.35)';
  ctx.beginPath(); ctx.ellipse(-8, -10, 7, 5, -0.45, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, 10, 5.5, 4, 0.3, 0, Math.PI * 2); ctx.fill();

  /* 炮口 */
  artMuzzle(13, -4, -0.08, 15, 11.5, P[1], P[0], '#16240d');

  /* 黑掉的眼睛：一只塌在脸上，一只被挤到炮口边拉成一条 */
  ctx.beginPath();
  ctx.moveTo(-14, -5);
  ctx.quadraticCurveTo(-13, -13, -4, -12.5);
  ctx.quadraticCurveTo(0, -10, -3, -4);
  ctx.quadraticCurveTo(-7, 1, -12, 1);
  ctx.quadraticCurveTo(-15, -1, -14, -5);
  ctx.closePath();
  artShape(ART.dead, null);
  ctx.strokeStyle = 'rgba(30,36,18,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(150,175,95,0.2)';
  ctx.beginPath(); ctx.arc(-9, -8, 1.5, 0, Math.PI * 2); ctx.fill();
  artEyeDrip(-9, 1, 3.6, 15, 0.06);
  ctx.beginPath();
  ctx.ellipse(1.5, -13, 5.4, 3.2, -0.52, 0, Math.PI * 2);
  artShape(ART.dead, null);
  ctx.strokeStyle = 'rgba(30,36,18,0.6)'; ctx.lineWidth = 1.1; ctx.stroke();

  /* 身上长满各种黑色眼睛似的东西 */
  artEyeGrowth(-15, 8, 3.6, 0.35);
  artEyeGrowth(6, 13, 2.8, -0.25);
  artEyeGrowth(-4, -20, 2.4, 0.6);
  artEyeGrowth(9, 4, 1.8, 0.9);
  artEyeGrowth(15, 9, 2.2, -0.5);

  /* 被呛住的地方：喉口鼓起一块（不是嘴） */
  ctx.beginPath();
  ctx.ellipse(9.5, 7.5, 4.2, 4.4, 0, 0, Math.PI * 2);
  artShape(P[1], ART.ink, 1.4);
  artEyeGrowth(9.5, 7.5, 2.1, 0.2, true);

  if (p.chained) {
    ctx.strokeStyle = 'rgba(190,255,130,0.5)';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 26, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  artMuzzleFlash(p);
}

function drawSunflower(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 0.8 + p.bob;
  const sway = Math.sin(t) * 1.6;
  const flash = p.flash > 0;
  const P = ART.petal, F = ART.face;
  const leak = Math.max(0, Math.min(1, 1 - p.hp / p.maxHp)); /* 被撕碎时泄露光芒 */

  artShadow(cx, p.y + CELL_H - 11, 26, 7);
  artLeaf(cx + 2, p.y + CELL_H - 20, -22, 10, 0.22, ART.stem[0], ART.stem[1]);
  artLeaf(cx + 2, p.y + CELL_H - 20, 23, 10, -0.2, ART.stem[0], ART.stem[1]);
  artStem(cx, p.y + CELL_H - 18, cx + sway, cy + 6, sway * 0.4, 8, ART.stem[0], '#6f9c48');

  ctx.save();
  ctx.translate(cx + sway, cy - 12);
  ctx.rotate(sway * 0.01);

  /* 愈发厚实的花瓣：外层厚度 + 内层花瓣 + 一道锐利的高光边 */
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.26;
    ctx.save(); ctx.rotate(a);
    artE(17, 0, 12.5, 14.5, 0, P[1], ART.ink, 2.2);
    artE(21, 0, 11, 13.5, 0, flash ? P[2] : P[0], ART.ink, 2.2);
    ctx.beginPath(); ctx.ellipse(26, -4, 4.6, 3.4, 0.3, 0, Math.PI * 2);
    artShape(P[2], null);
    ctx.restore();
  }

  /* 花心（脸） */
  artE(0, 0, 20, 20, 0, '#3d2a12', null);
  artE(0, 0, 18.5, 18.5, 0, F[0], ART.ink, 2.4);
  artE(2.5, 2.5, 15, 15, 0, F[1], null);
  for (let i = 0; i < 12; i++) {
    const a = artNoise(p.bob, i) * Math.PI * 2;
    const r = 4 + artNoise(p.bob, i + 20) * 12;
    artE(Math.cos(a) * r, Math.sin(a) * r, 1.4, 1.4, 0, F[1], null);
  }

  /* 空洞的神情：两个深陷的眼窝，只剩一点残光 */
  artE(-6.5, -3.5, 6.4, 7.6, 0.12, '#0e0c07', null);
  artE(6.5, -3.5, 6.4, 7.6, -0.12, '#0e0c07', null);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(-6.5, -3.5, 6.4, 7.6, 0.12, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(6.5, -3.5, 6.4, 7.6, -0.12, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(240,220,150,0.18)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(-6.5, -3.5, 5.2, 6.4, 0.12, Math.PI * 0.75, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(6.5, -3.5, 5.2, 6.4, -0.12, Math.PI * 0.75, Math.PI * 1.5); ctx.stroke();
  const gl = 0.22 + Math.sin(t * 1.6) * 0.1 + leak * 0.5;
  ctx.fillStyle = 'rgba(245,225,150,' + gl + ')';
  ctx.beginPath(); ctx.arc(-6.5, 1.4, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6.5, 1.4, 1.6, 0, Math.PI * 2); ctx.fill();

  /* 松弛、半张的下颌（不笑，也不怒） */
  ctx.fillStyle = 'rgba(20,12,4,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 10.6, 6.4, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 9.4 + Math.sin(t) * 0.4, 4.6, 2.9, 0, 0, Math.PI * 2);
  artShape('#150d05', ART.ink, 1.4);
  ctx.fillStyle = 'rgba(240,232,205,0.75)';
  ctx.fillRect(-2.6, 7.6 + Math.sin(t) * 0.4, 5.2, 1.5);

  /* 花瓣裂缝里漏出的光：越破损越亮 */
  if (leak > 0.03) {
    ctx.fillStyle = 'rgba(255,240,180,' + (0.09 * leak) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,175,' + (0.2 + leak * 0.65) + ')';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 5; i++) {
      const a = artNoise(p.bob, i + 3) * Math.PI * 2;
      const r0 = 9, r1 = 20 + artNoise(p.bob, i + 9) * 7;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawCherry(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 3 + p.bob;
  const flash = p.flash > 0;
  const P = ART.cherry;

  artShadow(cx, p.y + CELL_H - 12, 24, 6.5);

  ctx.save();
  ctx.translate(cx, cy + 6);

  /* 余烬几乎熄了，只在被啃咬时亮一下 */
  const ember = 0.07 + Math.sin(t * 0.5) * 0.03 + (flash ? 0.28 : 0);
  ctx.fillStyle = 'rgba(190,70,20,' + ember + ')';
  ctx.beginPath(); ctx.ellipse(0, -1, 12, 8, 0, 0, Math.PI * 2); ctx.fill();

  /* 果柄与叶 */
  ctx.lineCap = 'round';
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(-12, -12); ctx.quadraticCurveTo(-5, -27, 1, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -13); ctx.quadraticCurveTo(7, -27, 1, -23); ctx.stroke();
  ctx.strokeStyle = '#3f5a1e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-12, -12); ctx.quadraticCurveTo(-5, -27, 1, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -13); ctx.quadraticCurveTo(7, -27, 1, -23); ctx.stroke();
  artTwistedLeaf(1, -23, -14, 6, -1.55, 4, '#456a20', '#2b4517', 1.6);
  artTwistedLeaf(1, -23, 14, 6, -1.45, -4, '#456a20', '#2b4517', 1.6);

  for (const side of [-1, 1]) {
    const bx = side * 13.5, by = side * -3;
    const R = 15;
    artE(bx, by, R, R - 0.5, 0, flash ? P[2] : P[0], ART.ink, 2.6);
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, R - 1.2, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = P[1];
    ctx.beginPath(); ctx.ellipse(bx - 4, by + 7, R, R, 0, 0, Math.PI * 2); ctx.fill();
    /* 失去光泽：只剩一层发白的干皮 */
    ctx.fillStyle = 'rgba(220,205,180,0.14)';
    ctx.beginPath(); ctx.ellipse(bx + side * 2 - 1, by - 7, 7, 4.4, side * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* 死寂：整张脸就是一块阴影 —— 影子自己勾出五官，孔里透出干掉的果肉 */
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, R - 1.2, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(9,4,11,0.68)';
    ctx.beginPath();
    ctx.ellipse(bx, by - 1.5, R * 0.96, R * 0.86, side * 0.08, 0, Math.PI * 2);
    ctx.fill();
    /* 眼窝是影子上的两个孔 */
    ctx.fillStyle = P[1];
    ctx.beginPath(); ctx.ellipse(bx - 4.8, by - 1.4, 3.8, 2.5, side * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 4.8, by - 1.4, 3.8, 2.5, -side * 0.14, 0, Math.PI * 2); ctx.fill();
    /* 孔底那点干枯的黄 */
    ctx.fillStyle = 'rgba(186,152,62,0.55)';
    ctx.beginPath(); ctx.arc(bx - 4.6, by - 1.2, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 4.6, by - 1.2, 1.2, 0, Math.PI * 2); ctx.fill();
    /* 嘴也是孔 */
    ctx.fillStyle = P[1];
    ctx.beginPath(); ctx.ellipse(bx, by + 6.6, 5.2, 1.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(20,6,4,0.75)';
    ctx.beginPath(); ctx.ellipse(bx, by + 6.6, 4.2, 1.1, 0, 0, Math.PI * 2); ctx.fill();
    /* 影子边缘的一点毛边 */
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(bx, by - 1.5, R * 0.96, R * 0.86, side * 0.08, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    /* 冻住的裂纹里，最后一点暗红 */
    ctx.strokeStyle = 'rgba(150,50,20,' + (0.18 + (flash ? 0.28 : 0)) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bx - side * 7, by + 9);
    ctx.lineTo(bx - side * 2, by + 4);
    ctx.lineTo(bx + side * 2, by + 8.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWall(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const lost = p.maxHp - p.hp;
  const stacks = Math.min(3, Math.floor(lost / WALL.drStep));
  const shrink = stacks * 1.8;
  const flash = p.flash > 0;
  const N = ART.nut;
  const base = [N[0], '#a17b46', '#8d6939', '#79592e'][stacks];
  const dark = [N[1], '#6d5029', '#5c4222', '#4a341b'][stacks];
  const t = (G ? G.time : 0) * 0.9 + p.bob;

  artShadow(cx, p.y + CELL_H - 10, 30, 8);

  ctx.save();
  ctx.translate(cx, cy + 4);

  /* 果壳 */
  artE(0, 0, 28 - shrink, 32 - shrink, 0, flash ? '#e0c48c' : base, ART.ink, 3);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, 27 - shrink, 31 - shrink, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-11, 7, 24 - shrink, 28 - shrink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,210,0.22)';
  ctx.beginPath(); ctx.ellipse(10, -14, 13, 9, -0.5, 0, Math.PI * 2); ctx.fill();
  /* 壳上的纹理点与坑洼 */
  for (let i = 0; i < 14; i++) {
    const a = artNoise(p.bob, i) * Math.PI * 2;
    const r = 6 + artNoise(p.bob, i + 30) * 20;
    ctx.fillStyle = 'rgba(70,48,20,0.22)';
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * r, Math.sin(a) * r * 1.1, 1.7, 1.3, a, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < 3; i++) {
    const a = 0.6 + i * 2.1;
    const px = Math.cos(a) * 16, py = Math.sin(a) * 19;
    ctx.fillStyle = 'rgba(60,40,16,0.3)';
    ctx.beginPath(); ctx.ellipse(px, py, 4.6, 3.2, a, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,205,0.16)';
    ctx.beginPath(); ctx.ellipse(px - 1, py - 1.4, 3.2, 1.6, a, 0, Math.PI * 2); ctx.fill();
  }
  /* 底部的内阴影 */
  ctx.fillStyle = 'rgba(50,32,12,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 26, 24, 14, 0, 0, Math.PI * 2); ctx.fill();
  /* 竖向果缝（带阴影） */
  ctx.strokeStyle = 'rgba(50,32,12,0.55)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(0, -33); ctx.quadraticCurveTo(3.5, 0, 0, 33); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.18)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(2.2, -32); ctx.quadraticCurveTo(5.6, 0, 2.2, 32); ctx.stroke();
  ctx.restore();

  /* 左上的一圈受光边 */
  ctx.strokeStyle = 'rgba(255,246,215,0.3)'; ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.ellipse(0, 0, 25 - shrink, 29 - shrink, 0, Math.PI * 1.05, Math.PI * 1.62);
  ctx.stroke();

  /* 死寂的脸 */
  artE(-8.5, -6, 5.8, 6.8, 0.1, '#141008', null);
  artE(8.5, -6, 5.8, 6.8, -0.1, '#141008', null);
  ctx.fillStyle = 'rgba(205,180,125,0.3)';
  ctx.beginPath(); ctx.arc(-8.5, -3.2, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8.5, -3.2, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 11.5); ctx.quadraticCurveTo(0, 10, 6, 11.5); ctx.stroke();

  /* 越破越硬：裂缝下露出板结的硬芯 */
  for (let s = 0; s < stacks; s++) {
    const a0 = artNoise(p.bob, s) * Math.PI * 2;
    ctx.save();
    ctx.rotate(a0);
    ctx.beginPath();
    ctx.moveTo(-17 - s * 2, -15);
    ctx.lineTo(-12 - s * 3, -4 + s * 3);
    ctx.lineTo(-20 - s * 3, 2);
    ctx.lineTo(-13 - s * 3, 9);
    ctx.lineTo(-20 - s * 3, 16);
    ctx.lineTo(-8, 15 - s * 2);
    ctx.lineTo(-6, -17 + s * 4);
    ctx.closePath();
    artShape(ART.nutCore, ART.ink, 1.8);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.ellipse(-13 - s * 3, -6, 2.8, 8, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (stacks > 0) {
    ctx.strokeStyle = 'rgba(240,230,190,' + (0.10 + stacks * 0.09) + ')';
    ctx.lineWidth = 3 + stacks * 0.6;
    ctx.beginPath(); ctx.ellipse(0, 0, 29 - shrink, 33 - shrink, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (stacks >= 2) {
    ctx.strokeStyle = 'rgba(255,240,200,' + (0.05 + Math.sin(t * 2) * 0.04) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 24, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

/* 埋住土豆下半截的湿土（画在薯身之后，所以它长在土里） */
function artPotatoMound(p, dx, dy) {
  const D = ART.dirt;
  const x = p.x + CELL_W/2 + (dx || 0), y = p.y + CELL_H/2 + 4 + (dy || 0);
  artE(x, y + 21, 26, 11.5, 0, D[0], ART.ink, 2);
  for (let i = 0; i < 9; i++) {
    const a = artNoise(p.bob, i) * Math.PI * 2;
    artE(x + Math.cos(a) * (11 + artNoise(p.bob, i + 7) * 13), y + 21 + Math.sin(a) * 6,
      3.4, 2.6, a, i % 2 ? D[0] : D[1], ART.ink, 1.2);
  }
  /* 压上薯身的那圈湿土 */
  artE(x, y + 15, 21, 5.5, 0, D[1], null);
  artE(x - 6, y + 14, 9, 3, 0.2, D[0], null);
  artE(x + 8, y + 15.5, 7, 2.6, -0.2, D[0], null);
}

function drawPotato(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const armed = p.timer <= 0;
  const t = (G ? G.time : 0) * 2 + p.bob;
  const shake = armed ? Math.sin(t) * 1.4 : Math.sin(t * 0.3) * 0.3;
  const flash = p.flash > 0;
  const S = ART.spud, D = ART.dirt;
  /* "正在被遗忘"：五官从右往左一点点化掉 */
  const fade = armed ? Math.min(1, 0.35 + (1 - p.hp / p.maxHp) * 0.4 + Math.sin(t * 0.7) * 0.18) : 0.2;

  artShadow(cx, p.y + CELL_H - 9, 27, 7);

  ctx.save();
  ctx.translate(cx + shake, cy + 4);

  if (!armed) {
    const dig = 10 + Math.min(14, p.timer / POTATO.arm * 14);
    ctx.save();
    ctx.beginPath(); ctx.rect(-30, -42, 60, 48 + dig * 0.2); ctx.clip();
    artE(0, dig - 6, 23, 17, 0, S[0], ART.ink, 2.2);
    ctx.fillStyle = S[1];
    ctx.beginPath(); ctx.ellipse(-4, dig - 2, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
    /* 土里只露出还没忘掉的那半张脸 */
    artE(-7, dig - 12, 2.4, 2.8, 0, '#141008', null);
    ctx.fillStyle = 'rgba(90,70,40,0.6)';
    ctx.beginPath(); ctx.ellipse(5, dig - 12, 2.6, 2.2, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    artPotatoMound(p, shake, 0);
    ctx.strokeStyle = 'rgba(220,200,130,0.55)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 6, 27, -Math.PI / 2, -Math.PI / 2 + (1 - p.timer / POTATO.arm) * Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    return;
  }

  /* 已出土：坑洼的土豆 + 引信 */
  ctx.beginPath();
  ctx.moveTo(-24, 2);
  ctx.quadraticCurveTo(-26, -14, -8, -19);
  ctx.quadraticCurveTo(10, -23, 21, -11);
  ctx.quadraticCurveTo(27, -2, 22, 11);
  ctx.quadraticCurveTo(13, 20, -4, 19);
  ctx.quadraticCurveTo(-19, 17, -24, 2);
  ctx.closePath();
  artShape(flash ? '#e6cd96' : S[0], ART.ink, 2.6);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = S[1];
  ctx.beginPath(); ctx.ellipse(-6, 6, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,246,215,0.2)';
  ctx.beginPath(); ctx.ellipse(7, -9, 9, 5.5, -0.5, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 6; i++) {
    const a = i * 1.15 + 0.4;
    ctx.fillStyle = 'rgba(80,60,25,0.6)';
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * 15, Math.sin(a) * 12, 2.4, 1.8, a, 0, Math.PI * 2);
    ctx.fill();
  }
  /* 右半边正在被擦掉：一层浮起来的碎屑 */
  for (let i = 0; i < 22; i++) {
    const a = artNoise(p.bob, i) * Math.PI * 2;
    const r = 4 + artNoise(p.bob, i + 40) * 20;
    const px = Math.abs(Math.cos(a)) * r * 0.9, py = Math.sin(a) * r * 0.85;
    const al = (0.1 + artNoise(p.bob, i + 60) * 0.4) * fade;
    ctx.fillStyle = 'rgba(70,54,26,' + al + ')';
    ctx.beginPath();
    ctx.ellipse(px, py - artNoise(p.bob, i + 80) * 4, 1 + artNoise(p.bob, i + 90) * 1.8, 1.4, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  /* 土压上来：薯身下半截埋进土里，不再悬空 */
  artPotatoMound(p, shake, 0);
  /* 引信 */
  ctx.fillStyle = ART.metal[1];
  ctx.fillRect(-3, -28, 6, 12);
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 1.6;
  ctx.strokeRect(-3, -28, 6, 12);
  ctx.fillStyle = ART.metal[2];
  ctx.fillRect(-3, -27, 2, 10);
  const blink = 0.45 + Math.sin(t * 2) * 0.25;
  ctx.fillStyle = 'rgba(255,70,50,' + (0.16 + blink * 0.28) + ')';
  ctx.beginPath(); ctx.arc(0, -34, 13, 0, Math.PI * 2); ctx.fill();
  artE(0, -34, 7.4, 7.4, 0, '#c8321f', ART.ink, 2);
  artE(-2.4, -36.4, 2.6, 2.2, -0.5, '#f08a70', null);

  /* 正在被遗忘的脸：左眼还认得出，右眼已经散成碎屑 */
  artE(-7, -3, 4.8, 5.2, 0.12, '#efe8cf', ART.ink, 1.4);
  ctx.fillStyle = '#141008';
  ctx.beginPath(); ctx.arc(-7 + Math.sin(t * 1.1) * 1.4, -3.2, 1.5, 0, Math.PI * 2); ctx.fill();
  /* 右眼：只剩一圈没散完的边 */
  ctx.strokeStyle = 'rgba(40,30,14,' + (0.5 - fade * 0.3) + ')'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.ellipse(7, -2.6, 4.2, 4.6, -0.12, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(30,22,10,' + (0.5 - fade * 0.35) + ')';
  ctx.beginPath(); ctx.ellipse(7.4, -2.4, 3.2, 3.4, -0.12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(120,96,50,' + (0.15 + fade * 0.3) + ')';
  for (let i = 0; i < 7; i++) {
    const a = artNoise(p.bob, i + 120) * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(7 + Math.cos(a) * (5 + artNoise(p.bob, i + 130) * 6), -2.4 + Math.sin(a) * 5,
      1.3, 1.1, a, 0, Math.PI * 2);
    ctx.fill();
  }
  /* 嘴：一段还连着，一段已经断了 */
  ctx.strokeStyle = 'rgba(30,22,10,0.8)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 6.6); ctx.quadraticCurveTo(-2, 8.4 + Math.sin(t * 1.4) * 0.8, 1.5, 7.6); ctx.stroke();
  ctx.strokeStyle = 'rgba(30,22,10,' + (0.5 - fade * 0.4) + ')';
  ctx.beginPath(); ctx.moveTo(3, 7.4); ctx.quadraticCurveTo(5, 7.8, 6.4, 7.2); ctx.stroke();
  ctx.fillStyle = 'rgba(30,22,10,' + (0.4 - fade * 0.3) + ')';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.ellipse(3.5 + i * 2.4, 7.6 + artNoise(p.bob, i + 140) * 2, 1, 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 危险环 */
  ctx.strokeStyle = 'rgba(230,180,80,' + (0.22 + Math.sin(t * 2) * 0.14) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 6]);
  ctx.beginPath(); ctx.ellipse(0, 0, 31, 26, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawIce(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 4 + p.bob;
  /* 抽搐全部交给枪口：身体只是轻轻发抖 */
  const jit = Math.sin(t * 17) * 1.5 + Math.sin(t * 29) * 0.7;
  const shiver = Math.sin(t * 3) * 0.7;
  const flash = p.flash > 0;
  const I = ART.ice;

  /* 寒气扩散：一层软边的冷雾从枪口慢慢化开（没有硬边框，也不闪光） */
  if (p.frost > 0 && isFinite(p.col) && isFinite(p.row)) {
    const k = Math.min(1, p.frost / ICE_FROST_LIFE);
    const grow = 1 - k;                            /* 0 → 1：扩散进度 */
    const fw = CELL_W * ICE.aoeCols;
    const r0 = Math.max(0, p.row - 1), r1 = Math.min(rows - 1, p.row + 1);
    const fh = (r1 - r0 + 1) * CELL_H;
    const cx2 = p.x + CELL_W/2 + 14, cy2 = p.y + CELL_H/2;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 1.25);
    /* 七八团冷雾叠在一起往外推，边缘自然化开 */
    const blobs = [
      [0.00, 0.00, 0.60], [0.30, -0.18, 0.50], [0.60, 0.05, 0.48], [-0.08, 0.28, 0.44],
      [0.26, 0.34, 0.42], [0.70, -0.24, 0.34], [0.10, -0.30, 0.38], [-0.02, -0.06, 0.66]
    ];
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const bx = cx2 + b[0] * fw * (0.72 + grow * 0.4);
      const by = cy2 + b[1] * fh * (0.72 + grow * 0.4);
      const rr = Math.max(fw, fh) * b[2] * (0.68 + grow * 0.45);
      const bg2 = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
      bg2.addColorStop(0, 'rgba(214,238,252,0.34)');
      bg2.addColorStop(0.5, 'rgba(198,228,246,0.17)');
      bg2.addColorStop(1, 'rgba(198,228,246,0)');
      ctx.fillStyle = bg2;
      ctx.fillRect(bx - rr, by - rr, rr * 2, rr * 2);
    }
    /* 呵气结的霜点：很小、很淡，随扩散往外飘 */
    ctx.fillStyle = 'rgba(240,252,255,' + (0.3 * k) + ')';
    for (let i = 0; i < 16; i++) {
      const a = artNoise(p.bob + i, 21) * Math.PI * 2;
      const d = (10 + artNoise(p.bob + i, 22) * 48) * (0.55 + grow * 0.75);
      ctx.beginPath();
      ctx.arc(cx2 + Math.cos(a) * d, cy2 + Math.sin(a) * d * 0.68,
        0.7 + artNoise(p.bob + i, 23) * 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    /* 地面极淡的一层结霜（贴着地，没有边线） */
    const fg = ctx.createRadialGradient(cx2, cy2, 4, cx2, cy2, Math.max(fw, fh) * 0.7);
    fg.addColorStop(0, 'rgba(206,234,248,' + (0.2 * k) + ')');
    fg.addColorStop(0.7, 'rgba(206,234,248,' + (0.07 * k) + ')');
    fg.addColorStop(1, 'rgba(206,234,248,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(cx2 - fw, cy2 - fh, fw * 2, fh * 2);
    ctx.restore();
  }


  artShadow(cx, p.y + CELL_H - 12, 27, 7);

  const cold = 0.26 + Math.sin(t) * 0.1;
  const cg = ctx.createRadialGradient(cx, cy, 8, cx, cy, 50);
  cg.addColorStop(0, 'rgba(170,215,240,' + cold + ')');
  cg.addColorStop(1, 'rgba(170,215,240,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(cx - 50, cy - 50, 100, 100);

  artTwistedLeaf(cx + 2, p.y + CELL_H - 20, -20, 8, 0.28, 5, '#6a8a6c', '#3d5340');
  artTwistedLeaf(cx + 3, p.y + CELL_H - 23, 21, 7.5, -0.25, -6, '#6a8a6c', '#3d5340');
  artStem(cx, p.y + CELL_H - 17, cx + shiver, cy - 2, shiver * 0.5, 7, I[1], I[0]);

  artEyeGrowth(cx - 2, cy + 24, 2.4, 0.4, true);
  artEyeGrowth(cx + 3, cy + 32, 1.8, -0.3, true);

  ctx.save();
  ctx.translate(cx + shiver, cy - 16);
  ctx.rotate(shiver * 0.01);

  /* 背后的冰棱 */
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate(-0.42 - i * 0.34);
    ctx.beginPath();
    ctx.moveTo(-11, 1); ctx.lineTo(-31 - i * 4, -4 - i * 3); ctx.lineTo(-11, -8);
    ctx.closePath();
    artShape(i === 0 ? '#e4f4fb' : '#c2e0ee', ART.ink, 1.6);
    ctx.restore();
  }

  /* 头：失温致死的人的尸色 —— 青白 + 尸斑 */
  artE(0, 0, 21, 23, 0, flash ? '#eaf6fb' : I[0], ART.ink, 2.6);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 22, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = I[1];
  ctx.beginPath(); ctx.ellipse(6, 7, 17, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(125,107,147,0.45)';
  ctx.beginPath(); ctx.ellipse(-10, 5, 8, 5.5, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, 11, 6, 4, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(-8, -10, 9, 6.5, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.1;
  for (let i = 0; i < 8; i++) {
    const a = artNoise(p.bob, i) * Math.PI * 2;
    const r = 12 + artNoise(p.bob, i + 5) * 8;
    const px = Math.cos(a) * r, py = Math.sin(a) * r * 0.95;
    ctx.beginPath();
    ctx.moveTo(px - 2.4, py); ctx.lineTo(px + 2.4, py);
    ctx.moveTo(px, py - 2.4); ctx.lineTo(px, py + 2.4);
    ctx.stroke();
  }
  ctx.restore();

  /* 抽搐的枪口：整根管子在抖，冰柱跟着甩 */
  ctx.save();
  ctx.translate(jit * 0.9, -jit * 0.5);
  ctx.rotate(jit * 0.035);
  artMuzzle(13, -4, -0.06, 14, 9.5, I[0], '#e4f4fb', '#20404f');
  ctx.fillStyle = '#e8f6fc';
  ctx.beginPath(); ctx.moveTo(21, 6); ctx.lineTo(22 + jit * 0.5, 13); ctx.lineTo(23.4, 6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(25, 4.5); ctx.lineTo(25.8 + jit * 0.4, 10); ctx.lineTo(27, 4.5); ctx.closePath(); ctx.fill();
  /* 管口崩开的一圈冻裂 */
  ctx.strokeStyle = 'rgba(90,130,160,0.6)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(17, -6); ctx.lineTo(21, -2.4); ctx.lineTo(18, 1); ctx.stroke();
  ctx.restore();

  /* 黑掉的眼睛：一只冻裂，一只被寒气封住 */
  ctx.beginPath();
  ctx.moveTo(-13, -5);
  ctx.quadraticCurveTo(-12, -11.5, -4, -11);
  ctx.quadraticCurveTo(0, -9, -2.5, -4);
  ctx.quadraticCurveTo(-6, -0.5, -11, -0.5);
  ctx.quadraticCurveTo(-14, -1.5, -13, -5);
  ctx.closePath();
  artShape('#0d1218', null);
  ctx.strokeStyle = 'rgba(120,160,190,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(200,235,250,0.25)';
  ctx.beginPath(); ctx.arc(-8, -7.5, 1.4, 0, Math.PI * 2); ctx.fill();
  artEyeDrip(-8, -0.6, 3.2, 16, 0.05);
  ctx.beginPath();
  ctx.ellipse(2.5, -12, 4.6, 3, -0.5, 0, Math.PI * 2);
  artShape('#0d1218', null);
  /* 结在眼上的霜 */
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-13, -8); ctx.lineTo(-4, -6.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, -13); ctx.lineTo(6, -11); ctx.stroke();

  /* 身上长出的黑色眼状增生 */
  artEyeGrowth(-15, 7, 3.2, 0.35, true);
  artEyeGrowth(6, 13, 2.6, -0.3, true);
  artEyeGrowth(12, 6, 2, 0.7, true);
  artEyeGrowth(-4, -19, 2.2, 0.5, true);

  /* 呼吸结成的白雾（没有嘴） */
  const puff = 0.24 + Math.sin(t * 2) * 0.12;
  ctx.fillStyle = 'rgba(230,245,252,' + puff + ')';
  ctx.beginPath(); ctx.ellipse(9 + jit * 0.4, 10, 7 + Math.sin(t * 2) * 2, 4.2, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15 + jit * 0.5, 13, 4.4, 3, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  artMuzzleFlash(p);
}

function drawChomper(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 2 + p.bob;
  const breathe = Math.sin(t) * 2.2;
  const flash = p.flash > 0;
  const C = ART.chomp;

  artShadow(cx, p.y + CELL_H - 12, 28, 7);
  artTwistedLeaf(cx - 2, p.y + CELL_H - 18, -22, 10, 0.3, 6, ART.stem[0], ART.stem[1]);
  artTwistedLeaf(cx + 4, p.y + CELL_H - 18, 22, 10, -0.28, -6, ART.stem[0], ART.stem[1]);
  artStem(cx, p.y + CELL_H - 16, cx, cy - 2, 0, 11, '#4a7a30', '#6fa348');

  ctx.save();
  ctx.translate(cx, cy - 10);
  ctx.rotate(Math.sin(t * 0.5) * 0.05);

  /* 脑后的尖叶（更长更乱） */
  for (let i = 0; i < 7; i++) {
    const a = -2.6 + i * 0.4;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(-2, -16);
    ctx.lineTo(2 + (i % 3) * 3, -34 - (i % 3) * 9);
    ctx.lineTo(13, -15);
    ctx.closePath();
    artShape(i % 2 ? '#375c20' : '#4c7c30', ART.ink, 1.8);
    ctx.restore();
  }

  /* 头顶的紫球 */
  artE(0, -4, 27, 25, 0, flash ? C[2] : C[0], ART.ink, 2.8);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -4, 26, 24, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = C[1];
  ctx.beginPath(); ctx.ellipse(-8, 6, 22, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,255,0.14)';
  ctx.beginPath(); ctx.ellipse(-10, -14, 11, 7, -0.4, 0, Math.PI * 2); ctx.fill();
  /* 暴起的青筋 */
  ctx.strokeStyle = 'rgba(60,20,70,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-20, -14); ctx.quadraticCurveTo(-14, -6, -18, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20, -14); ctx.quadraticCurveTo(-16, -12, -13, -8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -16); ctx.quadraticCurveTo(12, -8, 16, 0); ctx.stroke();
  ctx.restore();

  /* 撕开的巨口：裂口扯到球体外面，下颚整个塌下去 */
  const mawBot = 38 + breathe;
  ctx.beginPath();
  ctx.moveTo(-34, 0);
  ctx.quadraticCurveTo(0, mawBot, 34, -1);
  ctx.quadraticCurveTo(15, 10, 0, 10);
  ctx.quadraticCurveTo(-15, 10, -34, 0);
  ctx.closePath();
  artShape(ART.maw, ART.ink, 2.4);
  /* 口腔内壁 + 咽部 */
  ctx.beginPath();
  ctx.moveTo(-27, 3);
  ctx.quadraticCurveTo(0, mawBot - 8, 27, 2);
  ctx.quadraticCurveTo(12, 10, 0, 10.5);
  ctx.quadraticCurveTo(-12, 10, -27, 3);
  ctx.closePath();
  artShape(ART.mawIn, null);
  ctx.fillStyle = 'rgba(40,8,34,0.6)';
  ctx.beginPath(); ctx.ellipse(0, 12, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  /* 暴露的牙龈 */
  ctx.beginPath();
  ctx.moveTo(-30, 1);
  ctx.quadraticCurveTo(-14, 7, 0, 6.5);
  ctx.quadraticCurveTo(14, 7, 30, 0);
  ctx.quadraticCurveTo(14, 3.5, 0, 3.5);
  ctx.quadraticCurveTo(-14, 3.5, -30, 1);
  ctx.closePath();
  artShape(ART.gum, null);

  /* 上下两排獠牙：长短不齐、带两根长尖牙 */
  ctx.strokeStyle = 'rgba(110,100,72,0.6)'; ctx.lineWidth = 0.8;
  for (let i = 0; i < 9; i++) {
    if (i === 3 || i === 7) continue;
    const tx = -30 + i * 7;
    const top = 2 + Math.abs(tx) * 0.08;
    const fang = (i === 1 || i === 5) ? 6 : 0;
    const th = 6 + artNoise(p.bob, i) * 6 + fang;
    ctx.fillStyle = ART.tooth;
    ctx.beginPath();
    ctx.moveTo(tx, top); ctx.lineTo(tx + 2.8, top + th); ctx.lineTo(tx + 5.6, top);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  for (let i = 0; i < 9; i++) {
    if (i === 2 || i === 6) continue;
    const tx = -28 + i * 6.8;
    const bot = mawBot - 13 - Math.abs(tx) * 0.34;
    const fang = (i === 4) ? 6 : 0;
    const th = 6 + artNoise(p.bob, i + 11) * 5 + fang;
    ctx.fillStyle = i === 4 ? '#e6dcc0' : ART.tooth;
    ctx.beginPath();
    ctx.moveTo(tx, bot); ctx.lineTo(tx + 2.6, bot - th); ctx.lineTo(tx + 5.2, bot);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  /* 撕烂的嘴唇：挂着的肉片 */
  ctx.fillStyle = C[1];
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    const fx = -30 + i * 20 + artNoise(p.bob, i + 200) * 6;
    const fl = 8 + artNoise(p.bob, i + 210) * 10;
    ctx.beginPath();
    ctx.moveTo(fx, -2);
    ctx.quadraticCurveTo(fx + 4, fl * 0.7, fx + 7, -1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  /* 塌下来的下唇 */
  ctx.beginPath();
  ctx.moveTo(-34, 3);
  ctx.quadraticCurveTo(0, mawBot + 10, 34, 2);
  ctx.quadraticCurveTo(0, mawBot + 2, -34, 3);
  ctx.closePath();
  artShape(flash ? C[2] : C[1], ART.ink, 2.6);

  /* 吞不下去的口水：拉丝 + 滴落 */
  ctx.strokeStyle = 'rgba(226,206,236,0.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const dx = -18 + i * 9;
    const dl = 7 + artNoise(p.bob, i + 30) * 10 + Math.sin(t * 1.6 + i) * 2.4;
    ctx.beginPath(); ctx.moveTo(dx, 8); ctx.lineTo(dx + 1, 8 + dl); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(226,206,236,0.28)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-10, 5); ctx.quadraticCurveTo(0, 14 + breathe * 0.4, 11, 4); ctx.stroke();
  /* 嘴角的旧渍 */
  ctx.fillStyle = 'rgba(60,16,48,0.5)';
  ctx.beginPath(); ctx.ellipse(-32, 14, 4.4, 7, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(33, 12, 3.6, 5.4, -0.3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  if (p.hp < p.maxHp * 0.7) {
    const ratio = p.hp / p.maxHp;
    ctx.strokeStyle = 'rgba(190,50,30,' + (0.5 - ratio * 0.3) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy + 6, 34, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawRepeater(p) {
  const cx = p.x + CELL_W/2, cy = p.y + CELL_H/2;
  const t = (G ? G.time : 0) * 1.4 + p.bob;
  const sway = Math.sin(t) * 2;
  const flash = p.flash > 0;
  const P = ART.pea;

  artShadow(cx, p.y + CELL_H - 11, 25, 7);
  /* 枝叶比豌豆射手繁茂得多：更粗、更密，层层叠叠把茎都盖住 */
  artTwistedLeaf(cx - 5, p.y + CELL_H - 25, -23, 11, 0.46, 8, P[1], P[3]);
  artTwistedLeaf(cx + 6, p.y + CELL_H - 22, 24, 10.5, -0.28, -9, P[0], P[3]);
  artTwistedLeaf(cx - 3, p.y + CELL_H - 31, -20, 9.5, 0.72, 7, P[0], P[3]);
  artTwistedLeaf(cx + 3, p.y + CELL_H - 33, 19, 9, -0.72, -7, P[1], P[3]);
  artTwistedLeaf(cx + 2, p.y + CELL_H - 40, 17, 8, -1.15, 8, P[1], P[3], 1.6);
  artTwistedLeaf(cx - 2, p.y + CELL_H - 44, -15, 7.5, 1.05, -6, P[1], P[3], 1.5);
  artTwistedLeaf(cx + 1, p.y + CELL_H - 50, 14, 6.5, -1.4, 6, P[0], P[3], 1.5);
  artStem(cx, p.y + CELL_H - 17, cx + sway, cy - 2, sway * 0.5, 8, P[1], P[0]);
  artEyeGrowth(cx - 2 + sway * 0.4, cy + 22, 2.6, 0.3);
  artEyeGrowth(cx + 4, cy + 31, 1.9, -0.4);

  ctx.save();
  ctx.translate(cx + sway, cy - 16);
  ctx.rotate(sway * 0.012);

  /* 脑后一丛枝叶（又粗又密，明显多于豌豆射手） */
  artTwistedLeaf(-13, -8, -17, 9, 0.4, 7, P[0], P[3], 1.8);
  artTwistedLeaf(-14, -15, -15, 8.5, 0.72, 6, P[1], P[3], 1.7);
  artTwistedLeaf(-13, -22, -13, 7.5, 1.05, 5, P[0], P[3], 1.6);
  artTwistedLeaf(-11, -28, -11, 6.5, 1.35, 4, P[1], P[3], 1.4);
  artTwistedLeaf(8, -20, 15, 8, -1.1, -6, P[0], P[3], 1.7);
  artTwistedLeaf(8, -10, 16, 8.5, -0.68, -6, P[1], P[3], 1.6);
  artTwistedLeaf(6, -1, 14, 7, -0.28, -5, P[0], P[3], 1.5);

  /* 头：先画整体，再把它裂开 */
  artE(0, 0, 22, 23, 0, flash ? P[2] : P[0], ART.ink, 2.6);
  artE(3, 4, 18, 19, 0, P[1], null);
  ctx.fillStyle = 'rgba(40,58,20,0.3)';
  ctx.beginPath(); ctx.ellipse(-8, -10, 7, 5, -0.45, 0, Math.PI * 2); ctx.fill();

  /* 单一炮口（双发是"一次吐两颗"，不是两根管子） */
  artMuzzle(14, -6, -0.05, 15, 10.5, P[1], P[0], '#16240d');

  /* 全身裂纹：贯穿的主裂 + 多条支裂 + 错位的碎片 */
  const crack = (pts, w) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = '#1c2c10'; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = Math.max(0.8, w * 0.4);
    ctx.stroke();
  };
  crack([[-2, -23], [5, -14], [0, -6], [7, 2], [2, 11], [9, 19], [14, 11], [8, 3], [13, -5], [6, -13], [10, -21]], 2.4);
  crack([[-16, -10], [-11, -6], [-15, 0], [-10, 5]], 1.8);
  crack([[12, -22], [15, -14], [11, -9]], 1.6);
  crack([[-6, 14], [-1, 18], [-7, 22]], 1.6);
  crack([[17, 6], [21, 10]], 1.3);
  /* 错位的碎片 */
  ctx.save();
  ctx.translate(4, -2); ctx.rotate(0.16);
  ctx.beginPath();
  ctx.moveTo(-6, -7); ctx.lineTo(4, -9); ctx.lineTo(7, 2); ctx.lineTo(-4, 5);
  ctx.closePath();
  artShape(P[0], ART.ink, 1.6);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath(); ctx.ellipse(0, -4, 4, 1.6, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(9, 13); ctx.rotate(-0.2);
  ctx.beginPath();
  ctx.moveTo(-5, -3); ctx.lineTo(4, -5); ctx.lineTo(3, 3); ctx.lineTo(-3, 4);
  ctx.closePath();
  artShape(P[1], ART.ink, 1.4);
  ctx.restore();

  /* 黑掉的眼睛 */
  ctx.beginPath();
  ctx.moveTo(-14, -4);
  ctx.quadraticCurveTo(-13, -11, -5, -10.5);
  ctx.quadraticCurveTo(-1, -8.5, -3, -3.5);
  ctx.quadraticCurveTo(-7, 0, -12, 0);
  ctx.quadraticCurveTo(-15, -1, -14, -4);
  ctx.closePath();
  artShape(ART.dead, null);
  ctx.strokeStyle = 'rgba(30,36,18,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(150,175,95,0.2)';
  ctx.beginPath(); ctx.arc(-9, -6.6, 1.4, 0, Math.PI * 2); ctx.fill();
  artEyeDrip(-9, 0.6, 3.4, 14, 0.05);
  ctx.beginPath();
  ctx.ellipse(2, -14, 4.6, 3, -0.5, 0, Math.PI * 2);
  artShape(ART.dead, null);

  artEyeGrowth(-15, 8, 3.4, 0.35);
  artEyeGrowth(6, 14, 2.6, -0.25);
  artEyeGrowth(-4, -20, 2.2, 0.6);
  artEyeGrowth(16, 8, 2, -0.5);
  ctx.restore();
  artMuzzleFlash(p);
}

function drawZombies() {
  const sorted = [...G.zombies].sort((a, b) => a.row - b.row);
  for (const z of sorted) drawZombieByKey(z.type, z);
}

/* ============================================================
   静物僵尸画稿（重绘）

   造型参考《植物大战僵尸》原作剪影，按设定稿的「静物化」描述改造：
   眼睛丧失、身体僵直、双臂扭到背后像羽翼、路障/铁桶与身体融合、
   桶里伸出四肢、撑杆跳融进体内。绘制期不消耗 Math.random。
   注：僵尸一律朝左行进，所以"背后"= +x 方向。
   ============================================================ */

  skin:   '#9aa87c', skinD: '#6e7c55', skinL: '#bdc89e',
  jacket: '#6d5537', jacketD: '#4a3823',
  shirt:  '#cdc6ac', tie: '#a8332c',
  pants:  '#414c6b', pantsD: '#2b3348',
  shoe:   '#4b3625',
  socket: '#1d1a13', hair: '#2e2a1e',
  cone:   '#d2701c', coneL: '#f0a34a', coneD: '#8f4a12',
  metal:  ['#b9bdc0', '#7e8489', '#e6eaec'], metalD: '#4e5459',
  run:    '#c4483a', runW: '#e6e0d2'
};
const ZPC = {  /* 临界：褪色、发灰 */
  skin:   '#8f9284', skinD: '#666a5c', skinL: '#a9ac9d',
  jacket: '#5b5245', jacketD: '#3e382e',
  shirt:  '#b3b0a2', tie: '#8a3a34',
  pants:  '#4a4a52', pantsD: '#33333a',
  shoe:   '#443a30',
  socket: '#151310', hair: '#2a2822',
  cone:   '#8a5a24', coneL: '#a97c40', coneD: '#5e3a14',
  metal:  ['#8e9294', '#63686c', '#a9adaf'], metalD: '#42474b',
  run:    '#8a4a42', runW: '#b8b4a8'
};

function zPal(z) { return z.critical ? ZPC : ZP; }

/* 腿 + 鞋 */
function zLegs(t, P, swing) {
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    const sw = Math.sin(t) * swing * s;
    ctx.strokeStyle = ART.ink; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(s * 7, 18); ctx.lineTo(s * 9 + sw, 40); ctx.stroke();
    ctx.strokeStyle = P.pants; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(s * 7, 18); ctx.lineTo(s * 9 + sw, 40); ctx.stroke();
    ctx.fillStyle = P.pantsD;
    ctx.beginPath(); ctx.ellipse(s * 9 + sw, 33, 4.6, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(s * 9 + sw * 1.2, 44);
    ctx.rotate(s * 0.05);
    artE(0, 0, 11, 6, 0, P.shoe, ART.ink, 2);
    artE(-3.6, -1.6, 4, 2.2, 0, '#6a5136', null);
    ctx.restore();
  }
}

/* 上身：夹克 + 衬衫 + 领带 */
function zTorso(P, lean) {
  ctx.save();
  ctx.rotate(lean * 0.06);
  ctx.beginPath();
  ctx.moveTo(-16, -30);
  ctx.lineTo(16, -32);
  ctx.quadraticCurveTo(19, -6, 15, 20);
  ctx.lineTo(-15, 19);
  ctx.quadraticCurveTo(-19, -6, -16, -30);
  ctx.closePath();
  artShape(P.jacket, ART.ink, 2.4);
  ctx.fillStyle = P.jacketD;
  ctx.beginPath(); ctx.ellipse(6, 5, 5, 7, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9, 11, 3.4, 4.6, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-8, -31); ctx.lineTo(8, -31); ctx.lineTo(0, -8);
  ctx.closePath();
  artShape(P.shirt, ART.ink, 1.6);
  ctx.beginPath(); ctx.moveTo(-9, -31); ctx.lineTo(-2, -31); ctx.lineTo(-8, -19); ctx.closePath();
  artShape(P.jacketD, ART.ink, 1.2);
  ctx.beginPath(); ctx.moveTo(9, -31); ctx.lineTo(2, -31); ctx.lineTo(8, -19); ctx.closePath();
  artShape(P.jacketD, ART.ink, 1.2);
  ctx.beginPath();
  ctx.moveTo(0, -27); ctx.lineTo(-3.4, -21); ctx.lineTo(-2, -4); ctx.lineTo(2, -4); ctx.lineTo(3.4, -21);
  ctx.closePath();
  artShape(P.tie, ART.ink, 1.2);
  ctx.restore();
}

/* 手臂：肩 (x0,y0) → 肘 (x1,y1) → 手 (x2,y2) */
function zArm(x0, y0, x1, y1, x2, y2, P, w) {
  w = w || 6.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = ART.ink; ctx.lineWidth = w + 2.6;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = P.jacket; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = ART.ink; ctx.lineWidth = w + 1.4;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = P.skin; ctx.lineWidth = w - 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  artE(x2, y2, 4.6, 4.2, 0, P.skin, ART.ink, 1.6);
  ctx.fillStyle = P.skinD;
  ctx.beginPath(); ctx.ellipse(x2 + 1, y2 + 1.4, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
}

/* 头：眼睛丧失 → 两个空眼窝 */
function zHead(x, y, P, o) {
  o = o || {};
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -40); ctx.stroke();
  ctx.strokeStyle = P.skinD; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -40); ctx.stroke();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.rot || 0);
  artE(0, 0, 15, 17, 0, P.skin, ART.ink, 2.4);
  artE(3, 3, 12, 13, 0, P.skinD, null);
  artE(-5, -7, 6, 4.4, -0.4, P.skinL, null);
  /* 稀稀拉拉的几根头发 */
  ctx.strokeStyle = P.hair; ctx.lineWidth = 1.3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-6 + i * 5, -14);
    ctx.quadraticCurveTo(-8 + i * 5, -19 - i, -4 + i * 4, -21 - i);
    ctx.stroke();
  }
  artE(-15, 1, 3.4, 4.4, 0, P.skinD, ART.ink, 1.3);
  /* 空眼窝 */
  artE(-5.4, -2.5, 4.8, 5.2, 0.1, P.socket, null);
  artE(5.4, -2.5, 4.8, 5.2, -0.1, P.socket, null);
  ctx.fillStyle = 'rgba(210,200,150,0.22)';
  ctx.beginPath(); ctx.arc(-5.4, -0.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.4, -0.4, 1.1, 0, Math.PI * 2); ctx.fill();
  /* 咧开的嘴 */
  ctx.beginPath();
  ctx.ellipse(0, 8, 6.6, o.mouthOpen ? 5.6 : 3.6, 0, 0, Math.PI * 2);
  artShape(P.socket, null);
  ctx.fillStyle = '#d8d2b8';
  ctx.fillRect(-4.8, 5.2, 2.2, 3);
  ctx.fillRect(2.6, 5.2, 2.2, 3);
  ctx.restore();
}

/* 临界：从眼眶与嘴角往下淌 */
function zDrips(z) {
  ctx.fillStyle = 'rgba(10,6,2,0.85)';
  const d = 5 + Math.sin((G ? G.time : 0) * 4 + z.seed) * 3;
  ctx.beginPath(); ctx.ellipse(-5, -50 + d * 0.5, 2.6, d, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -49 + d * 0.4, 2.2, d * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -38 + d * 0.7, 2.4, d * 0.9, 0, 0, Math.PI * 2); ctx.fill();
}

/* 扭到背后、形似羽翼的手臂（sx 为肩点） */
function zWing(sx, sy, len, ang, P, flap, back) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ang + flap);
  ctx.lineCap = 'round';
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 7.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -7, len, -3); ctx.stroke();
  ctx.strokeStyle = back ? P.skinD : P.skin; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -7, len, -3); ctx.stroke();
  for (let i = 0; i < 2; i++) {
    const t0 = 0.3 + i * 0.34;
    ctx.beginPath();
    ctx.moveTo(len * t0, -3 - i * 1.4);
    ctx.quadraticCurveTo(len * (t0 + 0.28), 3 + i * 3, len * (t0 + 0.56), -7 + i * 5);
    ctx.quadraticCurveTo(len * (t0 + 0.24), -5 + i * 1.2, len * t0, -3 - i * 1.4);
    ctx.closePath();
    artShape(back ? P.skinD : P.skin, ART.ink, 1.6);
    ctx.strokeStyle = 'rgba(240,235,210,0.22)'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(len * t0, -3 - i * 1.4);
    ctx.quadraticCurveTo(len * (t0 + 0.3), 0 + i * 3, len * (t0 + 0.54), -7 + i * 5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawZombieAura(z) {
  const cx = z.x, cy = gridY + z.row * CELL_H + CELL_H / 2;
  if (z.frozen > 0) {
    ctx.fillStyle = 'rgba(140, 200, 230, 0.32)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 34, 50, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(200, 230, 250, 0.7)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05 + (G ? G.time : 0) * 0.5;
      const px = cx + Math.cos(a) * 28;
      const py = cy + Math.sin(a) * 38;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a) * 6, py + Math.sin(a) * 6);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(220,240,255,0.5)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 4; i++) {
      const a = i * 1.6 - (G ? G.time : 0) * 0.3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 44);
      ctx.lineTo(cx + Math.cos(a + 0.4) * 12, cy + Math.sin(a + 0.4) * 18);
      ctx.stroke();
    }
  } else if (z.slowed > 0) {
    ctx.fillStyle = 'rgba(140, 180, 210, 0.16)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 28, 44, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190, 220, 240, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy + 10, 26, 34, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

/* ---- 漫游：身体僵直，眼睛丧失 ---- */
function drawWander(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 2.0 + z.seed;
  const P = zPal(z);

  artShadow(cx, cy + 47, 22, 6, 0.42);
  ctx.save();
  ctx.translate(cx, cy);
  if (z.critical) ctx.rotate(0.07);
  zLegs(t, P, 4);
  zTorso(P, 0.4);
  zArm(-14, -27, -17.5, -10 + Math.sin(t) * 1.2, -19, 6 + Math.sin(t) * 1.6, P);
  zArm(14, -28, 17.5, -11 + Math.sin(t + 1) * 1.2, 19, 5 + Math.sin(t + 1) * 1.6, P);
  zHead(0, -50, P, { rot: 0.04 + Math.sin(t * 0.5) * 0.02, mouthOpen: z.critical });
  if (z.critical) zDrips(z);
  ctx.restore();
}

/* ---- 冲锋：手臂扭到背后，形似羽翼 ---- */
function drawCharge(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 6 + z.seed;
  const P = zPal(z);

  artShadow(cx, cy + 47, 24, 6.5, 0.45);
  ctx.strokeStyle = 'rgba(200,190,150,0.16)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(22 + i * 6, -26 + i * 16);
    ctx.lineTo(46 + i * 8, -26 + i * 16);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.14 + Math.sin(t) * 0.03);
  if (z.critical) ctx.rotate(0.06);
  const flap = Math.sin(t * 1.2) * 0.14;
  /* 背后的双翼：一只向上后方张开，一只垂在后腰 */
  zWing(-9, -29, 40, 0.32 + flap, P, 0, true);
  zWing(2, -34, 34, -0.52 - flap, P, 0, false);
  zLegs(t, P, 13);
  zTorso(P, -1.1);
  zHead(2, -52, P, { rot: -0.06, mouthOpen: true });
  if (z.critical) zDrips(z);
  ctx.restore();
}

/* ---- 路障头：路障与头部融为一体 ---- */
function drawConehead(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 2.0 + z.seed;
  const P = zPal(z);

  artShadow(cx, cy + 47, 22, 6, 0.42);
  ctx.save();
  ctx.translate(cx, cy);
  if (z.critical) ctx.rotate(0.08);
  zLegs(t, P, 4);
  zTorso(P, 0.4);
  zArm(-14, -27, -17.5, -10 + Math.sin(t) * 1.2, -19, 6 + Math.sin(t) * 1.6, P);
  zArm(14, -28, 17.5, -11 + Math.sin(t + 1) * 1.2, 19, 5 + Math.sin(t + 1) * 1.6, P);
  zHead(0, -50, P, { rot: 0.05, mouthOpen: z.critical });

  /* 长进头骨里的路障 */
  ctx.save();
  ctx.translate(0, -49);
  ctx.rotate(0.07);
  ctx.beginPath();
  ctx.moveTo(-16, 2);
  ctx.lineTo(-10, -36);
  ctx.lineTo(10, -36);
  ctx.lineTo(16, 2);
  ctx.closePath();
  artShape(P.cone, ART.ink, 2.4);
  ctx.beginPath(); ctx.moveTo(-13.6, -17); ctx.lineTo(13.6, -17); ctx.lineTo(14.6, -10); ctx.lineTo(-14.6, -10); ctx.closePath();
  artShape(P.coneL, ART.ink, 1.4);
  ctx.beginPath(); ctx.moveTo(-12, -30); ctx.lineTo(12, -30); ctx.lineTo(12.8, -25); ctx.lineTo(-12.8, -25); ctx.closePath();
  artShape(P.coneL, ART.ink, 1.2);
  ctx.fillStyle = 'rgba(60,30,6,0.35)';
  ctx.beginPath(); ctx.ellipse(-9, -20, 4, 12, 0.06, 0, Math.PI * 2); ctx.fill();
  /* 底缘与皮肉长在一起：一圈翻起的肉芽盖住桶底 */
  ctx.beginPath();
  ctx.moveTo(-17, 2);
  for (let i = 0; i < 6; i++) {
    const x0 = -17 + i * 5.6;
    ctx.quadraticCurveTo(x0 + 2.8, 7 + (i % 2) * 7, x0 + 5.6, 2);
  }
  ctx.lineTo(17, 2);
  ctx.closePath();
  artShape(P.skinD, ART.ink, 1.6);
  ctx.fillStyle = 'rgba(255,230,200,0.14)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath(); ctx.ellipse(-14 + i * 5.6, 4.4 + (i % 2) * 3, 2, 1.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(20,10,4,0.4)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-4, -9); ctx.lineTo(-7, -17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -2); ctx.lineTo(5, -11); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

/* ---- 路障雕塑：身体与路障深度融合，硬得像一整块（不是石头） ---- */
function drawConeSculpt(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 1.1 + z.seed;
  const P = zPal(z);
  /* 硬化的皮肉：还是血肉，只是板结、发干、渗进了路障的橙 */
  const hide  = z.critical ? '#7c7d68' : '#9b9a80';
  const hideD = z.critical ? '#565845' : '#71705a';
  const hideL = z.critical ? '#9a9b86' : '#b9b79a';
  const scab  = z.critical ? '#4a2a22' : '#5e2b1d';
  const SP = Object.assign({}, P, { pants: '#3a3f33', pantsD: '#282c22', shoe: '#3e3226' });

  artShadow(cx, cy + 47, 26, 7, 0.48);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t) * 0.015 + (z.critical ? 0.05 : 0));
  zLegs(t, SP, 2);

  /* 主体：肩背一路收成路障，中间没有脖子 */
  ctx.beginPath();
  ctx.moveTo(-21, 18);
  ctx.lineTo(-23, -10);
  ctx.quadraticCurveTo(-20, -30, -10, -58);
  ctx.lineTo(10, -58);
  ctx.quadraticCurveTo(20, -30, 23, -10);
  ctx.lineTo(21, 18);
  ctx.closePath();
  artShape(hide, ART.ink, 2.6);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = hideD;
  ctx.beginPath(); ctx.ellipse(-11, 2, 17, 24, 0.2, 0, Math.PI * 2); ctx.fill();
  /* 路障的橙顺着身体淌下来，边界是化开的一圈硬壳 */
  const grad = ctx.createLinearGradient(0, -58, 0, -20);
  grad.addColorStop(0, P.cone);
  grad.addColorStop(0.5, P.coneD);
  grad.addColorStop(1, 'rgba(210,112,28,0.05)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-13, -58);
  ctx.lineTo(13, -58);
  ctx.quadraticCurveTo(19, -42, 14, -32);
  ctx.quadraticCurveTo(8, -24, 12, -18);
  ctx.lineTo(-12, -18);
  ctx.quadraticCurveTo(-7, -26, -13, -34);
  ctx.quadraticCurveTo(-18, -44, -13, -58);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = P.coneL;
  ctx.fillRect(-13, -50, 26, 4);
  ctx.fillRect(-16, -39, 32, 4.5);
  /* 硬化：几块凸起的硬壳板（比皮肉略亮一点，不是石膏） */
  for (let i = 0; i < 4; i++) {
    const a = 0.5 + i * 1.6;
    const bx = Math.cos(a) * 15, by = -6 + Math.sin(a) * 16;
    ctx.beginPath();
    ctx.moveTo(bx - 8, by - 5);
    ctx.lineTo(bx + 6, by - 8);
    ctx.lineTo(bx + 9, by + 4);
    ctx.lineTo(bx - 5, by + 7);
    ctx.closePath();
    artShape(hide, 'rgba(30,26,20,0.35)', 1.2);
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.ellipse(bx + 1, by - 4, 5, 1.8, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(40,32,20,0.16)';
    ctx.beginPath(); ctx.ellipse(bx + 1, by + 4, 5.5, 2, 0.1, 0, Math.PI * 2); ctx.fill();
  }
  /* 结痂的裂口（干血色的硬疤，不是石膏缝） */
  ctx.lineCap = 'round';
  const scar = (pts, w) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = scab; ctx.lineWidth = w; ctx.stroke();
    ctx.strokeStyle = 'rgba(240,225,200,0.18)'; ctx.lineWidth = w * 0.35; ctx.stroke();
  };
  scar([[-14, 14], [-8, 2], [-15, -6], [-9, -18]], 2.4);
  scar([[12, 15], [7, 3], [14, -5]], 2);
  scar([[2, 18], [0, 8], [6, 0]], 1.8);
  scar([[-19, -22], [-13, -26]], 1.6);
  ctx.restore();

  /* 融进身体的两条手臂：成了鼓包，但指节还看得出 */
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * 19, -12);
    ctx.rotate(s * 0.34);
    artE(0, 0, 5.6, 13, 0, hide, ART.ink, 2);
    ctx.fillStyle = hideD;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(s * 3, -5 + i * 5.4, 2.6, 1.5, s * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  /* 只剩眼窝与牙 */
  artE(-6, -21, 4.4, 4.8, 0.1, P.socket, null);
  artE(6, -21, 4.4, 4.8, -0.1, P.socket, null);
  ctx.fillStyle = 'rgba(210,200,150,0.22)';
  ctx.beginPath(); ctx.arc(-6, -19.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -19.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = P.socket;
  ctx.beginPath(); ctx.ellipse(0, -9.5, 5.6, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ded8c0';
  ctx.fillRect(-4, -11.5, 2, 3);
  ctx.fillRect(2, -11.5, 2, 3);
  ctx.restore();
}

/* ---- 铁嘴钢牙：铁桶替代上颚以上所有部分，桶底带锯齿 ---- */
function drawBucket(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 2.4 + z.seed;
  const P = zPal(z);
  const hasArmor = z.armor > 0;
  const dent = hasArmor && z.armor < z.maxArmor * 0.6;
  const M = P.metal;

  artShadow(cx, cy + 47, 23, 6.2, 0.44);
  ctx.save();
  ctx.translate(cx, cy);
  if (z.critical) ctx.rotate(0.07);
  zLegs(t, P, 5);
  zTorso(P, 0.5);
  zArm(-14, -27, -17.5, -10 + Math.sin(t) * 1.2, -19, 6 + Math.sin(t) * 1.6, P);
  zArm(14, -28, 17.5, -11 + Math.sin(t + 1) * 1.2, 19, 5 + Math.sin(t + 1) * 1.6, P);

  if (hasArmor) {
    /* 只剩下颚露在外面 */
    ctx.fillStyle = P.skinD;
    ctx.beginPath(); ctx.ellipse(0, -33, 14, 9.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = P.socket;
    ctx.beginPath(); ctx.ellipse(0, -31.5, 10, 5.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8d2b8';
    ctx.fillRect(-8, -36, 2.8, 4.8);
    ctx.fillRect(-2.2, -36.5, 2.8, 5.4);
    ctx.fillRect(4, -36, 2.8, 4.8);

    /* 桶就是头：倒扣的铁桶，桶底一圈锯齿咬在下颚上 */
    ctx.save();
    ctx.translate(0, -56);
    ctx.rotate(0.06);
    ctx.beginPath();
    ctx.moveTo(-22, -20);
    ctx.lineTo(22, -20);
    ctx.lineTo(18, 14);
    ctx.lineTo(-18, 14);
    ctx.closePath();
    artShape(M[0], ART.ink, 2.6);
    ctx.save(); ctx.clip();
    ctx.fillStyle = M[1];
    ctx.beginPath(); ctx.ellipse(-10, 4, 14, 24, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-16, -20, 5, 34);
    ctx.fillRect(8, -18, 3, 30);
    /* 桶箍 */
    ctx.strokeStyle = 'rgba(70,74,78,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-21, -9); ctx.lineTo(21, -9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-19, 5); ctx.lineTo(19, 5); ctx.stroke();
    /* 血渍与锈 */
    ctx.fillStyle = 'rgba(96,22,16,0.5)';
    ctx.beginPath(); ctx.ellipse(10, -8, 3.6, 10, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3, 8, 2.6, 6, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(120,80,30,0.35)';
    ctx.beginPath(); ctx.ellipse(-13, 2, 4.4, 6.5, 0.3, 0, Math.PI * 2); ctx.fill();
    if (dent) {
      ctx.strokeStyle = 'rgba(30,30,30,0.5)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-14, -13); ctx.lineTo(-5, -2); ctx.lineTo(-12, 8); ctx.stroke();
      ctx.fillStyle = 'rgba(20,20,20,0.22)';
      ctx.beginPath(); ctx.ellipse(7, 7, 9, 6.5, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    /* 桶口边沿 */
    artE(0, -20, 20, 5.4, 0, M[2], ART.ink, 1.8);
    /* 桶底的锯齿：一排咬合的钢牙 */
    ctx.fillStyle = 'rgba(18,10,6,0.65)';
    ctx.fillRect(-18, 10, 36, 5);
    ctx.fillStyle = M[2];
    ctx.strokeStyle = ART.ink; ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      const sx = -18 + i * 4.7;
      ctx.beginPath();
      ctx.moveTo(sx, 13); ctx.lineTo(sx + 2.35, 23); ctx.lineTo(sx + 4.7, 13);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  } else {
    /* 桶被打掉后：露出脑袋，只剩一圈钢齿 */
    zHead(0, -50, P, { rot: 0.05, mouthOpen: z.critical });
    ctx.save();
    ctx.translate(0, -50);
    ctx.beginPath(); ctx.moveTo(-16, -15); ctx.lineTo(16, -15); ctx.lineTo(11, -4); ctx.lineTo(-11, -4); ctx.closePath();
    artShape(M[1], ART.ink, 1.8);
    ctx.fillStyle = M[2];
    ctx.strokeStyle = ART.ink; ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      const sx = -12 + i * 4.2;
      ctx.beginPath();
      ctx.moveTo(sx, -6); ctx.lineTo(sx + 2, 0); ctx.lineTo(sx + 4, -6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  if (z.critical) zDrips(z);
  ctx.restore();
}

/* ---- 桶里面的人：巨桶罩住整个身体，手脚从桶口里伸出来 ---- */
function drawBucketPerson(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 0.9 + z.seed;
  const P = zPal(z);
  const M = P.metal;

  artShadow(cx, cy + 50, 32, 8, 0.52);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t) * 0.02 + (z.critical ? 0.05 : 0));

  /* 桶（倒扣，比人还大）：先把桶画好 */
  ctx.beginPath();
  ctx.moveTo(-30, -46);
  ctx.lineTo(30, -46);
  ctx.lineTo(34, 16);
  ctx.lineTo(-34, 16);
  ctx.closePath();
  artShape(M[0], ART.ink, 2.8);
  ctx.save(); ctx.clip();
  ctx.fillStyle = M[1];
  ctx.beginPath(); ctx.ellipse(-14, -4, 21, 42, 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(-24, -44, 7, 60);
  ctx.fillRect(14, -40, 4, 52);
  ctx.fillStyle = 'rgba(120,72,30,0.45)';
  ctx.beginPath(); ctx.ellipse(22, -16, 7, 11, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-7, 8, 9, 5, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -34, 5, 4, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-20, -30, 4, 6, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(60,64,68,0.55)'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-31, -30); ctx.lineTo(31, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-33, -8); ctx.lineTo(33, -8); ctx.stroke();
  /* 桶身上的划痕与凹痕 */
  ctx.strokeStyle = 'rgba(70,74,78,0.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-18, -22); ctx.lineTo(-9, -12); ctx.lineTo(-17, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(19, 2); ctx.lineTo(11, 9); ctx.stroke();
  ctx.fillStyle = 'rgba(30,30,30,0.18)';
  ctx.beginPath(); ctx.ellipse(19, 8, 8, 5.5, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  /* 桶底的提手 */
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 4.4;
  ctx.beginPath(); ctx.arc(0, -47, 14, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.strokeStyle = M[1]; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0, -47, 14, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();

  /* 手脚从桶口里钻出来 —— 画在桶身之后，压在桶面上 */
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    const sw = Math.sin(t * 1.6) * 4 * s;
    /* 腿 */
    ctx.strokeStyle = ART.ink; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(s * 7, 10); ctx.quadraticCurveTo(s * 17, 30, s * 14 + sw, 44); ctx.stroke();
    ctx.strokeStyle = P.skin; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(s * 7, 10); ctx.quadraticCurveTo(s * 17, 30, s * 14 + sw, 44); ctx.stroke();
    ctx.fillStyle = P.pantsD;
    ctx.beginPath(); ctx.ellipse(s * 15, 34, 4.4, 3, 0, 0, Math.PI * 2); ctx.fill();
    artE(s * 14 + sw, 46, 7, 4.2, 0, P.shoe, ART.ink, 1.8);
    /* 手 */
    ctx.strokeStyle = ART.ink; ctx.lineWidth = 9.6;
    ctx.beginPath(); ctx.moveTo(s * 7, 8); ctx.quadraticCurveTo(s * 26, 12 + sw * 0.5, s * 34, 27 + sw * 0.7); ctx.stroke();
    ctx.strokeStyle = P.skin; ctx.lineWidth = 6.6;
    ctx.beginPath(); ctx.moveTo(s * 7, 8); ctx.quadraticCurveTo(s * 26, 12 + sw * 0.5, s * 34, 27 + sw * 0.7); ctx.stroke();
    artE(s * 34, 28 + sw * 0.7, 5.4, 4.6, 0, P.skin, ART.ink, 1.6);
    ctx.fillStyle = P.skinD;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.ellipse(s * 35 + s * k * 1.6, 26 + sw * 0.7 + k * 2.2, 1.6, 1, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* 桶口：里面是黑的 —— 四肢就是从这片黑里出来的 */
  ctx.fillStyle = 'rgba(8,7,5,0.88)';
  ctx.beginPath(); ctx.ellipse(0, 16, 30, 5.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 17.5, 22, 3.6, 0, 0, Math.PI * 2); ctx.fill();
  /* 桶沿压在四肢根部之上 */
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.ellipse(0, 16, 31.5, 6.8, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = M[2]; ctx.lineWidth = 5.4;
  ctx.beginPath(); ctx.ellipse(0, 16, 31.5, 6.8, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 16, 31.5, 6.8, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.strokeStyle = 'rgba(30,32,34,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 16, 31.5, 6.8, 0, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();

  /* 桶里唯一的一点动静：贴在桶口的两点视线 */
  const gl = 0.34 + Math.sin(t * 2) * 0.2;
  ctx.fillStyle = 'rgba(226,212,158,' + gl + ')';
  ctx.beginPath(); ctx.ellipse(-8, 16.2, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 16.2, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(226,212,158,' + (gl * 0.3) + ')';
  ctx.beginPath(); ctx.ellipse(0, 17, 11, 2.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---- 蹦跑的人：撑杆融进体内，身体挺直，只啃第一株 ---- */
function drawRunner(z) {
  drawZombieAura(z);
  const cy = gridY + z.row * CELL_H + CELL_H / 2;
  const cx = z.x;
  const t = (G ? G.time : 0) * 8 + z.seed;
  const P = zPal(z);

  artShadow(cx, cy + 47, 21, 5.5, 0.38);
  ctx.strokeStyle = 'rgba(200,190,150,0.18)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(16 + i * 5, -22 + i * 14);
    ctx.lineTo(42 + i * 7, -22 + i * 14);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t * 0.5) * 0.02 + (z.critical ? 0.05 : 0));
  zLegs(t, P, 15);

  /* 运动背心 */
  ctx.beginPath();
  ctx.moveTo(-15, -30); ctx.lineTo(15, -32);
  ctx.quadraticCurveTo(17, -6, 14, 20);
  ctx.lineTo(-14, 19);
  ctx.quadraticCurveTo(-17, -6, -15, -30);
  ctx.closePath();
  artShape(P.run, ART.ink, 2.4);
  ctx.fillStyle = P.runW;
  ctx.fillRect(-13, 4, 27, 5);
  ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(0, -8); ctx.lineTo(6, -30); ctx.closePath();
  artShape(P.runW, ART.ink, 1.4);

  /* 融进体内的撑杆：穿过躯干，从头顶穿出（画在躯干之上才看得见） */
  ctx.strokeStyle = ART.ink; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(5, 46); ctx.lineTo(-4, -78); ctx.stroke();
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(5, 46); ctx.lineTo(-4, -78); ctx.stroke();
  ctx.strokeStyle = 'rgba(235,220,175,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(3.4, 44); ctx.lineTo(-5.6, -76); ctx.stroke();
  /* 穿进身体的位置：一圈翻开的皮肉 */
  ctx.fillStyle = 'rgba(96,30,24,0.6)';
  ctx.beginPath(); ctx.ellipse(-1, -8, 5.5, 7.5, 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1, 14, 4.6, 6, 0.06, 0, Math.PI * 2); ctx.fill();

  /* 摆臂 */
  zArm(-14, -27, -20, -22 + Math.sin(t) * 3, -25, -14 + Math.sin(t) * 4, P, 6);
  zArm(14, -28, 20, -22 - Math.sin(t) * 3, 25, -14 - Math.sin(t) * 4, P, 6);
  zHead(0, -50, P, { rot: -0.02, mouthOpen: true });
  if (z.critical) zDrips(z);

  if (z.hasAttacked) {
    ctx.strokeStyle = 'rgba(200,40,20,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -20, 38, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
