   —— 子弹用与画稿同一套配色，枪口位置取自 artMuzzleTip()，
      所以弹道起点、弹体颜色都和枪口对得上。
   ============================================================ */
function drawShots() {
  const t = G.time;
  for (const s of G.shots) {
    /* 双发的溅射：一小片旋转的碎弹 */
    if (s.splash) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(t * 9 + s.x * 0.12);
      ctx.fillStyle = ART.pea[0];
      ctx.beginPath();
      ctx.moveTo(-4, -2.6); ctx.lineTo(3.6, -3.4); ctx.lineTo(4, 2.6); ctx.lineTo(-3, 3);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(20,30,10,0.8)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(220,255,170,0.5)';
      ctx.beginPath(); ctx.ellipse(-1, -1, 1.6, 1, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      continue;
    }
    const ice = s.ice;
    const C = ice ? ART.ice : ART.pea;
    const r = ice ? 7 : (s.repeater ? 6.2 : 7);
    /* 拖尾 */
    ctx.fillStyle = ice ? 'rgba(190,230,250,0.16)' : 'rgba(160,220,110,0.13)';
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(s.x - i * (ice ? 9 : 11), s.y + Math.sin(t * 20 + i) * 0.9, Math.max(1, r - i * 1.8), 0, Math.PI * 2);
      ctx.fill();
    }
    if (ice) {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 20);
      g.addColorStop(0, 'rgba(200,235,255,0.3)');
      g.addColorStop(1, 'rgba(200,235,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(s.x - 20, s.y - 20, 40, 40);
    }
    /* 弹体 */
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = ice ? C[0] : (s.repeater ? C[1] : C[0]);
    ctx.fill();
    ctx.strokeStyle = ice ? 'rgba(44,84,112,0.85)' : ART.ink;
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = ice ? 'rgba(240,252,255,0.75)' : 'rgba(220,255,180,0.55)';
    ctx.beginPath(); ctx.arc(s.x - r * 0.3, s.y - r * 0.34, r * 0.34, 0, Math.PI * 2); ctx.fill();
    if (s.repeater) {
      /* 它的子弹和它一样破碎 */
      ctx.strokeStyle = ART.ink; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(s.x - r * 0.75, s.y + r * 0.1);
      ctx.lineTo(s.x - r * 0.1, s.y - r * 0.25);
      ctx.lineTo(s.x + r * 0.55, s.y + r * 0.4);
      ctx.stroke();
    } else if (ice) {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        const a = i * 2.1 + t * 2.4;
        ctx.beginPath();
        ctx.moveTo(s.x + Math.cos(a) * r * 0.6, s.y + Math.sin(a) * r * 0.6);
        ctx.lineTo(s.x + Math.cos(a) * (r + 3), s.y + Math.sin(a) * (r + 3));
        ctx.stroke();
      }
    }
  }
}

function drawExplosions() {
  for (const ex of G.explosions) {
    const alpha = ex.life / ex.max;
    const k = 1 - alpha;                 /* 0 → 1 扩散过程 */
    const rr = ex.r;
    /* 冲击波环 */
    ctx.strokeStyle = (ex.isAsh ? 'rgba(255,214,150,' : 'rgba(255,192,112,') + (0.55 * alpha) + ')';
    ctx.lineWidth = 2 + 5 * alpha;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, rr * (0.6 + k * 0.45), 0, Math.PI * 2); ctx.stroke();
    /* 核心闪光 */
    const g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, rr * (0.45 + k * 0.75));
    if (ex.isAsh) {
      g.addColorStop(0, 'rgba(255,252,230,' + (0.85 * alpha) + ')');
      g.addColorStop(0.3, 'rgba(255,190,80,' + (0.55 * alpha) + ')');
      g.addColorStop(0.65, 'rgba(220,80,30,' + (0.32 * alpha) + ')');
      g.addColorStop(1, 'rgba(70,16,0,0)');
    } else {
      g.addColorStop(0, 'rgba(255,236,180,' + (0.7 * alpha) + ')');
      g.addColorStop(0.35, 'rgba(230,146,54,' + (0.45 * alpha) + ')');
      g.addColorStop(0.7, 'rgba(150,60,20,' + (0.26 * alpha) + ')');
      g.addColorStop(1, 'rgba(50,16,0,0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, rr * (0.45 + k * 0.8), 0, Math.PI * 2); ctx.fill();
    /* 甩出去的火星与土块（确定性，不闪烁） */
    for (let i = 0; i < 9; i++) {
      const a = artNoise(ex.x + i * 3.1, 1) * Math.PI * 2 + k * 1.1;
      const d = rr * (0.5 + k * 0.75) * (0.55 + artNoise(ex.x + i, 2) * 0.6);
      const px = ex.x + Math.cos(a) * d;
      const py = ex.y + Math.sin(a) * d * 0.72;
      ctx.fillStyle = (ex.isAsh ? 'rgba(255,150,60,' : 'rgba(150,110,60,') + (0.45 * alpha) + ')';
      ctx.beginPath();
      ctx.arc(px, py, 1.6 + artNoise(ex.x + i, 3) * 3 * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPickups() {
  const t = G.time;
  for (const p of G.pickups) {
    const bob = Math.sin(t * 3 + p.x * 0.02) * 3;
    const px = p.x, py = p.y + bob;
    /* 灯管的抽搐：老荧光灯那种一抖一抖 */
    const buzz = 0.82 + Math.sin(t * 26 + p.x) * 0.08 + (Math.sin(t * 7.3 + p.x * 0.1) > 0.93 ? -0.45 : 0);
    const life = Math.min(1, p.life / 2.2);          /* 快消失时变暗 */
    const k = buzz * (0.45 + life * 0.55);
    /* 光晕 */
    const lg = ctx.createRadialGradient(px, py, 0, px, py, 40);
    lg.addColorStop(0, 'rgba(245,238,170,' + (0.4 * k) + ')');
    lg.addColorStop(0.5, 'rgba(240,230,150,' + (0.13 * k) + ')');
    lg.addColorStop(1, 'rgba(240,230,150,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(px - 40, py - 40, 80, 80);
    /* 往下的一小截光锥 */
    ctx.fillStyle = 'rgba(245,238,170,' + (0.06 * k) + ')';
    ctx.beginPath();
    ctx.moveTo(px - 17, py + 4);

    ctx.lineTo(px + 34, py + 60);
    ctx.lineTo(px - 34, py + 60);
    ctx.closePath();
    ctx.fill();
    /* 灯管本体 */
    ctx.fillStyle = 'rgba(180,170,120,' + (0.9 * k) + ')';
    ctx.fillRect(px - 19, py - 6, 38, 12);
    ctx.fillStyle = 'rgba(240,232,150,' + k + ')';
    ctx.fillRect(px - 16, py - 4, 32, 8);
    ctx.fillStyle = 'rgba(255,252,220,' + k + ')';
    ctx.fillRect(px - 13, py - 3, 26, 4);
    ctx.fillStyle = 'rgba(120,112,80,' + k + ')';
    ctx.fillRect(px - 21, py - 5, 4, 10);
    ctx.fillRect(px + 17, py - 5, 4, 10);
    /* 数量 */
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(40,30,10,0.5)';
    ctx.fillText('+' + p.amount, px + 1, py - 12);
    ctx.fillStyle = 'rgba(255,250,210,' + (0.5 + k * 0.5) + ')';

  }
  ctx.textAlign = 'left';
}

/* ============================================================
   音效（Web Audio 现场合成）
   ------------------------------------------------------------
   · 全部程序合成的短音：种植 / 射击 / 命中 / 啃咬 / 爆炸 / 冰冻 /
     拾取 / 临界 / 胜负 / UI，没有外部音频文件
   · 环境音：日光灯的嗡鸣 + 房间底噪，按关卡换色调（红房间更低更闷）
   · 浏览器要求用户手势后才能出声：首次点击时初始化
   · 纯表现层：不读写任何战斗状态，也不消耗 Math.random
   ============================================================ */
let AC = null, AUDIO_BUS = null, audioDead = false, muted = false, ambient = null, noiseBuf = null;
const SFX_GATE = {};

function audioInit() {
  if (AC) { if (AC.state === 'suspended' && AC.resume) AC.resume(); return; }
  if (audioDead) return;
  const Ctor = (typeof AudioContext !== 'undefined' && AudioContext)
    || (typeof webkitAudioContext !== 'undefined' && webkitAudioContext) || null;
  if (!Ctor) { audioDead = true; return; }
  try {
    AC = new Ctor();
    const comp = AC.createDynamicsCompressor();
    if (comp.threshold) comp.threshold.value = -16;
    if (comp.knee) comp.knee.value = 14;
    if (comp.ratio) comp.ratio.value = 6;
    const master = AC.createGain();
    master.gain.value = 0.5;
    comp.connect(master);
    master.connect(AC.destination);
    AUDIO_BUS = comp;
  } catch (e) { audioDead = true; AC = null; }
}

function sndGate(key, ms) {
  const now = (typeof performance !== 'undefined' ? performance.now() : 0);
  if (SFX_GATE[key] !== undefined && now - SFX_GATE[key] < ms) return false;
  SFX_GATE[key] = now;
  return true;
}
/* 一段带包络的振荡器 */
function sndTone(o) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const osc = AC.createOscillator();
  const g = AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(Math.max(1, o.f0), t);
  if (o.f1 && o.f1 !== o.f0) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
  }
  const vol = o.vol === undefined ? 0.15 : o.vol;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (o.atk || 0.006));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  osc.connect(g);
  g.connect(AUDIO_BUS);
  osc.start(t);
  osc.stop(t + o.dur + 0.03);
}
/* 一段滤波噪声 */
function sndNoise(o) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    const n = Math.floor(AC.sampleRate * 1.2);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.sin(i * 12.9898) * 0.5;
  }
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = o.filter || 'lowpass';
  f.frequency.setValueAtTime(Math.max(30, o.f0 || 1200), t);
  if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + o.dur);
  if (f.Q) f.Q.value = o.q || 1;
  const g = AC.createGain();
  const vol = o.vol === undefined ? 0.15 : o.vol;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (o.atk || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f);
  f.connect(g);
  g.connect(AUDIO_BUS);
  src.start(t);
  src.stop(t + o.dur + 0.03);
}

const SFX = {

/* ---------- 环境音：日光灯嗡鸣 ---------- */
function ambientStart(level) {
  if (!AC || ambient) return;
  try {
    const g = AC.createGain();
    g.gain.value = 0.0001;
    const o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 60;
    const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 120;
    const src = AC.createBufferSource();
    if (!noiseBuf) {
      const n = Math.floor(AC.sampleRate * 1.2);
      noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.sin(i * 12.9898) * 0.5;
    }
    src.buffer = noiseBuf; src.loop = true;
    const nf = AC.createBiquadFilter(); nf.type = 'bandpass';
    nf.frequency.value = level === 9 ? 480 : 880; nf.Q.value = 0.6;
    const ng = AC.createGain(); ng.gain.value = 0.05;
    o1.connect(g); o2.connect(g);
    src.connect(nf); nf.connect(ng); ng.connect(g);
    g.connect(AUDIO_BUS);
    if (level === 9) { o2.frequency.value = 88; o1.frequency.value = 44; }
    g.gain.setTargetAtTime(muted ? 0.0001 : (level === 9 ? 0.05 : 0.032), AC.currentTime, 1.4);
    o1.start(); o2.start(); src.start();
    ambient = { g, o1, o2, src };
  } catch (e) { ambient = null; }
}
function ambientStop() {
  if (!AC || !ambient) return;
  const a = ambient;
  ambient = null;
  try {
    a.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.5);
    setTimeout(() => { try { a.o1.stop(); a.o2.stop(); a.src.stop(); } catch (e) {} }, 1600);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  if (AC) {
    try {
      if (muted) { if (ambient) ambient.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.2); }
      else if (ambient) ambient.g.gain.setTargetAtTime(0.032, AC.currentTime, 0.5);
    } catch (e) {}
  }
  return muted;
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'm' || k === 'M') toggleMute();
  });
}


/* ============================================================

function drawUI() {
  ctx.fillStyle = '#0d0a06';
  ctx.fillRect(0, 0, W, 80);
  ctx.fillStyle = 'rgba(160, 140, 70, 0.15)';
  ctx.fillRect(0, 78, W, 2);

  ctx.fillStyle = '#e8dc8a';
  ctx.font = 'bold 26px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(String(Math.floor(G.glow)), W - 40, 50);
  ctx.fillStyle = '#e8dc8a';
  ctx.fillRect(W - 24, 30, 18, 6);
  ctx.fillStyle = '#fff8d0';
  ctx.fillRect(W - 22, 31, 14, 4);

  if (G.level === 9) {
    drawConveyor();
  } else {
    const seeds = getSeeds();
    for (const s of seeds) {
      const affordable = G.glow >= s.cost;
      const selected = G.sel === s.key;
      const cd = G.cooldowns[s.key] || 0;
      const cdMax = PLANT_COOLDOWN[s.key];
      const cdRatio = cdMax > 0 ? cd / cdMax : 0;
      const onCooldown = cd > 0;

      ctx.fillStyle = selected ? '#3a3420' : '#1a160c';
      ctx.fillRect(s.x, 4, 64, 72);

      if (onCooldown) {
        ctx.fillStyle = 'rgba(10, 8, 4, 0.7)';
        ctx.fillRect(s.x, 4, 64, 72 * cdRatio);
        ctx.fillStyle = 'rgba(200, 180, 100, 0.8)';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(cd) + 's', s.x + 32, 44);
      }

      ctx.strokeStyle = selected ? 'rgba(240, 230, 150, 0.9)'
        : (onCooldown ? 'rgba(60, 50, 25, 0.5)'
          : (affordable ? 'rgba(160, 140, 80, 0.6)' : 'rgba(80, 70, 40, 0.4)'));
      ctx.lineWidth = selected ? 2.5 : 1.5;
      ctx.strokeRect(s.x + 0.5, 4.5, 63, 71);

      ctx.save();
      ctx.translate(s.x + 32, 27);
      if (onCooldown) ctx.globalAlpha = 0.35;
      drawSeedIcon(s.key, affordable);
      ctx.globalAlpha = 1;
      ctx.restore();

      ctx.fillStyle = onCooldown ? '#4a4230' : (affordable ? '#e8e0c0' : '#6a6250');
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(s.name, s.x + 32, 54);
      ctx.fillStyle = onCooldown ? '#4a3a20' : (affordable ? '#e8dc8a' : '#7a6a40');
      ctx.font = 'bold 12px monospace';
      ctx.fillText(String(s.cost), s.x + 32, 70);
    }
  }

  const shovel = getShovelRect();
  const shovelHover = inRect(mouseX, mouseY, shovel.x, shovel.y, shovel.w, shovel.h);
  ctx.fillStyle = G.shovelSelected ? '#3a3420' : '#1a160c';
  ctx.fillRect(shovel.x, shovel.y, shovel.w, shovel.h);
  ctx.strokeStyle = G.shovelSelected
    ? 'rgba(240, 230, 150, 0.9)'
    : (shovelHover ? 'rgba(200, 180, 100, 0.7)' : 'rgba(120, 100, 50, 0.5)');
  ctx.lineWidth = G.shovelSelected ? 2.5 : 1.5;
  ctx.strokeRect(shovel.x + 0.5, shovel.y + 0.5, shovel.w - 1, shovel.h - 1);

  ctx.save();
  ctx.translate(shovel.x + shovel.w / 2, shovel.y + 30);
  ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 6); ctx.stroke();
  ctx.fillStyle = '#a89878';
  ctx.beginPath();
  ctx.moveTo(-10, 6); ctx.lineTo(10, 6); ctx.lineTo(7, 22); ctx.lineTo(-7, 22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(60, 40, 20, 0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  ctx.fillStyle = G.shovelSelected ? '#e8e0c0' : '#8a7a5a';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('铲子', shovel.x + 32, shovel.y + 58);

  const names = {
    1:'LEVEL 1-1 · 鱼骨长廊', 2:'LEVEL 1-2 · 房间',
    3:'LEVEL 1-3 · 黄色房间', 4:'LEVEL 1-4 · 黄色房间·深处',
    5:'LEVEL 1-5 · 黄色房间·遗忘', 6:'LEVEL 1-6 · 米色房间',
    7:'LEVEL 1-7 · 重塑的混乱', 8:'LEVEL 1-8 · 重塑的混乱·深处',
    9:'LEVEL 1-9 · 红色房间 · 传送带'
  };
  ctx.fillStyle = 'rgba(160, 140, 80, 0.5)';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(names[G.level], 20, 95);

  if (G.spawns.length > 0) {
    const prog = Math.min(1, G.spawnIdx / G.spawns.length);
    const bw = 200, bh = 6;
    const bx = W - 240, by = 95;
    ctx.fillStyle = 'rgba(20, 16, 8, 0.6)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(200, 180, 100, 0.6)';
    ctx.fillRect(bx, by, bw * prog, bh);
    ctx.strokeStyle = 'rgba(160, 140, 70, 0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  }

  const backX = W - 240, backY = 110;
  const backHover = inRect(mouseX, mouseY, backX, backY, 90, 22);
  ctx.fillStyle = backHover ? 'rgba(60, 52, 28, 0.9)' : 'rgba(30, 26, 14, 0.7)';
  ctx.fillRect(backX, backY, 90, 22);
  ctx.strokeStyle = backHover ? 'rgba(200, 180, 100, 0.8)' : 'rgba(120, 100, 50, 0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(backX + 0.5, backY + 0.5, 89, 21);
  ctx.fillStyle = backHover ? '#e8dc8a' : '#8a7a5a';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('返回选关', backX + 45, backY + 15);

  /* 音效开关（右下角，随时可点） */
  const sb = soundBtnRect();
  const sbHover = inRect(mouseX, mouseY, sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = sbHover ? 'rgba(60, 52, 28, 0.92)' : 'rgba(20, 17, 9, 0.8)';
  ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = sbHover ? 'rgba(230, 215, 140, 0.9)' : 'rgba(120, 100, 50, 0.5)';
  ctx.lineWidth = 1.4;
  ctx.strokeRect(sb.x + 0.5, sb.y + 0.5, sb.w - 1, sb.h - 1);
  /* 小喇叭 */
  const sx0 = sb.x + 12, sy0 = sb.y + sb.h / 2;
  ctx.fillStyle = muted ? '#6a5a30' : '#e8dc8a';
  ctx.beginPath();
  ctx.moveTo(sx0 - 5, sy0 - 3); ctx.lineTo(sx0, sy0 - 3); ctx.lineTo(sx0 + 4, sy0 - 7);
  ctx.lineTo(sx0 + 4, sy0 + 7); ctx.lineTo(sx0, sy0 + 3); ctx.lineTo(sx0 - 5, sy0 + 3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = muted ? '#6a5a30' : '#e8dc8a';
  ctx.lineWidth = 1.4;
  if (muted) {
    ctx.beginPath(); ctx.moveTo(sx0 + 8, sy0 - 5); ctx.lineTo(sx0 + 14, sy0 + 5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(sx0 + 5, sy0, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx0 + 5, sy0, 9, -0.9, 0.9); ctx.stroke();
  }
  ctx.fillStyle = muted ? 'rgba(140, 120, 60, 0.7)' : '#c8b860';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(muted ? '静音 M' : '音效 M', sb.x + 30, sb.y + sb.h - 7);
}

/* 传送带绘制——排队留存 */
function drawConveyor() {
  // 传送带背景

  for (let i = -20; i < W + 20; i += 24) {

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i, 6);
    ctx.lineTo(i + 14, 74);
    ctx.stroke();
  }

  // 滚动光效
  const scroll = (G.time * 50) % 24;
  for (let i = -20; i < W + 20; i += 24) {
    ctx.strokeStyle = 'rgba(180, 160, 80, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(i + scroll, 6);
    ctx.lineTo(i + 14 + scroll, 74);
    ctx.stroke();
  }

  // 卡片
  for (const c of G.conveyor) {
    const selected = G.selConveyorId === c.id;
    const x = c.x;
    const y = 4;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x + 3, y + 3, 60, 72);

    ctx.fillStyle = selected ? '#3a3420' : '#1f1a0e';
    ctx.fillRect(x, y, 60, 72);

    ctx.strokeStyle = selected ? 'rgba(240, 230, 150, 0.95)' : 'rgba(160, 140, 80, 0.6)';
    ctx.lineWidth = selected ? 2.5 : 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, 59, 71);

    ctx.save();
    ctx.translate(x + 30, y + 28);
    drawSeedIcon(c.key, true);
    ctx.restore();

    const names = {
      pea:'静物豌豆', sun:'静物向日葵', cherry:'静物樱桃', wall:'静物坚果',
      potato:'静物土豆雷', ice:'静物寒冰', chomper:'静物大嘴花', repeater:'静物双发'
    };
    ctx.fillStyle = '#e8e0c0';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(names[c.key] || c.key, x + 30, y + 52);

    // 光泽
    const shine = (G.time * 100 + c.id * 50) % 200;
    if (shine < 60) {
      ctx.fillStyle = 'rgba(255, 250, 200, ' + (0.08 * (1 - Math.abs(shine - 30) / 30)) + ')';
      ctx.fillRect(x, y, 60, 72);
    }
  }

  if (G.conveyor.length === 0) {
    ctx.fillStyle = 'rgba(140, 120, 60, 0.5)';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('传送带正在运送……', W / 2, 46);
  }
}

/* 种子卡图标：直接复用重绘后的画稿（缩到卡面大小），保证与场上一致 */
function drawSeedIcon(key, affordable) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(-28, -24, 56, 40);
  ctx.clip();
  ctx.translate(0, -1);
  ctx.scale(0.44, 0.44);
  const fake = {
    type: key, x: -CELL_W/2, y: -CELL_H/2,
    hp: 100, maxHp: 100, flash: 0, bob: 0,
    chained: false, timer: 0, dmgAcc: 0, aoeTimer: 0
  };
  switch (key) {
    case 'pea':      drawPea(fake); break;
    case 'sun':      drawSunflower(fake); break;
    case 'cherry':   drawCherry(fake); break;
    case 'wall':     drawWall(fake); break;
    case 'potato':   drawPotato(fake); break;
    case 'ice':      drawIce(fake); break;
    case 'chomper':  drawChomper(fake); break;
    case 'repeater': drawRepeater(fake); break;
  }
  ctx.restore();
  if (!affordable) {
    ctx.fillStyle = 'rgba(8, 6, 3, 0.4)';
    ctx.fillRect(-28, -24, 56, 40);
  }
}

  if (!codexCache) codexCache = {};

}

function buildCodexEntries(tab) {
  if (tab === 'plant') {
    return CODEX_PLANT_KEYS.map(k => ({
      kind:'plant', key:k, short:CODEX_SHORT[k], name:CODEX_TEXT[k].name, tag:CODEX_TEXT[k].tag,
      sub: PLANT_COST[k] + ' 荧光灯',
      lines: CODEX_TEXT[k].lines, rows: codexPlantRows(k)
    }));
  }
  if (tab === 'zombie') {
    return CODEX_ZOMBIE_KEYS.map(k => {
      const d = ZDEF[k];
      return {
        kind:'zombie', key:k, short:CODEX_SHORT[k], name:CODEX_TEXT[k].name, tag:CODEX_TEXT[k].tag,
        sub: '总承伤 ' + (d.base + d.critHp + (d.armor || 0)),
        lines: CODEX_TEXT[k].lines, rows: codexZombieRows(k)
      };
    });
  }
  if (tab === 'level') {
    return LEVEL_NAMES.map((n, i) => {
      const lvl = i + 1, cfg = getLevelConfig(lvl), sp = codexSpawns(lvl);
      const types = [];
      let hp = 0, first = '—', last = '—';
      for (const s of sp) {
        if (types.indexOf(s.type) < 0) types.push(s.type);
        const d = ZDEF[s.type];
        hp += d.base + d.critHp + (d.armor || 0);
        if (first === '—' || s.t < Number(first)) first = s.t.toFixed(1);
        if (last === '—' || s.t > Number(last)) last = s.t.toFixed(1);

      return {
        kind:'level', key:'lv' + lvl,
        short: '1-' + lvl + ' · ' + n,
        name: 'LEVEL 1-' + lvl + ' · ' + n,
        tag: cfg.rows + ' 行场地 · ' + cfg.obstacles.length + ' 个障碍格 · ' + sp.length + ' 只僵尸',
        sub: sp.length + ' 只 · ' + cfg.rows + ' 行',

/* ---------- 图鉴：绘制 ---------- */
function drawSmallButton(x, y, w, h, text, hover, size) {
  ctx.fillStyle = hover ? 'rgba(60, 52, 28, 0.9)' : 'rgba(30, 26, 14, 0.9)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hover ? 'rgba(240, 230, 150, 0.9)' : 'rgba(160, 140, 80, 0.5)';
  ctx.lineWidth = hover ? 2 : 1.2;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = hover ? '#f8f0c0' : '#c8b860';
  ctx.font = 'bold ' + (size || 15) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function drawZombieByKey(key, z) {
  switch (key) {
    case 'wander':       drawWander(z); break;
    case 'charge':       drawCharge(z); break;
    case 'conehead':     drawConehead(z); break;
    case 'conesculpt':   drawConeSculpt(z); break;
    case 'bucket':       drawBucket(z); break;
    case 'bucketperson': drawBucketPerson(z); break;
    case 'runner':       drawRunner(z); break;
  }
}

/* 在 (cx,cy) 处按 scale 画一只图鉴用的静物（植物直接复用介绍页画法） */
function drawCodexFigure(kind, key, cx, cy, scale) {
  if (kind === 'plant') {
    const off = CODEX_P_ART[key] || [0,0];
    drawIntroPlant(key, cx + off[0] * scale, cy + off[1] * scale, scale);
    return;
  }
  if (kind !== 'zombie') return;
  const off = CODEX_Z_ART[key] || [0,0];
  const ax = cx + off[0] * scale, ay = cy + off[1] * scale;
  const d = ZDEF[key];
  const fake = {
    type:key, x:ax, row:0, seed:4.2,
    hp:d.base, maxHp:d.base + d.critHp,
    armor:d.armor || 0, maxArmor:d.armor || 0,
    critical:false, frozen:0, slowed:0, hasAttacked:false
  };
  const oldGridY = gridY;
  gridY = ay - CELL_H / 2;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(scale, scale);
  ctx.translate(-ax, -ay);
  drawZombieByKey(key, fake);
  ctx.restore();
  gridY = oldGridY;
}

/* 等宽字体的宽度估算：全角按 1em，半角按 0.6em（离线也能排版） */
function codexCharW(ch, size) {
  const c = ch.charCodeAt(0);
  const wide = c > 0x2E80; /* CJK / 全角标点 */
  return (wide ? 1.02 : 0.6) * size;
}
function codexTextW(str, size) {
  let w = 0;
  const s = String(str);
  for (let i = 0; i < s.length; i++) w += codexCharW(s[i], size);
  return w;
}
function wrapText(str, maxWidth, size) {
  const out = [];
  let line = '', cur = 0;
  const s = String(str);
  for (let i = 0; i < s.length; i++) {
    const cw = codexCharW(s[i], size);
    if (cur + cw > maxWidth && line) { out.push(line); line = ''; cur = 0; }
    line += s[i]; cur += cw;
  }
  if (line) out.push(line);
  return out.length ? out : [''];
}

/* 规则页的装饰：一盏吊灯，图鉴的通用符号 */
function drawCodexLamp(cx, cy) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90);
  g.addColorStop(0, 'rgba(240, 230, 160, 0.16)');
  g.addColorStop(1, 'rgba(240, 230, 160, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - 90, cy - 90, 180, 180);
  ctx.fillStyle = 'rgba(245, 238, 180, 0.75)';
  ctx.fillRect(cx - 42, cy - 3, 84, 6);
  ctx.strokeStyle = 'rgba(160, 140, 80, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - 60); ctx.lineTo(cx, cy - 3); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy - 62, 3, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + codexTime * 0.25;
    ctx.fillStyle = 'rgba(230, 215, 160, ' + (0.10 + 0.06 * Math.sin(codexTime * 2 + i)) + ')';
    ctx.fillRect(cx + Math.cos(a) * 62 - 2, cy + Math.sin(a) * 42 - 2, 4, 4);
  }
}

function drawCodex(now) {
  ctx.fillStyle = '#0a0804';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const lx = 100 + i * 190, ly = 56;
    const flick = 0.5 + Math.sin(now / 320 + i * 2) * 0.3;
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 170);
    lg.addColorStop(0, 'rgba(240, 230, 160, ' + (0.10 * flick) + ')');
    lg.addColorStop(1, 'rgba(240, 230, 160, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(lx - 170, ly - 170, 340, 340);
  }

  /* 标题 */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#c8b860';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('静 物 图 鉴', 22, 36);
  ctx.fillStyle = 'rgba(140, 120, 60, 0.6)';
  ctx.font = '9px monospace';
  ctx.fillText('THE BACKROOMS · STILL LIFE CODEX', 24, 52);
  ctx.strokeStyle = 'rgba(140, 120, 70, 0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(20, 64.5); ctx.lineTo(W - 20, 64.5); ctx.stroke();

  /* 页签 */
  for (let i = 0; i < CODEX_TABS.length; i++) {
    const t = CODEX_TABS[i];
    const tx = CODEX_UI.tabX + i * (CODEX_UI.tabW + CODEX_UI.tabGap);
    const on = t.key === codexTab;
    const hv = inRect(mouseX, mouseY, tx, CODEX_UI.tabY, CODEX_UI.tabW, CODEX_UI.tabH);
    ctx.fillStyle = on ? '#3a3420' : (hv ? 'rgba(48, 42, 22, 0.9)' : 'rgba(24, 20, 11, 0.9)');
    ctx.fillRect(tx, CODEX_UI.tabY, CODEX_UI.tabW, CODEX_UI.tabH);
    ctx.strokeStyle = on ? 'rgba(240, 230, 150, 0.95)' : (hv ? 'rgba(200, 180, 100, 0.7)' : 'rgba(120, 100, 50, 0.45)');
    ctx.lineWidth = on ? 2 : 1.2;
    ctx.strokeRect(tx + 0.5, CODEX_UI.tabY + 0.5, CODEX_UI.tabW - 1, CODEX_UI.tabH - 1);
    ctx.fillStyle = on ? '#f8f0c0' : '#a89858';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.label, tx + CODEX_UI.tabW / 2, CODEX_UI.tabY + CODEX_UI.tabH / 2 + 1);
    ctx.textBaseline = 'alphabetic';
  }
  drawSmallButton(CODEX_UI.backX, CODEX_UI.backY, CODEX_UI.backW, CODEX_UI.backH, '返 回',
    inRect(mouseX, mouseY, CODEX_UI.backX, CODEX_UI.backY, CODEX_UI.backW, CODEX_UI.backH), 15);

  /* 列表 */
  const entries = codexEntries(codexTab);
  if (codexSel >= entries.length) codexSel = 0;
  ctx.fillStyle = 'rgba(14, 12, 7, 0.75)';
  ctx.fillRect(CODEX_UI.listX, CODEX_UI.listY, CODEX_UI.listW, CODEX_UI.listH);
  ctx.strokeStyle = 'rgba(120, 100, 50, 0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(CODEX_UI.listX + 0.5, CODEX_UI.listY + 0.5, CODEX_UI.listW - 1, CODEX_UI.listH - 1);

  for (let i = 0; i < entries.length && i < CODEX_MAX_CARDS; i++) {
    const e = entries[i];
    const col = i % 2, row = Math.floor(i / 2);
    const ex = CODEX_UI.listX + 6 + col * (CODEX_UI.cardW + CODEX_UI.cardGapX);
    const ey = CODEX_UI.listY + 6 + row * (CODEX_UI.cardH + CODEX_UI.cardGapY);
    const on = i === codexSel;
    const hv = inRect(mouseX, mouseY, ex, ey, CODEX_UI.cardW, CODEX_UI.cardH);
    ctx.fillStyle = on ? 'rgba(58, 52, 28, 0.95)' : (hv ? 'rgba(42, 37, 20, 0.9)' : 'rgba(26, 22, 12, 0.9)');
    ctx.fillRect(ex, ey, CODEX_UI.cardW, CODEX_UI.cardH);
    ctx.strokeStyle = on ? 'rgba(240, 230, 150, 0.95)' : (hv ? 'rgba(190, 170, 95, 0.6)' : 'rgba(110, 92, 45, 0.4)');
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(ex + 0.5, ey + 0.5, CODEX_UI.cardW - 1, CODEX_UI.cardH - 1);

    /* 图标 */
    const ix = ex + 27, iy = ey + CODEX_UI.cardH / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(ex + 5, ey + 5, 44, CODEX_UI.cardH - 10);
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(ex + 5, ey + 5, 44, CODEX_UI.cardH - 10);
    if (e.kind === 'plant') drawCodexFigure('plant', e.key, ix, iy, CODEX_P_SCALE.card);
    else if (e.kind === 'zombie') drawCodexFigure('zombie', e.key, ix, iy, CODEX_Z_SCALE.card);
    else if (e.kind === 'level') {
      ctx.fillStyle = 'rgba(200, 180, 100, 0.85)';
      ctx.font = 'bold 17px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(e.art.big, ix, iy + 6);
    } else {
      ctx.fillStyle = 'rgba(220, 200, 130, 0.7)';
      ctx.fillRect(ix - 9, iy - 2, 18, 4);
    }
    ctx.restore();

    /* 文字 */
    ctx.textAlign = 'left';
    ctx.fillStyle = on ? '#f8f0c0' : '#c8b860';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(e.short, ex + 56, ey + 26);
    ctx.fillStyle = on ? 'rgba(210, 195, 140, 0.85)' : 'rgba(150, 135, 85, 0.75)';
    ctx.font = '10px monospace';
    ctx.fillText(e.sub, ex + 56, ey + 43);
  }

  /* 列表下方的说明，填住空档 */
  const usedRows = Math.ceil(Math.min(entries.length, CODEX_MAX_CARDS) / 2);
  let by = CODEX_UI.listY + 6 + usedRows * (CODEX_UI.cardH + CODEX_UI.cardGapY) - CODEX_UI.cardGapY + 22;
  ctx.fillStyle = 'rgba(140, 120, 70, 0.28)';
  ctx.fillRect(CODEX_UI.listX + 22, by, CODEX_UI.listW - 44, 1);
  by += 24;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(150, 135, 85, 0.8)';
  ctx.font = '11px monospace';
  for (const line of (CODEX_BLURB[codexTab] || [])) {
    for (const l of wrapText(line, CODEX_UI.listW - 44, 11)) {
      if (by > CODEX_UI.listY + CODEX_UI.listH - 10) break;
      ctx.fillText(l, CODEX_UI.listX + 22, by);
      by += 18;
    }
  }

  /* 详情 */
  const sel = entries[codexSel];
  const DX = CODEX_UI.detX, DY = CODEX_UI.detY, DW = CODEX_UI.detW;
  ctx.fillStyle = 'rgba(18, 15, 9, 0.9)';
  ctx.fillRect(DX, DY, DW, CODEX_UI.detH);
  ctx.strokeStyle = 'rgba(150, 130, 70, 0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(DX + 0.5, DY + 0.5, DW - 1, CODEX_UI.detH - 1);

  if (sel) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e8dc8a';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(sel.name, DX + 22, DY + 34);
    ctx.fillStyle = 'rgba(160, 145, 90, 0.85)';
    ctx.font = '11px monospace';
    ctx.fillText(sel.tag, DX + 22, DY + 56);
    ctx.strokeStyle = 'rgba(150, 130, 70, 0.3)';
    ctx.beginPath(); ctx.moveTo(DX + 22, DY + 67.5); ctx.lineTo(DX + DW - 22, DY + 67.5); ctx.stroke();

    /* 画稿区 */
    const artX = DX + 22, artY = DY + 78, artW = DW - 44, artH = 152;
    const acx = artX + artW / 2, acy = artY + artH / 2;
    ctx.strokeStyle = 'rgba(140, 120, 70, 0.2)';
    ctx.strokeRect(artX + 0.5, artY + 0.5, artW - 1, artH - 1);
    const ag = ctx.createRadialGradient(acx, acy, 6, acx, acy, 120);
    ag.addColorStop(0, 'rgba(220, 190, 100, 0.16)');
    ag.addColorStop(1, 'rgba(220, 190, 100, 0)');
    ctx.fillStyle = ag;
    ctx.fillRect(artX, artY, artW, artH);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(acx, artY + artH - 18, 66, 10, 0, 0, Math.PI * 2); ctx.fill();
    if (sel.kind === 'plant') drawCodexFigure('plant', sel.key, acx, acy - 4, CODEX_P_SCALE.det);
    else if (sel.kind === 'zombie') drawCodexFigure('zombie', sel.key, acx, acy - 6, CODEX_Z_SCALE.det);
    else if (sel.kind === 'level') {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(232, 220, 138, 0.95)';
      ctx.font = 'bold 58px monospace';
      ctx.fillText(sel.art.big, acx, acy + 6);
      ctx.fillStyle = 'rgba(190, 175, 115, 0.9)';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(sel.art.sub, acx, acy + 42);
      ctx.textAlign = 'left';
    } else drawCodexLamp(acx, acy - 4);

    /* 描述 + 数值表：先排版再落笔，保证不越界、不互相压字 */
    const contentW = DW - 44;
    const flavor = [];
    for (const line of (sel.lines || [])) {
      for (const l of wrapText(line, contentW, 13)) flavor.push(l);
    }
    const items = [];
    for (const row of (sel.rows || [])) {
      const label = String(row[0]), value = String(row[1]);
      if (codexTextW(label, 12) + 16 + codexTextW(value, 12) <= contentW) {
        items.push({ label, one: value });
      } else {
        items.push({ label, many: wrapText(value, contentW, 12) });
      }
    }
    const top = DY + 262;
    const bottom = DY + CODEX_UI.detH - 12;
    const need = (h) => {
      let n = flavor.length * h + 14;
      for (const it of items) n += it.one !== undefined ? h : (h * (1 + it.many.length) + 4);
      return n;
    };
    let lh = 21;
    if (need(lh) > bottom - top) lh = 17;
    if (need(lh) > bottom - top) lh = 15;

    let y = top;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(210, 195, 140, 0.92)';
    ctx.font = '13px monospace';
    for (const line of flavor) { if (y > bottom) break; ctx.fillText(line, DX + 22, y); y += lh; }
    y += 14;

    for (const it of items) {
      if (y > bottom) break;
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(150, 135, 85, 0.95)';
      ctx.font = '12px monospace';
      if (it.one !== undefined) {
        ctx.fillText(it.label, DX + 22, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(232, 220, 160, 0.95)';
        ctx.fillText(it.one, DX + DW - 22, y);
        ctx.strokeStyle = 'rgba(140, 120, 70, 0.16)';
        ctx.beginPath();
        ctx.moveTo(DX + 22, y + 6.5);
        ctx.lineTo(DX + DW - 22, y + 6.5);
        ctx.stroke();
        y += lh;
      } else {
        ctx.fillText(it.label, DX + 22, y);
        y += lh - 3;
        ctx.fillStyle = 'rgba(232, 220, 160, 0.95)';
        for (const l of it.many) {
          if (y > bottom) break;
          ctx.fillText(l, DX + 22, y);
          y += lh - 3;
        }
        y += 4;
      }
    }
    ctx.textAlign = 'left';
  }

  ctx.fillStyle = 'rgba(110, 95, 50, 0.55)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('共 ' + entries.length + ' 条记录 · 数值取自当前代码', 22, 614);
  ctx.textAlign = 'right';
  ctx.fillText('静物图鉴 v1.2', W - 22, 614);
  ctx.textAlign = 'left';
}

function handleCodexClick(x, y) {
  if (inRect(x, y, CODEX_UI.backX, CODEX_UI.backY, CODEX_UI.backW, CODEX_UI.backH)) {
    SFX.click();
    mode = codexReturn === 'levelselect' ? 'levelselect' : 'menu';
    return;
  }
  for (let i = 0; i < CODEX_TABS.length; i++) {
    const tx = CODEX_UI.tabX + i * (CODEX_UI.tabW + CODEX_UI.tabGap);
    if (inRect(x, y, tx, CODEX_UI.tabY, CODEX_UI.tabW, CODEX_UI.tabH)) {
      if (codexTab !== CODEX_TABS[i].key) { codexTab = CODEX_TABS[i].key; codexSel = 0; SFX.click(); }
      return;
    }
  }
  const entries = codexEntries(codexTab);
  for (let i = 0; i < entries.length && i < CODEX_MAX_CARDS; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const ex = CODEX_UI.listX + 6 + col * (CODEX_UI.cardW + CODEX_UI.cardGapX);
    const ey = CODEX_UI.listY + 6 + row * (CODEX_UI.cardH + CODEX_UI.cardGapY);
    if (inRect(x, y, ex, ey, CODEX_UI.cardW, CODEX_UI.cardH)) {
      if (codexSel !== i) SFX.click();
      codexSel = i;
      return;
    }
  }
}

function openCodex(from) {
  codexReturn = from;
  codexTab = 'plant';
  codexSel = 0;
  mode = 'codex';
  if (!G) G = { time: codexTime, grain: [] };
}

    ctx.font = '18px monospace';
    ctx.fillText('你也被记住了', W / 2, H / 2 + 10);
    ctx.fillStyle = 'rgba(240, 230, 150, 0.9)';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('[ 点击重新开始 ]', W / 2, H / 2 + 80);
  }

  if (G.win) {
    ctx.fillStyle = 'rgba(5, 4, 2, 0.85)';
    ctx.fillRect(0, 0, W, H);
    const winText = {
      1:'1-1 通关', 2:'1-2 通关', 3:'1-3 通关', 4:'1-4 通关', 5:'1-5 通关',
      6:'1-6 通关', 7:'1-7 通关', 8:'1-8 通关', 9:'1-9 通关'
    };
    ctx.fillStyle = '#e8dc8a';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(winText[G.level], W / 2, H / 2 - 70);

    const plantKey = getPlantUnlockedByLevel(G.level);
    if (plantKey) {
      const info = INTRO_INFO[plantKey];
      ctx.fillStyle = '#c8b860';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('获得：' + info.name, W / 2, H / 2 - 15);
      ctx.fillStyle = 'rgba(200, 180, 120, 0.7)';
      ctx.font = '14px monospace';
      for (let i = 0; i < info.lines.length; i++) {
        ctx.fillText(info.lines[i], W / 2, H / 2 + 20 + i * 26);
      }
    } else {
      ctx.fillStyle = 'rgba(200, 180, 120, 0.7)';
      ctx.font = '16px monospace';
      if (G.level === 8) {
        ctx.fillText('白色墙纸，红色地板。', W / 2, H / 2 + 20);
        ctx.fillText('这地方在重塑它记得的一切。', W / 2, H / 2 + 52);
      } else if (G.level === 9) {
        ctx.fillText('红色房间。', W / 2, H / 2 + 20);
        ctx.fillText('你终于走到了这里。', W / 2, H / 2 + 52);
      }
    }

    const nextText = G.level < 9 ? '[ 点击进入下一关 ]' : '[ 返回关卡选择 ]';
    ctx.fillStyle = 'rgba(240, 230, 150, 0.9)';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(nextText, W / 2, H / 2 + 130);

    ctx.fillStyle = 'rgba(140, 120, 60, 0.5)';
    ctx.font = '12px monospace';
    ctx.fillText('进度已自动保存', W / 2, H / 2 + 170);
  }
}

/* ============================================================
   颗粒 + 暗角
   ============================================================ */
function drawGrainVignette() {
  if (!G) return;
  ctx.globalAlpha = 1;
  for (const g of G.grain) {
    ctx.fillStyle = 'rgba(230, 215, 160, ' + g.a + ')';
    ctx.fillRect(g.x, g.y, g.s, g.s);
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(140, 120, 50, 0.03)';
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   主循环
   ============================================================ */
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (mode === 'game' && G && !G.over && !G.win) update(dt);
  else if (mode === 'plantintro') introTimer += dt;
  else if (mode === 'codex') { codexTime += dt; if (G) G.time = codexTime; }
  render(now);
  requestAnimationFrame(loop);
}

loadProgress();
requestAnimationFrame(loop);

})();
</script>
