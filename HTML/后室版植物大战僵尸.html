<!DOCTYPE html>

<body>
<canvas id="canvas" width="960" height="620"></canvas>
<script>
(function() {
"use strict";

/* ============================================================
   存档
   ============================================================ */
const SAVE_KEY = 'backrooms_pvz_save_v3';
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ maxCompleted, peaIntroSeen })); } catch(e) {}
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.maxCompleted === 'number' && data.maxCompleted >= 0 && data.maxCompleted <= 9) maxCompleted = data.maxCompleted;
    if (data.peaIntroSeen) peaIntroSeen = true;
  } catch(e) {}
}

/* ============================================================
   全局
   ============================================================ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 960, H = 620;
const FIELD_TOP = 80, FIELD_H = 540;
const CELL_W = 80, CELL_H = 96, COLS = 9;

let mode = 'menu';
let maxCompleted = 0;
let peaIntroSeen = false;
let G = null;
let lastTime = performance.now();
let mouseX = 0, mouseY = 0;
let rows = 1, gridX = 0, gridY = 0;
let obstacles = [];

let introPlantKey = null;
let introNextLevel = 1;
let introTimer = 0;

/* 传送带布局 */
const CV_BASE_X = 20;
const CV_CARD_W = 66;
const CV_MAX = 15;
const CV_ENTRY_X = W + 40;
const CV_SPEED = 120;

/* ============================================================
   介绍文本
   ============================================================ */

  sun: { name: '静物向日葵', lines: ['愈发厚实的花瓣和空洞的神情。','更难被撕碎，但被撕碎时会泄露光芒。'] },

/* ============================================================
   实体
   ============================================================ */
const ZDEF = {

const PLANT_COOLDOWN = { pea:5, sun:5, cherry:15, wall:25, potato:35, ice:10, chomper:15, repeater:10 };

/* ============================================================
   数值总表
   —— 战斗逻辑与「静物图鉴」共用这一份数据：
      改这里的数值 = 同时改战斗表现与图鉴说明，两边不会再对不上。
   ============================================================ */
const PEA      = { dmg:25, cd:1.5, chainChance:0.25, chainCd:0.25 };

/* 传送带（1-9）：阈值累进 —— 数值即「小于该值时抽到该卡片」 */
const CV_WEIGHTS = [['pea',0.26],['wall',0.38],['chomper',0.50],['repeater',0.72],['cherry',0.82],['ice',0.96],['potato',1]];
const CV_INTERVAL = { base:2.2, per:1.6, div:5 };

/* 植物生命值 / 种植时的初始计时器（豌豆、寒冰、大嘴花、双发为首次攻击间隔） */

const PLANT_INIT_TIMER = {

};

function getUnlocked() {
  return {
    pea:true,
    sun:     maxCompleted >= 1,
    cherry:  maxCompleted >= 2,
    wall:    maxCompleted >= 3,
    potato:  maxCompleted >= 4,
    ice:     maxCompleted >= 5,
    chomper: maxCompleted >= 6,
    repeater:maxCompleted >= 7
  };
}

function getPlantUnlockedByLevel(level) {
  const map = { 1:'sun', 2:'cherry', 3:'wall', 4:'potato', 5:'ice', 6:'chomper', 7:'repeater' };
  return map[level] || null;
}

/* ============================================================
   关卡配置
   ============================================================ */
function getLevelConfig(level) {
  switch(level) {
    case 1: return { rows:1, obstacles:[] };
    case 2: return { rows:3, obstacles:[] };
    case 3: return { rows:5, obstacles:[] };
    case 4: return { rows:5, obstacles:[{r:1,c:2},{r:1,c:5},{r:3,c:1},{r:3,c:4},{r:3,c:7}] };
    case 5: return { rows:5, obstacles:[{r:0,c:3},{r:0,c:6},{r:2,c:1},{r:2,c:4},{r:2,c:7},{r:4,c:2},{r:4,c:5}] };
    case 6: return { rows:5, obstacles:[{r:0,c:2},{r:0,c:6},{r:1,c:4},{r:2,c:0},{r:2,c:8},{r:3,c:4},{r:4,c:2},{r:4,c:6}] };
    case 7: return { rows:5, obstacles:[{r:0,c:1},{r:0,c:4},{r:0,c:7},{r:1,c:3},{r:1,c:6},{r:2,c:0},{r:2,c:5},{r:2,c:8},{r:3,c:2},{r:3,c:7},{r:4,c:1},{r:4,c:4}] };
    case 8: return { rows:5, obstacles:[{r:0,c:0},{r:0,c:3},{r:0,c:6},{r:1,c:2},{r:1,c:5},{r:1,c:8},{r:2,c:1},{r:2,c:4},{r:2,c:7},{r:3,c:0},{r:3,c:3},{r:3,c:6},{r:4,c:2},{r:4,c:5},{r:4,c:8}] };
    case 9: return { rows:5, obstacles:[] };
    default: return { rows:5, obstacles:[] };
  }
}

/* ============================================================
   波次
   ============================================================ */
function buildSpawns(level) {
  const e = [];
  const add = (t, type, row) => e.push({ t, type, row });

  if (level === 1) {
    [15,32,50,68,86,105,124,145].forEach(t => add(t, 'wander', 0));
    return e;
  }
  if (level === 2) {
    add(15,'wander',1); add(28,'wander',0); add(42,'wander',2);
    add(56,'charge',1); add(72,'wander',0); add(88,'wander',2);
    add(104,'charge',1); add(120,'wander',0); add(138,'wander',2);
    add(156,'charge',2); add(174,'wander',1);
    return e;
  }
  if (level === 3) {
    [[12,'wander',2],[24,'wander',0],[36,'wander',4],[48,'conehead',1],[60,'wander',3],[72,'charge',2],
     [84,'wander',0],[96,'conehead',4],[108,'wander',1],[120,'charge',3],[132,'wander',2],[144,'conehead',0],
     [156,'wander',4],[168,'charge',1],[180,'wander',3],[192,'conehead',2],[204,'wander',0],[216,'wander',4]
    ].forEach(w => add(w[0],w[1],w[2]));
    return e;
  }
  if (level === 4) {
    [[12,'wander',2],[24,'conehead',1],[36,'wander',3],[48,'charge',0],[60,'wander',4],[72,'conesculpt',2],
     [84,'wander',1],[96,'conehead',3],[108,'charge',4],[120,'wander',0],[132,'conesculpt',2],[144,'wander',3],
     [156,'conehead',4],[168,'charge',0],[180,'wander',2],[192,'conesculpt',1],[204,'wander',3],[216,'conehead',4],
     [228,'charge',0],[240,'wander',2]
    ].forEach(w => add(w[0],w[1],w[2]));
    for (let i = 0; i < 4; i++) add(220 + i*4, i%2===0?'charge':'wander', i%5);
    e.sort((a,b)=>a.t-b.t);
    return e;
  }
  if (level === 5) {
    [[12,'conehead',2],[22,'charge',0],[32,'wander',3],[42,'conesculpt',1],[52,'wander',4],[62,'bucket',2],
     [72,'conehead',0],[82,'charge',3],[92,'wander',1],[102,'conesculpt',4],[112,'bucket',2],[122,'conehead',0],
     [132,'wander',3],[142,'charge',1],[152,'bucket',4],[162,'conesculpt',2],[172,'conehead',0],[182,'wander',3],
     [192,'charge',1],[202,'bucket',4],[212,'conesculpt',2],[222,'conehead',0],[232,'wander',3],[242,'bucket',1]
    ].forEach(w => add(w[0],w[1],w[2]));
    for (let i = 0; i < 8; i++) {
      const types = ['charge','wander','conehead','conesculpt'];
      add(225 + i*3, types[i%types.length], i%5);
    }
    e.sort((a,b)=>a.t-b.t);
    return e;
  }
  if (level === 6) {
    [[12,'conehead',1],[22,'charge',3],[32,'wander',0],[42,'bucket',2],[52,'conesculpt',4],[62,'runner',1],
     [72,'conehead',3],[82,'wander',0],[92,'bucket',2],[102,'conesculpt',4],[112,'charge',1],[122,'runner',3],
     [132,'bucket',0],[142,'wander',2],[152,'conesculpt',4],[162,'charge',1],[172,'runner',3],[182,'conehead',0],
     [192,'wander',2],[202,'bucket',4],[212,'conesculpt',1],[222,'runner',3],[232,'bucket',0],[242,'conehead',2],
     [252,'wander',4],[262,'charge',1],[272,'bucket',3]
    ].forEach(w => add(w[0],w[1],w[2]));
    for (let i = 0; i < 14; i++) {
      const types = ['runner','charge','conehead','wander','bucket'];
      add(245 + i*2.5, types[i%types.length], i%5);
    }
    e.sort((a,b)=>a.t-b.t);
    return e;
  }
  if (level === 7) {
    [[12,'runner',1],[22,'bucketperson',3],[32,'charge',0],[42,'bucket',2],[52,'conehead',4],[62,'runner',1],
     [72,'conesculpt',3],[82,'bucketperson',0],[92,'charge',2],[102,'runner',4],[112,'bucket',1],[122,'conehead',3],
     [132,'bucketperson',0],[142,'conesculpt',2],[152,'runner',4],[162,'charge',1],[172,'bucket',3],[182,'conehead',0],
     [192,'bucketperson',2],[202,'runner',4],[212,'charge',1],[222,'bucket',3],[232,'conesculpt',0],[242,'runner',2]
    ].forEach(w => add(w[0],w[1],w[2]));
    for (let i = 0; i < 18; i++) {
      const types = ['runner','bucketperson','bucket','charge','conehead'];
      add(240 + i*2.5, types[i%types.length], i%5);
    }
    e.sort((a,b)=>a.t-b.t);
    return e;
  }
  if (level === 8) {
    [[12,'runner',1],[22,'bucketperson',3],[32,'charge',0],[42,'bucket',2],[52,'conehead',4],[62,'runner',1],
     [72,'conesculpt',3],[82,'bucketperson',0],[92,'charge',2],[102,'runner',4],[112,'bucket',1],[122,'conehead',3],
     [132,'bucketperson',0],[142,'conesculpt',2],[152,'runner',4],[162,'charge',1],[172,'bucket',3],[182,'conehead',0],
     [192,'bucketperson',2],[202,'runner',4],[212,'charge',1],[222,'bucket',3],[232,'conesculpt',0],[242,'runner',2],
     [252,'bucketperson',4],[262,'conehead',1],[272,'bucket',3],[282,'charge',0],[292,'runner',2],[302,'conesculpt',4],
     [312,'bucketperson',1],[322,'bucket',3]
    ].forEach(w => add(w[0],w[1],w[2]));
    for (let i = 0; i < 22; i++) {
      const types = ['runner','bucketperson','bucket','charge','conehead','conesculpt'];
      add(280 + i*2, types[i%types.length], i%5);
    }
    e.sort((a,b)=>a.t-b.t);
    return e;
  }
      if (level === 9) {
    // ====== 传送带关卡 · 随机点尸潮 · 多点突进（降量版） ======
    const HORDE_TYPES = ['runner','bucketperson','bucket','charge','conehead','conesculpt'];
    const RUSH_TYPES  = ['runner','charge'];

    let rowBag = [];
    const randRow = () => {
      if (rowBag.length === 0) {
        rowBag = [0,1,2,3,4];
        for (let i = rowBag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = rowBag[i]; rowBag[i] = rowBag[j]; rowBag[j] = tmp;
        }
      }
      return rowBag.pop();
    };

    const randType = (rushBias) => {
      if (Math.random() < rushBias) return RUSH_TYPES[Math.floor(Math.random() * RUSH_TYPES.length)];
      return HORDE_TYPES[Math.floor(Math.random() * HORDE_TYPES.length)];
    };

    const jitter = (base, spread) => base + (Math.random() - 0.5) * spread;

    // ---------- 开场：逐步升温 ----------
    let t = 8;
    for (let i = 0; i < 20; i++) {
      add(t, randType(0.28), randRow());
      t += jitter(6.5, 3.0);
    }

    // ---------- 第一轮尸潮：全线随机压上 ----------
    t = 155;
    for (let i = 0; i < 55; i++) {
      add(t, randType(0.35), randRow());
      t += jitter(1.5, 1.0);
    }
    // 叠加层：突进为主
    t = 178;
    for (let i = 0; i < 25; i++) {
      add(t, randType(0.68), randRow());
      t += jitter(1.3, 0.8);
    }

    // ---------- 第二轮尸潮：更密、更多突进 ----------
    t = 220;
    for (let i = 0; i < 65; i++) {
      add(t, randType(0.42), randRow());
      t += jitter(1.15, 0.8);
    }
    // 突进叠加层
    t = 236;
    for (let i = 0; i < 32; i++) {
      add(t, randType(0.75), randRow());
      t += jitter(1.0, 0.7);
    }

    // ---------- 最终尸潮：全面涌出 ----------
    t = 285;
    for (let i = 0; i < 80; i++) {
      add(t, randType(0.48), randRow());
      t += jitter(0.9, 0.65);
    }
    // 最后一波纯突进
    t = 300;
    for (let i = 0; i < 45; i++) {
      add(t, randType(0.82), randRow());
      t += jitter(0.75, 0.55);
    }

    e.sort((a, b) => a.t - b.t);
    return e;
  }
  return e;
}

/* ============================================================
   初始化关卡
   ============================================================ */
function startLevel(level) {
  mode = 'game';
  const cfg = getLevelConfig(level);
  rows = cfg.rows;
  obstacles = cfg.obstacles || [];
  gridX = (W - COLS * CELL_W) / 2;
  gridY = FIELD_TOP + (FIELD_H - rows * CELL_H) / 2;

  const cooldowns = {};
  for (const k in PLANT_COOLDOWN) cooldowns[k] = 0;

  G = {
    level,
    glow: GLOW.start,
    plants: [], zombies: [], shots: [], particles: [], pickups: [], explosions: [],
    time: 0, last: performance.now(),
    over: false, win: false, winTimer: 0, winHandled: false,
    sel: null, selConveyorId: null, shovelSelected: false,
    spawns: buildSpawns(level), spawnIdx: 0, dropTimer: GLOW.dropFirst,
    shake: 0, grain: [],
    unlocked: getUnlocked(),
    cooldowns,
    conveyor: [],
    conveyorTimer: 1.5,
    conveyorNextId: 1
  };

  for (let i = 0; i < 260; i++) {
    G.grain.push({
      x: Math.random() * W,
      y: Math.random() * H,
      a: Math.random() * 0.06,
      s: Math.random() * 1.6 + 0.4
    });
  }
  ambientStart(level);
}

/* ============================================================
   种子栏
   ============================================================ */
function getSeeds() {
  if (G.level === 9) return [];
  const s = [];
  let x = 20;
  const add = (key, name, cost) => { s.push({ key, name, cost, x }); x += 80; };
  if (G.unlocked.pea)      add('pea','静物豌豆',100);
  if (G.unlocked.sun)      add('sun','静物向日葵',50);
  if (G.unlocked.cherry)   add('cherry','静物樱桃',75);
  if (G.unlocked.wall)     add('wall','静物坚果',50);
  if (G.unlocked.potato)   add('potato','静物土豆雷',25);
  if (G.unlocked.ice)      add('ice','静物寒冰',250);
  if (G.unlocked.chomper)  add('chomper','静物大嘴花',100);
  if (G.unlocked.repeater) add('repeater','静物双发',200);
  return s;
}

function getShovelRect() {
  if (G.level === 9) return { x: W - 90, y: 4, w: 64, h: 72 };
  const seeds = getSeeds();
  const lastX = seeds.length > 0 ? seeds[seeds.length - 1].x + 80 : 20;
  return { x: lastX + 10, y: 4, w: 64, h: 72 };
}

/* ============================================================
   事件
   ============================================================ */
canvas.addEventListener('click', e => {
  audioInit();                       /* 首次点击时唤醒音频（浏览器要求手势） */
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  if (mode === 'menu') handleMenuClick(x, y);
  else if (mode === 'levelselect') handleLevelSelectClick(x, y);
  else if (mode === 'plantintro') handleIntroClick(x, y);
  else if (mode === 'codex') handleCodexClick(x, y);
  else handleGameClick(x, y);
});

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});

function inRect(x, y, rx, ry, rw, rh) {
  return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
}

function handleMenuClick(x, y) {
  if (inRect(x, y, 330, 366, 300, 56)) { SFX.click(); mode = 'levelselect'; return; }
  if (inRect(x, y, 330, 432, 300, 56)) {
    const lvl = Math.min(9, maxCompleted + 1);
    if (lvl === 1 && !peaIntroSeen) {
      peaIntroSeen = true; saveProgress();
      introPlantKey = 'pea'; introNextLevel = 1;
      mode = 'plantintro'; introTimer = 0;
      return;
    }
    startLevel(lvl);
    return;
  }
  if (inRect(x, y, 330, 498, 300, 56)) { openCodex('menu'); return; }
  if (inRect(x, y, 330, 564, 300, 40)) { maxCompleted = 9; saveProgress(); return; }
}

function handleLevelSelectClick(x, y) {
  for (let i = 0; i < 9; i++) {
    const col = i % 5;
    const row = Math.floor(i / 5);
    const bx = 130 + col * 145;
    const by = 175 + row * 125;
    if (inRect(x, y, bx, by, 125, 100)) {
      const lvl = i + 1;
      if (lvl === 1 || maxCompleted >= lvl - 1) {
        if (lvl === 1 && !peaIntroSeen) {
          peaIntroSeen = true; saveProgress();
          introPlantKey = 'pea'; introNextLevel = 1;
          mode = 'plantintro'; introTimer = 0;
          return;
        }
        startLevel(lvl);
      }
      return;
    }
  }
  if (inRect(x, y, 80, 540, 200, 50)) { openCodex('levelselect'); return; }
  if (inRect(x, y, 380, 540, 200, 50)) { mode = 'menu'; return; }
  if (inRect(x, y, W - 220, H - 60, 200, 40)) { maxCompleted = 9; saveProgress(); return; }
}

function handleIntroClick(x, y) {
  if (inRect(x, y, 380, 540, 200, 50)) startLevel(introNextLevel);
}

function handleGameClick(x, y) {
  if (G.over || G.win) {
    if (G.over) startLevel(G.level);
    else if (G.win && !G.winHandled) {
      G.winHandled = true;
      if (G.level < 9) {
        const plantKey = getPlantUnlockedByLevel(G.level);
        if (plantKey) {
          introPlantKey = plantKey;
          introNextLevel = G.level + 1;
          mode = 'plantintro';
          introTimer = 0;
        } else startLevel(G.level + 1);
      } else mode = 'levelselect';
    }
    return;
  }

  // 收集荧光灯
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    if (Math.hypot(p.x - x, p.y - y) < 34) {
      G.glow += p.amount;
      SFX.pickup();
      for (let k = 0; k < 8; k++) {
        G.particles.push({
          x:p.x, y:p.y,
          vx:(Math.random()-0.5)*160, vy:(Math.random()-0.5)*160,
          life:0.6, max:0.6, c:'#e8dc8a', r:3
        });
      }
      G.pickups.splice(i, 1);
      return;
    }
  }

  // 铲子
  const shovel = getShovelRect();
  if (inRect(x, y, shovel.x, shovel.y, shovel.w, shovel.h)) {
    G.shovelSelected = !G.shovelSelected;
    SFX.click();
    if (G.shovelSelected) { G.sel = null; G.selConveyorId = null; }
    return;
  }
  // 音效开关
  const sbtn = soundBtnRect();
  if (inRect(x, y, sbtn.x, sbtn.y, sbtn.w, sbtn.h)) {
    toggleMute();
    SFX.click();
    return;
  }

  // 传送带卡片
  if (G.level === 9) {
    for (const c of G.conveyor) {
      if (x >= c.x && x <= c.x + 60 && y >= 4 && y <= 76) {
        if (G.selConveyorId === c.id) { G.sel = null; G.selConveyorId = null; }
        else { G.sel = c.key; G.selConveyorId = c.id; }
        G.shovelSelected = false;
        SFX.click();
        return;
      }
    }
  } else {
    const seeds = getSeeds();
    for (const s of seeds) {
      if (inRect(x, y, s.x, 4, 64, 72)) {
        const cd = G.cooldowns[s.key] || 0;
        if (G.glow >= s.cost && cd <= 0) {
          G.sel = (G.sel === s.key) ? null : s.key;
          G.selConveyorId = null;
          G.shovelSelected = false;
          SFX.click();
        }
        return;
      }
    }
  }

  // 铲除
  if (G.shovelSelected) {
    const col = Math.floor((x - gridX) / CELL_W);
    const row = Math.floor((y - gridY) / CELL_H);
    const plant = G.plants.find(p => p.row === row && p.col === col && !p.dead);
    if (plant) {
      plant.dead = true;
      SFX.shovel();
      for (let i = 0; i < 12; i++) {
        G.particles.push({
          x: plant.x + CELL_W/2, y: plant.y + CELL_H/2,
          vx:(Math.random()-0.5)*180, vy:(Math.random()-0.5)*180,
          life:0.5, max:0.5, c:'#a89860', r:3
        });
      }
    }
    G.shovelSelected = false;
    return;
  }

  // 种植
  if (G.sel) {
    const col = Math.floor((x - gridX) / CELL_W);
    const row = Math.floor((y - gridY) / CELL_H);
    if (col >= 0 && col < COLS && row >= 0 && row < rows) {
      const blocked = obstacles.some(o => o.r === row && o.c === col);
      const occupied = G.plants.some(p => p.row===row && p.col===col && !p.dead);
      if (!blocked && !occupied) {
        if (G.level === 9) {
          plantAt(G.sel, row, col, true);
          G.conveyor = G.conveyor.filter(c => c.id !== G.selConveyorId);
        } else {
          plantAt(G.sel, row, col, false);
        }
      }
    }
    G.sel = null;
    G.selConveyorId = null;
  }
}

/* ============================================================
   种植
   ============================================================ */
function plantAt(type, row, col, free) {
  if (!free) {
    const cost = PLANT_COST[type];
    if (G.glow < cost) return;
    if ((G.cooldowns[type] || 0) > 0) return;
    G.glow -= cost;
    G.cooldowns[type] = PLANT_COOLDOWN[type];
  }
  let hp = PLANT_HP[type] !== undefined ? PLANT_HP[type] : 300;
  let timer = PLANT_INIT_TIMER[type] !== undefined ? PLANT_INIT_TIMER[type] : PEA.cd;
  if (type === 'sun') timer += Math.random() * SUN.firstVar;
  G.plants.push({
    type, row, col,
    x: gridX + col * CELL_W, y: gridY + row * CELL_H,
    hp, maxHp: hp, timer,
    dmgAcc: 0, bob: Math.random() * Math.PI * 2,
    flash: 0, dead: false, chained: false,
    muzzle: 0, frost: 0,
    aoeTimer: type === 'ice' ? ICE.firstAoe : 0
  });
  for (let i = 0; i < 10; i++) {
    G.particles.push({
      x: gridX + col*CELL_W + CELL_W/2, y: gridY + row*CELL_H + CELL_H/2,
      vx:(Math.random()-0.5)*90, vy:(Math.random()-0.5)*90,
      life:0.5, max:0.5, c:'#b8a86a', r:2
    });
  }
  SFX.plant();
}

/* ============================================================
   生成
   ============================================================ */
function spawnZombie(type, row) {
  const d = ZDEF[type];
  const totalHp = d.base + d.critHp;
  G.zombies.push({
    type, row,
    x: W + 40 + Math.random() * 60,
    hp: totalHp, maxHp: totalHp,
    armor: d.armor || 0, maxArmor: d.armor || 0,
    critHp: d.critHp, atk: d.atk, atkCd: d.atkCd, speed: d.speed,
    critical: false, atkTimer: 0,
    seed: Math.random() * 100, dead: false,
    frozen: 0, slowed: 0, hasAttacked: false, lastTarget: null
  });
}

function spawnGlowPickup(x, y, amount) {
  G.pickups.push({ x, y, startY: y, amount, life: GLOW.pickupLife, vy: -70, vx: (Math.random()-0.5)*60, state: 'pop' });
}

function spawnNaturalGlow() {
  const x = gridX + 50 + Math.random() * (COLS * CELL_W - 100);
  SFX.glowSpawn();
  G.pickups.push({
    x, y: FIELD_TOP + 15, startY: FIELD_TOP + 15,
    targetY: gridY + 40 + Math.random() * (rows * CELL_H - 80),
    amount: GLOW.dropAmount, life: GLOW.dropLife, vy: 0, vx: 0, state: 'fall'
  });
}

/* ============================================================
   伤害 / 状态
   ============================================================ */
function createExplosion(px, py, dmg, radius, isAsh) {
  G.explosions.push({ x: px, y: py, r: 0, maxR: radius, life: 0.55, max: 0.55, dmg, dealt: false, isAsh: !!isAsh });
  G.shake = 0.5;
  SFX.boom(!!isAsh);
}

function applyAshDamage(z, dmg) {
  if (z.hp <= dmg) { z.hp = 0; z.dead = true; return true; }
  z.hp -= dmg;
  if (z.hp <= 0) { z.dead = true; return true; }
  return false;
}

function applyFreeze(z, freezeDur, slowDur) {
  z.frozen = Math.max(z.frozen, freezeDur);
  z.slowed = Math.max(z.slowed, freezeDur + slowDur);
}
function applySlow(z, slowDur) { z.slowed = Math.max(z.slowed, slowDur); }

function iceShooterAoe(p) {
  for (let c = p.col; c <= p.col + (ICE.aoeCols - 1); c++) {
    if (c < 0 || c >= COLS) continue;
    const cellX = gridX + c * CELL_W;
    for (let r = p.row - 1; r <= p.row + (ICE.aoeRows - 2); r++) {
      if (r < 0 || r >= rows) continue;
      for (const z of G.zombies) {
        if (z.dead || z.row !== r) continue;
        if (z.x >= cellX - 20 && z.x <= cellX + CELL_W + 20) {
          z.hp -= ICE.aoeDmg;
          applySlow(z, ICE.aoeSlow);
          if (z.hp <= 0 && !z.critical) z.dead = true;
        }
      }
    }
  }
}

function potatoSecondaryExplosion(p) {
  const candidates = G.zombies.filter(z =>
    !z.dead && !(z.row === p.row && Math.abs(z.x - (p.x + CELL_W/2)) < CELL_W)
  );
  if (candidates.length === 0) {
    createExplosion(p.x + CELL_W/2, p.y + CELL_H/2, POTATO.dmg, POTATO.radius, false);
    return;
  }
  let minX = Infinity;
  for (const z of candidates) if (z.x < minX) minX = z.x;
  const leftmost = candidates.filter(z => z.x <= minX + 20);
  const target = leftmost[Math.floor(Math.random() * leftmost.length)];
  createExplosion(target.x, gridY + target.row * CELL_H + CELL_H/2, POTATO.dmg, POTATO.radius, false);
}

/* ============================================================
   更新
   ============================================================ */
function update(dt) {
  if (G.over || G.win) return;
  G.time += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 4);

  for (const k in G.cooldowns) if (G.cooldowns[k] > 0) G.cooldowns[k] = Math.max(0, G.cooldowns[k] - dt);

  while (G.spawnIdx < G.spawns.length && G.spawns[G.spawnIdx].t <= G.time) {
    const s = G.spawns[G.spawnIdx++];
    spawnZombie(s.type, s.row);
  }

  /* ============ 传送带：排队留存机制 ============ */
  if (G.level === 9) {
    // 卡片向自己的槽位移动，到达后停下
    G.conveyor.forEach((c, i) => {
      const targetX = CV_BASE_X + i * CV_CARD_W;
      if (c.x > targetX) {
        c.x = Math.max(targetX, c.x - CV_SPEED * dt);
      }
    });

    // 选中卡片被移除时清空选择
    if (G.selConveyorId) {
      const still = G.conveyor.find(c => c.id === G.selConveyorId);
      if (!still) { G.sel = null; G.selConveyorId = null; }
    }

    // 生成新卡片——仅当最后一张已到位
    G.conveyorTimer -= dt;
    if (G.conveyorTimer <= 0 && G.conveyor.length < CV_MAX) {
      const idx = G.conveyor.length;
      const prevTargetX = idx > 0 ? CV_BASE_X + (idx - 1) * CV_CARD_W : -Infinity;
      const lastCard = G.conveyor[idx - 1];
      if (!lastCard || lastCard.x <= prevTargetX + 5) {
        const r = Math.random();
        let key = CV_WEIGHTS[CV_WEIGHTS.length - 1][0];
        for (const w of CV_WEIGHTS) { if (r < w[1]) { key = w[0]; break; } }
        G.conveyor.push({ key, x: CV_ENTRY_X, id: G.conveyorNextId++ });
        SFX.conveyor();
        G.conveyorTimer = CV_INTERVAL.base + (G.conveyor.length / CV_INTERVAL.div) * CV_INTERVAL.per;
      }
    }
  } else {
    G.dropTimer -= dt;
    if (G.dropTimer <= 0) {
      G.dropTimer = GLOW.dropMin + Math.random() * GLOW.dropVar;
      spawnNaturalGlow();
    }
  }

  // 爆炸
  for (const ex of G.explosions) {
    ex.life -= dt;
    ex.r = ex.maxR * (1 - ex.life / ex.max);
    if (!ex.dealt && ex.life < ex.max * 0.7) {
      ex.dealt = true;
      for (const z of G.zombies) {
        if (z.dead) continue;
        const zx = z.x, zy = gridY + z.row * CELL_H + CELL_H/2;
        if (Math.hypot(zx - ex.x, zy - ex.y) < ex.maxR) {
          let killed;
          if (ex.isAsh) killed = applyAshDamage(z, ex.dmg);
          else {
            if (z.armor > 0) {
              const ab = Math.min(z.armor, ex.dmg);
              z.armor -= ab;
              const lo = ex.dmg - ab;
              if (lo > 0) z.hp -= lo;
            } else z.hp -= ex.dmg;
            killed = z.hp <= 0 && !z.critical;
            if (killed) z.dead = true;
          }
          if (killed) {
            for (let i = 0; i < 20; i++) {
              G.particles.push({
                x: zx, y: zy,
                vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260,
                life:0.8, max:0.8, c:'#6a5a3a', r:3
              });
            }
          }
        }
      }
    }
  }
  G.explosions = G.explosions.filter(e => e.life > 0);

  // 植物
  for (const p of G.plants) {
    if (p.dead) continue;
    if (p.flash > 0) p.flash -= dt;
    /* 纯表现用计时器：枪口闪光 / 寒气扩散（不参与任何战斗判定） */
    if (p.muzzle > 0) p.muzzle -= dt;
    if (p.frost > 0) p.frost -= dt;

    if (p.type === 'pea') {
      p.timer -= dt;
      if (p.timer <= 0) {
        const target = G.zombies.find(z => z.row === p.row && !z.dead && z.x > p.x - 10);
        if (target) {
          const tip = artMuzzleTip(p);   /* 发射点 = 画稿的枪口 */
          p.muzzle = 0.14;
          SFX.shoot();
          G.shots.push({ x: tip.x, y: tip.y, row: p.row, dmg: PEA.dmg, speed: SHOT_SPEED, ice: false });
          if (Math.random() < PEA.chainChance) { p.timer = PEA.chainCd; p.chained = true; }
          else { p.timer = PEA.cd; p.chained = false; }
        } else p.timer = 0.08;
      }
    }

    if (p.type === 'sun') {
      p.timer -= dt;
      if (p.timer <= 0) { p.timer = SUN.cd; SFX.glowSpawn(); spawnGlowPickup(p.x + CELL_W/2, p.y + CELL_H/2, SUN.glow); }
    }

    if (p.type === 'ice') {
      p.timer -= dt;
      if (p.timer <= 0) {
        const target = G.zombies.find(z => z.row === p.row && !z.dead && z.x > p.x - 10);
        if (target) {
          const tip = artMuzzleTip(p);   /* 发射点 = 画稿的枪口 */
          p.muzzle = 0.14;
          SFX.shootIce();
          G.shots.push({ x: tip.x, y: tip.y, row: p.row, dmg: ICE.dmg, speed: ICE_SHOT_SPEED, ice: true });
          p.timer = ICE.cd;
        } else p.timer = 0.1;
      }
      p.aoeTimer -= dt;
      if (p.aoeTimer <= 0) { p.aoeTimer = ICE.aoeCd; p.frost = ICE_FROST_LIFE; SFX.frost(); iceShooterAoe(p); }
    }

    if (p.type === 'potato' && p.timer > 0) p.timer -= dt;

    if (p.type === 'chomper') {
      p.timer -= dt;
      if (p.timer <= 0) {
        const target = G.zombies.find(z => z.row === p.row && !z.dead && z.x > p.x + 10 && z.x < p.x + CELL_W * CHOMPER.range);
        if (target) {
          const canSwallow = target.hp < target.maxHp / CHOMPER.swallowDiv || target.hp < CHOMPER.swallowHp;
          if (canSwallow) {
            target.hp = 0; target.armor = 0; target.dead = true;
            SFX.swallow();
            p.hp -= CHOMPER.selfCost;
            p.flash = 0.2;
            if (p.hp <= 0) p.dead = true;
            for (let i = 0; i < 16; i++) {
              G.particles.push({
                x: target.x, y: gridY + target.row*CELL_H + CELL_H/2,
                vx:(Math.random()-0.5)*220, vy:(Math.random()-0.5)*220,
                life:0.5, max:0.5, c:'#5a3a2a', r:3
              });
            }
          } else {
            if (target.armor > 0) {
              const ab = Math.min(target.armor, CHOMPER.dmg);
              target.armor -= ab;
              const lo = CHOMPER.dmg - ab;
              if (lo > 0) target.hp -= lo;
            } else target.hp -= CHOMPER.dmg;
            if (target.hp <= 0 && !target.critical) target.dead = true;
            p.flash = 0.1;
            SFX.biteBig();
          }
          p.timer = CHOMPER.cd;
        } else p.timer = 0.05;
      }
    }

    if (p.type === 'repeater') {
      p.timer -= dt;
      if (p.timer <= 0) {
        const target = G.zombies.find(z => z.row === p.row && !z.dead && z.x > p.x - 10);
        if (target) {
          const tip = artMuzzleTip(p);   /* 发射点 = 画稿的枪口 */
          p.muzzle = 0.14;
          SFX.shootDouble();
          for (let k = 0; k < REPEATER.pellets; k++) {
            G.shots.push({
              x: tip.x + k * 16,
              y: tip.y - k * 2,
              row: p.row, dmg: REPEATER.dmg, speed: SHOT_SPEED, ice: false, repeater: true
            });
          }
          p.timer = REPEATER.cd;
        } else p.timer = 0.08;
      }
    }
  }

  // 子弹
  for (const s of G.shots) {
    if (s.splash) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) { s.dead = true; continue; }
      for (const z of G.zombies) {
        if (z.dead) continue;
        const zy = gridY + z.row * CELL_H + CELL_H/2;
        if (Math.hypot(z.x - s.x, zy - s.y) < 30) {
          z.hp -= s.dmg;
          SFX.hit();
          if (z.hp <= 0 && !z.critical) { z.dead = true; SFX.die(); }
          s.dead = true;
          break;
        }
      }
      continue;
    }
    s.x += s.speed * dt;
    for (const z of G.zombies) {
      if (z.dead || z.row !== s.row) continue;
      if (s.x > z.x - 24 && s.x < z.x + 24) {
        if (z.armor > 0) {
          const ab = Math.min(z.armor, s.dmg);
          z.armor -= ab;
          const lo = s.dmg - ab;
          if (lo > 0) z.hp -= lo;
        } else z.hp -= s.dmg;

        if (s.ice) applyFreeze(z, ICE.freeze, ICE.slow);
        SFX.hit();
        if (s.ice) SFX.freeze();

        /* ============ 双发射手：分裂中心后移 ============ */
        if (s.repeater) {
          for (let i = 0; i < REPEATER.splashCount; i++) {
            const ang = Math.random() * Math.PI * 2;
            G.shots.push({
              x: s.x - 10,             // 后移，明显看出分裂
              y: s.y + (Math.random() - 0.5) * 8,
              vx: Math.cos(ang) * REPEATER.splashSpeed,
              vy: Math.sin(ang) * REPEATER.splashSpeed,
              dmg: REPEATER.splashDmg, splash: true,
              life: 10, maxLife: 10
            });
          }
        }

        s.dead = true;
        for (let i = 0; i < 5; i++) {
          G.particles.push({
            x:s.x, y:s.y,
            vx:(Math.random()-0.5)*130, vy:(Math.random()-0.5)*130,
            life:0.35, max:0.35,
            c: s.ice ? '#a8d8f0' : '#9ec878', r:2.5
          });
        }
        if (z.hp <= 0 && !z.critical) {
          z.dead = true;
          SFX.die();
          for (let i = 0; i < 14; i++) {
            G.particles.push({
              x: z.x, y: gridY + z.row*CELL_H + CELL_H/2,
              vx:(Math.random()-0.5)*220, vy:(Math.random()-0.5)*220,
              life:0.7, max:0.7, c:'#8a7a5a', r:3
            });
          }
        }
        break;
      }
    }
    if (s.x > W + 40) s.dead = true;
  }
  G.shots = G.shots.filter(s => !s.dead);

  // 僵尸
  for (const z of G.zombies) {
    if (z.dead) continue;
    if (z.frozen > 0) z.frozen -= dt;
    if (z.slowed > 0) z.slowed -= dt;

    if (!z.critical && z.frozen <= 0) {
      for (const p of G.plants) {
        if (p.dead || p.type !== 'potato') continue;
        if (p.timer > 0) continue;
        if (z.row !== p.row) continue;
        if (z.x > p.x + 8 && z.x < p.x + CELL_W - 8) {
          p.dead = true;
          createExplosion(p.x + CELL_W/2, p.y + CELL_H/2, POTATO.dmg, POTATO.radius, false);
          potatoSecondaryExplosion(p);
          break;
        }
      }
    }

    if (z.critical) {
      z.hp -= CRIT.bleed * dt;
      z.x -= z.speed * CRIT.speedMult * dt;
      if (z.hp <= 0) {
        z.dead = true;
        for (let i = 0; i < 16; i++) {
          G.particles.push({
            x: z.x, y: gridY + z.row*CELL_H + CELL_H/2,
            vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200,
            life:0.8, max:0.8, c:'#4a3a28', r:3
          });
        }
      }
      if (z.x < CRIT.failX) gameOver();
      continue;
    }

    if (z.frozen > 0) { if (z.x < CRIT.failX) gameOver(); continue; }

    const speedMult = z.slowed > 0 ? SLOW_MULT : 1;
    const atkMult   = z.slowed > 0 ? SLOW_MULT : 1;

    let target = null;
    const probe = z.x - BITE_PROBE;
    for (const p of G.plants) {
      if (p.dead || p.row !== z.row) continue;
      if (probe >= p.x && probe <= p.x + CELL_W) {
        if (z.type === 'runner' && z.hasAttacked && p !== z.lastTarget) continue;
        target = p;
        break;
      }
    }

    if (target) {
      if (z.type === 'runner' && !z.hasAttacked) { z.hasAttacked = true; z.lastTarget = target; }
      z.atkTimer -= dt * atkMult;
      if (z.atkTimer <= 0) {
        z.atkTimer = z.atkCd;
        let dmg = z.atk;
        if (target.type === 'wall') {
          const lost = target.maxHp - target.hp;
          const stacks = Math.floor(lost / WALL.drStep);
          const red = Math.min(WALL.drMax, stacks * WALL.drPerStep);
          dmg = z.atk * (1 - red);
        }
        target.hp -= dmg;
        target.flash = 0.14;
        SFX.bite();

        if (target.type === 'sun') {
          target.dmgAcc += dmg;
          while (target.dmgAcc >= SUN.dropPerHp) {
            target.dmgAcc -= SUN.dropPerHp;
            spawnGlowPickup(target.x + CELL_W/2, target.y + CELL_H/2, SUN.dropAmount);
          }
        }

        if (target.type === 'cherry' && target.hp <= 0 && !target.dead) {
          target.dead = true;
          createExplosion(target.x + CELL_W/2, target.y + CELL_H/2, CHERRY.dmg, CHERRY.radius, CHERRY.ash);
        } else if (target.type === 'potato' && target.hp <= 0 && !target.dead) {
          target.dead = true;
          if (target.timer <= 0) {
            createExplosion(target.x + CELL_W/2, target.y + CELL_H/2, POTATO.dmg, POTATO.radius, false);
            potatoSecondaryExplosion(target);
          }
        } else if (target.hp <= 0) {
          target.dead = true;
          for (let i = 0; i < 12; i++) {
            G.particles.push({
              x: target.x + CELL_W/2, y: target.y + CELL_H/2,
              vx:(Math.random()-0.5)*180, vy:(Math.random()-0.5)*180,
              life:0.6, max:0.6,
              c: target.type === 'sun' ? '#d8c878' : '#88a860', r:3
            });
          }
        }
      }
    } else {
      z.x -= z.speed * speedMult * dt;
    }

    if (z.critHp > 0 && z.hp <= z.critHp && !z.critical) {
      z.critical = true;
      G.shake = 0.15;
      SFX.critical();
    }

    if (z.x < CRIT.failX) gameOver();
  }

  G.plants = G.plants.filter(p => !p.dead && p.hp > 0);
  G.zombies = G.zombies.filter(z => !z.dead && z.hp > 0);

  for (const p of G.pickups) {
    p.life -= dt;
    if (p.state === 'pop') {
      p.vy += 240 * dt;
      p.y += p.vy * dt;
      p.x += p.vx * dt;
      if (p.y > p.startY && p.vy > 0) { p.y = p.startY; p.state = 'idle'; }
    } else if (p.state === 'fall') {
      p.y += 150 * dt;
      if (p.y >= p.targetY) { p.y = p.targetY; p.state = 'idle'; }
    }
  }
  G.pickups = G.pickups.filter(p => p.life > 0);

  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);

  if (G.spawnIdx >= G.spawns.length && G.zombies.length === 0 && !G.over) {
    G.winTimer += dt;
    if (G.winTimer > WIN_DELAY) {
      G.win = true;
      SFX.win();
      ambientStop();
      if (G.level > maxCompleted) { maxCompleted = G.level; saveProgress(); }
    }
  }
}

function gameOver() {
  if (G.over) return;
  G.over = true;
  G.shake = 1;
  SFX.gameOver();
  ambientStop();
}

  ctx.setTransform(1, 0, 0, 1, 0, 0);

/* ---------- 背景 ----------
   静态层离屏缓存（每关只画一次），动态灯光每帧叠加。
   这样墙面/地面可以画得很细，也不会每帧重复几千次路径。
   绘制期不使用 Math.random：所有"随机感"都来自 artNoise。 */
let bgCacheCv = null, bgCacheKey = '';

function bgRect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function bgGrad(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (const s of stops) gr.addColorStop(s[0], s[1]);
  return gr;
}
/* 一片不规则的污渍 / 霉斑 */
function bgStain(g, x, y, r, c, seed, blobs) {
  g.fillStyle = c;
  const n = blobs || 5;
  for (let i = 0; i < n; i++) {
    const a = artNoise(seed, i) * Math.PI * 2;
    const rr = r * (0.45 + artNoise(seed, i + 20) * 0.6);
    const d = r * artNoise(seed, i + 40) * 0.8;
    g.beginPath();
    g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, rr, rr * 0.78, a, 0, Math.PI * 2);
    g.fill();
  }
}
/* 从上往下淌的水痕 */
function bgDrip(g, x, y, len, w, c, seed) {
  g.strokeStyle = c;
  g.lineWidth = w;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x, y);
  g.quadraticCurveTo(x + (artNoise(seed, 1) - 0.5) * 10, y + len * 0.6, x + (artNoise(seed, 2) - 0.5) * 14, y + len);
  g.stroke();
}
/* 地面：瓷砖/地毯的接缝 + 脏迹 */
function bgFloor(g, x0, y0, x1, y1, tile, joint, seeds) {
  for (let y = y0; y < y1; y += tile) bgRect(g, x0, y, x1 - x0, 1.4, joint);
  for (let x = x0; x < x1; x += tile * 2) bgRect(g, x, y0, 1.2, y1 - y0, joint);
  for (let i = 0; i < seeds; i++) {
    const px = x0 + artNoise(i, 3) * (x1 - x0);
    const py = y0 + artNoise(i, 7) * (y1 - y0);
    bgStain(g, px, py, 10 + artNoise(i, 11) * 26, 'rgba(30,22,10,0.16)', i + 1, 4);
  }
}
/* 墙纸：竖条 + 隐约的花纹点 */
function bgWallpaper(g, y0, y1, base, stripe, dot, seed) {
  bgRect(g, 0, y0, W, y1 - y0, base);
  for (let x = 0; x < W; x += 28) bgRect(g, x, y0, 13, y1 - y0, stripe);
  g.fillStyle = dot;
  for (let i = 0; i < 220; i++) {
    const px = artNoise(seed, i) * W;
    const py = y0 + artNoise(seed, i + 300) * (y1 - y0);
    g.beginPath();
    g.ellipse(px, py, 2.2, 2.6, 0, 0, Math.PI * 2);
    g.fill();
  }
}
/* 墙脚线 */
function bgBaseboard(g, y, c1, c2) {
  bgRect(g, 0, y, W, 9, c1);
  bgRect(g, 0, y - 3, W, 3, c2);
  bgRect(g, 0, y + 9, W, 2, 'rgba(0,0,0,0.35)');
}

/* 墙脚线：墙只占场地以上那一条带子，种植格永远不会压到墙上 */
function bgFloorLine() {
  return Math.max(FIELD_TOP + 15, gridY - 15);
}

/* 场地：铺在地上的一块地毯 —— 与房间地面同一层，不做出立体台沿 */
function bgField(g, base, seam, joint, dirt) {
  const x = gridX - 12, w = COLS * CELL_W + 24;
  const y = Math.max(gridY - 12, bgFloorLine() + 2);   /* 绝不越过墙脚线 */
  const h = gridY + rows * CELL_H + 12 - y;
  dirt = dirt || 'rgba(20,14,6,0.32)';
  /* 毯面（不透明，但色调贴近地面，不跳出来） */
  bgRect(g, x, y, w, h, base);
  /* 受光：上浅下深，像被头顶灯管照着的一块地 */
  g.fillStyle = bgGrad(g, 0, y, 0, y + h,
    [[0, 'rgba(255,246,210,0.10)'], [0.45, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,0.16)']]);
  g.fillRect(x, y, w, h);
  /* 织纹：细斜纹，让毯面有材质 */
  g.strokeStyle = 'rgba(0,0,0,0.05)';
  g.lineWidth = 1;
  for (let i = -h; i < w; i += 7) {
    g.beginPath();
    g.moveTo(x + i, y);
    g.lineTo(x + i + h, y + h);
    g.stroke();
  }
  /* 格子织缝：浅，像踩出来的分格 */
  for (let c = 0; c <= COLS; c++) bgRect(g, gridX + c * CELL_W - 0.5, gridY, 1, rows * CELL_H, joint);
  for (let r = 0; r <= rows; r++) bgRect(g, gridX, gridY + r * CELL_H - 0.5, COLS * CELL_W, 1, joint);
  /* 毯边的包边：一条磨损线，不是黑框 */
  g.strokeStyle = seam;
  g.lineWidth = 2;
  g.strokeRect(x + 1, y + 1, w - 2, h - 2);
  g.strokeStyle = 'rgba(255,255,255,0.05)';
  g.lineWidth = 1;
  g.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7);
  /* 毯面上的磨损 */
  for (let i = 0; i < 18; i++) {
    const px = x + artNoise(i, 41) * w, py = y + artNoise(i, 42) * h;
    bgStain(g, px, py, 8 + artNoise(i, 43) * 22, 'rgba(26,18,8,0.16)', 900 + i, 4);
  }
  /* 边界上的脏迹：跨过毯边，让它"躺"在地上而不是贴上去 */
  for (let i = 0; i < 10; i++) {
    const onX = artNoise(i, 31) < 0.5;
    const px = onX ? x - 7 + artNoise(i, 32) * 14 : x + artNoise(i, 32) * w;
    const py = onX ? y + artNoise(i, 33) * h : y - 7 + artNoise(i, 33) * 14;
    bgStain(g, px, py, 10 + artNoise(i, 34) * 18, dirt, 950 + i, 4);
  }
}

function bgFishbone(g) {
  /* 鱼骨长廊：一整条混凝土肋骨，潮、暗、有回音 */
  const wallBot = bgFloorLine();
  bgRect(g, 0, FIELD_TOP, W, FIELD_H, '#14110a');
  /* 天花板 / 上墙 */
  bgRect(g, 0, FIELD_TOP, W, wallBot - FIELD_TOP, bgGrad(g, 0, FIELD_TOP, 0, wallBot,
    [[0, '#100d08'], [0.6, '#2c2416'], [1, '#3d3320']]));
  /* 肋骨：一根根从顶到墙脚 */
  for (let i = 0; i < 7; i++) {
    const rx = 70 + i * 138 + artNoise(i, 1) * 14;
    const w = 30 + artNoise(i, 4) * 16;
    const slope = 26 + artNoise(i, 6) * 18;
    g.fillStyle = bgGrad(g, rx, FIELD_TOP, rx + w, wallBot,
      [[0, 'rgba(6,5,3,0.96)'], [0.6, 'rgba(12,10,6,0.86)'], [1, 'rgba(26,21,12,0.5)']]);
    g.beginPath();
    g.moveTo(rx, FIELD_TOP + 16);
    g.lineTo(rx + w, FIELD_TOP + 16);
    g.lineTo(rx + w * 0.72 + slope, wallBot - 4);
    g.lineTo(rx + w * 0.14 + slope * 0.4, wallBot - 4);
    g.closePath();
    g.fill();
    /* 肋骨的受光边 */
    g.fillStyle = 'rgba(150,130,70,0.06)';
    g.fillRect(rx + w - 3, FIELD_TOP + 20, 3, Math.max(0, wallBot - FIELD_TOP - 26));
    /* 顶部的连接板 */
    bgRect(g, rx - 4, FIELD_TOP + 12, w + 8, 7, '#1c160d');
    bgRect(g, rx - 4, FIELD_TOP + 12, w + 8, 2, 'rgba(170,150,90,0.10)');
  }
  /* 天花板横梁与走线 */
  bgRect(g, 0, FIELD_TOP + 6, W, 5, '#0a0805');
  bgRect(g, 0, FIELD_TOP + 6, W, 1.4, 'rgba(160,140,80,0.10)');
  g.strokeStyle = 'rgba(20,16,8,0.9)'; g.lineWidth = 3;
  g.beginPath();
  for (let x = 0; x <= W; x += 40) {
    const y = FIELD_TOP + 22 + Math.sin(x * 0.013) * 7;
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
  bgBaseboard(g, wallBot, '#241d10', 'rgba(150,130,70,0.14)');
  /* 地面 */
  bgRect(g, 0, wallBot + 11, W, H - wallBot - 11, bgGrad(g, 0, wallBot, 0, H,
    [[0, '#3a3120'], [0.45, '#2c2518'], [1, '#100d07']]));
  bgFloor(g, 0, wallBot + 14, W, H, 46, 'rgba(12,9,4,0.5)', 16);
  /* 水洼：一小片反光 */
  for (let i = 0; i < 4; i++) {
    const px = 90 + i * 220 + artNoise(i, 9) * 60;
    const py = FIELD_TOP + 360 + artNoise(i, 12) * 150;
    g.fillStyle = 'rgba(120,140,150,0.05)';
    g.beginPath();
    g.ellipse(px, py, 46 + artNoise(i, 14) * 40, 12 + artNoise(i, 16) * 8, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = 'rgba(200,190,140,0.04)';
    g.beginPath();
    g.ellipse(px - 10, py - 3, 26, 4, 0, 0, Math.PI * 2);
    g.fill();
  }
  /* 墙面污渍与裂缝 */
  bgStain(g, 200, FIELD_TOP + 220, 60, 'rgba(20,26,14,0.5)', 3, 6);
  bgStain(g, 700, FIELD_TOP + 240, 78, 'rgba(30,22,10,0.45)', 8, 7);
  g.strokeStyle = 'rgba(10,8,4,0.55)'; g.lineWidth = 1.6;
  for (let i = 0; i < 5; i++) {
    const sx = 120 + i * 190;
    g.beginPath();
    g.moveTo(sx, FIELD_TOP + 300);
    g.lineTo(sx + 8, FIELD_TOP + 322);
    g.lineTo(sx - 4, FIELD_TOP + 344);
    g.stroke();
  }
  /* 场地：铺在地上的旧地毯（与地面同层） */
  bgField(g, '#453a24', 'rgba(16,12,5,0.5)', 'rgba(20,14,6,0.22)', 'rgba(24,18,9,0.3)');
}

function bgRoomBase(g, opt) {
  /* 一间房：墙纸 + 墙脚线 + 地面 + 地毯。墙只占场地以上那条带子 */
  const o = opt || {};
  const wallY1 = bgFloorLine();
  const bandH = wallY1 - FIELD_TOP;
  const thin = bandH < 70;
  bgRect(g, 0, FIELD_TOP, W, FIELD_H, o.floor0 || '#241d11');
  bgWallpaper(g, FIELD_TOP, wallY1, o.wall, o.stripe, o.dot, o.seed || 1);
  if (!thin) {
    /* 挂镜线 */
    bgRect(g, 0, wallY1 - 26, W, 3, o.rail || 'rgba(120,100,50,0.35)');
  }
  if (o.peel && !thin) {
    /* 起皮的墙纸：一条条撕开 */
    for (let i = 0; i < 7; i++) {
      const px = artNoise(o.seed + i, 2) * W;
      const pw = 20 + artNoise(o.seed + i, 5) * 70;
      const ph = 14 + artNoise(o.seed + i, 8) * (bandH - 20);
      g.fillStyle = o.peelColor || 'rgba(30,24,10,0.55)';
      g.beginPath();
      g.moveTo(px, FIELD_TOP);
      g.lineTo(px + pw, FIELD_TOP);
      g.lineTo(px + pw - 6, FIELD_TOP + ph * 0.7);
      g.lineTo(px + pw * 0.5, FIELD_TOP + ph);
      g.lineTo(px + 4, FIELD_TOP + ph * 0.6);
      g.closePath();
      g.fill();
    }
  }
  /* 霉斑与水痕：都限制在这条墙带里 */
  const mold = thin ? 2 : (o.mold === undefined ? 5 : o.mold);
  for (let i = 0; i < mold; i++) {
    const px = artNoise(o.seed + i, 30) * W;
    const py = FIELD_TOP + 4 + artNoise(o.seed + i, 31) * Math.max(4, bandH - 12);
    bgStain(g, px, py, Math.min(24 + artNoise(o.seed + i, 32) * 54, bandH * 0.7), o.moldColor || 'rgba(28,32,14,0.42)', o.seed + i + 50, 6);
  }
  const drips = thin ? 2 : (o.drips === undefined ? 6 : o.drips);
  for (let i = 0; i < drips; i++) {
    const px = artNoise(o.seed + i, 60) * W;
    bgDrip(g, px, FIELD_TOP + 2, Math.min(60 + artNoise(o.seed + i, 61) * 140, bandH - 8), 2 + artNoise(o.seed + i, 62) * 3,
      o.dripColor || 'rgba(40,30,12,0.35)', o.seed + i + 70);
  }
  bgBaseboard(g, wallY1, o.base || '#3a2e18', o.baseTop || 'rgba(160,140,80,0.18)');
  /* 地面 */
  bgRect(g, 0, wallY1 + 11, W, H - wallY1 - 11, bgGrad(g, 0, wallY1, 0, H,
    [[0, o.floor1 || '#3e3320'], [0.5, o.floor2 || '#332a1a'], [1, o.floor3 || '#181208']]));
  bgFloor(g, 0, wallY1 + 14, W, H, 40, o.joint || 'rgba(16,11,5,0.4)', 18);
  /* 大块湿痕 */
  for (let i = 0; i < 3; i++) {
    const px = 120 + artNoise(o.seed + i, 90) * (W - 240);
    const py = wallY1 + 60 + artNoise(o.seed + i, 91) * (H - wallY1 - 100);
    bgStain(g, px, py, 70 + artNoise(o.seed + i, 92) * 70, 'rgba(18,12,6,0.34)', o.seed + i + 100, 7);
  }
  /* 场地 */
  bgField(g, o.fieldBase || '#5a4c28', o.fieldSeam || 'rgba(28,18,7,0.45)', o.fieldJoint || 'rgba(30,20,8,0.2)', o.fieldDirt);
  /* 墙上的插座 / 开关 */
  bgRect(g, 96, wallY1 - 44, 12, 16, '#1c160c');
  bgRect(g, 98, wallY1 - 41, 8, 4, 'rgba(120,110,80,0.4)');
  bgRect(g, 98, wallY1 - 34, 8, 4, 'rgba(120,110,80,0.4)');
  bgRect(g, W - 118, wallY1 - 56, 16, 20, '#1c160c');
  bgRect(g, W - 114, wallY1 - 52, 8, 12, 'rgba(150,140,100,0.28)');
}
