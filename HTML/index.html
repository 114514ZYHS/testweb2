24.html", "title": "双子塔坍塌 · 3D 物理模拟", "desc": "基于 Three.js + Rapier 3D 的双子塔渐进式连续倒塌模拟：两座 110 层、418 米高的塔楼，从任意楼层触发结构失效后逐层压溃，压溃前缘随坠落质量不断下探，楼层依次被摧毁并抛洒出废墟，扬尘从坍塌带涌出、沿地面扩散成尘浪。可调起始破坏层、时间流速、机位。单文件，双击即可离线运行。", "cat": "仿真", "kb": 3385, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/3d-b4715957.html", "title": "3D版的星露谷物语", "desc": "deepseek-v4.1-flash+trae code做的。 一轮出的，没有任何修改。（wsad控制方向有问题并没有让他修复）一共37分钟\r\n我自己在上传zip文件的时候，出现错误。然后用v4.1排查的时候发现一个网址bug说明一下：\r\n\r\n\r\n【Bug 反馈】zip 上传被误判为「压缩比异常（疑似压缩炸弹）」，正常项目传不上去\r\n\r\n■ 现象\r\n上传一个完全正常的前端项目 zip（自包含、根目录含 index.html、解压后 1.5MB、整体压缩比仅 4.6:1），\r\n被 413 拒绝：zip 压缩比异常（疑似压缩炸弹）。\r\n\r\n■ 复现\r\n同一份代码、同样的文件，只改变「打包顺序」：\r\n· 按默认顺序打包（资源管理器 / 7-Zip / python make_archive 的默认行为）→ 最大判定比值 5006.5 → 被拒\r\n· 仅改为「按文件体积升序」打包 → 最大判定比值 9.7 → 通过\r\n即：只要压缩包里「排在后面的条目是小文件」，就会被误判。\r\n\r\n■ 定位\r\nbackend/app/services/storage.py → _safe_extract()\r\n\r\n    total_bytes = 0\r\n    for member in zf.infolist():\r\n        ...\r\n        total_bytes += int(member.file_size or 0)        # 分子：累计，所有已遍历文件之和\r\n        compressed = int(member.compress_size or 0)      # 分母：只是「当前这一个文件」\r\n        if compressed and total_bytes / max(compressed, 1) > settings.zip_max_ratio:\r\n            raise HTTPException(status_code=413, detail=\"zip 压缩比异常（疑似压缩炸弹）\")\r\n\r\n■ 原因\r\n分子是「累计解压体积」，分母却是「当前单条目的压缩体积」，两者口径不一致。\r\n分子只增不减，一旦遍历到靠后的小文件（分母极小），比值会被放大到几千倍。\r\n阈值见 backend/app/config.py：zip_max_ratio = 100。\r\n\r\n■ 修复建议\r\n分母也改为累计，才是「整包解压 / 整包压缩」的真实口径：\r\n\r\n    total_bytes = 0\r\n    total_compressed = 0\r\n    for member in zf.infolist():\r\n        ...\r\n        total_bytes += int(member.file_size or 0)\r\n        total_compressed += int(member.compress_size or 0)\r\n        if total_compressed and total_bytes / total_compressed > settings.zip_max_ratio:\r\n            raise HTTPException(status_code=413, detail=\"zip 压缩比异常（疑似压缩炸弹）\")\r\n\r\n改后该包比值约 4.6:1，远低于 100，正常通过；真正的压缩炸弹（1000:1 以上）依然会被拦住。\r\n\r\n■ 影响面\r\n所有「小文件排在后面」的正常多文件 zip 都会被误杀，与内容是否为炸弹无关。", "cat": "3D", ena版本gpt-6-astra-max绝赞大制作", "cat": "其他", "kb": 3049, "own": false, "author": "tonyunreal"}, {"url": "https://www.4444442.xyz/HTML/astra-html-8392e982.html", "title": "astra 现代主战坦克模型HTML", "desc": "单HTML坦克", "cat": "仿真", "kb": 748, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/astra-max-a65141bd.html", "title": "astra max卡冈图雅黑洞一轮", "desc": "黑洞", "cat": "仿真", "kb": 924, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/astra-threejs-ec4782b3.html", "title": "astra 古代中国江南庭院threejs建模", "desc": "单文件一轮直出", "cat": "仿真", "kb": 157, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/button-circus-cage-ec0153a9.html", "title": "button-circus-cage", "desc": "类吸血鬼幸存游戏（支持单人和双人模式） —— 马戏团里，用命来还债。\r\n网页加载速度太慢，可以直接下载zip进行游玩，文件大小为4.7Mb。\r\n\r\n两位负债参赛者被神秘富豪「主持人」关进马戏团的囚笼。你被放逐在自己那一半场地上，武器自动开火，怪物如潮水般涌来——先死的输，不死的赢，坚持到底并击倒最终 BOSS，才能赎回自由。\r\n\r\n玩法\r\n双人分屏生存竞技：左右各半场，自动瞄准最近的怪物，专心走位躲避即可\r\n升级选卡：击杀升级弹 3 张增益卡，边打边选、游戏不停；每张卡正负效果并存——想变强？先接受它的代价\r\n核心机制 · 特殊按钮：屏幕中央的大按钮有冷却，冷却结束随机变换效果——可能坑对方、帮自己，也可能坑两人；两人同时按会「卡键」双双受伤，反复按会积累故障、触发电击惩罚\r\n三种模式\r\n对战竞技：双人各自为战，谁先死谁输\r\n挑战双人（合作）：两人一起闯关，队友倒下可站桩 5 秒复活，共同进退、共同胜利\r\n挑战单人：孤身赴约，独自撕开囚笼\r\n特色\r\n40+ 张卡牌构筑：普通→神话六档品质，每张都自带代价，神话红卡直接定义流派\r\n6 类怪物 + BOSS：疯鸭、笨熊、喷毒蛇、气球怪、小丑、狂暴鸡群，带强化/精英/BOSS 品质与专属技能\r\n最终 BOSS：存活5分钟后出现，击倒它才能获胜", "cat": "游戏", "kb": 4927, "own": false, "author": "757902252"}, {"url": "https://www.4444442.xyz/HTML/cfop-cfa35cf2.html", "title": "卡线魔方：CFOP / 桥式分步求解", "desc": "开箱即用的三阶魔方网页：动漫卡线渲染，点贴纸拖层、空白处转视角。打乱后可随时用 CFOP（十字 / F2L / OLL / PLL）或桥式（FB / SB / CMLL / LSE）求解，并逐步播放公式。单文件 HTML，无需后端或登录。", "cat": "游戏", "kb": 514, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/cfop-e77c48fc.html", "title": "卡线魔方 · CFOP与桥式求解", "desc": "卡线魔方是可在浏览器里直接打开的三阶魔方。空白处拖拽旋转视角，拖色块转动切片，也可用键盘 UFRDLB。任意打乱或手动转动后，可随时用 CFOP 或桥式（Roux）接管求解，并按阶段播放、单步前进或后退。画面为动漫卡线渲染，求解过程带当前步法与阶段指示。", "cat": "图形学", "kb": 1, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/claude-fable-5-1-three-js-2da3c8a8.html", "title": "Claude Fable 5.1 · 潇湘馆（红楼梦）Three.js 还原", "desc": "Three.js 实时还原《红楼梦》潇湘馆。俯瞰可见粉墙院落、正房三间黛瓦、后院退步与连廊，竹林遮映房舍，墙外溪流与翠烟桥。右侧可切换 9 处视点、调节时辰与天气，并有一册题着《红楼梦》原文的说明卡，解释布局依据（退步与正房的垂直关系、水渠走向等）。", "cat": "3D建模", "kb": 1572, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/claude-opus-5-three-js-03874d9e.html", "title": "Claude Opus 5 · 潇湘馆（红楼梦）Three.js 三维复原", "desc": "用 Three.js 还原《红楼梦》大观园的潇湘馆，含庭院与室内两部分：素白粉墙围合、曲折游廊、千百竿翠竹遮映房舍，后院两间独立退步以短廊接正房。左侧 10 处视点可切换（庭院俯瞰、门前、明间堂屋、东间书房、西间卧房、后院退步、翠烟桥、檐下竹影等），右侧可调时辰、天气（白昼 / 夜烟 / 细雨 / 水雾 / 晴岚）与雾浓度。全部程序化建模，无外部资源。", "cat": "3D建模", "kb": 944, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/closeloop-849c4259.html", "title": "黑洞加风禾最新插件closeloop", "desc": "相比标准版用更少的tokens，几乎相同的时间，做出来远远超越的级别", "cat": "其他", "kb": 5023, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/cold-aisle-0830e0b5.html", "title": "冷通道 · COLD AISLE————阈限空间之机房", "desc": "一个 **阈限空间（liminal space）** 风格的第一人称探索游戏，取「池核 / Poolrooms」的骨架，\r\n但把环境换成了**无限延伸、无限重复的高科技 AI 服务器机房**。\r\n\r\n没有 UI，没有任务，没有敌人，没有结局。只有冷通道、荧光灯，和走不完的机柜。", "cat": "游戏", "kb": 577, "own": false, "author": "Dreamur_zm"}, {"url": "https://www.4444442.xyz/HTML/cold-aisle-4d0a0a0c.html", "title": "冷通道 · COLD AISLE————阈限机房", "desc": "一个 **阈限空间（liminal space）** 风格的第一人称探索游戏，取「池核 / Poolrooms」的骨架，\r\n但把环境换成了**无限延伸、无限重复的高科技 AI 服务器机房**。\r\n\r\n没有 UI，没有任务，没有敌人，没有结局。只有冷通道、荧光灯，和走不完的机柜。", "cat": "游戏", "kb": 577, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/css-clip-path-d7bc5978.html", "title": "纯 CSS clip-path 程序化描摹立绘", "desc": "glm5.3flash 运用脚本临摹的二次元图，让他自己找的热门图片", "cat": "其他", "kb": 2176, "own": false, "author": "admin"}, {"url": "https://www.4444442.xyz/HTML/deepseek-4ea114c0.html", "title": "deepseek非单轮输出构成主义土星五号海报", "desc": "要求自己先确定设计目的，确定主要元素，确定元素关系，确定画面表达，采用blender进行建模然后渲染，好像没有改dsh的配置导致其实是瞎着做的", "cat": "3D", "kb": 163, "own": false, "author": "dsdsdsds1111"}, {"url": "https://www.4444442.xyz/HTML/deepseek-e82e e0e7cb.html", "title": "deepseek v4.1flash 路径追踪池核", "desc": "workbuddy", "cat": "其他", "kb": 65, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/deepseek4-1f-19860777.html", "title": "四缸柴油，deepseek4.1f", "desc": "四缸柴油，deepseek4.1f", "cat": "其他", "kb": 3189, "own": false, "author": "liankun"}, {"url": "https://www.4444442.xyz/HTML/deepseek4-1f-ada5f3a2.html", "title": "博丽神社deepseek4.1F生成", "desc": "博丽神社deepseek4.1F生成", "cat": "其他", "kb": 802, "own": false, "author": "liankun"}, {"url": "https://www.4444442.xyz/HTML/deepseekflashv4-1-dsh-243142db.html", "title": "deepseekflashv4.1 +DSH 像素风格很强，瓶中沧海效果蛮好", "desc": "同一提示词  可以对比gpt6   https://z.xxbai.site/", "cat": "动画", "kb": 321, "own": false, "author": "you111de"}, {"url": "https://www.4444442.xyz/HTML/deepseekv4-1-4d093037.html", "title": "DeepseekV4.1黑洞测试", "desc": "DeepseekV4.1黑洞测试", "cat": "其他", "kb": 36, "own": false, "author": "grppop"}, {"url": "https://www.4444442.xyz/HTML/demo-05200b77.html", "title": "元素沙盒 · 落沙物理实验台", "desc": "12 种元素的落沙物理沙盒：沙、水、石、火、木、油、植物、酸、冰、蒸汽、火药、烟各有真实行为——木上泼油点火、火药连环殉爆、冰遇火融化、水碰冰结冰蔓延、植物遇水疯长、酸液溶穿岩石、蒸汽升空化雨。左键绘制右键擦除，笔刷粗细可调，元胞自动机实时模拟，零依赖单文件。", "cat": "仿真", "kb": 27, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-0583242d.html", "title": "《红楼梦》大观园体素", "desc": "请依据《红楼梦》原著对大观园的描写，以微体素（细小颗粒体素）风格搭建大观园三维场景", "cat": "3D", "kb": 757, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-0862b2f2.html", "title": "深空引力场 · 三体沙盒模拟器", "desc": "牛顿引力 N 体沙盒：画布拖拽即可发射天体，四档质量恒星自发光，天体相撞按动量守恒合并。内置三体八字舞周期解、双星系统、恒星+行星系、混沌碰撞四个预设，引力常数 G、软化因子、时间倍率实时可调，支持质心跟随视角。velocity Verlet 积分配霓虹拖尾，零依赖单文件。", "cat": "仿真", "kb": 27, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-0f4f9c58.html", "title": "被海洋环抱的日式幻想海岛 微缩三维场景", "desc": "使用 Three.js 在一个独立的 HTML 文件中制作一个「被海洋环抱的日式幻想海岛」微缩三维场景。\r\n整个场景以第三视角观察，像一个可以自由拖拽旋转、滚轮缩放、平移查看的精致微缩模型 / 小型景观装置。", "cat": "动画", "kb": 830, "own": false, "author": "rainer_3319"}, {"url": "https://www.4444442.xyz/HTML/demo-13795ee6.html", "title": "精美的机械手表", "desc": "使用ds-4.1-f加上zcode做的", "cat": "其他", "kb": 86, "own": false, "author": "yunyi1895"}, {"url": "https://www.4444442.xyz/HTML/demo-1b0de01a.html", "title": "彩色点云人像生成器", "desc": "ds-v4.1-f + trae code制作，一轮出，没有任何的修复", "cat": "工具", "kb": 124, "own": false, "author": "minghuaanliu"}, {"url": "https://www.4444442.xyz/HTML/demo-1dd9e26e.html", "title": "非单轮对话制作构成主义海报：旅行者一号", "desc": "", "cat": "场景", "kb": 318, "own": false, "author": "dsdsdsds1111"}, {"url": "https://www.4444442.xyz/HTML/demo-21468f00.html", "title": "四季雪球", "desc": "玻璃罩下的微缩四季小岛", "cat": "动画", "kb": 544, "own": false, "author": "climbing"}, {"url": "https://www.4444442.xyz/HTML/demo-2381fabb.html", "title": "嘭嘭嘭炸鱼大作战", "desc": "场景与玩法：\r\n江南水乡。场景加入了白墙黛瓦、曲面瓦顶、石拱桥、亭阁、宝塔、垂柳、荷花、乌篷船和远山，采用温暖明亮的微缩景观风格。支持晴日与晚照切换，并实现了体积云、水面反射与折射、动态波纹、模拟焦散和实时阴影。\r\n爆破不是点一下立即清屏。 爆弹会从船上沿抛物线飞出，入水后延时爆炸，需要预判鱼群的游动方向。爆炸包含喷涌水柱、泡沫、水花粒子、扩散涟漪、镜头震动、鱼类跃出水面和得分反馈。\r\n加入了三种可切换爆弹：泡泡爆弹、雷霆水花、漩涡弹。长按可以蓄力扩大范围；漩涡弹会聚拢附近生物，也会把癞蛤蟆吸过来。\r\n14 种鱼类。 包括鲫鱼、草鱼、红鲤鱼、花锦鲤、金鱼、鲶鱼、河豚，以及黄金锦鲤、星河龙鲤等幻想品种，具有不同的造型、分值和游速。另有连续爆破加分、稀有鱼出现、累计图鉴与六项成就。\r\n\r\n两种模式的规则：\r\n限时冲分\t按鱼种与连击倍率累计积分\t每只扣当前积分的 12%，至少扣 80 分，最低归零\t120 秒结束\r\n三命挑战\t按鱼种与连击倍率累计积分\t每只扣 1 条命\t初始 3 条命，扣完结算\r\n同一次爆炸同时命中鱼和癞蛤蟆时，先计算鱼类得分，再执行惩罚；命中多只癞蛤蟆会分别扣分或扣命。三命模式会随时间增加癞蛤蟆数量。\r\n两种模式各自保留前 50 名成绩，属于本地单机排行榜，不是联网全球榜单。\r\n\r\n操作与存档：\r\n电脑： 鼠标瞄准，左键点击投掷，长按蓄力；1 / 2 / 3 切换爆弹，右键拖动环视，滚轮缩放，R 复位镜头，Esc 暂停。\r\n手机： 单指瞄准、轻触投掷或长按蓄力；双指缩放与调整视角。横屏更适合欣赏完整河湾，竖屏也提供了适配界面。\r\n游戏会自动保存，也能从「存档」菜单导出 JSON、导入 JSON、继续上次对局。存档不仅包含排行榜和图鉴，还包含当前积分、生命、剩余时间、鱼群状态，以及尚未爆炸的爆弹。导入会在确认后替换现有数据，建议先导出备份。", "cat": "动画", "kb": 130, "own": false, "author": "QwenchC"}, {"url": "https://www.4444442.xyz/HTML/demo-25405e64.html", "title": "四冲程柴油机", "desc": "gpt-6-astra-max一轮", "cat": "其他", "kb": 909, "own": false, "author": "event"}, {"url": "https://www.4444442.xyz/HTML/demo-2d893398.html", "title": "点云人像生成器", "desc": "上传一张照片，生成保留原图颜色的点云人像。移动鼠标扰动圆点，拖拽旋转、滚轮缩放，还能实时调节点距和立体纵深。支持导出交互 HTML、SVG 和高清 PNG，照片全程在本地处理。", "cat": "SVG", "kb": 602, "own": false, "author": "tingfeng347"}, {"url": "https://www.4444442.xyz/HTML/demo-3169ab81.html", "title": "齐天大圣 · 云霄飞天记", "desc": "尝试将古典神话色彩（大圣脸谱、紫金冠雉鸡翎、大红披风、如意祥云）与 20 世纪工业黄金时代的双翼螺旋桨飞机相融。通过高精度矢量滤镜与流光着色，辅以音爆激波环和七彩筋斗云尾气粒子，诠释“神仙下凡开战机，穿云破雾战九霄”的浪漫张力。", "cat": "动画", "kb": 61, "own": false, "author": "ershiera"}, {"url": "https://www.4444442.xyz/HTML/demo-3571405d.html", "title": "四季雪球摆件", "desc": "workbuddy一轮出", "cat": "3D建模", "kb": 760, "own": false, "author": "WuWenWay"}, {"url": "https://www.4444442.xyz/HTML/demo-377fb864.html", "title": "眩晕瘫坐核弹爆炸", "desc": "眩晕瘫坐仿佛看到核弹爆炸。\r\n\r\n--------\r\n\r\n第二轮修了一下\r\n\r\n发现四个问题。一个是人物向后瘫坐的时候穿模了。一个是蘑菇云模拟的不够好。蘑菇云的烟尘应该是从外侧向内然后向上滚的吧，最后逐渐消失。现在是直接窜起一道烟尘，然后形成柱状水平转动。还有一个，重置城市的时候，人没有重置。最后一个是，人物周围没有灯光，晚上的时候看不清。", "cat": "动画", "kb": 56, "own": false, "author": "WanderingStar"}, {"url": "https://www.4444442.xyz/HTML/demo-3a659ea6.html", "title": "雨夜便利店", "desc": "请制作一个雨夜便利店街角小场景，以第三视角观察整个场景，整体像一个可以自由拖拽、旋转、缩放观看的微缩三维模型 / 小型景观，没有任何UI界面元素。", "cat": "动画", "kb": 786, "own": false, "author": "rainer_3319"}, {"url": "https://www.4444442.xyz/HTML/demo-3c892b93.html", "title": "博丽神社 · 微缩幻想乡立体模型", "desc": "基于 Three.js 构建的博丽神社微缩立体模型，神社建筑、树木与场景元素一应俱全，卡通渲染风格。支持鼠标拖拽旋转视角、滚轮缩放，双击打开即可交互浏览的 3D 展示。", "cat": "3D建模", "kb": 811, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-4583a011.html", "title": "红楼梦大观园体素", "desc": "Astra max一轮出", "cat": "3D", "kb": 109, "own": false, "author": "zhrzs"}, {"url": "https://www.4444442.xyz/HTML/demo-49dbef2a.html", "title": "太阳系", "desc": "太阳系真实运行模拟", "cat": "游戏", "kb": 9, "own": false, "author": "admin"}, {"url": "https://www.4444442.xyz/HTML/demo-4cb716de.html", "title": "黑洞真实物理模拟", "desc": "DEEPSEEK v4.1 flash 内测 做的黑洞", "cat": "仿真", "kb": 2732, "own": false, "author": "admin"}, {"url": "https://www.4444442.xyz/HTML/demo-52383c9f.html", "title": "越王勾践剑-体素精细版", "desc": "强强", "cat": "3D", "kb": 12, "own": false, "author": "wanzu"}, {"url": "https://www.4444442.xyz/HTML/demo-5893af03.html", "title": "施瓦西黑洞：广义相对论光线追踪", "desc": "实时广义相对论黑洞渲染：在片元着色器中逐步积分施瓦西时空的零测地线，呈现黑洞阴影、光子环与引力透镜。吸积盘按开普勒定律旋转并以黑体温度着色，叠加引力红移与相对论多普勒集束。拖动鼠标可环绕观察，右上角面板能实时调节内缘温度、亮度、自旋速度与光线步数，并自适应分辨率保持流畅。（vscode-zoocode 抽卡）", "cat": "其他", "kb": 548, "own": false, "author": "Dewedseed"}, {"url": "https://www.4444442.xyz/HTML/demo-63cf05ff.html", "title": "太阳系互动模型", "desc": "一句话，试一下V4.1f的成色，提示词很简单的“构建一个可互动的太阳系的行星系统，可以选择任何你觉得更适合呈现出太阳系的工具或者软件，如果没有，可以询问我安装。”很快，三百多tps，不到10分钟用了我一千多万tokens", "cat": "工具", "kb": 747, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-6b32397c.html", "title": "网页端对话渡渡鸟土星环骑车（但是构成主义风格）", "desc": "其实本来是想做渡渡鸟土星环骑车但是灵机一动加上构成主义发现效果还可以", "cat": "其他", "kb": 14, "own": false, "author": "dsdsdsds1111"}, {"url": "https://www.4444442.xyz/HTML/demo-6c42100e.html", "title": "四级雪球 · 玻璃罩下的微缩四季小岛", "desc": "玻璃罩下的微缩四季小岛：春→夏→秋→冬随时间连续渐变，一键切换「四季同框」空间渐变模式。拖动旋转、滚轮缩放，双击或摇一摇让雪花卷起；风车、水车、炊烟、飞鸟、锦鲤、樱花与雪花全部程序化生成。单文件，双击即可离线运行。", "cat": "3D建模", "kb": 734, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-6d12c4ce.html", "title": "启发式五阶魔方求解器", "desc": "核心采用分阶段搜索，并在多个候选之间竞争。主要优化：\r\n\r\n第一层：短解优先。 对接近还原的局面先做有界双向状态搜索，避免一两步就能还原的局面进入长流程。\r\n\r\n第二层：用精确子问题减少盲搜。 底层十字建立了 190,080 个可达状态的距离表；桥式法最后六棱建立了 184,320 个可达状态的距离表。前两层配对、顶层处理则使用投影状态上的加权最短路和候选搜索。这里的精确性针对对应子问题及其允许动作集合。\r\n\r\n第三层：压缩五阶降阶成本。 角型中心、边型中心、翼棱分别使用纯三循环操作，共有 12,144 个逻辑三循环，并保存 97,152 种等价实现。搜索会考虑相邻操作的抵消机会，选择更合适的实现。深度模式还搜索不同内层起手和空间朝向，比较降阶顺序，再做同轴切片归并、连续层块合并、边界抵消和闭合路径删除。\r\n\r\n界面提供快速、均衡、深度三档。较高档位保留低档位已经找到的解，只接受更短的候选；停止优化时，可以保留此前已经验证的方案。求解在浏览器工作线程中执行。", "cat": "图形学", "kb": 2964, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/demo-7075cacb.html", "title": "修正版渡渡鸟土星环骑车（构成主义）", "desc": "", "cat": "其他", "kb": 14, "own": false, "author": "dsdsdsds1111"}, {"url": "https://www.4444442.xyz/HTML/demo-720b9fc0.html", "title": "体素太阳系", "desc": "利用体素3d建模太阳系 多轮修改", "cat": "3D建模", "kb": 587, "own": false, "author": "aoaoao"}, {"url": "https://www.4444442.xyz/HTML/demo-76e107b5.html", "title": " *：gate/up/silu⊙up 三组 2432 维激活谱实时重算 |\r\n| MODULE06–07（右栏） | 下一 Token 候选表（raw 概率 / 截断后概率 / 累计 / 熵 / PPL / 全词表分布曲线）、生成流、运行日志 |\r\n| 顶栏「交叉验证」 | 当前 TF 后端 vs 纯 JS 内核 logits 一致性自检 |\r\n\r\n## 数值可信度\r\n\r\n工程内置与 HuggingFace `transformers` 的自动化对照（`npm run parity`，需本地\r\npython + transformers）：\r\n\r\n- 分词：62/62 对抗用例逐一 token 级一致\r\n- logits：`max|Δ| ≈ 4e-5`（FP16 权重噪声量级），Top-5 一致\r\n- 注意力权重：`max|Δ| ≈ 1e-6`，行和恒为 1\r\n- 逐层残差流 / 最终 RMSNorm：全部 ≤3e-3\r\n- KV Cache 分步解码 vs 整段前向：logits **Δ=0**\r\n\r\n## 说明\r\n\r\n- 上下文限制默认 **512**，可调至 2048（KV Cache / RoPE 按 2048 预分配）；EOS `<|im_end|>` 自动停止。\r\n- **量化**：内嵌权重为 **INT4 分组量化**（group=64，磁盘 44MB / 常驻 ≈36MB，7.1×）；HTTP 模式可在精度下拉加载原始 FP16 权重，支持 **FP32 / INT8 / INT4** 三档切换与对照（实测分布重合度 INT8 98.3%、INT4 83.7%，Top-1 均一致）。\r\n- 可视化捕获默认开启，配套**滑动窗口**（默认 128 token，超出丢弃更早捕获）与**满上下文内存预估警示**（>150MB 黄色 / >400MB 红色）；全部在 Module02「资源」区调整，原理见内嵌文档 §7.4。\r\n- Chat 模式使用 Qwen 官方模板（含空 `<think>` 块，与 HF `apply_chat_template` 一致）。\r\n- 纯文本续写模式下小模型易复读 —— 这正是演示温度/Top-P/重复惩罚效果的素材。", "cat": "动画", "kb": 58, "own": false, "author": "Dreamur_zm"}, {"url": "https://www.4444442.xyz/HTML/v4-1f-75aad8cb.html", "title": "v4.1f自我介绍", "desc": "", "cat": "其他", "kb": 87, "own": false, "author": "2476916573"}, {"url": "https://www.4444442.xyz/HTML/v4-1flash0908-ffdbe77e.html", "title": "魔方 V4.1Flash0908", "desc": "修了bug", "cat": "图形学", "kb": 124, "own": false, "author": "yy04"}, {"url": "https://www.4444442.xyz/HTML/webgl-3f6103dc.html", "title": "墨水流体 · WebGL 实时流体模拟", "desc": "在 GPU 上实时求解 Navier-Stokes 方程的流体模拟：半拉格朗日平流、涡量约束卷出优雅漩涡、Jacobi 迭代求解压力。指针拖拽注入彩色墨流，点击画布产生喷溅，静置三秒墨水自动起舞，色相沿 HSL 缓慢循环。涡量强度、染料消散、速度衰减实时可调，WebGL1 兼容，零依赖单文件。", "cat": "图形学", "kb": 40, "own": false, "author": "public"}, {"url": "https://www.4444442.xyz/HTML/webgl2-5e084dc8.html", "title": "地球解体：WebGL2 数据粒子螺旋内陷实验", "desc": "一个纯 WebGL2 实现的视觉实验：地球被拆解为数十万发光数据粒子，随后螺旋内陷、大陆剥离，最终坍缩为旋转的纯白二维光碟。", "cat": "动画", "kb": 47, "own": false, "author": "heyizhiyuan"}, {"url": "https://www.4444442.xyz/HTML/willowbrook-3d-953c357b.html", "title": "溪谷物语 · Willowbrook · 3D版星露谷", "desc": "可视为3D版的星露谷物语\r\n\r\n把日子种进泥土，把心事交给溪流。\r\n从一间木屋开始，经营属于你的四季。", "cat": "3D", "kb": 889, "own": false, "author": "QwenchC"}, {"url": "https://www.4444442.xyz/HTML/xbox-edfa00a9.html", "title": "Xbox模拟器", "desc": "Xbox 初代模拟器 · 终极防重置安全版\r\n一句话定位：\r\n一个 HTML 文件，打开就是一台“Xbox 初代风格”的网页娱乐终端。它不是微软官方模拟器，也不是能跑原版 Xbox ISO 的完整模拟器，而是一个把 Xbox 初代开机仪式感、绿色 X 球体、刀片导航、光盘库、媒体中心、MIDI 播放器全部塞进浏览器的复古前端启动器。\r\n\r\n✨ 它有什么亮点？\r\n1. 打开就像一台 Xbox\r\n黑底开机画面，5 秒进入系统\r\n\r\n经典绿色 X 球体、动态网格背景\r\n\r\n刀片导航：仪表盘、游戏库、媒体、设置、系统\r\n\r\n底部状态栏：玩家、手柄、光盘、时钟、全屏\r\n\r\n2. 光盘库：把网页游戏、音乐、视频当“光盘”插\r\n点击右侧 💿 按钮，选择文件后可以：\r\n\r\n临时启动：体验完关闭自动清除\r\n\r\n储存到光盘库：永久保存，下次直接点开\r\n\r\n支持：\r\n\r\nHTML / HTM 小游戏\r\n\r\nZIP 打包的网页游戏\r\n\r\nMP3 / WAV / OGG / FLAC / M4A 音乐\r\n\r\nMP4 / WebM / AVI / MOV / MKV 视频\r\n\r\n3. ZIP 游戏支持很猛\r\nZIP 里包含 HTML 游戏时，会自动：\r\n\r\n解压并找到入口 HTML\r\n\r\n替换图片、CSS、JS 资源路径\r\n\r\n内联脚本和样式\r\n\r\n注入音频 API，支持 BGM 和音效\r\n\r\n直接在模拟器里全屏运行\r\n\r\n4. MIDI 播放器：双引擎\r\nWeb 合成：无需资源，点开即听，8-bit / DOS 风格\r\n\r\nSF2 音色库：上传 .sf2 文件，本地 IndexedDB 永久保存，下次自动加载\r\n\r\n支持进度条、速度调节、通道指示灯、频谱可视化\r\n\r\n可播放 .mid / .midi 文件\r\n\r\n5. 多端操作\r\n键盘：方向键、Enter、Esc、数字键切换刀片\r\n\r\n触屏：虚拟方向键、ABXY、S/Q 键\r\n\r\n手柄：Gamepad API 支持，连接即用\r\n\r\n全屏按钮：一键进入沉浸模式\r\n\r\n6. 终极防重置安全版\r\n恢复出厂设置只清除光盘库和音量，不误伤用户系统\r\n\r\n与 XP 模拟器共享文件系统、用户系统、注册表键\r\n\r\n支持导出备份 / 导入备份\r\n\r\n支持玩家切换：玩家1、玩家2、管理员档案\r\n\r\n🔥 可直接复制的宣传文案\r\n一个 HTML，装下一台 Xbox 初代。\r\n绿色 X 球体亮起，刀片菜单滑动，光盘库就位。\r\n插“光盘”：ZIP 网页游戏、HTML 小游戏、音乐、视频、MIDI。\r\nMIDI 双引擎：Web 合成即点即听，SF2 音色库上传即用。\r\n键盘、触屏、手柄全支持。\r\n终极防重置：恢复出厂不误伤，数据更安心。\r\n复制文件，双击打开，你的复古 Xbox 娱乐站启动。\r\n\r\n🎯 适合谁？\r\n喜欢 Xbox 初代 UI 的复古玩家\r\n\r\n想收藏网页小游戏、ZIP 游戏的人\r\n\r\n需要网页音乐 / 视频播放器的人\r\n\r\n想玩 MIDI、SF2 音色库的音乐爱好者\r\n\r\n做前端演示、怀旧项目、个人娱乐终端的人", "cat": "音乐", "kb": 186, "own": false, "author": "FX1346bilibili"}];

var activeCat = '全部';
var searchText = '';

var catCounts = {'全部': CARDS.length};
for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i].cat;
    catCounts[c] = (catCounts[c] || 0) + 1;
}

function renderCats() {
    var box = document.getElementById('cats');
    box.innerHTML = '';
    var keys = ['全部'];
    for (var k in catCounts) {
        if (k !== '全部') keys.push(k);
    }
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var btn = document.createElement('button');
        btn.className = 'cat-btn' + (k === activeCat ? ' active' : '');
        btn.textContent = k + ' (' + catCounts[k] + ')';
        btn.setAttribute('data-cat', k);
        btn.onclick = function () {
            activeCat = this.getAttribute('data-cat');
            renderCats();
            renderGrid();
        };
        box.appendChild(btn);
    }
}

function renderGrid() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var shown = 0;
    var q = searchText.toLowerCase();
    for (var i = 0; i < CARDS.length; i++) {
        var c = CARDS[i];
        if (activeCat !== '全部' && c.cat !== activeCat) continue;
        if (q) {
            var hay = (c.title + ' ' + c.desc + ' ' + c.author).toLowerCase();
            if (hay.indexOf(q) < 0) continue;
        }
        shown++;
        var a = document.createElement('a');
        a.className = 'card';
        a.href = c.url;

        var head = document.createElement('div');
        head.className = 'card-head';
        var tt = document.createElement('span');
        tt.className = 'card-title';
        tt.textContent = c.title;
        head.appendChild(tt);
        var bd = document.createElement('span');
        bd.className = 'card-badge' + (c.own ? ' own' : '');
        bd.textContent = c.own ? '自写' : c.cat;
        head.appendChild(bd);
        a.appendChild(head);

        if (c.desc) {
            var ds = document.createElement('span');
            ds.className = 'card-desc';
            var dtext = c.desc;
            if (dtext.length > 90) dtext = dtext.slice(0, 90) + '...';
            ds.textContent = dtext;
            a.appendChild(ds);
        }

        var meta = document.createElement('span');
        meta.className = 'card-meta';
        var mtext = c.kb + ' KB';
        if (c.author) mtext += ' · ' + c.author;
        meta.textContent = mtext;
        a.appendChild(meta);

        grid.appendChild(a);
    }
    document.getElementById('count').textContent =
        '共 ' + CARDS.length + ' 个页面，当前显示 ' + shown + ' 个';
}

document.getElementById('search').addEventListener('input', function () {
    searchText = this.value.trim();
    renderGrid();
});

renderCats();
renderGrid();
</script>
