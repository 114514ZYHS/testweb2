<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F2A 验证器 · 谷歌登录</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 28px 36px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .header .icon {
            width: 44px;
            height: 44px;
            background: #1a73e8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header .icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .header .title {
            font-size: 22px;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        .header .sub {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
            margin-top: 2px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            display: block;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 28px;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            letter-spacing: 1px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #fafcff;
            color: #0f172a;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
            text-transform: uppercase;
        }

        .input-wrap input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.12);
            background: #ffffff;
        }

        .input-wrap input::placeholder {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .input-wrap .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        .input-wrap .hint span {
            color: #1a73e8;
            font-weight: 500;
        }

        /* ---- 进度条 ---- */
        .progress-section {
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .progress-header .label-time {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
        }

        .progress-header .time-remain {
            font-size: 13px;
            font-weight: 600;
            color: #1a73e8;
            font-variant-numeric: tabular-nums;
            min-width: 56px;
            text-align: right;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e9eef3;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #1a73e8, #0d47a1);
            border-radius: 100px;
            transition: none;
            will-change: width;
        }

        .progress-bar.warning {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .progress-bar.danger {
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            animation: pulse-bar 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse-bar {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.6;
            }
        }

        /* ---- 验证码 ---- */
        .code-section {
            text-align: center;
            padding: 8px 0 4px;
        }

        .code-label {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .code-display {
            font-size: 48px;
            font-weight: 700;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            letter-spacing: 6px;
            color: #0f172a;
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px dashed #dce2eb;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            position: relative;
            display: inline-block;
            min-width: 200px;
        }

        .code-display:hover {
            background: #f1f5f9;
            border-color: #1a73e8;
        }

        .code-display:active {
            transform: scale(0.96);
        }

        .code-display .copy-tip {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.3px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .code-display:hover .copy-tip {
            opacity: 1;
        }

        .code-display .copy-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(26, 115, 232, 0.92);
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .code-display .copy-feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .code-display .placeholder-text {
            font-size: 20px;
            font-weight: 400;
            color: #b9c4d0;
            letter-spacing: 2px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ---- 状态 ---- */
        .status {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
            min-height: 20px;
            transition: color 0.3s ease;
        }

        .status.active {
            color: #1a73e8;
        }

        .status.error {
            color: #ef4444;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 480px) {
            .card {
                padding: 24px 18px 28px;
                border-radius: 20px;
            }

            .header .title {
                font-size: 19px;
            }

            .code-display {
                font-size: 36px;
                padding: 14px 16px;
                min-width: 160px;
                letter-spacing: 4px;
            }

            .input-wrap input {
                font-size: 15px;
                padding: 12px 16px;
            }
        }

        @media (max-width: 380px) {
            .code-display {
                font-size: 28px;
                padding: 12px 12px;
                min-width: 130px;
                letter-spacing: 3px;
            }

            .card {
                padding: 18px 14px 22px;
            }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="F2A 验证器">

        <!-- 头部 -->
        <div class="header">
            <div class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-.5-13v4h-5v2h5v4l5-5z"/></svg>
            </div>
            <div>
                <div class="title">F2A 验证器</div>
                <div class="sub">用于 Google 登录</div>
            </div>
        </div>

        <!-- 密钥输入 -->
        <div class="input-wrap">
            <label class="label" for="secretInput">密钥</label>
            <input
            id="secretInput"
            type="text"
            placeholder="例如 JBSWY3DPEHPK3PXP"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="hintText"
            />
            <div class="hint" id="hintText">输入 Google 身份验证器中的 <span>Base32</span> 密钥</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <div class="progress-header">
                <span class="label-time">⏱ 倒计时</span>
                <span class="time-remain" id="timeRemain">30.0s</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="30" id="progressTrack">
                <div class="progress-bar" id="progressBar" style="width: 100%;"></div>
            </div>
        </div>

        <!-- 验证码 -->
        <div class="code-section">
            <div class="code-label">一次性验证码</div>
            <div class="code-display" id="codeDisplay" role="button" tabindex="0" aria-label="点击复制验证码">
                <span class="placeholder-text" id="codeText">— — — — — —</span>
                <span class="copy-tip">点击复制</span>
                <span class="copy-feedback" id="copyFeedback">已复制 ✓</span>
            </div>
            <div class="status" id="statusMessage">等待输入密钥…</div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM refs ----
            const secretInput = document.getElementById('secretInput');
            const codeText = document.getElementById('codeText');
            const codeDisplay = document.getElementById('codeDisplay');
            const progressBar = document.getElementById('progressBar');
            const timeRemain = document.getElementById('timeRemain');
            const statusMsg = document.getElementById('statusMessage');
            const copyFeedback = document.getElementById('copyFeedback');
            const progressTrack = document.getElementById('progressTrack');

            // ---- 常量 ----
            const STEP = 30; // 30 秒
            const DIGITS = 6;
            const BASE32_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

            // ---- 状态 ----
            let currentSecret = '';
            let validSecret = false;
            let currentCode = '';
            let copyTimerId = null;
            let lastStep = -1;
            let animFrameId = null;

            // ---- Base32 解码 ----
            function base32Decode(encoded) {
                let clean = encoded.replace(/\s/g, '').toUpperCase();
                clean = clean.replace(/=+$/, '');
                if (clean.length === 0) return new Uint8Array(0);

                for (let i = 0; i < clean.length; i++) {
                    if (BASE32_ALPHABET.indexOf(clean[i]) === -1) {
                        throw new Error('包含非法 Base32 字符');
                    }
                }

                const bits = [];
                for (let i = 0; i < clean.length; i++) {
                    const val = BASE32_ALPHABET.indexOf(clean[i]);
                    for (let b = 4; b >= 0; b--) {
                        bits.push((val >> b) & 1);
                    }
                }

                const bytes = [];
                for (let i = 0; i + 7 < bits.length; i += 8) {
                    let byte = 0;
                    for (let b = 0; b < 8; b++) {
                        byte = (byte << 1) | bits[i + b];
                    }
                    bytes.push(byte);
                }

                return new Uint8Array(bytes);
            }

            // ---- TOTP 生成 ----
            function generateTOTP(secretBase32, timeStep) {
                let keyBytes;
                try {
                    keyBytes = base32Decode(secretBase32);
                } catch (e) {
                    throw new Error('密钥解码失败: ' + e.message);
                }
                if (keyBytes.length === 0) {
                    throw new Error('密钥不能为空');
                }

                const timeBytes = new Uint8Array(8);
                for (let i = 7; i >= 0; i--) {
                    timeBytes[i] = timeStep & 0xff;
                    timeStep = Math.floor(timeStep / 256);
                }

                const keyWordArray = CryptoJS.lib.WordArray.create(keyBytes);
                const timeWordArray = CryptoJS.lib.WordArray.create(timeBytes);
                const hmac = CryptoJS.HmacSHA1(timeWordArray, keyWordArray);
                const hash = hmac.words;

                const hashBytes = [];
                for (let i = 0; i < hash.length; i++) {
                    const w = hash[i];
                    hashBytes.push((w >> 24) & 0xff);
                    hashBytes.push((w >> 16) & 0xff);
                    hashBytes.push((w >> 8) & 0xff);
                    hashBytes.push(w & 0xff);
                }
                const fullHash = new Uint8Array(hashBytes.slice(0, 20));

                const offset = fullHash[19] & 0x0f;
                const binCode = ((fullHash[offset] & 0x7f) << 24) |
                    ((fullHash[offset + 1] & 0xff) << 16) |
                    ((fullHash[offset + 2] & 0xff) << 8) |
                    (fullHash[offset + 3] & 0xff);

                const otp = binCode % Math.pow(10, DIGITS);
                return String(otp).padStart(DIGITS, '0');
            }

            // ---- 验证密钥 ----
            function validateSecret(input) {
                const cleaned = input.replace(/\s/g, '').toUpperCase();
                if (cleaned.length === 0) {
                    return { valid: false, cleaned: '' };
                }
                const validChars = /^[A-Z2-7]+$/.test(cleaned);
                if (!validChars) {
                    return { valid: false, cleaned: cleaned };
                }
                try {
                    const bytes = base32Decode(cleaned);
                    if (bytes.length === 0) {
                        return { valid: false, cleaned: cleaned };
                    }
                    return { valid: true, cleaned: cleaned };
                } catch (e) {
                    return { valid: false, cleaned: cleaned };
                }
            }

            // ---- 处理输入 ----
            function handleInput() {
                const raw = secretInput.value;
                const result = validateSecret(raw);

                if (result.valid) {
                    currentSecret = result.cleaned;
                    validSecret = true;
                    if (secretInput.value !== currentSecret) {
                        secretInput.value = currentSecret;
                    }
                    statusMsg.textContent = '✅ 密钥有效，正在生成…';
                    statusMsg.className = 'status active';
                    lastStep = -1; // 强制下一帧刷新OTP
                } else {
                    currentSecret = '';
                    validSecret = false;
                    currentCode = '';
                    codeText.textContent = '— — — — — —';
                    codeText.className = 'placeholder-text';
                    if (raw.trim().length > 0) {
                        statusMsg.textContent = '⚠ 密钥格式无效，请检查 Base32';
                        statusMsg.className = 'status error';
                    } else {
                        statusMsg.textContent = '等待输入密钥…';
                        statusMsg.className = 'status';
                    }
                }
            }

            // ---- 复制功能 ----
            function copyCode() {
                if (!currentCode || !validSecret) {
                    statusMsg.textContent = '⚠ 没有可复制的验证码';
                    statusMsg.className = 'status error';
                    return;
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentCode).then(() => {
                        showCopyFeedback();
                    }).catch(() => {
                        fallbackCopy();
                    });
                } else {
                    fallbackCopy();
                }
            }

            function fallbackCopy() {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = currentCode;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    textarea.style.top = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showCopyFeedback();
                } catch (e) {
                    statusMsg.textContent = '⚠ 复制失败，请手动复制';
                    statusMsg.className = 'status error';
                }
            }

            function showCopyFeedback() {
                copyFeedback.classList.add('show');
                statusMsg.textContent = '✅ 已复制验证码: ' + currentCode;
                statusMsg.className = 'status active';
                if (copyTimerId) clearTimeout(copyTimerId);
                copyTimerId = setTimeout(() => {
                    copyFeedback.classList.remove('show');
                }, 1600);
            }

            // ---- 动画循环 (平滑流动) ----
            function animationTick() {
                const nowInSeconds = Date.now() / 1000;
                const currentStep = Math.floor(nowInSeconds / STEP);
                const elapsed = nowInSeconds - currentStep * STEP;
                const remaining = Math.max(0, STEP - elapsed);

                // 更新进度条 (连续变化)
                const percent = (remaining / STEP) * 100;
                progressBar.style.width = percent + '%';
                progressTrack.setAttribute('aria-valuenow', Math.round(remaining));

                // 时间显示精确到小数点后一位
                timeRemain.textContent = remaining.toFixed(1) + 's';

                // 进度条颜色
                progressBar.className = 'progress-bar';
                if (remaining <= 5) {
                    progressBar.classList.add('danger');
                } else if (remaining <= 10) {
                    progressBar.classList.add('warning');
                }

                // 仅在时间步进变化时更新OTP
                if (validSecret && currentSecret && currentStep !== lastStep) {
                    lastStep = currentStep;
                    try {
                        currentCode = generateTOTP(currentSecret, currentStep);
                        codeText.textContent = currentCode;
                        codeText.className = '';
                        statusMsg.textContent = '验证码已更新，点击复制';
                        statusMsg.className = 'status active';
                    } catch (e) {
                        codeText.textContent = '⚠ 错误';
                        codeText.className = 'placeholder-text';
                        statusMsg.textContent = '密钥无效: ' + e.message;
                        statusMsg.className = 'status error';
                        currentCode = '';
                        validSecret = false;
                    }
                }

                animFrameId = requestAnimationFrame(animationTick);
            }

            function startAnimation() {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                }
                animFrameId = requestAnimationFrame(animationTick);
            }

            // ---- 页面可见性变化 ----
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (animFrameId) {
                        cancelAnimationFrame(animFrameId);
                        animFrameId = null;
                    }
                } else {
                    // 页面恢复时，重置步进检查，防止因休眠导致的跳跃
                    lastStep = -1;
                    startAnimation();
                }
            });

            // ---- 初始化 ----
            function init() {
                secretInput.addEventListener('input', handleInput);
                codeDisplay.addEventListener('click', copyCode);
                codeDisplay.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        copyCode();
                    }
                });

                // 启动平滑动画，即使没有密钥也显示流动的倒计时
                startAnimation();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
