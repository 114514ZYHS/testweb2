 text-shadow:0 1px 4px rgba(0,0,0,.95),0 2px 30px rgba(0,0,0,.9),0 0 80px rgba(0,0,0,.8)}

 opacity:0;transition:opacity .9s .12s;text-shadow:0 1px 4px #000}

#toast{position:fixed;left:50%;top:74px;transform:translate(-50%,-8px);z-index:40;padding:8px 20px;border-radius:20px;
 font-size:11.5px;letter-spacing:.1em;background:rgba(8,12,20,.86);border:1px solid var(--line);color:#fff;
 backdrop-filter:blur(14px);opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){#clock{display:none}#panel{width:176px;transform:scale(.92);transform-origin:top right}}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

window.onerror=function(m,s,l){ const e=document.getElementById("err"); e.style.display="block"; e.textContent+="\n[错误] "+m+" @"+l+"\n"; };
const $=function(s){ return document.querySelector(s); };
const clamp=function(v,a,b){ return v<a?a:(v>b?b:v); };
const lerp=function(a,b,t){ return a+(b-a)*t; };
const damp=function(a,b,l,dt){ return lerp(a,b,1-Math.exp(-l*dt)); };
const rnd=function(a,b){ return a+Math.random()*(b-a); };
const smooth=function(t){ return t*t*(3-2*t); };
const TAU=Math.PI*2, D2R=Math.PI/180;
function step(n,t){ $("#pbar").style.width=n+"%"; $("#pst").textContent=t; }

/* ==========================================================
   1. 渲染管线
   ========================================================== */
const canvas=$("#c");
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.94;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.5,8000);
camera.position.set(0,58,150);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.055;
controls.minDistance=6; controls.maxDistance=2200;
controls.target.set(0,0,0);

/* ==========================================================
   2. 程序化贴图
   ========================================================== */
function ihash(x,y,s){
  let h=(x|0)*374761393+(y|0)*668265263+(s|0)*1013904223;
  h=(h^(h>>13))*1274126177;
  return ((h^(h>>16))>>>0)/4294967295;
}
function vnoise(x,y,per,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const x0=((xi%per)+per)%per, y0=((yi%per)+per)%per, x1=(x0+1)%per, y1=(y0+1)%per;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=ihash(x0,y0,s), b=ihash(x1,y0,s), c=ihash(x0,y1,s), d=ihash(x1,y1,s);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm2(x,y,per,oct,s){
  let v=0,a=1,mx=0,p=per;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*p,y*p,p,s+i*31); mx+=a; a*=0.55; p*=2; }
  return v/mx;
}
function cvs(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function tex(c,srgb){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(srgb!==false) t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function mixHex(a,b,t){
  const A=[(a>>16)&255,(a>>8)&255,a&255], B=[(b>>16)&255,(b>>8)&255,b&255];
  return [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t];
}
function surfaceTex(kind,pal,seed){
  const W=512,H=256,c=cvs(W,H),x=c.getContext("2d");
  const img=x.createImageData(W,H), d=img.data;
  for(let j=0;j<H;j++){
    const lat=(j/H)*2-1;
    for(let i=0;i<W;i++){
      let n;
      if(kind==="gas"){
        const band=Math.sin(lat*Math.PI*(pal.bands||7)+fbm2(i/W,j/H,3,4,seed)*2.6);
        n=0.5+0.5*band*0.9+(fbm2(i/W,j/H,7,4,seed+9)-0.5)*0.34;
      } else {
        n=fbm2(i/W,j/H,pal.per||5,5,seed);
        n=n*0.82+(fbm2(i/W,j/H,17,3,seed+5)-0.5)*0.24;
      }
      n=clamp(n,0,1);
      let col;
      if(kind==="earth"){
        const ice=Math.abs(lat)>0.80-0.10*n;
        col = ice ? mixHex(0xdfeaf2,0xffffff,n)
            : (n<0.50 ? mixHex(0x081b44,0x1b558f,n/0.50)
                      : mixHex(0x2f5a2a,0xa88f56,(n-0.50)/0.50));
      } else {
        col=mixHex(pal.a,pal.b,n);
      }
      const k=(j*W+i)*4;
      d[k]=col[0]; d[k+1]=col[1]; d[k+2]=col[2]; d[k+3]=255;
    }
  }
  x.putImageData(img,0,0);
  if(kind==="rock"){
    x.globalAlpha=0.32;
    for(let i=0;i<90;i++){
      const r=rnd(2,13), cx=rnd(0,W), cy=rnd(H*0.08,H*0.92);
      const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,"rgba(0,0,0,.55)"); g.addColorStop(.72,"rgba(255,255,255,.22)"); g.addColorStop(1,"rgba(0,0,0,0)");
      x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,TAU); x.fill();
    }
    x.globalAlpha=1;
  }
  if(kind==="earth"){
    x.globalAlpha=0.28; x.fillStyle="#ffffff";
    for(let i=0;i<170;i++){
      const cx=rnd(0,W), cy=rnd(0,H), r=rnd(4,20);
      x.beginPath(); x.ellipse(cx,cy,r,r*0.42,rnd(0,TAU),0,TAU); x.fill();
    }
    x.globalAlpha=1;
  }
  if(kind==="gas" && pal.storm){
    x.globalAlpha=0.78;
    const g=x.createRadialGradient(W*0.66,H*0.60,2,W*0.66,H*0.60,44);
    g.addColorStop(0,"rgba(232,124,74,1)"); g.addColorStop(.6,"rgba(178,84,52,.7)"); g.addColorStop(1,"rgba(178,84,52,0)");
    x.fillStyle=g; x.beginPath(); x.ellipse(W*0.66,H*0.60,44,20,0,0,TAU); x.fill();
    x.globalAlpha=1;
  }
  return tex(c);
}

/* ==========================================================
   3. 二维化着色器
   ========================================================== */
const NOISE_GLSL=[
  "float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }",
  "float n2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);",
  "  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),u.x), mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),u.x), u.y); }",
  "float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*n2(p); p*=2.03; a*=0.5; } return v; }"
].join("\n");

const BODY_VERT=[
  "uniform float uFlat; uniform float uExpand; uniform float uR;",
  "varying vec2 vUv; varying vec3 vNw; varying vec3 vWp; varying vec2 vXZ;",
  "void main(){",
  "  vUv=uv;",
  "  vec3 p=position;",
  "  float k=mix(1.0,uExpand,uFlat);",
  "  p.xz*=k;",
  "  p.y*=mix(1.0,0.006,uFlat);",
  "  vXZ=p.xz/max(uR*uExpand,0.0001);",
  "  vec4 wp=modelMatrix*vec4(p,1.0);",
  "  vWp=wp.xyz;",
  "  vNw=normalize(mat3(modelMatrix)*normal);",
  "  gl_Position=projectionMatrix*viewMatrix*wp;",
  "}"
].join("\n");

const BODY_FRAG=[
  "uniform float uFlat; uniform float uTime; uniform float uIsSun; uniform float uGlow;",
  "uniform sampler2D uMap; uniform vec3 uSun; uniform vec3 uL1,uL2,uL3,uL4;",
  "varying vec2 vUv; varying vec3 vNw; varying vec3 vWp; varying vec2 vXZ;",
  NOISE_GLSL,
  "void main(){",
  "  vec3 base=texture2D(uMap,vUv).rgb;",
  "  vec3 N=normalize(vNw);",
  "  vec3 L=normalize(uSun-vWp);",
  "  float dif=max(dot(N,L),0.0);",
  "  vec3 V=normalize(cameraPosition-vWp);",
  "  float rim=pow(1.0-max(dot(N,V),0.0),3.0);",
  "  vec3 lit=base*(0.055+dif*1.30)+vec3(0.35,0.55,0.9)*rim*0.30;",
  "  if(uIsSun>0.5){ lit=base*(0.95+0.42*fbm(vUv*16.0+uTime*0.05)); }",
  "  /* --- 二维剖面：硬边分层 + 环纹 + 辐条，像一张展开的工程图 --- */",
  "  float rr=clamp(length(vXZ),0.0,1.0);",
  "  float ang=atan(vXZ.y,vXZ.x);",
  "  float swirl=fbm(vec2(rr*6.0,ang*2.2)+uTime*0.02);",
  "  float rw=clamp(rr+(swirl-0.5)*0.055,0.0,1.0);",
  "  float LN=5.0;",
  "  float li=floor(rw*LN)/LN;",
  "  float lf=fract(rw*LN);",
  "  vec3 lay;",
  "  if(li<0.25) lay=mix(uL1,uL2,li/0.25);",
  "  else if(li<0.55) lay=mix(uL2,uL3,(li-0.25)/0.30);",
  "  else lay=mix(uL3,uL4,(li-0.55)/0.45);",
  "  float rings=0.5+0.5*sin(rw*250.0+swirl*7.0);",
  "  lay*=0.86+0.26*rings;",
  "  float spokes=0.5+0.5*sin(ang*34.0+rw*9.0);",
  "  lay*=0.90+0.20*spokes;",
  "  float grain=fbm(vec2(rw*40.0, ang*11.0));",
  "  lay*=0.88+0.24*grain;",
  "  float lineE=smoothstep(0.045,0.0,lf)+smoothstep(0.955,1.0,lf);",
  "  lay+=vec3(1.0,0.93,0.76)*lineE*0.26;",
  "  float edge=1.0-smoothstep(0.972,1.0,rr);",
  "  lay+=vec3(1.0,0.90,0.70)*smoothstep(0.945,1.0,rr)*0.55;",
  "  if(uIsSun>0.5){",
  "    float pl=fbm(vec2(rw*8.0,ang*3.2)+uTime*0.07);",
  "    lay=mix(lay,vec3(1.0,0.74,0.34),pl*0.85);",
  "    lay*=0.86+0.42*sin(ang*7.0+rw*24.0+uTime*0.10);",
  "    lay+=vec3(1.0,0.96,0.86)*smoothstep(0.26,0.02,rw)*1.15;",
  "    lay*=1.0-0.55*smoothstep(0.72,1.0,rw);",
  "    lay+=vec3(1.0,0.72,0.34)*smoothstep(0.93,0.985,rr)*0.9;",
  "  }",
  "  lay*=edge;",
  "  vec3 col=mix(lit,lay,smoothstep(0.02,0.85,uFlat));",
  "  float flash=smoothstep(0.0,0.22,uFlat)*(1.0-smoothstep(0.22,0.62,uFlat));",
  "  col+=vec3(0.85,0.93,1.0)*flash*0.85;",
  "  col*=uGlow;",
  "  if(uFlat>0.5 && edge<0.02) discard;",
  "  gl_FragColor=vec4(col,1.0);",
  "}"
].join("\n");

/* ==========================================================
   4. 天体

function makeBody(def){
  const geo=new THREE.SphereGeometry(def.r,72,44);
  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uFlat:{value:0}, uExpand:{value:def.expand}, uR:{value:def.r},
      uTime:{value:0}, uIsSun:{value:def.isSun?1:0}, uGlow:{value:1},
      uMap:{value:surfaceTex(def.t.k,def.t.p,def.key.length*37+7)},
      uSun:{value:SUNPOS},
      uL1:{value:col3(def.lay[0])}, uL2:{value:col3(def.lay[1])},
      uL3:{value:col3(def.lay[2])}, uL4:{value:col3(def.lay[3])}
    },
    vertexShader:BODY_VERT, fragmentShader:BODY_FRAG, side:THREE.DoubleSide
  });
  const m=new THREE.Mesh(geo,mat);
  m.rotation.z=(def.key.length%5)*0.06;
  bodyGroup.add(m);
  def.mesh=m; def.mat=mat; def.flat=0; def.pos=new THREE.Vector3();
  /* 轨道线 */
  if(def.a>0){
    const pts=[];
    for(let i=0;i<=180;i++){
      const t=i/180*TAU;
      const x=Math.cos(t)*def.a, z0=Math.sin(t)*def.a, s=Math.sin(def.inc*D2R), c=Math.cos(def.inc*D2R);
      pts.push(new THREE.Vector3(x,z0*s,z0*c));
    }
    const g=new THREE.BufferGeometry().setFromPoints(pts);
    const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x2e5f8e,transparent:true,opacity:0.34}));
    orbitGroup.add(l); def.orbit=l;
  }
  /* 土星环 */
  if(def.ring){
    const rg=new THREE.RingGeometry(def.ring[0],def.ring[1],128,4);
    const rc=cvs(256,8), rx=rc.getContext("2d");
    for(let i=0;i<256;i++){
      const n=fbm2(i/256,0.5,9,4,17);
      const a=0.16+0.72*n*(i>18&&i<232?1:0.15);
      rx.fillStyle="rgba("+(226-40*n)+","+(206-46*n)+","+(168-40*n)+","+a.toFixed(3)+")";
      rx.fillRect(i,0,1,8);
    }
    const rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:tex(rc),transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    rm.rotation.x=-Math.PI/2;
    const holder=new THREE.Group(); holder.add(rm); holder.rotation.z=0.42;
    bodyGroup.add(holder); def.ringObj=holder;
  }
  return def;
}

function pointField(n,rmin,rmax,thick,size){
  const pos=new Float32Array(n*3), sz=new Float32Array(n), ti=new Float32Array(n);
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU), r=rmin+Math.pow(Math.random(),0.7)*(rmax-rmin);
    pos[i*3]=Math.cos(a)*r;
    pos[i*3+1]=(Math.random()*2-1)*thick*(0.35+0.65*Math.random());
    pos[i*3+2]=Math.sin(a)*r;
    sz[i]=rnd(0.5,2.0); ti[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("aSize",new THREE.BufferAttribute(sz,1));
  g.setAttribute("aTint",new THREE.BufferAttribute(ti,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uFront:{value:0.001},uFoil:{value:new THREE.Vector3()},uSize:{value:size},uOn:{value:0}},
    vertexShader:FLAT_VERT, fragmentShader:FLAT_FRAG,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const p=new THREE.Points(g,m); p.frustumCulled=false; scene.add(p);
  return p;
}

  story.fallT=0; story.front=0.001; story.shock=0;
  for(let i=0;i<BODIES.length;i++){ BODIES[i].flat=0; }
  moon.flat=0;
  foil.visible=false; plane.visible=false; frontShell.visible=false; ship.visible=false;
  foilMat.uniforms.uOp.value=1;
  stars.material.uniforms.uOn.value=0; belt.material.uniforms.uOn.value=0;
  stars.material.uniforms.uFront.value=0.001; belt.material.uniforms.uFront.value=0.001;
  planeU.uFront.value=0.001;
  $("#sub").classList.remove("on");
}

function stepSim(dt){
  story.t+=dt;
  while(story.ev<EVENTS.length && EVENTS[story.ev].t<=story.t){ EVENTS[story.ev].f(); story.ev++; }
  if(story.falling){
    story.fallT+=dt;
    story.front=0.55*Math.pow(story.fallT,2.45)+0.45;
  }
  story.shock=Math.max(0,story.shock-dt*0.9);
  const t=story.t;
  let flatN=0;
  for(let i=0;i<BODIES.length;i++){
    const b=BODIES[i];
    bodyPos(b,t,b.pos);
    if(story.falling && b.flat<1){
      if(b.pos.distanceTo(FOIL_POS)<story.front){
        if(b.flat===0) story.shock=1;
        b.flat=Math.min(1,b.flat+dt/1.8);
      }
    }
    if(b.flat>=0.999) flatN++;
    const f=smooth(b.flat);
    b.mesh.position.set(b.pos.x, b.pos.y*(1-f)+f*(0.12+i*0.035), b.pos.z);
    b.mesh.rotation.y=t*(0.35+i*0.05);
    b.mesh.rotation.z=(b.key.length%5)*0.06*(1-f);
    b.mat.uniforms.uFlat.value=f;
    b.mat.uniforms.uTime.value=t;
    if(b.ringObj){
      b.ringObj.position.copy(b.mesh.position);
      b.ringObj.rotation.z=0.42*(1-f);
      const s=1+(b.expand*0.42-1)*f;
      b.ringObj.scale.set(s,1,s);
    }
    if(b.orbit) b.orbit.material.opacity=0.34*(1-f)*(orbitOn?1:0);
  }
  /* 月球 */
  const ma=t*1.5;
  moon.pos.set(EARTH.pos.x+Math.cos(ma)*2.5, EARTH.pos.y+Math.sin(ma)*0.45, EARTH.pos.z+Math.sin(ma)*2.5);
  if(story.falling && moon.flat<1 && moon.pos.distanceTo(FOIL_POS)<story.front) moon.flat=Math.min(1,moon.flat+dt/1.8);
  if(moon.flat>=0.999) flatN++;
  const mf=smooth(moon.flat);
  moon.mesh.position.set(moon.pos.x, moon.pos.y*(1-mf)+mf*0.46, moon.pos.z);
  moon.mesh.rotation.y=t*0.4;
  moon.mat.uniforms.uFlat.value=mf;
  moon.mat.uniforms.uTime.value=t;
  /* 小行星带计一份 */
  if(story.falling && story.front>58) flatN++;
  story.flatN=flatN;
  /* 二向箔动画 */
  if(story.dropped){
    foil.rotation.y=t*0.55; foil.rotation.x=Math.sin(t*0.42)*0.6; foil.rotation.z=t*0.23;
    const s=story.falling?Math.max(0,1-story.fallT*1.1):1;
    foil.scale.setScalar(0.35+0.65*s);
    foilMat.uniforms.uOp.value=story.falling?Math.max(0,1-story.fallT*0.7):1;
    foilGlow.material.opacity=(story.falling?Math.max(0,1-story.fallT*0.55):0.9)*0.9;
  }
  /* 锋面 */
  if(story.falling){
    frontShell.scale.setScalar(story.front);
    frontU.uOp.value=clamp(1.15-story.front/900,0,1)*clamp(story.fallT*1.5,0,1);
    frontShell.visible=frontU.uOp.value>0.01;
    planeU.uFront.value=story.front;
    stars.material.uniforms.uFront.value=story.front;
    belt.material.uniforms.uFront.value=story.front;
  }
  /* 星环号 */
  if(ship.visible){
    const st=Math.max(0,t-41);
    bodyPos(EARTH,41,_v);
    const sp=6+st*st*3.2;
    ship.position.set(_v.x+sp*0.72, 2+st*st*1.5, _v.z+sp*0.62);
    ship.lookAt(ship.position.x+0.72,ship.position.y+0.55,ship.position.z+0.62);
    ship.userData.trail.material.opacity=clamp(0.9-st*0.09,0,1);
  }
}
let snapCam=false;
function seek(target){
  resetSim();
  const dt=0.05;
  for(let t=0;t<target;t+=dt) stepSim(dt);
  snapCam=true;
}

/* ==========================================================
   10. 相机
   ========================================================== */
let mode="cine", orbitOn=true, labelOn=true;
const CP=new THREE.Vector3(), CT=new THREE.Vector3();
const SHOTS=[
  {a:0,b:6.5,f:function(u){ const g=0.55+u*0.20, R=lerp(178,142,u);
      CP.set(Math.cos(g)*R, lerp(74,46,u), Math.sin(g)*R); CT.set(0,0,0); }},
  {a:6.5,b:10,f:function(u){ const e=smooth(u);
      CP.copy(FOIL_POS).add(_v.set(lerp(20,4.5,e),lerp(8.5,2.0,e),lerp(17,3.8,e)));
      CT.copy(FOIL_POS); }},
  {a:10,b:15.5,f:function(u){ const e=smooth(u); const p=EARTH.mesh.position;
      CP.set(p.x+lerp(8.5,5.0,e), lerp(4.2,1.5,e), p.z+lerp(7.5,4.2,e)); CT.copy(p); }},
  {a:15.5,b:21.5,f:function(u){ const g=1.35+u*0.55, R=lerp(48,92,u);
      CP.set(Math.cos(g)*R, lerp(12,32,u), Math.sin(g)*R); CT.set(0,0,0); }},
  {a:21.5,b:27,f:function(u){ const g=2.35+u*0.40, R=lerp(140,270,u);
      CP.set(Math.cos(g)*R, lerp(46,105,u), Math.sin(g)*R); CT.set(0,0,0); }},
  {a:27,b:34.5,f:function(u){ const e=smooth(u);
      CP.set(lerp(70,0,e), lerp(170,330,e), lerp(230,110,e)); CT.set(0,0,0); }},
  {a:34.5,b:41,f:function(u){ const e=smooth(u); const g=0.95+u*0.42, R=lerp(420,3200,e*e);
      CP.set(Math.cos(g)*R, lerp(80,14,e), Math.sin(g)*R); CT.set(0,0,0); }},
  {a:41,b:47,f:function(u){
      CP.copy(ship.position).add(_v.set(-16,7,18)); CT.copy(ship.position); }},
  {a:47,b:99,f:function(u){ const uu=clamp(u,0,1); const g=2.05+uu*0.45, R=lerp(300,520,uu);
      CP.set(Math.cos(g)*R, lerp(36,210,uu), Math.sin(g)*R); CT.set(0,0,0); }}
];
function setCam(m){
  mode=m;
  const n={cine:"电影",free:"自由",top:"俯瞰",edge:"侧视"};
  $("#camv").textContent=n[m]||m;
  document.body.classList.toggle("cine",m==="cine");
  controls.enabled=(m==="free");
  if(m==="free"){ controls.target.set(0,0,0); }
}
function updateCamera(dt){
  if(mode!=="top") camera.up.set(0,1,0);
  if(mode==="cine"){
    let S=SHOTS[SHOTS.length-1];
    for(let i=0;i<SHOTS.length;i++){ if(story.t>=SHOTS[i].a && story.t<SHOTS[i].b){ S=SHOTS[i]; break; } }
    S.f(clamp((story.t-S.a)/(S.b-S.a),0,1));
    if(snapCam){ camera.position.copy(CP); controls.target.copy(CT); snapCam=false; }
    else{
      camera.position.lerp(CP,1-Math.exp(-3.4*dt));
      _v2.lerpVectors(controls.target,CT,1-Math.exp(-4.0*dt));
      controls.target.copy(_v2);
    }
    camera.lookAt(controls.target);
  } else if(mode==="free"){
    controls.update();
  } else if(mode==="top"){
    const R=story.falling?clamp(story.front*1.5,130,330):160;
    camera.up.set(0,0,-1);
    camera.position.lerp(_v.set(0,R,0.001),1-Math.exp(-3*dt));
    controls.target.set(0,0,0); camera.lookAt(0,0,0);
  } else {
    const R=story.falling?3200:190;
    const g=story.t*0.055;
    camera.position.lerp(_v.set(Math.cos(g)*R,story.falling?14:6,Math.sin(g)*R),1-Math.exp(-2.2*dt));
    controls.target.set(0,0,0); camera.lookAt(0,0,0);
  }
}

/* ==========================================================
   11. 界面
   ========================================================== */
let toastT=0;
function toast(m){ const e=$("#toast"); e.textContent=m; e.classList.add("on"); toastT=2.2; }
function segSet(attr,val){
  document.querySelectorAll("["+attr+"]").forEach(function(b){ b.classList.toggle("on",b.getAttribute(attr)===val); });
}
document.querySelectorAll("[data-cam]").forEach(function(b){
  b.addEventListener("click",function(){ setCam(b.dataset.cam); segSet("data-cam",b.dataset.cam); });
});
document.querySelectorAll("[data-spd]").forEach(function(b){
  b.addEventListener("click",function(){ story.speed=parseFloat(b.dataset.spd); segSet("data-spd",b.dataset.spd);
    $("#spdv").textContent=story.speed.toFixed(2).replace(/0$/,"")+"x"; });
});
document.querySelectorAll("[data-tg]").forEach(function(b){
  b.addEventListener("click",function(){
    const k=b.dataset.tg, on=!b.classList.contains("on");
    b.classList.toggle("on",on);
    if(k==="orbit"){ orbitOn=on; orbitGroup.visible=on; }
    if(k==="label"){ labelOn=on; document.body.classList.toggle("nolab",!on); }
    if(k==="bloom"){ bloom.strength=on?0.52:0; }
    if(k==="grain"){ grade.uniforms.uGrain.value=on?0.035:0; grade.uniforms.uVig.value=on?1:0.25; }
  });
});
$("#pp").addEventListener("click",function(){ story.playing=!story.playing;
  this.innerHTML=story.playing?"&#10073;&#10073;":"&#9654;"; });
$("#bdrop").addEventListener("click",function(){ if(story.t<10){ seek(10.05); } else { toast("跌落已经开始了"); } });
$("#breset").addEventListener("click",function(){ seek(0); story.playing=true; $("#pp").innerHTML="&#10073;&#10073;"; toast("回到公元 2400 年"); });
$("#bskip").addEventListener("click",function(){ seek(46); toast("跳至终局"); });
$("#bshot").addEventListener("click",function(){
  composer.render();
  const a=document.createElement("a");
  a.download="二向箔-"+Date.now()+".png";
  a.href=renderer.domElement.toDataURL("image/png"); a.click();
  toast("已保存这一帧");
});
(function(){
  const bar=$("#bar");
  let drag=false;
  function go(e){
    const r=bar.getBoundingClientRect();
    const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width;
    seek(clamp(x,0,1)*TOTAL);
  }
  bar.addEventListener("mousedown",function(e){ drag=true; go(e); });
  addEventListener("mousemove",function(e){ if(drag) go(e); });
  addEventListener("mouseup",function(){ drag=false; });
  bar.addEventListener("touchstart",function(e){ go(e); e.preventDefault(); },{passive:false});
  bar.addEventListener("touchmove",function(e){ go(e); e.preventDefault(); },{passive:false});
})();
addEventListener("keydown",function(e){
  if(e.code==="Space"){ e.preventDefault(); $("#pp").click(); }
  if(e.code==="KeyR"){ $("#breset").click(); }
  if(e.code==="KeyD"){ $("#bdrop").click(); }
  if(e.code==="KeyE"){ setCam("edge"); segSet("data-cam","edge"); }
  if(e.code==="KeyF"){ setCam("free"); segSet("data-cam","free"); }
  if(e.code==="KeyC"){ setCam("cine"); segSet("data-cam","cine"); }
  if(e.code==="KeyT"){ setCam("top"); segSet("data-cam","top"); }
  if(e.code==="KeyH"){ document.body.classList.toggle("nolab"); }
});

/* ==========================================================
   12. 主循环
   ========================================================== */
function fmt(s){
  s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
let hudT=0;
function updateHUD(dt){
  hudT-=dt;
  const pct=clamp(story.t/TOTAL,0,1);
  $("#bar").children[0].style.width=(pct*100)+"%";
  $("#bar").children[1].style.left=(pct*100)+"%";
  if(hudT>0) return;
  hudT=0.12;
  $("#tt").textContent=fmt(story.t)+" / "+fmt(TOTAL);
  $("#era").textContent = story.t<6.5?"公元 2400 年" : (story.falling?"跌落纪元":"公元 2400 年");
  $("#rad").textContent = story.falling?(story.front<1000?story.front.toFixed(1):(story.front/1000).toFixed(2)+"k")+" AU":"—";
  const n=story.flatN||0;
  $("#cnt").textContent=n+" / 11";
  $("#dim").textContent=(3-Math.min(1,n/11)).toFixed(3);
  if(toastT>0){ toastT-=0.12; if(toastT<=0) $("#toast").classList.remove("on"); }
}
const _sp=new THREE.Vector3();
function updateLabels(){
  if(!labelOn || mode==="cine"){ return; }
  for(let i=0;i<BODIES.length;i++){
    const b=BODIES[i], e=b.label;
    _sp.copy(b.mesh.position); _sp.y+=b.r*(1-b.flat)*1.6+1.2;
    _sp.project(camera);
    const vis=_sp.z<1 && b.flat<0.995;
    e.style.opacity=vis?"":"0";
    if(vis){
      e.style.left=((_sp.x*0.5+0.5)*innerWidth)+"px";
      e.style.top=((-_sp.y*0.5+0.5)*innerHeight)+"px";
    }
  }
}
addEventListener("resize",function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});
let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  if(story.playing && story.t<TOTAL) stepSim(dt*story.speed);
  else if(!story.playing) stepSim(0);
  planeU.uTime.value+=dt; frontU.uTime.value+=dt;
  foilMat.uniforms.uTime.value+=dt;
  grade.uniforms.uTime.value+=dt;
  grade.uniforms.uCA.value=damp(grade.uniforms.uCA.value, story.shock*0.9, 6, dt);
  renderer.toneMappingExposure=0.94+story.shock*0.22;
  updateCamera(dt);
  updateLabels();
  updateHUD(dt);
  composer.render();
}
setCam("cine");
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get("t")) seek(parseFloat(q.get("t")));
  if(q.get("cam")){ setCam(q.get("cam")); segSet("data-cam",q.get("cam")); }
  if(q.get("pause")) story.playing=false;
})();
if(location.search.indexOf("dbg")>=0){
  setTimeout(function(){
    const v=new THREE.Vector3();
    camera.updateMatrixWorld(true);
    let si=-1;
    for(let i=0;i<SHOTS.length;i++){ if(story.t>=SHOTS[i].a && story.t<SHOTS[i].b){ si=i; break; } }
    console.log("DBG t="+story.t.toFixed(2)+" shot="+si+" CP="+CP.toArray().map(function(n){return n.toFixed(1);}).join(",")+
      " CT="+CT.toArray().map(function(n){return n.toFixed(1);}).join(",")+
      " earth="+EARTH.mesh.position.toArray().map(function(n){return n.toFixed(1);}).join(","));
    console.log("DBG cam="+camera.position.toArray().map(function(n){return n.toFixed(1);}).join(",")+
      " tgt="+controls.target.toArray().map(function(n){return n.toFixed(1);}).join(",")+" mode="+mode);
    for(let i=0;i<BODIES.length;i++){
      const b=BODIES[i];
      v.copy(b.mesh.position).project(camera);
      console.log("DBG "+b.key+" flat="+b.flat.toFixed(2)+" uFlat="+b.mat.uniforms.uFlat.value.toFixed(2)+
        " pos="+b.mesh.position.toArray().map(function(n){return n.toFixed(1);}).join(",")+
        " r2d="+(b.r*b.expand).toFixed(1)+
        " screen="+((v.x*0.5+0.5)*innerWidth).toFixed(0)+","+((-v.y*0.5+0.5)*innerHeight).toFixed(0)+" z="+v.z.toFixed(3)+
        " vis="+b.mesh.visible);
    }
  }, 3000);
}
step(100,"就绪");
setTimeout(function(){ $("#loader").classList.add("out"); },500);
animate();
</script>
