</style></head><body><main><header><div><h1>ASCII <span>/</span> FPV</h1><small>城市飞行 · CHARACTER FLIGHT</small></div><div class="actions"><button class="primary" id="toggle">开始飞行</button><button id="reset">重新起飞 R</button></div></header>

<section class="hud" aria-label="飞行仪表"><div class="metric"><label>空速 / SPEED</label><strong id="speed">25</strong><em>m/s</em></div><div class="metric"><label>高度 / ALTITUDE</label><strong id="alt">25</strong><em>m</em></div><div class="metric"><label>俯仰 / PITCH</label><strong id="pitch">0</strong><em>°</em></div><div class="metric"><label>滚转 / BANK</label><strong id="roll">0</strong><em>°</em></div><div class="metric"><label>航向 / HEADING</label><strong id="heading">000</strong><em>°</em></div><div class="metric"><label>转弯率 / TURN</label><strong id="turn">0</strong><em>°/s</em></div></section>

<div class="touch" aria-label="触屏操纵"><button data-key="w">W ↓</button><button data-key="s">S ↑</button><button data-key="a">A 左</button><button data-key="d">D 右</button><button data-key="z">Z +</button><button data-key="x">X −</button></div>
<footer><span>角速率操纵 · 松键保持姿态 · 俯仰 / 滚转 ±45°</span><span>45° 滚转 → 90°/s 协调转弯 · 速度 10–50 m/s</span></footer></main>
<script>
'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),D=Math.PI/180,keys=new Set();
let state,mode='ready',last=0,acc=0,cols=160,rows=70,cw=8,ch=14;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const mod=(n,m)=>((n%m)+m)%m;
function fresh(){state={x:3,y:25,z:0,pitch:0,roll:0,yaw:0,speed:25,distance:0};keys.clear();}
function setMode(m){mode=m;$('overlay').classList.toggle('hidden',m==='flying');$('toggle').textContent=m==='flying'?'暂停飞行':m==='crashed'?'重新起飞':'开始飞行';$('message').textContent=m==='crashed'?'飞行结束':m==='paused'?'已暂停':'准备起飞';$('hint').textContent=m==='crashed'?'碰到了建筑、树木或地面。调整姿态，再试一次。':m==='paused'?'姿态已保持，准备好后继续。':'沿着街道，穿过字符构成的城市。';$('prompt').textContent=m==='crashed'?'按 R 或空格重新起飞':'按空格或点击「开始飞行」';}
function toggle(){if(mode==='crashed')fresh();setMode(mode==='flying'?'paused':'flying');keys.clear();}
$('toggle').onclick=toggle;$('reset').onclick=()=>{fresh();setMode('flying');};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','s','a','d','z','x',' ','r'].includes(k)){if(e.target.tagName==='BUTTON'&&k===' ')return;e.preventDefault();if(e.repeat)return;if(k===' ')toggle();else if(k==='r'){fresh();setMode('flying');}else keys.add(k);}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();if(mode==='flying')setMode('paused');});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='flying'){keys.clear();setMode('paused');}});
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.key);});
const cache=new Map();
function cell(ix,iz){let key=ix+','+iz;if(cache.has(key))return cache.get(key);let hash=mod(Math.sin(ix*127.1+iz*311.7)*43758.5453,1),x=ix*64,z=iz*64,h=24+hash*65;let o={x:x+15,z:z+15,w:32+hash*4,h,shade:Math.floor(hash*3),trees:[[x+10,z+20,7],[x+10,z+45,8],[x+53,z+25,9],[x+32,z+54,7]]};cache.set(key,o);if(cache.size>3000)cache.clear();return o;}
function inside(x,y,z){if(y<=1)return true;let o=cell(Math.floor(x/64),Math.floor(z/64));if(x>o.x-1&&x<o.x+o.w+1&&z>o.z-1&&z<o.z+o.w+1&&y<o.h+1)return true;return o.trees.some(t=>Math.hypot(x-t[0],y-t[2],z-t[1])<4||(Math.hypot(x-t[0],z-t[1])<1.5&&y<t[2]));}
function step(dt){if(mode!=='flying')return;state.pitch=clamp(state.pitch+((keys.has('s')?1:0)-(keys.has('w')?1:0))*30*dt,-45,45);state.roll=clamp(state.roll+((keys.has('d')?1:0)-(keys.has('a')?1:0))*45*dt,-45,45);state.speed=clamp(state.speed+((keys.has('z')?1:0)-(keys.has('x')?1:0))*10*dt,10,50);state.yaw=mod(state.yaw+state.roll*2*dt,360);let p=state.pitch*D,y=state.yaw*D,dist=state.speed*dt;state.x+=Math.sin(y)*Math.cos(p)*dist;state.z+=Math.cos(y)*Math.cos(p)*dist;state.y+=Math.sin(p)*dist;state.distance+=dist;if(inside(state.x,state.y,state.z)){keys.clear();setMode('crashed');}}
const palette=['#32414b','#59656b','#bcae69','#344d42','#7594ac','#96b2c8','#526f86','#bed5dd','#4a8462','#70ad77','#805f42','#566c80'];
// Software ray / geometry intersections. Only fillText draws the scene: no WebGL, meshes, or pixel surfaces.
function ray(dx,dy,dz){let ox=state.x,oy=state.y,oz=state.z,tBest=dy<-.0001?-oy/dy:650,type=tBest<650?0:-1,side=0,obj=null; tBest=Math.min(tBest,650);let ix=Math.floor(ox/64),iz=Math.floor(oz/64),sx=dx>=0?1:-1,sz=dz>=0?1:-1,tx=dx?((ix+(sx>0?1:0))*64-ox)/dx:Infinity,tz=dz?((iz+(sz>0?1:0))*64-oz)/dz:Infinity,dtx=Math.abs(64/dx),dtz=Math.abs(64/dz);
for(let n=0;n<25;n++){let o=cell(ix,iz);let ax=(o.x-ox)/dx,bx=(o.x+o.w-ox)/dx,ay=-oy/dy,by=(o.h-oy)/dy,az=(o.z-oz)/dz,bz=(o.z+o.w-oz)/dz;let nx=Math.min(ax,bx),ny=Math.min(ay,by),nz=Math.min(az,bz),near=Math.max(nx,ny,nz),far=Math.min(Math.max(ax,bx),Math.max(ay,by),Math.max(az,bz));if(near>0&&near<=far&&near<tBest){tBest=near;type=1;side=near===ny?2:near===nx?0:1;obj=o;}
for(let t of o.trees){let vx=ox-t[0],vy=oy-t[2],vz=oz-t[1],b=vx*dx+vy*dy+vz*dz,c=vx*vx+vy*vy+vz*vz-12.25,disc=b*b-c;if(disc>0){let d=-b-Math.sqrt(disc);if(d>0&&d<tBest){tBest=d;type=2;}}let a=(t[0]-.65-ox)/dx,bb=(t[0]+.65-ox)/dx,c1=-oy/dy,d1=(t[2]-oy)/dy,e=(t[1]-.65-oz)/dz,f=(t[1]+.65-oz)/dz,nt=Math.max(Math.min(a,bb),Math.min(c1,d1),Math.min(e,f)),ft=Math.min(Math.max(a,bb),Math.max(c1,d1),Math.max(e,f));if(nt>0&&nt<=ft&&nt<tBest){tBest=nt;type=3;}}
if(Math.min(tx,tz)>tBest)break;if(tx<tz){ix+=sx;tx+=dtx;}else{iz+=sz;tz+=dtz;}}
if(type===-1)return null;let x=ox+dx*tBest,y=oy+dy*tBest,z=oz+dz*tBest;
if(type===0){let u=mod(x,64),v=mod(z,64),road=u<7||u>57||v<7||v>57;if(road){let line=((u<.55||u>63.45)&&mod(z,13)<7)||((v<.55||v>63.45)&&mod(x,13)<7);return [line?'=':'.',line?2:0,tBest];}return [u<13||u>51||v<13||v>51?':':',',u<13||u>51||v<13||v>51?1:3,tBest];}
if(type===2)return ['*+o'[mod(Math.floor(x*2+y*2+z*2),3)],y%3>1?9:8,tBest];if(type===3)return ['|',10,tBest];
if(side===2)return ['-',11,tBest];let horizontal=side===0?z:x,window=mod(horizontal,6)>1.6&&mod(horizontal,6)<4.3&&mod(y,5)>1.2&&mod(y,5)<3.6;return [window?'#':side===0?'|':':',window?7:side===0?4:6,tBest];}
function resize(){let w=canvas.clientWidth,h=canvas.clientHeight;cols=clamp(Math.floor(w/8),80,190);rows=Math.floor(cols*h/w/1.75);canvas.width=cols*8;canvas.height=rows*14;ctx.font='13px Consolas, monospace';ctx.textBaseline='top';}new ResizeObserver(resize).observe(canvas);
function render(){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);let yaw=state.yaw*D,p=state.pitch*D,r=state.roll*D,sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(p),cp=Math.cos(p),sr=Math.sin(r),cr=Math.cos(r);let fx=sy*cp,fy=sp,fz=cy*cp,rx=cy*cr+sy*sp*sr,ry=-cp*sr,rz=-sy*cr+cy*sp*sr,ux=cy*sr-sy*sp*cr,uy=cp*cr,uz=-sy*sr-cy*sp*cr,aspect=canvas.width/canvas.height;
for(let j=0;j<rows;j++){let yy=(1-2*(j+.5)/rows)*.83/aspect;for(let i=0;i<cols;i++){let xx=(2*(i+.5)/cols-1)*.83,dx=fx+rx*xx+ux*yy,dy=fy+ry*xx+uy*yy,dz=fz+rz*xx+uz*yy,l=Math.hypot(dx,dy,dz);let hit=ray(dx/l,dy/l,dz/l);if(hit){ctx.globalAlpha=clamp(1-hit[2]/850,.25,1);ctx.fillStyle=palette[hit[1]];ctx.fillText(hit[0],i*8,j*14);}}}ctx.globalAlpha=1;ctx.fillStyle='#8bedb5';ctx.fillText('-- + --',Math.floor(cols/2)*8-24,Math.floor(rows/2)*14);ctx.fillStyle='#83969c';ctx.fillText('N '+Math.round(state.yaw).toString().padStart(3,'0')+' / FPV',16,14);ctx.fillText(mode==='flying'?'LIVE':'HOLD',canvas.width-48,14);$('speed').textContent=state.speed.toFixed(0);$('alt').textContent=state.y.toFixed(0);$('pitch').textContent=state.pitch.toFixed(0);$('roll').textContent=state.roll.toFixed(0);$('heading').textContent=Math.floor(state.yaw).toString().padStart(3,'0');$('turn').textContent=(state.roll*2).toFixed(0);}
function frame(t){let dt=Math.min((t-last)/1000,.1);last=t;for(let remain=dt;remain>0;remain-=1/120)step(Math.min(remain,1/120));acc+=dt;if(acc>=1/30){render();acc=0;}requestAnimationFrame(frame);}
fresh();resize();render();requestAnimationFrame(frame);
window.flight={getState:()=>({...state,mode}),step,reset:()=>{fresh();setMode('ready');}};
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'flight_control',description:'Start, pause, reset, or read the flight simulator.',inputSchema:{type:'object',properties:{action:{type:'string',enum:['start','pause','reset','read']}},required:['action'],additionalProperties:false},execute:({action})=>{if(!['start','pause','reset','read'].includes(action))throw Error('Invalid action');if(action==='start'){if(mode==='crashed')fresh();setMode('flying');}if(action==='pause')setMode('paused');if(action==='reset'){fresh();setMode('ready');}return window.flight.getState();}});}catch(e){console.warn('Flight tools unavailable',e);}}
