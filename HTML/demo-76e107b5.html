<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Schwarzschild Black Hole — Real-time WebGL Simulation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  #c{display:block;width:100%;height:100%;cursor:grab}
  #c:active{cursor:grabbing}

  #panel{
    position:fixed;top:14px;right:14px;width:272px;max-height:calc(100vh - 28px);
    overflow-y:auto;padding:14px 14px 18px;border-radius:12px;
    background:rgba(6,9,16,.80);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(120,160,255,.18);
    box-shadow:0 10px 40px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    color:#b9c6dd;font-size:11px;line-height:1.45;z-index:10;
    scrollbar-width:thin;scrollbar-color:#2a3550 transparent;
  }
  #panel::-webkit-scrollbar{width:6px}
  #panel::-webkit-scrollbar-thumb{background:#2a3550;border-radius:3px}
  #panel h1{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:#8fb4ff;margin-bottom:2px;text-shadow:0 0 14px rgba(90,140,255,.55)}
  #panel .sub{font-size:9.5px;color:#5a6a88;letter-spacing:.06em;margin-bottom:12px}
  .grp{border-top:1px solid rgba(120,160,255,.11);margin-top:11px;padding-top:9px}
  .grp>.ttl{font-size:9.5px;letter-spacing:.16em;color:#6f86ad;text-transform:uppercase;margin-bottom:7px}
  .row{margin-bottom:8px}

  .row label span{color:#6fd2ff;font-variant-numeric:tabular-nums;font-size:10px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#2a6bff 0%,#7a4bff 100%);outline:none;opacity:.85}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#8fc0ff 45%,#3d6ee8);

  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;

  .chk input{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:3px;
    border:1px solid rgba(120,160,255,.4);background:rgba(30,45,80,.55);cursor:pointer;position:relative;flex:0 0 auto}
  .chk input:checked{background:linear-gradient(135deg,#3d7bff,#8b4bff);border-color:#6d9bff}
  .chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;

  #reset{width:100%;margin-top:10px;padding:7px;border-radius:7px;cursor:pointer;
    background:rgba(50,80,150,.35);border:1px solid rgba(120,160,255,.28);color:#a8c2ee;
    font-family:inherit;font-size:10px;letter-spacing:.1em;transition:.18s}
  #reset:hover{background:rgba(70,110,200,.5);color:#dbe7ff;box-shadow:0 0 14px rgba(80,140,255,.35)}
  #hud{position:fixed;left:16px;bottom:14px;font-size:10px;color:#4d5f7c;letter-spacing:.08em;
    pointer-events:none;text-shadow:0 0 10px #000}
  #hud b{color:#6fd2ff;font-weight:500}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#ff8080;background:#000;font-size:13px;text-align:center;padding:30px;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Schwarzschild</h1>
  <div class="sub">REAL-TIME GEODESIC RAYTRACER</div>
  <div id="controls"></div>
  <button id="reset">RESET PARAMETERS</button>
</div>
<div id="hud"></div>
<div id="err"></div>

<script>
"use strict";
/* ==========================================================================
   Schwarzschild Black Hole — WebGL2 real-time renderer
   Physics: null geodesics integrated with RK4 in Cartesian form
            d²x/dλ² = -(3/2)·Rs·h²·x / r⁵   (h = |x × dx/dλ| conserved)
   ========================================================================== */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false,
  powerPreference: 'high-performance'
});

if (!gl) {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'WebGL2 is not available in this browser. Please use a recent version of Chrome, Edge, Firefox or Safari.';
  throw new Error('no webgl2');
}

/* ---------- float render target support ---------- */
const hasFloatRT = !!(gl.getExtension('EXT_color_buffer_float') ||
                      gl.getExtension('EXT_color_buffer_half_float'));
const RT_INTERNAL = hasFloatRT ? gl.RGBA16F : gl.RGBA8;
const RT_TYPE     = hasFloatRT ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

/* ==========================================================================
   SHADERS
   ========================================================================== */

const VS_QUAD = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/* --------------------------------------------------------------------------
   MAIN GEODESIC TRACER
   -------------------------------------------------------------------------- */
const FS_TRACE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform mat3  uCamMat;
uniform float uTanHalfFov;
uniform float uAspect;
uniform int   uMaxSteps;
uniform float uStepSize;
uniform float uEscapeR;

uniform int   uShowDisk;
uniform int   uLensing;
uniform float uDiskInner;
uniform float uDiskOuter;
uniform float uDiskBright;
uniform float uDiskTemp;
uniform float uDiskOpacity;
uniform float uSpin;
uniform float uDoppler;
uniform float uTurb;

uniform int   uShowStars;
uniform float uStarBright;
uniform float uNebula;

const float RS = 1.0;

/* ---------------- hash & noise ---------------- */
float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0 - 2.0*f);
  float n000 = hash13(i + vec3(0.0,0.0,0.0));
  float n100 = hash13(i + vec3(1.0,0.0,0.0));
  float n010 = hash13(i + vec3(0.0,1.0,0.0));
  float n110 = hash13(i + vec3(1.0,1.0,0.0));
  float n001 = hash13(i + vec3(0.0,0.0,1.0));
  float n101 = hash13(i + vec3(1.0,0.0,1.0));
  float n011 = hash13(i + vec3(0.0,1.0,1.0));
  float n111 = hash13(i + vec3(1.0,1.0,1.0));
  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for(int i=0;i<5;i++){
    v += a * vnoise(p);
    p = p * 2.03 + 11.31;
    a *= 0.5;
  }
  return v;
}

/* ---------------- blackbody color (Planck locus approx) ---------------- */
vec3 blackbody(float T){
  T = clamp(T, 1000.0, 40000.0);
  float t = T * 0.01;
  float r, g, b;
  if (t <= 66.0){
    r = 255.0;
    g = 99.4708025861 * log(t) - 161.1195681661;
  } else {
    r = 329.698727446 * pow(t - 60.0, -0.1332047592);
    g = 288.1221695283 * pow(t - 60.0, -0.0755148492);
  }
  if (t >= 66.0)       b = 255.0;
  else if (t <= 19.0)  b = 0.0;
  else                 b = 138.5177312231 * log(t - 10.0) - 305.0447927307;
  return clamp(vec3(r,g,b) * 0.00392156862, 0.0, 1.0);
}

/* ---------------- gravitational acceleration ---------------- */
vec3 accel(vec3 p, float h2){
  float r2 = dot(p, p);
  float r  = sqrt(r2);
  float r5 = r2 * r2 * r;
  return -1.5 * RS * h2 * p / max(r5, 1e-4);
}

/* ---------------- accretion disk shading ---------------- */
vec4 diskShade(vec3 hp, vec3 photonDir){
  float r = length(hp.xz);
  float rn = (r - uDiskInner) / max(uDiskOuter - uDiskInner, 0.001);

  /* --- orbital velocity (Keplerian, v = sqrt(M/r), M = Rs/2 = 0.5) --- */
  float beta = min(sqrt(0.5 * RS / r), 0.92);
  vec3  phihat = normalize(vec3(hp.z, 0.0, -hp.x));
  vec3  bvec = beta * phihat;

  /* --- relativistic Doppler + gravitational redshift --- */
  vec3  nhat = -photonDir;                       /* source -> observer */
  float gam  = 1.0 / sqrt(max(1.0 - beta*beta, 1e-3));
  float dop  = 1.0 / (gam * (1.0 - dot(bvec, nhat)));
  float grav = sqrt(max(1.0 - RS / r, 1e-3));
  float g = clamp(pow(dop, uDoppler) * grav, 0.05, 4.0);

  /* --- observed temperature --- */
  float T = uDiskTemp * pow(uDiskInner / r, 0.75);
  vec3  col = blackbody(T * g);

  /* --- turbulence (differential rotation, log-polar noise) --- */
  float omega = sqrt(0.5 * RS / (r*r*r));
  float ang   = atan(hp.z, hp.x) - omega * uTime * uSpin;
  float lr    = log(max(r / uDiskInner, 0.001));
  vec3  q     = vec3(cos(ang) * 2.0, sin(ang) * 2.0, lr * 12.0);
  float n     = fbm(q);
  float dens  = smoothstep(0.34, 0.76, n);
  dens = mix(1.0, 0.25 + 0.75 * dens, uTurb);

  /* --- radial profile & edge falloff --- */
  float lum  = pow(uDiskInner / r, 2.2);
  lum *= pow(g, 3.0);
  float edge = smoothstep(0.0, 0.045, rn) * (1.0 - smoothstep(0.55, 1.0, rn));

  vec3  emis  = col * lum * dens * edge * uDiskBright * 4.0;
  float alpha = clamp(dens * edge * 1.1, 0.0, 1.0);
  return vec4(emis, alpha);
}

/* ---------------- deep-sky background ---------------- */
vec3 starfield(vec3 dir){
  vec3 c = vec3(0.0);

  /* faint nebulosity */
  if (uNebula > 0.001){
    float n1 = fbm(dir * 2.4);
    float n2 = fbm(dir * 6.1 + 17.0);
    vec3 neb = mix(vec3(0.020,0.032,0.085), vec3(0.085,0.033,0.125), n1);
    neb += vec3(0.022,0.010,0.002) * pow(n2, 3.0);
    /* galactic band */
    float band = exp(-pow(dir.y * 3.4, 2.0));
    neb += vec3(0.045,0.048,0.070) * band * n1;
    c += neb * (0.30 + 0.70 * n2) * uNebula;
  }

  /* stars: three octaves of jittered cubical lattices */
  if (uShowStars == 1){
    for (int i = 0; i < 3; i++){
      float sc = 42.0 * pow(2.15, float(i));
      vec3  p  = dir * sc;
      vec3  id = floor(p);
      vec3  fr = p - id;
      vec3  rnd = hash33(id);
      if (rnd.x < 0.952) continue;
      vec3  sp = vec3(0.25) + rnd * 0.5;
      float d  = length(fr - sp);
      float bright = exp(-d * d * 520.0) * (0.30 + 0.70 * fract(rnd.y * 7.31));
      bright *= (1.0 + 5.0 * pow(fract(rnd.y * 3.77), 8.0));   /* few bright stars */
      vec3 tint = blackbody(mix(2600.0, 14000.0, fract(rnd.z * 13.7)));
      c += tint * bright;
    }
  }
  return c * uStarBright;
}

/* ========================================================================= */
void main(){
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec3 rd = normalize(uCamMat * vec3(ndc.x * uAspect * uTanHalfFov,
                                     ndc.y * uTanHalfFov,
                                     1.0));
  vec3 ro = uCamPos;

  vec3  col   = vec3(0.0);
  float trans = 1.0;

  vec3 p = ro;
  vec3 v = rd;
  vec3 hv = cross(p, v);
  float h2 = dot(hv, hv) * float(uLensing);

  bool captured = false;
  bool escaped  = false;

  for (int i = 0; i < 512; i++){
    if (i >= uMaxSteps) break;

    float r = length(p);
    if (r < RS * 1.0008){ captured = true; break; }
    if (r > uEscapeR && dot(p, v) > 0.0){ escaped = true; break; }

    float dt = uStepSize * (0.045 + 0.20 * r);
    dt = min(dt, 2.5);

    vec3 p0 = p;

    /* --- RK4 --- */
    vec3 k1x = v;
    vec3 k1v = accel(p, h2);
    vec3 k2x = v + 0.5 * dt * k1v;
    vec3 k2v = accel(p + 0.5 * dt * k1x, h2);
    vec3 k3x = v + 0.5 * dt * k2v;
    vec3 k3v = accel(p + 0.5 * dt * k2x, h2);
    vec3 k4x = v + dt * k3v;
    vec3 k4v = accel(p + dt * k3x, h2);

    p += (dt / 6.0) * (k1x + 2.0*k2x + 2.0*k3x + k4x);
    v += (dt / 6.0) * (k1v + 2.0*k2v + 2.0*k3v + k4v);

    /* --- equatorial disk crossing --- */
    if (uShowDisk == 1 && p0.y * p.y < 0.0){
      float tt = p0.y / (p0.y - p.y);
      vec3  hp = mix(p0, p, tt);
      float rr = length(hp.xz);
      if (rr > uDiskInner && rr < uDiskOuter){
        vec4 e = diskShade(hp, normalize(v));
        col += trans * e.rgb;
        trans *= (1.0 - e.a * uDiskOpacity);
      }
    }
  }

  if (escaped){
    col += trans * starfield(normalize(v));
  }

  fragColor = vec4(col, 1.0);
}`;

/* --------------------------------------------------------------------------
   POST PROCESSING
   -------------------------------------------------------------------------- */
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uThreshold;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float l = max(max(c.r, c.g), c.b);
  float k = smoothstep(uThreshold, uThreshold * 1.7, l);
  fragColor = vec4(c * k, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uStep;
void main(){
  float w[5];
  w[0]=0.2270270270; w[1]=0.1945945946; w[2]=0.1216216216;
  w[3]=0.0540540541; w[4]=0.0162162162;
  vec3 s = texture(uTex, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++){
    vec2 o = uStep * float(i);
    s += texture(uTex, vUv + o).rgb * w[i];
    s += texture(uTex, vUv - o).rgb * w[i];
  }
  fragColor = vec4(s, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uBloomStrength;
uniform float uExposure;
uniform float uTime;
uniform float uVignette;
uniform float uGrain;

vec3 aces(vec3 x){
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
float hash(vec2 p){
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}
void main(){
  vec3 scene = texture(uScene, vUv).rgb;
  vec3 bloom = texture(uBloom, vUv).rgb;
  vec3 c = scene + bloom * uBloomStrength;
  c *= uExposure;
  c = aces(c);

  /* vignette */
  vec2 q = vUv - 0.5;
  float vig = 1.0 - uVignette * dot(q, q) * 2.6;
  c *= clamp(vig, 0.0, 1.0);

  /* subtle film grain */
  float g = hash(vUv * 1024.0 + fract(uTime) * 91.7) - 0.5;
  c += g * uGrain;

  c = pow(max(c, 0.0), vec3(0.4545454545));
  fragColor = vec4(c, 1.0);
}`;

/* ==========================================================================
   GL HELPERS
   ========================================================================== */
function compileShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    console.error(src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('shader compile failed');
  }
  return s;
}
function buildProgram(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error('program link failed');
  }
  return p;
}

const progTrace   = buildProgram(VS_QUAD, FS_TRACE);
const progBright  = buildProgram(VS_QUAD, FS_BRIGHT);
const progBlur    = buildProgram(VS_QUAD, FS_BLUR);
const progComp    = buildProgram(VS_QUAD, FS_COMP);

const _locCache = new WeakMap();
function L(prog, name){
  let m = _locCache.get(prog);
  if (!m){ m = new Map(); _locCache.set(prog, m); }
  let l = m.get(name);
  if (l === undefined){ l = gl.getUniformLocation(prog, name); m.set(name, l); }
  return l;
}

/* fullscreen triangle */
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

function makeRT(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, RT_INTERNAL, w, h, 0, gl.RGBA, RT_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (!ok) console.warn('incomplete framebuffer', w, h);
  return { tex, fb, w, h };
}
function destroyRT(rt){
  if (!rt) return;
  gl.deleteTexture(rt.tex);
  gl.deleteFramebuffer(rt.fb);
}

/* ==========================================================================
   PARAMETERS
   ========================================================================== */
const DEFAULTS = {
  dist: 17.0,
  fov: 48,
  diskInner: 3.0,
  diskOuter: 13.0,
  diskBright: 1.0,
  diskTemp: 9000,
  diskOpacity: 0.62,
  doppler: 1.0,
  spin: 1.0,
  turb: 0.85,
  starBright: 1.0,
  nebula: 1.0,
  exposure: 1.0,
  bloom: 0.75,
  stepSize: 0.34,
  maxSteps: 220,
  renderScale: 0.62,
  showDisk: true,
  showStars: true,
  lensing: true,
  autoRotate: true,
  vignette: 0.32,
  grain: 0.012
};
const params = Object.assign({}, DEFAULTS);

const SLIDERS = [
  { k:'dist',        label:'相机距离',   min:4,    max:24,   step:0.1,  fmt:v=>v.toFixed(1)+' Rs' },
  { k:'fov',         label:'视场角',     min:20,   max:90,   step:1,    fmt:v=>v.toFixed(0)+'°' },
  { k:'diskInner',   label:'盘内半径',   min:1.6,  max:8,    step:0.1,  fmt:v=>v.toFixed(1)+' Rs' },
  { k:'diskOuter',   label:'盘外半径',   min:6,    max:25,   step:0.5,  fmt:v=>v.toFixed(1)+' Rs' },
  { k:'diskBright',  label:'盘亮度',     min:0,    max:3,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'diskTemp',    label:'盘温度',     min:2000, max:20000,step:100,  fmt:v=>v.toFixed(0)+' K' },
  { k:'diskOpacity', label:'盘不透明度', min:0,    max:1,    step:0.02, fmt:v=>v.toFixed(2) },
  { k:'doppler',     label:'多普勒效应', min:0,    max:2,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'spin',        label:'旋转速度',   min:0,    max:3,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'turb',        label:'湍流强度',   min:0,    max:1,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'starBright',  label:'星空亮度',   min:0,    max:3,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'nebula',      label:'星云亮度',   min:0,    max:2,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'exposure',    label:'曝光',       min:0.1,  max:3,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'bloom',       label:'泛光强度',   min:0,    max:2,    step:0.05, fmt:v=>v.toFixed(2) },
  { k:'stepSize',    label:'精度(步长)', min:0.10, max:1.2,  step:0.02, fmt:v=>v.toFixed(2) },
  { k:'maxSteps',    label:'最大步数',   min:60,   max:500,  step:10,   fmt:v=>v.toFixed(0) },
  { k:'renderScale', label:'渲染缩放',   min:0.35, max:1.0,  step:0.05, fmt:v=>v.toFixed(2) },
  { k:'vignette',    label:'暗角',       min:0,    max:0.8,  step:0.02, fmt:v=>v.toFixed(2) },
  { k:'grain',       label:'胶片颗粒',   min:0,    max:0.05, step:0.002,fmt:v=>v.toFixed(3) },
];
const CHECKBOXES = [
  { k:'showDisk',   label:'显示吸积盘' },
  { k:'showStars',  label:'显示星空' },
  { k:'lensing',    label:'引力透镜' },
  { k:'autoRotate', label:'自动旋转' },
];

/* -------- build UI -------- */
const controlsEl = document.getElementById('controls');
const valueEls = {};

(function buildUI(){
  const physics = ['dist','fov','diskInner','diskOuter','diskBright','diskTemp','diskOpacity','doppler','spin','turb'];
  const sky     = ['starBright','nebula','lensing','showStars','showDisk','autoRotate'];
  const post    = ['exposure','bloom','vignette','grain'];
  const perf    = ['stepSize','maxSteps','renderScale'];

  function group(title, keys){
    const g = document.createElement('div');
    g.className = 'grp';
    const t = document.createElement('div');
    t.className = 'ttl';
    t.textContent = title;
    g.appendChild(t);

    for (const key of keys){
      const cb = CHECKBOXES.find(c => c.k === key);
      if (cb){
        const lab = document.createElement('label');
        lab.className = 'chk';
        const inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = params[key];
        inp.addEventListener('change', () => { params[key] = inp.checked; });
        const span = document.createElement('span');
        span.textContent = cb.label;
        lab.appendChild(inp); lab.appendChild(span);
        g.appendChild(lab);
        continue;
      }
      const s = SLIDERS.find(x => x.k === key);
      if (!s) continue;
      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('label');
      const nameSpan = document.createElement('span');
      nameSpan.textContent = s.label;
      nameSpan.style.color = '#93a6c4';
      const valSpan = document.createElement('span');
      valSpan.textContent = s.fmt(params[key]);
      valueEls[key] = valSpan;
      lab.appendChild(nameSpan); lab.appendChild(valSpan);
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = s.min; inp.max = s.max; inp.step = s.step;
      inp.value = params[key];
      inp.addEventListener('input', () => {
        params[key] = parseFloat(inp.value);
        valSpan.textContent = s.fmt(params[key]);
        if (key === 'diskOuter' || key === 'diskInner') clampDisk();
        if (key === 'renderScale') resize();
      });
      row.appendChild(lab); row.appendChild(inp);
      g.appendChild(row);
    }
    controlsEl.appendChild(g);
  }

  group('Physics / Geometry', physics);
  group('Sky & Disk', sky);
  group('Post Processing', post);
  group('Performance', perf);
})();

function clampDisk(){
  if (params.diskOuter < params.diskInner + 1.5){
    params.diskOuter = params.diskInner + 1.5;
    const inp = controlsEl.querySelector('input[type=range][min="6"]');
    if (inp){ inp.value = params.diskOuter; }
    if (valueEls.diskOuter) valueEls.diskOuter.textContent = params.diskOuter.toFixed(1) + ' Rs';
  }
}

document.getElementById('reset').addEventListener('click', () => {
  Object.assign(params, DEFAULTS);
  const inputs = controlsEl.querySelectorAll('input');
  inputs.forEach(inp => {
    if (inp.type === 'checkbox'){
      inp.checked = params[SLIDERS.length ? checkboxKeyOf(inp) : ''];
    }
  });
  // simpler: rebuild all values
  controlsEl.querySelectorAll('input[type=range]').forEach(inp => {
    // find matching slider by current order — rebuild via re-render
  });
  rebuildUIValues();
  resize();
});

function checkboxKeyOf(){ return null; }

function rebuildUIValues(){
  const ranges = controlsEl.querySelectorAll('input[type=range]');
  const order = [];
  ['dist','fov','diskInner','diskOuter','diskBright','diskTemp','diskOpacity','doppler','spin','turb']
    .forEach(k=>order.push(k));
  ['starBright','nebula'].forEach(k=>order.push(k));
  ['exposure','bloom','vignette','grain'].forEach(k=>order.push(k));
  ['stepSize','maxSteps','renderScale'].forEach(k=>order.push(k));
  ranges.forEach((inp, i) => {
    const k = order[i];
    if (!k) return;
    inp.value = params[k];
    const s = SLIDERS.find(x => x.k === k);
    if (s && valueEls[k]) valueEls[k].textContent = s.fmt(params[k]);
  });
  controlsEl.querySelectorAll('input[type=checkbox]').forEach((inp, i) => {
    const k = ['showDisk','showStars','lensing','autoRotate'][i];
    if (k) inp.checked = params[k];
  });
}

/* ==========================================================================
   CAMERA
   ========================================================================== */
let camTheta = 0.85;
let camPhi   = 1.30;
let camPos   = [0, 0, 0];
const camMat = new Float32Array(9);

const _f = [0,0,0], _r = [0,0,0], _u = [0,0,0];
function norm(v){ const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function updateCamera(dt){
  if (params.autoRotate) camTheta += dt * 0.10;
  camPhi = Math.min(Math.max(camPhi, 0.10), Math.PI - 0.10);

  const sp = Math.sin(camPhi), cp = Math.cos(camPhi);
  const d = params.dist;
  camPos = [ d * sp * Math.cos(camTheta), d * cp, d * sp * Math.sin(camTheta) ];

  const f = norm([ -camPos[0], -camPos[1], -camPos[2] ]);
  const r = norm(cross(f, [0,1,0]));
  const u = cross(r, f);

  camMat[0]=r[0]; camMat[1]=r[1]; camMat[2]=r[2];
  camMat[3]=u[0]; camMat[4]=u[1]; camMat[5]=u[2];
  camMat[6]=f[0]; camMat[7]=f[1]; camMat[8]=f[2];
}

/* -------- mouse / touch -------- */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  camTheta -= dx * 0.005;
  camPhi   -= dy * 0.005;
  camPhi = Math.min(Math.max(camPhi, 0.10), Math.PI - 0.10);
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch(_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  params.dist *= Math.exp(e.deltaY * 0.0011);
  params.dist = Math.min(Math.max(params.dist, 4), 24);
  if (valueEls.dist) valueEls.dist.textContent = params.dist.toFixed(1) + ' Rs';
  const inp = document.querySelector('input[type=range]');
  // sync the distance slider (first range input)
  const ranges = controlsEl.querySelectorAll('input[type=range]');
  if (ranges[0]) ranges[0].value = params.dist;
}, { passive: false });

/* ==========================================================================
   RENDER TARGETS
   ========================================================================== */
let rtScene = null, rtBloomA = null, rtBloomB = null;
let W = 1, H = 1, BW = 1, BH = 1;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
  const cw = Math.max(1, canvas.clientWidth);
  const ch = Math.max(1, canvas.clientHeight);
  const dw = Math.max(1, Math.floor(cw * dpr));
  const dh = Math.max(1, Math.floor(ch * dpr));
  if (canvas.width !== dw || canvas.height !== dh){
    canvas.width = dw;
    canvas.height = dh;
  }
  const rs = Math.min(Math.max(params.renderScale, 0.25), 1.0);
  const nw = Math.max(1, Math.floor(dw * rs));
  const nh = Math.max(1, Math.floor(dh * rs));
  if (nw === W && nh === H && rtScene) return;
  W = nw; H = nh;
  BW = Math.max(1, W >> 1); BH = Math.max(1, H >> 1);

  destroyRT(rtScene); destroyRT(rtBloomA); destroyRT(rtBloomB);
  rtScene  = makeRT(W, H);
  rtBloomA = makeRT(BW, BH);
  rtBloomB = makeRT(BW, BH);
}

window.addEventListener('resize', resize);

/* ==========================================================================
   FRAME LOOP
   ========================================================================== */
let lastT = performance.now();
let simTime = 0;
let fpsAcc = 0, fpsCount = 0, fpsTimer = 0;
const hud = document.getElementById('hud');

function drawFullscreen(){
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

function frame(now){
  requestAnimationFrame(frame);

  let dt = (now - lastT) * 0.001;
  lastT = now;
  dt = Math.min(dt, 0.05);
  simTime += dt;

  resize();
  updateCamera(dt);

  const tanHalfFov = Math.tan((params.fov * Math.PI / 180) * 0.5);
  const aspect = W / H;

  /* ---------- PASS 1 : geodesic ray tracing ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fb);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progTrace);

  gl.uniform2f(L(progTrace,'uRes'), W, H);
  gl.uniform1f(L(progTrace,'uTime'), simTime);
  gl.uniform3f(L(progTrace,'uCamPos'), camPos[0], camPos[1], camPos[2]);
  gl.uniformMatrix3fv(L(progTrace,'uCamMat'), false, camMat);
  gl.uniform1f(L(progTrace,'uTanHalfFov'), tanHalfFov);
  gl.uniform1f(L(progTrace,'uAspect'), aspect);
  gl.uniform1i(L(progTrace,'uMaxSteps'), Math.round(params.maxSteps));
  gl.uniform1f(L(progTrace,'uStepSize'), params.stepSize);
  gl.uniform1f(L(progTrace,'uEscapeR'), Math.max(26.0, params.dist * 1.35));

  gl.uniform1i(L(progTrace,'uShowDisk'), params.showDisk ? 1 : 0);
  gl.uniform1i(L(progTrace,'uLensing'), params.lensing ? 1 : 0);
  gl.uniform1f(L(progTrace,'uDiskInner'), params.diskInner);
  gl.uniform1f(L(progTrace,'uDiskOuter'), Math.max(params.diskOuter, params.diskInner + 1.0));
  gl.uniform1f(L(progTrace,'uDiskBright'), params.diskBright);
  gl.uniform1f(L(progTrace,'uDiskTemp'), params.diskTemp);
  gl.uniform1f(L(progTrace,'uDiskOpacity'), params.diskOpacity);
  gl.uniform1f(L(progTrace,'uSpin'), params.spin);
  gl.uniform1f(L(progTrace,'uDoppler'), params.doppler);
  gl.uniform1f(L(progTrace,'uTurb'), params.turb);

  gl.uniform1i(L(progTrace,'uShowStars'), params.showStars ? 1 : 0);
  gl.uniform1f(L(progTrace,'uStarBright'), params.starBright);
  gl.uniform1f(L(progTrace,'uNebula'), params.nebula);

  drawFullscreen();

  /* ---------- PASS 2 : bright extraction (half res) ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomA.fb);
  gl.viewport(0, 0, BW, BH);
  gl.useProgram(progBright);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
  gl.uniform1i(L(progBright,'uTex'), 0);
  gl.uniform1f(L(progBright,'uThreshold'), 1.0);
  drawFullscreen();

  /* ---------- PASS 3 : horizontal blur ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomB.fb);
  gl.viewport(0, 0, BW, BH);
  gl.useProgram(progBlur);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, rtBloomA.tex);
  gl.uniform1i(L(progBlur,'uTex'), 0);
  gl.uniform2f(L(progBlur,'uStep'), 1.35 / BW, 0.0);
  drawFullscreen();

  /* ---------- PASS 4 : vertical blur ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomA.fb);
  gl.viewport(0, 0, BW, BH);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, rtBloomB.tex);
  gl.uniform2f(L(progBlur,'uStep'), 0.0, 1.35 / BH);
  drawFullscreen();

  /* ---------- PASS 5 : composite + tonemap ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
  gl.uniform1i(L(progComp,'uScene'), 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, rtBloomA.tex);
  gl.uniform1i(L(progComp,'uBloom'), 1);
  gl.uniform1f(L(progComp,'uBloomStrength'), params.bloom);
  gl.uniform1f(L(progComp,'uExposure'), params.exposure);
  gl.uniform1f(L(progComp,'uTime'), simTime);
  gl.uniform1f(L(progComp,'uVignette'), params.vignette);
  gl.uniform1f(L(progComp,'uGrain'), params.grain);
  drawFullscreen();

  /* ---------- HUD ---------- */
  fpsAcc += 1 / Math.max(dt, 1e-4);
  fpsCount++;
  fpsTimer += dt;
  if (fpsTimer > 0.4){
    const fps = fpsAcc / fpsCount;
    fpsAcc = 0; fpsCount = 0; fpsTimer = 0;
    hud.innerHTML = `FPS <b>${fps.toFixed(0)}</b> &nbsp;·&nbsp; ` +
                    `RAY <b>${W}×${H}</b> &nbsp;·&nbsp; ` +
                    `STEPS <b>${Math.round(params.maxSteps)}</b> &nbsp;·&nbsp; ` +
                    `Rs = 1 (unit)`;
  }
}

/* ==========================================================================
   BOOT
   ========================================================================== */
resize();
updateCamera(0);
requestAnimationFrame(frame);
</script>
