<!doctype html>
<html lang="zh-CN">
<head><base href="/preview/4-1flash-fv-ff49fd21/vc87917f5252b/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪境 · 四季微缩生态球</title>
<style>
  :root{
    --ink:#f2efe8;
    --ink-dim:#a8a49b;
    --gold:#c8a86a;
    --gold-soft:rgba(200,168,106,.42);
    --panel:rgba(18,19,23,.52);
    --panel-line:rgba(255,255,255,.10);
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;height:100%;background:#05060a;color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:1;transition:opacity .45s ease}
  #hud.hidden{opacity:0}
  .panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
    border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  /* ---------- title ---------- */
  #title{position:absolute;left:34px;top:30px;pointer-events:auto}
  #title .rule{width:46px;height:1px;background:var(--gold);opacity:.75;margin-bottom:14px}
  #title h1{margin:0;font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:.20em;color:var(--ink)}
  #title .en{margin-top:9px;font-size:9.5px;letter-spacing:.36em;color:var(--ink-dim);text-transform:uppercase}
  #title .zh{margin-top:6px;font-size:11.5px;letter-spacing:.24em;color:var(--gold);opacity:.9}
  /* ---------- season rail ---------- */
  #season{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(680px,72vw);pointer-events:auto;padding:16px 26px 18px}
  #season .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
  #season .now{font-family:var(--serif);font-size:19px;letter-spacing:.24em}
  #season .sub{font-size:10px;letter-spacing:.22em;color:var(--ink-dim)}
  .rail{position:relative;height:44px;cursor:grab;touch-action:none}
  .rail:active{cursor:grabbing}
  .rail::before{content:"";position:absolute;left:-8px;right:-8px;top:6px;bottom:6px;border-radius:8px}
  .rail .track{position:absolute;left:0;right:0;top:20px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold-soft),rgba(255,255,255,.22),var(--gold-soft))}
  .rail .fill{position:absolute;left:0;top:19px;height:4px;border-radius:2px;background:linear-gradient(90deg,#8fc46a,#e0b25c,#c8752f,#9fc0e4);opacity:.9}
  .rail .ticks{position:absolute;inset:0;display:flex;justify-content:space-between}
  .rail .tick{width:1px;height:10px;margin-top:16px;background:rgba(255,255,255,.28)}
  .rail .names{position:absolute;left:0;right:0;top:29px;display:flex;justify-content:space-between}
  .rail .names span{font-family:var(--serif);font-size:12.5px;letter-spacing:.2em;color:var(--ink-dim);transition:color .3s,text-shadow .3s;transform:translateX(-50%)}
  .rail .names span:first-child{transform:none}
  .rail .names span:last-child{transform:translateX(-100%)}
  .rail .names span.on{color:#fff;text-shadow:0 0 16px rgba(255,225,170,.7)}
  .rail .knob{position:absolute;top:20px;width:17px;height:17px;margin:-8px 0 0 -8.5px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#d9c28b 55%,#8a6f3a);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 18px rgba(255,220,150,.55);
    transition:transform .15s}
  .rail:hover .knob{transform:scale(1.18)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;overflow:hidden;backdrop-filter:blur(14px);pointer-events:auto}
  .seg button{pointer-events:auto;font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
    background:none;border:0;padding:9px 11px;cursor:pointer;transition:background .2s,color .2s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{color:#ffe9c0;background:rgba(200,168,106,.20);box-shadow:inset 0 0 14px rgba(200,168,106,.18)}
  /* ---------- controls ---------- */
  #tools{position:absolute;right:30px;bottom:34px;display:flex;gap:9px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:38vw}
  .btn{pointer-events:auto;font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;padding:9px 14px;cursor:pointer;
    backdrop-filter:blur(14px);transition:background .22s,border-color .22s,transform .18s,color .22s}
  .btn:hover{background:rgba(40,42,50,.66);border-color:rgba(200,168,106,.45)}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:var(--gold);color:#ffe9c0;box-shadow:inset 0 0 18px rgba(200,168,106,.16)}
  #meta{position:absolute;right:32px;top:32px;text-align:right;font-size:10px;letter-spacing:.2em;color:var(--ink-dim);line-height:2}
  #meta b{color:var(--ink);font-weight:500;font-family:var(--serif);letter-spacing:.14em;font-size:12px}
  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:20;transition:opacity .8s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .mark{width:56px;height:56px;border-radius:50%;border:1px solid rgba(200,168,106,.45);position:relative}
  #loader .mark:after{content:"";position:absolute;inset:-1px;border-radius:50%;border-top:1px solid var(--gold);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .t{font-family:var(--serif);font-size:15px;letter-spacing:.34em;color:var(--ink)}
  #loader .s{font-size:10px;letter-spacing:.28em;color:var(--ink-dim)}
  #err{position:fixed;left:16px;bottom:16px;max-width:60vw;font:11px/1.5 monospace;color:#ff9a9a;white-space:pre-wrap;z-index:30}
  @media (max-width:820px){
    #title h1{font-size:20px}
    #season{width:86vw;padding:12px 16px 14px}
    #tools{right:14px;bottom:auto;top:96px;max-width:52vw}
  }
</style>
</head>
<body>
<div id="hud">
  <div id="title">
    <div class="rule"></div>
    <h1>雪 境</h1>
    <div class="en">A sealed ecosystem in four seasons</div>
    <div class="zh">四季微缩生态球 · 玻璃与黄铜座</div>
  </div>
  <div id="meta">
    <div><b id="metaSeason">春</b></div>
    <div id="metaClock">—</div>
    <div id="metaRes">—</div>
    <div id="metaFps">—</div>
  </div>
  <div id="season" class="panel">
    <div class="head">
      <div class="now" id="seasonName">春 · 萌芽</div>
      <div class="sub" id="seasonHint">自动流转 · 拖动以定格某一刻</div>
    </div>
    <div class="rail" id="rail">
      <div class="track"></div>
      <div class="fill" id="railFill"></div>
      <div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i></div>
      <div class="names"><span>春</span><span>夏</span><span>秋</span><span>冬</span></div>
      <div class="knob" id="railKnob"></div>
    </div>
  </div>
  <div id="tools">
    <span class="seg" id="quality">
      <button data-q="low">低</button>
      <button data-q="medium">中</button>
      <button data-q="high" class="on">高</button>
      <button data-q="ultra">极致</button>
    </span>
    <button class="btn" id="btnShake">摇 一 摇</button>
    <button class="btn on" id="btnAuto">自动流转</button>
    <button class="btn" id="btnView">近观玻璃球</button>
    <button class="btn on" id="btnDof">景深</button>
    <button class="btn on" id="btnBloom">辉光</button>
    <button class="btn" id="btnHide">隐藏界面</button>
  </div>
</div>
<div id="loader">
  <div class="mark"></div>
  <div class="t">雪 境</div>
  <div class="s">正在生长这片微缩生态 …</div>
</div>
