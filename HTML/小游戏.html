<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>像素地牢</title>
<style>
    :root { --bg: #1a1a2e; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Consolas, monospace; touch-action: manipulation; position: fixed; top: 0; left: 0; }
    
    /* 安全区域适配 */
    #orientation-hint { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index:9999; justify-content: center; align-items: center; flex-direction: column; color:#fff; font-size:20px; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    
    @media (orientation: portrait) { #orientation-hint { display: flex; } #game-wrapper { display: none; } }
    @media (orientation: landscape) { #orientation-hint { display: none; } #game-wrapper { display: flex; } }
    
    #game-wrapper { 
        position:relative; width:100vw; height:100vh; background:#000; overflow:hidden; 
        /* 安全区域 padding 适配 */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
    }
    #game-container { position:relative; overflow:hidden; background:#000; width:100%; height:100%; }
    canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }
    #settings-overlay { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.82); z-index:20; justify-content:center; align-items:center; flex-direction:column; }
    #settings-overlay.active { display:flex; }
    #settings-panel { background:#1D2B53; border:3px solid #C2C3C7; border-radius:4px; padding:10px 0; width:280px; text-align:center; }
    .settings-btn { display:block; width:100%; padding:13px 20px; background:transparent; border:none; color:#FFF1E8; font-size:15px; cursor:pointer; letter-spacing:1px; font-family:'Courier New', monospace; }
    .settings-btn:active { background:rgba(255,255,255,0.1); }
    .settings-btn.danger { color:#FF004D; }
</style>
</head>

<div id="game-wrapper"><div id="game-container"><canvas id="game"></canvas>
    <div id="settings-overlay"><div id="settings-panel"><div style="color:#FFEC27; font-size:18px; padding:10px;">⚙ 设置</div>
        <button class="settings-btn" id="btn-continue">▶ 继续</button>
        <button class="settings-btn" id="btn-drag">✋ 拖动按钮</button>
        <button class="settings-btn" id="btn-joy-size">🕹 摇杆大小: 中</button>
        <button class="settings-btn" id="btn-btn-size">🎯 按钮大小: 中</button>
        <button class="settings-btn danger" id="btn-exit">🚪 退出</button></div></div>
</div></div>

    const player = {

    };
    const pBullets = [], eBullets = [], particles = [], drops = [];
    let room = { enemies:[], obstacles:[], cleared:false, theme:null };
    let shake = 0, hurtFlash = 0, combo = 0, comboTimer = 0, score = 0;

    let jId = null, sId = null;
    let jX = 0, jY = 0, sX = 0, sY = 0, setX = 50, setY = 50;
    let jXHome = 0, jYHome = 0;
    let jThumbX = 0, jThumbY = 0, move = false, shoot = false, moveX = 0, moveY = 0;
    let skillX = 0, skillY = 0;
    let dragTarget = null;
    const keys = {};
    let JR = 55, JTR = 24, SR = 38;
    const SB = 44;

    // ==================== 工具 ====================
    function makeRNG(seed) {
        let s = seed >>> 0;
        return function() {
            s = (s + 0x6D2B79F5) >>> 0;
            let t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    function ri(rng, min, max) { return min + Math.floor(rng() * (max - min)); }
    function rf(rng, min, max) { return min + rng() * (max - min); }
    function pickWeighted(rng, items) {
        let total = 0;
        for (const it of items) total += it.w;
        let r = rng() * total;
        for (const it of items) { r -= it.w; if (r <= 0) return it.k; }
        return items[items.length-1].k;
    }
    function shade(hex, amt) {
        let r = parseInt(hex.slice(1,3),16);
        let g = parseInt(hex.slice(3,5),16);
        let b = parseInt(hex.slice(5,7),16);
        r = Math.max(0, Math.min(255, r + amt));
        g = Math.max(0, Math.min(255, g + amt));
        b = Math.max(0, Math.min(255, b + amt));
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    function pxBlock(cx, cy, w, h, color, opts) {
        opts = opts || {};
        const px    = opts.px    || 3;
        const light = opts.light !== undefined ? opts.light : 42;
        const dark  = opts.dark  !== undefined ? opts.dark  : 46;
        const dith  = !!opts.dither;
        const left = cx - w/2, top = cy - h/2;
        const cols = Math.max(2, Math.round(w / px));
        const rows = Math.max(2, Math.round(h / px));
        const cw = w / cols, ch = h / rows;
        for (let row = 0; row < rows; row++) {
            const y0 = Math.round(top + row * ch);
            const y1 = Math.round(top + (row + 1) * ch);
            const cellH = y1 - y0;
            for (let col = 0; col < cols; col++) {
                const x0 = Math.round(left + col * cw);
                const x1 = Math.round(left + (col + 1) * cw);
                const cellW = x1 - x0;
                let amt = 0;
                if (row === 0) amt += light;
                else if (row === rows - 1) amt -= dark;
                if (col === 0) amt += Math.round(light * 0.7);
                else if (col === cols - 1) amt -= Math.round(dark * 0.7);
                if (dith && ((row + col) & 1) === 0) amt -= 14;
                ctx.fillStyle = shade(color, amt);
                ctx.fillRect(x0, y0, cellW, cellH);
            }
        }
    }
    function pxFrame(x, y, w, h, color, thick) {
        thick = thick || 3;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, thick);
        ctx.fillRect(x, y + h - thick, w, thick);
        ctx.fillRect(x, y, thick, h);
        ctx.fillRect(x + w - thick, y, thick, h);
    }
    function pxRing(cx, cy, r, thick, color) {
        const px = 3;
        ctx.fillStyle = color;
        const x0 = Math.floor((cx - r) / px) * px;
        const y0 = Math.floor((cy - r) / px) * px;
        const x1 = Math.ceil((cx + r) / px) * px;
        const y1 = Math.ceil((cy + r) / px) * px;
        for (let y = y0; y <= y1; y += px) {
            for (let x = x0; x <= x1; x += px) {
                const dx = x + px/2 - cx;
                const dy = y + px/2 - cy;
                const d = Math.sqrt(dx*dx + dy*dy);
                if (d <= r && d >= r - thick) ctx.fillRect(x, y, px, px);
            }
        }
    }
    function pxCircleFill(cx, cy, r, color) {
        const px = 3;
        ctx.fillStyle = color;
        const x0 = Math.floor((cx - r) / px) * px;
        const y0 = Math.floor((cy - r) / px) * px;
        const x1 = Math.ceil((cx + r) / px) * px;
        const y1 = Math.ceil((cy + r) / px) * px;
        for (let y = y0; y <= y1; y += px) {
            for (let x = x0; x <= x1; x += px) {
                const dx = x + px/2 - cx;
                const dy = y + px/2 - cy;
                if (Math.sqrt(dx*dx + dy*dy) <= r) ctx.fillRect(x, y, px, px);
            }
        }
    }
    function pxText(txt, x, y, color, outline, align) {
        ctx.textAlign = align || 'center';
        if (outline) {
            ctx.fillStyle = outline;
            ctx.fillText(txt, x + 2, y);
            ctx.fillText(txt, x - 2, y);
            ctx.fillText(txt, x, y + 2);
            ctx.fillText(txt, x, y - 2);
        }
        ctx.fillStyle = color;
        ctx.fillText(txt, x, y);
    }

    // ==================== 本地存档 ====================
    const STORAGE_AVAILABLE = (function() {
        try {
            const t = '__pd_test__';

            window.localStorage.removeItem(t);

        } catch(e) { return false; }
    })();
    const memStore = {};
    function storageGet(k) {
        if (STORAGE_AVAILABLE) {
            try {
                const v = window.localStorage.getItem(k);
                if (v !== null) return v;
            } catch(e) {}
        }
        return memStore[k] !== undefined ? memStore[k] : null;
    }
    function storageSet(k, v) {
        if (STORAGE_AVAILABLE) {
            try { window.localStorage.setItem(k, v); return; } catch(e) {}
        }
        memStore[k] = v;
    }
    function getBestKey(diff, isEndless) {
        return 'pixel_dungeon_' + (isEndless ? 'endless_' : '') + diff;
    }
    function saveBest() {
        const key = getBestKey(diffKey, endless);
        const prevScore = parseInt(storageGet(key + '_score') || '0');
        const prevLevel = parseInt(storageGet(key + '_level') || '0');
        const curLevel = levelIndex + 1;
        if (score > prevScore) storageSet(key + '_score', String(score));
        if (curLevel > prevLevel) storageSet(key + '_level', String(curLevel));
    }
    function loadBest(diff, isEndless) {
        const key = getBestKey(diff, isEndless);
        return {
            score: parseInt(storageGet(key + '_score') || '0'),
            level: parseInt(storageGet(key + '_level') || '0')
        };
    }

    // ==================== 音效 ====================
    let ac = null;
    function beep(f,d,t='square',v=0.05) { if(!ac) return; try{const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){} }
    function sfx(f) { if(!ac) try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} beep(f,0.08); }

    // ==================== 主题 ====================
    const THEMES = [

        { name:'熔岩', floor:'#7E2553', wall:'#AB5236', edge:'#FFA300' },
        { name:'冰窟', floor:'#1D2B53', wall:'#29ADFF', edge:'#FFF1E8' },

    // ==================== 敌人模板 ====================
    const ENEMY_BASE = {

        summoner: { w:22,h:22, spd:40,  hp:3,   dCd:0.9, sInt:3.2, pref:220 },

    function createEnemy(type, x, y, mult) {
        const b = ENEMY_BASE[type];

            x, y, w:b.w, h:b.h,
