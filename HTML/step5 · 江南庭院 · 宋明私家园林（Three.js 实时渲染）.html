<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江南庭院 · 宋明私家园林</title>
<style>
:root {
  --ink: #2b2620;
  --paper: #efe9dd;
  --gold: #c9a253;
  --line: rgba(43, 38, 32, 0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #0d0f12;
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color: var(--paper);
}

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; top: 16px; right: 16px; z-index: 20;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
.panel {
  background: rgba(24, 22, 19, 0.62);
  border: 1px solid rgba(239, 233, 221, 0.16);
  border-radius: 3px;
  padding: 8px 12px;
  backdrop-filter: blur(8px);
  min-width: 132px;
}
.panel .row { display: flex; justify-content: space-between; gap: 14px; font-size: 12px; line-height: 1.9; }
.panel .label { color: rgba(239, 233, 221, 0.55); letter-spacing: 2px; }
.panel .value { color: var(--gold); letter-spacing: 1px; }

.fps {
  position: fixed; top: 16px; left: 16px; z-index: 20;
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-size: 11px; color: rgba(239, 233, 221, 0.5);
  background: rgba(24, 22, 19, 0.5); padding: 4px 8px; border-radius: 3px;
  pointer-events: none;
}

/* ---------- toolbar ---------- */
.toolbar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 20;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  padding: 12px 18px;
  background: rgba(24, 22, 19, 0.66);
  border: 1px solid rgba(239, 233, 221, 0.14);
  border-radius: 4px;
  backdrop-filter: blur(10px);
  max-width: min(94vw, 1080px);
}
.toolbar .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.glabel { font-size: 11px; letter-spacing: 3px; color: rgba(239, 233, 221, 0.45); margin-right: 4px; }
.btn {
  font-family: inherit; font-size: 12px; letter-spacing: 1px;
  color: var(--paper); background: rgba(239, 233, 221, 0.07);
  border: 1px solid rgba(239, 233, 221, 0.2); border-radius: 2px;
  padding: 5px 11px; cursor: pointer;
  transition: background .18s, border-color .18s, color .18s;
}
.btn:hover { background: rgba(239, 233, 221, 0.15); }
.btn.active { background: rgba(201, 162, 83, 0.22); border-color: var(--gold); color: var(--gold); }
.btn-primary { border-color: rgba(201, 162, 83, 0.55); color: var(--gold); }
.hint { font-size: 11px; color: rgba(239, 233, 221, 0.42); letter-spacing: 1px; }

/* ---------- loading ---------- */
.loading {
  position: fixed; inset: 0; z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: #14120f;
  transition: opacity .7s ease;
  font-size: 13px; letter-spacing: 5px; color: rgba(239, 233, 221, 0.7);
}
.loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid rgba(201, 162, 83, 0.25);
  border-top-color: var(--gold);
  animation: spin 1.1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 720px) {
  .hud { top: 10px; right: 10px; }
  .toolbar { bottom: 10px; padding: 10px 12px; }
  .hint { display: none; }
}

</style>

</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hud">
  <div class="panel" id="clock-panel">
    <div class="row">
      <span class="label">时辰</span>
      <span class="value" id="clock-text">--</span>
    </div>
    <div class="row">
      <span class="label">昼夜</span>
      <span class="value" id="dayphase-text">--</span>
    </div>
  </div>
  <div class="panel" id="view-panel">
    <div class="row">
      <span class="label">视角</span>
      <span class="value" id="view-text">环视</span>
    </div>
  </div>
</div>

<div id="toolbar" class="toolbar">
  <div class="group">
    <span class="glabel">时辰</span>
    <button class="btn" data-hour="6">拂晓</button>
    <button class="btn" data-hour="9">白昼</button>
    <button class="btn" data-hour="12">正午</button>
    <button class="btn" data-hour="17">黄昏</button>
    <button class="btn" data-hour="21">入夜</button>
  </div>
  <div class="group">
    <span class="glabel">视角</span>
    <button class="btn btn-primary" id="btn-orbit">环视庭园</button>
    <button class="btn btn-primary" id="btn-fpv">入室漫游</button>
  </div>
  <div class="group">
    <span class="glabel">操作</span>
    <span class="hint">环视：拖拽旋转 · 滚轮缩放 · 右键平移</span>
    <span class="hint">漫游：W/A/S/D 行走 · Shift 疾走 · 鼠标转向 · Esc 退出</span>
  </div>
</div>

<div id="loading" class="loading"><div class="spinner"></div><span>庭园营造中…</span></div>
<div id="fps" class="fps"></div>
