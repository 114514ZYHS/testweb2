            // ============================================================
            //  9. ZIP 游戏支持 (音频与图片分离，采用API技术) 【已修复 JS 路径替换】
            // ============================================================
            async function launchZIP(entry) {
                let blob = null;
                if (entry.file) blob = entry.file;
                else if (entry.dbKey) blob = await getFileFromDB(entry.dbKey);
                if (!blob) { showToast('❌ 无法读取ZIP文件'); return; }

                if (window._currentResourceMap) {
                    for (let key in window._currentResourceMap) {
                        if (window._currentResourceMap[key]?.startsWith('blob:')) {
                            URL.revokeObjectURL(window._currentResourceMap[key]);
                        }
                    }
                    window._currentResourceMap = null;
                }

                try {
                    if (typeof JSZip === 'undefined') await loadJSZip();
                    const zip = await JSZip.loadAsync(blob);
                    const htmlFiles = zip.file(/\.html$/i);
                    if (!htmlFiles || htmlFiles.length === 0) {
                        showToast('❌ ZIP中未找到 HTML 文件'); return;
                    }
                    const indexFile = htmlFiles[0];
                    let htmlContent = await indexFile.async('text');

                    // ---- 扩展：匹配所有常见资源 ----
                    const resourceMap = {};
                    const allFiles = zip.file(/./); // 获取所有文件
                    const filePromises = [];

                    for (let file of allFiles) {
                        if (file.name === indexFile.name) continue;
                        // 只处理有后缀的资源文件
                        if (!/\.(html|htm|js|css|png|jpg|jpeg|gif|svg|mp3|wav|ogg|mp4|webm|mid|midi|json|xml|ttf|woff|woff2)$/i.test(file.name)) {
                            continue;
                        }
                        filePromises.push(
                            file.async('blob').then(async (blobRes) => {
                                if (/\.(mid|midi)$/i.test(file.name)) {
                                    // MIDI 文件转成 base64 存起来
                                    const reader = new FileReader();
                                    const dataUrl = await new Promise(resolve => {
                                        reader.onload = (e) => resolve(e.target.result);
                                        reader.readAsDataURL(blobRes);
                                    });
                                    resourceMap[file.name] = dataUrl;
                                    return;
                                }
                                const ext = file.name.split('.').pop().toLowerCase();
                                // 媒体文件用 blob URL，其他转 base64
                                if (/^(mp3|wav|ogg|mp4|webm)$/i.test(ext)) {
                                    resourceMap[file.name] = URL.createObjectURL(blobRes);
                                } else {
                                    const reader = new FileReader();
                                    const dataUrl = await new Promise(resolve => {
                                        reader.onload = (e) => resolve(e.target.result);
                                        reader.readAsDataURL(blobRes);
                                    });
                                    resourceMap[file.name] = dataUrl;
                                }
                            })
                        );
                    }
                    await Promise.all(filePromises);

                    // ---- 替换所有资源引用 ----
                    // 1. 图片 src
                    htmlContent = htmlContent.replace(/src=["']([^"']+\.(png|jpg|jpeg|gif|svg))["']/g, (match, path) => {
                        const newPath = resourceMap[path];
                        return newPath ? `src="${newPath}"` : match;
                    });
                    // 2. CSS url()
                    htmlContent = htmlContent.replace(/url\(['"]?([^'")]+\.(png|jpg|jpeg|gif|svg))['"]?\)/g, (match, path) => {
                        const newPath = resourceMap[path];
                        return newPath ? `url('${newPath}')` : match;
                    });
                    // 3. JS 中的图片路径 (字符串)
                    htmlContent = htmlContent.replace(/['"]igms\/[^'"]+\.(png|jpg|jpeg|gif|svg)['"]/g, (match) => {
                        const path = match.replace(/['"]/g, '');
                        const newPath = resourceMap[path];
                        return newPath ? `'${newPath}'` : match;
                    });
                    // ---- 🆕 新增：替换 script src ----
                    htmlContent = htmlContent.replace(/<script\s+src=["']([^"']+\.js)["']/gi, (match, path) => {
                        const newPath = resourceMap[path];
                        if (newPath) {
                            // 如果文件内容已转为 base64，内联到 script 标签中
                            const content = resourceMap[path];
                            if (content && content.startsWith('data:')) {
                                // 解码 base64 内容
                                const base64 = content.split(',')[1];
                                const decoded = atob(base64);
                                return `<script>${decoded}<\/script>`;
                            }
                            return `<script src="${newPath}"><\/script>`;
                        }
                        return match;
                    });
                    // ---- 🆕 新增：替换 link css ----
                    htmlContent = htmlContent.replace(/<link\s+rel=["']stylesheet["']\s+href=["']([^"']+\.css)["']/gi, (match, path) => {
                        const newPath = resourceMap[path];
                        if (newPath && newPath.startsWith('data:')) {
                            const base64 = newPath.split(',')[1];
                            const decoded = atob(base64);
                            return `<style>${decoded}<\/style>`;
                        }
                        return match;
                    });

                    // ---- 注入音频 API（原逻辑保留） ----
                    const audioAPIScript = `
                    <script>
                    window.playXboxAudio = function(src, loop = false) {
                        window.parent.postMessage({ type: 'playAudio', src: src, loop: loop }, '*');
                    };
                    document.addEventListener('DOMContentLoaded', function() {
                        document.querySelectorAll('audio').forEach(el => {
                            if(el.src) {
                                const src = el.src.replace(/^.*?([^\/]+)$/, '$1');
                                const loop = el.loop;
                                window.playXboxAudio(src, loop);
                                el.remove();
                            }
                        });
                    });
                    <\/script>
                    `;
                    htmlContent = htmlContent.replace('</head>', audioAPIScript + '</head>');

                    const finalBlob = new Blob([htmlContent], { type: 'text/html' });
                    const finalUrl = URL.createObjectURL(finalBlob);
                    window._currentResourceMap = resourceMap;
                    launchInGameContainer(finalUrl, entry);

                } catch (err) {
                    showToast('❌ ZIP解压失败: ' + err.message);
                }
            }

            function loadJSZip() {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            // ============================================================
            //  10. HTML 游戏启动
            // ============================================================
            async function launchHTML(entry) {
                let content = null;
                if (entry.file) {
                    content = await entry.file.text();
                } else if (entry.dbKey) {
                    const blob = await getFileFromDB(entry.dbKey);
                    if (blob) content = await blob.text();
                }
                if (!content) { showToast('❌ 无法读取HTML文件'); return; }
                const blob2 = new Blob([content], { type: 'text/html' });
                const url = URL.createObjectURL(blob2);
                launchInGameContainer(url, entry);
            }

            function launchInGameContainer(url, entry) {
                const container = document.getElementById('game-container');
                container.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.position = 'absolute';
                iframe.style.top = '0';
                iframe.style.left = '0';
                container.appendChild(iframe);
                container.classList.add('active');
                document.getElementById('xbox-dashboard').classList.remove('active');

                iframe.addEventListener('load', () => {
                    injectAPI(iframe);
                });

                const exitHandler = (e) => {
                    if (e.key === 'Escape' || e.key === 'Escape') {
                        exitGame();
                    }
                };
                window._exitGameHandler = exitHandler;
                document.addEventListener('keydown', exitHandler);
                container.addEventListener('touchend', function(e) {
                    if (e.target === container) {
                        exitGame();
                    }
                }, { passive: false });
            }

            function exitGame() {
                const container = document.getElementById('game-container');
                container.innerHTML = '';
                container.classList.remove('active');
                document.getElementById('xbox-dashboard').classList.add('active');
                if (window._exitGameHandler) {
                    document.removeEventListener('keydown', window._exitGameHandler);
                }
                const iframe = container.querySelector('iframe');
                if (iframe && iframe.src) URL.revokeObjectURL(iframe.src);

                // 清理当前游戏的 Blob 资源
                if (window._currentResourceMap) {
                    for (let key in window._currentResourceMap) {
                        if (window._currentResourceMap[key] && window._currentResourceMap[key].startsWith('blob:')) {
                            URL.revokeObjectURL(window._currentResourceMap[key]);
                        }
                    }
                    window._currentResourceMap = null;
                }

                showToast('⏏️ 已退出游戏');
            }

            // ============================================================
            //  11. 媒体播放器 (Base64 内嵌版)
            // ============================================================
            // ✨ 新增：将 Blob 转换为 DataURL 的辅助函数
            function blobToDataURL(b) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(b);
                });
            }

            function launchMusic(entry) {
                const overlay = document.getElementById('media-player-overlay');
                const canvas = document.getElementById('player-canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight * 0.65;

                overlay.classList.add('active');
                document.getElementById('xbox-dashboard').classList.remove('active');

                audioPlayer = document.getElementById('audio-player');
                audioPlayer.src = '';
                audioPlayer.load();

                (async () => {
                    let blob = null;
                    if (entry.file) blob = entry.file;
                    else if (entry.dbKey) blob = await getFileFromDB(entry.dbKey);
                    if (!blob) { showToast('❌ 无法读取音频'); return; }

                    // ✨ 核心修改：使用 FileReader 转换为 Base64，绕过 file:// 的 blob 限制
                    const dataUrl = await blobToDataURL(blob);
                    audioPlayer.src = dataUrl;
                    audioPlayer.load();
                    try {
                        await audioPlayer.play();
                        isPlaying = true;
                        document.getElementById('mp-play').textContent = '⏸';
                        setupVisualizer();
                        setupMediaControls(entry, dataUrl);
                        currentMediaEntry = entry;
                    } catch (err) {
                        showToast('❌ 播放失败: ' + err.message);
                    }
                })();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight * 0.65;
                });
            }

            function setupVisualizer() {
                const canvas = document.getElementById('player-canvas');
                const ctx = canvas.getContext('2d');

                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.85;
                const source = audioCtx.createMediaElementSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                function draw() {
                    if (!isPlaying && audioPlayer.paused) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        animId = null;
                        return;
                    }
                    analyser.getByteFrequencyData(dataArray);

                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.7);
                    grad.addColorStop(0, '#0a2a0a');
                    grad.addColorStop(1, '#050a05');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, w, h);

                    const barCount = dataArray.length;
                    const barWidth = (w / barCount) * 1.8;
                    let x = 0;
                    for (let i = 0; i < barCount; i++) {
                        const val = dataArray[i] / 255;
                        const barHeight = val * h * 0.7;
                        const hue = 100 + val * 80;
                        const alpha = 0.4 + val * 0.6;
                        ctx.fillStyle = `hsla(${hue}, 90%, 55%, ${alpha})`;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = `hsla(${hue}, 90%, 55%, ${val * 0.5})`;
                        ctx.fillRect(x, h - barHeight - 20, barWidth, barHeight);
                        x += barWidth + 1;
                    }

                    const bass = dataArray.slice(0, 8).reduce((a, b) => a + b, 0) / (8 * 255);
                    if (bass > 0.3) {
                        const r = 40 + bass * 120;
                        const grad2 = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, r);
                        grad2.addColorStop(0, `rgba(16, 255, 16, ${bass * 0.3})`);
                        grad2.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = grad2;
                        ctx.fillRect(0, 0, w, h);
                    }

                    animId = requestAnimationFrame(draw);
                }
                draw();
            }

            function setupMediaControls(entry, url) {
                const playBtn = document.getElementById('mp-play');
                const closeBtn = document.getElementById('mp-close');
                const progressFill = document.getElementById('mp-progress-fill');
                const progressTrack = document.getElementById('mp-progress-track');
                const timeDisplay = document.getElementById('mp-time');
                const volumeFill = document.getElementById('mp-volume-fill');
                const volumeTrack = document.getElementById('mp-volume-track');
                const prevBtn = document.getElementById('mp-prev');
                const nextBtn = document.getElementById('mp-next');

                playBtn.onclick = () => {
                    if (isPlaying) {
                        audioPlayer.pause();
                        isPlaying = false;
                        playBtn.textContent = '▶';
                    } else {
                        audioPlayer.play().catch(() => {});
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                    }
                };

                closeBtn.onclick = () => {
                    closeMediaPlayer();
                };

                audioPlayer.ontimeupdate = () => {
                    if (audioPlayer.duration) {
                        const p = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                        progressFill.style.width = p + '%';
                        timeDisplay.textContent = formatTime(audioPlayer.currentTime) + ' / ' + formatTime(audioPlayer
                        .duration);
                    }
                };

                progressTrack.addEventListener('click', (e) => {
                    const rect = progressTrack.getBoundingClientRect();
                    const p = (e.clientX - rect.left) / rect.width;
                    if (audioPlayer.duration) audioPlayer.currentTime = p * audioPlayer.duration;
                });
                progressTrack.addEventListener('touchend', (e) => {
                    const rect = progressTrack.getBoundingClientRect();
                    const touch = e.changedTouches[0];
                    const p = (touch.clientX - rect.left) / rect.width;
                    if (audioPlayer.duration) audioPlayer.currentTime = p * audioPlayer.duration;
                    e.preventDefault();
                }, { passive: false });

                volumeTrack.addEventListener('click', (e) => {
                    const rect = volumeTrack.getBoundingClientRect();
                    const p = (e.clientX - rect.left) / rect.width;
                    audioPlayer.volume = Math.max(0, Math.min(1, p));
                    volumeFill.style.width = (audioPlayer.volume * 100) + '%';
                });
                volumeTrack.addEventListener('touchend', (e) => {
                    const rect = volumeTrack.getBoundingClientRect();
                    const touch = e.changedTouches[0];
                    const p = (touch.clientX - rect.left) / rect.width;
                    audioPlayer.volume = Math.max(0, Math.min(1, p));
                    volumeFill.style.width = (audioPlayer.volume * 100) + '%';
                    e.preventDefault();
                }, { passive: false });

                audioPlayer.onended = () => {
                    isPlaying = false;
                    playBtn.textContent = '▶';
                    progressFill.style.width = '0%';
                    timeDisplay.textContent = '0:00 / 0:00';
                };

                prevBtn.onclick = () => navigateMedia(-1);
                nextBtn.onclick = () => navigateMedia(1);
            }

            function navigateMedia(direction) {
                const allMedia = library.filter(e => e.type === 'music' || e.type === 'video');
                if (allMedia.length === 0) return;
                let idx = allMedia.findIndex(e => e.id === currentMediaEntry?.id);
                if (idx === -1) idx = 0;
                idx = (idx + direction + allMedia.length) % allMedia.length;
                const entry = allMedia[idx];
                if (entry) {
                    closeMediaPlayer();
                    setTimeout(() => window._launchGame(entry.id), 300);
                }
            }

                const overlay = document.getElementById('media-player-overlay');
                overlay.classList.remove('active');
                document.getElementById('xbox-dashboard').classList.add('active');
                if (isPlaying) {
                    audioPlayer.pause();

            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            // ============================================================
            //  12. 视频播放 (Base64 内嵌版)
            // ============================================================
            function launchVideo(entry) {
                (async () => {
                    let blob = null;
                    if (entry.file) blob = entry.file;
                    else if (entry.dbKey) blob = await getFileFromDB(entry.dbKey);
                    if (!blob) { showToast('❌ 无法读取视频'); return; }

                    // ✨ 同样使用 Base64 绕过 blob 限制
                    const dataUrl = await blobToDataURL(blob);

                    const overlay = document.createElement('div');
                    overlay.style.cssText = `
                        position: fixed; top:0; left:0; width:100%; height:100%;
                        background:#000; z-index:60000; display:flex; flex-direction:column;
                        align-items:center; justify-content:center; touch-action:none;
                    `;
                    const video = document.createElement('video');
                    video.style.cssText = 'width:100%; height:100%; object-fit:contain; touch-action:none;';
                    video.controls = true;
                    video.src = dataUrl; // ✨ 赋值 Base64 地址
                    video.autoplay = true;
                    overlay.appendChild(video);
                    document.body.appendChild(overlay);
                    document.getElementById('xbox-dashboard').classList.remove('active');

                    // 退出逻辑
                    const handler = (e) => {
                        if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
                            video.pause();
                            overlay.remove();
                            document.removeEventListener('keydown', handler);
                            document.getElementById('xbox-dashboard').classList.add('active');
                        }
                    };
                    document.addEventListener('keydown', handler);

                    video.addEventListener('click', () => {
                        if (video.paused) video.play();
                        else video.pause();
                    });
                    video.addEventListener('touchend', (e) => {
                        if (video.paused) video.play();
                        else video.pause();
                        e.preventDefault();
                    }, { passive: false });

                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            video.pause();
                            overlay.remove();
                            document.removeEventListener('keydown', handler);
                            document.getElementById('xbox-dashboard').classList.add('active');
                        }
                    });
                    overlay.addEventListener('touchend', (e) => {
                        if (e.target === overlay) {
                            video.pause();
                            overlay.remove();
                            document.removeEventListener('keydown', handler);
                            document.getElementById('xbox-dashboard').classList.add('active');
                        }
                        e.preventDefault();
                    }, { passive: false });
                })();
            }

            // ============================================================
            //  13. API 注入
            // ============================================================
            function injectAPI(iframe) {
                const apiScript = `
                    (function() {
                        let msgId = 0;
                        const callbacks = {};
                        window.addEventListener('message', function(e) {
                            if (e.source !== parent) return;
                            if (e.data.id && callbacks[e.data.id]) {
                                callbacks[e.data.id](e.data.result);
                                delete callbacks[e.data.id];
                            }
                        });
                        function sendRequest(type, payload) {
                            return new Promise((resolve) => {
                                const id = 'req_' + (msgId++) + '_' + Math.random().toString(36).substr(2,4);
                                callbacks[id] = resolve;
                                parent.postMessage({ id, type, payload }, '*');
                            });
                        }
                        window.xpAPI = {
                            readFile: (path) => sendRequest('readFile', { path }),
                            writeFile: (path, content) => sendRequest('writeFile', { path, content }),
                            deleteFile: (path) => sendRequest('deleteFile', { path }),
                            createFolder: (path) => sendRequest('createFolder', { path }),
                            listFiles: (path) => sendRequest('listFiles', { path }),
                            getCurrentUser: () => sendRequest('getCurrentUser', {}),
                            showMessage: (title, msg) => sendRequest('showMessage', { title, message: msg }),
                            requestFullscreen: () => sendRequest('requestFullscreen', {}),
                            exitFullscreen: () => sendRequest('exitFullscreen', {}),
                            launchGame: (id) => sendRequest('launchGame', { id }),
                            exitGame: () => sendRequest('exitGame', {}),
                            getLibrary: () => sendRequest('getLibrary', {}),
                            addToLibrary: (entry) => sendRequest('addToLibrary', { entry }),
                            removeFromLibrary: (id) => sendRequest('removeFromLibrary', { id }),
                            // ========== 🎵 MIDI API (新增) ==========
                            playMidiFromFile: (path, options) => sendRequest('playMidiFromFile', { path, options }),
                            stopMidi: () => sendRequest('stopMidi', {}),
                            getMidiStatus: () => sendRequest('getMidiStatus', {})
                        };
                    })();
                `;
                const script = document.createElement('script');
                script.textContent = apiScript;
                iframe.contentDocument?.head?.appendChild(script);
            }

            function handleKey(code, pressed) {
                if (!pressed) return;

                const gc = document.getElementById('game-container');
                if (gc.classList.contains('active')) {
                    const iframe = gc.querySelector('iframe');
                    if (iframe) {
                        iframe.contentWindow.postMessage({ type: 'keydown', code }, '*');
                    }
                    if (code === 'Escape') {
                        exitGame();
                    }
                    return;
                }

                const mp = document.getElementById('media-player-overlay');
                if (mp.classList.contains('active')) {
                    if (code === 'Escape' || code === 'KeyB') {
                        closeMediaPlayer();
                    }
                    return;
                }

                const midiOv = document.getElementById('midi-player-overlay');
                if (midiOv.classList.contains('active')) {
                    if (code === 'Escape' || code === 'KeyB') {
                        closeMidiPlayer();
                    } else if (code === 'Enter' || code === 'Space') {
                        if (MIDI_PLAYER.isPlaying) MIDI_PLAYER.pause();
                        else MIDI_PLAYER.play();
                    }
                    return;
                }

                if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') {
                    const dir = code === 'ArrowUp' || code === 'ArrowLeft' ? -1 : 1;
                    if (uiState.level === 'blade') {
                        const items = document.querySelectorAll('.blade-item');
                        let idx = Array.from(items).findIndex(el => el.dataset.blade === currentBlade);
                        idx = (idx + dir + items.length) % items.length;
                        switchBlade(items[idx].dataset.blade);
                    } else {
                        uiState.contentIndex += dir;
                        updateContentFocus();
                    }
                    return;
                }

                if (code === 'Enter' || code === 'Space') {
                    if (uiState.level === 'blade') {
                        uiState.level = 'content';
                        uiState.contentIndex = 0;
                        updateContentFocus();
                    } else {
                        const items = uiState.contentItems;
                        if (items.length > 0 && items[uiState.contentIndex]) {
                            items[uiState.contentIndex].click();
                        }
                    }
                    return;
                }

                if (code === 'Escape' || code === 'KeyB') {
                    if (uiState.level === 'content') {
                        uiState.level = 'blade';
                        clearContentFocus();
                        document.querySelectorAll('.blade-item').forEach(el => {
                            if (el.dataset.blade === currentBlade) {
                                el.classList.add('active');
                            } else {
                                el.classList.remove('active');
                            }
                        });
                    }
                    return;
                }

                if (code.startsWith('Digit') && code.length === 6) {
                    const num = parseInt(code.charAt(5));
                    if (num >= 1 && num <= 5) {
                        const blades = ['dashboard', 'games', 'media', 'settings', 'system'];
                        switchBlade(blades[num - 1]);
                    }
                }
            }

            function pollGamepads() {
                const gamepads = navigator.getGamepads();
                for (let gp of gamepads) {
                    if (gp && gp.connected) {
                        processGamepad(gp);
                    }
                }
                requestAnimationFrame(pollGamepads);
            }

            let lastAxisTime = 0;
            let lastButtonState = {};

            function processGamepad(gamepad) {
                const AXIS_THRESHOLD = 0.5;
                if (gamepad.axes && gamepad.axes.length >= 2) {
                    const axisY = gamepad.axes[1];
                    if (Math.abs(axisY) > AXIS_THRESHOLD) {
                        const now = Date.now();
                        if (now - lastAxisTime > 150) {
                            const dir = axisY > 0 ? 'ArrowDown' : 'ArrowUp';
                            handleKey(dir, true);
                            lastAxisTime = now;
                        }
                    }
                }

                const gc = document.getElementById('game-container');
                const isGameActive = gc.classList.contains('active');
                let map;
                if (isGameActive) {
                    map = {
                        0: 'Enter',
                        1: 'KeyB',
                        2: 'KeyX',
                        3: 'KeyY',
                        8: 'KeyQ',
                        9: 'KeyS',
                        12: 'ArrowUp',
                        13: 'ArrowDown',
                        14: 'ArrowLeft',
                        15: 'ArrowRight'
                    };
                } else {
                    map = {
                        0: 'Enter',
                        1: 'Escape',
                        2: 'KeyX',
                        3: 'KeyY',
                        8: 'Escape',
                        9: 'Enter',
                        12: 'ArrowUp',
                        13: 'ArrowDown',
                        14: 'ArrowLeft',
                        15: 'ArrowRight'
                    };
                }

                const btnStart = gamepad.buttons[9];
                const btnX = gamepad.buttons[2];
                if (btnStart && btnX && btnStart.pressed && btnX.pressed) {
                    if (gc.classList.contains('active')) {
                        exitGame();
                        lastButtonState[gamepad.index + '_2'] = true;
                        lastButtonState[gamepad.index + '_9'] = true;
                        return;
                    }
                }

                for (let i = 0; i < gamepad.buttons.length; i++) {
                    const btn = gamepad.buttons[i];
                    const key = map[i];
                    if (!key) continue;

                    const pressed = btn.pressed;
                    const last = lastButtonState[gamepad.index + '_' + i];
                    if (pressed && !last) {
                        handleKey(key, true);
                    }
                    lastButtonState[gamepad.index + '_' + i] = pressed;
                }
            }

            // ============================================================
            async function boot() {
                const bootScreen = document.getElementById('boot-screen');

                // 进入仪表盘（启动完成）的通用函数
                const enterDashboard = () => {
                    bootScreen.classList.add('hidden');
                    document.getElementById('xbox-dashboard').classList.add('active');
                    updatePlayerUI();
                    switchBlade('dashboard');
                    refreshLibraryUI();
                    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                        document.getElementById('touch-controls').classList.add('active');
                    }
                    currentPlayerId = Object.keys(users)[0] || 'player1';
                    updatePlayerUI();
                    showToast('🎮 Xbox 模拟器已启动');
                };

                // 只需要等待 5000 毫秒（5秒）即可进入系统
                setTimeout(enterDashboard, 5000);
            }

            // ============================================================
            //  21. 主初始化
            // ============================================================
            async function init() {
                await openDB();
                initFileSystem();
                loadUsers();
                loadLibrary();
                initInputSystem();
                window._launchGame = window._launchGame || function(id) {
                    const entry = getLibraryEntry(id);
                    if (entry) window._launchGame(id);
                };
                window._deleteDisc = window._deleteDisc || function(id) {
                    if (confirm('确定删除吗？')) {
                        const entry = getLibraryEntry(id);
                        if (entry && entry.dbKey) deleteFileFromDB(entry.dbKey);
                        removeFromLibrary(id);
                        showToast('🗑️ 已删除');
                    }
                };
                boot();
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

            // ============================================================
            //  22. 跨页面通信 (含 playAudio 消息扩展)
            // ============================================================
            window.addEventListener('storage', (e) => {
                if (e.key === META_KEY || e.key === LIBRARY_KEY || e.key === USERS_KEY) {
                    if (e.key === META_KEY) {
                        const stored = localStorage.getItem(META_KEY);
                        if (stored) fileSystem = JSON.parse(stored);
                    }
                    if (e.key === LIBRARY_KEY) {
                        loadLibrary();
                        refreshLibraryUI();
                    }
                    if (e.key === USERS_KEY) {
                        loadUsers();
                        updatePlayerUI();
                    }
                }
            });

            window.addEventListener('message', (e) => {
                const data = e.data;
                if (data && data.type) {
                    switch (data.type) {
                        case 'launchGame':
                            if (data.id) window._launchGame(data.id);
                            break;
                        case 'insertDisc':
                            insertDisc();
                            break;
                        case 'switchBlade':
                            if (data.blade) switchBlade(data.blade);
                            break;

                        // 停止音乐指令
                            case 'stopAudio':
                                if (window._currentBgmInstance) {
                                    window._currentBgmInstance.pause();
                                    window._currentBgmInstance.src = '';
                                    if (window._currentBgmInstance.parentNode) {
                                        window._currentBgmInstance.parentNode.removeChild(window._currentBgmInstance);
                                    }
                                    window._currentBgmInstance = null;
                                }
                                break;

                            // ✨ 终极多音频并行版：彻底摒弃单例复用，解决切换夹断与冲突问题
                            case 'playAudio':
                                const audioSrc = window._currentResourceMap ? window._currentResourceMap[data.src] : null;
                                if (!audioSrc) break;

                                // 1. 处理循环音乐 (BGM) - 确保同一时间只播放一首
                                if (data.loop) {
                                    // 如果当前有正在播放的BGM，彻底销毁它
                                    if (window._currentBgmInstance) {
                                        window._currentBgmInstance.pause();
                                        window._currentBgmInstance.src = '';
                                        if (window._currentBgmInstance.parentNode) {
                                            window._currentBgmInstance.parentNode.removeChild(window._currentBgmInstance);
                                        }
                                        window._currentBgmInstance = null;
                                    }
                                    // 创建一个全新的BGM播放器
                                    const bgm = new Audio(audioSrc);
                                    bgm.loop = true;
                                    bgm.volume = data.volume || 0.4;
                                    bgm.play().catch(err => console.warn('BGM 播放被浏览器拦截:', err));
                                    // 保存当前BGM引用，以便下次切歌时销毁
                                    window._currentBgmInstance = bgm;
                                }
                                // 2. 处理非循环音效 (枪声、爆炸、交互) - 可同时播放无限个
                                else {
                                    const sfx = new Audio(audioSrc);
                                    sfx.volume = data.volume || 0.5;
                                    // 播放完毕自动从内存销毁自己
                                    sfx.addEventListener('ended', () => {
                                        if (sfx.parentNode) sfx.parentNode.removeChild(sfx);
                                    });
                                    sfx.play().catch(err => console.warn('音效播放被浏览器拦截:', err));
                                }
                                break;

                            // ========== 🎵 新增：MIDI 播放 ==========
                            case 'playMidiFromFile':
                                (async () => {
                                    const { path, options } = data.payload || data;
                                    if (!path) return;
                                    // 从虚拟文件系统里找 .mid 文件
                                    const midFile = resolvePath(path);
                                    if (!midFile || !midFile.file) {
                                        showToast('❌ 找不到 MIDI 文件: ' + path);
                                        return;
                                    }
                                    let buffer = null;
                                    try {
                                        if (midFile.file.dbKey) {
                                            const blob = await getFileFromDB(midFile.file.dbKey);
                                            if (blob) buffer = await blob.arrayBuffer();
                                        } else if (midFile.file.content) {
                                            // content 可能是 dataURL 或纯文本
                                            if (midFile.file.content.startsWith('data:')) {
                                                const base64 = midFile.file.content.split(',')[1];
                                                const binary = atob(base64);
                                                const bytes = new Uint8Array(binary.length);
                                                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                                buffer = bytes.buffer;
                                            } else {
                                                // 假定是 base64 或纯文本，尝试转换
                                                try {
                                                    const binary = atob(midFile.file.content);
                                                    const bytes = new Uint8Array(binary.length);
                                                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                                    buffer = bytes.buffer;
                                                } catch (e) {
                                                    showToast('❌ MIDI 文件格式错误');
                                                    return;
                                                }
                                            }
                                        }
                                    } catch (e) {
                                        showToast('❌ 读取 MIDI 失败: ' + e.message);
                                        return;
                                    }
                                    if (buffer) {
                                        try {
                                            const events = XBoxMidiParser.parse(buffer);
                                            MIDI_PLAYER.load(events, path);
                                            await MIDI_PLAYER.play();
                                        } catch (e) {
                                            showToast('❌ MIDI 解析失败: ' + e.message);
                                        }
                                    }
                                })();
                                break;

                            case 'stopMidi':
                                stopMidi();
                                break;

                            case 'getMidiStatus':
                                e.source.postMessage({
                                    id: data.id,
                                    result: {
                                        playing: MIDI_PLAYER.isPlaying,
                                        engine: MIDI_CONFIG.engine,
                                        ready: MIDI_CONFIG.ready
                                    }
                                }, '*');
                                break;
                    }
                }
            });

            window.parentAPI = {
                launchGame: window._launchGame,
                insertDisc: insertDisc,
                switchBlade: switchBlade,
                getLibrary: () => library,
                getCurrentPlayer: getCurrentPlayer
            };

            console.log('🎮 Xbox 初代模拟器 (终极防重置安全版) 已加载');
            console.log('📚 与XP共享文件系统:', META_KEY);
            console.log('💾 光盘库条目:', library.length);

        })();
    </script>
