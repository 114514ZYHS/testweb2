    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
            background: #0A4000;
            color: #fff;
            touch-action: manipulation;
        }

        /* ========== 启动画面 ========== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
            cursor: pointer;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .xbox-boot-logo {
            font-size: 72px;
            font-weight: 900;
            color: #107C10;
            text-shadow: 0 0 40px rgba(16, 124, 16, 0.6), 0 0 80px rgba(16, 124, 16, 0.3);
            letter-spacing: 8px;
            margin-bottom: 40px;
            font-family: 'Arial Black', sans-serif;
        }
        .boot-progress-container {
            width: 400px;
            height: 6px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .boot-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #107C10, #00FF00);
            border-radius: 3px;
            transition: width 0.3s linear;
        }
        .boot-text {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* ========== 主界面 ========== */
        #xbox-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: radial-gradient(ellipse at 30% 50%, #0F6B00, #063300);
            overflow: hidden;
            touch-action: none;
        }
        #xbox-dashboard.active {
            display: flex;
        }

        /* ===== 网格背景 ===== */
        #xbox-dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 0, 0.01) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.01) 2px, transparent 2px);
            background-size: 60px 60px, 60px 60px, 30px 30px, 30px 30px;
            animation: gridPulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes gridPulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== X球体 (左侧) ===== */
        #x-sphere-container {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 120px;
            height: 120px;
            pointer-events: none;
            touch-action: none;
        }
        .x-sphere {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 60px rgba(0, 255, 0, 0.6));
            transition: filter 0.5s ease;
        }
        .x-sphere .sphere-glow {
            fill: url(#sphereGrad);
            opacity: 0.6;
            animation: spherePulse 3s ease-in-out infinite;
        }
        .x-sphere .sphere-body {
            fill: url(#sphereBodyGrad);
            stroke: rgba(0, 255, 0, 0.3);
            stroke-width: 1;
        }
        .x-sphere .sphere-x {
            stroke: #FFFFFF;
            stroke-width: 6;
            stroke-linecap: round;
            opacity: 0.9;
        }
        @keyframes spherePulse {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ===== 刀片导航 (左侧) ===== */
        #blade-nav {
            position: fixed;
            left: 160px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            touch-action: manipulation;
        }
        .blade-item {
            padding: 14px 28px 14px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 0, 0.15);
            border-radius: 4px 24px 24px 4px;
            color: #aaa;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 170px;
            text-align: right;
            position: relative;
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }
        .blade-item::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            transition: all 0.2s;
        }
        .blade-item.active {
            background: #00CC00;
            color: #000;
            border-color: #00FF00;
            transform: translateX(8px);
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
        }
        .blade-item.active::after {
            background: #FFD700;
            box-shadow: 0 0 20px #FFD700;
        }
        .blade-item.focused {
            background: #FFD700;
            color: #000;
            border-color: #FFD700;
            transform: translateX(16px);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        .blade-item.focused::after {
            background: #fff;
        }
        .blade-item:hover:not(.active) {
            background: rgba(16, 124, 16, 0.3);
            border-color: rgba(0, 255, 0, 0.3);
        }
        .blade-item:active {
            transform: scale(0.96);
        }

        /* ===== 内容区域 (右侧) ===== */
        #content-area {

        #content-area::-webkit-scrollbar {

        #content-area h1 {

        #content-area h2 {

        }

        /* ===== 底部状态栏 ===== */
        #status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);

        /* ===== 光盘插入按钮 ===== */
        #disc-insert-btn {

        /* ===== 游戏卡片网格 ===== */
        .game-grid {
            display: grid;

            gap: 20px;
            padding: 4px 0;

        .game-card {

            width: 48px;

            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.08s;
            touch-action: manipulation;
            min-width: 44px;
            min-height: 44px;
            -webkit-touch-callout: none;
        }
        #touch-controls .touch-btn:active {
            background: rgba(16, 124, 16, 0.4);
            transform: scale(0.92);
        }
        #touch-controls .touch-btn.dpad-btn {
            width: 44px;
            height: 44px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            min-width: 40px;
            min-height: 40px;
        }
        #touch-controls .touch-btn.abxy-btn {
            width: 44px;
            height: 44px;
            font-size: 14px;
            font-weight: 700;
            min-width: 40px;
            min-height: 40px;
        }
        #touch-controls .touch-btn.abxy-btn.btn-a {
            background: rgba(16, 124, 16, 0.3);
            border-color: #107C10;
            color: #00FF00;
        }
        #touch-controls .touch-btn.abxy-btn.btn-b {
            background: rgba(200, 50, 50, 0.3);
            border-color: #cc3333;
            color: #ff6666;
        }
        #touch-controls .touch-btn.abxy-btn.btn-x {
            background: rgba(50, 50, 200, 0.3);
            border-color: #3355cc;
            color: #6688ff;
        }
        #touch-controls .touch-btn.abxy-btn.btn-y {
            background: rgba(200, 200, 50, 0.3);
            border-color: #cccc33;
            color: #ffff66;
        }

        /* ===== Toast 提示 ===== */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            align-items: center;
        }
        .toast-item {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 30px;
            padding: 12px 28px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }

        /* ===== 手柄高亮专用 ===== */
        .gamepad-selected {
            outline: 3px solid #FFD700 !important;
            outline-offset: 2px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(1.02);
            transition: all 0.15s ease;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            #blade-nav {
                left: 12px;
                gap: 4px;
            }
            .blade-item {
                padding: 10px 14px 10px 10px;
                min-width: 80px;
                font-size: 12px;
                letter-spacing: 1px;
            }
            #content-area {
                left: 110px;
                right: 12px;
                top: 40px;
                bottom: 80px;
                padding: 8px 12px;
            }
            #x-sphere-container {
                left: 2px;
                width: 48px;
                height: 48px;
                top: 40%;
            }
            #disc-insert-btn {
                right: 8px;
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            #status-bar {
                padding: 6px 12px;
                gap: 10px;
                font-size: 12px;
                bottom: 10px;
                flex-wrap: wrap;
                justify-content: center;
                border-radius: 20px;
            }
            .status-left,
            .status-right {
                font-size: 11px;
                gap: 6px;
            }
            .status-center .hint .key {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .game-card .game-cover {
                font-size: 36px;
            }
            .game-card .game-title {
                font-size: 13px;
            }
            .disc-manager-box {
                padding: 24px 20px;
            }
            .disc-manager-box .disc-icon {
                font-size: 48px;
            }
            .disc-manager-box .disc-name {
                font-size: 18px;
            }
            #media-player-overlay canvas {
                height: 50%;
            }
            #touch-controls {
                bottom: 70px;
                padding: 0 8px;
            }
            #touch-controls .touch-btn {
                width: 40px;
                height: 40px;
                font-size: 14px;
                min-width: 36px;
                min-height: 36px;
            }
            #touch-controls .touch-btn.dpad-btn {
                width: 36px;
                height: 36px;
                font-size: 12px;
            }
            #touch-controls .touch-btn.abxy-btn {
                width: 36px;
                height: 36px;
                font-size: 12px;
            }
        }
        .fullscreen-btn:hover {
            color: #fff !important;
            text-shadow: 0 0 10px rgba(0,255,0,0.4);
        }

        @media (max-width: 500px) {
            #blade-nav {
                left: 6px;
                gap: 3px;
            }
            .blade-item {
                padding: 6px 8px 6px 6px;
                min-width: 56px;
                font-size: 9px;
                letter-spacing: 0;
                border-radius: 2px 12px 12px 2px;
            }
            #content-area {
                left: 70px;
                right: 6px;
                top: 30px;
                bottom: 70px;
                padding: 4px 6px;
            }
            #x-sphere-container {
                display: none;
            }
            #disc-insert-btn {
                right: 4px;
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            #status-bar {
                padding: 4px 8px;
                gap: 4px;
                font-size: 9px;
                bottom: 4px;
                border-radius: 12px;
                min-height: 36px;
            }
            .status-left,
            .status-right {
                font-size: 9px;
                gap: 4px;
            }
            .status-center {
                font-size: 9px;
            }
            .status-center .hint .key {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 6px;
            }
            .game-card {
                padding: 8px 4px;
            }
            .game-card .game-cover {
                font-size: 24px;
            }
            .game-card .game-title {
                font-size: 10px;
            }
            .game-card .game-meta {
                font-size: 9px;
            }
            .game-card .game-btn {
                font-size: 9px;
                padding: 4px 8px;
                min-height: 28px;
                min-width: 40px;
            }
            #touch-controls {
                bottom: 60px;
                padding: 0 4px;
            }
            #touch-controls .touch-btn {
                width: 32px;
                height: 32px;
                font-size: 11px;
                min-width: 28px;
                min-height: 28px;
            }
            #touch-controls .touch-btn.dpad-btn {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            #touch-controls .touch-btn.abxy-btn {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
        }

        /* ===== MIDI 播放器覆盖层 ===== */
        #midi-player-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 70000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            touch-action: none;
        }
        #midi-player-overlay.active {
            display: flex;
        }
        .midi-player-box {
            background: #0a1a0a;
            border: 2px solid rgba(0, 255, 0, 0.25);
            border-radius: 20px;
            padding: 24px;
            max-width: 900px;
            width: 94%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 0 80px rgba(0, 255, 0, 0.15);
            touch-action: manipulation;
        }
        .midi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .midi-title {
            font-size: 20px;
            font-weight: 900;
            color: #00FF00;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        .midi-engine-switch {
            display: flex;
            gap: 6px;
            background: #111;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 0, 0.15);
        }
        .engine-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .engine-btn.active {
            background: #107C10;
            color: #fff;
            box-shadow: 0 0 16px rgba(16, 124, 16, 0.5);
        }
        .midi-close-btn {
            width: 36px;
            height: 36px;
            background: rgba(200, 50, 50, 0.2);
            border: 1px solid rgba(200, 50, 50, 0.4);
            border-radius: 50%;
            color: #ff6666;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .midi-close-btn:hover {
            background: rgba(200, 50, 50, 0.4);
        }

        /* SF2 面板 */
        .sf2-panel {
            background: rgba(16, 124, 16, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .sf2-panel.hidden {
            display: none;
        }
        .sf2-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #sf2-status-text {
            color: #ccc;
            font-size: 14px;
        }
        .sf2-upload-btn {
            background: #107C10;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            touch-action: manipulation;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
        }
        .sf2-upload-btn:hover {
            background: #1a9a1a;
        }
        .sf2-hint {
            color: #666;
            font-size: 12px;
            margin-top: 6px;
        }

        /* 可视化 */
        #midi-visualizer {
            width: 100%;
            height: 140px;
            background: #050a05;
            border-radius: 12px;
            display: block;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 0, 0.1);
        }

        /* 进度条 */
        .midi-progress-wrap {
            height: 12px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 8px;
            touch-action: manipulation;
        }
        .midi-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #107C10, #00FF00);
            transition: width 0.1s;
        }
        .midi-info {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
            margin-bottom: 12px;
            font-family: monospace;
        }

        /* 通道灯 */
        .midi-channels {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            margin-bottom: 16px;
        }
        .midi-channel {
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            text-align: center;
            padding: 4px 0;
            font-size: 9px;
            color: #555;
            transition: all 0.08s;
            min-height: 24px;
        }
        .midi-channel.active {
            background: rgba(16, 124, 16, 0.4);
            border-color: #00FF00;
            color: #fff;
        }
        .midi-channel.drum.active {
            background: rgba(200, 50, 50, 0.4);
            border-color: #ff5555;
        }

        /* 控制区 */
        .midi-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .midi-ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            touch-action: manipulation;
            min-width: 44px;
            min-height: 44px;
        }
        .midi-ctrl-btn:hover {
            background: rgba(16, 124, 16, 0.3);
            border-color: #107C10;
        }
        .midi-play-btn {
            background: #107C10;
            border-color: #107C10;
            width: 54px;
            height: 54px;
            font-size: 20px;
            min-width: 54px;
            min-height: 54px;
        }
        .midi-play-btn:hover {
            background: #1a9a1a;
        }
        .midi-speed {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            font-size: 12px;
        }
        .midi-speed select {
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            touch-action: manipulation;
        }

        @media (max-width: 600px) {
            .midi-title {
                font-size: 15px;
                letter-spacing: 1px;
            }
            .midi-engine-switch {
                font-size: 11px;
            }
            .engine-btn {
                padding: 5px 8px;
                font-size: 11px;
            }
            .midi-channels {
                grid-template-columns: repeat(8, 1fr);
            }
            #midi-visualizer {
                height: 90px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/js-synthesizer@1.15.0/dist/js-synthesizer.min.js"></script>
</head>
<body>

    <!-- ===== 启动画面 ===== -->
    <div id="boot-screen">
        <!-- 开机动画视频，纯黑背景铺满全屏 -->
        <img id="boot-image" src="imgs/xboxstart.jpg" alt="Xbox Boot" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; background:#000; display:block;">
    </div>

    <!-- ===== 主仪表盘 ===== -->
    <div id="xbox-dashboard">

        <!-- X球体 (SVG) -->
        <div id="x-sphere-container">
            <svg class="x-sphere" viewBox="0 0 200 200">
                <defs>
                    <radialGradient id="sphereGrad" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="#00FF00" stop-opacity="0.8"/>
                        <stop offset="50%" stop-color="#107C10" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#003300" stop-opacity="0.2"/>
                    </radialGradient>
                    <radialGradient id="sphereBodyGrad" cx="40%" cy="35%" r="55%">
                        <stop offset="0%" stop-color="#88ff88" stop-opacity="0.9"/>
                        <stop offset="30%" stop-color="#33cc33" stop-opacity="0.8"/>
                        <stop offset="70%" stop-color="#0a5a0a" stop-opacity="0.7"/>
                        <stop offset="100%" stop-color="#003300" stop-opacity="0.5"/>
                    </radialGradient>
                </defs>
                <circle cx="100" cy="100" r="90" class="sphere-glow"/>
                <circle cx="100" cy="100" r="72" class="sphere-body"/>
                <path d="M52,52 L148,148 M148,52 L52,148" class="sphere-x" stroke-width="8"/>
                <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(0,255,0,0.15)" stroke-width="1"/>
            </svg>
        </div>

        <!-- 刀片导航 -->
        <nav id="blade-nav">
            <div class="blade-item active" data-blade="dashboard">仪表盘</div>
            <div class="blade-item" data-blade="games">游戏库</div>
            <div class="blade-item" data-blade="media">媒体</div>
            <div class="blade-item" data-blade="settings">设置</div>
            <div class="blade-item" data-blade="system">系统</div>
        </nav>

        <!-- 内容区域 -->
        <div id="content-area"></div>

        <!-- 光盘插入按钮 -->
        <div id="disc-insert-btn" title="插入光盘">💿</div>

        <!-- 底部状态栏 -->
        <div id="status-bar">
            <div class="status-left">
                <span class="player-indicator" id="status-player">👤 玩家1</span>
                <span class="controller-status" id="status-controller">🎮 已连接</span>
            </div>
            <div class="status-center">
                <span class="hint"><span class="key">A</span> 选择</span>
                <span class="hint"><span class="key">B</span> 返回</span>
                <span class="hint"><span class="key">↑↓</span> 导航</span>
            </div>
            <div class="status-right">
                <span class="disc-status" id="status-disc">💿 无光盘</span>
                <span class="clock" id="status-clock">12:00</span>
                <span class="fullscreen-btn" id="fullscreen-btn" style="cursor:pointer; touch-action:manipulation; font-size:20px; margin-left:8px; color:#aaa;">⛶</span>
            </div>
        </div>

        <!-- 虚拟触控按键 -->
        <div id="touch-controls">
            <div class="touch-group">
                <div class="touch-btn dpad-btn" data-key="ArrowUp">▲</div>
                <div class="touch-btn dpad-btn" data-key="ArrowDown">▼</div>
                <div class="touch-btn dpad-btn" data-key="ArrowLeft">◀</div>
                <div class="touch-btn dpad-btn" data-key="ArrowRight">▶</div>
            </div>
            <div class="touch-group">
                <div class="touch-btn abxy-btn btn-a" data-key="Enter">A</div>
                <div class="touch-btn abxy-btn btn-b" data-key="Escape">B</div>
                <div class="touch-btn abxy-btn btn-x" data-key="KeyX">X</div>
                <div class="touch-btn abxy-btn btn-y" data-key="KeyY">Y</div>
            </div>
            <div class="touch-group">
                <div class="touch-btn" data-key="KeyS" style="background:rgba(200,200,200,0.15);border-color:#666;">S</div>
                <div class="touch-btn" data-key="KeyQ" style="background:rgba(200,200,200,0.15);border-color:#666;">Q</div>
            </div>
        </div>
    </div>

    <!-- ===== 光盘管理覆盖层 ===== -->
    <div id="disc-manager-overlay">
        <div class="disc-manager-box">
            <span class="disc-icon" id="dm-icon">💿</span>
            <div class="disc-name" id="dm-name">未命名</div>
            <div class="disc-meta" id="dm-meta">0 MB · 未知</div>
            <div class="disc-actions">
                <button class="action-btn launch-btn" id="dm-launch">▶ 启动</button>
                <button class="action-btn save-btn" id="dm-save">💾 储存</button>
                <button class="action-btn cancel-btn" id="dm-cancel">✕ 取消</button>
            </div>
            <div class="disc-hint">"启动" 临时体验，关闭后自动清除<br>"储存" 永久保存到光盘库</div>
        </div>
    </div>

    <!-- ===== 媒体播放器覆盖层 ===== -->
    <div id="media-player-overlay">
        <canvas id="player-canvas"></canvas>
        <div class="player-controls">
            <button class="player-btn" id="mp-prev">⏮</button>
            <button class="player-btn play-btn" id="mp-play">▶</button>
            <button class="player-btn" id="mp-next">⏭</button>
            <div class="progress-wrap">
                <div class="progress-track" id="mp-progress-track">
                    <div class="progress-fill" id="mp-progress-fill"></div>
                </div>
                <span class="time-display" id="mp-time">0:00 / 0:00</span>
            </div>
            <div class="volume-wrap">
                <span>🔊</span>
                <div class="volume-track" id="mp-volume-track">
                    <div class="volume-fill" id="mp-volume-fill"></div>
                </div>
            </div>
            <button class="player-btn close-btn" id="mp-close">✕</button>
        </div>
    </div>

    <!-- ===== 全屏游戏容器 ===== -->
    <div id="game-container"></div>

    <!-- ===== MIDI 播放器覆盖层 ===== -->
    <div id="midi-player-overlay">
        <div class="midi-player-box">

            <!-- 顶部：引擎切换 + 关闭 -->
            <div class="midi-header">
                <div class="midi-title">🎹 MIDI PLAYER</div>
                <div class="midi-engine-switch">
                    <button class="engine-btn active" data-engine="sf2">📦 SF2 音色库</button>
                    <button class="engine-btn" data-engine="web">🎵 Web 合成</button>
                </div>
                <button class="midi-close-btn" id="midi-close">✕</button>
            </div>

            <!-- SF2 管理区 -->
            <div class="sf2-panel hidden" id="sf2-panel">
                <div class="sf2-status">
                    <span id="sf2-status-text">未加载音色库</span>
                    <label class="sf2-upload-btn" for="sf2-file-input">📂 上传 .sf2 文件</label>
                    <input type="file" id="sf2-file-input" accept=".sf2" style="display:none;">
                </div>
                <div class="sf2-hint">提示：上传一次后会永久保存，下次自动加载</div>
            </div>

            <!-- 可视化区 -->
            <canvas id="midi-visualizer"></canvas>

            <!-- 进度条 -->
            <div class="midi-progress-wrap" id="midi-progress-wrap">
                <div class="midi-progress" id="midi-progress-bar"></div>
            </div>
            <div class="midi-info">
                <span id="midi-time-info">00:00 / 00:00</span>
                <span id="midi-note-info">等待加载 MIDI</span>
            </div>

            <!-- 通道指示灯 -->
            <div class="midi-channels" id="midi-channel-grid"></div>

    <!-- ============================================================ -->
    <!-- ======================== JavaScript =========================== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 共享数据层 (与XP模拟器互通)
            // ============================================================
            const DB_NAME = 'xp_files_db';
            const DB_VERSION = 1;
            const STORE_NAME = 'files';
            const META_KEY = 'xp_files_meta';
            const USERS_KEY = 'xp_users';
            const REGISTRY_KEY = 'xp_registry';
            const LIBRARY_KEY = 'xbox_library';

            let db = null;
            let fileSystem = null;
            let users = {};
            let currentPlayerId = 'player1';
            let library = [];
            let currentBlade = 'dashboard';
            let bladeFocusIndex = 0;
            let pendingDisc = null;
            let isPlaying = false;
            let audioCtx = null;
            let analyser = null;
            let dataArray = null;
            let animId = null;
            let audioPlayer = null;
            let currentMediaEntry = null;
            let gameContainer = null;

            // ============================================================
            //  SF2 音色库管理器 - 用户上传，IndexedDB 存储，绕过 CORS
            // ============================================================
            const SF2_MANAGER = {
                buffer: null,        // ArrayBuffer
                name: null,          // 文件名
                dbKey: 'sf2_library', // IndexedDB 存储键

                // 从 IndexedDB 加载已保存的 SF2
                async loadFromStorage() {
                    try {
                        const blob = await getFileFromDB(this.dbKey);
                        if (!blob) return false;
                        this.buffer = await blob.arrayBuffer();
                        this.name = blob.name || 'soundfont.sf2';
                        console.log('[SF2] 已从存储加载，大小:', this.buffer.byteLength);
                        this.updateUI();
                        return true;
                    } catch (e) {
                        console.warn('[SF2] 从存储加载失败:', e);
                        return false;
                    }
                },

                // 用户上传新 SF2
                async handleUpload(file) {
                    if (!file) return false;
                    if (!file.name.toLowerCase().endsWith('.sf2')) {
                        showToast('❌ 请选择 .sf2 文件');
                        return false;
                    }
                    if (file.size > 200 * 1024 * 1024) {
                        showToast('❌ 文件过大（>200MB）');
                        return false;
                    }
                    try {
                        this.buffer = await file.arrayBuffer();
                        this.name = file.name;
                        // 存到 IndexedDB 供下次使用
                        await saveFileToDB(this.dbKey, file);
                        console.log('[SF2] 上传成功:', this.name, this.buffer.byteLength);
                        this.updateUI();
                        showToast('✅ 音色库已加载：' + this.name);
                        // 通知合成器重新加载
                        if (MIDI_CONFIG.engine === 'sf2') {
                            await reloadSf2IntoEngine();
                        }
                        return true;
                    } catch (e) {
                        showToast('❌ 读取失败: ' + e.message);
                        return false;
                    }
                },

                // 删除已保存的 SF2
                async clear() {
                    this.buffer = null;
                    this.name = null;
                    await deleteFileFromDB(this.dbKey);
                    this.updateUI();
                    showToast('🗑️ 已清除音色库');
                },

                updateUI() {
                    const el = document.getElementById('sf2-status-text');
                    if (!el) return;
                    if (this.name && this.buffer) {
                        el.textContent = `✅ 已加载: ${this.name} (${(this.buffer.byteLength/1024/1024).toFixed(1)}MB)`;
                        el.style.color = '#00FF00';
                    } else {
                        el.textContent = '未加载音色库（请上传 .sf2 文件）';
                        el.style.color = '#ffaa00';
                    }
                }
            };

            // ============================================================
            //  MIDI 合成引擎配置（双引擎）
            // ============================================================
            const MIDI_CONFIG = {
                engine: 'web',           // 'sf2' 或 'web'
                synth: null,             // js-synthesizer 实例（SF2 用）
                webEngine: null,         // SynthEngine 实例（Web 合成用）
                ctx: null,
                ready: false,
                loading: false,
                volume: 0.6
            };

            // 确保 AudioContext 存在
            function ensureAudioCtx() {
                if (!MIDI_CONFIG.ctx) {
                    MIDI_CONFIG.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (MIDI_CONFIG.ctx.state === 'suspended') {
                    MIDI_CONFIG.ctx.resume();
                }
                return MIDI_CONFIG.ctx;
            }

            // 初始化 Web 合成引擎（无需资源）
            function initWebEngine() {
                if (MIDI_CONFIG.webEngine) return true;
                const ctx = ensureAudioCtx();
                MIDI_CONFIG.webEngine = new SynthEngine(ctx);
                MIDI_CONFIG.webEngine.setPreset('DOS');
                console.log('[MIDI] Web 合成引擎就绪');
                return true;
            }

            // 初始化 SF2 引擎（需要用户上传）
            async function initSf2Engine() {
                if (MIDI_CONFIG.synth && MIDI_CONFIG.synth.sf2Loaded) return true;
                if (!SF2_MANAGER.buffer) {
                    showToast('⚠️ 请先上传 SF2 音色库');
                    return false;
                }
                if (MIDI_CONFIG.loading) {
                    while (MIDI_CONFIG.loading) await new Promise(r => setTimeout(r, 100));
                    return MIDI_CONFIG.ready;
                }
                MIDI_CONFIG.loading = true;
                try {
                    const ctx = ensureAudioCtx();
                    if (!MIDI_CONFIG.synth) {
                        const workletUrl = 'https://cdn.jsdelivr.net/npm/js-synthesizer@1.15.0/dist/js-synthesizer.worklet.min.js';
                        MIDI_CONFIG.synth = await Synthesizer.loadFromURL(ctx, workletUrl);
                    }
                    // 关键：直接用 ArrayBuffer，不用 fetch！
                    await MIDI_CONFIG.synth.loadSFont(SF2_MANAGER.buffer);
                    MIDI_CONFIG.synth.setMasterVolume(MIDI_CONFIG.volume);
                    MIDI_CONFIG.synth.sf2Loaded = true;
                    MIDI_CONFIG.ready = true;
                    console.log('[MIDI] SF2 引擎就绪');
                    return true;
                } catch (e) {
                    console.error('[MIDI] SF2 引擎初始化失败:', e);
                    showToast('❌ SF2 加载失败: ' + e.message);
                    return false;
                } finally {
                    MIDI_CONFIG.loading = false;
                }
            }

            // 切换引擎
            async function switchEngine(engine) {
                if (MIDI_CONFIG.engine === engine) return;
                stopMidi();
                MIDI_CONFIG.engine = engine;

                // 更新按钮 UI
                document.querySelectorAll('.engine-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.engine === engine);
                });
                // 显示/隐藏 SF2 面板
                document.getElementById('sf2-panel')?.classList.toggle('hidden', engine !== 'sf2');

                if (engine === 'sf2') {
                    // 先尝试从存储加载
                    if (!SF2_MANAGER.buffer) {
                        await SF2_MANAGER.loadFromStorage();
                    }
                    if (SF2_MANAGER.buffer) {
                        await initSf2Engine();
                    } else {
                        showToast('⚠️ 请上传 SF2 音色库');
                    }
                } else {
                    initWebEngine();
                    showToast('🎵 已切换到 Web 合成');
                }
            }

            // 供外部调用的重载（切换音色库后）
            async function reloadSf2IntoEngine() {
                if (!MIDI_CONFIG.synth) return;
                try {
                    await MIDI_CONFIG.synth.loadSFont(SF2_MANAGER.buffer);
                    showToast('✅ 音色库已重新加载');
                } catch (e) {
                    showToast('❌ 重新加载失败: ' + e.message);
                }
            }

            // ============================================================
            //  MIDI 解析器 (从你之前的播放器直接移植)
            // ============================================================
            class XBoxMidiParser {
                static parse(arrayBuffer) {
                    if (!arrayBuffer || arrayBuffer.byteLength === 0) throw new Error('空文件');
                    const data = new Uint8Array(arrayBuffer);
                    if (data.length < 14) throw new Error('文件不完整');

                    let offset = 0;
                    const headId = String.fromCharCode(data[0], data[1], data[2], data[3]);
                    offset += 4;
                    if (headId !== 'MThd') throw new Error('非 MThd 文件头');

                    const headerLength = ((data[offset] << 24) | (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3]) >>> 0;
                    offset += 4;
                    const format = ((data[offset] << 8) | data[offset + 1]) >>> 0; offset += 2;
                    const numTracks = ((data[offset] << 8) | data[offset + 1]) >>> 0; offset += 2;
                    let ppqn = ((data[offset] << 8) | data[offset + 1]) >>> 0; offset += 2;
                    if (ppqn & 0x8000) throw new Error('不支持 SMPTE 格式');
                    if (ppqn < 1 || ppqn > 1000) ppqn = 480;
                    if (numTracks === 0) throw new Error('无音轨');

                    const events = [];
                    const tempoChanges = [];

                    const readVarInt = (o) => {
                        let v = 0, b = data[o++];
                        v = b & 0x7F;
                        let s = 0;
                        while (b & 0x80) {
                            if (s++ > 1000) throw new Error('变长数据损坏');
                            b = data[o++];
                            v = (v << 7) | (b & 0x7F);
                        }
                        return { value: v, offset: o };
                    };

                    for (let t = 0; t < numTracks; t++) {
                        offset += 4; // skip 'MTrk'
                        const trackLength = ((data[offset] << 24) | (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3]) >>> 0;
                        offset += 4;
                        const trackEnd = Math.min(offset + trackLength, data.length);
                        let trackOffset = offset;
                        let runningStatus = 0;
                        let trackAbsTicks = 0;

                        while (trackOffset < trackEnd) {
                            const delta = readVarInt(trackOffset);
                            trackOffset = delta.offset;
                            trackAbsTicks += delta.value;

                            let status = data[trackOffset++];
                            if (status < 0x80) {
                                status = runningStatus;
                                trackOffset--;
                            } else {
                                runningStatus = status;
                            }

                            const type = status & 0xF0;
                            const channel = status & 0x0F;

                            if (type === 0x80 || type === 0x90) {
                                const note = data[trackOffset++];
                                const velocity = data[trackOffset++];
                                const isNoteOn = (type === 0x90 && velocity > 0);
                                events.push({
                                    ticks: trackAbsTicks, channel, note,
                                    velocity: isNoteOn ? velocity : 0,
                                    isNoteOn, isNoteOff: !isNoteOn,
                                    isProgramChange: false
                                });
                            } else if (type === 0xC0) {
                                const program = data[trackOffset++];
                                events.push({ ticks: trackAbsTicks, channel, isProgramChange: true, program, isNoteOn: false, isNoteOff: false });
                            } else if (type === 0xD0) {
                                trackOffset++;
                            } else if (status === 0xFF) {
                                const metaType = data[trackOffset++];
                                const lenResult = readVarInt(trackOffset);
                                trackOffset = lenResult.offset;
                                const len = lenResult.value;
                                if (metaType === 0x2F) break;
                                else if (metaType === 0x51) {
                                    let tempo = ((data[trackOffset] << 16) | (data[trackOffset + 1] << 8) | data[trackOffset + 2]) >>> 0;
                                    if (tempo < 10000 || tempo > 2000000) tempo = 500000;
                                    tempoChanges.push({ ticks: trackAbsTicks, tempo });
                                }
                                trackOffset += len;
                            } else if (status === 0xF1) trackOffset += 1;
                            else if (status === 0xF2) trackOffset += 2;
                            else if (status === 0xF3) trackOffset += 1;
                            else if (status === 0xF6) { }
                            else if (status === 0xF0 || status === 0xF7) {
                                const len = readVarInt(trackOffset).value;
                                trackOffset += len;
                            } else if (status & 0x80) trackOffset += 2;
                            else trackOffset += 2;
                        }
                        offset = trackEnd;
                    }

                    if (events.length === 0) throw new Error('无有效音符');
                    events.sort((a, b) => a.ticks - b.ticks);
                    tempoChanges.sort((a, b) => a.ticks - b.ticks);

                    const ppqnFactor = 1 / ppqn;
                    let currentTempo = 500000, tempoIdx = 0, lastTicks = 0, accumulatedTime = 0;

                    return events.map(e => {
                        while (tempoIdx < tempoChanges.length && tempoChanges[tempoIdx].ticks <= e.ticks) {
                            const t = tempoChanges[tempoIdx];
                            const deltaTicks = t.ticks - lastTicks;
                            if (deltaTicks > 0) accumulatedTime += deltaTicks * ppqnFactor * (currentTempo / 1e6);
                            currentTempo = t.tempo;
                            lastTicks = t.ticks;
                            tempoIdx++;
                        }
                        const deltaTicks = e.ticks - lastTicks;
                        const time = accumulatedTime + deltaTicks * ppqnFactor * (currentTempo / 1e6);
                        return { ...e, time };
                    }).sort((a, b) => a.time - b.time);
                }
            }

            // ============================================================
            //  MIDI 播放器（双引擎调度）
            // ============================================================
            const MIDI_PLAYER = {
                events: [],
                eventIndex: 0,
                startTime: 0,
                timerId: null,
                isPlaying: false,
                totalDuration: 0,
                currentPath: null,
                rate: 1.0,
                pausedAt: 0,

                // 载入 MIDI 事件
                load(events, path) {
                    // 计算总时长
                    let lastTime = 0;
                    for (let i = events.length - 1; i >= 0; i--) {
                        if (events[i].isNoteOn) { lastTime = events[i].time; break; }
                    }
                    this.totalDuration = lastTime + 1;
                    this.events = events;
                    this.eventIndex = 0;
                    this.pausedAt = 0;
                    this.currentPath = path;
                    this.stop();
                    updateMidiUI();
                },

                async play() {
                    if (this.events.length === 0 || this.isPlaying) return;

                    // 根据当前引擎准备
                    if (MIDI_CONFIG.engine === 'sf2') {
                        const ok = await initSf2Engine();
                        if (!ok) { showToast('❌ SF2 引擎未就绪'); return; }
                    } else {
                        initWebEngine();
                    }

                    const ctx = ensureAudioCtx();
                    this.isPlaying = true;
                    this.startTime = ctx.currentTime - this.pausedAt * this.rate;

                    // 启动可视化
                    startMidiVisualizer();

                    // 调度循环
                    const schedule = () => {
                        if (!this.isPlaying) return;
                        const now = ctx.currentTime;
                        const lookahead = now + 0.15;

                        while (this.eventIndex < this.events.length) {
                            const ev = this.events[this.eventIndex];
                            const evTime = this.startTime + ev.time * this.rate;
                            if (evTime > lookahead) break;
                            if (evTime < now) { this.eventIndex++; continue; }

                            this._dispatch(ev, evTime);
                            this.eventIndex++;
                        }

                        // 更新进度
                        const elapsed = (ctx.currentTime - this.startTime) / this.rate;
                        document.getElementById('midi-progress-bar').style.width =
                            Math.min(100, (elapsed / this.totalDuration) * 100) + '%';
                        document.getElementById('midi-time-info').textContent =
                            `${formatMidiTime(elapsed)} / ${formatMidiTime(this.totalDuration)}`;

                        // 结束检测
                        if (this.eventIndex >= this.events.length) {
                            setTimeout(() => {
                                if (this.isPlaying && !hasActiveVoices()) {
                                    this.stop();
                                }
                            }, 500);
                            return;
                        }
                        this.timerId = setTimeout(schedule, 25);
                    };
                    schedule();
                    document.getElementById('midi-play').textContent = '⏸';
                },

                // 分发事件到当前引擎
                _dispatch(ev, when) {
                    if (MIDI_CONFIG.engine === 'sf2') {
                        if (!MIDI_CONFIG.synth) return;
                        if (ev.isProgramChange) MIDI_CONFIG.synth.programChange(ev.channel, ev.program);
                        else if (ev.isNoteOn) MIDI_CONFIG.synth.noteOn(ev.channel, ev.note, ev.velocity);
                        else if (ev.isNoteOff) MIDI_CONFIG.synth.noteOff(ev.channel, ev.note);
                    } else {
                        if (!MIDI_CONFIG.webEngine) return;
                        if (ev.isProgramChange) MIDI_CONFIG.webEngine.setProgram(ev.channel, ev.program);
                        else if (ev.isNoteOn) MIDI_CONFIG.webEngine.noteOn(ev.channel, ev.note, ev.velocity, when);
                        else if (ev.isNoteOff) MIDI_CONFIG.webEngine.noteOff(ev.channel, ev.note, when);
                    }
                    // 更新通道指示
                    updateChannelIndicator(ev.channel, ev.isNoteOn);
                },

                pause() {
                    if (!this.isPlaying) return;
                    this.isPlaying = false;
                    clearTimeout(this.timerId);
                    const ctx = MIDI_CONFIG.ctx;
                    this.pausedAt = (ctx.currentTime - this.startTime) / this.rate;
                    this.stopAllVoices();
                    stopMidiVisualizer();
                    document.getElementById('midi-play').textContent = '▶';
                },

                stop() {
                    this.isPlaying = false;
                    clearTimeout(this.timerId);
                    this.eventIndex = 0;
                    this.pausedAt = 0;
                    this.stopAllVoices();
                    stopMidiVisualizer();
                    document.getElementById('midi-progress-bar').style.width = '0%';
                    document.getElementById('midi-play').textContent = '▶';
                    resetChannelIndicators();
                },

                stopAllVoices() {
                    if (MIDI_CONFIG.engine === 'sf2') {
                        if (MIDI_CONFIG.synth) MIDI_CONFIG.synth.stopAll();
                    } else {
                        if (MIDI_CONFIG.webEngine) MIDI_CONFIG.webEngine.clearAllVoices();
                    }
                },

                seekTo(time) {
                    if (!this.events.length) return;
                    time = Math.max(0, Math.min(this.totalDuration, time));
                    const wasPlaying = this.isPlaying;
                    if (wasPlaying) this.pause();
                    this.pausedAt = time;
                    this.eventIndex = 0;
                    while (this.eventIndex < this.events.length && this.events[this.eventIndex].time < time) {
                        this.eventIndex++;
                    }
                    document.getElementById('midi-progress-bar').style.width = (time / this.totalDuration * 100) + '%';
                    document.getElementById('midi-time-info').textContent =
                        `${formatMidiTime(time)} / ${formatMidiTime(this.totalDuration)}`;
                    if (wasPlaying) this.play();
                },

                setRate(rate) {
                    if (this.isPlaying) {
                        const ctx = MIDI_CONFIG.ctx;
                        const pos = (ctx.currentTime - this.startTime) / this.rate;
                        this.rate = rate;
                        this.startTime = ctx.currentTime - pos * rate;
                    } else {
                        this.rate = rate;
                    }
                }
            };

            function hasActiveVoices() {
                if (MIDI_CONFIG.engine === 'sf2') {
                    return MIDI_CONFIG.synth && MIDI_CONFIG.synth.getVoices().length > 0;
                } else {
                    return MIDI_CONFIG.webEngine && MIDI_CONFIG.webEngine.voices.size > 0;
                }
            }

            function formatMidiTime(sec) {
                if (isNaN(sec) || !isFinite(sec)) return '00:00';
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(Math.floor(sec % 60)).padStart(2, '0');
                return `${m}:${s}`;
            }

            function updateMidiUI() {
                document.getElementById('midi-progress-bar').style.width = '0%';
                document.getElementById('midi-time-info').textContent =
                    '00:00 / ' + formatMidiTime(MIDI_PLAYER.totalDuration);
                const noteCount = MIDI_PLAYER.events.filter(e => e.isNoteOn).length;
                document.getElementById('midi-note-info').textContent =
                    `🎵 ${MIDI_PLAYER.currentPath || '已载入'} · ${noteCount} 音符`;
            }

            // ============================================================
            //  Web 合成引擎（内置 Oscillator，8-bit 风格，无需加载资源）
            // ============================================================
            class SynthEngine {
                constructor(ctx) {
                    this.ctx = ctx;
                    this.preset = 'DOS';
                    this.masterGain = ctx.createGain();
                    this.masterGain.gain.value = 0.6;
                    this.masterGain.connect(ctx.destination);
                    this.voices = new Map();
                }

                setPreset(name) {
                    this.preset = name;
                }

                setProgram(channel, program) {
                    // Web 引擎不区分音色（可选：后续扩展）
                }

                noteOn(channel, note, velocity, when = 0) {
                    const ctx = this.ctx;
                    const key = channel + '-' + note;
                    const freq = 440 * Math.pow(2, (note - 69) / 12);
                    const t = Math.max(when, ctx.currentTime);

                    const osc = ctx.createOscillator();
                    osc.type = this.preset === 'DOS' ? 'square' : 'triangle';
                    osc.frequency.value = freq;

                    const gain = ctx.createGain();
                    const vol = Math.max(0.02, (velocity / 127) * 0.3);
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(vol, t + 0.01);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(t);

                    // 释放同键旧声
                    const old = this.voices.get(key);
                    if (old) {
                        try { old.osc.stop(t); } catch (e) {}
                        try { old.gain.disconnect(); } catch (e) {}
                        this.voices.delete(key);
                    }

                    this.voices.set(key, { osc, gain, channel, note });
                }

                noteOff(channel, note, when = 0) {
                    const key = channel + '-' + note;
                    const v = this.voices.get(key);
                    if (!v) return;
                    const ctx = this.ctx;
                    const t = Math.max(when, ctx.currentTime);
                    try {
                        v.gain.gain.cancelScheduledValues(t);
                        v.gain.gain.setValueAtTime(v.gain.gain.value, t);
                        v.gain.gain.linearRampToValueAtTime(0, t + 0.05);
                        v.osc.stop(t + 0.06);
                    } catch (e) {}
                    setTimeout(() => {
                        try { v.gain.disconnect(); } catch (e) {}
                        this.voices.delete(key);
                    }, 90);
                }

                clearAllVoices() {
                    const ctx = this.ctx;
                    const t = ctx.currentTime;
                    for (const v of this.voices.values()) {
                        try {
                            v.gain.gain.cancelScheduledValues(t);
                            v.gain.gain.setValueAtTime(v.gain.gain.value, t);
                            v.gain.gain.linearRampToValueAtTime(0, t + 0.03);
                            v.osc.stop(t + 0.04);
                        } catch (e) {}
                        setTimeout(() => { try { v.gain.disconnect(); } catch (e) {} }, 60);
                    }
                    this.voices.clear();
                }
            }

            // ============================================================
            //  MIDI 播放器 UI 初始化
            // ============================================================
            function initMidiPlayerUI() {
                // 创建通道指示器
                const grid = document.getElementById('midi-channel-grid');
                if (grid && grid.children.length === 0) {
                    for (let i = 0; i < 16; i++) {
                        const div = document.createElement('div');
                        div.className = 'midi-channel';
                        div.dataset.channel = i;
                        div.textContent = 'CH' + (i + 1);
                        if (i === 9) div.classList.add('drum');
                        grid.appendChild(div);
                    }
                }

                // 引擎切换
                document.querySelectorAll('.engine-btn').forEach(btn => {
                    btn.addEventListener('click', () => switchEngine(btn.dataset.engine));
                });

                // 同步当前引擎的 UI 状态
                document.querySelectorAll('.engine-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.engine === MIDI_CONFIG.engine);
                });
                document.getElementById('sf2-panel')?.classList.toggle('hidden', MIDI_CONFIG.engine !== 'sf2');

                // SF2 上传
                document.getElementById('sf2-file-input')?.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (file) await SF2_MANAGER.handleUpload(file);
                    e.target.value = '';
                });

                // MIDI 文件载入
                document.getElementById('midi-file-input')?.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const buf = await file.arrayBuffer();
                        const events = XBoxMidiParser.parse(buf);
                        MIDI_PLAYER.load(events, file.name);
                        document.getElementById('midi-note-info').textContent =
                            `✅ ${file.name} (${events.filter(e => e.isNoteOn).length} 音符)`;
                        showToast('🎵 MIDI 已载入');
                    } catch (err) {
                        showToast('❌ 解析失败: ' + err.message);
                    }
                    e.target.value = '';
                });

                // 播放控制
                document.getElementById('midi-play')?.addEventListener('click', () => {
                    if (MIDI_PLAYER.isPlaying) MIDI_PLAYER.pause();
                    else MIDI_PLAYER.play();
                });
                document.getElementById('midi-stop')?.addEventListener('click', () => MIDI_PLAYER.stop());

                // 进度条点击
                document.getElementById('midi-progress-wrap')?.addEventListener('click', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const p = (e.clientX - rect.left) / rect.width;
                    MIDI_PLAYER.seekTo(p * MIDI_PLAYER.totalDuration);
                });

                // 速度
                document.getElementById('midi-rate')?.addEventListener('change', (e) => {
                    MIDI_PLAYER.setRate(parseFloat(e.target.value));
                });

                // 关闭
                document.getElementById('midi-close')?.addEventListener('click', closeMidiPlayer);
            }

            // 简易可视化（把之前 8-bit 播放器的 bar 逻辑移植过来）
            let midiVisualizerAnim = null;
            function startMidiVisualizer() {
                const canvas = document.getElementById('midi-visualizer');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                function draw() {
                    if (!MIDI_PLAYER.isPlaying) { midiVisualizerAnim = null; return; }
                    const w = canvas.width, h = canvas.height;
                    ctx.clearRect(0, 0, w, h);
                    const grad = ctx.createLinearGradient(0, 0, 0, h);
                    grad.addColorStop(0, '#0a1a0a');
                    grad.addColorStop(1, '#050a05');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, w, h);

                    // 用活跃的 voice 数量做可视化
                    let activeCount = 0;
                    if (MIDI_CONFIG.engine === 'web' && MIDI_CONFIG.webEngine) {
                        activeCount = MIDI_CONFIG.webEngine.voices.size;
                    } else if (MIDI_CONFIG.engine === 'sf2' && MIDI_CONFIG.synth) {
                        activeCount = MIDI_CONFIG.synth.getVoices ? MIDI_CONFIG.synth.getVoices().length : 0;
                    }

                    const bars = 32;
                    const barW = w / bars;
                    for (let i = 0; i < bars; i++) {
                        const intensity = (Math.sin(Date.now() / 200 + i * 0.5) * 0.5 + 0.5) * Math.min(1, activeCount / 8);
                        const barH = intensity * h * 0.85 + 5;
                        const hue = 100 + i * 3;
                        ctx.fillStyle = `hsla(${hue}, 90%, 55%, ${0.3 + intensity * 0.7})`;
                        ctx.fillRect(i * barW + 2, h - barH, barW - 4, barH);
                    }
                    midiVisualizerAnim = requestAnimationFrame(draw);
                }
                if (!midiVisualizerAnim) draw();
            }
            function stopMidiVisualizer() {
                if (midiVisualizerAnim) {
                    cancelAnimationFrame(midiVisualizerAnim);
                    midiVisualizerAnim = null;
                }
            }

            // ============================================================
            //  2. IndexedDB 操作
            // ============================================================
            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onerror = () => reject(req.error);
                    req.onsuccess = () => { db = req.result;
                        resolve(db); };
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains(STORE_NAME)) {
                            d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                });
            }

            async function saveFileToDB(id, blob) {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.put({ id, blob });
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async function getFileFromDB(id) {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => reject(req.error);
                });
            }

            async function deleteFileFromDB(id) {
                if (!db) await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.delete(id);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            // ============================================================
            //  3. 文件系统 (与XP共享)
            // ============================================================
            function getFolderByPath(path) {
                if (!path) return null;
                let clean = path.trim().replace(/^\/+|\/+$/g, '');
                if (clean === '') return fileSystem;
                const parts = clean.split('/').filter(p => p);
                let cur = fileSystem;
                for (let p of parts) {
                    const found = cur.children.find(c => c.type === 'folder' && c.name === p);
                    if (!found) return null;
                    cur = found;
                }
                return cur;
            }

            function resolvePath(path) {
                let full = path.replace(/^\/+/, '');
                const parts = full.split('/').filter(p => p);
                if (parts.length === 0) return null;
                let cur = fileSystem;
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    const isLast = i === parts.length - 1;
                    const item = cur.children.find(c => c.name === p);
                    if (!item) return null;
                    if (isLast) {
                        if (item.type === 'file') return { file: item, folder: cur };
                        return null;
                    } else {
                        if (item.type !== 'folder') return null;
                        cur = item;
                    }
                }
                return null;
            }

            function saveFileSystem() {
                localStorage.setItem(META_KEY, JSON.stringify(fileSystem));
            }

            function initFileSystem() {
                const stored = localStorage.getItem(META_KEY);
                if (stored) {
                    fileSystem = JSON.parse(stored);
                } else {
                    fileSystem = {
                        name: 'root',
                        type: 'folder',
                        children: [{
                            name: '全部设备',
                            type: 'folder',
                            children: [{
                                name: '本地磁盘 (C:)',
                                type: 'folder',
                                children: [
                                    { name: '系统', type: 'folder', children: [] },
                                    { name: '回收站', type: 'folder', children: [] },
                                    { name: '共享文档', type: 'folder', children: [] },
                                    { name: 'Users', type: 'folder', children: [] }
                                ]
                            }, {
                                name: 'Xbox',
                                type: 'folder',
                                children: [
                                    { name: '光盘库', type: 'folder', children: [] },
                                    { name: '临时缓存', type: 'folder', children: [] },
                                    { name: '存档', type: 'folder', children: [] }
                                ]
                            }]
                        }]
                    };
                    saveFileSystem();
                }
                ensureXboxFolders();
            }

            function ensureXboxFolders() {
                let allDevices = fileSystem.children.find(c => c.name === '全部设备' && c.type === 'folder');
                if (!allDevices) {
                    allDevices = { name: '全部设备', type: 'folder', children: [] };
                    fileSystem.children.push(allDevices);
                    saveFileSystem();
                }
                let xboxFolder = allDevices.children.find(c => c.name === 'Xbox' && c.type === 'folder');
                if (!xboxFolder) {
                    xboxFolder = { name: 'Xbox', type: 'folder', children: [] };
                    allDevices.children.push(xboxFolder);
                    saveFileSystem();
                }
                ['光盘库', '临时缓存', '存档'].forEach(name => {
                    if (!xboxFolder.children.find(c => c.name === name && c.type === 'folder')) {
                        xboxFolder.children.push({ name, type: 'folder', children: [] });
                    }
                });
                saveFileSystem();
            }

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function detectFileType(ext) {
                const map = {
                    'html': 'game',
                    'htm': 'game',
                    'zip': 'game',
                    'mp3': 'music',
                    'wav': 'music',
                    'ogg': 'music',
                    'flac': 'music',
                    'm4a': 'music',
                    'mp4': 'video',
                    'webm': 'video',
                    'avi': 'video',
                    'mov': 'video',
                    'mkv': 'video'
                };
                return map[ext] || 'other';
            }

            async function handleDiscFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                const ext = file.name.split('.').pop().toLowerCase();
                const type = detectFileType(ext);
                pendingDisc = {
                    file: file,
                    name: file.name,
                    type: type,
                    size: file.size,
                    ext: ext,
                    isZIP: ext === 'zip',
                    isHTML: ext === 'html' || ext === 'htm'
                };
                showDiscManager(pendingDisc);
            }

            function showDiscManager(disc) {
                const overlay = document.getElementById('disc-manager-overlay');

                document.getElementById('dm-name').textContent = disc.name;
                document.getElementById('dm-meta').textContent = formatSize(disc.size) + ' · ' + disc.type.toUpperCase();
                overlay.classList.add('active');
                overlay.querySelectorAll('.action-btn').forEach(el => {
                    el.addEventListener('touchend', function(e) {
                        this.click();
                        e.preventDefault();
                    }, { passive: false });
                });
            }

            function hideDiscManager() {
                document.getElementById('disc-manager-overlay').classList.remove('active');

            async function launchPendingDisc() {

                hideDiscManager();
                if (disc.isZIP) {
                    await launchZIP(disc);
                } else if (disc.isHTML) {
                    await launchHTML(disc);
                } else if (disc.type === 'music') {
                    launchMusic(disc);
                } else if (disc.type === 'video') {
                    launchVideo(disc);
                } else {
                    showToast('❌ 无法识别此文件类型');

            }

                    name: disc.name,

                    isHTML: disc.isHTML,
