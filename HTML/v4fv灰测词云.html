/* ===================== 基础设置 ===================== */
var CJK = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif';
var LAT = '"Helvetica Neue","Avenir Next",Inter,Arial,sans-serif';

var PAL = {
  c:["#ffffff","#fff4dc","#ffe6b4","#ffd894","#f6f0ff"],
  h:["#ff9a6b","#ff7a72","#ff6f91","#ffb974","#f2645f","#ffcf8f","#ff8fa8","#e8724f"],

var DPR = Math.min(window.devicePixelRatio || 1, 2);

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
function isCJK(s){return /[\u3400-\u9fff\u3000-\u303f]/.test(s);}

/* ===================== 背景（星云 + 星尘） ===================== */
function buildNebula(){
  var c=document.createElement("canvas");c.width=W;c.height=H;var g=c.getContext("2d");
  g.fillStyle="#03050c";g.fillRect(0,0,W,H);

  function blob(x,y,r,stops){
    var rg=g.createRadialGradient(x,y,0,x,y,r);
    for(var i=0;i<stops.length;i++) rg.addColorStop(stops[i][0],stops[i][1]);
    g.fillStyle=rg;g.fillRect(0,0,W,H);
  }
  g.globalCompositeOperation="lighter";
  blob(W*0.20,H*0.56,Math.max(W,H)*0.62,[[0,"rgba(122,52,26,.52)"],[.42,"rgba(78,32,20,.22)"],[1,"rgba(0,0,0,0)"]]);
  blob(W*0.80,H*0.54,Math.max(W,H)*0.62,[[0,"rgba(26,68,132,.55)"],[.42,"rgba(20,40,92,.24)"],[1,"rgba(0,0,0,0)"]]);
  blob(W*0.50,H*0.55,Math.max(W,H)*0.40,[[0,"rgba(66,40,110,.42)"],[.5,"rgba(30,20,60,.16)"],[1,"rgba(0,0,0,0)"]]);
  blob(W*0.50,H*0.55,Math.max(W,H)*0.17,[[0,"rgba(120,110,160,.24)"],[1,"rgba(0,0,0,0)"]]);
  g.globalCompositeOperation="source-over";

  // 暗角
  var v=g.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.30,W/2,H*0.55,Math.max(W,H)*0.82);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(.62,"rgba(2,3,9,.55)");v.addColorStop(1,"rgba(1,2,6,.96)");
  g.fillStyle=v;g.fillRect(0,0,W,H);
  return c;
}
function buildStars(){
  stars=[];var n=Math.round((W*H)/(16000*DPR));
  n=Math.max(140,Math.min(460,n));
  for(var i=0;i<n;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,
      r:(Math.random()*Math.random()*1.9+.25)*DPR,
      a:Math.random()*.55+.12, s:Math.random()*.0016+.0004,
      ph:Math.random()*6.28, d:Math.random()*.55+.12,
      hue:Math.random()<.5?"200,225,255":"255,225,195"});
  }
}
function drawBG(now){

  bgX.globalCompositeOperation="lighter";
  for(var i=0;i<stars.length;i++){

      bgX.fillStyle="rgba("+s.hue+","+(s.a*tw*.10).toFixed(3)+")";bgX.fill();

  }

/* ===================== 词精灵 ===================== */
var tc=document.createElement("canvas"), tx=tc.getContext("2d",{willReadFrequently:true});

function fontOf(word,size){

  var wt = size>BASE*0.052 ? 800 : (size>BASE*0.030 ? 700 : 500);
  return wt+" "+size+"px "+(cjk?CJK:LAT);
}
function colorOf(word,cat){
  var p=PAL[cat]; return p[hash(word)%p.length];
}

function makeSprite(item,size,rot){
  var txt=item.t, cjk=isCJK(txt), font=fontOf(txt,size);
  var ls = cjk ? Math.round(size*0.03) : Math.round(size*0.09);
  var pad = Math.max(4,Math.round(size*0.30));   // 同时容纳辉光与词距

  tc.width=8;tc.height=8;tx.font=font;
  if("letterSpacing" in tx) tx.letterSpacing=ls+"px";
  var m=tx.measureText(txt);
  var asc=m.actualBoundingBoxAscent||size*0.82, dsc=m.actualBoundingBoxDescent||size*0.20;
  var tw=Math.ceil(m.width)+pad*2, th=Math.ceil(asc+dsc)+pad*2;
  if(tw<2||th<2||tw>W*1.4) return null;

  // 1) 掩膜（无辉光）
  tc.width=tw;tc.height=th;
  tx.font=font; if("letterSpacing" in tx) tx.letterSpacing=ls+"px";
  tx.textBaseline="alphabetic";tx.fillStyle="#fff";
  tx.fillText(txt,pad,pad+asc);
  var data=tx.getImageData(0,0,tw,th).data;

  var mw=Math.ceil(tw/S), mh=Math.ceil(th/S);
  var bits=new Uint8Array(mw*mh);
  for(var y=0;y<th;y++){
    var ry=(y/S)|0, o=y*tw*4;
    for(var x=0;x<tw;x++){
      if(data[o+x*4+3]>60) bits[ry*mw+((x/S)|0)]=1;
    }
  }
  // 行范围加速
  var rmin=new Int16Array(mh), rmax=new Int16Array(mh);
  for(var r=0;r<mh;r++){
    var a=-1,b=-1;
    for(var q=0;q<mw;q++) if(bits[r*mw+q]){ if(a<0)a=q; b=q; }
    rmin[r]=a; rmax[r]=b;
  }

  // 2) 视觉精灵（辉光 + 实体）
  var col=colorOf(txt,item.c);
  sc.width=tw;sc.height=th;
  sx.font=font; if("letterSpacing" in sx) sx.letterSpacing=ls+"px";
  sx.textBaseline="alphabetic";
  sx.globalCompositeOperation="lighter";
  sx.shadowColor=col; sx.shadowBlur=size*0.62;
  sx.fillStyle=col; sx.globalAlpha=0.36;
  sx.fillText(txt,pad,pad+asc);
  sx.shadowBlur=size*0.24; sx.globalAlpha=0.55;
  sx.fillText(txt,pad,pad+asc);
  sx.shadowBlur=0; sx.globalAlpha=1;
  sx.fillStyle=(item.c==="c")?"#ffffff":col;
  sx.fillText(txt,pad,pad+asc);
  if(item.c!=="c"){ sx.globalAlpha=.55; sx.fillStyle="#ffffff"; sx.fillText(txt,pad,pad+asc); }

  var img=document.createElement("canvas");img.width=tw;img.height=th;
  img.getContext("2d").drawImage(sc,0,0);

  var res={bits:bits,mw:mw,mh:mh,rmin:rmin,rmax:rmax,img:img,w:tw,h:th,color:col};
  if(!rot) return res;

  // 旋转 90°(逆时针)
  var nw=mh,nh=mw,nb=new Uint8Array(nw*nh);
  for(var yy=0;yy<mh;yy++)for(var xx=0;xx<mw;xx++)
    if(bits[yy*mw+xx]) nb[(mw-1-xx)*nw+yy]=1;
  var nrmin=new Int16Array(nh),nrmax=new Int16Array(nh);
  for(var rr=0;rr<nh;rr++){var aa=-1,bb=-1;
    for(var qq=0;qq<nw;qq++) if(nb[rr*nw+qq]){ if(aa<0)aa=qq; bb=qq; }
    nrmin[rr]=aa;nrmax[rr]=bb;}
  var ri=document.createElement("canvas");ri.width=th;ri.height=tw;
  var rg=ri.getContext("2d");rg.translate(0,tw);rg.rotate(-Math.PI/2);rg.drawImage(img,0,0);
  return {bits:nb,mw:nw,mh:nh,rmin:nrmin,rmax:nrmax,img:ri,w:th,h:tw,color:res.color};
}

/* ===================== 布局 ===================== */
function fits(sp,gx,gy){
  if(gx<0||gy<0||gx+sp.mw>MW||gy+sp.mh>MH) return false;
  for(var y=0;y<sp.mh;y++){
    var a=sp.rmin[y]; if(a<0) continue;
    var b=sp.rmax[y], row=y*sp.mw, grow=(gy+y)*MW+gx;
    for(var x=a;x<=b;x++) if(sp.bits[row+x] && mask[grow+x]) return false;
  }
  return true;
}
function stamp(sp,gx,gy){
  for(var y=0;y<sp.mh;y++){
    var a=sp.rmin[y]; if(a<0) continue;
    var b=sp.rmax[y], row=y*sp.mw, grow=(gy+y)*MW+gx;
    for(var x=a;x<=b;x++) if(sp.bits[row+x]) mask[grow+x]=1;
  }
}
function spiralPlace(sp,cx,cy,ratio){
  var t=0, step=S*0.95, MAXT=1400, guard=0;
  var ox=cx-sp.w/2, oy=cy-sp.h/2;
  while(t<MAXT && guard<26000){
    guard++;
    var r=step*t*0.34;
    var X=ox+r*Math.cos(t)*ratio, Y=oy+r*Math.sin(t);
    var gx=Math.round(X/S), gy=Math.round(Y/S);
    if(fits(sp,gx,gy)) return {gx:gx,gy:gy};
    t += Math.max(0.035, (S*1.25)/Math.max(r,S));
  }
  return null;
}

function layout(){
  // 掩膜：超椭圆之外直接标记为占用
  MW=Math.ceil(W/S); MH=Math.ceil(H/S);
  mask=new Uint8Array(MW*MH);
  var cx=W*0.5, cy=H*0.555, rx=W*0.475, ry=H*0.372, N=2.35;
  for(var my2=0;my2<MH;my2++){
    var Y=(my2*S+S/2-cy)/ry, ay=Math.pow(Math.abs(Y),N);
    for(var mx2=0;mx2<MW;mx2++){
      var X=(mx2*S+S/2-cx)/rx;
      if(Math.pow(Math.abs(X),N)+ay>1) mask[my2*MW+mx2]=1;
    }
  }

  BASE=Math.min(W,H);
  var maxS=BASE*0.108, minS=BASE*0.0155;
  var list=WORDS.slice().sort(function(a,b){
    if(a.c==="c"&&b.c!=="c") return -1;
    if(b.c==="c"&&a.c!=="c") return 1;
    return b.w-a.w;
  });

  placed=[];
  var ratio=Math.max(1.05,Math.min(1.85,(W/H)*0.82));
  var centers={c:[cx,cy], h:[cx-W*0.215,cy], a:[cx+W*0.215,cy]};

  for(var i=0;i<list.length;i++){
    var it=list[i];
    var k=Math.pow(it.w/100,1.42);
    var size=Math.round(minS+k*(maxS-minS));
    var rot = (it.c!=="c" && it.w<42 && (hash(it.t)%100)<17);
    var ok=null,sp=null;
    for(var att=0;att<3 && !ok;att++){
      sp=makeSprite(it,Math.round(size*(1-att*0.13)),rot);
      if(!sp) break;
      var C=centers[it.c];
      ok=spiralPlace(sp,C[0]+(att?(hash(it.t+att)%80)-40:0),C[1]+(att?(hash(it.t+att*7)%60)-30:0),ratio);
    }
    if(!ok||!sp) continue;
    stamp(sp,ok.gx,ok.gy);
    placed.push({
      img:sp.img, x:ok.gx*S, y:ok.gy*S, w:sp.w, h:sp.h,
      depth:0.28+1.55*(size/maxS), phase:(hash(it.t)%628)/100,
      delay:placed.length*21+120, size:size, txt:it.t, note:it.n||"",
      cat:it.c, color:sp.color, alpha:it.c==="c"?1:(0.80+0.20*(size/maxS))
    });
  }
}

/* ===================== 主循环 ===================== */
function draw(now){
  if(!t0) t0=now;
  var el=now-t0;
  px += (tpx-px)*0.055; py += (tpy-py)*0.055;

  drawBG(now);
  clX.clearRect(0,0,W,H);
  clX.globalCompositeOperation="lighter";

  hoverW=null;
  for(var i=placed.length-1;i>=0;i--){
    var p=placed[i];
    var X=p.x+px*p.depth, Y=p.y+py*p.depth;
    if(mx>X+p.h*0.12&&mx<X+p.w-p.h*0.12&&my>Y+p.h*0.22&&my<Y+p.h*0.78){ hoverW=p; break; }
  }

  for(var j=0;j<placed.length;j++){
    var w=placed[j];
    var lt=el-w.delay; if(lt<=0) continue;
    var q=Math.min(1,lt/900), e=1-Math.pow(1-q,3);
    var br=0.87+0.13*Math.sin(now*0.00055+w.phase);
    var hov=(w===hoverW);
    var a=e*br*w.alpha*(hov?1.6:1);
    var s=1+0.16*(1-e)+(hov?0.055:0);
    var X=w.x+px*w.depth, Y=w.y+py*w.depth;
    clX.globalAlpha=Math.min(1.6,a);
    if(s>1.001){
      clX.save();
      clX.translate(X+w.w/2,Y+w.h/2);clX.scale(s,s);
      clX.drawImage(w.img,-w.w/2,-w.h/2);
      clX.restore();
    } else clX.drawImage(w.img,X,Y);
    if(hov){ clX.globalAlpha=0.5; clX.drawImage(w.img,X,Y); }
  }
  clX.globalAlpha=1;clX.globalCompositeOperation="source-over";

  // 提示气泡
  if(hoverW&&hoverW.note){
    tipEl.classList.add("on");
    tipEl.innerHTML="<b>"+hoverW.txt+"</b>"+hoverW.note;
    var L=mx/DPR+18, T=my/DPR+18;
    if(L+tipEl.offsetWidth>innerWidth-16) L=mx/DPR-tipEl.offsetWidth-18;
    if(T+tipEl.offsetHeight>innerHeight-16) T=my/DPR-tipEl.offsetHeight-18;
    tipEl.style.left=Math.max(10,L)+"px"; tipEl.style.top=Math.max(10,T)+"px";
  } else tipEl.classList.remove("on");

  requestAnimationFrame(draw);
}

/* ===================== 交互 / 初始化 ===================== */
window.addEventListener("pointermove",function(e){
  mx=e.clientX*DPR; my=e.clientY*DPR;
  tpx=(e.clientX/innerWidth-0.5)*-34*DPR;
  tpy=(e.clientY/innerHeight-0.5)*-22*DPR;
});
window.addEventListener("pointerleave",function(){mx=my=-1e4;tpx=tpy=0;});

function resize(){
  W=Math.round(innerWidth*DPR); H=Math.round(innerHeight*DPR);
  bgC.width=clC.width=W; bgC.height=clC.height=H;
  S=Math.max(2,Math.round(1.6*DPR));
  nebula=buildNebula(); buildStars(); layout(); t0=0;
}
var rz;
window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(resize,320);});

// 引文轮播
var qi=0;
function cycleQuote(){
  quoteEl.classList.add("out");
  setTimeout(function(){
    quoteEl.textContent="「 "+QUOTES[qi%QUOTES.length]+" 」"; qi++;
    quoteEl.classList.remove("out");
  },1500);
}
quoteEl.textContent="「 "+QUOTES[0]+" 」"; qi=1;
setInterval(cycleQuote,7600);

// 导出 PNG
document.getElementById("save").addEventListener("click",function(){
  var out=document.createElement("canvas");out.width=W;out.height=H;
  var o=out.getContext("2d");
  o.drawImage(bgC,0,0); o.globalCompositeOperation="lighter"; o.drawImage(clC,0,0);
  o.globalCompositeOperation="source-over";
  o.textAlign="center";o.fillStyle="rgba(200,215,240,.72)";
  o.font=(11*DPR)+"px "+CJK;
  o.fillText("取代 / 不可取代 · AI 时代词云", W/2, H-16*DPR);
  var a=document.createElement("a");
  a.download="取代与不可取代.png"; a.href=out.toDataURL("image/png"); a.click();
});

// 启动
requestAnimationFrame(function(){
  setTimeout(function(){
    resize();
    requestAnimationFrame(draw);
    document.getElementById("loader").classList.add("gone");
  },40);
});

})();
</script>
