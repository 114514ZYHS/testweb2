<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Schwarzschild Black Hole · Real-time GR Ray Tracer</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: fixed;
    inset: 0;
  }

  #app canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  #app canvas:active {
    cursor: grabbing;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    padding: 22px 26px;
    pointer-events: none;
    user-select: none;
    z-index: 10;
    opacity: 0;
    animation: fadeIn 2.2s ease 0.6s forwards;
  }

  #hud h1 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 236, 214, 0.92);
    text-shadow: 0 0 22px rgba(255, 150, 60, 0.55);
  }

  #hud p {
    margin: 0;
    font-size: 11.5px;
    line-height: 1.75;
    letter-spacing: 0.06em;
    color: rgba(190, 205, 235, 0.55);
  }

  #hud .kbd {
    color: rgba(255, 200, 140, 0.85);
    font-weight: 600;
  }

  #stats {
    position: fixed;
    right: 0;
    bottom: 0;
    padding: 18px 24px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(150, 170, 205, 0.45);
    pointer-events: none;
    user-select: none;
    z-index: 10;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    animation: fadeIn 2.2s ease 1.4s forwards;
  }

  #stats b {
    color: rgba(255, 205, 150, 0.8);
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }

  /* lil-gui tweaks */
  .lil-gui {
    --background-color: rgba(12, 14, 22, 0.82);
    --widget-color: rgba(255, 255, 255, 0.09);
    --focus-color: rgba(255, 160, 70, 0.35);
    --hover-color: rgba(255, 255, 255, 0.16);
    --number-color: #ffc07a;
    --string-color: #9fc4ff;
    --font-size: 11px;
    --title-height: 26px;
    backdrop-filter: blur(10px);
    z-index: 20 !important;
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="hud">
  <h1>Schwarzschild Black Hole</h1>
  <p>
    <span class="kbd">拖拽</span> 环绕视角 &nbsp;·&nbsp;
    <span class="kbd">滚轮</span> 缩放 &nbsp;·&nbsp;
    <span class="kbd">右键</span> 平移
  </p>
  <p>实时光子测地线积分 · 引力透镜 · 相对论多普勒集束</p>
</div>

<div id="stats">
  <span id="fps">--</span> FPS &nbsp;|&nbsp; <b id="res">--</b>
</div>

float hash11(float n) {

float vnoise(vec3 x) {

  float omega = 0.70710678 / pow(max(r, 0.6), 1.5);
  float a = ang - omega * uTime * uSpin;
  vec3 q = vec3(cos(a) * r, sin(a) * r, r * 0.5) * 0.42;
  float n = fbm(q);
  n = mix(1.0, (0.55 + 0.95 * n) * 1.65, uDiskNoise);

  vec3 col = blackbody(temp) * pow(shift, uDopplerPower);
  float alpha = clamp(emis * edgeIn * edgeOut * n, 0.0, 1.0);

  return vec4(col, alpha);
}

/* ---------- \u661F\u7A7A ---------- */
vec3 skyColor(vec3 dir) {
  vec3 col = vec3(0.006, 0.008, 0.015);

  // \u94F6\u6CB3\u5E26\uFF08\u907F\u514D pow(\u8D1F\u6570, x)\uFF1AGLSL \u4E2D\u672A\u5B9A\u4E49\uFF09
  float band = exp(-9.61 * dir.y * dir.y);
  float n1 = fbm(dir * 2.4 + vec3(11.0));
  float n2 = fbm(dir * 6.5 - vec3(4.0));
  vec3 neb = mix(vec3(0.055, 0.075, 0.16), vec3(0.30, 0.16, 0.38),
                 smoothstep(0.35, 0.78, n1));
  neb += vec3(1.0, 0.55, 0.28) * pow(max(n2, 0.0), 3.0) * 0.5;
  neb *= band * 0.65 + 0.10;
  col += neb * uNebulaBrightness;

  // \u4E09\u5C42\u6052\u661F\uFF08\u4E0D\u540C\u5C3A\u5EA6\uFF0C\u907F\u514D\u7F51\u683C\u611F\uFF09
  vec3 starCol = vec3(0.0);
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float scale = 60.0 * pow(2.1, fi);
    vec3 p = dir * scale;
    vec3 id = floor(p);
    vec3 f = p - id - 0.5;
    vec3 h = hash33(id + fi * 41.7);

    float dens = 0.15 - 0.032 * fi;
    if (h.x < dens) {
      vec3 sp = (h - 0.5) * 0.8;
      float d = length(f - sp);
      float sz = 0.11 / pow(1.55, fi);
      float b = smoothstep(sz, 0.0, d);
      b *= (0.25 + 0.75 * h.y) * (1.0 - 0.30 * fi);
      vec3 sc = mix(vec3(0.62, 0.76, 1.0), vec3(1.0, 0.86, 0.66), h.z);
      starCol += sc * b;
    }
  }
  col += starCol * uStarBrightness * 2.4;

  return col;
}

/* ---------- \u4E3B\u8FFD\u8E2A ---------- */
vec3 trace(vec3 camPos, vec3 rayDir) {
  vec3 p = camPos;
  vec3 v = normalize(rayDir);

  vec3 hVec = cross(p, v);
  float h2 = dot(hVec, hVec);

  vec3 accum = vec3(0.0);
  float trans = 1.0;
  bool captured = false;

  vec3 acc = geoAccel(p, h2);

  for (int i = 0; i < MAX_STEPS; i++) {
    if (float(i) >= uSteps || trans < 0.004) break;

    float r = length(p);
    if (r < 1.0) { captured = true; break; }
    if (r > 55.0 && dot(p, v) > 0.0) break;

    // \u81EA\u9002\u5E94\u6B65\u957F\uFF1A\u8D8A\u9760\u8FD1\u89C6\u754C\u8D8A\u7EC6
    float dt = uStepScale * clamp(0.06 * (r - 0.92), 0.012, 0.55);

    vec3 pPrev = p;
    vec3 vPrev = v;

    // \u901F\u5EA6 Verlet\uFF08\u8DF3\u86D9\uFF09
    v += acc * (0.5 * dt);
    p += v * dt;
    acc = geoAccel(p, h2);
    v += acc * (0.5 * dt);

    float rNow = length(p);

    // \u5149\u5B50\u73AF\u9644\u8FD1\u7684\u7B49\u79BB\u5B50\u4F53\u8F89\u5149\uFF08\u4F53\u79EF\u9879\uFF09
    if (rNow < 3.2) {
      float haloZ = (rNow - 1.62) / 0.62;
      float halo = exp(-haloZ * haloZ);
      accum += trans * vec3(1.0, 0.84, 0.60) * halo * dt * 0.020 * uRingGlow;
    }

    // \u7A7F\u8FC7\u8D64\u9053\u9762 \u2192 \u4E0E\u8584\u76D8\u76F8\u4EA4
    if (pPrev.y * p.y <= 0.0 && pPrev.y != p.y) {
      float t = pPrev.y / (pPrev.y - p.y);
      vec3 hp = mix(pPrev, p, t);
      float hr = length(hp);

      if (hr > uDiskInner && hr < uDiskOuter) {
        vec3 hv = normalize(mix(vPrev, v, t));
        vec4 e = diskSample(hp, hv, hr);
        accum += trans * e.rgb * e.a * uDiskBrightness;
        trans *= 1.0 - e.a * uDiskOpacity;
      }
    }
  }

  if (!captured) {
    accum += trans * skyColor(normalize(v));
  }

  return accum;
}

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;

  vec3 dir = normalize(
    uCamRight * (ndc.x * uTanHalfFov * uAspect) +
    uCamUp    * (ndc.y * uTanHalfFov) +
    uCamFwd
  );

  vec3 col = trace(uCamPos, dir) * uExposure;

  // \u6697\u89D2
  col *= mix(1.0, 1.0 - 0.55 * dot(ndc, ndc) * 0.5, uVignette);

  // \u6296\u52A8\uFF0C\u6D88\u9664\u8272\u5E26
  col += (hash11(gl_FragCoord.x + gl_FragCoord.y * 1337.0 + uFrame) - 0.5) / 255.0;

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
