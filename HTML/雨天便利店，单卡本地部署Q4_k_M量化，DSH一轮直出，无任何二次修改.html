<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨夜便利店街角 · Konbini Corner Diorama</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070f}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(125% 95% at 50% 40%,rgba(0,0,0,0) 40%,rgba(3,5,13,.40) 76%,rgba(1,2,7,.86) 100%)}
  #veil{position:fixed;inset:0;pointer-events:none;z-index:4;background:#05070f;transition:opacity 1.6s ease-out}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }

<body>
<div id="app"></div><div id="vig"></div><div id="veil"></div>
<script>
window.__errs=[];
window.onerror=(m,s,l,c)=>{window.__errs.push(m+' @'+l+':'+c);console.error(m+' @'+l+':'+c)};
addEventListener('unhandledrejection',e=>{window.__errs.push('promise: '+(e.reason&&e.reason.stack||e.reason));console.error(e.reason)});
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let OutlineEffect = null;
try { const m = await import('three/addons/effects/OutlineEffect.js'); OutlineEffect = m.OutlineEffect; }
catch (e) { console.warn('OutlineEffect unavailable', e && e.message); }

/* ================================================================
   0. 基础工具
================================================================ */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260214);
const rr=(a,b)=>a+rnd()*(b-a);
const ri=(a,b)=>Math.floor(rr(a,b+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function hash1(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}

const JP="'Yu Gothic','Yu Mincho','Hiragino Sans','Noto Sans JP','Microsoft YaHei',sans-serif";

function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function ctex(c,o={}){const t=new THREE.CanvasTexture(c);if(o.srgb!==false)t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;if(o.rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(o.rep[0],o.rep[1])}
  t.needsUpdate=true;return t}
let _ctx=null;
function ctx2(c){const x=c.getContext('2d');_ctx=x;return x}
function rrPath(x,y,w,h,r){const rd=_ctx;r=Math.min(r,w/2,h/2);rd.beginPath();rd.moveTo(x+r,y);rd.lineTo(x+w-r,y);
  rd.quadraticCurveTo(x+w,y,x+w,y+r);rd.lineTo(x+w,y+h-r);rd.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  rd.lineTo(x+r,y+h);rd.quadraticCurveTo(x,y+h,x,y+h-r);rd.lineTo(x,y+r);rd.quadraticCurveTo(x,y,x+r,y);rd.closePath()}

/* 三渲二分色带 */
function ramp(v){const d=new Uint8Array(v.length);v.forEach((x,i)=>d[i]=Math.round(clamp(x,0,1.2)/1.2*255));
  const t=new THREE.DataTexture(d,v.length,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;
  t.generateMipmaps=false;t.needsUpdate=true;return t}
const R2=ramp([0.46,0.98]), R3=ramp([0.34,0.70,1.0]), R4=ramp([0.26,0.55,0.82,1.04]);

function toon(color,o={}){
  const m=new THREE.MeshToonMaterial({color:new THREE.Color(color),gradientMap:o.ramp||R4});
  if(o.emissive!==undefined){m.emissive.set(o.emissive);m.emissiveIntensity=o.ei===undefined?1:o.ei}
  if(o.map){m.map=o.map;if(o.repU!==undefined){m.map.wrapS=m.map.wrapT=THREE.RepeatWrapping;m.map.repeat.set(o.repU,o.repV)}}
  if(o.transparent){m.transparent=true;m.opacity=o.opacity===undefined?1:o.opacity;if(o.depthWrite===false)m.depthWrite=false}
  if(o.side)m.side=o.side;
  if(o.fog===false)m.fog=false;
  return m;
}
function glowTex(o={}){
  const s=128,c=cvs(s,s),x=ctx2(c);
  const soft=o.soft===undefined?0.5:o.soft;
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(soft*0.4,'rgba(255,255,255,.55)');
  g.addColorStop(soft,'rgba(255,255,255,.16)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const TEX_GLOW=glowTex({soft:0.55});
const TEX_GLOW_SOFT=glowTex({soft:0.9});
function sprite(color,scale,opacity,texU){
  const m=new THREE.SpriteMaterial({map:texU||TEX_GLOW,color:new THREE.Color(color),
    blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false,opacity:opacity===undefined?1:opacity});
  const s=new THREE.Sprite(m);s.scale.set(scale,scale,1);return s;
}
function streakTex(){
  const w=64,h=256,c=cvs(w,h),x=ctx2(c);
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,'rgba(255,255,255,.55)');
  g.addColorStop(.65,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.globalCompositeOperation='destination-in';
  const g2=x.createLinearGradient(0,0,w,0);
  g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(.35,'rgba(255,255,255,.85)');
  g2.addColorStop(.5,'rgba(255,255,255,1)');g2.addColorStop(.65,'rgba(255,255,255,.85)');
  g2.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g2;x.fillRect(0,0,w,h);
  x.globalCompositeOperation='destination-out';
  for(let i=0;i<70;i++){x.globalAlpha=rr(.05,.30);x.fillStyle='#000';x.fillRect(rr(0,w),rr(0,h),rr(2,10),rr(1,4))}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const TEX_STREAK=streakTex();

/* 几何缓存 */
const _GC=new Map();
function gBox(w,h,d){const k=`b${w.toFixed(3)}_${h.toFixed(3)}_${d.toFixed(3)}`;let g=_GC.get(k);if(!g){g=new THREE.BoxGeometry(w,h,d);_GC.set(k,g)}return g}
function gCyl(rt,rb,h,s=14){const k=`c${rt.toFixed(3)}_${rb.toFixed(3)}_${h.toFixed(3)}_${s}`;let g=_GC.get(k);if(!g){g=new THREE.CylinderGeometry(rt,rb,h,s);_GC.set(k,g)}return g}
function gSph(r,s=10){const k=`s${r.toFixed(3)}_${s}`;let g=_GC.get(k);if(!g){g=new THREE.SphereGeometry(r,s,Math.max(6,s-2));_GC.set(k,g)}return g}
function gPlane(w,h){const k=`p${w.toFixed(3)}_${h.toFixed(3)}`;let g=_GC.get(k);if(!g){g=new THREE.PlaneGeometry(w,h);_GC.set(k,g)}return g}

function bx(w,h,d,mat,x=0,y=0,z=0,p=null,o={}){
  const m=new THREE.Mesh(gBox(w,h,d),mat);m.position.set(x,y,z);
  m.castShadow=o.cast!==false&&o.shadow!==false;m.receiveShadow=o.receive!==false&&o.shadow!==false;
  if(o.rot)m.rotation.set(o.rot[0]||0,o.rot[1]||0,o.rot[2]||0);
  (p||scene).add(m);return m;
}
function cy(rt,rb,h,mat,x=0,y=0,z=0,p=null,o={}){
  const m=new THREE.Mesh(gCyl(rt,rb,h,o.seg||14),mat);m.position.set(x,y,z);
  m.castShadow=o.cast!==false&&o.shadow!==false;m.receiveShadow=o.receive!==false&&o.shadow!==false;
  if(o.rot)m.rotation.set(o.rot[0]||0,o.rot[1]||0,o.rot[2]||0);
  (p||scene).add(m);return m;
}
function sph(r,mat,x=0,y=0,z=0,p=null,o={}){
  const m=new THREE.Mesh(gSph(r,o.seg||10),mat);m.position.set(x,y,z);
  m.castShadow=o.cast===true;(p||scene).add(m);return m;
}
function quad(w,h,mat,x=0,y=0,z=0,p=null,o={}){
  const m=new THREE.Mesh(gPlane(w,h),mat);m.position.set(x,y,z);
  if(o.rot)m.rotation.set(o.rot[0]||0,o.rot[1]||0,o.rot[2]||0);
  else m.rotation.x=-Math.PI/2;
  m.receiveShadow=o.receive===true;
  (p||scene).add(m);return m;
}
function grp(x=0,y=0,z=0,p=null){const g=new THREE.Group();g.position.set(x,y,z);(p||scene).add(g);return g}
function noOL(o){o.traverse(c=>{if(c.isMesh||c.isLine||c.isSprite||c.isPoints)c.userData.outlineParameters={visible:false}});return o}

/* ================================================================
   1. 渲染器 / 场景 / 相机 / 控制器
================================================================ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.setClearColor(0x05070f,1);
app.appendChild(renderer.domElement);

let effect=null;
const NOEFX=new URLSearchParams(location.search).get('noefx')==='1';
if(OutlineEffect&&!NOEFX){
  try{ effect=new OutlineEffect(renderer,{defaultThickness:0.0033,defaultColor:[0.030,0.028,0.052]}); }
  catch(e){ console.warn('effect fail',e&&e.message); effect=null; }
}
function renderFrame(){ if(effect) effect.render(scene,camera); else renderer.render(scene,camera); }

const scene=new THREE.Scene();

/* 夜空：雨夜厚云 + 远处城市辉光 */
(function(){
  const W=1024,H=512,c=cvs(W,H),x=ctx2(c);
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0.00,'#04060f');
  g.addColorStop(0.34,'#0a1024');
  g.addColorStop(0.62,'#141b38');
  g.addColorStop(0.82,'#22244a');
  g.addColorStop(0.94,'#2f2a4e');
  g.addColorStop(1.00,'#171631');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){
    const cx=rr(0,W),cy2=rr(H*0.05,H*0.95),r=rr(40,180);
    const gg=x.createRadialGradient(cx,cy2,0,cx,cy2,r);
    const a=rr(0.02,0.09), warm=cy2>H*0.6;
    gg.addColorStop(0,`rgba(${warm?'120,110,160':'60,74,120'},${a})`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gg;x.fillRect(cx-r,cy2-r,2*r,2*r);
  }
  for(let i=0;i<26;i++){
    const cx=rr(0,W),cy2=rr(H*0.80,H*0.98),r=rr(50,190);
    const col=pick(['255,140,90','255,90,150','110,200,255','255,200,120']);
    const gg=x.createRadialGradient(cx,cy2,0,cx,cy2,r);
    gg.addColorStop(0,`rgba(${col},.13)`);gg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gg;x.fillRect(cx-r,cy2-r,2*r,2*r);
  }
  scene.background=ctex(c);
})();

scene.fog=new THREE.FogExp2(0x0a1024,0.0158);

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.4,300);
const LOOK_AT=new THREE.Vector3(-0.6,1.92,0.35);
camera.position.set(9.25,6.22,16.13);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(LOOK_AT);
controls.enableDamping=true;
controls.dampingFactor=0.075;
controls.rotateSpeed=0.72;
controls.zoomSpeed=0.85;
controls.panSpeed=0.6;
controls.minDistance=7.5;
controls.maxDistance=48;
controls.maxPolarAngle=1.435;
controls.minPolarAngle=0.12;
controls.screenSpacePanning=false;

const qs=new URLSearchParams(location.search);
const NOGLASS=qs.get('nogle')==='1';
const SHOT={t0:parseFloat(qs.get('t')||'0'),intro:qs.get('nointro')?0:1};
(function(){
  const az=qs.get('az'),el=qs.get('el'),ds=qs.get('dist');
  if(az!==null||el!==null||ds!==null){
    const d=parseFloat(ds||String(camera.position.length()));
    const e=THREE.MathUtils.degToRad(parseFloat(el||'38'));
    const a=THREE.MathUtils.degToRad(parseFloat(az||'-40'));
    camera.position.set(LOOK_AT.x+d*Math.sin(e)*Math.sin(a),LOOK_AT.y+d*Math.cos(e),LOOK_AT.z+d*Math.sin(e)*Math.cos(a));
    SHOT.intro=0;
  }
})();

/* ================================================================
   2. 灯光：冷色雨夜 + 店内暖光
================================================================ */
const LIGHTS={};
{
  scene.add(new THREE.HemisphereLight(0x2b4570,0x0a0912,0.30));

  const moon=new THREE.DirectionalLight(0x9fc0ff,0.40);
  moon.position.set(-14,20,-9);
  moon.castShadow=true;
  moon.shadow.mapSize.set(2048,2048);
  const sc=moon.shadow.camera;
  sc.left=-15;sc.right=15;sc.top=15;sc.bottom=-15;sc.near=1;sc.far=60;
  moon.shadow.bias=-0.0006;moon.shadow.normalBias=0.035;moon.shadow.radius=1.6;
  scene.add(moon);LIGHTS.moon=moon;

  const fill=new THREE.DirectionalLight(0x5f7fd8,0.20);
  fill.position.set(13,9,12);scene.add(fill);LIGHTS.fill=fill;

  const inA=new THREE.PointLight(0xffd9a0,38,20,1.72);inA.position.set(-1.6,2.9,-1.0);scene.add(inA);LIGHTS.inA=inA;
  const inB=new THREE.PointLight(0xffe6bf,26,17,1.72);inB.position.set(3.0,2.8,1.4);scene.add(inB);LIGHTS.inB=inB;
  const inC=new THREE.PointLight(0xffe9c8,22,15,1.72);inC.position.set(-4.2,2.5,1.6);scene.add(inC);LIGHTS.inC=inC;

  const spill=new THREE.SpotLight(0xffcf95,15,17,0.72,0.75,1.5);
  spill.position.set(-0.5,3.0,3.2);
  spill.target.position.set(-0.5,0,7.4);scene.add(spill.target);
  scene.add(spill);LIGHTS.spill=spill;

  const lampA=new THREE.PointLight(0xffd7a4,9,14,1.95);lampA.position.set(4.8,4.55,5.35);scene.add(lampA);LIGHTS.lampA=lampA;
  const lampB=new THREE.PointLight(0xffd7a4,6.5,12,1.95);lampB.position.set(-8.2,4.35,3.1);scene.add(lampB);LIGHTS.lampB=lampB;

  const vmL=new THREE.PointLight(0x9fe8ff,3.6,7,2.0);vmL.position.set(2.55,1.2,4.6);scene.add(vmL);LIGHTS.vmL=vmL;
  const neonL=new THREE.PointLight(0x7fe6ff,3.0,11,2.0);neonL.position.set(4.9,3.2,3.7);scene.add(neonL);LIGHTS.neonL=neonL;
}

/* ================================================================
   3. 底座 + 地面
   底座 20x20（-10..10）；前侧马路 z 6.2..10，右侧马路 x 6.2..10
================================================================ */
const CURB=6.2;
const BLD={x0:-6.6,x1:4.4,z0:-6.2,z1:3.4,h:3.6};
const PUDDLES=[];

(function(){
  const S=2048,c=cvs(S,S),x=ctx2(c);
  const sc=S/20; x.save(); x.translate(S/2,S/2); x.scale(sc,sc);

  /* 人行道底 */
  x.fillStyle='#333a4e'; x.fillRect(-10,-10,20,20);
  for(let i=0;i<2600;i++){x.fillStyle=`rgba(255,255,255,${rr(.012,.05)})`;x.fillRect(rr(-10,10),rr(-10,10),rr(.03,.16),rr(.03,.1))}
  for(let i=0;i<900;i++){x.fillStyle=`rgba(0,0,0,${rr(.03,.12)})`;x.fillRect(rr(-10,10),rr(-10,10),rr(.04,.2),rr(.04,.14))}
  x.strokeStyle='rgba(12,14,22,.42)';x.lineWidth=0.028;
  for(let i=-10;i<=10;i+=0.92){x.beginPath();x.moveTo(i,-10);x.lineTo(i,10);x.stroke();x.beginPath();x.moveTo(-10,i);x.lineTo(10,i);x.stroke()}
  x.strokeStyle='rgba(150,164,190,.10)';x.lineWidth=0.02;
  for(let i=-10;i<=10;i+=0.92){x.beginPath();x.moveTo(i+0.02,-10);x.lineTo(i+0.02,10);x.stroke()}
  for(let i=0;i<26;i++){x.fillStyle=`rgba(${ri(60,90)},${ri(64,94)},${ri(80,110)},.16)`;rrPath(rr(-9.4,5.6),rr(-9.4,5.6),rr(1,3),rr(.8,2.4),.3);x.fill()}

  /* 沥青（L 形） */
  function asphalt(x0,z0,w,d){
    x.save();x.beginPath();x.rect(x0,z0,w,d);x.clip();
    x.fillStyle='#171b29';x.fillRect(x0,z0,w,d);
    for(let i=0;i<1500;i++){x.fillStyle=`rgba(255,255,255,${rr(.01,.045)})`;x.fillRect(rr(x0,x0+w),rr(z0,z0+d),rr(.02,.1),rr(.02,.07))}
    for(let i=0;i<900;i++){x.fillStyle=`rgba(0,0,0,${rr(.05,.16)})`;x.fillRect(rr(x0,x0+w),rr(z0,z0+d),rr(.03,.16),rr(.03,.1))}
    for(let i=0;i<9;i++){x.fillStyle=`rgba(${ri(38,52)},${ri(42,56)},${ri(58,74)},.5)`;rrPath(rr(x0,x0+w),rr(z0,z0+d),rr(1.2,3.4),rr(1,2.6),.5);x.fill()}
    x.strokeStyle='rgba(10,12,18,.55)';
    for(let i=0;i<16;i++){let px=rr(x0,x0+w),pz=rr(z0,z0+d);x.lineWidth=rr(.02,.05);x.beginPath();x.moveTo(px,pz);
      for(let j=0;j<6;j++){px+=rr(-.7,.7);pz+=rr(-.7,.7);x.lineTo(px,pz)}x.stroke()}
    x.restore();
  }
  asphalt(-10,CURB,20,10-CURB);
  asphalt(CURB,-10,10-CURB,CURB+10);

  /* 路缘石 */
  x.fillStyle='#7d8698';
  x.fillRect(-10,CURB-0.19,20-0.19,0.19);
  x.fillRect(CURB-0.19,-10,0.19,CURB+10);
  x.beginPath();x.arc(CURB-0.19,CURB-0.19,0.62,Math.PI,Math.PI*1.5);
  x.strokeStyle='#7d8698';x.lineWidth=0.19;x.stroke();
  x.fillStyle='rgba(190,200,215,.35)';
  x.fillRect(-10,CURB-0.21,20-0.19,0.035);
  x.fillRect(CURB-0.21,-10,0.035,CURB+10);

  /* 排水沟 + 格栅 */
  x.fillStyle='rgba(14,17,26,.72)';
  x.fillRect(-10,CURB-0.44,20-0.19,0.25);
  x.fillRect(CURB-0.44,-10,0.25,CURB+10);
  function grate(x0,z0,w,d,vertical){
    x.save();x.fillStyle='#565f74';x.fillRect(x0,z0,w,d);
    x.strokeStyle='rgba(10,12,18,.85)';x.lineWidth=0.035;
    if(vertical){for(let i=0;i<5;i++){const yy=z0+d*(i+0.5)/5.5;x.beginPath();x.moveTo(x0+0.04,yy);x.lineTo(x0+w-0.04,yy);x.stroke()}}
    else{for(let i=0;i<5;i++){const xx=x0+w*(i+0.5)/5.5;x.beginPath();x.moveTo(xx,z0+0.04);x.lineTo(xx,z0+d-0.04);x.stroke()}}
    x.strokeStyle='rgba(200,210,225,.20)';x.lineWidth=0.03;x.strokeRect(x0,z0,w,d);x.restore();
  }
  for(let gx=-9.2;gx<CURB-0.6;gx+=2.35)grate(gx,CURB-0.42,1.15,0.22,true);
  for(let gz=-9.2;gz<CURB-0.6;gz+=2.35)grate(CURB-0.42,gz,0.22,1.15,false);

  /* 导盲砖 */
  function tactile(x0,z0,w,d){
    x.save();x.fillStyle='#a8905a';x.fillRect(x0,z0,w,d);
    x.fillStyle='rgba(20,18,14,.30)';x.fillRect(x0,z0+d-0.05,w,0.05);
    for(let i=0;i<Math.floor(w/0.26);i++)for(let j=0;j<Math.floor(d/0.26);j++){
      x.fillStyle=`rgba(230,206,150,${rr(.25,.5)})`;

const RIPPLES=[];
(function(){
  const vs=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
  const fs=`
  varying vec2 vUv;uniform float uTime,uSeed,uStr;
  void main(){
    vec2 p=vUv*2.0-1.0;float d=length(p);
    float mask=smoothstep(1.0,0.42,d);
    float k=0.0;
    for(int i=0;i<3;i++){
      float ph=fract(uTime*0.26+uSeed*0.41+float(i)*0.333);
      float rr2=ph*0.98;float w=0.030+0.030*ph;
      k+=smoothstep(w,0.0,abs(d-rr2))*(1.0-ph)*0.50;
    }
    float shimmer=0.028+0.022*sin(uTime*1.7+uSeed*6.0+d*9.0);
    float a=(k*1.15+shimmer*mask)*mask*uStr;
    gl_FragColor=vec4(vec3(0.60,0.80,1.0),a);
  }`;
  PUDDLES.forEach((p,i)=>{
    const mat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uSeed:{value:i*1.37+0.7},uStr:{value:0.24*p.s}},
      vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    const m=new THREE.Mesh(new THREE.CircleGeometry(p.r,26),mat);
    m.rotation.x=-Math.PI/2;m.position.set(p.x,0.016,p.z);m.renderOrder=2;
    scene.add(m);RIPPLES.push(mat);
  });
})();

  function put(t,px,py){

    vec4 mv=modelViewMatrix*vec4(position,1.0);vV=normalize(-mv.xyz);
    gl_Position=projectionMatrix*mv;}`;
  const fs=`
  varying vec2 vUv;varying vec3 vN;varying vec3 vV;
  uniform float uTime,uDrop,uGlow;
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float streak(vec2 uv,float sp,float w){
    float y=fract(uv.y*sp+h21(vec2(floor(uv.x*22.0),1.0))*8.0);
    float d=abs(fract(uv.x*22.0)-0.5)/22.0;
    return smoothstep(w,0.0,d)*smoothstep(0.0,0.35,y)*smoothstep(1.0,0.55,y);
  }
  void main(){
    vec3 base=vec3(0.26,0.42,0.60);
    float fres=pow(1.0-max(dot(normalize(vN),normalize(vV)),0.0),2.2);
    vec3 col=base*(0.55+0.55*fres);
    col+=vec3(1.0,0.80,0.50)*smoothstep(1.05,0.05,vUv.y)*uGlow*0.42;
    float s=0.0;
    s+=streak(vUv,1.6,0.055);
    s+=streak(vUv*vec2(1.7,0.7)+vec2(0.31,0.77),2.4,0.035)*0.7;
    col+=vec3(0.75,0.90,1.0)*s*0.22*uDrop;
    float a=0.10+0.15*fres+s*0.20*uDrop;
    gl_FragColor=vec4(col,clamp(a,0.14,0.92));
  }`;
  const list=[];
  function pane(w,h,x,y,z,ry,glow){
    const mat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uDrop:{value:1},uGlow:{value:glow===undefined?1:glow}},
      vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(gPlane(w,h),mat);
    mesh.position.set(x,y,z);mesh.rotation.y=ry;mesh.renderOrder=6;
    if(NOGLASS)mesh.visible=false;
    STORE.add(mesh);noOL(mesh);list.push(mat);return mesh;
  }
  return {pane,list};
})();

flushStock(PROD);

const RAIN=(function(){
  const N=1900,H=17.0,SPAN=10.4;
  const pos=new Float32Array(N*2*3),aEnd=new Float32Array(N*2),
        aSpd=new Float32Array(N*2),aLen=new Float32Array(N*2),aSeed=new Float32Array(N*2);
  for(let i=0;i<N;i++){
    const x=(hash2(i*1.13,7.7)*2-1)*SPAN;
    const z=(hash2(i*2.71,3.31)*2-1)*SPAN;
    const y=hash2(i*5.17,11.3)*H;
    const spd=6.0+hash1(i*3.7)*5.5;
    const len=0.30+hash1(i*9.1)*0.55;
    for(let v=0;v<2;v++){
      const k=i*2+v;
      pos[k*3]=x;pos[k*3+1]=y;pos[k*3+2]=z;
      aEnd[k]=v;aSpd[k]=spd;aLen[k]=len;aSeed[k]=hash1(i*17.3+v);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aEnd',new THREE.BufferAttribute(aEnd,1));
  geo.setAttribute('aSpd',new THREE.BufferAttribute(aSpd,1));
  geo.setAttribute('aLen',new THREE.BufferAttribute(aLen,1));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(aSeed,1));
  geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,H/2,0),34);
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uH:{value:H},uOpacity:{value:0.55},uWind:{value:new THREE.Vector2(0.42,0.16)}},
    vertexShader:`
      attribute float aEnd,aSpd,aLen,aSeed;uniform float uTime,uH;uniform vec2 uWind;varying float vA;
      void main(){
        float span=uH;
        float y=mod(position.y-uTime*aSpd,span);
        float fall=span-y;
        vec3 p=vec3(position.x+uWind.x*fall*0.10,y,position.z+uWind.y*fall*0.10);
        vec3 dir=normalize(vec3(uWind.x*0.30,-1.0,uWind.y*0.30));
        vec3 q=p+dir*aLen*aEnd*(0.55+aSeed*0.9);
        vA=smoothstep(0.0,1.4,y)*smoothstep(span,span-3.0,y)*(0.55+aSeed*0.55);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(q,1.0);
      }`,
    fragmentShader:`uniform float uOpacity;varying float vA;
      void main(){gl_FragColor=vec4(vec3(0.72,0.86,1.0),vA*uOpacity);}`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false
  });
  const ls=new THREE.LineSegments(geo,mat);
  ls.frustumCulled=false;ls.renderOrder=8;scene.add(ls);
  return {mat};
})();

const SPLASH=(function(){
  const CAP=170;
  const mat=new THREE.MeshBasicMaterial({color:0xbfe0ff,transparent:true,opacity:0.55,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  const im=new THREE.InstancedMesh(new THREE.RingGeometry(0.045,0.085,14),mat,CAP);
  im.frustumCulled=false;im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(im);noOL(im);
  const P=[];for(let i=0;i<CAP;i++)P.push({life:-1,x:0,z:0,s:1});
  let idx=0,cur=0;
  const mtx=new THREE.Matrix4(),q=new THREE.Quaternion(),pv=new THREE.Vector3(),sv=new THREE.Vector3();
  q.setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
  const hide=new THREE.Matrix4().compose(pv.set(0,-99,0),q,sv.set(0.0001,0.0001,0.0001));
  for(let i=0;i<CAP;i++)im.setMatrixAt(i,hide);
  return {
    spawn(x,z,s){idx=(idx+1)%CAP;P[idx].life=0;P[idx].x=x;P[idx].z=z;P[idx].s=s||1},
    update(dt){
      for(let i=0;i<CAP;i++){
        const p=P[i];
        if(p.life<0)continue;
        p.life+=dt;
        const k=p.life/0.62;
        if(k>=1){p.life=-1;im.setMatrixAt(i,hide);continue}
        const r=(0.25+k*2.1)*p.s;
        mtx.compose(pv.set(p.x,0.03,p.z),q,sv.set(r,r,1));
        im.setMatrixAt(i,mtx);
      }
      im.instanceMatrix.needsUpdate=true;
    }
  };
})();

const DRIP=(function(){
  const emitters=[];
  for(let i=0;i<10;i++)emitters.push({x:-5.6+i*1.18,y:2.72,z:FRONT_Z+1.60});
  for(let i=0;i<7;i++)emitters.push({x:-5.2+i*1.7,y:BLD.h+0.30,z:BLD.z1+0.24});
  for(let i=0;i<5;i++)emitters.push({x:BLD.x1+0.24,y:BLD.h+0.30,z:-5.4+i*1.9});
  for(let i=0;i<4;i++)emitters.push({x:-9.5+i*0.6,y:2.9,z:1.78});
  const CAP=52;
  const im=new THREE.InstancedMesh(gSph(0.045,7),
    new THREE.MeshBasicMaterial({color:0xcfe6ff,transparent:true,opacity:0.85,fog:false}),CAP);
  im.frustumCulled=false;im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(im);noOL(im);
  const P=[];
  for(let i=0;i<CAP;i++){const e=emitters[i%emitters.length];P.push({x:e.x,y:e.y,z:e.z,vy:0,t:rr(0,3)})}
  const mtx=new THREE.Matrix4(),q=new THREE.Quaternion(),pv=new THREE.Vector3(),sv=new THREE.Vector3(1,1.9,1);
  return {
    update(dt){
      for(let i=0;i<CAP;i++){
        const p=P[i];
        p.t-=dt;
        if(p.t<=0){
          const e=emitters[(i*7+Math.floor(hash1(i*3.1)*emitters.length))%emitters.length];
          p.x=e.x+rr(-0.04,0.04);p.y=e.y;p.z=e.z;p.vy=0.4;
        }else{
          p.vy+=9.0*dt;p.y-=p.vy*dt;
          if(p.y<0.05){SPLASH.spawn(p.x,p.z,0.8);p.t=rr(0.6,2.6);p.y=-99}
        }
        sv.set(1,p.vy>2?2.4:1.2,1);
        mtx.compose(pv.set(p.x,p.y,p.z),q,sv);
        im.setMatrixAt(i,mtx);
      }
      im.instanceMatrix.needsUpdate=true;
    }
  };
})();

const STEAMSYS=(function(){
  const list=[];
  for(let i=0;i<22;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW_SOFT,color:new THREE.Color(0xe8f2ff),
      transparent:true,opacity:0.0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    s.scale.set(0.2,0.2,1);scene.add(s);noOL(s);
    list.push({s,t:i/22,sp:rr(0.16,0.30),x:0,y:0,z:0,seed:rr(0,10)});
  }
  function place(p){
    const src=STEAM[Math.floor(rr(0,STEAM.length))];
    p.x=src.x+rr(-0.15,0.15);p.z=src.z+rr(-0.12,0.12);p.y=src.y;
  }
  list.forEach(place);
  return {
    update(dt,t){
      for(const p of list){
        p.t+=dt*p.sp*2.6;
        if(p.t>1){p.t=0;place(p)}
        const k=p.t;
        p.s.position.set(p.x+Math.sin(t*0.8+p.seed)*0.10*k,p.y+k*0.85,p.z+Math.cos(t*0.7+p.seed)*0.08*k);
        const sc=0.18+k*0.55;
        p.s.scale.set(sc,sc,1);
        p.s.material.opacity=Math.sin(k*Math.PI)*0.16;
      }
    }
  };
})();

/* ================================================================
   10. 动画循环
================================================================ */
function flick(t,ph,rare){
  const n=hash1(Math.floor((t+ph)*3.1)+ph*13.7);
  let v=1;
  if(n>rare)v=lerp(0.72,0.94,hash1(Math.floor((t+ph)*23.0)+ph*5.3));
  if(hash1(Math.floor((t+ph)*13.0)+ph*9.1)>0.992)v=0.20;
  return v;
}
function updateTL(t){
  const tl=FLICKER.tl;if(!tl)return;
  const CYCLE=13.6,x=t%CYCLE;
  const state=x<5.8?'g':(x<7.6?'y':'r');
  for(const h of [tl.hA,tl.hB])for(const k of ['r','y','g']){
    const o=h[k],on=(k===state);
    o.m.material.opacity=on?1.0:0.16;
    o.gl.material.opacity=on?0.55:0.0;
    const s=on?1.0:0.001;o.gl.scale.set(s,s,1);
  }
  const walk=(state==='r');
  for(const p of [tl.pA,tl.pB]){
    const want=walk?p.grnT:p.redT;
    if(p.pm.material.map!==want){p.pm.material.map=want;p.pm.material.needsUpdate=true}
  }
}
const PROBE=new URLSearchParams(location.search).get('probe')==='1';
let probeAcc=0,splashAcc=0;
function randomSplash(){
  for(let k=0;k<8;k++){
    const x=rr(-9.6,9.6),z=rr(-9.6,9.6);
    if(x>BLD.x0-0.5&&x<BLD.x1+0.5&&z>BLD.z0-0.5&&z<BLD.z1+0.5)continue;
    if(x>-10.2&&x<-7.6&&z>-5.0&&z<1.9)continue;
    if(x>0.2&&x<5.7&&z>-10.2&&z<-6.8)continue;
    SPLASH.spawn(x,z,rr(0.55,1.05));return;
  }
}

const clock=new THREE.Clock();
let T=SHOT.t0,booted=false;
let intro=SHOT.intro;
const HOME=camera.position.clone();
controls.addEventListener('start',()=>{intro=0});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt;

  RAIN.mat.uniforms.uTime.value=T;
  RAIN.mat.uniforms.uOpacity.value=0.50+0.08*Math.sin(T*0.31);
  for(const m of RIPPLES)m.uniforms.uTime.value=T;
  for(const m of GLASS.list)m.uniforms.uTime.value=T;

  for(const s of STREAKS){
    s.mat.opacity=s.op*(0.70+0.30*Math.sin(T*s.sp+s.ph));
    s.m.scale.y=1+0.07*Math.sin(T*s.sp*0.6+s.ph*1.7);
  }

  const vf=flick(T,0.31,0.90);
  SIGN.panel.material.color.setRGB(0.90*vf,0.90*vf*0.99,0.90*vf*0.96);
  SIGN.glow.material.opacity=0.15*vf;
  const vb=flick(T,2.7,0.94);
  SIGN.blade.material.color.setScalar(0.75+0.25*vb);
  SIGN.bladeGlow.material.opacity=0.20*vb;
  for(const v of FLICKER.vm){
    const k=flick(T,v.ph,0.985);
    v.mat.opacity=v.base*k;
    v.glow.material.opacity=0.30*k;
  }
  if(FLICKER.alleyLamp){
    const k=flick(T*1.6,5.1,0.72);
    FLICKER.alleyLamp.m.material.color.setScalar(0.35+0.65*k);
    FLICKER.alleyLamp.g.material.opacity=0.12+0.22*k;
  }
  for(const e of FLICKER.lamps){
    const k=flick(T,e.ph,e.rare);
    if(e.g)e.g.material.opacity=(e.baseOp===undefined?0.2:e.baseOp)*(0.62+0.38*k);
    if(e.tint)e.m.material.color.setScalar(0.62+0.38*k);
  }
  if(FLICKER.cam)FLICKER.cam.material.opacity=0.35+0.35*Math.abs(Math.sin(T*1.7));

  const D=FLICKER.door;
  D.next-=dt;
  if(D.next<=0&&D.target===0){D.target=1;D.hold=rr(2.6,4.2);D.next=rr(7.5,16)+D.hold}
  if(D.target===1){D.hold-=dt;if(D.hold<=0)D.target=0}
  D.open+=(D.target-D.open)*Math.min(1,dt*5.5);
  for(const l of DOORLEAVES)l.g.position.x=l.base+l.side*1.16*D.open;
  LIGHTS.spill.intensity=15*(1+0.60*D.open);

  updateTL(T);
  if(PROBE){probeAcc+=dt;if(probeAcc>1.2){probeAcc=0;const x=T%13.6;
    console.log('PROBE t='+T.toFixed(1)+' door='+FLICKER.door.open.toFixed(2)+
      ' tl='+(x<5.8?'GREEN':x<7.6?'YELLOW':'RED'))}}
  STEAMSYS.update(dt,T);
  DRIP.update(dt);
  splashAcc+=dt*20;
  while(splashAcc>1){splashAcc-=1;randomSplash()}
  SPLASH.update(dt);

  if(intro>0){
    intro=Math.max(0,intro-dt/2.4);
    const f=1+0.42*intro*intro;
    camera.position.set(LOOK_AT.x+(HOME.x-LOOK_AT.x)*f,LOOK_AT.y+(HOME.y-LOOK_AT.y)*f,LOOK_AT.z+(HOME.z-LOOK_AT.z)*f);
  }

  controls.update();
  renderFrame();

  if(!booted){
    booted=true;
    const v=document.getElementById('veil');
    requestAnimationFrame(()=>{v.style.opacity='0';setTimeout(()=>v.remove(),1800)});
    const x0=T%13.6;
    console.log('ready · tris',renderer.info.render.triangles,'calls',renderer.info.render.calls,
      'outline',!!effect,'errs',window.__errs.length,
      'tl',x0<5.8?'GREEN':x0<7.6?'YELLOW':'RED',
      'tlLens',!!FLICKER.tl,'doors',DOORLEAVES.length,'puddles',PUDDLES.length,
      'glass',GLASS.list.length,'rain',RAIN.mat.uniforms.uTime.value.toFixed(2));
  }
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  if(effect&&effect.setSize)effect.setSize(innerWidth,innerHeight);
  else renderer.setSize(innerWidth,innerHeight);
});
animate();
window.__sceneReady=true;
