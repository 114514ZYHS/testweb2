<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:16px;overflow:hidden;
    background:radial-gradient(130% 100% at 50% 0%,#c9e8ff 0%,#e8f6ff 46%,#f9fdff 100%);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#28415c;
  }
  .stage{
    width:min(1080px,100%);border-radius:22px;overflow:hidden;position:relative;
    box-shadow:0 26px 60px -26px rgba(22,60,105,.5),0 0 0 1px rgba(22,60,105,.08);
  }
  svg{display:block;width:100%;height:auto;cursor:pointer}
  /* 景深：前景虚化 */
  #grass{filter:blur(1.5px)}
  #dust{filter:blur(1.1px)}

  /* ---------- 控制条 ---------- */
  .panel{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    box-shadow:0 10px 30px -14px rgba(22,60,105,.45),0 0 0 1px rgba(22,60,105,.07);
  }
  .ctl{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.85}
  .ctl b{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-weight:650;font-size:13px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:132px;height:6px;border-radius:999px;
    background:linear-gradient(90deg,#7fc4ff,#2f7fd6);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid #2f7fd6;box-shadow:0 2px 6px rgba(20,60,110,.35);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #2f7fd6;cursor:pointer;
  }
  .btn{
    font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(47,127,214,.28);background:rgba(255,255,255,.9);color:#28415c;
    transition:transform .12s ease,background .2s ease,box-shadow .2s ease;
  }
  .btn:hover{background:#fff;box-shadow:0 6px 16px -8px rgba(22,60,105,.5)}
  .btn:active{transform:scale(.95)}
  .btn.on{background:#2f7fd6;border-color:#2f7fd6;color:#fff}
  .hint{font-size:12px;opacity:.55;letter-spacing:.02em}

  /* ---------- 黄昏切换 ---------- */
  #scene .duskable{transition:opacity .9s ease}
  #moonGroup,#starField,#duskLayer,#beam,#lamp{opacity:0}
  #scene.dusk #sunGroup{opacity:0}
  #scene.dusk #moonGroup{opacity:1}
  #scene.dusk #starField{opacity:1}
  #scene.dusk #duskLayer{opacity:1}
  #scene.dusk #beam{opacity:1}
  #scene.dusk #lamp{opacity:1}

  /* ---------- 速度线 ---------- */
  .speed-line{animation:dash 1.05s linear infinite}
  .speed-line:nth-child(2){animation-delay:.2s}
  .speed-line:nth-child(3){animation-delay:.4s}
  @keyframes dash{
    0%  {opacity:0;transform:translateX(20px) scaleX(.35)}
    35% {opacity:.8}
    100%{opacity:0;transform:translateX(-36px) scaleX(1)}
  }
  @media (prefers-reduced-motion:reduce){.speed-line{animation:none;opacity:.35}}
</style>
</head>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  function id(n) { return document.getElementById(n); }
  function mk(name, attrs) {
    var e = document.createElementNS(NS, name);
    if (attrs) { for (var k in attrs) { e.setAttribute(k, attrs[k]); } }
    return e;
  }
  var scene = id('scene');

  /* ================= 几何 ================= */
  var REAR  = { x: 270, y: 352 };

  /* ================= 辐条 ================= */

      host.appendChild(mk('line', {

  /* ================= 星空 ================= */

  })();

  /* ================= 太阳光芒 ================= */
  (function () {
    var host = id('sunRays');
    for (var i = 0; i < 14; i++) {
      var a = i * (360 / 14), rad = a * Math.PI / 180;

           ' L' + (742 + Math.cos(rad + w) * 54).toFixed(1) + ' ' + (96 + Math.sin(rad + w) * 54).toFixed(1) + ' Z'
      }));

  var bokeh = [];

      bokeh.push({ el: c, x: (i * 137) % 900, y: 110 + ((i * 79) % 300), sp: 0.5 + (i % 3) * 0.4, ph: i * 1.3 });
    }
  })();

  /* ================= 云 ================= */
  var clouds = [];
  (function () {
    var host = id('clouds');
    var defs = [
      { x: 150, y: 86,  s: 1.00, sp: 7 },
      { x: 520, y: 56,  s: 0.72, sp: 11 },
      { x: 800, y: 152, s: 0.88, sp: 9 },
      { x: 340, y: 140, s: 0.55, sp: 14 }

    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      var g = mk('g', { transform: 'translate(' + d.x + ',' + d.y + ') scale(' + d.s + ')' });
      g.appendChild(mk('ellipse', { cx: 0, cy: 0, rx: 46, ry: 23 }));
      g.appendChild(mk('ellipse', { cx: -36, cy: 9, rx: 30, ry: 16 }));
      g.appendChild(mk('ellipse', { cx: 34, cy: 11, rx: 33, ry: 17 }));
      g.appendChild(mk('ellipse', { cx: 6, cy: -17, rx: 27, ry: 17 }));
      host.appendChild(g);
      clouds.push({ el: g, x: d.x, y: d.y, s: d.s, sp: d.sp });
    }
  })();

  /* ================= 云影 ================= */
  var cloudShadows = [];
  (function () {
    var host = id('cloudShadows');

      var e = mk('ellipse', { cx: 0, cy: 396 + i * 12, rx: 118, ry: 17 });
      host.appendChild(e);
      cloudShadows.push({ el: e, x: 200 + i * 480, sp: 5 + i * 3 });

  })();

  /* ================= 候鸟 ================= */
  var birds = [];
  (function () {
    var host = id('birds');
    var offs = [[0,0],[-26,-14],[-26,14],[-52,-26],[-52,26],[-78,-40],[-78,40]];
    for (var i = 0; i < offs.length; i++) {
      var p = mk('path', { d: '', stroke: '#4b6b8c', fill: 'none' });
      host.appendChild(p);
      birds.push({ el: p, ox: offs[i][0], oy: offs[i][1], ph: i * 0.55 });
    }
  })();
  function birdD(w, h) {
    return 'M' + (-w) + ' 0 Q' + (-w * 0.5) + ' ' + (-h) + ' 0 0 Q' + (w * 0.5) + ' ' + (-h) + ' ' + w + ' 0';
  }
  var birdX = 760, birdY = 168;

  /* ================= 远山 ================= */
  (function () {
    var peaks = [[70,300],[170,268],[300,296],[420,300],[540,286],[680,300],[800,306]];
    id('mountPath').setAttribute('d',

      'L470 340 L540 286 L610 352 L680 300 L740 348 L800 306 L860 356 L900 330 L900 430 L0 430 Z');
    var caps = id('snowCaps');
    for (var i = 0; i < peaks.length; i++) {

      caps.appendChild(mk('path', {
        d: 'M' + (p[0] - w) + ' ' + (p[1] + h) + ' L' + p[0] + ' ' + p[1] +
           ' L' + (p[0] + w) + ' ' + (p[1] + h) +
           ' L' + (p[0] + w * 0.45) + ' ' + (p[1] + h * 0.68) +
           ' L' + (p[0] + w * 0.08) + ' ' + (p[1] + h * 1.02) +
           ' L' + (p[0] - w * 0.42) + ' ' + (p[1] + h * 0.62) + ' Z'

  })();

  /* ================= 视差图层 ================= */
  var layers = [], windmillBlades = [];
  function makeLayer(host, period, speedFactor, buildOne) {
    var copies = Math.ceil(900 / period) + 3;

      var g = mk('g', { transform: 'translate(' + (i * period) + ',0)' });
      buildOne(g);
      host.appendChild(g);
    }
    layers.push({ el: host, period: period, sf: speedFactor, off: 0 });
  }

  /* --- 远丘 + 风车 + 羊群 --- */
  makeLayer(id('hills'), 450, 0.05, function (g) {
    g.appendChild(mk('path', {
      d: 'M0 404 C 60 350 124 344 186 382 C 236 412 306 404 366 372 ' +
         'C 404 352 432 356 450 384 L450 430 L0 430 Z',

      fill: '#e8eef5', stroke: '#c2cfdd', 'stroke-width': 1.5

    g.appendChild(mk('path', {
      d: 'M' + (wx - 7) + ' ' + (wy - 68) + ' L' + wx + ' ' + (wy - 82) +

    var blades = mk('g', { transform: 'rotate(0 ' + wx + ' ' + (wy - 72) + ')' });
    for (var b = 0; b < 4; b++) {
      var sail = mk('g', { transform: 'rotate(' + (b * 90) + ' ' + wx + ' ' + (wy - 72) + ')' });

      blades.appendChild(sail);
    }
    blades.appendChild(mk('circle', { cx: wx, cy: wy - 72, r: 3.5, fill: '#8b98a8' }));

    function sheep(x, y, s) {

        d: 'M' + (x - 5 * s) + ' ' + (y + 5 * s) + ' L' + (x - 5 * s) + ' ' + (y + 11 * s) +

  /* --- 尘埃 --- */
  var dusts = [];
  (function () {

  /* ================= 蝴蝶 ================= */
  var butterflies = [];
  (function () {
    var host = id('butterflies');
    var defs = [
      { ax: 176, ay: 462, r: 44, sp: 0.9, ph: 0.0, c: '#f0932b' },

      { ax: 792, ay: 486, r: 36, sp: 1.2, ph: 4.0, c: '#f6c453' }

  /* ================= 小狗 ================= */
  var DOG_LEGS = [
    { hip: { x: 130, y: 390 }, ph: 0,       tag: 'FL' },

  /* ================= IK ================= */
  function solveLeg(hip, foot, l1, l2) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var raw = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / raw, uy = dy / raw;
    var d = Math.min(Math.max(raw, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var bx = hip.x + a * ux, by = hip.y + a * uy;
    var k1 = { x: bx - h * uy, y: by + h * ux };
    var k2 = { x: bx + h * uy, y: by - h * ux };
    return k1.x > k2.x ? k1 : k2;
  }
  function setLine(el, a, b) {
    el.setAttribute('x1', a.x.toFixed(2)); el.setAttribute('y1', a.y.toFixed(2));
    el.setAttribute('x2', b.x.toFixed(2)); el.setAttribute('y2', b.y.toFixed(2));
  }

  /* ================= 音效 ================= */
  var ac = null;
  function audio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return null; }
      ac = ac || new Ctx();
      return ac;
    } catch (e) { return null; }
  }
  function ding() {
    var a = audio(); if (!a) { return; }
    var t = a.currentTime, freqs = [1568, 2093];
    for (var i = 0; i < freqs.length; i++) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16 / (i + 1), t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.9);
    }
  }
  function clack() {
    var a = audio(); if (!a) { return; }
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(340, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.07);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.13);
  }
  function bark() {
    var a = audio(); if (!a) { return; }
    var t = a.currentTime;
    for (var i = 0; i < 2; i++) {
      var st = t + i * 0.16;
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(430 - i * 40, st);
      o.frequency.exponentialRampToValueAtTime(180, st + 0.1);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.11, st + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
      o.connect(g); g.connect(a.destination); o.start(st); o.stop(st + 0.15);
    }
  }

    if (inBox(ux, uy, 486, 206, 524, 248)) { ringBell(); return; }
    if (Math.hypot(ux - balloonX, uy - balloonY) < 62) { balloonBoost = 1; return; }

  function tick(now) {

      (464 + (452 - 464) * carryT + w * 0.6).toFixed(1) + ' ' + (202 + 4 * carryT - w * 0.5).toFixed(1) + ' ' +
      mg(494, 472) + ' ' + mg(238, 228) + ' C ' + mg(478, 458) + ' ' + mg(250, 240) + ' ' +

    id('scarf').setAttribute('d',
      'M410 152 C ' + (386 + a1 * 8) + ' ' + (140 + b1 * 10) + ' ' +
      (360 - a1 * 10) + ' ' + (146 + b1 * 12) + ' ' +
      (338 - a1 * 13) + ' ' + (158 + b1 * 14) + ' C 364 ' + (168 + b1 * 10) + ' 390 170 410 166 Z');

    var fw = Math.sin(tsec * 9 * wind) * 5 * wind;
    id('flag').setAttribute('d', 'M208 170 L' + (254 + fw) + ' ' + (181 + fw * 0.5) + ' L208 193 Z');
    id('tailLight').setAttribute('opacity', (0.35 + 0.65 * Math.abs(Math.sin(tsec * 3.2))).toFixed(2));

    /* 车筐里的鱼被点时会扭 */
    reactBasket = Math.max(0, reactBasket - dt * 1.2);
    id('basketFish').setAttribute('transform',
      'rotate(' + (Math.sin(tsec * 26) * 22 * reactBasket).toFixed(2) + ' 536 240)');

    /* 汗滴 */
    (function () {
      var heat = Math.max(0, Math.min(1, (speedMul - 1.5) / 1.0));
      var sw = id('sweat');
      sw.setAttribute('opacity', (heat * 0.9).toFixed(2));
      if (heat > 0.01) {
        var drops = sw.querySelectorAll('ellipse');
        for (var i = 0; i < drops.length; i++) {
          var p = ((tsec * 1.6 + i * 0.37) % 1);
          drops[i].setAttribute('transform',
            'translate(0,' + (p * 26).toFixed(1) + ') scale(1,' + (1 - p * 0.5).toFixed(2) + ')');
          drops[i].setAttribute('opacity', ((1 - p) * 0.9).toFixed(2));
        }
      }
    })();

    /* 苍蝇与捕食 */
    (function () {
      var fly = id('fly');
      if (flyState === 0) {
        flyTimer -= dt;
        fly.setAttribute('opacity', 0);
        if (flyTimer <= 0) { flyState = 1; flyTimer = 3 + Math.random() * 2.5; }
      } else if (flyState === 1) {
        flyTimer -= dt;
        var fx0 = 452 + 11 * carryT, fy0 = 92 + 103 * carryT;
        flyX = fx0 + Math.cos(tsec * 5.2) * 34 + Math.sin(tsec * 2.3) * 10;
        flyY = fy0 + Math.sin(tsec * 6.4) * 20 + Math.cos(tsec * 3.1) * 8;
        fly.setAttribute('transform', 'translate(' + flyX.toFixed(1) + ',' + flyY.toFixed(1) + ')');
        fly.setAttribute('opacity', '0.85');
        id('flyWing1').setAttribute('transform',
          'translate(-3,-3) scale(1,' + (0.3 + 0.7 * Math.abs(Math.sin(tsec * 40))).toFixed(2) + ')');
        id('flyWing2').setAttribute('transform',
          'translate(3,-3) scale(1,' + (0.3 + 0.7 * Math.abs(Math.sin(tsec * 40 + 1))).toFixed(2) + ')');
        if (flyTimer <= 0) { flyState = 2; snapT = 0; clack(); showPop('popSnap'); }
      } else if (flyState === 2) {
        snapT += dt / 0.34;
        var open = Math.sin(Math.min(1, snapT) * Math.PI);
        id('beakTop').setAttribute('transform',
          'rotate(' + (-15 * open).toFixed(2) + ' 452 122)');
        id('pouchGroup').setAttribute('transform',
          'rotate(' + (5 * open).toFixed(2) + ' 456 128)');
        fly.setAttribute('opacity', (Math.max(0, 1 - snapT * 2)).toFixed(2));
        if (snapT >= 1) {
          id('beakTop').setAttribute('transform', '');
          id('pouchGroup').setAttribute('transform', '');
          flyState = 0; flyTimer = 6 + Math.random() * 6;
          fly.setAttribute('opacity', 0);
        }
      }
    })();

    /* 气泡文字 */
    for (var pk in pops) {
      var pp = pops[pk];
      if (pp.t < 0) { continue; }
      pp.t += dt / 1.1;
      if (pp.t >= 1) { pp.t = -1; pp.el.setAttribute('opacity', 0); continue; }
      pp.el.setAttribute('opacity', (Math.sin(pp.t * Math.PI) * 0.95).toFixed(2));
      var popOx = pk === 'popDog' ? 0 : (pk === 'popSnap' ? 30 * carryT : -7 * carryT);
      var popOy = pk === 'popDog' ? 0 : 119 * carryT;
      pp.el.setAttribute('transform',
        'translate(' + popOx.toFixed(1) + ',' + (popOy - pp.t * 22).toFixed(1) + ')');
    }

    /* 里程碑 */
    if (distKm >= nextMile) {
      toastMsg = nextMile >= 0.995 && nextMile <= 1.005 ? '🎉 骑行 1 公里达成！' : '🎉 已完成 ' + nextMile.toFixed(1) + ' km';
      id('toastText').textContent = toastMsg;
      toastT = 0;
      nextMile += 0.1;
    }
    if (toastT >= 0) {
      toastT += dt / 2.4;
      if (toastT >= 1) { toastT = -1; id('toast').setAttribute('opacity', 0); }
      else {
        var tt = toastT;
        var o = tt < 0.15 ? tt / 0.15 : (tt > 0.8 ? (1 - tt) / 0.2 : 1);
        id('toast').setAttribute('opacity', (o * 0.95).toFixed(2));
        id('toast').setAttribute('transform', 'translate(0,' + ((1 - Math.min(1, tt * 6)) * 14).toFixed(1) + ')');
      }
    }

    /* 眨眼 */
    blinkClock += dt;
    if (blinkPhase < 0 && blinkClock > blinkNext) {
      blinkPhase = 0; blinkClock = 0; blinkNext = 2.6 + Math.random() * 3.4;
    }
    if (blinkPhase >= 0) {
      blinkPhase += dt / 0.13;
      if (blinkPhase >= 1) { blinkPhase = -1; }
    }
    var sc = blinkPhase < 0 ? 1 : 1 - Math.sin(blinkPhase * Math.PI) * 0.9;
    id('eye').setAttribute('transform',
      'translate(452,108) scale(1,' + sc.toFixed(3) + ') translate(-452,-108)');

    /* 车铃 */
    if (ringT >= 0) {
      ringT += dt * 2.4;
      var prog = Math.min(1, ringT), decay = 1 - prog;
      id('bell').setAttribute('transform',
        'translate(' + BELL.x + ',' + BELL.y + ') rotate(' +
        (Math.sin(ringT * 46) * 16 * decay).toFixed(2) + ')');
      var waves = id('bellWaves');
      waves.setAttribute('opacity', (decay * 0.85).toFixed(2));
      waves.innerHTML = '';
      for (var rI = 0; rI < 2; rI++) {
        var rr = 9 + prog * 26 + rI * 8;
        waves.appendChild(mk('path', {
          d: 'M' + (BELL.x - rr) + ' ' + (BELL.y - rr * 0.6) + ' A ' + rr + ' ' + rr +
             ' 0 0 1 ' + (BELL.x - rr) + ' ' + (BELL.y + rr * 0.6),
          fill: 'none', stroke: '#f2c14e', 'stroke-width': 2.4, 'stroke-linecap': 'round'
        }));
      }
      id('ding').setAttribute('opacity', (decay * 0.95).toFixed(2));
      id('ding').setAttribute('transform', 'translate(0,' + (-prog * 26).toFixed(1) + ')');
      if (ringT >= 1) {
        ringT = -1;
        id('bell').setAttribute('transform', 'translate(' + BELL.x + ',' + BELL.y + ')');
        waves.setAttribute('opacity', 0); waves.innerHTML = '';
        id('ding').setAttribute('opacity', 0);
      }
    }

    /* 仪表盘 */
    hudTick += dt;
    if (hudTick > 0.1) {
      hudTick = 0;
      id('hudSpeed').textContent = (road * SPEED_KMH).toFixed(1);
      id('hudDist').textContent = distKm.toFixed(3);
      var isRun = carryT > 0.5;
      id('hudLabel3').textContent = isRun ? '步频' : '踏频';
      id('hudRpm').textContent = isRun
        ? Math.round(6.6 * k * 60 / Math.PI)
        : Math.round(BASE_CRANK * k * 60 / (2 * Math.PI) * 2.8);
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
