<style>
  :root{
    --accent:#5fd8ff;
    --accent2:#ffb26b;
    --bg0:#05070b;
    --panel:rgba(12,17,24,.72);
    --line:rgba(120,190,230,.18);
    --txt:#c9d6e2;
    --dim:#7d8fa1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
    font-family:"Inter","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  canvas{display:block}
  #app{position:fixed;inset:0}

  /* ---------- 载入层 ---------- */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(circle at 50% 45%,#0d141d 0%,#05070b 70%);
    transition:opacity .6s ease;}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .ttl{font-size:13px;letter-spacing:.42em;color:var(--accent);text-transform:uppercase}
  #loader .bar{width:260px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
  #loader .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2b8fb8,var(--accent));transition:width .25s ease}
  #loader .st{font-size:11px;color:var(--dim);letter-spacing:.16em;min-height:14px}

  /* ---------- HUD ---------- */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:20;
       opacity:1;transition:opacity .25s ease}
  .hud.hide{opacity:0}
  .panel{position:absolute;pointer-events:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);}

  #spec{left:18px;top:18px;min-width:246px}
  #spec h1{font-size:15px;font-weight:600;letter-spacing:.06em;color:#eaf4ff}
  #spec h1 span{color:var(--accent);font-weight:500}
  #spec .sub{font-size:10px;letter-spacing:.26em;color:var(--dim);margin:3px 0 10px;text-transform:uppercase}
  #spec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11px}
  #spec dt{color:var(--dim);letter-spacing:.05em}
  #spec dd{color:#dbe7f2;text-align:right;font-variant-numeric:tabular-nums}

  #ctrl{right:18px;top:18px;width:224px;max-height:calc(100vh - 36px);overflow-y:auto}
  #ctrl::-webkit-scrollbar{width:4px}
  #ctrl::-webkit-scrollbar-thumb{background:rgba(120,190,230,.25);border-radius:2px}
  .grp{margin-bottom:12px}
  .grp:last-child{margin-bottom:0}
  .grp>.lb{font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;
    margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .grp>.lb:after{content:"";flex:1;height:1px;background:var(--line)}
  .row{display:flex;flex-wrap:wrap;gap:5px}
  button{pointer-events:auto;font:inherit;font-size:10.5px;letter-spacing:.05em;
    color:var(--txt);background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);border-radius:6px;
    padding:6px 9px;cursor:pointer;transition:.16s;flex:1 1 auto;white-space:nowrap}
  button:hover{background:rgba(95,216,255,.14);border-color:rgba(95,216,255,.45);color:#eaf8ff}
  button.on{background:rgba(95,216,255,.2);border-color:rgba(95,216,255,.6);color:#eaf8ff;
    box-shadow:0 0 12px rgba(95,216,255,.22) inset}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:5px 8px;border-radius:6px;cursor:pointer;user-select:none;
    font-size:11px;color:var(--txt);transition:.14s;border:1px solid transparent}
  .sw:hover{background:rgba(255,255,255,.05)}
  .sw i{width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.13);
    position:relative;transition:.18s;flex:none}
  .sw i:after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;
    border-radius:50%;background:#8fa2b4;transition:.18s}
  .sw.on i{background:rgba(95,216,255,.4)}
  .sw.on i:after{left:14px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .sw.on{color:#eaf8ff}
  .sw kbd{font:inherit;font-size:9px;color:var(--dim);border:1px solid var(--line);
    border-radius:3px;padding:0 4px}

  #stats{left:18px;bottom:18px;font-size:10px;letter-spacing:.1em;color:var(--dim);
    font-variant-numeric:tabular-nums;padding:8px 12px}
  #stats b{color:var(--accent);font-weight:500}
  #hint{right:18px;bottom:18px;font-size:10px;color:var(--dim);letter-spacing:.08em;padding:8px 12px}
  #hint b{color:#b9cadb;font-weight:500}
  .corner{position:absolute;width:14px;height:14px;border:1px solid rgba(95,216,255,.35)}
  .c1{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .c2{right:-1px;top:-1px;border-left:0;border-bottom:0}
  .c3{left:-1px;bottom:-1px;border-right:0;border-top:0}
  .c4{right:-1px;bottom:-1px;border-left:0;border-top:0}
  #err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
    background:#05070b;color:#ff8f8f;font-size:13px;text-align:center;padding:40px;line-height:1.8}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }         from 'three/addons/postprocessing/SMAAPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

let GTAOPass = null;
try { ({ GTAOPass } = await import('three/addons/postprocessing/GTAOPass.js')); }
catch (e) { console.warn('[GTAO] 不可用，改用无 AO 管线', e); }

/* =========================================================================
   0. 工具函数
   ========================================================================= */
const lerp  = THREE.MathUtils.lerp;
const clamp = THREE.MathUtils.clamp;
const DEG   = Math.PI / 180;

let _seed = 20260829;
const srand = () => ((_seed = (_seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const sr    = (a = 0, b = 1) => a + srand() * (b - a);
const sri   = (a, b) => Math.floor(sr(a, b + 1));
const spick = arr => arr[Math.floor(srand() * arr.length) % arr.length];

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const setProg = (p, t) => {
  const b = document.getElementById('ldbar'), s = document.getElementById('ldst');
  if (b) b.style.width = Math.round(p * 100) + '%';
  if (t && s) s.textContent = t;
};

function fatal(msg) {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.innerHTML = msg;
  document.getElementById('loader').classList.add('hide');
}

/* ---------- 程序化贴图 ---------- */
function cv(size) { const c = document.createElement('canvas'); c.width = c.height = size; return c; }
function tex(canvas, { srgb = false, repeat = 1, aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = aniso;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  return t;
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 高度图 -> 法线贴图（Sobel） */
function heightToNormal(src, strength = 2.0) {
  const S = src.width;
  const sd = src.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, S, S).data;
  const out = cv(S), octx = out.getContext('2d');
  const img = octx.createImageData(S, S), d = img.data;
  const H = (x, y) => sd[(((y + S) % S) * S + ((x + S) % S)) * 4] / 255;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (H(x - 1, y) - H(x + 1, y)) * strength;
    const dy = (H(x, y - 1) - H(x, y + 1)) * strength;
    const nx = dx, ny = dy, nz = 1;
    const l = Math.hypot(nx, ny, nz), i = (y * S + x) * 4;
    d[i]     = (nx / l * .5 + .5) * 255;
    d[i + 1] = (ny / l * .5 + .5) * 255;
    d[i + 2] = (nz / l * .5 + .5) * 255;
    d[i + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  return out;
}

/** 装甲板法线：分块嵌板 + 铆钉 + 划痕 + 细噪 */
function makePanelNormal(S = 1024) {
  const c = cv(S), x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#808080'; x.fillRect(0, 0, S, S);
  const N = 8, cs = S / N;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const px = i * cs, py = j * cs;
    const inset = 3 + srand() * 5;
    x.fillStyle = '#6e6e6e';
    rrect(x, px + inset - 3, py + inset - 3, cs - 2 * inset + 6, cs - 2 * inset + 6, 4); x.fill();
    x.fillStyle = '#8b8b8b';
    rrect(x, px + inset, py + inset, cs - 2 * inset, cs - 2 * inset, 3); x.fill();
    if (srand() < .55) {
      x.fillStyle = '#989898';
      rrect(x, px + inset + 7, py + inset + 7, cs - 2 * inset - 14, cs - 2 * inset - 14, 2); x.fill();
    }
    if (srand() < .35) { // 检修口
      x.fillStyle = '#9d9d9d';
      const w = cs * .34, h = cs * .22;
      rrect(x, px + cs * .5 - w / 2, py + cs * .5 - h / 2, w, h, 2); x.fill();
    }
    // 铆钉
    x.fillStyle = '#adadad';
    const rn = 4, rr = inset + 5;
    for (let k = 0; k < rn; k++) {
      const a = k / rn * Math.PI * 2 + .6;
      x.beginPath();
      x.arc(px + cs / 2 + Math.cos(a) * (cs / 2 - rr), py + cs / 2 + Math.sin(a) * (cs / 2 - rr), 2.1, 0, 7);
      x.fill();
    }
  }
  // 划痕 / 磨损
  x.lineCap = 'round';
  for (let k = 0; k < 220; k++) {
    x.strokeStyle = srand() < .5 ? 'rgba(160,160,160,.5)' : 'rgba(70,70,70,.45)';
    x.lineWidth = srand() * 1.4 + .3;
    const sx = srand() * S, sy = srand() * S, a = srand() * Math.PI * 2, L = 6 + srand() * 60;
    x.beginPath(); x.moveTo(sx, sy);
    x.lineTo(sx + Math.cos(a) * L, sy + Math.sin(a) * L); x.stroke();
  }
  // 多尺度细噪：一层像素级噪点 + 一层低频起伏，避免近景下只剩平铺的大嵌板
  const id = x.getImageData(0, 0, S, S), dd = id.data;
  for (let i = 0; i < dd.length; i += 4) {
    const n = (srand() - .5) * 20 + (srand() - .5) * 10;
    dd[i] = dd[i + 1] = dd[i + 2] = clamp(dd[i] + n, 0, 255);
  }
  x.putImageData(id, 0, 0);
  // 微划痕（像素尺度）
  for (let k = 0; k < 260; k++) {
    x.strokeStyle = srand() < .5 ? 'rgba(150,150,150,.22)' : 'rgba(96,96,96,.20)';
    x.lineWidth = srand() * .9 + .2;
    const sx = srand() * S, sy = srand() * S, a = srand() * Math.PI * 2, L = 3 + srand() * 22;
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + Math.cos(a) * L, sy + Math.sin(a) * L); x.stroke();
  }
  return heightToNormal(c, 2.9);
}

/** 粗糙度变化图（油污 / 磨损亮边） */
function makeRough(S = 512) {
  const c = cv(S), x = c.getContext('2d');
  x.fillStyle = '#e6e6e6'; x.fillRect(0, 0, S, S);
  for (let k = 0; k < 90; k++) { // 油污斑
    const g = x.createRadialGradient(sr() * S, sr() * S, 0, sr() * S, sr() * S, sr(20, 90));
    g.addColorStop(0, 'rgba(120,120,120,.5)'); g.addColorStop(1, 'rgba(230,230,230,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
  }
  for (let k = 0; k < 400; k++) { // 磨损高光
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = sr(.5, 2.5);
    const sx = sr() * S, sy = sr() * S, a = sr() * 7, L = sr(8, 70);
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + Math.cos(a) * L, sy + Math.sin(a) * L); x.stroke();
  }
  return c;
}

/** 地面：暗色环氧地坪 + 淡网格 + 噪点 */
function makeFloor(S = 1024) {
  const c = cv(S), x = c.getContext('2d', { willReadFrequently: true });
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * .5);
  g.addColorStop(0, '#151a20'); g.addColorStop(.55, '#0d1116'); g.addColorStop(1, '#070a0d');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  x.strokeStyle = 'rgba(120,170,200,.055)'; x.lineWidth = 1;
  for (let i = 0; i <= 16; i++) {
    const p = i / 16 * S;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
  }
  x.strokeStyle = 'rgba(120,170,200,.10)';
  for (let i = 0; i <= 4; i++) {
    const p = i / 4 * S;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
  }
  const id = x.getImageData(0, 0, S, S), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - .5) * 12;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(id, 0, 0);
  return c;
}

/** 标识贴花 */
function makeDecal(kind = 'id') {
  const S = 512, c = cv(S), x = c.getContext('2d');
  x.clearRect(0, 0, S, S);
  x.fillStyle = 'rgba(226,238,248,.86)';
  if (kind === 'id') {
    x.font = '700 190px "Arial Black",Arial,sans-serif';
    x.textBaseline = 'middle'; x.fillText('07', 26, 210);
    x.font = '600 54px Arial,sans-serif';
    x.fillText('MK-VII', 26, 330);
    x.fillStyle = 'rgba(226,238,248,.5)';
    x.font = '400 34px "Courier New",monospace';
    x.fillText('XUANTIE / HVY-ARMOR', 26, 390);
    for (let i = 0; i < 26; i++) { // 条码
      x.fillStyle = i % 3 === 0 ? 'rgba(226,238,248,.75)' : 'rgba(226,238,248,.25)';
      x.fillRect(26 + i * 17, 424, sr(5, 13), 52);
    }
  } else {
    // 警示斜纹 + 高温标记
    x.save(); x.beginPath(); rrect(x, 20, 20, 472, 472, 12); x.clip();
    for (let i = -12; i < 26; i++) {
      x.fillStyle = i % 2 ? 'rgba(255,176,74,.85)' : 'rgba(30,26,22,.85)';
      x.save(); x.translate(i * 34, 0); x.transform(1, 0, -.6, 1, 0, 0);
      x.fillRect(0, -40, 24, 700); x.restore();
    }
    x.restore();
    x.fillStyle = 'rgba(20,20,22,.92)';
    rrect(x, 96, 170, 320, 172, 10); x.fill();
    x.fillStyle = 'rgba(255,190,110,.95)';
    x.font = '700 96px Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('CAUTION', 256, 228);
    x.font = '700 54px Arial,sans-serif';
    x.fillText('HOT SURFACE', 256, 302);
  }
  return c;
}

/** 脏迹 / 磨损 / 锈蚀 颜色贴图：与法线嵌板同网格布局，给纯色材质带来层次 */
function makeGrime(S = 1024, N = 8) {
  const c = cv(S), x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#d9d9d9'; x.fillRect(0, 0, S, S);
  const cs = S / N;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const px = i * cs, py = j * cs, inset = 3 + srand() * 5;
    x.fillStyle = 'rgba(70,74,80,.26)';                       // 嵌板缝积灰
    rrect(x, px + inset - 3, py + inset - 3, cs - 2 * inset + 6, cs - 2 * inset + 6, 4); x.fill();
    x.fillStyle = 'rgba(255,255,255,.16)';                    // 板面轻微色差
    rrect(x, px + inset, py + inset, cs - 2 * inset, cs - 2 * inset, 3); x.fill();
    if (srand() < .5) {                                        // 板面磨损露白
      x.fillStyle = 'rgba(255,255,255,.22)';
      rrect(x, px + inset + 7, py + inset + 7, cs - 2 * inset - 14, cs - 2 * inset - 14, 2); x.fill();
    }
  }
  for (let k = 0; k < 26; k++) {                               // 锈斑 / 油污
    const g = x.createRadialGradient(sr() * S, sr() * S, 0, sr() * S, sr() * S, sr(30, 130));
    const warm = srand() < .45;
    g.addColorStop(0, warm ? 'rgba(120,84,52,.26)' : 'rgba(46,50,56,.26)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
  }
  for (let k = 0; k < 300; k++) {                              // 流挂水痕
    x.strokeStyle = srand() < .6 ? 'rgba(58,62,68,.20)' : 'rgba(235,235,235,.16)';
    x.lineWidth = sr(.8, 4);
    const sx = sr() * S, sy = sr() * S, L = sr(20, 190);
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + sr(-8, 8), sy + L); x.stroke();
  }
  const id = x.getImageData(0, 0, S, S), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (srand() - .5) * 14;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }

   ========================================================================= */
function roundedShape(w, h, r) {
  r = Math.min(r, Math.min(w, h) * .49);
  const s = new THREE.Shape();
  const X = -w / 2, Y = -h / 2;
  s.moveTo(X + r, Y);
  s.lineTo(X + w - r, Y); s.quadraticCurveTo(X + w, Y, X + w, Y + r);
  s.lineTo(X + w, Y + h - r); s.quadraticCurveTo(X + w, Y + h, X + w - r, Y + h);
  s.lineTo(X + r, Y + h); s.quadraticCurveTo(X, Y + h, X, Y + h - r);
  s.lineTo(X, Y + r); s.quadraticCurveTo(X, Y, X + r, Y);
  return s;
}
const _bbCache = new Map();
/** 全边倒角长方体（硬表面关键：所有棱都有倒角，才能吃到高光） */
// seg=1 即单段倒角：这正是硬表面建模要的锐利斜面，且三角面只有多段细分的一半
function bevelBox(w, h, d, { bevel = .034, corner = .1, seg = 1 } = {}) {
  const key = `${w}|${h}|${d}|${bevel}|${corner}|${seg}`;
  if (_bbCache.has(key)) return _bbCache.get(key);
  const b = Math.min(bevel, Math.min(w, h, d) * .26);
  const shape = roundedShape(Math.max(.002, w - 2 * b), Math.max(.002, h - 2 * b), corner);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: Math.max(.002, d - 2 * b), bevelEnabled: true,
    bevelThickness: b, bevelSize: b, bevelSegments: seg, curveSegments: 4, steps: 1
  });
  g.center();
  _bbCache.set(key, g);
  return g;
}
/** 侧视轮廓 -> 沿 Z 挤出的车体块 */
function extrudeProfile(pts, depth, { bevel = .022, seg = 2 } = {}) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  const b = Math.min(bevel, depth * .3);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: Math.max(.002, depth - 2 * b), bevelEnabled: b > 0,
    bevelThickness: b, bevelSize: b, bevelSegments: seg, curveSegments: 1, steps: 1
  });
  g.translate(0, 0, -(depth - 2 * b) / 2);

}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3();
function M(pos = [0, 0, 0], rot = [0, 0, 0], scl = [1, 1, 1]) {
  return new THREE.Matrix4().compose(
    _v.set(pos[0], pos[1], pos[2]).clone(),
    _q.setFromEuler(_e.set(rot[0], rot[1], rot[2])).clone(),
    new THREE.Vector3(scl[0], scl[1], scl[2])
  );
}
/** 批量合并器：把成百上千个小件压成 1 个 draw call */
function Batch() {
  const arr = [];

    push(geo, pos, rot, scl) {
      const g = (geo.index ? geo.toNonIndexed() : geo.clone());
      g.applyMatrix4(M(pos, rot, scl));
      arr.push(g); return api;
    },
    box(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0, opt) { return api.push(bevelBox(w, h, d, opt), [x, y, z], [rx, ry, rz]); },
    raw(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) { return api.push(new THREE.BoxGeometry(w, h, d), [x, y, z], [rx, ry, rz]); },
    cyl(rt, rb, h, x, y, z, rx = 0, ry = 0, rz = 0, seg = 16) {

      const auto = clamp(Math.round(Math.max(rt, rb) * 260), 12, 48);
      return api.push(new THREE.CylinderGeometry(rt, rb, h, Math.max(seg, auto), 1), [x, y, z], [rx, ry, rz]);

}

  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = shadow; m.receiveShadow = shadow;

}

  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), closed, 'catmullrom', .35);
  const g = new THREE.TubeGeometry(curve, Math.max(12, points.length * seg), radius, rad, closed);

const TR = { xF: 2.35, xR: -2.35, cy: .64, r: .585, z: 1.5, halfW: .31, pitch: .205 };
const WHEEL_X = [-1.72, -1.11, -.50, .11, .72, 1.33];
const WHEEL_Y = .405, WHEEL_Z = 1.45;
function trackProfile() {
  const p = [];
  const push = (x, y) => p.push(new THREE.Vector2(x, y));
  const N = 26;
  for (let i = 0; i <= N; i++) push(lerp(TR.xR, TR.xF, i / N), TR.cy - TR.r + .006);
  for (let i = 1; i <= 15; i++) { const a = -Math.PI / 2 + (i / 15) * Math.PI; push(TR.xF + Math.cos(a) * TR.r, TR.cy + Math.sin(a) * TR.r); }
  for (let i = 1; i <= N; i++) push(lerp(TR.xF, TR.xR, i / N), TR.cy + TR.r - .006);
  for (let i = 1; i < 15; i++) { const a = Math.PI / 2 + (i / 15) * Math.PI; push(TR.xR + Math.cos(a) * TR.r, TR.cy + Math.sin(a) * TR.r); }
  return p;
}
function pathLUT(pts, samples = 1200) {
  const closed = pts.concat([pts[0]]);
  const seg = []; let total = 0;
  for (let i = 0; i < closed.length - 1; i++) { const d = closed[i].distanceTo(closed[i + 1]); seg.push(d); total += d; }
  const lut = new Float32Array(samples * 3);
  let si = 0, acc = 0;
  for (let s = 0; s < samples; s++) {
    const target = total * s / samples;
    while (si < seg.length - 1 && acc + seg[si] < target) { acc += seg[si]; si++; }
    const t = seg[si] > 0 ? (target - acc) / seg[si] : 0;
    const a = closed[si], b = closed[si + 1];
    lut[s * 3]     = lerp(a.x, b.x, t);
    lut[s * 3 + 1] = lerp(a.y, b.y, t);
    lut[s * 3 + 2] = Math.atan2(b.y - a.y, b.x - a.x);
  }
  return { lut, samples, total };
}
function sampleLUT(L, s) {
  let f = (s / L.total) * L.samples;
  f = ((f % L.samples) + L.samples) % L.samples;
  const i = Math.floor(f), j = (i + 1) % L.samples, t = f - i;
  let d = L.lut[j * 3 + 2] - L.lut[i * 3 + 2];
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return { x: lerp(L.lut[i * 3], L.lut[j * 3], t), y: lerp(L.lut[i * 3 + 1], L.lut[j * 3 + 1], t), a: L.lut[i * 3 + 2] + d * t };
}

const BOLTS = [];                     // {p:[x,y,z], n:[x,y,z], s}
function bolt(x, y, z, nx, ny, nz, s = 1) { BOLTS.push({ p: [x, y, z], n: [nx, ny, nz], s }); }
/** 在一块面板四周撒螺栓 */
function boltRing(x, y, z, w, h, nx, ny, nz, { n = 4, s = 1, axis = 'xy' } = {}) {
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const u = (i / (n - 1) - .5) * w, v = (j / (n - 1) - .5) * h;
    if (i > 0 && i < n - 1 && j > 0 && j < n - 1) continue;
    if (axis === 'xy') bolt(x + u, y + v, z, nx, ny, nz, s);
    else if (axis === 'zy') bolt(x, y + v, z + u, nx, ny, nz, s);
    else bolt(x + u, y, z + v, nx, ny, nz, s);
  }
}

/** 沿一条直线布螺栓 */
function boltLine(x0, y0, z0, x1, y1, z1, n, nx, ny, nz, s = 1) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? .5 : i / (n - 1);
    bolt(lerp(x0, x1, t), lerp(y0, y1, t), lerp(z0, z1, t), nx, ny, nz, s);
  }
}

/* 环境光照：程序化 HDR 影棚（等距柱状投影）→ PMREM 预滤波。
   直接生成 HDR 数据贴图，避免用 fromScene 渲染代理场景带来的采样瑕疵。 */
function makeHDREnv(W = 512, H = 256) {
  // 柔光灯箱：az = 方位角，p = 与 +Y 的极角，ar = 角半径（半强度），c = HDR 颜色
  const lamps = [
    { az: 0.55, p: 0.42, ar: 0.60, c: [3.4, 3.5, 3.7] },   // 主光箱
    { az: 3.55, p: 1.20, ar: 0.55, c: [0.50, 0.80, 1.30] }, // 冷侧光
    { az: 5.65, p: 1.30, ar: 0.50, c: [1.10, 0.60, 0.30] }, // 暖侧光
    { az: 1.20, p: 2.55, ar: 1.00, c: [0.32, 0.40, 0.52] }  // 地面反弹
  ];
  const SKY = [0.185, 0.235, 0.305], HOR = [0.085, 0.105, 0.135], GRD = [0.030, 0.036, 0.046];
  const dirs = lamps.map(l => ({
    d: [Math.sin(l.p) * Math.cos(l.az), Math.cos(l.p), Math.sin(l.p) * Math.sin(l.az)],
    k: Math.log(0.5) / Math.log(Math.cos(l.ar)),
    c: l.c
  }));
  const data = new Float32Array(W * H * 4);
  for (let y = 0; y < H; y++) {
    const pol = (y + .5) / H * Math.PI, sp = Math.sin(pol), cp = Math.cos(pol);
    for (let x = 0; x < W; x++) {
      const az2 = (x + .5) / W * Math.PI * 2;
      const dx = sp * Math.cos(az2), dy = cp, dz = sp * Math.sin(az2);
      const t = Math.abs(dy), A = dy >= 0 ? HOR : HOR, B = dy >= 0 ? SKY : GRD;
      let r = lerp(A[0], B[0], t), g = lerp(A[1], B[1], t), b = lerp(A[2], B[2], t);
      for (const L of dirs) {
        const c = dx * L.d[0] + dy * L.d[1] + dz * L.d[2];
        if (c > 0) { const w = Math.pow(c, L.k); r += L.c[0] * w; g += L.c[1] * w; b += L.c[2] * w; }
      }
      const i = (y * W + x) * 4;
      data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 1;
    }
  }
  const t = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.NoColorSpace;   // 线性 HDR
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

function studioEnv() {
  const pm = new THREE.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  const src = makeHDREnv();
  const t = pm.fromEquirectangular(src).texture;
  pm.dispose();
  src.dispose();
  return t;
}

    const el = document.createElement('div');
    el.className = 'sw' + (state[key] ? ' on' : '');
    el.innerHTML = `<span>${label}</span><span style="display:flex;gap:6px;align-items:center">${kbd ? `<kbd>${kbd}</kbd>` : ''}<i></i></span>`;
    el.onclick = () => {
      state[key] = !state[key];
      el.classList.toggle('on', state[key]);
      onToggle(key, state[key]);
    };
    host.appendChild(el);
  });
}
switchBox(document.getElementById('dynBox'), [
  ['autoRotate', '自动环绕', 'R'], ['drive', '履带行进', 'T'],
  ['turretScan', '炮塔扫描', 'Y'], ['explode', '爆炸视图', 'E']
]);
switchBox(document.getElementById('renBox'), [
  ['post', '后期处理'], ['ao', '环境光遮蔽'], ['bloomOn', '辉光'],
  ['wire', '线框', 'W'], ['showFloor', '地面', 'G'], ['lights', '车灯', 'L']
]);
document.querySelector('#renBox .sw:nth-child(2)').style.display = gtao ? '' : 'none';
if (!gtao) state.ao = false;

function onToggle(k, v) {
  if (k === 'showFloor') { floor.visible = v; ring.visible = ring2.visible = v; }
  if (k === 'wire') {
    tank.traverse(o => {
      if (o.isMesh || o.isInstancedMesh) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { if ('wireframe' in m) m.wireframe = v; });
      }
    });
  }
  if (k === 'lights') { headL.visible = headR.visible = v; thrL.visible = thrR.visible = v; plumes.forEach(p => p.visible = v); }
  if (k === 'bloomOn') bloom.enabled = v;
  if (k === 'ao' && gtao) gtao.enabled = v;
  if (k === 'post') { /* 见下方重建 */ rebuildPost(); }
}

let postEnabled = true;
function rebuildPost() {
  postEnabled = state.post;
  bloom.enabled = state.post && state.bloomOn;
  if (gtao) gtao.enabled = state.post && state.ao;
  smaa.enabled = state.post;
}
rebuildPost();

/* 动作按钮 */
document.getElementById('btnShot').onclick = () => {
  composer.render();
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'MK-VII-XUANTIE.png';
  a.click();
};
document.getElementById('btnReset').onclick = () => gotoCam('hero');

addEventListener('keydown', e => {
  const map = { r: 'autoRotate', t: 'drive', y: 'turretScan', e: 'explode', w: 'wire', g: 'showFloor', l: 'lights' };
  const k = e.key.toLowerCase();
  if (k === 'h') { document.getElementById('hud').classList.toggle('hide'); return; }
  if (k === 'p') { document.getElementById('btnShot').click(); return; }
  if (k >= '1' && k <= '6') {
    const keys = ['hero', 'front', 'side', 'rear', 'top', 'detail'];
    gotoCam(keys[+k - 1]);
    [...camRow.children].forEach((c, i) => c.classList.toggle('on', i === +k - 1));
    return;
  }
  if (map[k]) {
    const isRen = map[k] === 'wire' || map[k] === 'showFloor' || map[k] === 'lights';
    const host = isRen ? document.getElementById('renBox') : document.getElementById('dynBox');
    const order = isRen ? ['post', 'ao', 'bloomOn', 'wire', 'showFloor', 'lights']
                        : ['autoRotate', 'drive', 'turretScan', 'explode'];
    const i = order.indexOf(map[k]);
    if (i >= 0 && host.children[i]) host.children[i].click();
  }
});

/* 自适应 */
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  const pr = renderer.getPixelRatio();
  smaa.setSize(w * pr, h * pr);
}
addEventListener('resize', onResize);
onResize();

/* =========================================================================
   9. 动画循环
   ========================================================================= */
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3(1, 1, 1);
const ZAX = new THREE.Vector3(0, 0, 1);
const clock = new THREE.Clock();
let trackOff = 0, wheelAng = 0, explodeAmt = 0, fpsAcc = 0, fpsN = 0, fpsT = 0;
const basePos = new Map();

function updateTracks(dt, v) {
  const { LUT, linkCount, links, wheels } = rig;
  trackOff -= v * dt;                      // 前进时下支履带向后
  wheelAng -= (v / .30) * dt;
  const per = LUT.total / linkCount;
  let i = 0;
  for (const side of [1, -1]) {
    for (let k = 0; k < linkCount; k++) {
      const s = k * per + trackOff;
      const p = sampleLUT(LUT, (s % LUT.total + LUT.total) % LUT.total);
      tmpV.set(p.x, p.y, side * TR.z);
      tmpQ.setFromAxisAngle(ZAX, p.a);
      tmpM.compose(tmpV, tmpQ, tmpS);
      links.setMatrixAt(i++, tmpM);
    }
  }
  links.instanceMatrix.needsUpdate = true;
  // 负重轮
  let j = 0;
  for (const side of [1, -1]) for (const x of WHEEL_X) {
    tmpV.set(x, WHEEL_Y, side * WHEEL_Z);
    tmpQ.setFromAxisAngle(ZAX, wheelAng + (x * 0.0));
    tmpM.compose(tmpV, tmpQ, tmpS);
    wheels.setMatrixAt(j++, tmpM);
  }
  wheels.instanceMatrix.needsUpdate = true;
}

function updateExplode(dt) {
  const target = state.explode ? 1 : 0;
  explodeAmt += (target - explodeAmt) * Math.min(1, dt * 4.2);
  const groups = [G.tub, G.upper, G.turret, G.gun, G.radar, G.rear, G.front, G.fenderL, G.fenderR, G.trackL, G.trackR];
  groups.forEach(g => {
    if (!g || !g.userData.explode) return;
    if (!basePos.has(g)) basePos.set(g, g.position.clone());
    const b = basePos.get(g);
    g.position.set(
      b.x + g.userData.explode.x * explodeAmt,
      b.y + g.userData.explode.y * explodeAmt,
      b.z + g.userData.explode.z * explodeAmt
    );
  });
}

const sTri = document.getElementById('sTri'), sCall = document.getElementById('sCall'), sFps = document.getElementById('sFps');
let statTick = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  // 相机补间
  if (camTween) {
    const k = clamp((performance.now() - camTween.t0) / camTween.ms, 0, 1);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0v, camTween.t1v, e);
    if (k >= 1) camTween = null;
  }

  updateTracks(dt, state.drive ? 2.6 : 0);
  updateExplode(dt);

  // 炮塔扫描（幅度保持小，避免与车体之间的线缆脱开）
  if (state.turretScan) G.turret.rotation.y = Math.sin(t * .18) * .13;
  G.radar.rotation.y += dt * 1.4;
  G.gun.rotation.z = Math.sin(t * .32) * .035;

  // 推进器：怠速微亮，行进时加力
  const pulse = .5 + .5 * Math.sin(t * 3.1);
  const boost = state.drive ? 5.5 : 0;
  thrL.intensity = thrR.intensity = 1.5 + pulse * 1.1 + boost;
  plumes.forEach((m, i) => {
    const p2 = .5 + .5 * Math.sin(t * 11 + i * 2.1);
    m.material.opacity = (state.drive ? .58 : .32) + p2 * .1;
    m.scale.x = (state.drive ? 1.3 : .9) + p2 * .12;
  });
  const pulse2 = .5 + .5 * Math.sin(t * 1.7 + 1.2);
  ring.material.opacity = .26 + pulse2 * .16;

  controls.autoRotate = state.autoRotate && !camTween;
  controls.update();

  renderer.info.reset();
  if (state.post) composer.render(); else renderer.render(scene, camera);

  // 统计
  fpsAcc += dt; fpsN++;
  if (fpsAcc - fpsT > .5) { sFps.textContent = Math.round(fpsN / (fpsAcc - fpsT)); fpsT = fpsAcc; fpsN = 0; }
  if ((statTick = (statTick + 1) % 30) === 1) {
    const info = renderer.info.render;
    sTri.textContent = (info.triangles / 1000).toFixed(0) + 'k';
    sCall.textContent = info.calls;
  }
}

/* 首帧前：把摄像机补间到英雄机位并启动 */
setProg(.92, '编译着色器');
await nextFrame();
renderer.compile(scene, camera);
setProg(1, '就绪');
await nextFrame();
setTimeout(() => document.getElementById('loader').classList.add('hide'), 260);

controls.autoRotate = state.autoRotate;
animate();

/* 暴露调试入口 */
window.TANK = { THREE, scene, camera, renderer, controls, composer, tank, state, G, gotoCam, applyPreset };
</script>
