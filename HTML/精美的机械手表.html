<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AETERNUM · Calibre AK-01 Squelette — 交互式 3D 镂空机械腕表</title>
<style>
  :root{
    --gold:#c9a961; --gold-lt:#e9d09a; --txt:#e7e3da; --dim:#9a958b;
    --line:rgba(201,169,97,.22); --glass:rgba(16,17,20,.62);
    --serif:"Optima","Palatino Linotype","Didot","Songti SC","Times New Roman",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#050608;color:var(--txt);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #bg{position:fixed;inset:0;z-index:0;
    background:radial-gradient(125% 92% at 50% 6%, #262b34 0%, #161a20 32%, #0b0d12 60%, #050608 100%);
    transition:filter 1s cubic-bezier(.4,0,.2,1)}
  #bg::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(72% 62% at 50% 46%, transparent 0%, rgba(0,0,0,.42) 70%, rgba(0,0,0,.86) 100%);
    transition:background 1s ease}
  body.lume #bg{filter:brightness(.16) saturate(.35)}
  body.lume #bg::after{background:radial-gradient(58% 52% at 50% 46%, transparent 0%, rgba(0,0,0,.62) 68%, rgba(0,0,0,.96) 100%)}
  canvas{position:fixed;inset:0;z-index:1;display:block;touch-action:none}

  /* 加载 */
  #loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;background:#050608;transition:opacity .9s ease,visibility .9s}
  #loader.hide{opacity:0;visibility:hidden}
  .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(201,169,97,.16);position:relative}
  .ring::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;
    border-top-color:var(--gold);animation:spin 1.15s linear infinite}
  .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid transparent;
    border-bottom-color:rgba(201,169,97,.45);animation:spin 1.8s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .lg{font-family:var(--serif);letter-spacing:.46em;font-size:15px;color:var(--gold);text-indent:.46em}
  #loader .st{font-size:10px;letter-spacing:.3em;color:#6e6a62;text-transform:uppercase}
  #loadErr{max-width:460px;text-align:center;font-size:12px;line-height:1.8;color:#cf8f8f;display:none;padding:0 24px}

  /* 顶栏 */
  header{position:fixed;z-index:20;left:34px;top:30px;pointer-events:none;opacity:0;
    animation:fi 1.3s ease .5s forwards}
  @keyframes fi{to{opacity:1}}
  header .brand{font-family:var(--serif);font-size:19px;letter-spacing:.42em;color:#f2eee5;text-indent:.42em}
  header .sub{font-family:var(--serif);font-size:10.5px;letter-spacing:.32em;color:var(--gold);margin-top:7px;text-indent:.32em}
  header .rule{width:40px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:12px}

  #hud{position:fixed;z-index:20;right:30px;top:32px;text-align:right;pointer-events:none;
    font-size:10px;letter-spacing:.2em;color:var(--dim);line-height:2;opacity:0;
    animation:fi 1.3s ease .9s forwards}
  #hud b{color:var(--gold);font-weight:500}
  #hud .k{color:#6b6760}

  /* 控制台 */
  #dock{position:fixed;z-index:30;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:stretch;gap:2px;padding:5px;background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,.07);border-radius:14px;
    box-shadow:0 22px 60px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0;animation:fu 1.1s cubic-bezier(.2,.9,.25,1) 1s forwards;
    max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
  @keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(18px)}
                to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .btn{border:0;background:transparent;color:var(--txt);font-family:var(--sans);font-size:11.5px;
    letter-spacing:.14em;padding:11px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;
    transition:background .28s,color .28s,transform .18s}
  .btn:hover{background:rgba(255,255,255,.055);color:#fff}
  .btn:active{transform:scale(.96)}
  .btn .en{display:block;font-size:8.5px;letter-spacing:.16em;color:#6f6a61;margin-top:2px;transition:color .28s}
  .btn:hover .en{color:#a2957a}
  .btn.on{color:#0d0e10;background:linear-gradient(180deg,#dcc188,#b99a55);
    box-shadow:0 4px 16px rgba(201,169,97,.28)}
  .btn.on .en{color:rgba(13,14,16,.6)}
  .sep{width:1px;background:rgba(255,255,255,.09);margin:6px 5px}

  /* 信息面板 */
  #panel{position:fixed;z-index:28;right:26px;top:50%;transform:translate(26px,-50%);
    width:330px;max-height:76vh;overflow:auto;padding:26px 26px 22px;
    background:linear-gradient(155deg,rgba(22,24,28,.92),rgba(11,12,15,.94));
    backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.74),inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0;pointer-events:none;scrollbar-width:thin;
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.25,1)}
  #panel.show{opacity:1;transform:translate(0,-50%);pointer-events:auto}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:rgba(201,169,97,.35);border-radius:4px}
  #panel .idx{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--gold);opacity:.85}
  #panel h2{font-family:var(--serif);font-size:25px;font-weight:400;margin:10px 0 3px;
    letter-spacing:.06em;color:#f5f2ea}
  #panel .en2{font-size:9.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  #panel .hr{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:18px 0 15px}
  #panel .desc{font-size:12.5px;line-height:2;color:#c4c0b6}
  #panel .specs{margin-top:18px;border-top:1px solid rgba(255,255,255,.06)}
  #panel .row{display:flex;justify-content:space-between;gap:14px;padding:9.5px 0;
    border-bottom:1px solid rgba(255,255,255,.055);font-size:11px}
  #panel .row .k{color:#7d786e;letter-spacing:.09em;flex:0 0 auto}
  #panel .row .v{color:#e2ddd1;text-align:right}
  #pClose{position:absolute;right:15px;top:15px;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#9a958b;
    cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:.25s}
  #pClose:hover{background:rgba(201,169,97,.16);color:var(--gold-lt);border-color:var(--line)}

  /* 标签 */
  #leaders{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:visible}
  #labels{position:fixed;inset:0;z-index:14;pointer-events:none}
  .lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;letter-spacing:.12em;
    color:#efe9db;padding:4px 10px 4px 9px;border-radius:7px;
    background:linear-gradient(180deg,rgba(20,22,26,.92),rgba(10,11,14,.94));
    border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 26px rgba(0,0,0,.55);
    opacity:0;transition:opacity .34s ease,border-color .34s,background .34s;
    will-change:transform;pointer-events:none}
  .lab .n{font-size:8.5px;color:var(--gold);letter-spacing:.1em;display:block;margin-top:2px;opacity:.75}
  .lab.on{opacity:1;pointer-events:auto;cursor:pointer}
  .lab.on:hover{border-color:var(--gold)}
  .lab.sel{background:linear-gradient(180deg,rgba(213,182,116,.96),rgba(160,131,68,.96));
    color:#10110f;border-color:#e8d5a2}
  .lab.sel .n{color:rgba(16,17,15,.66)}
  .lab.dim{opacity:.3}
  .dot{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
    background:#f4e9cb;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 12px rgba(255,228,160,.6);
    opacity:0;transition:opacity .3s;pointer-events:none;will-change:transform}
  .dot.on{opacity:.92}
  .dot.pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1px solid rgba(233,208,146,.65);animation:pl 2.4s ease-out infinite}
  @keyframes pl{0%{transform:scale(.5);opacity:.95}70%,100%{transform:scale(2);opacity:0}}

  #hint{position:fixed;z-index:16;left:34px;bottom:34px;font-size:10px;letter-spacing:.18em;
    color:#5d5952;line-height:2.1;pointer-events:none;opacity:0;animation:fi 1.4s ease 1.7s forwards}
  #hint b{color:#8d857a;font-weight:400}

  @media (max-width:900px){
    header{left:20px;top:20px} header .brand{font-size:15px} header .sub{font-size:8.5px}
    #hud{right:16px;top:22px;font-size:9px}
    #panel{width:min(90vw,330px);right:12px}
    #hint{display:none}
    .btn{padding:9px 11px;font-size:10.5px}
    #dock{bottom:12px}
  }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<svg id="leaders"></svg>
<div id="labels"></div>

<header>
  <div class="brand">AETERNUM</div>
  <div class="sub">CALIBRE AK-01 · SQUELETTE</div>
  <div class="rule"></div>
</header>

<div id="hud">

</div>

<div id="dock">
  <button class="btn" id="bExplode">爆炸视图<span class="en">EXPLODED</span></button>

  <button class="btn" id="bRotate">自动旋转<span class="en">ORBIT</span></button>

</div>

  <div class="ring"></div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { Reflector }       from 'three/addons/objects/Reflector.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════════ 0 · 工具 ═══════════════ */
const TAU = Math.PI*2, D2R = Math.PI/180;
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const easeIO = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const angleOf = (dx,dz) => Math.atan2(-dz, dx);

/* ═══════════════ 1 · 程序化贴图 ═══════════════ */
const cnv = s => { const c=document.createElement('canvas'); c.width=c.height=s; return c; };
function toTex(c, srgb=false){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function texPerlage(){
  const S=1024, c=cnv(S), g=c.getContext('2d');
  g.fillStyle='#a2a2a2'; g.fillRect(0,0,S,S);
  const step=46, r=30;
  for (let y=-r,row=0; y<S+r; y+=step*0.86, row++){
    for (let x=-r; x<S+r; x+=step){
      const ox = x + (row%2 ? step/2 : 0);
      const v = 0.55 + Math.random()*0.15;
      const grd = g.createRadialGradient(ox-r*0.32,y-r*0.32,r*0.08, ox,y,r);
      const hi = Math.min(255,(v*1.14*255)|0), md = (v*255)|0;
      grd.addColorStop(0,`rgb(${hi},${hi},${hi})`);
      grd.addColorStop(0.70,`rgb(${md},${md},${md})`);
      grd.addColorStop(1,'rgb(90,90,90)');
      g.fillStyle=grd; g.beginPath(); g.arc(ox,y,r,0,TAU); g.fill();
    }
  }
  return toTex(c);
}
function texGeneva(){
  const S=1024, c=cnv(S), g=c.getContext('2d');
  g.fillStyle='#8c8c8c'; g.fillRect(0,0,S,S);
  for (let i=-40;i<60;i++){
    g.beginPath();
    g.strokeStyle = (i%2) ? '#c4c4c4' : '#5a5a5a';
    g.lineWidth = S/120;
    g.arc(S/2 + i*(S/54), S*2.35, S*1.9, 0, TAU);
    g.stroke();
  }
  for (let n=0;n<8000;n++){
    g.fillStyle=`rgba(255,255,255,${Math.random()*0.03})`;
    g.fillRect(Math.random()*S,Math.random()*S,2,2);
  }
  return toTex(c);
}
function texSunray(){
  const S=1024, c=cnv(S), g=c.getContext('2d');
  g.fillStyle='#8f8f8f'; g.fillRect(0,0,S,S);
  for (let r=2;r<S*0.78;r+=2.4){
    g.beginPath();
    g.strokeStyle=(Math.floor(r/2.4)%2)?'#cacaca':'#575757';
    g.lineWidth=1.5; g.arc(S/2,S/2,r,0,TAU); g.stroke();
  }
  return toTex(c);
}
function texLeather(){
  const S=1024, c=cnv(S), g=c.getContext('2d');
  g.fillStyle='#2b1f17'; g.fillRect(0,0,S,S);
  const cols=5, rows=6, cw=S/cols, ch=S/rows;
  const rr=(x,y,w,h,r)=>{
    g.beginPath();
    g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
    g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
    g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
    g.closePath();
  };
  for (let r=0;r<rows;r++) for (let i=-1;i<=cols;i++){
    const jx=(Math.random()-0.5)*cw*0.10, jy=(Math.random()-0.5)*ch*0.10;
    const x=(i+(r%2?0.5:0))*cw + jx, y=r*ch + jy;
    const w=cw*(0.80+Math.random()*0.08), h=ch*(0.76+Math.random()*0.10);
    const px=x+w/2, py=y+h/2, rad=Math.min(w,h)*0.22;
    const v=0.33+Math.random()*0.17;
    const grd=g.createRadialGradient(px-w*0.20,py-h*0.20,w*0.05, px,py,Math.max(w,h)*0.70);
    grd.addColorStop(0,`rgb(${(v*1.62*255)|0},${(v*1.28*255)|0},${(v*1.04*255)|0})`);
    grd.addColorStop(0.60,`rgb(${(v*0.94*255)|0},${(v*0.74*255)|0},${(v*0.57*255)|0})`);
    grd.addColorStop(1,'rgb(24,17,12)');
    g.fillStyle=grd; rr(x,y,w,h,rad); g.fill();
    g.strokeStyle='rgba(255,232,200,0.13)'; g.lineWidth=2.6; g.stroke();
  }
  for (let n=0;n<20000;n++){
    g.fillStyle=`rgba(255,255,255,${Math.random()*0.02})`;
    g.fillRect(Math.random()*S,Math.random()*S,2,2);
  }
  return toTex(c,true);
}
function texText(text,{w=1024,h=220,font='500 92px "Times New Roman",Georgia,serif',
                       color='#ffffff',tracking=24}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.font=font; g.textBaseline='middle'; g.fillStyle=color;
  const chars=[...text], ws=chars.map(ch=>g.measureText(ch).width);
  const total=ws.reduce((a,b)=>a+b,0)+tracking*(chars.length-1);
  let x=(w-total)/2;
  chars.forEach((ch,i)=>{ g.fillText(ch,x,h/2); x+=ws[i]+tracking; });
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
function texFade(){
  const S=512,c=cnv(S),g=c.getContext('2d');
  const grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0.00,'rgba(0,0,0,0)');
  grd.addColorStop(0.26,'rgba(0,0,0,0.14)');
  grd.addColorStop(0.52,'rgba(3,4,6,0.58)');
  grd.addColorStop(0.78,'rgba(4,5,7,0.92)');
  grd.addColorStop(1.00,'rgba(4,5,7,1)');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  return toTex(c,true);
}

/* ═══════════════ 2 · 渲染器 / 相机 / 后期 ═══════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setClearAlpha(0);
renderer.outputColorSpace    = THREE.SRGBColorSpace;
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.87;
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(31, 1, 0.5, 4000);
const HOME_POS = new THREE.Vector3(52, 74, 44);
const HOME_TGT = new THREE.Vector3(0, 6.8, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {
  enableDamping:true, dampingFactor:0.055, rotateSpeed:0.72, zoomSpeed:0.78,
  enablePan:false, minDistance:44, maxDistance:320,
  minPolarAngle:0.03, maxPolarAngle:1.415,
  autoRotate:true, autoRotateSpeed:0.44
});
controls.target.copy(HOME_TGT);

const MAXPIX = 1_680_000;
function applyPixelRatio(){
  const w=innerWidth,h=innerHeight;
  const dpr=Math.min(devicePixelRatio||1,2);
  const cap=Math.sqrt(MAXPIX/Math.max(1,w*h));
  renderer.setPixelRatio(Math.min(dpr, Math.max(0.6,cap)));
  renderer.setSize(w,h,false);
}
applyPixelRatio();

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.20, 0.40, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ═══════════════ 3 · 影棚 HDRI 环境 ═══════════════ */
function buildStudioEnv(){
  const s = new THREE.Scene();
  const S=512, c=cnv(S), g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,S);
  grd.addColorStop(0.00,'#3c434e');
  grd.addColorStop(0.34,'#1e232b');
  grd.addColorStop(0.62,'#0e1116');
  grd.addColorStop(1.00,'#05060a');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  s.add(new THREE.Mesh(
    new THREE.SphereGeometry(900,40,24),
    new THREE.MeshBasicMaterial({map:toTex(c,true), side:THREE.BackSide, depthWrite:false})

/* ═══════════════ 7 · 几何构造器 ═══════════════ */
function gearGeometry({teeth,radius,thickness,toothH=null,spokes=0,hubK=0.30,
                       arbor=0.055,solid=false,bevel=0.032,tipRatio=0.42,sample=3}){
  const th = toothH ?? Math.max(0.34, radius*0.115);
  const add = th*0.58, ded = th*0.42;
  const rt = radius+add, rr = radius-ded;
  const pitch = TAU/teeth;
  const hwR = pitch*0.475, hwT = pitch*tipRatio*0.5;
  const P=(a,r)=>[Math.cos(a)*r, Math.sin(a)*r];
  const shape = new THREE.Shape();
  for (let i=0;i<teeth;i++){
    const c=i*pitch;
    if (i===0) shape.moveTo(...P(c-hwR,rr));
    else for (let k=1;k<=sample;k++) shape.lineTo(...P(lerp(c-pitch+hwR,c-hwR,k/sample),rr));
    shape.quadraticCurveTo(...P(c-hwR*0.72, rr+(rt-rr)*0.55), ...P(c-hwT,rt));
    for (let k=1;k<=sample;k++) shape.lineTo(...P(lerp(c-hwT,c+hwT,k/sample),rt));
    shape.quadraticCurveTo(...P(c+hwR*0.72, rr+(rt-rr)*0.55), ...P(c+hwR,rr));
  }
  shape.closePath();
  if (!solid && spokes>0){
    const rIn = Math.max(0.30, hubK*radius*0.92), rOut = rr*0.84;
    for (let s=0;s<spokes;s++){
      const c = s*TAU/spokes + Math.PI/spokes, hw = (TAU/spokes)*0.315;
      const h = new THREE.Path();
      h.moveTo(...P(c-hw,rOut));
      h.absarc(0,0,rOut, c-hw, c+hw, false);
      h.absarc(0,0,rIn,  c+hw, c-hw, true);
      h.closePath();
      shape.holes.push(h);
    }
  }
  if (arbor>0){ const h=new THREE.Path(); h.absarc(0,0,arbor,0,TAU,false); shape.holes.push(h); }
  const g = new THREE.ExtrudeGeometry(shape,{depth:thickness,bevelEnabled:bevel>0,
    bevelThickness:bevel,bevelSize:bevel,bevelSegments:1,steps:1,curveSegments:sample});
  g.rotateX(-Math.PI/2);
  g.computeVertexNormals();
  return g;
}
function escapeWheelGeometry({teeth=15,rTip=1.62,rRoot=1.26,thickness=0.28}={}){
  const p=TAU/teeth;
  const P=(a,r)=>[Math.cos(a)*r,Math.sin(a)*r];
  const shape=new THREE.Shape();
  for (let i=0;i<teeth;i++){
    const c=i*p;
    const pts=[[c-p*0.42,rRoot],[c-p*0.40,rTip*0.80],[c-p*0.20,rTip],
               [c+p*0.06,rTip*0.995],[c+p*0.13,rTip*0.70],[c+p*0.42,rRoot]];
    pts.forEach(([a,r],k)=>{ (i===0&&k===0)?shape.moveTo(...P(a,r)):shape.lineTo(...P(a,r)); });
    for (let k=1;k<=2;k++) shape.lineTo(...P(lerp(c+p*0.42,c+p-p*0.42,k/2),rRoot));
  }
  shape.closePath();
  const hub=new THREE.Path(); hub.absarc(0,0,0.30,0,TAU,false); shape.holes.push(hub);
  for (let s=0;s<4;s++){
    const c=s*TAU/4+Math.PI/4, hw=TAU/4*0.30;
    const h=new THREE.Path();
    h.moveTo(...P(c-hw,rRoot*0.80));
    h.absarc(0,0,rRoot*0.80,c-hw,c+hw,false);
    h.absarc(0,0,0.42,c+hw,c-hw,true);
    h.closePath(); shape.holes.push(h);
  }
  const g=new THREE.ExtrudeGeometry(shape,{depth:thickness,bevelEnabled:true,
    bevelThickness:0.022,bevelSize:0.022,bevelSegments:1,steps:1,curveSegments:4});
  g.rotateX(-Math.PI/2);
  g.computeVertexNormals();
  return g;
}

function stripFromSpiral({turns=9.5,r0=2.35,r1=5.38,y0=0,y1=0.28,
                          height=1.06,thickness=0.09,steps=520}={}){
  const pos=[],idx=[];
  for (let i=0;i<=steps;i++){
    const t=i/steps, a=t*turns*TAU, r=lerp(r0,r1,t), y=lerp(y0,y1,t);
    const cx=Math.cos(a)*r, cz=Math.sin(a)*r, nx=Math.cos(a), nz=Math.sin(a);
    const h2=height/2, t2=thickness/2;
    pos.push(cx-nx*t2,y-h2,cz-nz*t2,  cx+nx*t2,y-h2,cz+nz*t2,
             cx-nx*t2,y+h2,cz-nz*t2,  cx+nx*t2,y+h2,cz+nz*t2);
    if (i<steps){
      const b=i*4;
      for (const [a1,b1,c1,d1] of [[0,1,3,2],[2,3,7,6],[6,7,5,4],[4,5,1,0]])
        idx.push(b+a1,b+b1,b+c1, b+a1,b+c1,b+d1);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const CROSS=[[-1,-1],[1,-1],[1,0.52],[0.42,1],[-0.42,1],[-1,0.52]];
function strapGeometry(path,widthFn,thickFn,segs=110){
  const pos=[],idx=[],uvs=[];
  for (let i=0;i<=segs;i++){
    const t=i/segs, p=path(t), d=path.derivative(t);
    const L=Math.hypot(d.x,d.z)||1, ux=-d.z/L, uz=d.x/L;
    const w=widthFn(t)/2, h=thickFn(t)/2;
    for (const [cu,cy] of CROSS){
      pos.push(p.x+ux*w*cu, p.y+h*cy, p.z+uz*w*cu);
      uvs.push(cu*0.5+0.5, t*1.4);
    }
    if (i<segs){
      const n=CROSS.length, base=i*n;
      for (let k=0;k<n;k++){
        const k2=(k+1)%n;
        idx.push(base+k, base+k2, base+n+k2,
                 base+k, base+n+k2, base+n+k);
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function collectMeshes(root){
  const out=[];
  (function walk(o,isRoot){
    if (!isRoot && o.userData.partRoot) return;
    if (o.isMesh || o.isInstancedMesh) out.push(o);
    o.children.forEach(c=>walk(c,false));
  })(root,true);
  return out;
}

function bridgeRibbon(ctrl, widthFn, samples=180){
  const curve=new THREE.SplineCurve(ctrl.map(p=>new THREE.Vector2(p[0],p[1])));
  const pts=curve.getPoints(samples), L=[], R=[];
  for (let i=0;i<=samples;i++){
    const t=i/samples;
    const a=pts[Math.max(0,i-1)], b=pts[Math.min(samples,i+1)];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len, w=widthFn(t);
    L.push([pts[i].x+nx*w, pts[i].y+ny*w]);
    R.push([pts[i].x-nx*w, pts[i].y-ny*w]);
  }
  const s=new THREE.Shape();
  s.moveTo(L[0][0],L[0][1]);
  for (let i=1;i<=samples;i++) s.lineTo(L[i][0],L[i][1]);
  for (let i=samples;i>=0;i--) s.lineTo(R[i][0],R[i][1]);
  s.closePath();
  return {shape:s, curve, len:curve.getLength()};
}
const widthProf = prof => t => {
  for (let i=0;i<prof.length-1;i++){
    const [t0,w0]=prof[i], [t1,w1]=prof[i+1];
    if (t>=t0 && t<=t1) return lerp(w0,w1,(t-t0)/((t1-t0)||1));
  }
  return prof[prof.length-1][1];
};

function makeHand({len,tail,w,lumeW,thick,mat,lume=true,shape='leaf'}){
  const g=new THREE.Group();

    s.quadraticCurveTo(-w*0.78,len*0.72, -w*0.62,len*0.30);
    s.closePath();

    s.moveTo(-w*0.5,-tail); s.lineTo(w*0.5,-tail); s.lineTo(w*0.34,len*0.86);
    s.lineTo(0,len); s.lineTo(-w*0.34,len*0.86); s.closePath();
  }
  const geo=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:true,bevelThickness:0.035,

      ls.lineTo(lw*0.30,len*0.80); ls.lineTo(-lw*0.30,len*0.80);

    const lg=new THREE.ExtrudeGeometry(ls,{depth:0.11,bevelEnabled:true,bevelThickness:0.02,

(function(){
  const mkStrap=(sign)=>{
    const z0=22.4*sign, zEnd=57*sign;
    const path=t=>new THREE.Vector3(0.45*Math.sin(t*1.9)*sign, 0.62-1.97*Math.pow(t,0.58)+0.05*Math.sin(t*2.4), lerp(z0,zEnd,t));
    path.derivative=t=>{
      const e=0.001, a=path(Math.max(0,t-e)), b=path(Math.min(1,t+e));
      return new THREE.Vector3(b.x-a.x,b.y-a.y,b.z-a.z);
    };
    const wFn=t=>19.4-2.9*t, hFn=t=>1.62-0.36*t;
    const m=new THREE.Mesh(strapGeometry(path,wFn,hFn,110), STRAP_LEATHER);
    m.castShadow=m.receiveShadow=true;
    strapGrp.add(m);
    const segs=44;
    const sg=new THREE.CapsuleGeometry(0.115,0.42,4,8);
    sg.rotateX(Math.PI/2);
    const inst=new THREE.InstancedMesh(sg, STRAP_STITCH, segs*2);
    const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), one=new THREE.Vector3(1,1,1);
    let n=0;
    for (const side of [-1,1]) for (let i=0;i<segs;i++){
      const t=(i+0.5)/segs, p=path(t), d=path.derivative(t);
      const L=Math.hypot(d.x,d.z)||1, ux=-d.z/L, uz=d.x/L, off=(wFn(t)/2-1.55)*side;
      q.setFromEuler(new THREE.Euler(0,Math.atan2(d.x,d.z),0));
      m4.compose(new THREE.Vector3(p.x+ux*off, p.y+hFn(t)/2-0.08, p.z+uz*off), q, one);
      inst.setMatrixAt(n++,m4);
    }
    strapGrp.add(inst);
    if (sign>0){
      const bg=new THREE.Group();
      const ring=new THREE.Mesh(new THREE.TorusGeometry(3.0,0.50,10,28), M.steelP());
      ring.rotation.y=Math.PI/2; ring.scale.set(1,1,0.62); ring.castShadow=true; bg.add(ring);
      const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,5.2,12), M.steelP());
      pin.rotation.x=Math.PI/2; bg.add(pin);
      bg.position.copy(path(1)).add(new THREE.Vector3(0,0.05,1.7));
      strapGrp.add(bg);
    }
  };
  mkStrap(-1); mkStrap(1);
})();

function select(p){ selected = (selected===p) ? null : p; renderPanel(); }

/* ═══════════════ 13 · 交互 ═══════════════ */
const ray=new THREE.Raycaster();
const ptr=new THREE.Vector2(-10,-10);
let pointerInside=false;
canvas.addEventListener('pointermove',e=>{
  ptr.x=(e.clientX/innerWidth)*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;
  pointerInside=true;
});
canvas.addEventListener('pointerleave',()=>{pointerInside=false;ptr.set(-10,-10);});
let downXY=null;
canvas.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
canvas.addEventListener('click',e=>{
  if (downXY){
    const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);
    downXY=null;
    if (moved>6) return;                       // 拖拽旋转，不算点击
  }
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  pointerInside=true;
  const hit=pick();
  if (hit) select(hit);
  else if (selected){ selected=null; renderPanel(); }
});
canvas.addEventListener('dblclick',()=>{
  selected=null; renderPanel();
  controls.target.copy(HOME_TGT);
  camera.position.copy(HOME_POS);
});

const roots=PARTS.map(p=>p.root);
function pick(){
  if (!pointerInside) return null;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(roots,true);
  for (const h of hits){
    let o=h.object;
    while (o){
      if (o.userData.partRoot) return o.userData.partRoot;
      o=o.parent;
    }
  }
  return null;
}
function setHighlight(p,on){
  if (!p || p._hl===on) return;
  p._hl=on;
  p.meshes.forEach(m=>{
    const mats=Array.isArray(m.material)?m.material:[m.material];
    mats.forEach(mat=>{
      if (!mat || !mat.emissive) return;
      if (on){
        if (mat.__em===undefined){ mat.__em=mat.emissive.clone(); mat.__emI=mat.emissiveIntensity??1; }
        mat.emissive.setHex(0x2f6fbf);
        mat.emissiveIntensity=0.85;
      } else if (mat.__em){
        mat.emissive.copy(mat.__em);
        mat.emissiveIntensity=mat.__emI;
      }
    });
  });
}

/* ═══════════════ 14 · 标签跟随 ═══════════════ */
const _v=new THREE.Vector3(), _q=new THREE.Quaternion(), _n=new THREE.Vector3(), _c=new THREE.Vector3();
function updateLabels(){
  const cx=innerWidth/2, cy=innerHeight/2;
  const items=[];
  PARTS.filter(p=>p.labeled).forEach(p=>{
    const el=labelEls[p.id], dot=dotEls[p.id], line=lineEls[p.id];
    const act=(hovered===p)||(hoveredLabel===p)||(selected===p);
    const hide=()=>{ el.classList.remove('on','sel','dim'); dot.classList.remove('on'); line.setAttribute('opacity','0'); };
    if (!act && !showAll){ hide(); return; }
    p.anchorObj.getWorldPosition(_v);
    p.root.getWorldQuaternion(_q);
    _n.copy(p.normal).applyQuaternion(_q);
    _c.copy(_v).sub(camera.position).normalize();          // 相机 → 锚点
    if (_n.dot(_c) > 0.12 && !act){ hide(); return; }      // 背对相机则隐藏
    const proj=_v.clone().project(camera);
    if (proj.z>1){ hide(); return; }
    const sx=(proj.x*0.5+0.5)*innerWidth, sy=(-proj.y*0.5+0.5)*innerHeight;
    let dx=sx-cx, dy=sy-cy;
    const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    const off=92;
    items.push({ p, el, dot, line, act, sx, sy,
      lx: clamp(sx+dx*off, 96, innerWidth-206),
      ly: clamp(sy+dy*off*0.60, 56, innerHeight-104) });
  });
  // 简易防重叠：按纵向排序后逐一下推
  items.sort((a,b)=>a.ly-b.ly);
  for (let i=0;i<items.length;i++){
    for (let j=0;j<i;j++){
      if (Math.abs(items[i].lx-items[j].lx) < 172 && Math.abs(items[i].ly-items[j].ly) < 28){
        items[i].ly = items[j].ly + 28;
      }
    }
    items[i].ly = clamp(items[i].ly, 56, innerHeight-104);
  }
  items.forEach(it=>{
    const {p,el,dot,line,act,sx,sy,lx,ly}=it;
    dot.style.transform=`translate3d(${sx}px,${sy}px,0)`;
    dot.classList.add('on');
    dot.classList.toggle('pulse',act);
    el.style.transform=`translate3d(${lx}px,${ly}px,0) translate(-50%,-50%)`;
    el.classList.add('on');
    el.classList.toggle('sel',selected===p);
    el.classList.toggle('dim',showAll && !act && !!selected);
    line.setAttribute('x1',sx); line.setAttribute('y1',sy);
    line.setAttribute('x2',lx); line.setAttribute('y2',ly);
    line.setAttribute('opacity', act ? '0.85' : (selected ? '0.10' : '0.30'));
    line.setAttribute('stroke', selected===p ? 'rgba(233,208,146,.95)'
                       : act ? 'rgba(233,208,146,.85)' : 'rgba(201,169,97,.36)');
  });
}

/* ═══════════════ 15 · 动画状态 ═══════════════ */
const state={
  explode:0, explodeTarget:0, lume:false, demo:false,
  watchSec: 10*3600 + 8*60 + 36, beat:0,
};
const BALANCE_HZ=1.85, ESC_STEPS=30, ESC_STEP=TAU/ESC_STEPS;
const fourthRevPerSec=(BALANCE_HZ*2/ESC_STEPS)*Math.abs(RATIO.fourth);

function updateExplode(dt){
  if (Math.abs(state.explode-state.explodeTarget)<1e-4){
    if (state.explode!==state.explodeTarget){
      state.explode=state.explodeTarget;
      const e=easeIO(state.explode);
      PARTS.forEach(p=>p.root.position.set(p.base.x, p.base.y+p.exY*e, p.base.z));
      controls.target.set(0, HOME_TGT.y + e*16, 0);
    }
    return;
  }
  state.explode=lerp(state.explode, state.explodeTarget, 1-Math.pow(0.0016,dt));
  const e=easeIO(clamp(state.explode,0,1));
  PARTS.forEach(p=>p.root.position.set(p.base.x, p.base.y+p.exY*e, p.base.z));
  controls.target.set(0, HOME_TGT.y + e*16, 0);
}

function updateMovement(dt){
  const spd = state.demo ? 20 : 1;
  // 摆轮
  state.beat += dt*TAU*BALANCE_HZ*Math.min(spd,1.4);
  const bAng = 2.46*Math.sin(state.beat) + 0.09*Math.sin(state.beat*2.03);
  balanceGrp.rotation.y = bAng;
  hairspringMesh.rotation.y = bAng*0.16;
  // 擒纵轮步进
  const p=state.beat/Math.PI;
  const n=Math.floor(p), fr=p-n;
  const stepped=n+smoothstep(0.42,0.86,fr);
  const escAng=-stepped*ESC_STEP;
  escapeWheelMesh.rotation.y=escAng;
  gears.escapePinion.mesh.rotation.y=escAng;
  // 轮系严格传动
  gears.fourthGear.mesh.rotation.y  = gFou.a*escAng+gFou.b;
  gears.fourthPinion.mesh.rotation.y= gFou.a*escAng+gFou.b;
  gears.thirdGear.mesh.rotation.y   = gThi.a*escAng+gThi.b;
  gears.thirdPinion.mesh.rotation.y = gThi.a*escAng+gThi.b;
  gears.centerGear.mesh.rotation.y  = gCen.a*escAng+gCen.b;
  gears.centerPinion.mesh.rotation.y= gCen.a*escAng+gCen.b;
  barrelRing.rotation.y             = gBar.a*escAng+gBar.b;
  // 擒纵叉
  forkGrp.children[0].rotation.y = 0.105*Math.tanh(2.9*Math.sin(state.beat));
  // 指针（与四番轮严格同步）
  state.watchSec += dt*spd*fourthRevPerSec*60;
  const ws=state.watchSec;
  handSec.rotation.y  = -((ws%60))*6*D2R;
  handMin.rotation.y  = -(((ws/60)%60))*6*D2R;
  handHour.rotation.y = -(((ws/3600)%12)+(ws/60%60)/60)*30*D2R;
}

/* ═══════════════ 16 · 相机推拉 ═══════════════ */
let dollyFrom=null,dollyTo=0,dollyT=1,dollyDur=1.2;
const _o=new THREE.Vector3();
function dolly(len,dur=1.2){ dollyFrom=camera.position.distanceTo(controls.target); dollyTo=len; dollyT=0; dollyDur=dur; }
function updateDolly(dt){
  if (dollyFrom===null) return;
  dollyT+=dt/dollyDur;
  const k=smoothstep(0,1,clamp(dollyT,0,1));
  const want=lerp(dollyFrom,dollyTo,k);
  _o.copy(camera.position).sub(controls.target);
  const L=_o.length();
  if (L>1e-4){ _o.multiplyScalar(want/L); camera.position.copy(controls.target).add(_o); }
  if (dollyT>=1) dollyFrom=null;
}

/* ═══════════════ 18 · 主循环 ═══════════════ */
const clock=new THREE.Clock();
let fpsAcc=0,fpsN=0,fpsT=0,frames=0,perfT=0,degraded=0,firstFrame=true;
const fpsEl=$('fps');
function updatePerf(dt){
  frames++; perfT+=dt;
  fpsAcc+=1/Math.max(dt,1e-4); fpsN++; fpsT+=dt;
  if (fpsT>0.5){ fpsEl.textContent=Math.round(fpsAcc/fpsN); fpsAcc=0; fpsN=0; fpsT=0; }
  if (perfT>3.5 && degraded<2){
    const fps=frames/perfT;
    if (fps<36 && degraded===0){
      degraded=1;
      const pr=Math.min(renderer.getPixelRatio(),0.85);
      renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
      bloom.strength=0.22;
    } else if (fps<26 && degraded===1){
      degraded=2;
      bloom.radius=0.35;
    }
    frames=0; perfT=0;
  }
}
function onResize(){
  applyPixelRatio();
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
}
addEventListener('resize',onResize);
onResize();

let pickTick=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  updateExplode(dt);
  updateMovement(dt);
  updateDolly(dt);
  if ((pickTick++ & 1)===0){
    const hit=pick();
    if (hit!==hovered){
      setHighlight(hovered,false);
      hovered=hit;
      setHighlight(hovered,true);
      canvas.style.cursor=hovered?'pointer':'grab';
    }
  }
  updateLabels();
  controls.update();
  composer.render();
  updatePerf(dt);
  if (firstFrame){
    firstFrame=false;
    setTimeout(()=>$('loader').classList.add('hide'),260);
  }
}
canvas.style.cursor='grab';
window.__AET = { THREE, scene, camera, controls, renderer, composer, watch, PARTS, partById,
                 crystal, caseGrp, movGrp, dialGrp, handsGrp, strapGrp, reflector, state, M, lightRig };
frame();
