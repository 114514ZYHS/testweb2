<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>佛怒火莲 · 斗破苍穹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --accent:#8fd4ff; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#010104;
  font-family:'Noto Serif SC','STSong','SimSun',serif; color:#cfe2ff; user-select:none; }
#stage { position:fixed; inset:0; }
#stage canvas { display:block; }

#vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse at center, transparent 52%, rgba(2,2,10,.40) 82%, rgba(0,0,4,.72)); }
#flash { position:fixed; inset:0; pointer-events:none; opacity:0; z-index:8; mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 46%, #ffffff 0%, var(--accent) 32%, transparent 72%); }

.cl { font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif; font-weight:400; }

#hud-top { position:fixed; top:26px; left:34px; z-index:10; pointer-events:none; }
#hud-top h1 { font-size:54px; letter-spacing:12px; color:#ffffff;
  text-shadow:0 0 16px var(--accent), 0 0 44px var(--accent), 0 0 92px rgba(120,180,255,.55); }
#hud-top .sub { margin-top:10px; font-size:13px; letter-spacing:3px; color:rgba(200,220,255,.62); }
#hud-top .sub em { font-style:normal; color:var(--accent); }

#card { position:fixed; top:30px; right:34px; z-index:10; width:284px; padding:16px 18px;
  background:rgba(8,10,22,.52); border:1px solid rgba(140,190,255,.22);
  border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius:10px; backdrop-filter:blur(10px); text-align:right; }
.card-name { font-size:27px; color:var(--accent); text-shadow:0 0 14px var(--accent); letter-spacing:4px; }
.card-rank { margin-top:6px; font-size:12px; color:rgba(210,225,255,.72); letter-spacing:1px; }
.card-poem { margin-top:8px; font-size:13px; color:rgba(235,242,255,.85); }

#quote { position:fixed; top:24%; left:50%; transform:translate(-50%,-50%); z-index:9;
  font-size:48px; letter-spacing:10px; color:#fff; white-space:nowrap;
  text-shadow:0 0 20px var(--accent), 0 0 60px var(--accent), 0 0 120px rgba(140,200,255,.6);
  opacity:0; pointer-events:none; }
#quote.show { animation:quotePop 2.4s ease-out forwards; }
@keyframes quotePop {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.5); }
  12%  { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
  22%  { transform:translate(-50%,-50%) scale(1); }
  70%  { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1.05); }
}

#panel { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:10;
  display:flex; flex-direction:column; gap:10px; align-items:center;
  padding:14px 18px; background:rgba(8,10,22,.5); border:1px solid rgba(255,255,255,.09);
  border-radius:14px; backdrop-filter:blur(12px); }
.row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.btn { cursor:pointer; font-family:inherit; font-size:13px; letter-spacing:2px;
  padding:8px 16px; border-radius:8px; color:var(--accent);
  background:rgba(10,14,30,.6); border:1px solid rgba(140,190,255,.35);
  border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  transition:all .25s; }
.btn:hover { background:rgba(60,110,190,.22);
  background:color-mix(in srgb, var(--accent) 18%, rgba(10,14,30,.6));
  box-shadow:0 0 16px rgba(120,180,255,.35);
  box-shadow:0 0 16px color-mix(in srgb, var(--accent) 45%, transparent);
  color:#fff; }
.btn.active { background:rgba(60,110,190,.30);
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 30%, transparent), rgba(10,14,30,.7));
  color:#fff; box-shadow:0 0 18px rgba(120,180,255,.4);
  box-shadow:0 0 18px color-mix(in srgb, var(--accent) 50%, transparent); }
.btn.danger { color:#ff8a66; border-color:rgba(255,110,80,.5); }
.btn.danger:hover { background:rgba(255,80,50,.18); box-shadow:0 0 18px rgba(255,90,60,.5); color:#fff; }
.btn:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }

#hint { position:fixed; right:26px; bottom:88px; z-index:9; font-size:11px;
  letter-spacing:2px; color:rgba(180,200,235,.42); text-align:right; line-height:1.9; }
#credit { position:fixed; left:26px; bottom:26px; z-index:9; font-size:10px;
  letter-spacing:1px; color:rgba(150,170,210,.28); }

#loader { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  gap:24px; align-items:center; justify-content:center; background:#010104; transition:opacity .9s; }
#loader.hide { opacity:0; pointer-events:none; }
.ring { width:54px; height:54px; border-radius:50%;
  border:2px solid rgba(120,180,255,.15); border-top-color:var(--accent);
  animation:spin 1s linear infinite; box-shadow:0 0 18px rgba(80,150,255,.35); }
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { font-size:14px; letter-spacing:8px; color:rgba(190,215,255,.7); }

@media (max-width:760px){
  #hud-top h1 { font-size:34px; letter-spacing:6px; }
  #card { display:none; }
  #quote { font-size:26px; letter-spacing:4px; white-space:normal; text-align:center; width:88%; }
  #panel { width:calc(100% - 16px); }
  #hint { display:none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="flash"></div>

<header id="hud-top">
  <h1 class="cl">佛怒火莲</h1>
  <p class="sub">异火相融 · 莲开九品 —— <em>此莲一出，天地失色</em>　《斗破苍穹》</p>
</header>

<aside id="card">
  <div class="card-name cl" id="cardName">三色 · 佛怒火莲</div>
  <div class="card-rank" id="cardRank">青莲地心火 × 陨落心炎 × 三千焱炎火</div>
  <div class="card-poem cl" id="cardPoem">「三火融一莲，莲绽天地灭。」</div>
</aside>

<div id="quote" class="cl"></div>

<footer id="panel">
  <div class="row" id="themeRow"></div>
  <div class="row">
    <button id="btnBloom" class="btn">收拢花苞</button>
    <button id="btnBoom" class="btn danger">引爆 · 佛怒火莲</button>
  </div>
</footer>

<div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移<br>双指触控缩放</div>
<div id="credit">Three.js · 实体莲花建模 · HDR 泛光 + FXAA 后处理 · GPU 粒子 · 实时渲染</div>

<div id="loader">
  <div class="ring"></div>
  <div class="load-text" id="loadText">正在凝聚异火……</div>
</div>

<script type="module">
/* ================= CDN 多源容错加载 Three.js ================= */
const loadText = document.getElementById('loadText');
const THREE_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://esm.sh/three@0.160.0',
];
let THREE = null;
for (const url of THREE_URLS) {
  try { THREE = await import(url); break; } catch (e) { /* 尝试下一个源 */ }
}
if (!THREE) {
  loadText.textContent = '加载 Three.js 失败，请检查网络后刷新重试';
  throw new Error('all CDNs failed');
}

/* ================= 异火主题 ================= */
const THEMES = {
  fonu: {
    label: '三色火莲', accent: '#8fd4ff',
    name: '三色 · 佛怒火莲', rank: '青莲地心火 × 陨落心炎 × 三千焱炎火',
    poem: '「三火融一莲，莲绽天地灭。」', quote: '「三火融一莲，莲绽天地灭！」',
    petals: [
      { base: '#0a3f7d', mid: '#1f8fd8', tip: '#9ff0ff' },
      { base: '#46516e', mid: '#a8b6d8', tip: '#ffffff' },
      { base: '#301659', mid: '#7a2cd0', tip: '#e0b0ff' },
    ],
    core: '#eaf9ff', ring: '#5fb8ff',
    streams: ['#37c8ff', '#f2f8ff', '#b46bff'],
    burst: ['#a8ecff', '#ffffff', '#c88bff'],
  },
  qinglian: {
    label: '青莲地心火', accent: '#4fd8ff',
    name: '青莲地心火', rank: '异火榜 · 第十九',
    poem: '「生于地心熔岩，青焰天成。」', quote: '「青莲绽世，地火焚天！」',
    petals: [{ base: '#0b4a86', mid: '#0d6fa0', tip: '#7ef2ff' }],
    core: '#ccf8ff', ring: '#3fc0ff',
    streams: ['#2fc0ff', '#9df4ff', '#1f80ff'],
    burst: ['#7fe8ff', '#ffffff', '#2fa8ff'],
  },
  yunluo: {
    label: '陨落心炎', accent: '#cfe0ff',
    name: '陨落心炎', rank: '异火榜 · 第十四',
    poem: '「天外陨落，无形噬灵。」', quote: '「银焰噬灵，陨落天罚！」',
    petals: [{ base: '#39445e', mid: '#8c9cc0', tip: '#ffffff' }],
    core: '#ffffff', ring: '#cfe0ff',
    streams: ['#eef4ff', '#c8d8ff', '#ffffff'],
    burst: ['#ffffff', '#dfe8ff', '#aac4ff'],
  },
  sanqian: {
    label: '三千焱炎火', accent: '#b46bff',
    name: '三千焱炎火', rank: '兽域 · 万年炎髓所化',
    poem: '「黑紫妖炎，焚尽三千世界。」', quote: '「三千黑炎，焚尽八荒！」',
    petals: [{ base: '#2c1560', mid: '#6a24b8', tip: '#e0b0ff' }],
    core: '#f0d0ff', ring: '#9a5cff',
    streams: ['#8a3cff', '#d09aff', '#5a28c8'],
    burst: ['#c88bff', '#ffffff', '#7a2cff'],
  },
  jinglian: {
    label: '净莲妖火', accent: '#ff7ab8',
    name: '净莲妖火', rank: '异火榜 · 第三',
    poem: '「妖火化莲，净世湮尘。」', quote: '「净莲一现，万火臣服！」',
    petals: [{ base: '#6e1a4e', mid: '#d84a9a', tip: '#ffe0f0' }],
    core: '#fff0f8', ring: '#ff8ac8',
    streams: ['#ff6ab8', '#ffc0e0', '#ff3c9a'],
    burst: ['#ffc0e0', '#ffffff', '#ff7ac0'],
  },
};
const THEME_ORDER = ['fonu', 'qinglian', 'yunluo', 'sanqian', 'jinglian'];
let themeKey = 'fonu';

/* ================= 渲染器 / 场景 / 相机 ================= */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  loadText.textContent = '当前环境不支持 WebGL，无法渲染';
  throw e;
}
const PR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(7.5, 4.6, 11.5);

/* ================= 共享 uniforms（全局色彩中枢） ================= */
const U = {
  time:  { value: 0 },
  fade:  { value: 1 },
  boost: { value: 1 },
  px:    { value: PR },
  petalBase: { value: new THREE.Color('#0d3d78') },
  petalMid:  { value: new THREE.Color('#1f6fb8') },
  petalTip:  { value: new THREE.Color('#bfeaff') },
  core:      { value: new THREE.Color('#eaf9ff') },
  ring:      { value: new THREE.Color('#5fb8ff') },
};

/* ================= GLSL 公共库（全部 NaN 安全） ================= */
const NOISE = `
vec2 nhash(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
  return -1.0 + 2.0*fract(sin(p)*43758.5453123); }
float gnoise(vec2 p){
  const float K1 = 0.366025404; const float K2 = 0.211324865;
  vec2 i = floor(p + (p.x+p.y)*K1);
  vec2 x0 = p - i + (i.x+i.y)*K2;
  vec2 o = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec2 x1 = x0 - o + K2;
  vec2 x2 = x0 - 1.0 + 2.0*K2;
  vec3 h = max(0.5 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
  vec3 n = h*h*h*h*vec3(dot(x0,nhash(i)), dot(x1,nhash(i+o)), dot(x2,nhash(i+1.0)));
  return dot(n, vec3(70.0));
}
float fbm(vec2 p){
  float v = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++){ v += a*gnoise(p); p = p*2.03 + 11.3; a *= 0.5; }
  return v;
}`;

const POINT_FRAG = `
varying vec3 vCol; varying float vA;
void main(){
  float r = length(gl_PointCoord - 0.5);
  float a = 1.0 - smoothstep(0.05, 0.5, r);
  gl_FragColor = vec4(vCol * a, a * vA);
}`;

/* ================= 穹顶背景 ================= */
{
  const domeMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, transparent: true,
    uniforms: {
      uTop: { value: new THREE.Color('#0a0622') },
      uBot: { value: new THREE.Color('#010105') },
    },
    vertexShader: `varying vec3 vP;
      void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: NOISE + `
      varying vec3 vP; uniform vec3 uTop; uniform vec3 uBot;
      void main(){
        vec3 d = normalize(vP);
        vec3 col = mix(uBot, uTop, smoothstep(-0.6, 0.9, d.y));
        float n = fbm(d.xz*3.0 + d.y*2.0)*0.5 + fbm(d.xy*4.0 - d.z)*0.5;
        col += vec3(0.030, 0.015, 0.058) * max(n, 0.0);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(800, 40, 28), domeMat);
  dome.renderOrder = -10;
  scene.add(dome);
}

/* ================= 星空 ================= */
{
  const N = 1500;
  const pos = new Float32Array(N * 3), asz = new Float32Array(N), atw = new Float32Array(N);
  const v = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    v.randomDirection().multiplyScalar(300 + Math.random() * 260);
    pos[i*3] = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z;
    asz[i] = 0.6 + Math.pow(Math.random(), 3) * 2.4;
    atw[i] = Math.random() * 10;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(asz, 1));
  g.setAttribute('aTw', new THREE.BufferAttribute(atw, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.time, uPx: U.px },
    vertexShader: `
      attribute float aSize; attribute float aTw;
      uniform float uTime; uniform float uPx;
      varying vec3 vCol; varying float vA;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPx * (300.0 / max(-mv.z, 1.0));
        vA = 0.45 + 0.55 * (0.5 + 0.5*sin(uTime*(0.4 + fract(aTw)*1.3) + aTw*7.0));
        vCol = mix(vec3(0.85,0.9,1.0), vec3(1.0,0.76,0.58), step(0.93, fract(aTw*5.7)));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: POINT_FRAG,
  });
  const stars = new THREE.Points(g, m);
  stars.frustumCulled = false;
  scene.add(stars);
}

/* ==================================================================
   火莲主体 —— 不透明实体花瓣（瓦片状层叠）+ 莲蓬 + 花蕊 + 等离子莲心
   ================================================================== */
const lotus = new THREE.Group();
scene.add(lotus);
const petalsGroup = new THREE.Group();
lotus.add(petalsGroup);

const sstep = (a, b, x) => {
  const t = Math.min(Math.max((x - a) / (b - a), 0), 1);
  return t * t * (3 - 2 * t);
};

/* --- 荷花花瓣参数曲面：爪形基部 → 宽扁中部 → 收尖瓣端，杯形凹面 + 中脉凸脊 --- */
function makePetalGeometry(len, maxW, curl, cup, ridge) {
  const SU = 30, SV = 16;
  const pos = [], uv = [], idx = [];
  for (let iu = 0; iu <= SU; iu++) {
    const u = iu / SU;
    const wProfile = sstep(0, 0.30, u) * Math.pow(1 - sstep(0.50, 1.0, u), 0.62);
    const w = maxW * 0.5 * Math.max(wProfile, 0.002);
    for (let iv = 0; iv <= SV; iv++) {
      const v = (iv / SV) * 2 - 1;
      const x = v * w;
      const y = u * len;
      const z = -cup * (v * v) * w * 1.35
              + curl * len * Math.pow(u, 2.3)
              + ridge * Math.exp(-(v * 2.4) * (v * 2.4)) * (0.25 + 0.75 * u);
      pos.push(x, y, z);
      uv.push(iv / SV, u);
    }
  }
  for (let iu = 0; iu < SU; iu++) for (let iv = 0; iv < SV; iv++) {
    const a = iu * (SV + 1) + iv, b = a + SV + 1;
    idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}

const PETAL_VERT = `
uniform float uTime;
varying vec2 vUv; varying vec3 vN; varying vec3 vV;
void main(){
  vUv = uv;
  vec3 p = position;
  float w = sin(3.14159 * vUv.y);
  p.x += sin(uTime*1.1 + vUv.y*3.0 + vUv.x*3.0) * 0.02 * w;
  p.z += sin(uTime*0.8 + vUv.y*4.0 + 1.3) * 0.015 * w;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vN = normalize(normalMatrix * normal);
  vV = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;

const PETAL_FRAG = NOISE + `
uniform float uTime; uniform float uVar;
uniform vec3 uColBase; uniform vec3 uColMid; uniform vec3 uColTip; uniform vec3 uColCore;
varying vec2 vUv; varying vec3 vN; varying vec3 vV;
void main(){
  float along = vUv.y;
  float v = vUv.x * 2.0 - 1.0;
  float av = abs(v);
  /* 瓣身渐变：深基部 → 主色 → 亮瓣端 */
  vec3 col = mix(uColBase, uColMid, smoothstep(0.02, 0.50, along));
  col = mix(col, uColTip, smoothstep(0.42, 0.92, along));
  /* 放射状叶脉 */
  float vein = pow(max(sin(v * 9.4248), 0.0), 6.0);
  col *= 1.0 - vein * 0.16 * (0.3 + 0.7 * along);
  /* 中脉亮线 */
  float mid = 1.0 - smoothstep(0.0, 0.14, av);
  col += uColTip * mid * (0.10 + 0.30 * along);
  /* 火焰流动微光 */
  col *= 0.86 + 0.28 * (0.5 + 0.5 * fbm(vec2(v * 2.5, along * 3.5 - uTime * 1.1)));
  /* 烧边辉光（菲涅尔） */
  float fres = pow(clamp(1.0 - abs(dot(normalize(vN), normalize(vV))), 0.0, 1.0), 2.2);
  col += uColTip * fres * (0.45 + 0.75 * along);
  /* 瓣尖炽亮 */
  col += uColTip * smoothstep(0.85, 1.0, along) * 0.9;
  /* 基部融入莲心 */
  col += uColCore * (1.0 - along) * (1.0 - along) * 0.20;
  gl_FragColor = vec4(col * uVar, 1.0);
}`;

/* 五层瓦片状层叠花瓣（外层平展、内层直立抱芯） */
const LAYERS = [
  { n: 9, len: 3.4, wid: 1.90, open: 1.30, curl: 0.14, cup: 1.25, ridge: 0.07, az: 0.00, uVar: 1.00 },
  { n: 8, len: 2.9, wid: 1.65, open: 1.04, curl: 0.12, cup: 1.30, ridge: 0.07, az: 0.38, uVar: 0.93 },
  { n: 7, len: 2.4, wid: 1.40, open: 0.78, curl: 0.10, cup: 1.35, ridge: 0.08, az: 0.10, uVar: 1.06 },
  { n: 6, len: 1.9, wid: 1.15, open: 0.52, curl: 0.08, cup: 1.40, ridge: 0.08, az: 0.52, uVar: 0.96 },
  { n: 5, len: 1.5, wid: 0.95, open: 0.28, curl: 0.06, cup: 1.45, ridge: 0.09, az: 0.26, uVar: 1.08 },

  const g = new THREE.BufferGeometry();

  for (let i = 0; i < rnd.length; i++) rnd[i] = Math.random();

  const m = new THREE.ShaderMaterial({

attribute vec3 aRand;

uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uColC;

/* ==================================================================

function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(Math.max(w, 2), Math.max(h, 2), { type: THREE.HalfFloatType });
}

const POST_VERT = `varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function makePass(frag, uniforms) {
  return new THREE.ShaderMaterial({
    uniforms, vertexShader: POST_VERT, fragmentShader: frag,
    depthTest: false, depthWrite: false,
  });
}
const brightMat = makePass(`
  uniform sampler2D tSrc; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tSrc, vUv).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    gl_FragColor = vec4(c * smoothstep(0.20, 0.90, l), 1.0);
  }`, { tSrc: { value: null } });

const blurMat = makePass(`
  uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tSrc, vUv).rgb * 0.227027;
    vec2 o1 = uDir * uTexel * 1.3846;
    vec2 o2 = uDir * uTexel * 3.2308;
    c += (texture2D(tSrc, vUv + o1).rgb + texture2D(tSrc, vUv - o1).rgb) * 0.3162162;
    c += (texture2D(tSrc, vUv + o2).rgb + texture2D(tSrc, vUv - o2).rgb) * 0.0702703;
    gl_FragColor = vec4(c, 1.0);
  }`, { tSrc: { value: null }, uDir: { value: new THREE.Vector2() }, uTexel: { value: new THREE.Vector2() } });

const compMat = makePass(`
  uniform sampler2D tScene; uniform sampler2D tA; uniform sampler2D tB;
  uniform float uShock; uniform float uTime;
  varying vec2 vUv;
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
  }
  void main(){
    vec2 uv = vUv;
    vec2 c = uv - 0.5;
    float d = length(c);
    if (uShock > 0.001) {
      float ripple = sin(d*28.0 - uTime*10.0) * uShock * 0.028 * (1.0 - smoothstep(0.05, 0.55, d));
      uv += (c / max(d, 1e-4)) * ripple;
    }
    float ca = uShock * 0.004 * smoothstep(0.0, 0.6, d);
    vec3 col;
    col.r = texture2D(tScene, uv + vec2(ca, 0.0)).r;
    col.g = texture2D(tScene, uv).g;
    col.b = texture2D(tScene, uv - vec2(ca, 0.0)).b;
    col += texture2D(tA, uv).rgb * 0.75;
    col += texture2D(tB, uv).rgb * 0.90;
    col = aces(col * 1.15);
    float vg = 1.0 - smoothstep(0.35, 0.95, length(vUv - 0.5));
    col *= mix(0.72, 1.0, vg);
    col = pow(max(col, 0.0), vec3(0.454545));
    gl_FragColor = vec4(col, 1.0);
  }`, { tScene: { value: null }, tA: { value: null }, tB: { value: null },
       uShock: { value: 0 }, uTime: { value: 0 } });

const fxaaMat = makePass(`
  uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec3 luma = vec3(0.299, 0.587, 0.114);
    vec3 rgbNW = texture2D(tSrc, vUv + vec2(-1.0,-1.0) * uTexel).rgb;
    vec3 rgbNE = texture2D(tSrc, vUv + vec2( 1.0,-1.0) * uTexel).rgb;
    vec3 rgbSW = texture2D(tSrc, vUv + vec2(-1.0, 1.0) * uTexel).rgb;
    vec3 rgbSE = texture2D(tSrc, vUv + vec2( 1.0, 1.0) * uTexel).rgb;
    vec3 rgbM  = texture2D(tSrc, vUv).rgb;
    float lNW = dot(rgbNW, luma), lNE = dot(rgbNE, luma);
    float lSW = dot(rgbSW, luma), lSE = dot(rgbSE, luma), lM = dot(rgbM, luma);
    float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
    float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
    vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
    float dirReduce = max((lNW + lNE + lSW + lSE) * 0.03125, 0.0078125);
    float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
    dir = clamp(dir * rcpDirMin, vec2(-8.0), vec2(8.0)) * uTexel;
    vec3 rgbA = 0.5 * (texture2D(tSrc, vUv + dir * (1.0/3.0 - 0.5)).rgb
                     + texture2D(tSrc, vUv + dir * (2.0/3.0 - 0.5)).rgb);
    vec3 rgbB = rgbA * 0.5 + 0.25 * (texture2D(tSrc, vUv - dir * 0.5).rgb
                                   + texture2D(tSrc, vUv + dir * 0.5).rgb);
    float lB = dot(rgbB, luma);
    gl_FragColor = vec4((lB < lMin || lB > lMax) ? rgbA : rgbB, 1.0);
  }`, { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() } });

function buildTargets() {
  const w = Math.floor(innerWidth * PR), h = Math.floor(innerHeight * PR);
  if (rtScene) { rtScene.dispose(); rtA.dispose(); rtB.dispose(); rtQ1.dispose(); rtQ2.dispose(); rtFinal.dispose(); }
  rtScene = makeRT(w, h);
  rtA = makeRT(w >> 1, h >> 1);
  rtB = makeRT(w >> 1, h >> 1);
  rtQ1 = makeRT(w >> 2, h >> 2);
  rtQ2 = makeRT(w >> 2, h >> 2);
  rtFinal = makeRT(w, h);
  fxaaMat.uniforms.uTexel.value.set(1 / w, 1 / h);
}
buildTargets();

function blur(srcTex, dst, dx, dy) {
  blurMat.uniforms.tSrc.value = srcTex;
  blurMat.uniforms.uDir.value.set(dx, dy);
  blurMat.uniforms.uTexel.value.set(1 / dst.width, 1 / dst.height);
  postQuad.material = blurMat;
  renderer.setRenderTarget(dst);
  renderer.render(postScene, postCam);
}
function renderFrame() {
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  postQuad.material = brightMat;
  brightMat.uniforms.tSrc.value = rtScene.texture;
  renderer.setRenderTarget(rtA);
  renderer.render(postScene, postCam);
  blur(rtA.texture, rtB, 1, 0);
  blur(rtB.texture, rtA, 0, 1);
  blur(rtA.texture, rtQ1, 1, 0);
  blur(rtQ1.texture, rtQ2, 0, 1);
  compMat.uniforms.tScene.value = rtScene.texture;
  compMat.uniforms.tA.value = rtA.texture;
  compMat.uniforms.tB.value = rtQ2.texture;
  compMat.uniforms.uTime.value = U.time.value;
  postQuad.material = compMat;
  renderer.setRenderTarget(rtFinal);
  renderer.render(postScene, postCam);
  fxaaMat.uniforms.tSrc.value = rtFinal.texture;
  postQuad.material = fxaaMat;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

/* ================= 轻量轨道控制器（含惯性/自动旋转/触控） ================= */
class SimpleOrbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom;
    this.target = new THREE.Vector3(0, 1.3, 0);
    this.sph = new THREE.Spherical().setFromVector3(cam.position.clone().sub(this.target));
    this.radiusT = this.sph.radius;
    this.inT = 0; this.inP = 0;
    this.minR = 4.5; this.maxR = 90;
    this.minPhi = 0.08; this.maxPhi = Math.PI - 0.08;
    this.autoRotate = true; this.autoSpeed = 0.25;
    this.dragging = false; this.panMode = false;
    this.pointers = new Map(); this.pinchDist = 0;
    this.lastX = 0; this.lastY = 0;

    dom.style.touchAction = 'none';
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('pointerdown', e => {
      dom.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, e);
      if (this.pointers.size === 1) {
        this.dragging = true; this.panMode = (e.button === 2 || e.ctrlKey);
        this.lastX = e.clientX; this.lastY = e.clientY;
      } else if (this.pointers.size === 2) {
        const p = [...this.pointers.values()];
        this.pinchDist = Math.hypot(p[0].clientX - p[1].clientX, p[0].clientY - p[1].clientY);
      }
    });
    dom.addEventListener('pointermove', e => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, e);
      if (this.pointers.size === 2) {
        const p = [...this.pointers.values()];
        const d = Math.hypot(p[0].clientX - p[1].clientX, p[0].clientY - p[1].clientY);
        if (this.pinchDist > 0) {
          this.radiusT = THREE.MathUtils.clamp(this.radiusT * this.pinchDist / Math.max(d, 1), this.minR, this.maxR);
        }
        this.pinchDist = d;
        return;
      }
      if (!this.dragging) return;
      const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
      this.lastX = e.clientX; this.lastY = e.clientY;
      if (this.panMode) {
        const te = this.cam.matrix.elements;
        const right = new THREE.Vector3(te[0], te[1], te[2]);
        const up = new THREE.Vector3(te[4], te[5], te[6]);
        const f = this.sph.radius * 0.0016;
        this.target.addScaledVector(right, -dx * f).addScaledVector(up, dy * f);
        this.target.clampLength(0, 20);
      } else {
        this.sph.theta -= dx * 0.0042;
        this.sph.phi -= dy * 0.0042;
        this.inT = -dx * 0.0042; this.inP = -dy * 0.0042;
      }
    });
    const end = e => {
      this.pointers.delete(e.pointerId);
      if (this.pointers.size < 2) this.pinchDist = 0;
      if (this.pointers.size === 0) this.dragging = false;
    };
    dom.addEventListener('pointerup', end);
    dom.addEventListener('pointercancel', end);
    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.radiusT = THREE.MathUtils.clamp(this.radiusT * Math.exp(e.deltaY * 0.0011), this.minR, this.maxR);
    }, { passive: false });
  }
  update(dt) {
    if (!this.dragging) {
      if (this.autoRotate) this.sph.theta += this.autoSpeed * dt;
      this.sph.theta += this.inT; this.sph.phi += this.inP;
      const k = Math.exp(-dt * 6);
      this.inT *= k; this.inP *= k;
    }
    this.sph.phi = THREE.MathUtils.clamp(this.sph.phi, this.minPhi, this.maxPhi);
    this.sph.radius += (this.radiusT - this.sph.radius) * (1 - Math.exp(-dt * 8));
    this.cam.position.setFromSpherical(this.sph).add(this.target);
    this.cam.lookAt(this.target);
  }
}
const orbit = new SimpleOrbit(camera, renderer.domElement);

/* ================= 主题切换（色彩平滑过渡） ================= */
let colorPairs = [];
function setTheme(key) {
  themeKey = key;
  const th = THEMES[key];
  const pal = th.petals;
  const pick = k => pal[k % pal.length];
  /* 莲蓬/花蕊/余烬使用各焰融合后的平均色 */
  const avg = f => pal.reduce((c, p) => c.add(new THREE.Color(p[f])), new THREE.Color(0, 0, 0)).multiplyScalar(1 / pal.length);
  const T = {
    petalMid: avg('mid'), petalTip: avg('tip'),
    core: new THREE.Color(th.core), ring: new THREE.Color(th.ring),
    streams: th.streams.map(c => new THREE.Color(c)),
    streamsDim: th.streams.map(c => new THREE.Color(c).multiplyScalar(0.22)),
    burst: th.burst.map(c => new THREE.Color(c)),
  };
  colorPairs = [
    ...flameMats.flatMap((m, k) => {
      const p = pick(k);
      return [
        [m.uniforms.uColBase.value, new THREE.Color(p.base)],
        [m.uniforms.uColMid.value, new THREE.Color(p.mid)],
        [m.uniforms.uColTip.value, new THREE.Color(p.tip)],
      ];
    }),
    [U.petalMid.value, T.petalMid], [U.petalTip.value, T.petalTip],
    [U.core.value, T.core], [U.ring.value, T.ring],
    ...streamMats.flatMap((m, i) => [[m.uColA.value, T.streamsDim[i]], [m.uColB.value, T.streams[i]]]),
    [exUniforms.uBA.value, T.burst[0]], [exUniforms.uBB.value, T.burst[1]], [exUniforms.uBC.value, T.burst[2]],
  ];
  document.documentElement.style.setProperty('--accent', th.accent);
  document.getElementById('cardName').textContent = th.name;
  document.getElementById('cardRank').textContent = th.rank;
  document.getElementById('cardPoem').textContent = th.poem;
  document.querySelectorAll('#themeRow .btn').forEach(b =>
    b.classList.toggle('active', b.dataset.key === key));
}
{
  const row = document.getElementById('themeRow');
  THEME_ORDER.forEach(key => {
    const b = document.createElement('button');
    b.className = 'btn'; b.dataset.key = key;
    b.textContent = THEMES[key].label;
    b.addEventListener('click', () => setTheme(key));
    row.appendChild(b);
  });
}
setTheme('fonu');

/* ================= 状态机 ================= */
const $ = s => document.querySelector(s);
const flashEl = $('#flash'), quoteEl = $('#quote');
const btnBloom = $('#btnBloom'), btnBoom = $('#btnBoom');
const clock = new THREE.Clock();

let state = 'intro', stateT = 0;
let bloomTarget = 0, bloomCur = 0;
let shake = 0, flashA = 0;
let fireballProg = 0, chargeTremble = 0;
let speedMulCur = 1;

const smooth01 = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function setButtons() {
  btnBoom.disabled = state !== 'idle';
  btnBloom.disabled = state !== 'idle';
  btnBloom.textContent = bloomTarget > 0.5 ? '收拢花苞' : '绽放火莲';
}
setButtons();

function showQuote(text) {
  quoteEl.textContent = text;
  quoteEl.classList.remove('show');
  void quoteEl.offsetWidth;
  quoteEl.classList.add('show');
}

function detonate() {
  if (state !== 'idle') return;
  state = 'charging'; stateT = 0;
  bloomTarget = 0.06;
  setButtons();
}
function boom() {
  state = 'boom'; stateT = 0;
  flashA = 1; shake = 0.55;
  lotus.visible = false;
  exUniforms.uBoom.value = U.time.value;
  compMat.uniforms.uShock.value = 1;
  fireball.visible = true; fireballProg = 0;
  fireball.position.set(0, 1.2, 0);
  shocks.forEach((s, i) => { s.visible = true; s.userData.prog = 0; s.userData.delay = i * 0.14; s.material.uniforms.uProg.value = 0; });
  showQuote(THEMES[themeKey].quote);
  camera.fov = 66; camera.updateProjectionMatrix();
}
function rebirth() {
  state = 'rebirth'; stateT = 0;
  lotus.visible = true;
  bloomCur = 0; bloomTarget = 0.05;
}
btnBoom.addEventListener('click', detonate);
btnBloom.addEventListener('click', () => {
  if (state !== 'idle') return;
  bloomTarget = bloomTarget > 0.5 ? 0.05 : 1;
  setButtons();
});

/* ================= 主循环 ================= */
let frames = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  U.time.value = t;
  stateT += dt;

  /* ---- 状态流转 ---- */
  let chargeP = 0;
  if (state === 'intro') {
    if (stateT > 0.75) bloomTarget = 1;
    if (stateT > 1.7) { state = 'idle'; setButtons(); }
  } else if (state === 'charging') {
    chargeP = smooth01(stateT / 1.1);
    if (stateT >= 1.1) boom();
  } else if (state === 'boom') {
    fireballProg += dt / 1.5;
    const p = Math.min(fireballProg, 1), e = 1 - Math.pow(1 - p, 3);
    fireball.scale.setScalar(0.6 + 15 * e);
    fireball.position.y = 1.2 + p * 3;
    fireballMat.uniforms.uProg.value = p;
    if (p >= 1) fireball.visible = false;
    shocks.forEach(s => {
      if (!s.visible) return;
      if (stateT < s.userData.delay) return;
      s.userData.prog += dt / 0.9;
      if (s.userData.prog >= 1) { s.visible = false; return; }
      s.material.uniforms.uProg.value = s.userData.prog;
    });
    if (stateT > 2.6) rebirth();
  } else if (state === 'rebirth') {
    if (stateT > 0.65) bloomTarget = 1;
    if (stateT > 2.0) { state = 'idle'; setButtons(); }
  }

  /* ---- 平滑量 ---- */
  bloomCur += (bloomTarget - bloomCur) * (1 - Math.exp(-dt * 2.6));
  const fadeTarget = state === 'boom' ? 0 : 1;
  U.fade.value += (fadeTarget - U.fade.value) * (1 - Math.exp(-dt * (state === 'boom' ? 16 : 2.8)));
  const boostTarget = 1 + 2.6 * chargeP;
  U.boost.value += (boostTarget - U.boost.value) * (1 - Math.exp(-dt * 6));
  const speedTarget = 1 + 4.5 * chargeP;
  speedMulCur += (speedTarget - speedMulCur) * (1 - Math.exp(-dt * 5));
  streamMats.forEach(m => { m.uSpeed.value = 0.13 * speedMulCur; });
  chargeTremble += (chargeP - chargeTremble) * (1 - Math.exp(-dt * 6));
  const ck = 1 - Math.exp(-dt * 4);
  colorPairs.forEach(([a, b]) => a.lerp(b, ck));

  /* ---- 火莲本体 ---- */
  let stScale = 1;
  if (state === 'intro') stScale = easeOutBack(Math.min(stateT / 0.9, 1));
  if (state === 'rebirth') stScale = easeOutBack(Math.min(stateT / 1.15, 1));
  const extraScale = 1 + 0.15 * chargeP + Math.sin(t * 0.8) * 0.012;
  lotus.scale.setScalar(Math.max(0.001, stScale * extraScale));
  lotus.rotation.y += dt * (0.22 + chargeP * 2.6);
  lotus.position.y = Math.sin(t * 0.5) * 0.15;
  core.scale.setScalar(1 + (U.boost.value - 1) * 0.16 + Math.sin(t * 3.1) * 0.04);

  const breathe = Math.sin(t * 0.9) * 0.03;
  for (const p of petalCtrls) {
    let ang = p.open * (0.10 + 0.90 * bloomCur) * p.jit;
    ang += Math.sin(t * 1.3 + p.phase) * 0.035 + breathe;
    ang += Math.sin(t * 37.0 + p.phase * 7.0) * 0.022 * chargeTremble;
    p.pitch.rotation.x = Math.max(0.04, ang);
  }

  ringHolders.forEach(r => { r.holder.rotation.y += r.sp * dt; });
  orbit.autoSpeed = 0.25 + (state === 'boom' ? 0.9 : 0);
  orbit.update(dt);

  /* ---- 震屏 / 视角 / 闪光 / 扭曲 ---- */
  if (state === 'charging') shake = Math.max(shake, 0.012 + 0.05 * chargeP);
  let ox = 0, oy = 0, oz = 0;
  if (shake > 0.0006) {
    ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; oz = (Math.random() - 0.5) * shake;
    camera.position.x += ox; camera.position.y += oy; camera.position.z += oz;
  }
  renderFrame();
  if (ox || oy || oz) {
    camera.position.x -= ox; camera.position.y -= oy; camera.position.z -= oz;
  }
  shake *= Math.exp(-dt * 3.4);
  if (Math.abs(camera.fov - 55) > 0.02) {
    camera.fov += (55 - camera.fov) * (1 - Math.exp(-dt * 5));
    camera.updateProjectionMatrix();
  }
  flashA *= Math.exp(-dt * 2.6);
  flashEl.style.opacity = flashA < 0.01 ? 0 : flashA;
  compMat.uniforms.uShock.value *= Math.exp(-dt * 2.0);

  frames++;
  if (frames === 3) document.getElementById('loader').classList.add('hide');
}
tick();

/* ================= 自适应 ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  buildTargets();
});
</script>
