  // 原来的下界 2.0 会让它在最后几秒整个消失。
  const lineFade = show * fieldOn * fadeWindow(view, -0.5, 7.0, 0.5);
  magLines.visible = lineFade > 0.004;
  if (magLines.visible) {
    magLines.scale.setScalar(Math.max(scale, 1e-12));
    magLines.material.opacity = 0.55 * lineFade;
  }

  const lcFade = show * fieldOn * fadeWindow(view, 2.6, 6.6, 0.45);
  lightCyl.visible = lcFade > 0.004;
  if (lightCyl.visible) {
    lightCyl.scale.set(Math.max(R_LC * scale, 1e-12), Math.max(R_LC * scale, 1e-12) * 2.4, Math.max(R_LC * scale, 1e-12));
    lcMat.uniforms.uFade.value = lcFade;
    lcMat.uniforms.uTime.value = opts.time;
  }

  const pwnFade = show * lodPWN * fadeWindow(view, 9.6, 13.2, 0.4);
  syncNeb.visible = pwnFade > 0.004;
  if (syncNeb.visible) {
    syncNeb.scale.setScalar(Math.max(R_PWN * scale, 1e-9));
    syncMat.uniforms.uFade.value = pwnFade;
    syncMat.uniforms.uTime.value = opts.time;
  }

  const torFade = show * lodPWN * fadeWindow(view, 9.8, 12.6, 0.4);
  torus.visible = torFade > 0.004;
  if (torus.visible) {
    torus.scale.setScalar(Math.max(R_TORUS * scale, 1e-9));
    torusMat.uniforms.uFade.value = torFade;
    torusMat.uniforms.uTime.value = opts.time;
  }

  const jetFade = show * lodPWN * fadeWindow(view, 9.8, 12.8, 0.4);
  jetA.visible = jetFade > 0.004;
  jetB.visible = jetA.visible;
  if (jetA.visible) {
    jetA.scale.setScalar(Math.max(scale, 1e-9));
    jetB.scale.setScalar(Math.max(scale, 1e-9));
    jetA.material.uniforms.uFade.value = jetFade;
    jetB.material.uniforms.uFade.value = jetFade;
  }

  return { pulse, spinPhase, pwnFade, lcFade, beamFade };
}


/* ═══════════ postfx.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   postfx.js — 后期链：泛光 → ACES 色调映射 → 显示空间调色
   ═══════════════════════════════════════════════════════════════════════════

   这里不用 three 自带的 OutputPass：实测在本场景下它（RawShaderMaterial、
   GLSL ES 1.00）无论作为末级还是中间级都产出全黑，而同链上的 RenderPass 与
   UnrealBloomPass 正常。自己实现反而更顺——色调映射、饱和、过曝、暗角、颗粒
   可以按正确顺序放进同一个 pass，且全部参数可控。

   光照都在线性空间算完，ACES 与 sRGB 编码在最后一步做，之后才是"镜头"的
   色散、过曝、暗角与胶片颗粒（这些本来就该发生在显示空间）。            */

const FINAL_SHADER = {
  uniforms: {
    tDiffuse: { value: null },
    uExposure: { value: 0.92 },
    uFlash: { value: 0 },      // 全屏过曝
    uCA: { value: 0.35 },      // 色散强度
    uVig: { value: 0.55 },     // 暗角
    uGrain: { value: 0.016 },  // 胶片颗粒
    uStreak: { value: 0.10 },  // 变形镜头横向星芒
    uDistort: { value: 0 },    // 冲击波畸变强度
    uDR: { value: 0.0 },       // 畸变环半径
    uDW: { value: 0.09 },      // 畸变环宽度
    uSat: { value: 1.0 },
    uAspect: { value: 1 },
    uTime: { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float uExposure, uFlash, uCA, uVig, uGrain, uStreak;
    uniform float uDistort, uDR, uDW, uSat, uAspect, uTime;
    varying vec2 vUv;

    /* ACES filmic：与 three.js tonemapping_pars_fragment 同一套 RRT+ODT 拟合，
       矩阵为源码转置后的写法 */
    const mat3 ACESInputMat = mat3(
      vec3(0.59719, 0.07600, 0.02840),
      vec3(0.35458, 0.90834, 0.13383),
      vec3(0.04823, 0.01566, 0.83777)
    );
    const mat3 ACESOutputMat = mat3(
      vec3( 1.60475, -0.10208, -0.00327),
      vec3(-0.53108,  1.10813, -0.07276),
      vec3(-0.07367, -0.00605,  1.07602)
    );
    vec3 rrtOdtFit(vec3 v) {
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return a / b;
    }
    vec3 acesFilmic(vec3 color) {
      color *= uExposure / 0.6;
      color = ACESInputMat * color;
      color = rrtOdtFit(color);
      color = ACESOutputMat * color;
      return clamp(color, 0.0, 1.0);
    }
    /* 线性 → sRGB 传递函数（IEC 61966-2-1） */
    vec3 toSRGB(vec3 c) {
      c = max(c, vec3(0.0));
      return mix(pow(c, vec3(0.41666)) * 1.055 - 0.055,
                 c * 12.92,
                 vec3(lessThanEqual(c, vec3(0.0031308))));
    }
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vec2 uv = vUv;
      vec2 c = uv - 0.5;
      c.x *= uAspect;
      float r = length(c);
      vec2 dir = r > 1e-5 ? c / r : vec2(0.0);

      // 冲击波：一道向外扩散的环形畸变
      float ring = exp(-pow((r - uDR) / uDW, 2.0));
      uv += dir * ring * uDistort * 0.045;

      // 色散：越靠边越明显
      float ca = uCA * (0.25 + r * 2.4) * 0.005;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + dir * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - dir * ca).b;

      // 横向拉伸的亮星芒
      if (uStreak > 0.001) {
        vec3 st = vec3(0.0);
        for (int i = 1; i <= 7; i++) {
          float o = float(i) * 0.0055;
          st += texture2D(tDiffuse, uv + vec2(o, 0.0)).rgb;
          st += texture2D(tDiffuse, uv - vec2(o, 0.0)).rgb;
        }
        st /= 14.0;
        col += max(st - 0.45, 0.0) * uStreak;
      }

      // ── 线性 HDR → 显示空间 ──
      col = acesFilmic(col);
      col = toSRGB(col);

      // 饱和度（显示空间）
      float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(lum), col, uSat);

      // 全屏过曝：核心反弹与激波突破时的真实过曝，可以真的打到纯白
      col = 1.0 - (1.0 - col) * (1.0 - clamp(uFlash, 0.0, 1.0) * vec3(0.90, 0.95, 1.0));

      // 暗角
      col *= 1.0 - uVig * smoothstep(0.34, 1.15, r);

      // 胶片颗粒：暗部多、亮部少
      // 用 gl_FragCoord 逐像素取噪声：按 uv 缩放会欠采样，出规则的网格状摩尔纹
      float g = hash(gl_FragCoord.xy + fract(uTime * 0.37) * 311.0) - 0.5;
      col += g * uGrain * (0.30 + 0.70 * (1.0 - clamp(lum, 0.0, 1.0)));

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
};

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.82, 0.62, 0.52,
);
const finalPass = new ShaderPass(FINAL_SHADER);

composer.addPass(new RenderPass(scene, camera));
composer.addPass(bloomPass);
composer.addPass(finalPass);       // 末级：ACES + sRGB + 调色
composer.setSize(innerWidth, innerHeight);

const POST = {
  bloom: 0.82,
  bloomRadius: 0.62,
  bloomThreshold: 0.52,
  // 目标值，逐帧缓动到实际值，避免参数突变造成闪烁
  t: { exposure: 0.92, flash: 0, ca: 0.35, vig: 0.55, grain: 0.016, streak: 0.10, distort: 0, dr: 0, dw: 0.09, sat: 1 },
  c: { exposure: 0.92, flash: 0, ca: 0.35, vig: 0.55, grain: 0.016, streak: 0.10, distort: 0, dr: 0, dw: 0.09, sat: 1 },
};

const _k = (dt, halfLife) => 1 - Math.pow(0.5, dt / Math.max(halfLife, 1e-4));

function updatePost(dt, time) {
  const u = finalPass.uniforms;
  const T = POST.t, C = POST.c;
  C.exposure = lerp(C.exposure, T.exposure, _k(dt, 0.25));
  C.ca = lerp(C.ca, T.ca, _k(dt, 0.30));
  C.vig = lerp(C.vig, T.vig, _k(dt, 0.30));
  C.grain = lerp(C.grain, T.grain, _k(dt, 0.30));
  C.streak = lerp(C.streak, T.streak, _k(dt, 0.30));
  C.sat = lerp(C.sat, T.sat, _k(dt, 0.30));
  // 过曝与畸变要快：慢了就没有"炸"的瞬间
  C.flash = lerp(C.flash, T.flash, _k(dt, 0.035));
  C.distort = lerp(C.distort, T.distort, _k(dt, 0.10));
  C.dw = T.dw;
  C.dr = T.dr;

  u.uExposure.value = C.exposure;
  u.uFlash.value = C.flash;
  u.uCA.value = C.ca;
  u.uVig.value = C.vig;
  u.uGrain.value = C.grain;
  u.uStreak.value = C.streak;
  u.uDistort.value = C.distort;
  u.uDR.value = C.dr;
  u.uDW.value = C.dw;
  u.uSat.value = C.sat;
  u.uAspect.value = innerWidth / innerHeight;
  u.uTime.value = time;

  bloomPass.strength = POST.bloom;
  bloomPass.radius = POST.bloomRadius;
  bloomPass.threshold = POST.bloomThreshold;
}


/* ═══════════ camera.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   camera.js — 运镜：脚本化关键帧 + 用户自由环绕（两者叠加，互不打架）
   相机距离一律取"当前特征尺度的倍数"，绝不写死。
   ═══════════════════════════════════════════════════════════════════════════ */

/* [剧情时间, 方位角 θ, 极角 φ]，在相邻关键帧之间用 smoothstep 过渡 */
const CAM_KEYS = [
  [0, -0.34, 1.40],   // I   红超巨星：低角度平视，看到完整的球面
  [15, 0.06, 1.31],
  [22, 0.72, 1.55],   // II  下潜：镜头俯冲
  [28, 1.02, 1.44],   // III 反弹
  [34, 1.52, 1.22],   // IV  复苏：拉回赤道面
  [40, 1.92, 1.33],   // V   突破
  [49, 2.38, 1.25],   // VI  峰值
  [57, 2.86, 1.34],   // VII 冷却
  [74, 3.92, 1.27],   // VIII 脉冲星
];

const camRig = {
  theta: CAM_KEYS[0][1],
  phi: CAM_KEYS[0][2],
  dist: 24,
  shake: 0,
  pos: new THREE.Vector3(),
  look: new THREE.Vector3(),
};

const camUser = { theta: 0, phi: 0, zoom: 1 };

function camKeysAt(storyT) {
  const K = CAM_KEYS;
  if (storyT <= K[0][0]) return { theta: K[0][1], phi: K[0][2] };
  for (let i = 0; i < K.length - 1; i++) {
    if (storyT <= K[i + 1][0]) {
      const k = smoothstep(K[i][0], K[i + 1][0], storyT);
      return {
        theta: lerp(K[i][1], K[i + 1][1], k),
        phi: lerp(K[i][2], K[i + 1][2], k),
      };
    }
  }
  const L = K[K.length - 1];
  return { theta: L[1], phi: L[2] };
}

/* 镜头自动缓慢环绕：关掉自动镜头后不再累加 */
let driftTheta = 0;

function updateCamera(storyT, distUnits, dt, opts) {
  const k = camKeysAt(storyT);
  if (APP.autoCam) driftTheta += dt * 0.013;

  const theta = k.theta + driftTheta + camUser.theta;
  const phi = clamp(k.phi + camUser.phi, 0.10, Math.PI - 0.10);
  const dist = distUnits * camUser.zoom;

  const sp = Math.sin(phi), cp = Math.cos(phi);
  const x = dist * sp * Math.sin(theta);
  const y = dist * cp;
  const z = dist * sp * Math.cos(theta);

  // 抖动：坍缩与突破时的镜头震颤，用双频噪声，避免机械的正弦感
  let sx = 0, sy = 0, sz = 0;
  if (camRig.shake > 0.0005) {
    const t = APP.time;
    sx = (Math.sin(t * 47.3) + Math.sin(t * 23.7) * 0.6) * camRig.shake;
    sy = (Math.cos(t * 41.1) + Math.sin(t * 29.3) * 0.6) * camRig.shake;
    sz = (Math.sin(t * 53.9) + Math.cos(t * 19.1) * 0.6) * camRig.shake;
    camRig.shake *= Math.pow(0.06, dt);       // 指数衰减
  }

  camRig.pos.set(x + sx, y + sy, z + sz);
  camera.position.copy(camRig.pos);
  camera.up.set(0, 1, 0);
  const tgt = opts && opts.target ? opts.target : ORIGIN;
  camera.lookAt(tgt);
  camRig.dist = dist;
}

const ORIGIN = new THREE.Vector3(0, 0, 0);

/* ────────────────────────  交互：拖动 / 滚轮 / 双指  ──────────────────────── */

(function bindCameraInput() {
  const el = canvas;
  const ptrs = new Map();
  let pinch0 = 0, zoom0 = 1;

  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch0 = Math.hypot(a.x - b.x, a.y - b.y);
      zoom0 = camUser.zoom;
    }
    el.style.cursor = 'grabbing';
  });

  el.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0 > 0) camUser.zoom = clamp(zoom0 * (pinch0 / Math.max(d, 1)), 0.2, 6);
      return;
    }
    const k = 0.0042 * (camUser.zoom < 1 ? 0.45 : 1);
    camUser.theta -= dx * k;
    camUser.phi = clamp(camUser.phi - dy * k, -1.2, 1.2);
  });

  const up = (e) => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch0 = 0;
    if (ptrs.size === 0) el.style.cursor = 'grab';
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = Math.exp(clamp(e.deltaY, -120, 120) * 0.0011);
    camUser.zoom = clamp(camUser.zoom * f, 0.2, 6);
  }, { passive: false });

  el.style.cursor = 'grab';
})();

/* 双击复位视角 */
canvas.addEventListener('dblclick', () => {
  camUser.theta = 0; camUser.phi = 0; camUser.zoom = 1;
});

function addShake(a) { camRig.shake = Math.max(camRig.shake, a); }

/* ───────────────────────────  构建界面  ─────────────────────────── */

const HUD = {};

(function initHud() {
  const rail = document.getElementById('rail');
  const segs = document.getElementById('tl-segs');
  const ticks = document.getElementById('tl-ticks');
  const rows = document.getElementById('d-rows');
  const lg = document.getElementById('lg-rows');

  HUD.railItems = PHASES.map((p, i) => {
    const d = document.createElement('div');
    d.className = 'rl';
    d.innerHTML = `<i></i><span>${p.name}</span><em>${p.no}</em>`;
    d.addEventListener('click', () => seekPhase(i));
    rail.appendChild(d);
    return d;
  });

  HUD.segItems = PHASES.map((p) => {
    const d = document.createElement('div');
    d.style.flex = String(p.dur);
    segs.appendChild(d);

    const t = document.createElement('span');
    t.textContent = p.name;
    ticks.appendChild(t);
    return { seg: d, tick: t };
  });

  HUD.rowItems = ROWS.map((r) => {
    const d = document.createElement('div');
    d.className = 'dr ' + r.cls;
    d.innerHTML = `<span class="k">${r.label}</span><span class="v" id="row-${r.k}">—</span>`;
    rows.appendChild(d);
    return { def: r, el: d.querySelector('.v') };
  });

  HUD.lgItems = ELEM.map((e) => {
    const d = document.createElement('div');
    d.className = 'lr';
    const c = `rgb(${e.col.map((v) => Math.round(v * 255)).join(',')})`;
    d.innerHTML = `<i style="background:${c};box-shadow:0 0 8px ${c}"></i>` +
                  `<b>${e.id}</b><span>${e.zh || ''}</span><u>${e.line}</u>`;
    lg.appendChild(d);
    return d;
  });

  HUD.note = {
    phase: document.getElementById('n-phase'),
    en: document.getElementById('n-en'),
    title: document.getElementById('n-title'),
    body: document.getElementById('n-body'),
    facts: document.getElementById('n-facts'),
  };
  HUD.legendPanel = document.getElementById('panel-legend');
  HUD.pulsePanel = document.getElementById('panel-pulse');
  HUD.pulseCanvas = document.getElementById('pulse-canvas');
  HUD.pulseCtx = HUD.pulseCanvas.getContext('2d');
  HUD.psFill = document.getElementById('ps-fill');
  HUD.psVal = document.getElementById('ps-val');
  HUD.clock = document.getElementById('d-clock');
  HUD.cursor = document.getElementById('tl-cursor');
  HUD.track = document.getElementById('tl-track');
  HUD.labelLayer = document.getElementById('labels');
  HUD.hint = document.getElementById('hint');
  HUD.rateVal = document.getElementById('rate-val');
  HUD.scaleBar = document.querySelector('#scalebar .sb-bar');
  HUD.scaleVal = document.querySelector('#scalebar .sb-val');
  HUD.pulseP = document.getElementById('pu-p');
  HUD.pulseRate = document.getElementById('pu-rate');

  /* 时间轴刻度位置 */
  const total = STORY_DUR;
  let acc = 0;
  PHASES.forEach((p, i) => {
    const it = HUD.segItems[i];
    const mid = (acc + p.dur / 2) / total;
    it.tick.style.left = (mid * 100) + '%';
    it.tick.style.display = p.dur / total < 0.07 ? 'none' : '';
    acc += p.dur;
  });

  /* 拖动进度 */
  let dragging = false;
  const seekFromEvent = (e) => {
    const r = HUD.track.getBoundingClientRect();
    const k = clamp((e.clientX - r.left) / r.width, 0, 1);
    APP.storyT = k * total;
    APP.playing = false;
    syncPlayBtn();
  };
  HUD.track.addEventListener('pointerdown', (e) => {
    dragging = true; HUD.track.setPointerCapture(e.pointerId); seekFromEvent(e);
  });
  HUD.track.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
  HUD.track.addEventListener('pointerup', (e) => {
    dragging = false; try { HUD.track.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  /* 控件 */
  document.getElementById('btn-play').addEventListener('click', () => {
    APP.playing = !APP.playing; syncPlayBtn();
  });
  document.getElementById('btn-prev').addEventListener('click', () => stepPhase(-1));
  document.getElementById('btn-next').addEventListener('click', () => stepPhase(1));

  const rate = document.getElementById('rate');
  rate.value = String(APP.rateIdx);
  rate.addEventListener('input', () => {
    APP.rateIdx = +rate.value;
    HUD.rateVal.textContent = APP.rates[APP.rateIdx] + '×';
  });
  HUD.rateVal.textContent = APP.rates[APP.rateIdx] + '×';

  document.querySelectorAll('.tg').forEach((b) => {
    const key = b.dataset.toggle;
    const set = () => {
      b.classList.toggle('on', !!APP[key]);
    };
    b.addEventListener('click', () => { APP[key] = !APP[key]; set(); });
    set();
  });

  /* 快捷键 */
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); APP.playing = !APP.playing; syncPlayBtn(); }
    else if (e.code === 'ArrowRight') stepPhase(1);
    else if (e.code === 'ArrowLeft') stepPhase(-1);
  });

  const killHint = () => { HUD.hint.classList.add('gone'); };
  addEventListener('pointerdown', killHint, { once: true });
  addEventListener('wheel', killHint, { once: true, passive: true });
})();

function syncPlayBtn() {
  document.getElementById('btn-play').textContent = APP.playing ? '❚❚' : '▶';
}

function seekPhase(i) {
  let acc = 0;
  for (let j = 0; j < i; j++) acc += PHASES[j].dur;
  APP.storyT = acc + 0.001;
  APP.phaseJump = true;
}

function stepPhase(d) {
  const cur = APP.cur ? APP.cur.idx : 0;
  seekPhase(clamp(cur + d, 0, PHASES.length - 1));
}

/* ───────────────────────────  每帧更新  ─────────────────────────── */

let lastNoteId = null;
let lastPhaseIdx = -1;

function updateHud(S, storyT) {
  const st = S.story;
  const p = st.phase;

  /* 阶段脊柱 */
  if (st.idx !== lastPhaseIdx) {
    HUD.railItems.forEach((el, i) => {
      el.classList.toggle('on', i === st.idx);
      el.classList.toggle('done', i < st.idx);
    });
    lastPhaseIdx = st.idx;
  }

  /* 解说：只在换段时重写 DOM */
  if (p.id !== lastNoteId) {
    const n = NOTE[p.id];
    HUD.note.phase.textContent = `${p.no} · ${p.name}`;
    HUD.note.en.textContent = p.en;
    HUD.note.title.textContent = n.title;
    HUD.note.body.textContent = n.body;
    HUD.note.facts.innerHTML = n.facts.map((f) => `<li>${f}</li>`).join('');
    lastNoteId = p.id;
  }

  /* 读数 */
  HUD.clock.textContent = fmtTime(S.t);
  for (const r of HUD.rowItems) {
    const v = S.read[r.def.k];
    r.el.innerHTML = v == null ? '—' : v;
  }

  /* 时间轴 */
  HUD.cursor.style.left = (storyT / STORY_DUR * 100) + '%';
  PHASES.forEach((ph, i) => {
    const acc = PHASES.slice(0, i).reduce((s, x) => s + x.dur, 0);
    const it = HUD.segItems[i];
    it.seg.classList.toggle('on', i === st.idx);
    it.seg.classList.toggle('done', storyT >= acc + ph.dur);
  });

  /* 视场尺度与比例尺 */
  HUD.psVal.textContent = fmtLen(S.fieldWidth);
  updateScaleBar(S.fieldWidth);
  const lw = Math.log10(S.fieldWidth);
  HUD.psFill.style.width = (clamp((lw - 2.2) / (16 - 2.2), 0, 1) * 100) + '%';

  /* 图例 */
  HUD.legendPanel.style.opacity = String(clamp(S.legend, 0, 1));
  HUD.pulsePanel.style.opacity = String(clamp(S.pulseOn, 0, 1));
  if (S.pulseOn > 0.02) drawPulse(S);

  /* 三维标注 */
  drawLabels(S.labels);
}

/* ───────────────────────────  比例尺  ─────────────────────────── */

/* 长度单位。取整必须在"显示单位"里做——先按 km 取整再换算，
   会出现 "1.06 光年" 这种既不是整数也不好看的刻度。 */
/* 单位阶梯按"用到多大的量级为止"划分。不要塞"万 km"这类中间单位：
   它到 AU 之间差 1.5 万倍，中间会冒出"9999 万 km"这种标注。 */
const SB_UNITS = [
  { f: 1, name: 'km', max: 1e6 },          // 超过百万公里就换 AU，否则会出现"1×10⁷ km"
  { f: AU_KM, name: 'AU', max: 2000 * AU_KM },  // 超过两千 AU 该用光年了
  { f: LY_KM, name: '光年', max: 1e5 * LY_KM },
  { f: PC_KM, name: 'pc', max: Infinity },
];
const SB_TARGET_PX = 168;      // 条长的目标像素

/* 常用区间用普通小数，超出就走科学计数法（与面板其余数字一致） */
function sbFmt(v) {
  if (v >= 1e4 || v < 1e-3) return fpow(v, 1).replace('.0×', '×');
  const d = v >= 100 ? 0 : v >= 1 ? 1 : v >= 0.01 ? 2 : 3;
  return String(+v.toFixed(d));
}

const niceNumber = (x) => {
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  const m = x / e;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e;
};

function updateScaleBar(fieldWidth) {
  const pxW = innerWidth || 1;
  const kmPerPx = fieldWidth / pxW;
  const rawKm = kmPerPx * SB_TARGET_PX;

  const u = SB_UNITS.find((c) => rawKm < c.max) || SB_UNITS[SB_UNITS.length - 1];

  const nice = niceNumber(rawKm / u.f);
  const km = nice * u.f;
  const px = km / kmPerPx;

  // 长度落在可读区间内才画
  if (!(px > 24 && px < pxW * 0.55)) { HUD.scaleBar.parentElement.style.opacity = '0'; return; }
  HUD.scaleBar.parentElement.style.opacity = '';
  HUD.scaleBar.style.width = Math.round(px) + 'px';

  HUD.scaleVal.textContent = `${sbFmt(nice)} ${u.name}`;
}

/* ───────────────────────────  脉冲轮廓  ─────────────────────────── */

function drawPulse(S) {
  const c = HUD.pulseCtx;
  const W = HUD.pulseCanvas.width, H = HUD.pulseCanvas.height;
  c.clearRect(0, 0, W, H);

  const pad = 6;
  const x0 = pad, x1 = W - pad, y0 = H - 12, y1 = 12;

  // 网格
  c.strokeStyle = 'rgba(140,180,255,0.10)';
  c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = lerp(y0, y1, i / 4);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
  }

  const n = PULSE_CURVE.length;
  // 填充
  c.beginPath();
  c.moveTo(x0, y0);
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, i / (n - 1));
    const y = lerp(y0, y1, PULSE_CURVE[i]);
    c.lineTo(x, y);
  }
  c.lineTo(x1, y0);
  c.closePath();
  const g = c.createLinearGradient(0, y1, 0, y0);
  g.addColorStop(0, 'rgba(143,208,255,0.42)');
  g.addColorStop(1, 'rgba(143,208,255,0.02)');
  c.fillStyle = g;
  c.fill();

  // 曲线
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, i / (n - 1));
    const y = lerp(y0, y1, PULSE_CURVE[i]);
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.strokeStyle = '#8fd0ff';
  c.lineWidth = 1.6;
  c.shadowColor = 'rgba(143,208,255,0.8)';
  c.shadowBlur = 8;
  c.stroke();
  c.shadowBlur = 0;

  // 当前相位游标
  const ph = (S.spinPhase / (Math.PI * 2)) % 1;
  const x = lerp(x0, x1, ph);
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, y1 - 6); c.lineTo(x, y0); c.stroke();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(x, lerp(y0, y1, S.pulse), 2.6, 0, 7); c.fill();

  HUD.pulseP.textContent = `P = ${(PHYS.P_NS * 1000).toFixed(1)} ms`;
  HUD.pulseRate.textContent = `ν = ${(1 / PHYS.P_NS).toFixed(1)} Hz`;
}

/* ───────────────────────────  三维标注投影  ─────────────────────────── */

const _p = new THREE.Vector3();
const _labelEls = [];

function drawLabels(items) {
  const layer = HUD.labelLayer;
  const on = APP.labels && items && items.length;
  if (!on) {
    for (const e of _labelEls) e.classList.remove('on');
    return;
  }
  const W = innerWidth, H = innerHeight;

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    let el = _labelEls[i];
    if (!el) {
      el = document.createElement('div');
      el.className = 'lb';
      layer.appendChild(el);
      _labelEls[i] = el;
    }
    _p.copy(it.pos).project(camera);
    const x = (_p.x * 0.5 + 0.5) * W;
    const y = (-_p.y * 0.5 + 0.5) * H;
    const visible = _p.z < 1 && x > -60 && x < W + 60 && y > -30 && y < H + 30;
    el.classList.toggle('on', visible);
    if (!visible) continue;
    el.className = 'lb on' + (it.cls ? ' ' + it.cls : '') + (x > W * 0.66 ? ' r' : '');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = it.text + (it.val ? `<u>${it.val}</u>` : '');
  }
  for (let i = items.length; i < _labelEls.length; i++) _labelEls[i].classList.remove('on');
}



/* ═══════════ main.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   main.js — 把时间轴、各天体模块、相机、后期与界面接起来
   ═══════════════════════════════════════════════════════════════════════════ */

const WALL_UNITS = 26 * CHAR_UNITS;

/* ───────────────────  由物理时间求界面读数  ─────────────────── */

function readState(t, phase) {
  const R = {};

  if (phase.id === 'pulsar') {
    R.radius = PHYS.R_NS;
    R.temp = PHYS.T_NS_SURF;
    R.rho = PHYS.RHO_NS;
    R.lum = 0;
    R.vel = (Math.PI * 2 * PHYS.R_NS) / PHYS.P_NS;      // 赤道自转线速度 km/s
    return R;
  }

  if (t < 0) {
    R.radius = PHYS.R_RSG;
    R.temp = PHYS.T_RSG;
    R.rho = 1e-7;
    R.lum = PHYS.L_RSG;
    R.vel = 0;
  } else if (t < PHYS.T_COLLAPSE) {
    const k = Math.pow(t / PHYS.T_COLLAPSE, 0.8);
    R.radius = lerp(PHYS.R_FE_CORE, PHYS.R_PNS, k);
    R.temp = lerp(PHYS.T_CORE_PRE, PHYS.T_BOUNCE, k);
    R.rho = Math.pow(10, lerp(9.5, Math.log10(PHYS.RHO_NS), k));
    R.lum = 1e5 * Math.pow(10, k * 2.5);
    R.vel = PHYS.V_INFALL * C_KMS * Math.sqrt(k);
  } else if (t < PHYS.T_BREAKOUT) {
    const k = clamp(Math.log10(t / PHYS.T_COLLAPSE) /
                    Math.log10(PHYS.T_BREAKOUT / PHYS.T_COLLAPSE), 0, 1);
    R.radius = shockRadius(t);
    R.temp = logLerp(2e4, 4e5, 1 - k);
    R.rho = logLerp(1e3, 1e-9, k);
    R.lum = logLerp(1e6, PHYS.L_PEAK * 0.35, k);
    R.vel = shockVelocity(t);
  } else {
    R.radius = photRadius(t);
    R.temp = photTemp(t);
    R.rho = logLerp(1e-10, 1e-21, clamp(Math.log10(t / PHYS.T_BREAKOUT) /
                                        Math.log10(3.156e10 / PHYS.T_BREAKOUT), 0, 1));
    R.lum = lightCurve(t) * PHYS.L_PEAK;
    R.vel = PHYS.V_EJECTA;
  }
  return R;
}

/* 激波速度：对内落激波半径求数值导数，避免另写一套近似 */
function shockVelocity(t) {
  const h = Math.max(t * 1e-4, 1e-6);
  const a = shockRadius(t - h), b = shockRadius(t + h);
  return Math.max((b - a) / (2 * h), 0);
}

/* ───────────────────  由剧情位置求各模块参数  ─────────────────── */

function sceneParams(st, t, dt) {
  const id = st.phase.id;
  const k = st.k;

  const trueScale = PHYS.R_RSG / st.view;
  const starOutside = 1 - smoothstep(1.0, 1.45, trueScale / WALL_UNITS);
  const inside = 1 - starOutside;

  // 光球何时被炸开
  const starAlive = 1 - smoothstep(PHYS.T_BREAKOUT * 0.62, PHYS.T_BREAKOUT * 1.05, t);

  // 坍缩与激波穿行时剧烈湍流
  const churn =
    1 +
    3.4 * Math.exp(-Math.pow((t - PHYS.T_COLLAPSE * 0.7) / (PHYS.T_COLLAPSE * 0.55), 2)) +
    2.0 * smoothstep(PHYS.T_COLLAPSE, PHYS.T_COLLAPSE * 2.5, t) *
          (1 - smoothstep(PHYS.T_BREAKOUT * 0.5, PHYS.T_BREAKOUT, t));

  const disp = 1 + 2.6 * (churn - 1) / 3.4;

  // 抛射物何时接管
  const ejLive = smoothstep(PHYS.T_BREAKOUT * 0.55, PHYS.T_BREAKOUT * 1.15, t);

  // 中微子爆发：用剧情时间展开（真实时标下它快到看不见）
  let nuFade = 0, nuK = 0;
  if (id === 'bounce') {
    nuFade = smoothstep(0.02, 0.16, k) * (1 - smoothstep(0.55, 1.0, k));
    nuK = smoothstep(0.04, 0.95, k);
  } else if (id === 'revival') {
    nuFade = 0.16 * (1 - smoothstep(0, 0.35, k));
    nuK = 1;
  }

  // 闪白与镜头抖动
  let flash = 0, shake = 0;
  const flashAt = (center, width, amp) =>
    amp * Math.exp(-Math.pow((st.storyT - center) / width, 2));
  let acc = 0;
  const storyOf = (pid) => {
    let a = 0;
    for (const p of PHASES) { if (p.id === pid) return a; a += p.dur; }
    return 0;
  };
  // 反弹就发生在 bounce 段的起点（t = 0.12 s），闪光必须压在那一刻。
  // 原来中心偏后 0.35 s、宽度 0.55 s、幅度 0.85，等于整段前 1.5 秒
  // 都糊着一层白，把这一段的内容全盖住了。
  flash += flashAt(storyOf('bounce') + 0.10, 0.30, 1.0);
  shake += flashAt(storyOf('bounce') + 0.10, 0.45, 0.09);
  // 突破同样是"瞬间"，别拖长
  flash += flashAt(storyOf('breakout') + 0.25, 0.42, 1.0);
  shake += flashAt(storyOf('breakout') + 0.25, 0.70, 0.16);

  // 冲击波环形畸变：跟着闪白走
  const distRing = clamp(flash, 0, 1);
  const dr = clamp((st.storyT % 100) / 100, 0, 1);

  // 遗迹丝状结构 & 尘埃：后期才出现
  const filament = smoothstep(1.5e7, 6e7, t);
  const dust = smoothstep(2e7, 1.2e8, t) * (1 - smoothstep(2e9, 1e10, t));

  // 脉冲星
  const pulsarOn = id === 'pulsar' ? smoothstep(0.0, 0.16, k) : 0;

  return {
    starOutside, inside, starAlive, churn, disp, ejLive,
    nuFade, nuK, nuR: lerp(PHYS.R_PNS * 3, 34 * st.char, Math.pow(nuK, 0.7)),
    flash: clamp(flash, 0, 1), shake, distRing, dr,
    filament, dust, pulsarOn,
    wallUnits: WALL_UNITS,
    interiorOn: Math.max(APP.interior ? 1 : 0, inside),
    starFade: starAlive,
  };
}

/* ───────────────────  三维标注  ─────────────────── */

const _right = new THREE.Vector3();
const _up = new THREE.Vector3();
const _fwd = new THREE.Vector3();

function buildLabels(st, P, layers, ej, ps) {
  const out = [];
  const view = st.view;
  camera.getWorldDirection(_fwd);
  _right.crossVectors(camera.up, _fwd).normalize();
  _up.crossVectors(_fwd, _right).normalize();

  const put = (dir, distScene, text, val, cls) => {
    out.push({
      pos: new THREE.Vector3()
        .copy(_right).multiplyScalar(dir[0] * distScene)
        .addScaledVector(_up, dir[1] * distScene)
        .addScaledVector(_fwd, dir[2] * distScene),
      text, val, cls,
    });
  };

  // 内部分层
  if (layers && P.interiorOn > 0.25) {
    const shown = ['He', 'CO', 'ONe', 'Si', 'Fe'];
    let i = 0;
    for (const L of layers) {
      if (!shown.includes(L.id)) continue;
      const a = -0.55 + i * 0.28;
      const dir = [Math.cos(a), Math.sin(a), 0];
      put(dir, L.disp * 1.02, L.name,
          L.rTrue > 1e6 ? fmtLen(L.rTrue) : `${sci(L.rTrue, 1)} km`, 'hot');
      i++;
    }
  }

  // 抛射物成分
  if (ej && P.ejLive > 0.4) {
    const Rsh = ej.Rsh / view;
    const marks = [
      { d: 1.00, t: '氢 Hα', c: 'hot' },
      { d: 0.78, t: '氦 He I', c: '' },
      { d: 0.55, t: '氧 [O III]', c: '' },
      { d: 0.30, t: '硅 / 铁', c: '' },
    ];
    marks.forEach((m, i) => {
      const a = 0.9 + i * 0.42;
      put([Math.cos(a), Math.sin(a) * 0.55, 0], Rsh * m.d, m.t, '', m.c);
    });
  }

  // 脉冲星风星云
  if (ps && P.pulsarOn > 0.4) {
    const v = view;
    if (ps.pwnFade > 0.1) {
      put([0, 0.9, 0], R_JET / v * 0.95, '喷流', 'JET', '');
      put([0.95, 0.05, 0], R_TORUS / v * 1.02, '赤道环面', 'TORUS', 'hot');
    } else if (ps.lcFade > 0.1) {
      put([0.9, 0.35, 0], R_LC / v * 0.98, '光柱面', 'c·P/2π', '');
    } else if (ps.beamFade > 0.1) {
      put([0.85, 0.5, 0], PHYS.R_NS / v * 2.6, '射电光柱', '', 'hot');
      put([-0.8, -0.5, 0], PHYS.R_NS / v * 3.2, '中子星', `${PHYS.R_NS} km`, '');
    }
  }
  return out;
}

/* ───────────────────  主循环  ─────────────────── */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  bloomPass.resolution.set(innerWidth, innerHeight);
});

let last = performance.now();
let frames = 0;
let smoothFps = 60;

/* 自适应分辨率：软件渲染或弱显卡上帧率会掉到个位数，
   与其卡着不如降采样——这比砍掉内容划算。带冷却，避免来回震荡。 */
const BASE_PR = Math.min(devicePixelRatio, 1.75);
let qLevel = 1;
function applyQuality() {
  renderer.setPixelRatio(BASE_PR * qLevel);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(BASE_PR * qLevel);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.resolution.set(innerWidth, innerHeight);
}
/* 必须用未钳的原始帧时间来判断：动画用的 dt 被 min(·, 0.05) 钳过，
   帧率低时它恒为 0.05，拿它算帧率永远算出 20 —— 那正是需要降档的情形。 */
let qAcc = 0, qFrames = 0;
function adaptQuality(rawDt) {
  qAcc += rawDt; qFrames++;
  if (qAcc < 0.6) return;
  const f = qFrames / qAcc;
  qAcc = 0; qFrames = 0;
  // 乘性步进，几帧内就能收敛到合适档位
  if (f < 24 && qLevel > 0.40) { qLevel = Math.max(0.40, qLevel * 0.70); applyQuality(); }
  else if (f > 50 && qLevel < 1) { qLevel = Math.min(1, qLevel * 1.25); applyQuality(); }
}

function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = (now - last) / 1000;
  const dt = Math.min(rawDt, 0.05);      // 动画步长钳位，防止切标签页回来时跳帧
  last = now;
  APP.time += dt;
  smoothFps = lerp(smoothFps, 1 / Math.max(rawDt, 1e-4), 0.08);
  adaptQuality(rawDt);

  /* 推进剧情时间 */
  if (APP.playing) {
    APP.storyT += dt * APP.rates[APP.rateIdx];
    if (APP.storyT >= STORY_DUR) { APP.storyT = STORY_DUR; APP.playing = false; syncPlayBtn(); }
  }
  if (APP.phaseJump) { APP.phaseJump = false; camRig.shake = 0; }

  const st = timelineAt(APP.storyT);
  APP.cur = st;
  const t = st.t;
  const P = sceneParams(st, t, dt);

  /* 天体 */
  updateSky(APP.time);
  updateStar(st.view, APP.time, {
    camDist: camRig.dist,
    alive: P.starAlive,
    churn: P.churn,
    disp: P.disp,
    lum: 1,
    tbase: lerp(PHYS.T_RSG, 5200, clamp((t) / PHYS.T_COLLAPSE, 0, 1) * 0.6),
    cut: P.interiorOn,
    wind: 1 - P.inside,
    dust: 1,
    dustIn: clamp(t / PHYS.T_COLLAPSE, 0, 1),
    wallUnits: P.wallUnits,
  });

  const layers = updateInterior(t, st.view, {
    visible: P.interiorOn * P.starAlive,
    wallUnits: P.wallUnits,
    camDist: camRig.dist,
    time: APP.time,
    cut: P.interiorOn > 0.6 ? 1 : 0,      // 看内部结构时一律剖开
    cutN: SU.uCutN.value,
    heat: clamp((t / PHYS.T_COLLAPSE) * (1 - t / (PHYS.T_COLLAPSE * 3)), 0, 1) * 0.9,
    envStart: PHYS.T_BREAKOUT * 0.45,
    envDur: PHYS.T_BREAKOUT * 1.6,
    envExpand: 3.2,
    // 淡出时标要挂在 T_BREAKOUT 上。以前挂在 T_COLLAPSE 的倍数上，
    // 坍缩时标从 0.45 s 改成 0.12 s 之后，它在复苏段开头的一帧内就消失了。
    nsFade: smoothstep(-PHYS.T_COLLAPSE * 0.15, PHYS.T_COLLAPSE * 0.55, t) *
            (1 - smoothstep(PHYS.T_BREAKOUT * 0.35, PHYS.T_BREAKOUT * 0.95, t)),
    nsBright: 0.55 + 0.85 * clamp(t / PHYS.T_COLLAPSE, 0, 1),
  });

  updateCollapse(t, st.view, st.storyT, {
    nuK: P.nuK, nuFade: P.nuFade, nuR: P.nuR, time: APP.time,
  });

  const ej = updateEjecta(t, st.view, {
    live: P.ejLive,
    camDist: camRig.dist,
    time: APP.time,
    dust: P.dust,
    filament: P.filament,
    ni: smoothstep(1.2e6, 6e6, t),
    shockVis: 1,
  });

  const ps = updatePulsar(t, st.view, dt, {
    show: P.pulsarOn,
    field: APP.field ? 1 : 0,
    camDist: camRig.dist,
    time: APP.time,
    spinRate: 1.6,
  });

  /* 相机 */
  updateCamera(st.storyT, st.cam * CHAR_UNITS, dt);
  if (P.shake > 0.0002) addShake(P.shake);

  /* 后期 */
  const T2 = POST.t;
  T2.flash = P.flash;
  T2.exposure = 0.92;
  T2.ca = 0.055 + 0.55 * P.flash + (st.phase.id === 'pulsar' ? 0.07 : 0);
  T2.vig = 0.60;
  T2.grain = 0.016 + 0.035 * P.flash;
  T2.streak = (st.phase.id === 'pulsar' ? 0.05 : 0.12) + 0.5 * P.flash;
  T2.sat = st.phase.id === 'rsg' ? 1.08 : 1.0;
  T2.distort = P.distRing * 0.55;
  T2.dr = 0.06 + P.dr * 0.6;
  T2.dw = 0.06 + P.dr * 0.10;
  updatePost(dt, APP.time);

  /* 界面 */
  const read = readState(t, st.phase);
  const fieldWidth = 2 * camRig.dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
                     * camera.aspect * st.view;
  const compress = (st.phase.t1 - st.phase.t0) / st.phase.dur;

  updateHud({
    story: st, t, read: {
      t: fmtTime(t),
      radius: fmtLen(read.radius),
      temp: read.temp ? `${sci(read.temp)} K` : '—',
      rho: read.rho ? `${sci(read.rho)} g/cm³` : '—',
      lum: read.lum ? `${sci(read.lum)} L☉` : (st.phase.id === 'pulsar' ? '—' : '—'),
      vel: read.vel ? `${sci(read.vel)} km/s` : '—',
      compress: compress > 1.5 ? `1 s ≈ ${sci(compress)} s` : '实时',
    },
    fieldWidth,
    legend: P.ejLive * (1 - P.pulsarOn),
    pulseOn: P.pulsarOn * (ps ? 1 : 0),
    spinPhase: ps ? ps.spinPhase : 0,
    pulse: ps ? ps.pulse : 0,
    labels: buildLabels(st, P, layers, ej, ps),
  }, APP.storyT);

  if (window.__SN_HALT) return;
  composer.render();

  frames++;
  if (!window.__SN_READY__ && frames > 2) {
    window.__SN_READY__ = true;
    document.documentElement.dataset.ready = '1';
    document.getElementById('boot').classList.add('gone');
  }
}

/* 测试与调试入口 */
window.__SN_STATE = () => ({
  storyT: +APP.storyT.toFixed(3),
  phase: APP.cur ? APP.cur.phase.id : null,
  t: APP.cur ? APP.cur.t : null,
  view: APP.cur ? APP.cur.view : null,
  fps: +smoothFps.toFixed(1),
  q: +qLevel.toFixed(2),
  camDist: +camRig.dist.toFixed(3),
  starOutside: +starOutside.toFixed(4),
  starR: +(PHYS.R_RSG / APP.cur.view).toFixed(2),
  pnsFade: +pnsU.uFade.value.toFixed(4),
  fieldOp: +magLines.material.opacity.toFixed(4),
  buf: [renderer.domElement.width, renderer.domElement.height],
  calls: renderer.info.render.calls,
  tris: renderer.info.render.triangles,
  pts: renderer.info.render.points,
});
window.__SN_SEEK = (i) => { seekPhase(clamp(i | 0, 0, PHASES.length - 1)); };
window.__SN_SET = (v, playing) => {
  APP.storyT = clamp(+v, 0, STORY_DUR);
  APP.playing = !!playing;
  syncPlayBtn();
};
window.__SN_T = { THREE, renderer, scene, camera, composer, APP, PHYS, POST, PHASES };

syncPlayBtn();
requestAnimationFrame(frame);

</script>
