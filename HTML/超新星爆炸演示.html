<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>超新星 · 从红超巨星到脉冲星</title>
<script>
/* 早期错误捕获：模块求值阶段就抛错时，模块内的监听还没注册，只能放在这里 */
window.__SN_ERR = [];
addEventListener('error', function (e) {
  window.__SN_ERR.push((e.message || 'error') + '  @' + (e.filename || '?') + ':' + (e.lineno || 0));
}, true);
addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  window.__SN_ERR.push('reject: ' + ((r && (r.stack || r.message)) || r));
});
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   style.css — 观测台控制台界面
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#03050a;
  --panel:rgba(8,12,20,.60);
  --panel-solid:rgba(6,9,16,.88);
  --line:rgba(140,180,255,.13);
  --line-hi:rgba(150,200,255,.34);
  --txt:#dde7f6;
  --dim:#7b8aa2;
  --dim2:#57647a;
  --hot:#ffb066;
  --cool:#8fd0ff;
  --violet:#b79bff;
  --ok:#7fe0b0;
  --mono:ui-monospace,"Cascadia Mono","Consolas","SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  --r:11px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0}

#stage{position:fixed;inset:0;display:block;width:100%;height:100%}

/* ── 启动遮罩 ── */
#boot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#0a1020 0%,#03050a 70%);
  transition:opacity .7s ease}
#boot.gone{opacity:0;pointer-events:none}
.boot-box{width:320px;text-align:center}
.boot-title{font:600 30px/1 var(--mono);letter-spacing:.42em;text-indent:.42em;
  color:#eaf1ff;text-shadow:0 0 26px rgba(140,190,255,.55)}
.boot-sub{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:.06em}
.boot-track{margin-top:20px;height:2px;background:rgba(140,180,255,.14);overflow:hidden;border-radius:2px}
.boot-track i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5a8fd0,#cfe4ff);
  transition:width .3s ease;box-shadow:0 0 10px rgba(150,200,255,.8)}
.boot-err{margin-top:16px;color:#ff8b7a;font:12px/1.6 var(--mono);
  white-space:pre-wrap;text-align:left;max-height:220px;overflow:auto}

/* ── 顶栏 ── */
#topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:linear-gradient(180deg,rgba(3,5,10,.92) 0%,rgba(3,5,10,0) 100%);
  pointer-events:none}
#topbar>*{pointer-events:auto}
.tb-brand{display:flex;align-items:center;gap:11px}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 12px var(--hot);flex:none}
.tb-txt{display:flex;flex-direction:column;gap:2px}
.tb-txt b{font-size:14px;font-weight:600;letter-spacing:.10em}
.tb-txt i{font-style:normal;font-size:10px;color:var(--dim2);letter-spacing:.10em}
.tb-txt sub{font-size:8px}

.tb-right{display:flex;gap:7px}
.tg{font-family:var(--sans);font-size:11.5px;color:var(--dim);cursor:pointer;
  padding:6px 12px;border:1px solid var(--line);border-radius:7px;
  background:rgba(10,15,26,.7);transition:.18s;letter-spacing:.05em}
.tg:hover{color:var(--txt);border-color:var(--line-hi);background:rgba(20,30,50,.8)}
.tg.on{color:#06101c;background:linear-gradient(180deg,#cfe4ff,#8fbcf0);
  border-color:#cfe4ff;font-weight:600;box-shadow:0 0 16px rgba(140,190,255,.35)}

/* ── 左列 / 右列 ── */
#col-left{position:fixed;left:164px;top:66px;width:268px;z-index:20;
  display:flex;flex-direction:column;gap:10px}
#col-right{position:fixed;right:20px;top:66px;bottom:118px;width:342px;z-index:20;
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
#col-right>*{pointer-events:auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(180,215,255,.06);
  overflow:hidden;flex:none}
.p-head{display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px 8px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase}
.p-head em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:.04em;text-transform:none}

/* ── 阶段脊柱 ── */
#rail{position:fixed;left:0;top:54px;bottom:108px;width:150px;z-index:25;
  padding:14px 0 14px 18px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#rail::before{content:"";position:absolute;left:24px;top:24px;bottom:24px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(140,180,255,.22) 12%,
    rgba(140,180,255,.22) 88%,transparent)}
.rl{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;
  position:relative;transition:.2s}
.rl i{width:7px;height:7px;border-radius:50%;flex:none;margin-left:3px;
  background:#1b2436;border:1px solid rgba(140,180,255,.28);transition:.25s;z-index:1}
.rl span{font-size:11.5px;color:var(--dim2);letter-spacing:.05em;transition:.2s;
  white-space:nowrap}
.rl em{font-style:normal;font:9px var(--mono);color:#39445a;letter-spacing:.08em;
  margin-left:auto;padding-right:8px}
.rl:hover span{color:var(--dim)}
.rl.done i{background:#31405c;border-color:#4a5f85}
.rl.on i{width:10px;height:10px;margin-left:1px;background:var(--hot);border-color:#ffd9b0;
  box-shadow:0 0 14px var(--hot),0 0 30px rgba(255,176,102,.45)}
.rl.on span{color:#fff;font-weight:600;font-size:12.5px}
.rl.on em{color:var(--hot)}

/* ── 物理量读数 ── */
#d-rows{padding:8px 13px 10px}
.dr{display:grid;grid-template-columns:1fr auto;align-items:baseline;
  gap:8px;padding:4.5px 0;border-bottom:1px dashed rgba(140,180,255,.07)}
.dr:last-child{border-bottom:none}
.dr .k{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.dr .v{font-family:var(--mono);font-size:12px;color:var(--txt);
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dr .v b{color:#fff;font-weight:600}
.dr .v u{text-decoration:none;color:var(--dim2);font-size:10px;margin-left:2px}
.dr.hot .v{color:var(--hot)}
.dr.cool .v{color:var(--cool)}
.dr.vio .v{color:var(--violet)}
.dr .bar{grid-column:1/-1;height:2px;background:rgba(140,180,255,.10);
  border-radius:2px;overflow:hidden;margin-top:3px}
.dr .bar i{display:block;height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#6a8fd0,#cfe4ff);transition:width .12s linear}

.p-scale{padding:9px 13px 11px;border-top:1px solid var(--line)}
.ps-bar{height:2px;background:rgba(140,180,255,.10);border-radius:2px;overflow:hidden}
.ps-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3d5a86,#9fc4f0)}
.ps-txt{display:flex;justify-content:space-between;margin-top:6px;
  font-size:10px;color:var(--dim2);letter-spacing:.06em}
.ps-txt b{font-family:var(--mono);color:var(--txt);font-size:11px;letter-spacing:0}

/* ── 解说 ── */
#panel-note{padding-bottom:12px}
#panel-note h2{font-size:17px;font-weight:600;letter-spacing:.06em;
  padding:12px 14px 0;color:#fff}
#panel-note p{padding:8px 14px 0;font-size:12px;line-height:1.78;color:#a9b8ce;
  text-align:justify}
#n-facts{list-style:none;padding:10px 14px 0;display:flex;flex-direction:column;gap:5px}
#n-facts li{font-size:11px;line-height:1.6;color:var(--dim);
  padding-left:13px;position:relative}
#n-facts li::before{content:"";position:absolute;left:2px;top:7px;width:3px;height:3px;
  border-radius:50%;background:var(--hot)}
#n-facts li b{color:#d8e3f5;font-family:var(--mono);font-weight:500}

/* ── 图例 ── */
#lg-rows{padding:9px 13px 11px;display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.lr i{width:16px;height:2px;border-radius:2px;flex:none}
.lr b{color:#c8d6ea;font-weight:500}
.lr u{text-decoration:none;margin-left:auto;font-family:var(--mono);
  font-size:10px;color:var(--dim2)}
#panel-legend{opacity:0;transition:opacity .5s}

/* ── 脉冲轮廓 ── */
#panel-pulse{margin-top:auto}
#pulse-canvas{display:block;width:100%;height:78px;margin:6px 0 2px}
.pulse-foot{display:flex;justify-content:space-between;padding:0 13px 9px;
  font-size:9.5px;color:var(--dim2);letter-spacing:.08em}
.pulse-foot span:nth-child(2){font-family:var(--mono);color:var(--cool)}
#panel-pulse{opacity:0;transition:opacity .5s}

/* ── 比例尺 ── */
#scalebar{position:fixed;left:168px;bottom:124px;z-index:26;pointer-events:none;
  display:flex;align-items:center;gap:10px;opacity:.94}
.sb-bar{position:relative;height:9px;border-bottom:1px solid rgba(196,222,255,.78);
  box-shadow:0 1px 6px rgba(120,170,255,.22)}
.sb-bar i{position:absolute;bottom:0;width:1px;height:9px;background:rgba(196,222,255,.78)}
.sb-bar i.l{left:0}
.sb-bar i.r{right:0}
.sb-val{font-family:var(--mono);font-size:12px;color:#e8f1ff;letter-spacing:.02em;
  white-space:nowrap;font-variant-numeric:tabular-nums;
  text-shadow:0 0 9px #000,0 0 3px #000}

/* ── 三维标注 ── */
#labels{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:10.5px;letter-spacing:.06em;color:#cfe0f5;
  padding:2px 8px;border-radius:20px;border:1px solid rgba(150,200,255,.22);
  background:rgba(6,10,18,.55);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .3s;text-shadow:0 0 8px rgba(0,0,0,.9)}
.lb.on{opacity:1}
.lb::before{content:"";position:absolute;left:-9px;top:50%;width:5px;height:1px;
  background:rgba(150,200,255,.5)}
.lb.r::before{left:auto;right:-9px}
.lb u{text-decoration:none;font-family:var(--mono);font-size:9.5px;
  color:var(--dim);margin-left:5px}
.lb.hot{border-color:rgba(255,176,102,.4);color:#ffd7ab}
.lb.hot::before{background:rgba(255,176,102,.6)}

/* ── 时间轴 ── */
#timeline{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:30;
  display:flex;align-items:center;gap:18px;padding:0 22px 14px;
  background:linear-gradient(0deg,rgba(3,5,10,.95) 30%,rgba(3,5,10,0) 100%)}
.tl-transport{display:flex;gap:8px;flex:none}
.tl-transport button{width:40px;height:34px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:rgba(10,15,26,.75);color:var(--dim);
  font-size:11px;transition:.16s;font-family:var(--mono)}
.tl-transport button:hover{color:#fff;border-color:var(--line-hi);background:rgba(22,32,52,.9)}
.tl-transport button.primary{width:46px;color:#06101c;
  background:linear-gradient(180deg,#dbeaff,#8fbcf0);border-color:#cfe4ff;font-size:13px}
.tl-transport button.primary:hover{filter:brightness(1.08)}

.tl-track{flex:1;position:relative;height:36px;cursor:pointer}
.tl-seg{position:absolute;inset:11px 0;display:flex;gap:2px}
.tl-seg>div{height:100%;border-radius:2px;background:rgba(140,180,255,.10);
  transition:background .2s;position:relative;overflow:hidden}
.tl-seg>div.done{background:rgba(140,180,255,.22)}
.tl-seg>div.on{background:rgba(255,176,102,.30)}
.tl-seg>div.on::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(255,176,102,.5),transparent)}
.tl-cursor{position:absolute;top:4px;width:2px;height:28px;margin-left:-1px;
  background:#fff;box-shadow:0 0 10px #fff,0 0 24px rgba(200,225,255,.85);
  border-radius:2px;pointer-events:none}
.tl-cursor::after{content:"";position:absolute;left:-4px;top:-3px;width:10px;height:10px;
  border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
.tl-ticks{position:absolute;inset:0;pointer-events:none}
.tl-ticks span{position:absolute;bottom:-2px;transform:translateX(-50%);
  font-size:9px;color:var(--dim2);letter-spacing:.05em;white-space:nowrap}

.tl-meta{flex:none;display:flex;align-items:center;gap:14px}
.tl-rate{display:flex;align-items:center;gap:9px}
.tl-rate label{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.tl-rate input{-webkit-appearance:none;appearance:none;width:96px;height:2px;
  background:rgba(140,180,255,.18);border-radius:2px;outline:none;cursor:pointer}
.tl-rate input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:#cfe4ff;box-shadow:0 0 10px rgba(180,215,255,.7);cursor:pointer}
.tl-rate input::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;
  background:#cfe4ff;cursor:pointer}
.tl-rate b{font-family:var(--mono);font-size:11px;color:var(--txt);width:34px}

#hint{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:29;
  font-size:10.5px;color:var(--dim2);letter-spacing:.09em;pointer-events:none;
  transition:opacity .8s;text-shadow:0 0 12px #000}
#hint.gone{opacity:0}

/* 低分辨率下让出空间 */
@media (max-width:1180px){
  #col-right{width:298px}
  #col-left{width:236px;left:150px}
}
@media (max-width:900px){
  #panel-legend,#panel-pulse{display:none}
  #scalebar{left:12px;bottom:118px}
  #col-left{left:12px;width:210px}
  #col-right{width:250px;right:12px}
  #rail{display:none}
  #hint{display:none}
}
@media (max-width:640px){
  #col-left,#col-right{display:none}
  #scalebar{left:12px;bottom:112px}
  #topbar{padding:0 12px}
  .tb-txt i{display:none}
}

</style>
</head>
<body>

<canvas id="stage"></canvas>


<!-- 启动遮罩，同时作为就绪信号 -->
<div id="boot">
  <div class="boot-box">
    <div class="boot-title">SUPERNOVA</div>
    <div class="boot-sub">正在装载星体模型与着色器…</div>
    <div class="boot-track"><i id="boot-fill"></i></div>
    <div class="boot-err" id="boot-err"></div>
  </div>
</div>

<!-- 顶栏 -->
<header id="topbar">
  <div class="tb-brand">
    <span class="tb-dot"></span>
    <div class="tb-txt">
      <b>超新星爆发全流程</b>
      <i>Core-Collapse Supernova &middot; 20 M<sub>☉</sub> 前身星</i>
    </div>
  </div>
  <div class="tb-right">
    <button class="tg" data-toggle="interior" title="剖开恒星，显示洋葱式分层结构">内部结构</button>
    <button class="tg" data-toggle="field" title="中子星磁力线与光柱面">磁场</button>
    <button class="tg" data-toggle="labels" title="三维标注">标注</button>
    <button class="tg" data-toggle="auto" title="自动运镜，关闭后完全手动">自动镜头</button>
  </div>
</header>

<!-- 左侧阶段脊柱 -->
<nav id="rail"></nav>

<!-- 左列 -->
<div id="col-left">
  <section id="panel-data" class="panel">
    <div class="p-head"><span>物理状态</span><em id="d-clock">—</em></div>
    <div id="d-rows"></div>
    <div class="p-scale">
      <div class="ps-bar"><i id="ps-fill"></i></div>
      <div class="ps-txt"><span>视场宽度</span><b id="ps-val">—</b></div>
    </div>
  </section>
</div>

<!-- 右列 -->
<div id="col-right">
  <section id="panel-note" class="panel">
    <div class="p-head"><span id="n-phase">—</span><em id="n-en">—</em></div>
    <h2 id="n-title">—</h2>
    <p id="n-body">—</p>
    <ul id="n-facts"></ul>
  </section>

  <section id="panel-legend" class="panel">
    <div class="p-head"><span>抛射物成分</span><em>EMISSION LINES</em></div>
    <div id="lg-rows"></div>
  </section>

  <section id="panel-pulse" class="panel">
    <div class="p-head"><span>射电脉冲轮廓</span><em id="pu-p">P = —</em></div>
    <canvas id="pulse-canvas" width="560" height="140"></canvas>
    <div class="pulse-foot">
      <span>0</span><span id="pu-rate">—</span><span>相位</span>
    </div>
  </section>
</div>

<!-- 比例尺：随镜头缩放，条长取整数物理长度 -->
<div id="scalebar">
  <div class="sb-bar"><i class="l"></i><i class="r"></i></div>
  <div class="sb-val">—</div>
</div>

<!-- 三维标注层 -->
<div id="labels"></div>

<!-- 时间轴 -->
<footer id="timeline">
  <div class="tl-transport">
    <button id="btn-prev" title="上一阶段">◀◀</button>
    <button id="btn-play" class="primary" title="播放 / 暂停">❚❚</button>
    <button id="btn-next" title="下一阶段">▶▶</button>
  </div>
  <div class="tl-track" id="tl-track">
    <div class="tl-seg" id="tl-segs"></div>
    <div class="tl-cursor" id="tl-cursor"></div>
    <div class="tl-ticks" id="tl-ticks"></div>
  </div>
  <div class="tl-meta">
    <div class="tl-rate">
      <label>速度</label>
      <input id="rate" type="range" min="0" max="4" step="1" value="2">
      <b id="rate-val">1×</b>
    </div>
  </div>
</footer>

<div id="hint">拖动旋转 · 滚轮缩放 · 空格播放/暂停 · ← → 切换阶段</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">

/* ═══════════ core.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   core.js — 依赖、着色器公共代码、全局状态、时间轴
   ═══════════════════════════════════════════════════════════════════════════ */

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';


/* ─────────────────────────────  物理常数  ─────────────────────────────
   数值见 README「数据来源」。凡是标注 [VERIFIED] 的都经过来源核对。   */

const C_KMS = 299792.458;          // 光速 km/s
const RSUN_KM = 695700;            // 太阳半径 km
const AU_KM = 1.495978707e8;       // 天文单位 km
const LY_KM = 9.4607304725808e12;  // 光年 km
const PC_KM = 3.0856775814913673e13;
const YR_S = 3.155693e7;           // 儒略年 s

const PHYS = {
  // ── 前身星：20 M☉ 红超巨星（II-P 型典型值）
  R_RSG: 1000 * RSUN_KM,        // 前身星半径 km（红超巨星常见 200–800 R☉，取 1000 作代表值）
  T_RSG: 3500,                  // 有效温度 K
  L_RSG: 2.5e5,                 // 光度 L☉
  R_FE_CORE: 3000,              // 铁核半径 km（坍缩前，量级估计；未见权威来源给出确定值）
  T_CORE_PRE: 3.0e9,            // 中心温度 K（硅燃烧末期）

  // ── 坍缩
  T_COLLAPSE: 0.12,             // 铁核内落时标 s（内核自由落体仅约 10 ms，Woosley）

/* ─────────────────────────  权威 GLSL：simplex 噪声  ─────────────────────────
   来源：https://github.com/ashima/webgl-noise  src/noise3D.glsl（2020-10-14 版）
   MIT License, Copyright (C) 2011 Ashima Arts.
   注意本版与旧版不同：permute 用 (x*34.0)+10.0，尾部为 0.5-… 乘 105.0
   （旧版是 +1.0 与 0.6-… 乘 42.0）。改动一个字都会静默产出垃圾。            */

const GLSL_NOISE = /* glsl */`
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2  C = vec2(1.0/6.0, 1.0/3.0);
  const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 =   v - i + dot(i, C.xxx);

  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;

  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));

  float n_ = 0.142857142857;
  vec3  ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);

  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);

  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);

  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 105.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

/* fbm / 脊状噪声 / 域扭曲 —— 建立在 snoise 之上 */
const GLSL_FBM = /* glsl */`
float fbm(vec3 p, int oct, float lac, float gain) {
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++) {
    if (i >= oct) break;
    s += a * snoise(p);
    n += a;
    p *= lac;
    a *= gain;
  }
  return s / max(n, 1e-6);
}

/* 脊状：1-|n| 会在 n=0 的等值面处形成线状网络，正是遗迹丝状结构的形态 */
float ridged(vec3 p, int oct, float lac, float gain) {
  float a = 0.5, s = 0.0, n = 0.0;
  for (int i = 0; i < 8; i++) {
    if (i >= oct) break;
    s += a * (1.0 - abs(snoise(p)));
    n += a;
    p *= lac;
    a *= gain;
  }
  return s / max(n, 1e-6);
}

vec3 domainWarp(vec3 p, float amp) {
  return p + amp * vec3(
    snoise(p + vec3(11.3, 0.0, 0.0)),
    snoise(p + vec3(0.0, 27.1, 0.0)),
    snoise(p + vec3(0.0, 0.0, 41.7)));
}
`;

/* ───────────────────────  黑体色 → 线性 sRGB  ───────────────────────
   CIE 普朗克轨迹用 Kim et al. 的三次多项式拟合，再经 XYZ(D65)→sRGB 矩阵。
   有效区间 1667–25000 K。返回值按最大通道归一，亮度由调用方另行控制。 */

const GLSL_BLACKBODY = /* glsl */`
vec3 blackbodyRGB(float T) {
  T = clamp(T, 1667.0, 25000.0);
  float t2 = T * T, t3 = t2 * T;
  float x;
  if (T < 4000.0) {
    x = -0.2661239e9 / t3 - 0.2343589e6 / t2 + 0.8776956e3 / T + 0.179910;
  } else {
    x = -3.0258469e9 / t3 + 2.1070379e6 / t2 + 0.2226347e3 / T + 0.240390;
  }
  float x2 = x * x, x3 = x2 * x;
  float y;
  if (T < 2222.0)      y = -1.1063814 * x3 - 1.34811020 * x2 + 2.18555832 * x - 0.20219683;
  else if (T < 4000.0) y = -0.9549476 * x3 - 1.37418593 * x2 + 2.09137015 * x - 0.16748867;
  else                 y =  3.0817580 * x3 - 5.87338670 * x2 + 3.75112997 * x - 0.37001483;

  float yy = max(y, 1e-4);
  float X = x / yy, Y = 1.0, Z = (1.0 - x - y) / yy;

  vec3 rgb = vec3(
     3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z,
    -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z,
     0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z);
  rgb = max(rgb, vec3(0.0));
  return rgb / max(max(rgb.r, max(rgb.g, rgb.b)), 1e-4);
}
`;

const GLSL_ROT = /* glsl */`
vec3 rotY(vec3 p, float a) {
  float c = cos(a), s = sin(a);
  return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
}
`;

/* ────────────────────────────  工具函数  ──────────────────────────── */

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const smoothstep = (e0, e1, x) => {
  const k = clamp((x - e0) / (e1 - e0), 0, 1);
  return k * k * (3 - 2 * k);
};
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeIn = (k) => k * k * k;

/* 对数空间插值：跨越若干数量级的量必须用它，线性插值会全程卡在小端 */
const logLerp = (a, b, k) => Math.pow(10, lerp(Math.log10(a), Math.log10(b), k));

const rnd = (() => {
  let s = 0x9e3779b9;
  return () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();
const rrange = (a, b) => a + (b - a) * rnd();

/* 数字格式：HUD 是科学计数法的场合就老实写 */
function sci(x, d = 1) {
  if (!isFinite(x)) return '—';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (x === 0) return '0';
  if (e >= -2 && e < 4) return (+x.toPrecision(3)).toString();
  return (+x.toPrecision(d + 1)).toExponential(d).replace('e+', '×10^').replace('e-', '×10^⁻');
}
function fpow(x, d = 0) {
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, e);
  const sup = String(e).replace(/-/g, '⁻').replace(/0/g, '⁰').replace(/1/g, '¹')
    .replace(/2/g, '²').replace(/3/g, '³').replace(/4/g, '⁴').replace(/5/g, '⁵')
    .replace(/6/g, '⁶').replace(/7/g, '⁷').replace(/8/g, '⁸').replace(/9/g, '⁹');
  return `${m.toFixed(d)}×10${sup}`;
}
const supNum = (e) => String(e).replace(/-/g, '⁻').replace(/0/g, '⁰').replace(/1/g, '¹')
  .replace(/2/g, '²').replace(/3/g, '³').replace(/4/g, '⁴').replace(/5/g, '⁵')
  .replace(/6/g, '⁶').replace(/7/g, '⁷').replace(/8/g, '⁸').replace(/9/g, '⁹');

/* 物理时间 → 人读的字符串（带正负号，表示"坍缩后"） */
function fmtTime(t) {
  const a = Math.abs(t);
  const sign = t < 0 ? '−' : '+';
  const unit = (v, u) => `${t < 0 ? sign : '+'}${v} ${u}`;
  if (a < 1e-3) return unit((a * 1e6).toFixed(0), 'µs');
  if (a < 1) return unit((a * 1e3).toFixed(a < 0.01 ? 1 : 0), 'ms');
  if (a < 90) return unit(a.toFixed(a < 10 ? 2 : 1), 's');
  if (a < 5400) return unit((a / 60).toFixed(1), 'min');
  if (a < 1.7e5) return unit((a / 3600).toFixed(1), 'h');
  if (a < 2 * YR_S) return unit((a / 86400).toFixed(a < 8.64e5 ? 1 : 0), 'd');
  if (a < 1000 * YR_S) return unit((a / YR_S).toFixed(a < 10 * YR_S ? 1 : 0), 'yr');
  return unit(Math.round(a / YR_S).toLocaleString('en-US'), 'yr');
}

/* 长度 → 人读字符串 */
function fmtLen(km) {
  if (km < 1e3) return `${km.toFixed(km < 100 ? 1 : 0)} km`;
  if (km < 1e6) return `${(km / 1e3).toFixed(1)} 千 km`;
  if (km < 0.02 * AU_KM) return `${(km / 1e6).toFixed(2)} 百万 km`;
  if (km < 0.5 * LY_KM) return `${(km / AU_KM).toFixed(km < 20 * AU_KM ? 1 : 0)} AU`;
  if (km < 0.5 * PC_KM) return `${(km / LY_KM).toFixed(2)} 光年`;
  return `${(km / PC_KM).toFixed(2)} pc`;
}

/* 数字 → 人读字符串（自动选单位） */
function fmtNum(x, unit = '') {
  if (!isFinite(x)) return '—';
  return `${sci(x)}${unit ? ' ' + unit : ''}`;
}

/* 由剧情播放位置求：当前是第几段、段内进度、物理时间、视场尺度 */
function timelineAt(storyT) {
  let acc = 0;
  for (let i = 0; i < PHASES.length; i++) {
    const p = PHASES[i];
    if (storyT < acc + p.dur || i === PHASES.length - 1) {
      const k = clamp((storyT - acc) / p.dur, 0, 1);
      // shape>1 = 先快后慢。注意不能写成 k^shape：那个在 k=0 处导数为无穷大，
      // 相位头一帧就会跳掉近一个数量级，观感是"镜头突然放大"。
      const kk = p.shape === 1 ? k : 1 - Math.pow(1 - k, p.shape);
      // 抛射物阶段 t 随 k 线性增长且 R∝t，所以 char 也必须线性跟随；
      // 用对数插值会在中段把相机推进壳层内部
      const char = p.charMode === 'linear'
        ? lerp(p.char0, p.char1, kk)
        : logLerp(p.char0, p.char1, kk);
      return {
        idx: i, phase: p, k,
        t: lerp(p.t0, p.t1, k),
        char,
        view: char / CHAR_UNITS,     // km / 场景单位
        cam: lerp(p.cam0, p.cam1, k),
        storyT,
      };
    }
    acc += p.dur;
  }
}

      // 银河带：沿一个大圆的带状发光，带面法线倾斜，制造"斜跨天球"的构图
      vec3 n = normalize(vec3(0.42, 0.78, -0.46));
      float b = dot(d, n);
      float band = exp(-pow(abs(b) / 0.20, 1.7));

      // 带内云状结构：域扭曲的 fbm
      vec3 q = domainWarp(d * 3.2, 0.55);
      float cloud = fbm(q * 1.7, 5, 2.1, 0.52);
      cloud = smoothstep(-0.36, 0.62, cloud);

      // 暗尘带：脊状噪声抠出细密的暗纹，叠加在亮带上
      float dust = ridged(d * 4.3 + 17.0, 4, 2.3, 0.55);
      dust = smoothstep(0.52, 0.86, dust);

      float gal = band * cloud * (1.0 - 0.86 * dust);

      // 银河的颜色：核球偏黄，外围偏蓝，尘埃处偏红褐
      vec3 warm = vec3(0.52, 0.40, 0.26);
      vec3 cool = vec3(0.20, 0.28, 0.46);
      vec3 galCol = mix(cool, warm, smoothstep(0.1, 0.9, cloud));

      // 零星的高银纬弥漫星云，很淡
      float neb = fbm(d * 1.35 + 61.0, 4, 2.2, 0.5);
      neb = smoothstep(0.42, 0.95, neb) * 0.30;

      vec3 col = galCol * gal * 0.055 + vec3(0.16, 0.22, 0.38) * neb * 0.10;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(SKY_R, 48, 32), skyMat);
sky.renderOrder = -100;

/* ── 恒星 ── */
function buildStars(count, sizeScale, brightness, spikeFrac) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  const spk = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    // 球面均匀采样
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const R = SKY_R * 0.995;
    pos[i * 3] = s * Math.cos(th) * R;
    pos[i * 3 + 1] = u * R;
    pos[i * 3 + 2] = s * Math.sin(th) * R;

    const sp = pickSpec();
    // 星等分布：暗星远多于亮星
    const mag = Math.pow(rnd(), 3.4);
    const bright = brightness * (0.28 + 1.5 * mag * sp.lum);
    // 星际消光：银道面附近偏红变暗
    const d = new Float32Array([pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]]);
    const dl = Math.hypot(d[0], d[1], d[2]);
    const bandDot = Math.abs((d[0] * 0.42 + d[1] * 0.78 - d[2] * 0.46) / dl);
    const ext = Math.exp(-Math.pow(bandDot / 0.24, 2)) * 0.55 * rnd();
    const cr = sp.col[0] * bright * (1 - ext * 0.35);
    const cg = sp.col[1] * bright * (1 - ext * 0.5);
    const cb = sp.col[2] * bright * (1 - ext * 0.72);
    col[i * 3] = cr; col[i * 3 + 1] = cg; col[i * 3 + 2] = cb;

    siz[i] = (0.55 + 2.6 * Math.pow(rnd(), 5.5) + 1.5 * mag) * sizeScale;
    spk[i] = rnd() < spikeFrac ? 1 : 0;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aSpike', new THREE.BufferAttribute(spk, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uPix: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aSpike;
      varying vec3 vCol;
      varying float vSpike;
      uniform float uPix;
      void main() {
        vCol = aColor;
        vSpike = aSpike;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPix;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vCol;
      varying float vSpike;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d) * 2.0;
        if (r > 1.0) discard;
        // 核心 + 高斯晕：真实点源经光学系统后的形态
        float core = exp(-r * r * 16.0);
        float halo = exp(-r * 3.4) * 0.16;
        float a = core + halo;
        // 望远镜衍射十字：仅最亮的几颗有
        if (vSpike > 0.5) {
          float sx = max(0.0, 1.0 - abs(d.x) * 34.0) * exp(-abs(d.y) * 9.0);
          float sy = max(0.0, 1.0 - abs(d.y) * 34.0) * exp(-abs(d.x) * 9.0);
          a += (sx + sy) * 0.30;
        }
        gl_FragColor = vec4(vCol * a, a);
      }`,
  });
  const p = new THREE.Points(g, m);
  p.renderOrder = -90;
  p.frustumCulled = false;
  scene.add(p);
  return p;
}

/* ═══════════ star.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   star.js — 红超巨星：光球对流、色球、日冕、日珥、星风、星周尘埃壳
   ═══════════════════════════════════════════════════════════════════════════ */

const starGroup = new THREE.Group();
universe.add(starGroup);

/* 恒星内部视角时，光球被"钳"在这个尺度上充当内壁。
   真实半径 R/view 一旦超过它就不再增长——否则相机会被永远困在
   一个无限远的球壳里，什么都看不见。 */
const WALL_MAX = 42;

const SU = {
  uTime: { value: 0 },
  uRot: { value: 0 },
  uChurn: { value: 1 },      // 湍流强度
  uTbase: { value: PHYS.T_RSG },
  uDisp: { value: 1 },
  uFade: { value: 1 },       // 整体淡出
  uCut: { value: 0 },        // 剖面剖开程度 0..1
  uCutN: { value: new THREE.Vector3(1, 0, 0).normalize() },
  uCutR: { value: 1 },
  uLum: { value: 1 },
};

/* ───────────────────────────  光球  ─────────────────────────── */

const PHOTO_VERT = /* glsl */`
uniform float uTime, uRot, uChurn, uDisp;
varying vec3 vObj;
varying vec3 vNrm;
varying vec3 vWorld;
varying float vMu;

${GLSL_NOISE}
${GLSL_FBM}
${GLSL_ROT}

/* 大尺度对流的高度场。片段着色器里另有更细的米粒组织。 */
float surfH(vec3 p) {
  vec3 w = domainWarp(p * 2.6 + vec3(0.0, uTime * 0.035, 0.0), 0.6);
  float a = fbm(w * 1.9, 4, 2.15, 0.52);
  float b = fbm(p * 6.5 - vec3(uTime * 0.06), 3, 2.2, 0.5);
  return (a * 0.78 + b * 0.42) * uDisp * uChurn;
}

void main() {
  vec3 p = normalize(position);
  float lat = asin(clamp(p.y, -1.0, 1.0));
  // 差动自转：赤道快、两极慢，噪声场随纬度剪切
  float shear = uRot * (1.0 - 0.30 * sin(lat) * sin(lat));
  vec3 rp = rotY(p, shear);

  float h = surfH(rp);
  vec3 np = p * (1.0 + h * 0.014);

  // 有限差分求扰动后法线
  vec3 up = abs(p.y) < 0.98 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 t1 = normalize(cross(p, up));
  vec3 t2 = normalize(cross(p, t1));
  float e = 0.012;
  vec3 pA = normalize(p + t1 * e);
  vec3 pB = normalize(p + t2 * e);
  vec3 A = pA * (1.0 + surfH(rotY(pA, shear)) * 0.014);
  vec3 B = pB * (1.0 + surfH(rotY(pB, shear)) * 0.014);
  vec3 nrm = normalize(cross(A - np, B - np));
  if (dot(nrm, p) < 0.0) nrm = -nrm;

  vec4 wp = modelMatrix * vec4(np, 1.0);
  vWorld = wp.xyz;
  vObj = rp;
  vNrm = mat3(modelMatrix) * nrm;

  vec3 V = normalize(cameraPosition - wp.xyz);
  vMu = clamp(dot(normalize(vNrm), V), 0.0, 1.0);

  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const PHOTO_FRAG = /* glsl */`
precision highp float;
uniform float uTime, uTbase, uFade, uCut, uLum, uChurn, uCutR;
uniform vec3 uCutN;
varying vec3 vObj;
varying vec3 vNrm;
varying vec3 vWorld;
varying float vMu;

${GLSL_NOISE}
${GLSL_FBM}
${GLSL_BLACKBODY}

void main() {
  vec3 p = normalize(vObj);

  // ── 剖面：把朝向相机的一半挖掉，露出内部洋葱结构 ──
  float edge = 0.0;
  if (uCut > 0.01) {
    float s = dot(vWorld, uCutN);
    edge = exp(-abs(s) / max(uCutR * 0.012, 1e-4));
    if (s > 0.0) discard;
  }

  // 米粒组织：域扭曲的 fbm 让元胞边界成为不规则网状
  vec3 w = domainWarp(p * 4.2 + vec3(0.0, uTime * 0.055, 0.0), 0.78);
  float cells = fbm(w * 3.1, 5, 2.12, 0.52);
  float grain = fbm(p * 23.0 + vec3(uTime * 0.19), 3, 2.4, 0.5);
  float fine  = fbm(p * 47.0 - vec3(uTime * 0.33), 2, 2.6, 0.5);
  // 低频暗区 = 星斑 / 超米粒
  float spot  = fbm(p * 1.55 + 30.0, 3, 2.0, 0.5);

  float t = 0.0;
  t += smoothstep(-0.32, 0.60, cells) * 0.66;
  t += grain * 0.17;
  t += fine * 0.05;
  t -= smoothstep(0.26, 0.72, spot) * 0.34;
  t = clamp(t, 0.0, 1.0);

  // 元胞中心热、元胞间暗：跨度约 ±900 K
  float T = uTbase + (t - 0.44) * 1750.0;
  vec3 col = blackbodyRGB(T) * (0.14 + 0.74 * pow(t, 0.9));

  // 临边昏暗（Eddington 近似 I(μ)/I(1) = (2+3μ)/5）
  float mu = clamp(vMu, 0.0, 1.0);
  col *= (2.0 + 3.0 * mu) / 5.0;

  // 临边红化：视线在边缘穿过更冷的高层大气
  col = mix(col, blackbodyRGB(uTbase - 800.0) * 0.85,
            pow(1.0 - mu, 2.4) * 0.55);

  // 色球边缘辉光 + 针状体
  float rim = pow(1.0 - mu, 3.0);
  float spic = fbm(p * 26.0 + vec3(uTime * 0.25, 0.0, 0.0), 3, 2.4, 0.5) * 0.5 + 0.5;
  col += blackbodyRGB(4600.0) * rim * (0.12 + 0.28 * spic) * 0.85;

  // 剖切面上的高温边缘
  col += blackbodyRGB(9000.0) * edge * 1.3;
  if (uCut > 0.01) col = mix(col, blackbodyRGB(5200.0) * 0.8, uCut * 0.5);

  col *= uLum * uFade;
  gl_FragColor = vec4(col, clamp(uFade, 0.0, 1.0));
}`;

const photosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1, 144, 88),

starGroup.add(photosphere);

/* ───────────────────────  色球 / 日冕辉光  ─────────────────────── */

const coronaMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  uniforms: Object.assign({
    uInner: { value: 1.0 },
    uOuter: { value: 2.6 },
    uSpike: { value: 1.0 },
  }, SU),
  vertexShader: /* glsl */`
    varying vec3 vObj;
    varying vec3 vWorld;
    void main() {
      vObj = normalize(position);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uTime, uInner, uOuter, uSpike, uFade, uChurn, uLum;
    varying vec3 vObj;
    varying vec3 vWorld;
    ${GLSL_NOISE}
    ${GLSL_FBM}
    ${GLSL_BLACKBODY}

    void main() {
      vec3 V = normalize(cameraPosition - vWorld);
      // 背面渲染：法线朝内，故用 -vObj
      float mu = abs(dot(normalize(vObj), V));

      // 径向衰减：从表面向外急降
      float rho = 0.62 + 0.38 * (1.0 - mu);

      vec3 p = normalize(vObj);
      float n = fbm(domainWarp(p * 3.4 + vec3(0.0, uTime * 0.05, 0.0), 0.6) * 2.4, 4, 2.2, 0.55);
      n = n * 0.5 + 0.5;

      // 针状体：边缘处脊状噪声形成放射状细刺
      float spic = ridged(p * vec3(34.0, 12.0, 34.0) + vec3(0.0, uTime * 0.3, 0.0), 3, 2.5, 0.55);
      spic = pow(smoothstep(0.55, 1.0, spic), 1.6) * uSpike;

      float rim = pow(1.0 - mu, 2.4);
      float a = rim * (0.075 + 0.16 * n) * uChurn;
      a += rim * spic * 0.16;
      a *= uFade * uLum;

      vec3 col = blackbodyRGB(4100.0) * (0.85 + 0.5 * n);
      col += blackbodyRGB(8000.0) * spic * 0.35;
      gl_FragColor = vec4(col * a, a * 0.85);
    }`,

const corona = new THREE.Mesh(new THREE.SphereGeometry(1.42, 64, 44), coronaMat);
starGroup.add(corona);

/* 更外层的大气雾：一整团很淡的加性球，被 bloom 拉成星芒 */
const haloMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  uniforms: Object.assign({}, SU),
  vertexShader: /* glsl */`
    varying vec3 vObj; varying vec3 vWorld;
    void main() {
      vObj = normalize(position);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uFade, uLum, uTime;
    varying vec3 vObj; varying vec3 vWorld;
    ${GLSL_BLACKBODY}
    void main() {
      vec3 V = normalize(cameraPosition - vWorld);
      float mu = abs(dot(normalize(vObj), V));
      float rim = pow(1.0 - mu, 3.4);

const halo = new THREE.Mesh(new THREE.SphereGeometry(2.9, 40, 28), haloMat);

/* ───────────────────────  日珥 / 抛射等离子体  ─────────────────────── */

function buildProminences(count) {
  const dir = new Float32Array(count * 3);
  const ph = new Float32Array(count);
  const sp = new Float32Array(count);
  const sz = new Float32Array(count);
  const seed = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    dir[i * 3] = s * Math.cos(th);
    dir[i * 3 + 1] = u;
    dir[i * 3 + 2] = s * Math.sin(th);
    ph[i] = rnd();
    sp[i] = 0.10 + 0.85 * Math.pow(rnd(), 2.2);
    sz[i] = rrange(0.02, 0.10);
    seed[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dir, 3)); // 复用：单位方向
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(sp, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: Object.assign({ uPix: { value: renderer.getPixelRatio() }, uRate: { value: 0.055 } }, SU),
    vertexShader: /* glsl */`
      attribute float aPhase, aSpeed, aSize, aSeed;
      uniform float uTime, uPix, uRate, uChurn;
      varying float vA;
      varying float vSeed;
      void main() {
        vec3 d = normalize(position);
        float ph = fract(aPhase + uTime * uRate * (0.6 + aSeed));
        // 弹道弧：抛起再落回，抛物线形
        float h = 4.0 * ph * (1.0 - ph);
        float r = 1.0 + aSpeed * h * (0.5 + 0.9 * uChurn);
        vec3 pos = d * r;
        vA = h * smoothstep(0.0, 0.12, ph) * (1.0 - smoothstep(0.75, 1.0, ph));
        vSeed = aSeed;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPix * 900.0 / max(-mv.z, 0.001);
        gl_PointSize = clamp(gl_PointSize, 1.0, 90.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade, uLum;
      varying float vA;
      varying float vSeed;
      ${GLSL_BLACKBODY}
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d) * 2.0;

  pts.frustumCulled = false;
  return pts;
}

/* ───────────────────────────  星风  ─────────────────────────── */

function buildWind(count) {
  const dir = new Float32Array(count * 3);
  const ph = new Float32Array(count);
  const sp = new Float32Array(count);
  const sz = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    dir[i * 3] = s * Math.cos(th);
    dir[i * 3 + 1] = u * 0.75;              // 星风略向赤道聚集
    dir[i * 3 + 2] = s * Math.sin(th);
    const L = Math.hypot(dir[i * 3], dir[i * 3 + 1], dir[i * 3 + 2]);
    dir[i * 3] /= L; dir[i * 3 + 1] /= L; dir[i * 3 + 2] /= L;
    ph[i] = rnd();
    sp[i] = 0.35 + 0.85 * rnd();
    sz[i] = rrange(0.006, 0.030);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(sp, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: Object.assign({ uPix: { value: renderer.getPixelRatio() }, uRate: { value: 0.035 } }, SU),
    vertexShader: /* glsl */`
      attribute float aPhase, aSpeed, aSize;
      uniform float uTime, uPix, uRate, uRot;
      varying float vA;
      void main() {

        vA = smoothstep(0.0, 0.14, ph) * (1.0 - smoothstep(0.55, 1.0, ph));
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPix * 900.0 / max(-mv.z, 0.001);
        gl_PointSize = clamp(gl_PointSize, 1.0, 40.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade;
      varying float vA;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = length(d) * 2.0;
        if (r > 1.0) discard;
        float a = exp(-r * r * 2.6) * (1.0 - r) * vA * uFade * 0.5;
        gl_FragColor = vec4(vec3(1.0, 0.42, 0.20) * a, a);

  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;

}
const wind = buildWind(4200);
starGroup.add(wind);

/* ───────────────────  星周尘埃壳 / 抛出的物质  ─────────────────── */

const dustMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

    precision highp float;

    varying vec3 vObj; varying vec3 vWorld;
    ${GLSL_NOISE}
    ${GLSL_FBM}
    void main() {
      vec3 p = normalize(vObj);

      vec3 w = domainWarp(p * 2.2 + uSeed, 0.7);
      float n = fbm(w * 3.3, 4, 2.2, 0.55);
      n = smoothstep(-0.15, 0.70, n);
      float eq = 0.55 + 0.45 * (1.0 - abs(p.y));
      float a = n * eq * 0.014 * uFade * uLum;
      vec3 col = vec3(0.62, 0.30, 0.16);
      gl_FragColor = vec4(col * a, a);
    }`,
});
const dustShell = new THREE.Mesh(new THREE.SphereGeometry(7.5, 64, 42), dustMat);
starGroup.add(dustShell);

/* ───────────────────────────  更新  ─────────────────────────── */

const _cutN = new THREE.Vector3();
let starOutside = 1;

/* wallUnits：镜头钻进恒星内部后，光球作为"内壁"停在多大的场景尺度上。
   由 main 传入（正比于当前特征尺度），保证内壁始终远在相机之外。 */
function updateStar(view, time, opts) {
  const R = PHYS.R_RSG / view;
  const wall = opts.wallUnits || WALL_MAX;
  const camD = opts.camDist || 1e9;
  // "在恒星外面"必须用相机到原点的距离来判断。只比内壁比值的话，
  // 相机在真实半径 ≈ 相机距离时就已经穿过光球了，但要等到真实半径超过
  // 内壁的 1.45 倍才开始淡出——中间这段时间相机在恒星内部，光球却仍按
  // 外表面全亮渲染，会把整屏糊掉。
  // 阈值 0.95→1.40：光球以接近满不透明度扫过相机，之后才淡出。
  // 取早（如 0.55）会在还没碰到光球时就淡掉，像恒星提前化了；
  // 取晚或者干脆不淡，则相机会在恒星内部看到一整面全亮的内壁，糊满整屏。
  const wantOutside = (1.0 - smoothstep(0.95, 1.40, R / camD)) *
                      (1.0 - smoothstep(1.0, 1.45, R / wall));
  // 再做变化率限幅。低帧率或倍速播放时，一帧内恒星半径可以变好几倍，
  // 硬阈值会"啪"地跳过去；限幅后任何帧率下都是平滑过渡。
  starOutside += clamp(wantOutside - starOutside, -0.13, 0.13);

  const scale = Math.min(R, wall);
  starGroup.scale.setScalar(scale);

  SU.uTime.value = time;
  starGroup.rotation.x = THREE.MathUtils.degToRad(14);
  SU.uRot.value = time * 0.012;

  const alive = opts.alive;         // 光球是否还存在
  // 在恒星内部时只留很暗的一层背景，否则前方的分层与核心会被加法混合洗成一片白
  SU.uFade.value = alive * (0.10 + 0.90 * starOutside);
  SU.uChurn.value = opts.churn;
  SU.uDisp.value = opts.disp;
  SU.uLum.value = opts.lum;
  SU.uTbase.value = opts.tbase;

  // 剖切面法线始终朝向相机
  _cutN.copy(camera.position).sub(new THREE.Vector3(0, 0, 0)).normalize();
  SU.uCutN.value.copy(_cutN);
  SU.uCutR.value = scale;
  const cut = opts.cut * starOutside;
  SU.uCut.value = cut;
  photosphere.visible = alive > 0.002;

  // 随着镜头钻进恒星内部，外层结构逐步让位
  const outer = starOutside * alive;
  corona.visible = outer > 0.004;
  coronaMat.uniforms.uFade.value = outer;
  coronaMat.uniforms.uChurn.value = opts.churn;
  coronaMat.uniforms.uLum.value = opts.lum;
  coronaMat.uniforms.uInner.value = 1.0;
  halo.visible = outer > 0.004;
  haloMat.uniforms.uFade.value = outer;
  haloMat.uniforms.uLum.value = opts.lum;
  prominences.visible = outer > 0.004;
  prominences.material.uniforms.uFade.value = outer;
  prominences.material.uniforms.uChurn.value = opts.churn;
  prominences.material.uniforms.uLum.value = opts.lum;
  wind.visible = outer > 0.004;
  wind.material.uniforms.uFade.value = outer * opts.wind;
  dustShell.visible = starOutside > 0.02;
  dustMat.uniforms.uFade.value = Math.max(starOutside, 1 - opts.dustIn) * opts.dust;

  return { scale, outside: starOutside };
}


/* ═══════════ interior.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   interior.js — 洋葱式分层结构与核心坍缩
   ═══════════════════════════════════════════════════════════════════════════

   真实比例下这些内层小到看不见：铁核半径只有恒星半径的约 4×10⁻⁶。
   所以显示半径按 r^0.22 做非线性压缩，界面上明确标注"已放大"，
   并在每层标签里给出真实半径——压缩是为了看得见，不是为了好看而撒谎。  */

const LAYERS = [
  { id: 'H',   name: '氢包层',   en: 'H envelope',   m: 20.0, r: 6.957e8,  col: [1.00, 0.42, 0.22], role: 'env', delay: 0.00 },
  { id: 'He',  name: '氦核',     en: 'He core',      m: 6.0,  r: 3.0e6,    col: [1.00, 0.72, 0.30], role: 'env', delay: 0.00 },
  { id: 'CO',  name: '碳氧层',   en: 'C/O shell',    m: 4.0,  r: 2.0e5,    col: [0.55, 0.95, 0.75], role: 'env', delay: 0.55 },
  { id: 'ONe', name: '氧氖镁层', en: 'O/Ne/Mg',      m: 2.5,  r: 2.5e4,    col: [0.45, 0.80, 1.00], role: 'core', delay: 0.30 },
  { id: 'Si',  name: '硅硫层',   en: 'Si/S shell',   m: 2.0,  r: 8000,     col: [0.72, 0.62, 1.00], role: 'core', delay: 0.12 },
  { id: 'Fe',  name: '铁核',     en: 'Fe core',      m: 1.4,  r: 3000,     col: [0.90, 0.92, 1.00], role: 'core', delay: 0.00 },
];

const R_STAR = PHYS.R_RSG;
const R_COMPRESS = 0.22;                       // 显示半径 = R*(r/R)^0.22
const dispR = (r) => Math.pow(r / R_STAR, R_COMPRESS);

const interiorGroup = new THREE.Group();
interiorGroup.visible = false;
universe.add(interiorGroup);

const IU = {
  uTime: { value: 0 },
  uCut: { value: 0 },
  uCutN: { value: new THREE.Vector3(1, 0, 0) },
  uFade: { value: 0 },
  uCore: { value: 0 },      // 0=未坍缩 1=已坍缩到中子星尺度
  uHeat: { value: 0 },      // 坍缩过程中的额外增亮
};

const SHELL_VERT = /* glsl */`
  varying vec3 vObj;
  varying vec3 vWorld;
  void main() {
    vObj = normalize(position);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorld = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;

const SHELL_FRAG = /* glsl */`
  precision highp float;
  uniform vec3 uColor;
  uniform vec3 uCutN;
  uniform float uCut, uFade, uTime, uHeat, uEdgeW, uSeed, uLod;
  varying vec3 vObj;
  varying vec3 vWorld;
  ${GLSL_NOISE}
  ${GLSL_FBM}

  void main() {
    // 剖面：挖掉朝向相机的一半
    float s = dot(vWorld, uCutN);
    if (uCut > 0.5 && s > 0.0) discard;   // 挖掉朝向相机的一半

    // 剖切面附近的亮边，让层边界在切面上成为清晰的同心环。
    // 只在真的剖开时才算：否则它会沿着过原点的平面糊出一条亮带，把画面洗白。
    float edge = 0.0;
    if (uCut > 0.5) edge = exp(-abs(s) / max(uEdgeW, 1e-5));

    vec3 p = normalize(vObj);
    float n = fbm(domainWarp(p * 3.0 + uSeed, 0.5) * 2.2, 4, 2.15, 0.55) * 0.5 + 0.5;

    // 湍流：越靠内越剧烈，坍缩时被点燃
    float turb = 0.55 + 0.45 * n;
    vec3 col = uColor * turb;
    col += uColor * edge * 1.5;
    col += vec3(1.0, 0.98, 0.94) * uHeat * (0.16 + 0.7 * edge);

    float a = (0.034 + 0.24 * edge) * uFade * uLod * (0.75 + 0.5 * n);
    gl_FragColor = vec4(col * a * 2.4, a);
  }`;

const shells = LAYERS.map((L) => {
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({
      uColor: { value: new THREE.Color(L.col[0], L.col[1], L.col[2]) },
      uEdgeW: { value: 0.02 },
      uSeed: { value: rnd() * 40 },
      uLod: { value: 1 },
    }, IU),
    vertexShader: SHELL_VERT, fragmentShader: SHELL_FRAG,
    side: THREE.DoubleSide, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 72, 44), m);
  mesh.renderOrder = 3;
  interiorGroup.add(mesh);
  return { L, mesh, mat: m, rNow: L.r };
});

/* ── 中央致密天体：坍缩后的原中子星 / 中子星 ── */
const NS_VERT = SHELL_VERT;
const NS_FRAG = /* glsl */`
  precision highp float;
  uniform float uTime, uHeat, uFade, uBright;
  varying vec3 vObj;
  varying vec3 vWorld;
  ${GLSL_NOISE}
  ${GLSL_FBM}
  void main() {
    vec3 p = normalize(vObj);
    // 极高温表面：对流 + 热点
    float n = fbm(p * 6.0 + vec3(uTime * 0.6), 4, 2.2, 0.5) * 0.5 + 0.5;
    float gran = fbm(p * 18.0, 3, 2.4, 0.5) * 0.5 + 0.5;
    vec3 V = normalize(cameraPosition - vWorld);
    float mu = clamp(dot(p, V), 0.0, 1.0);
    float ld = (2.0 + 3.0 * mu) / 5.0;
    vec3 col = mix(vec3(0.62, 0.78, 1.0), vec3(1.0, 0.94, 0.86), n * 0.7);
    col *= (0.35 + 0.6 * gran) * ld * uBright;
    col += vec3(0.6, 0.8, 1.0) * pow(1.0 - mu, 3.0) * 0.5 * uBright;
    float a = uFade;
    gl_FragColor = vec4(col * a, a);
  }`;
const pnsU = {
  uTime: IU.uTime, uFade: { value: 0 }, uBright: { value: 1 }, uHeat: { value: 0 },
};
const pnsMat = new THREE.ShaderMaterial({
  uniforms: pnsU, vertexShader: NS_VERT, fragmentShader: NS_FRAG,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
});
const pns = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 40), pnsMat);
pns.renderOrder = 4;
interiorGroup.add(pns);

/* ────────────────────────  更新：分层半径随坍缩演化  ──────────────────────── */

const _v3 = new THREE.Vector3();

/* coll: 0→1 为铁核自由落体坍缩进度；供 collapse.js 共用 */
function updateInterior(t, view, opts) {
  const vis = opts.visible;
  interiorGroup.visible = vis > 0.002;
  if (!interiorGroup.visible) return null;

  const scale = 1 / view;
  // 基准与光球用同一个钳位：镜头在恒星外时按真实半径，钻进去之后按"内壁"尺度。
  // 两者在交界的瞬间取值相同，所以过渡是连续的。
  const base = Math.min(R_STAR * scale, opts.wallUnits);
  interiorGroup.scale.setScalar(1);      // 子网格自己按已算好的场景尺度摆放

  IU.uTime.value = opts.time;
  IU.uFade.value = vis;
  IU.uCut.value = opts.cut;
  IU.uCutN.value.copy(opts.cutN);
  IU.uHeat.value = opts.heat;

  // 坍缩进度：以铁核自由落体为主线
  const coll = clamp((t - 0) / PHYS.T_COLLAPSE, 0, 1);
  const collE = Math.pow(coll, 0.55);

  // 核心整体随坍缩收缩：各层按比例一起缩，内部比例保持不变
  const coreShrink = lerp(1.0, 0.16, collE);

  const out = [];
  for (const S of shells) {
    const L = S.L;
    let r;
    if (L.role === 'core') {
      // 内层按延迟依次内落：自由落体时标 ∝ ρ^(-1/2)，越靠外越晚
      const k = clamp((collE - L.delay) / Math.max(1 - L.delay, 1e-3), 0, 1);
      const ke = k * k;                            // 自由落体：初期慢、后期极快
      r = L.r * (1 - ke) + PHYS.R_PNS * ke;
      // 坍缩完成后继续塌到一个点（在场景尺度上）
      if (t > PHYS.T_COLLAPSE) r = PHYS.R_PNS;
    } else {
      // 包层：激波到达之前不动 —— 恒星此刻还"不知道"核心出事了
      const k = clamp((t - opts.envStart) / opts.envDur, 0, 1);
      r = L.r * (1 + k * opts.envExpand);
    }
    S.rNow = r;
    const disp = dispR(r) * base * (L.role === 'core' ? coreShrink : 1);
    S.mesh.scale.setScalar(disp);
    S.mat.uniforms.uEdgeW.value = Math.max(disp * 0.05, 1e-4);
    // 距离衰减：比取景范围大得多的外层只留一层薄雾，否则从内部看会把画面糊成奶白
    const lod = clamp((opts.camDist * 1.5) / Math.max(disp, 1e-6), 0, 1);
    S.mat.uniforms.uLod.value = 0.10 + 0.90 * lod;
    out.push({ id: L.id, name: L.name, en: L.en, m: L.m, rTrue: r, r0: L.r,
               pos: _v3.clone().set(0, 0, 0), disp });
  }

  // 原中子星：半径从铁核尺度收到 20 km 再稳定
  const rNS = lerp(PHYS.R_FE_CORE, PHYS.R_PNS, Math.pow(collE, 0.8));
  const nsScale = (t < PHYS.T_COLLAPSE + 0.02 ? rNS : PHYS.R_PNS) * scale;
  pns.scale.setScalar(Math.max(nsScale, 1e-9));
  pnsU.uFade.value = clamp(opts.nsFade, 0, 1);
  pnsU.uBright.value = opts.nsBright;
  pns.visible = pnsU.uFade.value > 0.002;

  return out;
}


/* ═══════════ collapse.js ═══════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   collapse.js — 内落物质、中微子爆发、激波（停滞 → 复苏 → 冲出包层）
   ═══════════════════════════════════════════════════════════════════════════ */

const collapseGroup = new THREE.Group();
universe.add(collapseGroup);

/* ───────────────────────────  内落物质流  ─────────────────────────── */

function buildInfall(count) {
  const dir = new Float32Array(count * 3);
  const r0 = new Float32Array(count);
  const ph = new Float32Array(count);
  const sz = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    dir[i * 3] = s * Math.cos(th);
    dir[i * 3 + 1] = u;
    dir[i * 3 + 2] = s * Math.sin(th);
    r0[i] = rrange(0.25, 1.0);          // 归一化起始半径
    ph[i] = rnd();
    sz[i] = rrange(0.030, 0.150);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aR0', new THREE.BufferAttribute(r0, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uPix: { value: renderer.getPixelRatio() },
      uT: { value: 0 },            // 0→1 内落总进度
      uRate: { value: 0.22 },   // 原为 0.7：粒子每秒掠过数百像素，整片都在抖
      uFade: { value: 0 },
      uRin: { value: 0.02 },       // 内边界（原中子星表面）
      uRout: { value: 1.0 },       // 外边界（铁核外缘）
      uScale: { value: 1 },        // km → 场景单位
      uHeat: { value: 0 },
    },
    vertexShader: /* glsl */`
      attribute float aR0, aPhase, aSize;
      uniform float uT, uRate, uPix, uRin, uRout, uScale, uHeat;
      varying float vA;
      void main() {
        vec3 d = normalize(position);
        float ph = fract(aPhase + uT * uRate);
        // 自由落体：越靠近中心越快，半径按 (1-k)^(2/3) 收缩
        float k = pow(1.0 - ph, 1.5);
        float rn = mix(aR0, 0.0, 1.0 - k);
        float r = mix(uRin, uRout, rn);
        vA = smoothstep(0.0, 0.08, ph) * (1.0 - smoothstep(0.82, 1.0, ph));
        // 越靠内越快、越热
        vA *= 0.35 + 0.65 * (1.0 - rn);
        vec3 pos = d * r * uScale;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        float dist = -mv.z;
        // 粒子从 24 km 落到 1050 km，换算到场景单位后正好横跨相机距离。
        // 掠过相机附近的会被 900/距离 放大成整屏色块，随运动一闪一闪 ——
        // 这里按距离淡出，并压住点径上限。
        vA *= smoothstep(1.5, 16.0, dist);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPix * 900.0 / max(dist, 1e-3), 1.0, 22.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade;
      varying float vA;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float rr = length(d) * 2.0;
        if (rr > 1.0) discard;
        float a = exp(-rr * rr * 2.8) * (1.0 - rr) * vA * uFade * 0.55;
        // 内落物质被压缩加热：外冷内热
        vec3 col = mix(vec3(1.0, 0.45, 0.22), vec3(0.85, 0.92, 1.0), vA);
        gl_FragColor = vec4(col * a, a);
      }`,
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 5;
  return pts;
}
const infall = buildInfall(5000);
collapseGroup.add(infall);

/* ───────────────────────────  中微子爆发  ───────────────────────────
   中微子以光速飞出，0.02 秒就到几千公里外——按真实时间根本看不见。
   这里用"剧情时间"展开，HUD 里会注明这是示意，不是等比。            */

function buildNeutrino(count) {
  const dir = new Float32Array(count * 3);
  const ph = new Float32Array(count);
  const sz = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    dir[i * 3] = s * Math.cos(th);
    dir[i * 3 + 1] = u;
    dir[i * 3 + 2] = s * Math.sin(th);
    ph[i] = rnd();
    sz[i] = rrange(0.010, 0.055);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uPix: { value: renderer.getPixelRatio() },
      uK: { value: 0 },          // 0→1 扩散进度
      uFade: { value: 0 },
      uScale: { value: 1 },
      uR: { value: 1 },
    },
    vertexShader: /* glsl */`
      attribute float aPhase, aSize;
      uniform float uK, uPix, uScale, uR;
      varying float vA;
      void main() {
        vec3 d = normalize(position);
        // 略微错开出发时刻，形成一层薄壳而非一个几何球面
        float k = clamp((uK - aPhase * 0.10) / 0.90, 0.0, 1.0);
        float r = k * uR;
        vA = (1.0 - k) * (1.0 - k);
        vec3 pos = d * r * uScale;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        float dist = -mv.z;
        vA *= smoothstep(1.5, 16.0, dist);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPix * 900.0 / max(dist, 1e-3), 1.0, 20.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade;
      varying float vA;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float rr = length(d) * 2.0;
        if (rr > 1.0) discard;
        float a = exp(-rr * rr * 3.2) * (1.0 - rr) * vA * uFade * 0.7;
        gl_FragColor = vec4(vec3(0.72, 0.86, 1.0) * a, a);
      }`,
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 6;
  return pts;
}
const neutrinos = buildNeutrino(7000);
collapseGroup.add(neutrinos);

/* 中微子薄壳：一圈快速外扩的微光，代表"逃逸" */
const nuShellMat = new THREE.ShaderMaterial({

function shockRadius(t) {
  if (t <= PHYS.T_COLLAPSE) return PHYS.R_PNS;
  const tb = t - PHYS.T_COLLAPSE;                    // 反弹后时间
  const stall = 200;                                 // 停滞半径 km
  const tStall = 0.012;                              // 约 10 ms 就停滞（Woosley）
  if (tb < tStall) return lerp(PHYS.R_PNS, stall, Math.pow(tb / tStall, 0.6));
  if (tb < PHYS.T_REVIVAL) {

    return stall * (1 + 0.08 * Math.sin(k * 14.0) * (1 - k));
  }
  // 复苏后加速冲出，速度趋于一个常值
  const tr = tb - PHYS.T_REVIVAL;
  const v = 12000;                                   // km/s（包层内平均）
  return stall + v * tr * (1 - Math.exp(-tr / 0.35));

const shockMat = new THREE.ShaderMaterial({

function updateCollapse(t, view, story, opts) {
  const scale = 1 / view;
  const tb = t - PHYS.T_COLLAPSE;

  // 内落流：坍缩开始出现，反弹后逐渐被激波扫清
  // 吸积要持续到激波复苏之后，不能按 T_COLLAPSE 的小倍数收尾
  const inFade = clamp(t / (PHYS.T_COLLAPSE * 0.25), 0, 1) *
                 (1 - smoothstep(PHYS.T_REVIVAL * 0.7, PHYS.T_REVIVAL * 2.2, t));
  infall.visible = inFade > 0.004;
  const iu = infall.material.uniforms;
  iu.uFade.value = inFade;
  iu.uT.value = clamp(t / PHYS.T_COLLAPSE, 0, 1.6);
  iu.uScale.value = scale;
  iu.uRin.value = PHYS.R_PNS * 1.2;
  iu.uRout.value = lerp(PHYS.R_FE_CORE, PHYS.R_FE_CORE * 0.35,
                        clamp(t / PHYS.T_COLLAPSE, 0, 1));
  iu.uHeat.value = clamp(t / PHYS.T_COLLAPSE, 0, 1);

  // 中微子爆发：反弹瞬间起，约 1.4 个剧情秒内掠过
  const nuK = opts.nuK;
  const nuFade = opts.nuFade;
  neutrinos.visible = nuFade > 0.004;
  const nu = neutrinos.material.uniforms;
  nu.uFade.value = nuFade;
  nu.uK.value = nuK;
  nu.uR.value = opts.nuR;
  nu.uScale.value = scale;

  nuShell.visible = nuFade > 0.004;
  nuShellMat.uniforms.uFade.value = nuFade;
  nuShellMat.uniforms.uK.value = nuK;
  nuShellMat.uniforms.uTime.value = opts.time;
  nuShellMat.uniforms.uScale.value = scale;
  nuShell.scale.setScalar(Math.max(nuK * opts.nuR * scale, 1e-9));

  // 激波
  const rS = shockRadius(t);
  const sFade = smoothstep(-0.02, 0.06, t) *
                (1 - smoothstep(PHYS.T_BREAKOUT * 0.55, PHYS.T_BREAKOUT * 0.95, t));
  shock.visible = sFade > 0.004;
  shock.scale.setScalar(Math.max(rS * scale, 1e-9));
  shockMat.uniforms.uFade.value = sFade;
  shockMat.uniforms.uTime.value = opts.time;
  shockMat.uniforms.uHeat.value = 1 - clamp(tb / Math.max(PHYS.T_REVIVAL, 1e-3), 0, 1) * 0.45;

  return { shockR: rS, shockFade: sFade };
}

/* ═══════════════════════════════════════════════════════════════════════════

const ELEM = [

  { lo: 0.72, id: 'H',  zh: '氢包层',   line: 'Hα 656 nm',      col: [1.00, 0.24, 0.30], v: 1.00 },
  { lo: 0.48, id: 'He', zh: '氦层',     line: 'He I 587 nm',    col: [1.00, 0.80, 0.36], v: 0.86 },
  { lo: 0.26, id: 'O',  zh: '氧层',     line: '[O III] 501 nm', col: [0.16, 1.00, 0.60], v: 0.68 },
  { lo: 0.12, id: 'Si', zh: '硅硫层',   line: '[Si II] 635 nm', col: [0.68, 0.52, 1.00], v: 0.50 },
  { lo: 0.00, id: 'Fe', zh: '铁核残骸', line: '[Fe II] 516 nm', col: [0.62, 0.72, 1.00], v: 0.34 },

/* 瑞利-泰勒团块中心：抛射物不是光滑球壳，而是被不稳定性撕成一缕缕 */
const CLUMPS = [];
for (let i = 0; i < 260; i++) {
  const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  CLUMPS.push({
    d: [s * Math.cos(th), u, s * Math.sin(th)],
    w: rrange(0.05, 0.30),
    boost: rrange(0.85, 1.9),      // 有的团块跑得更快，形成指状结构
  });

function buildEjecta(count) {
  const dir = new Float32Array(count * 3);
  const r0 = new Float32Array(count);
  const vv = new Float32Array(count);
  const col = new Float32Array(count * 3);
  const sz = new Float32Array(count);
  const seed = new Float32Array(count);

  const R0 = PHYS.R_RSG;   // 抛射物起始半径取前身星半径

  for (let i = 0; i < count; i++) {
    let dx, dy, dz, kn;
    if (rnd() < 0.72) {
      // 团块内
      const c = CLUMPS[(rnd() * CLUMPS.length) | 0];
      const a = rrange(0, Math.PI * 2), b = Math.acos(rrange(-1, 1)), rad = c.w * Math.pow(rnd(), 0.6);
      const sb = Math.sin(b);
      dx = c.d[0] + rad * sb * Math.cos(a);
      dy = c.d[1] + rad * Math.cos(b);
      dz = c.d[2] + rad * sb * Math.sin(a);
      kn = c.boost;
    } else {
      const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      dx = s * Math.cos(th); dy = u; dz = s * Math.sin(th);
      kn = 1;
    }
    const L = Math.hypot(dx, dy, dz) || 1;
    dir[i * 3] = dx / L; dir[i * 3 + 1] = dy / L; dir[i * 3 + 2] = dz / L;

    // 半径越大 = 越外层 = 越轻的元素，速度也越快
    const k = Math.pow(rnd(), 0.45);
    const e = elemAt(k);
    r0[i] = R0 * (0.30 + 0.70 * k);
    // 速度 ∝ 半径（近似 homology），再乘团块自身的快慢
    vv[i] = PHYS.V_EJECTA * e.v * (0.55 + 1.15 * k) * kn;
    col[i * 3] = e.col[0]; col[i * 3 + 1] = e.col[1]; col[i * 3 + 2] = e.col[2];
    sz[i] = rrange(0.35, 1.5) * (0.6 + 0.8 * k);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  g.setAttribute('aR0', new THREE.BufferAttribute(r0, 1));
  g.setAttribute('aV', new THREE.BufferAttribute(vv, 1));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uPix: { value: renderer.getPixelRatio() },
      uT: { value: 0 },          // 自由膨胀时间（秒）
      uScale: { value: 1 },
      uFade: { value: 0 },
      uHot: { value: 1 },        // 1=激波刚过，蓝白 0=冷却
      uDust: { value: 0 },
      uTime: { value: 0 },

    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aR0, aV, aSize, aSeed;
      uniform float uT, uScale, uPix, uHot, uDust, uTime, uFade;
      varying vec3 vCol;
      varying float vA;
      varying float vR;
      void main() {
        vec3 d = normalize(position);
        float r = aR0 + aV * uT;                 // 自由膨胀：r = r0 + v·t

        float wob = sin(d.x * 9.1 + aSeed * 31.0 + uTime * 0.03) *
                    sin(d.y * 7.7 + aSeed * 17.0);
        r *= 1.0 + 0.030 * wob;
        vec3 pos = d * r * uScale;

        vCol = mix(aColor, vec3(0.86, 0.93, 1.0), uHot * 0.75);
        vCol = mix(vCol, vCol * vec3(1.25, 0.72, 0.48), uDust);   // 尘埃致红
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        // 同一类保护：贴到相机上的粒子会变成巨大色块
        vA *= smoothstep(0.6, 7.0, -mv.z);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPix * 420.0 / max(-mv.z, 1e-3), 1.0, 19.0);

    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade;
      varying vec3 vCol;
      varying float vA;
      void main() {
        vec2 d = gl_PointCoord - 0.5;

        float a = exp(-rr * rr * 3.4) * (1.0 - rr) * vA * 0.55;
        gl_FragColor = vec4(vCol * a, a);

/* ── 前向激波壳：抛射物最外沿那层被扫过的薄壳 ── */
function makeShellMat(opts) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    uniforms: {
      uFade: { value: 0 }, uTime: { value: 0 }, uScale: { value: 1 },
      uColorA: { value: new THREE.Color(...opts.a) },
      uColorB: { value: new THREE.Color(...opts.b) },
      uFreq: { value: opts.freq || 5.0 },
      uSharp: { value: opts.sharp || 0.5 },
      uThin: { value: opts.thin || 1.0 },

    vertexShader: /* glsl */`
      varying vec3 vObj; varying vec3 vWorld;

        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade, uTime, uFreq, uSharp, uThin, uSeed;

        vec3 V = normalize(cameraPosition - vWorld);
        float mu = abs(dot(p, V));
        float rim = pow(1.0 - mu, uThin);
        float a = (rim * (0.35 + 1.5 * n) + fil * 0.55) * uFade;
        vec3 col = mix(uColorA, uColorB, clamp(n * 1.2, 0.0, 1.0));
        col += vec3(0.9, 0.95, 1.0) * fil * 0.4;
        gl_FragColor = vec4(col * a * uSharp, a * 0.75);

function lightCurve(t) {
  // 激波突破后急速上升，约 20 天到峰值，随后进入 II-P 的平台期，再指数衰减
  const d = t / 86400;
  const rise = 1 - Math.exp(-Math.pow(Math.max(d, 0) / 9, 1.8));
  const plateau = 1 / (1 + Math.exp((d - 105) / 12));
  const tail = 0.035 * Math.pow(Math.max(d, 1), -0.35) / 0.035;
  const decay = 1 - plateau;
  return clamp(rise * (plateau + decay * tail * 0.9), 0, 1.15);
}

function photTemp(t) {
  const d = t / 86400;
  // 峰值时约 12000 K，平台期降到约 5500 K，之后继续降到 3000 K 上下
  if (d < 20) return lerp(9000, 12000, clamp(d / 20, 0, 1));
  if (d < 110) return lerp(12000, 5500, clamp((d - 20) / 90, 0, 1));
  return lerp(5500, 2900, clamp((d - 110) / 260, 0, 1));

function photRadius(t) { return PHYS.V_SHOCK_MAX * Math.max(t, 1) * 0.24; }   // km

/* ───────────────────────────  更新  ─────────────────────────── */

function updateEjecta(t, view, opts) {
  const scale = 1 / view;
  const live = opts.live;                 // 抛射物是否已接管画面
  ejectaGroup.visible = live > 0.002;
  if (!ejectaGroup.visible) return null;

  const lum = lightCurve(t);
  const T = photTemp(t);
  const Rp = photRadius(t);
  const Rsh = Math.max(PHYS.V_SHOCK_MAX * t, PHYS.R_RSG);

  // 距离衰减：当这团壳层的显示半径远大于相机距离时，我们已经在它内部，
  // 若不做衰减就会糊满整屏、挡住更深处的结构
  const lod = clamp((opts.camDist * 2.6) / Math.max(Rsh * scale, 1e-9), 0, 1);

  const eu = ejecta.material.uniforms;
  eu.uT.value = t;
  eu.uScale.value = scale;
  eu.uFade.value = live * lod;
  eu.uTime.value = opts.time;
  eu.uHot.value = clamp(1 - (t - PHYS.T_BREAKOUT) / 2.6e6, 0, 1);
  eu.uDust.value = opts.dust;
  ejecta.renderOrder = 8;

  shockFront.visible = live > 0.004;
  shockFront.scale.setScalar(Math.max(Rsh * scale, 1e-9));
  shockFrontMat.uniforms.uFade.value = live * lod * (0.35 + 0.65 * lum) * opts.shockVis;
  shockFrontMat.uniforms.uTime.value = opts.time;
  shockFrontMat.uniforms.uScale.value = scale;

  ejectaPhoto.visible = live > 0.004 && lum > 0.002;
  ejectaPhoto.scale.setScalar(Math.max(Rp * scale, 1e-9));
  photoMat.uniforms.uFade.value = live * Math.max(lod, 0.25);
  photoMat.uniforms.uT.value = T;
  photoMat.uniforms.uLum.value = Math.pow(lum, 0.75);
  photoMat.uniforms.uTime.value = opts.time;

  const filFade = opts.filament;
  filaments.visible = filFade * lod > 0.004;
  if (filaments.visible) {
    filaments.scale.setScalar(Math.max(Rsh * 0.92 * scale, 1e-9));
    filamentMat.uniforms.uFade.value = filFade * lod * 0.9;
    filamentMat.uniforms.uTime.value = opts.time;
    filamentMat.uniforms.uScale.value = scale;
  }

  const niFade = opts.ni * (1 - smoothstep(3e7, 3e8, t));
  niPoints.visible = niFade * lod > 0.004;
  niMat.uniforms.uFade.value = niFade * lod;
  niMat.uniforms.uScale.value = scale;
  // 镍团块随抛射物一起膨胀（与粒子同一套自由膨胀律）
  niMat.uniforms.uGrow.value = Math.max(1 + (PHYS.V_EJECTA * 1.35 * t) / (PHYS.R_RSG * 0.9), 1);

  return { lum, T, Rp, Rsh, lod };
}

/* ═══════════════════════════════════════════════════════════════════════════

   尺度跨度极大：中子星半径 12 km，光柱面半径 c·P/2π ≈ 1600 km，
   而脉冲星风星云的环面在 0.4 光年量级 —— 相差 12 个数量级。

  const v = Math.log10(view);

/* ───────────────────────  中子星表面  ─────────────────────── */

const nsMat = new THREE.ShaderMaterial({

  side: THREE.DoubleSide,

  vertexShader: /* glsl */`
    varying vec3 vObj; varying vec3 vWorld;

  fragmentShader: /* glsl */`

    void main() {

/* ───────────────────  磁偶极场力线（r = r_eq·sin²θ）  ─────────────────── */

const magLines = (() => {
  const segs = [];
  const seq = [];
  const cols = [];
  const EQ = [];
  for (let i = 0; i < 16; i++) EQ.push(R_LC * (0.045 * Math.pow(R_LC / (R_LC * 0.045), i / 15)));
  const NAZ = 8;
  for (const req of EQ) {
    for (let a = 0; a < NAZ; a++) {
      const phi = (a / NAZ) * Math.PI * 2;
      const sMin = Math.min(Math.sqrt(PHYS.R_NS / req), 0.999);
      const th0 = Math.asin(sMin);
      const NP = 60;
      let prev = null;
      for (let j = 0; j <= NP; j++) {
        const th = lerp(th0, Math.PI - th0, j / NP);
        const s = Math.sin(th);
        const r = req * s * s;
        const p = [r * s * Math.cos(phi), r * Math.cos(th), r * s * Math.sin(phi)];
        // 场强 ∝ r⁻³，取对数映射到亮度
        const b = clamp(1 - Math.log10(Math.max(r, PHYS.R_NS) / PHYS.R_NS) / 3.2, 0, 1);
        if (prev) {
          segs.push(prev[0], prev[1], prev[2], p[0], p[1], p[2]);
          const c0 = prev[3], c1 = b;
          seq.push(
            lerp(0.28, 0.85, c0), lerp(0.34, 0.90, c0), 1.0,
            lerp(0.28, 0.85, c1), lerp(0.34, 0.90, c1), 1.0,

        }
        prev = [p[0], p[1], p[2], b];

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segs), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(seq), 3));
  const m = new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const l = new THREE.LineSegments(g, m);
  l.frustumCulled = false;

/* ───────────────────  射电光柱：磁极方向的两个锥体  ─────────────────── */

function buildBeam(count, sign) {
  const pos = new Float32Array(count * 3);
  const sz = new Float32Array(count);
  const len = R_LC * 1.35;
  const halfAng = THREE.MathUtils.degToRad(9.5);      // 光柱半张角
  for (let i = 0; i < count; i++) {
    // 体积内采样：沿轴按 r² 权重，径向按锥形
    const kr = Math.pow(rnd(), 0.42);
    const r = kr * len;
    const ang = halfAng * Math.sqrt(rnd());
    const ph = rnd() * Math.PI * 2;
    const rr = r * Math.tan(ang);
    pos[i * 3] = rr * Math.cos(ph);
    pos[i * 3 + 1] = sign * r;
    pos[i * 3 + 2] = rr * Math.sin(ph);
    sz[i] = (0.25 + 1.1 * Math.pow(rnd(), 3)) * (1.0 - 0.55 * kr);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uPix: { value: renderer.getPixelRatio() }, uFade: { value: 0 },
      uLen: { value: len }, uPulse: { value: 1 },
    },
    vertexShader: /* glsl */`
      attribute float aSize;
      uniform float uPix, uLen, uPulse;
      varying float vA;
      void main() {
        float kr = abs(position.y) / uLen;
        vA = (1.0 - kr * 0.75) * uPulse;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPix * 900.0 / max(-mv.z, 1e-4), 1.0, 44.0);
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uFade;
      varying float vA;
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float rr = length(d) * 2.0;
        if (rr > 1.0) discard;
        float a = exp(-rr * rr * 2.2) * (1.0 - rr) * vA * uFade;
        gl_FragColor = vec4(vec3(0.52, 0.74, 1.0) * a * 1.5, a * 0.55);
      }`,
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  p.renderOrder = 13;
  return p;
}
const beamA = buildBeam(4200, 1);
const beamB = buildBeam(4200, -1);
pulsarGroup.add(beamA, beamB);

/* ───────────────────  光柱面：c·P/2π 处的柱面  ─────────────────── */

const lcMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  uniforms: { uFade: { value: 0 }, uTime: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vObj; varying vec3 vWorld;

  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uFade, uTime;
    varying vec3 vObj; varying vec3 vWorld;
    ${GLSL_NOISE}

    void main() {
      // 柱面上的"电流片"：细密的经向条纹
      float a2 = atan(vObj.z, vObj.x);
      float n = fbm(vec3(a2 * 3.0, vObj.y * 0.5, uTime * 0.15), 4, 2.2, 0.55) * 0.5 + 0.5;

      float a = (0.05 + 0.10 * n) * (0.4 + 0.6 * stripe) * uFade;

pulsarGroup.add(lightCyl);

/* ───────────────────  脉冲星风星云：环面 + 喷流 + 弥漫同步辐射  ─────────────────── */

const torusMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  uniforms: { uFade: { value: 0 }, uTime: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vObj; varying vec3 vWorld;
    void main() {
      vObj = normalize(position);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uFade, uTime;
    varying vec3 vObj; varying vec3 vWorld;
    ${GLSL_NOISE}

    void main() {

      vec3 V = normalize(cameraPosition - vWorld);

function buildJet(count, sign) {
  const pos = new Float32Array(count * 3);
  const sz = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const kr = Math.pow(rnd(), 0.55);
    const r = kr * R_JET;
    const rad = R_TORUS * 0.05 * (0.35 + kr * 1.6) * Math.sqrt(rnd());
    const ph = rnd() * Math.PI * 2;
    pos[i * 3] = rad * Math.cos(ph);
    pos[i * 3 + 1] = sign * r;
    pos[i * 3 + 2] = rad * Math.sin(ph);
    sz[i] = (0.3 + 1.3 * Math.pow(rnd(), 3)) * (1 - 0.6 * kr);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uPix: { value: renderer.getPixelRatio() }, uFade: { value: 0 }, uLen: { value: R_JET } },
    vertexShader: /* glsl */`
      attribute float aSize;
      uniform float uPix, uLen;
      varying float vA;
      void main() {

        vA = (1.0 - kr * 0.8);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;

    fragmentShader: /* glsl */`

        float rr = length(d) * 2.0;

        float a = exp(-rr * rr * 2.0) * (1.0 - rr) * vA * uFade;
        gl_FragColor = vec4(vec3(0.60, 0.80, 1.0) * a * 1.3, a * 0.5);

const jetB = buildJet(2600, -1);

/* 弥漫同步辐射：整个星云被相对论电子填满，发出蓝白色的非热辐射 */
const syncMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  uniforms: { uFade: { value: 0 }, uTime: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vObj; varying vec3 vWorld;
    void main() {

/* ───────────────────  脉冲轮廓：旋转矢量模型  ───────────────────
   视线与磁轴夹角 θ 满足 cosθ = cosα·cosζ + sinα·sinζ·cosψ
   （α 磁倾角，ζ 视线与自转轴夹角，ψ 自转相位）。
   光柱只在 θ 落进锥内时才被看到 —— 这就是"灯塔"。            */

const CONE_HALF = THREE.MathUtils.degToRad(9.5);
const ZETA = THREE.MathUtils.degToRad(60);

function pulseAt(psi) {
  const cosT = Math.cos(ALPHA) * Math.cos(ZETA) +
               Math.sin(ALPHA) * Math.sin(ZETA) * Math.cos(psi);
  const th = Math.acos(clamp(cosT, -1, 1));
  const x = th / CONE_HALF;
  return Math.exp(-x * x * 1.15);
}

/* 生成一条完整的脉冲轮廓用于 HUD 绘图 */
const PULSE_CURVE = (() => {
  const n = 360, out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = pulseAt((i / n) * Math.PI * 2);
  return out;
})();

/* ───────────────────────────  更新  ─────────────────────────── */

let spinPhase = 0;
let lastPulse = 0;

function updatePulsar(t, view, dt, opts) {
  const show = opts.show;
  // 与抛射物同一套距离衰减：飞进星云内部之后就让位给更里层的结构
  const lodPWN = clamp((opts.camDist * 2.6) / Math.max(R_PWN / view, 1e-9), 0, 1);
  const fieldOn = opts.field;      // 磁场开关
  pulsarGroup.visible = show > 0.002;
  if (!pulsarGroup.visible) return null;

  // 自转：真实周期 33 毫秒不可能实时看，按可见速率显示，HUD 会写明压缩倍率
  const spinRate = opts.spinRate;          // 圈/剧情秒
  spinPhase = (spinPhase + dt * spinRate * Math.PI * 2) % (Math.PI * 2);

  const scale = 1 / view;
  nsMat.uniforms.uTime.value = opts.time;
  nsMat.uniforms.uFade.value = show;
  nsStar.scale.setScalar(Math.max(PHYS.R_NS * scale, 1e-12));

  magLines.rotation.set(0, spinPhase, 0);
  magLines.rotateZ(ALPHA);
  beamA.rotation.set(0, spinPhase, 0);
  beamA.rotateZ(ALPHA);
  beamB.rotation.set(0, spinPhase, 0);
  beamB.rotateZ(ALPHA);
  beamB.rotateX(Math.PI);        // 反极：沿磁轴翻到另一侧

  const pulse = pulseAt(spinPhase);
  lastPulse = pulse;

  const beamFade = show * fieldOn * fadeWindow(view, -0.6, 7.4, 0.5);
  beamA.visible = beamFade > 0.004;
  beamB.visible = beamA.visible;
  if (beamA.visible) {
    beamA.scale.setScalar(Math.max(scale, 1e-12));
    beamB.scale.setScalar(Math.max(scale, 1e-12));
    beamA.material.uniforms.uFade.value = beamFade;
    beamB.material.uniforms.uFade.value = beamFade;

    beamB.material.uniforms.uPulse.value = boost;
