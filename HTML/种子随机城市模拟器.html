<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块城市 BlockCity —— 种子随机低多边形城市</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10; color: #eee;
    background: rgba(13, 16, 22, 0.78); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 10px;
    padding: 12px 14px; width: 236px; user-select: none;
  }
  #hud.hidden { display: none; }
  #hud .t { font-size: 14px; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; }
  #hud .row { display: flex; gap: 6px; margin-bottom: 8px; }
  #hud input {
    flex: 1; min-width: 0; background: rgba(255,255,255,0.08); color: #eee;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none;
  }
  #hud input:focus { border-color: rgba(255,255,255,0.45); }
  #hud button {
    background: rgba(255,255,255,0.10); color: #eee; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  #hud button:hover { background: rgba(255,255,255,0.2); }
  #hud .presets { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  #hud .presets button.on { background: #e8c88a; color: #1a1408; border-color: #e8c88a; font-weight: 700; }
  #hud select {
    flex: 1; background: rgba(255,255,255,0.08); color: #eee;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
    padding: 5px 6px; font-size: 12px; outline: none; font-family: inherit;
  }
  #hud .fx { display: flex; gap: 4px; }
  #hud .fx label { flex: 1; display: flex; align-items: center; gap: 3px; font-size: 10.5px; color: #b8c0cc; cursor: pointer; white-space: nowrap; }
  #hud .fx input { accent-color: #e8c88a; width: 12px; height: 12px; margin: 0; }
  #hud .hint { font-size: 11px; color: #99a; margin-top: 8px; line-height: 1.6; }
  #hud .stat { font-size: 11px; color: #8ab; margin-top: 6px; font-variant-numeric: tabular-nums; }
</style>

</head>

<div id="app"></div>
<div id="hud"></div>
