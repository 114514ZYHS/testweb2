<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三维弹球 · 太空军校生 | 3D Pinball: Space Cadet</title>
<style>
  :root{
    --amber:#ffb200;
    --amber-dim:#7a5200;
    --cyan:#39e6ff;
    --red:#ff4b3e;
    --green:#5cff9d;
    --panel-bg:#04060b;
    --led:"Consolas","SF Mono","DejaVu Sans Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#03040a;overflow:hidden}
  body{
    display:grid;place-items:center;
    font-family:var(--led);
    color:#cfe6ff;
    background:
      radial-gradient(1200px 700px at 50% -10%, #14203f 0%, #070a14 55%, #03040a 100%);
    user-select:none;
  }
  #stage{
    position:absolute;left:50%;top:50%;
    width:700px;height:820px;
    transform-origin:50% 50%;
    transform:translate(-50%,-50%) scale(1);
  }
  #cab{
    position:absolute;inset:0;border-radius:18px;
    background:linear-gradient(180deg,#0a0f1d 0%,#05070d 100%);
    box-shadow:
      0 0 0 1px #1b2b4a,
      0 0 0 6px #070a12,
      0 0 0 7px #16233d,
      0 24px 80px rgba(0,0,0,.9),
      0 0 120px rgba(40,120,255,.10);
    overflow:hidden;
  }
  canvas{display:block;width:700px;height:820px}

  /* ---------------- LED panel ---------------- */
  #panel{
    position:absolute;left:0;right:0;bottom:0;height:120px;
    padding:8px 16px 10px;
    background:linear-gradient(180deg,rgba(4,6,11,.92),#04060b 45%);
    border-top:1px solid #1d2b45;
    box-shadow:inset 0 1px 0 rgba(80,140,255,.15), 0 -18px 40px rgba(0,0,0,.7);
    display:flex;flex-direction:column;justify-content:space-between;
    font-size:15px;letter-spacing:.12em;
  }
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lbl{color:#4c6a96;font-size:12px;letter-spacing:.24em}
  #score{
    color:var(--amber);
    font-size:30px;line-height:1;font-weight:700;
    text-shadow:0 0 8px rgba(255,178,0,.55),0 0 22px rgba(255,140,0,.25);
    font-variant-numeric:tabular-nums;
  }
  #panel .stats{color:#7e9dc7;font-size:13px}
  #panel .stats b{color:var(--cyan);font-weight:700;text-shadow:0 0 8px rgba(57,230,255,.5)}
  #rank{color:var(--green)!important;text-shadow:0 0 8px rgba(92,255,157,.55)!important}
  .fuel{display:flex;align-items:center;gap:8px}
  #fuelbar{
    display:inline-block;width:104px;height:11px;border:1px solid #2a3f63;border-radius:2px;
    background:#080c14;padding:1px;vertical-align:middle;
  }
  #fuelbar i{
    display:block;height:100%;width:100%;border-radius:1px;
    background:linear-gradient(90deg,#2fe08a,#9dff5c);
    box-shadow:0 0 8px rgba(70,255,150,.6);
    transition:width .18s linear, background .3s;
  }
  #fuelbar.low i{background:linear-gradient(90deg,#ff5a3c,#ffb200);box-shadow:0 0 8px rgba(255,120,40,.7)}
  #mission{
    flex:1;color:#ffd27a;font-size:13px;letter-spacing:.14em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 0 10px rgba(255,180,60,.35);
  }
  #mission .m-title{color:var(--cyan);text-shadow:0 0 10px rgba(57,230,255,.4)}
  #mission .m-flash{color:#fff;animation:blink .45s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------------- overlays ---------------- */
  .screen{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(circle at 50% 42%,rgba(8,16,36,.86),rgba(2,3,8,.96));
    backdrop-filter:blur(2px);
    z-index:5;
  }
  .screen.hidden{display:none}
  .title-wrap{transform:translateY(-6%)}
  h1{
    margin:0;font-family:"Segoe UI",Arial,sans-serif;font-weight:800;
    font-size:52px;letter-spacing:.22em;color:#eaf4ff;
    text-shadow:0 0 24px rgba(90,170,255,.85),0 0 60px rgba(40,110,255,.5);
  }
  h1 .c{color:var(--cyan)}
  .sub{
    margin:14px 0 0;font-size:13px;letter-spacing:.42em;color:#6f8fbe;
  }
  .cn{margin:10px 0 0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;
      font-size:17px;letter-spacing:.5em;color:#9fc4ff}
  .hint{margin-top:34px;font-size:14px;letter-spacing:.2em;color:var(--amber);
        animation:blink 1.1s steps(1) infinite}
  .keys{margin-top:26px;font-size:12px;line-height:2;color:#5f7fae;letter-spacing:.12em}
  .keys b{color:#9dc2f0;font-weight:600}
  .btn{
    margin-top:26px;display:inline-block;cursor:pointer;
    padding:12px 30px;border-radius:6px;font-size:15px;letter-spacing:.3em;
    color:#04121e;background:linear-gradient(180deg,#6fe8ff,#22b7dd);
    box-shadow:0 0 24px rgba(60,200,255,.45),inset 0 1px 0 rgba(255,255,255,.6);
    border:none;font-family:var(--led);font-weight:700;
  }
  .btn:active{transform:translateY(1px)}
  #gameover h1{font-size:40px}
  .go-score{font-size:34px;color:var(--amber);margin:18px 0 0;
    text-shadow:0 0 14px rgba(255,178,0,.6);font-variant-numeric:tabular-nums}
  .go-rank{font-size:16px;color:var(--green);margin-top:10px;letter-spacing:.3em}
  #toast{
    position:absolute;left:50%;top:15%;transform:translate(-50%,-50%) scale(.9);
    font-size:26px;letter-spacing:.24em;color:#fff;pointer-events:none;
    text-shadow:0 0 18px rgba(120,200,255,.9),0 0 50px rgba(60,140,255,.6);
    opacity:0;transition:opacity .25s, transform .25s;z-index:4;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast.gold{color:#ffd257;text-shadow:0 0 18px rgba(255,190,60,.9),0 0 50px rgba(255,120,0,.6)}
</style>
</head>
<body>
<div id="stage">
  <div id="cab">
    <canvas id="cv"></canvas>

    <div id="panel">
      <div class="row">
        <span class="lbl">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="row stats">
        <span>BALL <b id="ball">1</b>/3</span>
        <span>RANK <b id="rank">CADET</b></span>
        <span class="fuel">FUEL <span id="fuelbar"><i></i></span></span>
      </div>
      <div class="row">
        <span class="lbl">MISSION</span>
        <span id="mission">F2 开始新游戏 · 空格发射弹球</span>
      </div>
    </div>

    <div id="toast"></div>

    <div id="title" class="screen">
      <div class="title-wrap">
        <h1>SPACE <span class="c">CADET</span></h1>
        <div class="sub">3D PINBALL</div>
        <div class="cn">三维弹球 · 太空军校生</div>
        <button class="btn" id="btnStart">开 始 游 戏</button>
        <div class="keys">
          <b>Z</b> 左挡板 &nbsp;·&nbsp; <b>/</b> 右挡板 &nbsp;·&nbsp; <b>空格</b> 弹射器<br>
          <b>X</b> 左推桌 &nbsp;·&nbsp; <b>.</b> 右推桌 &nbsp;·&nbsp; <b>↑</b> 底部推桌 &nbsp;·&nbsp; <b>M</b> 静音
        </div>
      </div>
    </div>

    <div id="gameover" class="screen hidden">
      <div>
        <h1>GAME OVER</h1>
        <div class="go-score" id="goScore">0</div>
        <div class="go-rank" id="goRank">RANK: CADET</div>
        <button class="btn" id="btnAgain">再 来 一 局</button>
      </div>
    </div>
  </div>
</div>

<script>

/* =============================================================================
   三维弹球 · 太空军校生   (3D Pinball: Space Cadet — HTML remake)
   -----------------------------------------------------------------------------
   坐标系： x ∈ [-50, 50]  左→右
            y ∈ [  0, 200] 台面远端(顶部) → 近端(玩家)
   台面倾斜约 7°，重力沿 +y 作用。渲染使用手写透视投影（无外部依赖）。
   物理：圆 vs 线段 / 圆 vs 圆 / 挡板胶囊（含表面速度），定步长 1/300s。
   ============================================================================= */
'use strict';

/* ------------------------------- 常量 -------------------------------------- */
const TW = 100;             // 台面宽
const TL = 200;             // 台面长
const BALL_R = 2.6;         // 球半径
const GRAV = 190;           // 沿台面重力加速度 (单位/秒²)
const MAX_SPEED = 440;      // 球速上限
const WALL_R = 1.5;         // 墙半径
const FIXED_DT = 1 / 300;   // 物理步长
const BALL_DRAG = 0.12;     // 空气/滚动阻尼
const PI = Math.PI;

/* 摄像机：真实透视。camH 相机高度，near 相机到近端边的距离 */
const CAM = { camH: 210, near: 225, hMax: 18 };
const FIT = { f: 1200, cx: 350, cy: 100 };

/* ------------------------------- 数学 -------------------------------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const len = (x, y) => Math.sqrt(x * x + y * y);
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

/** 点到线段的最近点，返回 [x, y, t] */
function closestOnSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 > 1e-9 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return [ax + t * dx, ay + t * dy, t];
}

/* ---------------------------- 透视投影 ------------------------------------- */
function projUnit(x, y, h, f) {
  const d = (TL - y) + CAM.near;
  return [x * f / d, (CAM.camH - (h || 0)) * f / d];
}
function computeFit(rx, ry, rw, rh) {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  const xs = [-TW / 2, TW / 2], ys = [0, TL], hs = [0, CAM.hMax];
  for (const x of xs) for (const y of ys) for (const h of hs) {
    const p = projUnit(x, y, h, 1);
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  const f = Math.min(rw / (maxX - minX), rh / (maxY - minY));
  FIT.f = f;
  FIT.cx = rx + rw / 2 - f * (minX + maxX) / 2;
  FIT.cy = ry + rh / 2 - f * (minY + maxY) / 2;
}
/** 世界 → 屏幕。返回 {x,y,s,d}，s 为该深度下的缩放系数 */
function P(x, y, h) {
  const d = (TL - y) + CAM.near;
  const s = FIT.f / d;
  return { x: FIT.cx + x * s, y: FIT.cy + (CAM.camH - (h || 0)) * s, s, d };
}

/* ------------------------------- 音效 -------------------------------------- */
const Sfx = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.30;
      this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * 0.5;
      this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  resume() { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f1, f2, dur, type, vol, delay) {
    if (!this.ctx || this.muted) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(Math.max(20, f1), t0);
      if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol == null ? 0.4 : vol, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, vol, freq, q) {
    if (!this.ctx || this.muted || !this.noiseBuf) return;
    try {
      const t0 = this.ctx.currentTime;
      const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
      const flt = this.ctx.createBiquadFilter(); flt.type = 'bandpass';
      flt.frequency.value = freq || 900; flt.Q.value = q || 1.2;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol == null ? 0.4 : vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(flt); flt.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    } catch (e) {}
  },
  bumper()  { this.tone(760, 1500, 0.09, 'square', 0.32); this.noise(0.06, 0.16, 2200, 1.6); },
  bumper2() { this.tone(520, 1100, 0.12, 'sawtooth', 0.30); this.noise(0.08, 0.18, 1600, 1.2); },
  sling()   { this.tone(300, 640, 0.07, 'square', 0.26); this.noise(0.05, 0.14, 1100, 1.0); },
  flip()    { this.tone(150, 90, 0.07, 'triangle', 0.30); this.noise(0.045, 0.18, 480, 0.9); },
  target()  { this.tone(1250, 1800, 0.07, 'square', 0.26); },
  drop()    { this.tone(900, 1500, 0.10, 'square', 0.28); this.noise(0.05, 0.10, 3000, 2); },
  rollover(){ this.tone(1600, 2100, 0.05, 'sine', 0.20); },
  launch()  { this.tone(120, 900, 0.35, 'sawtooth', 0.28); this.noise(0.3, 0.12, 700, 0.8); },
  worm()    { this.tone(900, 120, 0.55, 'sine', 0.30); this.tone(450, 60, 0.55, 'triangle', 0.22); },
  drain()   { this.tone(420, 60, 0.7, 'sawtooth', 0.26); },
  ramp()    { this.tone(260, 1200, 0.45, 'triangle', 0.24); },
  hit()     { this.noise(0.04, 0.10, 2600, 1.5); },
  promote() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, f, 0.3, 'triangle', 0.24, i * 0.09)); },
  mission() { [784, 988, 1175].forEach((f, i) => this.tone(f, f, 0.35, 'square', 0.20, i * 0.07)); },
  tilt()    { this.tone(160, 70, 0.5, 'sawtooth', 0.30); this.noise(0.4, 0.20, 260, 0.7); },
  over()    { [440, 392, 330, 262, 196].forEach((f, i) => this.tone(f, f * 0.98, 0.45, 'triangle', 0.24, i * 0.16)); }
};

/* ------------------------- 背景音乐（可选） -------------------------------- */
const Music = {
  on: true, step: 0, nextT: 0,
  bass: [55, 55, 82.4, 55, 65.4, 65.4, 98, 65.4],
  arp: [440, 523, 659, 523, 587, 698, 880, 698, 440, 523, 659, 784, 659, 523, 494, 440],
  update(now) {
    if (!Sfx.ctx || !this.on || Sfx.muted) return;
    if (!this.nextT) this.nextT = Sfx.ctx.currentTime + 0.1;
    const spb = 0.24;
    while (this.nextT < Sfx.ctx.currentTime + 0.25) {
      const i = this.step % 16;
      const d = Math.max(0, this.nextT - Sfx.ctx.currentTime);
      Sfx.tone(this.arp[i], this.arp[i], 0.16, 'triangle', 0.055, d);
      if (i % 2 === 0) Sfx.tone(this.bass[(this.step >> 1) % 8], this.bass[(this.step >> 1) % 8], 0.4, 'sine', 0.075, d);
      this.step++; this.nextT += spb;
    }
  }
};

/* ------------------------------- DOM --------------------------------------- */
const $ = (id) => document.getElementById(id);
const DOM = {};
function grabDom() {
  DOM.cv = $('cv');
  DOM.ctx = DOM.cv.getContext('2d');
  DOM.score = $('score'); DOM.ball = $('ball'); DOM.rank = $('rank');
  DOM.fuelbar = $('fuelbar'); DOM.fueli = DOM.fuelbar.querySelector('i');
  DOM.mission = $('mission'); DOM.toast = $('toast');
  DOM.title = $('title'); DOM.gameover = $('gameover');
  DOM.goScore = $('goScore'); DOM.goRank = $('goRank');
  DOM.stage = $('stage');
}

/* =============================================================================
   台面几何 —— 依据原版桌面元素还原：
   4 个攻击/发射保险杠（3 聚 + 1 孤）、左/右危险靶组、3 个任务靶、
   三个翻板靶组（助推器 / 勋章 / 场地倍数）、3 个虫洞、发射坡道、
   超空间滑道、燃料滑道、黑洞击倒靶、太空弯曲靶、再入车道。
   ============================================================================= */
const T = {
  walls: [], posts: [], bumpers: [], targets: [], drops: [],
  rollovers: [], holes: [], scoops: [], lights: [], flippers: [],
  plunger: { x: 46, y: 190, charge: 0, charging: false, vel: 0, maxCharge: 1 },
  centerPost: { x: 0, y: 178, r: 2.3, up: false, timer: 0 },
  bounds: { x0: -50, x1: 50, y0: 0, y1: 196 }
};

function buildTable() {
  const W = (ax, ay, bx, by, o) => { T.walls.push(Object.assign({ ax, ay, bx, by, r: WALL_R, e: 0.42 }, o)); };
  const arc = (cx, cy, r, a0, a1, o) => {
    const n = Math.max(3, Math.ceil(Math.abs(a1 - a0) / 0.22));
    let px = cx + r * Math.cos(a0), py = cy + r * Math.sin(a0);
    for (let i = 1; i <= n; i++) {
      const a = a0 + (a1 - a0) * i / n;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      W(px, py, x, y, o); px = x; py = y;
    }
  };
  const post = (x, y, r) => T.posts.push({ x, y, r: r || 2.2, e: 0.55 });
  const target = (x, y, bank, idx, o) => T.targets.push(Object.assign(
    { x, y, r: 3.2, bank, idx, lit: false, cd: 0, flash: 0, hits: 0 }, o));
  const drop = (x, y, bank, idx, vert) => T.drops.push(
    { x, y, r: 3.2, bank, idx, vert: !!vert, down: false, cd: 0, flash: 0 });
  const roll = (x, y, r, id) => T.rollovers.push({ x, y, r, id, cd: 0, lit: 0, wasIn: false });
  const hole = (x, y, r, id, ex, ey, evx, evy) => T.holes.push(
    { x, y, r, id, eject: { x: ex, y: ey, vx: evx, vy: evy }, flash: 0, cd: 0 });
  const scoop = (x, y, r, id, exit, path, dur, md) => T.scoops.push(
    { x, y, r, id, exit, path, dur, md: md || [0, 1], flash: 0, cd: 0 });

  /* ---------- 外边界（左侧整墙 + 顶部 + 右侧发射通道） ---------- */
  const DIM = { dim: 1 };
  W(-50, 196, -50, 26, DIM);
  arc(-38, 26, 12, PI, PI * 1.5, DIM);     // 左上圆角
  W(-38, 14, -30, 8, DIM);
  W(-30, 8, 28, 8, DIM);                   // 顶墙
  W(28, 8, 38, 14, DIM);
  arc(38, 26, 12, -PI / 2, 0, DIM);        // 右上圆角
  W(50, 26, 50, 196, { r: 1.0, dim: 1 });  // 发射通道外壁
  W(42, 196, 42, 50, { r: 1.0, dim: 1 });  // 发射通道内壁 = 台面右边界
  W(41, 47, 50, 41.5, { kind: 'gate' });   // 单向门（斜置：出球后自动滑向台面）
  W(42, 194.5, 50, 194.5, { r: 1.0, e: 0.18 }); // 发射器顶面

  /* ---------- 底部：出球道 / 回球道 / 弹射墙 ---------- */
  W(-41, 190, -41, 145, { r: 1.0, hgt: 3.2 });   // 左出球道内壁
  W(34, 190, 34, 145, { r: 1.0, hgt: 3.2 });     // 右出球道内壁
  W(-36, 188, -28, 174, { r: 1.0, hgt: 3.0 });   // 左回球道导板
  W(34, 188, 28, 174, { r: 1.0, hgt: 3.0 });     // 右回球道导板
  W(-41, 145, -26, 168, { kind: 'sling', e: 0.62, kick: 132, hgt: 7.5 });
  W(34, 145, 26, 168, { kind: 'sling', e: 0.62, kick: 132, hgt: 7.5 });
  /* 危险靶组全亮后关闭的出球道闸门 */
  W(-50, 146, -41, 146, { kind: 'outgate', active: false, r: 1.0, hgt: 3 });
  W(34, 146, 42, 146, { kind: 'outgate', active: false, r: 1.0, hgt: 3 });

  /* ---------- 再入车道分隔柱 ---------- */
  post(2, 22); post(10, 22); post(18, 22); post(26, 22);

  /* ---------- 攻击保险杠（3 聚 + 1 孤） ---------- */
  const bump = (x, y, kick, id) => T.bumpers.push(
    { x, y, r: 5.5, kick, id, flash: 0, hits: 0, cd: 0 });

/* =============================================================================
   物理
   ============================================================================= */
function flipperTip(f) {
  return { x: f.px + Math.cos(f.ang) * f.len, y: f.py + Math.sin(f.ang) * f.len };
}
function updateFlippers(dt) {
  const power = G.fuel > 0 ? 1 : 0.42;
  for (const f of T.flippers) {
    const target = f.pressed ? f.up : f.rest;
    const speed = (f.pressed ? 26 : 15) * power;
    const prev = f.ang;
    if (Math.abs(target - f.ang) < 0.02) f.ang = target;
    else f.ang += Math.sign(target - f.ang) * speed * dt;
    f.omega = dt > 0 ? (f.ang - prev) / dt : 0;
  }
  // 中央立柱
  const cp = T.centerPost;
  if (cp.timer > 0) { cp.timer -= dt; cp.up = true; } else cp.up = false;
}

/* 圆 vs 线段 */
function hitSeg(b, ax, ay, bx, by, wr, e, out) {
  const c = closestOnSeg(b.x, b.y, ax, ay, bx, by);
  let nx = b.x - c[0], ny = b.y - c[1];
  let d = len(nx, ny);
  const R = b.r + wr;
  if (d >= R || d < 1e-9) return 0;
  nx /= d; ny /= d;
  b.x += nx * (R - d); b.y += ny * (R - d);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const tx = -ny, ty = nx;
    const vt = (b.vx * tx + b.vy * ty) * 0.985;
    const rest = -vn * e;
    b.vx = nx * rest + tx * vt;
    b.vy = ny * rest + ty * vt;
    if (out) { out.nx = nx; out.ny = ny; out.impact = -vn; }
    return -vn;
  }
  return 0.01;
}

/* 圆 vs 圆 */
function hitCircle(b, cx, cy, cr, e, out) {
  let nx = b.x - cx, ny = b.y - cy;
  let d = len(nx, ny);
  const R = b.r + cr;
  if (d >= R || d < 1e-9) return 0;
  nx /= d; ny /= d;
  b.x += nx * (R - d); b.y += ny * (R - d);
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const tx = -ny, ty = nx;
    const vt = (b.vx * tx + b.vy * ty) * 0.99;
    const rest = -vn * e;
    b.vx = nx * rest + tx * vt;
    b.vy = ny * rest + ty * vt;
    if (out) { out.nx = nx; out.ny = ny; out.impact = -vn; }
    return -vn;
  }
  return 0.01;
}

/* 挡板：胶囊 + 表面速度 */
function hitFlipper(b, f) {
  const tip = flipperTip(f);
  const c = closestOnSeg(b.x, b.y, f.px, f.py, tip.x, tip.y);
  let nx = b.x - c[0], ny = b.y - c[1];
  let d = len(nx, ny);
  const R = b.r + f.r;
  if (d >= R || d < 1e-9) return 0;
  nx /= d; ny /= d;
  b.x += nx * (R - d); b.y += ny * (R - d);
  const rx = c[0] - f.px, ry = c[1] - f.py;
  const svx = -f.omega * ry, svy = f.omega * rx;      // 表面速度
  let rvx = b.vx - svx, rvy = b.vy - svy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    const tx = -ny, ty = nx;
    const vt = (rvx * tx + rvy * ty) * 0.86;
    const rest = -vn * 0.42;
    rvx = nx * rest + tx * vt;
    rvy = ny * rest + ty * vt;
  }
  b.vx = rvx + svx; b.vy = rvy + svy;
  return Math.abs(vn) + Math.abs(f.omega) * f.len * 0.35;
}

function capSpeed(b) {
  const s = len(b.vx, b.vy);
  if (s > MAX_SPEED) { b.vx *= MAX_SPEED / s; b.vy *= MAX_SPEED / s; }
}

/* 沿滑道搬运 */
function advanceTransit(b, dt) {
  const tr = b.transit;
  tr.t += dt / tr.dur;
  if (tr.t >= 1) {
    b.x = tr.exit.x; b.y = tr.exit.y; b.h = 0;
    b.vx = tr.exit.vx; b.vy = tr.exit.vy;
    b.transit = null; b.ghost = 0.25;
    if (tr.onDone) tr.onDone(b);
    return;
  }
  const n = tr.path.length - 1;
  const ft = b.transit.t * n;
  const i = Math.min(n - 1, Math.floor(ft));
  const f = ft - i, s = f * f * (3 - 2 * f);
  const a = tr.path[i], c = tr.path[i + 1];
  b.x = lerp(a[0], c[0], s); b.y = lerp(a[1], c[1], s); b.h = lerp(a[2], c[2], s);
  b.vx = 0; b.vy = 0;
}

/* 单个球的物理推进 */
function stepBall(b, dt) {
  if (b.transit) { advanceTransit(b, dt); return; }
  if (b.held > 0) { b.held -= dt; if (b.held <= 0) releaseHeld(b); return; }
  if (!b.alive) return;
  if (b.resting) { b.vx = 0; b.vy = 0; return; }

  b.vy += GRAV * dt;
  const damp = Math.max(0, 1 - BALL_DRAG * dt);
  b.vx *= damp; b.vy *= damp;

  const steps = 1;
  for (let s = 0; s < steps; s++) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    resolveCollisions(b, dt);
  }
  capSpeed(b);
  b.h = Math.max(0, b.h + b.vh * dt);
  if (b.h > 0) { b.vh -= 620 * dt; if (b.h < 0) { b.h = 0; b.vh = 0; } }
  if (b.ghost > 0) b.ghost -= dt;

  /* 卡球搜索：长时间低速（不在挡板上）时轻推一下 */
  const sp = len(b.vx, b.vy);
  if (sp < 26 && b.h < 1) {
    b.slowT = (b.slowT || 0) + dt;
    if (b.slowT > 2.2) {
      b.slowT = 0;
      const a = rand(0, 6.283);
      b.vx += Math.cos(a) * 120; b.vy += Math.sin(a) * 120 - 40;
      Sfx.hit();
    }
  } else b.slowT = 0;
}

const _hitOut = { nx: 0, ny: 0, impact: 0 };
function resolveCollisions(b, dt) {
  /* --- 静态墙 --- */
  for (const w of T.walls) {
    if (w.kind === 'gate' && b.vy <= 0.6) continue;
    if (w.kind === 'outgate' && !w.active) continue;
    _hitOut.impact = 0;
    const imp = hitSeg(b, w.ax, w.ay, w.bx, w.by, w.r, w.e, _hitOut);
    if (imp > 0 && w.kind === 'sling') {
      b.vx += _hitOut.nx * w.kick; b.vy += _hitOut.ny * w.kick;
      onSlingHit(w);
    } else if (imp > 60) Sfx.hit();
  }

  /* --- 柱 --- */
  for (const p of T.posts) {
    const imp = hitCircle(b, p.x, p.y, p.r, p.e);
    if (imp > 90) Sfx.hit();
  }
  const cp = T.centerPost;
  if (cp.up) hitCircle(b, cp.x, cp.y, cp.r, 0.6);

  /* --- 保险杠 --- */
  for (const bm of T.bumpers) {
    if (bm.cd > 0) { bm.cd -= dt; continue; }
    let nx = b.x - bm.x, ny = b.y - bm.y;
    let d = len(nx, ny);
    const R = b.r + bm.r;
    if (d >= R || d < 1e-9) continue;
    nx /= d; ny /= d;
    b.x += nx * (R - d); b.y += ny * (R - d);
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      const tx = -ny, ty = nx;
      const vt = (b.vx * tx + b.vy * ty) * 0.97;
      b.vx = nx * (-vn * 0.6) + tx * vt;
      b.vy = ny * (-vn * 0.6) + ty * vt;
    }
    b.vx += nx * bm.kick; b.vy += ny * bm.kick;
    bm.cd = 0.09; bm.flash = 1; bm.hits++;
    onBumperHit(bm);
  }

  /* --- 定点靶 --- */
  for (const t of T.targets) {
    if (t.cd > 0) { t.cd -= dt; continue; }
    const imp = hitCircle(b, t.x, t.y, t.r, 0.45);
    if (imp > 0) {
      t.cd = 0.3; t.lit = true; t.flash = 1; t.hits++;
      onTargetHit(t);
    }
  }

  /* --- 翻板靶（倒下后不再碰撞） --- */
  for (const d of T.drops) {
    if (d.cd > 0) d.cd -= dt;
    if (d.down) continue;
    const imp = hitCircle(b, d.x, d.y, d.r, 0.4);
    if (imp > 0 && d.cd <= 0) {
      d.cd = 0.25; d.down = true; d.flash = 1;
      onDropHit(d);
    }
  }

  /* --- 滚动开关 --- */
  for (const r of T.rollovers) {
    if (r.cd > 0) r.cd -= dt;
    const inside = dist2(b.x, b.y, r.x, r.y) < r.r * r.r && b.h < 1;
    if (inside && r.cd <= 0 && !r.wasIn) { r.cd = 0.4; r.lit = 1; onRollover(r); }
    r.wasIn = inside;
  }

  /* --- 虫洞 / 黑洞 --- */
  for (const h of T.holes) {
    if (h.cd > 0) { h.cd -= dt; continue; }
    if (dist2(b.x, b.y, h.x, h.y) < h.r * h.r && b.h < 1.5) {
      b.x = h.x; b.y = h.y; b.vx = b.vy = 0;
      b.held = h.id === 'blackhole' ? 0.55 : 0.8;
      b.holdKind = 'hole'; b.holdRef = h;
      h.flash = 1; h.cd = 2.2;
      onWormhole(h);
    }
  }

  /* --- 滑道（需朝口内飞入才会被捕获） --- */
  for (const s of T.scoops) {
    if (s.cd > 0) { s.cd -= dt; continue; }
    if (dist2(b.x, b.y, s.x, s.y) >= s.r * s.r || b.h > 2.5) continue;
    const sp = len(b.vx, b.vy);
    if (sp > 24) {
      const dot = (b.vx * s.md[0] + b.vy * s.md[1]) / sp;
      if (dot < 0.2) continue;
    }
    s.flash = 1; s.cd = 2.2;
    onScoop(s, b);
  }

  /* --- 挡板 --- */
  for (const f of T.flippers) {
    const imp = hitFlipper(b, f);
    if (imp > 60) { Sfx.hit(); f.flash = 1; }
  }

  /* --- 中央立柱 --- */
  capSpeed(b);
}

function releaseHeld(b) {
  const ref = b.holdRef;
  b.holdKind = null; b.holdRef = null;
  if (!ref) { b.held = 0; return; }
  if (ref.eject) {
    b.x = ref.eject.x; b.y = ref.eject.y;
    b.vx = ref.eject.vx; b.vy = ref.eject.vy;
    b.h = 0; b.vh = 0;
  }
  b.ghost = 0.3;
}

function buildDecor() {

/* ---- 几何绘制助手 ---- */
function circleAt(x, y, r, h) {
  const p = P(x, y, h || 0);
  const d = p.d;
  return {
    cx: p.x, cy: p.y, s: p.s,
    rx: Math.max(0.4, r * p.s),
    ry: Math.max(0.3, FIT.f * (CAM.camH - (h || 0)) * r / Math.max(1, d * d - r * r))
  };
}
function ellipsePath(c) {
  DOM.ctx.beginPath();
  DOM.ctx.ellipse(c.cx, c.cy, c.rx, c.ry, 0, 0, 6.2832);
}
function poly(pts, fill, stroke, lw) {
  const ctx = DOM.ctx;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
/** 立体墙：从台面抬升 h */
function wall3D(ax, ay, bx, by, h, cLow, cHigh, cTop, lwMul) {
  const ctx = DOM.ctx;
  const p0 = P(ax, ay, 0), p1 = P(bx, by, 0);
  const p2 = P(bx, by, h), p3 = P(ax, ay, h);
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
  ctx.closePath();
  const g = ctx.createLinearGradient(
    (p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p3.x + p2.x) / 2, (p3.y + p2.y) / 2);
  g.addColorStop(0, cLow); g.addColorStop(1, cHigh);
  ctx.fillStyle = g; ctx.fill();
  if (cTop) {
    ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineWidth = Math.max(1, (p2.s + p3.s) * 0.5 * (lwMul || 2.2));
    ctx.strokeStyle = cTop; ctx.lineCap = 'round'; ctx.stroke();
  }
}
/** 立体圆柱 */
function cylinder3D(x, y, r, h, sideLow, sideHigh, topIn, topOut, capCol) {
  const ctx = DOM.ctx;
  const b = circleAt(x, y, r, 0), t = circleAt(x, y, r, h);
  ctx.beginPath();
  ctx.moveTo(t.cx - t.rx, t.cy);
  ctx.lineTo(b.cx - b.rx, b.cy);
  ctx.ellipse(b.cx, b.cy, b.rx, b.ry, 0, PI, 0, true);
  ctx.lineTo(t.cx + t.rx, t.cy);
  ctx.ellipse(t.cx, t.cy, t.rx, t.ry, 0, 0, PI, true);
  ctx.closePath();
  const g = ctx.createLinearGradient(t.cx - t.rx, 0, t.cx + t.rx, 0);
  g.addColorStop(0, sideLow); g.addColorStop(0.45, sideHigh); g.addColorStop(1, sideLow);
  ctx.fillStyle = g; ctx.fill();
  ellipsePath(t);
  const tg = ctx.createRadialGradient(
    t.cx - t.rx * 0.35, t.cy - t.ry * 0.5, t.rx * 0.05, t.cx, t.cy, t.rx * 1.05);
  tg.addColorStop(0, topIn); tg.addColorStop(1, topOut);
  ctx.fillStyle = tg; ctx.fill();
  if (capCol) { ctx.strokeStyle = capCol; ctx.lineWidth = Math.max(0.8, t.s * 0.35); ctx.stroke(); }
}
/** 台面发光灯 */
function glowDot(x, y, r, col, alpha, h) {
  const ctx = DOM.ctx;
  const c = circleAt(x, y, r, h || 0.6);
  const g = ctx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, c.rx * 3.2);
  g.addColorStop(0, col); g.addColorStop(0.35, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.rx * 3.2, c.ry * 3.2, 0, 0, 6.2832);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  ellipsePath(c);
  ctx.fillStyle = col; ctx.globalAlpha = Math.min(1, alpha * 1.6); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---- 台面底 ---- */
function drawPlayfieldBase() {
  const ctx = DOM.ctx;
  const c = [P(-50, 0), P(50, 0), P(50, 200), P(-50, 200)];
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(c[0].x, c[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, c[0].y, 0, c[3].y);
  g.addColorStop(0, '#0b1430'); g.addColorStop(0.4, '#081026');
  g.addColorStop(0.82, '#050a18'); g.addColorStop(1, '#03060e');
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();

  /* 星云 */
  for (const n of NEBULAS) {
    const p = P(n.x, n.y, 0);
    const rr = n.r * p.s;
    const ng = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    ng.addColorStop(0, n.c); ng.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr * 0.72, 0, 0, 6.2832); ctx.fill();
  }
  /* 星星 */
  for (const s of STARS) {
    const p = P(s.x, s.y, 0);
    const tw = 0.62 + 0.38 * Math.sin(TIME * 1.7 + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.r > 1.05 ? '#cfe6ff' : '#9fc4ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, s.r * p.s * 0.42), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawPrintArt();
  ctx.restore();
}

function drawPrintArt() {
  const ctx = DOM.ctx;
  const line = (ax, ay, bx, by, col, w, alpha) => {
    const p0 = P(ax, ay, 0), p1 = P(bx, by, 0);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = col; ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); ctx.globalAlpha = 1;
  };
  /* 车道指引线 */
  line(46.5, 180, 46.5, 56, 'rgba(255,170,60,.18)', 2);      // 发射道
  line(-38.5, 176, -38.5, 150, 'rgba(90,200,255,.20)', 2);   // 左出球道
  line(31.5, 176, 31.5, 150, 'rgba(90,200,255,.20)', 2);     // 右出球道
  line(-33, 182, -29, 177, 'rgba(90,200,255,.18)', 2);       // 左回球道
  line(31, 182, 28, 177, 'rgba(90,200,255,.18)', 2);         // 右回球道

  /* 再入车道框 */
  for (let i = 0; i < 3; i++) {
    const x0 = 2 + i * 8, x1 = x0 + 8;
    line(x0 + 0.5, 13, x0 + 0.5, 31, 'rgba(70,200,255,.22)', 1.4);
    line(x1 - 0.5, 13, x1 - 0.5, 31, 'rgba(70,200,255,.22)', 1.4);
    line(x0 + 0.5, 13, x1 - 0.5, 13, 'rgba(70,200,255,.14)', 1.2);
  }

  /* 台面文字 */
  const txt = (x, y, str, size, col, alpha, style) => {
    const p = P(x, y, 0);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.font = `${style || '700 italic'} ${Math.max(5, size * p.s)}px "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = col; ctx.fillText(str, x === 0 ? p.x : p.x, p.y);
    ctx.restore();
  };
  txt(0, 15, 'SPACE CADET', 8.5, 'rgba(150,215,255,.20)', 1, '800 italic');
  txt(-38, 82, 'MISSION', 2.5, 'rgba(120,200,255,.28)', 1, '700');
  txt(28, 88, 'BOOST', 2.5, 'rgba(255,160,90,.30)', 1, '700');
  txt(-6, 30, 'MULTIPLIER', 2.4, 'rgba(180,140,255,.30)', 1, '700');
  txt(-39, 60, 'FUEL', 2.4, 'rgba(120,255,180,.32)', 1, '700');
  txt(-36, 120, 'LAUNCH', 2.4, 'rgba(255,200,90,.30)', 1, '700');
  txt(24, 76, 'SPACE WARP', 2.2, 'rgba(180,220,255,.30)', 1, '700');
  txt(24, 110, 'YELLOW', 2.2, 'rgba(255,220,90,.38)', 1, '700');
  txt(32, 27, 'RED', 2.2, 'rgba(255,110,90,.38)', 1, '700');
  txt(-15, 17, 'GREEN', 2.2, 'rgba(110,255,150,.38)', 1, '700');
  txt(0, 192, '3D PINBALL — SPACE CADET', 5.4, 'rgba(140,190,255,.26)', 1, '700');
}

/* ---- 主渲染 ---- */
function render() {
  const ctx = DOM.ctx;
  drawBackdrop();
  drawPlayfieldBase();

  /* 收集所有立体物体 */
  for (const w of T.walls) {
    const segLen = Math.hypot(w.bx - w.ax, w.by - w.ay);
    const n = Math.max(1, Math.ceil(segLen / 22));
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n;
      const ax = lerp(w.ax, w.bx, t0), ay = lerp(w.ay, w.by, t0);
      const bx = lerp(w.ax, w.bx, t1), by = lerp(w.ay, w.by, t1);
      pushDraw((ay + by) / 2, () => {
        const hh = w.hgt || 6.5;
        if (w.kind === 'sling') {
          wall3D(ax, ay, bx, by, hh, '#5b1620', '#a8303a', '#ff8b7a', 2.6);
          const p0 = P(ax, ay, hh + 0.5), p1 = P(bx, by, hh + 0.5);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = 'rgba(255,220,120,.75)';
          ctx.lineWidth = Math.max(1, (p0.s + p1.s) * 0.5 * 1.1);
          ctx.stroke();
        } else if (w.kind === 'gate') {
          const p0 = P(ax, ay, 4), p1 = P(bx, by, 4);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = 'rgba(140,230,255,.55)';
          ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
        } else if (w.kind === 'outgate') {
          if (!w.active) return;
          wall3D(ax, ay, bx, by, hh, '#0d2a1c', '#1f6b42', '#7dffb0', 2.2);
        } else if (w.dim) {
          wall3D(ax, ay, bx, by, Math.min(hh, 5), '#0b1c2e', '#1b4468', '#4d9cc4', 2.0);
        } else {
          wall3D(ax, ay, bx, by, hh, '#16324f', '#2c6d9e', '#8fe4ff', 2.4);
        }
      });
    }
  }
  for (const p of T.posts) {
    pushDraw(p.y, () => {
      cylinder3D(p.x, p.y, p.r, 6.5, '#122a42', '#2f6b96', '#bfeeff', '#2b6d96', 'rgba(180,240,255,.5)');
    });
  }
  /* 保险杠 */
  for (const bm of T.bumpers) {
    pushDraw(bm.y, () => {
      const fl = bm.flash;
      const base = circleAt(bm.x, bm.y, bm.r * 1.28, 0);
      ellipsePath(base);
      ctx.fillStyle = 'rgba(6,14,30,.85)'; ctx.fill();
      cylinder3D(bm.x, bm.y, bm.r, 8.5,
        '#12283f', '#2b5f8c', '#e8f7ff', '#3f7fae', 'rgba(200,240,255,.55)');
      const cap = circleAt(bm.x, bm.y, bm.r * 0.78, 8.6);
      const g = ctx.createRadialGradient(cap.cx - cap.rx * 0.3, cap.cy - cap.ry * 0.4, 0, cap.cx, cap.cy, cap.rx);
      const hot = clamp(0.35 + fl * 0.9, 0, 1);
      g.addColorStop(0, `rgba(255,${200 + 55 * hot | 0},${120 + 120 * hot | 0},${0.55 + 0.45 * hot})`);
      g.addColorStop(1, `rgba(${120 + 135 * hot | 0},${40 + 90 * hot | 0},${20 + 60 * hot | 0},.9)`);
      ellipsePath(cap); ctx.fillStyle = g; ctx.fill();
      if (fl > 0.02) {
        glowDot(bm.x, bm.y, bm.r * 1.5, `rgba(255,170,70,${fl * 0.55})`, 1, 9);
      }
    });
  }
  /* 定点靶 */
  for (const t of T.targets) {
    pushDraw(t.y, () => {
      const col = t.bank === 'mission' ? [255, 170, 60]
        : t.bank === 'hazL' || t.bank === 'hazR' ? [90, 200, 255]
          : t.bank === 'warp' ? [200, 140, 255] : [110, 255, 180];
      const lit = t.lit ? 1 : 0.25;
      cylinder3D(t.x, t.y, t.r * 0.9, 5.2,
        'rgba(20,30,50,.9)', `rgba(${col[0] * 0.4 | 0},${col[1] * 0.4 | 0},${col[2] * 0.4 | 0},.95)`,
        `rgba(${col[0]},${col[1]},${col[2]},${0.35 + 0.65 * lit})`,
        'rgba(20,40,70,.95)', 'rgba(180,220,255,.45)');
      if (t.lit) glowDot(t.x, t.y, t.r * 1.15, `rgba(${col[0]},${col[1]},${col[2]},${0.30 + 0.3 * t.flash})`, 1, 5.4);
      if (t.flash > 0.02) glowDot(t.x, t.y, t.r * 1.6, `rgba(255,255,255,${t.flash * 0.5})`, 1, 6);
    });
  }
  /* 翻板靶 */
  for (const d of T.drops) {
    pushDraw(d.y, () => {
      const col = d.bank === 'boost' ? [255, 150, 60] : d.bank === 'medal' ? [120, 255, 170] : [190, 140, 255];
      const h = d.down ? 1.2 : 6.2;
      const halfW = d.vert ? d.r * 0.72 : d.r * 0.92;
      const halfH = d.vert ? d.r * 0.92 : d.r * 0.72;
      const p = P(d.x, d.y, h);
      const w = halfW * p.s, hh = halfH * p.s * 0.72;
      ctx.save();
      ctx.translate(p.x, p.y);
      const g = ctx.createLinearGradient(-w, -hh, w, hh);
      g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${d.down ? 0.35 : 0.95})`);
      g.addColorStop(1, `rgba(${col[0] * 0.4 | 0},${col[1] * 0.4 | 0},${col[2] * 0.4 | 0},${d.down ? 0.3 : 0.95})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-w, -hh, w * 2, hh * 2, Math.min(w, hh) * 0.5);
      else ctx.rect(-w, -hh, w * 2, hh * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(230,245,255,.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
      if (!d.down) glowDot(d.x, d.y, d.r * 1.1, `rgba(${col[0]},${col[1]},${col[2]},${0.18 + 0.25 * d.flash})`, 1, h + 0.2);
      if (d.flash > 0.02) glowDot(d.x, d.y, d.r * 1.7, `rgba(255,255,255,${d.flash * 0.55})`, 1, h + 0.5);
    });
  }
  /* 滚动开关 */
  for (const r of T.rollovers) {
    pushDraw(r.y, () => {
      const c = circleAt(r.x, r.y, r.r * 0.5, 0.4);
      ellipsePath(c);
      ctx.fillStyle = 'rgba(10,20,40,.7)'; ctx.fill();
      ctx.strokeStyle = `rgba(120,220,255,${0.35 + 0.5 * r.lit})`; ctx.lineWidth = 1.4; ctx.stroke();
      if (r.lit > 0.02) glowDot(r.x, r.y, r.r * 0.7, `rgba(120,230,255,${r.lit * 0.7})`, 1, 1);
    });
  }
  /* 虫洞 / 黑洞 */
  for (const h of T.holes) {
    pushDraw(h.y, () => {
      const isBH = h.id === 'blackhole';
      const c = circleAt(h.x, h.y, h.r, 0);
      const g = ctx.createRadialGradient(c.cx, c.cy, c.rx * 0.1, c.cx, c.cy, c.rx * 1.5);
      if (isBH) {
        g.addColorStop(0, '#000'); g.addColorStop(0.55, '#120a1e');
        g.addColorStop(0.8, 'rgba(150,80,255,.55)'); g.addColorStop(1, 'rgba(60,0,120,0)');
      } else {
        const cc = h.id === 'yellow' ? '255,210,70' : h.id === 'red' ? '255,90,70' : '90,255,150';
        g.addColorStop(0, '#02030a'); g.addColorStop(0.55, `rgba(${cc},.35)`);
        g.addColorStop(0.82, `rgba(${cc},.75)`); g.addColorStop(1, `rgba(${cc},0)`);
      }
      ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.rx * 1.5, c.ry * 1.5, 0, 0, 6.2832);
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.rx * 0.62, c.ry * 0.62, 0, 0, 6.2832);
      ctx.fillStyle = '#000'; ctx.fill();
      const sw = 0.5 + 0.5 * Math.sin(TIME * 3 + h.x);
      ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.rx * 0.95, c.ry * 0.95, 0, 0, 6.2832);
      ctx.strokeStyle = isBH ? `rgba(190,130,255,${0.35 + 0.35 * sw})`
        : h.id === 'yellow' ? `rgba(255,220,110,${0.4 + 0.4 * sw})`
          : h.id === 'red' ? `rgba(255,130,110,${0.4 + 0.4 * sw})` : `rgba(130,255,180,${0.4 + 0.4 * sw})`;
      ctx.lineWidth = 1.6; ctx.stroke();
      if (h.flash > 0.02) glowDot(h.x, h.y, h.r * 1.5, `rgba(255,255,255,${h.flash * 0.5})`, 1, 1);
    });
  }
  /* 滑道入口 */
  for (const s of T.scoops) {
    pushDraw(s.y, () => {
      const c = circleAt(s.x, s.y, s.r, 0);
      const g = ctx.createRadialGradient(c.cx, c.cy - c.ry * 0.3, 0, c.cx, c.cy, c.rx);
      g.addColorStop(0, 'rgba(20,60,90,.95)'); g.addColorStop(0.7, 'rgba(8,22,44,.95)');
      g.addColorStop(1, 'rgba(4,10,22,.2)');
      ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.rx, c.ry, 0, 0, 6.2832);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = `rgba(120,230,255,${0.45 + 0.4 * s.flash})`;
      ctx.lineWidth = 1.8; ctx.stroke();
      const p = P(s.x, s.y, 0.5);
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.35 * s.flash;
      ctx.font = `700 ${Math.max(6, 4.6 * p.s)}px "Segoe UI", Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#9fe6ff';
      ctx.fillText(s.id === 'launchramp' ? 'LAUNCH RAMP'
        : s.id === 'hyperspace' ? 'HYPERSPACE' : 'FUEL CHUTE', p.x, p.y);
      ctx.restore();
    });
  }
  /* 滑道（抬升的通道，画在台面上） */
  for (const s of T.scoops) {
    pushDraw(s.y - 0.1, () => {
      const pts = s.path.map(pt => P(pt[0], pt[1], pt[2]));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = 'rgba(60,140,200,.22)';
      ctx.lineWidth = 11; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = 'rgba(120,220,255,.55)'; ctx.lineWidth = 3.2; ctx.stroke();
      ctx.strokeStyle = 'rgba(230,250,255,.5)'; ctx.lineWidth = 1.1; ctx.stroke();
      /* 支柱 */
      for (let i = 0; i < pts.length; i += 2) {
        const b = P(s.path[i][0], s.path[i][1], 0);
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(pts[i].x, pts[i].y);
        ctx.strokeStyle = 'rgba(90,160,210,.35)'; ctx.lineWidth = 1.4; ctx.stroke();
      }
    });
  }
  /* 台面灯 */
  for (const L of T.lights) {
    pushDraw(L.y, () => {
      const on = L.on ? 1 : 0.18;
      glowDot(L.x, L.y, L.r, `rgba(255,200,70,${0.25 + 0.75 * on})`, 1, 0.8);
    });
  }
  /* 旗帜 */
  drawFlag(-38, 14, 1);
  drawFlag(41, 13, -1);
  /* 中央立柱 */
  pushDraw(T.centerPost.y, () => {
    if (T.centerPost.up) {
      cylinder3D(0, 178, 2.3, 7, '#3a2a10', '#b58a30', '#fff3c0', '#8a6a20', 'rgba(255,230,150,.6)');
    }
  });
  /* 发射器 */
  pushDraw(196, drawPlunger);
  /* 挡板 */
  for (const f of T.flippers) pushDraw(f.py + 8, () => drawFlipper(f));
  /* 球 */
  for (const b of G.balls) if (b.alive) pushDraw(b.y + 0.01, () => drawBall(b));

  flushDraw();
}

function drawFlag(x, y, dir) {
  const ctx = DOM.ctx;
  const base = P(x, y, 0), top = P(x, y, 15);
  ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y);
  ctx.strokeStyle = 'rgba(200,225,255,.8)'; ctx.lineWidth = Math.max(1, base.s * 0.5); ctx.stroke();
  const w = 6 * top.s * dir, h = 4.2 * top.s;
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);
  ctx.lineTo(top.x + w, top.y + h * 0.5);
  ctx.lineTo(top.x, top.y + h);
  ctx.closePath();
  ctx.fillStyle = dir > 0 ? 'rgba(90,220,255,.9)' : 'rgba(255,160,60,.9)';
  ctx.fill();
  glowDot(x, y, 2.2, 'rgba(150,230,255,.25)', 1, 15);
}

function drawPlunger() {
  const ctx = DOM.ctx;
  const pl = T.plunger;
  const topY = 194 + pl.charge * 5;
  const a = P(pl.x, topY, 3.1), b = P(pl.x, 199.5, 3.1);
  /* 弹簧 */
  const coils = 6, steps = coils * 2;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const yy = lerp(topY + 1.2, 199.5, t);
    const xx = pl.x + (i % 2 ? 2.6 : -2.6) * (1 - t * 0.15);
    const p = P(xx, yy, 3.1);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(150,190,230,.75)';
  ctx.lineWidth = Math.max(1.2, a.s * 0.7); ctx.stroke();
  /* 杆 */
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = 'rgba(190,215,240,.9)';
  ctx.lineWidth = Math.max(2, a.s * 1.4); ctx.lineCap = 'round'; ctx.stroke();
  /* 头 */
  const c = circleAt(pl.x, topY, 3.1, 3.1);
  const g = ctx.createRadialGradient(c.cx - c.rx * 0.3, c.cy - c.ry * 0.4, 0, c.cx, c.cy, c.rx);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#9fb6d0'); g.addColorStop(1, '#41546e');
  ellipsePath(c); ctx.fillStyle = g; ctx.fill();
  if (pl.charging) glowDot(pl.x, topY, 3.4, `rgba(255,190,80,${0.25 + 0.5 * pl.charge})`, 1, 4);
}

function drawFlipper(f) {
  const ctx = DOM.ctx;
  const tip = flipperTip(f);
  const a = P(f.px, f.py, 2.0), b = P(tip.x, tip.y, 2.0);
  const w = Math.max(2.4, f.r * a.s);
  ctx.lineCap = 'round';
  /* 投影 */
  ctx.beginPath(); ctx.moveTo(a.x, a.y + w * 0.7); ctx.lineTo(b.x, b.y + w * 0.7);
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = w * 2.3; ctx.stroke();
  /* 橡胶外圈 */
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = '#101a2b'; ctx.lineWidth = w * 2.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  const g = ctx.createLinearGradient(a.x, a.y - w * 1.3, a.x, a.y + w * 1.3);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#cfe4f7');
  g.addColorStop(0.62, '#6f9cc4'); g.addColorStop(1, '#20344c');
  ctx.strokeStyle = g; ctx.lineWidth = w * 2.1; ctx.stroke();
  /* 顶端橡胶 */
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = 'rgba(255,196,96,.9)'; ctx.lineWidth = Math.max(1.2, w * 0.5); ctx.stroke();
  /* 轴心 */
  const c = circleAt(f.px, f.py, f.r * 1.2, 2.0);
  ellipsePath(c); ctx.fillStyle = '#0b1526'; ctx.fill();
  ctx.strokeStyle = 'rgba(170,215,255,.6)'; ctx.lineWidth = 1.3; ctx.stroke();
  if (f.flash > 0.02) glowDot(f.px, f.py, f.r * 1.5, `rgba(255,200,120,${f.flash * 0.55})`, 1, 2.5);
}

function drawBall(b) {
  const ctx = DOM.ctx;
  const p = P(b.x, b.y, b.h);
  const r = Math.max(1.5, b.r * p.s);
  const sh = P(b.x, b.y, 0);
  const shA = clamp(0.5 - b.h / 26, 0.05, 0.5);
  ctx.beginPath();
  ctx.ellipse(sh.x, sh.y + r * 0.5, r * 1.02, r * 0.44, 0, 0, 6.2832);
  ctx.fillStyle = `rgba(0,0,0,${shA})`; ctx.fill();
  const g = ctx.createRadialGradient(p.x - r * 0.36, p.y - r * 0.42, r * 0.08, p.x, p.y, r * 1.06);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.28, '#e6eef8');
  g.addColorStop(0.62, '#9aaec4'); g.addColorStop(0.88, '#4a5b73'); g.addColorStop(1, '#1b2432');
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x - r * 0.34, p.y - r * 0.4, r * 0.26, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
  if (b.ghost > 0) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r * (1 + b.ghost * 1.6), 0, 6.2832);
    ctx.strokeStyle = `rgba(150,220,255,${b.ghost})`; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

/* ---------------------------- 事件分发 ------------------------------------- */
function emit(type, data) {
  const ev = Object.assign({ t: type }, data || {});
  if (type === 'wormhole') { /* 虫洞连锁 */ }
  if (!G.mission) return;
  const ms = G.mission;
  const step = ms.steps[G.missionStep];
  if (!step) return;
  if (step.ev !== type) return;
  if (step.f && !step.f(ev)) return;
  G.missionProg++;
  if (G.missionProg >= step.need) {
    G.missionStep++; G.missionProg = 0;
    if (G.missionStep >= ms.steps.length) { completeMission(); return; }
    Sfx.target(); toast(ms.name + ' · 阶段完成', true);
  }
}
function completeMission() {
  const ms = G.mission;
  addScore(ms.award);
  G.missionsDone++;
  Sfx.mission(); Sfx.promote();
  toast('任务完成：' + ms.cn + '  +' + ms.award.toLocaleString(), true);
  G.mission = null; G.missionProg = 0; G.missionStep = 0;
  G.missionTargetsLit = [false, false, false];
  for (const t of T.targets) if (t.bank === 'mission') t.lit = false;
  const need = MISSIONS_PER_RANK * (G.rankIdx + 1);
  if (G.missionsDone >= need && G.rankIdx < RANKS.length - 1) {
    G.rankIdx++;
    addScore(100000);
    Sfx.promote();
    toast('晋升 ' + RANKS[G.rankIdx] + ' · ' + RANKS_CN[G.rankIdx], true);
  }
}
function selectMission(slot) {
  const tier = missionTier();
  let ms;
  if (G.missionTargetsLit.every(Boolean)) {
    ms = tier.special;
    G.missionTargetsLit = [false, false, false];
    for (const t of T.targets) if (t.bank === 'mission') t.lit = false;
  } else {
    ms = slot === 0 ? tier.top : slot === 1 ? tier.middle : tier.bottom;
  }
  if (!ms) return;
  G.mission = ms; G.missionProg = 0; G.missionStep = 0;
  Sfx.target();
  toast('任务：' + ms.cn, false);
}

/* ---------------------------- 记分飘字 ------------------------------------- */
const FLOATS = [];
function glowFlash(x, y, val) {
  FLOATS.push({ x, y, t: 0, val: val });
}
function updateFloats(dt) {
  for (let i = FLOATS.length - 1; i >= 0; i--) {
    const f = FLOATS[i];
    f.t += dt; f.y -= dt * 14;
    if (f.t > 0.85) FLOATS.splice(i, 1);
  }
}
function drawFloats() {
  const ctx = DOM.ctx;
  for (const f of FLOATS) {
    const p = P(f.x, f.y, 6);
    const a = 1 - f.t / 0.85;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `700 ${Math.max(8, 6 * p.s)}px "Segoe UI", Arial`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd257';
    ctx.shadowColor = 'rgba(255,160,0,.9)'; ctx.shadowBlur = 8;
    ctx.fillText('+' + f.val.toLocaleString(), p.x, p.y - f.t * 30);
    ctx.restore();
  }
}

/* ---------------------------- 球的生命周期 --------------------------------- */
function makeBall(x, y) {
  return {
    x, y, vx: 0, vy: 0, h: 0, vh: 0, r: BALL_R, alive: true, resting: false,
    held: 0, holdKind: null, holdRef: null, transit: null, ghost: 0
  };
}
function serveBall() {
  G.balls.length = 0;
  const b = makeBall(T.plunger.x, 190.9);
  b.resting = true;
  G.balls.push(b);
  G.state = 'ready';
  G.plungerCharge = 0; T.plunger.charge = 0;
  G.ballSave = 6;
  toast('弹球 ' + G.ballNum + ' · 按住空格发射', false);
}
function newGame() {
  G.balls.length = 0;
  G.score = 0; G.ballNum = 1; G.extraBalls = 0;
  G.rankIdx = 0; G.missionsDone = 0;
  G.mission = null; G.missionProg = 0; G.missionStep = 0;
  G.fuel = 100; G.mult = 1; G.bumperLevel = 0;
  G.launchLights = [false, false, false];
  G.reentryLights = [false, false, false];
  G.hazL = [false, false, false]; G.hazR = [false, false, false];
  G.gates = { L: false, R: false };
  G.missionTargetsLit = [false, false, false];
  G.tilt = 0; G.tiltTimer = 0; G.tilted = false;
  G.hyperCombo = 0; G.hyperComboT = 0;
  for (const t of T.targets) { t.lit = false; t.cd = 0; }
  for (const d of T.drops) { d.down = false; d.cd = 0; }
  for (const L of T.lights) L.on = false;
  T.centerPost.timer = 0; T.centerPost.up = false;
  T.plunger.charge = 0;
  if (DOM.title) DOM.title.classList.add('hidden');
  if (DOM.gameover) DOM.gameover.classList.add('hidden');
  Sfx.init(); Sfx.resume();
  serveBall();
}
function drainBall(b) {
  b.alive = false;
  G.balls = G.balls.filter(x => x !== b);
  Sfx.drain();
  if (G.balls.length > 0) return;
  if (G.ballSave > 0 && G.ballNum === 1) {
    G.ballSave = 0;
    toast('球保护 · 重新发射', true);
    serveBall();
    return;
  }
  if (G.extraBalls > 0) {
    G.extraBalls--;
    toast('使用追加球！', true);
    serveBall();
    return;
  }
  G.ballNum++;
  if (G.ballNum > G.maxBalls) {
    G.state = 'over';
    Sfx.over();
    if (DOM.goScore) DOM.goScore.textContent = G.score.toLocaleString();
    if (DOM.goRank) DOM.goRank.textContent = 'RANK: ' + RANKS[G.rankIdx] + ' · ' + RANKS_CN[G.rankIdx];
    if (DOM.gameover) DOM.gameover.classList.remove('hidden');
    if (DOM.title) DOM.title.classList.add('hidden');
    return;
  }
  G.state = 'waiting';
  setTimeout(() => { if (G.ballNum <= G.maxBalls && G.state === 'waiting') serveBall(); }, 900);
}

/* ---------------------------- 每步逻辑 ------------------------------------- */
function stepGame(dt) {
  /* 挡板 */
  updateFlippers(dt);
  /* 出球道闸门 */
  for (const w of T.walls) {
    if (w.kind === 'outgate') w.active = w.ax < 0 ? G.gates.L : G.gates.R;
  }
  /* 发射器 */
  const pl = T.plunger;
  if (G.state === 'ready') {
    if (G.plungerCharging) {
      G.plungerCharge = Math.min(1, G.plungerCharge + dt * 1.25);
      pl.charge = G.plungerCharge;
      const b = G.balls[0];
      if (b) { b.y = 190.9 + pl.charge * 5; b.vx = 0; b.vy = 0; }
    }
  }
  /* 球 */
  for (const b of G.balls.slice()) {
    if (b.y > 192 && b.x < 41.5) { drainBall(b); continue; }
    stepBall(b, dt);
    if (b.y > 192 && b.x < 41.5) { drainBall(b); continue; }
  }
  /* 球停在发射道里 → 重新装填 */
  if (G.state === 'playing' && G.balls.length === 1) {
    const b = G.balls[0];
    if (!b.transit && !b.held && b.x > 42 && b.y > 176 && Math.abs(b.vy) < 9) {
      b.resting = true; b.vx = 0; b.vy = 0;
      b.y = 190.9;
      G.state = 'ready'; G.plungerCharge = 0; pl.charge = 0;
      toast('重新装填 · 按住空格发射', false);
    }
  }
  /* 计时器 */
  if (G.reentryCooldown > 0) G.reentryCooldown -= dt;
  if (G.hyperComboT > 0) { G.hyperComboT -= dt; if (G.hyperComboT <= 0) G.hyperCombo = 0; }
  if (G.tiltTimer > 0) { G.tiltTimer -= dt; if (G.tiltTimer <= 0) G.tilt = 0; }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 5);
  if (G.ballSave > 0) G.ballSave -= dt;
  /* 翻板靶复位 */
  for (const k in G.bankReset) {
    if (G.bankReset[k] > 0) {
      G.bankReset[k] -= dt;
      if (G.bankReset[k] <= 0) {
        for (const d of T.drops) if (d.bank === k) { d.down = false; d.cd = 0.2; }
      }
    }
  }
  /* 元素闪光衰减 */
  for (const bm of T.bumpers) if (bm.flash > 0) bm.flash -= dt * 3.2;
  for (const t of T.targets) if (t.flash > 0) t.flash -= dt * 3.2;
  for (const d of T.drops) if (d.flash > 0) d.flash -= dt * 3.2;
  for (const r of T.rollovers) if (r.lit > 0) r.lit -= dt * 2.2;
  for (const h of T.holes) if (h.flash > 0) h.flash -= dt * 2.5;
  for (const s of T.scoops) if (s.flash > 0) s.flash -= dt * 2.5;
  for (const f of T.flippers) if (f.flash > 0) f.flash -= dt * 3;
  /* 燃料 */
  if (G.state === 'playing') {
    G.fuel = Math.max(0, G.fuel - dt * 0.75);
    if (G.fuel <= 0 && !G.fuelWarned) {
      G.fuelWarned = true;
      toast('燃料耗尽 · 挡板无力！', true);
      Sfx.tilt();
    }
    if (G.fuel > 5) G.fuelWarned = false;
  }
  updateFloats(dt);
  if (G.toastT > 0) {
    G.toastT -= dt;
    if (G.toastT <= 0 && DOM.toast) DOM.toast.className = '';
  }
}

/* ---------------------------- 主循环 --------------------------------------- */
let lastT = 0, acc = 0, hudTick = 0;
function frame(t) {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  TIME += dt;
  acc += dt;
  let guard = 0;
  while (acc >= FIXED_DT && guard++ < 600) { stepGame(FIXED_DT); acc -= FIXED_DT; }
  Music.update(TIME);
  render();
  drawFloats();
  hudTick += dt;
  if (hudTick > 0.08) { hudTick = 0; updateHud(); }
}

function updateHud() {
  if (DOM.score && G.score !== G.lastScore) {
    G.lastScore = G.score;
    DOM.score.textContent = G.score.toLocaleString();
  }
  if (DOM.ball) DOM.ball.textContent = Math.min(G.ballNum, G.maxBalls);
  if (DOM.rank) DOM.rank.textContent = RANKS[G.rankIdx];
  if (DOM.fueli) {
    DOM.fueli.style.width = Math.round(G.fuel) + '%';
    DOM.fuelbar.classList.toggle('low', G.fuel < 25);
  }
  if (DOM.mission) {
    let txt;
    if (G.state === 'attract') txt = '按 F2 或点击「开始游戏」';
    else if (G.state === 'over') txt = '本局结束 · 按 F2 重新开始';
    else if (G.tilted) txt = '<span class="m-flash">TILT — 台面倾斜！</span>';
    else if (G.mission) {
      const ms = G.mission, step = ms.steps[G.missionStep];
      const d = step ? ` ${G.missionProg}/${step.need}` : '';
      txt = `<span class="m-title">${ms.cn}</span> ${step && step.desc ? step.desc : ms.name}${d}`;
    } else txt = '击中任务靶选择任务 · 照亮再入车道升级保险杠';
    if (DOM.mission.dataset.txt !== txt) { DOM.mission.dataset.txt = txt; DOM.mission.innerHTML = txt; }
  }
}

/* ---------------------------- 输入 ----------------------------------------- */
function nudge(dir) {
  if (G.state !== 'playing' && G.state !== 'ready') return;
  if (G.tilted) return;
  G.shake = 1; G.shakeDir = dir;
  G.tilt++;
  G.tiltTimer = 3.2;
  for (const b of G.balls) {
    if (!b.alive || b.transit) continue;
    b.vx += dir * 46;
    b.vy -= 16;
  }
  Sfx.hit();
  if (G.tilt >= 3) {
    G.tilted = true;
    Sfx.tilt();
    toast('TILT — 弹球判负！', true);
    for (const b of G.balls.slice()) drainBall(b);
  }
}
function flipperPress(side, down) {
  const f = T.flippers.find(x => x.side === side);
  if (!f) return;
  if (f.pressed === down) return;
  f.pressed = down;
  if (down) Sfx.flip();
}
function plungeDown() {
  if (G.state !== 'ready') { Sfx.init(); Sfx.resume(); return; }
  Sfx.init(); Sfx.resume();
  G.plungerCharging = true;
}
function plungeUp() {
  if (G.state !== 'ready' || !G.plungerCharging) { G.plungerCharging = false; return; }
  G.plungerCharging = false;
  const c = Math.max(0.18, G.plungerCharge);
  const b = G.balls[0];
  T.plunger.charge = 0; G.plungerCharge = 0;
  if (b) {
    b.y = 190.9;
    b.resting = false;
    b.vy = -(215 + 235 * c);
    b.vx = rand(-6, 6);
    b.h = 0;
  }
  G.state = 'playing';
  Sfx.launch();
  toast('发射！', false);
}
function bindInput() {
  if (typeof window === 'undefined' || !window.addEventListener) return;
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'z' || k === 'Z' || k === 'Shift' || k === 'ArrowLeft') { flipperPress(-1, true); e.preventDefault(); }
    else if (k === '/' || k === '?' || k === 'ArrowRight') { flipperPress(1, true); e.preventDefault(); }
    else if (k === ' ' || k === 'Spacebar') { plungeDown(); e.preventDefault(); }
    else if (k === 'x' || k === 'X') { nudge(-1); e.preventDefault(); }
    else if (k === '.') { nudge(1); e.preventDefault(); }
    else if (k === 'ArrowUp') { nudge(0); e.preventDefault(); }
    else if (k === 'F2' || k === 'Enter') { newGame(); e.preventDefault(); }
    else if (k === 'm' || k === 'M') { Sfx.muted = !Sfx.muted; toast(Sfx.muted ? '静音' : '音效开启', false); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'z' || k === 'Z' || k === 'Shift' || k === 'ArrowLeft') flipperPress(-1, false);
    if (k === '/' || k === '?' || k === 'ArrowRight') flipperPress(1, false);
    if (k === ' ') plungeUp();
  });
  if (DOM.cv) {
    DOM.cv.addEventListener('pointerdown', (e) => {
      if (G.state === 'ready') { plungeDown(); return; }
      const r = DOM.cv.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < 0.5) flipperPress(-1, true); else flipperPress(1, true);
    });
    DOM.cv.addEventListener('pointerup', () => { flipperPress(-1, false); flipperPress(1, false); plungeUp(); });
    DOM.cv.addEventListener('pointercancel', () => { flipperPress(-1, false); flipperPress(1, false); });
  }
  if ($('btnStart')) $('btnStart').addEventListener('click', () => newGame());
  if ($('btnAgain')) $('btnAgain').addEventListener('click', () => newGame());
}

/* ---------------------------- 启动 ----------------------------------------- */
function boot() {
  grabDom();
  resize();
  buildDecor();
  bindInput();
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', resize);
  updateHud();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  /* 开发/截图用：?auto=N 自动开局并快进 N 秒 */
  try {
    if (typeof location !== 'undefined' && /[?&](auto|shot)/.test(location.search)) {
      newGame();
      const m = location.search.match(/auto=(\d+)/);
      setTimeout(() => {
        plungeDown(); G.plungerCharge = 1; plungeUp();
        const secs = m ? Math.min(60, +m[1]) : 0;
        for (let i = 0; i < secs * 60; i++) stepGame(1 / 60);
      }, 250);
    }
  } catch (e) {}
}
if (typeof document !== 'undefined') boot();

/* 测试出口 */
if (typeof globalThis !== 'undefined') {
  globalThis.__PINBALL__ = { G, T, stepGame, frame, render, newGame, serveBall, plungeDown, plungeUp, nudge, flipperPress, emit, P, FIT, CAM };
}


</script>
