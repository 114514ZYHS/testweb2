<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无限瓷砖地板</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #c {
    position: absolute;
    left: 0;
    top: 0;
    width: 66.67%;
    height: 100%;
    display: none;
  }
  #panel {
    position: absolute;
    left: 66.67%;
    top: 0;
    width: 33.33%;
    height: 100vh;
    background: rgba(16, 24, 40, 0.92);
    border-left: 3px solid #8AB8FF;
    cursor: pointer;
    box-sizing: border-box;
    user-select: none;
    display: none;
  }
  #m { width: 100%; height: 100%; }
  #editor {
    position: absolute;
    left: 0;
    top: 0;
    width: 66.67%;
    height: 100%;
    z-index: 5;
    cursor: grab;
    background: #87CEEB;
  }
  #controls {
    position: absolute;
    left: 66.67%;
    top: 0;
    width: 33.33%;
    height: 100vh;
    background: rgba(16, 24, 40, 0.95);
    box-sizing: border-box;
    padding: 26px 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
    z-index: 6;
    overflow-y: auto;
  }
  #scenePanel {
    position: absolute;
    left: 0;
    top: 0;
    width: 140px;
    height: 100vh;
    background: rgba(16, 24, 40, 0.88);
    z-index: 10;
    display: none;
    flex-direction: column;
    padding: 10px 8px;
    gap: 8px;
    overflow-y: auto;
    font-family: sans-serif;
  }
  #scenePanel h3 { color: #fff; font-size: 14px; margin: 0 0 4px; text-align: center; }
  .scene-card {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
    text-align: center;
  }
  .scene-card.active { border-color: #FFD740; background: rgba(255,215,64,0.18); }
  .scene-card .scene-name { color: #fff; font-size: 12px; margin-bottom: 4px; }
  .scene-swatches { display: flex; gap: 3px; justify-content: center; }
  .scene-swatch { width: 18px; height: 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.3); }
  #controls h2 {
    color: #fff;
    font-size: 20px;
    margin: 0 0 6px;
    text-align: center;
    font-family: sans-serif;
  }
  #controls button {
    width: 100%;
    padding: 11px 0;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: #2E7BD6;
    font-family: sans-serif;
  }
  #controls button:hover { background: #3d8ae8; }
  #controls button.danger { background: #C62828; }
  #controls button.danger:hover { background: #D63838; }
  #controls button.clear { background: #2E7D32; }
  #controls button.clear:hover { background: #388E3C; }
  #controls .grp {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #controls label {
    color: #dfeaff;
    font-size: 14px;
    font-family: sans-serif;
  }
  #controls input[type="range"] { width: 100%; }
  #controls input[type="text"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #3d5a80;
    border-radius: 8px;
    background: #0d1626;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    font-family: sans-serif;
  }
  #toolBox { flex: 1; }
  .tool {
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    font-size: 15px;
    border: 2px solid transparent;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.06);
  }
  .tool:hover { background: rgba(255, 255, 255, 0.12); }
  .tool.active { border-color: #fff; background: rgba(255, 255, 255, 0.15); }
  .tool .swatch {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: inline-block;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  .tool .gateDir { font-size: 9px; color: #AFC4E8; margin-left: 2px; vertical-align: middle; }
  .tool .groupLabel { font-size: 9px; color: #AFC4E8; margin-left: 2px; vertical-align: middle; }
  #glassMenu, #arrowMenu, #arrowPassiveMenu {
    position: fixed;
    z-index: 30;
    display: none;
    background: #0d1626;
    border: 1px solid #3d5a80;
    border-radius: 8px;
    padding: 8px;
    min-width: 170px;
    font-family: sans-serif;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    cursor: default;
  }
  #glassMenu .gmTitle, #arrowMenu .gmTitle, #arrowPassiveMenu .gmTitle { font-size: 11px; color: #8AB8FF; margin: 2px 6px 6px; }
  .groupMenuList { max-height: 40vh; overflow-y: auto; }
  #glassMenu .gmItem, #arrowMenu .gmItem, #arrowPassiveMenu .gmItem {
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    font-size: 13px;
  }
  #glassMenu .gmItem:hover, #arrowMenu .gmItem:hover, #arrowPassiveMenu .gmItem:hover { background: rgba(255, 255, 255, 0.15); }
  #glassMenu .gmItem.sel, #arrowMenu .gmItem.sel, #arrowPassiveMenu .gmItem.sel { background: #3d8ae8; }
  #glassMenu button, #arrowMenu button, #arrowPassiveMenu button {
    width: 100%;
    margin-top: 6px;
    padding: 6px;
    border: 1px solid #3d5a80;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  #glassMenu button:hover, #arrowMenu button:hover, #arrowPassiveMenu button:hover { background: #3d8ae8; }
  .tool[data-tool="tile"] .swatch { background: #FF8C1A; }
  .tool[data-tool="empty"] .swatch { background: #7EC3F2; }
  .tool[data-tool="spring"] .swatch { background: #4CAF50; }
  .tool[data-tool="spring2"] .swatch { background: #8BC34A; }
  .tool[data-tool="glass"] .swatch { background: #CCCCFF; }
  .tool[data-tool="glass2"] .swatch { background: #3CFFFF; }
  .tool[data-tool="arrow"] .swatch { background: #E8B43A; }

  .tool[data-tool="arrowpassive"] .swatch { background: #7E57C2; }
  .tool[data-tool="slide"] .swatch { background: #FF8C1A; }
  .tool[data-tool="rslide"] .swatch { background: #FF8C1A; border: 2px dashed #000; }
  .tool[data-tool="diamond"] .swatch { background: #00E5FF; }
  .tool[data-tool="block"] .swatch { background: #2B2B33; }
  .tool[data-tool="square"] .swatch { background: #FF8C1A; }
  .tool[data-tool="spike"] .swatch { background: #C0C0CE; }
  .tool[data-tool="pillar"] .swatch { background: #5A3030; }
  .tool[data-tool="roller"] .swatch { background: #A0522D; }
  .tool[data-tool="jack"] .swatch { background: #E07B2F; }

  .tool[data-tool="tree"] .swatch { background: #2E7D32; }

  .tool[data-tool="bigtree"] .swatch { background: #1B5E20; }
  .tool[data-tool="palm"] .swatch { background: #795548; }
  .tool[data-tool="gate"] .swatch { background: #465A7A; }
  .tool[data-tool="move"] .swatch { background: #7E57C2; }

  .tool[data-tool="finish"] .swatch { background: #00C853; }

  .tool[data-tool="laser"] .swatch { background: #D32F2F; }

  .tool[data-tool="pendulum"] .swatch { background: #795548; }

  .tool[data-tool="rod"] .swatch { background: #8D6E63; }

  .tool[data-tool="hammer"] .swatch { background: #5D4037; }

  .tool[data-tool="spot"] .swatch { background: #FFEB78; }

  .tool[data-tool="soar"] .swatch { background: #00BCD4; }
  .tool[data-tool="barrel"] .swatch { background: #9C27B0; }
  .tool[data-tool="building"] .swatch { background: #455A64; }
  .mvRow { display: flex; gap: 10px; margin-top: 4px; align-items: center; font-size: 13px; }
  .mvRow select {
    background: #0d1626;
    color: #fff;
    border: 1px solid #3d5a80;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 13px;
  }
  #levelTitle {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    display: none;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    font-family: sans-serif;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  #death {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    background: rgba(0, 0, 0, 0.55);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: sans-serif;
  }
  #death .title { font-size: 60px; color: #FF6B6B; margin-bottom: 14px; }
  #death .sub { font-size: 20px; margin-bottom: 34px; opacity: 0.9; }
  #death button {
    padding: 12px 34px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: #2E7BD6;
  }
  #death button:hover { background: #3d8ae8; }
  #death button + button { margin-top: 12px; }
  #levelSelect {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    background: #0a1a3a;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: sans-serif;
  }
  #levelSelect .title { font-size: 52px; color: #FFD700; margin-bottom: 40px; }
  #levelSelect button {
    padding: 14px 40px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    background: #2E7BD6;
  }
  #levelSelect button:hover { background: #3d8ae8; }
  #levelSelect button + button { margin-top: 14px; }
  #levelCards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px; }
  #levelCards .lvBtn {
    padding: 18px 50px;
    font-size: 22px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: #1a6b3a;
    font-family: sans-serif;
    transition: background 0.2s;
  }
  #levelCards .lvBtn:hover { background: #228b22; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <canvas id="m"></canvas>
</div>
<canvas id="editor"></canvas>
<div id="scenePanel">
  <h3>场景</h3>
</div>
<div id="controls">
  <h2>关卡编辑器</h2>
  <button id="btnUndo">撤销</button>
  <button id="btnReset" class="danger">重做</button>
  <button id="btnClear" class="clear">清空</button>
  <button id="btnStart">开始</button>
  <button id="btnSave">保存</button>
  <button id="btnLoad">加载</button>
  <button id="btnLevelSelect">选关</button>
  <button id="btnMusic">上传音乐</button>
  <input id="musicInput" type="file" accept="audio/*" style="display:none">
  <button id="btnJumpStart">跳至起点</button>
  <button id="btnJumpEnd">跳至终点</button>
  <div class="grp">
    <label>球速:</label>
    <input id="speed" type="number" step="0.1" value="5" style="width:50px">
  </div>
  <div class="grp">
    <label><input type="checkbox" id="cbCheckpoint"> 卡点辅助(空格标记)</label>
  </div>
  <div class="grp">
    <label>关卡名</label>
    <input id="levelName" type="text" placeholder="输入关卡名">
    <button id="btnConfirm">确定</button>
  </div>
  <div class="grp" id="toolBox">
    <label>选择地板</label>
    <div class="tool active" data-tool="tile"><span class="swatch"></span>地板</div>
    <div class="tool" data-tool="empty"><span class="swatch"></span>空地板</div>
    <div class="tool" data-tool="spring"><span class="swatch"></span>跳板</div>
    <div class="tool" data-tool="spring2"><span class="swatch"></span>小跳板</div>
    <div class="tool" data-tool="glass"><span class="swatch"></span>玻璃板</div>
    <div class="tool" data-tool="glass2"><span class="swatch"></span>大玻璃板<span class="groupLabel"></span></div>
    <div class="tool" data-tool="arrow"><span class="swatch"></span>机关地板<span class="groupLabel"></span></div>

    <div class="tool" data-tool="arrowpassive"><span class="swatch"></span>被动机关板<span class="groupLabel"></span></div>
    <div class="tool" data-tool="diamond"><span class="swatch"></span>钻石</div>
    <div class="tool" data-tool="block"><span class="swatch"></span>障碍物</div>
    <div class="tool" data-tool="square"><span class="swatch"></span>方块</div>
    <div class="tool" data-tool="spike"><span class="swatch"></span>浮空尖刺</div>
    <div class="tool" data-tool="pillar"><span class="swatch"></span>柱子</div>
    <div class="tool" data-tool="roller"><span class="swatch"></span>滚轮</div>
    <div class="tool" data-tool="jack"><span class="swatch"></span>千斤顶<span class="gateDir"></span></div>

    <div class="tool" data-tool="tree"><span class="swatch"></span>矮树</div>

    <div class="tool" data-tool="bigtree"><span class="swatch"></span>高树</div>
    <div class="tool" data-tool="palm"><span class="swatch"></span>棕榈树</div>
    <div class="tool" data-tool="gate"><span class="swatch"></span>门<span class="gateDir"></span></div>
    <div class="tool" data-tool="move"><span class="swatch"></span>移动地板</div>

    <div class="tool" data-tool="finish"><span class="swatch"></span>终点</div>

    <div class="tool" data-tool="laser"><span class="swatch"></span>激光炮</div>

    <div class="tool" data-tool="pendulum"><span class="swatch"></span>横摆锤<span class="gateDir"></span></div>

    <div class="tool" data-tool="rod"><span class="swatch"></span>摆棍<span class="gateDir"></span></div>
    <div class="tool" data-tool="hammer"><span class="swatch"></span>摆锤<span class="gateDir"></span></div>

    <div class="tool" data-tool="spot"><span class="swatch"></span>聚光灯</div>

    <div class="tool" data-tool="soar"><span class="swatch"></span>翱翔之跃</div>
    <div class="tool" data-tool="barrel"><span class="swatch"></span>横冲直撞</div>
    <div class="tool" data-tool="building"><span class="swatch"></span>楼房</div>

    <div class="tool" data-tool="slide"><span class="swatch"></span>滑动地板</div>
    <div class="tool" data-tool="rslide"><span class="swatch"></span>反向滑动地板</div>
  </div>
  <div class="grp" id="moveOpts">
    <label>滑动范围设置(移动地板/滚轮放置自动生效 · 右键任意格子可调整)</label>
    <div class="mvRow">
      <label>从 <select id="mvLo"></select> 列</label>
      <label>到 <select id="mvHi"></select> 列</label>
    </div>
  </div>
</div>
<div id="glassMenu">
  <div class="gmTitle">大玻璃板组 · 选中后绘制到该组</div>
  <div class="groupMenuList" id="glassMenuList"></div>
  <button id="glassMenuNew">新建组</button>
</div>
<div id="arrowMenu">
  <div class="gmTitle">机关地板组 · 选中后绘制到该组 · 踩上整组按箭头方向移动一格</div>
  <div class="groupMenuList" id="arrowMenuList"></div>
  <button id="arrowMenuNew">新建组</button>
</div>
<div id="arrowPassiveMenu">
  <div class="gmTitle">被动机关板组 · 选中后绘制到该组 · 接触已激活地板时整组滑动(只触发一次)</div>
  <div class="groupMenuList" id="arrowPassiveMenuList"></div>
  <button id="arrowPassiveMenuNew">新建组</button>
</div>
<div id="levelTitle"></div>
<div id="death">
  <div class="title">游戏结束</div>
  <div id="diamondInfo" class="sub"></div>
  <button id="btnRetry">重新挑战</button>
  <button id="btnBack">返回编辑器</button>
</div>
<div id="levelSelect">
  <div class="title">滚动的天空</div>
  <div id="levelCards">
    <button class="lvBtn" data-idx="0">Lv.1 山丘</button>
    <button class="lvBtn" data-idx="1">Lv.2 天空</button>
    <button class="lvBtn" data-idx="2">Lv.3 森林</button>
    <button class="lvBtn" data-idx="3">Lv.4 沙漠</button>
    <button class="lvBtn" data-idx="4">Lv.5 火山</button>
  </div>
  <button id="btnCustom">自制关卡</button>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const panel = document.getElementById('panel');
const mcv = document.getElementById('m');
const mctx = mcv.getContext('2d');
const ecv = document.getElementById('editor');
const ectx = ecv.getContext('2d');
const controls = document.getElementById('controls');
const levelTitle = document.getElementById('levelTitle');

const CAM_H = 8;        // 相机高度(越高视野越高)
const TILE = 2;         // 瓷砖边长(正方形)
const COLS = 5;         // 五列
const FOG_NEAR = 12;    // 雾起始距离
const FOG_FAR = 60;     // 雾完全距离
const STEP = 2;         // 渲染条带高度(像素)
const BALL_LOGIC_Z = 7;   // 球判定深度(行号/死亡检测)
const BALL_VIS_Z = 7.8;   // 球贴图深度(绘制位置)

const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const A = hex('#FF8C1A');
const SPR = hex('#4CAF50');
const SPR2 = hex('#8BC34A');       // 小跳板填充色(跳一格,在第二格落地)
const BLK = hex('#2B2B33');
const BLK_TOP = hex('#8C8C9C');
const SPIKE = hex('#8C8C9C');
const PILLAR = hex('#5A3030');
const PILLAR_TOP = hex('#7A4040');   // 柱子顶部高光色(绘制方块/柱子顶盖时使用)
const ROLLER = hex('#A0522D');
const ROLLER_RIM = hex('#6E3413');
const ROLLER_HUB = hex('#F2CDA0');
const JACK = hex('#E07B2F');
const JACK_TOP = hex('#FFC98A');
const TREE = hex('#2E7D32');
const TREE_TOP = hex('#66BB6A');
const TREE_TRUNK = hex('#6D4C41');
const BTREE = hex('#1B5E20');
const BTREE_TOP = hex('#81C784');
const BTREE_TRUNK = hex('#4E342E');
const PALM_TRUNK = hex('#795548');
const PALM_FROND = hex('#2E7D32');
const PALM_FROND_TOP = hex('#66BB6A');
const LASER = hex('#8B2020');
const LASER_TOP = hex('#E05050');
const PEND = hex('#795548');
const PEND_TOP = hex('#A1887F');
const PEND_TRUNK = hex('#5D4037');
const SPOT = hex('#9E9E9E');        // 聚光灯灯体
const SPOT_TOP = hex('#E0E0E0');
const SPOT_BEAM = hex('#FFEB78');    // 聚光灯光束颜色
const SPOT_SWING = 1.5;             // 聚光灯光束左右摇晃角速度(弧度/秒)
const SOAR = hex('#00BCD4');          // 翱翔之跃方块(青色)
const SOAR_TOP = hex('#84FFFF');
const BARREL = hex('#9C27B0');        // 横冲直撞方块(紫色)
const BARREL_TOP = hex('#CE93D8');
const BUILDING = hex('#455A64');      // 楼房(灰蓝色,三段叠放)
const BUILDING_TOP = hex('#78909C');
const GATE = hex('#465A7A');
const GATE_TOP = hex('#8FA8CC');
const MV = hex('#7E57C2');
const MV_LINE = hex('#4A2E8A');
const DIA = hex('#00E5FF');
const DIA_GLOW = hex('#B3F5FF');
const GLA = hex('#CCCCFF');
const GLA_LINE = hex('#FFFFFF');
const GLA2 = hex('#3CFFFF');        // 大玻璃板填充色
const GLA2_LINE = hex('#FFFFFF');
const SLIDE_COL = A;                // 滑动地板颜色:与普通地板相同(橙色),激活后即视为普通地面
const SLIDE_LINE = hex('#D96B00');  // 普通地板边框色(LINE 在下方定义,此处用字面量避免初始化顺序问题)
const ARROW = hex('#E8B43A');
const ARROW_LINE = hex('#8A6A1A');
const ARROW_P = hex('#7E57C2');      // 被动机关板(靠接触激活的机关地板触发)
const ARROW_P_LINE = hex('#4A148C');
const LINE = hex('#D96B00');
const FOG = hex('#BFE6FF');

const SCENES = [
  { id: 0, name: '默认', floor: hex('#FF8C1A'), bgTop: '#2E7BD6', bgMid: '#7EC3F2', bgBot: '#C9EBFF', obstacle: hex('#2B2B33'), spring: hex('#FF5722'), secondary: hex('#2196F3') },
  { id: 1, name: '天空主场景', floor: hex('#E0E0E0'), bgTop: '#512DA8', bgMid: '#7E57C2', bgBot: '#B39DDB', obstacle: hex('#2B2B33'), spring: hex('#7E57C2'), secondary: hex('#2196F3') },
  { id: 2, name: '森林主场景', floor: hex('#66BB6A'), bgTop: '#1565C0', bgMid: '#64B5F6', bgBot: '#BBDEFB', obstacle: hex('#795548'), spring: hex('#C76300'), secondary: hex('#FDD835') },

function getState(key) {
  const v = covered.get(key);
  if (v === 'slide' && mode === 'play' && !slideActive.has(key)) return 'empty';   // 未激活的滑动地板视为虚空(不可见、不承重);激活后即承重
  if (v === 'rslide' && mode === 'play') return 'empty';   // 反向滑动地板始终无判定(球可穿过)
  return v ?? (defaultEmpty ? 'empty' : 'tile');
}

function removeGate(ck) {   // 删除门:仅清除映射到该中心格的格
  const [cj, cr] = ck.split(',').map(Number);
  for (let dj = -1; dj <= 1; dj++) {
    const nj = cj + dj;
    if (nj < 0 || nj >= COLS) continue;
    const nk = nj + ',' + cr;
    if (gateCellOf.get(nk) === ck) gateCellOf.delete(nk);
  }
}

function restoreGate(ck) {   // 恢复门:重建三格映射
  const [cj, cr] = ck.split(',').map(Number);
  for (let dj = -1; dj <= 1; dj++) {
    const nj = cj + dj;
    if (nj < 0 || nj >= COLS) continue;
    gateCellOf.set(nj + ',' + cr, ck);
  }
}

function springPop(key) {   // 跳板弹起进度 0~1(正弦,弹起后落回)
  const at = springAct.get(key);
  if (at === undefined) return 0;
  const p = Math.min(1, (animT - at) / SPRING_DUR);
  return p >= 1 ? 0 : Math.sin(p * Math.PI);
}

function riseOf(key) {   // 障碍物升起进度 0~1(升起后保持)
  const at = obstacleRise.get(key);
  if (at === undefined) return 0;
  return Math.min(1, (animT - at) / RISE_DUR);
}

function glassDropOf(key) {   // 玻璃掉落进度 0~1(时长 = 1/球速 秒)
  const ft = glassFall.get(key);
  if (ft === undefined) return 0;
  return Math.min(1, (animT - ft) / (1 / speed));
}

function arrowOff(key, zRef) {   // 机关地板滑动像素偏移(列向+滚动方向;scroll 不动,板相对世界滑行)
  const am = arrowAnim.get(key);
  if (am === undefined) return { ox: 0, oy: 0 };
  const p = Math.min(1, (animT - am.t0) / (am.dur ?? ARROW_MOVE_DUR));
  if (p >= 1) { arrowAnim.delete(key); return { ox: 0, oy: 0 }; }
  return {
    ox: -am.dj * TILE * (f / zRef) * (1 - p),
    oy: (k / Math.max(1, zRef - am.dr * TILE) - k / zRef) * (1 - p)
  };
}

function arrowGlyph(cx, cy, s, dir, col) {   // 机关地板方向箭头(实心三角,醒目)
  const L = s, W = s;
  ctx.fillStyle = col;
  ctx.beginPath();
  if (dir === 'up') { ctx.moveTo(cx, cy - L); ctx.lineTo(cx - W, cy + L); ctx.lineTo(cx + W, cy + L); }
  else if (dir === 'down') { ctx.moveTo(cx, cy + L); ctx.lineTo(cx - W, cy - L); ctx.lineTo(cx + W, cy - L); }
  else if (dir === 'left') { ctx.moveTo(cx - L, cy); ctx.lineTo(cx + L, cy - W); ctx.lineTo(cx + L, cy + W); }
  else { ctx.moveTo(cx + L, cy); ctx.lineTo(cx - L, cy - W); ctx.lineTo(cx - L, cy + W); }
  ctx.closePath();
  ctx.fill();
}

function maybeTriggerRise(key, zmc) {   // 障碍进入可看清距离时触发升起动画
  if (zmc - BALL_LOGIC_Z < RISE_TRIGGER && !obstacleRise.has(key)) obstacleRise.set(key, animT);
}

function gateForm(gk) {   // 门的判定形态:0=形态一,1=形态二(切换后保持)
  const dir = gateDirOf.get(gk) ?? 1;
  return dir === 1 ? (gateSwitched.has(gk) ? 1 : 0) : (gateSwitched.has(gk) ? 0 : 1);
}

function jackForm(key) {   // 千斤顶判定形态:0=形态一(浮空一格),1=形态二(地面)(切换后保持)
  const dir = jackDirOf.get(key) ?? 1;
  return dir === 1 ? (jackSwitched.has(key) ? 1 : 0) : (jackSwitched.has(key) ? 0 : 1);
}

function jackVisualForm(key) {   // 千斤顶视觉形态 0~1:浮空位置向地面位置平滑过渡(下降/上升)
  const dir = jackDirOf.get(key) ?? 1;
  const target = dir === 1 ? 1 : 0;
  const init = 1 - target;
  const t = jackSwitchT.get(key);
  if (t === undefined) return init;
  return init + (target - init) * Math.min(1, (animT - t) / JACK_SWITCH_DUR);
}

function gateVisualForm(gk) {   // 门的视觉形态 0~1:初始形态向目标形态平滑过渡(梁上下滑动)
  const dir = gateDirOf.get(gk) ?? 1;
  const target = dir === 1 ? 1 : 0;
  const init = 1 - target;
  const t = gateSwitchT.get(gk);
  if (t === undefined) return init;
  return init + (target - init) * Math.min(1, (animT - t) / GATE_SWITCH_DUR);
}

function editCellAt(x, y, shift) {
  const colW = edw * 0.4 / COLS;
  const rowH = colW;
  const left = (edw - COLS * colW) / 2;
  const j = Math.floor((x - left) / colW);
  const r = Math.ceil(viewRow - y / rowH);
  if (j < 0 || j >= COLS) return;

      diamondOn.delete(key);

      gid = glassGroupSel;
    } else {
      gid = null;
      for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r + 1], [j, r - 1]]) {
        const nk = nj + ',' + nr;
        if (getState(nk) === 'glass2' && glassGroup.has(nk)) {
          const g = glassGroup.get(nk);
          if (gid === null || g < gid) gid = g;
        }
      }
      if (gid === null) {
        gid = ++glassGroupSeq;
      } else {
        op.merged = [];
        for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r + 1], [j, r - 1]]) {

          if (getState(nk) === 'glass2' && glassGroup.has(nk)) {

            if (g !== gid) {

      }

    history.push(op);

  }
  if (tool === 'arrow' || tool === 'arrowpassive') {   // 机关地板/被动机关板:左键画跟随格(同组);方向箭头格用右键绘制;被动机关板使用独立分组

        if (sameType(nk) && gmap.has(nk)) {

        gid = isP ? ++arrowPassiveGroupSeq : ++arrowGroupSeq;
      } else {
        op.merged = [];
        for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r + 1], [j, r - 1]]) {

          if (sameType(nk) && gmap.has(nk)) {

            if (g !== gid) {

    covered.set(key, tool);

      const nk = nj + ',' + r;
      if (gateCellOf.has(nk) || obstacleOn.has(nk)) return;

    if (getState(key) === 'empty') {
      history.push({ key, prev: 'empty' });
      covered.set(key, 'tile');
    }
    const cur2 = getState(key);
    if (!(cur2 === 'tile' || cur2 === 'move' || cur2 === 'spring' || cur2 === 'spring2' || cur2 === 'glass' || cur2 === 'glass2' || cur2 === 'arrow' || cur2 === 'arrowpassive' || cur2 === 'slide')) return;
    if (obstacleOn.get(key) === 'square') {   // 该格已是方块
      if (shift) {   // Shift+左键:叠加一层
        const prev = blockStack.get(key) || 1;
        history.push({ key, blockInc: true, bstk: prev });
        blockStack.set(key, prev >= 9 ? 10 : prev + 1);   // 9再叠→形态2(浮空方块,无判定)
        if (history.length > 500) history.shift();
        return;
      }
      // 左键再点:移除整摞方块
      history.push({ key, prev: cur2, delObs: true, obs: 'square', bstk: blockStack.get(key) || 1 });
      obstacleOn.delete(key);
      blockStack.delete(key);
      if (history.length > 500) history.shift();
      return;
    }
    // 放置第一层方块
    const prevObs = obstacleOn.get(key);
    history.push({ key, prev: cur2, addObs: true, obs: 'block', bstk: 0, prevObs: prevObs !== undefined ? prevObs : undefined });
    obstacleOn.set(key, 'square');
    blockStack.set(key, 1);

    return;
  }
  if (tool === 'block' || tool === 'square' || tool === 'spike' || tool === 'pillar' || tool === 'roller' || tool === 'jack' || tool === 'tree' || tool === 'bigtree' || tool === 'palm' || tool === 'laser' || tool === 'pendulum' || tool === 'rod' || tool === 'hammer' || tool === 'spot' || tool === 'soar' || tool === 'barrel' || tool === 'building') {   // 障碍为叠加物(与钻石同机制):保留格上地板,可放置在任意地板上

    if (obstacleOn.get(key) === 'block' || obstacleOn.get(key) === 'square') blockStack.delete(key);   // 用其它障碍覆盖方块/障碍物时清掉其堆叠高度
    if (getState(key) === 'empty') {
      history.push({ key, prev: 'empty' });
      covered.set(key, 'tile');
    }
    const cur2 = getState(key);
    if (!(cur2 === 'tile' || cur2 === 'move' || cur2 === 'spring' || cur2 === 'spring2' || cur2 === 'glass' || cur2 === 'glass2' || cur2 === 'arrow' || cur2 === 'arrowpassive' || cur2 === 'slide')) return;

      pendPhaseOf.delete(key);

        rollerLo.delete(key);
        rollerHi.delete(key);
        rollerT0.delete(key);
        rollerPos.delete(key);
      }
    } else {   // 添加或替换已有障碍
      history.push({ key, prev: cur2, addObs: true, obs: tool, mv, lo: moveLo.get(key), hi: moveHi.get(key), rmv, rlo: rollerLo.get(key), rhi: rollerHi.get(key), delObs: prevObs !== undefined, prevObs, jdir: tool === 'jack' ? jackDirDefault : undefined, pendPh: (tool === 'pendulum' || tool === 'rod' || tool === 'hammer') ? (tool === 'pendulum' ? (pendFormDefault === 0 ? 1 : -1) : tool === 'hammer' ? (hammerFormDefault === 0 ? -1 : 1) : (rodFormDefault === 0 ? -1 : 1)) : undefined });
      obstacleOn.set(key, tool);
      jackDirOf.set(key, jackDirDefault);
      if (tool === 'pendulum' || tool === 'rod' || tool === 'hammer') pendPhaseOf.set(key, tool === 'pendulum' ? (pendFormDefault === 0 ? 1 : -1) : tool === 'hammer' ? (hammerFormDefault === 0 ? -1 : 1) : (rodFormDefault === 0 ? -1 : 1));
      if (tool === 'roller' && !rmv) {   // 滚轮:自动附带快速滑动范围
        rollerLo.set(key, curLo);
        rollerHi.set(key, curHi);
        rollerT0.delete(key);
        rollerPos.delete(key);
      }
    }
    if (history.length > 500) history.shift();
    return;
  }
  const op = { key, prev: cur };
  if (cur === 'move') {   // 覆盖已有移动地板时带走其参数,便于撤销还原
    op.lo = moveLo.get(key);
    op.hi = moveHi.get(key);
    moveLo.delete(key);
    moveHi.delete(key);
    swayT0.delete(key);
  }
  if (cur === 'slide') {   // 覆盖已有滑动地板时带走其模式,便于撤销还原
    op.slideMode = slideMode.get(key);
    slideMode.delete(key);
  }
  if (cur === 'rslide') {   // 覆盖已有反向滑动地板时带走其模式,便于撤销还原
    op.slideMode = slideMode.get(key);
    slideMode.delete(key);
  }
  if (cur === 'glass2') op.prevGid = glassGroup.get(key);   // 覆盖大玻璃时带走组 id 供撤销
  if (cur === 'arrow' || cur === 'arrowpassive') { op.agid = agGet(key); op.adir = arrowDirOf.get(key); }   // 覆盖机关地板/被动机关板时带走组/方向供撤销
  if (obstacleOn.has(key)) op.obs = obstacleOn.get(key);    // 覆盖带障碍的玻璃时带走障碍供撤销
  history.push(op);
  if (history.length > 500) history.shift();
  covered.set(key, tool);
  glassGroup.delete(key);
  agMapOf(arrowPassive.has(key)).delete(key);
  arrowDirOf.delete(key);
  obstacleOn.delete(key);
  if (tool === 'move') {
    moveLo.set(key, curLo);
    moveHi.set(key, curHi);
    swayT0.delete(key);
  }
  if (tool === 'slide') {
    slideMode.set(key, 'L');   // 默认从左侧滑入;右键切换为右侧
  }
  if (tool === 'rslide') {
    slideMode.set(key, 'L');   // 默认从左侧滑出;右键切换为右侧
  }
}

function setupGroupMenu(btnSel, menuId, labelSel, getSeq, setSeq, getSel, setSel, name) {
  const btn = document.querySelector(btnSel);
  const label = btn.querySelector(labelSel);
  const menu = document.getElementById(menuId);
  const list = menu.querySelector('.groupMenuList');
  const refresh = () => {
    label.textContent = getSel() === null ? '自动' : '组' + getSel();
    btn.title = getSel() === null ? name + ':自动合并相邻(右键选组绘制)' : name + ':绘制到 组' + getSel() + '(右键选组)';
  };
  const show = () => {
    list.innerHTML = '';
    const mk = (text, val) => {
      const d = document.createElement('div');
      d.className = 'gmItem' + (getSel() === val ? ' sel' : '');
      d.textContent = text;
      d.addEventListener('click', () => {
        setSel(val);
        refresh();
        menu.style.display = 'none';
      });
      list.appendChild(d);
    };
    mk('自动合并(默认)', null);
    for (let g = 1; g <= getSeq(); g++) mk('组' + g, g);   // 所有已存在的组(含暂无格子的,便于继续绘制)
    const r = btn.getBoundingClientRect();
    menu.style.left = Math.min(r.left, innerWidth - 190) + 'px';
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.display = 'block';
  };
  btn.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (menu.style.display === 'block') { menu.style.display = 'none'; return; }
    show();
  });
  menu.querySelector('button').addEventListener('click', () => {
    const g = getSeq() + 1;
    setSeq(g);
    setSel(g);
    refresh();
    show();
  });
  menu.addEventListener('click', e => e.stopPropagation());
  addEventListener('mousedown', e => {
    if (menu.style.display === 'block' && !menu.contains(e.target) && e.target !== btn) menu.style.display = 'none';
  });
  refresh();
}

// 右键:切换该格的移动机制(保留原地板类型与判定);滚轮格则切换其滑动范围;滑动地板则切换左/右滑入模式
function toggleMove(key) {
  const st = getState(key);
  if (st === 'empty' || st === 'diamond') return;
  if (st === 'slide') {   // 切换滑动地板左/右模式(L <-> R)
    const nm = slideMode.get(key) === 'R' ? 'L' : 'R';
    history.push({ key, prev: st, slideModeToggle: true, oldMode: slideMode.get(key) });
    slideMode.set(key, nm);
    if (history.length > 500) history.shift();
    return;
  }
  if (st === 'rslide') {   // 切换反向滑动地板左/右模式(L <-> R)
    const nm = slideMode.get(key) === 'R' ? 'L' : 'R';
    history.push({ key, prev: st, slideModeToggle: true, oldMode: slideMode.get(key) });
    slideMode.set(key, nm);
    if (history.length > 500) history.shift();
    return;
  }
  if (obstacleOn.get(key) === 'roller') {
    if (rollerLo.has(key)) {
      history.push({ key, prev: st, remRollerMv: true, lo: rollerLo.get(key), hi: rollerHi.get(key) });
      rollerLo.delete(key);
      rollerHi.delete(key);
    } else {
      history.push({ key, prev: st, addRollerMv: true });
      rollerLo.set(key, curLo);
      rollerHi.set(key, curHi);
    }
    rollerT0.delete(key);
    rollerPos.delete(key);
    if (history.length > 500) history.shift();
    return;
  }
  if (moveLo.has(key)) {
    history.push({ key, prev: st, remMove: true, lo: moveLo.get(key), hi: moveHi.get(key) });
    moveLo.delete(key);
    moveHi.delete(key);
    swayT0.delete(key);
    swayPos.delete(key);
  } else {
    history.push({ key, prev: st, addMove: true });
    moveLo.set(key, curLo);
    moveHi.set(key, curHi);
    swayT0.delete(key);
    swayPos.delete(key);
  }
  if (history.length > 500) history.shift();
}

// 右键:在任意格上绘制机关地板箭头格(带方向,默认'上';已是箭头格则先旋转)
function paintArrowCell(j, r, key, type, passive) {
  const cur = getState(key);
  const gmap = agMapOf(passive);
  const gSel = passive ? arrowPassiveGroupSel : arrowGroupSel;
  const sameType = nk => getState(nk) === (passive ? 'arrowpassive' : 'arrow');
  const op = { key, prev: cur, prevAgid: (cur === 'arrow' || cur === 'arrowpassive') ? agGet(key) : undefined, adir: arrowDirOf.get(key), arrowAdd: true, prevAp: arrowPassive.has(key), nowAp: passive };
  let gid;
  if (gSel !== null) {
    gid = gSel;
  } else {
    gid = null;
    for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r + 1], [j, r - 1]]) {
      const nk = nj + ',' + nr;
      if (sameType(nk) && gmap.has(nk)) {
        const g = gmap.get(nk);
        if (gid === null || g < gid) gid = g;
      }
    }
    if (gid === null) {
      gid = passive ? ++arrowPassiveGroupSeq : ++arrowGroupSeq;
    } else {
      op.merged = [];
      for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r + 1], [j, r - 1]]) {
        const nk = nj + ',' + nr;
        if (sameType(nk) && gmap.has(nk)) {
          const g = gmap.get(nk);
          if (g !== gid) {
            for (const [k2, g2] of gmap) if (g2 === g) { gmap.set(k2, gid); op.merged.push([k2, g]); }
          }
        }
      }
    }
  }
  op.gid = gid;
  if (cur === 'move') {   // 覆盖移动地板时带走参数,便于撤销
    op.lo = moveLo.get(key);
    op.hi = moveHi.get(key);
    moveLo.delete(key);
    moveHi.delete(key);
    swayT0.delete(key);
  }
  if (obstacleOn.has(key)) op.obs = obstacleOn.get(key);
  history.push(op);
  if (history.length > 500) history.shift();
  agMapOf(!passive).delete(key);   // 同一格在主动/被动之间切换时,从另一类组 map 清除残留
  covered.set(key, type);
  gmap.set(key, gid);
  arrowDirOf.set(key, op.adir ?? 'up');   // 原方向保留(旋转已单独处理),否则默认'上'
  if (passive) arrowPassive.add(key); else arrowPassive.delete(key);
  obstacleOn.delete(key);
}

document.getElementById('btnUndo').onclick = () => {
  const op = history.pop();
  if (!op) return;
  if (op.snap) {   // 重做/清空的完整快照:整体恢复
    restoreSnapshot(op.snap);
    return;
  }
  if (op.finish) {   // 终点线:恢复原行
    finishRow = op.oldRow;
    return;
  }
  if (op.sceneTrigger) {   // 场景触发器:恢复原状态
    if (op.oldScene === -1) { sceneTriggerMap.delete(op.row); } else { sceneTriggerMap.set(op.row, op.oldScene); }
    return;
  }
  covered.set(op.key, op.prev === 'diamond' ? 'tile' : op.prev);
  if (op.prev === 'diamond') diamondOn.add(op.key);
  if (op.slideModeToggle) slideMode.set(op.key, op.oldMode);   // 右键切换滑动地板左/右模式:撤销还原
  if (op.slideMode !== undefined) slideMode.set(op.key, op.slideMode);   // 覆盖滑动地板:撤销时恢复其原模式
  swayT0.delete(op.key);
  swayPos.delete(op.key);
  if (op.addDia) {
    diamondOn.delete(op.key);
  } else if (op.delDia) {
    diamondOn.add(op.key);
  } else if (op.addMove) {
    moveLo.delete(op.key);
    moveHi.delete(op.key);
  } else if (op.remMove) {
    moveLo.set(op.key, op.lo);
    moveHi.set(op.key, op.hi);
  } else if (op.addRollerMv) {
    rollerLo.delete(op.key);
    rollerHi.delete(op.key);
  } else if (op.remRollerMv) {
    rollerLo.set(op.key, op.lo);
    rollerHi.set(op.key, op.hi);
  } else if (op.prev === 'move' || op.mv) {
    if (op.lo !== undefined) moveLo.set(op.key, op.lo);
    if (op.hi !== undefined) moveHi.set(op.key, op.hi);
  } else if (op.rmv) {
    if (op.rlo !== undefined) rollerLo.set(op.key, op.rlo);
    if (op.rhi !== undefined) rollerHi.set(op.key, op.rhi);
  } else {
    moveLo.delete(op.key);
    moveHi.delete(op.key);
    rollerLo.delete(op.key);
    rollerHi.delete(op.key);
    slideMode.delete(op.key);
  }
  if (op.delObs) {
    if (op.obs !== undefined) obstacleOn.set(op.key, op.obs);
    if (op.jdir !== undefined) jackDirOf.set(op.key, op.jdir);
    if (op.pendPh !== undefined) pendPhaseOf.set(op.key, op.pendPh);
    if (op.mv && op.lo !== undefined && op.hi !== undefined) {
      moveLo.set(op.key, op.lo);
      moveHi.set(op.key, op.hi);
    }
    if (op.rmv && op.rlo !== undefined && op.rhi !== undefined) {
      rollerLo.set(op.key, op.rlo);
      rollerHi.set(op.key, op.rhi);
    }
  } else if (op.blockInc) {
    // 仅恢复方块堆叠高度,不改变 obstacleOn
  } else if (op.addObs) {
    obstacleOn.delete(op.key);
    jackDirOf.delete(op.key);
    pendPhaseOf.delete(op.key);
  } else if (op.obs !== undefined) {   // 覆盖带障碍的地板时撤销:恢复障碍
    obstacleOn.set(op.key, op.obs);
  } else {
    obstacleOn.delete(op.key);
  }
  if (op.bstk !== undefined) {   // 方块堆叠高度随撤销/重做恢复
    if (op.bstk === 0) blockStack.delete(op.key); else blockStack.set(op.key, op.bstk);
  }
  if (op.arrowRotate) {   // 机关地板方向旋转撤销
    arrowDirOf.set(op.key, op.oldDir);
  } else if (op.arrowAdd || op.gid !== undefined || op.agid !== undefined) {   // 机关地板/被动机关板 放置或右键绘制撤销
    if (op.arrowAdd) {   // 右键绘制箭头/被动机关板的撤销:把格子恢复为绘制前状态(绘制前可能为主动/被动/无)
      const newP = op.nowAp;
      agMapOf(newP).delete(op.key);   // 移除本次绘制写入的组
      if (op.merged) for (const [k2, g] of op.merged) agMapOf(newP).set(k2, g);   // 合并过的同类型邻格还原回原 gid
      if (op.prev === 'arrow' || op.prev === 'arrowpassive') {
        const prevP = op.prev === 'arrowpassive';
        if (op.prevAgid !== undefined) agMapOf(prevP).set(op.key, op.prevAgid);   // 绘制前若已是箭头,恢复其原组(主动/被动可能在不同 map)
        if (prevP) arrowPassive.add(op.key); else arrowPassive.delete(op.key);
      } else {
        arrowPassive.delete(op.key);
      }
      if (op.adir !== undefined) arrowDirOf.set(op.key, op.adir); else arrowDirOf.delete(op.key);
    } else {   // 其它工具覆盖箭头格的撤销:恢复为原箭头格
      const isP = op.prev === 'arrowpassive';
      const m = agMapOf(isP);
      m.delete(op.key);
      if (op.agid !== undefined) m.set(op.key, op.agid);
      if (op.adir !== undefined) arrowDirOf.set(op.key, op.adir); else arrowDirOf.delete(op.key);
      if (isP) arrowPassive.add(op.key); else arrowPassive.delete(op.key);
    }
  } else {
    const m = agMapOf(arrowPassive.has(op.key));   // 仅落在空地上的箭头放置:取消时按类型从对应组移除
    m.delete(op.key);
    arrowDirOf.delete(op.key);
    if (op.prevAp) arrowPassive.add(op.key); else arrowPassive.delete(op.key);
  }
  if (op.gid !== undefined) {   // 大玻璃板放置撤销
    glassGroup.delete(op.key);
    if (op.prev === 'glass2' && op.prevGid !== undefined) glassGroup.set(op.key, op.prevGid);
    if (op.merged) for (const [k2, g] of op.merged) glassGroup.set(k2, g);
  } else if (op.prevGid !== undefined) {   // 覆盖大玻璃的撤销:恢复组
    glassGroup.set(op.key, op.prevGid);
  } else {
    glassGroup.delete(op.key);
  }
  if (op.gateAdd) {
    removeGate(op.gateKey);
    gateDirOf.delete(op.gateKey);
  } else if (op.gateDel) {
    restoreGate(op.gateKey);
    if (op.gdir !== undefined) gateDirOf.set(op.gateKey, op.gdir);
  }
  if (op.prevAp !== undefined) {   // 被动机关板标记随撤销/重做恢复
    if (op.prevAp) arrowPassive.add(op.key); else arrowPassive.delete(op.key);
  }
};

function restoreSnapshot(s) {   // 恢复完整快照

  slideMode.clear();
  rollerLo.clear(); rollerHi.clear(); rollerT0.clear(); rollerPos.clear();
  gateCellOf.clear(); gateDirOf.clear(); gateSwitched.clear(); gateSwitchT.clear();
  jackDirOf.clear(); jackSwitched.clear(); jackSwitchT.clear();
    springAct.clear();
  obstacleRise.clear(); blockStack.clear();
  barrelActive.clear(); barrelImmuneEnd = -1; diamondOn.clear(); collected.clear();
  glassFall.clear(); glassGroup.clear(); fallGroup.clear(); obstacleOn.clear();
  arrowGroup.clear(); arrowDirOf.clear(); arrowAnim.clear(); arrowSafe.clear(); arrowUsed.clear(); arrowPassiveUsed.clear(); arrowPassiveArmed.clear();
  arrowPassiveGroup.clear();
  arrowPassive.clear();
  arrowSnap = null; arrowBlock = null;

// 清除没有任何方块属于该组的组:压缩组 id 并丢弃空组(返回新组数,以及旧 id->新 id 的映射用于重映射选中组)
function pruneGroups(map) {
  const used = new Set();
  for (const g of map.values()) used.add(g);
  const order = [...used].sort((a, b) => a - b);
  const remap = new Map();
  order.forEach((g, i) => remap.set(g, i + 1));
  for (const [k, g] of map) map.set(k, remap.get(g));
  return { seq: order.length, remap };
}

const EDGE_MARGIN = 0.25;   // 格子边缘 25% 宽度不触发判定(死亡判定宽松)

// 球中心所在格 key;null 表示处于格子边缘(宽容区,不做判定)
function cellKeyOfBall() {
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  const r = Math.floor(pos);
  const off = pos - r;
  if (off < EDGE_MARGIN || off > 1 - EDGE_MARGIN) return null;
  const j = Math.floor((ballX + totalW / 2) / TILE);
  if (j < 0 || j >= COLS) return null;
  return j + ',' + r;
}
// 逻辑格(不计边缘宽容区):球连续前进时每一格都会被"进入",用于触发判定,避免边缘采样漏触发
function ballCellRaw() {
  const j = Math.floor((ballX + totalW / 2) / TILE);
  if (j < 0 || j >= COLS) return null;
  const r = Math.floor((BALL_LOGIC_Z + scroll) / TILE);
  return j + ',' + r;
}
// 逻辑格对应的状态(由 key 推导,不依赖边缘宽容区)
function resolveCellState(key) {
  const [j, r] = key.split(',').map(Number);
  const ast = arrowSafe.get(key);
  if (ast !== undefined) { if (animT - ast.t0 < ast.dur) return 'tile'; arrowSafe.delete(key); }
  if (glassDropOf(key) >= 1) return 'empty';
  const gk = gateCellOf.get(key);
  if (gk !== undefined) { const [cj] = gk.split(',').map(Number); if (gateForm(gk) === 0) return j === cj ? 'spike' : 'pillar'; return 'block'; }
  const jo = obstacleOn.get(key);
  if (jo === 'block') return 'block';
  if (jo === 'square') { const h = blockStack.get(key) || 1; return h === 10 ? null : h >= 3 ? 'pillar' : 'block'; }
  if (jo === 'jack') return jackForm(key) === 0 ? 'spike' : 'block';
  if (jo === 'tree') return 'block';
  if (jo === 'bigtree') return 'pillar';
  if (jo === 'palm') return 'pillar';
  if (jo === 'laser') return 'block';
  if (jo === 'pendulum') return 'block';
  if (jo === 'rod') return 'block';
  if (jo === 'hammer') return 'block';
  if (jo === 'spot') return 'block';
  if (jo === 'soar') return 'soar';
  if (jo === 'barrel') return 'barrel';
  if (jo !== undefined) return jo ?? getState(key);
  for (const [pk, po] of obstacleOn) {
    if (po !== 'pendulum' && po !== 'rod' && po !== 'hammer') continue;
    const [pj, pr] = pk.split(',').map(Number);
    if (pr !== r) continue;
    const ind = pendPhaseOf.get(pk) ?? 1;
    const reach = (po === 'rod' || po === 'hammer') ? 2 : 1;
    if (po === 'hammer') {
      const side = ind;
      if (pj + side === j || pj + reach * side === j) return 'block';
    } else {
      const { ang } = pendulumInfo(pr, ind);
      const hx = Math.cos(ang) * ind * reach;
      const side = hx > 0.5 ? 1 : (hx < -0.5 ? -1 : 0);
      if (side !== 0 && (pj + side === j || pj + reach * side === j)) return 'block';
    }
  }
  return jo ?? getState(key);
}

// 球中心所在格状态;null 表示处于纵向格子边缘(宽容区,不做判定)
// 玻璃上叠加的障碍物以障碍类型判定
function pendulumInfo(pr, ind) {
  const ballRow = (BALL_LOGIC_Z + scroll) / TILE;
  const cycles = (ballRow - pr) / (speed * PEND_SWING);   // 每单位 = 一次 180° 翻转,历时 PEND_SWING 秒
  const seg = Math.floor(cycles);
  const frac = cycles - seg;
  const ROT = 0.3;   // 翻转占该半周期的比例,其余时间为停顿
  const base = (seg % 2 === 0) ? 0 : Math.PI;   // 偶数段从 ind 朝向开始(球抵达该行时),奇数段从反向开始
  const ang = frac < ROT ? base + (frac / ROT) * Math.PI : base + Math.PI;   // 快速旋转后停顿
  return { ang };
}
function cellStateOfBall() {
  const j = Math.floor((ballX + totalW / 2) / TILE);
  if (j < 0 || j >= COLS) return 'out';
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  const r = Math.floor(pos);
  const off = pos - r;
  if (off < EDGE_MARGIN || off > 1 - EDGE_MARGIN) return null;
  const key = j + ',' + r;
  const ast = arrowSafe.get(key);
  if (ast !== undefined) {   // 机关地板滑动动画期间,原位置与目标位置均视为地面
    if (animT - ast.t0 < ast.dur) return 'tile';
    arrowSafe.delete(key);
  }
  if (glassDropOf(key) >= 1) return 'empty';   // 玻璃掉落完毕才判定为虚空
  const gk = gateCellOf.get(key);
  if (gk !== undefined) {   // 门:可见时切换一次(方向由放置时门按钮右键设置)
    const [cj] = gk.split(',').map(Number);
    if (gateForm(gk) === 0) return j === cj ? 'spike' : 'pillar';   // 形态一:中间浮空尖刺判定,两侧柱子
    return 'block';   // 形态二:三格均为障碍物
  }
  const jo = obstacleOn.get(key);
  if (jo === 'block') return 'block';   // 障碍物:静态地面障碍(撞死,可跳过)
  if (jo === 'square') {   // 方块:叠放;1~2格=地面障碍(撞死,可跳过),3~9格+=柱状(撞死,跳不过),10格=形态2(浮空,无判定)
    const h = blockStack.get(key) || 1;
    return h === 10 ? null : h >= 3 ? 'pillar' : 'block';
  }
  if (jo === 'jack') return jackForm(key) === 0 ? 'spike' : 'block';   // 形态一:浮空一格判定(跳起即死);形态二:地面一格判定(须跳过)
  if (jo === 'tree') return 'block';   // 矮树:判定与障碍物完全相同
  if (jo === 'bigtree') return 'pillar';   // 高树:判定与柱子相同(跳也撞死)
  if (jo === 'palm') return 'pillar';   // 棕榈树:判定与柱子相同(跳也撞死)
  if (jo === 'laser') return 'block';    // 激光炮:自身判定一格(同障碍物)
  if (jo === 'pendulum') return 'block';   // 横摆锤中心格:地面判定
  if (jo === 'rod') return 'block';   // 摆棍中心格:地面判定
  if (jo === 'hammer') return 'block';   // 摆锤中心格:地面判定
  if (jo === 'spot') return 'block';   // 聚光灯:一格地面判定(灯体所在格致命)
  if (jo === 'soar') return 'soar';   // 翱翔之跃:一格触发,使球飞行(本身不致命)
  if (jo === 'barrel') return 'barrel';   // 横冲直撞:一格触发,收集后免疫方块10行(本身不致命)
  if (jo === 'building') return 'pillar';   // 楼房:判定与柱子相同(跳也撞死)
  if (jo !== undefined) return jo ?? getState(key);
  for (const [pk, po] of obstacleOn) {   // 横摆锤/摆棍/摆锤:锤头(或杆端)横向偏移按形态判定
    if (po !== 'pendulum' && po !== 'rod' && po !== 'hammer') continue;
    const [pj, pr] = pk.split(',').map(Number);
    if (pr !== r) continue;
    const ind = pendPhaseOf.get(pk) ?? 1;   // 提示字符方向(+1 右/锤?, -1 左/锤?)
    const reach = (po === 'rod' || po === 'hammer') ? 2 : 1;   // 摆棍/摆锤杆长翻倍,判定也延长一格
    if (po === 'hammer') {   // 摆锤:判定固定朝初始方向,不随动画改变
      const side = ind;
      if (pj + side === j || pj + reach * side === j) return 'block';
    } else {
      const { ang } = pendulumInfo(pr, ind);
      const hx = Math.cos(ang) * ind * reach;   // 杆端横向偏移(-reach..reach);接近 0 表示朝前(无侧向格判定)
      const side = hx > 0.5 ? 1 : (hx < -0.5 ? -1 : 0);
      if (side !== 0 && (pj + side === j || pj + reach * side === j)) return 'block';   // 杆长 2 格:指向侧的一格与二格均有判定
    }
  }
  return jo ?? getState(key);
}

// 机关地板:踩上时整组沿该格箭头方向移动一格;返回是否成功移动
function triggerArrowGroup(ck) {
  const wasP = arrowPassive.has(ck);   // 触发前是否为被动机关板(后续会从原 key 移除,故先记录)
  const dir = arrowDirOf.get(ck) ?? 'up';
  const dj = ARROW_DJ[dir], dr = ARROW_DR[dir];
  const m = agMapOf(wasP);   // 主动/被动机关地板各自使用独立的组 map
  const gid = m.get(ck);
  if (gid === undefined) return false;
  const fail = () => { arrowBlock = { t0: animT, key: ck }; return false; };   // 触发被阻挡:闪红提示
  const cells = [];
  for (const [k, g] of m) if (g === gid) cells.push(k);
  const targets = new Map();
  for (const k of cells) {
    const [j, r] = k.split(',').map(Number);
    const nj = j + dj, nr = r + dr;
    if (nj < 0 || nj >= COLS) return fail();   // 移出边界:整组不动
    const nk = nj + ',' + nr;
    const ng = m.get(nk);
    if (ng !== undefined && ng !== gid) return fail();   // 撞上其他组
    if (ng === gid) {   // 目标为本组格子(连环移动,其数据会随两步法转移),跳过占用检查
      targets.set(nk, k);
      continue;
    }
    if (gateCellOf.has(nk) || obstacleOn.has(nk) || diamondOn.has(nk)) return fail();   // 目标格被占用
    const sv = covered.get(nk);
    if (sv !== undefined && sv !== 'empty' && sv !== 'tile') return fail();   // 目标格有其他地板(实心地板可被覆盖)
    targets.set(nk, k);
  }
  const t0 = animT;
  const moved = [];
  for (const [nk, k] of targets) {   // 先把所有源格数据读出(目标格可能是另一格的源,须两步处理)
    moved.push({ nk, k, ad: arrowDirOf.get(k), obs: obstacleOn.get(k), hasDia: diamondOn.has(k), v: covered.get(k), rt: obstacleRise.get(k), bstk: blockStack.get(k) });
  }
  for (const mm of moved) {   // 第一步:清空全部源格(显式变为虚空,不留普通地板)
    m.delete(mm.k);
    arrowDirOf.delete(mm.k);
    if (mm.obs !== undefined) obstacleOn.delete(mm.k);
    if (mm.bstk !== undefined) blockStack.delete(mm.k);
    if (mm.hasDia) diamondOn.delete(mm.k);
    if (arrowPassive.has(mm.k)) arrowPassive.delete(mm.k);   // 被动机关板:同步更新标记集合
    covered.delete(mm.k);
    covered.set(mm.k, 'empty');
    if (mm.rt !== undefined) obstacleRise.delete(mm.k);
    arrowAnim.delete(mm.k);
  }
  for (const mm of moved) {   // 第二步:统一写入目标格
    m.set(mm.nk, gid);
    if (mm.ad !== undefined) arrowDirOf.set(mm.nk, mm.ad);
    if (mm.obs !== undefined) obstacleOn.set(mm.nk, mm.obs);
    if (mm.bstk !== undefined) blockStack.set(mm.nk, mm.bstk);
    if (mm.hasDia) diamondOn.add(mm.nk);
    if (mm.v !== undefined) covered.set(mm.nk, mm.v);
    if (mm.v === 'arrowpassive') arrowPassive.add(mm.nk);   // 被动机关板:新位置也标记为被动
    if (mm.rt !== undefined) obstacleRise.set(mm.nk, mm.rt);
    const dur = (wasP ? 0.2 : 1.2) / speed;   // 被动机关板滑动更快(时长=0.2/球速),主动机关板不变(1.2/球速)
    arrowAnim.set(mm.nk, { t0, dj, dr, dur });
    arrowSafe.set(mm.k, { t0, dur });    // 动画期间原位置仍视为地面
    arrowSafe.set(mm.nk, { t0, dur });   // 动画期间移动后的位置视为地面(球可利用窗口走到新位置)
  }
  if (wasP) arrowPassiveUsed.add(gid); else arrowUsed.add(gid);   // 同组只能触发一次(主动/被动分开记录)
  // 装备相邻的被动组:基于源格"原位置"(cells)与"目标位置"(targets),无论源向哪个方向滑离都能触发下游被动板(含被动板激活被动板)
  const srcP = wasP, srcGid = gid;
  const armNeighborPassive = (k) => {
    const [j, r] = k.split(',').map(Number);
    for (const [nj, nr] of [[j - 1, r], [j + 1, r], [j, r - 1], [j, r + 1]]) {
      const nk = nj + ',' + nr;
      if (arrowPassive.has(nk)) {
        const pg = arrowPassiveGroup.get(nk);
        if (pg !== undefined && !arrowPassiveUsed.has(pg)) arrowPassiveArmed.set(pg, { srcGid, srcP });
      }
    }
  };
  for (const c of cells) armNeighborPassive(c);
  for (const c of targets.keys()) armNeighborPassive(c);
  return true;
}

function checkPassiveTriggers() {   // 被动机关板:被已激活源(主动或被动)装备后,待该源滑动结束即整组移动一格(只触发一次)
  const triggers = [];   // 先收集,避免在迭代 Map 期间修改它(否则迭代器会跳过条目)
  for (const [k, g] of arrowPassiveGroup) {
    if (!arrowPassiveGroup.has(k)) continue;
    if (arrowPassiveUsed.has(g)) continue;
    let selfAnim = false;
    for (const [k2, g2] of arrowPassiveGroup) if (g2 === g && arrowAnim.has(k2)) { selfAnim = true; break; }
    if (selfAnim) continue;
    const arm = arrowPassiveArmed.get(g);
    if (!arm) continue;
    const sm = arm.srcP ? arrowPassiveGroup : arrowGroup;
    let srcAnim = false;
    for (const [k3, g3] of sm) if (g3 === arm.srcGid && arrowAnim.has(k3)) { srcAnim = true; break; }
    if (srcAnim) continue;
    let dk = k;
    for (const [k2, g2] of arrowPassiveGroup) if (g2 === g && arrowDirOf.has(k2)) { dk = k2; break; }
    triggers.push([dk, g]);
  }
  for (const [dk, g] of triggers) {
    if (triggerArrowGroup(dk)) arrowPassiveArmed.delete(g);
  }
}

// 球处于钻石格中心区域时收集;浮空尖刺上的钻石只能在地面收集
function collectDiamond() {
  const key = cellKeyOfBall();
  if (key === null) return;
  if (!diamondOn.has(key) || collected.has(key)) return;
  if (glassFall.has(key)) return;   // 玻璃正在掉落,钻石随之掉落不可收集
  const st = cellStateOfBall();   // 门/尖刺等以实际判定为准
  if (st !== null && st === 'spike' && jumpT >= 0) return;
  collected.add(key);
}

const diamondTotal = () => diamondOn.size;

function checkFinish() {   // 球中心越过终点线(所在行 >= 终点行)即通关
  if (finishRow === null || win) return;
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  if (Math.floor(pos) >= finishRow) {
    win = true; winT = 0;
  }
}

function laserOnFor(lj, lr) {   // 球在炮后方 LASER_TRIGGER 格内时激光开启
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  const ballRow = Math.floor(pos);
  return lr > ballRow && lr - ballRow <= LASER_TRIGGER;
}

function checkLaser() {   // 球是否在开启的激光光束内(同列,行在光束范围,地面判定;跳跃可躲)
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  const ballRow = Math.floor(pos);
  const ballCol = Math.floor((ballX + totalW / 2) / TILE);
  for (const [k, o] of obstacleOn) {
    if (o !== 'laser') continue;
    const [lj, lr] = k.split(',').map(Number);
    if (ballCol !== lj || ballRow > lr || ballRow < lr - LASER_LEN) continue;
    if (laserOnFor(lj, lr)) return true;
  }
  return false;
}

function checkDeath() {
  if (invincible) return;   // 无敌模式:不判定掉落/撞击死亡
  const st = cellStateOfBall();
  if (st === null) return;
  const ballRow = Math.floor((BALL_LOGIC_Z + scroll) / TILE);
  if (barrelImmuneEnd > 0 && ballRow < barrelImmuneEnd) {   // 横冲直撞免疫:仅方块不致死且消失
    const bk = cellKeyOfBall();
    const obs = bk ? obstacleOn.get(bk) : null;
    if (obs === 'square') {
      obstacleOn.delete(bk);
      blockStack.delete(bk);
      return;
    }
  }
  if (st === 'out') {
    dead = true; deadT = 0; deathReason = '球滚出了瓷砖区域';
  } else if (st === 'empty') {
    dead = true; deadT = 0; deathReason = '球掉入了缺失的瓷砖';
  } else if (st === 'block') {
    dead = true; deadT = 0; deathReason = '球撞上了障碍物';
  } else if (st === 'pillar') {
    dead = true; deadT = 0; deathReason = '球撞上了柱子';
  } else if (st === 'roller') {
    dead = true; deadT = 0; deathReason = '球撞上了滚轮';
  }
}

function cleanupExpiredAnims() {   // 清理已过期的 arrowAnim/arrowSafe 条目(离屏单元格不会被渲染,其条目永远不会在 arrowOff 中清除)
  for (const [k, a] of arrowAnim) {
    if ((animT - a.t0) / (a.dur ?? ARROW_MOVE_DUR) >= 1) arrowAnim.delete(k);
  }
  for (const [k, s] of arrowSafe) {
    if (animT - s.t0 >= s.dur) arrowSafe.delete(k);
  }
}

function checkSceneTriggers() {
  const pos = (BALL_LOGIC_Z + scroll) / TILE;
  const ballRow = Math.floor(pos);
  const scId = sceneTriggerMap.get(ballRow);
  if (scId !== undefined && scId !== activeScene) {
    activeScene = scId;
    applySceneColors(activeScene);
  }
}

function updateBall(dt) {
  cleanupExpiredAnims();
  checkPassiveTriggers();   // 被动机关板:接触已激活的机关地板即整组移动
  checkSceneTriggers();
  const targetX = pressed ? (mouseX - W / 2) * BALL_LOGIC_Z / f : ballX;
  ballX += (targetX - ballX) * Math.min(1, dt * 12);
  if (jumpT < 0) {
    collectDiamond();
    checkFinish();
    if (!invincible && checkLaser()) {   // 激光命中(地面判定;跳跃可躲)
      dead = true; deadT = 0; deathReason = '撞上了激光';
    }
    const bk = ballCellRaw();
    const stNow = bk ? resolveCellState(bk) : null;
    if (bk !== null && arrowDirOf.has(bk) && !arrowPassive.has(bk)) {   // 机关地板上即使叠加了障碍也照常触发(障碍随地板一起移动);不依赖 cellStateOfBall 返回 'arrow',否则被障碍覆盖后无法触发
      if (!arrowUsed.has(agGet(bk))) {
        if (arrowArmed) arrowArmed = !triggerArrowGroup(bk);
      } else {
        arrowArmed = true;   // 已触发过的组在格上保持武装,离开后可再次触发
      }
    } else {
      arrowArmed = true;
    }
    if (stNow === 'soar') {
      if (bk !== null) {
        jumpT = 0; flying = true;   // 触发翱翔:飞行 7 格,在第 8 格落地
        obstacleOn.delete(bk);   // 触发后该格翱翔之跃消失(重玩时由快照恢复)
      }
    } else if (stNow === 'barrel') {
      if (bk !== null) {
        barrelActive.add(bk);   // 收集后消失
        barrelImmuneEnd = Math.floor((BALL_LOGIC_Z + scroll) / TILE) + 10;   // 免疫方块到当前行+10
        obstacleOn.delete(bk);   // 触发后消失
      }
    } else if (stNow === 'spring' || stNow === 'spring2') {
      if (bk !== null) {
        springAct.set(bk, animT);   // 记录弹起时刻(动画)
        if (diamondOn.has(bk) && !collected.has(bk)) collected.add(bk);   // 跳板激活时一并收集该格钻石
      }
      if (stNow === 'spring') {
        // 普通跳板:检测当前行x,飞行到x+3行中间降落
        const pos = (BALL_LOGIC_Z + scroll) / TILE;
        const x = Math.floor(pos);
        const off = pos - x;
        springTargetRow = x + 4;
        springFlightDuration = (4.5 - off) / speed;
      } else {
        // 小跳板:保留原有机制(只跳一格)
        jumpSmall = true;
        springTargetRow = -1;
      }
      jumpT = 0;
    } else {
      checkDeath();
    }
  } else {
    if (springTargetRow >= 0) {
      jumpT += dt / springFlightDuration;   // 普通跳板:由触发时的行内偏移决定飞行时长,精确落在x+3行中间
    } else {
      jumpT += dt / (flying ? 8 / speed : (jumpSmall ? 2 / speed : jumpDur()));   // 翱翔跳7格;小跳板跳1格
    }
      const st = cellStateOfBall();
      if (!invincible && st === 'pillar') {   // 柱状障碍(柱子/高树)与浮空尖刺:普通跳跃与翱翔均不能跳过
        dead = true; deadT = 0; deathReason = '球撞上了柱子';
      } else if (!invincible && st === 'spike') {
        dead = true; deadT = 0; deathReason = '球撞上了浮空尖刺';
      }
    if (jumpT >= 1) {
      jumpT = -1;
      flying = false;
      jumpSmall = false;
      springTargetRow = -1;
      checkDeath();
    }
  }
}

function drawEditor() {
  const g = ectx.createLinearGradient(0, 0, 0, edh);
  g.addColorStop(0, '#2E7BD6');
  g.addColorStop(0.72, '#7EC3F2');
  g.addColorStop(1, '#C9EBFF');
  ectx.fillStyle = g;
  ectx.fillRect(0, 0, edw, edh);

  const colW = edw * 0.4 / COLS;
  const rowH = colW;
  const left = (edw - COLS * colW) / 2;
  const visRows = Math.ceil(edh / rowH) + 1;
  const topRow = Math.ceil(viewRow);

  for (let r = topRow; r > topRow - visRows; r--) {
    const yy = (viewRow - r) * rowH;
    for (let j = 0; j < COLS; j++) {
      const x = left + j * colW;
      const key = j + ',' + r;
      const st = getState(key);
      if (st === 'empty') continue;
      if (st === 'spring') {
        ectx.fillStyle = '#4CAF50';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(0,0,0,0.3)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2, cy = yy + rowH / 2;
        ectx.fillStyle = '#fff';
        ectx.beginPath();
        ectx.moveTo(cx, cy - rowH * 0.2);
        ectx.lineTo(cx - rowH * 0.17, cy + rowH * 0.1);
        ectx.lineTo(cx + rowH * 0.17, cy + rowH * 0.1);
        ectx.closePath();
        ectx.fill();
        ectx.strokeStyle = '#fff';
        ectx.lineWidth = 3;
        ectx.beginPath();
        ectx.moveTo(cx, cy + rowH * 0.1);
        ectx.lineTo(cx, cy + rowH * 0.26);
        ectx.stroke();
      } else if (st === 'spring2') {
        ectx.fillStyle = '#8BC34A';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(0,0,0,0.3)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2, cy = yy + rowH / 2;
        ectx.fillStyle = '#fff';
        ectx.beginPath();
        ectx.moveTo(cx, cy - rowH * 0.2);
        ectx.lineTo(cx - rowH * 0.17, cy + rowH * 0.1);
        ectx.lineTo(cx + rowH * 0.17, cy + rowH * 0.1);
        ectx.closePath();
        ectx.fill();
        ectx.strokeStyle = '#fff';
        ectx.lineWidth = 3;
        ectx.beginPath();
        ectx.moveTo(cx, cy + rowH * 0.1);
        ectx.lineTo(cx, cy + rowH * 0.26);
        ectx.stroke();
      } else if (st === 'block') {
        ectx.fillStyle = '#2B2B33';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.5)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2, cy = yy + rowH / 2;
        ectx.fillStyle = '#fff';
        ectx.beginPath();
        ectx.moveTo(cx, cy - rowH * 0.3);
        ectx.lineTo(cx + rowH * 0.18, cy);
        ectx.lineTo(cx, cy + rowH * 0.3);
        ectx.lineTo(cx - rowH * 0.18, cy);
        ectx.closePath();
        ectx.fill();
      } else if (st === 'pillar') {
        ectx.fillStyle = '#5A3030';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.5)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.fillStyle = '#fff';
        ectx.fillRect(x + colW * 0.32, yy + 1, colW * 0.36, rowH * 0.4);
        ectx.fillRect(x + colW * 0.32, yy + rowH * 0.7, colW * 0.36, rowH * 0.29);
      } else if (st === 'spike') {
        ectx.fillStyle = '#FF8C1A';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(0,0,0,0.3)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2;
        ectx.fillStyle = '#C0C0CE';
        ectx.beginPath();
        ectx.moveTo(cx, yy + rowH * 0.12);
        ectx.lineTo(cx + rowH * 0.2, yy + rowH * 0.55);
        ectx.lineTo(cx - rowH * 0.2, yy + rowH * 0.55);
        ectx.closePath();
        ectx.fill();
      } else if (st === 'glass') {
        ectx.fillStyle = 'rgba(204,204,255,0.55)';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.8)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.55)';
        ectx.beginPath();
        ectx.moveTo(x + colW * 0.15, yy + rowH * 0.85);
        ectx.lineTo(x + colW * 0.85, yy + rowH * 0.15);
        ectx.stroke();
      } else if (st === 'glass2') {
        ectx.fillStyle = 'rgba(160,240,255,0.75)';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.8)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
      } else if (st === 'arrow' || st === 'arrowpassive') {
        const isP = st === 'arrowpassive';
        ectx.fillStyle = isP ? 'rgba(126,87,194,0.7)' : 'rgba(232,180,58,0.7)';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.4)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 0.5, yy + 0.5, colW - 1, rowH - 1);
        if (arrowDirOf.has(key)) {   // 只有箭头格画方向标记
          const cx = x + colW / 2, cy = yy + rowH / 2;
          const L = rowH * 0.25, W = rowH * 0.25;
          ectx.strokeStyle = isP ? '#4A148C' : '#8A6A1A';
          ectx.lineWidth = Math.max(1.5, rowH * 0.08);
          ectx.lineCap = 'round';
          ectx.lineJoin = 'round';
          ectx.beginPath();
          const d = arrowDirOf.get(key);
          ectx.fillStyle = isP ? '#4A148C' : '#8A6A1A';
          ectx.beginPath();
          if (d === 'up') { ectx.moveTo(cx, cy - L); ectx.lineTo(cx - W, cy + L); ectx.lineTo(cx + W, cy + L); }
          else if (d === 'down') { ectx.moveTo(cx, cy + L); ectx.lineTo(cx - W, cy - L); ectx.lineTo(cx + W, cy - L); }
          else if (d === 'left') { ectx.moveTo(cx - L, cy); ectx.lineTo(cx + L, cy - W); ectx.lineTo(cx + L, cy + W); }
          else { ectx.moveTo(cx + L, cy); ectx.lineTo(cx - L, cy - W); ectx.lineTo(cx - L, cy + W); }
          ectx.closePath();
          ectx.fill();
        }
      } else if (st === 'diamond') {
        ectx.fillStyle = 'rgba(0,229,255,0.35)';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(0,0,0,0.3)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2, cy = yy + rowH / 2;
        ectx.fillStyle = '#00E5FF';
        ectx.beginPath();
        ectx.moveTo(cx, cy - rowH * 0.32);
        ectx.lineTo(cx + colW * 0.22, cy);
        ectx.lineTo(cx, cy + rowH * 0.32);
        ectx.lineTo(cx - colW * 0.22, cy);
        ectx.closePath();
        ectx.fill();
        ectx.fillStyle = '#B3F5FF';
        ectx.beginPath();
        ectx.moveTo(cx, cy - rowH * 0.32);
        ectx.lineTo(cx + colW * 0.22, cy);
        ectx.lineTo(cx, cy + rowH * 0.1);
        ectx.lineTo(cx - colW * 0.22, cy);
        ectx.closePath();
        ectx.fill();
      } else if (st === 'move') {
        ectx.fillStyle = '#7E57C2';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.5)';
        ectx.lineWidth = 1;
        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);
        const cx = x + colW / 2, cy = yy + rowH / 2;
        const lo = moveLo.get(key) ?? curLo;

        ectx.lineWidth = 1;
        ectx.beginPath();
        ectx.moveTo(x + colW * 0.08, cy);
        ectx.lineTo(x + colW * 0.92, cy);
        ectx.stroke();
        ectx.beginPath();
        ectx.moveTo(x + colW * 0.08, cy - rowH * 0.22);
        ectx.lineTo(x + colW * 0.08, cy + rowH * 0.22);
        ectx.moveTo(x + colW * 0.92, cy - rowH * 0.22);
        ectx.lineTo(x + colW * 0.92, cy + rowH * 0.22);
        ectx.stroke();
        ectx.fillStyle = '#fff';
        ectx.fillRect(cx - colW * 0.1, cy - rowH * 0.1, colW * 0.2, rowH * 0.2);
      } else if (st === 'slide') {
        const md = slideMode.get(key) ?? 'L';
        ectx.fillStyle = '#FF8C1A';
        ectx.fillRect(x + 1, yy + 1, colW - 2, rowH - 2);
        ectx.strokeStyle = 'rgba(255,255,255,0.7)';

        ectx.strokeRect(x + 1, yy + 1, colW - 2, rowH - 2);

        const hPx = Hp * sc * rs;   // 障碍物从地里升起(方块按堆叠高度显示)
        const yTop = horizonY + k / zmc - hPx + dy;
        const col = bk.type === 'pillar' ? rPILLAR : (bk.type === 'square' ? rA : rBLK);   // 方块=地板色;障碍物=深色;柱子=深红
        ctx.fillStyle = shadeColor(col, fog);
        ctx.fillRect(cx, yTop, bk.w, Math.max(0, yGround - yTop));
        if (bk.type === 'square') {   // 方块与地板同色:顶部高光带使其略可辨(应要求不画描边)
          ctx.fillStyle = 'rgba(255,255,255,0.22)';   // 顶部高光带
          ctx.fillRect(cx, yTop, bk.w, Math.max(1, hPx * 0.16));
        } else {
          ctx.fillStyle = shadeColor(bk.type === 'pillar' ? rPILLAR_TOP : rBLK_TOP, fog);
          ctx.fillRect(cx, yTop, bk.w, Math.max(1, hPx * 0.14));
        }
        if (bk.type === 'square' && stk > 1) {   // 方块堆叠分界(每层一格高)
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          for (let i = 1; i < stk; i++) {
            const ly = yTop + hPx * i / stk;
            ctx.fillRect(cx, ly, bk.w, Math.max(1, 2));
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  for (const g of arrowGlyphs) arrowGlyph(g.x, g.y, g.s, g.dir, g.col);   // 方向箭头最后绘制,确保浮于地板之上不被后续条带覆盖
  if (markers.size > 0) {   // 卡点标志:在球所在列的标志行处画一个小旗
    for (const mk of markers) {
      const [mj, mr] = mk.split(',').map(Number);
      const zMark = (mr + 0.5) * TILE - scroll;
      if (zMark < 1) continue;
      const scM = f / zMark;
      const mx = W / 2 + (-totalW / 2 + (mj + 0.5) * TILE) * scM;
      const my = horizonY + k / zMark;
      const mSize = Math.max(4, TILE * scM * 0.35);
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(mx, my - mSize * 1.2, mSize * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = Math.max(1, mSize * 0.12);
      ctx.beginPath();
      ctx.moveTo(mx, my - mSize * 0.7);
      ctx.lineTo(mx, my);
      ctx.stroke();
    }
  }
  if (!ballIn) drawBall();   // 障碍全在球前方:球最后画(最上层)
  // 左上角进度百分比:球已走过行数 / 总行数
  let total = finishRow;
  if (total === null) {   // 未设终点线时,以已放置内容的最大行作为总行数
    total = 0;
    for (const k of covered.keys()) { const rr = parseInt(k.split(',')[1], 10); if (rr > total) total = rr; }
  }
  if (total > 0) {
    const ballRow = (BALL_LOGIC_Z + scroll) / TILE;
    const pct = Math.max(0, Math.min(100, ballRow / total * 100));
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(8, 8, 78, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(pct.toFixed(0) + '%', 14, 12);
  }
  ctx.restore();
}

function frame(now) {
  try {
  const dt = Math.min((now - last) / 1000 || 0, 0.05);
  last = now;
  animT = now / 1000;

  if (mode === 'play' && !dead && !win) {
    scroll += speed * TILE * dt;
    pendT += dt;   // 横摆锤翻转动画计时
    updateBall(dt);
    // 检测激光炮发射瞬间→触发屏幕震动
    const curLaserOn = new Set();
    for (const [k, o] of obstacleOn) {
      if (o !== 'laser') continue;
      const [lj, lr] = k.split(',').map(Number);
      if (laserOnFor(lj, lr)) curLaserOn.add(k);
    }
    for (const k of curLaserOn) {
      if (!laserPrevOn.has(k)) { shakeT = 0.6; break; }   // 新开启的激光→震动0.6秒
    }
    laserPrevOn = curLaserOn;
  }
  if (shakeT > 0) {
    shakeT = Math.max(0, shakeT - dt);
    const mag = shakeT / 0.6 * 12;   // 最大偏移12px,线性衰减
    shakeX = (Math.random() - 0.5) * mag;
    shakeY = (Math.random() - 0.5) * mag;
  } else {
    shakeX = shakeY = 0;
  }
  if (dead) {
    deadT += dt;
    if (deadT >= 0.85) {
      document.getElementById('diamondInfo').textContent = '钻石: ' + collected.size + ' / ' + diamondTotal();
      document.querySelector('#death .title').textContent = '游戏结束';
      document.getElementById('btnBack').textContent = playingBuiltin ? '返回选关界面' : '返回编辑器';
      document.getElementById('death').style.display = 'flex';
    }
  }
  if (win) {
    winT += dt;
    if (winT >= 0.85) {
      document.getElementById('diamondInfo').textContent = '钻石: ' + collected.size + ' / ' + diamondTotal();
      document.querySelector('#death .title').textContent = '游戏通关';
      document.getElementById('btnBack').textContent = playingBuiltin ? '返回选关界面' : '返回编辑器';
      document.getElementById('death').style.display = 'flex';
    }
  }

  if (mode === 'edit') drawEditor();
  else { drawMain(); drawMap(); }

  } catch (err) {
    if (!frame._logged) { console.error('[frame] 渲染异常(已跳过本帧,游戏继续):', err); document.title = '[frame错误] ' + (err && err.message ? err.message : err); frame._logged = true; }
  } finally {
    requestAnimationFrame(frame);
  }
}

function loadLevelData(d) {
  levelName = d.name || '未命名关卡';
  levelNameInput.value = levelName;
  speed = typeof d.speed === 'number' ? d.speed : 1;
  speedInput.value = speed;
  defaultEmpty = !!d.defaultEmpty;
  covered.clear();
  slideActive.clear();
  rslideActive.clear();
  slideMode.clear();
  moveLo.clear();
  moveHi.clear();
  swayT0.clear();
  swayPos.clear();
  rollerLo.clear();
  rollerHi.clear();
  rollerT0.clear();
  rollerPos.clear();
  gateCellOf.clear();
  gateDirOf.clear();
  gateSwitched.clear();
  gateSwitchT.clear();
  jackDirOf.clear();
  jackSwitched.clear();
  jackSwitchT.clear();
  pendPhaseOf.clear();
  springAct.clear();
  obstacleRise.clear(); blockStack.clear();
  barrelActive.clear(); barrelImmuneEnd = -1;
  diamondOn.clear();
  collected.clear();
  glassFall.clear();
  glassGroup.clear();
  fallGroup.clear();
  obstacleOn.clear();
  glassGroupSeq = 0;
  arrowGroup.clear();
  arrowDirOf.clear();
  arrowAnim.clear();
  arrowGroupSeq = 0;
  arrowGroupSel = null;
  arrowPassiveGroup.clear();
  arrowPassiveGroupSeq = 0;
  arrowPassiveGroupSel = null;
  arrowArmed = true;
  arrowSafe.clear();
  arrowUsed.clear(); arrowPassiveUsed.clear(); arrowPassiveArmed.clear();
  arrowPassive.clear();
  arrowBlock = null;
  arrowSnap = null;
  finishRow = typeof d.finishRow === 'number' ? d.finishRow : null;
  sceneTriggerMap.clear();
  if (d.sceneTriggers && typeof d.sceneTriggers === 'object') {
    for (const [k, v] of Object.entries(d.sceneTriggers)) {
      const row = Number(k);
      if (Number.isInteger(row) && Number.isInteger(v) && v >= 0 && v < SCENES.length) sceneTriggerMap.set(row, v);
    }
  }
  activeScene = 0; applySceneColors(0);
  win = false; winT = 0;
  dead = false; deadT = 0;
  document.getElementById('death').style.display = 'none';
  for (const [k, v] of Object.entries(d.cells)) {
    if (v === 'tile' || v === 'empty' || v === 'spring' || v === 'spring2' || v === 'block' || v === 'spike' || v === 'pillar' || v === 'move' || v === 'glass' || v === 'glass2' || v === 'arrow' || v === 'arrowpassive' || v === 'slide' || v === 'rslide') covered.set(k, v);
    if (v === 'diamond') { diamondOn.add(k); covered.set(k, 'tile'); }
  }
  if (Array.isArray(d.diamondCells)) {
    for (const k of d.diamondCells) if (typeof k === 'string') diamondOn.add(k);
  }
  if (d.glassGroups && typeof d.glassGroups === 'object') {
    for (const [k, g] of Object.entries(d.glassGroups)) {
      glassGroup.set(k, g);
      if (g > glassGroupSeq) glassGroupSeq = g;
    }
  }
  if (d.arrowGroups && typeof d.arrowGroups === 'object') {
    for (const [k, g] of Object.entries(d.arrowGroups)) {
      arrowGroup.set(k, g);
      if (g > arrowGroupSeq) arrowGroupSeq = g;
    }
  }
  if (d.arrowPassiveGroups && typeof d.arrowPassiveGroups === 'object') {
    for (const [k, g] of Object.entries(d.arrowPassiveGroups)) {
      arrowPassiveGroup.set(k, g);
      if (g > arrowPassiveGroupSeq) arrowPassiveGroupSeq = g;
    }
  }
  if (d.arrowDirs && typeof d.arrowDirs === 'object') {
    for (const [k, v] of Object.entries(d.arrowDirs)) {
      if (ARROW_DIRS.includes(v)) arrowDirOf.set(k, v);
    }
  }
  if (Array.isArray(d.arrowPassive)) {
    for (const k of d.arrowPassive) if (typeof k === 'string') arrowPassive.add(k);
  }
  if (d.obstacleOn && typeof d.obstacleOn === 'object') {
    for (const [k, o] of Object.entries(d.obstacleOn)) {
      if (o === 'block' || o === 'square' || o === 'spike' || o === 'pillar' || o === 'roller' || o === 'jack' || o === 'tree' || o === 'bigtree' || o === 'palm' || o === 'laser' || o === 'pendulum' || o === 'rod' || o === 'hammer' || o === 'spot' || o === 'soar' || o === 'barrel' || o === 'building') obstacleOn.set(k, o);
    }
  }
  if (d.blockStacks && typeof d.blockStacks === 'object') {
    for (const [k, h] of Object.entries(d.blockStacks)) {
      if (typeof h === 'number' && h >= 1 && obstacleOn.get(k) === 'square') blockStack.set(k, Math.min(10, Math.floor(h)));   // 形态2=10
    }
  }
  if (d.moveParams && typeof d.moveParams === 'object') {
    for (const [k, p] of Object.entries(d.moveParams)) {
      if (typeof p.a === 'number' && typeof p.b === 'number') { moveLo.set(k, p.a); moveHi.set(k, p.b); }
    }
  }
  if (d.rollerParams && typeof d.rollerParams === 'object') {
    for (const [k, p] of Object.entries(d.rollerParams)) {
      if (typeof p.a === 'number' && typeof p.b === 'number') { rollerLo.set(k, p.a); rollerHi.set(k, p.b); }
    }
  }
  if (d.slideModes && typeof d.slideModes === 'object') {
    for (const [k, m] of Object.entries(d.slideModes)) {
      if (m === 'L' || m === 'R') slideMode.set(k, m);
    }
  }
  if (Array.isArray(d.gateCenters)) {
    for (const k of d.gateCenters) if (typeof k === 'string') restoreGate(k);
  }
  if (d.gateDirs && typeof d.gateDirs === 'object') {
    for (const [k, v] of Object.entries(d.gateDirs)) {
      if (v === 1 || v === -1) gateDirOf.set(k, v);
    }
  }
  if (d.jackDirs && typeof d.jackDirs === 'object') {
    for (const [k, v] of Object.entries(d.jackDirs)) {
      if (v === 1 || v === -1) jackDirOf.set(k, v);
    }
  }
  if (d.pendPhases && typeof d.pendPhases === 'object') {
    for (const [k, v] of Object.entries(d.pendPhases)) {
      if (v === -1 || v === 1) pendPhaseOf.set(k, v);
    }
  }
  markers.clear();
  if (Array.isArray(d.markers)) { for (const k of d.markers) markers.add(k); }
  viewRow = typeof d.viewRow === 'number' ? d.viewRow : 14;
}

function loadBuiltin(idx) {
  const d = Object.assign({}, BUILTIN_LEVELS[idx], { viewRow: 0 });
  loadLevelData(d);
  playingBuiltin = true;
  currentBuiltinIdx = idx;
  document.getElementById('levelSelect').style.display = 'none';
  setMode('play');
}
