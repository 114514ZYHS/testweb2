    if (!node || !node.classList) return;
    if (on) node.classList.add(cls); else node.classList.remove(cls);
  }
  function setText(node, text) { if (node) node.textContent = (text === undefined || text === null) ? '' : String(text); }

  // ============================================================
  // 常量
  // ============================================================
  var FACE_TOKENS = ['U', "U'", 'D', "D'", 'L', "L'", 'R', "R'", 'F', "F'", 'B', "B'", 'M', "M'", 'E', "E'", 'S', "S'"];
  var SPEEDS = [0.5, 1, 2, 4];
  var METHOD_LABEL = { cfop: 'CFOP', roux: '桥式 Roux' };
  var BASE_MOVE_MS = 340;      // 演示播放 1x 时每个动作的时长
  var SCRAMBLE_MOVE_MS = 130;  // 打乱动画
  var QUICK_MOVE_MS = 220;     // 手动转面 / 撤销
  var SCRAMBLE_LEN = 25;       // 与 Lead/verifier 统一：25 步可稳定呈现明显凹凸（20 步偏短）
  var SOLVER_POLL_MS = 500;
  var SOLVER_POLL_MAX = 240;   // 最多轮询约 2 分钟

  function solverReady() {
    var S = solverAPI();
    return !!(S && typeof S.solve === 'function');
  }
  function methodAvailable(m) {
    var S = solverAPI();
    if (!S || typeof S.solve !== 'function') return false;
    if (!S.METHODS || !S.METHODS.length || typeof S.METHODS.indexOf !== 'function') return true;
    return S.METHODS.indexOf(m) >= 0;
  }
  function safeParse(MC, text) {
    if (!MC || typeof MC.parseMoves !== 'function') return [];
    try { return MC.parseMoves(text) || []; } catch (e) { return []; }
  }
  function moveText(MC, move) {
    if (!MC || typeof MC.moveToString !== 'function') return '?';
    try { return MC.moveToString(move); } catch (e) { return '?'; }
  }
  function formatMs(ms) {
    if (typeof ms !== 'number' || !isFinite(ms)) return '';
    return ms < 1000 ? (Math.round(ms) + ' ms') : ((ms / 1000).toFixed(1) + ' s');
  }

  // 把 SOLVER.solve 的返回值规范化成播放器需要的形状（对缺字段做防御）
  function normalizePlan(plan, method) {
    var MC = core();
    if (!plan || typeof plan !== 'object' || !MC) return null;
    var raw = Array.isArray(plan.steps) ? plan.steps : [];
    var steps = [], i, st, moves;
    for (i = 0; i < raw.length; i++) {
      st = raw[i] || {};
      moves = Array.isArray(st.moves) ? st.moves.filter(Boolean) : safeParse(MC, st.movesText || '');
      if (!moves.length && st.movesText) moves = safeParse(MC, st.movesText);
      steps.push({
        key: st.key || ('s' + (i + 1)),
        title: st.title || ('第 ' + (i + 1) + ' 步'),
        detail: st.detail || '',
        moves: moves,
        movesText: (typeof st.movesText === 'string' && st.movesText) ? st.movesText : MC.movesToString(moves)
      });
    }
    // 空步骤不展示（避免「0 动作」行）；全空时回退到 plan.moves
    var kept = [];
    for (i = 0; i < steps.length; i++) if (steps[i].moves.length) kept.push(steps[i]);
    steps = kept;
    if (!steps.length) {
      var all = Array.isArray(plan.moves) ? plan.moves.filter(Boolean) : safeParse(MC, plan.movesText || '');
      if (all.length) {
        steps = [{ key: 'all', title: '还原全部', detail: '', moves: all, movesText: MC.movesToString(all) }];
      }
    }
    var flat = [];
    for (i = 0; i < steps.length; i++) flat = flat.concat(steps[i].moves);
    return {
      method: plan.method || method,
      steps: steps,
      moves: flat,
      stats: plan.stats || {},
      raw: plan
    };
  }

  // 执行一个动作：优先交给渲染层做动画；渲染层不可用/没改状态时自己落地。
  // 返回 Promise<boolean>：true = 动作已生效；false = 动画被外部打断（未生效）。
  // 注意：CubeView.animateMove 完成时也会回调 view.onMove，所以这里用 self._ownMoves
  // 标记「App 自己发起的动作」，避免把演示动作误判成用户拖拽。
  async function performMove(self, move, ms, gen) {
    var MC = core();
    if (!MC || !isState(self.state) || !move || !move.face) return false;
    var v = self.view;
    var before = MC.stateKey(self.state);

    if (v && typeof v.animateMove === 'function') {
      var res = null, completed = undefined;
      self._ownMoves++;
      try {
        try { res = v.animateMove(move, ms); } catch (e) { res = null; }
        if (res && typeof res.then === 'function') completed = await res;
        else await sleep(ms);
      } catch (e) {
        completed = undefined;                 // 渲染层动画失败不中断播放
      } finally {
        self._ownMoves--;
      }
      if (gen !== self._gen) return false;     // 已被跳转/打断：不要写回
      if (completed === false) {               // 动画被外部打断（state 未变）
        self.adoptViewState();
        return false;
      }
      self.adoptViewState();
      if (MC.stateKey(self.state) === before) { // 渲染层没有落到 state 上 → App 自己落地
        MC.applyMove(self.state, move);
        self.pushState();
      }
      return true;
    }

    // 无 3D：瞬时执行 + 刷新（保留一点节奏，便于观察徽章/步骤变化）
    MC.applyMove(self.state, move);
    self.pushState();
    if (ms > 0) await sleep(Math.min(ms, 240));
    return true;
  }

  // ============================================================
  // App
  // ============================================================
  class App {
    constructor(rootEl, opts) {

      }
      opts = opts || {};
      var d = doc();

      this.opts = opts;
      this.MC = core();
      this.root = isEl(rootEl) ? rootEl
        : (isEl(opts.root) ? opts.root
          : (d ? (d.getElementById('panel-root') || d.body) : null));
      this.canvas = isEl(opts.canvas) ? opts.canvas : (d ? d.getElementById('gl-canvas') : null);
      this.view = (opts.view && typeof opts.view === 'object') ? opts.view : null;

      // state 由 App 持有并原地修改（见 Lead 启动契约第 3 条）
      if (isState(opts.state)) this.state = opts.state;
      else if (isState(this.view && this.view.state)) this.state = this.view.state;
      else this.state = this.MC ? this.MC.createSolved() : null;

      this.method = (opts.method === 'roux' || opts.method === 'cfop') ? opts.method : 'cfop';
      this.speed = 1;

      this.planStale = false;
      this.baseState = null;
      this.cursor = 0;        // 当前（待播放）步骤下标；已完成 = 0..cursor-1
      this.moveIndex = 0;     // 当前步骤内已完成的动作数
      this.playing = false;
      this.solving = false;
      this.ops = 0;           // 在途的单次操作（打乱/转面/撤销）
      this._ownMoves = 0;     // >0 表示正在由 App 自己驱动动画（此时 view.onMove 不算用户拖拽）
      this.history = [];      // 用户动作历史（撤销用）
      this.stripeMode = false;
      this._gen = 0;          // 播放代数：跳转/打断时 +1，作废在途动画
      this._singleStep = false;
      this._destroyed = false;
      this._pollTimer = null;
      this._pollCount = 0;
      this._toastTimer = null;
      this._renderedPlan = null;

      if (App.active && App.active !== this && !App.active._destroyed) {

    }

    // ============================================================
    // 事件绑定
    // ============================================================
    _bindDom() {
      var self = this, D = this.dom;
      if (!D.app) return;

      D.app.addEventListener('click', function (ev) {
        var t = ev.target;
        var node = (t && t.closest) ? t.closest('[data-act],[data-token],[data-step],[data-method]') : null;
        if (!node) return;
        var act = node.getAttribute('data-act');
        var tok = node.getAttribute('data-token');
        var step = node.getAttribute('data-step');
        var method = node.getAttribute('data-method');
        // 鼠标点击后主动释放焦点，避免之后按空格/方向键被按钮吞掉（键盘触发时不 blur）
        if (ev.detail > 0 && typeof node.blur === 'function') {
          try { node.blur(); } catch (e) { /* ignore */ }
        }
        if (tok) { self.faceTurn(tok); return; }
        if (method) { self.setMethod(method); return; }
        if (step !== null && step !== undefined) { self.jumpTo(parseInt(step, 10)); return; }
        switch (act) {
          case 'scramble': self.scramble(); break;
          case 'reset': self.resetCube(); break;
          case 'undo': self.undo(); break;
          case 'solve': self.solve(); break;
          case 'play': if (self.playing) self.pause(); else self.play(); break;
          case 'prev': self.prevStep(); break;
          case 'next': self.nextStep(); break;
          case 'toStart': self.resetDemo(); break;
          case 'resetCamera': self.resetCamera(); break;
          case 'stripeMode': self.toggleStripeMode(); break;
        }
      });

      if (D.speed) {
        D.speed.addEventListener('change', function () {
          self.setSpeed(parseFloat(D.speed.value));
        });
      }

      // 步骤行键盘可达（Enter / 空格 跳转）
      if (D.steps) {
        D.steps.addEventListener('keydown', function (ev) {
          var t = ev.target;
          var node = (t && t.closest) ? t.closest('[data-step]') : null;
          if (!node) return;
          if (ev.key === 'Enter' || ev.key === ' ' || ev.code === 'Space') {
            ev.preventDefault();
            self.jumpTo(parseInt(node.getAttribute('data-step'), 10));
          }
        });
      }
    }

    _bindKeyboard() {
      var d = doc(), self = this;
      if (!d) return;
      this._onKey = function (ev) {
        if (self._destroyed || ev.defaultPrevented) return;
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        var t = ev.target;
        if (t && t.closest && t.closest('input,textarea,select,button,a,[contenteditable="true"],[role="button"],[data-step]')) return;
        var k = ev.key;
        if (k === ' ' || k === 'Spacebar' || ev.code === 'Space') {
          ev.preventDefault();
          if (self.playing) self.pause(); else self.play();
        } else if (k === 'ArrowLeft') {
          ev.preventDefault(); self.prevStep();
        } else if (k === 'ArrowRight') {
          ev.preventDefault(); self.nextStep();
        } else if (k === 's' || k === 'S') {
          ev.preventDefault(); self.scramble();
        } else if (k === 'r' || k === 'R') {
          ev.preventDefault(); self.resetCube();
        }
      };
      d.addEventListener('keydown', this._onKey);
    }

    _bindResize() {
      var w = win(), self = this;
      if (!w) return;
      this._onResize = function () {
        if (self._destroyed) return;
        var v = self.view;
        if (v && typeof v.resize === 'function') { try { v.resize(); } catch (e) { /* ignore */ } }
      };
      w.addEventListener('resize', this._onResize);
    }

    _bindView() {
      var v = this.view, self = this;
      if (!v) return;
      var prev = v.onMove;
      v.onMove = function (move) {
        if (typeof prev === 'function') { try { prev(move); } catch (e) { /* ignore */ } }
        self.onExternalMove(move);
      };
    }

    _pollSolver() {
      var self = this;
      if (solverReady()) return;
      this._pollTimer = setTimeout(function tick() {
        if (self._destroyed) return;
        self._pollCount++;
        if (solverReady()) {
          self._pollTimer = null;
          if (self._solverWanted) self.toast('求解器已就绪', 'ok');
          self.syncControls();
          return;
        }
        if (self._pollCount >= SOLVER_POLL_MAX) { self._pollTimer = null; return; }
        self._pollTimer = setTimeout(tick, SOLVER_POLL_MS);
      }, SOLVER_POLL_MS);
    }

    // ============================================================
    // 基础状态操作
    // ============================================================
    isBusy() { return this.ops > 0 || this.solving || this.playing; }

    moveDuration(base) {
      var s = this.speed > 0 ? this.speed : 1;
      return Math.max(40, Math.round(base / s));
    }

    pushState() {
      var v = this.view;
      if (v && typeof v.setState === 'function') {
        try { v.setState(this.state); } catch (e) { /* 渲染层异常不影响 UI */ }
      }
    }

    adoptViewState() {
      var v = this.view;
      if (!v) return;
      var s = null;
      try { if (typeof v.getState === 'function') s = v.getState(); } catch (e) { s = null; }
      if (!isState(s)) { try { s = v.state; } catch (e) { s = null; } }
      if (isState(s)) this.state = s;
    }

    setState(state) {
      if (!isState(state)) return this;
      this.state = state;
      this.pushState();
      this.updateAll();
      return this;
    }

    // ============================================================
    // 渲染同步
    // ============================================================
    updateAll() {
      if (!this.dom.app) return;
      this.updateBadges();
      this.syncSteps();
      this.updateNow();
      this.syncControls();
    }

    updateBadges() {
      var MC = this.mc(), D = this.dom;
      if (!D.badgePos) return;
      var rep = null;
      if (MC && isState(this.state)) {
        try { rep = MC.solvedReport(this.state); } catch (e) { rep = null; }
      }
      if (!rep) {
        this._setBadge(D.badgePos, '—', 'idle', '');
        this._setBadge(D.badgeStripes, '—', 'idle', '');
        return;
      }
      var posOk = !!rep.position, stOk = !!rep.stripes;
      this._setBadge(D.badgePos, posOk ? '已复原' : '未复原', posOk ? 'ok' : 'bad',
        posOk ? '所有块都在自己的槽位（外表面齐平）' : ('有 ' + rep.wrong.length + ' 个块不在自己的槽位（外表面有凹凸台阶）'));
      this._setBadge(D.badgeStripes, stOk ? '已对齐' : '未对齐', stOk ? 'ok' : 'bad',
        stOk ? '银白贴纸上的拉丝条纹朝向一致' : ('有 ' + rep.misaligned.length + ' 个块的条纹朝向不一致'));
      toggleClass(D.app, 'is-solved', !!rep.solved);
    }

    _setBadge(node, text, state, tip) {
      if (!node) return;
      node.setAttribute('data-state', state);
      var v = node.querySelector('.mc-badge-val');
      if (v) v.textContent = text;
      if (tip) node.title = tip;
    }

    updateNow() {
      var D = this.dom;
      if (!D.nowMain) return;
      var MC = this.mc();
      var steps = (this.plan && this.plan.steps) || [];
      var N = steps.length;
      var total = this.totalMoves();
      var done = this.doneMoves();

      if (!this.plan) {
        setText(D.nowMain, '还没有方案');
        setText(D.nowSub, '点击「求解」生成分步演示');
      } else if (this.planStale) {
        setText(D.nowMain, '方案已作废');
        setText(D.nowSub, '状态已改变，请重新求解');
      } else if (N === 0) {
        setText(D.nowMain, '当前已是复原状态');
        setText(D.nowSub, '无需任何动作');
      } else if (this.cursor >= N) {
        setText(D.nowMain, '第 ' + N + ' / ' + N + ' 步 · 演示完成 ✓');
        setText(D.nowSub, '全部 ' + total + ' 个动作已播放');
      } else {
        var st = steps[this.cursor];
        setText(D.nowMain, '第 ' + (this.cursor + 1) + ' / ' + N + ' 步 · ' + st.title);
        setText(D.nowSub, '步内动作 ' + this.moveIndex + ' / ' + st.moves.length +
          ' · 总进度 ' + done + ' / ' + total);
      }
      if (D.empty) {
        // 空态文案要区分「没求解」/「方案已作废」/「方案本身就是 0 步（已复原）」
        if (!this.plan) setText(D.empty, '还没有方案：点击「求解」生成分步演示。');
        else if (this.planStale) setText(D.empty, '方案已作废：状态已改变，请重新求解。');
        else setText(D.empty, '当前已是复原状态，无需任何动作。');
      }
      if (D.demoBar) {
        var pct = total > 0 ? Math.round(done / total * 100) : (this.plan && !this.planStale ? 100 : 0);
        D.demoBar.style.width = clamp(pct, 0, 100) + '%';
      }
      if (D.moveCount) {
        setText(D.moveCount, this.history.length ? ('已转 ' + this.history.length + ' 步') : (MC && isState(this.state) && MC.isSolved(this.state) ? '复原态' : '—'));
      }
      if (D.planMeta) {
        if (!this.plan) setText(D.planMeta, '—');
        else {
          var meta = METHOD_LABEL[this.plan.method] || this.plan.method;
          meta += ' · ' + N + ' 步 · ' + total + ' 动作';
          var ms = formatMs(this.plan.stats && this.plan.stats.ms);
          if (ms) meta += ' · 求解 ' + ms;
          if (this.planStale) meta += ' · 已作废';
          setText(D.planMeta, meta);
        }
      }
    }

    totalMoves() {
      var steps = (this.plan && this.plan.steps) || [], n = 0;
      for (var i = 0; i < steps.length; i++) n += steps[i].moves.length;
      return n;
    }
    doneMoves() {
      var steps = (this.plan && this.plan.steps) || [], n = 0;
      for (var i = 0; i < this.cursor && i < steps.length; i++) n += steps[i].moves.length;
      return n + this.moveIndex;
    }

    renderSteps() {
      var D = this.dom, MC = this.mc();
      if (!D.steps) return;
      D.steps.textContent = '';
      this._chips = [];
      var steps = (this.plan && this.plan.steps) || [];
      for (var i = 0; i < steps.length; i++) {
        var st = steps[i];
        var li = el('li', 'mc-step');
        li.setAttribute('data-step', String(i));
        li.setAttribute('role', 'button');
        li.setAttribute('tabindex', '0');

        li.appendChild(el('span', 'mc-step-no', String(i + 1)));

        var main = el('div', 'mc-step-main');
        var titleRow = el('div', 'mc-step-titlerow');
        titleRow.appendChild(el('span', 'mc-step-title', st.title));
        titleRow.appendChild(el('span', 'mc-step-check', '✓'));
        main.appendChild(titleRow);

        var mv = el('div', 'mc-step-moves');
        var chips = [];
        for (var j = 0; j < st.moves.length; j++) {
          var c = el('i', 'mc-mv', moveText(MC, st.moves[j]));
          mv.appendChild(c);
          chips.push(c);
        }
        main.appendChild(mv);
        if (st.detail) main.appendChild(el('div', 'mc-step-detail', st.detail));
        li.appendChild(main);
        li.appendChild(el('span', 'mc-step-count', st.moves.length + ' 动作'));

        D.steps.appendChild(li);
        this._chips.push(chips);
      }
      this._renderedPlan = this.plan;
      if (D.empty) D.empty.hidden = steps.length > 0;
      D.steps.hidden = steps.length === 0;
      this._lastScrollCursor = -1;
      this.syncSteps();
    }

    syncSteps() {
      var D = this.dom;
      if (!D.steps) return;
      var steps = (this.plan && this.plan.steps) || [];
      var N = steps.length;
      var cur = this.cursor;
      var locked = this.planStale;
      var lis = D.steps.children;
      for (var i = 0; i < lis.length; i++) {
        var li = lis[i];
        var isDone = i < cur;
        var isCur = i === cur && cur < N;
        toggleClass(li, 'is-done', isDone);
        toggleClass(li, 'is-current', isCur);
        toggleClass(li, 'is-locked', locked);
        if (isCur) li.setAttribute('aria-current', 'step');
        else li.removeAttribute('aria-current');
      }
      // 当前步内的动作高亮
      if (cur < N && this._chips[cur]) {
        var chips = this._chips[cur];
        for (var j = 0; j < chips.length; j++) {
          toggleClass(chips[j], 'is-done', j < this.moveIndex);
          toggleClass(chips[j], 'is-now', j === this.moveIndex && !this.planStale && this.cursor === cur);
        }
      }
      // 当前行滚入可视区（只在步骤列表自身可滚动时，避免窄屏把整页滚走）
      if (cur !== this._lastScrollCursor && cur < N && lis[cur] && lis[cur].scrollIntoView) {
        this._lastScrollCursor = cur;
        var scrollable = (D.steps.scrollHeight || 0) > (D.steps.clientHeight || 0) + 4;
        if (scrollable) {
          try { lis[cur].scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
        }
      }
    }

    syncControls() {
      var D = this.dom;
      if (!D.app) return;
      var busy = this.isBusy();
      var hasPlan = !!this.plan && !this.planStale && this.plan && this.plan.steps.length > 0;
      var ready = solverReady();
      var vOk = !!this.view;
      var methodOk = methodAvailable(this.method);

      var animLock = busy && !this.playing;
      if (D.btnScramble) D.btnScramble.disabled = animLock || this.solving;
      if (D.btnReset) D.btnReset.disabled = animLock || this.solving;
      if (D.btnUndo) D.btnUndo.disabled = animLock || this.solving || this.history.length === 0;

      if (D.faces) {
        var fbs = D.faces.children;
        for (var i = 0; i < fbs.length; i++) fbs[i].disabled = animLock || this.solving;
      }

      if (D.btnSolve) {
        D.btnSolve.disabled = busy || !ready;
        setText(D.btnSolve, this.solving ? '求解中…' : (ready ? '求解' : '求解器加载中'));
      }
      if (D.solverState) {
        setText(D.solverState, ready
          ? ('已就绪 · ' + (solverAPI().METHODS && solverAPI().METHODS.length
            ? solverAPI().METHODS.map(function (m) { return METHOD_LABEL[m] || m; }).join(' / ')
            : 'CFOP / 桥式 Roux'))
          : '加载中…');
      }
      if (D.methodBtns) {
        for (var m in D.methodBtns) {
          if (!D.methodBtns.hasOwnProperty(m)) continue;
          var on = m === this.method;
          toggleClass(D.methodBtns[m], 'is-on', on);
          D.methodBtns[m].setAttribute('aria-checked', on ? 'true' : 'false');
          D.methodBtns[m].disabled = this.solving || animLock || !methodAvailable(m);
        }
      }

      var demoLock = this.solving || (busy && !this.playing) || !hasPlan;
      if (D.btnPlay) {
        D.btnPlay.disabled = this.solving || !hasPlan;
        setText(D.btnPlay, this.playing ? '⏸' : '▶');
        D.btnPlay.title = this.playing ? '暂停（空格）' : '播放（空格）';
      }
      if (D.btnPrev) D.btnPrev.disabled = demoLock || (this.cursor <= 0 && this.moveIndex === 0);
      if (D.btnNext) D.btnNext.disabled = demoLock || this.cursor >= (this.plan ? this.plan.steps.length : 0);
      if (D.btnToStart) D.btnToStart.disabled = demoLock || (this.cursor === 0 && this.moveIndex === 0);
      if (D.steps) D.steps.classList.toggle('is-locked', this.planStale);

      if (D.btnCamera) D.btnCamera.disabled = !vOk;
      if (D.btnStripe) {
        D.btnStripe.disabled = !vOk;
        toggleClass(D.btnStripe, 'is-on', this.stripeMode);
        D.btnStripe.setAttribute('aria-pressed', this.stripeMode ? 'true' : 'false');
      }
      if (D.viewState) setText(D.viewState, vOk ? '3D 已就绪' : '3D 未就绪');
      if (D.stale) D.stale.hidden = !this.planStale;

      // 求解按钮的“未就绪”提示（只有用户尝试过才提示，避免噪音）
      if (!ready && D.solverState) setText(D.solverState, '加载中…（求解按钮暂不可用）');
      if (ready && !methodOk && D.solverState) setText(D.solverState, '当前方法 ' + (METHOD_LABEL[this.method] || this.method) + ' 暂不可用');
    }

    // ============================================================
    // 提示
    // ============================================================
    setBanner(text, kind) {
      var D = this.dom;
      if (!D.banner) return;
      D.banner.textContent = text;
      D.banner.hidden = !text;
      D.banner.setAttribute('data-kind', kind || 'info');
    }

    toast(msg, kind) {
      var D = this.dom;
      if (!D.toast) return;
      D.toast.textContent = msg;
      D.toast.setAttribute('data-kind', kind || 'info');
      D.toast.classList.add('is-show');
      var self = this;
      if (this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(function () {
        self._toastTimer = null;
        if (D.toast) D.toast.classList.remove('is-show');
      }, 2600);
    }

    setSolveProgress(msg, frac) {
      var D = this.dom;
      if (!D.solveProgress) return;
      D.solveProgress.hidden = false;
      setText(D.solveText, msg || '');
      if (typeof frac === 'number' && isFinite(frac)) {
        D.solveProgress.classList.remove('is-indeterminate');
        if (D.solveBar) D.solveBar.style.width = Math.round(clamp(frac, 0, 1) * 100) + '%';
      } else {
        D.solveProgress.classList.add('is-indeterminate');
        if (D.solveBar) D.solveBar.style.width = '100%';
      }
    }

    // ============================================================
    // 方案生命周期
    // ============================================================
    invalidatePlan(msg) {
      if (!this.plan || this.planStale) return;
      this.planStale = true;
      if (msg) this.toast(msg, 'warn');
      this.updateAll();
    }

    clearPlan() {
      this.plan = null;
      this.planStale = false;
      this.baseState = null;
      this.cursor = 0;
      this.moveIndex = 0;
      this._renderedPlan = null;
      this.renderSteps();
      this.updateAll();
    }

    stopPlayback(hard) {
      this.playing = false;
      this._singleStep = false;
      this._gen++;
      if (hard && this.view && typeof this.view.stopAnimation === 'function') {
        try { this.view.stopAnimation(); } catch (e) { /* ignore */ }
      }
    }

    // 跳到第 k 步的起点（k = 已完成的步骤数）
    jumpTo(k) {
      var MC = this.mc();
      if (!MC) return;
      if (!this.plan || this.planStale) {
        if (this.plan && this.planStale) this.toast('方案已作废，请重新求解', 'warn');
        return;
      }
      var N = this.plan.steps.length;
      k = clamp(isFinite(k) ? Math.round(k) : 0, 0, N);
      this.stopPlayback(true);
      var st = MC.clone(this.baseState || this.state);
      for (var i = 0; i < k; i++) MC.applyMoves(st, this.plan.steps[i].moves);
      this.state = st;
      this.pushState();
      this.cursor = k;
      this.moveIndex = 0;
      this.updateAll();
    }

    async runPlayback(singleStep) {
      var self = this, MC = this.mc();
      if (!MC || this.playing || this._destroyed) return;
      if (!this.plan) { this.toast('请先点击「求解」生成方案', 'warn'); return; }
      if (this.planStale) { this.toast('方案已作废，请重新求解', 'warn'); return; }
      var N = this.plan.steps.length;
      if (N === 0) { this.toast('当前已是复原状态，无需播放', 'ok'); return; }
      if (this.cursor >= N) this.jumpTo(0);

      this.playing = true;
      this._singleStep = !!singleStep;
      var gen = this._gen;
      var interrupted = false;
      if (this.view && typeof this.view.setDragEnabled === 'function') {
        try { this.view.setDragEnabled(false); } catch (e) { /* ignore */ }
      }
      this.syncControls();

      try {
        while (this.playing && gen === this._gen && this.cursor < N) {
          var step = this.plan.steps[this.cursor];
          var moves = step.moves || [];
          var i = this.moveIndex;
          for (; i < moves.length; i++) {
            if (!this.playing || gen !== this._gen) { this.moveIndex = i; break; }
            var okMove = await performMove(this, moves[i], this.moveDuration(BASE_MOVE_MS), gen);
            if (gen !== this._gen) break;
            if (okMove === false) { this.moveIndex = i; interrupted = true; break; }
            this.moveIndex = i + 1;
            this.updateAll();
          }
          if (interrupted) break;
          if (gen !== this._gen) break;
          if (this.moveIndex < moves.length) break;   // 暂停在步骤中间
          this.cursor += 1;
          this.moveIndex = 0;
          this.updateAll();
          if (this._singleStep) break;
        }
      } finally {
        if (gen === this._gen) {
          this.playing = false;
          this._singleStep = false;
        }
        if (this.view && typeof this.view.setDragEnabled === 'function') {
          try { this.view.setDragEnabled(true); } catch (e) { /* ignore */ }
        }
        if (!this._destroyed) this.updateAll();
      }
      if (!this._destroyed && interrupted) this.toast('动画被打断，演示已暂停', 'warn');
      if (!this._destroyed && gen === this._gen && !interrupted && this.cursor >= N && !this.planStale) {
        this.toast('演示完成，魔方已复原', 'ok');
      }
    }

    play() {
      if (this.playing) return Promise.resolve();
      if (this.isBusy() && !this.playing) return Promise.resolve();
      if (this.plan && !this.planStale && this.plan.steps.length && this.cursor >= this.plan.steps.length) {
        this.jumpTo(0);   // 已到末尾 → 从头重播
      }
      return this.runPlayback(false);
    }

    pause() {
      if (!this.playing) return;
      this.playing = false;
      this._singleStep = false;
      this.updateAll();
    }

    nextStep() {
      if (this.playing || this.solving || this.ops > 0) return Promise.resolve();
      return this.runPlayback(true);
    }

    prevStep() {
      if (this.playing) this.pause();
      if (!this.plan || this.planStale) {
        if (this.plan && this.planStale) this.toast('方案已作废，请重新求解', 'warn');
        return;
      }
      if (this.moveIndex > 0) { this.jumpTo(this.cursor); return; }   // 先回到本步开头
      if (this.cursor <= 0) { this.toast('已经是第一步', 'ok'); return; }
      this.jumpTo(this.cursor - 1);
    }

    resetDemo() {
      if (this.playing) this.pause();
      if (!this.plan || this.planStale) {
        if (this.plan && this.planStale) this.toast('方案已作废，请重新求解', 'warn');
        return;
      }
      this.jumpTo(0);
      this.toast('已回到演示起点', 'info');
    }

    // ============================================================
    // 操作
    // ============================================================
    async scramble() {
      var MC = this.mc(), self = this;
      if (!MC || this.isBusy()) return;
      this.stopPlayback(true);
      this.invalidatePlan('状态已改变，请重新求解');
      var moves;
      try { moves = MC.randomScramble(SCRAMBLE_LEN); } catch (e) { moves = null; }
      if (!moves || !moves.length) { this.toast('打乱失败', 'warn'); return; }

      this.history.length = 0;
      this.ops++;
      this.syncControls();
      this.toast('打乱 ' + moves.length + ' 步', 'info');
      var gen = this._gen;
      for (var i = 0; i < moves.length; i++) {
        if (gen !== this._gen || self._destroyed) break;
        var done = await performMove(this, moves[i], this.moveDuration(SCRAMBLE_MOVE_MS), gen);
        if (done === false) break;                 // 动画被打断 → 不再计入历史
        this.history.push(moves[i]);
        this.updateAll();
      }
      this.ops--;
      this.updateAll();
    }

    async resetCube() {
      var MC = this.mc();
      if (!MC || this.isBusy()) return;
      this.stopPlayback(true);
      this.clearPlan();
      this.history.length = 0;
      this.state = MC.createSolved();
      this.pushState();
      this.updateAll();
      this.toast('已复位到复原状态', 'ok');
    }

    async undo() {
      var MC = this.mc();
      if (!MC || this.isBusy()) return;
      if (!this.history.length) { this.toast('没有可撤销的动作', 'warn'); return; }
      var last = this.history.pop();
      var move = MC.invertMove(last);
      this.invalidatePlan('状态已改变，请重新求解');
      this.ops++;
      this.syncControls();
      var done = await performMove(this, move, this.moveDuration(QUICK_MOVE_MS), this._gen);
      if (done === false) this.history.push(last);   // 未生效 → 放回历史
      this.ops--;
      this.updateAll();
    }

    async faceTurn(token) {
      var MC = this.mc();
      if (!MC || this.isBusy()) return;
      var move;
      try { move = MC.parseMove(token); } catch (e) { this.toast('非法动作：' + token, 'warn'); return; }
      this.invalidatePlan('状态已改变，请重新求解');
      this.ops++;
      this.syncControls();
      var done = await performMove(this, move, this.moveDuration(QUICK_MOVE_MS), this._gen);
      if (done !== false) this.history.push(move);
      this.ops--;
      this.updateAll();
    }

    solve() {
      var self = this, MC = this.mc(), S = solverAPI();
      if (!MC || this.isBusy()) return;
      if (!S || typeof S.solve !== 'function') {
        this._solverWanted = true;
        this.toast('求解器加载中，请稍候…', 'warn');
        this.syncControls();
        return;
      }
      if (!methodAvailable(this.method)) {
        this.toast('求解器暂不支持 ' + (METHOD_LABEL[this.method] || this.method), 'warn');
        return;
      }
      this.stopPlayback(true);
      this.clearPlan();
      this.solving = true;
      this.setSolveProgress('准备求解（' + (METHOD_LABEL[this.method] || this.method) + '）…', 0);
      this.syncControls();

      var snapshot = MC.clone(this.state);
      var method = this.method;

      // 让「求解中…」先渲染出来，再进入同步求解
      setTimeout(function () {
        if (self._destroyed) return;
        var plan = null, err = null;
        try {
          plan = S.solve(MC.clone(snapshot), method, {
            onProgress: function (msg, frac) { self.setSolveProgress(msg, frac); }
          });
        } catch (e) { err = e; }
        self.solving = false;
        if (err) {
          var msg = (err && err.message) ? err.message : String(err);
          self.setSolveProgress('求解失败：' + msg, null);
          self.toast('求解失败：' + msg, 'warn');
          self.syncControls();
          return;
        }
        var norm = normalizePlan(plan, method);
        if (!norm) {
          self.setSolveProgress('求解器未返回可用方案', null);
          self.toast('求解器未返回可用方案', 'warn');
          self.syncControls();
          return;
        }
        self.plan = norm;
        self.planStale = false;
        self.baseState = MC.clone(snapshot);
        self.cursor = 0;
        self.moveIndex = 0;
        self.history.length = 0;
        self.setSolveProgress(
          '方案就绪：' + norm.steps.length + ' 步 / ' + norm.moves.length + ' 个动作' +
          (formatMs(norm.stats && norm.stats.ms) ? ' · 求解 ' + formatMs(norm.stats.ms) : ''),
          1
        );
        self.renderSteps();
        self.jumpTo(0);
        self.updateAll();
        self.toast('方案已生成，点击 ▶ 播放演示', 'ok');
      }, 40);
    }

    setMethod(m) {
      if (m !== 'cfop' && m !== 'roux') return;
      if (this.isBusy()) return;
      if (!methodAvailable(m)) { this.toast('求解器暂不支持 ' + (METHOD_LABEL[m] || m), 'warn'); return; }
      this.method = m;
      this.updateAll();
      this.toast('已选择 ' + (METHOD_LABEL[m] || m), 'info');
    }

    setSpeed(v) {
      if (!isFinite(v) || v <= 0) return;
      this.speed = v;
      if (this.dom.speed && String(v) !== this.dom.speed.value) this.dom.speed.value = String(v);
      this.toast('播放速度 ' + v + 'x', 'info');
    }

    // ---------- 3D 相关（view 为 null 时禁用） ----------
    resetCamera() {
      var v = this.view;
      if (!v || typeof v.resetCamera !== 'function') { this.toast('3D 渲染未就绪', 'warn'); return; }
      try { v.resetCamera(); } catch (e) { this.toast('重置视角失败', 'warn'); }
    }

    toggleStripeMode() {
      var v = this.view;
      if (!v || typeof v.setStripeAlignMode !== 'function') { this.toast('3D 渲染未就绪', 'warn'); return; }
      this.stripeMode = !this.stripeMode;
      try { v.setStripeAlignMode(this.stripeMode); } catch (e) { this.stripeMode = false; }
      this.syncControls();
    }

    // ---------- 拖拽联动 ----------
    onExternalMove(move) {
      if (this._destroyed) return;
      this.adoptViewState();
      // App 自己驱动的动画（演示/打乱/手动转面）也会触发 view.onMove，不能算用户拖拽
      if (this._ownMoves > 0) return;
      if (this.playing) { this.updateAll(); return; }
      if (move && move.face) this.history.push({ face: move.face, turns: move.turns || 1 });
      this.invalidatePlan('状态已改变，请重新求解');
      this.updateAll();
    }

    // ============================================================
    // 销毁
    // ============================================================
    dispose() {
      var d = doc();
      this._destroyed = true;
      this.stopPlayback(true);
      if (this._onKey && d) d.removeEventListener('keydown', this._onKey);
      var w = win();
      if (this._onResize && w) w.removeEventListener('resize', this._onResize);
      if (this._pollTimer) { clearTimeout(this._pollTimer); this._pollTimer = null; }
      if (this._toastTimer) { clearTimeout(this._toastTimer); this._toastTimer = null; }
      var D = this.dom;
      if (D.toast && D.toast.parentNode) D.toast.parentNode.removeChild(D.toast);
      if (D.app && D.app.parentNode) D.app.parentNode.removeChild(D.app);
      if (this.root && this.root.classList) this.root.classList.remove('mc-root');
      if (App.active === this) App.active = null;
      if (root.__mcApp === this) root.__mcApp = null;
      this.dom = {};
    }
  }

  App.active = null;

  // ============================================================
  // 导出
  // ============================================================
  root.App = App;
  if (typeof module !== 'undefined' && module && module.exports) module.exports = App;

</script>

<script>
(function () {
  'use strict';
  function boot() {
    var canvas = document.getElementById('gl-canvas');
    var panel = document.getElementById('panel-root');
    var state = MC.createSolved();
    var view = null;

    if (typeof CubeView === 'function') {
      try {
        view = new CubeView(canvas, { state: state });
      } catch (e) {
        console.error('[boot] CubeView 初始化失败:', e);
      }
    } else {
      console.error('[boot] 未找到 CubeView');
    }

    if (typeof App !== 'undefined' && App && typeof App.create === 'function') {
      App.create({ root: panel, canvas: canvas, view: view, state: state });
    } else {
      panel.innerHTML = '<div class="boot-error">界面模块未加载（src/ui/app.js）</div>';
    }

    window.__MC_APP__ = { state: state, view: view };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
