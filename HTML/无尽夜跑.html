const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
/* 高速物体（蛋弹丸/俯冲鸟）用前后两帧位置连成的扫掠矩形判定，防穿墙 */
function sweptEggHit(cx, cy, px, py, half, hb) {
  const minX = Math.min(px, cx) - half, maxX = Math.max(px, cx) + half;
  const minY = Math.min(py, cy) - half, maxY = Math.max(py, cy) + half;
  return aabb({ x: minX, y: minY, w: maxX - minX, h: maxY - minY }, hb);
}

function px(ctx, x, y, w, h, color, scale = 1) {
  ctx.fillStyle = color;
  const X = Math.round(x * scale), Y = Math.round(y * scale);
  const Wd = Math.max(1, Math.round(w * scale)), Hd = Math.max(1, Math.round(h * scale));
  ctx.fillRect(X, Y, Wd, Hd);
}

function drawSprite(ctx, rows, palette, x, y, scale) {
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const col = palette[row[c]];
      if (col) px(ctx, x + c, y + r, 1, 1, col, scale);
    }
  }
}

const YOSHI_PAL = {

function drawStunStars(ctx, x, y, frame, scale) {

  const pts = [[0, 0], [6, 2], [2, 6]];

    const sy = y + pts[i][1] + (i === 1 ? spin : 0);
    px(ctx, sx, sy, 2, 2, ART_PALETTE.starWarm, s);
    px(ctx, sx + 1, sy + 1, 1, 1, ART_PALETTE.eyeWhite, s);
  }
}

function drawNumber(ctx, x, y, value, scale) {
  const s = scale || 1;
  const str = String(Math.floor(value));
  let cx = x;
  for (let i = 0; i < str.length; i++) {

          px(ctx, cx + c, y + r, 1, 1, ART_PALETTE.uiText, s);
        }

    }
    cx += 5;

  return cx;
}
/* ============ FIX-V19: 8-bit 英文字体 5×7 位图（docs/美术-素材方案.md 第 12 章，50 字形；FIX-V19 补充 '/' 字形） ============ */

function tongueWorldRect(frame, mouthWX, mouthWY) {
  /* FIX-V15/V16: eat 放大图自带舌头——判定=视觉且加大：宽 200（视觉~190，覆盖舌身+舌尖）、

/* =====================================================================
 * FIX-V3: v3 参考图还原（Yoshi's Island 官方风格）——美术 Agent 提供
 * 主角 48x48 逻辑格（世界 96x96）；舌头细长波浪（150~166 世界px）；蛋白底绿斑。
 * 敌人沿用 V2 美术（v3 未重绘），背景整体替换为 v3 天堂岛（4 层视差+萤火虫保留）。
 * ===================================================================== */
/* ---- v3 背景（4 层视差 + 萤火虫保留） ---- */
function drawStarsV3(ctx, LW, LH, scroll, t, s) {
  const shift = Math.round(scroll * 0.03);
  const vx = 60 - (shift % 200), vy = Math.round(LH * 0.14);
  const v = [[0, 0], [10, 6], [20, 10], [8, 12], [18, 16], [26, 14]];
  for (let i = 0; i < v.length; i++) {
    const tw = Math.floor(t * 2 + i) % 5 === 0 ? 1 : 0;
    px(ctx, vx + v[i][0], vy + v[i][1] + tw, 2, 2, i % 2 ? '#4444ff' : '#3333aa', s);
  }
  px(ctx, vx + 10, vy + 4, 3, 3, '#66ddff', s);
  const crosses = [[LW * 0.22, LH * 0.08], [LW * 0.80, LH * 0.05], [LW * 0.55, LH * 0.20], [LW * 0.10, LH * 0.30]];
  for (let i = 0; i < crosses.length; i++) {
    const tw = Math.floor(t * 3 + i) % 4 === 0 ? 0 : 1;
    const cx = Math.round(crosses[i][0]), cy = Math.round(crosses[i][1]);
    px(ctx, cx - 2, cy, 5, 1, tw ? '#ffffff' : '#ccccff', s);
    px(ctx, cx, cy - 2, 1, 5, tw ? '#ffffff' : '#ccccff', s);
    px(ctx, cx - 1, cy - 1, 3, 3, '#ffffff', s);
  }
  for (let i = 0; i < 30; i++) {
    const sx = (i * 89 + 11 - shift) % LW;
    const sy = (i * 47 + 5) % Math.round(LH * 0.45);
    const tw = Math.floor(t * 2 + i) % 4 === 0 ? 1 : 0;
    px(ctx, sx, sy + tw, 1, 1, i % 3 === 0 ? '#ccccff' : '#8888dd', s);
  }
}

/* FIX-V3: 萤火虫层保留（世界 k=0.5），并入 v3 天空层 */
function drawFirefliesV3(ctx, LW, LH, scroll, t, s) {
  const shift = Math.round(scroll * 0.5);
  for (let i = 0; i < 14; i++) {
    const fx = ((i * 137 + 41 - shift) % LW + LW) % LW;
    const fy = Math.round(LH * (0.30 + ((i * 53) % 40) / 100)) + Math.round(Math.sin(t * 1.2 + i) * 6);
    const pulse = 0.5 + 0.5 * Math.sin(t * 3 + i * 2);
    ctx.save();
    ctx.globalAlpha = 0.25 + pulse * 0.6;
    px(ctx, fx, fy, 3, 3, ART_PALETTE.fireflyGlow, s);
    ctx.restore();
    px(ctx, fx + 1, fy + 1, 1, 1, ART_PALETTE.firefly, s);
  }
}

    const len = 6 + ((c * 13) % 10);

    px(ctx, x + c + 1, y + h - 2 + len - 3, 1, 3, '#ffcc00', s);

}

function drawGroundV3(ctx, LW, LH, scroll, s) {
  /* FIX-V3(小修): gy 0.86→0.852（≈230 逻辑），与策划地面顶世界 y=460 对齐 */
  const gy = Math.round(LH * 0.852);
  const shift = Math.round(scroll) % 24;
  const bands = ['#4d2600', '#663300', '#884400', '#663300'];
  for (let b = 0; b < bands.length; b++) px(ctx, 0, gy + b * 5, LW, 5, bands[b], s);
  px(ctx, 0, gy + 20, LW, LH - gy - 20, '#4d2600', s);
  px(ctx, 0, gy, LW, 2, '#7dd44f', s);
  for (let i = -1; i < LW / 18 + 1; i++) {
    const gx = i * 18 - (shift % 18);
    px(ctx, gx, gy - 4, 3, 4, '#00cc00', s);
    px(ctx, gx + 4, gy - 3, 2, 3, '#66cc33', s);
    if (i % 3 === 0) px(ctx, gx + 6, gy - 3, 2, 2, '#ffccff', s);
  }
}

/* v3 天堂岛背景：星群(0.03) / 云(0.07) / 蛋形岛(0.12) / 红湖+蘑菇(0.30) / 地面(1.0) */
function drawBackgroundV3(ctx, width, height, scroll, time, scale) {
  const s = scale || 1;
  const LW = Math.round(width), LH = Math.round(height);
  const W = Math.round(width * s), H = Math.round(height * s);
  const t = time || 0;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#000000');
  g.addColorStop(0.70, '#06061a');
  g.addColorStop(1.00, '#0a0a20');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  drawStarsV3(ctx, LW, LH, scroll, t, s);
  drawFirefliesV3(ctx, LW, LH, scroll, t, s);   // FIX-V3: 萤火虫并入天空层
  for (let i = 0; i < 6; i++) {
    const wx = ((i * 160 + 20 - Math.round(scroll * 0.07)) % LW + LW) % LW;
    const wy = Math.round(LH * (0.06 + (i % 4) * 0.045));
    drawCloudV3(ctx, wx, wy, 24 + (i % 3) * 10, s);
  }
  const isl = [
    [LW * 0.08, LH * 0.24, 54],
    [LW * 0.38, LH * 0.16, 78],
    [LW * 0.68, LH * 0.22, 64]
  ];
  for (let i = 0; i < isl.length; i++) {
    const ix = ((isl[i][0] - Math.round(scroll * 0.12)) % LW + LW) % LW;
    drawEggIslandV3(ctx, Math.round(ix), Math.round(isl[i][1]), isl[i][2], s);
  }
  const lx = ((LW * 0.42 - Math.round(scroll * 0.30)) % LW + LW) % LW;
  drawRedLakeV3(ctx, Math.round(lx), Math.round(LH * 0.22), 60, s);
  const mx = ((LW * 0.70 - Math.round(scroll * 0.30)) % LW + LW) % LW;
  drawMushroomV3(ctx, Math.round(mx), Math.round(LH * 0.28), s);
  drawMushroomV3(ctx, Math.round(mx + 16), Math.round(LH * 0.26), s);
  drawGroundV3(ctx, LW, LH, scroll, s);
}

/* FIX-V7: 舌头判定=视觉——与 resolveTongue 共用 tongueWorldRect（宽 150/158/166、高 9、y=嘴部-6） */
function drawYoshiTongueV6(ctx, x, y, frame, scale, worldToLogical = 1/3) {
  const s = scale || 1;
  const k = worldToLogical;
  const hb = tongueWorldRect(frame, x / k, y / k);
  const L = Math.round(hb.w * k);                    // 50/53/55 格
  const my = y - 1;                                  // 嘴部装饰中心
  const ty = Math.round(hb.y * k);                   // FIX-V9: 舌带顶=判定矩形顶（单源，判定=视觉）
  px(ctx, x - 2, my - 3, 10, 3, V6_PAL.G, s);
  px(ctx, x - 2, my, 10, 3, '#4a1018', s);
  px(ctx, x - 1, my + 3, 7, 3, V6_PAL.g, s);
  const seg = 6;
  for (let i = 0; i < L; i += seg) {
    const w = Math.min(seg, L - i);
    const wob = Math.round(Math.sin(i * 0.6 + frame) * 1);
    px(ctx, x + i, ty + wob, w, 1, '#e23b3b', s);
  }
  px(ctx, x + L, ty - 1, 2, 2, '#ffd0d0', s);
  px(ctx, x + L + 1, ty + 1, 2, 2, '#8fd45a', s);
  return { hitboxWorld: hb };
}

function drawSpikeBallV6(ctx, x, y, scale, frame = 0) {
  const s = scale || 1;
  const BX = x + 7, BY = y + 7;
  px(ctx, BX, BY, 18, 18, '#5d3f96', s);
  px(ctx, BX + 2, BY + 2, 14, 14, '#8a5fc7', s);
  px(ctx, BX + 4, BY + 4, 6, 6, '#b98fe8', s);
  const f = frame % 2;
  const spikes = [[BX+6,BY-3],[BX+18,BY+6],[BX+6,BY+18],[BX-4,BY+6],[BX+12,BY-2],[BX+19,BY+12],[BX-1,BY+12],[BX+3,BY-2]];
  for (let i = 0; i < spikes.length; i++) {
    const dx = i < 4 ? 0 : f, dy = i < 4 ? 0 : (f ? 1 : 0);
    px(ctx, spikes[i][0] + dx, spikes[i][1] + dy, 3, 3, '#efe9ff', s);
    px(ctx, spikes[i][0] + dx, spikes[i][1] + dy, 3, 1, '#ffffff', s);
  }
}

function drawSpikeHeadV6(ctx, x, y, progress, scale) {
  const s = scale || 1;
  const p = Math.max(0, Math.min(1, progress));
  const ext = Math.round(p * 16);
  px(ctx, x, y, 4, 32, '#4d3a75', s);
  px(ctx, x + 1, y, 2, 32, '#3a2b5c', s);
  if (p < 0.03) return;
  const hx = x + 4 + ext;
  px(ctx, hx, y + 8, 16, 16, '#4d3a75', s);
  px(ctx, hx + 1, y + 9, 14, 14, '#7a5fa8', s);
  px(ctx, hx + 7, y + 12, 3, 2, '#ffd94a', s);
  px(ctx, hx + 6, y + 17, 3, 2, '#2a1b4a', s);
  const spikes = [[hx+2,y+5],[hx+14,y+5],[hx-1,y+13],[hx+17,y+13],[hx+5,y+23],[hx+11,y+23]];
  for (let i = 0; i < spikes.length; i++) {
    px(ctx, spikes[i][0], spikes[i][1], 3, 3, '#efe9ff', s);
    px(ctx, spikes[i][0], spikes[i][1], 3, 1, '#ffffff', s);
  }
}

  px(ctx, x + 3, y + 3, 3, 2, '#ffffff', s);
  px(ctx, x + 4, y + 4, 2, 2, f ? '#8fd45a' : '#b5e07a', s);
  px(ctx, x + 8, y + 6, 2, 2, f ? '#b5e07a' : '#8fd45a', s);

/* FIX-V9: 1:1 主角绘制（61x71 逻辑格；scale=2 → 122x142 世界px；'B' 嘴线在行33-34/列30..46）
   x,y 为精灵左上角逻辑坐标（世界÷scale）；嘴部世界 ≈ (252, p.y-74=386) */
/* FIX-V13: 姿态精灵切换——jump→JUMP_ROWS、tongue→EAT_ROWS、throw→DROP_ROWS、其余→站姿(YOSHI_GAME_ROWS) */
function drawYoshiGame(ctx, x, y, frame, state, scale) {
  const s = scale || 1;
  const runBob = state === 'run' ? (frame % 2 === 0 ? 0 : -1) : 0;   // run 2 帧垂直浮动 ±1
  const jumpLift = state === 'jump' ? -1 : 0;                         // jump 上浮 1 格（物理不变）
  const by = y + runBob + jumpLift;
  /* FIX-V15: 站姿按蛋数切换（eggCount>0 带蛋版 95x95 / eggCount==0 noegg 80x95）；
     eat 为完整图 158x55 自带舌头，不再程序叠加长舌（避免双舌） */
  let rows = YOSHI_GAME_ROWS;
  if (state === 'jump') rows = JUMP_ROWS;
  else if (state === 'tongue') rows = EAT_ROWS;
  else if (state === 'throw') rows = DROP_ROWS;
  else if (player.eggCount === 0) rows = YOSHI_GAME_ROWS_NOEGG;
  drawSprite(ctx, rows, YOSHI_GAME_PAL, x, by, s);
  if (state === 'stun') {
    drawStunStars(ctx, x + 40, y - 8, frame, s);
  }
}

/* ============ FIX-V17: 黄昏/晨光背景（美术方案第 11 章，签名与 drawBackgroundV3 一致） ============ */
function drawHillsLayer(ctx, LW, LH, scroll, parallax, color, baseY, peak, seed, scale) {
  const s = scale || 1;
  const shift = Math.round(scroll * parallax);
  const span = LW / 64 + 3;
  for (let i = -2; i < span; i++) {
    const hx = i * 64 + seed - shift;
    const h = peak + ((i * 31 + seed) % 13);
    for (let c = 0; c < 64; c++) {
      const hh = Math.max(0, Math.round(h - Math.abs(c - 32) * 0.7));
      if (hh > 0) px(ctx, hx + c, Math.round(baseY) - hh, 1, hh, color, s);
    }
  }
}

  px(ctx, 0, gy, LW, LH - gy, '#2a3a28', s);
  px(ctx, 0, gy, LW, 3, '#8ab86a', s);
  px(ctx, 0, gy + 3, LW, 2, '#4a6a3a', s);
  for (let i = 0; i < LW; i += 12) {
    const gx = ((i - Math.round(scroll)) % LW + LW) % LW;
    px(ctx, gx, gy + 5 + ((i * 7) % 5), 4, 1, '#1a2418', s);
  }
  for (let i = 0; i < 10; i++) {
    const dx = ((i * 97 + 13 - Math.round(scroll)) % LW + LW) % LW;
    const dy = gy + 3 + ((i * 23) % 8);
    const tw = Math.floor(t * 2 + i) % 4 === 0 ? 0 : 1;
    px(ctx, dx, dy + tw, 1, 1, i % 2 === 0 ? '#ffffff' : '#d8f0ff', s);
  }
}

}

let muted = false;                  // FIX-V19: 全局静音（M 键切换 + cookie yoshi_mute）
const sfxCache = {};                // FIX-V19: 按 key 缓存 Audio 实例（data URI）
/* FIX-V19: BGM 接口占位——用户后续提供 BGM 文件时填入（如 main:'data:audio/mpeg;base64,...'）并实现循环 */
const SFX_BGM = {};
function playBgm() { /* FIX-V19: BGM 占位（待 BGM 素材） */ }
function stopBgm() { /* FIX-V19: BGM 占位（待 BGM 素材） */ }
/* FIX-V19: 播放音效——缓存实例、播放前 currentTime=0 归零重播（并发可自行克隆）；try/catch 容错 */
function playSfx(key) {
  if (muted) return;
  try {
    if (typeof Audio === 'undefined') return;
    let a = sfxCache[key];
    if (!a) { a = new Audio('data:audio/mpeg;base64,' + (SOUND_B64[key] || '')); sfxCache[key] = a; }
    a.currentTime = 0;
    const p = a.play();
    if (p && typeof p.catch === 'function') p.catch(function () {});
  } catch (e) { /* 无 Audio 环境静默 */ }
}


function readCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function writeCookie(name, value) {
  document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=31536000; path=/';
}
function loadPrefs() {
  const d = readCookie('yoshi_dif'); if (DIFFICULTIES[d]) difficulty = d;
  const b = readCookie('yoshi_bg');  if (BG_LIST.indexOf(b) >= 0) bgSel = b;
  const bs = parseInt(readCookie('yoshi_best') || '0', 10);
  if (!isNaN(bs)) best = Math.max(0, bs);
  if (readCookie('yoshi_mute') === '1') muted = true;   // FIX-V19: 静音偏好
}
function diff() { return DIFFICULTIES[difficulty]; }
function updateBest() {
  /* FIX-V18: 破纪录 → 写 cookie + NEW BEST；未破纪录 → 清除 newBest（NEW BEST 仅对真正破纪录的这局显示） */
  if (Math.floor(score) > best) { best = Math.floor(score); writeCookie('yoshi_best', best); newBest = true; }
  else newBest = false;
}

function resetPlayer() {
  player = {
    x: PLAYER_X, y: GROUND_Y, vy: 0,
    state: 'RUN', stateTimer: 0,
    eggCount: 0,
    jumpHeld: false, jumpPressed: false, tonguePressed: false, throwPressed: false,
    jumpBuffer: 0, jumpStartTime: 0, jumpCutUsed: false,
    inAir: false, landed: false,
    airTongue: false, airSwallow: false,          // FIX-V3: 空中伸舌/空中吞食标志
    jumpReleasedInAir: false,                      // FIX-V4-P2-1: 空中舌/空中吞食期间已松键（回 JUMP 补衰减）
    invincible: false
  };
}

function startJump() {
  const p = player;
  p.state = 'JUMP'; p.stateTimer = 0;
  p.vy = -JUMP_LONG;                  // FIX-P0-1: y 向下为正，起跳初速向上必须为负
  p.jumpStartTime = animTime;
  p.jumpCutUsed = false;
  p.invincible = false;
  playSfx('jump');                    // FIX-V19: 跳跃音效
}

/* FIX-V4-P2-1: 跳跃松键处理（短按 0.15s→-JUMP_SHORT / 上升段 vy*=JUMP_CUT），keyup 与
   空中舌/空中吞食回 JUMP 瞬间共用，保证手感与直接跳跃一致 */
function applyJumpCut() {
  const p = player;
  if (p.jumpCutUsed) return;
  p.jumpCutUsed = true;
  if (animTime - p.jumpStartTime < JUMP_WINDOW) p.vy = -JUMP_SHORT;
  else if (p.vy < 0) p.vy *= JUMP_CUT;
  /* FIX-P2-9: 短按高度随 0~0.15s 松键时刻连续变化（约 65~176px），规格"≈65px"对应起跳瞬间即松 */
}

function land() {
  const p = player;
  if (p.jumpBuffer > 0) { p.jumpBuffer = 0; startJump(); }
  else p.state = 'RUN';
}

function startThrow() {
  const p = player;
  /* FIX-V3: 空中判定：JUMP / 空中舌 / 空中吞食均可空中投蛋（保留 vy） */
  const wasAir = (p.state === 'JUMP') || (p.state === 'TONGUE' && p.airTongue) || (p.state === 'SWALLOW_STUN' && p.airSwallow);
  p.eggCount--;
  p.state = 'THROW'; p.stateTimer = 0;
  p.invincible = false;
  p.inAir = wasAir; p.landed = false;
  if (!wasAir) p.vy = 0;
  /* 发射位置：主角中心 + (40,-10)；主角世界 x = PLAYER_X + scroll */
  /* FIX-V2: 发射位置=主角判定盒中心(228,p.y-25)+(40,-10) → (268,p.y-35)；蛋网格 32 世界px */
  /* FIX-V10/V12: 发射位 = v8 判定盒中心(250, p.y-43) + (40,-10) → (290, p.y-53)；
     蛋弧穿越地面刺刺球判定带(388..466)——P1-1 不回退；蛋网格 36 世界px */
  const cx = PLAYER_X + scroll + 50, cy = p.y - 53;
  /* FIX-P1-1/P2-3: 蛋屏幕水平速度固定 430 → 世界速度 = 430 + speed */
  /* FIX-P1-1(偏差说明): v6 蛋判定 33x36 下垂直初速 -360→-235（弧高 15px）使 rel400 地面球可命中 */
  eggs.push({ x: cx - 18, y: cy - 18, vx: EGG_VX + speed, vy: EGG_VY + 125, life: EGG_LIFE });
  playSfx('dropEgg');                 // FIX-V19: 扔蛋音效
}

function handleInput() {
  const p = player;
  if (p.throwPressed) {
    p.throwPressed = false;
    if (p.eggCount > 0 && p.state !== 'THROW') {
      startThrow();
      p.jumpPressed = false; p.tonguePressed = false;
      return;
    }
    if (p.eggCount === 0) shakeTimer = 0.1; // P2-8: 空弹仅抖动反馈，无"咔"音效（可选 WebAudio 未做）
  }
  if (p.jumpPressed) {
    p.jumpPressed = false;
    if (p.state === 'RUN') startJump();
    /* FIX-V4-P2-2: 空中舌/空中吞食中按跳跃键也记入缓冲（与空中扔蛋对齐），落地后自动连跳 */
    else if (p.state === 'JUMP' || (p.state === 'THROW' && p.inAir) ||
             (p.state === 'TONGUE' && p.airTongue) || (p.state === 'SWALLOW_STUN' && p.airSwallow)) p.jumpBuffer = JUMP_BUFFER;
    p.tonguePressed = false;
    return;
  }
  if (p.tonguePressed) {
    p.tonguePressed = false;
    if (p.state === 'RUN') { p.state = 'TONGUE'; p.stateTimer = 0; playSfx('eat'); }          // FIX-V19: 伸舌音效
    else if (p.state === 'JUMP') { p.state = 'TONGUE'; p.stateTimer = 0; p.airTongue = true; playSfx('eat'); } // FIX-V3: 空中伸舌（保留 vy/重力）+ FIX-V19 音效
  }
}

    if (p.y >= GROUND_Y && p.vy > 0) {
      p.y = GROUND_Y; p.vy = 0;
      if (p.state === 'JUMP') land();
      else if (p.state === 'TONGUE') {          // FIX-V3: 空中舌落地 → 提前结束回 RUN
        p.jumpReleasedInAir = false;            // FIX-V4-P2-1: 已落地无需补衰减
        if (p.jumpBuffer > 0) { p.jumpBuffer = 0; p.airTongue = false; startJump(); } // FIX-V4-P2-2: 落地自动连跳
        else { p.state = 'RUN'; p.airTongue = false; p.stateTimer = 0; }
      } else if (p.state === 'SWALLOW_STUN') {  // FIX-V3: 空中吞食落地 → 硬直剩余计时继续
        p.airSwallow = false;
      } else { p.landed = true; }               // THROW inAir
    }
  }
  if (p.state === 'TONGUE' && p.stateTimer >= TONGUE_DUR) {
    if (p.airTongue) {
      p.state = 'JUMP'; p.stateTimer = 0;       // FIX-V3: 空中舌结束回 JUMP（继续下落）
      if (p.jumpReleasedInAir) { p.jumpReleasedInAir = false; applyJumpCut(); } // FIX-V4-P2-1: 补一次松键衰减
    } else p.state = 'RUN';
    p.airTongue = false;
  }
  if (p.state === 'SWALLOW_STUN' && p.stateTimer >= STUN_DUR) {
    p.invincible = false;
    if (p.airSwallow) {
      p.state = 'JUMP'; p.stateTimer = 0;       // FIX-V3: 空中硬直结束回 JUMP
      if (p.jumpReleasedInAir) { p.jumpReleasedInAir = false; applyJumpCut(); } // FIX-V4-P2-1: 补一次松键衰减
    } else {
      p.state = 'RUN';
      p.jumpReleasedInAir = false;              // FIX-V4-P2-1: 落地回 RUN，无需补衰减
    }
    p.airSwallow = false;
  }
  if (p.state === 'THROW' && p.stateTimer >= THROW_DUR) {
    if (p.inAir && !p.landed) { p.state = 'JUMP'; p.stateTimer = 0; }
    else {
      if (p.jumpBuffer > 0) { p.jumpBuffer = 0; startJump(); }
      else { p.state = 'RUN'; p.inAir = false; p.landed = false; }
    }
  }
}

function die() {
  playSfx('gameOver');                // FIX-V19: 死亡音效
  player.state = 'DEAD'; player.stateTimer = 0;
  deathTimer = 0; gameOverShown = false;
  gameState = 'DEAD'; // FIX-V17: 顶层进入死亡动画
}

/* ============================ 3. 敌人与生成 ============================ */
function enemyHitbox(e) {
  /* FIX-V7: 判定盒 = v6 表 9.4 +10% ×3（32 逻辑格 → 世界px）：
     嘿呵 (3,6,24,20)→(9,18,72,60)；鸟 (2,7,26,16)→(6,21,78,48)；
     球 (3,4,28,26)→(9,12,84,78)；刺头 (0,5,32,26)→(0,15,96,78) 随 progress 从右墙展开；
     蛋 (1,1,11,12)→(3,3,33,36) */
  if (e.type === 'shy')  return { x: e.x + 9,  y: e.y + 18, w: 72, h: 60 };
  if (e.type === 'bird') return { x: e.x + 6,  y: e.y + 21, w: 78, h: 48 };
  if (e.type === 'ball') return { x: e.x + 9,  y: e.y + 12, w: 84, h: 78 };
  if (e.type === 'head') {
    if (!e.active) return null;
    const wallX = e.wallX || (e.x + 96);       // 生成时锁定的右墙世界坐标
    return { x: wallX - 96 * e.progress, y: e.y + 15, w: 96 * e.progress, h: 78 };
  }
  return null;
}

function removeEnemyAt(i) {
  const e = enemies[i];
  if (e && e.type === 'bird' && e.mode === 'dive') activeDives = Math.max(0, activeDives - 1);
  if (i >= 0) enemies.splice(i, 1);
}

function randomDiveInterval() {
  const D = diff(); const base = clamp(D.diveMax - D.diveK * t, D.diveMin, D.diveMax); // FIX-V17: 按难度
  return base * rand(0.7, 1.3);
}

function birdShouldDive(e) {
  /* FIX-V2: v2 鸟中心 x+48、判定盒底 e.y+58；玩家头顶 = 判定盒顶 (GROUND_Y-50) */
  const dist = Math.abs((e.x + 48) - (PLAYER_X + scroll));
  if (dist > 180) return false;
  const bottom = e.y + 69; // FIX-V7: v6 鸟判定盒底
  const headTop = playerHitbox().y; // FIX-V3: 当前姿态的判定盒顶（跳跃时更高）
  return bottom <= headTop - 40 && bottom >= headTop - 320;
}

function startDivePhysics(e) {
  e.mode = 'dive';
  activeDives++;
  e.diveTx = PLAYER_X + scroll;                 // 锁定触发瞬间的主角世界 x
  /* FIX-P2-4: 俯冲目标夹到地面顶（鸟中心=460-24，鸟底贴地，不再钻地） */
  const tx = e.diveTx, ty = GROUND_Y - 24;
  const dx = tx - (e.x + 48), dy = ty - (e.y + 36);   // FIX-V7: v6 鸟中心 (x+48, y+36)
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  e.vx = 620 * dx / len;
  e.vy = 620 * dy / len;
}

function beginDive(e) {
  e.randTimer = randomDiveInterval();
  if (activeDives >= 2) { e.mode = 'pending'; e.pendingTimer = 0.4; }
  else startDivePhysics(e);
}

function endDive(e) {
  if (e.mode === 'dive') activeDives = Math.max(0, activeDives - 1);
  e.mode = 'sine';
  e.checkTimer = 0.5;
  e.randTimer = randomDiveInterval();
}

function updateBird(e, dt) {
  if (e.mode === 'sine') {
    e.x -= 80 * dt;
    e.y = e.baseY + 90 * Math.sin(Math.PI * 2 * (e.spawnX - e.x) / 240);
    e.checkTimer -= dt;
    e.randTimer -= dt;
    if (e.checkTimer <= 0) { e.checkTimer = 0.5; if (birdShouldDive(e)) { beginDive(e); return; } }
    if (e.randTimer <= 0) beginDive(e);
  } else if (e.mode === 'pending') {
    e.x -= 80 * dt;
    e.y = e.baseY + 90 * Math.sin(Math.PI * 2 * (e.spawnX - e.x) / 240);
    e.pendingTimer -= dt;
    if (e.pendingTimer <= 0) startDivePhysics(e); // FIX-P2-11: 0.4s 后强制进入俯冲（接受短暂>2 并发）
  } else if (e.mode === 'dive') {
    const tx = e.diveTx, ty = GROUND_Y - 24;   // FIX-P2-4
    const pdx = tx - (e.x + 48), pdy = ty - (e.y + 36);   // FIX-V7: v6 鸟中心
    const dPrev = Math.sqrt(pdx * pdx + pdy * pdy);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (e.y + 66 >= GROUND_Y) { endDive(e); return; } // FIX-V7: v6 鸟可见底 y+66
    const dx = tx - (e.x + 48), dy = ty - (e.y + 36);
    const dNow = Math.sqrt(dx * dx + dy * dy);
    if (dNow > dPrev + 1 || dNow < 10) endDive(e);
  }
}

function updateHead(e, dt) {
  e.phaseTimer -= dt;
  if (e.phase === 'retract') {
    e.progress = Math.max(0, e.phaseTimer / 1.2);
    e.active = false;
    if (e.phaseTimer <= 0) { e.phase = 'extend'; e.phaseTimer = 0.8; }
  } else {
    e.progress = Math.max(0, 1 - e.phaseTimer / 0.8);
    e.active = (0.8 - e.phaseTimer) >= 0.05;
    if (e.phaseTimer <= 0) { e.phase = 'retract'; e.phaseTimer = 1.2; e.active = false; }
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.type === 'shy') e.x -= 90 * dt;
    else if (e.type === 'bird') updateBird(e, dt);
    else if (e.type === 'head') updateHead(e, dt);
    if (e.x + e.w - scroll < 0) {
      if (e.type === 'bird' && e.mode === 'dive') activeDives = Math.max(0, activeDives - 1);
      enemies.splice(i, 1);
    }
  }
}

function spawnInterval() { const D = diff(); return clamp(D.spawnMax - D.spawnK * t, D.spawnMin, D.spawnMax); } // FIX-V17: 按难度

function pickEnemyType() {
  /* FIX-V17: 按难度取最早出现时间与权重 */
  const D = diff(), m = D.minTimes, w = D.weights;
  const opts = [];
  if (t >= m[0]) opts.push(['shy', w[0]]);
  if (t >= m[1]) opts.push(['bird', w[1]]);
  if (t >= m[2]) opts.push(['ball', w[2]]);
  if (t >= m[3]) opts.push(['head', w[3]]);
  if (!opts.length) return null;
  let total = 0; opts.forEach(o => total += o[1]);
  let r = Math.random() * total;
  for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
  return opts[opts.length - 1][0];
}

function sameTypeNear(type) {
  return enemies.some(e => e.type === type && Math.abs(e.x - (scroll + SPAWN_X)) < 200);
}

function spawnEnemy(type) {
  if (type === 'shy') {
    /* FIX-V2: v2 嘿呵 48x48 格=96 世界px；可见脚底 y+32 逻辑=64 世界 → 顶 396 贴地 */
    /* FIX-V7: v6 嘿呵 32x32 格=96 世界px；可见底 25 逻辑(75 世界) → 顶 385 贴地 */
    enemies.push({ type: 'shy', x: scroll + SPAWN_X, y: GROUND_Y - 75, w: 96, h: 96 });
  } else if (type === 'bird') {
    const baseY = rand(240, 360);                                    // 正弦基线（网格顶）
    enemies.push({
      type: 'bird', x: scroll + SPAWN_X, y: baseY, w: 96, h: 72,     // FIX-V7: 32x24 格=96x72 世界
      baseY: baseY, spawnX: scroll + SPAWN_X, mode: 'sine',
      checkTimer: 0.5, randTimer: randomDiveInterval(),
      vx: 0, vy: 0, pendingTimer: 0
    });
  } else if (type === 'ball') {
    if (Math.random() < 0.5) {
      /* 地面型：v2 球可见底 y+40 逻辑=80 世界 → 顶 380 贴地 */
      /* 地面型：v6 球可见底 28 逻辑(84 世界) → 顶 376 贴地 */
      enemies.push({ type: 'ball', x: scroll + SPAWN_X, y: GROUND_Y - 84, w: 96, h: 96 });
    } else {
      /* 墙面型：网格右缘贴右墙 */
      enemies.push({ type: 'ball', x: scroll + WORLD_W - 96, y: rand(120, 370), w: 96, h: 96 });
    }
  } else if (type === 'head') {
    const hasGroundBall = enemies.some(e => e.type === 'ball' && e.y === GROUND_Y - 84);
    /* FIX-V7: v6 刺头 32x32 格=96 世界px、墙在右缘；判定底 y+93 → 避开地面球 */
    const bodyY = Math.random() * (hasGroundBall ? 290 : 360);
    enemies.push({
      type: 'head', x: scroll + WORLD_W - 96, y: bodyY, w: 96, h: 96, wallX: scroll + WORLD_W,
      phase: 'retract', phaseTimer: 1.2, progress: 0, active: false
    });
  }
}

function updateSpawn(dt) {
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  const type = pickEnemyType();
  if (!type) { spawnTimer = Math.max(0.05, 3 - t); return; } // FIX-P1-2: 未解锁时短重试，首敌≈3s
  /* FIX-P2-5: 刺头贴同一面墙、水平间距恒<200px，规格 200px 规则等价于同屏仅 1 个 */
  if (type === 'head' && enemies.some(e => e.type === 'head')) { spawnTimer = spawnInterval(); return; }
  if (sameTypeNear(type)) { spawnTimer = 0.5; return; }
  spawnEnemy(type);
  spawnTimer = spawnInterval();
}

/* ============================ 4. 蛋系统 ============================ */
function updateEggs(dt) {
  for (let i = eggs.length - 1; i >= 0; i--) {
    const e = eggs[i];
    const px0 = e.x + 18, py0 = e.y + 18;         // FIX-V7: v6 蛋 36 世界px，中心 +18
    e.vy += EGG_G * dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.life -= dt;
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const hb = enemyHitbox(enemies[j]);
      if (hb && sweptEggHit(e.x + 18, e.y + 18, px0, py0, 17, hb)) {   // FIX-V7: 判定 33x36 → 半宽 17
        removeEnemyAt(j);
        hit = true;
        playSfx('enemyDied');         // FIX-V19: 蛋消灭敌人音效
        break;
      }
    }
    if (hit) { eggs.splice(i, 1); continue; }
    if (e.life <= 0 || e.y + 39 >= GROUND_Y || e.x < scroll || e.x + 36 > scroll + WORLD_W || e.y < 0) { // FIX-V7: 36px 边界
      eggs.splice(i, 1);
    }
  }
}

function resolveTongue() {
  const p = player;
  if (p.state !== 'TONGUE') return;
  const tt = p.stateTimer;
  if (tt < TONGUE_ACTIVE_START || tt > TONGUE_ACTIVE_END) return;
  /* FIX-V2-P2A/V5/V13: 判定矩形复用 tongueWorldRect（判定=视觉，单源）。
     FIX-V13: 起点——地面 TONGUE 用 eat 舌根 (248,428)；空中舌(airTongue)用站姿嘴 (256,420) 近似 */
  const tf = tt < 0.10 ? 0 : (tt < 0.25 ? 1 : 2);
  const mx = p.airTongue ? MOUTH_WX : MOUTH_EAT_WX;
  const myOff = p.airTongue ? MOUTH_WY_OFF : MOUTH_EAT_WY_OFF;
  const rect = tongueWorldRect(tf, mx + scroll, p.y - myOff);
  let best = null;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.type !== 'shy' && e.type !== 'bird') continue;
    const hb = enemyHitbox(e);
    if (hb && aabb(rect, hb)) { if (!best || e.x < best.x) best = e; }
  }
  if (best) {
    removeEnemyAt(enemies.indexOf(best));
    p.eggCount = Math.min(EGG_MAX, p.eggCount + 1);
    p.state = 'SWALLOW_STUN'; p.stateTimer = 0;
    p.invincible = true;
    /* FIX-V3: 空中吞食 → 保留重力继续下落；落地后硬直剩余计时继续 */
    p.airSwallow = p.airTongue;
    p.airTongue = false;
  }
}

/* FIX-V12/V13: 判定盒——
   站姿/舌/扔蛋/其余 (212, p.y-86, 76, 86)（高-10% 底对齐、宽-20% 背面缩、正面 288）；
   jump 按 jump 精灵可见盒 (0,0,65,68)：高-10%（68→61，底对齐 460 y=p.y-61）、宽-20%（65→52，
   背面缩 13 → 左缘=精灵左 208+13=221）、正面右缘=精灵右 273 保持 */
function playerHitbox() {
  const p = player;
  /* FIX-V14/V15: JUMP 93x95 → (212, p.y-86, 74, 86)；THROW 64x94 → (221, p.y-85, 51, 85)；
     带蛋站姿/TONGUE (212, p.y-86, 76, 86)；noegg 站姿 80x95 → (216, p.y-86, 64, 86)（宽-20% 背缩16）；
     TONGUE 沿用对应站姿盒；全部底部对齐 460 */
  if (p.state === 'JUMP')  return { x: PLAYER_X + scroll - 28, y: p.y - 86, w: 74, h: 86 };
  if (p.state === 'THROW') return { x: PLAYER_X + scroll - 19, y: p.y - 85, w: 51, h: 85 };
  if (p.eggCount === 0)    return { x: PLAYER_X + scroll - 24, y: p.y - 86, w: 64, h: 86 };
  return { x: PLAYER_X + scroll - 28, y: p.y - 86, w: 76, h: 86 };
}

function resolveBodyCollision() {
  const p = player;
  if (p.state === 'DEAD' || p.invincible) return;
  const pb = playerHitbox(); // FIX-V3: 姿态判定盒
  for (const e of enemies) {
    const hb = enemyHitbox(e);
    if (hb && aabb(pb, hb)) { die(); return; }
  }
}

/* ============================ 5. 主循环与更新 ============================ */
function update(dt) {
  /* FIX-V17: 顶层状态机 START / RUN / DEAD / GAMEOVER */
  if (gameState === 'START') { animTime += dt; scroll += 40 * dt; return; }   // 开始界面预览慢滚动
  if (gameState === 'DEAD') {
    animTime += dt;
    deathTimer += dt;
    if (deathTimer >= 0.6) { gameState = 'GAMEOVER'; gameOverShown = true; updateBest(); }
    return;
  }
  if (gameState === 'GAMEOVER') return;
  t += dt; animTime += dt;
  const D = diff();
  speed = clamp(D.V0 + D.ACC * t, D.V0, D.VMAX);
  score += speed * dt;

  handleInput();
  updatePlayer(dt);
  if (player.state === 'SWALLOW_STUN') {
    /* FIX-P2-6: 吞食硬直=世界完全静止：敌人/蛋/生成全部冻结，仅硬直计时继续 */
    if (shakeTimer > 0) shakeTimer -= dt;
    return;
  }
  updateEggs(dt);
  resolveTongue();
  updateEnemies(dt);
  updateSpawn(dt);
  resolveBodyCollision();

  let factor = 1;
  if (player.state === 'JUMP' || player.state === 'TONGUE' || player.state === 'THROW') factor = ACTION_DECEL;
  else if (player.state === 'SWALLOW_STUN' || player.state === 'DEAD') factor = 0;
  scroll += speed * factor * dt;

  if (shakeTimer > 0) shakeTimer -= dt;
}

/* ============================ 6. 渲染 ============================ */
function artState() {
  switch (player.state) {
    case 'RUN': return 'run';
    case 'JUMP': return 'jump';
    case 'TONGUE': return 'tongue';
    case 'SWALLOW_STUN': return 'swallow';
    case 'THROW': return 'throw';
    case 'DEAD': return 'stun'; // FIX-P2-7: 死亡姿态为占位（红闪+星星），躺平/闭眼帧成本低可后续补
  }
  return 'idle';
}

function playerFrame() {
  const s = player.state;
  if (s === 'RUN') return Math.floor(animTime * 12) % 6;
  if (s === 'TONGUE') return player.stateTimer < 0.10 ? 0 : (player.stateTimer < 0.25 ? 1 : 2);
  if (s === 'SWALLOW_STUN') return Math.floor(animTime * 10) % 3;
  if (s === 'THROW') return Math.floor(animTime * 10) % 3;
  if (s === 'DEAD') return Math.floor(animTime * 4) % 2;
  return 0;
}

function drawPlayer() {
  const p = player;
  /* FIX-V13: 姿态精灵与锚点（脚底 460、中心 240）：
     站姿 95x95 左 193/顶 365；eat 17x64 左 232/顶 396；drop 52x76 左 214/顶 384；jump 65x68 左 208/顶 392 */
  /* FIX-V15: 锚点（脚底 460、中心 240）：带蛋站姿 95x95 左193/顶365；noegg 80x95 左200/顶365；
     JUMP 93x95 左193/顶365；TONGUE eat 158x55（身体中心≈240）左226/顶405；THROW 64x94 左208/顶366 */
  let left = p.x - 47.5, top = p.y - 95;
  if (p.state === 'JUMP') { left = p.x - 47; top = p.y - 95; }
  else if (p.state === 'TONGUE') { left = p.x - 24; top = p.y - 94; } // FIX-V16: eat 269x94 左216/顶366
  else if (p.state === 'THROW') { left = p.x - 32; top = p.y - 94; }
  else if (p.eggCount === 0) { left = p.x - 40; top = p.y - 95; }
  drawYoshiGame(ctx, left, top, playerFrame(), artState(), 1);
}


function drawEnemy(e) {
  /* FIX-P0-2 保留：渲染=世界-scroll 与碰撞同坐标系；FIX-V8-P0: v6 敌人传逻辑坐标（世界÷3），px 内 ×3 还原；刺头柱/镜像用物理坐标 */
  const sx = (e.x - scroll) / 3;
  const sy = e.y / 3;
  if (e.type === 'shy') {
    drawShyGuyV6(ctx, sx, sy, Math.floor(animTime * 8) % 4, 3);          // FIX-V7
  } else if (e.type === 'bird') {
    const n = e.mode === 'dive' ? 2 : 4;
    drawBirdV6(ctx, sx, sy, Math.floor(animTime * 12) % n, e.mode === 'dive', 3); // FIX-V7
  } else if (e.type === 'ball') {
    drawSpikeBallV6(ctx, sx, sy, 3, Math.floor(animTime * 8) % 2);       // FIX-V7
  } else if (e.type === 'head') {
    /* FIX-V7: 刺头判定盒 (0,15,96,78) 世界随 progress 从右墙展开；画对应柱体(32x26逻辑) + v6 头精灵镜像 */
    const p = e.progress;
    const wallSX = e.wallX - scroll;                // 物理（画布）坐标
    px(ctx, wallSX - 96 * p, e.y + 15, 96 * p, 78, '#4d3a75', 1);
    px(ctx, wallSX - 96 * p + 3, e.y + 16, Math.max(0, 96 * p - 6), 76, '#3a2b5c', 1);
    ctx.save();
    ctx.translate(wallSX, 0);                       // 镜像：墙在右、头向左伸
    ctx.scale(-1, 1);
    drawSpikeHeadV6(ctx, 0, e.y / 3, e.progress, 3); // FIX-V8-P0: 逻辑 y（世界÷3）
    ctx.restore();
  }
}

function render() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(Math.round((Math.random() * 2 - 1) * 6), Math.round((Math.random() * 2 - 1) * 6)); // FIX-V7: 960 空间抖动 ×2
  }
  drawSelectedBackground(); // FIX-V17: 三套背景按选择渲染
  const sorted = enemies.slice().sort((a, b) => a.x - b.x);
  for (const e of sorted) drawEnemy(e);
  for (const eg of eggs) drawEggV6(ctx, (eg.x - scroll) / 3, eg.y / 3, Math.floor(animTime * 8) % 2, 3); // FIX-V8-P0: 逻辑坐标（世界÷3）
  drawPlayer();
  ctx.restore();

  drawUI();
}

/* ============================ 8. UI ============================ */
function drawNumberStr(ctx, x, y, str, scale) {
  const s = scale || 1;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const rows = FONT_DIGITS[str[i]] || FONT_DIGITS['0'];
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) {
        if (rows[r][c] === '1') {
          px(ctx, cx + c, y + r + 1, 1, 1, ART_PALETTE.uiShadow, s);
          px(ctx, cx + c, y + r, 1, 1, ART_PALETTE.uiText, s);
        }
      }
    }
    cx += 5;
  }
  return cx;
}


/* ============ FIX-V19: drawText8bit 文本绘制（5×7 位图，docs 第 12 章） ============ */
function text8width(text, scale) {
  const s = scale || 1;
  let w = 0;
  for (const ch of String(text)) w += (ch === ' ') ? 4 : 6;
  return w * s;
}
function drawText8bit(ctx, x, y, text, scale, color, lineHeight) {
  const s = scale || 1;
  const col = color || '#ffffff';
  const lh = lineHeight || 9;
  let cx = Math.round(x), cy = Math.round(y);
  for (const ch of String(text)) {
    if (ch === '\n') { cx = Math.round(x); cy += lh; continue; }
    const glyph = FONT_8BIT[ch] || FONT_8BIT[' '];
    for (let r = 0; r < 7; r++) {
      const row = glyph[r];
      for (let c = 0; c < 5; c++) {
        if (row[c] === '1') px(ctx, cx + c, cy + r, 1, 1, col, s);
      }
    }
    cx += (ch === ' ') ? 4 : 6;
  }
  return { nextX: cx, nextY: cy + lh };
}
/* FIX-V19: 按 scale 的逻辑画布宽度水平居中 */
function drawText8center(ctx, y, text, scale, color) {
  const s = scale || 1;
  const x = (WORLD_W / s - text8width(text, 1)) / 2;
  return drawText8bit(ctx, x, y, text, s, color);
}
/* FIX-V19: 居中绘制多段文本（当前项可高亮，段间用 nextX 衔接） */
function drawText8line(ctx, y, segs, scale) {
  const s = scale || 1;
  let total = 0;
  for (const sg of segs) total += text8width(sg.text, 1);
  let cx = (WORLD_W / s - total) / 2;
  for (const sg of segs) { const r = drawText8bit(ctx, cx, y, sg.text, s, sg.color); cx = r.nextX; }
  return cx;
}

function drawUI() {
  /* FIX-V17: 开始界面独立面板 */
  if (gameState === 'START') { drawStartPanel(); return; }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  /* FIX-V19: HUD 英文 8-bit；数字沿用 drawNumberStr */
  drawText8bit(ctx, 32, 32, 'SCORE', 1, '#ffffff');
  drawNumberStr(ctx, 64, 9, String(Math.floor(score)).padStart(6, '0'), 2); // FIX-V8-P0: 480 逻辑空间 ×2 → 物理
  drawText8bit(ctx, 32, 56, 'HI-SCORE ' + best, 1, '#ffe9b0');
  drawText8bit(ctx, 32, 80, 'SPD ' + Math.round(speed), 1, '#ffffff');

  const n = player.eggCount;
  const iconX = 960 - 32 - 37 * n;                                  // FIX-V7: v6 蛋图标 36px + 1 间距（960 空间）
  for (let i = 0; i < n; i++) drawEggV6(ctx, (iconX + i * 37) / 3, 16 / 3, Math.floor(animTime * 8) % 2, 3); // FIX-V8-P0: 物理坐标÷3 → px×3 还原
  drawText8bit(ctx, iconX - 42, 16, 'EGG ×' + n, 1, '#ffffff');     // FIX-V19: 8-bit EGG ×n

  drawText8bit(ctx, 16, 524, 'SPACE/↑ JUMP · Z/J TONGUE · X/K EGG · P PAUSE · M MUTE · R RESTART', 1, 'rgba(255,255,255,0.55)');

  if (gameState === 'DEAD') {
    ctx.fillStyle = 'rgba(255,60,60,' + (0.45 * (1 - deathTimer / 0.6)).toFixed(3) + ')';
    ctx.fillRect(0, 0, 960, 540);
  }
  if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 960, 540);
    /* FIX-V19: GAME OVER 英文 8-bit */
    drawText8center(ctx, 55, 'GAME OVER', 4, '#ffffff');
    drawText8center(ctx, 152, 'SCORE ' + Math.floor(score), 2, '#ffe9b0');
    drawText8center(ctx, 178, 'HI-SCORE ' + best, 2, '#ffffff');
    if (newBest) drawText8center(ctx, 202, 'NEW BEST!', 2, '#7dff7d');
    drawText8center(ctx, 445, 'PRESS R MENU · SPACE RESTART', 1, '#ffffff');
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, 960, 540);
    /* FIX-V19: PAUSED 英文 8-bit */
    drawText8center(ctx, 80, 'PAUSED', 3, '#ffffff');
    drawText8center(ctx, 160, 'PRESS P TO RESUME', 2, '#ffffff');
  }
}

/* FIX-V19: 开始界面面板（经典 8-bit 英文；PRESS START 0.5s 闪烁；难度/背景当前项高亮） */
function drawStartPanel() {
  ctx.fillStyle = 'rgba(6,8,24,0.72)';
  ctx.fillRect(180, 50, 600, 440);
  const on = Math.floor(animTime * 2) % 2 === 0;   // FIX-V19: 0.5s 周期明暗
  drawText8center(ctx, 18, 'YOSHI NIGHT RUN', 4, '#ffe9b0');
  drawText8center(ctx, 258, 'SPACE/↑ JUMP · Z/J TONGUE · X/K EGG · P PAUSE · M MUTE', 1, '#ffffff');
  drawText8line(ctx, 292, [
    { text: 'DIFFICULTY: ', color: '#ffffff' },
    { text: 'EASY',   color: difficulty === 'easy'   ? '#8fe85f' : '#cfc9b8' },
    { text: '/',      color: '#ffffff' },
    { text: 'NORMAL', color: difficulty === 'normal' ? '#8fe85f' : '#cfc9b8' },
    { text: '/',      color: '#ffffff' },
    { text: 'HARD',   color: difficulty === 'hard'   ? '#8fe85f' : '#cfc9b8' },
    { text: '  ←→',   color: '#cfc9b8' }
  ], 1);
  drawText8line(ctx, 322, [
    { text: 'BACKGROUND: ', color: '#ffffff' },
    { text: 'NIGHT', color: bgSel === 'night' ? '#ffd97a' : '#cfc9b8' },
    { text: '/',     color: '#ffffff' },
    { text: 'DUSK',  color: bgSel === 'dusk'  ? '#ffd97a' : '#cfc9b8' },
    { text: '/',     color: '#ffffff' },
    { text: 'DAWN',  color: bgSel === 'dawn'  ? '#ffd97a' : '#cfc9b8' },
    { text: '  ↑↓',  color: '#cfc9b8' }
  ], 1);
  drawText8center(ctx, 178, 'HI-SCORE: ' + best, 2, '#ffe9b0');
  drawText8center(ctx, 205, 'PRESS START', 2, on ? '#7dff7d' : 'rgba(125,255,125,0.18)');
}

/* ============================ 7. 输入 ============================ */
window.addEventListener('keydown', function (e) {
  const k = e.key;
  if (e.repeat) return;
  /* FIX-V19: M 静音全局切换（START/RUN/暂停均生效）+ cookie yoshi_mute */
  if (k === 'm' || k === 'M') { muted = !muted; writeCookie('yoshi_mute', muted ? '1' : '0'); e.preventDefault(); return; }
  /* FIX-V17: 开始界面——←/→ 难度、↑/↓ 背景、空格/Enter 开始 */
  if (gameState === 'START') {
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      const idx = DIFF_KEYS.indexOf(difficulty);
      difficulty = DIFF_KEYS[(idx + (k === 'ArrowRight' ? 1 : DIFF_KEYS.length - 1)) % DIFF_KEYS.length];
      writeCookie('yoshi_dif', difficulty);
      playSfx('select');              // FIX-V19: 菜单切换音效
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      const idx = BG_LIST.indexOf(bgSel);
      bgSel = BG_LIST[(idx + (k === 'ArrowDown' ? 1 : BG_LIST.length - 1)) % BG_LIST.length];
      writeCookie('yoshi_bg', bgSel);
      playSfx('select');              // FIX-V19: 菜单切换音效
    } else if (k === ' ' || k === 'Enter') {
      playSfx('start');               // FIX-V19: 开始音效
      startGame();
    }
    e.preventDefault();
    return;
  }
  if (gameState === 'DEAD') { e.preventDefault(); return; }   // 死亡动画期间忽略动作键
  if (gameState === 'GAMEOVER') {
    if (k === 'r' || k === 'R' || k === 'Enter') gameState = 'START';  // 回菜单
    else if (k === ' ') startGame();                                  // 空格直接重开
    e.preventDefault();
    return;
  }
  /* FIX-V18-P2-1: RUN/暂停中按 R 直接重开（GAMEOVER 后 R 回菜单的现有逻辑保持不变，见上） */
  if (k === 'r' || k === 'R') { resetGame(); e.preventDefault(); return; }
  /* RUN 状态 */
  if (k === 'p' || k === 'P') { paused = !paused; e.preventDefault(); return; }
  if (paused) return;
  switch (k) {
    case ' ': case 'ArrowUp': case 'w': case 'W':
      player.jumpPressed = true;
      e.preventDefault();
      break;
    case 'z': case 'Z': case 'j': case 'J':
      player.tonguePressed = true;
      e.preventDefault();
      break;
    case 'x': case 'X': case 'k': case 'K':
      player.throwPressed = true;
      e.preventDefault();
      break;
  }
});

window.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    player.jumpHeld = false;
    if (player.state === 'JUMP') {
      applyJumpCut(); // FIX-V4-P2-1: 直接跳跃松键（短按/0.45 衰减，逻辑复用）
    } else if ((player.state === 'TONGUE' && player.airTongue) ||
               (player.state === 'SWALLOW_STUN' && player.airSwallow)) {
      /* FIX-V4-P2-1: 空中舌/空中吞食期间松键 → 记录，回 JUMP 瞬间补一次衰减（手感与直接跳跃一致） */
      player.jumpReleasedInAir = true;
      /* FIX-V18-P2-2: v17 重构后衰减推迟到回 JUMP 时已近顶点（vy≈0）而失效（实测 168.7px vs 直接早松 102.7px）；
         改为松键瞬间立即 applyJumpCut——与直接跳跃同一时刻松键手感完全一致；回 JUMP 的补衰减保留为兜底（jumpCutUsed 防重） */
      applyJumpCut();
    }
    /* P2-11(手感项): 空中 THROW 期间松键不剪断 vy（跳跃被扔蛋接管），现状保留 */
  }
});

/* ============================ 9. 启动 ============================ */
/* FIX-V17: 重置一局（不改变顶层状态；由 startGame 进入 RUN） */
function resetGame() {
  t = 0; score = 0; speed = diff().V0; scroll = 0; animTime = 0;
  eggs = []; enemies = [];
  spawnTimer = spawnInterval();
  activeDives = 0; deathTimer = 0; gameOverShown = false;
  shakeTimer = 0; paused = false; newBest = false;
  gameState = 'RUN';   // FIX-V17: 重置后进入 RUN（GAMEOVER→菜单由 keydown 单独控制）
  resetPlayer();
}
function startGame() { resetGame(); }

let lastTime = 0;
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* FIX-V17: 启动——读 cookie 偏好，进入开始界面 */
loadPrefs();
resetPlayer();
gameState = 'START';
requestAnimationFrame(function (now) { lastTime = now; requestAnimationFrame(loop); });
</script>
