g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dec);
const pn=AC.createStereoPanner?AC.createStereoPanner():null;
src.connect(f);f.connect(g);
if(pn){pn.pan.value=panSide*.22;g.connect(pn);pn.connect(master);send(pn,.22)}else{g.connect(master)}
src.start(t0);src.stop(t0+dec+.05);

function updatePlayer(dt,t){
const run=keys.has('shiftleft')||keys.has('shiftright');
const sp=run?4.8:2.6;
camera.getWorldDirection(F);F.y=0;
if(F.lengthSq()<1e-6)F.set(0,0,-1);
F.normalize();
RTV.crossVectors(F,UP);
const ix=(keys.has('keyd')?1:0)-(keys.has('keya')?1:0);
const iz=(keys.has('keyw')?1:0)-(keys.has('keys')?1:0);
WISH.set(0,0,0).addScaledVector(F,iz).addScaledVector(RTV,ix);
if(WISH.lengthSq()>0)WISH.normalize().multiplyScalar(sp);
P.vel.lerp(WISH,1-Math.exp(-11*dt));
const nx=P.pos.x+P.vel.x*dt;
if(!hits(nx,P.pos.z))P.pos.x=nx;else P.vel.x=0;
const nz=P.pos.z+P.vel.z*dt;
if(!hits(P.pos.x,nz))P.pos.z=nz;else P.vel.z=0;
const spd=Math.hypot(P.vel.x,P.vel.z);
if(spd>.25){
P.stepAcc+=spd*dt;
const stride=run?1.9:1.5;
if(P.stepAcc>stride){P.stepAcc=0;sfxStep(run,surfaceAt(P.pos.x,P.pos.z))}
}
P.bobAmt+=((spd>.25?Math.min(spd/4.8,1):0)-P.bobAmt)*Math.min(1,dt*6);

camera.position.set(P.pos.x,1.7+Math.sin(P.bob)*.034*P.bobAmt+Math.sin(t*1.5)*.004,P.pos.z);

for(let i=0;i<exits.length;i++){
const e2=exits[i];
const v=.8+.2*(hash1(Math.floor(t*7)+e2.ph)>.12?1:.25);
e2.fm.emissiveIntensity=1.15*v;
if(e2.light)e2.light.intensity=.9*v;
}
for(let i=0;i<curtains.length;i++){const c=curtains[i];c.m.rotation.z=Math.sin(t*.6+c.ph)*.02+.01*Math.sin(c.ph)}
for(let i=0;i<swayers.length;i++){const s=swayers[i];s.m.rotation.x=s.bx+Math.sin(t*.53+s.ph)*s.amp;s.m.rotation.z=s.bz+Math.sin(t*.41+s.ph)*s.amp*.7}
if(dustGeo){
const pa=dustGeo.attributes.position.array;
for(let i=0;i<dustSpd.length;i++){
pa[i*3+1]-=dustSpd[i]*dt;
pa[i*3]+=Math.sin(t*.4+dustPh[i])*.0006;
pa[i*3+2]+=Math.cos(t*.33+dustPh[i])*.0006;
if(pa[i*3+1]<.05)pa[i*3+1]=(i%5===0)?2.9:4.1;
}
dustGeo.attributes.position.needsUpdate=true;
}
audioUpdate(dt,t);
if(gradePass)gradePass.uniforms.time.value=t;
}
buildExterior();
buildShell();
buildCeilingStuff();
buildFixturesAll();
buildRows();
buildBackWallShelves();
buildCheckouts();
buildCarts();
buildDisplays();
buildCorridor();
buildFreezer();
buildSmallProps();
buildSignsAll();
scatterFallen(26);
finalizeProducts();
buildDust();
initPost();
const clock=new THREE.Clock();
let fa=0,ft=0;
function applyPR(){
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth,innerHeight);
if(composer){composer.setPixelRatio(PR);composer.setSize(innerWidth,innerHeight)}
}
addEventListener('resize',function(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
applyPR();
});
function loop(){
requestAnimationFrame(loop);
const dt=Math.min(clock.getDelta(),.05);
T+=dt;
if(controls.isLocked)updatePlayer(dt,T);
else camera.position.set(P.pos.x,1.7,P.pos.z);
updateWorld(dt,T);
fa++;ft+=dt;
if(fa>=90){
const avg=ft/fa;fa=0;ft=0;
const cap=Math.min(devicePixelRatio||1,1.5);
if(avg>.024&&PR>.9){PR-=.25;applyPR()}
else if(avg<.017&&PR<cap){PR=Math.min(cap,PR+.25);applyPR()}
}
composer.render();
}
loop();
</script>
