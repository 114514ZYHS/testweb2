function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RNG = mulberry32(CONFIG.seed);
/** 命名的独立随机流，保证各子系统互不干扰且可复现 */
const streams = new Map();
function rngFor(name) {
  if (!streams.has(name)) {
    let h = CONFIG.seed;
    for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 0x01000193) >>> 0;
    streams.set(name, mulberry32(h));
  }
  return streams.get(name);
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const smootherstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const saturate = v => v < 0 ? 0 : v > 1 ? 1 : v;
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* --- 整数哈希 + value noise + fbm（自实现，无外部噪声库） --- */
function hash2i(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ h >>> 15, 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2i(xi, yi, s), b = hash2i(xi + 1, yi, s);
  const c = hash2i(xi, yi + 1, s), d = hash2i(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm2(x, y, oct = 4, lac = 2.03, gain = 0.5, s = 7) {
  let a = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise2(x * f, y * f, s + i * 131); norm += a; a *= gain; f *= lac; }
  return sum / norm;
}
function ridged2(x, y, oct = 4, s = 11) {
  let a = 0.5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * (1 - Math.abs(vnoise2(x * f, y * f, s + i * 97) * 2 - 1)); norm += a; a *= 0.5; f *= 2.07; }
  return sum / norm;
}
function curl2(x, y, eps, s) {
  const n1 = fbm2(x, y + eps, 3, 2.0, 0.5, s), n2 = fbm2(x, y - eps, 3, 2.0, 0.5, s);
  const n3 = fbm2(x + eps, y, 3, 2.0, 0.5, s + 7), n4 = fbm2(x - eps, y, 3, 2.0, 0.5, s + 7);
  return [(n1 - n2) / (2 * eps), -(n3 - n4) / (2 * eps)];
}

/* --- GLSL 公共片段 --- */
const GLSL_COMMON = `
  #define PI 3.141592653589793
  #define TAU 6.283185307179586
  float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
  float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
  float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
  vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
  vec3 hash33(vec3 p3){ p3 = fract(p3*vec3(0.1031,0.1030,0.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    float a = hash12(i), b = hash12(i+vec2(1,0)), c = hash12(i+vec2(0,1)), d = hash12(i+vec2(1,1));
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float vnoise3(vec3 p){
    vec3 i = floor(p), f = fract(p);
    vec3 u = f*f*(3.0-2.0*f);
    float n000=hash13(i), n100=hash13(i+vec3(1,0,0)), n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
    float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1)), n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
    return mix(mix(mix(n000,n100,u.x), mix(n010,n110,u.x), u.y),
               mix(mix(n001,n101,u.x), mix(n011,n111,u.x), u.y), u.z);
  }
  float fbm(vec2 p, int oct){
    float a=0.5, s=0.0, n=0.0; mat2 m = mat2(1.6,1.2,-1.2,1.6);
    for(int i=0;i<8;i++){ if(i>=oct) break; s += a*vnoise(p); n += a; a*=0.5; p = m*p; }
    return s/max(n,1e-5);
  }
  float fbm3(vec3 p, int oct){
    float a=0.5, s=0.0, n=0.0;
    for(int i=0;i<8;i++){ if(i>=oct) break; s += a*vnoise3(p); n += a; a*=0.5; p *= 2.02; }
    return s/max(n,1e-5);
  }
  float ridge(vec2 p, int oct){
    float a=0.5, s=0.0, n=0.0;
    for(int i=0;i<8;i++){ if(i>=oct) break; s += a*(1.0-abs(vnoise(p)*2.0-1.0)); n += a; a*=0.5; p*=2.05; }
    return s/max(n,1e-5);
  }
  vec3 acesTone(vec3 x){
    const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;
    return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
  }
`;

function mat4(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ'));
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(sx, sy, sz));
  return m;
}
function tmpv(x, y, z) { return new THREE.Vector3(x, y, z); }
function vec2(x, y) { return new THREE.Vector2(x, y); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function pick(arr, r) { return arr[Math.floor(r() * arr.length) % arr.length]; }
function gauss(r) { return (r() + r() + r() + r() - 2) * 0.7071; }

/* ═══════════════════════════════════════════════════════════════════════════
   2 · 程序化贴图库（Canvas2D 离屏绘制 → albedo + normal/roughness 辅助通道）
   ═══════════════════════════════════════════════════════════════════════════ */
let MAX_ANISO = 8;
const TEX_BYTES = { n: 0 };
const _cvs = (s) => { const c = document.createElement('canvas'); c.width = c.height = s; return c; };

function canvasTex(canvas, { srgb = true, repeat = [1, 1], wrap = THREE.RepeatWrapping } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = wrap;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = MAX_ANISO;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  TEX_BYTES.n += canvas.width * canvas.height * 4 * 1.34; // +mip 链
  return regTex(t);
}

/** 由高度/亮度图生成切线空间法线图（Sobel 中心差分） */
function heightToNormal(src, strength = 2.0) {
  const s = src.width, out = _cvs(s), octx = out.getContext('2d');
  const img = src.getContext('2d').getImageData(0, 0, s, s).data;
  const od = octx.createImageData(s, s);
  const lum = new Float32Array(s * s);
  for (let i = 0, k = 0; i < lum.length; i++, k += 4)
    lum[i] = (img[k] * 0.299 + img[k + 1] * 0.587 + img[k + 2] * 0.114) * (1 / 255);
  const d = od.data;
  for (let y = 0; y < s; y++) {
    const yUp = (y + 1) % s * s, yDn = (y + s - 1) % s * s, yC = y * s;
    for (let x = 0; x < s; x++) {
      const xR = (x + 1) % s, xL = (x + s - 1) % s;
      const dx = (lum[yC + xR] - lum[yC + xL]) * strength;
      const dy = (lum[yUp + x] - lum[yDn + x]) * strength;
      const nx = -dx, ny = dy;
      const il = 1 / Math.sqrt(nx * nx + ny * ny + 1);

  TX.glow = (() => {

/** 4 阶色阶 + 手绘感抖动边缘 */
function makeGradientMap(steps = 4, levels = [0.30, 0.56, 0.78, 1.0]) {
  const N = 64, data = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1);
    const idx = Math.min(steps - 1, Math.floor(x * steps + 1e-5));
    const edge = x * steps - idx;
    const wob = (fbm2(x * 11.0, 0.37, 2, 2.0, 0.5, 3) - 0.5) * 0.16;
    let v = levels[idx] + wob * (1 - Math.abs(edge - 0.5) * 2) * 0.5;
    v = saturate(v);
    data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = v * 255;
    data[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return regTex(t);
}
const GRADIENT = makeGradientMap();

/** 保证几何体带 uv / color 属性（vertexColors 必须配套 color，否则全黑） */
function withAttrs(g, gray = 1.0) {
  if (!g.attributes.uv) {
    const n = g.attributes.position.count;
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  }
  if (!g.attributes.color) {
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3).fill(gray);
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  }
  if (!g.attributes.normal) g.computeVertexNormals();
  if (g.groups && g.groups.length > 1) g.clearGroups();
  return g;
}

/** 注入式 toon 补丁：rim light / 各向异性高光 / 次表面 / 雪 / 湿润 / 高度雾 */
function patchToon(mat, o = {}) {
  const U = {
    uRimColor:   { value: new THREE.Color(o.rimColor ?? 0xcfe0ff) },
    uRimPower:   { value: o.rimPower ?? 3.4 },
    uRimStrength:{ value: o.rim ?? 0.34 },
    uAniso:      { value: o.aniso ?? 0.0 },
    uSSS:        { value: o.sss ?? 0.0 },
    uSSSColor:   { value: new THREE.Color(o.sssColor ?? 0xff8fa0) },
    uAuxMap:     { value: o.aux ?? TX.noise.map },
    uAuxUse:     { value: o.aux ? 1.0 : 0.0 },
    uUvScale:    { value: new THREE.Vector2(...(o.uvScale ?? [1, 1])) },
    uSway:       { value: o.sway ?? 0.0 },
    uSnowAmt:    { value: o.snowAmt ?? 1.0 },
    uEmissiveCol:{ value: new THREE.Color(o.emissive ?? 0x000000) },
    uEmissiveI:  { value: o.emissiveI ?? 0.0 },
    uPulse:      { value: 0.0 },
    uTint:       { value: new THREE.Color(o.tint ?? 0xffffff) },
    uTintMix:    { value: o.tintMix ?? 0.0 },
    uRoughBoost: { value: o.roughBoost ?? 0.0 },
  };
  mat.userData.U = U;
  mat.userData.opts = o;
  mat.defines = Object.assign({}, mat.defines, o.defines || {});
  if (o.defines && o.defines.USE_FLEX !== undefined) mat.defines.USE_FLEX = '';

  mat.onBeforeCompile = (shader) => {
    shader.uniforms = Object.assign({}, shader.uniforms, SHARED, U);
    let v = shader.vertexShader;
    v = v.replace('#include <common>', `#include <common>
      uniform float uTime; uniform vec2 uWind; uniform float uSway; uniform vec2 uUvScale;
      #ifdef USE_FLEX
        attribute float aFlex;
      #endif
      varying vec3 vWPos; varying vec3 vVPos; varying vec3 vWNormal;
    `);
    v = v.replace('#include <uv_vertex>', `#include <uv_vertex>
      #ifdef USE_UV
        vUv *= uUvScale;
      #endif
    `);
    v = v.replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
      {
        vec3 _wn = objectNormal;
        #ifdef USE_INSTANCING
          _wn = mat3( instanceMatrix ) * _wn;
        #endif
        vWNormal = normalize( mat3( modelMatrix ) * _wn );
      }
    `);
    v = v.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_FLEX
        vec3 _off = vec3( 0.0 );
        #ifdef USE_INSTANCING
          _off = vec3( instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2] );
        #endif
        float _ph = _off.x * 0.61 + _off.z * 0.87 + position.y * 0.55 + _off.y * 0.31;

function curvedBeam(len, w, h, curve = 0.35, seg = 28, pw = 2.6) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, x = (t - 0.5) * len;
    const y = curve * Math.pow(Math.abs(t - 0.5) * 2, pw);
    const tw = w * (1 - Math.pow(Math.abs(t - 0.5) * 2, 4) * 0.28);
    pos.push(x, y - h / 2, -tw, x, y + h / 2, -tw, x, y + h / 2, tw, x, y - h / 2, tw);
    uv.push(t, 0, t, 0.33, t, 0.66, t, 1);
  }
  for (let i = 0; i < seg; i++) {
    const a = i * 4, b = (i + 1) * 4;
    for (let k = 0; k < 4; k++) {
      const k2 = (k + 1) % 4;
      idx.push(a + k, b + k, a + k2, a + k2, b + k, b + k2);
    }
  }
  idx.push(0, 3, 1, 0, 2, 3);
  const L = seg * 4;
  idx.push(L, L + 1, L + 3, L, L + 3, L + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return fixWinding(normalizeGeo(g));
}

/** 沿 3D 曲线扫掠圆截面（注连绳 / 拉绳 / 竹筒） */
function tube(curvePts, radius, radSeg = 8, tubular = 32) {
  const curve = new THREE.CatmullRomCurve3(curvePts.map(p => new THREE.Vector3(...p)));
  return normalizeGeo(new THREE.TubeGeometry(curve, tubular, radius, radSeg, false));
}

/** 旋转体（拟宝珠 / 鬼瓦轮廓 / 香炉） */
function lathe(profile, seg = 16) {
  const pts = profile.map(p => new THREE.Vector2(Math.max(0.0001, p[0]), p[1]));
  return normalizeGeo(new THREE.LatheGeometry(pts, seg));
}

/** 地形网格：w×d，按 heightFn(x,z) 位移，写入顶点 AO */
function gridTerrain(w, d, sx, sz, hFn, aoFn, uvScale = 0.1) {
  const g = new THREE.PlaneGeometry(w, d, sx, sz);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, n = pos.count;
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, hFn(x, z));
    const a = aoFn ? aoFn(x, z) : 1;
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = a;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w * uvScale, uv.getY(i) * d * uvScale);
  g.computeVertexNormals();
  return normalizeGeo(g);
}

/** 顶点 AO 烘焙：由附近遮挡体（球）近似计算 */
const AO_OCCLUDERS = [];
function bakeAO(geo, opts = {}) {
  const pos = geo.attributes.position, n = pos.count;
  let col = geo.attributes.color;
  if (!col) { col = new THREE.BufferAttribute(new Float32Array(n * 3).fill(1), 3); geo.setAttribute('color', col); }
  const arr = col.array;
  const v = new THREE.Vector3();
  const radius = opts.radius ?? 1.6;
  const strength = opts.strength ?? 0.55;
  const list = opts.occluders ?? AO_OCCLUDERS;
  for (let i = 0; i < n; i++) {
    v.fromBufferAttribute(pos, i);
    let occ = 0;
    for (let k = 0; k < list.length; k++) {
      const o = list[k];
      const dx = v.x - o.x, dy = v.y - o.y, dz = v.z - o.z;
      const dd = dx * dx + dy * dy + dz * dz;
      const rr = o.r + radius;
      if (dd < rr * rr) occ += (1 - Math.sqrt(dd) / rr) * (o.w ?? 1);
    }
    let a = 1 - saturate(occ) * strength;
    if (opts.groundBoost) a = Math.min(a, lerp(0.34, 1.0, smoothstep(0, 1.1, v.y - (opts.groundY ?? 0))));
    const base = arr[i * 3];
    arr[i * 3] = arr[i * 3 + 1] = arr[i * 3 + 2] = Math.min(base, a);
  }
  col.needsUpdate = true;
  return geo;
}

/** 按材质合批：静态同材质网格合并为单一 Mesh */
class Batcher {
  constructor(name) { this.name = name; this.buckets = new Map(); this.count = 0; }
  add(mat, geo, matrix, opts = {}) {
    if (!geo || !mat) return this;
    let list = this.buckets.get(mat);
    if (!list) { list = []; this.buckets.set(mat, list); }
    const g = normalizeGeo(geo.clone());
    if (matrix) g.applyMatrix4(matrix);
    if (opts.ao) bakeAO(g, opts.ao === true ? {} : opts.ao);
    list.push(g);
    this.count++;
    return this;
  }
  addMany(mat, geo, matrices) { for (const m of matrices) this.add(mat, geo, m); return this; }
  flush(parent, opts = {}) {
    let meshes = 0;
    for (const [mat, list] of this.buckets) {
      if (!list.length) continue;
      const merged = list.length === 1 ? list[0] : mergeGeometries(list, false);
      if (!merged) { DIAG.errors.push('merge failed in ' + this.name); continue; }
      if (opts.ao) bakeAO(merged, opts.ao);
      regGeo(merged);
      const m = new THREE.Mesh(merged, mat);
      m.castShadow = opts.castShadow !== false;
      m.receiveShadow = opts.receiveShadow !== false;
      m.name = this.name + ':' + meshes;
      if (opts.layer) m.layers.enable(opts.layer);
      parent.add(m);
      meshes++;
      if (opts.hull && CONFIG.outline.hull) {
        const w = typeof opts.hull === 'number' ? opts.hull : CONFIG.outline.hullWidth;
        const hg = regGeo(merged.clone());
        const hm = new THREE.Mesh(hg, hullMat(0x0b0d14, w, this.name));
        hm.castShadow = false; hm.receiveShadow = false;
        hm.renderOrder = -1;
        parent.add(hm);
      }
    }
    this.buckets.clear();
    return meshes;
  }
}

/** InstancedMesh 工厂 */
function makeInstanced(geo, mat, count, name, opts = {}) {
  const g = normalizeGeo(geo);
  const im = new THREE.InstancedMesh(g, mat, count);
  im.name = name;
  im.instanceMatrix.setUsage(opts.dynamic ? THREE.DynamicDrawUsage : THREE.StaticDrawUsage);
  im.castShadow = opts.castShadow !== false;
  im.receiveShadow = opts.receiveShadow !== false;
  im.frustumCulled = opts.cull !== false;
  if (opts.layer) im.layers.enable(opts.layer);
  im.userData.used = 0;
  return im;
}
function fillInstances(im, list, count) {
  const n = count ?? list.length;
  for (let i = 0; i < n; i++) im.setMatrixAt(i, list[i]);
  im.count = n;
  im.userData.used = n;
  im.instanceMatrix.needsUpdate = true;
  im.computeBoundingSphere();
  return im;
}

/* ---------- 极简 BVH（三角形二叉 AABB 树，用于加速拾取） ---------- */
const _bvhTmp = new THREE.Vector3();
class BVH {
  constructor(geo, leafSize = 8) {
    const pos = geo.attributes.position.array;
    const idxAttr = geo.index ? geo.index.array : null;
    const triN = idxAttr ? idxAttr.length / 3 : pos.length / 9;
    this.pos = pos; this.idx = idxAttr; this.triN = triN;
    const cent = new Float32Array(triN * 3);
    const bmin = new Float32Array(triN * 3), bmax = new Float32Array(triN * 3);
    const gi = (t, k) => idxAttr ? idxAttr[t * 3 + k] * 3 : t * 9 + k * 3;
    for (let t = 0; t < triN; t++) {
      const a = gi(t, 0), b = gi(t, 1), c = gi(t, 2);
      for (let k = 0; k < 3; k++) {
        const lo = Math.min(pos[a + k], pos[b + k], pos[c + k]);
        const hi = Math.max(pos[a + k], pos[b + k], pos[c + k]);
        bmin[t * 3 + k] = lo; bmax[t * 3 + k] = hi;
        cent[t * 3 + k] = (lo + hi) * 0.5;
      }
    }
    const order = new Uint32Array(triN);
    for (let i = 0; i < triN; i++) order[i] = i;
    this.nodes = []; this.leafSize = leafSize;
    const build = (start, end) => {
      const node = { min: new Float32Array(3), max: new Float32Array(3), start, count: end - start, l: -1, r: -1 };
      node.min.fill(Infinity); node.max.fill(-Infinity);
      for (let i = start; i < end; i++) {
        const t = order[i];
        for (let k = 0; k < 3; k++) {
          if (bmin[t * 3 + k] < node.min[k]) node.min[k] = bmin[t * 3 + k];
          if (bmax[t * 3 + k] > node.max[k]) node.max[k] = bmax[t * 3 + k];
        }
      }
      const id = this.nodes.length; this.nodes.push(node);
      if (node.count > this.leafSize) {
        let axis = 0, ext = -1;
        for (let k = 0; k < 3; k++) { const e = node.max[k] - node.min[k]; if (e > ext) { ext = e; axis = k; } }
        const sub = Array.from(order.slice(start, end)).sort((x, y) => cent[x * 3 + axis] - cent[y * 3 + axis]);
        for (let i = 0; i < sub.length; i++) order[start + i] = sub[i];
        const mid = start + (node.count >> 1);
        node.l = build(start, mid); node.r = build(mid, end);
      }
      return id;
    };
    if (triN > 0) build(0, triN);
  }
  intersect(ray) {
    if (!this.triN) return null;
    const inv = [1 / ray.direction.x, 1 / ray.direction.y, 1 / ray.direction.z];
    const o = ray.origin;
    let best = Infinity, hit = null;
    const stack = [0], pos = this.pos, idx = this.idx;
    const gi = (t, k) => idx ? idx[t * 3 + k] * 3 : t * 9 + k * 3;
    const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
    while (stack.length) {
      const node = this.nodes[stack.pop()];
      let t0 = -Infinity, t1 = Infinity, ok = true;
      for (let k = 0; k < 3; k++) {
        const ov = k === 0 ? o.x : k === 1 ? o.y : o.z;
        const d = k === 0 ? ray.direction.x : k === 1 ? ray.direction.y : ray.direction.z;
        let a = (node.min[k] - ov) * inv[k], b = (node.max[k] - ov) * inv[k];
        if (a > b) { const s = a; a = b; b = s; }
        if (a > t0) t0 = a;
        if (b < t1) t1 = b;
        if (t0 > t1 || t1 < 0) { ok = false; break; }
      }
      if (!ok || t0 > best) continue;
      if (node.count <= this.leafSize) {
        for (let i = 0; i < node.count; i++) {
          const t = node.start + i;
          const a = gi(t, 0), b = gi(t, 1), c = gi(t, 2);
          vA.set(pos[a], pos[a + 1], pos[a + 2]);
          vB.set(pos[b], pos[b + 1], pos[b + 2]);
          vC.set(pos[c], pos[c + 1], pos[c + 2]);
          const tHit = ray.intersectTriangle(vA, vB, vC, false, _bvhTmp);
          if (tHit && tHit.distance < best) { best = tHit.distance; hit = { t: best, point: _bvhTmp.clone(), face: t }; }
        }
      } else { if (node.l >= 0) stack.push(node.l); if (node.r >= 0) stack.push(node.r); }
    }
    return hit;
  }
}

/* ---------- 分块 LOD（高/中/impostor + 视锥剔除 + 距离剔除） ---------- */
class ChunkedLOD {
  constructor(name, distances = [30, 70], maxDist = 210) {
    this.name = name; this.distances = distances; this.maxDist = maxDist;
    this.chunks = []; this._f = new THREE.Frustum(); this._m = new THREE.Matrix4(); this._s = new THREE.Sphere();
  }
  addChunk(center, radius, lods) { this.chunks.push({ center, radius, lods }); }
  update(camera) {
    this._m.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    this._f.setFromProjectionMatrix(this._m);
    const cp = camera.position;
    for (const c of this.chunks) {
      const d = cp.distanceTo(c.center) - c.radius;
      this._s.center.copy(c.center); this._s.radius = c.radius;
      if (d > this.maxDist || !this._f.intersectsSphere(this._s)) {
        for (const m of c.lods) if (m) m.visible = false;
        continue;
      }
      const lvl = d < this.distances[0] ? 0 : d < this.distances[1] ? 1 : 2;
      for (let i = 0; i < c.lods.length; i++) if (c.lods[i]) c.lods[i].visible = (i === lvl);
    }
  }
}

/* ---------- Poisson disk 采样（Bridson）+ 生物群系权重 ---------- */
function poissonDisk(w, h, radius, rng, k = 22, weightFn = null) {
  const cell = radius / Math.SQRT2;
  const gw = Math.ceil(w / cell), gh = Math.ceil(h / cell);
  const grid = new Int32Array(gw * gh).fill(-1);
  const pts = [], active = [];
  const put = (x, y) => {
    const i = pts.length; pts.push([x, y]);
    grid[Math.floor(y / cell) * gw + Math.floor(x / cell)] = i;
    active.push(i);
  };
  const okAt = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return false;
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    for (let j = Math.max(0, gy - 2); j <= Math.min(gh - 1, gy + 2); j++)
      for (let i = Math.max(0, gx - 2); i <= Math.min(gw - 1, gx + 2); i++) {
        const q = grid[j * gw + i];
        if (q >= 0) { const dx = pts[q][0] - x, dy = pts[q][1] - y; if (dx * dx + dy * dy < radius * radius) return false; }
      }
    return true;
  };
  let tries = 0;
  put(rng() * w, rng() * h);
  while (active.length && pts.length < 40000 && tries < 400000) {
    tries++;
    const ai = Math.floor(rng() * active.length), p = pts[active[ai]];
    let found = false;
    for (let i = 0; i < k; i++) {
      const a = rng() * TAU, rr = radius * (1 + rng());
      const x = p[0] + Math.cos(a) * rr, y = p[1] + Math.sin(a) * rr;
      if (okAt(x, y) && (!weightFn || weightFn(x, y) > rng())) { put(x, y); found = true; break; }
    }
    if (!found) active.splice(ai, 1);
  }
  return pts;
}

/* ═══════════════════════════════════════════════════════════════════════════
   5 · 场景根 / 底座台地 / 地形
   ═══════════════════════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();
const root = new THREE.Group();
scene.add(root);
const LEVELS = CONFIG.levels;

/** 台地高度场（网格与散布共用，保证一致） */
function levelIndexAtZ(z) {
  for (let i = 0; i < LEVELS.length; i++) if (z <= LEVELS[i].zNear && z >= LEVELS[i].zFar) return i;
  return z > LEVELS[0].zNear ? 0 : LEVELS.length - 1;
}
function peakFn(x, z) {
  // L6 主峰隆起
  const dx = x / 8.5, dz = (z + 19.4) / 3.4;

/** 溪流折线（左侧，从瀑布池流向池塘） */

function buildBase() {
  const B = new THREE.Group(); B.name = 'base';
  const rng = rngFor('base');
  const stoneB = new Batcher('baseStone'), woodB = new Batcher('baseWood');
  const groundB = new Batcher('baseGround');
  const SIZE = CONFIG.world.size, CR = CONFIG.base.cornerRadius;

  /* ---- 底座石砌基座（含底面封口） ---- */
  stoneB.add(MAT.wall, roundedPrism(SIZE, SIZE, 0.95, CR, 6), mat4(0, -0.95, 0));

  /* ---- 七级台地 ---- */
  for (let i = 1; i < LEVELS.length; i++) {
    const L = LEVELS[i];
    const depth = L.zNear - L.zFar;
    const cz = (L.zNear + L.zFar) / 2;
    const wallTop = L.y;
    const hasProf = wallTop > 1.2;
    const gH = hasProf ? 0.75 : Math.max(0.10, wallTop * 0.42);
    const wH = hasProf ? CONFIG.base.woodGap : Math.max(0.05, wallTop * 0.16);
    const sH = Math.max(0.06, wallTop - gH - wH);
    const rocky = L.kind === 'peak' || L.kind === 'forest';
    // 石砌侧面（岩壁级台地加噪声位移）
    const stoneG = roundedPrism(L.width, depth, sH, CR, rocky ? 10 : 5);
    if (rocky) {
      const pos = stoneG.attributes.position;
      for (let k = 0; k < pos.count; k++) {
        const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);
        const n = fbm2(x * 0.32 + i * 7, (z + y * 0.6) * 0.32, 4, 2.03, 0.5, 41 + i) - 0.5;
        const n2 = fbm2(x * 1.1, (z + y * 0.9) * 1.1, 3, 2.0, 0.5, 77 + i) - 0.5;
        const amp = L.kind === 'peak' ? 0.62 : 0.30;
        pos.setX(k, x + Math.sign(x) * n * amp * 0.5 + n2 * amp * 0.18);
        pos.setZ(k, z + Math.sign(z) * n * amp * 0.5 + n2 * amp * 0.18);
        pos.setY(k, y + n2 * amp * 0.25);
      }
      pos.needsUpdate = true; stoneG.computeVertexNormals();
    }
    stoneB.add(MAT.wall, stoneG, mat4(0, 0, cz));
    // 木制夹层（略收 0.3）
    woodB.add(MAT.woodDark, roundedPrism(L.width - 0.6, depth - 0.6, wH, Math.max(0.1, CR - 0.3), 4), mat4(0, sH, cz));
    // 庭院地面（板坯）
    groundB.add(MAT.ground, roundedPrism(L.width - 0.6, depth - 0.6, gH, Math.max(0.1, CR - 0.3), 4), mat4(0, sH + wH, cz));
    // 顶部起伏地面
    const inset = 0.30;
    const gw = L.width - 0.6 - inset * 2, gd = depth - 0.6 - inset * 2;
    const segX = Math.max(6, Math.round(gw * 1.6)), segZ = Math.max(4, Math.round(gd * 2.2));
    const cap = gridTerrain(gw, gd, segX, segZ,
      (x, z) => terrainY(x, z + cz) - (sH + wH),
      (x, z) => 0.72 + 0.28 * fbm2(x * 0.3 + 3, (z + cz) * 0.3, 3, 2, 0.5, 12),
      0.16);
    const capG = cap.clone();
    capG.translate(0, sH + wH, cz);
    groundB.add(MAT.ground, capG);
  }

  /* ---- 台地边缘不规则石垣护坡（实例化，随机旋转缩放） ---- */
  const stoneList = [];
  const rockPool = [rockGeo(11, 0), rockGeo(22, 1), rockGeo(33, 0), rockGeo(44, 1), rockGeo(55, 0)];
  for (let i = 1; i < LEVELS.length; i++) {
    const L = LEVELS[i];
    const zEdge = L.zFar;             // 面向观察者的边缘
    const halfW = L.width / 2;
    const n = Math.round(L.width * 1.6);
    for (let k = 0; k < n; k++) {
      const t = (k + 0.5) / n;
      const x = (t - 0.5) * L.width + (rng() - 0.5) * 0.5;
      if (Math.abs(x) > halfW - 0.2) continue;
      const y = L.y - 0.55 - rng() * 0.9;
      const s = 0.28 + rng() * 0.52;
      stoneList.push(mat4(x, y, zEdge - 0.12 - rng() * 0.5, rng() * 0.9, rng() * TAU, rng() * 0.9, s, s * (0.7 + rng() * 0.5), s));
      if (rng() < 0.5) {
        const s2 = 0.22 + rng() * 0.4;
        stoneList.push(mat4(x, L.y - 0.12, zEdge - 0.35 - rng() * 0.4, rng(), rng() * TAU, rng(), s2, s2 * 0.6, s2));
      }
    }
    // 两侧边缘
    for (let side = -1; side <= 1; side += 2) {
      const m = Math.round((L.zNear - L.zFar) * 1.5);
      for (let k = 0; k < m; k++) {
        const z = lerp(L.zFar + 0.4, L.zNear - 0.4, (k + 0.5) / m) + (rng() - 0.5) * 0.4;
        const s = 0.24 + rng() * 0.46;
        stoneList.push(mat4(side * (L.width / 2 - 0.1 - rng() * 0.35), L.y - 0.5 - rng() * 0.8, z,
          rng() * 0.9, rng() * TAU, rng() * 0.9, s, s * (0.7 + rng() * 0.5), s));
      }

  }
  // 山体岩块
  for (let k = 0; k < 260; k++) {
    const x = (rng() - 0.5) * 30, z = -17 - rng() * 3.4;
    const y = terrainY(x, z) - rng() * 3.2;
    const s = 0.5 + rng() * 1.5;
    stoneList.push(mat4(x, y, z, rng(), rng() * TAU, rng(), s, s * 0.8, s));
  }
  // 每种岩石几何各占一部分，通过多 InstancedMesh 表达
  const groups = new Map();
  stoneList.forEach((m, i) => {
    const g = i % rockPool.length;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(m);
  });
  for (const [gi, list] of groups) {
    const mm = makeInstanced(rockPool[gi], MAT.wall, list.length, 'terrainRock' + gi);
    fillInstances(mm, list);
    B.add(mm);
  }
  const nStone = stoneB.flush(B, { hull: false });
  const nWood = woodB.flush(B, { hull: false, castShadow: false });
  const nGround = groundB.flush(B, { hull: false, castShadow: false });
  root.add(B);
  DIAG.stats.baseMeshes = nStone + nWood + nGround;
  return B;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6 · 鸟居 / 本殿 / 屋顶瓦片系统
   ═══════════════════════════════════════════════════════════════════════════ */
const TILE_SETS = { flat: [], round: [], tomoe: [], drip: [], ridge: [] };
const TILE_TARGET = { flat: 0 };
/** 记录各瓦片数组当前长度，配合 transformTilesSince 做局部变换 */
function tileMark() {
  return { flat: TILE_SETS.flat.length, round: TILE_SETS.round.length,
           tomoe: TILE_SETS.tomoe.length, drip: TILE_SETS.drip.length };
}
/** 把 mark 之后新增的瓦片矩阵统一做一次世界变换（R 需为 平移×旋转 顺序） */
function transformTilesSince(mark, R) {
  for (const k of ['flat', 'round', 'tomoe', 'drip'])
    for (let i = mark[k]; i < TILE_SETS[k].length; i++) TILE_SETS[k][i].premultiply(R);

/* ---------- 瓦片几何（四种：平瓦 / 筒瓦 / 巴瓦 / 滴水瓦） ---------- */
function tileGeoFlat() {
  const w = 0.215, d = 0.30, th = 0.030, curve = 0.022;
  const pos = [], uv = [], idx = [];
  const push = (x, y, z, u, v) => { pos.push(x, y, z); uv.push(u, v); return pos.length / 3 - 1; };
  // 上表面（2×3 网格，带横向弧度）
  const nx = 2, nz = 3, base = [];
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) {
    const u = i / nx, v = j / nz;
    const x = (u - 0.5) * w, z = (v - 0.5) * d;
    const y = curve * (1 - Math.pow(Math.abs(u - 0.5) * 2, 2)) - curve * 0.15 * v;
    base.push(push(x, y, z, u, v));
  }
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const a = base[j * (nx + 1) + i], b = base[j * (nx + 1) + i + 1], c = base[(j + 1) * (nx + 1) + i], e = base[(j + 1) * (nx + 1) + i + 1];
    idx.push(a, c, b, b, c, e);
  }
  // 前后裙边
  const skirt = (j, flip) => {
    const off = [];
    for (let i = 0; i <= nx; i++) {
      const p = base[j * (nx + 1) + i], q = push(pos[p * 3], pos[p * 3 + 1] - th, pos[p * 3 + 2], 0, 0);
      off.push(q);
    }
    for (let i = 0; i < nx; i++) {
      const a = base[j * (nx + 1) + i], b = base[j * (nx + 1) + i + 1];
      if (flip) idx.push(a, b, off[i], b, off[i + 1], off[i]);
      else idx.push(a, off[i], b, b, off[i], off[i + 1]);
    }
  };
  skirt(nz, false); skirt(0, true);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return normalizeGeo(g);
}
function tileGeoRound() {
  const r = 0.075, len = 0.32, seg = 5, ls = 2;
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= ls; j++) for (let i = 0; i <= seg; i++) {
    const a = Math.PI * (i / seg);
    pos.push(Math.cos(a) * r, Math.sin(a) * r - r * 0.35, (j / ls - 0.5) * len);
    uv.push(i / seg, j / ls);
  }
  for (let j = 0; j < ls; j++) for (let i = 0; i < seg; i++) {
    const a = j * (seg + 1) + i, b = a + 1, c = a + seg + 1, e = c + 1;
    idx.push(a, c, b, b, c, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return fixWinding(normalizeGeo(g));
}
function tileGeoTomoe() {
  const pos = [], uv = [], idx = [], N = 10, r = 0.105;
  const c = pos.length / 3; pos.push(0, 0, 0.012); uv.push(0.5, 0.5);
  const ring = [];
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    ring.push(pos.length / 3);
    pos.push(Math.cos(a) * r, Math.sin(a) * r, 0); uv.push(i / N, 0);
  }
  for (let i = 0; i < N; i++) idx.push(c, ring[i], ring[i + 1]);

  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    ring2.push(pos.length / 3);
    pos.push(Math.cos(a) * r * 0.96, Math.sin(a) * r * 0.96, -0.02); uv.push(i / N, 0);
  }
  for (let i = 0; i < N; i++) idx.push(c2, ring2[i + 1], ring2[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return normalizeGeo(g);
}
function tileGeoDrip() {
  const w = 0.20, d = 0.11, th = 0.024;
  const pos = [], uv = [], idx = [];
  const q = (x0, x1, z0, z1, y) => {
    const a = pos.length / 3;
    pos.push(x0, y, z0, x1, y, z0, x1, y, z1, x0, y, z1);
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    return a;

  const t = q(-w / 2, w / 2, 0, d, 0), b = q(-w / 2 * 0.8, w / 2 * 0.8, -0.01, d * 0.9, -th);
  idx.push(t, t + 1, t + 2, t, t + 2, t + 3);
  idx.push(b + 2, b + 1, b, b + 3, b + 2, b);
  idx.push(t, b, b + 1, t, b + 1, t + 1);
  idx.push(t + 2, t + 3, b + 3, t + 2, b + 3, b + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);

/* ---------- 屋顶曲面（四坡带脊，檐口反曲） ---------- */
function makeRoofFn(cfg) {
  const { rx, rz, ridgeLen, RH, curvePow = 0.68, lift = 0.42 } = cfg;
  // 面: 0=前(-z) 1=后(+z) 2=左(-x) 3=右(+x)
  return function roofPoint(u, v, face) {
    const rxv = lerp(ridgeLen, rx, v), rzv = rz * v;
    let x, z;
    if (face === 0) { x = u * rxv; z = -rzv; }
    else if (face === 1) { x = u * rxv; z = rzv; }
    else if (face === 2) { x = -rxv; z = u * rzv; }
    else { x = rxv; z = u * rzv; }
    let h = RH * (1 - Math.pow(v, curvePow));
    const cl = Math.pow(saturate(Math.abs(u)) * saturate(v), 2.6);
    h += lift * cl;
    h -= 0.05 * Math.pow(saturate((v - 0.72) / 0.28), 2);
    return new THREE.Vector3(x, h, z);
  };
}

/** 在屋顶曲面上铺设实例化瓦片 */
function layRoofTiles(cfg, opt = {}) {
  const P = makeRoofFn(cfg);
  const spacing = opt.spacing ?? 0.215;
  const rows = opt.rows ?? 26;
  const tileScale = opt.tileScale ?? 1;
  const up = new THREE.Vector3(), tg = new THREE.Vector3(), bt = new THREE.Vector3();
  const m = new THREE.Matrix4();
  let n = 0;
  const faces = opt.faces ?? [0, 1, 2, 3];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3();
  for (const face of faces) {
    for (let r = 0; r < rows; r++) {
      const v = 0.055 + (r / rows) * 0.945;
      // 该行长度
      const rxv = lerp(cfg.ridgeLen, cfg.rx, v), rzv = cfg.rz * v;
      const len = (face < 2 ? rxv : rzv) * 2;
      const cols = Math.max(1, Math.round(len / spacing));
      const dv = 0.5 / rows * 0.92;
      for (let k = 0; k < cols; k++) {
        const u = cols === 1 ? 0 : ((k + 0.5) / cols * 2 - 1);
        a.copy(P(u, v, face));
        b.copy(P(u + 1 / cols, v, face));
        c.copy(P(u, Math.min(1, v + dv), face));
        d.copy(P(u, Math.max(0, v - dv), face));
        tg.subVectors(b, a).normalize();
        bt.subVectors(c, d).normalize();     // 指向檐口
        up.crossVectors(tg, bt).normalize();
        if (up.y < 0) up.negate();
        // 局部: X=沿行, Z=下坡, Y=法线
        const zAxis = bt.clone().negate();    // 下坡方向
        const yAxis = up.clone();
        const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
        m.makeBasis(xAxis, yAxis, zAxis);
        m.setPosition(a);
        m.multiply(new THREE.Matrix4().makeScale(tileScale, tileScale, tileScale));
        // 每列平瓦；隔列筒瓦；檐口端部巴瓦/滴水瓦
        const isRoundCol = (k % 2) === 0;
        const atEave = r >= rows - 1;
        if (isRoundCol) {
          TILE_SETS.round.push(m.clone());
          if (atEave) {
            const mm = m.clone();
            mm.multiply(mat4(0, 0, 0.13 * tileScale));
            TILE_SETS.tomoe.push(mm);
          }
        } else {
          TILE_SETS.flat.push(m.clone());
          if (atEave) {
            const mm = m.clone();
            mm.multiply(mat4(0, 0.01, 0.14 * tileScale));
            TILE_SETS.drip.push(mm);
          }
        }
        n++;
      }
    }
  }
  TILE_TARGET.flat += n;
  return n;
}

/** 屋顶基层曲面（瓦下木底板）；face 0/3 与 1/2 的绕序相反，需分别处理 */
function roofSurfaceGeo(cfg, opt = {}) {
  const P = makeRoofFn(cfg);
  const pos = [], uv = [], idx = [];
  const segU = opt.segU ?? 24, segV = opt.segV ?? 8;
  const faces = opt.faces ?? [0, 1, 2, 3];
  for (const face of faces) {
    const base = pos.length / 3;
    for (let j = 0; j <= segV; j++) for (let i = 0; i <= segU; i++) {
      const u = i / segU * 2 - 1, v = j / segV;
      const p = P(u, v, face);
      pos.push(p.x, p.y, p.z); uv.push(i / segU, j / segV);
    }
    const flip = (face === 1 || face === 2);
    for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
      const a = base + j * (segU + 1) + i, b = a + 1, c = a + segU + 1, e = c + 1;
      if (flip) idx.push(a, b, c, b, e, c);
      else idx.push(a, c, b, b, c, e);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return normalizeGeo(g);
}

/** 唐破风：中央带尖顶的曲檐山墙 */
function cuspBeam(w, h, depth, thick, seg = 26) {
  const pos = [], uv = [], idx = [];
  const prof = (t) => {
    const x = t * w;
    const k = Math.abs(t);
    const y = h * Math.pow(1 - k * k, 0.62) * (1 - 0.55 * Math.exp(-Math.pow(t / 0.16, 2)));
    return [x, y];
  };
  for (let i = 0; i <= seg; i++) {
    const t = i / seg * 2 - 1;
    const [x, y] = prof(t);
    pos.push(x, y, -depth / 2, x, y, depth / 2, x, y - thick, depth / 2, x, y - thick, -depth / 2);
    uv.push(t * 0.5 + 0.5, 1, t * 0.5 + 0.5, 0, t * 0.5 + 0.5, 0, t * 0.5 + 0.5, 1);
  }
  for (let i = 0; i < seg; i++) {
    const a = i * 4, b = (i + 1) * 4;
    for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; idx.push(a + k, b + k, a + k2, a + k2, b + k, b + k2); }
  }
  const L = seg * 4;
  idx.push(0, 1, 3, 0, 3, 2);
  idx.push(L, L + 2, L + 1, L, L + 3, L + 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return fixWinding(normalizeGeo(g));
}

/* ---------- 明神鸟居 ---------- */
function buildTorii(B, x, z, s, opt = {}) {
  const y = terrainY(x, z);
  const rng = rngFor('torii' + z);
  const hCol = 5.6 * s, rCol = 0.30 * s, span = 3.5 * s;
  const lean = 0.028;
  const M = (px, py, pz, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => mat4(x + px * s, y + py * s, z + pz * s, rx, ry, rz, sx * s, sy * s, sz * s);
  const add = (mat, g, m) => B.add(mat, g, m);

  // 柱（带転び）
  for (const sd of [-1, 1]) {
    add(MAT.lacquer, cyl(rCol * 0.92, rCol, hCol, 12), M(sd * span, hCol / 2 - 0.25, 0, 0, 0, -sd * lean));
    // 柱根の石座
    add(MAT.lantern, cyl(rCol * 1.5, rCol * 1.7, 0.42, 12), M(sd * span, 0.05, 0));
    add(MAT.lantern, cyl(rCol * 1.15, rCol * 1.25, 0.5, 10), M(sd * span, 0.42, 0));
  }
  const topY = hCol - 0.25;
  // 島木
  add(MAT.woodWarm, box(span * 2 + 1.5 * s, 0.30 * s, 0.42 * s), M(0, topY + 0.42, 0));
  // 笠木（反曲）
  const kasagi = curvedBeam(span * 2 + 1.9 * s, 0.44 * s, 0.34 * s, 0.55 * s, 30, 2.4);
  add(MAT.woodDark, kasagi, M(0, topY + 0.74, 0));
  add(MAT.woodWarm, curvedBeam(span * 2 + 1.9 * s, 0.30 * s, 0.16 * s, 0.55 * s, 30, 2.4), M(0, topY + 0.92, 0));
  // 貫
  add(MAT.woodWarm, box(span * 2 + 1.1 * s, 0.28 * s, 0.34 * s), M(0, topY - 1.55 * s / 1.0, 0));
  // 楔
  for (const sd of [-1, 1]) add(MAT.woodDark, box(0.16 * s, 0.40 * s, 0.44 * s), M(sd * (span + 0.52 * s), topY - 1.55 * s, 0));
  // 額束
  add(MAT.woodWarm, box(0.42 * s, topY + 0.28 - (topY - 1.55), 0.26 * s), M(0, (topY + 0.28 + topY - 1.55) / 2, 0));
  // 額束装饰
  add(MAT.gold, box(0.5 * s, 0.34 * s, 0.06 * s), M(0, topY - 0.35, 0.16 * s));

  if (opt.shimenawa) {
    // 注连绳
    const pts = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, px = lerp(-(span + 0.3 * s), span + 0.3 * s, t);
      pts.push([px, y + topY - 1.15 + Math.sin(t * Math.PI) * -0.16, z + 0.0]);
    }
    const rope = tube(pts, 0.11 * s, 8, 24);
    add(MAT.rope, rope, mat4(0, 0, 0));   // 点已含世界坐标
    // 纸垂
    const shideG = makeShideGeo(0.17 * s, 0.52 * s);
    for (let i = 0; i < 5; i++) {
      const t = (i + 0.5) / 5, px = lerp(-(span + 0.1 * s), span + 0.1 * s, t);
      const yy = y + topY - 1.26 - Math.sin(t * Math.PI) * 0.16;
      add(MAT.shide, shideG, mat4(x + px, yy - 0.52 * s, z + 0.02, 0, 0, 0, 1, 1, 1));
    }
  }
  return y;
}
function makeShideGeo(w, h) {
  // 之字形纸垂
  const pos = [], uv = [], idx = [];
  const seg = 6;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const y = -t * h;
    const off = (i % 2 ? 1 : -1) * w * 0.22 * (0.4 + t * 0.6);
    const ww = w * (1 - t * 0.25);
    pos.push(off - ww / 2, y, 0, off + ww / 2, y, 0);
    uv.push(0, t, 1, t);
  }
  for (let i = 0; i < seg; i++) {
    const a = i * 2;
    idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return fixWinding(normalizeGeo(g));
}

/* ---------- 本殿 ---------- */
function buildHonden() {
  const B = new Batcher('honden');
  const G = new THREE.Group(); G.name = 'honden';
  const rng = rngFor('honden');
  const LX = LEVELS[4];
  const cx = 0, cz = -8.4;
  const y0 = terrainY(cx, cz);          // 台地地面
  const W = 6.8, D = 3.8;               // 柱间外包尺寸（受 L4 进深 6 限制）
  const hw = W / 2, hd = D / 2;
  const colH = 2.85, baseH = 1.05;
  const floorY = y0 + baseH;

  /* 台基（石坛 + 布石） */
  B.add(MAT.wall, roundedPrism(W + 2.2, D + 2.2, baseH, 0.18, 3), mat4(cx, y0, cz));
  B.add(MAT.lantern, box(W + 2.5, 0.16, D + 2.5), mat4(cx, y0 + baseH - 0.08, cz));
  for (let i = -3; i <= 3; i++) B.add(MAT.lantern, box(0.62, 0.14, 0.62), mat4(cx + i * 1.05, y0 + baseH + 0.02, cz + hd + 0.75));

  /* 床（木地板 + 缘） */
  B.add(MAT.woodWarm, roundedPrism(W + 0.9, D + 0.9, 0.26, 0.1, 2), mat4(cx, floorY - 0.26, cz));
  B.add(MAT.woodDark, box(W + 1.3, 0.10, D + 1.3), mat4(cx, floorY - 0.30, cz));

  /* 柱（12 根，朱漆） */
  const colPos = [];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
    const px = cx + (i / 3 - 0.5) * W, pz = cz + (j / 2 - 0.5) * D;
    if (i === 1 && j === 1) continue;
    colPos.push([px, pz]);
    B.add(MAT.lacquer, cyl(0.155, 0.17, colH, 10), mat4(px, floorY + colH / 2, pz));
    B.add(MAT.gold, cyl(0.185, 0.185, 0.07, 10), mat4(px, floorY + colH - 0.04, pz));
  }

  /* 白壁 + 连子窗 + 蔀戸 */
  const wallT = 0.14;
  // 背墙
  B.add(MAT.plaster, box(W, colH, wallT), mat4(cx, floorY + colH / 2, cz - hd));
  // 侧墙
  for (const sd of [-1, 1]) B.add(MAT.plaster, box(wallT, colH, D), mat4(cx + sd * hw, floorY + colH / 2, cz));
  // 正面：中央蔀戸 + 两侧连子窗
  for (const sd of [-1, 1]) {
    B.add(MAT.plaster, box(W * 0.28, colH, wallT), mat4(cx + sd * W * 0.36, floorY + colH / 2, cz + hd));
  }
  // 蔀戸（两扇）
  for (const sd of [-1, 1]) {
    B.add(MAT.woodDark, box(1.12, colH * 0.86, 0.09), mat4(cx + sd * 0.60, floorY + colH * 0.46, cz + hd + 0.03));
    B.add(MAT.gold, box(1.20, 0.07, 0.13), mat4(cx + sd * 0.60, floorY + colH * 0.90, cz + hd + 0.03));
    B.add(MAT.gold, box(1.20, 0.07, 0.13), mat4(cx + sd * 0.60, floorY + 0.06, cz + hd + 0.03));
    B.add(MAT.gold, box(0.07, colH * 0.86, 0.13), mat4(cx + sd * 1.16, floorY + colH * 0.46, cz + hd + 0.03));
  }
  // 连子窗（竖向格栅）
  for (const sd of [-1, 1]) {
    const wx = cx + sd * W * 0.36;
    B.add(MAT.woodDark, box(1.5, 0.10, 0.18), mat4(wx, floorY + 0.72, cz + hd + 0.02));
    B.add(MAT.woodDark, box(1.5, 0.10, 0.18), mat4(wx, floorY + 1.95, cz + hd + 0.02));
    for (let k = 0; k < 11; k++) {
      const px = wx + (k / 10 - 0.5) * 1.42;
      B.add(MAT.woodLight, box(0.055, 1.24, 0.11), mat4(px, floorY + 1.33, cz + hd + 0.02));
    }
  }

  /* 高栏（回廊栏杆 + 拟宝珠） */
  const railY = floorY + 0.02;
  const railW = W + 1.2, railD = D + 1.2;
  const gib = lathe([[0, 0], [0.075, 0.02], [0.105, 0.09], [0.085, 0.17], [0.045, 0.24], [0.03, 0.30], [0.055, 0.34], [0.0, 0.37]], 12);
  for (const sd of [-1, 1]) {
    // 侧栏杆
    B.add(MAT.lacquer, box(0.10, 0.09, railD), mat4(cx + sd * railW / 2, railY + 0.62, cz));
    B.add(MAT.lacquer, box(0.10, 0.09, railD), mat4(cx + sd * railW / 2, railY + 0.28, cz));
    const n = 7;
    for (let k = 0; k <= n; k++) {
      const pz = cz + (k / n - 0.5) * railD;
      B.add(MAT.lacquer, box(0.09, 0.66, 0.09), mat4(cx + sd * railW / 2, railY + 0.33, pz));
      if (k % 2 === 0) B.add(MAT.gold, gib, mat4(cx + sd * railW / 2, railY + 0.66, pz));
    }
  }
  // 正面栏杆（中间留台阶开口）
  for (const sd of [-1, 1]) {
    const zz = cz + railD / 2, len = (railW - 1.6) / 2, ox = sd * (0.8 + len / 2);
    B.add(MAT.lacquer, box(len, 0.09, 0.10), mat4(cx + ox, railY + 0.62, zz));
    B.add(MAT.lacquer, box(len, 0.09, 0.10), mat4(cx + ox, railY + 0.28, zz));
    for (let k = 0; k <= 4; k++) {
      const px = cx + ox + (k / 4 - 0.5) * len;
      B.add(MAT.lacquer, box(0.09, 0.66, 0.09), mat4(px, railY + 0.33, zz));
      if (k % 2 === 0) B.add(MAT.gold, gib, mat4(px, railY + 0.66, zz));
    }
  }

  /* 正面台阶（含防滑纹） */
  const steps = 5;
  for (let i = 0; i < steps; i++) {
    const sh = baseH / steps;
    B.add(MAT.lantern, box(1.9, sh, 0.42), mat4(cx, y0 + sh / 2 + i * sh, cz + hd + 0.95 - i * 0.42));
    for (let k = -3; k <= 3; k++) B.add(MAT.woodDark, box(0.10, 0.02, 0.34), mat4(cx + k * 0.26, y0 + (i + 1) * sh + 0.01, cz + hd + 0.95 - i * 0.42));
  }

  /* 斗栱（实例化小斗+栱） */
  const bracket = (() => {
    const parts = [];
    parts.push(box(0.26, 0.11, 0.26));
    const arm = box(0.95, 0.10, 0.13); arm.translate(0, 0.11, 0);
    parts.push(arm);
    const arm2 = box(0.13, 0.10, 0.95); arm2.translate(0, 0.22, 0);
    parts.push(arm2);
    const cap = box(0.34, 0.09, 0.34); cap.translate(0, 0.31, 0);
    parts.push(cap);
    return mergeGeometries(parts, false);
  })();
  const bMats = [];
  const byTop = floorY + colH;
  for (const sd of [-1, 1]) {
    for (let k = 0; k <= 8; k++) {
      const pz = cz + (k / 8 - 0.5) * (D + 0.5);
      bMats.push(mat4(cx + sd * (hw + 0.32), byTop, pz, 0, Math.PI / 2, 0));
    }
  }
  for (const sd of [-1, 1]) {
    for (let k = 0; k <= 10; k++) {
      const px = cx + (k / 10 - 0.5) * (W + 0.5);
      bMats.push(mat4(px, byTop, cz + sd * (hd + 0.32), 0, 0, 0));
    }
  }
  const bIM = makeInstanced(bracket, MAT.woodLight, bMats.length, 'dougong');
  fillInstances(bIM, bMats);
  G.add(bIM);

  /* 屋顶（入母屋造 + 瓦片） */
  const roofCfg = { rx: 5.6, rz: 4.4, ridgeLen: 3.1, RH: 2.55, lift: 0.46, curvePow: 0.66 };
  const roofGeo = roofSurfaceGeo(roofCfg, { segU: 26, segV: 8 });
  roofGeo.translate(0, floorY + colH + 0.42, cz);
  B.add(MAT.kawara, roofGeo);
  // 屋顶底面（天花）
  B.add(MAT.woodDark, box(W + 0.4, 0.12, D + 0.4), mat4(cx, floorY + colH + 0.34, cz));
  // 破风板（两侧山墙）
  for (const sd of [-1, 1]) {
    B.add(MAT.woodDark, box(0.12, 1.9, D * 0.62), mat4(cx + sd * (W / 2 + 0.62), floorY + colH + 1.05, cz));
    B.add(MAT.woodLight, curvedBeam(D * 0.72, 0.16, 0.42, 0.28, 18, 2.2), mat4(cx + sd * (W / 2 + 0.64), floorY + colH + 1.9, cz, 0, Math.PI / 2, 0));
  }
  // 蟇股（山墙下的蛙腿形撑）
  for (const sd of [-1, 1]) {
    for (const oz of [-0.75, 0.75]) {
      B.add(MAT.woodLight, lathe([[0.02, 0], [0.30, 0.02], [0.26, 0.42], [0.10, 0.72], [0.03, 0.78]], 8), mat4(cx + sd * (W / 2 + 0.55), floorY + colH + 0.42, cz + oz, 0, 0, 0, 1, 1, 1));
    }
  }
  // 木鼻
  for (const sd of [-1, 1]) B.add(MAT.woodLight, box(0.30, 0.22, 0.5), mat4(cx + sd * (W / 2 + 0.42), floorY + colH + 0.28, cz));

  /* 千木（交叉） */
  for (const sd of [-1, 1]) {
    const px = cx + sd * 2.0;
    B.add(MAT.woodDark, box(0.20, 2.05, 0.20), mat4(px, floorY + colH + 3.35, cz, 0.30, 0, sd * 0.26));
    B.add(MAT.woodDark, box(0.20, 2.05, 0.20), mat4(px, floorY + colH + 3.35, cz, -0.30, 0, sd * 0.26));
  }
  /* 鰹木（6 根） */
  for (let i = 0; i < 6; i++) {
    const px = cx + (i / 5 - 0.5) * 4.2;
    B.add(MAT.woodWarm, cyl(0.135, 0.135, 0.62, 8), mat4(px, floorY + colH + 2.62, cz, 0, 0, Math.PI / 2));
  }
  /* 鬼瓦（脊端） */
  for (const sd of [-1, 1]) {
    const g = lathe([[0.02, 0], [0.26, 0.05], [0.34, 0.22], [0.30, 0.44], [0.16, 0.58], [0.04, 0.62]], 10);
    B.add(MAT.kawaraDk, g, mat4(cx + sd * 3.2, floorY + colH + 2.42, cz, 0, 0, 0, 1.1, 1.3, 1.1));
    B.add(MAT.kawaraDk, box(0.5, 0.22, 0.16), mat4(cx + sd * 3.2, floorY + colH + 2.52, cz + 0.18));
  }

  /* 唐破风（正面入口） */
  const kh = 1.15, kw = 2.9;
  const kara = cuspBeam(kw, kh, 0.34, 0.22, 26);
  B.add(MAT.kawaraDk, kara, mat4(cx, floorY + colH + 1.62, cz + hd + 0.72));
  B.add(MAT.woodLight, cuspBeam(kw * 1.04, kh * 1.04, 0.16, 0.14, 26), mat4(cx, floorY + colH + 1.62, cz + hd + 0.90));
  B.add(MAT.gold, lathe([[0.02, 0], [0.14, 0.05], [0.20, 0.18], [0.13, 0.30], [0.02, 0.36]], 10), mat4(cx, floorY + colH + 1.60, cz + hd + 1.02, Math.PI / 2, 0, 0));
  // 向拝柱
  for (const sd of [-1, 1]) B.add(MAT.lacquer, cyl(0.10, 0.11, 1.75, 8), mat4(cx + sd * 1.25, floorY + 0.875, cz + hd + 1.05));

  /* 注连绳 + 纸垂 + 铃 + 拉绳 */
  const ropeY = floorY + colH + 0.30;
  const rpts = [];
  for (let i = 0; i <= 12; i++) { const t = i / 12; rpts.push([cx + lerp(-2.6, 2.6, t), ropeY - Math.sin(t * Math.PI) * 0.22, cz + hd + 0.42]); }
  B.add(MAT.rope, tube(rpts, 0.085, 8, 20), mat4(0, 0, 0));
  const shideG = makeShideGeo(0.16, 0.46);
  for (let i = 0; i < 6; i++) {
    const t = (i + 0.5) / 6;
    const px = cx + lerp(-2.5, 2.5, t), py = ropeY - Math.sin(t * Math.PI) * 0.22 - 0.05;
    B.add(MAT.shide, shideG, mat4(px, py - 0.44, cz + hd + 0.44));
  }
  // 铃
  const bell = lathe([[0.0, 0], [0.10, 0.01], [0.155, 0.08], [0.175, 0.22], [0.15, 0.34], [0.09, 0.42], [0.055, 0.46], [0.075, 0.50], [0.02, 0.54]], 14);
  B.add(MAT.gold, bell, mat4(cx, ropeY - 0.90, cz + hd + 0.42, Math.PI, 0, 0));
  // 拉绳
  B.add(MAT.rope, cyl(0.045, 0.045, 1.05, 6), mat4(cx, ropeY - 1.42, cz + hd + 0.42));
  B.add(MAT.rope, box(0.16, 0.16, 0.10), mat4(cx, ropeY - 1.98, cz + hd + 0.42));

  /* 赛钱箱（带木格） + 前平台 */
  const boxY = y0 + baseH + 0.9;
  const boxZ = cz + hd + 1.55;
  B.add(MAT.woodDark, box(1.9, 0.62, 0.80), mat4(cx, boxY, boxZ));
  B.add(MAT.woodWarm, box(2.0, 0.10, 0.90), mat4(cx, boxY + 0.36, boxZ));
  for (let i = 0; i < 12; i++) B.add(MAT.woodDark, box(0.055, 0.10, 0.78), mat4(cx - 0.84 + i * 0.155, boxY + 0.34, boxZ));
  for (let i = 0; i < 5; i++) B.add(MAT.woodDark, box(1.85, 0.06, 0.05), mat4(cx, boxY + 0.34, boxZ - 0.32 + i * 0.155));
  B.add(MAT.gold, box(2.1, 0.05, 1.0), mat4(cx, boxY - 0.32, boxZ));

  /* 御币 */
  for (const sd of [-1, 1]) {
    const gx = cx + sd * 0.85, gz = cz + hd + 1.30;
    B.add(MAT.woodLight, cyl(0.035, 0.04, 1.15, 6), mat4(gx, boxY + 1.0, gz));
    B.add(MAT.shide, makeShideGeo(0.13, 0.34), mat4(gx - 0.07, boxY + 1.52, gz));
    B.add(MAT.shide, makeShideGeo(0.13, 0.34), mat4(gx + 0.07, boxY + 1.52, gz));
    B.add(MAT.gold, box(0.22, 0.10, 0.05), mat4(gx, boxY + 1.44, gz));
  }
  /* 香炉 */
  B.add(MAT.metal, lathe([[0.0, 0], [0.22, 0.02], [0.26, 0.10], [0.20, 0.26], [0.22, 0.30]], 12), mat4(cx + 1.75, y0 + 0.1, cz + hd + 1.35));
  B.add(MAT.metal, cyl(0.05, 0.05, 0.16, 6), mat4(cx + 1.75, y0 + 0.42, cz + hd + 1.35));

  const _tileMark = tileMark();
  const _roofBaseY = floorY + colH + 0.42;
  layRoofTiles(roofCfg, { rows: 30, spacing: 0.215 });
  // 向拝屋顶瓦片
  const porchCfg = { rx: 1.85, rz: 1.15, ridgeLen: 0.9, RH: 0.75, lift: 0.18, curvePow: 0.7 };
  const pg = roofSurfaceGeo(porchCfg, { segU: 14, segV: 5 });
  pg.translate(cx, floorY + colH + 1.72, cz + hd + 0.55);
  B.add(MAT.kawaraDk, pg);
  layRoofTiles(porchCfg, { rows: 8, spacing: 0.215, tileScale: 0.86 });
  transformTilesSince(_tileMark, new THREE.Matrix4().makeTranslation(cx, _roofBaseY, cz));
  const _nTiles = (TILE_SETS.flat.length - _tileMark.flat)
    + (TILE_SETS.round.length - _tileMark.round)
    + (TILE_SETS.tomoe.length - _tileMark.tomoe)
    + (TILE_SETS.drip.length - _tileMark.drip);
  DIAG.stats.hondenTiles = Number.isFinite(_nTiles) ? _nTiles : 'NaN:' + JSON.stringify(_tileMark);

  AO_OCCLUDERS.push({ x: cx, y: y0 + 1.6, z: cz, r: 4.6, w: 0.9 });
  AO_OCCLUDERS.push({ x: cx, y: y0 + 3.9, z: cz, r: 5.6, w: 0.55 });
  AO_OCCLUDERS.push({ x: cx, y: y0 + 1.0, z: cz + hd + 2.4, r: 2.0, w: 0.6 });
  const n = B.flush(G, { hull: CONFIG.outline.hullWidth * 1.3, layer: 1, ao: { groundBoost: true, groundY: y0, radius: 1.3, strength: 0.55 } });
  root.add(G);
  DIAG.stats.hondenMeshes = n;
  return { group: G, bellPos: new THREE.Vector3(cx, ropeY - 0.90, cz + hd + 0.42), roofCfg, floorY, cx, cz, y0 };
}

/* ═══════════════════════════════════════════════════════════════════════════
   7 · 院落建筑 / 参道 / 石阶 / 太鼓桥 / 道具

const LIGHTS_NIGHT = [];   // 夜间点光源位置

/** 通用社殿：台基 + 柱 + 壁 + 扉 + 屋顶 */
function buildHall(B, o) {
  const { x, z, w, d, h, roof, y = terrainY(x, z), rot = 0 } = o;
  const hw = w / 2, hd = d / 2;
  /* 注意：M 的 py 为「绝对高度」，调用方需自行含 y（fy 已含 y，故不可再叠加） */
  const M = (px, py, pz, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return mat4(x + px * c - pz * s, py, z + px * s + pz * c, rx, ry + rot, rz, sx, sy, sz);
  };
  B.add(MAT.wall, roundedPrism(w + 1.0, d + 1.0, o.baseH ?? 0.55, 0.12, 2), M(0, y, 0));
  const fy = y + (o.baseH ?? 0.55);
  B.add(MAT.woodWarm, roundedPrism(w + 0.4, d + 0.4, 0.2, 0.08, 2), M(0, fy - 0.2, 0));
  const nColX = Math.max(2, Math.round(w / 2.2) + 1), nColZ = Math.max(2, Math.round(d / 2.2) + 1);
  for (let i = 0; i < nColX; i++) for (let j = 0; j < nColZ; j++) {
    if (i > 0 && i < nColX - 1 && j > 0 && j < nColZ - 1) continue;
    const px = (i / (nColX - 1) - 0.5) * w, pz = (j / (nColZ - 1) - 0.5) * d;
    B.add(MAT.lacquer, cyl(0.10, 0.115, h, 8), M(px, fy + h / 2, pz));
  }
  B.add(MAT.plaster, box(w, h, 0.1), M(0, fy + h / 2, -hd));
  for (const sd of [-1, 1]) B.add(MAT.plaster, box(0.1, h, d), M(sd * hw, fy + h / 2, 0));
  B.add(MAT.plaster, box(w, h, 0.1), M(0, fy + h / 2, hd));
  if (o.door !== false) {
    for (const sd of [-1, 1]) {
      B.add(MAT.woodDark, box(w * 0.32, h * 0.86, 0.07), M(sd * w * 0.17, fy + h * 0.45, hd + 0.02));
      B.add(MAT.gold, box(w * 0.34, 0.06, 0.1), M(sd * w * 0.17, fy + h * 0.88, hd + 0.02));
    }
  }
  if (o.engawa) {
    B.add(MAT.woodLight, box(w + 1.5, 0.14, 0.75), M(0, fy - 0.05, hd + 0.75));
    for (const sd of [-1, 1]) B.add(MAT.woodLight, box(0.75, 0.14, d + 1.5), M(sd * (hw + 0.75), fy - 0.05, 0));
    for (let i = 0; i < 6; i++) B.add(MAT.woodDark, cyl(0.05, 0.05, 0.42, 6), M(-hw - 0.2 + i * (w + 0.4) / 5, fy - 0.28, hd + 0.75));
  }
  if (o.lattice) {
    for (const sd of [-1, 1]) {
      const wx = sd * hw * 0.55;
      for (let k = 0; k < 8; k++) B.add(MAT.woodLight, box(0.05, h * 0.5, 0.06), M(wx + (k / 7 - 0.5) * 0.9, fy + h * 0.55, hd + 0.03));
      B.add(MAT.woodDark, box(1.0, 0.07, 0.09), M(wx, fy + h * 0.82, hd + 0.03));
      B.add(MAT.woodDark, box(1.0, 0.07, 0.09), M(wx, fy + h * 0.29, hd + 0.03));
    }
  }
  if (o.brackets !== false) {
    for (let k = 0; k <= 8; k++) {
      B.add(MAT.woodLight, box(0.22, 0.10, 0.22), M((k / 8 - 0.5) * (w + 0.3), fy + h + 0.05, hd + 0.24));
      B.add(MAT.woodLight, box(0.22, 0.10, 0.22), M((k / 8 - 0.5) * (w + 0.3), fy + h + 0.05, -hd - 0.24));
    }
  }
  const rc = Object.assign({ rx: hw + 1.25, rz: hd + 1.25, ridgeLen: Math.max(0.4, hw * 0.5), RH: o.roofH ?? h * 0.72, lift: 0.34, curvePow: 0.7 }, o.roofCfg || {});
  const rg = roofSurfaceGeo(rc, { segU: 16, segV: 6 });
  rg.applyMatrix4(new THREE.Matrix4().makeRotationY(rot));
  rg.translate(x, fy + h + 0.16, z);
  B.add(roof === 'hiwada' ? MAT.hiwada : roof === 'dark' ? MAT.kawaraDk : MAT.kawara, rg);
  // 瓦片（生成后整体变换到世界空间）
  const before = tileMark();
  layRoofTiles(rc, { rows: o.tileRows ?? 12, spacing: 0.215, tileScale: o.tileScale ?? 0.9 });
  const R = new THREE.Matrix4().makeTranslation(x, fy + h + 0.16, z)
    .multiply(new THREE.Matrix4().makeRotationY(rot));
  transformTilesSince(before, R);
  if (o.steps !== false) {
    for (let i = 0; i < 3; i++) B.add(MAT.lantern, box(w * 0.42, 0.18, 0.3), M(0, y + 0.09 + i * 0.18, hd + 0.95 - i * 0.3));
  }
  return { fy, h, x, z, rot, w, d };
}

/* ---------- 常夜灯 ---------- */
function stoneLanternGeo() {
  const parts = [];
  const add = (g, m) => { const c = g.clone(); c.applyMatrix4(m); parts.push(c); };
  add(cyl(0.24, 0.30, 0.18, 8), mat4(0, 0.09, 0));
  add(cyl(0.11, 0.13, 0.62, 8), mat4(0, 0.49, 0));
  add(cyl(0.26, 0.20, 0.10, 8), mat4(0, 0.85, 0));
  add(cyl(0.24, 0.24, 0.34, 8), mat4(0, 1.07, 0));
  add(lathe([[0.02, 0], [0.40, 0.03], [0.36, 0.16], [0.20, 0.24], [0.10, 0.28], [0.03, 0.30]], 10), mat4(0, 1.24, 0));
  add(sph(0.085, 8, 6), mat4(0, 1.58, 0));
  return mergeGeometries(parts.map(p => normalizeGeo(p)), false);
}
function lanternGlassGeo() {
  const parts = [];
  for (let i = 0; i < 4; i++) {
    const g = box(0.20, 0.24, 0.03);
    const a = i / 4 * TAU;
    const c = g.clone(); c.applyMatrix4(mat4(Math.sin(a) * 0.20, 1.07, Math.cos(a) * 0.20, 0, a, 0));
    parts.push(c);
  }
  return mergeGeometries(parts.map(p => normalizeGeo(p)), false);
}

/* ---------- 狛犬 ---------- */
function buildKomainu(B, x, z, sd) {
  const y = terrainY(x, z);
  const M = (px, py, pz, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => mat4(x + px * sd, y + py, z + pz, rx, ry * sd, rz, sx, sy, sz);
  B.add(MAT.lantern, box(0.95, 0.62, 0.72), M(0, 0.31, 0));
  B.add(MAT.lantern, box(1.05, 0.10, 0.82), M(0, 0.66, 0));
  B.add(MAT.lantern, sph(0.30, 10, 8), M(0, 1.05, 0, 0, 0, 0, 1, 1.25, 1.5));
  for (const ox of [-0.19, 0.19]) B.add(MAT.lantern, cyl(0.075, 0.09, 0.42, 6), M(ox, 0.87, 0.24, 0.2));
  for (const ox of [-0.19, 0.19]) B.add(MAT.lantern, cyl(0.075, 0.09, 0.40, 6), M(ox, 0.86, -0.22, -0.15));
  B.add(MAT.lantern, sph(0.21, 10, 8), M(0, 1.44, 0.16, 0.1, 0, 0, 1, 1, 1.1));
  for (const ox of [-0.14, 0.14]) B.add(MAT.lantern, sph(0.075, 6, 5), M(ox, 1.60, 0.10, 0, 0, 0, 1, 1.5, 0.7));
  B.add(MAT.lantern, cyl(0.05, 0.11, 0.55, 6), M(0, 1.35, -0.34, -0.7));
  B.add(MAT.lantern, box(1.1, 0.06, 0.86), M(0, 0.72, 0));
}

/* ---------- 末社（稻荷系） ---------- */
function buildMassha(B, x, z, rot, s) {
  const y = terrainY(x, z);
  buildHall(B, {
    x, z, w: 1.9 * s, d: 1.6 * s, h: 1.5 * s, y, rot, baseH: 0.4 * s,
    roof: 'dark', roofH: 1.0 * s, tileRows: 7, tileScale: 0.8, brackets: false, steps: true, door: true,
  });
  for (const sd of [-1, 1]) {
    const fx = x + Math.cos(rot) * sd * 1.25 * s - Math.sin(rot) * (1.5 * s);
    const fz = z + Math.sin(rot) * sd * 1.25 * s + Math.cos(rot) * (1.5 * s);
    B.add(MAT.lantern, box(0.34, 0.42, 0.34), mat4(fx, y + 0.21, fz));
    B.add(MAT.lantern, box(0.26, 0.62, 0.3), mat4(fx, y + 0.72, fz));
    B.add(MAT.lantern, sph(0.13, 8, 6), mat4(fx, y + 1.14, fz, 0, 0, 0, 1, 1, 1.2));
    B.add(MAT.lantern, cyl(0.05, 0.09, 0.24, 5), mat4(fx + 0.1, y + 1.28, fz + 0.1, 0, 0, -0.5));
    B.add(MAT.lantern, cyl(0.05, 0.09, 0.24, 5), mat4(fx - 0.1, y + 1.28, fz + 0.1, 0, 0, 0.5));
    B.add(MAT.lantern, cyl(0.04, 0.06, 0.5, 5), mat4(fx, y + 0.85, fz - 0.2, 0.7));
  }
  const nT = 6;
  for (let i = 0; i < nT; i++) {
    const t = (i + 1) / (nT + 1);
    const px = x - Math.sin(rot) * (1.8 + t * 3.2), pz = z - Math.cos(rot) * (1.8 + t * 3.2);
    const gy = terrainY(px, pz);
    const w = 1.05 - t * 0.1, hh = 1.5 - t * 0.12;
    for (const sd of [-1, 1]) B.add(MAT.lacquer, cyl(0.055, 0.06, hh, 6), mat4(px + Math.cos(rot) * sd * w, gy + hh / 2, pz + Math.sin(rot) * sd * w));
    B.add(MAT.lacquer, curvedBeam(w * 2 + 0.5, 0.13, 0.10, 0.16, 12, 2.2), mat4(px, gy + hh + 0.06, pz, 0, rot, 0));
    B.add(MAT.lacquer, box(w * 2 + 0.2, 0.10, 0.08), mat4(px, gy + hh - 0.42, pz, 0, rot, 0));
  }
}

/* ---------- 参道 / 石阶 / 太鼓桥 ---------- */
function buildPaths(B) {
  const rng = rngFor('paths');
  const step = 0.72;
  for (let z = 19.6; z > 1.2; z -= step) {
    const y = terrainY(0, z);
    const w = 3.1 + Math.sin(z * 0.7) * 0.06;
    B.add(MAT.slab, box(w, 0.12, step * 0.92), mat4(0, y + 0.05, z));
    for (const sd of [-1, 1]) B.add(MAT.lantern, box(0.22, 0.16, step * 0.92), mat4(sd * (w / 2 + 0.13), y + 0.07, z));
  }
  const stair = (z0, z1, y0, y1, w, n) => {
    for (let i = 0; i < n; i++) {
      const t2 = (i + 1) / n;
      const z = lerp(z0, z1, t2), y = lerp(y0, y1, t2);
      const depth = Math.abs(z1 - z0) / n;
      B.add(MAT.slab, box(w, y1 - y0, depth * 1.02), mat4(0, y - (y1 - y0) / 2, z));
      B.add(MAT.lantern, box(w + 0.1, 0.07, depth * 0.96), mat4(0, y + 0.03, z));
      for (let k = -4; k <= 4; k++) B.add(MAT.woodDark, box(0.09, 0.018, depth * 0.8), mat4(k * (w / 9), y + 0.07, z));
    }
  };
  /* 台阶一律布置在「下级台地」范围内，顶端与上级台地地面齐平 */
  stair(14.5,  12.10, LEVELS[0].y, LEVELS[1].y, 3.6,  6);   // L0 → L1（z 12 处）
  stair( 8.6,   6.10, LEVELS[1].y, LEVELS[2].y, 3.6,  8);   // L1 → L2（z 6 处）
  stair( 4.4,   1.10, LEVELS[2].y, LEVELS[3].y, 3.4, 11);   // L2 → L3（z 1 处）
  stair(-1.2,  -4.95, LEVELS[3].y, LEVELS[4].y, 3.2, 13);   // L3 → L4（z -5 处）
  /* L4 → L5 侧向石阶（后山林缘） */
  for (const sd of [-1, 1]) {
    const sx = sd * 9.0;
    for (let i = 0; i < 10; i++) {
      const t2 = (i + 1) / 10;
      const z = lerp(-7.4, -10.9, t2), y = lerp(LEVELS[4].y, LEVELS[5].y, t2);
      B.add(MAT.slab, box(2.6, LEVELS[5].y - LEVELS[4].y, 0.36), mat4(sx, y - (LEVELS[5].y - LEVELS[4].y) / 2, z));
      B.add(MAT.lantern, box(2.7, 0.07, 0.34), mat4(sx, y + 0.03, z));
    }
  }

  /* 太鼓桥 */
  const bx0 = -15.0, bx1 = -4.0, bz = 8.2, arcN = 22;
  const arcY = (t) => Math.sin(t * Math.PI) * 1.05;
  const gib = lathe([[0, 0], [0.075, 0.02], [0.105, 0.09], [0.085, 0.17], [0.045, 0.24], [0.03, 0.30], [0.055, 0.34], [0.0, 0.37]], 10);
  for (let i = 0; i < arcN; i++) {
    const t0 = i / arcN, t1 = (i + 1) / arcN;
    const x0 = lerp(bx0, bx1, t0), x1 = lerp(bx0, bx1, t1);
    const y0 = CONFIG.water.waterLevel + 0.42 + arcY(t0), y1 = CONFIG.water.waterLevel + 0.42 + arcY(t1);
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    B.add(MAT.woodDark, box(len * 1.06, 0.16, 1.55), mat4(cx, cy, bz, 0, 0, ang));
    for (const sd of [-1, 1]) {
      B.add(MAT.lacquer, box(len * 1.06, 0.09, 0.09), mat4(cx, cy + 0.72, bz + sd * 0.68, 0, 0, ang));
      B.add(MAT.lacquer, box(len * 1.06, 0.07, 0.07), mat4(cx, cy + 0.36, bz + sd * 0.68, 0, 0, ang));
      B.add(MAT.lacquer, box(0.07, 0.76, 0.07), mat4(cx, cy + 0.36, bz + sd * 0.68, 0, 0, ang));
      if (i % 4 === 0) B.add(MAT.gold, gib, mat4(cx, cy + 0.76, bz + sd * 0.68));
    }
    if (i % 7 === 3) B.add(MAT.wall, box(0.7, 1.7, 1.9), mat4(cx, cy - 0.95, bz));
  }
  /* 踏石 */
  const pc = CONFIG.water.pondCenter;
  for (let i = 0; i < 9; i++) {
    const t = i / 8, a = 2.1 + t * 1.5;
    const px = pc[0] + Math.cos(a) * (CONFIG.water.pondRadius - 0.6 - t * 0.5);
    const pz = pc[2] + Math.sin(a) * (CONFIG.water.pondRadius - 0.6 - t * 0.5);
    B.add(MAT.lantern, cyl(0.34 + rng() * 0.12, 0.30, 0.22, 7), mat4(px, CONFIG.water.waterLevel + 0.02, pz, rng() * 0.2, rng() * TAU, rng() * 0.2));
  }
}

/* ---------- 塀 / 门 / 回廊 ---------- */
function buildWallsAndGates(B) {
  const fence = (x0, z0, x1, z1, hgt, kind) => {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.round(len / 1.2));
    const rot = Math.atan2(z1 - z0, x1 - x0);
    for (let i = 0; i <= n; i++) {
      const t = i / n, px = lerp(x0, x1, t), pz = lerp(z0, z1, t);
      const y = terrainY(px, pz);
      B.add(MAT.woodDark, box(0.14, hgt + 0.4, 0.14), mat4(px, y + (hgt + 0.4) / 2, pz, 0, rot, 0));
      if (i < n) {
        const mx = lerp(x0, x1, (i + 0.5) / n), mz = lerp(z0, z1, (i + 0.5) / n);
        const my = terrainY(mx, mz);
        B.add(MAT.woodWarm, box(len / n * 0.98, 0.10, 0.09), mat4(mx, my + hgt, mz, 0, rot, 0));
        B.add(MAT.woodWarm, box(len / n * 0.98, 0.10, 0.09), mat4(mx, my + hgt * 0.55, mz, 0, rot, 0));
        B.add(kind === 'board' ? MAT.woodLight : MAT.woodDark, box(len / n * 0.94, hgt * 0.62, 0.06), mat4(mx, my + hgt * 0.62, mz, 0, rot, 0));
        if (kind !== 'board')
          for (let k = 0; k < 4; k++)
            B.add(MAT.woodDark, box(0.06, hgt * 0.5, 0.1), mat4(lerp(x0, x1, (i + (k + 1) / 5) / n), my + hgt * 0.5, lerp(z0, z1, (i + (k + 1) / 5) / n), 0, rot, 0));
        B.add(MAT.kawaraDk, box(len / n * 1.02, 0.07, 0.3), mat4(mx, my + hgt + 0.13, mz, 0, rot, 0));
      }
    }
  };
  fence(-15.5, 1.2, -15.5, -4.6, 1.5, 'see');
  fence(15.5, 1.2, 15.5, -4.6, 1.5, 'see');
  fence(-15.5, -4.6, -6.5, -4.6, 1.4, 'board');
  fence(6.5, -4.6, 15.5, -4.6, 1.4, 'board');
  fence(-15.5, 12.0, -12.0, 12.0, 1.3, 'see');
  fence(12.0, 12.0, 15.5, 12.0, 1.3, 'see');

  const gate = (x, z, rot, s) => {
    const y = terrainY(x, z);
    const M = (px, py, pz, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => {
      const c = Math.cos(rot), sn = Math.sin(rot);
      return mat4(x + (px * c - pz * sn) * s, y + py * s, z + (px * sn + pz * c) * s, rx, ry + rot, rz, sx * s, sy * s, sz * s);
    };
    const W = 3.6, H = 2.9;
    for (const sd of [-1, 1]) {
      B.add(MAT.lacquer, cyl(0.15, 0.17, H, 10), M(sd * W / 2, H / 2, 0));
      B.add(MAT.lantern, cyl(0.28, 0.32, 0.4, 10), M(sd * W / 2, 0.2, 0));
    }
    B.add(MAT.lacquer, box(W + 0.7, 0.28, 0.34), M(0, H - 0.2, 0));
    B.add(MAT.lacquer, box(W + 0.2, 0.22, 0.28), M(0, H * 0.55, 0));
    B.add(MAT.woodDark, box(W + 1.4, 0.34, 0.9), M(0, H + 0.16, 0));
    B.add(MAT.kawaraDk, curvedBeam(W + 2.2, 0.55, 0.28, 0.34, 20, 2.3), M(0, H + 0.52, 0));
    B.add(MAT.woodLight, box(W * 0.34, H * 0.8, 0.09), M(-W * 0.25, H * 0.42, 0));
    B.add(MAT.woodLight, box(W * 0.34, H * 0.8, 0.09), M(W * 0.25, H * 0.42, 0));
    B.add(MAT.kawara, box(0.3, 0.3, 0.24), M(0, H + 0.62, 0.2));
  };
  gate(0, 6.1, 0, 1.0);
  gate(0, 0.9, 0, 1.15);
  gate(0, -5.2, 0, 0.9);

  const corridor = (x0, z0, x1, z1) => {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(2, Math.round(len / 1.6));
    const rot = Math.atan2(z1 - z0, x1 - x0);
    for (let i = 0; i <= n; i++) {
      const t = i / n, px = lerp(x0, x1, t), pz = lerp(z0, z1, t);
      const y = terrainY(px, pz);
      for (const sd of [-1, 1]) B.add(MAT.lacquer, cyl(0.09, 0.10, 2.2, 8), mat4(px + Math.sin(rot) * sd * 1.0, y + 1.1, pz - Math.cos(rot) * sd * 1.0));
      if (i < n) {
        const mx = lerp(x0, x1, (i + 0.5) / n), mz = lerp(z0, z1, (i + 0.5) / n);
        const my = terrainY(mx, mz);
        B.add(MAT.woodLight, box(len / n * 1.02, 0.12, 2.3), mat4(mx, my + 0.34, mz, 0, rot, 0));
        B.add(MAT.woodWarm, box(len / n * 1.02, 0.09, 2.4), mat4(mx, my + 2.2, mz, 0, rot, 0));
        B.add(MAT.kawara, box(len / n * 1.02, 0.10, 3.0), mat4(mx, my + 2.42, mz, 0, rot, 0));
        B.add(MAT.woodDark, box(len / n * 1.02, 0.05, 0.16), mat4(mx, my + 2.50, mz - 1.42, 0, rot, 0));
        B.add(MAT.woodDark, box(len / n * 1.02, 0.05, 0.16), mat4(mx, my + 2.50, mz + 1.42, 0, rot, 0));
        for (const sd of [-1, 1]) B.add(MAT.woodDark, box(len / n * 1.02, 0.1, 0.08), mat4(mx, my + 0.92, mz + sd * 0.98, 0, rot, 0));
      }
    }
  };
  corridor(-6.5, -2.0, -4.2, -4.6);
  corridor(6.5, -2.0, 4.2, -4.6);
}

/* ---------- 道具 ---------- */
function buildProps(B) {
  const rng = rngFor('props');
  /* 手水舍 */
  {
    const x = -6.8, z = 4.4, y = terrainY(x, z);

/** 构建期布局自检：矩形重叠检测（含水面），发现即写入 DIAG.errors */
function validateLayout() {
  const S = [
    { n: 'honden',   x: 0,    z: -8.4,  w: 9.2,  d: 6.2, y: LEVELS[4].y },
    { n: 'chozuya',  x: -6.8, z: 4.4,   w: 3.3,  d: 2.7, y: LEVELS[2].y },
    { n: 'emado',    x: 7.6,  z: 8.4,   w: 3.4,  d: 2.8, y: LEVELS[1].y },
    { n: 'kaguraden',x: 8.2,  z: -2.2,  w: 4.6,  d: 4.0, y: LEVELS[3].y },
    { n: 'shamusho', x: -8.4, z: -2.2,  w: 5.0,  d: 4.2, y: LEVELS[3].y },
    { n: 'kura',     x: -11.0,z: -1.6,  w: 3.4,  d: 3.0, y: LEVELS[3].y },
    { n: 'massha1',  x: -6.8, z: -13.6, w: 2.3,  d: 2.0, y: LEVELS[5].y },
    { n: 'massha2',  x: 6.2,  z: -13.2, w: 2.3,  d: 2.0, y: LEVELS[5].y },
    { n: 'pond',     x: CONFIG.water.pondCenter[0], z: CONFIG.water.pondCenter[2],
      w: CONFIG.water.pondRadius * 2.1, d: CONFIG.water.pondRadius * 2.1, y: CONFIG.water.waterLevel, water: true },
    { n: 'bridge',   x: -9.5, z: 8.2,   w: 11.5, d: 1.7, y: LEVELS[1].y, water: true },
  ];
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j];
    const ox = (a.w + b.w) / 2 - Math.abs(a.x - b.x);
    const oz = (a.d + b.d) / 2 - Math.abs(a.z - b.z);
    if (ox > 0.15 && oz > 0.15 && Math.abs(a.y - b.y) < 2.5) {
      if (a.water && b.water) continue;          // 桥跨水面是有意的
      DIAG.errors.push('LAYOUT overlap: ' + a.n + ' x ' + b.n +
        ' (dx=' + ox.toFixed(2) + ', dz=' + oz.toFixed(2) + ')');
    }
  }
  // 结构是否压在池塘水面上
  const pc = CONFIG.water.pondCenter, PR = CONFIG.water.pondRadius;
  for (const s2 of S) {
    if (s2.water) continue;
    const d = Math.hypot(s2.x - pc[0], s2.z - pc[2]);
    if (d < PR + Math.min(s2.w, s2.d) * 0.4) DIAG.errors.push('LAYOUT in pond: ' + s2.n + ' d=' + d.toFixed(2));
  }
}
