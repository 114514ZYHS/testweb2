/* ---------- L-system / 递归分枝 ---------- */
function growTree(type, seed, scale = 1) {
  const rng = mulberry32(seed);
  const branches = [], leaves = [];
  const cfg = {
    cedar:  { levels: 5, len: 1.35, rad: 0.16, spread: 0.44, up: 0.82, taper: 0.74, lw: 0.95, leafAt: 2, leafSize: 0.55, leafCount: 3, straight: 0.94 },
    sakura: { levels: 4, len: 1.15, rad: 0.19, spread: 0.82, up: 0.58, taper: 0.70, lw: 1.35, leafAt: 2, leafSize: 0.72, leafCount: 5, straight: 0.55 },
    maple:  { levels: 4, len: 1.05, rad: 0.15, spread: 0.72, up: 0.62, taper: 0.70, lw: 1.15, leafAt: 2, leafSize: 0.62, leafCount: 4, straight: 0.6 },
    pine:   { levels: 4, len: 1.05, rad: 0.15, spread: 0.95, up: 0.34, taper: 0.66, lw: 1.5, leafAt: 2, leafSize: 0.66, leafCount: 4, straight: 0.35 },
    camphor:{ levels: 5, len: 1.45, rad: 0.30, spread: 0.75, up: 0.70, taper: 0.72, lw: 2.1, leafAt: 2, leafSize: 0.78, leafCount: 5, straight: 0.7 },
    shrub:  { levels: 2, len: 0.55, rad: 0.07, spread: 1.0, up: 0.55, taper: 0.7, lw: 0.8, leafAt: 1, leafSize: 0.5, leafCount: 5, straight: 0.4 },
  }[type] || {};
  const c = cfg;
  const up = new THREE.Vector3(0, 1, 0);

  function seg(p, dir, len, rad, depth, maxDepth) {
    const end = p.clone().addScaledVector(dir, len);
    branches.push({ a: p.clone(), b: end.clone(), ra: rad, rb: rad * c.taper, depth });
    if (depth >= maxDepth || rad < 0.018) {
      // 叶簇
      const n = c.leafCount + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) {
        const jitter = new THREE.Vector3(gauss(rng), gauss(rng) * 0.6, gauss(rng)).multiplyScalar(len * 0.75);
        leaves.push({
          p: end.clone().add(jitter),
          s: c.leafSize * (0.75 + rng() * 0.6),
          r: rng() * TAU, r2: rng() * TAU,
          shade: 0.62 + rng() * 0.5,
        });
      }
      return;
    }
    const nB = depth === 0 ? (type === 'bamboo' ? 3 : 2 + Math.floor(rng() * 2)) : 2 + Math.floor(rng() * 2);
    for (let i = 0; i < nB; i++) {
      const ax = new THREE.Vector3(gauss(rng), gauss(rng), gauss(rng)).normalize();
      const nd = dir.clone().multiplyScalar(c.straight)
        .addScaledVector(ax, c.spread * (0.6 + rng() * 0.7))
        .addScaledVector(up, c.up * (1 - depth / maxDepth) * 0.9)
        .normalize();
      const nl = len * (0.68 + rng() * 0.16) * (depth === 0 ? 1.0 : 0.92);
      seg(end, nd, nl, rad * c.taper * (0.94 + rng() * 0.12), depth + 1, maxDepth);
    }
  }
  seg(new THREE.Vector3(0, 0, 0), up.clone(), c.len * scale * (0.9 + rng() * 0.25), c.rad * scale * (0.9 + rng() * 0.3), 0, c.levels);
  return { branches, leaves, height: c.len * scale * c.levels * 0.62 };
}

/** 树枝几何（锥形圆柱，沿线段） */
function branchGeometry(branches, radialSeg) {
  const parts = [];
  const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion(), dir = new THREE.Vector3();
  for (const b of branches) {
    dir.subVectors(b.b, b.a);
    const len = dir.length();
    if (len < 1e-4) continue;
    const g = cyl(Math.max(0.006, b.rb), Math.max(0.008, b.ra), len, radialSeg, true);
    q.setFromUnitVectors(up, dir.clone().normalize());
    const m = new THREE.Matrix4().compose(
      b.a.clone().addScaledVector(dir, 0.5), q, new THREE.Vector3(1, 1, 1));
    g.applyMatrix4(m);
    parts.push(g);
  }
  if (!parts.length) return null;
  return mergeGeometries(parts, false);
}

/** 叶簇几何（交叉四边形，合并） */
function leafGeometry(leaves, colors, cross = 2) {
  const parts = [];
  const base = new THREE.PlaneGeometry(1, 1);
  for (const l of leaves) {
    const col = colors(l);
    for (let k = 0; k < cross; k++) {
      const g = base.clone();
      const m = new THREE.Matrix4().compose(
        l.p.clone(),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(l.r2, l.r + k * Math.PI / cross, l.r2 * 0.5, 'YXZ')),
        new THREE.Vector3(l.s, l.s, l.s));
      g.applyMatrix4(m);
      const n = g.attributes.position.count;
      const ca = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { ca[i * 3] = col.r; ca[i * 3 + 1] = col.g; ca[i * 3 + 2] = col.b; }
      g.setAttribute('color', new THREE.BufferAttribute(ca, 3));
      parts.push(normalizeGeo(g));
    }
  }
  if (!parts.length) return null;
  return mergeGeometries(parts, false);
}

/** 竹丛 */
function bambooCluster(seed, x, z, y, n = 9, scale = 1) {
  const rng = mulberry32(seed);
  const culms = [], leaves = [];
  for (let i = 0; i < n; i++) {
    const px = x + (rng() - 0.5) * 1.5 * scale, pz = z + (rng() - 0.5) * 1.5 * scale;
    const h = (2.6 + rng() * 2.6) * scale;
    const lean = (rng() - 0.5) * 0.16;
    const segs = 7;
    let cp = new THREE.Vector3(px, y, pz);
    for (let s = 0; s < segs; s++) {
      const t = s / segs;
      const np = new THREE.Vector3(px + lean * t * t * 1.6, y + h * (s + 1) / segs, pz + lean * t * t * 0.8);
      culms.push({ a: cp.clone(), b: np.clone(), ra: 0.055 * scale * (1 - t * 0.55), rb: 0.05 * scale * (1 - (t + 0.14) * 0.55), depth: s });
      cp = np;
      if (s >= 2 && rng() < 0.85) {
        for (let k = 0; k < 4; k++) {
          leaves.push({
            p: cp.clone().add(new THREE.Vector3((rng() - 0.5) * 1.5, (rng() - 0.3) * 0.7, (rng() - 0.5) * 1.5)),
            s: (0.42 + rng() * 0.3) * scale, r: rng() * TAU, r2: rng() * TAU, shade: 0.7 + rng() * 0.4,
          });
        }
      }
    }
  }
  return { culms, leaves };
}

/* ---------- 树木 LOD 装配 ---------- */
const BLOCKED = [];
function addBlocked(x, z, r) { BLOCKED.push({ x, z, r }); }
function isFree(x, z) {
  for (let i = 0; i < BLOCKED.length; i++) {
    const b = BLOCKED[i];
    const dx = x - b.x, dz = z - b.z;
    if (dx * dx + dz * dz < b.r * b.r) return false;
  }
  return true;
}

function registerBlockedZones() {
  const zones = [
    [0, 16.4, 4.0], [0, 8.4, 3.4], [0, 2.6, 3.0],       // 三座鸟居（柱跨 ±3.5）
    [0, 11, 2.4], [0, 4, 2.2], [0, -2, 2.2], [0, -8, 2.6], [0, -14, 2.2],  // 参道走廊
    [0, 6.1, 2.4], [0, 0.9, 2.6],                        // 四脚门 / 中门
    [0, -8.4, 5.2], [0, -6.2, 4.4], [0, -10.6, 5.4], [0, -12.8, 5.2], [0, -14.9, 5.6],  // 本殿及后方净空
    [-6.8, 4.4, 2.6], [7.6, 8.4, 2.6],                   // 手水舍 / 绘马堂
    [8.2, -2.2, 3.0], [-8.4, -2.2, 3.2], [-11.0, -1.6, 2.4], // 神乐殿 / 社务所 / 藏
    [-9.5, 8.2, 6.2],                                    // 池塘
    [-6.8, -13.6, 2.6], [6.2, -13.2, 2.4],               // 末社
    [-2.6, 0.2, 1.0], [2.6, 0.2, 1.0],                   // 狛犬
    [6.6, 3.4, 1.4], [-3.6, 13.2, 1.2], [-6.4, 1.6, 1.4], [4.8, 4.6, 1.4],
    [5.4, 10.2, 1.6], [-3.2, 16.6, 1.2], [4.4, 15.0, 1.2], [-4.2, 4.2, 1.2],
  ];
  for (const [x, z, r] of zones) addBlocked(x, z, r);
}

function buildFlora() {
  const rng = rngFor('flora');
  registerBlockedZones();
  const G = new THREE.Group(); G.name = 'flora';
  const barkB = new Batcher('treeBark');
  const treeList = [];

  /* --- 树木布置 --- */
  const place = (type, x, z, scale, seed, tint) => {
    const t = growTree(type, seed, scale);
    const gy = terrainY(x, z);
    // 关键：骨架是在原点生成的，必须整体平移到 (x, gy, z)
    for (const b of t.branches) {
      b.a.x += x; b.a.y += gy; b.a.z += z;
      b.b.x += x; b.b.y += gy; b.b.z += z;
    }
    for (const l of t.leaves) { l.p.x += x; l.p.y += gy; l.p.z += z; }
    treeList.push({ type, x, z, y: gy, scale, tree: t, tint, seed });
    return t;
  };
  // 杉木成列（L5/L6 后山）
  for (let row = 0; row < CONFIG.trees.cedarRows; row++) {
    for (let i = 0; i < CONFIG.trees.cedarPerRow; i++) {
      const t = (i + 0.5) / CONFIG.trees.cedarPerRow;
      const x = lerp(-15.5, 15.5, t) + (row % 2 ? 0.7 : -0.7) + gauss(rng) * 0.5;
      const z = -13.7 - row * 2.2 + gauss(rng) * 0.5;
      if (!isFree(x, z)) continue;
      place('cedar', x, z, 1.35 + rng() * 0.5, 1000 + row * 31 + i, new THREE.Color(0.30 + rng() * 0.14, 0.52 + rng() * 0.16, 0.30 + rng() * 0.1));
    }
  }
  // 樱（参道两侧）
  for (let i = 0; i < CONFIG.trees.sakura; i++) {
    const sd = i % 2 ? 1 : -1;
    const t = Math.floor(i / 2) / Math.max(1, CONFIG.trees.sakura / 2 - 1);
    const x = sd * (6.2 + rng() * 1.6), z = lerp(18.6, 11.0, t) + gauss(rng) * 0.6;
    if (!isFree(x, z)) continue;
    place('sakura', x, z, 1.15 + rng() * 0.4, 2000 + i, new THREE.Color(0.95, 0.72, 0.80));
  }
  // 枫（后山）
  for (let i = 0; i < CONFIG.trees.maple; i++) {
    const x = lerp(-14, 14, rng()), z = -11.6 - rng() * 5.2;
    if (!isFree(x, z)) continue;
    place('maple', x, z, 1.0 + rng() * 0.5, 3000 + i, new THREE.Color(0.78 + rng() * 0.2, 0.42 + rng() * 0.2, 0.18));
  }
  // 松（蟠曲剪定）
  const pineSpots = [[-10.5, -6.8], [10.5, -6.8], [-12.6, -9.4], [12.6, -9.4], [-9.6, -10.6]];
  for (let i = 0; i < Math.min(CONFIG.trees.pine, pineSpots.length); i++) {
    const [x, z] = pineSpots[i];
    if (!isFree(x, z)) continue;
    place('pine', x, z, 0.95 + rng() * 0.35, 4000 + i, new THREE.Color(0.28, 0.5, 0.3));
  }
  // 樟（巨木）
  for (let i = 0; i < CONFIG.trees.camphor; i++) {
    const x = -11 + i * 21 + gauss(rng), z = -13.5 + gauss(rng);
    if (!isFree(x, z)) continue;
    place('camphor', x, z, 1.5 + rng() * 0.35, 5000 + i, new THREE.Color(0.34, 0.56, 0.32));
  }
  // 竹丛
  const bambooClusters = [];
  const bambooSpots = [[-13.4, -12.8], [13.4, -12.8], [-9.2, -15.6], [9.2, -15.6], [12.0, -16.4]];
  for (let i = 0; i < Math.min(CONFIG.trees.bamboo, bambooSpots.length); i++) {
    const [x, z] = bambooSpots[i];
    if (!isFree(x, z)) continue;
    bambooClusters.push(bambooCluster(6000 + i, x, z, terrainY(x, z), 8 + Math.floor(rng() * 5), 1.0 + rng() * 0.4));
  }

  /* --- 树冠/树干 LOD 分块 --- */
  const CHUNKS = 4;
  const chunkOf = (x, z) => (z < -11 ? 3 : z < -5 ? 2 : z < 2 ? 1 : 0);
  const chunkBounds = [[-21, 21, 1.5, 21], [-21, 21, -5, 1.5], [-21, 21, -11, -5], [-21, 21, -21, -11]];
  const lod = new ChunkedLOD('trees', [34, 76], 230);

  for (let ci = 0; ci < CHUNKS; ci++) {
    const [x0, x1, z0, z1] = chunkBounds[ci];
    const inChunk = treeList.filter(t => t.x >= x0 && t.x <= x1 && t.z >= z0 && t.z <= z1);
    if (!inChunk.length) continue;
    const center = new THREE.Vector3((x0 + x1) / 2, 8, (z0 + z1) / 2);
    const radius = Math.hypot(x1 - x0, z1 - z0) * 0.55 + 3;
    const lods = [];
    for (let lv = 0; lv < 3; lv++) {
      const grp = new THREE.Group();
      grp.name = 'treeChunk' + ci + 'L' + lv;
      if (lv < 2) {
        const bp = [], lp = [];
        const stride = lv === 0 ? 1 : 2;
        for (const t of inChunk) {
          const brs = stride === 1 ? t.tree.branches : t.tree.branches.filter((_, i) => i % stride === 0);
          const lvs = stride === 1 ? t.tree.leaves : t.tree.leaves.filter((_, i) => i % stride === 0);
          const bg = branchGeometry(brs, lv === 0 ? 6 : 4); if (bg) bp.push(bg);
          const lg = leafGeometry(lvs, () => t.tint, lv === 0 ? 2 : 1); if (lg) lp.push(lg);
        }
        if (bp.length) {
          const m = new THREE.Mesh(regGeo(mergeGeometries(bp, false)), MAT.bark);
          m.castShadow = false; m.receiveShadow = lv === 0;
          grp.add(m);
        }
        if (lp.length) {
          const m = new THREE.Mesh(regGeo(mergeGeometries(lp, false)), MAT.foliageBroadleaf);
          m.castShadow = lv === 0; m.receiveShadow = false;
          grp.add(m);
        }
      } else {
        /* 远景 impostor：交叉广告牌 */
        const ip = [];
        for (const t of inChunk) {
          const hgt = t.tree.height * 1.55;
          for (let k = 0; k < 2; k++) {
            const g = new THREE.PlaneGeometry(1, 1);
            g.applyMatrix4(new THREE.Matrix4().compose(
              new THREE.Vector3(t.x, t.y + hgt * 0.5, t.z),
              new THREE.Quaternion().setFromEuler(new THREE.Euler(0, k * Math.PI / 2 + 0.4, 0)),
              new THREE.Vector3(hgt * 0.78, hgt, 1)));
            const n = g.attributes.position.count;
            const ca = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) { ca[i * 3] = t.tint.r; ca[i * 3 + 1] = t.tint.g; ca[i * 3 + 2] = t.tint.b; }
            g.setAttribute('color', new THREE.BufferAttribute(ca, 3));
            ip.push(normalizeGeo(g));
          }
        }
        if (ip.length) {
          const m = new THREE.Mesh(regGeo(mergeGeometries(ip, false)), MAT.foliageBroadleaf);
          m.castShadow = false; m.receiveShadow = false;
          grp.add(m);
        }
      }
      G.add(grp);
      lods.push(grp);
    }
    lod.addChunk(center, radius, lods);
  }
  // 竹丛（合并到树干/叶批次）
  for (const bc of bambooClusters) {
    const bg = branchGeometry(bc.culms, 5);
    if (bg) barkB.add(MAT.bamboo, bg, null);
    const lg = leafGeometry(bc.leaves, () => new THREE.Color(0.42, 0.66, 0.32), 2);
    if (lg) { const m = new THREE.Mesh(regGeo(lg), MAT.foliageBamboo); m.castShadow = true; G.add(m); }
  }

  /* --- 灌木与地被（Poisson + 生物群系权重） --- */
  const shrubGeo = (() => {
    const parts = [];
    const base = new THREE.PlaneGeometry(1, 1);
    for (let k = 0; k < 3; k++) {
      const g = base.clone();
      g.applyMatrix4(new THREE.Matrix4().compose(
        new THREE.Vector3(0, 0.5, 0),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, k * Math.PI / 3, 0)),
        new THREE.Vector3(1, 1, 1)));
      parts.push(normalizeGeo(g));
    }
    return mergeGeometries(parts, false);
  })();
  const pts = poissonDisk(38, 38, 0.72, rng, 20, (x, z) => biomeWeight(x - 19, z - 19));
  const shrubMats = [], shrubCols = [];
  for (const p of pts) {
    const x = p[0] - 19, z = p[1] - 19;
    if (!isFree(x, z) || waterDist(x, z) < 0.4) continue;
    const y = terrainY(x, z);
    const s = 0.42 + rng() * 1.1;
    shrubMats.push(mat4(x, y - 0.06, z, 0, rng() * TAU, 0, s, s * (0.7 + rng() * 0.6), s));
    const t = rng();
    shrubCols.push(new THREE.Color().setHSL(0.24 + t * 0.10, 0.35 + t * 0.25, 0.26 + t * 0.18));
    if (shrubMats.length >= CONFIG.counts.shrubs) break;
  }
  const shrubIM = makeInstanced(shrubGeo, MAT.foliageShrub, shrubMats.length, 'shrubs');
  fillInstances(shrubIM, shrubMats);
  for (let i = 0; i < shrubCols.length; i++) shrubIM.setColorAt(i, shrubCols[i]);
  if (shrubIM.instanceColor) shrubIM.instanceColor.needsUpdate = true;
  G.add(shrubIM);
  DIAG.stats.shrubs = shrubMats.length;

  /* --- 草叶：十万级实例化 + 风场 --- */
  const bladeGeo = (() => {
    const g = new THREE.BufferGeometry();
    const w = 0.055, h = 1.0;
    const pos = [-w, 0, 0, w, 0, 0, w * 0.72, h * 0.55, 0, -w * 0.72, h * 0.55, 0, 0, h, 0];
    const uv = [0, 0, 1, 0, 1, 0.55, 0, 0.55, 0.5, 1];
    const flex = [0, 0, 0.55, 0.55, 1];
    const idx = [0, 1, 2, 0, 2, 3, 3, 2, 4];
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('aFlex', new THREE.Float32BufferAttribute(flex, 1));
    g.setIndex(idx);
    return normalizeGeo(g);
  })();
  const GN = CONFIG.counts.grass;
  const GCH = 8;
  const grassChunks = [];
  for (let i = 0; i < GCH; i++) grassChunks.push([]);
  const gRng = rngFor('grass');
  const side = Math.ceil(Math.sqrt(GN * 2.4));
  const cell = 38 / side;
  let placed = 0;
  for (let iz = 0; iz < side && placed < GN; iz++) {
    for (let ix = 0; ix < side && placed < GN; ix++) {
      const x = -19 + (ix + gRng()) * cell, z = -19 + (iz + gRng()) * cell;
      if (!isFree(x, z) || waterDist(x, z) < 0.25) continue;
      const w = biomeWeight(x, z);
      if (gRng() > w * 1.15) continue;
      const y = terrainY(x, z);
      const hgt = 0.16 + gRng() * 0.3;
      const wid = 0.7 + gRng() * 0.7;
      const m = mat4(x, y - 0.02, z, (gRng() - 0.5) * 0.35, gRng() * TAU, (gRng() - 0.5) * 0.35, wid, hgt, wid);
      const ci = (Math.floor((x + 19) / 38 * 2) + Math.floor((z + 19) / 38 * 4) * 2) % GCH;
      grassChunks[ci].push(m);
      placed++;
    }
  }
  for (const list of grassChunks) {
    if (!list.length) continue;
    const im = makeInstanced(bladeGeo, MAT.grass, list.length, 'grass');
    fillInstances(im, list);
    im.receiveShadow = false;
    im.castShadow = false;
    im.frustumCulled = true;
    G.add(im);
  }
  DIAG.stats.grass = placed;

  const nb = barkB.flush(G, { hull: false });
  root.add(G);
  DIAG.stats.treeCount = treeList.length;
  DIAG.stats.treeByType = treeList.reduce((a, t) => { a[t.type] = (a[t.type] || 0) + 1; return a; }, {});
  DIAG.stats.treeNearAxis = treeList.filter(t => Math.abs(t.x) < 5).map(t => t.type + '@' + t.x.toFixed(1) + ',' + t.z.toFixed(1));
  DIAG.stats.bamboo = bambooClusters.length;
  DIAG.stats.floraMeshes = nb + G.children.length;
  return { group: G, lod, treeList };
}
/* ═══════════════════════════════════════════════════════════════════════════
   9 · 水系：池塘 / 瀑布 / 溪流 / 锦鲤 / 睡莲 / 苔藓
   ═══════════════════════════════════════════════════════════════════════════ */
function makeFlowMaterial() {
  return regMat(new THREE.ShaderMaterial({
    uniforms: Object.assign({}, SHARED, {
      uFlow:   { value: new THREE.Vector2(0, -1) },
      uSpeed:  { value: 1.0 },
      uTint:   { value: new THREE.Color(0xcfe8f2) },
      uAlpha:  { value: 0.72 },
      uScale:  { value: new THREE.Vector2(1, 1) },
      uFoamAmt:{ value: 1.0 },
    }),
    vertexShader: `
      uniform vec2 uScale; uniform float uTime;
      varying vec2 vUv; varying vec3 vWPos; varying vec3 vNrm;
      void main(){
        vUv = uv * uScale;
        vNrm = normalize( normalMatrix * normal );
        vec4 wp = modelMatrix * vec4( position, 1.0 );
        vWPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: GLSL_COMMON + `
      uniform float uTime, uSpeed, uAlpha, uFoamAmt, uNight, uSunI, uFlash;
      uniform vec3 uTint, uSunColor, uFogColor, uSunDir;
      uniform vec2 uFlow; uniform float uHazeDensity, uHazeBase;
      varying vec2 vUv; varying vec3 vWPos; varying vec3 vNrm;
      void main(){
        vec2 fl = uFlow * uTime * uSpeed;
        float n1 = fbm( vUv * vec2( 3.0, 7.0 ) + fl, 3 );
        float n2 = fbm( vUv * vec2( 7.0, 16.0 ) - fl * 1.7 + 3.0, 3 );
        float n3 = fbm( vUv * vec2( 14.0, 34.0 ) + fl * 2.6 + 9.0, 2 );
        float streak = smoothstep( 0.25, 0.85, n1 * 0.55 + n2 * 0.32 + n3 * 0.22 );
        float foam = smoothstep( 0.55, 0.95, n2 * 0.6 + n3 * 0.5 ) * uFoamAmt;
        foam += smoothstep( 0.0, 0.12, vUv.y ) * 0.6;    // 落水口
        vec3 col = uTint * ( 0.55 + 0.75 * streak );
        col = mix( col, vec3( 0.97, 0.99, 1.0 ), foam * 0.85 );
        float ndl = max( 0.0, dot( normalize( vNrm ), normalize( uSunDir ) ) );
        col += uSunColor * pow( ndl, 8.0 ) * 0.35 * uSunI * 0.3;
        col += vec3( 0.4, 0.5, 0.8 ) * uNight * 0.25;
        float hf = 1.0 - exp( -max( 0.0, uHazeBase - vWPos.y ) * uHazeDensity );
        col = mix( col, uFogColor, clamp( hf, 0.0, 0.9 ) );
        col += uFlash * 0.8;
        float a = uAlpha * ( 0.55 + 0.45 * streak ) + foam * 0.4;
        gl_FragColor = vec4( col, clamp( a, 0.0, 1.0 ) );
      }`,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  }));
}

/** 池塘水面 + 池底 */
function buildPond() {
  const pc = CONFIG.water.pondCenter, PR = CONFIG.water.pondRadius;
  const WL = CONFIG.water.waterLevel;
  const rings = 22, segs = 72;
  const radFn = (a) => PR * (0.80 + 0.30 * fbm2(Math.cos(a) * 2.2 + 11, Math.sin(a) * 2.2 + 7, 3, 2.0, 0.5, 5));
  const wpos = [], wuv = [], widx = [], wdepth = [], wshore = [];
  const bpos = [], buv = [], bidx = [], bcol = [];
  // 水面
  wpos.push(pc[0], WL, pc[2]); wuv.push(0.5, 0.5); wdepth.push(1); wshore.push(0, 0);
  for (let r = 1; r <= rings; r++) {
    const t = r / rings;
    for (let s = 0; s < segs; s++) {
      const a = s / segs * TAU;
      const rad = radFn(a) * t;
      const x = pc[0] + Math.cos(a) * rad, z = pc[2] + Math.sin(a) * rad;
      wpos.push(x, WL, z);
      wuv.push(x * 0.09, z * 0.09);
      wdepth.push(saturate(1 - t * 1.02));
      wshore.push(Math.cos(a), Math.sin(a));
    }
  }
  const ri = (r, s) => r === 0 ? 0 : 1 + (r - 1) * segs + (s % segs);
  for (let s = 0; s < segs; s++) widx.push(0, ri(1, s + 1), ri(1, s));
  for (let r = 1; r < rings; r++) for (let s = 0; s < segs; s++) {
    const a = ri(r, s), b = ri(r, s + 1), c = ri(r + 1, s), d = ri(r + 1, s + 1);
    widx.push(a, b, c, b, d, c);
  }
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wpos, 3));
  wg.setAttribute('uv', new THREE.Float32BufferAttribute(wuv, 2));
  wg.setAttribute('aDepth', new THREE.Float32BufferAttribute(wdepth, 1));
  wg.setAttribute('aShore', new THREE.Float32BufferAttribute(wshore, 2));
  wg.setIndex(widx);
  normalizeGeo(wg);
  const waterMesh = new THREE.Mesh(wg, MAT.water);
  waterMesh.receiveShadow = false;
  waterMesh.name = 'pondWater';
  waterMesh.userData.isWater = true;
  root.add(waterMesh);

  // 池底（碗形）
  const bedMat = toonMat({ key:'pondBed', map: TX.ground.map, normalMap: TX.ground.nrm, aux: TX.ground.rgh, tint:0x6d7a58, tintMix:0.55, rim:0.1 });
  for (let r = 0; r <= rings; r++) {
    const t = r / rings;
    for (let s = 0; s < segs; s++) {
      const a = s / segs * TAU;
      const rad = radFn(a) * t * 1.04;
      const x = pc[0] + Math.cos(a) * rad, z = pc[2] + Math.sin(a) * rad;
      const depth = 1.05 * Math.pow(t, 0.72);
      const y = WL - depth - (t > 0.97 ? -0.12 : 0);
      bpos.push(x, y, z); buv.push(x * 0.14, z * 0.14);
      const shade = 0.42 + 0.5 * (1 - t);
      bcol.push(shade, shade, shade);
    }
  }
  for (let r = 0; r < rings; r++) for (let s = 0; s < segs; s++) {
    const a = r * segs + s, b = r * segs + (s + 1) % segs, c = (r + 1) * segs + s, d = (r + 1) * segs + (s + 1) % segs;
    bidx.push(a, b, c, b, d, c);
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute(bpos, 3));
  bg.setAttribute('uv', new THREE.Float32BufferAttribute(buv, 2));
  bg.setAttribute('color', new THREE.Float32BufferAttribute(bcol, 3));
  bg.setIndex(bidx);
  bg.computeVertexNormals();
  normalizeGeo(bg);
  const bedMesh = new THREE.Mesh(bg, bedMat);
  bedMesh.receiveShadow = true;
  root.add(bedMesh);

  /* 池岸石 */
  const rng = rngFor('pond');
  const shoreMats = [];
  const rockG = rockGeo(313, 1);
  for (let s = 0; s < 110; s++) {
    const a = s / 110 * TAU + rng() * 0.06;
    const rad = radFn(a) * (1.0 + rng() * 0.07);
    const x = pc[0] + Math.cos(a) * rad, z = pc[2] + Math.sin(a) * rad;
    const y = Math.max(terrainY(x, z) + 0.1, WL - 0.24);
    const sc = 0.75 + rng() * 0.75;
    shoreMats.push(mat4(x, y, z, rng() * 0.6, rng() * TAU, rng() * 0.6, sc, sc * 0.62, sc));
    if (rng() < 0.5) {
      const s2 = 0.5 + rng() * 0.5;
      shoreMats.push(mat4(x + (rng() - 0.5) * 0.7, WL + 0.02, z + (rng() - 0.5) * 0.7,
        0.1, rng() * TAU, 0.1, s2, s2 * 0.34, s2));
    }
  }
  const shoreIM = makeInstanced(rockG, MAT.lantern, shoreMats.length, 'pondShore');
  fillInstances(shoreIM, shoreMats);
  root.add(shoreIM);

  /* 睡莲 + 浮萍 */
  const lilyG = (() => {
    const g = new THREE.CircleGeometry(0.34, 10);
    g.deleteAttribute('normal');
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      const a = Math.atan2(y, x);
      if (Math.abs(a) < 0.32) pos.setXY(i, x * 0.55, y * 0.55);
    }
    g.computeVertexNormals();
    return normalizeGeo(g);
  })();
  const lilyMats = [];
  for (let i = 0; i < 26; i++) {
    const a = rng() * TAU, rad = Math.sqrt(rng()) * PR * 0.72;
    const x = pc[0] + Math.cos(a) * rad, z = pc[2] + Math.sin(a) * rad;
    lilyMats.push(mat4(x, WL + 0.015, z, -Math.PI / 2, rng() * TAU, 0, 0.7 + rng() * 0.6));
  }
  const lilyIM = makeInstanced(lilyG, MAT.foliageShrub, lilyMats.length, 'lilies');
  fillInstances(lilyIM, lilyMats);
  for (let i = 0; i < lilyMats.length; i++) lilyIM.setColorAt(i, new THREE.Color().setHSL(0.28 + rng() * 0.06, 0.4, 0.24 + rng() * 0.12));
  if (lilyIM.instanceColor) lilyIM.instanceColor.needsUpdate = true;
  root.add(lilyIM);

  /* 苔藓覆盖（按湿度权重） */
  const mossG = new THREE.CircleGeometry(0.3, 7);
  mossG.rotateX(-Math.PI / 2);
  const mossMats = [], mossCols = [], mrng = rngFor('moss');
  const mSide = 150, mCell = 38 / mSide;
  for (let iz = 0; iz < mSide && mossMats.length < 700; iz++) {
    for (let ix = 0; ix < mSide && mossMats.length < 700; ix++) {
      const x = -19 + (ix + mrng()) * mCell, z = -19 + (iz + mrng()) * mCell;
      const d = waterDist(x, z);
      if (d < 0.10 || d > 4.2) continue;
      const moist = smoothstep(4.2, 0.15, d);
      if (mrng() > moist * 0.62) continue;
      const y = terrainY(x, z);
      const sc = 0.5 + mrng() * 1.5;
      mossMats.push(mat4(x, y + 0.03, z, 0, mrng() * TAU, 0, sc));
      const t = mrng();
      mossCols.push(new THREE.Color().setHSL(0.24 + t * 0.08, 0.42 + t * 0.2, 0.2 + t * 0.16));
    }
  }
  const mossIM = makeInstanced(mossG, MAT.moss, Math.max(1, mossMats.length), 'mossPatches');
  fillInstances(mossIM, mossMats);
  for (let i = 0; i < mossCols.length; i++) mossIM.setColorAt(i, mossCols[i]);
  if (mossIM.instanceColor) mossIM.instanceColor.needsUpdate = true;
  mossIM.castShadow = false;
  root.add(mossIM);
  DIAG.stats.moss = mossMats.length;
  return { waterMesh, WL, radFn, bedMat };
}

/** 瀑布 + 溪流 */
function buildWaterfallAndStream() {
  const G = new THREE.Group(); G.name = 'waterfall';
  const flowMat = makeFlowMaterial();
  const rng = rngFor('fall');
  /* 落水帘 */
  const topY = LEVELS[5].y - 0.4, botY = LEVELS[4].y + 0.15;
  const fx = -13.6, fz = -11.1;
  const segN = 10;
  const fpos = [], fuv = [], fidx = [];
  for (let i = 0; i <= segN; i++) {
    const t = i / segN;
    const y = lerp(topY, botY, t);
    const zz = fz + Math.pow(t, 1.6) * 0.75;
    const w = 1.35 * (1 - t * 0.12);
    fpos.push(fx - w / 2, y, zz, fx + w / 2, y, zz);
    fuv.push(0, 1 - t, 1, 1 - t);
  }
  for (let i = 0; i < segN; i++) {
    const a = i * 2;
    fidx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.Float32BufferAttribute(fpos, 3));
  fg.setAttribute('uv', new THREE.Float32BufferAttribute(fuv, 2));
  fg.setIndex(fidx);
  fg.computeVertexNormals();
  normalizeGeo(fg);
  const fallMat = makeFlowMaterial();
  fallMat.uniforms.uSpeed.value = 1.9;
  fallMat.uniforms.uScale.value.set(1.4, 3.2);
  fallMat.uniforms.uTint.value = new THREE.Color(0xd8eef6);
  fallMat.uniforms.uAlpha.value = 0.80;
  fallMat.uniforms.uFlow.value.set(0, -1);
  const fall = new THREE.Mesh(fg, fallMat);
  fall.name = 'waterfall';
  fall.userData.isWater = true;
  G.add(fall);
  // 落水口石
  const B = new Batcher('fallRock');
  B.add(MAT.lantern, rockGeo(707, 1), mat4(fx - 0.85, topY - 0.1, fz - 0.1, 0.4, 1.1, 0.3, 1.5, 1.1, 1.3));
  B.add(MAT.lantern, rockGeo(808, 1), mat4(fx + 0.85, topY - 0.1, fz - 0.1, -0.3, 2.4, -0.4, 1.4, 1.0, 1.2));
  // 瀑潭
  const poolY = botY + 0.06;
  const poolG = new THREE.CircleGeometry(1.75, 22);
  poolG.rotateX(-Math.PI / 2);
  normalizeGeo(poolG);
  const pool = new THREE.Mesh(poolG, MAT.water);
  pool.position.set(fx, poolY, fz + 1.5);
  pool.userData.isWater = true;
  G.add(pool);
  const poolFoam = new THREE.Mesh(poolG.clone(), (() => {
    const m = makeFlowMaterial();
    m.uniforms.uSpeed.value = 0.5; m.uniforms.uScale.value.set(2.2, 2.2);
    m.uniforms.uTint.value = new THREE.Color(0xffffff); m.uniforms.uAlpha.value = 0.35;
    m.uniforms.uFoamAmt.value = 2.0; m.uniforms.uFlow.value.set(0.15, 0.1);
    return m;
  })());
  poolFoam.position.set(fx, poolY + 0.02, fz + 1.5);
  G.add(poolFoam);
  B.flush(G, { hull: false });
  root.add(G);

  /* 溪流（沿样条） */
  const sMat = makeFlowMaterial();
  sMat.uniforms.uSpeed.value = 0.85;
  sMat.uniforms.uScale.value.set(1.0, 4.0);
  sMat.uniforms.uTint.value = new THREE.Color(0xbfe0e8);
  sMat.uniforms.uAlpha.value = 0.62;
  sMat.uniforms.uFlow.value.set(0, -1);
  const sp = [], suv = [], sidx = [];
  const N = STREAM_PTS.length;
  for (let i = 0; i < N; i++) {
    const [sx, sz] = STREAM_PTS[i];
    const y = terrainY(sx, sz) + 0.05;
    const [nx, nz] = i < N - 1
      ? (() => { const dx = STREAM_PTS[i + 1][0] - sx, dz = STREAM_PTS[i + 1][1] - sz; const l = Math.hypot(dx, dz) || 1; return [-dz / l, dx / l]; })()
      : (() => { const dx = sx - STREAM_PTS[i - 1][0], dz = sz - STREAM_PTS[i - 1][1]; const l = Math.hypot(dx, dz) || 1; return [-dz / l, dx / l]; })();
    const w = 0.62 + Math.sin(i * 1.7) * 0.1;
    sp.push(sx - nx * w, y, sz - nz * w, sx + nx * w, y, sz + nz * w);
    suv.push(0, i * 1.2, 1, i * 1.2);
  }
  for (let i = 0; i < N - 1; i++) {
    const a = i * 2;
    sidx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  sg.setAttribute('uv', new THREE.Float32BufferAttribute(suv, 2));
  sg.setIndex(sidx);
  sg.computeVertexNormals();
  normalizeGeo(sg);
  const stream = new THREE.Mesh(sg, sMat);
  stream.userData.isWater = true;
  root.add(stream);
  return { fall, pool };
}

/* ---------- 锦鲤 boids ---------- */
class KoiSchool {
  constructor(n) {
    this.n = n;
    const pc = CONFIG.water.pondCenter, PR = CONFIG.water.pondRadius;
    const rng = rngFor('koi');
    this.pos = []; this.vel = []; this.phase = [];
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, r = Math.sqrt(rng()) * PR * 0.6;
      this.pos.push(new THREE.Vector3(pc[0] + Math.cos(a) * r, CONFIG.water.waterLevel - 0.42 - rng() * 0.28, pc[2] + Math.sin(a) * r));
      this.vel.push(new THREE.Vector3(Math.cos(a + 1.6), 0, Math.sin(a + 1.6)).multiplyScalar(0.5 + rng() * 0.4));
      this.phase.push(rng() * TAU);
    }
    const body = (() => {
      const parts = [];
      const b = sph(0.16, 10, 8); b.scale(1, 0.72, 2.5); parts.push(normalizeGeo(b));
      const t1 = box(0.02, 0.16, 0.2); t1.translate(0, 0.06, -0.42); parts.push(normalizeGeo(t1));
      const t2 = box(0.02, 0.12, 0.16); t2.translate(0, 0.06, -0.52); parts.push(normalizeGeo(t2));
      const f1 = box(0.14, 0.02, 0.14); f1.translate(0.14, -0.02, 0.18); f1.rotateZ(0.4); parts.push(normalizeGeo(f1));
      const f2 = box(0.14, 0.02, 0.14); f2.translate(-0.14, -0.02, 0.18); f2.rotateZ(-0.4); parts.push(normalizeGeo(f2));
      return mergeGeometries(parts, false);
    })();
    const mat = toonMat({ key:'koi', color:0xfff3e2, aniso:0.6, rim:0.5, rimColor:0xffd0a0, sss:0.35, sssColor:0xffb090 });
    this.mesh = makeInstanced(body, mat, n, 'koi', { dynamic: true });
    this.mesh.castShadow = false;
    this.cols = [];
    for (let i = 0; i < n; i++) this.cols.push(new THREE.Color().setHSL(rng() < 0.6 ? 0.03 + rng() * 0.05 : 0.0, 0.75, 0.42 + rng() * 0.3));
    for (let i = 0; i < n; i++) this.mesh.setColorAt(i, this.cols[i]);
    this.mesh.instanceColor.needsUpdate = true;
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._s = new THREE.Vector3(1, 1, 1);
    this._up = new THREE.Vector3(0, 1, 0);
    this.ripples = [];
  }
  update(dt, t) {
    const pc = CONFIG.water.pondCenter, PR = CONFIG.water.pondRadius * 0.78;
    const p = this.pos, v = this.vel;
    const sep = new THREE.Vector3(), ali = new THREE.Vector3(), coh = new THREE.Vector3();
    for (let i = 0; i < this.n; i++) {
      sep.set(0, 0, 0); ali.set(0, 0, 0); coh.set(0, 0, 0);
      let cnt = 0;
      for (let j = 0; j < this.n; j++) {
        if (i === j) continue;
        const dx = p[i].x - p[j].x, dy = p[i].y - p[j].y, dz = p[i].z - p[j].z;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 1.2) { sep.x += dx; sep.y += dy; sep.z += dz; }
        if (d2 < 6.0) { ali.add(v[j]); coh.add(p[j]); cnt++; }
      }
      if (cnt) { ali.divideScalar(cnt); coh.divideScalar(cnt); }
      const a = v[i].clone()
        .addScaledVector(sep, 2.2 * dt)
        .addScaledVector(ali.sub(v[i]), 0.55 * dt)
        .addScaledVector(coh.sub(p[i]), 0.35 * dt);
      // 池边界
      const dx = p[i].x - pc[0], dz = p[i].z - pc[2];
      const d = Math.hypot(dx, dz);
      if (d > PR) a.addScaledVector(new THREE.Vector3(-dx / d, 0, -dz / d), (d - PR) * 9 * dt);
      // 深度约束
      const targetY = CONFIG.water.waterLevel - 0.42 - 0.22 * Math.sin(t * 0.7 + this.phase[i]);
      a.y += (targetY - p[i].y) * 1.6 * dt;
      // 随机游走
      a.x += Math.sin(t * 0.8 + this.phase[i] * 3.1) * 0.35 * dt;
      a.z += Math.cos(t * 0.65 + this.phase[i] * 2.3) * 0.35 * dt;
      v[i].addScaledVector(a, 1.0).clampLength(0.18, 1.15);
      p[i].addScaledVector(v[i], dt * 1.6);
      // 写矩阵
      const spd = v[i].length();
      const yaw = Math.atan2(v[i].x, v[i].z);
      this._q.setFromEuler(new THREE.Euler(Math.sin(t * 6 + this.phase[i]) * 0.10, yaw, Math.sin(t * 4.3 + this.phase[i]) * 0.16, 'YXZ'));
      this._s.set(1, 1, 1);
      this._m.compose(p[i], this._q, this._s);
      this.mesh.setMatrixAt(i, this._m);
      if (spd > 0.6 && Math.random() < dt * 0.6) this.ripples.push({ x: p[i].x, z: p[i].z, t: 0 });
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      this.ripples[i].t += dt * 1.2;
      if (this.ripples[i].t > 1) this.ripples.splice(i, 1);
    }
  }
}

function buildWater() {
  const pond = buildPond();
  const wf = buildWaterfallAndStream();
  const koi = new KoiSchool(CONFIG.counts.koi);
  root.add(koi.mesh);
  DIAG.stats.koi = CONFIG.counts.koi;
  return { pond, wf, koi };
}
/* ═══════════════════════════════════════════════════════════════════════════
   10 · 大气与生物：粒子池 / 飞鸟 / 蝴蝶 / 萤火虫 / 涟漪

/* ---------- 通用 GPU 粒子（雨 / 雪 / 尘 / 雾 / 烟 / 火星） ---------- */
function makePointsSystem(cfg) {
  const N = cfg.count;
  const rng = mulberry32(cfg.seed || 7);
  const pos = new Float32Array(N * 3);
  const seed = new Float32Array(N * 4);
  const param = new Float32Array(N * 4);
  const box = cfg.box;
  for (let i = 0; i < N; i++) {
    pos[i * 3] = (rng() - 0.5) * box[0];
    pos[i * 3 + 1] = rng() * box[1];
    pos[i * 3 + 2] = (rng() - 0.5) * box[2];
    seed[i * 4] = rng(); seed[i * 4 + 1] = rng(); seed[i * 4 + 2] = rng(); seed[i * 4 + 3] = rng();
    param[i * 4] = cfg.speed[0] + rng() * (cfg.speed[1] - cfg.speed[0]);
    param[i * 4 + 1] = cfg.size[0] + rng() * (cfg.size[1] - cfg.size[0]);
    param[i * 4 + 2] = cfg.sway[0] + rng() * (cfg.sway[1] - cfg.sway[0]);
    param[i * 4 + 3] = cfg.spin ? rng() * TAU : 0;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  g.setAttribute('aParam', new THREE.BufferAttribute(param, 4));
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, SHARED, {
      uTex:    { value: cfg.tex },
      uOrigin: { value: new THREE.Vector3(...(cfg.origin || [0, 0, 0])) },
      uBox:    { value: new THREE.Vector3(...box) },
      uColor:  { value: new THREE.Color(cfg.color ?? 0xffffff) },
      uColor2: { value: new THREE.Color(cfg.color2 ?? cfg.color ?? 0xffffff) },
      uAlpha:  { value: cfg.alpha ?? 1 },
      uGrav:   { value: cfg.grav ?? 1 },
      uStretch:{ value: cfg.stretch ?? 0 },
      uFade:   { value: cfg.fade ?? 0.25 },
      uRate:   { value: cfg.rate ?? 0.3 },
      uEmissive:{ value: cfg.emissive ?? 0 },
      uSizeMul:{ value: 1 },
      uPuff:   { value: cfg.puff ?? 0 },
    }),
    vertexShader: `
      attribute vec4 aSeed; attribute vec4 aParam;
      uniform float uTime, uGrav, uRate, uSizeMul, uPuff;
      uniform vec3 uOrigin, uBox, uWind;
      varying float vA; varying float vSeed;
      void main(){
        vSeed = aSeed.x;
        float t = uTime * uRate + aSeed.w * 6.2831853;
        vec3 p = position;
        float span = uBox.y;
        float ph = aSeed.w;
        // 垂直循环
        p.y = mod( position.y - uTime * aParam.x * span * uGrav + ph * span, span );
        // 水平漂移 + 风
        p.x += sin( t * 1.3 + aSeed.x * 12.0 ) * aParam.z + uWind.x * uTime * 0.9 * ( 0.4 + aSeed.y );
        p.z += cos( t * 1.1 + aSeed.z * 12.0 ) * aParam.z + uWind.y * uTime * 0.9 * ( 0.4 + aSeed.z );
        if ( uPuff > 0.5 ) {
          p.x += sin( t * 0.7 + aSeed.y * 9.0 ) * 0.5 * ( 1.0 - p.y / span );
          p.z += cos( t * 0.6 + aSeed.x * 9.0 ) * 0.5 * ( 1.0 - p.y / span );
        }
        p.x = mod( p.x + uBox.x * 0.5, uBox.x ) - uBox.x * 0.5 + uOrigin.x;
        p.z = mod( p.z + uBox.z * 0.5, uBox.z ) - uBox.z * 0.5 + uOrigin.z;
        p.y += uOrigin.y;
        vec4 mv = modelViewMatrix * vec4( p, 1.0 );
        gl_Position = projectionMatrix * mv;
        float d = max( -mv.z, 0.05 );
        gl_PointSize = clamp( aParam.y * uSizeMul * ( 900.0 / d ), 1.0, 220.0 );
        float nearFade = smoothstep( 0.5, 2.6, d );
        float fadeTop = smoothstep( span, span * 0.72, p.y - uOrigin.y );
        float fadeBot = smoothstep( 0.0, span * 0.10, p.y - uOrigin.y );
        vA = fadeTop * fadeBot * nearFade;
      }`,
    fragmentShader: `
      uniform sampler2D uTex; uniform vec3 uColor, uColor2; uniform float uAlpha, uStretch, uEmissive, uFlash;
      varying float vA; varying float vSeed;
      void main(){
        vec2 uv = gl_PointCoord;
        if ( uStretch > 0.5 ) uv.x = ( uv.x - 0.5 ) * 3.0 + 0.5;
        vec4 t = texture2D( uTex, uv );
        float a = t.a * uAlpha * vA;
        if ( a < 0.004 ) discard;
        vec3 c = mix( uColor, uColor2, vSeed );
        c += uEmissive * c * 2.0 + uFlash * 0.6;
        gl_FragColor = vec4( c, a );
      }`,
    transparent: true,
    depthWrite: false,
    blending: cfg.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  const pts = new THREE.Points(regGeo(g), regMat(mat));
  pts.frustumCulled = false;
  pts.name = 'points_' + (cfg.name || '');
  return { mesh: pts, mat, uniform: mat.uniforms };
}

/* ---------- CPU 实例化粒子池（花瓣 / 落叶 / 萤火虫） ---------- */
class InstancedParticles {
  constructor(cfg) {
    this.n = cfg.count;
    this.cfg = cfg;
    this.rng = mulberry32(cfg.seed || 3);
    this.p = new Float32Array(this.n * 3);
    this.v = new Float32Array(this.n * 3);
    this.rot = new Float32Array(this.n * 3);
    this.rv = new Float32Array(this.n * 3);
    this.size = new Float32Array(this.n);
    this.phase = new Float32Array(this.n);
    this.mesh = makeInstanced(cfg.geo, cfg.mat, this.n, cfg.name, { dynamic: true, castShadow: false });
    this.mesh.receiveShadow = false;
    this.mesh.frustumCulled = false;
    this._m = new THREE.Matrix4();
    this._q = new THREE.Quaternion();
    this._e = new THREE.Euler();
    this._s = new THREE.Vector3();
    this._pv = new THREE.Vector3();
    this.spawnAll();
    if (cfg.colors) {
      for (let i = 0; i < this.n; i++) this.mesh.setColorAt(i, cfg.colors(this.rng, i));
      this.mesh.instanceColor.needsUpdate = true;
    }
  }
  spawn(i, initial) {
    const r = this.rng, c = this.cfg;
    const p = c.spawn(r, initial);
    this.p[i * 3] = p[0]; this.p[i * 3 + 1] = p[1]; this.p[i * 3 + 2] = p[2];
    this.v[i * 3] = (r() - 0.5) * c.v0; this.v[i * 3 + 1] = -r() * c.v0 * 0.4; this.v[i * 3 + 2] = (r() - 0.5) * c.v0;
    this.rot[i * 3] = r() * TAU; this.rot[i * 3 + 1] = r() * TAU; this.rot[i * 3 + 2] = r() * TAU;
    this.rv[i * 3] = (r() - 0.5) * c.spin; this.rv[i * 3 + 1] = (r() - 0.5) * c.spin; this.rv[i * 3 + 2] = (r() - 0.5) * c.spin;
    this.size[i] = c.size[0] + r() * (c.size[1] - c.size[0]);
    this.phase[i] = r() * TAU;
  }
  spawnAll() { for (let i = 0; i < this.n; i++) this.spawn(i, true); }
  update(dt, t, wind, camPos) {
    const c = this.cfg, n = this.n;
    const cx = camPos ? camPos.x : 1e9, cy = camPos ? camPos.y : 1e9, cz = camPos ? camPos.z : 1e9;
    for (let i = 0; i < n; i++) {
      const i3 = i * 3;
      // 空气阻力 + 重力 + 风 + 湍流
      const drag = c.drag;
      this.v[i3] += (wind.x * c.windK - this.v[i3] * drag) * dt;
      this.v[i3 + 1] += (-c.grav - this.v[i3 + 1] * drag) * dt;
      this.v[i3 + 2] += (wind.y * c.windK - this.v[i3 + 2] * drag) * dt;
      const sw = Math.sin(t * c.flutter + this.phase[i]);
      this.v[i3] += sw * c.turb * dt;
      this.v[i3 + 2] += Math.cos(t * c.flutter * 0.8 + this.phase[i]) * c.turb * dt;
      this.p[i3] += this.v[i3] * dt;
      this.p[i3 + 1] += this.v[i3 + 1] * dt;
      this.p[i3 + 2] += this.v[i3 + 2] * dt;
      this.rot[i3] += this.rv[i3] * dt;
      this.rot[i3 + 1] += this.rv[i3 + 1] * dt;
      this.rot[i3 + 2] += this.rv[i3 + 2] * dt;
      const gy = terrainY(this.p[i3], this.p[i3 + 2]);
      if (this.p[i3 + 1] < gy - 0.1 || Math.abs(this.p[i3]) > 22 || Math.abs(this.p[i3 + 2]) > 22) this.spawn(i, false);
      this._e.set(this.rot[i3], this.rot[i3 + 1], this.rot[i3 + 2]);
      this._q.setFromEuler(this._e);
      const ddx = this.p[i3] - cx, ddy = this.p[i3 + 1] - cy, ddz = this.p[i3 + 2] - cz;
      const camD = Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz);
      this._s.setScalar(this.size[i] * smoothstep(0.5, 2.8, camD));
      this._pv.set(this.p[i3], this.p[i3 + 1], this.p[i3 + 2]);
      this._m.compose(this._pv, this._q, this._s);
      this.mesh.setMatrixAt(i, this._m);
      if (c.emissive) {
        const pulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.4 + this.phase[i] * 3.0), 3);
        this.mesh.getColorAt ? 0 : 0;
        this._pulse(i, pulse);
      }
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  _pulse() {}
}

/* ---------- 涟漪环 ---------- */
class RippleSystem {
  constructor(n) {
    const g = new THREE.RingGeometry(0.18, 0.30, 18);
    g.rotateX(-Math.PI / 2);
    normalizeGeo(g);
    this.n = n;
    this.age = new Float32Array(n).fill(2);
    this.pool = [];
    const geo = normalizeGeo(g);
    geo.setAttribute('aAge', new THREE.InstancedBufferAttribute(this.age, 1));
    const mat = regMat(new THREE.ShaderMaterial({
      uniforms: Object.assign({}, SHARED, {}),
      vertexShader: `
        attribute float aAge; varying float vA; varying vec3 vW;
        void main(){
          vA = aAge;
          vec4 wp = instanceMatrix * vec4( position, 1.0 );
          vW = ( modelMatrix * wp ).xyz;
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * wp;
        }`,
      fragmentShader: `
        uniform vec3 uSunColor; uniform float uNight, uFlash;
        varying float vA; varying vec3 vW;
        void main(){
          float a = ( 1.0 - clamp( vA, 0.0, 1.0 ) ) * 0.55;
          if ( a < 0.01 ) discard;
          vec3 c = vec3( 0.85, 0.95, 1.0 ) * ( 0.35 + 0.65 * max( uSunColor.r, 0.4 ) ) + uNight * 0.1 + uFlash;
          gl_FragColor = vec4( c, a );
        }`,
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
    }));
    this.mesh = new THREE.InstancedMesh(geo, mat, n);
    this.mesh.frustumCulled = false;
    this.mesh.name = 'ripples';
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    for (let i = 0; i < n; i++) this.mesh.setMatrixAt(i, mat4(0, -100, 0));
    this.mesh.instanceMatrix.needsUpdate = true;
    this.cursor = 0;
    this._m = new THREE.Matrix4();
  }
  emit(x, y, z, scale = 1) {
    const i = this.cursor++ % this.n;
    this.age[i] = 0;
    this.mesh.setMatrixAt(i, mat4(x, y, z, 0, 0, 0, scale));
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  update(dt) {
    let any = false;
    for (let i = 0; i < this.n; i++) {
      if (this.age[i] < 1.2) { this.age[i] += dt * 0.85; any = true; }
    }
    if (any) this.mesh.geometry.attributes.aAge.needsUpdate = true;
  }
}

/* ---------- 生物：飞鸟 / 乌鸦 / 蝴蝶 / 蜻蜓 ---------- */
function birdGeo(wing) {
  const parts = [];
  const body = box(0.07, 0.06, 0.26); parts.push(normalizeGeo(body));
  const w = new THREE.BufferGeometry();
  const wv = [0, 0, -0.02, wing * 0.62, 0.02, 0.06, wing * 0.42, 0.0, 0.20, 0, 0, 0.14];
  w.setAttribute('position', new THREE.Float32BufferAttribute(wv, 3));
  w.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  w.setIndex([0, 1, 2, 0, 2, 3]);
  normalizeGeo(w);
  parts.push(w);
  return mergeGeometries(parts, false);
}
function makeFlapperGeo(spanX, spanY, bodyW, bodyL) {
  const pos = [], uv = [], idx = [];
  const quad = (ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz) => {
    const s = pos.length / 3;
    pos.push(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz);
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(s, s + 1, s + 2, s, s + 2, s + 3);
  };
  quad(0, 0, -bodyL * 0.5, 0, 0, bodyL * 0.5, 0, bodyW * 0.5, bodyL * 0.5, 0, bodyW * 0.5, -bodyL * 0.5);
  quad(0, 0, -bodyL * 0.5, 0, 0, bodyL * 0.5, spanX, spanY, bodyL * 0.4, spanX, spanY, -bodyL * 0.45);
  quad(0, 0, -bodyL * 0.5, 0, 0, bodyL * 0.5, -spanX, spanY, bodyL * 0.4, -spanX, spanY, -bodyL * 0.45);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  const n = pos.length / 3;
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 1; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return normalizeGeo(g);
}
class FlockSystem {
  constructor(cfg) {
    this.cfg = cfg;
    this.n = cfg.count;
    this.rng = mulberry32(cfg.seed || 5);
    this.geo = cfg.geo;
    this.mat = cfg.mat;
    this.mesh = makeInstanced(this.geo, this.mat, this.n, cfg.name, { dynamic: true, castShadow: cfg.shadow !== false });
    this.mesh.frustumCulled = false;
    this.data = [];
    for (let i = 0; i < this.n; i++) {
      this.data.push({
        p: new THREE.Vector3(), v: new THREE.Vector3(),
        phase: this.rng() * TAU, speed: cfg.speed[0] + this.rng() * (cfg.speed[1] - cfg.speed[0]),
        off: new THREE.Vector3((this.rng() - 0.5) * cfg.spread, (this.rng() - 0.5) * cfg.spread * 0.5, (this.rng() - 0.5) * cfg.spread),
        t: this.rng() * 100,
      });
    }
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._e = new THREE.Euler();
    this._s = new THREE.Vector3(1, 1, 1);
  }
  update(dt, t, cam) {
    const c = this.cfg;
    for (let i = 0; i < this.n; i++) {
      const d = this.data[i];
      d.t += dt * d.speed;
      if (c.mode === 'orbit') {
        // 编队环绕
        const a = d.t * 0.11 + i * (TAU / this.n);
        const r = c.radius + d.off.x;
        const y = c.height + Math.sin(d.t * 0.5 + i) * 2.2 + d.off.y;
        d.p.set(Math.cos(a) * r + d.off.x, y, Math.sin(a) * r * 0.85 + d.off.z);
        d.v.set(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(r * 0.11);
      } else if (c.mode === 'spline') {
        // 蝴蝶/蜻蜓：样条飞行
        const s = d.t * 0.09;
        d.p.set(
          Math.sin(s * 1.3 + d.phase) * c.radius + d.off.x * 0.4,
          c.height + Math.sin(s * 2.7 + d.phase * 2) * 0.7 + Math.cos(s * 0.9) * 0.5,
          Math.cos(s * 1.1 + d.phase) * c.radius * 0.9 + d.off.z * 0.4);
        const e = 0.02;
        const s2 = (d.t + e) * 0.09;
        d.v.set(
          Math.sin(s2 * 1.3 + d.phase) * c.radius - d.p.x,
          (Math.sin(s2 * 2.7 + d.phase * 2) - Math.sin(s * 2.7 + d.phase * 2)) * 0.7,
          Math.cos(s2 * 1.1 + d.phase) * c.radius * 0.9 - d.p.z).multiplyScalar(1 / e * 0.09);
      } else {
        // 栖息（乌鸦停在鸟居上）
        d.p.copy(d.off).add(c.perch);
        d.v.set(0, 0, 0);
      }
      const spd = d.v.length() || 1;
      const yaw = Math.atan2(d.v.x, d.v.z);
      const pitch = -Math.asin(clamp(d.v.y / spd, -1, 1)) * 0.6;
      const flap = c.mode === 'perch' ? 0 : Math.sin(t * c.flap + d.phase) * 0.6;
      this._e.set(pitch, yaw, flap * 0.4, 'YXZ');
      this._q.setFromEuler(this._e);
      this._m.compose(d.p, this._q, this._s);
      this.mesh.setMatrixAt(i, this._m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

   11 · 物理（Verlet 绳 / 布 / 单摆） + 昼夜四季天气 + 灯光

const PHYSICS = [];   // 每帧更新的物理对象

/** 通用 Verlet 质点弹簧 */
class VerletChain {
  constructor(n, opts = {}) {
    this.n = n;
    this.p = []; this.prev = [];
    this.pinned = new Array(n).fill(false);
    this.grav = opts.grav ?? -9.0;
    this.damp = opts.damp ?? 0.985;
    this.iter = opts.iter ?? 4;
    this.windK = opts.windK ?? 1.0;
    this.stiff = opts.stiff ?? 1.0;
    this.rest = [];
    this.links = [];
  }
  addLink(i, j, len) {
    const l = (len === undefined || len === null) ? this.p[i].distanceTo(this.p[j]) : len;
    this.links.push([i, j]);
    this.rest.push(l);
  }
  init(pts, pinned = []) {
    for (let i = 0; i < this.n; i++) {
      const p = new THREE.Vector3(...pts[i]);
      this.p.push(p); this.prev.push(p.clone());
    }
    pinned.forEach(i => this.pinned[i] = true);
  }
  step(dt, wind, t) {
    const g = this.grav, d = Math.pow(this.damp, dt * 60);
    for (let i = 0; i < this.n; i++) {
      if (this.pinned[i]) continue;
      const p = this.p[i], pr = this.prev[i];
      const vx = (p.x - pr.x) * d, vy = (p.y - pr.y) * d, vz = (p.z - pr.z) * d;
      pr.copy(p);
      const w = this.windK * (0.6 + 0.4 * Math.sin(t * 1.7 + i * 0.7));
      p.x += vx + (wind.x * w + Math.sin(t * 3.1 + i) * 0.35 * this.windK) * dt * dt * 8;
      p.y += vy + g * dt * dt;
      p.z += vz + (wind.y * w + Math.cos(t * 2.7 + i) * 0.35 * this.windK) * dt * dt * 8;
    }
    for (let k = 0; k < this.iter; k++) {
      for (let li = 0; li < this.links.length; li++) {
        const [a, b] = this.links[li];
        const pa = this.p[a], pb = this.p[b];
        const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-5;
        const diff = (dist - this.rest[li]) / dist * 0.5 * this.stiff;
        const ox = dx * diff, oy = dy * diff, oz = dz * diff;
        if (!this.pinned[a]) { pa.x += ox; pa.y += oy; pa.z += oz; }
        if (!this.pinned[b]) { pb.x -= ox; pb.y -= oy; pb.z -= oz; }
      }
    }
  }
}

/** 动态绳（每帧重建管状几何） */
class DynamicRope {
  constructor(pts, radius, radSeg = 6, opts = {}) {
    this.chain = new VerletChain(pts.length, { grav: opts.grav ?? -12, damp: 0.975, windK: opts.windK ?? 1.0, iter: 5 });
    this.chain.init(pts, opts.pinned || [0, pts.length - 1]);
    for (let i = 0; i < pts.length - 1; i++) this.chain.addLink(i, i + 1, this.chain.p[i].distanceTo(this.chain.p[i + 1]));
    this.radius = radius;
    this.radSeg = radSeg;
    this.n = pts.length;
    const verts = this.n * radSeg;
    this.pos = new Float32Array(verts * 3);
    this.uv = new Float32Array(verts * 2);
    const idx = [];
    for (let i = 0; i < this.n - 1; i++) for (let j = 0; j < radSeg; j++) {
      const a = i * radSeg + j, b = i * radSeg + (j + 1) % radSeg;
      const c = (i + 1) * radSeg + j, d = (i + 1) * radSeg + (j + 1) % radSeg;
      idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(this.uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(verts * 3).fill(1), 3));
    g.setIndex(idx);
    this.geo = regGeo(g);
    this.mesh = new THREE.Mesh(this.geo, opts.mat || MAT.rope);
    this.mesh.castShadow = true;
    this.mesh.frustumCulled = false;
    this._t = new THREE.Vector3(); this._n1 = new THREE.Vector3(); this._n2 = new THREE.Vector3(); this._up = new THREE.Vector3(0, 1, 0);
    this.update(0, new THREE.Vector2(), 0);
    PHYSICS.push(this);
  }
  step(dt, wind, t) { this.chain.step(dt, wind, t); this.update(dt, wind, t); }
  update() {
    const p = this.chain.p, R = this.radius, RS = this.radSeg;
    for (let i = 0; i < this.n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(this.n - 1, i + 1)];
      this._t.subVectors(b, a).normalize();
      this._n1.crossVectors(this._t, this._up).normalize();
      if (this._n1.lengthSq() < 0.1) this._n1.set(1, 0, 0);
      this._n2.crossVectors(this._t, this._n1).normalize();
      for (let j = 0; j < RS; j++) {
        const ang = j / RS * TAU;
        const r = R * (0.85 + 0.15 * Math.sin(i * 1.3 + j));
        const o = (i * RS + j) * 3;
        this.pos[o] = p[i].x + (this._n1.x * Math.cos(ang) + this._n2.x * Math.sin(ang)) * r;
        this.pos[o + 1] = p[i].y + (this._n1.y * Math.cos(ang) + this._n2.y * Math.sin(ang)) * r;
        this.pos[o + 2] = p[i].z + (this._n1.z * Math.cos(ang) + this._n2.z * Math.sin(ang)) * r;
        const uo = (i * RS + j) * 2;
        this.uv[uo] = i / (this.n - 1) * 3; this.uv[uo + 1] = j / RS;
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

/** 纸垂 / 御签链式摆动（带状网格） */
class RibbonChain {
  constructor(anchor, width, len, segs, mat) {
    this.chain = new VerletChain(segs + 1, { grav: -6.5, damp: 0.96, windK: 2.2, iter: 3 });
    const pts = [];
    for (let i = 0; i <= segs; i++) pts.push([anchor[0], anchor[1] - len * i / segs, anchor[2]]);
    this.chain.init(pts, [0]);
    for (let i = 0; i < segs; i++) this.chain.addLink(i, i + 1, len / segs);
    this.n = segs + 1; this.width = width;
    const pos = new Float32Array(this.n * 2 * 3), uv = new Float32Array(this.n * 2 * 2), idx = [];
    for (let i = 0; i < this.n; i++) {
      uv[i * 4] = 0; uv[i * 4 + 1] = i / segs; uv[i * 4 + 2] = 1; uv[i * 4 + 3] = i / segs;
    }
    for (let i = 0; i < this.n - 1; i++) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.n * 6).fill(1), 3));
    g.setIndex(idx);
    this.geo = regGeo(g);
    this.pos = pos;
    this.mesh = new THREE.Mesh(this.geo, mat);
    this.mesh.frustumCulled = false;
    this.update();
    PHYSICS.push(this);
  }
  step(dt, wind, t) { this.chain.step(dt, wind, t); this.update(); }
  update() {
    const p = this.chain.p;
    for (let i = 0; i < this.n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(this.n - 1, i + 1)];
      let dx = b.x - a.x, dz = b.z - a.z;
      const l = Math.hypot(dx, dz) || 1;
      const nx = -dz / l * this.width * 0.5, nz = dx / l * this.width * 0.5;
      const o = i * 6;
      this.pos[o] = p[i].x - nx; this.pos[o + 1] = p[i].y; this.pos[o + 2] = p[i].z - nz;
      this.pos[o + 3] = p[i].x + nx; this.pos[o + 4] = p[i].y; this.pos[o + 5] = p[i].z + nz;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

/** 布料（暖帘 / 旗幡） */
class Cloth {
  constructor(o) {
    this.nx = o.nx; this.ny = o.ny;
    this.chain = new VerletChain(this.nx * this.ny, { grav: -7.5, damp: 0.972, windK: 2.0, iter: 4 });
    const pts = [], pinned = [];
    for (let j = 0; j < this.ny; j++) for (let i = 0; i < this.nx; i++) {
      pts.push([o.x + (i / (this.nx - 1) - 0.5) * o.w, o.y - (j / (this.ny - 1)) * o.h, o.z + Math.sin(i * 1.3 + j * 0.7) * 0.01]);
      if (j === 0) pinned.push(j * this.nx + i);
    }
    this.chain.init(pts, pinned);
    for (let j = 0; j < this.ny; j++) for (let i = 0; i < this.nx; i++) {
      const a = j * this.nx + i;
      if (i < this.nx - 1) this.chain.addLink(a, a + 1, o.w / (this.nx - 1));
      if (j < this.ny - 1) this.chain.addLink(a, a + this.nx, o.h / (this.ny - 1));
      if (i < this.nx - 1 && j < this.ny - 1) this.chain.addLink(a, a + this.nx + 1, Math.hypot(o.w / (this.nx - 1), o.h / (this.ny - 1)));
    }
    const pos = new Float32Array(this.nx * this.ny * 3), uv = new Float32Array(this.nx * this.ny * 2), idx = [];
    for (let j = 0; j < this.ny; j++) for (let i = 0; i < this.nx; i++) {
      const k = (j * this.nx + i) * 2;
      uv[k] = i / (this.nx - 1) * (o.uvRep || 1); uv[k + 1] = 1 - j / (this.ny - 1);
    }
    for (let j = 0; j < this.ny - 1; j++) for (let i = 0; i < this.nx - 1; i++) {
      const a = j * this.nx + i;
      idx.push(a, a + this.nx, a + 1, a + 1, a + this.nx, a + this.nx + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.nx * this.ny * 3).fill(1), 3));
    g.setIndex(idx);
    this.geo = regGeo(g); this.pos = pos;
    this.mesh = new THREE.Mesh(this.geo, o.mat);
    this.mesh.castShadow = true;
    this.mesh.frustumCulled = false;
    this.update();
    PHYSICS.push(this);
  }
  step(dt, wind, t) { this.chain.step(dt, wind, t); this.update(); }
  update() {
    const p = this.chain.p;
    for (let i = 0; i < p.length; i++) {
      this.pos[i * 3] = p[i].x; this.pos[i * 3 + 1] = p[i].y; this.pos[i * 3 + 2] = p[i].z;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
}

/** 单摆（神社铃） */
class Pendulum {
  constructor(o) {
    this.origin = new THREE.Vector3(...o.origin);
    this.len = o.len;
    this.theta = 0; this.omega = 0;
    this.thetaX = 0; this.omegaX = 0;
    this.damp = 0.995;
    this.g = 11.0;
    this.mesh = o.mesh;
    this.baseQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0));
    this._q = new THREE.Quaternion(); this._e = new THREE.Euler();
  }
  impulse(v) { this.omega += v; this.omegaX += (Math.random() - 0.5) * v * 0.5; }
  step(dt) {
    const a = -this.g / this.len * Math.sin(this.theta);
    this.omega += a * dt;
    this.omega *= Math.pow(this.damp, dt * 60);
    this.theta += this.omega * dt;
    const ax = -this.g / this.len * Math.sin(this.thetaX);
    this.omegaX += ax * dt;
    this.omegaX *= Math.pow(this.damp, dt * 60);
    this.thetaX += this.omegaX * dt;
    this._e.set(this.thetaX, 0, this.theta, 'XYZ');
    this._q.setFromEuler(this._e);
    this.mesh.quaternion.copy(this._q).multiply(this.baseQ);
  }
}

function buildPhysics(honden, toriiInfo) {
  const P = new THREE.Group(); P.name = 'physics';
  /* 本殿注连绳（Verlet 绳） */
  const hd = honden;
  const ropeY = hd.floorY + 2.85 + 0.30;
  const rpts = [];
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    rpts.push([hd.cx + lerp(-2.5, 2.5, t), ropeY - Math.sin(t * Math.PI) * 0.22, hd.cz + 2.8 + 0.42]);
  }
  const rope = new DynamicRope(rpts, 0.085, 6, { grav: -14, windK: 0.8, pinned: [0, 9], mat: MAT.rope });
  P.add(rope.mesh);
  /* 纸垂链 */
  const shides = [];
  for (let i = 0; i < 6; i++) {
    const t = (i + 0.5) / 6;
    const px = hd.cx + lerp(-2.4, 2.4, t);
    const py = ropeY - Math.sin(t * Math.PI) * 0.22 - 0.05;
    const rc = new RibbonChain([px, py, hd.cz + 2.8 + 0.44], 0.15, 0.46, 4, MAT.shide);
    shides.push(rc); P.add(rc.mesh);
  }
  /* 铃（单摆） */
  const bellMesh = new THREE.Mesh(lathe([[0.0, 0], [0.10, 0.01], [0.155, 0.08], [0.175, 0.22], [0.15, 0.34], [0.09, 0.42], [0.055, 0.46], [0.075, 0.50], [0.02, 0.54]], 14), MAT.gold);
  bellMesh.position.set(hd.cx, ropeY - 0.90, hd.cz + 2.8 + 0.42);
  bellMesh.castShadow = true;
  const bell = new Pendulum({ origin: [hd.cx, ropeY - 0.90, hd.cz + 2.8 + 0.42], len: 0.6, mesh: bellMesh });
  P.add(bellMesh);
  PHYSICS.push(bell);
  /* 暖帘（社务所） */
  const noren = new Cloth({ x: -8.4, y: terrainY(-8.4, -2.2) + 2.32, z: -2.2 + 1.94, w: 3.0, h: 0.85, nx: 13, ny: 5, mat: MAT.banner, uvRep: 3 });
  P.add(noren.mesh);
  /* 旗幡 */
  const flag = new Cloth({ x: 6.4, y: terrainY(6.4, 12.4) + 3.4, z: 12.4, w: 1.1, h: 1.7, nx: 6, ny: 9, mat: MAT.banner });
  P.add(flag.mesh);
  /* 大鸟居注连绳 */
  const t0 = toriiInfo[0];
  const tpts = [];
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    tpts.push([lerp(-3.4, 3.4, t), t0.y + t0.topY - 1.15 - Math.sin(t * Math.PI) * 0.16, t0.z]);
  }
  const toriiRope = new DynamicRope(tpts, 0.11, 6, { grav: -14, windK: 1.0, pinned: [0, 9], mat: MAT.rope });
  P.add(toriiRope.mesh);
  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5;
    const px = lerp(-3.3, 3.3, t), py = t0.y + t0.topY - 1.26 - Math.sin(t * Math.PI) * 0.16;
    const rc = new RibbonChain([px, py, t0.z + 0.02], 0.17, 0.5, 4, MAT.shide);
    P.add(rc.mesh);
  }
  root.add(P);
  DIAG.stats.physics = PHYSICS.length;
  return { P, bell, rope, noren, flag };
}

/* ---------- 昼夜 / 四季 / 天气 ---------- */
const ENV = {
  time: 0.32, season: 0, weather: 0,
  daySpeed: 1 / 240, autoDay: false,
  flash: 0, flashTimer: 0, thunderTimer: 0,
  sunDir: new THREE.Vector3(), moonDir: new THREE.Vector3(),
};
function lerpKeys(keys, t) {
  const n = keys.length;
  let i0 = n - 1, i1 = 0;
  for (let i = 0; i < n; i++) if (keys[i].t <= t) i0 = i;
  i1 = (i0 + 1) % n;
  const a = keys[i0], b = keys[i1];
  let span = b.t - a.t; if (span <= 0) span += 1;
  const k = smoothstep(0, 1, ((t - a.t + 1) % 1) / span);
  return { a, b, k };
}
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function sunDirFrom(az, el) {
  const a = az * D2R, e = el * D2R;
  return new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)).normalize();
}
function applyTimeOfDay(t) {
  const { a, b, k } = lerpKeys(CONFIG.timeOfDay, t);
  ENV.time = t;
  const az = lerp(a.az, b.az, k), el = lerp(a.el, b.el, k);
  ENV.sunDir.copy(sunDirFrom(az, el));
  ENV.moonDir.copy(sunDirFrom(az + 180, clamp(-el, -70, 70)));
  SHARED.uSunDir.value.copy(ENV.sunDir);
  SHARED.uMoonDir.value.copy(ENV.moonDir);
  _c1.setHex(a.sun); _c2.setHex(b.sun);
  SHARED.uSunColor.value.copy(_c1).lerp(_c2, k);
  SHARED.uSunI.value = lerp(a.sunI, b.sunI, k);
  _c1.setHex(a.fog); _c2.setHex(b.fog);
  SHARED.uFogColor.value.copy(_c1).lerp(_c2, k);
  const fogD = lerp(a.fogD, b.fogD, k);
  SHARED.uFogDensity.value = fogD;
  SHARED.uNight.value = lerp(a.moon, b.moon, k) > 0.2 ? 1 : (a.stars + b.stars) * 0.5 > 0.5 ? 1 : 0;
  SHARED.uStars.value = lerp(a.stars, b.stars, k);
  SHARED.uLamp.value = lerp(a.lamp, b.lamp, k);
  SHARED.uExposure.value = lerp(a.expo, b.expo, k);
  ENV.exposure = SHARED.uExposure.value;
  // 天空
  const night = saturate(SHARED.uStars.value);
  _c1.setHex(a.hemiSky); _c2.setHex(b.hemiSky);
  const hSky = _c1.clone().lerp(_c2, k);
  _c1.setHex(a.hemiGnd); _c2.setHex(b.hemiGnd);
  const hGnd = _c1.clone().lerp(_c2, k);
  if (ENV.lights) {
    ENV.lights.hemi.color.copy(hSky);
    ENV.lights.hemi.groundColor.copy(hGnd);
    ENV.lights.hemi.intensity = lerp(a.hemiI, b.hemiI, k);
    _c1.setHex(a.amb); _c2.setHex(b.amb);
    ENV.lights.amb.color.copy(_c1).lerp(_c2, k);
    ENV.lights.amb.intensity = lerp(a.ambI, b.ambI, k);
    ENV.lights.sun.intensity = SHARED.uSunI.value;
    ENV.lights.sun.color.copy(SHARED.uSunColor.value);
    ENV.lights.sun.visible = el > -3;
    ENV.lights.moon.intensity = lerp(a.moon, b.moon, k) * 0.85;
    ENV.lights.moon.color.setHex(0xaec6ff);
    ENV.lights.moon.visible = ENV.lights.moon.intensity > 0.02;
    // 阴影相机跟随太阳
    const s = ENV.lights.sun;
    s.position.copy(ENV.sunDir).multiplyScalar(46).add(new THREE.Vector3(0, 6, -4));
    s.target.position.set(0, 4, -3);
    s.target.updateMatrixWorld();
  }
  if (ENV.skyMat) {
    ENV.skyMat.uniforms.uZenith.value.setHex(0x2f6fc4).lerp(new THREE.Color(0x0b1226), night);
    const hor = _c1.setHex(a.fog).clone().lerp(_c2.setHex(b.fog).clone(), k);
    ENV.skyMat.uniforms.uHorizon.value.copy(hor);
    ENV.skyMat.uniforms.uGround.value.setHex(0x7e8676).lerp(new THREE.Color(0x0e1119), night);
  }
  // 夜间收敛植被/花瓣边缘光，避免草地自发光
  {
    const rs = 1 - night * 0.78;
    for (const m of [MAT.grass, MAT.foliageBroadleaf, MAT.foliageEvergreen, MAT.foliageShrub, MAT.petalP, MAT.leafP]) {
      if (m && m.userData.U && m.userData.opts) m.userData.U.uRimStrength.value = (m.userData.opts.rim ?? 0.4) * rs;
    }
    if (MAT.grass.userData.U) MAT.grass.userData.U.uSSS.value = 0.32 * (1 - night * 0.5);
  }
  if (ENV.pond && ENV.pond.waterMesh) {
    const u = ENV.pond.waterMesh.material.uniforms;
    u.uZenith.value.copy(ENV.skyMat ? ENV.skyMat.uniforms.uZenith.value : new THREE.Color(0x3f7fd0));
    u.uHorizon.value.copy(ENV.skyMat ? ENV.skyMat.uniforms.uHorizon.value : new THREE.Color(0xcfe2f2));
  }
  // 灯笼点光
  if (ENV.lights) {
    const li = SHARED.uLamp.value;
    for (const l of ENV.lights.points) l.intensity = li * l.userData.base;
  }
  // 发光面
  if (MAT.glass.userData.U) MAT.glass.userData.U.uEmissiveI.value = SHARED.uLamp.value * 2.6;
  if (MAT.washi.userData.U) MAT.washi.userData.U.uEmissiveI.value = 0;
}
function applySeason(i) {
  ENV.season = i;
  const s = CONFIG.seasons[i];
  SHARED.uSnow.value = s.snow;
  SHARED.uSeasonTint.value.setHex(s.skyTint);
  SHARED.uSeasonMix.value = s.skyMix;
  const fol = MAT.foliageBroadleaf.userData.U;

  if (ENV.petals) ENV.petals.rate = s.petalRate;

function applyWeather(i) {

function buildLights() {

  L.sun = new THREE.DirectionalLight(0xffe0b4, 3.0);
  L.sun.castShadow = true;
  L.sun.shadow.mapSize.set(CONFIG.render.shadowMapSize, CONFIG.render.shadowMapSize);
  const ext = CONFIG.render.shadowExtent;
  L.sun.shadow.camera.left = -ext; L.sun.shadow.camera.right = ext;
  L.sun.shadow.camera.top = ext; L.sun.shadow.camera.bottom = -ext;
  L.sun.shadow.camera.near = 1; L.sun.shadow.camera.far = 130;
  L.sun.shadow.bias = -0.0006;
  L.sun.shadow.normalBias = 0.055;
  L.sun.shadow.radius = 2.2;
  L.sun.target = new THREE.Object3D();
  scene.add(L.sun, L.sun.target);
  L.moon = new THREE.DirectionalLight(0xaec6ff, 0.0);
  L.moon.castShadow = false;
  scene.add(L.moon);
  L.points = [];
  const spots = [[0, 14], [-2.6, 8], [2.6, 8], [-6.8, 4.4], [7.6, 8.4], [-8.4, -2.2], [8.2, -2.2]];
  for (let i = 0; i < spots.length; i++) {
    const [px, pz] = spots[i];
    const p = new THREE.PointLight(0xffb14d, 0, 9, 2.0);
    p.position.set(px, terrainY(px, pz) + 2.1, pz);
    p.userData.base = i < 2 ? 3.4 : 2.6;
    scene.add(p);
    L.points.push(p);
  }
  ENV.lights = L;
  return L;
}

/* ---------- 闪电 ---------- */
function updateLightning(dt) {
  const rate = ENV.boltRate || 0;
  if (rate <= 0) { SHARED.uFlash.value *= Math.pow(0.02, dt); return; }
  ENV.thunderTimer -= dt;
  if (ENV.flash > 0.01) {
    ENV.flash -= dt * 4.5;
    SHARED.uFlash.value = Math.max(0, ENV.flash) * (0.55 + 0.45 * Math.abs(Math.sin(ENV.flash * 40)));
  } else if (Math.random() < dt * rate * 0.55) {
    ENV.flash = 0.9 + Math.random() * 0.6;
    SHARED.uFlash.value = 1.2;
  } else {
    SHARED.uFlash.value *= Math.pow(0.03, dt);
  }
}
/* ═══════════════════════════════════════════════════════════════════════════
   12 · 渲染器 / 相机 / 后期链 / 交互 / 主循环

const renderer = new THREE.WebGLRenderer({
