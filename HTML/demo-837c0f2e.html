/* ---------- 程序化色彩分级 LUT（冷暖对比曲线） ---------- */
function makeLutTexture() {
  const W = 256, H = 16;
  const data = new Uint8Array(W * H * 4);
  for (let b = 0; b < 16; b++) for (let g = 0; g < 16; g++) for (let r = 0; r < 16; r++) {
    let R = r / 15, G = g / 15, B = b / 15;
    // 冷暖对比：阴影偏青蓝，高光偏暖
    const lum = R * 0.299 + G * 0.587 + B * 0.114;
    const shadowW = Math.pow(1 - lum, 2.0), highW = Math.pow(lum, 2.2);
    R = saturate(R + highW * 0.085 - shadowW * 0.045);
    G = saturate(G + highW * 0.030 + shadowW * 0.010);
    B = saturate(B - highW * 0.070 + shadowW * 0.085);
    // S 曲线对比
    const sCurve = (v) => saturate(v + 0.26 * (v - 0.5) * (1 - Math.abs(v - 0.5) * 2) * -1 + (v - 0.5) * 0.14);
    R = sCurve(R); G = sCurve(G); B = sCurve(B);
    // 轻微饱和
    const l2 = R * 0.299 + G * 0.587 + B * 0.114;
    R = saturate(l2 + (R - l2) * 1.22); G = saturate(l2 + (G - l2) * 1.22); B = saturate(l2 + (B - l2) * 1.22);
    const x = b * 16 + r, y = g;
    const i = (y * W + x) * 4;
    data[i] = R * 255; data[i + 1] = G * 255; data[i + 2] = B * 255; data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.colorSpace = THREE.NoColorSpace;
  t.needsUpdate = true;
  return regTex(t);
}

/* ---------- 屏幕空间法线/深度边缘检测（发丝状描边） ---------- */
const OUTLINE_RT = regRT(new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  type: THREE.UnsignedByteType, depthBuffer: true, stencilBuffer: false,
}));
const prepassMat = regMat(new THREE.ShaderMaterial({
  uniforms: { uNear: { value: 0.1 }, uFar: { value: 460 } },
  vertexShader: `
    varying vec3 vN; varying float vZ;
    void main(){
      vec4 mv = modelViewMatrix * vec4( position, 1.0 );
      #ifdef USE_INSTANCING
        mv = modelViewMatrix * instanceMatrix * vec4( position, 1.0 );
      #endif
      vN = normalize( normalMatrix * ( 1.0 * normal ) );
      vZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uNear, uFar;
    varying vec3 vN; varying float vZ;
    void main(){
      vec3 n = normalize( vN ) * 0.5 + 0.5;
      float d = clamp( ( vZ - uNear ) / ( uFar - uNear ), 0.0, 1.0 );
      gl_FragColor = vec4( n, d );
    }`,
  side: THREE.FrontSide,
}));
const OutlineShader = {
  uniforms: {
    tDiffuse: { value: null },
    tNormalDepth: { value: null },
    uTexel: { value: new THREE.Vector2(1 / 1024, 1 / 1024) },
    uDepthThresh: { value: 0.0042 },
    uNormalThresh: { value: 0.62 },
    uStrength: { value: CONFIG.outline.ssWidth },
    uColor: { value: new THREE.Color(0x090a10) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse, tNormalDepth;
    uniform vec2 uTexel; uniform float uDepthThresh, uNormalThresh, uStrength;
    uniform vec3 uColor;
    varying vec2 vUv;
    float ld( vec2 uv ){ return texture2D( tNormalDepth, uv ).a; }
    vec3 nr( vec2 uv ){ return texture2D( tNormalDepth, uv ).rgb * 2.0 - 1.0; }
    void main(){
      vec2 o[4];
      o[0] = vec2( uTexel.x, 0.0 ); o[1] = vec2( -uTexel.x, 0.0 );
      o[2] = vec2( 0.0, uTexel.y ); o[3] = vec2( 0.0, -uTexel.y );
      float d0 = ld( vUv );
      vec3 n0 = nr( vUv );
      float e = 0.0;
      for ( int i = 0; i < 4; i ++ ){
        float d1 = ld( vUv + o[i] );
        vec3 n1 = nr( vUv + o[i] );
        float dz = abs( d1 - d0 ) / max( min( d0, d1 ), 0.0008 );
        float dn = 1.0 - dot( n0, n1 );
        e = max( e, smoothstep( uDepthThresh, uDepthThresh * 2.6, dz ) );
        e = max( e, smoothstep( uNormalThresh, uNormalThresh * 1.7, dn ) * 0.85 );
      }
      vec4 c = texture2D( tDiffuse, vUv );
      float k = clamp( e, 0.0, 1.0 ) * 0.48;
      gl_FragColor = vec4( mix( c.rgb, uColor, k ), c.a );
    }`,
};
const outlinePass = new ShaderPass(OutlineShader);
outlinePass.uniforms.tNormalDepth.value = OUTLINE_RT.texture;

/* ---------- 体积光 ---------- */
const GodRaysShader = {
  uniforms: {
    tDiffuse: { value: null },
    uSunPos: { value: new THREE.Vector2(0.5, 0.5) },
    uDensity: { value: CONFIG.post.godRays.density },
    uDecay: { value: CONFIG.post.godRays.decay },
    uWeight: { value: CONFIG.post.godRays.weight },
    uExposure: { value: CONFIG.post.godRays.exposure },
    uOn: { value: 0 },
  },
  defines: { SAMPLES: 32 },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uSunPos;
    uniform float uDensity, uDecay, uWeight, uExposure, uOn;
    varying vec2 vUv;
    void main(){
      vec4 base = texture2D( tDiffuse, vUv );
      if ( uOn < 0.01 ){ gl_FragColor = base; return; }
      vec2 delta = ( vUv - uSunPos ) * uDensity / float( SAMPLES );
      vec2 uv = vUv;
      vec3 acc = vec3( 0.0 );
      float illum = 1.0;
      for ( int i = 0; i < SAMPLES; i ++ ){
        uv -= delta;
        vec3 s = texture2D( tDiffuse, uv ).rgb;
        float lum = dot( s, vec3( 0.299, 0.587, 0.114 ) );
        acc += s * smoothstep( 0.72, 0.98, lum ) * illum * uWeight;
        illum *= uDecay;
      }
      gl_FragColor = vec4( base.rgb + acc * uExposure * uOn, base.a );
    }`,
};
const godRays = new ShaderPass(GodRaysShader);

/* ---------- 色彩分级 + 暗角 + 胶片颗粒 + 抖动 ---------- */
const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    tLut: { value: makeLutTexture() },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uGrain: { value: CONFIG.post.grain },
    uVignette: { value: CONFIG.post.vignette },
    uDither: { value: CONFIG.post.dither },
    uNight: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse, tLut;
    uniform vec2 uRes; uniform float uTime, uGrain, uVignette, uDither, uNight;
    varying vec2 vUv;
    float h12( vec2 p ){ vec3 p3 = fract( vec3( p.xyx ) * 0.1031 ); p3 += dot( p3, p3.yzx + 33.33 ); return fract( ( p3.x + p3.y ) * p3.z ); }
    vec3 lut( vec3 c ){
      c = clamp( c, 0.0, 1.0 );
      float b = c.b * 15.0;
      float i0 = floor( b ), i1 = min( i0 + 1.0, 15.0 );
      float f = b - i0;
      vec2 uv0 = vec2( ( i0 * 16.0 + c.r * 15.0 + 0.5 ) / 256.0, ( c.g * 15.0 + 0.5 ) / 16.0 );
      vec2 uv1 = vec2( ( i1 * 16.0 + c.r * 15.0 + 0.5 ) / 256.0, ( c.g * 15.0 + 0.5 ) / 16.0 );
      return mix( texture2D( tLut, uv0 ).rgb, texture2D( tLut, uv1 ).rgb, f );
    }
    void main(){
      vec4 src = texture2D( tDiffuse, vUv );
      vec3 c = lut( src.rgb );
      c = mix( c, src.rgb, 0.30 );                 // 保留部分原色
      vec2 q = vUv - 0.5;
      float vig = 1.0 - uVignette * dot( q, q ) * 2.6;
      c *= clamp( vig, 0.0, 1.0 );
      float g = h12( vUv * uRes + fract( uTime ) * 137.0 ) - 0.5;
      c += g * uGrain;
      float d = h12( vUv * uRes * 1.73 + 5.0 ) - 0.5;
      c += d * uDither / 255.0;
      c = max( c, vec3( 0.0 ) );
      gl_FragColor = vec4( c, src.a );
    }`,
};
const gradePass = new ShaderPass(GradeShader);

/* ---------- 后期链组装 ---------- */
let composer, ssaoPass, bloomPass, bokehPass, smaaPass, renderPass, outputPass;
function buildPostFX() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(size.x, size.y, {
    type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: true, stencilBuffer: false,
  }));
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  // SSAO
  ssaoPass = new SSAOPass(scene, camera, size.x, size.y);
  ssaoPass.kernelRadius = CONFIG.post.ssaoRadius;
  ssaoPass.minDistance = CONFIG.post.ssaoMin;
  ssaoPass.maxDistance = CONFIG.post.ssaoMax;
  ssaoPass.output = SSAOPass.OUTPUT.Default;
  composer.addPass(ssaoPass);
  // 屏幕空间描边
  composer.addPass(outlinePass);
  // 体积光
  composer.addPass(godRays);
  // Bloom
  bloomPass = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), CONFIG.post.bloom.strength, CONFIG.post.bloom.radius, CONFIG.post.bloom.threshold);
  composer.addPass(bloomPass);
  // 微缩景深
  bokehPass = new BokehPass(scene, camera, {
    focus: 40, aperture: CONFIG.post.dof.aperture, maxblur: CONFIG.post.dof.maxBlur,
  });
  composer.addPass(bokehPass);
  // 调色 / 暗角 / 颗粒 / 抖动
  composer.addPass(gradePass);
  // 输出（色调映射 + 色彩空间）
  outputPass = new OutputPass();
  composer.addPass(outputPass);
  // SMAA 抗锯齿
  smaaPass = new SMAAPass(size.x, size.y);
  composer.addPass(smaaPass);
  composer.setSize(window.innerWidth, window.innerHeight);
  onResize();
}
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.pixelRatioCap);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  if (composer) {
    composer.setSize(w, h);
    ssaoPass.setSize(size.x, size.y);
    bloomPass.setSize(size.x, size.y);
    smaaPass.setSize(size.x, size.y);
    outlinePass.uniforms.uTexel.value.set(0.5 / (size.x * 0.5), 0.5 / (size.y * 0.5));
    gradePass.uniforms.uRes.value.copy(size);
    SHARED.uResolution.value.copy(size);
  }
  const ow = Math.max(2, Math.floor(size.x * 0.5)), oh = Math.max(2, Math.floor(size.y * 0.5));
  OUTLINE_RT.setSize(ow, oh);
  outlinePass.uniforms.uTexel.value.set(1 / ow, 1 / oh);
  prepassMat.uniforms.uNear.value = camera.near;
  prepassMat.uniforms.uFar.value = camera.far;
}

/* ---------- 交互：射线拾取（BVH 加速） ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const PICKABLES = [];       // { mesh, kind, bvh }
let INTERACT = null;
function buildInteractions(ctx) {
  const { honden, physics, flora, systems, water } = ctx;
  // 本殿合并网格 → BVH
  const cands = [];
  honden.group.traverse(o => {
    if (o.isMesh && o.geometry && o.geometry.attributes.position.count > 3000) cands.push(o);
  });
  cands.sort((a, b) => b.geometry.attributes.position.count - a.geometry.attributes.position.count);
  for (const m of cands.slice(0, 3)) PICKABLES.push({ mesh: m, kind: 'honden', bvh: new BVH(m.geometry, 12) });
  // 樱花树冠
  if (flora) {
    for (const g of flora.group.children) {
      if (g.name && g.name.indexOf('treeChunk') === 0 && g.name.indexOf('L0') > 0) {
        g.traverse(o => {
          if (o.isMesh && o.material === MAT.foliageBroadleaf && o.geometry.attributes.position.count > 200)
            PICKABLES.push({ mesh: o, kind: 'sakura', bvh: new BVH(o.geometry, 16) });
        });
      }
    }
  }
  INTERACT = { ctx, bell: physics.bell, ripples: systems.ripples, petals: systems.petals, water };
  DIAG.stats.pickables = PICKABLES.length;
  DIAG.stats.bvhTris = PICKABLES.reduce((s, p) => s + p.bvh.triN, 0);

  const onDown = (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    // 1. 铃
    const bellMesh = physics.bell.mesh;
    const bd = raycaster.ray.distanceSqToPoint(bellMesh.position);
    if (bd < 0.42 * 0.42) {
      physics.bell.impulse(2.6 + Math.random() * 0.7);
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * TAU, r = 0.1 + Math.random() * 0.5;
        systems.ripples.emit(bellMesh.position.x + Math.cos(a) * r, bellMesh.position.y - 0.2 - Math.random() * 0.6, bellMesh.position.z + Math.sin(a) * r, 0.25 + Math.random() * 0.4);
      }
      return;
    }
    // 2. 水面
    const pc = CONFIG.water.pondCenter, WL = CONFIG.water.waterLevel;
    const dy = raycaster.ray.direction.y;
    if (Math.abs(dy) > 1e-5) {
      const t = (WL - raycaster.ray.origin.y) / dy;
      if (t > 0 && t < 120) {
        const px = raycaster.ray.origin.x + raycaster.ray.direction.x * t;
        const pz = raycaster.ray.origin.z + raycaster.ray.direction.z * t;
        if (Math.hypot(px - pc[0], pz - pc[2]) < CONFIG.water.pondRadius * 1.05) {
          for (let i = 0; i < 3; i++) systems.ripples.emit(px, WL + 0.02, pz, 0.5 + i * 0.35);
          SHARED.uFoam.value = Math.min(1.4, SHARED.uFoam.value + 0.6);
          return;
        }
      }
    }
    // 3. BVH 拾取
    for (const p of PICKABLES) {
      const hit = p.bvh.intersect(raycaster.ray);
      if (hit) {
        if (p.kind === 'sakura') {
          const burst = 90;
          for (let i = 0; i < burst; i++) {
            const idx = Math.floor(Math.random() * systems.petals.n);
            const pp = systems.petals;
            pp.p[idx * 3] = hit.point.x + (Math.random() - 0.5) * 1.4;
            pp.p[idx * 3 + 1] = hit.point.y + (Math.random() - 0.5) * 1.4;
            pp.p[idx * 3 + 2] = hit.point.z + (Math.random() - 0.5) * 1.4;
            pp.v[idx * 3] = (Math.random() - 0.5) * 2.2;
            pp.v[idx * 3 + 1] = Math.random() * 1.6;
            pp.v[idx * 3 + 2] = (Math.random() - 0.5) * 2.2;
          }
        } else {
          physics.bell.impulse(1.4 + Math.random());
          for (let i = 0; i < 6; i++) systems.ripples.emit(hit.point.x + (Math.random() - 0.5) * 0.6, hit.point.y, hit.point.z + (Math.random() - 0.5) * 0.6, 0.3);
        }
        return;
      }
    }
  };
  window.addEventListener('pointerdown', onDown);
  window.addEventListener('pointerup', () => { });
}

/* ---------- 键盘（隐藏式切换，无任何可见控件） ---------- */
function bindKeys() {
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 't') {
      const keys = CONFIG.timeOfDay.map(x => x.t);
      let next = keys.find(v => v > ENV.time + 0.001);
      if (next === undefined) next = keys[0];
      applyTimeOfDay(next);
    } else if (k === 'y') {
      applySeason((ENV.season + 1) % CONFIG.seasons.length);
    } else if (k === 'r') {
      applyWeather((ENV.weather + 1) % CONFIG.weathers.length);
    } else if (k === 'p') {
      controls.autoRotate = !controls.autoRotate;
    } else if (k === 'o') {
      ENV.autoDay = !ENV.autoDay;
    } else if (k >= '1' && k <= '5') {
      const i = +k - 1;
      if (i < CONFIG.weathers.length) applyWeather(i);
    }
  });
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { clock.getDelta(); }
  });
}

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
let CTX = null;
let frameCount = 0, fpsAcc = 0, fpsT = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  SHARED.uTime.value = t;
  renderer.info.reset();

  /* 环境 */
  if (ENV.autoDay) applyTimeOfDay((ENV.time + dt * ENV.daySpeed) % 1);
  updateLightning(dt);
  SHARED.uFoam.value *= Math.pow(0.35, dt);
  const windPulse = 0.82 + 0.18 * Math.sin(t * 0.31) + 0.12 * Math.sin(t * 1.07);
  if (ENV.windBase) SHARED.uWind.value.set(ENV.windBase.x * windPulse, ENV.windBase.y * windPulse);
  SHARED.uWindGust.value = windPulse;

  /* 物理 */
  for (let i = 0; i < PHYSICS.length; i++) PHYSICS[i].step(dt, SHARED.uWind.value, t);

  /* 系统 */
  const S = CTX.systems;
  if (S) {
    const petalOn = CONFIG.seasons[ENV.season].petalRate > 0;
    S.petals.mesh.visible = petalOn;
    if (petalOn) S.petals.update(dt, t, SHARED.uWind.value, camera.position);
    const leafOn = CONFIG.seasons[ENV.season].leafRate > 0;
    S.leaves.mesh.visible = leafOn;
    if (leafOn) S.leaves.update(dt, t, SHARED.uWind.value, camera.position);
    const isRain = CONFIG.weathers[ENV.weather].rain > 0;
    S.rain.mesh.visible = isRain;
    S.rain.uniform.uSizeMul.value = isRain ? 1 : 0;
    const isSnow = CONFIG.seasons[ENV.season].snow > 0.5;
    S.snow.mesh.visible = isSnow;
    S.mist.mesh.visible = true;
    S.smoke.mesh.visible = true;
    S.embers.mesh.visible = true;
    S.ripples.update(dt);
    S.birds.update(dt, t, camera);
    S.crows.update(dt, t, camera);
    S.butterflies.update(dt, t, camera);
    S.dragonflies.update(dt, t, camera);
    // 萤火虫：仅夏季夜间可见
    const ff = (ENV.season === 1) ? saturate(SHARED.uStars.value) * 1.0 : 0;
    S.fireflies.mesh.visible = ff > 0.05;
    if (ff > 0.05) {
      S.fireflies.update(dt, t, SHARED.uWind.value, camera.position);
      const col = S.fireflies.mesh.instanceColor;
      if (col) {
        for (let i = 0; i < S.fireflies.n; i++) {
          const pulse = 0.18 + 0.82 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.2 + S.fireflies.phase[i] * 3.1), 3);
          col.array[i * 3] = pulse; col.array[i * 3 + 1] = pulse * 0.86; col.array[i * 3 + 2] = pulse * 0.4;
        }
        col.needsUpdate = true;
      }
    }
  }
  if (CTX.water && CTX.water.koi) CTX.water.koi.update(dt, t);

  /* 相机焦点随缩放插值 */
  const dist = camera.position.distanceTo(controls.target);
  const targetY = lerp(1.6, 8.5, smoothstep(CONFIG.camera.minDistance, CONFIG.camera.maxDistance * 0.75, dist));
  controls.target.y += (targetY - controls.target.y) * Math.min(1, dt * 2.2);
  controls.update();

  /* LOD */
  if (CTX.flora) CTX.flora.lod.update(camera);

  /* 雾随天气与时段 */
  const fogD = SHARED.uFogDensity.value * (1 + (CONFIG.weathers[ENV.weather].fogBoost || 0) * 3.2);
  if (scene.fog) {
    scene.fog.color.copy(SHARED.uFogColor.value);
    scene.fog.density = fogD * 1.15;
  }
  renderer.toneMappingExposure = SHARED.uExposure.value * 1.12 * (1 + SHARED.uFlash.value * 0.35);

  /* 描边预处理（仅关键结构层） */
  if (CONFIG.outline.screenSpace && OUTLINE_RT) {
    const oldOverride = scene.overrideMaterial;
    const oldMask = camera.layers.mask;
    const oldClear = renderer.getClearColor(new THREE.Color());
    const oldAlpha = renderer.getClearAlpha();
    scene.overrideMaterial = prepassMat;
    camera.layers.set(1);
    renderer.setRenderTarget(OUTLINE_RT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.setClearColor(oldClear, oldAlpha);
    camera.layers.mask = oldMask;
    scene.overrideMaterial = oldOverride;
  }

  /* 体积光：太阳屏幕位置 */
  if (godRays) {
    const sd = ENV.sunDir.clone().multiplyScalar(200).add(camera.position);
    const proj = sd.clone().project(camera);
    const onScreen = proj.z < 1 && Math.abs(proj.x) < 1.4 && Math.abs(proj.y) < 1.4;
    godRays.uniforms.uSunPos.value.set(proj.x * 0.5 + 0.5, proj.y * 0.5 + 0.5);
    godRays.uniforms.uOn.value = onScreen ? saturate(ENV.sunDir.y * 2.2) * (1 - SHARED.uCloudDark.value * 0.9) : 0;
  }
  /* 景深焦点跟随轨道中心 */
  if (bokehPass) {
    const d = camera.position.distanceTo(controls.target);
    bokehPass.uniforms.focus.value += (d - bokehPass.uniforms.focus.value) * Math.min(1, dt * 3.0);
    bokehPass.uniforms.aperture.value = CONFIG.post.dof.aperture;
  }
  if (gradePass) {
    gradePass.uniforms.uTime.value = t;
    gradePass.uniforms.uNight.value = SHARED.uNight.value;
  }
  if (CTX.skyMat) CTX.skyMat.uniforms.uTime.value = t;
  if (CTX.skyMesh) CTX.skyMesh.position.copy(camera.position);

  if (composer) composer.render();
  else renderer.render(scene, camera);

  /* 统计 */
  frameCount++;
  fpsAcc += dt; fpsT++;
  if (fpsAcc > 0.5) {
    DIAG.stats.fps = +(fpsT / fpsAcc).toFixed(1);
    DIAG.stats.drawCalls = renderer.info.render.calls;
    DIAG.stats.triangles = renderer.info.render.triangles;
    DIAG.stats.textures = renderer.info.memory.textures;
    DIAG.stats.geometries = renderer.info.memory.geometries;
    DIAG.stats.programs = renderer.info.programs ? renderer.info.programs.length : 0;
    fpsAcc = 0; fpsT = 0;
  }
}

/* ---------- 启动 ---------- */
function init() {
  const t0 = performance.now();
  const TM = {};
  const mark = (k) => { TM[k] = Math.round(performance.now() - t0); };
  buildTextureLibrary(); mark('tex');
  buildExtraTextures();
  buildMaterials(); mark('mat');
  buildLights();
  buildBase(); mark('base');
  const honden = buildHonden(); mark('honden');
  buildPrecinct(); mark('precinct');
  buildTorii3(); mark('torii');
  const flora = buildFlora(); mark('flora');
  const water = buildWater(); mark('water');
  const systems = buildSystems(); mark('systems');
  const physics = buildPhysics(honden, TORII_INFO); mark('physics');
  const sky = makeSky(); mark('sky');
  scene.add(sky.mesh);
  scene.fog = new THREE.FogExp2(SHARED.uFogColor.value.getHex(), 0.004 * 1.15);

  /* 屋顶瓦片实例化（四种几何，全场共用） */
  const tileMat = MAT.kawara;
  const tiles = [
    ['flat', tileGeoFlat(), CONFIG.counts.roofTiles],
    ['round', tileGeoRound(), 4000],
    ['tomoe', tileGeoTomoe(), 3000],
    ['drip', tileGeoDrip(), 3000],
  ];
  let totalTiles = 0;
  for (const [k, g, cap] of tiles) {
    const list = TILE_SETS[k];
    if (!list.length) continue;
    const im = makeInstanced(g, tileMat, list.length, 'roofTiles_' + k, { castShadow: false });
    fillInstances(im, list);
    root.add(im);
    totalTiles += list.length;
  }
  DIAG.stats.roofTiles = totalTiles;
  DIAG.stats.roofTilesFlat = TILE_SETS.flat.length;

  CTX = { honden, flora, water, systems, physics, skyMat: sky.mat, skyMesh: sky.mesh };
  ENV.skyMat = sky.mat;
  ENV.pond = water.pond;
  ENV.rain = systems.rain; ENV.snowPts = systems.snow;
  ENV.petals = systems.petals; ENV.leaves = systems.leaves;
  applyTimeOfDay(CONFIG.timeOfDay[2].t);
  applySeason(0);
  applyWeather(0);
  buildPostFX();
  buildInteractions(CTX);
  bindKeys();
  onResize();
  animate();
  DIAG.stats.buildMs = Math.round(performance.now() - t0);
  DIAG.stats.buildStages = TM;
  DIAG.stats.drawCallsBudget = CONFIG.render.maxDrawCalls;
  window.__scene = scene;
  window.__terrainY = terrainY;
  window.__composer = composer;
  window.__cam = camera;
  window.__renderer = renderer;
  window.__THREE = THREE;
  DIAG.ready = true;
}
/* 鸟居（在底座之后构建，便于读取地形高度） */
let TORII_INFO = [];
function buildTorii3() {
  const B = new Batcher('torii');
  const specs = [
    { x: 0, z: 16.4, s: 1.00, shimenawa: true },
    { x: 0, z: 8.4, s: 0.84, shimenawa: false },
    { x: 0, z: 2.6, s: 0.70, shimenawa: false },
  ];
  TORII_INFO = specs.map(sp => {
    const y = buildTorii(B, sp.x, sp.z, sp.s, sp);
    return { x: sp.x, z: sp.z, y, topY: 5.6 * sp.s - 0.25, s: sp.s };
  });
  const g = new THREE.Group(); g.name = 'torii';
  B.flush(g, { hull: CONFIG.outline.hullWidth * 1.6, layer: 1 });   // 鸟居保留 hull 描边
  root.add(g);
  DIAG.stats.torii = specs.length;
  return g;
}

/* ---------- 诊断接口（不可见，仅用于自动化验收） ---------- */
DIAG.setTime = (t) => applyTimeOfDay(t);
DIAG.setSeason = (i) => applySeason(i);
DIAG.setWeather = (i) => applyWeather(i);
DIAG.setAutoDay = (v) => { ENV.autoDay = !!v; };
DIAG.pauseRotation = () => { controls.autoRotate = false; };
DIAG.setCamera = (pos, target) => {
  camera.position.set(pos[0], pos[1], pos[2]);
  if (target) controls.target.set(target[0], target[1], target[2]);
  controls.update();
};
DIAG.setQuality = (q) => {
  const cap = q === 'low' ? 0.55 : q === 'mid' ? 0.9 : 1.5;
  CONFIG.render.pixelRatioCap = cap;
  if (q === 'low' || q === 'test') {
    if (ssaoPass) ssaoPass.enabled = false;
    if (godRays) godRays.enabled = false;
    if (smaaPass) smaaPass.enabled = false;
    if (outlinePass) outlinePass.enabled = false;
    if (bokehPass) bokehPass.enabled = false;
    if (bloomPass) bloomPass.enabled = false;
    CONFIG.outline.screenSpace = false;
  }
  if (q === 'full' || q === 'high') {
    if (ssaoPass) ssaoPass.enabled = true;
    if (godRays) godRays.enabled = true;
    if (smaaPass) smaaPass.enabled = true;
    if (outlinePass) outlinePass.enabled = true;
    if (bokehPass) bokehPass.enabled = true;
    if (bloomPass) bloomPass.enabled = true;
    CONFIG.outline.screenSpace = true;
    renderer.shadowMap.enabled = true;
    CONFIG.render.pixelRatioCap = 1.5;
  }
  if (q === 'test') {
    renderer.shadowMap.enabled = false;
    CONFIG.render.pixelRatioCap = 0.5;
  }
  onResize();
};
DIAG.renderOnce = () => {
  renderer.info.reset();
  const t0 = performance.now();
  renderer.render(scene, camera);
  const ms = +(performance.now() - t0).toFixed(1);
  return { ms, calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
};
DIAG.info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles });
DIAG.frameCost = () => {
  const t0 = performance.now();
  composer.render();
  return +(performance.now() - t0).toFixed(1);
};
DIAG.diag = () => ({
  ready: !!DIAG.ready,
  errors: DIAG.errors,
  stats: DIAG.stats,
  render: { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries },
  time: ENV.time, season: ENV.season, weather: ENV.weather,
  camera: camera.position.toArray().map(v => +v.toFixed(2)),
  target: controls.target.toArray().map(v => +v.toFixed(2)),
});

init();
</script>
