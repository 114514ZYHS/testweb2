<style>

(function () {
  function fail(msg) {
    var f = document.getElementById('fatal');
    if (f && f.style.display !== 'flex') { f.style.display = 'flex'; f.innerHTML = '运行出错：<br>' + msg; }
    document.title = 'ERR ' + msg;
  }
  window.addEventListener('error', function (e) { fail(e.message || String(e.error)); });
  window.addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message ? e.reason.message : String(e.reason)); });
})();

    if (keys.KeyD) camS.free.addScaledVector(_v2, sp);

const mmBase = document.createElement('canvas'); mmBase.width = W; mmBase.height = D;
const mmCtx = mmBase.getContext('2d');
const mapCv = $('map'), mapCtx = mapCv.getContext('2d');
function buildMinimapBase() {
  if (!worldReady) return;
  const s = SEASONS[S.season];
  const sR = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
  const gA = sR(s.gnd), gB = sR(s.gnd2);
  const img = mmCtx.createImageData(W, D), d = img.data;
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const h = hmap[CI(x, z)], o = (z * W + x) * 4;
    let r, g, b;
    if (h < SEA) {
      const k = clamp((SEA - h) / 16, 0, 1);
      r = 58 - 40 * k; g = 126 - 76 * k; b = 178 - 78 * k;
    } else {
      const mix = h2i(x, z, 5) * 0.5 + 0.25;
      r = gA[0] * (1 - mix) + gB[0] * mix; g = gA[1] * (1 - mix) + gB[1] * mix; b = gA[2] * (1 - mix) + gB[2] * mix;
      if (h > 44) { const k = clamp((h - 44) / 9, 0, 1); r = lerp(r, 150, k); g = lerp(g, 152, k); b = lerp(b, 156, k); }
    }
    const nx = hAt(x + 2, z), nz = hAt(x, z + 2);
    const sh = clamp(0.86 + (h - (nx + nz) * 0.5) * 0.10, 0.45, 1.35);
    const o2 = o;
    d[o2] = clamp(r * sh, 0, 255); d[o2 + 1] = clamp(g * sh, 0, 255); d[o2 + 2] = clamp(b * sh, 0, 255); d[o2 + 3] = 255;
  }
  mmCtx.putImageData(img, 0, 0);
  mmCtx.strokeStyle = 'rgba(255,240,190,.95)'; mmCtx.lineWidth = 1.7;
  mmCtx.beginPath();
  for (let i = 0; i < PN; i += 2) { const X = PX[i], Z = PZ[i]; i ? mmCtx.lineTo(X, Z) : mmCtx.moveTo(X, Z); }
  mmCtx.closePath(); mmCtx.stroke();
  mmCtx.fillStyle = '#ff6f5e';
  mmCtx.beginPath(); mmCtx.arc(PX[STATION_I], PZ[STATION_I], 3.4, 0, 6.3); mmCtx.fill();
}
function drawMinimap() {

  const p = CARS[0].obj.position;

}

let lastT = performance.now(), fpsAcc = 0, fpsN = 0, statT = 0, totalDist = 0;
