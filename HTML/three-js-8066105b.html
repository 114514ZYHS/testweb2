<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   0. 基础工具
============================================================ */
const D2R = Math.PI/180;
const TIME = { value: 0 };                       // 全局时间 uniform
const R = (a,b)=>a+Math.random()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function seeded(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function noise2(x,y){ // 平滑值噪声
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const a=seeded(xi+yi*57), b=seeded(xi+1+yi*57), c=seeded(xi+(yi+1)*57), d=seeded(xi+1+(yi+1)*57);
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm(x,y,o=4){ let s=0,amp=.5,f=1; for(let i=0;i<o;i++){ s+=amp*noise2(x*f,y*f); amp*=.5; f*=2.03; } return s; }

/* ============================================================
   1. 程序化贴图工厂（Canvas 生成 PBR 贴图）
============================================================ */
function canv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c,{srgb=true,rep=[1,1],aniso=8}={}){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.repeat.set(rep[0],rep[1]); t.anisotropy=aniso;
  return t;
}
function speckle(x,w,h,n,cols,rMin=.4,rMax=1.6){
  for(let i=0;i<n;i++){ x.fillStyle=cols[RI(0,cols.length-1)];
    x.globalAlpha=R(.03,.12);
    const r=R(rMin,rMax); x.beginPath(); x.arc(R(0,w),R(0,h),r,0,7); x.fill(); }
  x.globalAlpha=1;
}
function blotches(x,w,h,n,col,aMin=.03,aMax=.1,sMin=20,sMax=90){
  for(let i=0;i<n;i++){ const r=R(sMin,sMax);
    const g=x.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=R(aMin,aMax); x.save(); x.translate(R(0,w),R(0,h));
    x.fillStyle=g; x.fillRect(-r,-r,r*2,r*2); x.restore(); }
  x.globalAlpha=1;
}
/* ---- 木材（梁、柱、家具） ---- */
function woodTex(base,dark,light,{plank=0,knots=4,vertical=true}={}){
  const c=canv(512,512),x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,512,512);
  for(let i=0;i<340;i++){ // 木纹丝缕
    const px=R(0,512), w=R(.6,2.6), up=Math.random()<.5;
    x.strokeStyle=up?light:dark; x.globalAlpha=R(.04,.14); x.lineWidth=w;
    x.beginPath(); let vx=px; x.moveTo(vertical?px:R(-20,60), vertical?-10:R(0,512));
    for(let s=0;s<=6;s++){ vx+=R(-3,3);
      if(vertical) x.lineTo(vx, s*86); else x.lineTo(s*86, clamp(vx,0,512)+R(0,512)*0+ (px+s*0)); }
    x.stroke();
  }
  for(let k=0;k<knots;k++){ // 木节
    const kx=R(40,470),ky=R(40,470);
    for(let r0=10;r0>1;r0-=2){ x.strokeStyle=dark; x.globalAlpha=.10;
      x.lineWidth=1.4; x.beginPath(); x.ellipse(kx,ky,r0*.55,r0,0,0,7); x.stroke(); } }
  x.globalAlpha=1;
  if(plank>0){ for(let p=0;p<512;p+=plank){
      x.fillStyle='rgba(20,12,6,.5)'; x.fillRect(0,p,512,2);
      x.fillStyle='rgba(255,240,220,.08)'; x.fillRect(0,p+2,512,1.5); } }
  return c;
}
/* ---- 屋面筒瓦 ---- */
function roofTileTex(){
  const c=canv(512,512),x=c.getContext('2d');
  x.fillStyle='#43474c'; x.fillRect(0,0,512,512);
  const tw=64, th=64;
  for(let row=0;row<8;row++){ const off=(row%2)*tw/2;
    for(let col=-1;col<9;col++){
      const cx=col*tw+off+tw/2, cy=row*th;
      const g=x.createLinearGradient(cx-tw/2,0,cx+tw/2,0);
      g.addColorStop(0,'#31353a'); g.addColorStop(.28,'#5c6167');
      g.addColorStop(.5,'#6d7278'); g.addColorStop(.72,'#585d63'); g.addColorStop(1,'#2e3236');
      x.fillStyle=g; x.fillRect(cx-tw/2,cy,tw,th);
      x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(cx-tw/2-2,cy,4,th); // 瓦垄沟
      x.fillStyle='rgba(255,255,255,.07)'; x.fillRect(cx-tw/2+3,cy,3,th);
      x.fillStyle='rgba(0,0,0,.34)'; x.fillRect(cx-tw/2,cy+th-7,tw,7); // 搭接阴影
      x.fillStyle='rgba(255,255,255,.09)'; x.fillRect(cx-tw/2,cy,tw,2);
    } }
  // 苔痕与风化
  for(let i=0;i<26;i++){ x.globalAlpha=R(.05,.16); x.fillStyle=Math.random()<.5?'#4a5a3c':'#5b6552';
    const r=R(6,26); x.beginPath(); x.arc(R(0,512),R(0,512),r,0,7); x.fill(); }
  x.globalAlpha=1; speckle(x,512,512,900,['#20242a','#787e84','#3a3f45']);
  return c;
}
/* ---- 粉墙（外墙 / 内墙） ---- */
function plasterTex(base='#e9e5da',grime=.5){
  const c=canv(512,512),x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,512,512);
  blotches(x,512,512,40,'#b9b2a0',.03,.08,30,120);
  blotches(x,512,512,26,'#8d867400',.0,.0); // noop 保持颗粒节奏
  blotches(x,512,512,30,'#7d7666',.02,.06,14,70);
  // 雨渍竖痕
  for(let i=0;i<30;i++){ const sx0=R(0,512), w=R(3,14);
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'rgba(120,112,96,0)'); g.addColorStop(1,'rgba(110,102,86,.16)');
    x.fillStyle=g; x.globalAlpha=R(.2,.6); x.fillRect(sx0,0,w,512); }
  x.globalAlpha=1;
  // 勒脚石渍
  const g2=x.createLinearGradient(0,512*(1-grime*.4),0,512);
  g2.addColorStop(0,'rgba(96,90,74,0)'); g2.addColorStop(1,'rgba(80,74,60,.5)');
  x.fillStyle=g2; x.fillRect(0,0,512,512);
  speckle(x,512,512,1600,['#c9c2b0','#9a927e','#eee9dd'],.3,1.2);
  return c;
}
/* ---- 金砖墁地（室内方砖） ---- */
function brickFloorTex(){
  const c=canv(1024,1024),x=c.getContext('2d'), t=256;
  x.fillStyle='#33363a'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const px=i*t, py=j*t, v=R(-8,8);
    x.fillStyle=`rgb(${62+v},${66+v},${70+v})`; x.fillRect(px+3,py+3,t-6,t-6);
    x.fillStyle='rgba(255,255,255,.05)'; x.fillRect(px+3,py+3,t-6,4);
    x.fillStyle='rgba(0,0,0,.22)'; x.fillRect(px+3,py+t-7,t-6,4);
    x.fillStyle='rgba(0,0,0,.75)'; x.fillRect(px,py,t,3); x.fillRect(px,py,3,t);
    blotches(x,1024,1024,0,'#000');
    if(Math.random()<.4){ x.strokeStyle='rgba(20,22,24,.5)'; x.lineWidth=1.2;
      x.beginPath(); let cx0=px+R(30,220),cy0=py+8; x.moveTo(cx0,cy0);
      for(let s=0;s<4;s++){cx0+=R(-24,24);cy0+=R(30,60);x.lineTo(cx0,cy0);} x.stroke(); }
  }
  blotches(x,1024,1024,30,'#1f3328',.03,.09,40,140); // 潮痕
  speckle(x,1024,1024,2600,['#22252a','#7e858c','#4b5055'],.3,1.3);
  return c;
}
/* ---- 石板（铺路、阶沿） ---- */
function slabTex(){
  const c=canv(1024,1024),x=c.getContext('2d');
  x.fillStyle='#4c5054'; x.fillRect(0,0,1024,1024);
  const cols=5, rows=4, cw=1024/cols, ch=1024/rows;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const v=R(-10,12), px=i*cw+R(-8,8), py=j*ch+R(-8,8), w=cw+R(-14,6), h=ch+R(-14,6);
    x.fillStyle=`rgb(${104+v},${108+v},${110+v})`;
    x.beginPath();
    x.moveTo(px+R(-6,6),py+R(-6,6)); x.lineTo(px+w+R(-6,6),py+R(-6,6));
    x.lineTo(px+w+R(-6,6),py+h+R(-6,6)); x.lineTo(px+R(-6,6),py+h+R(-6,6));
    x.closePath(); x.fill();
    x.strokeStyle='rgba(24,26,28,.8)'; x.lineWidth=5; x.stroke();
    x.strokeStyle='rgba(255,255,255,.06)'; x.lineWidth=1.6;
    x.strokeRect(px+5,py+5,w-10,h-10);
  }
  // 苔侵缝隙
  for(let i=0;i<60;i++){ x.globalAlpha=R(.08,.25); x.fillStyle=Math.random()<.6?'#46543a':'#5c6a48';
    x.save(); x.translate(R(0,1024),R(0,1024)); x.rotate(R(0,3));
    x.fillRect(0,0,R(8,40),R(2,5)); x.restore(); }
  x.globalAlpha=1; speckle(x,1024,1024,2400,['#3c4044','#82888c','#5a5e62'],.3,1.4);
  return c;
}
/* ---- 湖石 ---- */
function rockTex(){
  const c=canv(512,512),x=c.getContext('2d');
  x.fillStyle='#5a5e61'; x.fillRect(0,0,512,512);
  blotches(x,512,512,50,'#3c4043',.05,.14,20,90);
  blotches(x,512,512,40,'#82867f',.04,.1,14,70);
  blotches(x,512,512,24,'#47523f',.04,.12,12,46); // 湿苔
  for(let i=0;i<24;i++){ x.strokeStyle='rgba(30,32,34,.5)'; x.lineWidth=R(1,2.6);
    x.beginPath(); let px=R(0,512),py=R(0,512); x.moveTo(px,py);
    for(let s=0;s<5;s++){px+=R(-30,30);py+=R(10,46);x.lineTo(px,py);} x.stroke(); }
  speckle(x,512,512,2200,['#2e3234','#767a7d','#4d5247'],.4,1.6);
  return c;
}
/* ---- 地面（苔草泥土） ---- */
function groundTex(){
  const c=canv(1024,1024),x=c.getContext('2d');
  x.fillStyle='#54583f'; x.fillRect(0,0,1024,1024);
  blotches(x,1024,1024,60,'#424a34',.06,.16,60,200);
  blotches(x,1024,1024,54,'#6b6a50',.05,.12,50,170);
  blotches(x,1024,1024,40,'#3a4030',.05,.13,40,140);  // 湿处
  blotches(x,1024,1024,30,'#5e6c44',.04,.1,30,110);   // 草色
  for(let i=0;i<5200;i++){ // 细草点
    x.globalAlpha=R(.05,.2);
    x.fillStyle=['#5f7046','#4c5a38','#77835a'][RI(0,2)];
    x.fillRect(R(0,1024),R(0,1024),R(1,2.4),R(2,5));
  }
  x.globalAlpha=1; speckle(x,1024,1024,1500,['#3a3d2c','#767a5e','#2f3226'],.4,1.6);
  return c;
}
/* ---- 树皮 ---- */
function barkTex(){
  const c=canv(256,512),x=c.getContext('2d');
  x.fillStyle='#4a3b2e'; x.fillRect(0,0,256,512);
  for(let i=0;i<60;i++){ const px=R(0,256);
    x.strokeStyle=Math.random()<.5?'#2e241b':'#5d4c3b';
    x.globalAlpha=R(.15,.4); x.lineWidth=R(2,6);
    x.beginPath(); x.moveTo(px,-8);
    let vx=px; for(let s=0;s<8;s++){vx+=R(-6,6);x.lineTo(vx,s*70);} x.stroke(); }
  x.globalAlpha=1; speckle(x,256,512,700,['#241b12','#6b5942'],.3,1.4);
  return c;
}
/* ---- 叶片 ---- */
function leafShape(x,len,wid,col1,col2,vein=true){
  const g=x.createLinearGradient(0,0,len,0);
  g.addColorStop(0,col2); g.addColorStop(.5,col1); g.addColorStop(1,col2);
  x.fillStyle=g; x.beginPath();
  x.moveTo(0,0);
  x.quadraticCurveTo(len*.35,-wid,len*.82,-wid*.42);
  x.quadraticCurveTo(len,-2,0,0);
  x.quadraticCurveTo(len,-2,len*.82,wid*.42);
  x.quadraticCurveTo(len*.35,wid,0,0);
  x.fill();
  if(vein){ x.strokeStyle='rgba(20,40,18,.5)'; x.lineWidth=Math.max(1,len*.012);
    x.beginPath(); x.moveTo(2,0); x.quadraticCurveTo(len*.5,wid*.06,len-4,0); x.stroke(); }
}
function bambooLeafTex(){
  const c=canv(256,256),x=c.getContext('2d');
  x.clearRect(0,0,256,256);
  x.save(); x.translate(10,50); x.rotate(.5); leafShape(x,210,15,'#4d7240','#33502c'); x.restore();
  x.save(); x.translate(12,120); x.rotate(-.15); leafShape(x,190,13,'#557a44','#3a5a30'); x.restore();
  x.save(); x.translate(20,180); x.rotate(-.85); leafShape(x,160,12,'#456b39','#2e4a27'); x.restore();
  return c;

/* 植物风摇 —— 注入顶点扰动 */
const WINDY = [];
function windify(mat,amp=.03,hf=.5){
  mat.onBeforeCompile = sh=>{
    sh.uniforms.uTime = TIME;
    sh.uniforms.uAmp = { value: amp };
    sh.uniforms.uHf  = { value: hf };
    sh.vertexShader = 'uniform float uTime;uniform float uAmp:uniform float uHf;\n'
      .replace('uniform float uAmp:','uniform float uAmp;') + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>',`
      #include <begin_vertex>
      {
        #ifdef USE_INSTANCING
          vec3 ipos = vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);
        #else
          vec3 ipos = vec3(0.0);
        #endif
        float ph = uTime*1.15 + ipos.x*1.7 + ipos.z*2.3;
        float f  = clamp(transformed.y*uHf, 0.0, 1.0);
        transformed.x += ( sin(ph)*.6 + sin(ph*2.3+1.3)*.4 ) * uAmp * f;
        transformed.z += ( cos(ph*.8)*.6 + cos(ph*1.9+.7)*.4 ) * uAmp * .7 * f;
      }`);
  };
  WINDY.push(mat); return mat;
}

============================================================ */
const SKYU={
  topColor:{value:new THREE.Color(0x9fb4bd)},
  horColor:{value:new THREE.Color(0xcfd8d6)},
  moonDir:{value:new THREE.Vector3(-.45,.4,-.6).normalize()},
  night:{value:0},
};
const sky=new THREE.Mesh(
  new THREE.SphereGeometry(180,32,20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    uniforms:SKYU,
    vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`
      uniform vec3 topColor,horColor,moonDir; uniform float night;
      varying vec3 vDir;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        float h=clamp(vDir.y*1.4+.12,0.,1.);
        vec3 col=mix(horColor,topColor,pow(h,.75));
        // 月
        float mdot=dot(normalize(vDir),normalize(moonDir));
        float moon=smoothstep(.9994,.9998,mdot);
        float halo=pow(clamp(mdot,0.,1.),220.)*.5*night;
        col+=vec3(.95,.94,.86)*moon*night*2.4+vec3(.5,.6,.8)*halo;
        // 星
        if(night>.02 && vDir.y>.02){
          vec2 sp=floor(vDir.xz/max(.001,(1.-vDir.y))*46.);
          float st=step(.992,hash(sp))*night;
          col+=vec3(st)* (.5+.5*sin(hash(sp+7.)*90.));
        }
        gl_FragColor=vec4(col,1.);
      }`
  }));
scene.add(sky);

const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),
      _v=new THREE.Vector3(),_sv=new THREE.Vector3();
function placeIM(im,i,x,y,z,ry=0,s=1,sy=null,sz=null,rx=0,rz=0){
  _e.set(rx,ry,rz); _q.setFromEuler(_e);
  _v.set(x,y,z); _sv.set(s,sy??s,sz??s);
  _m4.compose(_v,_q,_sv); im.setMatrixAt(i,_m4);
}
function IM(geo,mat,count,shadow=true){
  const im=new THREE.InstancedMesh(geo,mat,count);
  im.castShadow=shadow; im.receiveShadow=true; scene.add(im); return im;
}
function mesh(geo,mat,x=0,y=0,z=0,{rx=0,ry=0,rz=0,s=1,sy=null,sz=null,cast=true,recv=true}={}){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.scale.set(s,sy??s,sz??s);
  m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m;
}
// 合并组 → 少量 drawcall
function bake(root,{cast=true,recv=true,parent=scene}={}){
  root.updateMatrixWorld(true);
  const byMat=new Map();
  root.traverse(o=>{ if(o.isMesh){
    const g=o.geometry.index?o.geometry.clone().toNonIndexed():o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    const key=o.material.uuid;
    if(!byMat.has(key))byMat.set(key,{mat:o.material,geos:[]});
    byMat.get(key).geos.push(g);
  }});
  const out=new THREE.Group();
  for(const {mat,geos} of byMat.values()){
    const g=BGU.mergeGeometries(geos,false);
    const m=new THREE.Mesh(g,mat); m.castShadow=cast; m.receiveShadow=recv; out.add(m);
  }
  parent.add(out); return out;
}
/* ---- 碰撞 ---- */
const COL_BOX=[],COL_CIR=[];
const colBox=(cx,cz,w,d)=>COL_BOX.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2});
const colRect=(x0,z0,x1,z1)=>COL_BOX.push({x0,z1,x1,z0});
const colCir=(x,z,r)=>COL_CIR.push({x,z,r});
function hitWorld(x,z,r=.26){
  for(const b of COL_BOX) if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r) return true;
  for(const c of COL_CIR){ const dx=x-c.x,dz=z-c.z; if(dx*dx+dz*dz<(c.r+r)*(c.r+r)) return true; }
  return false;
}
/* ---- 可行走高度 ---- */
const HALL={cx:1.5,cz:-16.5,hw:5.9,hd:3.6,top:.42};
const STEPZ={z1:-12.55,z0:-11.75};   // 前檐踏步
const PAV={cx:-15,cz:8,hw:1.9,hd:1.9,top:.38};
const BRIDGE=[new THREE.Vector2(-11.5,5.9),new THREE.Vector2(-10.7,3.2),new THREE.Vector2(-11.35,.5)];
function distSeg(px,pz,a,b){
  const dx=b.x-a.x,dz=b.y-a.y,L2=dx*dx+dz*dz;
  let t=L2?((px-a.x)*dx+(pz-a.y)*dz)/L2:0; t=clamp(t,0,1);
  const cx=a.x+dx*t,cz=a.y+dz*t; return Math.hypot(px-cx,pz-cz);
}
function bridgeDist(x,z){ return Math.min(distSeg(x,z,BRIDGE[0],BRIDGE[1]),distSeg(x,z,BRIDGE[1],BRIDGE[2])); }
function getH(x,z){
  let h=0;
  // 厅台基
  if(x>HALL.cx-HALL.hw&&x<HALL.cx+HALL.hw&&z>HALL.cz-HALL.hd&&z<HALL.cz+HALL.hd){
    h=HALL.top;
  } else if(x>HALL.cx-1.4&&x<HALL.cx+1.4&&z>=STEPZ.z1&&z<STEPZ.z0+.6){
    const t=smooth(STEPZ.z1,STEPZ.z0+.6,z); h=HALL.top*(1-t);
  }
  // 亭
  if(x>PAV.cx-PAV.hw&&x<PAV.cx+PAV.hw&&z>PAV.cz-PAV.hd&&z<PAV.cz+PAV.hd) h=Math.max(h,PAV.top);
  else if(x>PAV.cx+PAV.hw&&x<PAV.cx+PAV.hw+.7&&z>PAV.cz-1&&z<PAV.cz+1)
    h=Math.max(h,PAV.top*(1-smooth(PAV.cx+PAV.hw,PAV.cx+PAV.hw+.7,x)));
  // 桥
  const bd=bridgeDist(x,z);
  if(bd<.85) h=Math.max(h,.42+.06*Math.cos(bd/.85*Math.PI/2));
  return h;
}

function rockGeo(seed=1,rough=.5,detail=2,flatY=.8){
  const g=new THREE.IcosahedronGeometry(1,detail);
  const p=g.attributes.position;
  const col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    _v.fromBufferAttribute(p,i).normalize();
    const n=fbm(_v.x*2.2+seed*13.7,_v.y*2.4+_v.z*2.0+seed*7.1,4);
    const d=1+(n-.5)*2*rough;
    p.setXYZ(i,_v.x*d,_v.y*d*flatY,_v.z*d);
    const shade=clamp(.55+(n-.5)*1.5,.25,1);
    col[i*3]=shade;col[i*3+1]=shade;col[i*3+2]=shade;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals(); return g;
}

============================================================ */
function layPath(pts,w=1.2){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const len=curve.getLength(), n=Math.ceil(len/(w*.55));
  const g=new THREE.BoxGeometry(1,.07,1);
  const im=IM(g,MAT.slab,n*2);
  let idx=0;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const p=curve.getPointAt(t), tan=curve.getTangentAt(t);
    const ang=Math.atan2(tan.z,tan.x);
    const lanes=Math.random()<.25?1:2;
    for(let l=0;l<lanes;l++){
      const off=lanes===1?0:(l?-.3:.3)*w;
      const nx=-tan.z, nz=tan.x;
      placeIM(im,idx++,p.x+nx*off,.032-(idx%3)*.004,p.z+nz*off,
        -ang+R(-.16,.16),R(.42,.62),1,R(.4,.6));
    }
    if(Math.random()<.3){ const nx=-tan.z,nz=tan.x; // 路缘草隙
      placeIM(im,idx<n*2?idx:idx,0,-1,0,0,.0001); }
  }
  im.count=idx; im.instanceMatrix.needsUpdate=true;
}

    c.position.set(px,py+h/2,pz); c.rotation.z=lean; c.castShadow=c.receiveShadow=true; g.add(c);

    const start=new THREE.Vector3(x+topx,R(2.6,3.6)*s,z);
    const end=new THREE.Vector3(x+topx+Math.cos(a)*len*s*.6,R(.3,1.1),z+Math.sin(a)*len*s*.6);
    const mid=new THREE.Vector3(x+topx+Math.cos(a)*len*.55,R(2.2,2.8)*s,z+Math.sin(a)*len*.55);

    tube.castShadow=false; tube.receiveShadow=true; scene.add(tube);
    const leavesOn=RI(10,16);
    for(let l=0;l<leavesOn;l++){
      const t=R(.15,1), p=curve.getPointAt(t);

function plum(x,z,s=1.2){
  const buds=[];
  function branch(px,py,pz,dir,l,w,depth){
    const end=new THREE.Vector3(px,py,pz).addScaledVector(dir,l);
    const g=new THREE.CylinderGeometry(w*.6,w,l,5);
    const b=new THREE.Mesh(g,MAT.woodDark);
    b.position.set((px+end.x)/2,(py+end.y)/2,(pz+end.z)/2);
    b.lookAt(end.x,end.y,end.z); b.rotateX(Math.PI/2);
    b.castShadow=true; scene.add(b);
    if(depth>=3){ buds.push(end); return; }
    const n=depth===0?3:2;
    for(let i=0;i<n;i++){
      const nd=dir.clone()
        .addScaledVector(new THREE.Vector3(R(-1,1),R(.1,.9),R(-1,1)),R(.5,.9)).normalize();
      branch(end.x,end.y,end.z,nd,l*R(.6,.8),w*.62,depth+1);
    }
  }
  branch(x,.0+.4,z,new THREE.Vector3(R(-.3,.3),1,R(-.3,.3)).normalize(),1.1*s,.09,0);
  // 花与蕾
  const petal=new THREE.SphereGeometry(.028,6,5);
  const pm=new THREE.InstancedMesh(petal,new THREE.MeshStandardMaterial({color:0xe8b7bd,roughness:.6}),320);
  pm.receiveShadow=true; scene.add(pm);
  let pi=0; const cc=new THREE.Color();
  for(const b of buds){
    const n=RI(2,5);
    for(let i=0;i<n;i++){
      placeIM(pm,pi++,b.x+R(-.12,.12),b.y+R(-.12,.12),b.z+R(-.12,.12),0,R(.7,1.2));
      cc.setHSL(.97+R(-.02,.02),R(.3,.5),R(.72,.85)); pm.setColorAt(pi-1,cc);
    }
  }
  pm.count=pi; pm.instanceMatrix.needsUpdate=true;
  if(pm.instanceColor) pm.instanceColor.needsUpdate=true;
  colCir(x,z,.28);
}

function latticeRect(cx,cy,cz,w,h,{cell=.17,ry=0,bar=.02,frame=.055,paper=true,inset=false}={}){
  const cos=Math.cos(ry),sin=Math.sin(ry);
  const put=(arr,lx,ly,lz,sx,sy,sz)=>{
    arr.push({x:cx+lx*cos+lz*sin, y:cy+ly, z:cz-lx*sin+lz*cos, sx,sy,sz, ry});
  };
  put(LW.lacq,0, h/2-frame/2,0,w,frame,frame);
  put(LW.lacq,0,-h/2+frame/2,0,w,frame,frame);
  put(LW.lacq,-w/2+frame/2,0,0,frame,h,frame);
  put(LW.lacq, w/2-frame/2,0,0,frame,h,frame);
  const iw=w-frame*2, ih=h-frame*2;
  const nx=Math.max(2,Math.round(iw/cell)), ny=Math.max(2,Math.round(ih/(cell*1.12)));
  for(let i=1;i<nx;i++) put(LW.lacq,-iw/2+iw*i/nx,0,0,bar,ih,bar);
  for(let j=1;j<ny;j++) put(LW.lacq,0,-ih/2+ih*j/ny,0,iw,bar,bar);
  if(inset){ const o=.045; // 步步锦退棂
    for(let i=1;i<nx;i++) put(LW.lacq,-iw/2+iw*i/nx+o/2,o/2,0,bar*.75,ih-o,bar*.75);
    for(let j=1;j<ny;j++) put(LW.lacq,0,-ih/2+ih*j/ny+o/2,0,iw-o,bar*.75,bar*.75);
  }
  if(paper) put(LW.paper,0,0,(ry===0?.012:.012),w*1.001,h*1.001,.012);
}
function collapseBars(arr,mat,{cast=true,recv=true}={}){
  if(!arr.length) return null;
  const geos=arr.map(b=>{
    const g=new THREE.BoxGeometry(b.sx,b.sy,b.sz);
    const e=new THREE.Euler(0,b.ry||0,0), q=new THREE.Quaternion().setFromEuler(e);
    const m=new THREE.Matrix4().compose(new THREE.Vector3(b.x,b.y,b.z),q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(m); return g;
  });
  const merged=BGU.mergeGeometries(geos,false);
  geos.forEach(g=>g.dispose());
  const m=new THREE.Mesh(merged,mat); m.castShadow=cast; m.receiveShadow=recv;
  return m;
}

function roofY(zPlan,xAbs){ // |zPlan|:0..3.62
  const s=roofStations;

  if(z<=s[1][0]) y=lerp(s[0][1],s[1][1],z/s[1][0]);

  return y+roofLift(xAbs)*smooth(2.3,3.62,z);
}

/* 落地长窗一扇：格心 + 绦环板 + 裙板（tgt: 收集器；坐标即世界坐标） */
function shutter(tgt,cx,cz,w,{ry=0,cell=.15,h=2.82}={}){
  const cos=Math.cos(ry),sin=Math.sin(ry);
  const put=(arr,lx,ly,lz,sx,sy,sz)=>{
    tgt[arr].push({x:cx+lx*cos+lz*sin, y:ly, z:cz-lx*sin+lz*cos, sx,sy,sz, ry});
  };
  const F=.065; // 边梃/抹头宽
  put('lacq',-w/2+F/2,FY+h/2,0,F,h,.09);
  put('lacq', w/2-F/2,FY+h/2,0,F,h,.09);
  put('lacq',0,FY+.05,0,w,.1,.09);
  put('lacq',0,FY+.7,0,w,F,.09);        // 裙板上抹头
  put('lacq',0,FY+.97,0,w,F,.09);       // 绦环上抹头
  put('lacq',0,FY+h-.045,0,w,.09,.09);
  put('plank',0,FY+.38,0,w-F*2+.02,.57,.045);
  put('plank',0,FY+.835,0,w-F*2+.02,.2,.045);
  // 格心
  const gh=h-1.05-.09, gy=FY+1.015+gh/2;
  const iw=w-F*2, ih=gh-.06;
  put('lacq',0,gy+ih/2+.015,0,iw,.03,.06);
  put('lacq',0,gy-ih/2-.015,0,iw,.03,.06);
  const nx=Math.max(2,Math.round(iw/cell)), ny=Math.max(2,Math.round(ih/(cell*1.1)));
  for(let i=0;i<=nx;i++) put('lacq',-iw/2+iw*i/nx,gy,0,.02,ih,.02);
  for(let j=0;j<=ny;j++) put('lacq',0,gy-ih/2+ih*j/ny,0,iw,.02,.02);
  // 步步锦退棂
  for(let i=1;i<nx;i++) put('lacq',-iw/2+iw*i/nx+.022,gy+.022,0,.014,ih-.04,.014);
  for(let j=1;j<ny;j++) put('lacq',0,gy-ih/2+ih*j/ny+.022,0,iw-.04,.014,.014);
  put('paper',0,gy,(ry===0?-.014:-.014),w-.06,gh,.012);
}

    part(pg,w,.07,.04,0,h-.05,0,M);

let AC=null,rainGain=null,audioOn=false;
function toggleAudio(on){
  audioOn=on;
  if(on&&!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=2*AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);
    let b0=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; b0=.98*b0+.02*w; d[i]=(b0*2.2+w*.22)*.4; }
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400; lp.Q.value=.4;
    const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=240;
    rainGain=AC.createGain(); rainGain.gain.value=0;
    src.connect(lp); lp.connect(hp); hp.connect(rainGain); rainGain.connect(AC.destination);
    src.start();
  }
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  rainGain.gain.cancelScheduledValues(AC.currentTime);
  rainGain.gain.linearRampToValueAtTime(on?.06:0,AC.currentTime+1.4);
}
let plopT=0;
function plop(){
  if(!AC||!audioOn) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(R(420,920),t0);
  o.frequency.exponentialRampToValueAtTime(R(90,150),t0+.13);
  g.gain.setValueAtTime(R(.006,.016),t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.16);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+.18);
}

    const px=k.cx+Math.cos(a)*k.r, pz=k.cz+Math.sin(a)*k.r*.62;
    const dx=-Math.sin(a)*k.r, dz=Math.cos(a)*k.r*.62;
    k.g.position.set(px,-.26+Math.sin(T*.7+k.ph)*.03,pz);
    k.g.rotation.y=Math.atan2(-dz,dx);
    k.t.rotation.y=Math.PI/2+Math.sin(T*5+k.ph)*.45;
  }
  // 灯笼轻摆
  for(const l of LANTERNS){
    if(!l.amp) continue;
    l.g.rotation.z=Math.sin(T*.72+l.ph)*l.amp;
    l.g.rotation.x=Math.cos(T*.6+l.ph)*l.amp*.6;
  }
  // 烛火
  for(const f of FLAMES){
    f.m.quaternion.copy(camera.quaternion);
    const w=1+Math.sin(T*11+f.ph)*.1+Math.sin(T*23+f.ph*2)*.05;
    f.m.scale.set(w,w*1.15,1);
    f.m.material.opacity=lampF*(.8+.2*Math.sin(T*17+f.ph));
  }
  // 光斑摇曳
  if(window._pools) for(const p of window._pools)
    p.material.opacity=p.userData.o*lampF*(0.92+0.08*Math.sin(T*3.1+p.position.x));
  // 水面波痕
  if(water.material.bumpMap){
    water.material.bumpMap.offset.x+=dt*.012;
    water.material.bumpMap.offset.y+=dt*.008;
  }
  // 云
  for(const c of clouds){
    c.position.x+=dt*.35;
    if(c.position.x>130) c.position.x=-130;
    c.material.opacity=c.material.userData?.b??c.material.opacity;
  }
  // 相机
  if(fp.on){
    fpMove(dt);
    camera.position.set(fp.x,getH(fp.x,fp.z)+1.62,fp.z);
    camera.rotation.set(fp.pitch,fp.yaw,0);
    dial.style.transform=`rotate(${fp.yaw}rad)`;
  }else{
    controls.update();
    controls.target.x=clamp(controls.target.x,-16,16);
    controls.target.z=clamp(controls.target.z,-18,14);
    controls.target.y=clamp(controls.target.y,.4,7);
    const dx=controls.target.x-camera.position.x, dz=controls.target.z-camera.position.z;
    const h=Math.hypot(dx,dz)>1e-4? Math.atan2(dx/Math.hypot(dx,dz),-dz/Math.hypot(dx,dz)):0;
    dial.style.transform=`rotate(${-h}rad)`;
  }
  sky.position.copy(camera.position);
  composer.render();
  if(++frames===3){
    document.getElementById('loader').classList.add('hide');
    for(const id of ['brand','dock','hint','compass'])
      document.getElementById(id).classList.add('show');
  }
}
tick();
</script>
