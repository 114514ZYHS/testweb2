<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
  :root{
    --cyan:#37e6ff; --amber:#ffb347; --red:#ff4d6a;
    --panel:rgba(8,16,24,.72); --line:rgba(55,230,255,.28);

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04070c;

  #loader .s{font-size:12px;letter-spacing:.2em;color:#5b7f8c}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:10;pointer-events:none;user-select:none}
  #title{top:22px;left:26px}
  #title h1{font-family:'Orbitron';font-weight:900;font-size:26px;letter-spacing:.12em;

  #title .sub{font-size:12px;letter-spacing:.42em;color:#6fa3b4;margin-top:4px}
  #title .bar{width:230px;height:2px;margin-top:10px;

  #telemetry{top:22px;right:26px;width:238px;background:var(--panel);

  #telemetry .row{display:flex;justify-content:space-between;font-size:13px;
    letter-spacing:.08em;padding:3px 0;border-bottom:1px dashed rgba(55,230,255,.12)}
  #telemetry .row:last-child{border-bottom:none}
  #telemetry .k{color:#6fa3b4}
  #telemetry .v{font-family:'Orbitron';font-size:12px;color:var(--cyan)}
  #telemetry .v.amber{color:var(--amber)}
  #telemetry .head{font-family:'Orbitron';font-size:11px;letter-spacing:.3em;
    color:#8fd8ea;margin-bottom:6px}

  #views{top:272px;right:26px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
  #views button{font-family:'Orbitron';font-size:10px;letter-spacing:.18em;color:#8fd8ea;
    background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:7px 10px;cursor:pointer;text-align:left;transition:.18s;backdrop-filter:blur(6px)}
  #views button:hover{background:rgba(55,230,255,.18);color:#fff}

  #panel{bottom:22px;left:50%;transform:translateX(-50%);pointer-events:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;

  #panel button{font-family:'Orbitron';font-size:11px;letter-spacing:.14em;color:#bfeaf5;
    background:rgba(55,230,255,.07);border:1px solid rgba(55,230,255,.35);

  #panel button:hover{background:rgba(55,230,255,.2);color:#fff;box-shadow:0 0 14px rgba(55,230,255,.35)}

  .c1{top:12px;left:12px;border-right:none;border-bottom:none}
  .c2{top:12px;right:12px;border-left:none;border-bottom:none}
  .c3{bottom:12px;left:12px;border-right:none;border-top:none}
  .c4{bottom:12px;right:12px;border-left:none;border-top:none}

<script type="module">
import * as THREE from 'three';
import { OrbitControls }      from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }     from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }         from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }    from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }         from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment }    from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries }    from 'three/addons/utils/BufferGeometryUtils.js';

/* ================================================================
   0. 渲染器 / 场景 / 相机 / 灯光 / 环境
================================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a10, 0.011);
{ // 渐变天幕
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#0a1420'); gr.addColorStop(.55,'#060b12'); gr.addColorStop(1,'#02040a');
  g.fillStyle = gr; g.fillRect(0,0,2,512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 400);
const CAM_HOME = new THREE.Vector3(13.6, 6.6, 15.4);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 3.5; controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * .495;
controls.autoRotate = true; controls.autoRotateSpeed = .5;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

// 三点式影视灯光
const key = new THREE.DirectionalLight(0xcfeaff, 3.2);
key.position.set(10, 15, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -13; key.shadow.camera.right = 13;
key.shadow.camera.top = 13;   key.shadow.camera.bottom = -13;
key.shadow.camera.far = 60;   key.shadow.bias = -0.0004;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x2a5f8f, 0.9).translateX(-12).translateY(7));
const rim = new THREE.DirectionalLight(0x37e6ff, 2.4); rim.position.set(-7, 5, -11); scene.add(rim);
const rimWarm = new THREE.DirectionalLight(0xff8a3c, 0.9); rimWarm.position.set(4, 2, -12); scene.add(rimWarm);
const under = new THREE.PointLight(0x1a9fd6, 3, 10, 2); under.position.set(0, .4, 0); scene.add(under);
scene.add(new THREE.AmbientLight(0x14232e, 1.2));

/* ================================================================
   1. 工具：RNG / 程序化贴图
================================================================ */
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(20260901);

function noise2(x,y,s){ const n = Math.sin(x*12.9898 + y*78.233 + s*37.71) * 43758.5453; return n - Math.floor(n); }
function fbm(x,y,s){ let v=0,a=.5,f=1; for(let i=0;i<4;i++){ v+=a*noise2(x*f,y*f,s+i*7); a*=.5; f*=2; } return v; }

function makeHullMaps(size=1024){
  // albedo：装甲面板分块 + 污渍 + 掉漆
  const ca = document.createElement('canvas'); ca.width=ca.height=size;
  const g = ca.getContext('2d');
  g.fillStyle = '#59646b'; g.fillRect(0,0,size,size);
  for(let i=0;i<30;i++){
    const w = size*(.1+rnd()*.28), h = size*(.1+rnd()*.28);
    const x = rnd()*(size-w), y = rnd()*(size-h);
    const v = 84 + rnd()*34;
    g.fillStyle = `rgb(${v*.88|0},${v|0},${v*.94|0})`;
    g.fillRect(x,y,w,h);
    g.strokeStyle = 'rgba(8,11,13,.9)'; g.lineWidth = 3; g.strokeRect(x,y,w,h);
    g.strokeStyle = 'rgba(170,190,200,.14)'; g.lineWidth = 1; g.strokeRect(x+3,y+3,w-6,h-6);
  }
  for(let i=0;i<6;i++){ // 警示条（小尺寸，避免大面积色块）
    const x=rnd()*size, y=rnd()*size, w=36+rnd()*64, h=7+rnd()*6;
    for(let k=0;k<w;k+=18){ g.fillStyle = (k/18)%2? '#c9a13b':'#1d2124'; g.fillRect(x+k,y,18,h); }
    g.strokeStyle='rgba(0,0,0,.65)'; g.lineWidth=2; g.strokeRect(x,y,w,h);
  }
  for(let i=0;i<7;i++){ // 编号
    g.save(); g.translate(rnd()*size, rnd()*size); g.rotate(rnd()<.5?0:Math.PI/2);
    g.fillStyle='rgba(205,228,238,.55)'; g.font='bold 42px Orbitron, monospace';
    g.fillText(['RX-99','Δ-07','MK.IV','⚡RAIL','RB-42','07-X','HV-2'][i%7], 0, 0); g.restore();
  }
  for(let i=0;i<520;i++){ // 污渍 / 掉漆点
    const x=rnd()*size,y=rnd()*size,r=3+rnd()*42;
    g.fillStyle=`rgba(${rnd()<.5?16:128},${18+rnd()*28|0},${10+rnd()*18|0},${.03+rnd()*.07})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const albedo = new THREE.CanvasTexture(ca);
  albedo.colorSpace = THREE.SRGBColorSpace; albedo.wrapS = albedo.wrapT = THREE.RepeatWrapping;

  // roughness：划痕 + 油渍
  const cr = document.createElement('canvas'); cr.width=cr.height=size;
  const r2 = cr.getContext('2d');
  r2.fillStyle = '#8c8c8c'; r2.fillRect(0,0,size,size);
  for(let i=0;i<300;i++){
    const x=rnd()*size,y=rnd()*size,a=rnd()*7,l=18+rnd()*170;
    r2.strokeStyle=`rgba(${205+rnd()*50|0},${205+rnd()*50|0},${205+rnd()*50|0},.22)`;
    r2.lineWidth=.5+rnd()*1.5;
    r2.beginPath(); r2.moveTo(x,y); r2.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); r2.stroke();
  }
  for(let i=0;i<140;i++){
    const x=rnd()*size,y=rnd()*size,r=5+rnd()*46;
    r2.fillStyle=`rgba(${195+rnd()*55|0},${195+rnd()*55|0},${195+rnd()*55|0},.15)`;
    r2.beginPath(); r2.arc(x,y,r,0,7); r2.fill();
  }
  const rough = new THREE.CanvasTexture(cr);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;

  // normal：高度场 sobel
  const cn = document.createElement('canvas'); cn.width=cn.height=size;
  const n2 = cn.getContext('2d');
  const img = n2.createImageData(size,size);
  const H = (x,y)=> fbm(x/size*9, y/size*9, 3)*.6 + (Math.sin(x/size*40)*Math.sin(y/size*40)>0.985? .5:0);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx = H((x+1)%size,y)-H((x-1+size)%size,y);
    const dy = H(x,(y+1)%size)-H(x,(y-1+size)%size);
    const i=(y*size+x)*4;
    img.data[i]=128-dx*255; img.data[i+1]=128-dy*255; img.data[i+2]=255; img.data[i+3]=255;
  }
  n2.putImageData(img,0,0);
  const normal = new THREE.CanvasTexture(cn);
  normal.wrapS = normal.wrapT = THREE.RepeatWrapping;
  return { albedo, rough, normal };
}
const HULL_MAPS = makeHullMaps();

function makeInsigniaTex(){
  const c = document.createElement('canvas'); c.width=512; c.height=256;
  const g = c.getContext('2d');
  g.clearRect(0,0,512,256);
  // 獠牙徽标
  g.strokeStyle='rgba(220,245,255,.85)'; g.lineWidth=7;
  g.beginPath(); g.moveTo(70,60); g.lineTo(150,130); g.lineTo(70,200); g.stroke();
  g.beginPath(); g.moveTo(110,60); g.lineTo(190,130); g.lineTo(110,200); g.stroke();
  g.fillStyle='rgba(55,230,255,.9)'; g.beginPath(); g.arc(215,130,14,0,7); g.fill();
  g.font='bold 64px Orbitron, monospace'; g.fillStyle='rgba(225,248,255,.9)';
  g.fillText('RB-42', 260, 110);
  g.font='bold 30px Rajdhani, sans-serif'; g.fillStyle='rgba(255,179,71,.9)';
  g.fillText('第七机甲 · VII ARMOR', 260, 165);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeHazardTex(){
  const c = document.createElement('canvas'); c.width=128; c.height=32;
  const g = c.getContext('2d');
  g.fillStyle='#20241f'; g.fillRect(0,0,128,32);
  g.fillStyle='#c9a13b';
  for(let i=-2;i<10;i++){ g.beginPath();
    g.moveTo(i*26,0); g.lineTo(i*26+13,0); g.lineTo(i*26+13+16,32); g.lineTo(i*26+16,32); g.closePath(); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

/* ================================================================
   2. 材质库
================================================================ */
const EMAT = []; // 脉冲发光材质注册表
function glowMat(hex, base=3.2){
  base *= .42; // 统一压光，避免泛光吞掉硬表面细节
  const m = new THREE.MeshStandardMaterial({ color:0x050a0d, emissive:hex, emissiveIntensity:base, roughness:.4 });
  EMAT.push({ m, base, phase: rnd()*7 }); return m;
}
const M = {
  hull: new THREE.MeshStandardMaterial({ map:HULL_MAPS.albedo, roughnessMap:HULL_MAPS.rough,
    normalMap:HULL_MAPS.normal, normalScale:new THREE.Vector2(.5,.5),
    color:0x9fb0b4, metalness:.88, roughness:.55, envMapIntensity:1.15 }),
  armor: new THREE.MeshStandardMaterial({ map:HULL_MAPS.albedo, normalMap:HULL_MAPS.normal,
    color:0x8fa0a4, metalness:.9, roughness:.62, envMapIntensity:1 }),
  armorDark: new THREE.MeshStandardMaterial({ color:0x272d33, metalness:.85, roughness:.6 }),
  dark: new THREE.MeshStandardMaterial({ color:0x14181b, metalness:.75, roughness:.55 }),
  steel: new THREE.MeshStandardMaterial({ color:0x94a5af, metalness:1, roughness:.26, envMapIntensity:1.5 }),
  gunmetal: new THREE.MeshStandardMaterial({ color:0x3d4750, metalness:1, roughness:.36, envMapIntensity:1.35 }),
  copper: new THREE.MeshStandardMaterial({ color:0xb06a3a, metalness:1, roughness:.34 }),
  rubber: new THREE.MeshStandardMaterial({ color:0x17191c, metalness:.1, roughness:.92 }),
  tread: new THREE.MeshStandardMaterial({ map:HULL_MAPS.rough, color:0x2a2e33, metalness:.85, roughness:.68 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0x0a2a33, metalness:.2, roughness:.08,
    transmission:.4, transparent:true, opacity:.9, emissive:0x0e5f74, emissiveIntensity:.6 }),
  hazard: new THREE.MeshStandardMaterial({ map:makeHazardTex(), metalness:.4, roughness:.7 }),
  decal: new THREE.MeshBasicMaterial({ map:makeInsigniaTex(), transparent:true, depthWrite:false,
    polygonOffset:true, polygonOffsetFactor:-2 }),
};

/* ================================================================
   3. 建模辅助
================================================================ */
function mesh(geo, mat, x=0,y=0,z=0, parent=scene){
  const o = new THREE.Mesh(geo, mat);
  o.position.set(x,y,z); o.castShadow = o.receiveShadow = true;
  parent.add(o); return o;
}
function box(w,h,d,r=.03,s=2){
  r = Math.min(r, Math.min(w,h,d)/2 - .002);
  return new RoundedBoxGeometry(w,h,d,s,r);
}
function plate(pts, depth, bevel=.07){ // 多边形装甲板（带倒角）
  const sh = new THREE.Shape();
  sh.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) sh.lineTo(pts[i][0], pts[i][1]);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled:true,
    bevelThickness:bevel, bevelSize:bevel*1.1, bevelSegments:3, curveSegments:2, steps:1 });
  g.translate(0,0,-depth/2);
  return g;
}
function cylX(r1,r2,len,seg=20){ const g=new THREE.CylinderGeometry(r1,r2,len,seg); g.rotateZ(Math.PI/2); return g; }
function cylY(r1,r2,len,seg=20){ return new THREE.CylinderGeometry(r1,r2,len,seg); }
function cylZ(r1,r2,len,seg=20){ const g=new THREE.CylinderGeometry(r1,r2,len,seg); g.rotateX(Math.PI/2); return g; }
// 螺栓组（合并为单一 mesh）
function addBolts(parent, list, r=.045){
  const parts = list.map(p=>{
    const g = new THREE.CylinderGeometry(r,r,.05,6);
    const e = new THREE.Euler(p[3]||0, p[4]||0, p[5]||0);
    g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(e));
    g.translate(p[0],p[1],p[2]); return g;
  });
  const m = mesh(mergeGeometries(parts), M.steel, 0,0,0, parent);
  return m;
}
// 百叶窗散热口
function addLouver(parent, x,y,z, w, n, tilt=.5, axis='x'){
  const grp = new THREE.Group(); grp.position.set(x,y,z); parent.add(grp);
  mesh(box(w,.02,n*.16+.06,.01), M.dark, 0,0,0, grp);
  for(let i=0;i<n;i++){
    const s = mesh(box(w*.94,.055,.05,.012), M.gunmetal, 0,.02,-n*.08+.08+i*.16, grp);
    s.rotation.x = tilt;
  }
  return grp;
}
// 随机 greeble 细节簇（合并）
function addGreebles(parent, cx,cy,cz, sx,sy,sz, n, mat=M.armorDark){
  const parts = [];
  for(let i=0;i<n;i++){
    const w=.06+rnd()*.2, h=.05+rnd()*.16, d=.06+rnd()*.2;
    const g = new THREE.BoxGeometry(w,h,d);
    g.translate(cx+(rnd()-.5)*sx, cy+(rnd()-.5)*sy, cz+(rnd()-.5)*sz);
    parts.push(g);
  }
  return mesh(mergeGeometries(parts), mat, 0,0,0, parent);
}
// 管线/缆绳
function addCable(parent, pts, r=.045, mat=M.gunmetal){
  const curve = new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  return mesh(new THREE.TubeGeometry(curve, 28, r, 8), mat, 0,0,0, parent);
}

/* ================================================================
   5. 履带系统 —— 真实路径链节 + 主动轮齿
================================================================ */
function buildTrack(side){
  const Rp = .8, xS = -2.78, xF = 2.98, yC = .93;   // 节线半径 / 前后轮心 / 轴高
  const yB = yC - Rp, yT = yC + Rp;
  const grp = new THREE.Group();
  grp.position.set(0, 0, side*1.88);
  tank.add(grp);

  // ---- 链节几何（面板+端连接器+接地筋+导棱）----
  const parts = [];
  let g;
  g = new THREE.BoxGeometry(.34,.1,.72);  g.translate(0,.05,0);  parts.push(g);
  g = new THREE.BoxGeometry(.3,.09,.56);  g.translate(0,.145,0); parts.push(g);   // 接地胶块
  g = new THREE.BoxGeometry(.06,.15,.76); g.translate(.16,.06,0);parts.push(g);   // 端连接器
  g = new THREE.BoxGeometry(.06,.15,.76); g.translate(-.16,.06,0);parts.push(g);
  g = new THREE.BoxGeometry(.2,.11,.1);   g.translate(0,-.05,0); parts.push(g);   // 内导棱
  const linkGeo = mergeGeometries(parts);

  // ---- 闭合路径（沿行进方向：底边前→后，顶边后→前）----
  const pts = [];
  const arc = (cx,a0,a1,n)=>{ for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n;
    pts.push([cx+Math.cos(a)*Rp, yC+Math.sin(a)*Rp]); } };
  pts.push([xF, yB]);
  arc(xS, -Math.PI/2, -Math.PI*1.5, 26);   // 绕主动轮：底→后→顶
  pts.push([xF, yT]);
  arc(xF,  Math.PI/2, -Math.PI/2, 26);     // 绕诱导轮：顶→前→底
  const cum = [0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const total = cum[cum.length-1];
  const N = Math.round(total/.36), pitch = total/N;

  const _X = new THREE.Vector3(), _Y = new THREE.Vector3(), _Z = new THREE.Vector3(0,0,1);
  function linkMatrix(s, m){
    s = ((s % total) + total) % total;
    let i = 1; while(cum[i] < s) i++;
    const t = (s - cum[i-1]) / (cum[i] - cum[i-1] || 1);
    const x = pts[i-1][0] + (pts[i][0]-pts[i-1][0])*t;
    const y = pts[i-1][1] + (pts[i][1]-pts[i-1][1])*t;
    _X.set(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1], 0).normalize();
    _Y.crossVectors(_Z, _X);
    m.makeBasis(_X, _Y, _Z); m.setPosition(x, y, 0);
  }
  const inst = new THREE.InstancedMesh(linkGeo, M.tread, N);
  inst.castShadow = inst.receiveShadow = true;
  grp.add(inst);
  TRACKS.push({ inst, linkMatrix, total, pitch, N, offset:0 });

  // ---- 主动轮（带齿）----
  const sprocket = new THREE.Group(); sprocket.position.set(xS, yC, 0); grp.add(sprocket);
  {
    const p = [];
    g = new THREE.CylinderGeometry(.62,.62,.5,24); g.rotateX(Math.PI/2); p.push(g);
    g = new THREE.CylinderGeometry(.2,.2,.62,14); g.rotateX(Math.PI/2); p.push(g);
    for(let i=0;i<16;i++){
      g = new THREE.BoxGeometry(.16,.1,.46);
      g.translate(0,.82,0);
      g.applyMatrix4(new THREE.Matrix4().makeRotationZ(i/16*Math.PI*2));
      p.push(g);
    }
    for(let i=0;i<6;i++){ // 减重孔辐条
      g = new THREE.BoxGeometry(.5,.06,.42); g.translate(.32,0,0);
      g.applyMatrix4(new THREE.Matrix4().makeRotationZ(i/6*Math.PI*2)); p.push(g);
    }
    mesh(mergeGeometries(p), M.gunmetal, 0,0,0, sprocket);
    mesh(new THREE.TorusGeometry(.4,.035,8,24), glowMat(0x37e6ff,1.2), 0,0,.27, sprocket);
    sprocket.userData.r = Rp; WHEELS.push(sprocket);
  }
  // ---- 诱导轮 ----
  const idler = new THREE.Group(); idler.position.set(xF, yC, 0); grp.add(idler);
  {
    const p = [];
    g = new THREE.CylinderGeometry(.72,.72,.46,26); g.rotateX(Math.PI/2); p.push(g);
    g = new THREE.CylinderGeometry(.18,.18,.56,12); g.rotateX(Math.PI/2); p.push(g);
    mesh(mergeGeometries(p), M.steel, 0,0,0, idler);
    mesh(new THREE.TorusGeometry(.5,.04,8,26), M.dark, 0,0,.24, idler);
    idler.userData.r = Rp; WHEELS.push(idler);
  }
  // ---- 负重轮 ×6 ----
  const roadGeo = (()=>{
    const p = [];
    let q;
    q = new THREE.CylinderGeometry(.42,.42,.44,22); q.rotateX(Math.PI/2); p.push(q);
    q = new THREE.TorusGeometry(.3,.04,8,22); q.rotateX(Math.PI/2); q.translate(0,0,.24); p.push(q);
    q = new THREE.TorusGeometry(.3,.04,8,22); q.rotateX(Math.PI/2); q.translate(0,0,-.24); p.push(q);
    q = new THREE.CylinderGeometry(.13,.13,.52,12); q.rotateX(Math.PI/2); p.push(q);
    return mergeGeometries(p);
  })();
  const spokeGeo = (()=>{
    const p = [];
    for(let k=0;k<5;k++){
      const q = new THREE.BoxGeometry(.05,.06,.34); q.translate(.2,0,0);
      q.applyMatrix4(new THREE.Matrix4().makeRotationZ(k/5*Math.PI*2)); p.push(q);
    }
    return mergeGeometries(p);
  })();
  for(let i=0;i<6;i++){
    const w = new THREE.Group();
    w.position.set(xS+.55 + i*(xF-xS-1.1)/5, yB+.42, 0); grp.add(w);
    mesh(roadGeo, i===0||i===5? M.gunmetal : M.rubber, 0,0,0, w);
    mesh(spokeGeo, M.gunmetal, 0,0,.24, w);
    mesh(new THREE.TorusGeometry(.19,.03,8,18), glowMat(0x37e6ff,1.4), 0,0,.28, w);
    w.userData.r = .42; WHEELS.push(w);
  }
  // ---- 托带轮 ×3 ----
  for(let i=0;i<3;i++){
    const w = new THREE.Group();
    w.position.set(xS+.9 + i*(xF-xS-1.8)/2, yT-.2, 0); grp.add(w);
    const p = [];
    let q = new THREE.CylinderGeometry(.2,.2,.36,16); q.rotateX(Math.PI/2); p.push(q);
    q = new THREE.CylinderGeometry(.07,.07,.44,10); q.rotateX(Math.PI/2); p.push(q);
    mesh(mergeGeometries(p), M.dark, 0,0,0, w);
    w.userData.r = .2; WHEELS.push(w);
  }
  // ---- 履带内框架 + 悬挂臂 ----
  mesh(box(5.4,.42,.26,.04), M.armorDark, .1,.72,0, grp);
  for(let i=0;i<6;i++){
    const a = mesh(box(.14,.9,.1,.02), M.gunmetal, xS+.55 + i*(xF-xS-1.1)/5, .78, .18, grp);
    a.rotation.z = .12;
  }
  mesh(box(1.2,.5,.3,.04), M.gunmetal, xS+.1, .95, 0, grp); // 变速箱罩
  return grp;
}

    const l = mesh(cylX(.07,.07,.1,12), M.glass, 1.24,1.3,s*.92, turret);
    mesh(new THREE.CircleGeometry(.055,12), glowMat(0xff4d6a,3), 1.3,1.3,s*.92, turret).rotation.y = Math.PI/2;
  });

  // 炮长瞄准镜（右颊）
  {
    const sg = new THREE.Group(); sg.position.set(1.5,.95,-.55); turret.add(sg);
    mesh(box(.42,.3,.34,.04), M.dark, 0,0,0, sg);
    mesh(cylX(.09,.09,.1,14), glowMat(0x37e6ff,3.4), .24,0,0, sg);
    mesh(box(.3,.06,.24,.01), M.gunmetal, 0,.18,0, sg);
  }

  // 光电桅杆（可扫描）
  {
    const mast = new THREE.Group(); mast.position.set(-1.45,1.3,.7); turret.add(mast);
    mesh(cylY(.08,.1,.55,12), M.gunmetal, 0,.28,0, mast);
    const head = new THREE.Group(); head.position.y=.62; mast.add(head);
    mesh(box(.32,.2,.26,.03), M.dark, 0,0,0, head);
    mesh(cylX(.06,.06,.06,12), glowMat(0x37e6ff,4), .17,.02,0, head);
    MAST = head;
  }
  // 抛物面数据天线（旋转）
  {
    const dishG = new THREE.LatheGeometry(
      [new THREE.Vector2(0,0), new THREE.Vector2(.12,.03), new THREE.Vector2(.24,.12), new THREE.Vector2(.3,.22)], 20);
    const dg = new THREE.Group(); dg.position.set(-1.6,1.15,-.85); turret.add(dg);
    mesh(cylY(.05,.05,.3,8), M.gunmetal, 0,.15,0, dg);
    DISH = new THREE.Group(); DISH.position.y=.34; dg.add(DISH);
    const d = mesh(dishG, M.steel, 0,0,0, DISH); d.rotation.x = -Math.PI*.65;
    mesh(cylY(.02,.02,.2,6), M.copper, .06,.18,0, DISH).rotation.x = -.5;
  }
  // 鞭状天线 ×2
  [-1,1].forEach((s,i)=>{
    const a = mesh(cylY(.016,.03,1.6,6), M.gunmetal, -1.62,.8,s*.55, turret);
    a.rotation.z = .14*s; a.rotation.x = .1*s;
    mesh(new THREE.SphereGeometry(.04,8,8), glowMat(i?0xff4d6a:0x37e6ff,3), -1.62+.12*s,1.6,s*.55+.1*s, turret);
  });

  // 车尾储物篮 + 备履带板 + 物资
  {
    const bustle = new THREE.Group(); bustle.position.set(-2.05,.55,0); turret.add(bustle);
    mesh(box(.8,.6,1.9,.03), M.dark, 0,0,0, bustle);
    for(let i=0;i<4;i++) mesh(box(.06,.62,1.92,.01), M.gunmetal, -.2+i*.14,.02,0, bustle);
    mesh(box(.84,.06,1.94,.01), M.armorDark, 0,.32,0, bustle);
    // 备履带板挂一排
    for(let i=0;i<5;i++) mesh(box(.1,.42,.14,.015), M.tread, -.45,.05,-.66+i*.33, bustle);
    // 木箱 / 油桶
    mesh(box(.4,.34,.5,.03), M.copper, .1,-.05,.75, bustle);
    mesh(box(.42,.04,.52,.01), M.dark, .1,.13,.75, bustle);
    const drum = mesh(cylY(.16,.16,.4,14), M.gunmetal, -.1,-.02,-.8, bustle);
    mesh(new THREE.TorusGeometry(.16,.02,6,14), M.dark, -.1,.06,-.8, bustle).rotation.x = Math.PI/2;
  }
  // 塔顶备负重轮
  {
    const sp = new THREE.Group(); sp.position.set(-1.3,1.34,-.15); turret.add(sp);
    const p = [];
    let q = new THREE.CylinderGeometry(.34,.34,.2,20); q.rotateX(Math.PI/2); p.push(q);
    q = new THREE.CylinderGeometry(.1,.1,.24,10); q.rotateX(Math.PI/2); p.push(q);
    mesh(mergeGeometries(p), M.rubber, 0,0,0, sp);
    mesh(box(.7,.05,.08,.01), M.steel, 0,.34,0, sp);
  }
  // 塔体缆绳
  addCable(turret, [[-1.7,.5,.9],[-2.1,.3,1.1],[-2.2,-.1,.9],[-1.9,-.3,.4]], .035, M.dark);
  addCable(turret, [[-1.7,.5,-.9],[-2.15,.25,-1.05],[-2.25,-.15,-.85]], .03, M.dark);
  // 塔基螺栓圈
  {
    const list = [];
    for(let i=0;i<18;i++){ const a=i/18*Math.PI*2;
      list.push([Math.cos(a)*1.02,.12,Math.sin(a)*1.02, 0,0,0]); }
    addBolts(turret, list, .04);
  }
}

/* ================================================================
   7. 磁轨炮 —— 炮盾 / 分段炮管 / 加速线圈 / 制退器
================================================================ */
const gunPivot = new THREE.Group();
gunPivot.position.set(1.7,.62,0);
turret.add(gunPivot);
{
  // 炮盾
  const mant = mesh(box(.62,.84,1.5,.14,3), M.gunmetal, .12,-.02,0, gunPivot);
  mesh(box(.3,.62,1.05,.1,2), M.dark, .44,-.02,0, gunPivot);
  [-1,1].forEach(s=>mesh(box(.06,.5,.04,.01), glowMat(0xff9a2e,2.4), .42,-.02,s*.55, gunPivot));
  // 炮根套筒
  mesh(cylX(.25,.28,.9,20), M.steel, .95,-.02,0, gunPivot);
  for(let i=0;i<3;i++) mesh(new THREE.TorusGeometry(.27,.03,8,20), M.dark, .7+i*.28,-.02,0, gunPivot).rotation.y = Math.PI/2;

  // 主炮管
  const BL = 4.7;
  mesh(cylX(.145,.16,BL,22), M.gunmetal, BL/2+1.3,-.02,0, gunPivot);
  // 热护套分段环
  for(let i=0;i<8;i++) mesh(new THREE.TorusGeometry(.175,.028,8,20), M.steel, 1.9+i*.42,-.02,0, gunPivot).rotation.y = Math.PI/2;
  // 加速线圈（行波脉冲）
  for(let i=0;i<7;i++){
    const c = mesh(new THREE.TorusGeometry(.21,.05,10,26), glowMat(0x37e6ff,2.2), 2.5+i*.44,-.02,0, gunPivot);
    c.rotation.y = Math.PI/2; COILS.push(c);
  }
  // 顶部能量导轨 + 发光芯
  mesh(box(BL*.62,.07,.09,.02), M.steel, 3.9,.22,0, gunPivot);
  mesh(box(BL*.56,.03,.04,.005), glowMat(0x37e6ff,2.0), 3.9,.27,0, gunPivot);
  [-1,1].forEach(s=>{ // 导轨支架
    for(let i=0;i<3;i++) mesh(box(.05,.14,.05,.01), M.gunmetal, 2.9+i*.9,.16,s*.06, gunPivot);
  });
  // 侧挂校准杆
  mesh(box(1.6,.04,.04,.01), M.copper, 3.4,-.02,.24, gunPivot);

  // 炮口制退器（带栅格槽）
  const muz = new THREE.Group(); muz.position.x = BL+1.32; gunPivot.add(muz);
  mesh(cylX(.22,.24,.55,20), M.steel, .1,0,0, muz);
  for(let i=0;i<3;i++) mesh(cylX(.245,.245,.06,20), M.dark, -.05+i*.16,0,0, muz);
  mesh(cylX(.16,.16,.1,16), M.dark, .38,0,0, muz);
  [-1,1].forEach(s=>mesh(box(.3,.08,.06,.01), glowMat(0x37e6ff,2.6), .12,.2,s*.12, muz));
  const muzzleGlow = mesh(new THREE.CircleGeometry(.13,20), glowMat(0x9df3ff,0), .44,0,0, muz);
  muzzleGlow.rotation.y = Math.PI/2;
  MUZZLE = muzzleGlow;

  // 同轴武器 + 备炮口
  const coax = mesh(cylX(.05,.06,1.3,12), M.dark, 1.1,-.32,.5, gunPivot);
  mesh(cylX(.07,.07,.1,10), M.gunmetal, 1.78,-.32,.5, gunPivot);
}
// 遥控武器站（车顶）
{
  const rws = new THREE.Group(); rws.position.set(.55,1.36,-.35); turret.add(rws);
  mesh(box(.46,.3,.46,.06,2), M.gunmetal, 0,.16,0, rws);
  mesh(cylX(.032,.038,.85,10), M.dark, .55,.18,0, rws);
  mesh(cylX(.05,.05,.12,10), M.steel, .98,.18,0, rws);
  mesh(new THREE.SphereGeometry(.08,12,10), glowMat(0xff4d6a,2.6), .02,.34,0, rws);
  mesh(box(.2,.1,.24,.02), M.dark, -.2,.16,.2, rws);
}

/* ================================================================
   8. 地面 / 展示平台 / 粒子
================================================================ */
{
  const gc = document.createElement('canvas'); gc.width=gc.height=512;
  const gg = gc.getContext('2d');
  gg.fillStyle='#070c12'; gg.fillRect(0,0,512,512);
  gg.strokeStyle='rgba(55,230,255,.14)'; gg.lineWidth=1;
  for(let i=0;i<=8;i++){ const p=i*64;
    gg.beginPath(); gg.moveTo(p,0); gg.lineTo(p,512); gg.stroke();
    gg.beginPath(); gg.moveTo(0,p); gg.lineTo(512,p); gg.stroke(); }
  const gt = new THREE.CanvasTexture(gc);
  gt.wrapS=gt.wrapT=THREE.RepeatWrapping; gt.repeat.set(28,28);
  gt.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(260,260),
    new THREE.MeshStandardMaterial({ map:gt, color:0x0e151d, metalness:.5, roughness:.8 }));
  ground.rotation.x = -Math.PI/2; ground.position.y = -.02; ground.receiveShadow = true;
  scene.add(ground);

  // 六边形展示台
  const plat = new THREE.Group(); scene.add(plat);
  const base = mesh(new THREE.CylinderGeometry(8.6,8.9,.34,6), M.armorDark, 0,-.17,0, plat);
  mesh(new THREE.CylinderGeometry(8.2,8.2,.05,6), new THREE.MeshStandardMaterial({
    color:0x131c25, metalness:.55, roughness:.6 }), 0,.025,0, plat);
  const ring = mesh(new THREE.TorusGeometry(7.25,.05,10,90), glowMat(0x37e6ff,2.4), 0,.02,0, plat);
  ring.rotation.x = Math.PI/2;
  for(let i=0;i<6;i++){ // 径向发光条
    const a = i/6*Math.PI*2 + Math.PI/6;
    const s = mesh(box(6.6,.02,.08,.005), glowMat(0x1f8fb8,1.4), 0,.03,0, plat);
    s.rotation.y = a;
  }
  for(let i=0;i<24;i++){ // 刻度
    const a = i/24*Math.PI*2;
    const tick = mesh(box(.4,.03,.08,.01), glowMat(0x37e6ff,1.6), Math.cos(a)*6.8,.04,Math.sin(a)*6.8, plat);
    tick.rotation.y = -a;
  }
  window.__plat = plat;

  // 环境尘埃
  const N=460, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=4+Math.random()*28, a=Math.random()*7;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*7.5; pos[i*3+2]=Math.sin(a)*r;
  }
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const dust=new THREE.Points(dg,new THREE.PointsMaterial({
    color:0x5fd8ef,size:.03,transparent:true,opacity:.32,
    blending:THREE.AdditiveBlending,depthWrite:false }));
  scene.add(dust); window.__dust = dust;

  // 排气火花粒子
  const SN=90, sp=new Float32Array(SN*3), sv=new Float32Array(SN*3), sl=new Float32Array(SN);
  const spawn=(i)=>{ const s=rnd()<.5?1:-1;
    sp[i*3]=-4.45; sp[i*3+1]=1.44; sp[i*3+2]=s*1.15;
    sv[i*3]=-.4-Math.random()*.8; sv[i*3+1]=.2+Math.random()*.5; sv[i*3+2]=(Math.random()-.5)*.3;
    sl[i]=Math.random()*1.4; };
  for(let i=0;i<SN;i++) spawn(i);
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
  const sparks=new THREE.Points(sg,new THREE.PointsMaterial({
    color:0xff9a4e,size:.07,transparent:true,opacity:.9,
    blending:THREE.AdditiveBlending,depthWrite:false }));
  scene.add(sparks);
  window.__sparks = { sp, sv, sl, spawn, SN, geo: sg };
}

/* ================================================================
   9. 后期泛光
================================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .5, .42, .95);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let useBloom = true;

/* ================================================================
   10. 交互 / 相机预设 / HUD
================================================================ */
const state = { speed:.26, yaw:0, elev:2, fireT:-1, recoil:0, running:true };
const $ = id=>document.getElementById(id);

const VIEWS = [
  { p:[13.6,6.6,15.4], t:[0,1.6,0] },
  { p:[2.6,3.2,13.6],  t:[0,1.6,0] },
  { p:[1.5,13.5,.5],   t:[0,1.2,0] },
  { p:[6.8,2.9,2.6],   t:[4.2,2.7,0] },
  { p:[-9.5,4.2,-6.5], t:[-1.5,1.6,0] },
];
let tween = null;
function gotoView(i, instant=false){
  const v = VIEWS[i];
  if(instant){
    camera.position.set(...v.p); controls.target.set(...v.t);
    controls.autoRotate = false; $('b-rot').classList.remove('on'); return;
  }
  tween = { k:0, p0:camera.position.clone(), p1:new THREE.Vector3(...v.p),
            t0:controls.target.clone(), t1:new THREE.Vector3(...v.t) };
  controls.autoRotate = false; $('b-rot').classList.remove('on');
}
$('views') && document.querySelectorAll('#views button').forEach(b=>{
  b.onclick = ()=>gotoView(+b.dataset.v); });

$('b-rot').onclick   = e=>{ controls.autoRotate=!controls.autoRotate; e.target.classList.toggle('on'); };
$('b-fire').onclick  = ()=>fire();
$('b-wire').onclick  = e=>{ const on=!e.target.classList.contains('on');
  e.target.classList.toggle('on');
  const seen = new Set();
  tank.traverse(o=>{ if(o.isMesh && o.material){ [].concat(o.material).forEach(m=>{
    if('wireframe' in m && !seen.has(m)){ m.wireframe = on; seen.add(m); } }); } }); };
$('b-bloom').onclick = e=>{ useBloom=!useBloom; e.target.classList.toggle('on'); };
$('b-reset').onclick = ()=>{ gotoView(0); controls.autoRotate=true; $('b-rot').classList.add('on'); };
$('s-yaw').oninput  = e=>state.yaw  = +e.target.value;
$('s-elev').oninput = e=>state.elev = +e.target.value;
$('s-spd').oninput  = e=>state.speed= +e.target.value/100;

function fire(){ if(state.fireT < 0) state.fireT = 0; }
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='f') fire();
  if(k==='w') $('b-wire').click();
  if(k==='r') $('b-reset').click();
  if(k===' '){ state.running=!state.running; e.preventDefault(); }
  if(k>='1'&&k<='5') gotoView(+k-1);
});

// 开火特效体
const flash = new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),
  new THREE.MeshBasicMaterial({ color:0xbdf6ff, transparent:true, opacity:0, blending:THREE.AdditiveBlending }));
scene.add(flash);
const shock = new THREE.Mesh(new THREE.RingGeometry(.2,.34,40),
  new THREE.MeshBasicMaterial({ color:0x9df3ff, transparent:true, opacity:0, side:THREE.DoubleSide, blending:THREE.AdditiveBlending }));
scene.add(shock);
const muzzleLight = new THREE.PointLight(0x9df3ff, 0, 20, 2);
scene.add(muzzleLight);
let shake = 0;

/* ================================================================
   11. 动画主循环
================================================================ */
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
let t = 0, hudT = 0, fpsT = 0, fpsN = 0;
const _v = new THREE.Vector3(), _shakeOff = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05); t += dt;
  fpsT += dt; fpsN++;

  /* --- 履带 --- */
  const spd = state.running ? state.speed * 6.2 : 0;
  TRACKS.forEach(tr=>{
    tr.offset = (tr.offset + spd*dt) % tr.total;
    for(let i=0;i<tr.N;i++){
      tr.linkMatrix(i*tr.pitch + tr.offset, dummy.matrix);
      tr.inst.setMatrixAt(i, dummy.matrix);
    }
    tr.inst.instanceMatrix.needsUpdate = true;
  });
  WHEELS.forEach(w=>{ w.rotation.z -= spd*dt/(w.userData.r||.8); });

  /* --- 引擎怠速震动 --- */
  tank.position.y = Math.sin(t*34)*.004 + Math.sin(t*17.3)*.003;
  tank.rotation.z = Math.sin(t*23)*.0012;

  /* --- 炮塔 / 炮管 --- */
  const yawTarget = THREE.MathUtils.degToRad(state.yaw) + (controls.autoRotate? Math.sin(t*.16)*.1 : 0);
  turret.rotation.y += (yawTarget - turret.rotation.y) * Math.min(dt*2.4,1);
  let elev = THREE.MathUtils.degToRad(state.elev);
  gunPivot.rotation.z += (elev - gunPivot.rotation.z) * Math.min(dt*3,1);
  if(MAST) MAST.rotation.y = Math.sin(t*.55)*1.4;
  if(DISH) DISH.rotation.y = t*.7;

  /* --- 开火 --- */
  if(state.fireT >= 0){
    state.fireT += dt;
    const f = state.fireT;
    const rec = f<.1? f/.1 : Math.max(0, 1-(f-.1)/.55);
    gunPivot.position.x = 1.7 - rec*.45;
    const fo = Math.max(0, 1-f*6.5);
    flash.material.opacity = fo; shock.material.opacity = fo*.85;
    muzzleLight.intensity = fo*320;
    MUZZLE.material.emissiveIntensity = fo*9;
    shake = Math.max(shake, fo*.9);
    if(f<.6){
      MUZZLE.getWorldPosition(_v);
      flash.position.copy(_v); shock.position.copy(_v);
      shock.quaternion.copy(camera.quaternion);
      shock.scale.setScalar(1+f*30);
      muzzleLight.position.copy(_v);
    }
    if(f>1.3){ state.fireT=-1; gunPivot.position.x=1.7;
      flash.material.opacity=0; shock.material.opacity=0; muzzleLight.intensity=0; }
  }

  /* --- 发光脉冲 / 线圈行波 --- */
  EMAT.forEach(e=>{ e.m.emissiveIntensity = e.base * (.75 + .25*Math.sin(t*3+e.phase)); });
  COILS.forEach((c,i)=>{
    const wave = Math.max(0, Math.sin(t*5 - i*.9));
    c.material.emissiveIntensity = .35 + wave*1.1 + (state.fireT>=0? 2.5:0);
  });
  THRUSTERS.forEach(th=>{ th.m.emissiveIntensity = th.base*(.7+.3*Math.sin(t*11+th.base)); });

  /* --- 排气火花 --- */
  {
    const S = window.__sparks;
    for(let i=0;i<S.SN;i++){
      S.sl[i] -= dt;
      if(S.sl[i] <= 0) S.spawn(i);
      S.sp[i*3]   += S.sv[i*3]*dt;
      S.sp[i*3+1] += S.sv[i*3+1]*dt;
      S.sp[i*3+2] += S.sv[i*3+2]*dt;
      S.sv[i*3+1] -= dt*.35;
    }
    S.geo.attributes.position.needsUpdate = true;
  }

  /* --- 平台 / 粒子 --- */
  if(window.__plat) window.__plat.rotation.y = t*.04;
  if(window.__dust){ window.__dust.rotation.y = t*.012; }

  /* --- 相机补间 + 震屏 --- */
  if(tween){
    tween.k = Math.min(1, tween.k + dt/1.1);
    const e = tween.k<.5? 4*tween.k**3 : 1-(-2*tween.k+2)**3/2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if(tween.k>=1) tween=null;
  }
  controls.update();
  if(shake > .001){
    _shakeOff.set((Math.random()-.5)*shake*.22,(Math.random()-.5)*shake*.22,(Math.random()-.5)*shake*.22);
    camera.position.add(_shakeOff);
    shake *= Math.pow(.02, dt);
  }

  /* --- HUD --- */
  hudT += dt;
  if(hudT > .12){ hudT = 0;
    $('t-pow').textContent = (1500+spd*140+Math.sin(t*3)*60).toFixed(0)+' kW';
    $('t-tmp').textContent = (62+spd*8+Math.sin(t*1.7)*4).toFixed(0)+' °C';
    $('t-chg').textContent = (state.fireT>=0? 0 : (t*37)%100).toFixed(0)+' %';
    $('t-yaw').textContent  = THREE.MathUtils.radToDeg(turret.rotation.y).toFixed(1)+'°';
    $('t-elev').textContent = THREE.MathUtils.radToDeg(gunPivot.rotation.z).toFixed(1)+'°';
    $('t-spd').textContent  = (spd*7.2).toFixed(0)+' km/h';
  }
  if(fpsT >= 1){ $('t-fps').textContent = (fpsN/fpsT).toFixed(0)+' FPS'; fpsT=0; fpsN=0; }

  useBloom ? composer.render() : renderer.render(scene, camera);
}

/* ================================================================
   12. 启动
================================================================ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

renderer.compile(scene, camera);
window.__dbg = { THREE, scene, camera, tank, controls };
const qp = new URLSearchParams(location.search);
const qv = qp.get('view');
if(qv) gotoView(Math.min(4, Math.max(0, +qv-1)), true);
const ft = qp.get('fire');
if(ft !== null) setTimeout(fire, +ft || 1600);
animate();
setTimeout(()=>{ const l = document.getElementById('loader');
  l.classList.add('done'); setTimeout(()=>l.remove(), 900); }, 700);
</script>

</body>
