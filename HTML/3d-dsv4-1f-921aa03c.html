<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鲸鱼娘 · 网页 3D 建模</title>
<style>
  :root{
    --ink:#1e2646; --ink-soft:#63719b; --line:rgba(46,62,120,.16);
    --card:rgba(255,255,255,.78); --accent:#4b7fd1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9f1fd;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #ui{opacity:0;transition:opacity .7s ease}
  #ui.ready{opacity:1}
  .title{position:fixed;top:34px;left:38px;pointer-events:none}
  .title h1{margin:0;font-size:27px;font-weight:600;letter-spacing:.03em}
  .title h1 span{color:var(--accent)}
  .title p{margin:7px 0 0;font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
  .panel{position:fixed;left:38px;bottom:34px;display:flex;gap:9px;flex-wrap:wrap;max-width:min(78vw,520px)}
  .panel button{appearance:none;border:1px solid var(--line);background:var(--card);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--ink);font-size:13px;font-family:inherit;padding:9px 16px;border-radius:999px;
    cursor:pointer;transition:transform .16s ease,background .2s ease,border-color .2s ease,color .2s ease}
  .panel button:hover{transform:translateY(-1px);border-color:rgba(75,127,209,.5)}
  .panel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ref{position:fixed;right:34px;top:34px;width:132px;border:1px solid var(--line);border-radius:16px;
    overflow:hidden;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:8px;box-shadow:0 10px 30px rgba(38,54,110,.10)}
  .ref img{width:100%;display:block;border-radius:10px}
  .ref span{display:block;text-align:center;font-size:11px;color:var(--ink-soft);margin-top:6px;letter-spacing:.08em}
  .hint{position:fixed;right:38px;bottom:38px;font-size:12px;color:var(--ink-soft);text-align:right;
    line-height:1.7;letter-spacing:.04em}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#e9f1fd;font-size:14px;color:var(--ink-soft);letter-spacing:.14em;transition:opacity .6s;z-index:9}
  #loading.done{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#e9f1fd;padding:40px;text-align:center;font-size:14px;color:#a84156;line-height:1.9;z-index:10}
  @media (max-width:820px){
    .title{top:22px;left:20px}.title h1{font-size:20px}.title p{font-size:11px}
    .panel{left:20px;bottom:22px;gap:7px}.panel button{padding:8px 13px;font-size:12px}
    .ref{right:16px;top:16px;width:88px}.hint{display:none}
  }
</style>
</head>
