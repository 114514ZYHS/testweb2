<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>墨水流体 · WebGL 实时流体模拟</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05060a;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  #canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; touch-action: none; cursor: crosshair;
  }

  /* ---------- 开场标题遮罩 ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8,10,18,.72), rgba(3,4,8,.92));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .7s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .o-card { text-align: center; color: #e8ecf4; padding: 0 28px; max-width: 600px; }
  .o-card h1 {
    font-size: 46px; margin: 0 0 14px; font-weight: 600;
    letter-spacing: 14px; text-indent: 14px;
    background: linear-gradient(120deg, #8fd3ff, #c3a6ff 45%, #ff9ecb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .o-sub { font-size: 13px; color: #9fb0c9; letter-spacing: 2px; margin: 0 0 20px; }
  .o-desc { font-size: 13.5px; line-height: 2.0; color: #b9c4d6; margin: 0 0 32px; }
  #btnStart {
    padding: 13px 62px; font-size: 16px; letter-spacing: 8px; text-indent: 8px;
    color: #fff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    cursor: pointer; transition: background .25s, transform .25s;
  }
  #btnStart:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }

  /* ---------- 左下角控制面板 ---------- */
  #panel {
    position: fixed; left: 14px; bottom: 14px; z-index: 20; width: 242px;
    padding: 12px 14px 10px; border-radius: 12px;
    background: rgba(10,12,20,.42);
    border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #dfe6f0; font-size: 12px; user-select: none;
  }
  .p-title { font-size: 12px; letter-spacing: 1px; color: #aebad0; margin-bottom: 9px; }
  .p-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .p-row label { width: 56px; flex: none; color: #c3cddd; }
  .p-row input[type=range] {
    flex: 1; height: 3px; margin: 0; accent-color: #7ab8ff;
    background: rgba(255,255,255,.18); border-radius: 2px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .p-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #8fc7ff; cursor: pointer; box-shadow: 0 0 6px rgba(140,200,255,.8);
  }
  .p-row input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%;
    background: #8fc7ff; cursor: pointer;
  }
  .val { width: 30px; flex: none; text-align: right; color: #8fc7ff; font-variant-numeric: tabular-nums; }
  .p-btns { display: flex; gap: 8px; margin: 10px 0 8px; }
  .p-btns button {
    flex: 1; padding: 6px 0; font-size: 12px; color: #e6ecf5;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    border-radius: 8px; cursor: pointer; transition: background .2s;
    font-family: inherit;
  }
  .p-btns button:hover { background: rgba(255,255,255,.18); }
  .p-foot {
    display: flex; justify-content: space-between; align-items: center;
    color: #93a1b8; font-size: 11px;
    border-top: 1px solid rgba(255,255,255,.07); padding-top: 7px;
  }
  #fps { color: #7fe3a4; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>

<canvas id="canvas"></canvas>

<!-- 开场标题遮罩 -->
<div id="overlay">
  <div class="o-card">
    <h1>墨水流体</h1>
    <p class="o-sub">WebGL 实时流体模拟 · GPU 求解 Navier-Stokes 方程</p>
    <p class="o-desc">
      拖拽指针注入彩色墨流，涡量约束让墨水卷出优雅的漩涡。<br>
      点击画布可产生一次彩色喷溅；静置 3 秒后，墨水将自动起舞。
    </p>
    <button id="btnStart">开 始</button>
  </div>
</div>

<!-- 左下角控制面板 -->
<div id="panel">
  <div class="p-title">墨水流体 · 控制面板</div>
  <div class="p-row">
    <label>涡量强度</label>
    <input type="range" id="sCurl" min="0" max="60" step="1" value="30">
    <span class="val" id="vCurl">30</span>
  </div>
  <div class="p-row">
    <label>染料消散</label>
    <input type="range" id="sDye" min="0" max="4" step="0.1" value="1.0">
    <span class="val" id="vDye">1.0</span>
  </div>
  <div class="p-row">
    <label>速度衰减</label>
    <input type="range" id="sVel" min="0" max="4" step="0.1" value="0.3">
    <span class="val" id="vVel">0.3</span>
  </div>
  <div class="p-btns">
    <button id="btnBurst">随机喷发</button>
    <button id="btnClear">清空染料</button>
  </div>
  <div class="p-foot">
    <span>FPS <span id="fps">--</span></span>
    <span>拖拽注入 · 点击喷溅</span>
  </div>
</div>

<script>
(function () {
'use strict';

/* =====================================================================
 * 墨水流体 · GPU Stable Fluids
 * 管线：curl(涡量) → vorticity confinement(涡量约束) → divergence(散度)
 *      → pressure Jacobi(压力迭代) → gradient subtract(投影去散度)
 *      → velocity advection(速度半拉格朗日平流) → dye advection(染料平流)
 * ===================================================================== */

/* ---------------- 基础配置 ---------------- */
var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
var config = {
  SIM_RESOLUTION: isMobile ? 128 : 192,   // 速度场模拟分辨率（128~256）
  DYE_RESOLUTION: isMobile ? 512 : 1024,  // 染料纹理分辨率（512~1024）
  PRESSURE_ITERATIONS: 25,                // 压力泊松方程 Jacobi 迭代次数（20~30）
  PRESSURE: 0.8,                          // 压力场每帧留存系数（防止残留压力累积）
  CURL: 30,                               // 涡量约束强度（面板可调）
  DENSITY_DISSIPATION: 1.0,               // 染料消散速率（面板可调）
  VELOCITY_DISSIPATION: 0.3,              // 速度衰减速率（面板可调）
  SPLAT_RADIUS: 0.25,                     // splat 基础半径
  SPLAT_FORCE: 6000,                      // 拖拽注入的力度系数
  IDLE_DELAY: 3000                        // 无操作多久后开始自动喷发（毫秒）
};

var canvas  = document.getElementById('canvas');
var overlay = document.getElementById('overlay');
var fpsEl   = document.getElementById('fps');

var overlayLocked = false;
function showError(msg) {
  if (overlayLocked) return;
  overlayLocked = true;
  overlay.classList.remove('hidden');
  overlay.innerHTML =
    '<div class="o-card"><h1>无法启动</h1><p class="o-desc">' + msg + '</p></div>';
}

/* ---------------- WebGL 上下文与扩展检测 ---------------- */
var glOpts = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
var gl = canvas.getContext('webgl', glOpts) || canvas.getContext('experimental-webgl', glOpts);
if (!gl) {
  showError('您的浏览器不支持 WebGL，无法运行本 Demo。<br>请更换最新版 Chrome / Edge / Firefox / Safari 后重试。');
  return;
}

/* 检测可渲染为帧缓冲附件的浮点纹理类型：优先半浮点，回退单浮点 */
var ext = { texType: null, supportLinearFiltering: false };
function typeRenderable(type) {
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 4, 0, gl.RGBA, type, null);
  var fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(tex);
  return ok;
}
(function detectFormats() {
  var halfFloat = gl.getExtension('OES_texture_half_float');
  if (halfFloat && typeRenderable(halfFloat.HALF_FLOAT_OES)) {
    ext.texType = halfFloat.HALF_FLOAT_OES;   // WebGL1 半浮点类型
    ext.supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
    return;
  }
  var floatExt = gl.getExtension('OES_texture_float');
  if (floatExt && typeRenderable(gl.FLOAT)) {
    ext.texType = gl.FLOAT;                    // 回退：单精度浮点
    ext.supportLinearFiltering = !!gl.getExtension('OES_texture_float_linear');
  }
})();
if (!ext.texType) {
  showError('您的设备不支持浮点纹理渲染（OES_texture_half_float / OES_texture_float），<br>无法进行 GPU 流体模拟。');
  return;
}
/* 硬件不支持浮点纹理线性过滤时，着色器内做手动双线性插值 */
var MANUAL_FILTERING = !ext.supportLinearFiltering;
var filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

/* =====================================================================
 *  着色器源码（GLSL ES 1.00，每个 pass 均有注释说明作用）
 * ===================================================================== */

/* 公共顶点着色器：全屏三角形网格，输出 uv 及上下左右四邻 uv（供差分使用） */
var baseVertexSrc = [
  'precision highp float;',
  'attribute vec2 aPosition;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform vec2 texelSize;',   // 当前模拟网格的单格尺寸 (1/宽, 1/高)
  'void main () {',
  '    vUv = aPosition * 0.5 + 0.5;',
  '    vL = vUv - vec2(texelSize.x, 0.0);',
  '    vR = vUv + vec2(texelSize.x, 0.0);',
  '    vT = vUv + vec2(0.0, texelSize.y);',
  '    vB = vUv - vec2(0.0, texelSize.y);',
  '    gl_Position = vec4(aPosition, 0.0, 1.0);',
  '}'
].join('\n');

/* 拷贝 pass：原样输出纹理（用于 FBO 缩放时保留内容） */
var copySrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'uniform sampler2D uTexture;',
  'void main () {',
  '    gl_FragColor = texture2D(uTexture, vUv);',
  '}'
].join('\n');

/* 清场 pass：将纹理按 value 系数缩放输出（用于压力场衰减清零） */
var clearSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'uniform sampler2D uTexture;',
  'uniform float value;',
  'void main () {',
  '    gl_FragColor = value * texture2D(uTexture, vUv);',
  '}'
].join('\n');

/* splat pass：在指针处叠加一个高斯衰减的冲量/染料斑点 */
var splatSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'uniform sampler2D uTarget;',
  'uniform float aspectRatio;',
  'uniform vec3 color;',
  'uniform vec2 point;',
  'uniform float radius;',
  'void main () {',
  '    vec2 p = vUv - point.xy;',
  '    p.x *= aspectRatio;',                            // 修正宽高比，保证斑点为圆形
  '    vec3 splat = exp(-dot(p, p) / radius) * color;',  // 高斯核
  '    vec3 base = texture2D(uTarget, vUv).xyz;',
  '    gl_FragColor = vec4(base + splat, 1.0);',
  '}'
].join('\n');

/* 平流 pass（半拉格朗日）：沿速度场回溯采样，带耗散衰减 */
var advectionSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'uniform sampler2D uVelocity;',
  'uniform sampler2D uSource;',
  'uniform vec2 texelSize;',       // 速度场网格尺寸
  'uniform vec2 dyeTexelSize;',    // 源纹理网格尺寸（手动过滤时使用）
  'uniform float dt;',
  'uniform float dissipation;',    // 耗散系数：越大衰减越快
  // 手动双线性插值（硬件不支持浮点线性过滤时的替代方案）
  'vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {',
  '    vec2 st = uv / tsize - 0.5;',
  '    vec2 iuv = floor(st);',
  '    vec2 fuv = fract(st);',
  '    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);',
  '    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);',
  '    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);',
  '    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);',
  '    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);',
  '}',
  'void main () {',
  '#ifdef MANUAL_FILTERING',
  // 回溯位置：当前位置 - 速度 × dt
  '    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;',
  '    vec4 result = bilerp(uSource, coord, dyeTexelSize);',
  '#else',
  '    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;',
  '    vec4 result = texture2D(uSource, coord);',
  '#endif',
  '    float decay = 1.0 + dissipation * dt;',   // 数值稳定的指数式衰减
  '    gl_FragColor = result / decay;',
  '}'
].join('\n');

/* 散度 pass：计算速度场散度 ∇·v（边界处做反射，实现自由滑移边界） */
var divergenceSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uVelocity;',
  'void main () {',
  '    float L = texture2D(uVelocity, vL).x;',
  '    float R = texture2D(uVelocity, vR).x;',
  '    float T = texture2D(uVelocity, vT).y;',
  '    float B = texture2D(uVelocity, vB).y;',
  '    vec2 C = texture2D(uVelocity, vUv).xy;',
  '    if (vL.x < 0.0) { L = -C.x; }',   // 边界反弹
  '    if (vR.x > 1.0) { R = -C.x; }',
  '    if (vT.y > 1.0) { T = -C.y; }',
  '    if (vB.y < 0.0) { B = -C.y; }',
  '    float div = 0.5 * (R - L + T - B);',
  '    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);',
  '}'
].join('\n');

/* 涡量 pass：由速度场计算标量涡度 ω = ∂vy/∂x - ∂vx/∂y */
var curlSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uVelocity;',
  'void main () {',
  '    float L = texture2D(uVelocity, vL).y;',
  '    float R = texture2D(uVelocity, vR).y;',
  '    float T = texture2D(uVelocity, vT).x;',
  '    float B = texture2D(uVelocity, vB).x;',
  '    float vorticity = R - L - T + B;',
  '    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);',
  '}'
].join('\n');

/* 涡量约束 pass（Vorticity Confinement）：
   用涡度场的梯度构造指向涡核的恢复力，补偿数值耗散、让漩涡更卷 */
var vorticitySrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uVelocity;',
  'uniform sampler2D uCurl;',
  'uniform float curl;',   // 涡量约束强度
  'uniform float dt;',
  'void main () {',
  '    float L = texture2D(uCurl, vL).x;',
  '    float R = texture2D(uCurl, vR).x;',
  '    float T = texture2D(uCurl, vT).x;',
  '    float B = texture2D(uCurl, vB).x;',
  '    float C = texture2D(uCurl, vUv).x;',
  '    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
  '    force /= length(force) + 0.0001;',   // 归一化为方向
  '    force *= curl * C;',                 // 强度 × 该处涡度
  '    force.y *= -1.0;',
  '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
  '    velocity += force * dt;',
  '    velocity = min(max(velocity, -1000.0), 1000.0);',  // 限幅防爆
  '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
  '}'
].join('\n');

/* 压力求解 pass：泊松方程 ∇²p = ∇·v 的 Jacobi 一步迭代
   p = (pL + pR + pB + pT - div) / 4，由 JS 端循环调用 20~30 次 */
var pressureSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uPressure;',
  'uniform sampler2D uDivergence;',
  'void main () {',
  '    float L = texture2D(uPressure, vL).x;',
  '    float R = texture2D(uPressure, vR).x;',
  '    float T = texture2D(uPressure, vT).x;',
  '    float B = texture2D(uPressure, vB).x;',
  '    float divergence = texture2D(uDivergence, vUv).x;',
  '    float pressure = (L + R + B + T - divergence) * 0.25;',
  '    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);',
  '}'
].join('\n');

/* 投影 pass：从速度场中减去压力梯度 ∇p，得到无散度（不可压缩）速度场 */
var gradientSubtractSrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uPressure;',
  'uniform sampler2D uVelocity;',
  'void main () {',
  '    float L = texture2D(uPressure, vL).x;',
  '    float R = texture2D(uPressure, vR).x;',
  '    float T = texture2D(uPressure, vT).x;',
  '    float B = texture2D(uPressure, vB).x;',
  '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
  '    velocity.xy -= vec2(R - L, T - B);',
  '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
  '}'
].join('\n');

/* 显示 pass：把染料渲染到屏幕，基于染料亮度梯度做伪法线柔和光照 */
var displaySrc = [
  'precision highp float;',
  'precision highp sampler2D;',
  'varying vec2 vUv;',
  'varying vec2 vL;',
  'varying vec2 vR;',
  'varying vec2 vT;',
  'varying vec2 vB;',
  'uniform sampler2D uTexture;',
  'uniform vec2 texelSize;',
  'void main () {',
  '    vec3 c = texture2D(uTexture, vUv).rgb;',
  '    vec3 lc = texture2D(uTexture, vL).rgb;',
  '    vec3 rc = texture2D(uTexture, vR).rgb;',
  '    vec3 tc = texture2D(uTexture, vT).rgb;',
  '    vec3 bc = texture2D(uTexture, vB).rgb;',
  '    float dx = length(rc) - length(lc);',   // 染料亮度梯度 → 伪法线
  '    float dy = length(tc) - length(bc);',
  '    vec3 n = normalize(vec3(dx, dy, length(texelSize)));',
  '    float diffuse = clamp(dot(n, vec3(0.0, 0.0, 1.0)) + 0.7, 0.7, 1.0);',
  '    c *= diffuse;',
  '    gl_FragColor = vec4(c, 1.0);',
  '}'
].join('\n');

/* ---------------- 着色器 / 程序编译工具 ---------------- */
function addKeywords(source, keywords) {
  if (!keywords) return source;
  var prefix = '';
  keywords.forEach(function (k) { prefix += '#define ' + k + '\n'; });
  return prefix + source;
}
function compileShader(type, source, keywords) {
  source = addKeywords(source, keywords);
  var shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error('着色器编译失败: ' + gl.getShaderInfoLog(shader));
  }
  return shader;
}
function createProgram(vs, fs) {
  var program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.bindAttribLocation(program, 0, 'aPosition');  // 统一绑定顶点属性到 0 号槽
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('程序链接失败: ' + gl.getProgramInfoLog(program));
  }
  return program;
}
function getUniforms(program) {
  var uniforms = {};
  var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (var i = 0; i < count; i++) {
    var name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return uniforms;
}
function Program(vs, fs) {
  this.program = createProgram(vs, fs);
  this.uniforms = getUniforms(this.program);
}
Program.prototype.bind = function () { gl.useProgram(this.program); };

var baseVertex, copyProgram, clearProgram, splatProgram, advectionProgram,
    divergenceProgram, curlProgram, vorticityProgram, pressureProgram,
    gradientSubtractProgram, displayProgram;

try {
  baseVertex = compileShader(gl.VERTEX_SHADER, baseVertexSrc);
  var advKeywords = MANUAL_FILTERING ? ['MANUAL_FILTERING'] : null;
  copyProgram            = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, copySrc));
  clearProgram           = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, clearSrc));
  splatProgram           = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, splatSrc));
  advectionProgram       = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, advectionSrc, advKeywords));
  divergenceProgram      = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, divergenceSrc));
  curlProgram            = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, curlSrc));
  vorticityProgram       = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, vorticitySrc));
  pressureProgram        = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, pressureSrc));
  gradientSubtractProgram= new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, gradientSubtractSrc));
  displayProgram         = new Program(baseVertex, compileShader(gl.FRAGMENT_SHADER, displaySrc));
} catch (e) {
  showError('着色器初始化失败：<br>' + String(e.message || e));
  return;
}

/* ---------------- 全屏四边形 blit ---------------- */
var blit = (function () {
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return function (target) {
    if (target == null) {   // 直接绘制到屏幕
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

/* =====================================================================
 *  帧缓冲 / 纹理管理
 * ===================================================================== */
function createFBO(w, h, type, param) {
  var texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);

  var fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  return {
    texture: texture, fbo: fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach: function (id) {   // 绑定到纹理单元 id 并返回单元号
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    }
  };
}
function destroyFBO(f) {
  if (!f) return;
  gl.deleteTexture(f.texture);
  gl.deleteFramebuffer(f.fbo);
}
/* 双缓冲 FBO：read/write 交替，避免读写同一纹理 */
function createDoubleFBO(w, h, type, param) {
  var fbo1 = createFBO(w, h, type, param);
  var fbo2 = createFBO(w, h, type, param);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read()  { return fbo1; },
    set read(v) { fbo1 = v; },
    get write() { return fbo2; },
    set write(v){ fbo2 = v; },
    swap: function () { var t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}
function destroyDoubleFBO(f) {
  if (!f) return;
  destroyFBO(f.read);
  destroyFBO(f.write);
}
/* 尺寸变化时通过 copy pass 保留旧内容 */
function resizeFBO(target, w, h, type, param) {
  var newFBO = createFBO(w, h, type, param);
  copyProgram.bind();
  gl.uniform1i(copyProgram.uniforms.uTexture, target.attach(0));
  blit(newFBO);
  destroyFBO(target);
  return newFBO;
}
function resizeDoubleFBO(target, w, h, type, param) {
  if (target.width === w && target.height === h) return target;
  target.read = resizeFBO(target.read, w, h, type, param);
  destroyFBO(target.write);
  target.write = createFBO(w, h, type, param);
  target.width = w; target.height = h;
  target.texelSizeX = 1 / w; target.texelSizeY = 1 / h;
  return target;
}
/* 依据画布宽高比计算网格分辨率（短边取设定值，长边按比例放大） */
function getResolution(resolution) {
  var aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspectRatio < 1) aspectRatio = 1 / aspectRatio;
  var min = Math.round(resolution);
  var max = Math.round(resolution * aspectRatio);
  if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
  return { width: min, height: max };
}

var dye, velocity, divergence, curl, pressure;
function initFramebuffers() {
  var simRes = getResolution(config.SIM_RESOLUTION);
  var dyeRes = getResolution(config.DYE_RESOLUTION);

  if (!dye)      dye      = createDoubleFBO(dyeRes.width, dyeRes.height, ext.texType, filtering);
  else           dye      = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, ext.texType, filtering);
  if (!velocity) velocity = createDoubleFBO(simRes.width, simRes.height, ext.texType, filtering);
  else           velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, ext.texType, filtering);

  // 瞬时缓冲：散度、涡量、压力（直接重建即可）
  destroyFBO(divergence);
  destroyFBO(curl);
  destroyDoubleFBO(pressure);
  divergence = createFBO(simRes.width, simRes.height, ext.texType, gl.NEAREST);
  curl       = createFBO(simRes.width, simRes.height, ext.texType, gl.NEAREST);
  pressure   = createDoubleFBO(simRes.width, simRes.height, ext.texType, gl.NEAREST);
}

/* ---------------- 画布尺寸自适应（含 devicePixelRatio，上限 2） ---------------- */
function resizeCanvas() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var width  = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  var height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    return true;
  }
  return false;
}

/* =====================================================================
 *  模拟核心：每个 pass 的执行顺序即 Navier-Stokes 求解流程
 * ===================================================================== */
function step(dt) {
  gl.disable(gl.BLEND);

  /* Pass 1 · curl：计算速度场涡量 */
  curlProgram.bind();
  gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  /* Pass 2 · vorticity confinement：涡量约束，放大漩涡细节 */
  vorticityProgram.bind();
  gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProgram.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  /* Pass 3 · divergence：计算速度场散度 */
  divergenceProgram.bind();
  gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  /* Pass 4 · clear：衰减上一帧残留压力，防止累积 */
  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
  blit(pressure.write);
  pressure.swap();

  /* Pass 5 · pressure Jacobi：迭代求解泊松方程（25 次） */
  pressureProgram.bind();
  gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
  for (var i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  /* Pass 6 · gradient subtract：减去压力梯度 → 不可压缩速度场 */
  gradientSubtractProgram.bind();
  gl.uniform2f(gradientSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(gradientSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradientSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  /* Pass 7 · velocity advection：速度场自平流（半拉格朗日） */
  advectionProgram.bind();
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (MANUAL_FILTERING) {
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  }
  var velocityId = velocity.read.attach(0);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
  gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
  gl.uniform1f(advectionProgram.uniforms.dt, dt);
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  /* Pass 8 · dye advection：染料随速度场平流并轻微消散 */
  if (MANUAL_FILTERING) {
    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  }
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
  blit(dye.write);
  dye.swap();
}

/* 显示 pass：染料渲染到屏幕（带柔和光照） */
function render() {
  displayProgram.bind();
  gl.uniform2f(displayProgram.uniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
  blit(null);
}

/* ---------------- splat：注入速度与染料 ---------------- */
function correctRadius(radius) {
  var aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) radius *= aspectRatio;
  return radius;
}
function splat(x, y, dx, dy, color, radiusScale) {
  var r = correctRadius(config.SPLAT_RADIUS / 100.0 * (radiusScale || 1.0));
  splatProgram.bind();
  gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatProgram.uniforms.point, x, y);
  gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);   // 速度冲量
  gl.uniform1f(splatProgram.uniforms.radius, r);
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);  // 染料
  blit(dye.write);
  dye.swap();
}

/* ---------------- 颜色：HSL 色相缓慢循环 ---------------- */
var hue = Math.random();   // 起始色相随机
function HSVtoRGB(h, s, v) {
  var r, g, b;
  var i = Math.floor(h * 6);
  var f = h * 6 - i;
  var p = v * (1 - s);
  var q = v * (1 - f * s);
  var t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    default: r = v; g = p; b = q; break;
  }
  return { r: r, g: g, b: b };
}
function generateColor() {
  var h = (hue + (Math.random() - 0.5) * 0.1 + 1) % 1;   // 色相附近微抖动
  var c = HSVtoRGB(h, 1.0, 1.0);
  c.r *= 0.16; c.g *= 0.16; c.b *= 0.16;   // 控制基础注入浓度
  return c;
}

/* ---------------- 随机喷发 ---------------- */
function randomSplat(colorScale, force) {
  var color = generateColor();
  color.r *= colorScale; color.g *= colorScale; color.b *= colorScale;
  splat(Math.random(), Math.random(),
        force * (Math.random() - 0.5), force * (Math.random() - 0.5),
        color, 0.8 + Math.random() * 0.8);
}
function multipleSplats(amount) {
  for (var i = 0; i < amount; i++) randomSplat(6.0, 1000);
}

/* ---------------- 指针（鼠标 + 触摸，支持多点） ---------------- */
function Pointer() {
  this.id = -1; this.down = false; this.moved = false;
  this.texcoordX = 0; this.texcoordY = 0;
  this.prevTexcoordX = 0; this.prevTexcoordY = 0;
  this.deltaX = 0; this.deltaY = 0;
  this.color = { r: 0.1, g: 0.1, b: 0.1 };
}
var pointers = [new Pointer()];   // pointers[0] 为鼠标

function getPointer(id) {
  if (id === -1) return pointers[0];
  for (var i = 1; i < pointers.length; i++) {
    if (pointers[i].id === id) return pointers[i];
  }
  var p = new Pointer();
  p.id = id;
  pointers.push(p);
  return p;
}
function correctDeltaX(delta) {
  var aspectRatio = canvas.width / canvas.height;
  if (aspectRatio < 1) delta *= aspectRatio;
  return delta;
}
function correctDeltaY(delta) {
  var aspectRatio = canvas.width / canvas.height;
  if (aspectRatio > 1) delta /= aspectRatio;
  return delta;
}

var lastInteraction = performance.now();
var nextAutoTime = 0;

function onPointerDown(x, y, id) {
  var p = getPointer(id);
  p.down = true;
  p.moved = false;
  p.texcoordX = x / canvas.clientWidth;
  p.texcoordY = 1 - y / canvas.clientHeight;
  p.prevTexcoordX = p.texcoordX;
  p.prevTexcoordY = p.texcoordY;
  p.deltaX = 0;
  p.deltaY = 0;
  p.color = generateColor();
  lastInteraction = performance.now();
  /* 点击画布：立即产生一次彩色 splat */
  var c = { r: p.color.r * 5, g: p.color.g * 5, b: p.color.b * 5 };
  splat(p.texcoordX, p.texcoordY,
        (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, c, 1.6);
}
function onPointerMove(x, y, id) {
  var p = getPointer(id);
  if (!p.down) return;   // 仅按下拖拽时注入
  p.prevTexcoordX = p.texcoordX;
  p.prevTexcoordY = p.texcoordY;
  p.texcoordX = x / canvas.clientWidth;
  p.texcoordY = 1 - y / canvas.clientHeight;
  /* 速度按指针位移差计算（做宽高比修正） */
  p.deltaX = correctDeltaX(p.texcoordX - p.prevTexcoordX);
  p.deltaY = correctDeltaY(p.texcoordY - p.prevTexcoordY);
  p.moved = Math.abs(p.deltaX) > 0 || Math.abs(p.deltaY) > 0;
  lastInteraction = performance.now();
}
function onPointerUp(id) {
  var p = getPointer(id);
  p.down = false;
}
function splatPointer(p) {
  var dx = p.deltaX * config.SPLAT_FORCE;
  var dy = p.deltaY * config.SPLAT_FORCE;
  splat(p.texcoordX, p.texcoordY, dx, dy, p.color);
}
function applyInputs() {
  for (var i = 0; i < pointers.length; i++) {
    var p = pointers[i];
    if (p.moved) {
      p.moved = false;
      splatPointer(p);
    }
  }
}

/* 鼠标事件 */
canvas.addEventListener('mousedown', function (e) {
  onPointerDown(e.clientX, e.clientY, -1);
});
window.addEventListener('mousemove', function (e) {
  onPointerMove(e.clientX, e.clientY, -1);
});
window.addEventListener('mouseup', function () {
  onPointerUp(-1);
});

/* 触摸事件（支持多点触控） */
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  var touches = e.targetTouches;
  for (var i = 0; i < touches.length; i++) {
    onPointerDown(touches[i].clientX, touches[i].clientY, touches[i].identifier);
  }
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  var touches = e.targetTouches;
  for (var i = 0; i < touches.length; i++) {
    onPointerMove(touches[i].clientX, touches[i].clientY, touches[i].identifier);
  }
}, { passive: false });
window.addEventListener('touchend', function (e) {
  var touches = e.changedTouches;
  for (var i = 0; i < touches.length; i++) onPointerUp(touches[i].identifier);
});
window.addEventListener('touchcancel', function (e) {
  var touches = e.changedTouches;
  for (var i = 0; i < touches.length; i++) onPointerUp(touches[i].identifier);
});

/* ---------------- UI：面板与遮罩 ---------------- */
function bindSlider(id, valId, key, isFloat) {
  var slider = document.getElementById(id);
  var valEl = document.getElementById(valId);
  slider.addEventListener('input', function () {
    var v = parseFloat(slider.value);
    config[key] = v;
    valEl.textContent = isFloat ? v.toFixed(1) : String(Math.round(v));
  });
}
bindSlider('sCurl', 'vCurl', 'CURL', false);
bindSlider('sDye', 'vDye', 'DENSITY_DISSIPATION', true);
bindSlider('sVel', 'vVel', 'VELOCITY_DISSIPATION', true);

document.getElementById('btnBurst').addEventListener('click', function () {
  multipleSplats(5 + Math.floor(Math.random() * 4));
  lastInteraction = performance.now();
});
document.getElementById('btnClear').addEventListener('click', function () {
  /* 清空染料：直接清空染料双缓冲 */
  [dye.read, dye.write].forEach(function (f) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, f.fbo);
    gl.viewport(0, 0, f.width, f.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  });
});
document.getElementById('btnStart').addEventListener('click', function () {
  overlay.classList.add('hidden');
  lastInteraction = performance.now();
  /* 开场彩色喷发，保证一打开就好看 */
  multipleSplats(8 + Math.floor(Math.random() * 6));
});

/* ---------------- FPS 统计 ---------------- */
var fpsFrames = 0;
var fpsLast = performance.now();
function updateFPS(now) {
  fpsFrames++;
  if (now - fpsLast >= 500) {
    fpsEl.textContent = String(Math.round(fpsFrames * 1000 / (now - fpsLast)));
    fpsFrames = 0;
    fpsLast = now;
  }
}

/* ---------------- 主循环 ---------------- */
resizeCanvas();
initFramebuffers();

var lastTime = performance.now();
function update() {
  var now = performance.now();
  var dt = Math.min((now - lastTime) / 1000, 1 / 60);   // 限制 dt，防止掉帧爆炸
  lastTime = now;

  if (resizeCanvas()) initFramebuffers();   // 窗口变化时重建/缩放 FBO

  hue = (hue + dt * 0.06) % 1;              // 色相缓慢循环

  applyInputs();                            // 处理指针注入

  /* 空闲 3 秒后自动随机喷发彩色墨水 */
  if (now - lastInteraction > config.IDLE_DELAY && now >= nextAutoTime) {
    nextAutoTime = now + 900 + Math.random() * 1200;
    randomSplat(3.5, 700);
    if (Math.random() < 0.4) randomSplat(3.5, 700);
  }

  step(dt);      // 流体求解
  render();      // 屏幕绘制
  updateFPS(now);

  requestAnimationFrame(update);
}
/* 循环延迟启动：开场遮罩关闭后才开始渲染，避免遮罩期高负载重绘 */
(function(){var __fn=update;function __boot(){var ovx=document.getElementById("overlay")||document.getElementById("intro");var gone=!ovx||ovx.classList.contains("hidden")||ovx.classList.contains("hide")||ovx.classList.contains("gone")||ovx.style.display==="none";if(gone){requestAnimationFrame(__fn);}else{setTimeout(__boot,150);}}__boot();})();

})();
</script>
