mirror`,attr:`装备后攻击+27，速度+10（战斗中生效）`,lore:`昆仑之巅的玄光镜，可照见万物本源，洞悉真假。`,flavor:`照妖照鬼照人心。照完你就想出家。`},xuanyuan_sword:{name:`人皇剑`,icon:`⚔️`,rarity:`仙品`,weapon:`xuanyuan_sword`,attr:`装备后攻击+29（战斗中生效）`,lore:`人皇佩剑，剑身刻着人族兴衰，剑出万民俯首。`,flavor:`好剑，就是太沉。你拄着它像拄拐。`},creation_jade:{name:`道源玉碟`,icon:`💿`,rarity:`仙品`,weapon:`creation_jade`,attr:`装备后攻击+30（战斗中生效）`,lore:`道之源头凝成的玉碟，内含大道三千，纹理天成。`,flavor:`拿在手里悟道三天，悟出来一个"饿"字。`},golden_mother_blade:{name:`蝶影双生刃`,icon:`🦋`,rarity:`仙品`,weapon:`golden_mother_blade`,attr:`装备后攻击+25，速度+12（战斗中生效）`,lore:`双刃如蝶翼，一阴一阳，合则一体，分则双杀。`,flavor:`双刃分开时像两把菜刀。你总怕切菜切到手。`},palm_sky_bottle:{name:`纳天瓶`,icon:`🍾`,rarity:`仙品`,weapon:`palm_sky_bottle`,attr:`装备后攻击+24（战斗中生效）`,lore:`瓶口如天，可纳万物，收尽乾坤于方寸之间。`,flavor:`瓶盖找不到了。现在只能当花瓶。`},wooden_flute:{name:`竹笛`,icon:`🪈`,rarity:`普通`,weapon:`wooden_flute`,attr:`装备后攻击+3（战斗中生效）`,lore:`路边卖艺人留下的竹笛，笛孔磨得圆润，音色清亮。`,flavor:`吹起来能引鸟。引来的乌鸦追着你啄了三里地。`},iron_ring:{name:`铁指环`,icon:`💍`,rarity:`普通`,weapon:`iron_ring`,attr:`装备后攻击+3（战斗中生效）`,lore:`无名铁匠铺打的铁指环，套在手上沉甸甸的，没有任何花纹。`,flavor:`戴久了手指发绿。不是中毒，是掉色。`},cloth_banner:{name:`布幡`,icon:`🚩`,rarity:`普通`,weapon:`cloth_banner`,attr:`装备后攻击+2（战斗中生效）`,lore:`江湖郎中的布幡，写着"妙手回春"四个褪色大字，旗杆都裂了。`,flavor:`幡在人在，幡亡人亡——你主要是怕招牌砸了。`},stone_hammer:{name:`石锤`,icon:`🔨`,rarity:`普通`,weapon:`stone_hammer`,attr:`装备后攻击+4（战斗中生效）`,lore:`采石场用的石锤，锤头比脑袋还大，抡起来地动山摇。`,flavor:`一锤子下去山都要抖三抖。可惜准头随缘，砸中什么算缘分。`},iron_needle:{name:`铁针`,icon:`📌`,rarity:`普通`,weapon:`iron_needle`,attr:`装备后攻击+3（战斗中生效）`,lore:`缝衣铺的粗铁针，有筷子那么长，能缝皮甲。`,flavor:`绣花是不行了，扎人倒是挺利索的。`},jade_flute:{name:`玉笛`,icon:`🪈`,rarity:`稀有`,weapon:`jade_flute`,attr:`装备后攻击+6（战斗中生效）`,lore:`青玉所制，吹奏时音色清越，可慑心魄，乱敌心神。`,flavor:`你吹起来像杀鸡。敌人没被慑住，先被你吓跑了。`},copper_mirror:{name:`铜镜`,icon:`🪞`,rarity:`稀有`,weapon:`copper_mirror`,attr:`装备后攻击+6（战斗中生效）`,lore:`青铜古镜，镜面模糊，却能照出灵气流动的轨迹。`,flavor:`照人不照心。你照了半天，只看见自己胡子拉碴。`},iron_brush:{name:`判官笔`,icon:`🖊️`,rarity:`稀有`,weapon:`iron_brush`,attr:`装备后攻击+7（战斗中生效）`,lore:`判官笔，笔杆铁铸，笔尖蘸朱砂可书符箓，断人生死。`,flavor:`一笔定生死。你用它写过最多的字是"欠条"。`},turtle_plate:{name:`龟甲`,icon:`🐢`,rarity:`稀有`,weapon:`turtle_plate`,attr:`装备后攻击+5（战斗中生效）`,lore:`占卜用的龟甲，裂纹里藏着天机，灼烤后纹路显现。`,flavor:`算卦十次九不准。准的那次还是蒙的。`},bamboo_gun:{name:`竹筒炮`,icon:`🧨`,rarity:`稀有`,weapon:`bamboo_gun`,attr:`装备后攻击+7（战斗中生效）`,lore:`竹筒里塞上火药铁砂的粗制火器，轰的一声威力不俗。`,flavor:`一炮出去后坐力把你撂倒。敌人笑完才挨打。`},silver_whip:{name:`银鞭`,icon:`🪢`,rarity:`稀有`,weapon:`silver_whip`,attr:`装备后攻击+7（战斗中生效）`,lore:`银丝绞成的软鞭，鞭梢带倒刺，抽人一道血印。`,flavor:`耍起来啪啪响，气势十足。就是总抽到自己。`},zither_sword:{name:`瑶琴剑`,icon:`🎼`,rarity:`史诗`,weapon:`zither_sword`,attr:`装备后攻击+10（战斗中生效）`,lore:`琴剑合一，剑出如琴鸣，剑势如流水。`,flavor:`对敌时剑气如琴音袅袅。好听，但对手没心情欣赏。`},bronze_ding:{name:`青铜鼎`,icon:`🏺`,rarity:`史诗`,weapon:`bronze_ding`,attr:`装备后攻击+11（战斗中生效）`,lore:`祭祀用的青铜鼎，鼎身刻满古老铭文，鼎足厚重。`,flavor:`鼎口朝上能接雨。你怀疑它前身是个水缸。`},peach_sword:{name:`桃木剑`,icon:`🌳`,rarity:`史诗`,weapon:`peach_sword`,attr:`装备后攻击+10（战斗中生效）`,lore:`百年桃木削成，桃木辟邪，专克魑魅魍魉。`,flavor:`对妖鬼奇效。对人嘛，还不如烧火棍。`},iron_bell:{name:`镇魂铃`,icon:`🔔`,rarity:`史诗`,weapon:`iron_bell`,attr:`装备后攻击+9（战斗中生效）`,lore:`摄魂铃，铃响摄魂夺魄，铃身漆黑。`,flavor:`摇一下对面呆住，再摇一下自己也呆住了——后坐力。`},moon_fan:{name:`月光扇`,icon:`🌙`,rarity:`史诗`,weapon:`moon_fan`,attr:`装备后攻击+10（战斗中生效）`,lore:`扇面绣着月宫图，轻摇时有月华流转，凉风习习。`,flavor:`扇出来的风是凉的，夏天纳凉神器。打架就算了。`},thunder_axe:{name:`雷斧`,icon:`🪓`,rarity:`史诗`,weapon:`thunder_axe`,attr:`装备后攻击+12（战斗中生效）`,lore:`雷击木为柄，陨铁为刃，挥动时隐有雷声滚滚。`,flavor:`一斧子下去自带音效。比雷公还敬业。`},star_seal:{name:`星辰印`,icon:`⭐`,rarity:`传说`,weapon:`star_seal`,attr:`装备后攻击+16（战斗中生效）`,lore:`以星辰之力铸成的大印，印下有星河倒悬。`,flavor:`砸下去星光四溅。砸完手也麻了。`},moon_mirror:{name:`月华镜`,icon:`🪞`,rarity:`传说`,weapon:`moon_mirror`,attr:`装备后攻击+15（战斗中生效）`,lore:`月华凝成的宝镜，映照人间悲欢，镜中自有天地。`,flavor:`镜子里的你比现实好看。你信了，然后更不想出门了。`},heaven_sword:{name:`天罡剑`,icon:`☄️`,rarity:`传说`,weapon:`heaven_sword`,attr:`装备后攻击+17（战斗中生效）`,lore:`三十六天罡之力灌入的剑，剑出有罡风相随，正气凛然。`,flavor:`罡风太猛，出剑前记得捂紧头发。`},earth_seal:{name:`地煞印`,icon:`🪨`,rarity:`传说`,weapon:`earth_seal`,attr:`装备后攻击+16（战斗中生效）`,lore:`七十二地煞之精凝成的大印，印落地动山摇。`,flavor:`印太重。你怀疑它里面是实心的。`},phoenix_zither:{name:`凤鸣琴`,icon:`🎵`,rarity:`传说`,weapon:`phoenix_zither`,attr:`装备后攻击+15，速度+8（战斗中生效）`,lore:`凤栖之木制成的琴，琴声可引来百鸟，绕梁三日。`,flavor:`弹得好是百鸟朝凤。弹不好是群鸦乱叫。`},dragon_whip:{name:`缚龙索`,icon:`⛓️`,rarity:`传说`,weapon:`dragon_whip`,attr:`装备后攻击+16（战斗中生效）`,lore:`缚龙索，曾缚过真龙的绳索，鞭梢有龙鳞光泽。`,flavor:`绑龙是传说。绑鸡倒是挺好用。`},heaven_seal:{name:`天道印`,icon:`☯️`,rarity:`仙品`,weapon:`heaven_seal`,attr:`装备后攻击+24（战斗中生效）`,lore:`天道法则凝成的印，印出天地同力，万物俯首。`,flavor:`用一次天都要变脸。你有点心疼天气。`},soul_bell:{name:`镇魂钟`,icon:`🔔`,rarity:`仙品`,weapon:`soul_bell`,attr:`装备后攻击+23（战斗中生效）`,lore:`镇魂钟，钟声可镇一切魑魅魍魉，魂归则安。`,flavor:`钟是好钟。就是名字撞了，隔壁的传说钟表示抗议。`},chaos_fan:{name:`混沌扇`,icon:`🌪️`,rarity:`仙品`,weapon:`chaos_fan`,attr:`装备后攻击+25（战斗中生效）`,lore:`混沌之气凝成的扇，一扇风云变色，二扇天地失序。`,flavor:`扇一下飞沙走石。扇完你灰头土脸，像刚从土里刨出来。`},space_mirror:{name:`虚空镜`,icon:`🪞`,rarity:`仙品`,weapon:`space_mirror`,attr:`装备后攻击+24，速度+12（战斗中生效）`,lore:`虚空之镜，可映照时空裂缝，窥见过去未来。`,flavor:`照镜子能看见昨天的自己。吓一跳。`},life_brush:{name:`生死笔`,icon:`🖌️`,rarity:`仙品`,weapon:`life_brush`,attr:`装备后攻击+23（战斗中生效）`,lore:`一笔判生死的仙笔，笔尖朱红如血，落笔定命。`,flavor:`写'生'字敌人复活，写'死'字敌人躺下——你总写反。`},god_hammer:{name:`开天锤`,icon:`🔨`,rarity:`仙品`,weapon:`god_hammer`,attr:`装备后攻击+26（战斗中生效）`,lore:`开天辟地时遗留的锤，一锤可裂天地，锤面混沌纹路。`,flavor:`锤子重得离谱。你举起来像举一座山，举完瘫三天。`},xian_zither:{name:`九霄琴`,icon:`🎼`,rarity:`仙品`,weapon:`xian_zither`,attr:`装备后攻击+25（战斗中生效）`,lore:`九霄之木制成的琴，琴音可穿九霄，弦动风云随。`,flavor:`弹奏时雷声滚滚，像在渡劫。邻居都以为你要飞升了。`},bamboo_sword2:{name:`竹节剑`,icon:`🎍`,rarity:`普通`,weapon:`bamboo_sword2`,attr:`装备后攻击+3（战斗中生效）`,lore:`一根带节的青竹，削尖了就当剑使，竹节还硌手。`,flavor:`用起来咯吱响，你总担心它打到一半散架。`},stone_mallet:{name:`石锤`,icon:`🔨`,rarity:`普通`,weapon:`stone_mallet`,attr:`装备后攻击+4（战斗中生效）`,lore:`打铁匠练臂力的石锤，掂着比想象中沉，锤面磨得光滑。`,flavor:`名字和石锤撞了，铁匠说他也妹想到，反正都能砸人。`},iron_cane:{name:`铁拐`,icon:`🦯`,rarity:`普通`,weapon:`iron_cane`,attr:`装备后攻击+3（战斗中生效）`,lore:`老乞丐的铁拐杖，拄了半辈子，弯得恰到好处。`,flavor:`拐杖一拄，方圆十里的狗都认识你了。`},wooden_fish:{name:`木鱼`,icon:`🥁`,rarity:`普通`,weapon:`wooden_fish`,attr:`装备后攻击+2（战斗中生效）`,lore:`小庙里的木鱼，被敲出了包浆，声音浑厚。`,flavor:`敲木鱼能静心。但隔壁的和尚先静不了了。`},cangyan_sword:{name:`苍岩剑`,icon:`🪨`,rarity:`稀有`,weapon:`cangyan_sword`,attr:`装备后攻击+8（战斗中生效）`,lore:`以苍山青岩炼成，剑身灰扑扑的毫不起眼，却重逾寻常。`,flavor:`看着像块磨刀石成了精。但劈下去是真结实。`},qingfeng_sword:{name:`清风剑`,icon:`🍃`,rarity:`稀有` 都得自己挣。`,story:`你记不清自己从哪来，只记得一路向北，看过太多山门不纳的冷眼。散修的路难走，但你习惯了——天地为庐，何必看人脸色。`,stones:150,dao:50,fortune:50,cult:20,flags:[`loose_cult`],affinity:`wind`},{id:`fallen`,name:`魔道弃徒`,icon:`🌑`,desc:`出身魔门，却背离宗门。身怀魔道功法，正道视你为眼中钉。`,story:`魔窟里的日子你一天也不想再回忆。你偷了门中秘典逃出来，背后是追杀令，面前是正道修士的冷眼。但活着，总比死了强。`,stones:200,dao:40,fortune:30,cult:50,karma:15,flags:[`demon_born`],affinity:`blood`},{id:`warrior`,name:`凡尘武夫`,icon:`⚔️`,desc:`江湖武者误入仙途。根骨强健，寿元绵长，但仙缘浅薄。`,story:`你在江湖上打了一辈子铁拳，见过太多贪嗔痴。直到那夜你替人挡了一刀，刀光里却浮现一行小字——引气入体，可延寿三百。`,stones:100,dao:60,fortune:25,cult:10,flags:[`mortal_martial`],affinity:`defense`,maxLifeBonus:40},{id:`scholar`,name:`落魄书生`,icon:`📜`,desc:`寒窗苦读却屡试不第。转修文道，出口成章，洞察人心。`,story:`十年寒窗，换不来一张榜文。你在破庙里烧了最后一卷书，灰烬里却浮起一篇《长生赋》。原来这世间，还有另一种功名。`,stones:120,dao:50,fortune:35,cult:15,flags:[`scholar`],affinity:`alchemy`,intelligenceBonus:3},{id:`merchant`,name:`富商之子`,icon:`💰`,desc:`家财万贯，灵石不愁。但娇生惯养，道心易浮。`,story:`你爹把半条商路都给了你，说钱能通神。你拿着满袋灵石进了坊市，老掌柜却摇头：小公子，修仙修的是心，不是钱。`,stones:600,dao:45,fortune:45,cult:10,flags:[`rich_son`],affinity:`market`},{id:`hunter`,name:`猎妖人`,icon:`🏹`,desc:`祖传猎妖，与妖搏杀半生。身法敏捷，洞察妖气，出手狠辣。`,story:`你爹死在妖爪下，你娘死在妖毒里。你把祖传的猎妖弓背了十年，猎过的妖比见过的活人还多。直到那天，你猎到一只会说人话的妖。`,stones:180,dao:50,fortune:30,cult:25,flags:[`beast_hunter`],affinity:`bow`,intelligenceBonus:2,maxLifeBonus:20},{id:`alchemist`,name:`丹房药童`,icon:`⚗️`,desc:`从小在丹房打杂，闻着药香长大。懂药理，识灵草，炼丹事半功倍。`,story:`丹房的老丹师捡到你时，你正趴在一堆灵草里啃。他说你这娃子生来就带着药香，是丹道的命。你一住就是十五年，把丹方背得比自己的名字还熟。`,stones:250,dao:55,fortune:35,cult:25,flags:[`pill_child`],affinity:`alchemy`,alchemyBonus:15},{id:`swordheir`,name:`剑冢传人`,icon:`🗡️`,desc:`上古剑冢的守墓人后代，与万剑为伴。剑心通明，杀伐果断。`,story:`剑冢里埋着十万把剑，你从小听它们的剑鸣入睡。老守墓人说，剑冢之主当年一剑劈开天河，留下传承等你来取。你伸手，握住了第一把剑。`,stones:150,dao:50,fortune:40,cult:30,flags:[`sword_heir`],affinity:`sword`,combatBonus:4},{id:`heavensent`,name:`天眷之人`,icon:`🌟`,desc:`生来气运加身，走路都能踩到灵宝。但福兮祸所伏，窥天者多遭天妒。`,story:`你出生那夜，满天星斗聚成一条龙脉。路过的老道士掐指一算，当场吓得摔了个跟头——他说你这命格，不是大福就是大祸。果然，你三岁捡到储物戒，五岁被灵兽认主，十岁那年，天劫劈了你家祖宅。`,stones:200,dao:55,fortune:80,cult:20,flags:[`heaven_blessed`],affinity:`chaos`,maxLifeBonus:10},{id:`reborn`,name:`轮回残魂`,icon:`🌀`,desc:`上一世渡劫失败，残魂转世。带着前世记忆碎片，识得因果，通晓劫难。`,story:`你梦见自己在九重天劫里灰飞烟灭，然后惊醒在一具陌生的身体里。残魂里还留着前世的部分记忆——丹方、剑诀、还有那个害你渡劫失败的仇人的脸。这一世，你打算活明白点。`,stones:220,dao:65,fortune:30,cult:35,flags:[`reborn_soul`],affinity:`void`,intelligenceBonus:3},{id:`fisherman`,name:`渔家子`,icon:`🛶`,desc:`生在江上渔家，能听懂水的话。水性极佳，寿元绵长，仙缘却浅。`,story:`你爹打了一辈子鱼，说江里有龙。你从小泡在水里长大，能闭气一盏茶，听得懂鱼群说话。直到那日撒网，捞起一块会发光的石头——江底的老龟浮上来，开口叫你跟它走。`,stones:150,dao:50,fortune:40,cult:15,flags:[`river_child`],affinity:`defense`,maxLifeBonus:25},{id:`smith`,name:`铁匠遗孤`,icon:`🔨`,desc:`父亲是凡人铁匠，却打出过仙人也想要的兵器。你继承了他的手艺，也继承了他的执念。`,story:`你爹一辈子没修仙，他说铁就是他的道。他临终前打了一炉子剑坯，说等你长大就知道拿去给谁。炉火映着你爹的遗像，你把铁锤握得生疼——这世间，总得有人打铁。`,stones:160,dao:55,fortune:30,cult:25,flags:[`smith_child`],affinity:`defense`,constitutionBonus:2},{id:`musician`,name:`市井乐师`,icon:`🪈`,desc:`出身勾栏瓦舍，一曲动人心魄。口才了得，人脉广阔，但世人都当你下九流。`,story:`你在戏班长大，三岁登台，十岁一曲《凤求凰》唱得满城姑娘红了脸。老班主临终说：你这嗓子，不该只唱给凡夫俗子听。后来你在月下吹笛，竟引来一只白鹤——它衔来一枚玉简，落在你掌心。`,stones:120,dao:52,fortune:45,cult:18,flags:[`musician`],affinity:`wind`,appearanceBonus:2},{id:`deathguard`,name:`死士遗刃`,icon:`🩸`,desc:`从小被当作杀人刀培养，刀口舔血。身法狠辣，出手无情，但满身业力，命如悬丝。`,story:`你记事起就在练刀，练不好就挨饿。主家养你十五年，就为让你替他杀一个人。刀出鞘那夜你忽然想：凭什么。你反手砍了主家，带着一身伤逃进山里——追兵在后，前路未卜，但你头一次觉得，刀是自己的。`,stones:100,dao:42,fortune:20,cult:40,karma:10,flags:[`death_guard`],affinity:`attack`,combatBonus:3,speedBonus:2},{id:`formationchild`,name:`阵道学徒`,icon:`🧮`,desc:`拜师阵道宗师，日夜演算。通晓阵法奥妙，悟性超群，但动手打架就差些火候。`,story:`你师父是名震一方的阵痴，一辈子只收了你一个徒弟，因为只有你能陪他三天三夜不睡觉推演一个阵眼。他说阵道即天道，你信了。师父坐化那日，把毕生阵图都留给了你——那是他算了一辈子的东西，重得像一座山。`,stones:180,dao:58,fortune:35,cult:22,flags:[`formation_child`],affinity:`void`,intelligenceBonus:2}],Pe={wild:{label:`荒野`,rare:[{text:`你在一处隐蔽石缝里发现前人洞府，搜得灵石与功法残页。`,give:{stones:80,ancient_scroll:1},dao:3},{text:`枯木逢春，你发现一株千年灵芝，药香扑鼻。`,give:{spirit_herb:2},cult:30},{text:`山涧雾气中，一朵青色火苗悬于水面——竟是天地灵火！`,give:{fire_qinglian:1},dao:3},{text:`你在一株枯松下发现一枚寿元果，果香醉人。`,give:{shouyuan_guo:1}},{text:`猎人废弃的陷阱里，你捡到一枚温热的蛋——像是灵兽蛋！`,give:{egg_fox:1}},{text:`破庙墙上贴着一张泛黄的符箓， el:`摇头走开`,text:`你总觉得这摊子透着古怪，还是少惹为妙。`}]},{id:`sect_task`,type:`sect`,title:`宗门任务`,text:`宗门任务殿贴出新榜：剿灭黑风寨作乱的妖兽，赏灵石三百、贡献一百。同门师兄弟都在观望。`,condition:e=>e.realmIdx>=1,redraw:3,options:[{label:`接下任务`,check:{attr:`combat`,diff:`hard`},success:{stones:300,dao:3,karma:1,flag:`sect_merit`,text:`你斩杀妖兽，提着妖丹回宗复命。长老赞许地点头，同门看你的眼神也多了几分敬意。`},failure:{life:-10,dao:-2,text:`妖兽比传闻中凶猛得多，你负伤逃回，还被人笑话。`}},{label:`让给师兄去做`,dao:-1,text:`你把机会让给了急需贡献的师兄。他感激地拍拍你肩膀，但你知道自己错过了一次历练。`}]},{id:`sect_disciple`,type:`sect`,title:`新入门的小师弟`,text:`一个十四五岁的小师弟在练功场上笨拙地打着一套入门拳法，围观的弟子都在窃笑。他看到你，涨红了脸。`,condition:e=>!0,redraw:6,options:[{label:`上前指点一二`,dao:3,flag:`helped_disciple`,text:`你指出他拳法中的几处破绽。他眼睛亮晶晶地谢你，认真记下每一个字。`},{label:`也笑一笑走开`,dao:-1,text:`你跟着笑了笑。走了几步，又觉得那孩子眼里的光暗了一瞬。`}]},{id:`secret_pagoda`,type:`secret`,title:`镇魔塔`,text:`秘境深处矗立着一座古塔，塔门半开，幽黑的塔内传来锁链拖动的声响。塔身铭文记载：塔下镇压着一头千年魔物。`,condition:e=>e.realmIdx>=3,redraw:10,options:[{label:`踏入塔内`,check:{attr:`combat`,diff:`deadly`},success:{dao:8,karma:-5,stones:500,flag:`sealed_demon`,text:`你在塔底找到封印阵眼，修补了松动处。魔物的嘶吼渐渐平息，你感到天道似乎记住了你的善举。`},failure:{life:-20,dao:-6,flag:`demon_whisper`,text:`魔物的一声低语击穿你的心神，你口吐鲜血逃出塔外。那声音还在你脑海里回荡。`}},{label:`绕塔而行`,dao:1,text:`你绕着古塔走了一圈，记下铭文。塔，还是别进的好。`}]},{id:`secret_elixir_pool`,type:`secret`,title:`灵泉`,text:`秘境中一泓灵泉汩汩流淌，泉水泛着淡淡的碧色，灵气几乎凝成实质。泉底似乎沉着什么东西。`,condition:e=>e.realmIdx>=1,redraw:8,options:[{label:`饮一口灵泉`,life:10,dao:2,flag:`drank_spring`,text:`泉水入腹，一股暖流游走四肢百骸，你感觉寿元都延长了些。`},{label:`潜入泉底查看`,check:{attr:`combat`,diff:`hard`},success:{stones:300,pills:2,flag:`found_spring_heart`,text:`泉底竟卧着一颗灵泉之心，你将其收入囊中。`},failure:{life:-8,text:`泉底暗流汹涌，你被冲得七荤八素，差点溺毙。`}}]},{id:`town_scholar`,type:`town`,title:`落魄书生`,text:`镇口酒肆里，一个书生借酒浇愁，桌上摊着一卷残缺的古书。他见你进来，苦笑：「这位仙长，可识得这古卷上的字？」`,condition:e=>!0,redraw:7,options:[{label:`接过古卷细看`,check:{attr:`intelligence`,diff:`normal`},success:{dao:4,stones:100,flag:`read_ancient_scroll`,text:`古卷残页竟是一门上古术法的注疏。你默记于心，又给了书生一些银两。`},failure:{text:`你看了半天，认出几个字，却连不成句。书生叹口气，又饮一杯。`}},{label:`买下古卷`,cost:{stones:100},give:`ancient_scroll`,dao:2,flag:`bought_scroll`,text:`你用灵石换下古卷。书生千恩万谢，说这是祖上传下来的。`}]},{id:`town_doctor`,type:`town`,title:`瘟疫之村`,text:`前方村落笼罩着一层灰蒙蒙的死气，村民倒卧路旁，面如金纸。村口的老者颤巍巍向你叩首：「仙长救命！」`,condition:e=>e.realmIdx>=2,redraw:9,options:[{label:`出手救治`,check:{attr:`intelligence`,diff:`extreme`},success:{dao:8,karma:-6,flag:`cured_village`,text:`你以灵力逼出村民体内的疫毒，又留下丹药。全村人跪地叩谢，你感到一丝明悟——救人，亦是修心。`},failure:{dao:-3,life:-5,text:`疫毒比你想象的顽固，你灵力透支，自己也染上了几分。`}},{label:`绕道而行`,dao:-4,text:`你远远绕开了村庄。走了很远，那老者叩首的身影还在眼前挥之不去。`}]},{id:`grave_sword`,type:`grave`,title:`埋剑冢`,text:`荒冢之间插着数百柄残剑，剑身锈蚀，剑意却凝而不散。传说此地是上古剑修的葬剑之地。`,condition:e=>e.realmIdx>=2,redraw:9,options:[{label:`参悟剑意`,check:{attr:`intelligence`,diff:`extreme`},success:{dao:6,cult:200,flag:`sword_enlightened`,text:`你在剑冢前枯坐三日，剑意入体。再起身时，你眼中的世界已经不同。`},failure:{dao:-2,text:`剑意太过凌厉，你强行参悟，反被割伤心神。`}},{label:`取一柄残剑带走`,stones:100,flag:`took_sword`,text:`你拔出一柄残剑。剑身入手的瞬间，你仿佛听到一声叹息。`}]},{id:`heaven_vein`,type:`heaven`,title:`灵脉吐纳`,text:`此地灵气浓郁如雾，你盘坐吐纳，修为以肉眼可见的速度增长。`,condition:e=>!0,redraw:2,options:[{label:`闭关修炼`,cult:150,life:-2,text:`你在此闭关一月，修为大涨。`},{label:`探索灵脉深处`,check:{attr:`combat`,diff:`hard`},success:{stones:250,cult:100,flag:`vein_core`,text:`灵脉深处竟藏着一块灵石母矿，你挖走了一大块。`},failure:{life:-8,text:`灵脉深处灵气狂暴，你被灵气风暴掀了出来。`}}]},{id:`demon_whisper_return`,type:`demon`,title:`心魔低语`,text:`夜深人静，白日里那个声音又响了起来：「你杀了那么多人，凭什么觉得能成仙？」`,condition:e=>e.flags.demon_whisper||e.karma>=20,redraw:6,options:[{label:`正面对抗`,check:{attr:`combat`,diff:`extreme`},success:{dao:8,text:`你盘膝而坐，与心魔对视一夜。天亮时，心魔散去，你的道心反而更加凝实。`},failure:{dao:-8,karma:5,text:`你被心魔抓住破绽，差点走火入魔。`}},{label:`默念清心咒`,dao:3,text:`你默念宗门清心咒，杂念渐渐平息。`},{label:`与心魔对话`,dao:-2,flag:`talked_demon`,text:`你问心魔为什么缠着你。它沉默半晌：「因为……你还没放下。」`}]},{id:`wild_ruin`,type:`wild`,title:`荒废洞府`,text:`山壁上裂开一道缝隙，里面竟是一座废弃的洞府。石桌上积着厚尘，墙角有一具打坐的枯骨，指尖还扣着一枚玉简。`,condition:()=>!0,redraw:4,options:[{label:`参悟玉简`,check:{attr:`intelligence`,diff:`normal`},success:{cult:50,dao:3,flag:`read_ruin_jade`,text:`玉简中记载着一门失传的心法残篇，你参悟后修为大进。`},failure:{dao:-2,text:`玉简内容晦涩难懂，你参悟许久一无所获，反而头痛欲裂。`}},{label:`搜刮洞府`,stones:120,karma:2,text:`你翻遍洞府，找到几枚散落的灵石。枯骨的指节仿佛在注视着你。`},{label:`安葬枯骨，焚香告慰`,dao:5,karma:-2,text:`你以掌风在地上掘出浅坑，将枯骨安葬。临行时，洞府内似乎响起一声叹息，却再无恶意。`}]},{id:`wild_fox`,type:`wild`,title:`拦路狐仙`,text:`一只白狐蹲在路中央，口吐人言：「本仙在此设了迷阵，走不出去的话，就把你的寿元分我一半。」它眼珠滴溜溜转，分明在唬人。`,condition:()=>!0,redraw:4,options:[{label:`看穿虚妄`,check:{attr:`intelligence`,diff:`hard`},success:{stones:80,dao:2,text:`你凝神一看，迷阵不过是几块石头摆的障眼法。你一脚踢开阵眼，白狐悻悻地让开了路。`},failure:{life:-3,text:`你在迷阵里转了三圈，白狐笑得上气不接下气，才大发慈悲放你出去。`}},{label:`与狐仙斗法`,check:{attr:`combat`,diff:`extreme`},success:{stones:150,flag:`beat_fox`,text:`你随手一道剑气破开迷阵，白狐吓得化作原形逃窜，丢下一袋灵石。`},failure:{dao:-3,life:-8,text:`白狐的幻术比你想的厉害，你被耍得团团转，还撞了一鼻子灰。`}},{label:`奉上灵食结善缘`,cost:{spirit_herb:1},dao:4,flag:`fox_friend`,text:`你取出一株灵草丢过去。白狐嗅了嗅，满意地眯起眼睛：「算你识相，本仙记你一个人情。」`}]},{id:`market_danfang`,type:`market`,title:`残破丹方`,text:`坊市角落的旧书摊上，一本残缺的丹方被摊主随意丢在角落。摊主打着哈欠：「五十灵石，要就拿走，别挡我做生意。」`,condition:()=>!0,redraw:4,options:[{label:`买下丹方`,cost:{stones:50},give:`ancient_scroll`,dao:1,text:`你翻看丹方，虽残缺不全，但字里行间透出的药理却极高明。`},{label:`讨价还价`,check:{attr:`appearance`,diff:`normal`},success:{cost:{stones:20},give:`ancient_scroll`,text:`你三言两语把价格砍到二十灵石，摊主苦着脸收了钱。`},failure:{dao:-1,text:`摊主看出你想要，反而涨价到八十灵石。你只好作罢。`}},{label:`转身离开`,dao:1,text:`你想起丹道贵精不贵多，果断转身离开。`}]},{id:`secret_spring`,type:`secret`,title:`灵泉涌动`,text:`石缝间渗出一股清冽的灵泉，灵气浓郁得几乎凝成白雾。这是罕见的天然灵泉，饮一口可抵数月苦修。`,condition:()=>!0,redraw:3,options:[{label:`畅饮灵泉`,cult:40,dao:2,text:`你捧起灵泉痛饮，充沛的灵气在经脉中奔腾，修为肉眼可见地增长。`},{label:`用玉瓶装走`,give:[`spirit_herb`,2],text:`你取出玉瓶灌满灵泉，又在泉眼旁的石缝里发现两株被灵气滋养的灵草。`},{label:`引泉水炼体`,check:{attr:`constitution`,diff:`normal`},success:{hp:30,text:`你盘坐泉眼旁，引灵泉淬炼体魄，气血充盈，肉身更上一层。`},failure:{hp:-10,text:`灵泉灵气太烈，你强行炼体反而伤了经脉。`}}]},{id:`sect_task`,type:`sect`,title:`宗门任务`,text:`执事长老拍出一枚玉牌：「山下村落闹妖，你去走一趟。办成了，宗门记你一份功劳。」`,condition:()=>!0,redraw:3,options:[{label:`接下任务`,check:{attr:`combat`,diff:`hard`},success:{stones:100,dao:3,cult:20,flag:`sect_task_done`,text:`你下山斩妖除魔，村民感恩戴德，宗门也记了你一份功劳。`},failure:{hp:-15,text:`那妖物凶悍异常，你险些交代在村外，狼狈逃回宗门。`}},{label:`婉言推辞`,dao:-2,text:`你借口闭关推辞了任务。执事长老脸色不豫，但也未多言。`},{label:`讨价还价要报酬`,check:{attr:`appearance`,diff:`hard`},success:{stones:150,flag:`sect_task_rich`,text:`你一番讨价还价，把报酬谈到了一百五十灵石。长老摇头叹气，却也应了。`},failure:{dao:-3,text:`长老冷哼一声：「爱去不去。」拂袖而去，你碰了一鼻子灰。`}}]},{id:`relic_guardian`,type:`secret`,title:`傀儡守卫`,text:`一尊青铜傀儡守在古殿门口，胸口嵌着一颗拳头大的灵核，正散发着幽蓝光芒。它没有动，但你感觉它在看着你。`,condition:e=>e.realmIdx>=2,redraw:5,options:[{label:`绕道而行`,dao:1,text:`你权衡片刻，决定不招惹这尊看不出深浅的傀儡，绕道而行。`},{label:`强行破门`,check:{attr:`combat`,diff:`extreme`},success:{stones:250,give:`sword_fine`,flag:`broke_guardian`,text:`你硬抗傀儡三掌，终于破门而入，殿内藏着一批灵石和一柄青锋剑。`},failure:{hp:-30,text:`傀儡一拳轰出，你被砸飞出去，肋骨断了两根，仓皇遁走。`}},{label:`尝试沟通`,check:{attr:`appearance`,diff:`extreme`},success:{give:`ancient_scroll`,dao:5,flag:`talked_guardian`,text:`你发现傀儡核心上刻着一段符文，念出后傀儡竟缓缓让开了路，还从体内弹出一卷古书。`},failure:{dao:-2,text:`傀儡对你的话毫无反应，只是沉默地站着。你讪讪退开。`}}]}],qt=[{id:`open_liquor`,title:`醉里问经`,text:`夜色渐深，你走进一家还在营业的酒肆。角落里的书生借酒浇愁，桌上摊着一卷残缺的古书。他见你进来，苦笑：「这位仙长，可识得这古卷上的字？」`,fit:()=>!0,options:[{label:`上前细看古卷`,check:{attr:`intelligence`,diff:`normal`},success:{cult:15,dao:2,text:`你扫了一眼，认出是上古失传的观想法残篇，随口点拨了几句。书生如获至宝，硬塞给你一壶灵酿。（修为 +15）`},failure:{text:`古卷字迹古朴，你也认不全，只能摇头。书生叹口气，继续借酒浇愁。`}},{label:`买下古卷`,cost:{stones:50},give:`ancient_scroll`,text:`你掏出灵石买下古卷。书生大喜，又赠你一壶酒：「此卷与你有缘。」`}]},{id:`open_tea`,title:`茶摊问路`,text:`山道旁的茶摊，一个白发老翁正煮着茶。见你路过，他招手：「年轻人，喝碗茶再赶路。此去仙山，路远着呢。」`,fit:()=>!0,options:[{label:`坐下喝茶`,dao:3,text:`你坐下喝了碗茶。老翁笑道：「心中有路，脚下就有路。」不知为何，道心竟隐隐稳固了几分。（道心 +3）`},{label:`向老翁问路`,check:{attr:`appearance`,diff:`normal`},success:{stones:30,text:`老翁指点了一条采药的小径，还送你几枚灵石：「算是茶钱。」`},failure:{text:`老翁只顾喝茶，对你的问题笑而不答。`}}]},{id:`open_sword`,title:`剑冢剑鸣`,text:`你途经一座无名剑冢，万剑插于山岗。风过时，剑身齐鸣，仿佛在呼唤什么。冢前石碑刻着两行字：「剑心不灭者，可入此门。」`,fit:e=>e.flags&&e.flags.sword_heir,options:[{label:`步入剑冢`,check:{attr:`combat`,diff:`hard`},success:{dao:4,cult:20,give:`sword_fine`,text:`你踏入剑冢，万剑退避，一柄青锋剑自冢中飞出，落入你手。剑鸣声中，你仿佛听见了前人的剑意。（修为 +20）`},failure:{hp:-10,text:`剑冢剑气纵横，你被震退数丈，狼狈退出。`}},{label:`绕道而行`,text:`你无意招惹剑冢里的因果，绕道而行。`}]},{id:`open_demon`,title:`魔影追魂`,text:`一道黑影无声无息地缀在你身后，目光阴冷。那是旧日魔门的追魂使——你的身份，终究还是暴露了。`,fit:e=>e&&e.flags&&e.flags.demon_born||e&&e.karma>=15,options:[{label:`正面迎敌`,check:{attr:`combat`,diff:`normal`},success:{dao:3,stones:80,flag:`beat_hunter`,text:`你反手一击，追魂使猝不及防，被你打伤遁走，还落下了一袋灵石。（灵石 +80）`},failure:{hp:-15,text:`追魂使的毒掌拍在你肩头，你忍着剧痛甩脱了他。`}},{label:`遁入山林躲避`,check:{attr:`intelligence`,diff:`hard`},success:{text:`你借着地形七拐八绕，甩开了追魂使。`},failure:{karma:2,text:`追魂使紧追不舍，你只能反身苦战，好不容易才脱身。`}}]},{id:`open_family`,title:`灵田拾穗`,text:`宗门灵田边，一个扎着总角的小道童正蹲在田埂上哭。他种的灵稻被野猪拱了一片：「师兄，师父会打死我的……」`,fit:e=>e.flags&&e.flags.sect_family,options:[{label:`帮小道童补种`,dao:3,text:`你随手引灵泉浇灌，又布了个简易驱兽阵。小道童破涕为笑，悄悄塞给你一株灵草。（道心 +3）`},{label:`指点他如何交代`,check:{attr:`appearance`,diff:`normal`},success:{stones:40,text:`你教他说灵稻是长老闭关前自己种的，小道童将信将疑地去了。后来他真给你带了一小袋灵石。`},failure:{text:`小道童觉得你在坑他，哭得更伤心了。`}}]},{id:`open_ruin`,title:`古庙残碑`,text:`山间一座半塌的古庙，残碑上刻着密密麻麻的符文。庙里蛛网遍布，却有一尊佛像保存完好，掌心托着一枚玉简。`,fit:()=>!0,options:[{label:`参悟残碑`,check:{attr:`intelligence`,diff:`hard`},success:{cult:25,text:`残碑记载的是一门被遗忘的炼气法门，你盘坐参悟，修为精进。（修为 +25）`},failure:{dao:-1,text:`符文晦涩如天书，你参悟半晌，头晕目眩。`}},{label:`取走佛像掌中玉简`,check:{attr:`combat`,diff:`hard`},success:{give:`ancient_scroll`,text:`你跃上佛坛取走玉简。佛像的嘴角似乎微微翘起——你打了个寒颤，快步离开。`},failure:{hp:-8,text:`你刚触到玉简，庙中阴风骤起，你被一股力道推下佛坛，摔得不轻。`}},{label:`合十拜佛，结个善缘`,dao:5,text:`你诚心拜了三拜。恍惚间，佛光一闪而逝，道心仿佛被涤荡了一番。（道心 +5）`}]},{id:`open_fisher`,title:`江上渔翁`,text:`一叶扁舟横在江心，渔翁头戴斗笠，正钓着一尾红鳞怪鱼。见你踏波而来，他咧嘴一笑：「小友，这鱼咬钩三百年了，你说它图个啥？」`,fit:()=>!0,options:[{label:`答道：图个自在`,dao:3,text:`渔翁闻言大笑：「妙！」他一甩竿，红鱼跃回江中，他随手抛给你一枚莹润的灵石。（道心 +3）`},{label:`答道：图个解脱`,check:{attr:`intelligence`,diff:`hard`},success:{stones:60,text:`渔翁沉吟片刻：「小友有慧根。」他摘下腰间布袋丢给你，里面装着几十枚灵石。`},failure:{text:`渔翁摇摇头：「不像，不像。」不再理你。`}}]},{id:`open_caravan`,title:`商队遭劫`,text:`官道上，一支商队被三名劫修围住，车夫抱着头蹲在地上，掌柜的带着哭腔求饶。劫修头子掂着刀，正打量着商队里那口檀木箱子。`,fit:()=>!0,options:[{label:`拔刀相助`,check:{attr:`combat`,diff:`hard`},success:{stones:100,dao:4,karma:-1,text:`你三拳两脚打发了劫修。掌柜的千恩万谢，硬塞给你一袋灵石。（灵石 +100，道心 +4）`},failure:{hp:-12,text:`劫修头子竟有几分手段，你吃了暗亏，负伤退走。`}},{label:`冷眼旁观`,dao:-2,text:`你不想沾染因果，绕道而行。身后传来掌柜的惨叫声，你脚步顿了一顿，终究没回头。（道心 -2）`},{label:`暗中警告劫修`,check:{attr:`appearance`,diff:`normal`},success:{dao:2,text:`你传音入密，点破劫修头子的底细。他脸色一变，带着人灰溜溜走了。`},failure:{text:`劫修头子嗤笑一声，根本不理你。`}}]},{id:`open_dream`,title:`宿慧残梦`,text:`你于荒庙中打盹，恍惚间梦回前世——九重天劫之下，一道熟悉的身影灰飞烟灭。惊醒时，额上冷汗涔涔，掌心却多了一枚温润的玉简。`,fit:e=>e&&e.flags&&e.flags.reborn_soul,options:[{label:`凝神回忆前世`,check:{attr:`intelligence`,diff:`hard`},success:{cult:30,dao:4,text:`残梦片段渐渐清晰——一门失传的剑诀，一个害你渡劫失败的仇人。你记住了那张脸。（修为 +30，道心 +4）`},failure:{text:`梦影朦胧，你只记得天雷滚滚，其余尽数模糊。`}},{label:`摩挲玉简，暂且放下`,dao:2,text:`这一世，你打算换个活法。玉简收好，路还长。`}]},{id:`open_merchant`,title:`坊市见闻`,text:`坊市口人声鼎沸，一个机灵的小贩凑上来：「仙长仙长，我这有上古丹方残页，五十灵石便宜卖您！」旁边的大婶嗤笑：「别信他，那是从茅厕边捡的。」`,fit:()=>!0,options:[{label:`买下丹方`,cost:{stones:50},give:`ancient_scroll`,text:`你买下残页，展开一看——竟是失传的聚灵丹方的一部分。小贩确实捡到宝了，只是他不识货。`},{label:`砍价`,check:{attr:`appearance`,diff:`hard`},success:{cost:{stones:20},give:`ancient_scroll`,text:`你三言两语砍到二十灵石，小贩苦着脸成交。`},failure:{text:`小贩咬死价格不松口，你摇摇头走了。`}},{label:`转身离开`,text:`大婶的话让你犹豫了，最终没买。`}]}];function Jt(e){let t=qt.filter(e=>{try{return e.fit()===!0}catch{return!1}}),n=qt.filter(n=>{try{return n.fit(e)===!0&&!t.includes(n)}catch{return!1}}),r=n.length>0?n:t.length>0?t:qt,i=r[Math.floor(E(e)*r.length)];return{type:`opening`,title:i.title,text:i.text,options:i.options,openingId:i.id}}function Yt(e,t){return Kt.filter(n=>!(n.type!==t||n.condition&&!n.condition(e)||e.eventCooldowns&&e.eventCooldowns[n.id]>e.turn))}function Xt(e,t){if(e.npcs&&e.npcs.length){let t=e.npcs.filter(t=>t.location===e.mapNode&&t.alive&&!e.flags[`interacted_${t.id}`]);if(t.length&&E(e)<.3){let n=t[Math.floor(E(e)*t.length)],r=Ut(e,n);if(r)return e.eventCooldowns||={},e.eventCooldowns[r.id]=e.turn+6,r}}let n=Yt(e,t);if(n.length){if(e.eventBags||={},!e.eventBags[t]){let r=()=>E(e);e.eventBags[t]=new oe(r,n,e=>e.redraw||3)}let r=e.eventBags[t],i=r.items.filter(t=>!(e.eventCooldowns&&e.eventCooldowns[t.id]>e.tu
