<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷 · 强可猜版</title>
    <style>
        :root {
            --bg: #c0c8d0;
            --surface: #c0c8d0;
            --surface-hover: #b0b8c0;
            --surface-active: #a0a8b0;
            --border: #808890;
            --text-primary: #1e2a3a;
            --text-secondary: #4a5a6a;
            --text-tertiary: #7a8a9a;
            --shadow: none;
            --radius: 0;
            --cell-size: 50px;
            --gap: 1px;
            --color-1: #0000cc;
            --color-2: #007a00;
            --color-3: #cc0000;
            --color-4: #00007a;
            --color-5: #7a0000;
            --color-6: #007a7a;
            --color-7: #1a1a1a;
            --color-8: #5a5a5a;
            --mine-red: #cc0000;
            --flag-red: #cc0000;
            --safe-green: #006600;
            --cell-bg: #a8b0b8;
            --cell-highlight: #d8e0e8;
            --cell-shadow: #707880;
            --cell-revealed-bg: #d0d8e0;
            --cell-revealed-border: #889098;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh;
            padding: 0;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: auto;
        }

        #app {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 4px 4px 6px;
            max-width: 100%;
            width: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: none;
            position: relative;
            z-index: 1;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        #status-area {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 100px;
        }

        .counter {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
            background: #1a1a1a;
            color: #ff0000;
            padding: 2px 10px;
            border-radius: 4px;
            min-width: 52px;
            text-align: center;
            font-family: "SF Mono", "Menlo", monospace;
            border: 2px solid #555;
        }

        #face-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            border-radius: 50%;
            background: var(--cell-bg);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
            line-height: 1;
            box-shadow: inset 1px 1px 0 var(--cell-highlight), inset -1px -1px 0 var(--cell-shadow);
        }
        #face-btn:hover {
            background: var(--surface-hover);
        }
        #face-btn:active {
            transform: scale(0.92);
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            width: 100%;
            padding: 4px 0 2px;
            border-top: 2px solid var(--border);
            margin-top: 2px;
        }

        .diff-btn {
            padding: 4px 10px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-secondary);
            font-family: inherit;
            letter-spacing: 0.2px;
            white-space: nowrap;
            box-shadow: none;
        }
        .diff-btn:hover {
            background: var(--surface-hover);
            border-color: var(--text-tertiary);
        }
        .diff-btn.active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
            box-shadow: none;
        }
        .diff-btn.custom-btn {
            background: transparent;
            border-color: var(--border);
            color: var(--text-secondary);
        }
        .diff-btn.custom-btn.active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }
        .diff-btn.custom-btn .custom-label {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
            margin-left: 2px;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .tool-btn {
            padding: 4px 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--cell-bg);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-primary);
            font-family: inherit;
            box-shadow: inset 1px 1px 0 var(--cell-highlight), inset -1px -1px 0 var(--cell-shadow);
        }
        .tool-btn:hover {
            background: var(--surface-hover);
        }
        .tool-btn:active {
            transform: scale(0.95);
        }

        .tool-btn.on {
            border-color: #00aa00;
            background: #d4edda;
            color: #155724;
        }
        .tool-btn.off {
            border-color: #aa0000;
            background: #f8d7da;
            color: #721c24;
        }

        #board-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            position: relative;
        }

        #board {
            display: grid;
            gap: var(--gap);
            background: var(--border);
            padding: var(--gap);
            border-radius: 0;
            position: relative;
            z-index: 1;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.52);
            font-weight: 700;
            background: var(--cell-bg);
            border-radius: 0;
            cursor: pointer;
            transition: background 0.08s, transform 0.05s;
            color: var(--text-primary);
            position: relative;
            box-shadow: inset 2px 2px 0 var(--cell-highlight), inset -2px -2px 0 var(--cell-shadow);
            will-change: transform, background;
        }
        .cell:active:not(.revealed):not(.flagged) {
            transform: scale(0.94);
            background: #9098a0;
            box-shadow: inset 2px 2px 0 var(--cell-shadow), inset -2px -2px 0 var(--cell-highlight);
        }

        .cell.revealed {
            background: var(--cell-revealed-bg);
            cursor: default;
            box-shadow: inset 0 0 0 1px var(--cell-revealed-border);
            transform: none;
        }
        .cell.revealed:active {
            transform: none;
        }

        .cell.flagged {
            background: var(--cell-bg);
            color: var(--flag-red);
            box-shadow: inset 2px 2px 0 var(--cell-highlight), inset -2px -2px 0 var(--cell-shadow);
        }
        .cell.doubt {
            background: var(--cell-bg);
            color: var(--text-tertiary);
            box-shadow: inset 2px 2px 0 var(--cell-highlight), inset -2px -2px 0 var(--cell-shadow);
        }

        .cell.mine-exploded {
            background: #aa0000 !important;
            color: #ff6666 !important;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4);
            font-size: calc(var(--cell-size) * 1.5) !important;
            line-height: 1;
            z-index: 2;
        }

        .cell.mine-shown {
            background: var(--cell-revealed-bg) !important;
            color: var(--mine-red) !important;
            box-shadow: inset 0 0 0 1px var(--cell-revealed-border);
        }
        .cell.mine-shown::after {
            content: "•";
            font-size: calc(var(--cell-size) * 1.5);
            color: var(--mine-red);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell.mine-shown.revealed {
            background: var(--cell-revealed-bg) !important;
        }

        .cell.flag-miss {
            background: var(--cell-revealed-bg) !important;
            color: var(--mine-red);
            box-shadow: inset 0 0 0 1px var(--cell-revealed-border);
        }
        .cell.flag-miss::after {
            content: "✕";
            font-size: calc(var(--cell-size) * 0.45);
        }

        .cell.n1 {
            color: var(--color-1);
        }
        .cell.n2 {
            color: var(--color-2);
        }
        .cell.n3 {
            color: var(--color-3);
        }
        .cell.n4 {
            color: var(--color-4);
        }
        .cell.n5 {
            color: var(--color-5);
        }
        .cell.n6 {
            color: var(--color-6);
        }
        .cell.n7 {
            color: var(--color-7);
        }
        .cell.n8 {
            color: var(--color-8);
        }

        #msg {
            margin-top: 4px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            min-height: 24px;
            text-align: center;
            transition: opacity 0.2s;
            padding: 0 4px;
            z-index: 10;
            position: relative;
        }
        #msg.win {
            color: var(--safe-green);
        }
        #msg.lose {
            color: var(--mine-red);
        }
        #msg.weak-info {
            color: #0033aa;
            background: rgba(0, 68, 204, 0.1);
            border-radius: 4px;
            padding: 2px 8px;
        }

        #celebration {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            display: none;
            overflow: hidden;
        }
        #celebration.active {
            display: block;
            pointer-events: auto;
        }
        #celebration-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #celebration.active #celebration-overlay {
            pointer-events: auto;
        }
        #win-title {
            font-size: clamp(48px, 10vw, 90px);
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.4);
            animation: winPulse 1.2s ease-in-out infinite alternate;
            letter-spacing: 4px;
            transform-origin: center;
            user-select: none;
        }
        @keyframes winPulse {
            0% {
                transform: scale(1) rotate(-1deg);
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.2);
            }
            100% {
                transform: scale(1.06) rotate(1deg);
                text-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.4);
            }
        }
        #win-time {
            font-size: clamp(20px, 3.5vw, 36px);
            color: #fff;
            margin-top: 12px;
            font-weight: 400;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            opacity: 0.9;
        }
        #win-time strong {
            font-weight: 700;
            color: #ffd700;
        }
        #win-btn {
            margin-top: 28px;
            padding: 12px 40px;
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 700;
            border: 2px solid #ffd700;
            border-radius: 40px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            letter-spacing: 1px;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        #win-btn:hover {
            background: #ffd700;
            color: #1a1a2e;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }
        #win-btn:active {
            transform: scale(0.95);
        }

        .star-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star-ring span {
            position: absolute;
            display: block;
            font-size: 28px;
            animation: starFloat 4s ease-in-out infinite alternate;
            opacity: 0.7;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            user-select: none;
        }
        .star-ring span:nth-child(1) {
            top: 8%;
            left: 6%;
            animation-delay: 0s;
            font-size: 32px;
        }
        .star-ring span:nth-child(2) {
            top: 15%;
            right: 8%;
            animation-delay: 0.6s;
            font-size: 26px;
        }
        .star-ring span:nth-child(3) {
            bottom: 20%;
            left: 4%;
            animation-delay: 1.2s;
            font-size: 30px;
        }
        .star-ring span:nth-child(4) {
            bottom: 12%;
            right: 5%;
            animation-delay: 0.3s;
            font-size: 34px;
        }
        .star-ring span:nth-child(5) {
            top: 45%;
            left: 2%;
            animation-delay: 0.9s;
            font-size: 22px;
        }
        .star-ring span:nth-child(6) {
            top: 40%;
            right: 2%;
            animation-delay: 1.5s;
            font-size: 24px;
        }
        .star-ring span:nth-child(7) {
            top: 5%;
            left: 45%;
            animation-delay: 0.4s;
            font-size: 20px;
        }
        .star-ring span:nth-child(8) {
            bottom: 5%;
            left: 48%;
            animation-delay: 1.0s;
            font-size: 20px;
        }
        @keyframes starFloat {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0.4;
            }
            100% {
                transform: translateY(-18px) scale(1.2) rotate(25deg);
                opacity: 1;
            }
        }
        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall linear forwards;
            border-radius: 2px;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            5% {
                opacity: 1;
                transform: translateY(20px) rotate(10deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) rotate(720deg) scale(0.4);
                opacity: 0;
            }
        }

        #explosion-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            pointer-events: none;
            display: none;
            overflow: hidden;
        }
        #explosion-overlay.active {
            display: block;
            pointer-events: none;
        }
        .shockwave {
            position: fixed;
            border-radius: 50%;
            border: 4px solid rgba(255, 100, 20, 0.8);
            background: rgba(255, 80, 0, 0.15);
            pointer-events: none;
            animation: shockwaveExpand 0.8s ease-out forwards;
            box-shadow: 0 0 40px rgba(255, 80, 0, 0.3);
            z-index: 9998;
        }
        @keyframes shockwaveExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
                border-width: 6px;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
                border-width: 2px;
            }
        }
        .explosion-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 200, 50, 0.8), rgba(255, 80, 0, 0.5), transparent 70%);
            pointer-events: none;
            animation: flashFade 0.6s ease-out forwards;
            z-index: 9997;
        }
        @keyframes flashFade {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        .debris-piece {
            position: fixed;
            border-radius: 2px;
            pointer-events: none;
            animation: debrisFly 0.9s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
            z-index: 9998;
            box-shadow: 0 0 6px rgba(255, 150, 50, 0.3);
        }
        @keyframes debrisFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2);
            }
        }
        .screen-shake {
            animation: shake 0.5s ease-out forwards;
        }
        @keyframes shake {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            10% {
                transform: translate(-12px, 8px) rotate(-2deg);
            }
            20% {
                transform: translate(10px, -6px) rotate(2deg);
            }
            30% {
                transform: translate(-8px, 10px) rotate(-1.5deg);
            }
            40% {
                transform: translate(6px, -5px) rotate(1.5deg);
            }
            50% {
                transform: translate(-4px, 4px) rotate(-0.5deg);
            }
            60% {
                transform: translate(3px, -2px) rotate(0.5deg);
            }
            70% {
                transform: translate(-2px, 2px) rotate(-0.2deg);
            }
            80% {
                transform: translate(1px, -1px) rotate(0.2deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }
        .cell.ripple {
            animation: cellRipple 0.5s ease-out forwards;
        }
        @keyframes cellRipple {
            0% {
                transform: scale(1);
                background: var(--cell-revealed-bg);
            }
            30% {
                transform: scale(1.15);
                background: rgba(255, 100, 50, 0.35);
            }
            100% {
                transform: scale(1);
                background: var(--cell-revealed-bg);
            }
        }

        #boom-retry-float {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10001;
            background: rgba(20, 10, 8, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 80, 20, 0.4);
            border-radius: 20px;
            padding: 28px 40px 34px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 300px;
            box-shadow: 0 0 80px rgba(255, 50, 0, 0.25);
            text-align: center;
            color: #fff;
            pointer-events: none;
            user-select: none;
        }
        #boom-retry-float.active {
            display: flex;
            pointer-events: auto;
            animation: floatIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        @keyframes floatIn {
            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        #boom-retry-float .big-icon {
            font-size: 52px;
            margin-bottom: 2px;
            text-shadow: 0 0 30px rgba(255, 80, 0, 0.5);
        }
        #boom-retry-float .title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        #boom-retry-float .sub {
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        #boom-retry-float .sub strong {
            color: #ff6b35;
            font-weight: 700;
        }
        #boom-retry-float .stats {
            font-size: 14px;
            opacity: 0.5;
            margin-bottom: 18px;
        }
        #boom-retry-float .retry-btn {
            padding: 12px 44px;
            font-size: 18px;
            font-weight: 700;
            background: #ff4500;
            border: none;
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.3);
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        #boom-retry-float .retry-btn:hover {
            transform: scale(1.05);
            background: #ff6348;
            box-shadow: 0 0 50px rgba(255, 50, 0, 0.5);
        }
        #boom-retry-float .retry-btn:active {
            transform: scale(0.94);
        }
        #boom-retry-float .hint {
            margin-top: 12px;
            font-size: 12px;
            opacity: 0.35;
            letter-spacing: 0.5px;
        }

        #custom-float {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10002;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 12px 60px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border);
            display: none;
            flex-direction: column;
            min-width: 340px;
            max-width: 90vw;
            overflow: hidden;
            font-size: 14px;
            color: var(--text-primary);
            user-select: none;
        }
        #custom-float.open {
            display: flex;
            animation: floatIn 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        #custom-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
        }
        #custom-backdrop.open {
            display: block;
        }
        #custom-float-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--cell-bg);
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
        }
        #custom-float-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        #custom-float-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0 4px;
            line-height: 1;
            transition: color 0.15s;
        }
        #custom-float-close:hover {

<body>

    <div id="app">
        <div id="header">
            <div id="status-area">
                <span class="counter" id="mine-counter">000</span>
                <button id="face-btn" aria-label="重新开始">🙂</button>
                <span class="counter" id="timer-counter">000</span>
            </div>
        </div>

        <div id="toolbar">
            <button class="diff-btn active" data-diff="beginner">初级 9×9</button>
            <button class="diff-btn" data-diff="intermediate">中级 16×16</button>

            <button class="diff-btn" data-diff="master">大师 30×24</button>
            <button class="diff-btn" data-diff="hell">地狱 36×30</button>

            <span class="toolbar-spacer"></span>
            <button class="tool-btn on" id="auto-flag-btn">🚩 自动标雷 [开]</button>
            <button class="tool-btn" id="rank-btn">🏆 排行榜</button>
        </div>

        </div>
