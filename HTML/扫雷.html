    </div>

    <div id="celebration">
        <div id="celebration-overlay">
            <div class="star-ring">
                <span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span><span>✦</span>
            </div>
            <div id="win-title">🎉 胜利！</div>
            <div id="win-time">用时 <strong id="win-time-val">0</strong> 秒</div>
            <button id="win-btn">🚀 再来一局</button>
        </div>
    </div>

    <div id="explosion-overlay"></div>

    <div id="boom-retry-float">
        <div class="big-icon">💥</div>
        <div class="title">踩雷了</div>
        <div class="sub">引爆了 <strong id="boom-mine-count">0</strong> 颗地雷</div>
        <div class="stats">剩余雷数 <span id="boom-remain-count">0</span></div>
        <button class="retry-btn" id="boom-retry-btn">💣 重新开始</button>
        <div class="hint">按 R 键快速重来</div>
    </div>

    <div id="custom-backdrop"></div>
    <div id="custom-float">
        <div id="custom-float-header">
            <h2>🎛️ 自定义难度</h2>
            <button id="custom-float-close">✕</button>
        </div>
        <div id="custom-float-body">
            <div class="custom-row">
                <label>行数</label>
                <input type="number" id="custom-rows" value="10" min="3" max="50">
                <span class="hint-text">(3-50)</span>
            </div>
            <div class="custom-row">
                <label>列数</label>
                <input type="number" id="custom-cols" value="10" min="3" max="50">
                <span class="hint-text">(3-50)</span>
            </div>
            <div class="custom-row">
                <label>雷数</label>
                <input type="number" id="custom-mines" value="15" min="1">
                <span class="hint-text" id="custom-mines-hint">(1 ~ 99)</span>
            </div>
            <div id="custom-hint"></div>
            <div class="custom-actions">
                <button class="custom-cancel-btn" id="custom-cancel">取消</button>
                <button class="custom-start-btn" id="custom-start">开始游戏</button>
            </div>
        </div>
    </div>

    <div id="rank-float">
        <div id="rank-float-header">
            <h2>🏆 用时排行榜</h2>
            <button id="rank-float-close">✕</button>
        </div>
        <div id="rank-float-body"></div>
    </div>

    <script>
        (function() {
            'use strict';

            const ENU_LIMIT = 30;
            const DEFAULT_CUSTOM = { rows: 10, cols: 10, mines: 15 };
            const DIFFICULTIES = {
                beginner: { rows: 9, cols: 9, mines: 10, label: '初级' },
                intermediate: { rows: 16, cols: 16, mines: 40, label: '中级' },
                expert: { rows: 16, cols: 30, mines: 99, label: '高级' },
                master: { rows: 24, cols: 30, mines: 180, label: '大师' },
                hell: { rows: 30, cols: 36, mines: 270, label: '地狱' },
                custom: { rows: 10, cols: 10, mines: 15, label: '自定义' }
            };

            let customConfig = { rows: 10, cols: 10, mines: 15 };
            try {
                const saved = localStorage.getItem('ms_custom_config');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.rows && parsed.cols && parsed.mines) {
                        customConfig = parsed;
                        DIFFICULTIES.custom.rows = parsed.rows;
                        DIFFICULTIES.custom.cols = parsed.cols;
                        DIFFICULTIES.custom.mines = parsed.mines;
                    }
                }
            } catch (_) {}

            const boardEl = document.getElementById('board');
            const mineCounter = document.getElementById('mine-counter');
            const timerCounter = document.getElementById('timer-counter');
            const faceBtn = document.getElementById('face-btn');
            const msgEl = document.getElementById('msg');
            const diffBtns = document.querySelectorAll('.diff-btn');
            const rankBtn = document.getElementById('rank-btn');
            const autoFlagBtn = document.getElementById('auto-flag-btn');
            const celebrationEl = document.getElementById('celebration');
            const winTimeVal = document.getElementById('win-time-val');
            const winBtn = document.getElementById('win-btn');

            const boomFloat = document.getElementById('boom-retry-float');
            const boomRetryBtn = document.getElementById('boom-retry-btn');
            const boomMineCount = document.getElementById('boom-mine-count');
            const boomRemainCount = document.getElementById('boom-remain-count');

            const rankFloat = document.getElementById('rank-float');
            const rankBody = document.getElementById('rank-float-body');
            const rankClose = document.getElementById('rank-float-close');
            const rankHeader = document.getElementById('rank-float-header');

            const customFloat = document.getElementById('custom-float');
            const customBackdrop = document.getElementById('custom-backdrop');
            const customClose = document.getElementById('custom-float-close');
            const customCancel = document.getElementById('custom-cancel');
            const customStart = document.getElementById('custom-start');
            const customRows = document.getElementById('custom-rows');
            const customCols = document.getElementById('custom-cols');
            const customMines = document.getElementById('custom-mines');
            const customHint = document.getElementById('custom-hint');
            const customMinesHint = document.getElementById('custom-mines-hint');
            const customDiffBtn = document.getElementById('custom-diff-btn');

            let currentDiff = 'beginner';
            let boardData = [];
            let rows = 0,
                cols = 0,
                totalMines = 0;
            let cellState = [];
            let gameState = 'idle';
            let firstClick = true;
            let timer = 0;
            let timerInterval = null;
            let flagCount = 0;
            let revealedCount = 0;
            let isGenerating = false;
            let isCelebrating = false;
            let isExploding = false;
            let boomShown = false;

            let autoFlagEnabled = true;
            let autoFlagTimer = null;
            let isAutoFlagging = false;
            let revealTimer = null;
            let isRevealing = false;
            let pendingCheck = false;

            function pad(n) { return String(n).padStart(3, '0'); }

            function key(r, c) { return r + ',' + c; }

            function getCellEl(r, c) {
                const idx = r * cols + c;
                return boardEl.children[idx] || null;
            }

            function isInBounds(r, c) {
                return r >= 0 && r < rows && c >= 0 && c < cols;
            }

            function neighbors(r, c) {
                const result = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr,
                            nc = c + dc;
                        if (isInBounds(nr, nc)) result.push([nr, nc]);
                    }
                }
                return result;
            }

            function getDifficulty() {
                if (currentDiff === 'custom') return DIFFICULTIES.custom;
                return DIFFICULTIES[currentDiff];
            }

            function cloneState(state) {
                return state.map(row => [...row]);
            }

            function getConstraints(state) {
                const constraints = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (state[r][c] !== 'revealed') continue;
                        const num = boardData[r][c];
                        if (num <= 0) continue;
                        let flagCnt = 0;
                        const unknown = [];
                        for (const [nr, nc] of neighbors(r, c)) {
                            const st = state[nr][nc];
                            if (st === 'flagged') flagCnt++;
                            else if (st === 'hidden' || st === 'doubt') unknown.push([nr, nc]);
                        }
                        const remain = num - flagCnt;
                        if (remain > 0 && unknown.length > 0) {
                            constraints.push({ cells: unknown, mines: remain });
                        }
                    }
                }
                return constraints;
            }

            function propagateConstraints(state) {
                let changed = true;
                let iterations = 0;
                const MAX_ITER = 500;
                while (changed && iterations < MAX_ITER) {
                    changed = false;
                    iterations++;
                    const constraints = getConstraints(state);
                    for (const c of constraints) {
                        const unknownCount = c.cells.length;
                        const mineCount = c.mines;
                        if (mineCount === 0) {
                            for (const [r, c2] of c.cells) {
                                if (state[r][c2] === 'hidden' || state[r][c2] === 'doubt') {
                                    state[r][c2] = 'revealed';
                                    changed = true;
                                }
                            }
                            continue;
                        }
                        if (unknownCount === mineCount) {
                            for (const [r, c2] of c.cells) {
                                if (state[r][c2] === 'hidden' || state[r][c2] === 'doubt') {
                                    state[r][c2] = 'flagged';
                                    changed = true;
                                }
                            }
                            continue;
                        }
                    }
                    const newConstraints = getConstraints(state);
                    for (let i = 0; i < newConstraints.length; i++) {
                        for (let j = 0; j < newConstraints.length; j++) {
                            if (i === j) continue;
                            const ci = newConstraints[i];
                            const cj = newConstraints[j];
                            if (ci.cells.length >= cj.cells.length) continue;
                            const setA = new Set(ci.cells.map(([r, c]) => key(r, c)));
                            const setB = new Set(cj.cells.map(([r, c]) => key(r, c)));
                            let isSubset = true;
                            for (const k of setA) {
                                if (!setB.has(k)) { isSubset = false; break; }
                            }
                            if (!isSubset) continue;
                            const diff = [];
                            for (const k of setB) {
                                if (!setA.has(k)) {
                                    const [r, c] = k.split(',').map(Number);
                                    diff.push([r, c]);
                                }
                            }
                            const diffMines = cj.mines - ci.mines;
                            if (diffMines === 0 && diff.length > 0) {
                                for (const [r, c2] of diff) {
                                    if (state[r][c2] === 'hidden' || state[r][c2] === 'doubt') {
                                        state[r][c2] = 'revealed';
                                        changed = true;
                                    }
                                }
                            } else if (diffMines === diff.length && diff.length > 0) {
                                for (const [r, c2] of diff) {
                                    if (state[r][c2] === 'hidden' || state[r][c2] === 'doubt') {
                                        state[r][c2] = 'flagged';
                                        changed = true;
                                    }
                                }
                            }
                        }
                    }
                }
                return state;
            }

            function isJudgeable() {
                const simState = cloneState(cellState);
                propagateConstraints(simState);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (boardData[r][c] !== -1 && simState[r][c] !== 'revealed') {
                            return false;
                        }
                    }
                }
                return true;
            }

            function getComponentAll(r, c) {
                const visited = new Set();
                const queue = [
                    [r, c]
                ];
                visited.add(key(r, c));
                const component = [];
                while (queue.length > 0) {
                    const [cr, cc] = queue.shift();
                    component.push([cr, cc]);
                    for (const [nr, nc] of neighbors(cr, cc)) {
                        const k = key(nr, nc);
                        if (!visited.has(k) && (cellState[nr][nc] === 'hidden' || cellState[nr][nc] === 'doubt' || cellState[
                                nr][nc] === 'flagged')) {
                            visited.add(k);
                            queue.push([nr, nc]);
                        }
                    }
                }
                return component;
            }

            function enumerateComponent(component) {
                const solutions = [];
                const unknowns = component.map(([r, c]) => ({ r, c, key: key(r, c) }));
                const n = unknowns.length;
                if (n === 0) return solutions;
                const allConstraints = getConstraints(cellState);
                const relevantConstraints = [];
                for (const cons of allConstraints) {
                    let hasComponentCell = false;
                    for (const [cr, cc] of cons.cells) {
                        if (component.some(([r, c]) => r === cr && c === cc)) {
                            hasComponentCell = true;
                            break;
                        }
                    }
                    if (hasComponentCell) {
                        relevantConstraints.push(cons);
                    }
                }
                if (relevantConstraints.length === 0) {
                    return solutions;
                }
                const totalCombinations = 1 << n;
                if (totalCombinations > 100000) return solutions;
                const outsideUnknowns = new Set();
                for (const cons of relevantConstraints) {
                    for (const [cr, cc] of cons.cells) {
                        const k = key(cr, cc);
                        if (!component.some(([r, c]) => r === cr && c === cc)) {
                            if (cellState[cr][cc] === 'hidden' || cellState[cr][cc] === 'doubt' || cellState[cr][cc] ===
                                'flagged') {
                                outsideUnknowns.add(k);
                            }
                        }
                    }
                }
                for (let mask = 0; mask < totalCombinations; mask++) {
                    const mineSet = new Set();
                    for (let i = 0; i < n; i++) {
                        if (mask & (1 << i)) {
                            mineSet.add(unknowns[i].key);
                        }
                    }
                    let valid = true;
                    for (const cons of relevantConstraints) {
                        let flaggedInConstraint = 0;
                        let minesInComponent = 0;
                        let outsideUnknownCount = 0;
                        for (const [cr, cc] of cons.cells) {
                            const k = key(cr, cc);
                            const st = cellState[cr][cc];
                            if (st === 'flagged') {
                                flaggedInConstraint++;
                            } else if (st === 'hidden' || st === 'doubt') {
                                if (mineSet.has(k)) {
                                    minesInComponent++;
                                } else if (!component.some(([r, c]) => r === cr && c === cc)) {
                                    outsideUnknownCount++;
                                }
                            }
                        }
                        const totalMinesInConstraint = flaggedInConstraint + minesInComponent;
                        const remainingMines = cons.mines - totalMinesInConstraint;
                        if (remainingMines < 0) { valid = false; break; }
                        if (remainingMines > outsideUnknownCount) { valid = false; break; }
                        const unknownInConstraint = cons.cells.length - flaggedInConstraint;
                        const safeInComponent = unknownInConstraint - minesInComponent - outsideUnknownCount;
                        if (safeInComponent < 0) { valid = false; break; }
                    }
                    if (valid) {
                        solutions.push(mineSet);
                    }
                }
                return solutions;
            }

            function xyisJudgeable(r, c) {
                if (cellState[r][c] === 'revealed') return false;
                if (boardData[r][c] === -1) return false;
                const component = getComponentAll(r, c);
                if (component.length > ENU_LIMIT) return false;
                const solutions = enumerateComponent(component);
                if (solutions.length === 0) return false;
                const cellKey = key(r, c);
                for (const sol of solutions) {
                    if (sol.has(cellKey)) return false;
                }
                return true;
            }

            function enumerateChangeBoard(r, c) {
                const component = getComponentAll(r, c);
                if (component.length > ENU_LIMIT) return { success: false };
                let removedFlags = 0;
                for (const [cr, cc] of component) {
                    if (cellState[cr][cc] === 'flagged') {
                        removedFlags++;
                    }
                    cellState[cr][cc] = 'hidden';
                    const el = getCellEl(cr, cc);
                    if (el) {
                        el.className = 'cell';
                        el.textContent = '';
                    }
                }
                flagCount -= removedFlags;
                for (const [cr, cc] of component) {
                    if (boardData[cr][cc] === -1) {
                        boardData[cr][cc] = 0;
                    }
                }
                const solutions = enumerateComponent(component);
                if (solutions.length === 0) {
                    return { success: false };
                }
                const cellKey = key(r, c);
                const validSolutions = solutions.filter(sol => !sol.has(cellKey));
                if (validSolutions.length === 0) {
                    return { success: false };
                }
                const chosen = validSolutions[Math.floor(Math.random() * validSolutions.length)];
                for (const k of chosen) {
                    const [cr, cc] = k.split(',').map(Number);
                    boardData[cr][cc] = -1;
                }
                const affectedCells = new Set();
                for (const [cr, cc] of component) {
                    for (const [nr, nc] of neighbors(cr, cc)) {
                        affectedCells.add(key(nr, nc));
                    }
                }
                for (const k of affectedCells) {
                    const [cr, cc] = k.split(',').map(Number);
                    if (boardData[cr][cc] === -1) continue;
                    let count = 0;
                    for (const [nr, nc] of neighbors(cr, cc)) {
                        if (boardData[nr][nc] === -1) count++;
                    }
                    boardData[cr][cc] = count;
                }
                let newTotal = 0;
                for (let r2 = 0; r2 < rows; r2++) {
                    for (let c2 = 0; c2 < cols; c2++) {
                        if (boardData[r2][c2] === -1) newTotal++;
                    }
                }
                return { success: true, newTotalMines: newTotal };
            }

            function unsolvableStructure(board) {
                const R = board.length,
                    C = board[0].length;
                for (let i = 0; i < R; i++) {
                    for (let j = 0; j < C; j++) {
                        if (board[i][j] === -1) continue;
                        let count = 0;
                        for (const [nr, nc] of neighbors(i, j)) {
                            if (board[nr][nc] === -1) count++;
                        }
                        if (board[i][j] !== count) return false;
                    }
                }
                return true;
            }

            function isSolvable(board, sr, sc) {
                const R = board.length,
                    C = board[0].length;
                const revealed = new Set();
                const flagged = new Set();

                function reveal(r, c) {
                    if (!isInBounds(r, c)) return;
                    const k = key(r, c);
                    if (revealed.has(k) || flagged.has(k)) return;
                    revealed.add(k);
                    if (board[r][c] === 0) {
                        for (const [nr, nc] of neighbors(r, c)) reveal(nr, nc);
                    }
                }
                reveal(sr, sc);

                let changed = true;
                let iterations = 0;
                const MAX_ITER = 800;
                while (changed && iterations < MAX_ITER) {
                    changed = false;
                    iterations++;
                    for (let r = 0; r < R; r++) {
                        for (let c = 0; c < C; c++) {
                            const k = key(r, c);
                            if (!revealed.has(k)) continue;
                            const num = board[r][c];
                            if (num <= 0) continue;
                            let unknown = [];
                            let flagCnt = 0;
                            for (const [nr, nc] of neighbors(r, c)) {
                                const nk = key(nr, nc);
                                if (flagged.has(nk)) flagCnt++;
                                else if (!revealed.has(nk)) unknown.push([nr, nc]);
                            }
                            const remain = num - flagCnt;
                            if (remain === 0 && unknown.length > 0) {
                                for (const [nr, nc] of unknown) reveal(nr, nc);
                                changed = true;
                            } else if (remain === unknown.length && unknown.length > 0) {
                                for (const [nr, nc] of unknown) flagged.add(key(nr, nc));
                                changed = true;
                            }
                        }
                    }
                    if (!changed) {
                        const constraints = [];
                        for (let r = 0; r < R; r++) {
                            for (let c = 0; c < C; c++) {
                                const k = key(r, c);
                                if (!revealed.has(k)) continue;
                                const num = board[r][c];
                                if (num <= 0) continue;
                                const cells = [];
                                let flagCnt = 0;
                                for (const [nr, nc] of neighbors(r, c)) {
                                    const nk = key(nr, nc);
                                    if (flagged.has(nk)) flagCnt++;
                                    else if (!revealed.has(nk)) cells.push(nk);
                                }
                                const remain = num - flagCnt;
                                if (remain > 0 && cells.length > 1) {
                                    constraints.push({ cells: new Set(cells), mines: remain });
                                }
                            }
                        }
                        for (let i = 0; i < constraints.length; i++) {
                            for (let j = 0; j < constraints.length; j++) {
                                if (i === j) continue;
                                const ci = constraints[i],
                                    cj = constraints[j];
                                if (ci.cells.size >= cj.cells.size) continue;
                                let isSubset = true;
                                for (const cell of ci.cells) {
                                    if (!cj.cells.has(cell)) { isSubset = false; break; }
                                }
                                if (isSubset) {
                                    const diff = [];
                                    for (const cell of cj.cells) {
                                        if (!ci.cells.has(cell)) diff.push(cell);
                                    }
                                    const diffMines = cj.mines - ci.mines;
                                    if (diffMines === 0 && diff.length > 0) {
                                        for (const cell of diff) {
                                            const [nr, nc] = cell.split(',').map(Number);
                                            reveal(nr, nc);
                                        }
                                        changed = true;
                                    } else if (diffMines === diff.length && diff.length > 0) {
                                        for (const cell of diff) flagged.add(cell);
                                        changed = true;
                                    }
                                }
                            }
                        }
                    }
                }
                for (let r = 0; r < R; r++) {
                    for (let c = 0; c < C; c++) {
                        if (board[r][c] !== -1 && !revealed.has(key(r, c))) return false;
                    }
                }
                return true;
            }

            function layMineSolvable(rows, cols, mines, firstR, firstC) {
                const MAX_ATTEMPTS = 10000;
                for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                    const board = tryGenerate(rows, cols, mines, firstR, firstC);
                    if (board && isSolvable(board, firstR, firstC)) {
                        return board;
                    }
                }
                return tryGenerate(rows, cols, mines, firstR, firstC);
            }

            function tryGenerate(rows, cols, mines, firstR, firstC) {
                const board = Array.from({ length: rows }, () => Array(cols).fill(0));
                const safeSet = new Set();
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = firstR + dr,
                            nc = firstC + dc;
                        if (isInBounds(nr, nc)) safeSet.add(nr * cols + nc);
                    }
                }
                const candidates = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!safeSet.has(r * cols + c)) candidates.push([r, c]);
                    }
                }
                if (candidates.length < mines) return board;
                for (let i = candidates.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                }
                for (let i = 0; i < mines; i++) {
                    const [r, c] = candidates[i];
                    board[r][c] = -1;
                }
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c] === -1) continue;
                        let count = 0;
                        for (const [nr, nc] of neighbors(r, c)) {
                            if (board[nr][nc] === -1) count++;
                        }
                        board[r][c] = count;
                    }
                }
                return board;
            }

            function renderBoard() {
                const cfg = getDifficulty();
                rows = cfg.rows;
                cols = cfg.cols;
                totalMines = cfg.mines;
                boardEl.innerHTML = '';
                boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
                cellState = Array.from({ length: rows }, () => Array(cols).fill('hidden'));
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        boardEl.appendChild(cell);
                    }
                }
                updateUI();
                if (currentDiff === 'custom') {
                    msgEl.textContent = `自定义 ${rows}×${cols} ${totalMines}雷 · 点击格子开始`;
                } else {
                    msgEl.textContent = '左键揭开 · 右键标记 · 左键数字和弦 · 右键数字自动插旗';
                }
                msgEl.className = '';
                updateAutoFlagButton();
                hideCelebration();
                hideExplosion();
                closeRankFloat();
                hideBoomFloat();
                updateCustomButtonLabel();
            }

            function updateUI() {
                mineCounter.textContent = pad(Math.max(0, totalMines - flagCount));
                timerCounter.textContent = pad(timer);
                if (gameState === 'won') faceBtn.textContent = '😎';
                else if (gameState === 'lost') faceBtn.textContent = '😵';
                else faceBtn.textContent = '🙂';
            }

            function updateAutoFlagButton() {
                if (autoFlagEnabled) {
                    autoFlagBtn.textContent = '🚩 自动标雷 [开]';
                    autoFlagBtn.className = 'tool-btn on';
                } else {
                    autoFlagBtn.textContent = '🚩 自动标雷 [关]';
                    autoFlagBtn.className = 'tool-btn off';
                }
            }

            function updateCustomButtonLabel() {
                const cfg = DIFFICULTIES.custom;
                customDiffBtn.textContent = `🎛️ 自定义 ${cfg.rows}×${cfg.cols}`;
            }

            function startGame(firstR, firstC) {
                if (isGenerating) return;
                isGenerating = true;
                msgEl.textContent = '生成强可猜雷区...';
                msgEl.className = '';
                setTimeout(() => {
                    boardData = layMineSolvable(rows, cols, totalMines, firstR, firstC);
                    flagCount = 0;
                    revealedCount = 0;
                    timer = 0;
                    gameState = 'playing';
                    firstClick = false;
                    if (timerInterval) { clearInterval(timerInterval);
                        timerInterval = null; }
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            cellState[r][c] = 'hidden';
                            const el = getCellEl(r, c);
                            if (el) { el.className = 'cell';
                                el.textContent = ''; }
                        }
                    }
                    doReveal(firstR, firstC);
                    timerInterval = setInterval(() => {
                        timer++;
                        timerCounter.textContent = pad(timer);
                    }, 1000);
                    updateUI();
                    msgEl.textContent = '游戏中...';
                    msgEl.className = '';
                    isGenerating = false;
                }, 50);
            }

            function scheduleAutoFlag() {
                if (!autoFlagEnabled) return;
                if (gameState !== 'playing') return;
                if (isAutoFlagging) return;
                clearTimeout(autoFlagTimer);
                autoFlagTimer = setTimeout(() => { autoFlagAll(); }, 300);
            }

            function autoFlagAll() {
                if (gameState !== 'playing') { msgEl.textContent = '游戏未开始，无法标雷';
                    msgEl.className = ''; return; }
                if (isAutoFlagging) return;
                isAutoFlagging = true;
                const toFlagSet = new Set();
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (cellState[r][c] !== 'revealed') continue;
                        const num = boardData[r][c];
                        if (num <= 0) continue;
                        let flagCnt = 0;
                        const unknownNotFlagged = [];
                        for (const [nr, nc] of neighbors(r, c)) {
                            const state = cellState[nr][nc];
                            if (state === 'flagged') flagCnt++;
                            else if (state === 'hidden' || state === 'doubt') unknownNotFlagged.push(key(nr, nc));
                        }
                        if (flagCnt < num && unknownNotFlagged.length === num - flagCnt) {
                            for (const k of unknownNotFlagged) toFlagSet.add(k);
                        }
                    }
                }
                if (toFlagSet.size === 0) {
                    msgEl.textContent = '没有可标雷的格子';
                    msgEl.className = '';
                    isAutoFlagging = false;
                    return;
                }
                let flaggedCount = 0;
                for (const k of toFlagSet) {
                    const [r, c] = k.split(',').map(Number);
                    if (cellState[r][c] === 'flagged' || cellState[r][c] === 'revealed') continue;
                    const el = getCellEl(r, c);
                    if (el) {
                        cellState[r][c] = 'flagged';
                        el.className = 'cell flagged';
                        el.textContent = '⚑';
                        flagCount++;
                        flaggedCount++;
                    }
                }
                updateUI();
                if (flaggedCount > 0) {
                    msgEl.textContent = `✅ 自动标雷完成，插旗 ${flaggedCount} 个`;
                    msgEl.className = '';
                } else {
                    msgEl.textContent = '没有可标雷的格子';
                    msgEl.className = '';
                }
                isAutoFlagging = false;
            }

            function revealArea(startR, startC) {
                if (isRevealing) return;
                isRevealing = true;
                const toRevealSet = new Set();
                const queue = [
                    [startR, startC]
                ];
                const visited = new Set();
                visited.add(key(startR, startC));
                while (queue.length > 0) {
                    const [r, c] = queue.shift();
                    const val = boardData[r][c];
                    if (cellState[r][c] !== 'hidden') continue;
                    toRevealSet.add(key(r, c));
                    if (val === 0) {
                        for (const [nr, nc] of neighbors(r, c)) {
                            const k = key(nr, nc);
                            if (!visited.has(k) && cellState[nr][nc] === 'hidden') {
                                visited.add(k);
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }
                if (toRevealSet.size === 0 && cellState[startR][startC] === 'hidden') {
                    revealSingle(startR, startC);
                    isRevealing = false;
                    return;
                }
                const list = Array.from(toRevealSet).map(k => {
                    const [r, c] = k.split(',').map(Number);
                    return { key: k, dist: Math.abs(r - startR) + Math.abs(c - startC) };
                });
                list.sort((a, b) => a.dist - b.dist);
                let index = 0;

                function revealNext() {
                    if (index >= list.length) {
                        isRevealing = false;
                        if (pendingCheck) { pendingCheck = false;
                            checkWin(); }
                        scheduleAutoFlag();
                        return;
                    }
                    const { key: k } = list[index];
                    const [r, c] = k.split(',').map(Number);
                    if (cellState[r][c] === 'hidden') {
                        const el = getCellEl(r, c);
                        const val = boardData[r][c];
                        cellState[r][c] = 'revealed';
                        revealedCount++;
                        el.className = 'cell revealed';
                        if (val > 0) {
                            el.classList.add('n' + val);
                            el.textContent = val;
                        } else { el.textContent = ''; }
                        el.style.transition = 'none';
                        el.style.transform = 'scale(0.5)';
                        el.style.background = 'rgba(60, 180, 255, 0.35)';
                        el.style.boxShadow = '0 0 20px rgba(60, 180, 255, 0.25)';
                        void el.offsetWidth;
                        el.style.transition =
                            'transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease-out, box-shadow 0.3s ease-out';
                        el.style.transform = 'scale(1)';
                        el.style.background = '';
                        setTimeout(() => { el.style.boxShadow = ''; }, 400);
                    }
                    index++;
                    revealTimer = setTimeout(revealNext, 22);
                }
                revealNext();
            }

            function revealSingle(r, c) {
                if (cellState[r][c] !== 'hidden') return;
                const el = getCellEl(r, c);
                const val = boardData[r][c];
                if (val === -1) return;
                cellState[r][c] = 'revealed';
                revealedCount++;
                el.className = 'cell revealed';
                if (val > 0) {
                    el.classList.add('n' + val);
                    el.textContent = val;
                } else { el.textContent = ''; }
                el.style.transition = 'none';
                el.style.opacity = '0.4';
                el.style.transform = 'scale(0.85)';
                void el.offsetWidth;
                el.style.transition = 'opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.2, 0.64, 1)';
                el.style.opacity = '1';
                el.style.transform = 'scale(1)';
                setTimeout(() => { el.style.transition = '';
                    el.style.opacity = '';
                    el.style.transform = ''; }, 250);
            }

            function doReveal(r, c) {
                if (!isInBounds(r, c)) return;
                if (cellState[r][c] !== 'hidden') return;
                if (boardData[r][c] === -1) {
                    const result = enumerateChangeBoard(r, c);
                    if (result.success) {
                        totalMines = result.newTotalMines;
                        updateUI();
                        msgEl.textContent = '🔄 强可猜：已重排雷区，继续游戏';
                        msgEl.className = '';
                        if (boardData[r][c] !== -1) {
                            if (boardData[r][c] === 0) {
                                revealArea(r, c);
                            } else {
                                revealSingle(r, c);
                            }
                            checkWin();
                            scheduleAutoFlag();
                            return;
                        } else {
                            triggerExplosion(r, c, () => { gameOver(r, c); });
                            return;
                        }
                    } else {
                        triggerExplosion(r, c, () => { gameOver(r, c); });
                        return;
                    }
                }
                if (boardData[r][c] === 0) {
                    revealArea(r, c);
                } else {
                    revealSingle(r, c);
                }
                checkWin();
                scheduleAutoFlag();
            }

            function triggerExplosion(r, c, callback) {
                if (isExploding) return;
                isExploding = true;
                const el = getCellEl(r, c);
                if (!el) { if (callback) callback();
                    isExploding = false; return; }
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;

                const app = document.getElementById('app');
                app.classList.add('screen-shake');
                setTimeout(() => { app.classList.remove('screen-shake'); }, 550);

                const flash = document.createElement('div');
                flash.className = 'explosion-flash';
                flash.style.background =
                    'radial-gradient(circle at center, rgba(255, 220, 80, 0.9), rgba(255, 100, 20, 0.6), transparent 75%)';
                document.body.appendChild(flash);
                setTimeout(() => { flash.remove(); }, 800);

                for (let i = 0; i < 5; i++) {
                    const wave = document.createElement('div');
                    wave.className = 'shockwave';
                    wave.style.left = cx + 'px';
                    wave.style.top = cy + 'px';
                    wave.style.animationDelay = (i * 0.08) + 's';
                    const colors = ['rgba(255,180,80,0.9)', 'rgba(255,120,40,0.8)', 'rgba(255,60,10,0.6)',
                        'rgba(255,200,50,0.5)', 'rgba(255,100,30,0.3)'
                    ];
                    const bgColors = ['rgba(255,150,50,0.25)', 'rgba(255,100,30,0.15)', 'rgba(255,60,10,0.1)',
                        'rgba(255,200,50,0.08)', 'rgba(255,100,30,0.05)'
                    ];
                    wave.style.borderColor = colors[i % colors.length];
                    wave.style.background = bgColors[i % bgColors.length];
                    const size = 120 + i * 120;
                    wave.style.width = size + 'px';
                    wave.style.height = size + 'px';
                    wave.style.marginLeft = -(size / 2) + 'px';
                    wave.style.marginTop = -(size / 2) + 'px';
                    document.body.appendChild(wave);
                    setTimeout(() => { wave.remove(); }, 1200 + i * 120);
                }

                const colors = ['#ff6b35', '#ff4500', '#ff8c00', '#ffd700', '#ff3333', '#ff6348', '#ff9f43', '#ff4757', '#ffa502',
                    '#e84118'
                ];
                for (let i = 0; i < 90; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'debris-piece';
                    const size = 3 + Math.random() * 14;
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 60 + Math.random() * 350;
                    const rot = (Math.random() - 0.5) * 900;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const delay = Math.random() * 0.2;
                    piece.style.cssText = `
                        left: ${cx + (Math.random() - 0.5) * 30}px;
                        top: ${cy + (Math.random() - 0.5) * 30}px;
                        width: ${size}px;
                        height: ${size * (0.3 + Math.random() * 1.0)}px;
                        background: ${color};
                        --tx: ${Math.cos(angle) * dist}px;
                        --ty: ${Math.sin(angle) * dist + 60}px;
                        --rot: ${rot}deg;
                        animation-delay: ${delay}s;
                        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                        box-shadow: 0 0 10px rgba(255,150,50,0.4);
                    `;
                    document.body.appendChild(piece);
                    setTimeout(() => { piece.remove(); }, 1300 + delay * 1000);
                }

                for (const [nr, nc] of neighbors(r, c)) {
                    const neighborEl = getCellEl(nr, nc);
                    if (neighborEl && !neighborEl.classList.contains('revealed')) {
                        neighborEl.classList.add('ripple');
                        setTimeout(() => { neighborEl.classList.remove('ripple'); }, 550);
                    }
                }

                setTimeout(() => {
                    isExploding = false;
                    if (callback) callback();
                }, 700);
            }

            function hideExplosion() {
                isExploding = false;
                const app = document.getElementById('app');
                app.classList.remove('screen-shake');
                const elements = document.querySelectorAll('.explosion-flash, .shockwave, .debris-piece');
                elements.forEach(el => el.remove());
            }

            function gameOver(r, c) {
                if (gameState === 'won' || gameState === 'lost') return;
                gameState = 'lost';
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }

                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        const el = getCellEl(i, j);
                        if (!el) continue;
                        if (boardData[i][j] === -1) {
                            if (cellState[i][j] === 'flagged') {
                                el.className = 'cell flagged';
                                el.textContent = '⚑';
                            } else {
                                el.className = 'cell revealed mine-shown';
                            }
                        } else if (cellState[i][j] === 'flagged') {
                            el.className = 'cell revealed flag-miss';
                            el.textContent = '';
                        }
                    }
                }

                const el = getCellEl(r, c);
                if (el) {
                    el.className = 'cell revealed mine-exploded';
                    el.textContent = '•';
                }

                updateUI();
                msgEl.textContent = '💥 踩雷了！';
                msgEl.className = 'lose';
                hideCelebration();

                setTimeout(() => {
                    showBoomFloat(totalMines, Math.max(0, totalMines - flagCount));
                }, 700);
            }

            function checkWin() {
                if (isRevealing) { pendingCheck = true; return; }
                const totalCells = rows * cols;
                if (revealedCount === totalCells - totalMines && gameState !== 'won') {
                    gameState = 'won';
                    if (timerInterval) { clearInterval(timerInterval);
                        timerInterval = null; }
                    for (let i = 0; i < rows; i++) {
                        for (let j = 0; j < cols; j++) {
                            if (boardData[i][j] === -1 && cellState[i][j] !== 'flagged') {
                                const el = getCellEl(i, j);
                                if (el) {
                                    cellState[i][j] = 'flagged';
                                    el.className = 'cell flagged';
                                    el.textContent = '⚑';
                                    flagCount++;
                                }
                            }
                        }
                    }
                    updateUI();
                    msgEl.textContent = '🎉 恭喜你赢了！用时 ' + timer + ' 秒';
                    msgEl.className = 'win';
                    saveRecord(timer);
                    showCelebration(timer);
                }
            }

            function toggleFlag(r, c) {
                if (gameState !== 'playing' && gameState !== 'idle') return;
                if (cellState[r][c] === 'revealed') return;
                const el = getCellEl(r, c);
                if (!el) return;
                if (cellState[r][c] === 'flagged') {
                    cellState[r][c] = 'doubt';
                    el.className = 'cell doubt';
                    el.textContent = '?';
                    flagCount--;
                } else if (cellState[r][c] === 'doubt') {
                    cellState[r][c] = 'hidden';
                    el.className = 'cell';
                    el.textContent = '';
                } else {
                    cellState[r][c] = 'flagged';
                    el.className = 'cell flagged';
                    el.textContent = '⚑';
                    flagCount++;
                }
                updateUI();
                scheduleAutoFlag();
            }

            function chordReveal(r, c) {
                if (gameState !== 'playing') return;
                if (cellState[r][c] !== 'revealed') return;
                const num = boardData[r][c];
                if (num <= 0) return;
                let flagCnt = 0;
                const toReveal = [];
                for (const [nr, nc] of neighbors(r, c)) {
                    const state = cellState[nr][nc];
                    if (state === 'flagged') flagCnt++;
                    else if (state === 'hidden' || state === 'doubt') toReveal.push([nr, nc]);
                }
                if (flagCnt === num && toReveal.length > 0) {
                    for (const [nr, nc] of toReveal) {
                        if (boardData[nr][nc] === -1) {
                            const result = enumerateChangeBoard(nr, nc);
                            if (result.success) {
                                totalMines = result.newTotalMines;
                                updateUI();
                                msgEl.textContent = '🔄 强可猜：已重排雷区，继续游戏';
                                msgEl.className = '';
                                if (boardData[nr][nc] !== -1) {
                                    doReveal(nr, nc);
                                } else {
                                    triggerExplosion(nr, nc, () => { gameOver(nr, nc); });
                                }
                                return;
                            } else {
                                triggerExplosion(nr, nc, () => { gameOver(nr, nc); });
                                return;
                            }
                        }
                        doReveal(nr, nc);
                    }
                    setTimeout(() => { checkWin();
                        scheduleAutoFlag(); }, 50);
                }
            }

            function autoFlagSingle(r, c) {
                if (gameState !== 'playing') return;
                if (cellState[r][c] !== 'revealed') return;
                const num = boardData[r][c];
                if (num <= 0) return;
                let flagCnt = 0;
                const unknownNotFlagged = [];
                for (const [nr, nc] of neighbors(r, c)) {
                    const state = cellState[nr][nc];
                    if (state === 'flagged') flagCnt++;
                    else if (state === 'hidden' || state === 'doubt') unknownNotFlagged.push([nr, nc]);
                }
                if (flagCnt < num && unknownNotFlagged.length === num - flagCnt) {
                    for (const [nr, nc] of unknownNotFlagged) {
                        const el = getCellEl(nr, nc);
                        if (el) {
                            cellState[nr][nc] = 'flagged';
                            el.className = 'cell flagged';
                            el.textContent = '⚑';
                            flagCount++;
                        }
                    }
                    updateUI();
                    scheduleAutoFlag();
                }
            }

            function showCelebration(time) {
                if (isCelebrating) return;
                isCelebrating = true;
                winTimeVal.textContent = time;
                celebrationEl.classList.add('active');
                const overlay = document.getElementById('celebration-overlay');
                const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43', '#00d2d3', '#f368e0', '#ffd700',
                    '#ff4757', '#2ed573', '#1e90ff'
                ];
                const existing = overlay.querySelectorAll('.confetti-piece');
                existing.forEach(el => el.remove());
                for (let i = 0; i < 100; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const size = 6 + Math.random() * 10;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const left = Math.random() * 100;
                    const delay = Math.random() * 2.5;
                    const duration = 2.5 + Math.random() * 2.5;
                    const rotate = Math.random() * 720;
                    piece.style.cssText =
                        `left:${left}%;width:${size}px;height:${size*(0.6+Math.random()*0.8)}px;background:${color};animation-delay:${delay}s;animation-duration:${duration}s;border-radius:${Math.random()>0.5?'50%':'2px'};transform:rotate(${rotate}deg);`;
                    overlay.appendChild(piece);
                }
                setTimeout(() => {
                    const pieces = overlay.querySelectorAll('.confetti-piece');
                    pieces.forEach(el => el.style.opacity = '0');
                    setTimeout(() => { pieces.forEach(el => el.remove()); }, 600);
                }, 5000);
            }

            function hideCelebration() {
                isCelebrating = false;
                celebrationEl.classList.remove('active');
                const overlay = document.getElementById('celebration-overlay');
                const pieces = overlay.querySelectorAll('.confetti-piece');
                pieces.forEach(el => el.remove());
            }

            function showBoomFloat(mineCount, remainCount) {
                boomMineCount.textContent = mineCount;
                boomRemainCount.textContent = remainCount;
                boomFloat.classList.add('active');
                boomShown = true;
            }

            function hideBoomFloat() {
                boomFloat.classList.remove('active');
                boomShown = false;
            }

            function getRecords() {
                try { const data = localStorage.getItem('minesweeper_records'); return data ? JSON.parse(data) : {}; } catch { return {}; }
            }

            function saveRecord(time) {
                const records = getRecords();
                const key = currentDiff === 'custom' ? 'custom' : currentDiff;
                if (!records[key]) records[key] = [];
                let label = DIFFICULTIES[currentDiff]?.label || '自定义';
                if (currentDiff === 'custom') {
                    label = `自定义 ${rows}×${cols} ${totalMines}雷`;
                }
                records[key].push({ time, date: new Date().toLocaleString('zh-CN'), label });
                records[key].sort((a, b) => a.time - b.time);
                if (records[key].length > 10) records[key] = records[key].slice(0, 10);
                try { localStorage.setItem('minesweeper_records', JSON.stringify(records)); } catch {}
            }

            function renderRankContent() {
                const records = getRecords();
                let html = '';
                const keys = ['beginner', 'intermediate', 'expert', 'master', 'hell', 'custom'];
                const labels = { beginner: '初级', intermediate: '中级', expert: '高级', master: '大师', hell: '地狱', custom: '自定义' };
                for (const k of keys) {
                    const list = records[k] || [];
                    const label = labels[k] || '自定义';
                    html += `<div class="rank-group"><h3>${label}</h3>`;
                    if (list.length === 0) { html += `<div class="rank-empty">暂无记录</div>`; } else {
                        html += `<table class="rank-table"><tr><th>#</th><th>用时</th><th>日期</th></tr>`;
                        const show = list.slice(0, 5);
                        for (let i = 0; i < show.length; i++) {
                            const rec = show[i];
                            const displayLabel = rec.label && k === 'custom' ? rec.label : '';
                            html +=
                                `<tr><td class="rank-num">${i+1}</td><td class="rank-time">${rec.time}s${displayLabel ? ' ' + displayLabel : ''}</td><td class="rank-date">${rec.date}</td></tr>`;
                        }
                        if (list.length > 5) {
                            html +=
                                `<tr><td colspan="3" style="color:var(--text-tertiary);font-size:13px;padding-top:8px;">⋯ 还有 ${list.length-5} 条记录</td></tr>`;
                        }
                        html += `</table>`;
                    }
                    html += `</div>`;
                }
                rankBody.innerHTML = html;
            }

            function openRankFloat() { renderRankContent();
                rankFloat.classList.add('open'); }

            function closeRankFloat() { rankFloat.classList.remove('open'); }

            let dragData = null;
            rankHeader.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'BUTTON') return;
                const rect = rankFloat.getBoundingClientRect();
                dragData = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
            });

            function onDragMove(e) {
                if (!dragData) return;
                let left = e.clientX - dragData.offsetX;
                let top = e.clientY - dragData.offsetY;
                left = Math.max(0, Math.min(left, window.innerWidth - rankFloat.offsetWidth));
                top = Math.max(0, Math.min(top, window.innerHeight - rankFloat.offsetHeight));
                rankFloat.style.left = left + 'px';
                rankFloat.style.right = 'auto';
                rankFloat.style.top = top + 'px';
            }

            function onDragEnd() { dragData = null;
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd); }

            function openCustomFloat() {
                customRows.value = customConfig.rows;
                customCols.value = customConfig.cols;
                customMines.value = customConfig.mines;
                customHint.textContent = '';
                customHint.className = '';
                updateMinesHint();
                customFloat.classList.add('open');
                customBackdrop.classList.add('open');
                customRows.focus();
                customRows.select();
            }

            function closeCustomFloat() {
                customFloat.classList.remove('open');
                customBackdrop.classList.remove('open');
                customHint.textContent = '';
                customHint.className = '';
                document.querySelectorAll('.custom-row input').forEach(el => el.classList.remove('error'));
            }

            function updateMinesHint() {
                const r = parseInt(customRows.value) || 1;
                const c = parseInt(customCols.value) || 1;
                const maxMines = r * c - 1;
                customMines.max = maxMines;
                customMinesHint.textContent = `(1 ~ ${Math.min(maxMines, 999)})`;
            }

            function applyCustom() {
                const r = parseInt(customRows.value);
                const c = parseInt(customCols.value);
                const m = parseInt(customMines.value);
                let valid = true;
                document.querySelectorAll('.custom-row input').forEach(el => el.classList.remove('error'));
                if (isNaN(r) || r < 3 || r > 50) {
                    customRows.classList.add('error');
                    customHint.textContent = '行数请输入 3 ~ 50 之间的整数';
                    valid = false;
                } else if (isNaN(c) || c < 3 || c > 50) {
                    customCols.classList.add('error');
                    customHint.textContent = '列数请输入 3 ~ 50 之间的整数';
                    valid = false;
                } else if (isNaN(m) || m < 1 || m > r * c - 1) {
                    customMines.classList.add('error');
                    customHint.textContent = `雷数请输入 1 ~ ${r * c - 1} 之间的整数`;
                    valid = false;
                }
                if (!valid) return;
                customConfig = { rows: r, cols: c, mines: m };
                DIFFICULTIES.custom.rows = r;
                DIFFICULTIES.custom.cols = c;
                DIFFICULTIES.custom.mines = m;
                try {
                    localStorage.setItem('ms_custom_config', JSON.stringify(customConfig));
                } catch (_) {}
                closeCustomFloat();
                setDifficulty('custom');
            }

            function resetGame() {
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                gameState = 'idle';
                firstClick = true;
                flagCount = 0;
                revealedCount = 0;
                timer = 0;
                boardData = [];
                cellState = [];
                autoFlagEnabled = true;
                updateAutoFlagButton();
                if (revealTimer) { clearTimeout(revealTimer);
                    revealTimer = null; }
                isRevealing = false;
                pendingCheck = false;
                hideCelebration();
                hideExplosion();
                closeRankFloat();
                hideBoomFloat();
                renderBoard();
                updateUI();
                if (currentDiff === 'custom') {
                    msgEl.textContent = `自定义 ${rows}×${cols} ${totalMines}雷 · 点击格子开始`;
                } else {
                    msgEl.textContent = '左键揭开 · 右键标记 · 左键数字和弦 · 右键数字自动插旗';
                }
                msgEl.className = '';
            }

            function setDifficulty(diff) {
                if (diff === currentDiff && gameState !== 'idle') {
                    resetGame();
                    return;
                }
                currentDiff = diff;
                diffBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.diff === diff);
                });
                updateCustomButtonLabel();
                resetGame();
            }

            let mouseButtons = { left: false, right: false };

            boardEl.addEventListener('mousedown', function(e) {
                if (isCelebrating || isExploding || boomShown) return;
                const cell = e.target.closest('.cell');
                if (!cell) return;
                const r = parseInt(cell.dataset.r);
                const c = parseInt(cell.dataset.c);
                if (isNaN(r) || isNaN(c)) return;
                if (e.button === 0) mouseButtons.left = true;
                if (e.button === 2) mouseButtons.right = true;
                if (e.button === 0 && !mouseButtons.right) {
                    if (gameState === 'idle') { startGame(r, c); } else if (gameState === 'playing') {
                        if (cellState[r][c] === 'hidden') { doReveal(r, c); } else if (cellState[r][c] === 'revealed') { chordReveal(
                                r, c); }
                    }
                }
                if (e.button === 2) {
                    e.preventDefault();
                    if (gameState === 'idle') return;
                    if (cellState[r][c] === 'revealed') { autoFlagSingle(r, c); } else { toggleFlag(r, c); }
                }
                if (e.button === 1) { e.preventDefault();
                    chordReveal(r, c); }
            });

            boardEl.addEventListener('mouseup', function(e) {
                const cell = e.target.closest('.cell');
                if (!cell) return;
                const r = parseInt(cell.dataset.r);
                const c = parseInt(cell.dataset.c);
                if (isNaN(r) || isNaN(c)) return;
                if (e.button === 0) mouseButtons.left = false;
                if (e.button === 2) mouseButtons.right = false;
            });

            boardEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            faceBtn.addEventListener('click', resetGame);

            diffBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const diff = this.dataset.diff;
                    if (diff === 'custom') {
                        openCustomFloat();
                    } else {
                        setDifficulty(diff);
                    }
                });
            });

            rankBtn.addEventListener('click', openRankFloat);
            rankClose.addEventListener('click', closeRankFloat);

            autoFlagBtn.addEventListener('click', function() {
                autoFlagEnabled = !autoFlagEnabled;
                updateAutoFlagButton();
                if (autoFlagEnabled) { autoFlagAll(); } else { msgEl.textContent = '自动标雷已关闭';
                    msgEl.className = ''; }
            });

            winBtn.addEventListener('click', resetGame);
            boomRetryBtn.addEventListener('click', resetGame);

            customClose.addEventListener('click', closeCustomFloat);
            customCancel.addEventListener('click', closeCustomFloat);
            customBackdrop.addEventListener('click', closeCustomFloat);

            customRows.addEventListener('input', function() {
                this.classList.remove('error');
                updateMinesHint();
                const r = parseInt(this.value) || 1;
                const c = parseInt(customCols.value) || 1;
                const maxMines = r * c - 1;
                customMines.max = maxMines;
                const currentMines = parseInt(customMines.value) || 1;
                if (currentMines > maxMines) {
                    customMines.value = Math.min(currentMines, maxMines);
                }
                customMinesHint.textContent = `(1 ~ ${Math.min(maxMines, 999)})`;
            });
            customCols.addEventListener('input', function() {
                this.classList.remove('error');
                updateMinesHint();
                const r = parseInt(customRows.value) || 1;
                const c = parseInt(this.value) || 1;
                const maxMines = r * c - 1;
                customMines.max = maxMines;
                const currentMines = parseInt(customMines.value) || 1;
                if (currentMines > maxMines) {
                    customMines.value = Math.min(currentMines, maxMines);
                }
                customMinesHint.textContent = `(1 ~ ${Math.min(maxMines, 999)})`;
            });
            customMines.addEventListener('input', function() {
                this.classList.remove('error');
                const r = parseInt(customRows.value) || 1;
                const c = parseInt(customCols.value) || 1;
                const maxMines = r * c - 1;
                if (parseInt(this.value) > maxMines) {
                    this.value = maxMines;
                }
                if (parseInt(this.value) < 1) {
                    this.value = 1;
                }
            });

            customStart.addEventListener('click', applyCustom);

            customRows.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    customCols.focus(); } });
            customCols.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    customMines.focus(); } });
            customMines.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    applyCustom(); } });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (customFloat.classList.contains('open')) { closeCustomFloat(); return; }
                    closeRankFloat();
                    if (boomShown) hideBoomFloat();
                }
                if ((e.key === 'r' || e.key === 'R') && boomShown) { resetGame(); return; }
                if (e.key === 'r' || e.key === 'R') {
                    if (!rankFloat.classList.contains('open') && !boomShown && !customFloat.classList.contains('open'))
                    resetGame();
                }
                if (e.key >= '1' && e.key <= '5') {
                    const diffs = ['beginner', 'intermediate', 'expert', 'master', 'hell'];
                    const idx = parseInt(e.key) - 1;
                    if (idx < diffs.length && !customFloat.classList.contains('open')) setDifficulty(diffs[idx]);
                }
            });

            resetGame();
        })();
    </script>
