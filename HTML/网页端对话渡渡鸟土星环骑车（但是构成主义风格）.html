<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- 构成主义半调网点 -->
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <!-- 网格图案 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E63946" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <!-- 土星环遮罩，隐藏行星后方的环 -->
    <mask id="ringMask">
      <rect width="1200" height="800" fill="white"/>
      <circle cx="380" cy="420" r="160" fill="black"/>
    </mask>
    <!-- 土星纹理裁剪路径 -->
    <clipPath id="planetClip">
      <circle cx="380" cy="420" r="160"/>
    </clipPath>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1200" height="800" fill="#0b0e14"/>
  
  <!-- 构成主义几何背景 -->
  <rect width="1200" height="800" fill="url(#grid)"/>
  
  <!-- 大块几何色块 -->
  <polygon points="0,0 350,0 150,350" fill="#1D3557" opacity="0.4"/>
  <polygon points="1200,800 850,800 1050,450" fill="#457B9D" opacity="0.2"/>
  <polygon points="0,800 200,800 0,600" fill="#E63946" opacity="0.15"/>
  <polygon points="1200,0 1000,0 1200,200" fill="#E9C46A" opacity="0.15"/>

  <!-- 动态对角线 -->
  <line x1="0" y1="300" x2="400" y2="0" stroke="#E63946" stroke-width="6" opacity="0.7"/>
  <line x1="800" y1="800" x2="1200" y2="600" stroke="#E9C46A" stroke-width="4" opacity="0.5"/>
  <line x1="200" y1="800" x2="600" y2="500" stroke="#F1FAEE" stroke-width="2" opacity="0.3"/>

  <!-- 边缘色条 -->
  <rect x="0" y="0" width="30" height="800" fill="#E63946" opacity="0.9"/>
  <rect x="1170" y="0" width="30" height="800" fill="#E63946" opacity="0.9"/>

  <!-- ===== 星空 ===== -->
  <g>
    <!-- 几何星星 -->
    <circle cx="100" cy="120" r="2.5" fill="#F1FAEE"/>
    <circle cx="350" cy="80" r="1.5" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="600" cy="150" r="3" fill="#F1FAEE"/>
    <circle cx="850" cy="80" r="1.5" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="1100" cy="200" r="2" fill="#F1FAEE"/>
    <circle cx="50" cy="350" r="2" fill="#F1FAEE" opacity="0.6"/>
    <circle cx="500" cy="300" r="1.5" fill="#F1FAEE" opacity="0.9"/>
    <circle cx="950" cy="350" r="2.5" fill="#F1FAEE"/>
    <circle cx="1150" cy="500" r="1.5" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="150" cy="550" r="2" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="450" cy="650" r="1.5" fill="#F1FAEE"/>
    <circle cx="750" cy="750" r="2" fill="#F1FAEE" opacity="0.8"/>
    <circle cx="1050" cy="700" r="2.5" fill="#F1FAEE"/>
    <circle cx="80" cy="250" r="1.5" fill="#F1FAEE" opacity="0.5"/>
    <circle cx="300" cy="200" r="2" fill="#F1FAEE" opacity="0.7"/>
    <circle cx="700" cy="250" r="1.5" fill="#F1FAEE" opacity="0.6"/>
    <circle cx="900" cy="450" r="2" fill="#F1FAEE" opacity="0.8"/>

    <!-- 四角星（构成主义风格） -->
    <g fill="#F1FAEE" opacity="0.9">
      <path d="M 200,200 Q 200,210 210,210 Q 200,210 200,220 Q 200,210 190,210 Q 200,210 200,200 Z"/>
      <path d="M 700,120 Q 700,135 715,135 Q 700,135 700,150 Q 700,135 685,135 Q 700,135 700,120 Z" fill="#E63946"/>
      <path d="M 1000,280 Q 1000,295 1015,295 Q 1000,295 1000,310 Q 1000,295 985,295 Q 1000,295 1000,280 Z"/>
      <path d="M 400,500 Q 400,510 410,510 Q 400,510 400,520 Q 400,510 390,510 Q 400,510 400,500 Z" fill="#F1FAEE" opacity="0.7"/>
      <path d="M 850,550 Q 850,565 865,565 Q 850,565 850,580 Q 850,565 835,565 Q 850,565 850,550 Z"/>
      <path d="M 1100,650 Q 1100,660 1110,660 Q 1100,660 1100,670 Q 1100,660 1090,660 Q 1100,660 1100,650 Z" fill="#E63946"/>
    </g>
  </g>

  <!-- ===== 太阳（构成主义风格，无放射线） ===== -->
  <g>
    <!-- 太阳背景光环 -->
    <circle cx="1000" cy="200" r="140" fill="#E63946" opacity="0.1"/>
    <circle cx="1000" cy="200" r="110" fill="#E63946" opacity="0.2"/>
    <circle cx="1000" cy="200" r="80" fill="#E9C46A" opacity="0.4"/>
    <!-- 太阳本体 -->
    <circle cx="1000" cy="200" r="60" fill="#F4A261"/>
    <circle cx="1000" cy="200" r="45" fill="#E9C46A"/>
    <circle cx="1000" cy="200" r="30" fill="#F1FAEE"/>
    <!-- 太阳表面的几何纹理 -->
    <circle cx="985" cy="185" r="12" fill="#E9C46A" opacity="0.6"/>
    <circle cx="1015" cy="215" r="15" fill="#E9C46A" opacity="0.5"/>
    <circle cx="1000" cy="200" r="8" fill="#E63946" opacity="0.4"/>
  </g>

  <!-- ===== 土星（整体偏左下，向上移动并倾斜） ===== -->
  <g>
    <!-- 土星外发光 -->
    <circle cx="380" cy="420" r="220" fill="#E9C46A" opacity="0.06"/>

    <!-- 土星环（多层，构成主义粗线条风格，使用遮罩隐藏行星后方部分） -->
    <g mask="url(#ringMask)" transform="rotate(-15 380 420)">
      <!-- 最外层环 -->
      <ellipse cx="380" cy="420" rx="380" ry="100" fill="none" stroke="#264653" stroke-width="18" opacity="0.9"/>
      <ellipse cx="380" cy="420" rx="360" ry="94" fill="none" stroke="#E9C46A" stroke-width="22" opacity="0.95"/>
      <ellipse cx="380" cy="420" rx="340" ry="88" fill="none" stroke="#E63946" stroke-width="12" opacity="0.8"/>
      <ellipse cx="380" cy="420" rx="320" ry="82" fill="none" stroke="#F4A261" stroke-width="20" opacity="0.9"/>
      <ellipse cx="380" cy="420" rx="300" ry="76" fill="none" stroke="#264653" stroke-width="15" opacity="0.7"/>
      <ellipse cx="380" cy="420" rx="280" ry="70" fill="none" stroke="#F1FAEE" stroke-width="10" opacity="0.6"/>
      <ellipse cx="380" cy="420" rx="260" ry="64" fill="none" stroke="#E9C46A" stroke-width="8" opacity="0.7"/>
      
      <!-- 环的高光细节 -->
      <path d="M 20,420 A 360,94 0 0,1 740,420" fill="none" stroke="#F1FAEE" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- 行星本体 -->
    <circle cx="380" cy="420" r="160" fill="#1D3557"/>

    <!-- 行星表面纹理（几何风格） -->
    <g clip-path="url(#planetClip)" transform="rotate(-15 380 420)">
      <!-- 云带 -->
      <ellipse cx="380" cy="300" rx="180" ry="20" fill="#E9C46A" opacity="0.3"/>
      <ellipse cx="380" cy="350" rx="180" ry="25" fill="#F1FAEE" opacity="0.15"/>
      <ellipse cx="380" cy="400" rx="180" ry="15" fill="#E63946" opacity="0.25"/>
      <ellipse cx="380" cy="460" rx="180" ry="30" fill="#F4A261" opacity="0.2"/>
      <ellipse cx="380" cy="520" rx="180" ry="18" fill="#E9C46A" opacity="0.3"/>
      <ellipse cx="380" cy="570" rx="180" ry="22" fill="#F1FAEE" opacity="0.1"/>
      
      <!-- 构成主义几何装饰 -->
      <polygon points="280,320 330,340 300,380" fill="#E63946" opacity="0.4"/>
      <polygon points="480,480 430,510 460,540" fill="#E9C46A" opacity="0.3"/>
      <line x1="200" y1="420" x2="560" y2="420" stroke="#F1FAEE" stroke-width="2" opacity="0.25"/>
      <line x1="250" y1="300" x2="510" y2="540" stroke="#F4A261" stroke-width="2" opacity="0.25"/>
      
      <!-- 阴影与立体感 -->
      <circle cx="380" cy="420" r="160" fill="#000000" opacity="0.45"/>
      <circle cx="430" cy="420" r="160" fill="#000000" opacity="0.15"/>
      <ellipse cx="320" cy="350" rx="70" ry="50" fill="#ffffff" opacity="0.05" transform="rotate(-30 320 350)"/>
    </g>
  </g>

  <!-- ===== 渡渡鸟 + 自行车（构成主义风格，骑在土星环上） ===== -->
  <g transform="translate(720, 400) rotate(-15)">
    <!-- 整体颠簸浮动动画 -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0; 0,-4; 0,0; 0,4; 0,0" dur="1.2s" repeatCount="indefinite"/>
      
      <!-- 后轮 -->
      <g transform="translate(-46,0)">
        <circle r="28" fill="none" stroke="#F1FAEE" stroke-width="6"/>
        <circle r="22" fill="none" stroke="#E63946" stroke-width="2" opacity="0.8"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-20" y1="0" x2="20" y2="0" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="0" y1="-20" x2="0" y2="20" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="-14.1" y1="-14.1" x2="14.1" y2="14.1" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="14.1" y1="-14.1" x2="-14.1" y2="14.1" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
        </g>
        <circle r="5" fill="#E9C46A"/>
      </g>

      <!-- 前轮 -->
      <g transform="translate(46,0)">
        <circle r="28" fill="none" stroke="#F1FAEE" stroke-width="6"/>
        <circle r="22" fill="none" stroke="#E63946" stroke-width="2" opacity="0.8"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-20" y1="0" x2="20" y2="0" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="0" y1="-20" x2="0" y2="20" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="-14.1" y1="-14.1" x2="14.1" y2="14.1" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
          <line x1="14.1" y1="-14.1" x2="-14.1" y2="14.1" stroke="#F1FAEE" stroke-width="1.5" opacity="0.9"/>
        </g>
        <circle r="5" fill="#E9C46A"/>
      </g>

      <!-- 车架（粗线条几何风格） -->
      <g stroke="#F1FAEE" stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="0"   y1="0"   x2="-46" y2="0"/>
        <line x1="-38" y1="-65" x2="-46" y2="0"/>
        <line x1="-38" y1="-65" x2="0"   y2="0"/>
        <line x1="0"   y1="0"   x2="38"  y2="-58"/>
        <line x1="-38" y1="-65" x2="38"  y2="-58"/>
        <line x1="38"  y1="-58" x2="46"  y2="0"/>
      </g>

      <!-- 车座 -->
      <polygon points="-38,-68 -28,-65 -30,-60 -40,-63" fill="#E63946"/>

      <!-- 车把 -->
      <line x1="38" y1="-58" x2="42" y2="-70" stroke="#F1FAEE" stroke-width="5" stroke-linecap="round"/>
      <path d="M 32 -74 L 48 -68" stroke="#F1FAEE" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- 曲柄和踏板 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
        <circle r="12" fill="none" stroke="#F1FAEE" stroke-width="3"/>
        <circle r="4" fill="#E9C46A"/>
        <line x1="0" y1="0" x2="15"  y2="0" stroke="#F1FAEE" stroke-width="4" stroke-linecap="round"/>
        <circle cx="15"  cy="0" r="5" fill="#E63946"/>
        <line x1="0" y1="0" x2="-15" y2="0" stroke="#F1FAEE" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-15" cy="0" r="5" fill="#264653"/>
      </g>

      <!-- 远侧腿（深色，构成主义线条） -->
      <path fill="none" stroke="#1D3557" stroke-width="6" stroke-linecap="round"
            d="M -35,-80 Q -15,-45 -10,0">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M -35,-80 Q -15,-45 -10,0; M -35,-80 Q 0,-45 15,0; M -35,-80 Q -15,-45 -10,0"/>
      </path>

      <!-- 渡渡鸟身体 -->
      <g>
        <!-- 尾巴（几何三角形） -->
        <polygon points="-75,-120 -100,-135 -105,-115" fill="#264653"/>
        <polygon points="-78,-115 -95,-125 -100,-110" fill="#E63946" opacity="0.6"/>
        
        <!-- 身体（大椭圆） -->
        <ellipse cx="-48" cy="-110" rx="38" ry="42" fill="#E9C46A" transform="rotate(-15 -48 -110)"/>
        
        <!-- 腹部亮面 -->
        <ellipse cx="-42" cy="-98" rx="25" ry="28" fill="#F1FAEE" opacity="0.2" transform="rotate(-15 -42 -98)"/>
        
        <!-- 翅膀（几何形状） -->
        <ellipse cx="-65" cy="-115" rx="16" ry="28" fill="#1D3557" transform="rotate(-20 -65 -115)"/>
        <path d="M -75 -125 L -55 -120 L -70 -100 Z" fill="#E9C46A" opacity="0.4"/>
        
        <!-- 脖子 -->
        <path d="M -42 -135 Q -35 -160 -25 -170" fill="none" stroke="#E9C46A" stroke-width="20" stroke-linecap="round"/>
        
        <!-- 头部 -->
        <circle cx="-22" cy="-178" r="20" fill="#E9C46A"/>
        
        <!-- 喙（几何三角形） -->
        <polygon points="-8,-185 20,-178 -5,-172" fill="#E63946"/>
        <polygon points="-8,-185 20,-178 -5,-172" fill="#F4A261" opacity="0.5"/>
        
        <!-- 眼睛（几何圆形） -->
        <circle cx="-18" cy="-185" r="4.5" fill="#0b0e14"/>
        <circle cx="-19" cy="-186" r="1.5" fill="#F1FAEE"/>
        
        <!-- 头顶的装饰（构成主义元素） -->
        <line x1="-30" y1="-195" x2="-25" y2="-205" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
        <line x1="-22" y1="-198" x2="-18" y2="-210" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 近侧腿（浅色，构成主义线条） -->
      <path fill="none" stroke="#F1FAEE" stroke-width="6" stroke-linecap="round"
            d="M -30,-80 Q 0,-45 15,0">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M -30,-80 Q 0,-45 15,0; M -30,-80 Q -15,-45 -10,0; M -30,-80 Q 0,-45 15,0"/>
      </path>
    </g>
  </g>

  <!-- ===== 先锋派排版与装饰 ===== -->
  <!-- 构成主义文字 -->
  <g fill="#F1FAEE" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="60" y="720" font-size="28" letter-spacing="4" opacity="0.95">COSMOS</text>
    <text x="60" y="750" font-size="14" letter-spacing="6" opacity="0.7">1969</text>
    
    <text x="1050" y="60" font-size="20" letter-spacing="3" opacity="0.9">SATURN</text>
    <text x="1050" y="85" font-size="12" letter-spacing="2" opacity="0.6">MISSION</text>
  </g>

  <!-- 构成主义装饰圆环 -->
  <circle cx="150" cy="650" r="80" fill="none" stroke="#F1FAEE" stroke-width="2" opacity="0.3"/>
  <circle cx="150" cy="650" r="60" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="650" r="40" fill="none" stroke="#E9C46A" stroke-width="1" opacity="0.7"/>

  <!-- 右下角几何色块 -->
  <polygon points="1200,800 1000,800 1200,600" fill="#E9C46A" opacity="0.7"/>
  <polygon points="1200,800 1080,800 1200,680" fill="#E63946" opacity="0.9"/>

  <!-- 复古海报风格半调网点覆盖层 -->
  <rect width="100%" height="100%" fill="url(#dots)" pointer-events="none"/>
</svg>
