<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="utf-8">
<title>钢铁黎明 · 2.5D 坦克大战</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <div id="hud">
    <div class="hud-row hud-top">
      <div class="panel panel-left">
        <div class="level-badge"><span id="hud-level">1</span><i>/ 6</i></div>
        <div class="level-name" id="hud-level-name">砖城</div>
        <div class="stat-row">
          <span class="stat-label">得分</span>
          <span class="stat-value" id="hud-score">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">生命</span>
          <span class="lives" id="hud-lives"></span>
        </div>
      </div>

      <div class="panel panel-right">
        <div class="stat-row">
          <span class="stat-label">剩余敌军</span>
          <span class="stat-value" id="hud-enemies">0</span>
        </div>
        <div class="enemy-strip" id="hud-enemy-strip"></div>
        <div class="buff-list" id="hud-buffs"></div>
      </div>
    </div>

    <div class="hud-row hud-bottom">
      <div class="hint-bar" id="hud-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动
        <span class="sep"></span>
        <kbd>空格</kbd> / <kbd>J</kbd> 开火
        <span class="sep"></span>
        <kbd>P</kbd> 暂停
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="screen" id="screen-loading">
      <div class="brand">钢铁黎明</div>
      <div class="sub">2.5D TANK BATTLE</div>
      <div class="loading-bar"><i></i></div>
      <div class="tip" id="loading-tip">正在锻造材质…</div>
    </div>

    <div class="screen hidden" id="screen-title">
      <div class="brand">钢铁黎明</div>
      <div class="sub">2.5D TANK BATTLE · 6 个关卡</div>
      <p class="desc">保卫你的基地，歼灭来犯的钢铁洪流。<br>摧毁每一关的全部敌军即可进入下一战区。</p>
      <button class="btn" id="btn-start">开始战斗</button>
      <div class="picker-cap">选择战区</div>
      <div class="level-picker" id="level-picker"></div>
      <div class="keylist">
        <span><kbd>WASD</kbd> 移动</span><span><kbd>空格</kbd> 开火</span><span><kbd>P</kbd> 暂停</span>
      </div>
    </div>

    <div class="screen hidden" id="screen-level">
      <div class="level-kicker">第 <span id="lv-num">1</span> 关</div>
      <div class="level-title" id="lv-title">砖城</div>
      <div class="level-sub" id="lv-sub">敌军 12 辆</div>
    </div>

    <div class="screen hidden" id="screen-pause">
      <div class="brand small">已暂停</div>
      <button class="btn" id="btn-resume">继续战斗</button>
      <button class="btn ghost" id="btn-restart">重打本关</button>
    </div>

    <div class="screen hidden" id="screen-over">
      <div class="brand small danger">基地失守</div>
      <div class="result-line" id="over-line">你在第 1 关阵亡</div>
      <div class="score-big" id="over-score">0</div>
      <div class="score-cap">最终得分</div>
      <button class="btn" id="btn-retry">重新开始</button>
    </div>

    <div class="screen hidden" id="screen-win">
      <div class="brand small gold">全线胜利</div>
      <div class="result-line">六个战区全部肃清</div>
      <div class="score-big" id="win-score">0</div>
      <div class="score-cap">最终得分</div>
      <button class="btn" id="btn-again">再战一轮</button>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="diag"></div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>

</body>
</html>
