<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁战线 1939 — 二战沙盘策略</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0d10;color:#d8d3c6;
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
#game{position:absolute;left:0;top:0;cursor:crosshair;background:#0b0d10}
/* ── 顶部信息栏 ── */
#topbar{position:fixed;left:0;top:0;right:0;height:40px;z-index:30;display:flex;align-items:center;gap:10px;
  padding:0 10px;background:linear-gradient(#262a31,#181b20);border-bottom:1px solid #3d434c;box-shadow:0 2px 10px rgba(0,0,0,.6);font-size:13px}
#topbar .sep{width:1px;height:22px;background:#3d434c}
#tbTurn{font-weight:600;letter-spacing:.5px;white-space:nowrap}
#tbFac{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
#tbFac .chip{width:12px;height:12px;border-radius:2px;border:1px solid #000;box-shadow:0 0 4px rgba(255,255,255,.15)}
.res{display:flex;align-items:center;gap:4px;white-space:nowrap}
.res b{color:#f0e6c8;font-size:14px}
.res .delta{color:#8a919c;font-size:11px}
.spacer{flex:1}
#tbSciBar{position:relative;width:150px;height:14px;background:#0d0f12;border:1px solid #3d434c;border-radius:7px;overflow:hidden}
#tbSciFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2e6da4,#5aa8d8)}
#tbSciTxt{position:absolute;inset:0;text-align:center;font-size:10px;line-height:13px;color:#cfe4f5;text-shadow:0 1px 2px #000}
.tbtn{background:#2c313a;border:1px solid #4a515c;color:#cfd4dc;border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer}
.tbtn:hover{background:#3a414c}
#bEnd{background:linear-gradient(#d96a2b,#b34d18);border:1px solid #f0913f;color:#fff;font-weight:700;font-size:14px;
  padding:5px 18px;border-radius:4px;cursor:pointer;box-shadow:0 0 10px rgba(217,106,43,.4);letter-spacing:2px}
#bEnd:hover{filter:brightness(1.15)}
#bEnd:disabled{filter:grayscale(.8);cursor:default}
/* ── AI行动横幅 ── */
#aiBanner{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:29;background:rgba(15,17,20,.85);
  border:1px solid #4a515c;border-radius:4px;padding:5px 18px;font-size:13px;display:none;pointer-events:none}
/* ── 左侧面板 ── */
#panel{position:fixed;left:0;top:40px;bottom:0;width:250px;z-index:25;background:rgba(17,20,24,.94);
  border-right:1px solid #3d434c;display:flex;flex-direction:column;transition:transform .25s}
#panel.folded{transform:translateX(-250px)}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#20242b;border-bottom:1px solid #3d434c;font-weight:600;font-size:13px}
#panelFold{background:none;border:none;color:#9aa1ac;font-size:15px;cursor:pointer}
#panelBody{flex:1;overflow-y:auto;padding:8px;font-size:12.5px;line-height:1.5}
#panelFoldBtn{position:fixed;left:0;top:44px;z-index:24;background:#262a31;border:1px solid #3d434c;border-left:none;
  color:#cfd4dc;border-radius:0 4px 4px 0;padding:4px 6px;cursor:pointer;font-size:13px;display:none}
#panel.folded~#panelFoldBtn{display:block}
.card{background:#1b1f25;border:1px solid #353b44;border-radius:6px;padding:8px;margin-bottom:8px}
.card h3{font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card .sub{color:#8a919c;font-size:11px}
.statrow{display:flex;flex-wrap:wrap;gap:4px 10px;margin:5px 0;font-size:12px}
.statrow .st{color:#b8bfc9}
.statrow .st b{color:#f0e6c8}
.bar{position:relative;height:9px;background:#0d0f12;border:1px solid #444b55;border-radius:4px;overflow:hidden;margin:3px 0 6px}
.bar>div{position:absolute;left:0;top:0;bottom:0}
.bar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:8px;color:#fff;text-shadow:0 1px 1px #000}
.btnrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.abtn{background:#2e3742;border:1px solid #4a515c;color:#d8dce2;border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer}
.abtn:hover:not(:disabled){background:#3c4856}
.abtn:disabled{opacity:.4;cursor:default}
.abtn.warn{border-color:#a05540;color:#f0b8a0}
.abtn.good{border-color:#4d7a4d;color:#bce0bc}
.buildlist{display:grid;grid-template-columns:1fr;gap:4px;margin-top:5px}
.bitem{display:flex;align-items:center;justify-content:space-between;background:#20252c;border:1px solid #353b44;border-radius:4px;padding:4px 7px;cursor:pointer;font-size:12px}
.bitem:hover:not(.lock){background:#2b333d;border-color:#5a636f}
.bitem.lock{opacity:.45;cursor:default}
.bitem .cost{color:#8a919c;font-size:11px;white-space:nowrap;margin-left:6px}
.bitem .lockwhy{color:#c07a6a;font-size:11px}
.hint{color:#8a919c;font-size:11px;margin-top:6px;line-height:1.45}
.tagline{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.tag{background:#262c34;border:1px solid #3d434c;border-radius:3px;padding:1px 6px;font-size:11px;color:#b8bfc9}
/* ── 小地图 ── */
#miniWrap{position:fixed;right:10px;bottom:10px;z-index:25;background:rgba(17,20,24,.92);border:1px solid #3d434c;border-radius:6px;padding:5px}
#mini{display:block;cursor:pointer;image-rendering:pixelated;border:1px solid #2a2f36}
#miniBtns{display:flex;gap:5px;margin-top:4px;justify-content:center}
#miniBtns button{width:34px;background:#2c313a;border:1px solid #4a515c;color:#cfd4dc;border-radius:3px;cursor:pointer;font-size:14px}
/* ── 日志 ── */
#log{position:fixed;left:262px;bottom:10px;z-index:24;width:380px;pointer-events:none;font-size:12px}
#log .entry{background:rgba(12,14,17,.82);border-left:3px solid #6a7280;padding:3px 8px;margin-top:3px;border-radius:0 4px 4px 0;
  animation:logfade 9s forwards;color:#cfd4dc}
@keyframes logfade{0%{opacity:0;transform:translateX(-8px)}5%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
/* ── 提示框 ── */
#tip{position:fixed;z-index:45;display:none;background:rgba(14,16,19,.95);border:1px solid #4a515c;border-radius:5px;
  padding:7px 10px;font-size:12px;pointer-events:none;max-width:240px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#tip .tt{font-weight:700;font-size:13px;margin-bottom:2px}
#tip .dim{color:#8a919c;font-size:11px}
/* ── 模态框 ── */
#modalBg{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.72);display:none;align-items:center;justify-content:center}
#modalBox{background:#171a1f;border:1px solid #4a515c;border-radius:8px;max-width:900px;width:min(92vw,900px);
  max-height:86vh;overflow-y:auto;padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.8)}
#modalBox h1{font-size:26px;letter-spacing:4px;text-align:center;margin-bottom:4px;
  background:linear-gradient(#f0dfae,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent}
#modalBox h2{font-size:16px;margin:10px 0 6px;color:#e8d9a8}
#modalBox .center{text-align:center}
.facGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.facCard{background:#1d2127;border:2px solid #353b44;border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s, transform .15s}
.facCard:hover{transform:translateY(-2px)}
.facCard.sel{border-color:#e8c86a;box-shadow:0 0 14px rgba(232,200,106,.25)}
.facCard h3{font-size:16px;display:flex;align-items:center;gap:8px}
.facCard .chip{width:14px;height:14px;border-radius:3px;border:1px solid #000}
.facCard ul{margin:6px 0 0 16px;font-size:12px;color:#a8afb9;line-height:1.6}
.bigbtn{display:block;margin:14px auto 0;background:linear-gradient(#d96a2b,#b34d18);border:1px solid #f0913f;color:#fff;
  font-weight:700;font-size:16px;padding:9px 42px;border-radius:6px;cursor:pointer;letter-spacing:3px}
.bigbtn:hover{filter:brightness(1.15)}
.bigbtn:disabled{filter:grayscale(.9);cursor:default}
/* 科技树 */
.techGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.eraCol{background:#1b1f25;border:1px solid #353b44;border-radius:6px;padding:8px}
.eraCol h3{font-size:13px;text-align:center;color:#e8d9a8;border-bottom:1px solid #353b44;padding-bottom:5px;margin-bottom:7px}
.tech{background:#20252c;border:1px solid #353b44;border-radius:5px;padding:6px 7px;margin-bottom:6px;font-size:12px;cursor:pointer;position:relative}
.tech:hover:not(.lock):not(.done){border-color:#6a90b8}
.tech.done{border-color:#4d7a4d;background:#1e2a1e;cursor:default}
.tech.done::after{content:'✓';position:absolute;right:7px;top:6px;color:#7ec87e}
.tech.cur{border-color:#e8c86a;box-shadow:0 0 8px rgba(232,200,106,.3)}
.tech.lock{opacity:.45;cursor:default}
.tech .tn{font-weight:600}
.tech .td{color:#8a919c;font-size:11px;line-height:1.4;margin-top:2px}
.tech .tc{color:#7fa8c8;font-size:11px;margin-top:2px}
.helpCols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:12.5px;line-height:1.7;color:#b8bfc9}
.helpCols b{color:#e8d9a8}
#fatal{position:fixed;left:8px;bottom:8px;z-index:99;color:#ff9a8a;background:rgba(30,8,6,.9);border:1px solid #a05540;
  border-radius:4px;padding:6px 10px;font-size:12px;max-width:60vw;display:none;font-family:Consolas,monospace;white-space:pre-wrap}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:#3a414c;border-radius:5px}
::-webkit-scrollbar-track{background:#14171b}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <div id="tbTurn">回合 1 / 1939年1月</div>
  <div id="tbFac"><span class="chip"></span><b id="tbFacName">—</b></div>
  <div class="sep"></div>
  <div class="res" title="金币：用于维护军队与加速生产">💰 <b id="rGold">0</b><span class="delta" id="rGoldD"></span></div>
  <div class="res" title="产能：各城市每回合合计产出">⚙ <b id="rProd">0</b><span class="delta">/回合</span></div>
  <div class="res" title="科研：每回合合计产出">🔬 <b id="rSci">0</b><span class="delta">/回合</span></div>
  <div class="res" id="rNukeW" title="已储备的原子弹" style="display:none">☢ <b id="rNuke">0</b></div>
  <div id="tbSciBar"><div id="tbSciFill"></div><span id="tbSciTxt">未选择研究</span></div>
  <div class="spacer"></div>
  <button class="tbtn" id="bTech">科技树(T)</button>
  <button class="tbtn" id="bHelp">帮助(H)</button>
  <button class="tbtn" id="bSnd" title="音效开关">♪</button>
  <button id="bEnd">结束回合 ⏎</button>
</div>
<div id="aiBanner"></div>

<div id="panel">
  <div id="panelHead"><span id="panelTitle">信息</span><button id="panelFold">« 收起</button></div>
  <div id="panelBody"><div class="hint">左键点击己方单位或城市查看详情。<br>左键点击目标格移动，点击敌人攻击。<br>右键取消选择。</div></div>
</div>
<button id="panelFoldBtn">» 面板</button>

<div id="miniWrap">
  <canvas id="mini" width="252" height="147"></canvas>
  <div id="miniBtns"><button id="zIn" title="放大 (+)">＋</button><button id="zOut" title="缩小 (−)">－</button></div>
</div>

<div id="log"></div>
<div id="tip"></div>
<div id="modalBg"><div id="modalBox"></div></div>
<div id="fatal"></div>

<script>

/* ============================================================
 *  钢铁战线 1939 —— 二战沙盘策略（单文件 / Canvas 2D / 无外部依赖）
 *  模块: p1 数据定义 | p2 地图生成 | p3 系统与AI | p4 渲染 | p5 交互UI
 * ============================================================ */

/* ---------- 基础常量 ---------- */
const MAPW = 120, MAPH = 70, NT = MAPW * MAPH;          // 经度 -25°E~155°E, 纬度 75°N~5°N
const LON0 = -25, LAT0 = 75, DLon = 180 / MAPW, DLat = 70 / MAPH;
const SK = 0.28, YS = 0.74;                             // 伪3D斜投影: 水平剪切 + 纵向压扁
const NEUT = 4;                                         // 中立阵营 id
const T_OCEAN = 0, T_COAST = 1, T_PLAIN = 2, T_DESERT = 3, T_FOREST = 4, T_MONT = 5;

const TINFO = [
  { n: '深海', move: 0, sea: 1, def: 0,   c: '#0d2647' },
  { n: '近海', move: 0, sea: 1, def: 0,   c: '#1c5480' },
  { n: '平原', move: 1, sea: 0, def: 0,    c: '#7ba05b' },
  { n: '沙漠', move: 1, sea: 0, def: 0,    c: '#d9c07f' },
  { n: '森林', move: 2, sea: 0, def: 0.25, c: '#33632f', hide: 1 },
  { n: '山地', move: 3, sea: 0, def: 0.5,  c: '#7a5f43' },
];

/* ---------- 阵营 ---------- */
const FACS = [
  { name: '盟军', color: '#6b87a6', cd: '#46586e', cl: '#9db4cc', bloc: 'A',
    bonus: ['工业产能 +20%', '海军单位移动力 +1'],
    pos: '西欧（伦敦 / 巴黎）', pers: '均衡发展，重视海空力量' },
  { name: '苏联', color: '#a83232', cd: '#6e1f1f', cl: '#cc6b5a', bloc: 'B',
    bonus: ['步兵造价 -30%', '冬季(12~2月)全军移动力 +1'],
    pos: '东欧 / 俄罗斯（莫斯科等）', pers: '大量生产步兵与坦克，人海推进' },
  { name: '德国', color: '#5b6167', cd: '#33373b', cl: '#8b939b', bloc: 'X',
    bonus: ['装甲单位攻击 +25%', '科技研发速度 +15%'],
    pos: '中欧（柏林 / 慕尼黑）', pers: '精锐路线，集中装甲突破' },
  { name: '日本', color: '#b8963e', cd: '#7d642a', cl: '#d9bd6e', bloc: 'X',
    bonus: ['海军攻击 +20%', '岛屿防御 +30%'],
    pos: '东亚岛屿（东京等）', pers: '海空优先，岛屿防御稳固' },
  { name: '中立', color: '#8a8a76', cd: '#5c5c4e', cl: '#b0b09c', bloc: 'N',
    bonus: [], pos: '', pers: '' },
];

/* ---------- 单位类型 ---------- */
const UNIT_TYPES = {
  inf:   { n: '步兵班',     cls: 'land',  atk: 8,  def: 10, mv: 2, rng: 1, cost: 40,  vis: 2, desc: '基础陆军，防御扎实' },
  mech:  { n: '机械化步兵', cls: 'land',  atk: 12, def: 12, mv: 3, rng: 1, cost: 80,  vis: 2, desc: '半履带快速步兵', breq: ['barracks'] },
  tank:  { n: '中型坦克',   cls: 'land',  atk: 20, def: 18, mv: 4, rng: 1, cost: 150, vis: 2, desc: '突击主力', armor: 1, breq: ['barracks'] },
  htank: { n: '重型坦克',   cls: 'land',  atk: 30, def: 28, mv: 3, rng: 1, cost: 250, vis: 2, desc: '移动堡垒', armor: 1, breq: ['barracks', 'factory'] },
  atgun: { n: '反坦克炮',   cls: 'land',  atk: 25, def: 5,  mv: 1, rng: 2, cost: 120, vis: 2, desc: '对装甲 ×2', vsArmor: 1, breq: ['barracks'] },
  aagun: { n: '防空炮',     cls: 'land',  atk: 15, def: 8,  mv: 2, rng: 2, cost: 100, vis: 2, desc: '对空军 ×2', vsAir: 1, breq: ['barracks'] },
  arty:  { n: '炮兵',       cls: 'land',  atk: 18, def: 4,  mv: 1, rng: 3, cost: 130, vis: 2, desc: '远程火力，可支援', breq: ['barracks'] },
  dd:    { n: '驱逐舰',     cls: 'naval', atk: 12, def: 15, mv: 5, rng: 2, cost: 120, vis: 3, desc: '快速海军', breq: ['port'] },
  bb:    { n: '战列舰',     cls: 'naval', atk: 25, def: 30, mv: 3, rng: 4, cost: 300, vis: 3, desc: '海上霸主', breq: ['port'] },
  cv:    { n: '航空母舰',   cls: 'naval', atk: 5,  def: 20, mv: 4, rng: 1, cost: 350, vis: 3, desc: '可搭载2架飞机', capAir: 2, breq: ['port'] },
  ss:    { n: '潜艇',       cls: 'naval', atk: 18, def: 8,  mv: 4, rng: 1, cost: 160, vis: 2, desc: '隐身，首击×2', stealth: 1, breq: ['port'] },
  fig:   { n: '战斗机',     cls: 'air',   atk: 15, def: 8,  mv: 8, rng: 1, cost: 120, vis: 3, desc: '制空，耗燃料', fuel: 1, breq: ['airport'] },
  bom:   { n: '轰炸机',     cls: 'air',   atk: 22, def: 5,  mv: 6, rng: 2, cost: 200, vis: 3, desc: '对城市×2，耗燃料', fuel: 1, vsCity: 1, breq: ['airport'] },
  lbom:  { n: '远程轰炸机', cls: 'air',   atk: 26, def: 6,  mv: 7, rng: 3, cost: 280, vis: 4, desc: '对城市×2，长航程', fuel: 1, vsCity: 1, breq: ['airport'] },
  tp:    { n: '运输机',     cls: 'air',   atk: 0,  def: 5,  mv: 6, rng: 0, cost: 100, vis: 3, desc: '空运1个步兵', fuel: 1, capLand: 1, breq: ['airport'] },
};
const NUKE_ITEM = { n: '原子弹', cost: 400, desc: '一次性摧毁城市防御与驻军' };

/* ---------- 建筑 ---------- */
const BUILDINGS = {
  barracks: { n: '兵营',     cost: 60,  prod: 2, desc: '+2产能，解锁高级陆军' },
  factory:  { n: '工厂',     cost: 120, prod: 5, desc: '+5产能，解锁重型单位', req: ['barracks'] },
  port:     { n: '港口',     cost: 80,  prod: 1, desc: '解锁海军单位（需临海）' },
  airport:  { n: '机场',     cost: 90,  prod: 0, sci: 2, desc: '解锁空军，+2科研' },
  aasite:   { n: '防空阵地', cost: 70,  prod: 0, desc: '城市防空 +50%' },
  fort:     { n: '堡垒',     cost: 100, prod: 0, desc: '城市防御 +100%' },
};
const BKEYS = ['barracks', 'factory', 'port', 'airport', 'aasite', 'fort'];

/* ---------- 科技树 ---------- */
const TECHS = [
  { id: 'inftrain',   n: '基础步兵训练', era: 1, cost: 60,  eff: '解锁 机械化步兵', unlock: ['mech'] },
  { id: 'lightarmor', n: '轻型装甲理论', era: 1, cost: 70,  eff: '解锁 中型坦克',   unlock: ['tank'] },
  { id: 'aviation',   n: '基础航空学',   era: 1, cost: 80,  eff: '解锁 战斗机',     unlock: ['fig'] },
  { id: 'navaltac',   n: '近海海军战术', era: 1, cost: 60,  eff: '解锁 驱逐舰',     unlock: ['dd'] },
  { id: 'blitz',      n: '闪电战理论',   era: 2, cost: 130, eff: '坦克移动+1，装甲攻击+15%' },
  { id: 'stratbomb',  n: '战略轰炸学说', era: 2, cost: 130, eff: '解锁 轰炸机',     unlock: ['bom'] },
  { id: 'fleetdoc',   n: '舰队决战理论', era: 2, cost: 140, eff: '解锁 战列舰',     unlock: ['bb'] },
  { id: 'atwpn',      n: '反坦克武器研发', era: 2, cost: 110, eff: '解锁 反坦克炮', unlock: ['atgun'] },
  { id: 'aanet',      n: '防空火力网',   era: 2, cost: 110, eff: '解锁 防空炮',     unlock: ['aagun'] },
  { id: 'heavarm',    n: '重型装甲工程', era: 3, cost: 200, eff: '解锁 重型坦克',   unlock: ['htank'] },

  // 燃料
  if (UNIT_TYPES[u.type].fuel) {
    if (u.idleLastAct) u.fuel -= 15; else u.fuel -= 6;
    const cc = cityAt(u.x, u.y) && cityAt(u.x, u.y).owner === u.owner;
    const carrier = u.loadedIn;
    if (cc || carrier) u.fuel = Math.min(100, u.fuel + (cc && cityAt(u.x, u.y).buildings.includes('airport') ? 100 : 40));
    u.fuel = clamp(u.fuel, 0, 100);
  }
  u.idleLastAct = false;
  // 治疗
  if (u.hp < 100 && !u.dead) {
    const cc = cityAt(u.x, u.y);
    if (cc && cc.owner === u.owner) u.hp += 20;
    else if (u.fortified) u.hp += 5;
    else if (OWN[idx(u.x, u.y)] === u.owner) u.hp += 8;
    u.hp = Math.min(100, u.hp);

}

/* ---------- 胜负 ---------- */
function checkElimination(fid) {
  const F = G.factions[fid];
  if (!F.alive || fid === NEUT) return;
  if (citiesOf(fid).length === 0 && unitsOf(fid).length === 0) {
    F.alive = false;
    addLog(`【${F.name}】覆灭！退出战争。`, '#ff5a4a');
    if (fid === G.playerId) endGame('lose');

}
function checkBlocVictory() {
  if ([2, 3].every(f => !G.factions[f].alive)) endGame('allies');
  else if ([0, 1].every(f => !G.factions[f].alive)) endGame('axis');
}
function endGame(kind) {

  G.over = true; G.busy = false;

  showEndModal(kind);
}

/* ---------- 回合流转 ---------- */
function endTurn() {
  if (!G || G.busy || G.over || G.modalOpen) return;
  G.sel = null; G.targeting = null; renderPanel();
  G.busy = true; $('bEnd').disabled = true;
  const order = [0, 1, 2, 3].filter(f => f !== G.playerId && G.factions[f].alive);
  let i = 0;
  const step = () => {
    if (G.over) return;
    if (i >= order.length) {
      G.busy = false; $('bEnd').disabled = false;
      $('aiBanner').style.display = 'none';
      newTurn();
      return;
    }
    const fid = order[i++];
    $('aiBanner').textContent = `⚔ ${FACS[fid].name} 正在行动…`;
    $('aiBanner').style.display = 'block';
    setTimeout(() => {

}
function newTurn() {
  if (G.over) return;
  G.turn++;
  if (G.turn > TOTAL_TURNS) { endGame('time'); return; }
  for (const F of G.factions) if (F.alive) tickEconomy(F);
  // 清理死者
  G.units = G.units.filter(u => !u.dead);
  AMAP.clear();
  for (const u of G.units) if (UNIT_TYPES[u.type].cls === 'air' && !u.loadedIn) pushAir(u);
  checkBlocVictory();
  recalcFog(); invalidate(); G.miniDirty = true; uiSoft();
  if (!G.over && G.turn % 12 === 1 && G.turn > 1) addLog(`—— 进入 ${dateLabel(G.turn).slice(0, 5)}年 ——`, '#e8c86a');
}

/* ---------- AI ---------- */
function aiTurn(fid) {
  const F = G.factions[fid];
  if (!F.alive || fid === NEUT) return;
  aiEconomy(F);
  aiMilitary(F);
}
function aiEconomy(F) {
  // 科研按个性顺序
  if (!F.sciCur) {
    for (const tid of F.ai.tech) {
      const t = TECH_BY[tid];
      if (canResearch(F.id, t)) { F.sciCur = tid; break; }
    }
    if (!F.sciCur) { const av = availTechs(F.id); if (av.length) F.sciCur = av[0].id; }
  }
  // 城市生产

    const pick = aiPickBuild(F, c);

}
function aiPickBuild(F, c) {
  const fid = F.id;
  // 基础建筑优先
  if (!c.buildings.includes('barracks')) return 'barracks';
  if (c.pop >= 5 && !c.buildings.includes('factory') && Math.random() < .8) return 'factory';
  if (isCoastal(c) && !c.buildings.includes('port') && (fid === 3 || fid === 0)) return 'port';
  if (!c.buildings.includes('airport') && c.pop >= 4 && (fid === 3 || fid === 0 || fid === 2) && Math.random() < .5) return 'airport';
  const myUnits = unitsOf(fid).length;
  const myCities = citiesOf(fid).length;

    return aiPickUnit(F, c) || 'inf';
  }
  // 兵营→工厂→军事单位 循环
  const r = Math.random();
  if (r < .55) return aiPickUnit(F, c) || 'inf';
  if (r < .65 && !c.buildings.includes('aasite')) return 'aasite';
  if (r < .72 && !c.buildings.includes('fort') && c.cap) return 'fort';
  return aiPickUnit(F, c) || 'inf';
}
function aiPickUnit(F, c) {
  const fid = F.id, w = F.ai.build;
  const cands = Object.keys(w).filter(k => !canBuildUnit(fid, k));
  if (!cands.length) return null;
  if (hasTech(fid, 'atomic') && F.nukes < 2 && Math.random() < .12) return 'nuke';
  let tot = 0; for (const k of cands) tot += w[k];
  let r = Math.random() * tot;

}
function aiMilitary(F) {
  const fid = F.id;
  // ① 威胁评估: 己方城市周围5格敌军
  const threats = [];

    let danger = 0;
    for (const e of G.units) if (!e.dead && atWar(fid, e.owner) && cheb(e.x, e.y, c.x, c.y) <= 5) danger++;
    if (danger) threats.push({ c, danger });
  }
  const assigned = new Set();
  for (const t of threats) {
    const cands = unitsOf(fid).filter(u => !assigned.has(u.id) && u.hp > 35 && cheb(u.x, u.y, t.c.x, t.c.y) <= 14)
      .sort((a, b) => cheb(a.x, a.y, t.c.x, t.c.y) - cheb(b.x, b.y, t.c.x, t.c.y));
    for (let k = 0; k < Math.min(t.danger + 1, cands.length); k++) assigned.add(cands[k].id);

  const neutralTargets = new Set();
  for (const u of unitsOf(fid)) {
    if (u.dead || u.loadedIn) continue;
    const cls = UNIT_TYPES[u.type].cls;
    if (cls === 'air' && u.fuel < 20) continue;
    // 受伤撤回城市
    if (u.hp < 45) {
      let bc = null, bd = 99;
      for (const c of citiesOf(fid)) { const d = cheb(c.x, c.y, u.x, u.y); if (d < bd) { bd = d; bc = c; } }
      if (bc) {
        const g = G.uMap.get(idx(bc.x, bc.y));
        if (u.x === bc.x && u.y === bc.y) { u.fortified = true; continue; }
        if (!g || g === u) { const p = pathToward(u, bc.x, bc.y); if (p && (p[0] !== u.x || p[1] !== u.y)) doMove(u, p[0], p[1]); continue; }
        const p = pathToward(u, bc.x, bc.y); if (p && (p[0] !== u.x || p[1] !== u.y)) doMove(u, p[0], p[1]);
        continue;
      }
    }
    // ② 防守增援
    if (assigned.has(u.id)) {
      const t = threats.find(t2 => cheb(u.x, u.y, t2.c.x, t2.c.y) <= 14);
      if (t) {
        const g = G.uMap.get(idx(t.c.x, t.c.y));
        if ((!g || g === u) && !(u.x === t.c.x && u.y === t.c.y)) { const p = pathToward(u, t.c.x, t.c.y); if (p) doMove(u, p[0], p[1]); continue; }
        const p = pathToward(u, t.c.x, t.c.y); if (p) doMove(u, p[0], p[1]);
        continue;
      }
    }
    // ③ 进攻
    const atk = aiBestAttack(u, F);
    if (atk) { resolveAttack(u, atk); continue; }
    if (u.mp <= 0) continue;
    // 驻城单位留守(首都/受威胁城市)
    const myCity = cityAt(u.x, u.y);

      const threatened = threats.some(t => t.c === myCity);
      if ((myCity.cap || threatened) && u.hp > 60) continue;
      if (!myCity.cap && !threatened && Math.random() < .5) continue;
    }
    // ④ 扩张/进攻目标
    let obj = null;
    if (cls === 'naval') {
      let bd = 1e9;
      for (const c of G.cities) {
        if (!atWar(fid, c.owner) && c.owner !== NEUT) continue;
        if (!isCoastal(c)) continue;
        const d = cheb(c.x, c.y, u.x, u.y); if (d < bd) { bd = d; obj = c; }
      }
    } else if (cls === 'air') {
      if (u.fuel < 45) continue;    // 机场待命
      let bd = 1e9;
      for (const c of G.cities) {
        if (c.owner === fid) continue;
        if (!atWar(fid, c.owner) && c.owner !== NEUT) continue;
        const d = cheb(c.x, c.y, u.x, u.y); if (d < bd) { bd = d; obj = c; }
      }
    } else {
      // 陆军: 优先中立空城扩张, 否则敌城
      let bd = 1e9;
      for (const c of G.cities) {
        if (c.owner === NEUT && !neutralTargets.has(c.id)) {
          const gu = G.uMap.get(idx(c.x, c.y));
          if (gu && gu.owner === NEUT && gu.hp > 50) continue;  // 有驻军的中立城稍后
          const d = cheb(c.x, c.y, u.x, u.y) * (unitsOf(fid).length > 8 ? 1 : 2);
          if (d < bd) { bd = d; obj = c; }
        }
      }
      if (!obj) {
        for (const c of G.cities) {
          if (!atWar(fid, c.owner) || c.owner === fid) continue;
          const d = cheb(c.x, c.y, u.x, u.y); if (d < bd) { bd = d; obj = c; }
        }
      }
      if (obj) neutralTargets.add(obj.id);
    }
    if (obj) {
      const p = pathToward(u, obj.x, obj.y);
      if (p && (p[0] !== u.x || p[1] !== u.y)) doMove(u, p[0], p[1]);
      // 到位后再尝试攻击
      const atk2 = aiBestAttack(u, F);
      if (atk2) resolveAttack(u, atk2);
    }
  }
}
function aiBestAttack(u, F) {
  if (u.attacked) return null;
  if (UNIT_TYPES[u.type].cls === 'air' && u.fuel < 25) return null;
  const list = attackTargetsOf(u);
  let best = null, bs = 0;
  for (const e of list) {
    if (e.via && !canStop(u, e.via.x, e.via.y)) continue;
    if (UNIT_TYPES[u.type].cls === 'land' && UNIT_TYPES[u.type].rng >= 2 && e.dist === 1 && !e.via) { /* 炮兵避免贴脸 */ if (e.unit) continue; }
    const sim = calcAttack(u, e);
    let sc = sim.dmg - sim.cdmg * 0.85;
    if (sim.kill) sc += e.unit ? UNIT_TYPES[e.unit.type].cost * .2 : 60;
    if (e.city) sc += 12;
    if (e.unit && UNIT_TYPES[e.unit.type].cls === 'air' && UNIT_TYPES[u.type].vsAir) sc += 15;
    sc *= F.ai ? F.ai.agg : 1;
    if (sc > bs && sc > 12) { bs = sc; best = e; }

  return best;
}

<script>
/* ============================================================
 * p4 —— 真3D渲染: Canvas 2D 软件渲染器 (透视投影 + 画家算法)

const cvs = $('game'), ctx = cvs.getContext('2d');
let CW = 0, CH = 0, DPR = 1;
function resize() {

  cvs.style.width = CW + 'px'; cvs.style.height = CH + 'px';
  invalidate();
}
window.addEventListener('resize', resize);
function invalidate() { if (G) G.needDraw = true; }
function addAnim(a) { a.t0 = performance.now(); G.anims.push(a); if (G.anims.length > 80) G.anims.splice(0, G.anims.length - 80); }

/* ---------- 相机: 目标点 + 距离 + 偏航 + 俯仰 ---------- */
const FOVY = 50 * Math.PI / 180;
const V = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0, ux: 0, uy: 0, uz: 0, fx: 0, fy: 0, fz: 0, f: 800 };
function focalLen() { return (CH / 2) / Math.tan(FOVY / 2); }
function updateCamera() {
  const cp = Math.cos(G.cam.pitch), sp = Math.sin(G.cam.pitch);
  const cw = Math.cos(G.cam.yaw), sw = Math.sin(G.cam.yaw);
  const gh = cornerHeightAt(G.cam.x, G.cam.y);

  V.py = gh + 0.4 + G.cam.dist * sp;
  V.pz = G.cam.y + G.cam.dist * cw * cp;
  let fx = G.cam.x - V.px, fy = gh - V.py, fz = G.cam.y - V.pz;

}
function panByPixels(dx, dy) {   // 抓取式平移: 光标拖着地图走
  if (!G) return;
  updateCamera();
  const s = G.cam.dist / V.f * 1.12;
  let fxx = V.fx, fzz = V.fz;
  const l = Math.hypot(fxx, fzz) || 1; fxx /= l; fzz /= l;
  G.cam.x = clamp(G.cam.x + (-V.rx * dx + fxx * dy) * s, 2, MAPW - 2);

}
/* 屏幕像素 → 射线与高度场求交 */
function rayDir(sx, sy, out) {

}
function screenToTile(sx, sy) {

  if (d.y > -0.02) return null;                       // 望向天空
  let t = 0.5;
  for (let k = 0; k < 1600; k++) {
    const px = V.px + d.x * t, py = V.py + d.y * t, pz = V.pz + d.z * t;
    if (px < -3 || pz < -3 || px > MAPW + 3 || pz > MAPH + 3) {

      for (let r = 0; r < 7; r++) {

function w2s(x, y, z, out) {   // 世界 → 屏幕投影
  const dx = x - V.px, dy = y - V.py, dz = z - V.pz;
  const cz = dx * V.fx + dy * V.fy + dz * V.fz;
  if (cz < 0.45) return false;
  const cx = dx * V.rx + dz * V.rz;
  const cy = dx * V.ux + dy * V.uy + dz * V.uz;
  out.x = CW / 2 + V.f * cx / cz;
  out.y = CH / 2 - V.f * cy / cz;

}
function tileScreen(x, y) {
  updateCamera();

  return { x: o.x, y: o.y, ok };
}

/* ---------- 颜色 ---------- */
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function parseRGB(s) { const m = s.match(/(\d+)[, ]+(\d+)[, ]+(\d+)/); return m ? [+m[1], +m[2], +m[3]] : [128, 128, 128]; }
const FACS_RGB = FACS.map(f => ({
  main: hex2rgb(f.color), dark: hex2rgb(f.cd), light: hex2rgb(f.cl),
}));
const LIGHT = (() => { const l = Math.hypot(-0.45, 0.8, -0.35); return [-0.45 / l, 0.8 / l, -0.35 / l]; })();
let BASE_RGB = null, BASE_W = null;       // 每格基础色 rgb (含积雪)
let shadeCache = null, shadeWinter = null;
function buildBaseRGB() {
  BASE_RGB = new Array(NT); BASE_W = new Array(NT);
  for (let i = 0; i < NT; i++) {
    let c = parseRGB(COLOR[i]);
    if (T[i] === T_MONT) {
      const h = tileAvgH(i);
      if (h > 0.4) { const k = clamp((h - 0.4) / 0.25, 0, 1) * 0.85; c = [c[0] + (226 - c[0]) * k, c[1] + (232 - c[1]) * k, c[2] + (238 - c[2]) * k]; }
    }

}
function getShade(i, b, winter) {

  let arr = cache[i];

    for (let l = 0; l < 16; l++) {

}
function invalidateShades() { shadeCache = null; shadeWinter = null; }

/* ---------- 面缓冲 + 桶排序 (画家算法) ---------- */
const FB_MAX = 26000;
let FB_N = 0;
const Fx1 = new Float32Array(FB_MAX), Fy1 = new Float32Array(FB_MAX),
  Fx2 = new Float32Array(FB_MAX), Fy2 = new Float32Array(FB_MAX),
  Fx3 = new Float32Array(FB_MAX), Fy3 = new Float32Array(FB_MAX),
  Fx4 = new Float32Array(FB_MAX), Fy4 = new Float32Array(FB_MAX),
  Fdep = new Float32Array(FB_MAX), Fal = new Float32Array(FB_MAX),
  Fkey = new Int32Array(FB_MAX);
const Fcol = new Array(FB_MAX);
const Fstroke = new Uint8Array(FB_MAX);
function pushFace(x1, y1, x2, y2, x3, y3, x4, y4, col, dep, al, stroke) {
  if (FB_N >= FB_MAX) return;

  Fx3[FB_N] = x3; Fy3[FB_N] = y3; Fx4[FB_N] = x4; Fy4[FB_N] = y4;

}
const bucketCnt = new Int32Array(4096), bucketStart = new Int32Array(4096);

function drawFaces() {

      if (al >= 0.99) {

        x1 += (x1 - cx2) * .018; y1 += (y1 - cy2) * .018;
        x2 += (x2 - cx2) * .018; y2 += (y2 - cy2) * .018;
        x3 += (x3 - cx2) * .018; y3 += (y3 - cy2) * .018;
        x4 += (x4 - cx2) * .018; y4 += (y4 - cy2) * .018;
      }
      ctx.globalAlpha = al;
      ctx.fillStyle = Fcol[i];
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 角落投影缓存 ---------- */
const NC = (MAPW + 1) * (MAPH + 1);
const PCX = new Float32Array(NC), PCY = new Float32Array(NC), PCD = new Float32Array(NC);
const PCOK = new Uint8Array(NC);
const TV = { x: 0, y: 0, d: 0 };
function projectAll() {
  for (let z = 0; z <= MAPH; z++) {
    for (let x = 0; x <= MAPW; x++) {
      const c = z * (MAPW + 1) + x;
      if (w2s(x, HCORN[c], z, TV)) { PCX[c] = TV.x; PCY[c] = TV.y; PCD[c] = TV.d; PCOK[c] = 1; }
      else PCOK[c] = 0;
    }
  }
}

/* ---------- 几何发射器 ---------- */
function emitWorldQuad(ax, ay, az, bx, by, bz, cx, cy2, cz, dx2, dy2, dz2, col, alpha, stroke, lift) {
  // 世界四边形: 投影+背面剔除+光照由调用方决定(col已定)
  if (!w2s(ax, ay, az, TV)) return; const x1 = TV.x, y1 = TV.y, d1 = TV.d;
  if (!w2s(bx, by, bz, TV)) return; const x2 = TV.x, y2 = TV.y, d2 = TV.d;
  if (!w2s(cx, cy2, cz, TV)) return; const x3 = TV.x, y3 = TV.y, d3 = TV.d;
  if (!w2s(dx2, dy2, dz2, TV)) return; const x4 = TV.x, y4 = TV.y, d4 = TV.d;
  const minx = Math.min(x1, x2, x3, x4), maxx = Math.max(x1, x2, x3, x4);
  const miny = Math.min(y1, y2, y3, y4), maxy = Math.max(y1, y2, y3, y4);
  if (maxx < -40 || minx > CW + 40 || maxy < -40 || miny > CH + 40) return;
  pushFace(x1, y1, x2, y2, x3, y3, x4, y4, col, (d1 + d2 + d3 + d4) / 4 + (lift || 0), alpha, stroke);
}
// 盒体: 中心(cx,cz) 底部y 尺寸(sx,sy,sz) 偏航pitch 颜色rgb数组
const C8 = new Float32Array(24);
function emitBox(cx, cyB, cz, sx, sy, sz, yaw, pitch, rgb, alpha, lift) {
  const hx = sx / 2, hz = sz / 2;
  const cyP = Math.cos(pitch || 0), syP = Math.sin(pitch || 0);
  const cyW = Math.cos(yaw), syW = Math.sin(yaw);
  let n = 0;
  for (let i = 0; i < 8; i++) {
    let lx = (i & 1 ? hx : -hx);
    let ly = (i & 2 ? sy : 0);
    let lz = (i & 4 ? hz : -hz);
    let lx2 = lx * cyP - ly * syP, ly2 = lx * syP + ly * cyP;
    const wx = cx + lx2 * cyW + lz * syW;
    const wy = cyB + ly2;
    const wz = cz - lx2 * syW + lz * cyW;
    C8[n++] = wx; C8[n++] = wy; C8[n++] = wz;
  }
  // 6面: 顶(4,5,7,6) 底(0,1,3,2) + 4侧
  const F = [[4, 5, 7, 6], [0, 2, 3, 1], [0, 4, 5, 1], [1, 5, 7, 3], [3, 7, 6, 2], [2, 6, 4, 0]];
  for (const f of F) {
    const a = f[0] * 3, b = f[1] * 3, c = f[2] * 3, d = f[3] * 3;
    // 法线
    const ux2 = C8[b] - C8[a], uy2 = C8[b + 1] - C8[a + 1], uz2 = C8[b + 2] - C8[a + 2];
    const vx2 = C8[d] - C8[a], vy2 = C8[d + 1] - C8[a + 1], vz2 = C8[d + 2] - C8[a + 2];
    let nx = uy2 * vz2 - uz2 * vy2, ny = uz2 * vx2 - ux2 * vz2, nz = ux2 * vy2 - uy2 * vx2;
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    const fx2 = (C8[a] + C8[c]) / 2, fy2 = (C8[a + 1] + C8[c + 1]) / 2, fz2 = (C8[a + 2] + C8[c + 2]) / 2;
    if ((fx2 - V.px) * nx + (fy2 - V.py) * ny + (fz2 - V.pz) * nz > 0) continue;   // 背面
    const b2 = 0.52 + 0.48 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
    const col = `rgb(${Math.min(255, rgb[0] * b2) | 0},${Math.min(255, rgb[1] * b2) | 0},${Math.min(255, rgb[2] * b2) | 0})`;
    emitWorldQuad(C8[a], C8[a + 1], C8[a + 2], C8[b], C8[b + 1], C8[b + 2], C8[c], C8[c + 1], C8[c + 2], C8[d], C8[d + 1], C8[d + 2], col, alpha, false, lift);
  }
}
// 棱柱: 局部足迹pts(yaw旋转) 从y0到y1
function emitPrism(cx, cz, y0, y1, pts, yaw, rgb, alpha, topRGB, lift) {
  const n = pts.length;
  const wx = new Float32Array(n), wz = new Float32Array(n);
  const cyW = Math.cos(yaw), syW = Math.sin(yaw);
  for (let i = 0; i < n; i++) {
    wx[i] = cx + pts[i][0] * cyW + pts[i][1] * syW;
    wz[i] = cz - pts[i][0] * syW + pts[i][1] * cyW;
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    let nx = (y1 - y0) * (wz[j] - wz[i]), ny = 0, nz = -(y1 - y0) * (wx[j] - wx[i]);
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    const mx = (wx[i] + wx[j]) / 2, mz = (wz[i] + wz[j]) / 2;
    if ((mx - V.px) * nx + (mz - V.pz) * nz > 0) continue;
    const b2 = 0.52 + 0.48 * Math.max(0, nx * LIGHT[0] + nz * LIGHT[2]);
    const col = `rgb(${Math.min(255, rgb[0] * b2) | 0},${Math.min(255, rgb[1] * b2) | 0},${Math.min(255, rgb[2] * b2) | 0})`;
    emitWorldQuad(wx[i], y0, wz[i], wx[j], y0, wz[j], wx[j], y1, wz[j], wx[i], y1, wz[i], col, alpha, false, lift);
  }
  // 顶面(扇形三角)
  const tb = topRGB || rgb;
  for (let i = 1; i < n - 1; i++) {
    emitTri(wx[0], y1, wz[0], wx[i], y1, wz[i], wx[i + 1], y1, wz[i + 1], tb, alpha, lift);
  }
}
function emitTri(ax, ay, az, bx, by, bz, cx, cy2, cz, rgb, alpha, lift) {
  if (!w2s(ax, ay, az, TV)) return; const x1 = TV.x, y1 = TV.y, d1 = TV.d;
  if (!w2s(bx, by, bz, TV)) return; const x2 = TV.x, y2 = TV.y, d2 = TV.d;
  if (!w2s(cx, cy2, cz, TV)) return; const x3 = TV.x, y3 = TV.y, d3 = TV.d;
  if (Math.min(x1, x2, x3) > CW + 40 || Math.max(x1, x2, x3) < -40 || Math.min(y1, y2, y3) > CH + 40 || Math.max(y1, y2, y3) < -40) return;
  const ux2 = bx - ax, uy2 = by - ay, uz2 = bz - az;
  const vx2 = cx - ax, vy2 = cy2 - ay, vz2 = cz - az;
  let nx = uy2 * vz2 - uz2 * vy2, ny = uz2 * vx2 - ux2 * vz2, nz = ux2 * vy2 - uy2 * vx2;
  const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
  if ((V.px - (ax + bx + cx) / 3) * nx + (V.py - (ay + by + cy2) / 3) * ny + (V.pz - (az + bz + cz) / 3) * nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
  const b2 = 0.52 + 0.48 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
  const col = `rgb(${Math.min(255, rgb[0] * b2) | 0},${Math.min(255, rgb[1] * b2) | 0},${Math.min(255, rgb[2] * b2) | 0})`;
  const dep = (d1 + d2 + d3) / 3 + (lift || 0);
  pushFace(x1, y1, x2, y2, x3, y3, x3, y3, col, dep, alpha, false);
}
function emitShadow(wx, wz, r, alpha) {
  const gy = cornerHeightAt(wx, wz) + 0.008;
  const col = `rgba(8,12,16,${alpha})`;
  for (let i = 0; i < 8; i++) {
    const a1 = i / 8 * Math.PI * 2, a2 = (i + 1) / 8 * Math.PI * 2;
    emitTri(wx, gy, wz, wx + Math.cos(a1) * r, gy, wz + Math.sin(a1) * r, wx + Math.cos(a2) * r, gy, wz + Math.sin(a2) * r, [0, 0, 0], alpha, -0.02);
  }
}

/* ---------- 单位3D模型 (朝向 +X, 经yaw旋转) ---------- */

/* ---------- 城市与树木 ---------- */
function buildCityModel(c) {

/* ---------- 场景绘制 ---------- */
let lastWinterDrawn = null;
function draw(now) {
  if (!G) return;
  updateCamera();
  const winter = isWinter();
  if (winter !== lastWinterDrawn) { lastWinterDrawn = winter; invalidateShades(); buildBaseRGBif(); }
  if (!BASE_RGB) buildBaseRGBif();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 天空背景
  const sky = ctx.createLinearGradient(0, 0, 0, CH);
  sky.addColorStop(0, '#141c26'); sky.addColorStop(.55, '#1d2833'); sky.addColorStop(1, '#0b0d10');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, CW, CH);
  FB_N = 0;
  projectAll();
  const fog = G.fog;
  const baseArr = winter ? BASE_W : BASE_RGB;
  // ---- 地形网格 (LOD: 远视距合并瓦片) ----
  const pxPerTile = clamp(V.f / Math.max(8, G.cam.dist), 2, 200);
  const step = pxPerTile < 4 ? 4 : pxPerTile < 9 ? 2 : 1;
  for (let z = 0; z < MAPH; z += step) {
    for (let x = 0; x < MAPW; x += step) {
      const i = idx(x, z);
      if (!fog.exp[i]) continue;
      const c00 = z * (MAPW + 1) + x;
      const cB = c00 + step, cC = c00 + step * (MAPW + 1) + step, cD = c00 + step * (MAPW + 1);
      if (!PCOK[c00] || !PCOK[cB] || !PCOK[cD] || !PCOK[cC]) continue;
      const x1 = PCX[c00], y1 = PCY[c00], x2 = PCX[cB], y2 = PCY[cB], x3 = PCX[cC], y3 = PCY[cC], x4 = PCX[cD], y4 = PCY[cD];
      if (Math.min(x1, x2, x3, x4) > CW + 30 || Math.max(x1, x2, x3, x4) < -30 || Math.min(y1, y2, y3, y4) > CH + 30 || Math.max(y1, y2, y3, y4) < -30) continue;
      const h00 = HCORN[c00], h10 = HCORN[cB], h01 = HCORN[cD];
      const isWater = T[i] <= T_COAST;
      let b;
      if (isWater) b = 0.9;
      else {
        let nx = -(h10 - h00), ny = 1, nz = -(h01 - h00);
        const nl = Math.hypot(nx, ny, nz) || 1;
        b = 0.58 + 0.42 * Math.max(0, (nx / nl) * LIGHT[0] + (ny / nl) * LIGHT[1] + (nz / nl) * LIGHT[2]);
      }
      if (!fog.vis[i]) b *= 0.5;
      const col = getShade(i, b, winter);
      const dep = (PCD[c00] + PCD[cB] + PCD[cC] + PCD[cD]) / 4;
      pushFace(x1, y1, x2, y2, x3, y3, x4, y4, col, dep, 1, false);
      if (step > 1) continue;
      // 领土染色
      if (OWN[i] >= 0) {
        const F2 = FACS_RGB[OWN[i]].main;
        emitTileQuad(x, z, `rgba(${F2[0]},${F2[1]},${F2[2]},0.14)`, .04);
      }
      // 河流覆盖
      if (RIV[i] && !isWater) {
        const hx = (h00 + h10 + HCORN[cC] + h01) / 4 + 0.015;
        const wx = x, wz = z;
        emitWorldQuad(wx + .18, hx, wz + .05, wx + .82, hx, wz + .12, wx + .75, hx, wz + .95, wx + .2, hx, wz + .9, 'rgba(64,140,196,.85)', 1, false, 0.05);
      }
      // 森林树木(近景)
      if (T[i] === T_FOREST && G.cam.dist < 46 && !isWater) buildTrees(x, z);
    }
  }
  // ---- 动画索引 ----
  let lungeMap = null;
  const dies = [];
  for (const a of G.anims) {
    if (a.k === 'lunge') { if (!lungeMap) lungeMap = new Map(); lungeMap.set(a.u, a); }
    else if (a.k === 'die') dies.push(a);
  }
  // ---- 单位 ----
  for (const u of G.units) {
    if (u.dead || u.loadedIn) continue;
    const i = idx(u.x, u.y);
    if (!fog.exp[i]) continue;
    if (u.owner !== G.playerId && !fog.vis[i] && !(UNIT_TYPES[u.type].stealth && u.visOk)) continue;
    const la = lungeMap && lungeMap.get(u.id);
    let ldx = 0, ldy = 0;
    if (la) {
      const pp = clamp((now - la.t0) / la.dur, 0, 1);
      const l = Math.hypot(la.dx, la.dy) || 1;
      const m = Math.sin(pp * Math.PI) * .3;
      ldx = la.dx / l * m; ldy = la.dy / l * m;
    }
    emitShadow(u.x + .5 + ldx, u.y + .5 + ldy, UNIT_TYPES[u.type].cls === 'land' ? .3 : .36, .3);
    buildUnitModel(u.type, u.owner, u.x + .5, u.y + .5, u.face, 1.3, 1, 0, ldx * 1.3, ldy * 1.3);
  }
  // 阵亡动画(缩小+下沉+淡出)
  for (const a of dies) {
    const pp = clamp((now - a.t0) / a.dur, 0, 1);
    buildUnitModel(a.type, a.fid, a.x + .5, a.y + .5, -Math.PI / 2, (1 - pp * .8) * 1.3, 1 - pp, pp * .4, 0, 0);
  }
  // ---- 城市 ----
  for (const c of G.cities) {
    if (!fog.exp[idx(c.x, c.y)]) continue;
    buildCityModel(c);
  }
  // ---- 高亮: 可达格 & 攻击目标 ----
  if (G.sel && G.sel.unit && G.sel.unit.owner === G.playerId) {
    if (G.selReach) {
      for (const ri of G.selReach) {
        const rx = ri % MAPW, rz = (ri / MAPW) | 0;
        emitTileQuad(rx, rz, 'rgba(255,255,255,.13)', .06);
      }
    }
    if (G.selTargets) {
      const pulse = .16 + .1 * Math.sin(now / 150);
      for (const t of G.selTargets) {
        const tx = t.unit ? t.unit.x : t.city.x, tz = t.unit ? t.unit.y : t.city.y;
        emitTileQuad(tx, tz, `rgba(255,64,44,${pulse.toFixed(3)})`, .07);
      }
    }
  }
  if (G.targeting && G.targeting.mode === 'nuke') {
    const u = G.targeting.unit;
    emitTileRing(u.x + .5, u.y + .5, 10, 'rgba(255,70,50,.55)');
  }
  drawFaces();
  drawOverlays(now);
  drawMini();
}
function emitTileQuad(x, z, col, lift) {
  const c00 = z * (MAPW + 1) + x, c10 = c00 + 1, c01 = c00 + MAPW + 1, c11 = c01 + 1;
  if (!PCOK[c00] || !PCOK[c10] || !PCOK[c01] || !PCOK[c11]) return;
  const dep = (PCD[c00] + PCD[c10] + PCD[c11] + PCD[c01]) / 4;
  pushFace(PCX[c00], PCY[c00], PCX[c10], PCY[c10], PCX[c11], PCY[c11], PCX[c01], PCY[c01], col, dep - lift, 1, false);
}
function emitTileRing(wx, wz, r, col) {
  const gy = cornerHeightAt(wx, wz);
  for (let i = 0; i < 20; i++) {
    const a1 = i / 20 * Math.PI * 2, a2 = (i + 1) / 20 * Math.PI * 2;
    emitTri(wx, gy + .03, wz, wx + Math.cos(a1) * r, gy + .03, wz + Math.sin(a1) * r, wx + Math.cos(a2) * r, gy + .03, wz + Math.sin(a2) * r, [255, 70, 50], .3, -0.04);
  }
}
function buildBaseRGBif() { if (!BASE_RGB) buildBaseRGB(); }

/* ---------- 覆盖层 (血条/名字/动画) ---------- */

      const gh = Math.max(0, cornerHeightAt(a.x + .5, a.y + .5));

  }

      : `<div class="bitem" data-enq="${b}"><span>${BUILDINGS[b].n}</span><span class="cost">${cost}⚙ · ${turns}回合</span></div>`;

/* ---------- 点击处理 ---------- */
function tileThings(x, y) {
  const u = G.uMap.get(idx(x, y)) || null;
  const airs = airAt(x, y);
  const c = G.cMap.get(idx(x, y)) || null;
  return { u, air: airs[0] || null, c };
}
function selectableAt(x, y) {
  const { u, air, c } = tileThings(x, y);
  if (u && u.owner === G.playerId) return { unit: u };
  if (air && air.owner === G.playerId) return { unit: air };
  if (c && c.owner === G.playerId) return { city: c };
  if (u && (G.fog.vis[idx(x, y)] || u.owner === G.playerId)) return { unit: u };
  if (air && G.fog.vis[idx(x, y)]) return { unit: air };
  if (c && G.fog.exp[idx(x, y)]) return { city: c };
  return null;
}
function onLeftClick(x, y) {
  if (!G || G.busy || G.over || G.modalOpen) return;
  if (G.targeting && G.targeting.mode === 'nuke') {
    const u = G.targeting.unit, c = G.cMap.get(idx(x, y));
    if (c && atWar(u.owner, c.owner) && cheb(u.x, u.y, x, y) <= 10) { launchNuke(u, c); G.targeting = null; renderPanel(); }
    else sfx.err();
    invalidate();
    return;
  }
  if (!inB(x, y)) return;
  const selU = G.sel && G.sel.unit && G.sel.unit.owner === G.playerId ? G.sel.unit : null;
  if (selU) {
    const { u: tu, air: ta, c: tc } = tileThings(x, y);
    // 再点自己所在的己方城格 → 切换为城市
    if (selU.x === x && selU.y === y && tc && tc.owner === G.playerId && !G.targeting) { select({ city: tc }); return; }
    // 攻击?
    if ((tu && tu.owner !== selU.owner) || (ta && ta.owner !== selU.owner) || (tc && atWar(selU.owner, tc.owner) && tc.hp > 0 && !tu)) {
      const tgt = (G.selTargets || []).find(t => (t.unit && (t.unit === tu || t.unit === ta)) || (t.city && t.city === tc));
      if (tgt) { resolveAttack(selU, tgt); computeSel(); renderPanel(); return; }
      sfx.err(); return;
    }
    // 移动?
    if (G.selReach && G.selReach.includes(idx(x, y))) {
      if (doMove(selU, x, y)) { sfx.move(); computeSel(); renderPanel(); return; }
    }
    const s2 = selectableAt(x, y);
    if (s2) { select(s2); return; }
    return;
  }
  const s = selectableAt(x, y);
  if (s) select(s);
  else if (G.sel && G.sel.city && G.sel.city.x === x && G.sel.city.y === y) {
    const gu = G.uMap.get(idx(x, y));
    if (gu && gu.owner === G.playerId) select({ unit: gu }); else deselect();

}

          <div class="sub" style="color:#8a919c;font-size:11px">起始: ${f.pos}</div>

          <div style="font-size:11px;color:#8a919c;margin-top:4px">AI风格: ${f.pers}</div>
        </div>`).join('')}
    </div>
    <div class="center" style="font-size:12px;color:#8a919c;line-height:1.8">
      轴心国(德国·日本) 对阵 同盟国(盟军·苏联)，另有中立城市可供扩张。<br>
      左键选择/移动/攻击 · 右键拖拽旋转视角(点按取消) · 滚轮缩放 · 中键拖拽平移<br>Q/E旋转 R/V俯仰 · T科技树 · Enter结束回合
    </div>
    <button class="bigbtn" id="bStart" disabled>选 择 阵 营</button>`;
  showModal2();
  let pick = -1;
  document.querySelectorAll('.facCard').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.facCard').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel'); pick = +el.dataset.f;
    const b = $('bStart'); b.disabled = false;
    b.textContent = `指挥 ${FACS[pick].name} 开战`;
    sfx.click();
  }));
  $('bStart').addEventListener('click', () => {
    if (pick < 0) return;
    closeModal();
    newGame(pick);
    updateTop(); renderPanel(); markMiniTerr(); invalidate();
  });
}
function showModal2() { $('modalBg').style.display = 'flex'; }
function showTech() {
  if (!G || G.over) return;
  const F = G.factions[G.playerId];
  let s = 0; for (const c of citiesOf(G.playerId)) s += citySci(c);
  let html = `<h1 style="font-size:20px;letter-spacing:2px">科 研</h1>
    <div class="center" style="color:#9aa1ac;font-size:12px">当前科研产出: 每回合 ${s} · 点击可研究/切换项目</div><div class="techGrid">`;
  for (let era = 1; era <= 4; era++) {
    html += `<div class="eraCol"><h3>${ERAS[era - 1]}</h3>`;
    for (const t of TECHS.filter(t => t.era === era)) {
      const done = F.techs.has(t.id), can = canResearch(G.playerId, t), cur = F.sciCur === t.id;
      html += `<div class="tech ${done ? 'done' : cur ? 'cur' : can ? '' : 'lock'}" data-tech="${t.id}">
        <div class="tn">${t.n}</div><div class="td">${t.eff}</div>
        <div class="tc">${done ? '已研究' : cur ? `研究中 ${Math.floor(F.sciProg)}/${t.cost}` : `${t.cost} 科研${eraOK(G.playerId, t.era) ? '' : ' · 需前置时代≥2项'}`}</div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div><div class="center" style="margin-top:10px"><button class="abtn" id="bTechClose">关闭 (Esc)</button></div>`;
  showModal(html);
  $('bTechClose').addEventListener('click', closeModal);
  document.querySelectorAll('[data-tech]').forEach(el => el.addEventListener('click', () => {
    const t = TECH_BY[el.dataset.tech];
    if (!canResearch(G.playerId, t)) { sfx.err(); return; }
    if (F.sciCur !== t.id) { F.sciCur = t.id; F.sciProg = 0; }
    sfx.click(); updateTop(); showTech();
  }));
}
function showHelp() {
  showModal(`<h1 style="font-size:20px;letter-spacing:2px">作 战 手 册</h1>
  <div class="helpCols">
    <div><b>操作</b><br>左键: 选择单位/城市 → 点击目标格移动<br>左键点敌人(红框): 攻击(近战会先移动贴身)<br>右键拖拽: 旋转3D视角 · 右键点按: 取消选择<br>滚轮 / +−: 缩放 · 中键拖拽 / WASD: 平移<br>Q / E: 旋转相机 · R / V: 抬高/压低视角<br>小地图点击: 快速跳转 · N: 下一个待命单位<br>空格: 待命 · Enter: 结束回合 · T: 科技树</div>
    <div><b>规则要点</b><br>城市被轰到0城防后, 陆军进入即占领(人口减半)<br>补给: 距离己方城市4格外每回合-15, 归0每回合损失10%HP<br>空军每回合消耗燃料, 需回机场/航母补给<br>森林: 移动2 · 防+25% · 远程隐蔽 · 山地: 移动3 · 防+50%<br>河流: 移动2, 跨入+1 · 近战互伤后进入对峙<br>潜艇: 隐身(贴身可见), 每回合首击×2<br>支援: 相邻友军-10%受伤, 炮兵+15%火力, 战斗机+12%</div>
    <div><b>胜利</b><br>歼灭轴心国或同盟国全部有生力量;<br>1945年12月按城市/部队/科技计分。</div>
    <div><b>单位克制</b><br>反坦克炮→装甲 ×2 · 防空炮→空军 ×2<br>轰炸机→城市 ×2 · 潜艇首击 ×2<br>驻防+25%防御 · 城市驻防×1.5</div>
  </div>
  <div class="center" style="margin-top:10px"><button class="abtn" id="bHelpClose">关闭 (Esc)</button></div>`);
  $('bHelpClose').addEventListener('click', closeModal);
}
function showCaptureDialog(c, orig) {
  showModal(`<h1 style="font-size:20px">${c.name} 已攻克</h1>
    <div class="center" style="line-height:1.8;font-size:13px">
      此城原属 <b style="color:${FACS[orig].cl}">${FACS[orig].name}</b>。<br>
      <b>吞并</b>: 人口减半, 归入你的领土。<br>
      <b>解放</b>: 归还原主, 获得150金币与外交声誉。
    </div>
    <div class="btnrow" style="justify-content:center;margin-top:12px">
      <button class="abtn" id="capAnnex">吞并</button>
      <button class="abtn good" id="capFree">解放给${FACS[orig].name}</button>
    </div>`);
  $('capAnnex').addEventListener('click', () => { const p = G.capturePending; G.capturePending = null; closeModal(); if (p) finishCapture(p.c, p.fid, false); });
  $('capFree').addEventListener('click', () => { const p = G.capturePending; G.capturePending = null; closeModal(); if (p) finishCapture(p.c, p.fid, true); });
}
function showEndModal(kind) {
  const F = G.factions[G.playerId];
  const cs = citiesOf(G.playerId).length, us = unitsOf(G.playerId).length;
  let title, msg;
  if (kind === 'allies') { title = '同盟国胜利'; msg = '轴心国已被彻底击败，和平重回欧洲与亚洲。'; }
  else if (kind === 'axis') { title = '轴心国胜利'; msg = '欧洲与亚洲的版图已被重绘…'; }
  else if (kind === 'lose') { title = '战败'; msg = `你的阵营${F.name}已失去所有城市与部队。`; }
  else {
    title = '战争结束 (1945年12月)';
    const scores = [0, 1, 2, 3].map(f => ({ f, s: citiesOf(f).length * 10 + unitsOf(f).length + G.factions[f].techs.size * 2 })).sort((a, b) => b.s - a.s);
    msg = '停战协定签署。最终评分:<br>' + scores.map((x, i) => `${i + 1}. <b style="color:${FACS[x.f].cl}">${FACS[x.f].name}</b> — ${x.s}分`).join('<br>');
  }
  showModal(`<h1>${title}</h1>
    <div class="center" style="line-height:2;font-size:14px;margin:10px 0">${msg}</div>
    <div class="center" style="color:#9aa1ac;font-size:12px">你的统计: 城市${cs} · 部队${us} · 科技${G.factions[G.playerId].techs.size} · 历时${dateLabel(G.turn)}</div>
    <button class="bigbtn" id="bRestart">再 战 一 局</button>`);
  $('bRestart').addEventListener('click', () => location.reload());
}

/* ---------- 主循环 ---------- */
let lastT = 0;
function raf(now) {
  if (G) {
    if (G.anims && G.anims.length) G.needDraw = true;
    if (G.needDraw) {
      G.needDraw = false;
      try { draw(now); } catch (e) {
        window.__drawErr = (e.message || e) + ' @' + (e.lineno || '?');
        G.anims = [];
        if (((G.drawErrs | 0) + 1) < 6) { G.drawErrs = (G.drawErrs | 0) + 1; G.needDraw = true; }
      }
    }
  }
  requestAnimationFrame(raf);
}

/* ---------- 启动 ---------- */
window.addEventListener('error', e => {
  const f = $('fatal');
  f.style.display = 'block';
  f.textContent = '错误: ' + e.message + ' @' + (e.lineno || '?');
});
resize();
bindInput();
showStartModal();
requestAnimationFrame(raf);

</script>
