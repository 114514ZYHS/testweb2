
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">AK-47 动态打靶</title>
  <desc id="dsc">纯 SVG + CSS 关键帧动画：AK-47 侧视步枪在靶场连续两发射击，包含后坐、枪口焰、硝烟、抛壳、弹道曳光、靶纸冲击波与摆动静音环、弹孔累积与 HUD 计分。</desc>

  <defs>
    <!-- ================= 渐变 ================= -->
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1018"/>
      <stop offset="34%"  stop-color="#1e3243"/>
      <stop offset="66%"  stop-color="#5b6a68"/>
      <stop offset="87%"  stop-color="#b8814a"/>
      <stop offset="100%" stop-color="#6d4a2c"/>
    </linearGradient>
    <radialGradient id="gSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity=".95"/>
      <stop offset="35%"  stop-color="#ff9f4a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ff8a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a3a29"/>
      <stop offset="28%"  stop-color="#2f2620"/>
      <stop offset="100%" stop-color="#100e0c"/>
    </linearGradient>
    <linearGradient id="gLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b7150" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4b3d2c" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="gBerm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b3227"/>
      <stop offset="100%" stop-color="#15120f"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8813f"/>
      <stop offset="45%"  stop-color="#a35d26"/>
      <stop offset="100%" stop-color="#6d3a16"/>
    </linearGradient>
    <linearGradient id="gWood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b8763a"/>
      <stop offset="100%" stop-color="#5e3213"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#79838f"/>
      <stop offset="26%"  stop-color="#48525d"/>
      <stop offset="72%"  stop-color="#242a31"/>
      <stop offset="100%" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="gMetalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4b5460"/>
      <stop offset="45%"  stop-color="#22272e"/>
      <stop offset="100%" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="gMag" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#3d444d"/>
      <stop offset="42%"  stop-color="#20252b"/>
      <stop offset="100%" stop-color="#0d1013"/>
    </linearGradient>
    <linearGradient id="gBullet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffe6a2"/>
      <stop offset="60%"  stop-color="#ffab2e"/>
      <stop offset="100%" stop-color="#e2771a"/>
    </linearGradient>
    <linearGradient id="gTracer" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffd07a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gFlash" cx="18%" cy="50%" r="82%">
      <stop offset="0%"   stop-color="#fffdf2"/>
      <stop offset="30%"  stop-color="#ffe487"/>
      <stop offset="66%"  stop-color="#ffa22b"/>
      <stop offset="100%" stop-color="#f2600c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4c4" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#ffb347" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSceneLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSmoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e6ecf0" stop-opacity=".5"/>
      <stop offset="32%"  stop-color="#c3ced6" stop-opacity=".34"/>
      <stop offset="66%"  stop-color="#9dabb6" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#8d99a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPaper" cx="38%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#fbf6ea"/>
      <stop offset="70%"  stop-color="#e8e0cd"/>
      <stop offset="100%" stop-color="#b9b09b"/>
    </radialGradient>
    <radialGradient id="gHit" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff2c0" stop-opacity=".9"/>
      <stop offset="55%"  stop-color="#ffb347" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gVign" cx="50%" cy="48%" r="72%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".82"/>
    </radialGradient>
    <linearGradient id="gBag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b8064"/>
      <stop offset="55%"  stop-color="#63593f"/>
      <stop offset="100%" stop-color="#2f2a1d"/>
    </linearGradient>

    <!-- ================= 滤镜 / 图案 ================= -->
    <filter id="fShadow" x="-30%" y="-30%" width="180%" height="200%">
      <feDropShadow dx="4" dy="10" stdDeviation="7" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="fSoft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="fSmoke" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="fGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="pScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity=".5"/>
    </pattern>

    <!-- ================= 动画 ================= -->
    <style><![CDATA[
      text{font-family:"Segoe UI","Microsoft YaHei",Arial,Helvetica,sans-serif;}
      .mono{font-family:Consolas,"SF Mono","Cascadia Mono",monospace;}
      .recoil, .body, .shake, .flash, .halo, .wave, .bulletA, .bulletB,
      .casing, .deb, .hole, .ring-pop, .swing, .pop1, .pop2, .tot,
      .hit1, .hit2, .brk, .flashwhite, .puff, .holeB, .mote{transform-box:view-box;}
      /* 静态渲染 / 动画未启动时，特效元素保持不可见 */
      .flash, .halo, .wave, .puff, .bulletA, .bulletB, .casing, .deb, .hole, .holeB,
      .ring-pop, .pop1, .pop2, .tot, .hit1, .hit2, .a29, .a28, .flashwhite{opacity:0;}

      /* --- 整幕相机抖动 --- */
      .shake{transform-origin:600px 340px; animation:shake 3.2s linear infinite;}
      @keyframes shake{
        0%,5.2%{transform:translate(0,0) rotate(0)}
        6.4%{transform:translate(-7px,4px) rotate(.22deg)}
        7.8%{transform:translate(5px,-3px) rotate(-.12deg)}
        9.4%{transform:translate(-2px,1px) rotate(.05deg)}
        11%,20.6%{transform:translate(0,0) rotate(0)}
        21.8%{transform:translate(-8px,4px) rotate(.26deg)}
        23.2%{transform:translate(6px,-3px) rotate(-.14deg)}
        25%{transform:translate(-2px,1px) rotate(.05deg)}
        27%,100%{transform:translate(0,0) rotate(0)}
      }

      /* --- 枪身后坐（两次点射） --- */
      .recoil{transform-origin:212px 302px; animation:recoil 3.2s linear infinite;}
      @keyframes recoil{
        0%,4.6%{transform:translate(0,0) rotate(0)}
        5.6%{transform:translate(-4px,1px) rotate(-.7deg)}
        7%{transform:translate(-19px,4px) rotate(-3.4deg)}
        8.4%{transform:translate(-12px,2px) rotate(-2.2deg)}
        10.8%{transform:translate(3px,-1px) rotate(.55deg)}
        13.6%{transform:translate(-2px,0) rotate(-.2deg)}
        16%,19.6%{transform:translate(0,0) rotate(0)}
        20.6%{transform:translate(-5px,1px) rotate(-.85deg)}
        22%{transform:translate(-21px,4px) rotate(-3.8deg)}
        23.4%{transform:translate(-13px,2px) rotate(-2.4deg)}
        25.8%{transform:translate(3px,-1px) rotate(.6deg)}
        28.6%{transform:translate(-2px,0) rotate(-.2deg)}
        31%,39%{transform:translate(0,0) rotate(0)}
        48%{transform:translate(0,-2px) rotate(.28deg)}
        62%{transform:translate(0,1px) rotate(-.18deg)}
        76%{transform:translate(0,-1.6px) rotate(.22deg)}
        90%{transform:translate(0,.6px) rotate(-.08deg)}
        100%{transform:translate(0,0) rotate(0)}
      }
      /* --- 身体小幅吸收后坐 --- */
      .body{transform-origin:120px 420px; animation:bodyroll 3.2s linear infinite;}
      @keyframes bodyroll{
        0%,5.4%{transform:translate(0,0) rotate(0)}
        7%{transform:translate(-5px,1px) rotate(-.7deg)}
        11%{transform:translate(1px,0) rotate(.15deg)}
        15%,20.4%{transform:translate(0,0) rotate(0)}
        22%{transform:translate(-6px,1px) rotate(-.85deg)}
        26%{transform:translate(1px,0) rotate(.18deg)}
        31%,100%{transform:translate(0,0) rotate(0)}
      }

      /* --- 枪口焰 --- */
      .flash{transform-origin:572px 302px; animation:flash 3.2s linear infinite;}
      @keyframes flash{
        0%,5.2%{opacity:0;transform:scale(.25) rotate(0)}
        6.2%{opacity:1;transform:scale(1.12) rotate(-5deg)}
        7.4%{opacity:.95;transform:scale(1.5) rotate(7deg)}
        9.2%{opacity:0;transform:scale(1.15) rotate(10deg)}
        19.8%{opacity:0;transform:scale(.25) rotate(0)}
        20.9%{opacity:1;transform:scale(1.1) rotate(6deg)}
        22.2%{opacity:.95;transform:scale(1.55) rotate(-8deg)}
        24%{opacity:0;transform:scale(1.2) rotate(-11deg)}
        100%{opacity:0;transform:scale(.25) rotate(0)}
      }
      .halo{transform-origin:586px 302px; animation:halo 3.2s linear infinite;}
      @keyframes halo{
        0%,5.4%{opacity:0;transform:scale(.4)}
        6.6%{opacity:1;transform:scale(1.05)}
        9.6%{opacity:0;transform:scale(1.5)}
        20.2%{opacity:0;transform:scale(.4)}
        21.4%{opacity:1;transform:scale(1.1)}
        24.4%{opacity:0;transform:scale(1.55)}
        100%{opacity:0;transform:scale(.4)}
      }
      .flashwhite{animation:whiteout 3.2s linear infinite;}
      @keyframes whiteout{
        0%,5.6%{opacity:0}6.4%{opacity:.13}9%{opacity:0}
        20.6%{opacity:0}21.6%{opacity:.15}24.5%{opacity:0}100%{opacity:0}
      }
      /* --- 冲击波（枪口） --- */
      .wave{transform-origin:572px 302px; animation:wave 3.2s linear infinite;}
      @keyframes wave{
        0%,5.8%{opacity:0;transform:scale(.15)}
        6.4%{opacity:.85;transform:scale(.5)}
        12%{opacity:0;transform:scale(2.6)}
        20.8%{opacity:0;transform:scale(.15)}
        21.4%{opacity:.9;transform:scale(.5)}
        27%{opacity:0;transform:scale(2.7)}
        100%{opacity:0;transform:scale(.15)}
      }
      /* --- 硝烟 --- */
      .puff{transform-box:view-box; transform-origin:588px 296px; animation:puff 3.2s ease-out infinite;}
      @keyframes puff{
        0%,6%{opacity:0;transform:translate(0,0) scale(.3)}
        7.5%{opacity:.6;transform:translate(26px,-10px) scale(.75)}
        22%{opacity:.26;transform:translate(108px,-44px) scale(2.1)}
        44%{opacity:0;transform:translate(196px,-74px) scale(4)}
        100%{opacity:0;transform:translate(196px,-74px) scale(4)}
      }
      /* --- 弹丸 --- */
      .bulletA{animation:bulletA 3.2s linear infinite;}
      @keyframes bulletA{
        0%,5.9%{opacity:0;transform:translate(0,0)}
        6.3%{opacity:1;transform:translate(28px,-1px)}
        10.9%{opacity:1;transform:translate(378px,-10px)}
        11.4%{opacity:1;transform:translate(406px,-11px)}
        11.7%{opacity:0;transform:translate(410px,-11px)}
        100%{opacity:0;transform:translate(0,0)}
      }
      .bulletB{animation:bulletB 3.2s linear infinite;}
      @keyframes bulletB{
        0%,21%{opacity:0;transform:translate(0,0)}
        21.4%{opacity:1;transform:translate(28px,-2px)}
        25.9%{opacity:1;transform:translate(356px,-26px)}
        26.4%{opacity:1;transform:translate(385px,-28px)}
        26.7%{opacity:0;transform:translate(389px,-28px)}
        100%{opacity:0;transform:translate(0,0)}
      }
      .streakA,.streakB{transform-box:view-box; transform-origin:572px 302px; opacity:0;}
      .streakA{animation:streakA 3.2s linear infinite;}
      @keyframes streakA{0%,6.2%{opacity:0}7.4%{opacity:.55}11.2%{opacity:.2}12.8%,100%{opacity:0}}
      .streakB{animation:streakB 3.2s linear infinite;}
      @keyframes streakB{0%,21.2%{opacity:0}22.4%{opacity:.55}26.2%{opacity:.2}27.8%,100%{opacity:0}}
      /* --- 抛壳 --- */
      .casing{transform-box:fill-box; transform-origin:center; animation:casing 3.2s cubic-bezier(.2,.55,.35,1) infinite;}
      @keyframes casing{
        0%,6%{opacity:0;transform:translate(0,0) rotate(0)}
        6.6%{opacity:1;transform:translate(12px,-24px) rotate(80deg)}
        9.4%{transform:translate(52px,-84px) rotate(300deg)}
        13.6%{opacity:1;transform:translate(104px,-46px) rotate(560deg)}
        15.6%{opacity:0;transform:translate(126px,-8px) rotate(650deg)}
        100%{opacity:0;transform:translate(126px,-8px) rotate(650deg)}
      }
      /* --- 靶子：受击摆动 --- */
      .swing{transform-origin:960px 206px; animation:swing 3.2s linear infinite;}
      @keyframes swing{
        0%,11.3%{transform:rotate(0)}
        12.9%{transform:rotate(4.2deg)}
        15.4%{transform:rotate(-2.8deg)}
        18.2%{transform:rotate(1.8deg)}
        21.2%{transform:rotate(-1deg)}
        24.4%{transform:rotate(.5deg)}
        26.3%{transform:rotate(0)}
        28.2%{transform:rotate(3.4deg)}
        31%{transform:rotate(-2.2deg)}
        34.4%{transform:rotate(1.4deg)}
        38.6%{transform:rotate(-.9deg)}
        44%{transform:rotate(.55deg)}
        51%{transform:rotate(-.32deg)}
        60%{transform:rotate(.16deg)}
        72%,100%{transform:rotate(0)}
      }
      /* --- 着靶：弹孔 / 光环 / 碎片 --- */
      .hole{animation:hole 3.2s linear infinite;}
      @keyframes hole{
        0%,11.3%{opacity:0;transform:scale(.3)}
        12.1%{opacity:1;transform:scale(1.5)}
        13.6%{transform:scale(1)}
        92%{opacity:1;transform:scale(1)}
        96%,100%{opacity:0;transform:scale(1)}
      }
      .holeB{animation:holeB 3.2s linear infinite;}
      @keyframes holeB{
        0%,26.3%{opacity:0;transform:scale(.3)}
        27.1%{opacity:1;transform:scale(1.5)}
        28.6%{transform:scale(1)}
        92%{opacity:1;transform:scale(1)}
        96%,100%{opacity:0;transform:scale(1)}
      }
      .ring-pop{animation:ringpop 3.2s linear infinite;}
      @keyframes ringpop{
        0%,11.3%{opacity:0;transform:scale(.12)}
        12.2%{opacity:1;transform:scale(.7)}
        17.5%{opacity:0;transform:scale(1.9)}
        26.3%{opacity:0;transform:scale(.12)}
        27.2%{opacity:1;transform:scale(.66)}
        32.5%{opacity:0;transform:scale(1.75)}
        100%{opacity:0;transform:scale(.12)}
      }
      .deb{animation:deb 3.2s cubic-bezier(.1,.7,.3,1) infinite;}
      @keyframes deb{
        0%,11.3%{opacity:0;transform:translate(0,0)}
        11.9%{opacity:1;transform:translate(12px,-3px)}
        16.4%{opacity:0;transform:translate(52px,14px)}
        26.3%{opacity:0;transform:translate(0,0)}
        26.9%{opacity:1;transform:translate(12px,-3px)}
        31.4%{opacity:0;transform:translate(48px,16px)}
        100%{opacity:0;transform:translate(48px,16px)}
      }
      /* --- HUD 计分弹跳 --- */
      .pop1{transform-origin:1074px 236px; animation:pop1 3.2s linear infinite;}
      @keyframes pop1{
        0%,11.4%{opacity:0;transform:translate(0,0) scale(.35)}
        13.2%{opacity:1;transform:translate(0,-4px) scale(1.22)}
        15%{transform:translate(0,-6px) scale(1)}
        24%{opacity:1;transform:translate(0,-13px) scale(1)}
        28%{opacity:0;transform:translate(0,-24px) scale(.9)}
        100%{opacity:0;transform:translate(0,-24px) scale(.9)}
      }
      .pop2{transform-origin:1074px 236px; animation:pop2 3.2s linear infinite;}
      @keyframes pop2{
        0%,26.4%{opacity:0;transform:translate(0,0) scale(.35)}
        28.2%{opacity:1;transform:translate(0,-4px) scale(1.22)}
        30%{transform:translate(0,-6px) scale(1)}
        40%{opacity:1;transform:translate(0,-13px) scale(1)}
        44%{opacity:0;transform:translate(0,-24px) scale(.9)}
        92%{opacity:0}
        100%{opacity:0}
      }
      .tot{transform-origin:1074px 300px; animation:tot 3.2s linear infinite;}
      @keyframes tot{
        0%,29%{opacity:0;transform:scale(.6)}
        31.5%{opacity:1;transform:scale(1.15)}
        33.5%{transform:scale(1)}
        90%{opacity:1;transform:scale(1)}
        95%,100%{opacity:0;transform:scale(1)}
      }
      .hit1{animation:hit1 3.2s linear infinite;}
      @keyframes hit1{0%,11.3%{opacity:0}11.9%,17%{opacity:1}19%,100%{opacity:0}}
      .hit2{animation:hit2 3.2s linear infinite;}
      @keyframes hit2{0%,26.3%{opacity:0}26.9%,32%{opacity:1}34%,100%{opacity:0}}
      /* --- 弹药计数 --- */
      .a30{animation:am30 3.2s linear infinite;}
      @keyframes am30{0%,5.8%{opacity:1}6.2%,95%{opacity:0}96.5%,100%{opacity:1}}
      .a29{animation:am29 3.2s linear infinite;}
      @keyframes am29{0%,5.8%{opacity:0}6.2%,20.8%{opacity:1}21.2%,100%{opacity:0}}
      .a28{animation:am28 3.2s linear infinite;}
      @keyframes am28{0%,20.8%{opacity:0}21.2%,95%{opacity:1}96.5%,100%{opacity:0}}
      /* --- 环抱准星 --- */
      .spin{transform-origin:960px 300px; animation:spin 14s linear infinite;}
      @keyframes spin{to{transform:rotate(360deg)}}
      .spin-r{transform-origin:960px 300px; animation:spinr 9s linear infinite;}
      @keyframes spinr{to{transform:rotate(-360deg)}}
      .brk{transform-origin:960px 300px; animation:brk 3.2s linear infinite;}
      @keyframes brk{
        0%,5%{transform:scale(1);opacity:.55}
        6.6%{transform:scale(.9);opacity:1}
        11.4%{transform:scale(1);opacity:.6}
        21.6%{transform:scale(.9);opacity:1}
        27%{transform:scale(1);opacity:.55}
        100%{transform:scale(1);opacity:.55}
      }
      .blink{animation:blink 1.1s steps(1,end) infinite;}
      @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
      /* --- 环境 --- */
      .mote{animation:mote 11s linear infinite;}
      @keyframes mote{
        0%{opacity:0;transform:translate(0,0)}
        15%{opacity:.55}
        70%{opacity:.4}
        100%{opacity:0;transform:translate(120px,-58px)}
      }
      .sock{transform-origin:690px 168px; animation:sock 3.7s ease-in-out infinite;}
      @keyframes sock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
      .heat{animation:heat 2.6s ease-in-out infinite;}
      @keyframes heat{0%,100%{opacity:.05;transform:translate(0,0)}50%{opacity:.2;transform:translate(5px,-2px)}}
      .haze{animation:haze 26s ease-in-out infinite;}
      @keyframes haze{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,0)}}
      .grass{transform-box:fill-box; transform-origin:bottom center; animation:grass 4.4s ease-in-out infinite;}
      @keyframes grass{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
      @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
    ]]></style>
  </defs>

  <!-- ================================================================== -->
  <g class="shake" id="world">

    <!-- ========== 天空 / 远景 ========== -->
    <rect x="-40" y="-40" width="1280" height="540" fill="url(#gSky)"/>
    <circle cx="1108" cy="132" r="150" fill="url(#gSun)"/>
    <circle cx="1108" cy="138" r="26" fill="#ffe0ad" opacity=".85"/>

    <g class="haze" opacity=".5">
      <ellipse cx="360" cy="196" rx="330" ry="17" fill="#8fa3ad" opacity=".22" filter="url(#fSoft)"/>
      <ellipse cx="880" cy="150" rx="260" ry="13" fill="#a8b6bd" opacity=".18" filter="url(#fSoft)"/>
      <ellipse cx="620" cy="248" rx="420" ry="12" fill="#c9b79a" opacity=".14" filter="url(#fSoft)"/>
    </g>

    <!-- 远山 -->
