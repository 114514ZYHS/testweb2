<style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   瓶中沧海 — Voxel diorama inside a lying glass bottle
   Everything (sea, sky, island, ship, weather) lives INSIDE the bottle.
   ============================================================ */

const DIAG = { ready:false, errors:[], boot:performance.now() };
window.__DIAG = DIAG;

const Q = new URLSearchParams(location.search);
const qn = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.32;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x04060c, 1);

let DPR = Math.min(window.devicePixelRatio || 1, 1.8);
let renderScale = 1.0;                 // adaptive resolution
const refrRT = new THREE.WebGLRenderTarget(2, 2, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true,
});
function applySize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(DPR * renderScale);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w * DPR * renderScale, h * DPR * renderScale);
  const db = renderer.getDrawingBufferSize(_v2b2);
  refrRT.setSize(Math.max(2, Math.floor(db.x*0.5)), Math.max(2, Math.floor(db.y*0.5)));
}

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e18, 0.0016);

const _v2b2 = new THREE.Vector2();
const camera = new THREE.PerspectiveCamera(38, 1, 0.6, 1400);
const camState = {
  az:  qn('az', -0.62),
  el:  qn('el', 0.30),
  r:   qn('r', 205),
  tx: 0, ty: 6, tz: 0,
  azV:0, elV:0,
  auto:true, idle:0,
};
const CAM_MIN_R = 96, CAM_MAX_R = 330, CAM_MIN_EL = -0.18, CAM_MAX_EL = 1.28;

/* ---------- post processing ---------- */
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1024, 640), 0.62, 0.58, 0.80);
composer.addPass(bloomPass);
/* colour grade / vignette / storm tint pass */
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse:{value:null},
    uStorm:{value:0}, uNight:{value:0}, uFlash:{value:0}, uTime:{value:0},
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uStorm,uNight,uFlash,uTime; varying vec2 vUv;
    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    void main(){
      vec2 uv=vUv; vec3 c = texture2D(tDiffuse,uv).rgb;
      float d = length(uv-0.5);
      // gentle desaturation + teal push in storm, warm lift at night
      float lum = dot(c,vec3(0.299,0.587,0.114));
      float sAt = uStorm;
      vec3 cold = mix(vec3(lum)*vec3(0.74,0.82,0.98), c, 0.30);
      vec3 stormC = mix(c, cold, sAt*0.72);
      stormC *= 1.0 - 0.30*sAt;                       // storm darkens everything
      stormC += vec3(0.012,0.018,0.030)*sAt*(1.0-lum); // grey-blue cast in the shadows
      vec3 nightC = mix(stormC, stormC*vec3(1.02,0.99,1.08)+vec3(0.0,0.006,0.02)*(0.4+lum), uNight*0.45);
      // flash (lightning)
      nightC += vec3(0.85,0.92,1.0)*uFlash*(1.0-d*0.5);
      // vignette
      float vig = smoothstep(1.02,0.34,d);
      nightC *= mix(0.78,1.0,vig);
      // film grain
      float g = (h21(uv*vec2(1024.0,768.0)+uTime)-0.5)*0.028;
      nightC += g;
      gl_FragColor = vec4(nightC,1.0);
    }`
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());
const skyU = null;

/* ---------- root frames ----------
   bottleRoot   : rocks on the cradle during storm (glass, cork, island, seabed props)
   levelRoot    : child of bottleRoot at the same pivot, counter-rotated so its
                  contents (sea, sky, ship, creatures) stay perfectly horizontal. */
const bottleRoot = new THREE.Group();
const levelRoot  = new THREE.Group();
bottleRoot.add(levelRoot);
scene.add(bottleRoot);
const tiltQ = new THREE.Quaternion();

/* ---------- shared wave field (identical GLSL + JS so buoyancy matches) ---------- */
const WAVE_TERMS = [
  { kind:'dir', kx: 0.155, kz: 0.048, amp:1.00, speed:1.15, phase:0.00 },
  { kind:'dir', kx:-0.072, kz: 0.190, amp:0.72, speed:0.90, phase:1.70 },
  { kind:'dir', kx: 0.092, kz:-0.132, amp:0.48, speed:1.62, phase:4.10 },
  { kind:'rad', fr :0.105,            amp:0.40, speed:2.10, phase:0.00 },
  { kind:'dir', kx: 0.310, kz: 0.220, amp:0.22, speed:2.45, phase:2.20 },
  { kind:'dir', kx:-0.240, kz: 0.350, amp:0.15, speed:3.10, phase:5.00 },
  { kind:'dir', kx: 0.420, kz:-0.140, amp:0.10, speed:4.20, phase:1.10 },
  { kind:'dir', kx: 0.560, kz: 0.310, amp:0.13, speed:2.90, phase:2.60 },
  { kind:'dir', kx:-0.420, kz: 0.610, amp:0.09, speed:3.40, phase:5.20 },
];
function waveJS(x, z, t){
  let h = 0;
  for (const w of WAVE_TERMS){
    if (w.kind === 'dir') h += Math.sin((x*w.kx + z*w.kz) + t*w.speed + w.phase) * w.amp;
    else h += Math.sin(Math.sqrt(x*x + z*z)*w.fr - t*w.speed + w.phase) * w.amp;
  }
  return h; // ~ ±2.6 at unit scale
}
function waveGLSL(){
  let body = 'float wh=0.0;\n';
  for (const w of WAVE_TERMS){
    if (w.kind === 'dir')
      body += `wh += sin(pos.x*${w.kx.toFixed(4)} + pos.y*${w.kz.toFixed(4)} + t*${w.speed.toFixed(3)} + ${w.phase.toFixed(3)})*${w.amp.toFixed(3)};\n`;
    else
      body += `wh += sin(length(pos)*${w.fr.toFixed(4)} - t*${w.speed.toFixed(3)} + ${w.phase.toFixed(3)})*${w.amp.toFixed(3)};\n`;
  }
  return body + 'return wh;\n';
}
const WAVE_GLSL = 'float waveSum(vec2 pos, float t){\n' + waveGLSL() + '}';

/* ---------- bottle profile (axis = X, lying down) ---------- */
/* (x, radius) pairs from the round bottom to the lip */
const PROFILE = [
  [-56, 0.0], [-55.4, 5.0], [-54, 11.0], [-52, 17.5], [-49.5, 23.5], [-47, 28.0],
  [-45, 30.6], [-43.5, 32.2], [-42.5, 33.1], [-41.8, 33.7], [-41.2, 34.0],
  [ 30, 34.0], [ 33, 33.6], [ 36, 32.0], [ 39, 29.0], [ 42, 24.4], [ 44.5, 19.5],
  [ 46.5, 15.0],[ 48, 11.8], [ 49.2, 9.6], [ 50.2, 8.6], [ 51.2, 8.2],
  [ 63, 8.2], [ 63.6, 9.4], [ 65.2, 10.4], [ 66.4, 10.4], [ 67.0, 9.2], [ 67.6, 0.0],
];
const R_BODY   = 34.0;
const WALL     = 1.25;                 // glass thickness
const INTERIOR_K = 1 - WALL / R_BODY;  // interior radius scale
const X_START = PROFILE[0][0], X_END = PROFILE[PROFILE.length-1][0];
const WATER_Y  = -3.6;                 // sea level in bottle-frame coords

/* interior radius at x (linear interp of the profile, shrunk by the wall) */
function bottleR(x){
  const p = PROFILE;
  if (x <= p[0][0]) return p[0][1];
  if (x >= p[p.length-1][0]) return p[p.length-1][1];
  for (let i=0;i<p.length-1;i++){
    const a=p[i], b=p[i+1];
    if (x >= a[0] && x <= b[0]){
      const f=(x-a[0])/(b[0]-a[0]||1);
      // round the bottom cap with a circular arc instead of a straight line
      let r = a[1] + (b[1]-a[1])*f;
      if (i===0) { const dx=(x - p[0][0]); r = Math.max(r, Math.sqrt(Math.max(0,(p[0][1]+1)*(p[0][1]+1) - (dx-0.6)*(dx-0.6)))*0.0+r); }
      return r;
    }
  }
  return 0;
}
function innerR(x){ return Math.max(0, bottleR(x) - WALL); }
/* half-width of the sea surface at x (the chord of the circle at WATER_Y) */
function seaHalfWidth(x){
  const r = innerR(x);
  return Math.sqrt(Math.max(0, r*r - WATER_Y*WATER_Y));
}
/* signed distance-ish helper: >0 outside, <0 inside the interior volume */
function insideInterior(x,y,z,margin){
  const r = innerR(x) - (margin||0);
  const rad = Math.sqrt(y*y + z*z);
  return rad - r;
}

/* ---------- day cycle ---------- */
const DAY = {
  t: qn('t', 17.4),                     // hours 0..24
  speed: qn('speed', 1),                // ×1 base: 24h in 144 s
  base: 24/144,
  storm: 0, stormTarget: Q.get('storm')==='1' ? 1 : 0,
};
const KEYS = [
  // hour, skyTop, skyHorizon, sunLight, sunColor, amb, fog, seaShallow, seaDeep, star, lamp, cloudY, cloudDark
  { h: 0.0,  top:0x05070f, hz:0x0a1020, sun:0.00, sunC:0x26386b, amb:0x10182e, fog:0.0021, sh:0x123355, dp:0x02060f, star:1.00, lamp:1.00, cy:1.00 },
  { h: 4.2,  top:0x0a1020, hz:0x1d2338, sun:0.02, sunC:0x3d4f7d, amb:0x18203a, fog:0.0023, sh:0x1b3d5c, dp:0x040a14, star:0.85, lamp:0.95, cy:0.95 },
  { h: 5.6,  top:0x2c3552, hz:0x8a5a54, sun:0.30, sunC:0xff9a55, amb:0x2c2b44, fog:0.0026, sh:0x3d6478, dp:0x07111d, star:0.20, lamp:0.70, cy:0.85 },
  { h: 7.2,  top:0x4d6a95, hz:0xd9926a, sun:0.85, sunC:0xffc07a, amb:0x49536f, fog:0.0020, sh:0x4f8ea6, dp:0x0a1a2a, star:0.00, lamp:0.30, cy:0.70 },
  { h:10.0,  top:0x5d8fc7, hz:0xbcd6e8, sun:1.35, sunC:0xfff1d2, amb:0x6f86a3, fog:0.0014, sh:0x63b4c8, dp:0x0d2438, star:0.00, lamp:0.05, cy:0.55 },
  { h:12.5,  top:0x5a94cf, hz:0xc4dded, sun:1.55, sunC:0xffffff, amb:0x7d94ae, fog:0.0012, sh:0x6cc4cf, dp:0x0e2a40, star:0.00, lamp:0.02, cy:0.50 },
  { h:15.5,  top:0x5b8ec9, hz:0xd6c9a8, sun:1.30, sunC:0xffe7b8, amb:0x74849c, fog:0.0015, sh:0x63b2c2, dp:0x0d2438, star:0.00, lamp:0.05, cy:0.55 },
  { h:17.6,  top:0x4a76a8, hz:0xf0a055, sun:1.00, sunC:0xffb35e, amb:0x5f6178, fog:0.0020, sh:0x4f8fa8, dp:0x0a1c2c, star:0.00, lamp:0.28, cy:0.66 },
  { h:19.0,  top:0x2e3f66, hz:0xe8763c, sun:0.55, sunC:0xff7a3a, amb:0x3c3a54, fog:0.0025, sh:0x33617c, dp:0x07111d, star:0.15, lamp:0.62, cy:0.80 },
  { h:20.2,  top:0x141d38, hz:0x8c4550, sun:0.14, sunC:0x8a6a8f, amb:0x212440, fog:0.0027, sh:0x1c405c, dp:0x050c16, star:0.60, lamp:0.95, cy:0.92 },
  { h:21.6,  top:0x080d1d, hz:0x1a1e33, sun:0.03, sunC:0x41507e, amb:0x141b32, fog:0.0023, sh:0x123355, dp:0x03080f, star:0.95, lamp:1.00, cy:1.00 },
  { h:24.0,  top:0x05070f, hz:0x0a1020, sun:0.00, sunC:0x26386b, amb:0x10182e, fog:0.0021, sh:0x123355, dp:0x02060f, star:1.00, lamp:1.00, cy:1.00 },
];
const SKY = {
  top:new THREE.Color(), hz:new THREE.Color(), sunC:new THREE.Color(),
  amb:new THREE.Color(), fog:new THREE.Color(), sh:new THREE.Color(), dp:new THREE.Color(),
  sun:0, star:0, lamp:0, cy:0, night:0, dusk:0,
};
const _c1=new THREE.Color(), _c2=new THREE.Color();
function sampleDay(t){
  let a=KEYS[0], b=KEYS[KEYS.length-1];
  for (let i=0;i<KEYS.length-1;i++){
    if (t>=KEYS[i].h && t<=KEYS[i+1].h){ a=KEYS[i]; b=KEYS[i+1]; break; }
  }
  const f = (t-a.h)/((b.h-a.h)||1);
  const L=(p,q)=>p+(q-p)*f;
  SKY.top.setHex(a.top).lerp(_c1.setHex(b.top), f);
  SKY.hz .setHex(a.hz ).lerp(_c1.setHex(b.hz ), f);
  SKY.sunC.setHex(a.sunC).lerp(_c1.setHex(b.sunC), f);
  SKY.amb.setHex(a.amb).lerp(_c1.setHex(b.amb), f);
  SKY.fog.setHex(a.fog).lerp(_c1.setHex(b.fog), f);
  SKY.sh.setHex(a.sh).lerp(_c1.setHex(b.sh), f);
  SKY.dp.setHex(a.dp).lerp(_c1.setHex(b.dp), f);
  SKY.sun = L(a.sun,b.sun); SKY.star = L(a.star,b.star);
  SKY.lamp = L(a.lamp,b.lamp); SKY.cy = L(a.cy,b.cy);
  SKY.night = THREE.MathUtils.clamp((SKY.star-0.12)/0.88, 0, 1);
  SKY.dusk  = THREE.MathUtils.clamp(1 - Math.abs(t-19)/2.6, 0, 1) * 0.9 +
              THREE.MathUtils.clamp(1 - Math.abs(t-5.9)/2.2, 0, 1) * 0.7;
  return f;
}
/* sun / moon positions inside the bottle sky (level frame) */
const sunPos = new THREE.Vector3(), moonPos = new THREE.Vector3();
function clampInsideShell(v, margin){
  const rmax = Math.max(1.2, innerR(v.x) - margin);
  const r = Math.sqrt(v.y*v.y + v.z*v.z);
  if (r > rmax){ const k = rmax/r; v.y *= k; v.z *= k; }
}
function bodiesPosition(t){
  const rise = 5.4, set = 19.6;
  const rx = 41.5, ry = 22.0, y0 = -2.0;
  const sunAng = ((t - rise) / (set - rise)) * Math.PI;
  sunPos.set(-Math.cos(sunAng)*rx, y0 + Math.sin(sunAng)*ry, 5.0);
  clampInsideShell(sunPos, 2.0);
  const moonSpan = 24 - set + rise;
  const mt = (t >= set) ? (t - set) : (t + 24 - set);
  const moonAng = (mt / moonSpan) * Math.PI;

  beam(x0,y0,z0,x1,y1,z1,t,color,axis){

    if (!len){ this.add(mx,my,mz,t,t,t,color,0); return; }
    if (axis==='y') { this.add(mx,my,mz,t,len,t,color,0); return; }
    if (axis==='z') { this.add(mx,my,mz,t,t,len,color,0); return; }
    if (axis==='x') { this.add(mx,my,mz,len,t,t,color,0); return; }

    if (Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>Math.abs(dz)) this.add(mx,my,mz,t,len,t,color,0);

const ISLAND = { x: -3.5, z: 1.0, r: 11.6 };

  const cols = [], rows = 46;
  const x0 = X_START + 5.5, x1 = 47.0;
  const NX = 132;
  const pos = [], norm=[], uvA=[], edge=[], idx=[];
  const vcount = [];
  let vi = 0;
  for (let i=0;i<=NX;i++){
    const f = i/NX;
    const x = x0 + (x1-x0)*f;
    const hw = seaHalfWidth(x) * 0.985;
    const nrow = Math.max(6, Math.round(rows * Math.min(1, hw/26)));
    const start = vi;
    for (let j=0;j<=nrow;j++){
      const t = j/nrow;
      const z = -hw + 2*hw*t;
      const dWall = Math.min(hw - Math.abs(z), x - (X_START+5.5), 47.0 - x);
      const ed = Math.max(0, Math.min(dWall, 3.0));
      const thI = Math.atan2(z-ISLAND.z, x-ISLAND.x);
      const diI = Math.hypot(x-ISLAND.x, z-ISLAND.z);
      const inside = diI < islandShape(WATER_Y, thI) - 2.3;
      pos.push(x, 0, z); norm.push(0,1,0); uvA.push(f, t); edge.push(ed);
      vcount.push(inside?0:1);
      vi++;
    }
    vcount.length; // noop
    cols.push([start, nrow]);
  }
  // triangles between neighbouring columns, skipping hole cells
  for (let i=0;i<cols.length-1;i++){
    const [a,na] = cols[i], [b,nb] = cols[i+1];
    for (let j=0;j<nb;j++){
      const jf = j/nb, ji = Math.round(jf*na);
      const p0=a+ji, p1=a+Math.min(na,ji+1), q0=b+j, q1=b+Math.min(nb,j+1);
      if (vcount[p0]||vcount[p1]||vcount[q0]||vcount[q1]) continue;
      idx.push(p0,q0,p1, p1,q0,q1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(norm,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvA,2));
  g.setAttribute('aEdge', new THREE.Float32BufferAttribute(edge,1));
  g.setIndex(idx);

}

  const ix = Math.round(x/CELL), iz = Math.round(z/CELL);
  let best = terrain.get(key(ix,iz));
  if (best !== undefined) return best;
  for (let a=-1;a<=1;a++) for (let b=-1;b<=1;b++){
    const v = terrain.get(key(ix+a,iz+b));
    if (v !== undefined) best = (best===undefined)? v : Math.max(best,v);
  }
  return best === undefined ? null : best;
}
function containClamp(x,y,z,m){
  const s = insideInterior(x,y,z, m===undefined?1.0:m);
  return s;   // <0 ok
}
/* angular noise helper */
function angNoise(th, s1, s2){ return 1 + 0.20*Math.sin(th*3+s1) + 0.13*Math.sin(th*7+s2) + 0.07*Math.sin(th*13+s1*2.3); }

function islandShape(y, th){
  const yTop = 12.6;
  const d = (y - WATER_Y) / (yTop - WATER_Y);
  let base;
  if (y < WATER_Y) base = 10.6 + (WATER_Y - y)*0.15;
  else base = 10.6 * (1 - Math.pow(Math.min(1,d), 1.42)) + 1.1;
  return base * angNoise(th, 1.7, 4.3);
}

{
  const yTop = 12.6, yBot = -16;
  const layers = Math.round((yTop-yBot)/CELL);
  const shape = islandShape;
  for (let i=0;i<=layers;i++){
    const y = yBot + (yTop-yBot)*(i/layers);
    const thMax = Math.PI*2;
    const rAt = shape(y, 0)*1.25;
    const nCells = Math.ceil(rAt/CELL)+1;
    for (let a=-nCells;a<=nCells;a++){
      for (let b=-nCells;b<=nCells;b++){
        const x = ISLAND.x + a*CELL, z = ISLAND.z + b*CELL;
        const th = Math.atan2(z-ISLAND.z, x-ISLAND.x);
        const dist = Math.hypot(x-ISLAND.x, z-ISLAND.z);
        const r = shape(y, th);
        if (dist > r) continue;
        // secondary ridge to the NE, plus a spit toward the dock (+X/-Z)
        let ok = true;
        // interior containment
        if (containClamp(x,y,z,1.0) > 0) ok = false;
        // surface exposure
        if (ok){
          let exposed = false;
          const nb = [[CELL,0,0],[-CELL,0,0],[0,CELL,0],[0,-CELL,0],[0,0,CELL],[0,0,-CELL]];
          for (const [dx,dy,dz] of nb){
            const nx=x+dx, ny=y+dy, nz=z+dz;
            const thn = Math.atan2(nz-ISLAND.z, nx-ISLAND.x);
            const dn = Math.hypot(nx-ISLAND.x, nz-ISLAND.z);
            let inside = dn <= shape(ny, thn) && containClamp(nx,ny,nz,1.0) <= 0;
            if (!inside){ exposed = true; break; }
          }
          if (!exposed) continue;
          // colour bands
          let col;
          const nz2 = rnd();
          if (y < WATER_Y-1.4) col = jit(WET[(a+b+WET.length)%WET.length], 0.35);

          else if (y > 8.4) col = jit(ROCK[ri(0,ROCK.length-1)], 0.28);
          else if (y > 2.2) col = jit(GRASS[ri(0,GRASS.length-1)], 0.38);
          else col = rnd()<0.55? jit(GRASS[ri(0,GRASS.length-1)],0.3) : jit(ROCK[ri(0,ROCK.length-1)],0.25);
          // dark underwater tint baked in (aquatic material handles most of it)
          islandVox.add(x,y,z, CELL,CELL,CELL, col, 0);
          const kq = key(Math.round(x/CELL), Math.round(z/CELL));
          const prev = terrain.get(kq);
          if (prev === undefined || y > prev) terrain.set(kq, y);
          if (y > peak.y && Math.hypot(x-peak.x,z-peak.z) < 4.2) peak.y = y;
        }
      }

  }
}

function buildDock(){

  const planks = 16;
  for (let i=0;i<planks;i++){
    px += dx; pz += dz;
    const y = Math.max(WATER_Y + 0.55, py - (i>3? 0.55:0.28));
    for (let k=-1;k<=1;k++){
      vox.add(px - dx*0.5 + k*dx*0.34, y, pz - dz*0.5 + k*dz*0.34, 0.92,0.2,0.34, jit(i%2?0x8a6236:0x75522c,0.2), Math.atan2(dx,-dz));
    }
    // pilings every 2 planks
    if (i%2===0){
      const bottom = Math.min(-innerR(px)+1.5, WATER_Y-7);
      for (let yy=y; yy>bottom; yy-=1.4){
        vox.add(px-dx*0.4, yy, pz-dz*0.4, 0.42,1.4,0.42, jit(0x4e3a22,0.18),0);

    }
    dockTip.set(px, y, pz);
  }
  // railing posts + lantern post at the tip
  for (let i=0;i<4;i++){
    const t=i/3;
    vox.add(sx+dx*15*t, WATER_Y+2.3, sz+dz*15*t, 0.22,1.4,0.22, jit(0x53391f,0.16),0);
  }
  vox.add(dockTip.x+0.4, dockTip.y+1.6, dockTip.z+0.4, 0.28,1.8,0.28, jit(0x3d2b18,0.14),0);

function buildPalm(px, pz, h, lean){
  const vox = new VoxelSet();
  const cw = 0.55;
  let x = px, z = pz, y = groundY(px,pz);
  if (y === null) y = WATER_Y + 1.0;
  const n = Math.round(h/cw);
  let dirx = lean[0], dirz = lean[1];
  for (let i=0;i<n;i++){
    const f=i/n;
    x += dirx*cw*0.42*(0.3+f*1.5); z += dirz*cw*0.42*(0.3+f*1.5);
    const yy = y + cw*(i+0.5);
    const r = 0.34*(1-f*0.45);
    vox.add(x, yy, z, r*2, cw, r*2, jit(0x7a5a34, 0.22), i*0.6);
    if (i%3===0) vox.add(x+0.35, yy-0.2, z+0.3, 0.42,0.42,0.42, jit(0x4b3a20,0.2),0);
  }
  const topY = y + n*cw;
  // fronds
  const fr = 6;
  for (let k=0;k<fr;k++){
    const ang = k/fr*6.283 + rnd()*0.4;
    let fx=x, fz=z, fy=topY;
    const len = 3.2 + rr(0,1.2);
    const steps = Math.round(len/cw);
    for (let i=0;i<steps;i++){
      const t=i/steps;
      fx += Math.cos(ang)*cw*0.85; fz += Math.sin(ang)*cw*0.85;
      fy += cw*(0.55 - t*1.7);
      const w = 0.9 - t*0.45;
      vox.add(fx, fy, fz, cw*0.9, 0.22, w, jit(0x2e7a2c + (t>0.5?0x101010:0), 0.3), ang);
    }
  }
  // coconuts
  for (let k=0;k<2;k++) vox.add(x+rr(-0.5,0.5), topY-0.6, z+rr(-0.5,0.5), 0.5,0.5,0.5, jit(0x5b3f1e,0.2),0);
  const g = new THREE.Group();
  vox.build(g, new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({}), {cast:true});
  bottleRoot.add(g);
  return g;
}

function coral(x, theta, size, pal){

  const grow = (ox,oy,oz, dx,dy,dz, depth, w)=>{
    let px=ox, py=oy, pz=oz;
    const steps = 3 + Math.round(rnd()*3);
    for (let i=0;i<steps;i++){
      px += dx*cw; py += dy*cw; pz += dz*cw;
      const c = pal[ri(0,pal.length-1)];
      vox.add(px,py,pz, w,w,w, jit(c,0.35), 0);
      dx += rr(-0.25,0.25); dy += rr(-0.02,0.30); dz += rr(-0.25,0.25);

{
  let inst = 0;
  function puffCloud(cx, cy, cz, scale, stormy){
    const cw = 0.85;
    const start = inst;
    const nb = 6 + ri(0,3);
    const blobs = [];
    for (let b=0;b<nb;b++){
      const t = nb>1 ? b/(nb-1) : 0.5;
      const ox = (t-0.5)*6.2*scale + rr(-0.5,0.5);
      const oz = rr(-1.3,1.3)*scale;
      const oy = rr(0.0,0.8)*scale;
      const r = (3.1 - Math.abs(t-0.5)*3.3 + rr(-0.2,0.6))*scale;
      blobs.push([ox,oy,oz,Math.max(1.1,r)]);
    }
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,minZ=1e9,maxZ=-1e9;
    for (const [ox,oy,oz,r] of blobs){
      minX=Math.min(minX,ox-r); maxX=Math.max(maxX,ox+r);
      minY=Math.min(minY,oy);   maxY=Math.max(maxY,oy+r*0.8);
      minZ=Math.min(minZ,oz-r); maxZ=Math.max(maxZ,oz+r);
    }
    const inBlob = (x,y,z)=>{
      for (const [ox,oy,oz,r] of blobs){
        const dx=x-ox, dy=(y-oy)*1.45, dz=z-oz;
        if (dx*dx+dy*dy+dz*dz <= r*r) return true;
      }
      return false;
    };
    for (let x=minX; x<=maxX; x+=cw){
      for (let y=minY; y<=maxY; y+=cw){
        if (y < 0.0) continue;
        for (let z=minZ; z<=maxZ; z+=cw){
          if (!inBlob(x,y,z)) continue;
          let exposed = !inBlob(x+cw,y,z)||!inBlob(x-cw,y,z)||!inBlob(x,y+cw,z)||!inBlob(x,y-cw,z)||!inBlob(x,y,z+cw)||!inBlob(x,y,z-cw);
          if (!exposed) continue;
          cloudVox.add(cx+x, cy+y, cz+z, cw,cw,cw, 0xffffff, 0);
          inst++;

  }
}

}

  /* ---- hull: stations along X, cross-sections along Y ---- */

    else if (f > 0.86) beam = 1.35*(1-(f-0.86)/0.14) + 0.18;
    else beam = 1.15 + 0.22*Math.sin((f-0.14)/0.72*Math.PI);
    const depth = 1.55;
    /* cross-section fill */
    for (let y=-depth; y<=sheer; y+=cw){
      const t = (y + depth)/(sheer + depth);
      const wsh = Math.sqrt(Math.max(0.02, Math.min(1, t*1.05))) * beam;
      for (let z=-wsh; z<=wsh; z+=cw*0.85){
        const onShell = Math.abs(z) > wsh-cw*0.9 || y > sheer-cw || y < -depth+cw*0.5;

        else if (y < 0.05) col = jit(0x8c2f22, 0.18);      // red boot stripe
        else if (Math.abs(Math.abs(z)-beam) < cw*0.9 && y > sheer-0.5) col = jit(WOOD,0.2);
        else col = jit(f>0.8? HULL2 : HULL, 0.16);
        vox.add(x, y, z, cw, cw, cw*0.9, col, 0);
      }
    }
    /* gunwale cap rail */
    for (let z=-beam; z<=beam; z+=cw*0.9) vox.add(x, sheer+cw*0.4, z, cw*0.9, cw*0.5, cw*0.9, jit(0xb08a52,0.16),0);
    /* deck */
    for (let z=-beam*0.86; z<=beam*0.86; z+=cw){
      vox.add(x, sheer-0.18, z, cw, cw*0.5, cw, jit(f>0.72?0x8a5f32:WOOD, 0.18), 0);
    }
    /* bow: pointed stem + figurehead */
    if (f > 0.9){
      for (let k=0;k<3;k++) vox.add(x+k*cw*1.2, sheer+0.55+k*0.42, 0, cw, cw, cw*1.3, jit(DARK,0.14), 0);
    }
    if (f > 0.96){
      vox.add(x+0.9, sheer-0.1, 0, 1.0, 0.5, 0.4, jit(0xd9b26a,0.2), 0);
      vox.add(x+1.5, sheer+0.25, 0, 0.5, 0.7, 0.3, jit(0xd9b26a,0.2), 0);
    }
    /* stern castle */
    if (f > 0.72){
      for (let y=sheer; y<sheer+0.95; y+=cw) for (let z=-beam*0.8; z<=beam*0.8; z+=cw){
        const onShell = Math.abs(z) > beam*0.8-cw || y > sheer+0.95-cw;

      vox.add(x, sheer+0.55, -beam*0.85, cw*0.8,cw*0.8,cw*0.8, jit(0xe8dcc0,0.1),0);
    }
    /* stern lantern + galleries */
    if (f > 0.985){

    }

      for (let k=0;k<9;k++){
        vox.add(x+1.0+k*0.55, sheer+1.5+k*0.32, 0, 0.5,0.42,0.42, jit(0x6a4526,0.14),0);

      }
    }
  }
  /* ---- gun ports ---- */
  for (let i=2;i<stations-4;i+=3){
    const x = -halfLen + 11.6*((i+0.5)/stations);
    for (const s of [-1,1]){
      vox.add(x, 0.45, s*1.28, 0.42,0.42,0.2, jit(0x1a120a,0.1),0);
      vox.add(x, 0.45, s*1.42, 0.5,0.5,0.12, jit(0xd8c9a0,0.1),0);
    }
  }
  /* ---- deck furniture ---- */
  const deckY = 1.15;
  for (const [dx,dz] of [[-3.2,0.5],[-1.4,-0.6],[1.2,0.7],[2.6,-0.5]]){
    for (let i=0;i<2;i++) for (let j=0;j<2;j++)

      for (const s of [-1,1]) vox.add(m.x, yd.y-0.2, s*yd.w/2, 0.3,0.5,0.3, jit(0x3d2a16,0.12),0);
      /* sail: curved slab hanging under the yard */
      const drop = Math.min(1.55, (m.yards[m.yards.length-1].y - yd.y)*-1 + 1.7);
      const rows = Math.round(drop/cw);
      const isMain = m.h > 8 && yd.w > 4.0;
      for (let r2=0;r2<rows;r2++){
        const f=r2/rows;
        const yy = yd.y - cw*0.5 - r2*cw;

(function containmentCheck(){
  scene.updateMatrixWorld(true);
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const targets = [['island', islandMesh], ['submerged', submergedMesh], ['clouds', cloudMesh]];
  let worst = -99, checked = 0; const off = [];
  for (const [nm, mesh] of targets){
    if (!mesh) continue;
    for (let i=0;i<mesh.count;i++){
      mesh.getMatrixAt(i, m);
      m.decompose(p, q, sc);
      mesh.localToWorld(p);
      const d = insideInterior(p.x, p.y, p.z, 0);
      checked++;
      if (d > worst){ worst = d; }
      if (d > 1.2 && off.length < 12) off.push({ mesh:nm, i, d:+d.toFixed(2), x:+p.x.toFixed(1), y:+p.y.toFixed(1), z:+p.z.toFixed(1) });
    }
  }
  DIAG.contain.checked = checked; DIAG.contain.worst = +worst.toFixed(2); DIAG.contain.offenders = off;
  console.log('containment', DIAG.contain.checked, 'voxels checked, worst', DIAG.contain.worst, off);
})();

function makeBookStack(x, z, n, rot){

    const w = rr(9,13), d = rr(6.5,9), h = rr(0.5,1.35);
    const col = BOOK_COLS[ri(0,BOOK_COLS.length-1)];
    const cover = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshLambertMaterial({ color: col }));
    cover.position.set(rr(-0.3,0.3), y+h/2, rr(-0.3,0.3));
    cover.rotation.y = rot + rr(-0.09,0.09);
    cover.castShadow = true; cover.receiveShadow = true;
    g.add(cover);
    // pages
    const pages = new THREE.Mesh(new THREE.BoxGeometry(w*0.94, h*0.82, d*0.9),
      new THREE.MeshLambertMaterial({ color: 0xd8cdb0 }));
    pages.position.copy(cover.position); pages.rotation.copy(cover.rotation);
    pages.position.x -= 0.18;
    g.add(pages);
    // spine label
    const spine = new THREE.Mesh(new THREE.BoxGeometry(w*0.55, h*0.86, 0.06),
      new THREE.MeshBasicMaterial({ map: makeBookTex(['DE RE MARI','USTRIO','SAILING LORE','OCEANUS','BOTTLE LOG','NAVIGARE'][ri(0,5)], col) }));
    spine.position.set(cover.position.x, cover.position.y, cover.position.z + d/2 + 0.04);
    spine.rotation.copy(cover.rotation);
    g.add(spine);
    y += h + 0.02;
  }
  g.position.set(x,0,z);
  scene.add(g);
  return g;
}

const drag = { on:false, x:0, y:0, moved:false };
canvas.addEventListener('pointerdown', (e)=>{
  drag.on = true; drag.x = e.clientX; drag.y = e.clientY; drag.moved=false;
  canvas.classList.add('grabbing');
  camState.auto = false; camState.idle = 0;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', (e)=>{
  if (!drag.on) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.abs(dx)+Math.abs(dy) > 2) drag.moved = true;
  camState.az -= dx * 0.0062;
  camState.el = THREE.MathUtils.clamp(camState.el + dy * 0.0045, CAM_MIN_EL, CAM_MAX_EL);
  camState.idle = 0;
});
window.addEventListener('pointerup', ()=>{ drag.on=false; canvas.classList.remove('grabbing'); });
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  camState.r = THREE.MathUtils.clamp(camState.r * (1 + Math.sign(e.deltaY)*0.075), CAM_MIN_R, CAM_MAX_R);
  camState.idle = 0; camState.auto = false;
}, { passive:false });
/* pinch zoom */
let pinch = 0;
canvas.addEventListener('touchmove', (e)=>{
  if (e.touches.length === 2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (pinch) camState.r = THREE.MathUtils.clamp(camState.r * (pinch/d), CAM_MIN_R, CAM_MAX_R);
    pinch = d;
  }
}, { passive:true });
canvas.addEventListener('touchend', ()=>{ pinch = 0; });

/* storm key */
window.addEventListener('keydown', (e)=>{
  if (e.repeat && e.code === 'Space'){ DAY.stormTarget = 1; return; }
  if (e.code === 'Space'){ e.preventDefault(); DAY.stormTarget = 1; }
  else if (e.code === 'KeyP'){ togglePause(); }
  else if (e.code === 'Digit1'){ DAY.paused = false; setSpeed(1); syncPauseBtn(); }
  else if (e.code === 'Digit2'){ DAY.paused = false; setSpeed(4); syncPauseBtn(); }
  else if (e.code === 'Digit3'){ DAY.paused = false; setSpeed(12); syncPauseBtn(); }
});
window.addEventListener('keyup', (e)=>{ if (e.code === 'Space') DAY.stormTarget = 0; });

const PIVOT = new THREE.Vector3(-6, -34.5, 0);
const AX_X = new THREE.Vector3(1,0,0), AX_Z = new THREE.Vector3(0,0,1);
const _qA = new THREE.Quaternion(), _qR = new THREE.Quaternion(), _qP = new THREE.Quaternion();
function clampInBottle(x, y, z, margin){
  // wrap X into the usable interior and keep inside the revolved wall
  const lo = X_START + 6, hi = 45.5;
  let xx = x;
  if (xx > hi || xx < lo){
    const span = hi - lo;
    xx = lo + ((xx - lo) % span + span) % span;
  }
  const r = Math.sqrt(y*y + z*z);
  const rmax = innerR(xx) - margin;
  if (r > rmax){ const k = rmax/Math.max(r, 1e-4); return { x:xx, y:y*k, z:z*k }; }
  return { x:xx, y, z };
}

let flashV = 0, nextBolt = 3.0;

function updateDayNight(){
  sampleDay(DAY.t);
  bodiesPosition(DAY.t);
  const st = DAY.storm;
  /* lights */
  sunLight.position.copy(sunPos);
  sunLight.target.position.set(0, WATER_Y+3, 0);
  sunLight.intensity = SKY.sun * (1 - st*0.62);
  sunLight.color.copy(SKY.sunC);
  moonLight.position.copy(moonPos);
  moonLight.target.position.set(0, WATER_Y+3, 0);
  moonLight.intensity = SKY.star * 0.66 * (1-st*0.5);
  hemi.color.copy(SKY.top); hemi.groundColor.copy(SKY.dp);
  hemi.intensity = 0.32 + SKY.star*0.12 + (1-SKY.sun/1.6)*0.05;
  amb2.intensity = 0.40 + SKY.star*0.10;
  scene.fog.color.copy(SKY.fog);
  scene.fog.density = 0.0016 + st*0.0009;
  /* sky shell */
  const u = skyMat.uniforms;
  u.uTop.value.copy(SKY.top); u.uHz.value.copy(SKY.hz);
  u.uShallow.value.copy(SKY.sh); u.uDeep.value.copy(SKY.dp);
  u.uSunPos.value.copy(sunPos); u.uMoonPos.value.copy(moonPos);
  u.uSunI.value = SKY.sun; u.uMoonI.value = SKY.star;
  u.uStar.value = SKY.star; u.uStorm.value = st; u.uDusk.value = SKY.dusk;
  u.uTime.value = animT;
  starMat.uniforms.uStar.value = SKY.star;
  starMat.uniforms.uStorm.value = st;
  starMat.uniforms.uTime.value = animT;
  /* sun & moon bodies */
  sunBody.position.copy(sunPos);
  sunBody.visible = SKY.sun > 0.02 && st < 0.7;
  sunBody.userData.halo.material.uniforms.uI.value = 0.56 + SKY.dusk*0.60;
  moonBody.position.copy(moonPos);
  moonBody.visible = SKY.star > 0.08;
  moonBody.userData.halo.material.uniforms.uI.value = 0.35 + SKY.star*0.5;
  /* water */
  const su = seaMat.uniforms;
  su.uSky.value.copy(SKY.top); su.uHz.value.copy(SKY.hz);
  su.uDeep.value.copy(SKY.dp); su.uShallow.value.copy(SKY.sh);
  su.uSunDir.value.copy(sunPos).normalize();
  su.uSunCol.value.copy(SKY.sunC).multiplyScalar(THREE.MathUtils.clamp(SKY.sun*0.8,0,1.2));
  su.uNight.value = SKY.night;
  su.uStorm.value = st;
  su.uTime.value = animT;
  su.uAmp.value = 1.02*(1+st*1.95);
  AQUA.amt = 0.052 + st*0.02;
  AQUA.deep.copy(SKY.dp);
  AQUA.shallow.copy(SKY.sh);
  /* glass */
  glassMat.uniforms.uSunDir.value.copy(sunPos).normalize();
  glassMat.uniforms.uSunCol.value.copy(SKY.sunC).multiplyScalar(THREE.MathUtils.clamp(SKY.sun,0,1.3));
  glassMat.uniforms.uRim.value.copy(SKY.hz).lerp(_c2.setRGB(0.85,0.93,1.0), 0.55);
  glassMat.uniforms.uStorm.value = st;
  glassMat.uniforms.uOp.value = 1.0;
  glassMat.uniforms.uCam.value.copy(camera.position);
  glassInner.material.uniforms.uCam.value.copy(camera.position);
  foamMat.uniforms.uCol.value.copy(SKY.hz).lerp(WHITE, 0.55);
  foamMat.uniforms.uA.value = 0.72 + st*0.4;
  wakeMesh.material.uniforms.uCol.value.copy(SKY.hz).lerp(WHITE, 0.6);
  wakeMesh.material.uniforms.uA.value = 0.6 + st*0.5;
  /* lamps / fire */
  const lampF = SKY.lamp * (0.75 + 0.25*Math.sin(animT*7.3) + 0.1*Math.sin(animT*17.7));
  glowFireMesh.material.color.setRGB(lampF*1.15, lampF*0.86, lampF*0.52);
  glowGoldMesh.material.color.setRGB(0.55+lampF*0.5, 0.42+lampF*0.42, 0.22+lampF*0.22);
  if (shipGlowMesh) shipGlowMesh.material.color.setRGB(lampF*1.2, lampF*0.9, lampF*0.55);
  const lp = lighthouse.userData.lampPos;
  lampLight.position.set(lp.x, lp.y, lp.z);
  lampLight.intensity = lampF*2.4 + (st>0.4?0.6:0);
  cottageLight.position.set(ISLAND.x-4.6, WATER_Y+7.5, ISLAND.z+4.2);
  cottageLight.intensity = lampF*1.1;
  treasureLight.intensity = 0.35 + lampF*1.1;
  candleLight.intensity = (0.35 + lampF*1.6) * (0.8+0.2*Math.sin(animT*13.1));
  candleFlameMat.color.setRGB(1.0, 0.55+0.12*Math.sin(animT*21), 0.18);
  /* room light follows dusk mood */
  const roomB = (0.14 + 0.86*Math.pow(1-SKY.night, 0.5)) * (1 - 0.42*st);
  roomLight.intensity = 2.4*roomB + 0.35;
  roomFill.intensity = (0.30 + 0.5*roomB)*(1 - 0.25*st);
  amb2.intensity = 0.34 + 0.42*roomB + SKY.star*0.10;
  amb2.color.copy(SKY.amb);
  /* storm grade */
  gradePass.uniforms.uStorm.value = st;
  gradePass.uniforms.uNight.value = SKY.night;
  gradePass.uniforms.uTime.value = animT;
  bloomPass.strength = 0.52 + SKY.night*0.46 + st*0.10;
  if (window.__shaft) window.__shaft.traverse(o=>{ if(o.material && o.material.uniforms && o.material.uniforms.uA) o.material.uniforms.uA.value = 0.34*(1-SKY.night*0.55); });
  if (window.__dust) window.__dust.material.uniforms.uA.value = 0.55*(1-SKY.night*0.5);
  bloomPass.threshold = 0.72 - SKY.night*0.12;
  renderer.toneMappingExposure = 1.06 - st*0.10;
}

function updateBottleTilt(dt){
  const s = DAY.storm;
  const t = animT;
  const roll = (Math.sin(t*1.27)*0.55 + Math.sin(t*2.13+1.1)*0.3 + Math.sin(t*3.7+2.4)*0.15) * 3.3 * s;
  const pitch= (Math.sin(t*0.97+0.5)*0.6 + Math.sin(t*1.83+2.2)*0.28) * 2.3 * s;
  _e.set(roll*Math.PI/180, 0, pitch*Math.PI/180);
  tiltQ.setFromEuler(_e);
  bottleRoot.quaternion.copy(tiltQ);
  bottleRoot.position.copy(PIVOT).sub(_v3.copy(PIVOT).applyQuaternion(tiltQ));
  levelRoot.quaternion.copy(tiltQ).invert();
  /* the hanging tag swings against the tilt */
  const tp = tagGroup.userData.pivot;
  if (tp){
    const wob = Math.sin(t*3.4)*0.10*s + Math.sin(t*7.1)*0.03*s;
    tp.rotation.z = -pitch*Math.PI/180*0.6 + wob;
    tp.rotation.x = Math.sin(t*2.2)*0.05*s;
  }
}

function updateSea(){
  seaMat.uniforms.uSurge.value = DAY.storm;
  /* drifting foam patches ride the waves */
  const amp = seaMat.uniforms.uAmp.value;
  const m = new THREE.Matrix4();
  for (let i=0;i<FOAM_N;i++){
    const f = foamState[i];
    f.x += Math.sin(animT*0.2 + f.ph*6.28)*0.012;
    f.z += Math.cos(animT*0.17 + f.ph*6.28)*0.012;
    const hw = seaHalfWidth(f.x);
    if (Math.abs(f.z) > hw*0.95) f.z *= 0.98;
    const h = waveJS(f.x, f.z, animT)*amp;
    const s = f.s*(1 + DAY.storm*0.5);
    _q.setFromAxisAngle(UP_Y, f.ph*6.28);
    m.compose(_v3.set(f.x, WATER_Y + h + 0.12, f.z), _q, _v3b.set(s,1,s));
    foamPatches.setMatrixAt(i, m);
  }
  foamPatches.instanceMatrix.needsUpdate = true;
}

function updateBubbles(dt){
  const amp = seaMat.uniforms.uAmp.value;
  const m = new THREE.Matrix4();
  for (let i=0;i<BUB_N;i++){
    const b = bubState[i];
    b.y += b.vy*dt*(1+DAY.storm*0.5);
    const wob = Math.sin(animT*2.2 + b.ph)*0.35;
    if (b.y > WATER_Y - 0.4){ bubbleSpawn(i, true); continue; }
    const s = b.s*(0.8+0.2*Math.sin(animT*4+b.ph));
    _q.setFromAxisAngle(UP_Y, animT*0.6+b.ph);
    m.compose(_v3.set(b.x+wob, b.y, b.z+wob*0.5), _q, _v3b.set(s,s,s));
    bubbles.setMatrixAt(i, m);
  }
  bubbles.instanceMatrix.needsUpdate = true;
  bubMat.uniforms.uSurf.value = DAY.storm*0.6;
}

function updateFish(dt){
  const m = new THREE.Matrix4();
  let idx = 0;
  for (const sc of schools){
    sc.ph += dt*sc.sp;
    const cx = ISLAND.x + Math.cos(sc.ph)*sc.rad*1.3;
    const cz = ISLAND.z + Math.sin(sc.ph)*sc.rad;
    const cy = sc.y0 + Math.sin(animT*0.3 + sc.kind)*sc.dy;
    for (const f of sc.fish){
      f.a += dt*sc.sp*f.sp*1.6;
      const x = cx + Math.cos(f.a)*f.r*0.8;
      const z = cz + Math.sin(f.a)*f.r;
      const y = cy + Math.sin(animT*1.1+f.ph)*1.1;
      const hw = seaHalfWidth(x);
      const zz = THREE.MathUtils.clamp(z, -hw*0.92, hw*0.92);
      const yy = Math.max(-innerR(x)+1.5, Math.min(WATER_Y-0.8, y));
      const vdx = (-Math.sin(f.a)*f.r*0.8 - Math.sin(sc.ph)*sc.rad*1.3)*sc.sp;
      const vdz = ( Math.cos(f.a)*f.r     + Math.cos(sc.ph)*sc.rad   )*sc.sp;
      const hdg = -Math.atan2(vdz, vdx);
      _q.setFromAxisAngle(UP_Y, hdg);
      const s = 0.55 + (sc.kind%3)*0.18;
      m.compose(_v3.set(x, yy, zz), _q, _v3b.set(s*1.5, s*0.85, s*0.5));
      fishes.setMatrixAt(idx, m);
      _col.set(fishColors[sc.kind]);
      fishes.setColorAt(idx, _col);
      idx++;
    }
  }
  fishes.instanceMatrix.needsUpdate = true;
  if (fishes.instanceColor) fishes.instanceColor.needsUpdate = true;
}

function updateWhale(dt){
  const w = whale;
  const amp = seaMat.uniforms.uAmp.value;
  if (w.mode === 'swim'){
    w.a += dt*w.speedA;
    w.y += (-13.5 - w.y)*dt*0.6;
    w.vy = 0;
    w.tBreach -= dt;
    /* breach on the timer, with a soft preference for the scenic window */
    if (w.tBreach <= 0){
      w.mode = 'breach'; w.vy = 34; w.tBreach = rr(11, 21);
      DIAG.breaches = (DIAG.breaches||0)+1;
    }
  } else if (w.mode === 'breach'){
    w.a += dt*w.speedA*1.5;
    w.vy -= 30*dt;
    w.y += w.vy*dt;
    if (w.y < -9 && w.vy < 0){
      w.mode = 'swim';
      splash(w.g.position.x, w.g.position.z, 1.0);
      w.spout = 1.4;
    }
  }
  const x = ISLAND.x + Math.cos(w.a)*w.rad;
  const z = ISLAND.z + Math.sin(w.a)*w.rad*0.82;
  const hw = seaHalfWidth(x);
  const zz = THREE.MathUtils.clamp(z, -hw*0.85, hw*0.85);
  const inner = innerR(x);
  const yy = THREE.MathUtils.clamp(w.y, -inner+3.5, 6.5);
  const prevY = w.g.position.y;
  w.g.position.set(x, yy, zz);
  const hdg = -Math.atan2(Math.cos(w.a)*0.82, -Math.sin(w.a));
  const pitch = THREE.MathUtils.clamp((yy - prevY)/Math.max(dt,0.001)*0.035, -0.9, 0.9);
  _q.setFromAxisAngle(UP_Y, hdg);
  w.g.quaternion.copy(_q);
  w.g.rotateZ(pitch);
  w.g.rotateX(Math.sin(animT*0.6)*0.05);
  /* spout */
  if (w.spout > 0){
    w.spout -= dt;
    for (let i=0;i<SPOUT_N;i++){
      const s2 = spoutState[i];
      if (s2.life <= 0){
        s2.x = x + rr(-0.4,0.4); s2.y = yy + 1.6; s2.z = zz + rr(-0.4,0.4);
        s2.vx = rr(-1.2,1.2); s2.vy = rr(6,11); s2.vz = rr(-1.2,1.2);
        s2.life = s2.max = rr(0.5,1.1);
        break;
      }
    }
  }
  /* surface spout when near the surface while swimming */
  if (w.mode==='swim' && yy > WATER_Y - 2.2 && rnd() < dt*0.7){
    for (let i=0;i<SPOUT_N;i++){
      const s2 = spoutState[i];
      if (s2.life <= 0){
        s2.x=x; s2.y=WATER_Y+0.4; s2.z=zz; s2.vx=rr(-1,1); s2.vy=rr(4,8); s2.vz=rr(-1,1);
        s2.life=s2.max=rr(0.4,0.9); break;
      }
    }
  }
}
function splash(x, z, scale){
  const n = Math.round(70*scale);
  for (let i=0;i<n;i++){
    const a = rnd()*6.283, r = rr(0.2,2.2)*scale;
    spawnSpray(x+Math.cos(a)*r*0.4, WATER_Y+rr(0,0.6), z+Math.sin(a)*r*0.4,
      Math.cos(a)*rr(1,4)*scale, rr(4,13)*scale, Math.sin(a)*rr(1,4)*scale,
      rr(0.6,1.4), rr(0.5,1.3)*scale, -22);
  }
  for (let i=0;i<Math.round(9*scale);i++) spawnWake(x+rr(-1.5,1.5), z+rr(-1.5,1.5), rr(3,6)*scale, rr(1.6,2.6));
}
function updateSpray(dt){
  const m = new THREE.Matrix4();
  const aa = sprayGeo.getAttribute('aA');
  for (let i=0;i<SPRAY_N;i++){
    const s = sprayState[i];
    if (s.life > 0){
      s.life -= dt;
      s.vy += s.g*dt;
      s.x += s.vx*dt; s.y += s.vy*dt; s.z += s.vz*dt;
      const f = Math.max(0, s.life/s.max);
      const sc = s.s*(0.6+0.7*(1-f));
      _q.setFromAxisAngle(UP_Y, animT*3+i);
      m.compose(_v3.set(s.x,s.y,s.z), _q, _v3b.set(sc,sc,sc));
      aa.setX(i, f*0.85);
    } else {
      m.compose(_v3.set(0,-999,0), _q.identity(), _v3b.set(0.001,0.001,0.001));
      aa.setX(i, 0);
    }
    spray.setMatrixAt(i, m);
  }
  spray.instanceMatrix.needsUpdate = true;
  aa.needsUpdate = true;
  /* spout particles */
  const aa2 = spoutGeo.getAttribute('aA');
  for (let i=0;i<SPOUT_N;i++){
    const s = spoutState[i];
    if (s.life > 0){
      s.life -= dt; s.vy -= 20*dt;
      s.x += s.vx*dt; s.y += s.vy*dt; s.z += s.vz*dt;
      const f = Math.max(0, s.life/s.max);
      const sc = (1.1-f*0.4)*1.1;
      _q.setFromAxisAngle(UP_Y, i);
      m.compose(_v3.set(s.x,s.y,s.z), _q, _v3b.set(sc,sc,sc));
      aa2.setX(i, f*0.8);
    } else { m.compose(_v3.set(0,-999,0), _q.identity(), _v3b.set(0.001,0.001,0.001)); aa2.setX(i,0); }
    spoutP.setMatrixAt(i, m);
  }
  spoutP.instanceMatrix.needsUpdate = true;
  aa2.needsUpdate = true;
}
function updateWake(dt){
  const m = new THREE.Matrix4();
  const aa = wakeGeo.getAttribute('aA');
  const amp = seaMat.uniforms.uAmp.value;
  for (let i=0;i<WAKE_N;i++){
    const w = wakeState[i];
    if (w.age < w.life){
      w.age += dt;
      const f = 1 - Math.max(0, 1 - w.age/w.life);
      const h = waveJS(w.x, w.z, animT)*amp;
      const s = w.s*(0.5 + f*1.8);
      _q.setFromAxisAngle(UP_Y, w.age*2+i);
      m.compose(_v3.set(w.x, WATER_Y+h+0.10, w.z), _q, _v3b.set(s,1,s));
      aa.setX(i, Math.max(0,(1-f))*0.9);
    } else {
      m.compose(_v3.set(0,-999,0), _q.identity(), _v3b.set(0.001,1,0.001));
      aa.setX(i,0);
    }
    wakeMesh.setMatrixAt(i,m);
  }
  wakeMesh.instanceMatrix.needsUpdate = true;
  aa.needsUpdate = true;
}
function updateBirds(dt){
  const m = new THREE.Matrix4();
  for (let i=0;i<BIRD_N;i++){
    const b = birds[i];
    b.a += dt*b.sp;
    const x = ISLAND.x + Math.cos(b.a)*b.rad;
    const z = ISLAND.z + Math.sin(b.a)*b.rad*0.8;
    const inner = innerR(x);
    const maxR = Math.sqrt(Math.max(1, inner*inner - b.y*b.y))*0.92;
    const zz2 = THREE.MathUtils.clamp(z, -maxR, maxR);
    const y = b.y + Math.sin(animT*0.8 + b.ph*6)*b.bob;
    const hdg = -Math.atan2(Math.cos(b.a)*0.8*b.sp, -Math.sin(b.a)*b.sp);
    const flap = Math.sin(animT*b.flap + b.ph*6.28);
    /* body */
    _q.setFromAxisAngle(UP_Y, hdg);

function updateClouds(){

    let bright = THREE.MathUtils.clamp(0.34 + SKY.sun*0.62 + SKY.star*0.16, 0.16, 1.3);

function updateStorm(dt){

/* ---------- ship: orbit + 4-point buoyancy ---------- */
let wakeTimer = 0, sprayTimer = 0;
function updateShip(dt){
  const o = SHIP_ORBIT, S = SHIP;
  S.ang += dt * o.w * (1 + DAY.storm*0.35);
  const amp = seaMat.uniforms.uAmp.value;
  const px = o.cx + Math.cos(S.ang)*o.r;
  const pz = o.cz + Math.sin(S.ang)*o.r;
  const yaw = Math.atan2(Math.cos(S.ang), -Math.sin(S.ang));
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const pts = [[S.foreD,0],[ -S.aftD,0],[0,S.beamD],[0,-S.beamD]];
  const H = [];
  for (const [lx,lz] of pts) H.push(waveJS(px + lx*c - lz*s, pz + lx*s + lz*c, animT)*amp);
  const hb=H[0], ht=H[1], hp=H[2], hq=H[3];
  const heave = (hb+ht+hp+hq)/4;
  const tPitch = Math.atan2(hb-ht, S.foreD+S.aftD);
  const tRoll  = Math.atan2(hp-hq, S.beamD*2);
  const k = 9.0, d = 3.4;
  S.vHeave += ((heave - S.heave)*k - S.vHeave*d)*dt;
  S.heave += S.vHeave*dt;
  S.tPitch += (tPitch - S.tPitch)*Math.min(1, dt*5.0);
  S.tRoll  += (tRoll  - S.tRoll )*Math.min(1, dt*6.0);
  shipGroup.position.set(px, WATER_Y + S.heave - 0.15, pz);
  _qA.setFromAxisAngle(UP_Y, -yaw);
  _qR.setFromAxisAngle(AX_X, -S.tRoll);
  _qP.setFromAxisAngle(AX_Z, S.tPitch);
  shipGroup.quaternion.copy(_qA).multiply(_qR).multiply(_qP);
  wakeTimer -= dt;
  if (wakeTimer <= 0){
    wakeTimer = 0.09;
    const sternX = px - S.aftD*c, sternZ = pz - S.aftD*s;
    spawnWake(sternX, sternZ, 2.4, 2.4 + DAY.storm*1.8);
    for (const sd of [-1,1]) spawnWake(sternX + sd*1.3*(-s), sternZ + sd*1.3*c, 1.7, 2.2);
  }
  sprayTimer -= dt;
  const energy = Math.abs(S.vHeave)*0.55 + Math.abs(hb)*0.45 + DAY.storm*2.4;
  if (sprayTimer <= 0 && energy > 0.3){
    sprayTimer = 0.05/(0.4+energy*0.35);
    const bowX = px + S.foreD*c, bowZ = pz + S.foreD*s;
    const n = Math.round(2 + energy*1.4);
    for (let i2=0;i2<n;i2++){
      spawnSpray(bowX + rr(-0.4,0.4), WATER_Y + hb + rr(0,0.5), bowZ + rr(-0.4,0.4),
        c*rr(1.5,5.5) + rr(-1.5,1.5), rr(3,9)*(0.5+energy*0.25), s*rr(1.5,5.5) + rr(-1.5,1.5),
        rr(0.5,1.1), rr(0.4,1.0), -22);
    }
  }
}

    tiltMaxDeg: [+ (tiltMax[0]*57.3).toFixed(2), +(tiltMax[1]*57.3).toFixed(2)],
    seaAmp: [+seaAmpMin.toFixed(2), +seaAmpMax.toFixed(2)],
    liveMax: { ship:+liveMax.ship.toFixed(2), whale:+liveMax.whale.toFixed(2), bird:+liveMax.bird.toFixed(2) },
    faceDotMin: { whale:+orientMin.whale.toFixed(2), ship:+orientMin.ship.toFixed(2), bird:+orientMin.bird.toFixed(2), fish:+orientMin.fish.toFixed(2) },
    rainAlive: rainState.filter(r => r.y > WATER_Y + 1 && r.y < 24).length
  };
  writeDiag();
  d.textContent = JSON.stringify(DIAG, null, 0);
}

/* ---------- synchronous GPU benchmark: ?bench=<frames> ---------- */
if (Q.get('bench')){
  const N = Math.max(4, parseInt(Q.get('bench')) || 40);
  const d = document.getElementById('__diag');
  d.style.display = 'block';
  for (let i=0;i<10;i++) renderFrame();
  const gl = renderer.getContext();
  gl.finish();
  const t0 = performance.now();
  for (let i=0;i<N;i++) renderFrame();
  gl.finish();
  const msAll = (performance.now()-t0)/N;
  const t1 = performance.now();
  for (let i=0;i<N;i++) composer.render();
  gl.finish();
  const msNoRt = (performance.now()-t1)/N;
  refrOn = false;
  const t2 = performance.now();
  for (let i=0;i<N;i++) composer.render();
  gl.finish();
  const msNoRefr = (performance.now()-t2)/N;
  d.textContent = JSON.stringify({
    ms_frame: +msAll.toFixed(2), fps_est: +(1000/msAll).toFixed(1),
    ms_no_rt: +msNoRt.toFixed(2), ms_no_rt_no_bloom: +msNoRefr.toFixed(2),
    calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
    dpr: DPR, scale: renderScale, canvas: [renderer.domElement.width, renderer.domElement.height]
  });
}
