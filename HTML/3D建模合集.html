<html lang="zh-CN">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e13;color:#cfe6ef;
    font-family:'Rajdhani','Microsoft YaHei','PingFang SC',sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .corner{position:absolute;padding:16px 20px;letter-spacing:.04em}
  .tl{top:0;left:0}
  .tr{top:0;right:0;text-align:right}
  .bl{bottom:0;left:0}
  .br{bottom:0;right:0;text-align:right;font-family:'Orbitron',monospace;font-size:13px;line-height:1.75;color:#8fb6c4}
  .br span{color:#4fe3ff;text-shadow:0 0 8px rgba(79,227,255,.55)}
  .brand{font-family:'Orbitron';font-size:26px;font-weight:900;color:#e8f6fa;text-shadow:0 0 14px rgba(79,227,255,.35)}
  .brand span{font-size:13px;font-weight:500;color:#6f93a2;letter-spacing:.28em;display:block;margin-top:2px}
  .tl .sub{margin:8px 0 10px;font-size:14px;color:#7fa7b6}
  .specs div{color:#7d9fae;margin:3px 0;font-size:13px}
  .specs b{color:#bfe9f4;font-weight:600;margin-right:10px;display:inline-block;min-width:40px}
  .hint{font-size:13px;color:#5d7c8b;margin:4px 0}
  .hint b{color:#8fd8ea;font-weight:600}

  /* 载具切换工具栏 */
  .fleetbox{pointer-events:auto;margin-bottom:14px;display:inline-block;text-align:left;
    background:rgba(8,16,22,.55);border:1px solid rgba(79,227,255,.25);border-radius:4px;
    padding:10px 12px;backdrop-filter:blur(4px)}
  .fleetTitle{font-size:11px;letter-spacing:.3em;color:#557885;margin:0 0 8px 2px;font-weight:600}
  .vbtn{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px;width:158px;

  .vbtn.active svg{opacity:1;filter:drop-shadow(0 0 4px rgba(79,227,255,.8))}

  .btn{pointer-events:auto;cursor:pointer;display:block;width:170px;margin:8px 0 0 auto;
    padding:9px 14px;font-family:'Rajdhani','Microsoft YaHei';font-size:15px;font-weight:600;letter-spacing:.12em;
    color:#bfe9f4;background:rgba(10,20,28,.55);border:1px solid rgba(79,227,255,.35);border-radius:3px;
    backdrop-filter:blur(4px);transition:all .18s;text-align:left}
  .btn small{float:right;color:#43616d;font-size:11px;margin-top:3px;letter-spacing:.05em}
  .btn:hover{background:rgba(20,46,60,.75);border-color:rgba(79,227,255,.9);box-shadow:0 0 18px rgba(79,227,255,.25);color:#fff}
  .btn.fire{border-color:rgba(255,140,60,.55);color:#ffd9b8}
  .btn.fire:hover{background:rgba(66,28,10,.7);border-color:#ff8c3c;box-shadow:0 0 20px rgba(255,140,60,.35)}
  .btn:active{transform:translateY(1px)}

  /* 准星 */
  #reticle{position:fixed;left:-100px;top:-100px;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:9;
    border:1px solid rgba(79,227,255,.75);border-radius:50%;pointer-events:none;
    box-shadow:0 0 12px rgba(79,227,255,.3),inset 0 0 8px rgba(79,227,255,.15);transition:opacity .2s}
  #reticle i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#4fe3ff;box-shadow:0 0 6px #4fe3ff}
  #reticle::before,#reticle::after{content:'';position:absolute;background:rgba(79,227,255,.7)}
  #reticle::before{left:50%;top:-7px;width:1px;height:8px;margin-left:-.5px;box-shadow:0 39px 0 rgba(79,227,255,.7)}
  #reticle::after{top:50%;left:-7px;height:1px;width:8px;margin-top:-.5px;box-shadow:39px 0 0 rgba(79,227,255,.7)}
  #reticle.drag{opacity:.15}

  /* 暗角 */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(2,4,8,.55) 100%)}

  /* 加载 / 错误 */
  #load{position:fixed;inset:0;z-index:50;background:#0b0e13;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .8s}
  #load.off{opacity:0;pointer-events:none}
  #load .ttl{font-family:'Orbitron';font-size:30px;font-weight:900;letter-spacing:.2em;color:#dff4fa;text-shadow:0 0 24px rgba(79,227,255,.4)}
  #load .bar{width:280px;height:3px;background:#17222b;border-radius:2px;overflow:hidden}
  #load .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#1898c4,#4fe3ff);border-radius:2px;animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
  #load .sub{font-size:13px;color:#5d7c8b;letter-spacing:.3em}
  #err{position:fixed;inset:auto 0 30% 0;z-index:60;margin:auto;width:min(520px,88vw);padding:22px 26px;
    background:rgba(40,10,10,.92);border:1px solid #a33;border-radius:6px;color:#ffd9d9;font-size:14px;line-height:1.7}
  #err h3{margin-bottom:8px;font-family:'Orbitron';letter-spacing:.15em}
</style>

    <div><span id="elLabel">炮管俯仰</span> <span id="el">+00.0°</span></div>
    <div>剩余<span id="ammoWord">弹药</span> <span id="ammo">40</span> / <span id="ammoMax">40</span></div>

</div>

<div id="vig"></div>

<script>
  function showErr(m){ const e=document.getElementById('err'); document.getElementById('errMsg').textContent=String(m||'未知错误');
    e.hidden=false; document.getElementById('load').classList.add('off'); }
  window.addEventListener('error', ev=>{ if(!window.__ok){
    const stack = ev.error && ev.error.stack ? '\n'+ev.error.stack.split('\n').slice(0,8).join('\n') : '';
    showErr(ev.message+stack); } });
  window.addEventListener('unhandledrejection', ev=>{ if(!window.__ok) showErr(ev.reason); });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ==================================================================
   0. 渲染器 / 场景 / 相机
================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
scene.fog = new THREE.FogExp2(0x0b0e13, 0.014);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 400);
camera.position.set(19, 9.5, 19);
const camShake = new THREE.Group();
camShake.add(camera);
scene.add(camShake);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.target.set(0.35, 1.75, 0);
controls.minDistance = 4.5; controls.maxDistance = 45;
controls.maxPolarAngle = 1.53;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;

const clock = new THREE.Clock();

/* ==================================================================
   1. 环境光照
================================================================== */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0x2a3340, 0x0d0e11, 0.72));

const keyLight = new THREE.DirectionalLight(0xfff2dd, 2.4);
keyLight.position.set(9, 13, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -11;
keyLight.shadow.camera.right = keyLight.shadow.camera.top = 11;
keyLight.shadow.camera.near = 2; keyLight.shadow.camera.far = 42;
keyLight.shadow.bias = -0.0004; keyLight.shadow.normalBias = 0.03;
scene.add(keyLight);

const rimCyan = new THREE.DirectionalLight(0x2e8cff, 1.35);
rimCyan.position.set(-11, 6, -9);
scene.add(rimCyan);

const rimAmber = new THREE.DirectionalLight(0xff9a3c, 0.95);
rimAmber.position.set(7, 3.5, -11);
scene.add(rimAmber);

const fillLow = new THREE.SpotLight(0x66e0ff, 45, 40, 0.6, 0.6, 1.4);
fillLow.position.set(2, 0.4, 14);
fillLow.target.position.set(0, 1.5, 0);
scene.add(fillLow, fillLow.target);

/* ==================================================================
   2. 程序化贴图
================================================================== */
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function canvasTex(size, draw, {srgb=true, rx=1, ry=1}={}){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=8;
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function camoDraw(base, tones, seed){
  return (ctx,s)=>{
    const rnd=mulberry32(seed);
    ctx.fillStyle=base; ctx.fillRect(0,0,s,s);
    for(const tone of tones){ ctx.fillStyle=tone;
      for(let i=0;i<16;i++){
        ctx.beginPath();
        const cx=rnd()*s, cy=rnd()*s, n=5+(rnd()*3|0), R=s*(0.05+rnd()*0.13);
        for(let k=0;k<=n;k++){ const a=k/n*Math.PI*2+rnd()*.7, r=R*(0.5+rnd()*0.9);
          const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r*0.7;
          k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.fill();
      }
    }
    for(let i=0;i<90;i++){ ctx.fillStyle=`rgba(0,0,0,${0.02+rnd()*0.05})`;
      const x=rnd()*s; ctx.fillRect(x, rnd()*s*0.4, 1+rnd()*3, s*(0.1+rnd()*0.5)); }
    for(let i=0;i<5000;i++){ const v=rnd()>.5?255:0;
      ctx.fillStyle=`rgba(${v},${v},${v},${0.02+rnd()*0.045})`;
      ctx.fillRect(rnd()*s, rnd()*s, 1.5, 1.5); }
  };
}
const camoTexA = canvasTex(1024, camoDraw('#4d5750', ['#39423a','#5d6a60','#434d45','#333b34'], 7));
const camoTexB = canvasTex(1024, camoDraw('#343b3e', ['#262c2f','#414a4f','#2c3338','#4a545a'], 23));
const noiseTex = canvasTex(512, (ctx,s)=>{
  const rnd=mulberry32(99);
  ctx.fillStyle='#8a8a8a'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<9000;i++){ const v=(rnd()*145|0)+70;
    ctx.fillStyle=`rgba(${v},${v},${v},0.6)`; ctx.fillRect(rnd()*s, rnd()*s, 2, 2); }
},{srgb:false, rx:3, ry:3});

const groundTex = canvasTex(2048, (ctx,s)=>{
  const rnd=mulberry32(512), cx=s/2, cy=s/2;
  ctx.fillStyle='#171a1f'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<26000;i++){ const v=(rnd()*26|0)+16;
    ctx.fillStyle=`rgb(${v},${v+2},${v+6})`; ctx.fillRect(rnd()*s,rnd()*s,2.4,2.4); }
  ctx.strokeStyle='rgba(72,84,96,0.16)'; ctx.lineWidth=2;
  for(let g=0; g<=s; g+=128){ ctx.beginPath();ctx.moveTo(g,0);ctx.lineTo(g,s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,g);ctx.lineTo(s,g);ctx.stroke(); }
  ctx.strokeStyle='rgba(88,104,120,0.5)'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.235,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(200,160,60,0.4)'; ctx.lineWidth=16;
  for(let a=0;a<8;a++){ if(a%2) continue;
    ctx.beginPath(); ctx.arc(cx,cy,s*0.27, a*Math.PI/4+0.12, (a+1)*Math.PI/4-0.12); ctx.stroke(); }
  ctx.fillStyle='rgba(200,170,80,0.32)';
  for(let i=0;i<4;i++){ const x=cx+s*0.33+i*s*0.06;
    ctx.beginPath(); ctx.moveTo(x,cy-s*0.02); ctx.lineTo(x+s*0.035,cy); ctx.lineTo(x,cy+s*0.02); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='rgba(120,140,156,0.5)';
  ctx.font='700 64px monospace'; ctx.textAlign='center';
  ctx.fillText('SECTOR 88', cx+s*0.30, cy+s*0.20);
  ctx.fillText('Ω 088-E', cx-s*0.30, cy-s*0.22);
  ctx.save(); ctx.translate(cx, cy+s*0.315); ctx.font='700 52px monospace';
  ctx.fillText('KEEP CLEAR — EM WEAPON TEST RANGE', 0, 0); ctx.restore();
  ctx.strokeStyle='rgba(120,140,156,0.45)'; ctx.lineWidth=6;
  [[.08,.08],[.92,.08],[.08,.92],[.92,.92]].forEach(([px,py])=>{
    const x=s*px,y=s*py;
    ctx.beginPath();ctx.moveTo(x-40,y);ctx.lineTo(x+40,y);ctx.moveTo(x,y-40);ctx.lineTo(x,y+40);ctx.stroke();
  });
});

const hazardTex = canvasTex(256, (ctx,s)=>{
  ctx.fillStyle='#141519'; ctx.fillRect(0,0,s,s);
  ctx.fillStyle='#d8b13a';
  ctx.save(); ctx.translate(s/2,s/2); ctx.rotate(-Math.PI/4); ctx.translate(-s,-s);
  for(let x=-s; x<s*3; x+=64) ctx.fillRect(x,-s,32,s*3);
  ctx.restore();
},{rx:2,ry:1});

function makeDecal(text){ return canvasTex(256, (ctx,s)=>{
  ctx.clearRect(0,0,s,s);
  ctx.strokeStyle='rgba(225,238,242,0.9)'; ctx.lineWidth=10;
  ctx.strokeRect(14,14,s-28,s-28);
  ctx.fillStyle='rgba(228,240,244,0.95)';
  ctx.font='900 150px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, s/2, s/2+8);
}); }
const decal88 = makeDecal('88'), decal09 = makeDecal('09'), decal77 = makeDecal('77');

const glowTex = (()=>{ const c=document.createElement('canvas'); c.width=c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(0.6,'rgba(255,255,255,0.12)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c); })();

/* ==================================================================
   3. PBR 材质库
================================================================== */
function std(o, env=0.5){ const m=new THREE.MeshStandardMaterial(o); m.envMapIntensity=env; return m; }
const M = {
  armor:      std({ map:camoTexA, metalness:0.45, roughness:0.62, roughnessMap:noiseTex }, 0.55),

   4. 硬表面几何工具
================================================================== */
function chamferBox(w, h, d, r=0.05){
  r = Math.min(r, w/2-0.005, h/2-0.005, d/2-0.005);
  const s = new THREE.Shape(), x=w/2-r, z=d/2-r;
  s.absarc( x,  z, r, 0, Math.PI/2);
  s.absarc(-x,  z, r, Math.PI/2, Math.PI);
  s.absarc(-x, -z, r, Math.PI, Math.PI*1.5);
  s.absarc( x, -z, r, Math.PI*1.5, Math.PI*2);
  const g = new THREE.ExtrudeGeometry(s, { depth:h-2*r, bevelEnabled:true,
    bevelThickness:r, bevelSize:r*0.95, bevelSegments:2, curveSegments:3 });
  g.rotateX(-Math.PI/2); g.translate(0, r-h/2, 0);
  return g;
}
function extrudeProfile(pts, width, bevel=0.03){   // 侧视轮廓 -> 沿 Z 挤出
  const s = new THREE.Shape();
  pts.forEach((p,i)=> i? s.lineTo(p[0],p[1]) : s.moveTo(p[0],p[1]));
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:width-2*bevel, bevelEnabled:true,
    bevelThickness:bevel, bevelSize:bevel, bevelSegments:1 });
  g.translate(0,0,-(width-2*bevel)/2);
  return g;
}
function extrudeFootprint(pts, h, bevel=0.05){     // 俯视轮廓 -> 向上挤出
  const s = new THREE.Shape();
  pts.forEach((p,i)=> i? s.lineTo(p[0],p[1]) : s.moveTo(p[0],p[1]));
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:h-2*bevel, bevelEnabled:true,
    bevelThickness:bevel, bevelSize:bevel, bevelSegments:2, curveSegments:2 });
  g.rotateX(-Math.PI/2); g.translate(0, bevel, 0);
  return g;
}
function add(parent, geo, mat, pos=[0,0,0], rot=[0,0,0], sc=null){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  if(sc) m.scale.set(...sc);
  parent.add(m); return m;
}
function cable(parent, pts, r=0.045, mat=M.cable){
  const c = new THREE.CatmullRomCurve3(pts.map(p=>V3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(c, 48, r, 8), mat);
  parent.add(m); return m;
}
function decalPlane(parent, tex, w, h, pos, rotY=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({ map:tex, transparent:true, roughness:0.55, metalness:0.35 }));
  m.position.set(...pos); m.rotation.y = rotY; parent.add(m); return m;
}

/* 螺栓（每载具一层实例化） */
function boltsAlong(data, p0, p1, n, nrm){
  const a=V3(...p0), b=V3(...p1), nn=V3(...nrm).normalize();
  for(let i=0;i<n;i++){ const t = n===1? 0.5 : i/(n-1);
    data.push({ p:new THREE.Vector3().lerpVectors(a,b,t), n:nn }); }
}
function buildBoltLayer(parent, data){
  if(!data.length) return;
  const g = new THREE.CylinderGeometry(0.03,0.03,0.036,6);
  const im = new THREE.InstancedMesh(g, M.gunDark, data.length);
  const d = new THREE.Object3D(), up=V3(0,1,0);
  data.forEach((b,i)=>{ d.position.copy(b.p).addScaledVector(b.n,0.012);
    d.quaternion.setFromUnitVectors(up,b.n); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
  im.frustumCulled=false; parent.add(im);
}

/* 反应装甲砖（每载具一层实例化） */
const rndEra = mulberry32(2024);
function eraGrid(data, origin, u, nrm, nu, nv, du=0.34, dv=0.24){
  const n = nrm.clone().normalize(), uu = u.clone().normalize();
  const vv = uu.clone().cross(n).normalize();
  const q = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(uu, n, vv));
  for(let i=0;i<nu;i++) for(let j=0;j<nv;j++){
    const p = origin.clone()
      .addScaledVector(uu,(i-(nu-1)/2)*du + (rndEra()-0.5)*0.02)
      .addScaledVector(vv,(j-(nv-1)/2)*dv + (rndEra()-0.5)*0.02)
      .addScaledVector(n, 0.055);
    data.push({ p, q, k:(rndEra()-0.5)*0.1 });
  }
}
function buildEraLayer(parent, data){
  if(!data.length) return;
  const g = chamferBox(0.30, 0.085, 0.19, 0.018);
  const im = new THREE.InstancedMesh(g, M.armorDark, data.length);
  const d = new THREE.Object3D();
  data.forEach((e,i)=>{ d.position.copy(e.p); d.quaternion.copy(e.q);
    d.rotateZ(e.k); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
  im.frustumCulled=false; parent.add(im);
}

function makeRoadWheel(r){
  const g = new THREE.Group(), s = r/0.46;
  add(g, cylZ(r,0.34*s+0.02,28), M.tire);
  add(g, cylZ(r*0.945,0.30*s,28), M.armorDark);
  add(g, cylZ(r*0.65,0.375*s,24), M.gunDark);
  add(g, cylZ(r*0.37,0.42*s,18), M.gun);
  add(g, cylZ(r*0.14,0.46*s,6), M.gunDark);
  for(let i=0;i<5;i++){ const a=i/5*Math.PI*2;
    add(g, new THREE.BoxGeometry(0.34*s,0.075*s,0.40*s), M.armorDark, [Math.cos(a)*r*0.46,Math.sin(a)*r*0.46,0], [0,0,a]); }
  return g;
}
function makeSprocket(r){
  const g = new THREE.Group(), s = r/0.40;
  add(g, cylZ(r,0.26,26), M.gun);
  add(g, cylZ(r*0.74,0.30,22), M.gunDark);
  add(g, cylZ(r*0.36,0.40,6), M.gun);
  for(let i=0;i<11;i++){ const a=i/11*Math.PI*2;
    add(g, new THREE.BoxGeometry(0.13,0.11,0.30*Math.min(s,1.1)), M.gunDark, [Math.cos(a)*(r+0.045),Math.sin(a)*(r+0.045),0], [0,0,a]); }
  return g;
}
function makeIdler(r){
  const g = new THREE.Group(), s=r/0.38;
  add(g, cylZ(r,0.28,26), M.gun);
  add(g, cylZ(r*0.7,0.33,20), M.gunDark);
  add(g, cylZ(r*0.26,0.40,6), M.gun);
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2;
    add(g, new THREE.BoxGeometry(0.20*s,0.06*s,0.32*s), M.gunDark, [Math.cos(a)*r*0.52,Math.sin(a)*r*0.52,0], [0,0,a]); }
  return g;
}
function makeLinkGeo(width){
  const g1=new THREE.BoxGeometry(0.30,0.05,width);
  const g2=new THREE.BoxGeometry(0.05,0.055,width+0.02); g2.translate(-0.085,0.05,0);
  const g3=new THREE.BoxGeometry(0.05,0.055,width+0.02); g3.translate( 0.085,0.05,0);
  const g4=new THREE.BoxGeometry(0.07,0.13,0.10); g4.translate(0,0.09,0);
  return mergeGeometries([g1,g2,g3,g4]);
}
/* 通用履带系统 */
function makeTrackSystem(parent, cfg){
  const wheels = [];
  [1,-1].forEach(sz=>{
    const side = new THREE.Group(); parent.add(side);
    cfg.wheelXs.forEach(wx=>{
      const w = makeRoadWheel(cfg.wheelR); w.position.set(wx,cfg.wheelY,sz*cfg.z); side.add(w);
      wheels.push({ mesh:w, r:cfg.wheelR });
      add(side, new THREE.BoxGeometry(0.13,0.13,0.46), M.gunDark, [wx,cfg.wheelY+0.27,sz*cfg.z*0.85]);
      add(side, cylZ(0.10,0.10,6), M.chrome, [wx,cfg.wheelY,sz*(cfg.z+cfg.wheelR*0.4)]);
    });
    const spr = makeSprocket(cfg.spr.r); spr.position.set(cfg.spr.x,cfg.spr.y,sz*cfg.z); side.add(spr);
    wheels.push({mesh:spr, r:cfg.spr.r});
    const idl = makeIdler(cfg.idl.r); idl.position.set(cfg.idl.x,cfg.idl.y,sz*cfg.z); side.add(idl);
    wheels.push({mesh:idl, r:cfg.idl.r});
    if(cfg.rollers) cfg.rollers.forEach(rx=>{
      const ro = add(side, cylZ(0.13,0.3,14), M.gunDark, [rx,cfg.topY-0.15,sz*cfg.z]);
      wheels.push({mesh:ro, r:0.13});
    });
  });
  const S = cfg.spr, I = cfg.idl;
  const A = { x:I.x+0.12, y:cfg.bottomY }, B = { x:S.x-0.8, y:cfg.bottomY };
  const p = new THREE.Path();
  p.moveTo(A.x,A.y); p.lineTo(B.x,B.y);
  const a0=-1.5, p1={x:S.x+(S.r+cfg.wrap)*Math.cos(a0), y:S.y+(S.r+cfg.wrap)*Math.sin(a0)};
  p.lineTo(p1.x,p1.y);
  p.absarc(S.x,S.y,S.r+cfg.wrap, a0, Math.PI/2, false);
  p.lineTo(I.x, I.y+I.r+cfg.wrap);
  p.absarc(I.x,I.y,I.r+cfg.wrap, Math.PI/2, 4.5, false);
  p.lineTo(A.x,A.y);
  const pts = p.getSpacedPoints(260); pts.pop();
  const tans = pts.map((pt,i)=>{ const nx=pts[(i+1)%pts.length];
    return Math.atan2(nx.y-pt.y, nx.x-pt.x); });
  const L = p.getLength();
  const linkGeo = makeLinkGeo(cfg.linkWidth);
  const sides = [1,-1].map(sz=>{
    const n = Math.round(L/cfg.linkStep);
    const im = new THREE.InstancedMesh(linkGeo, M.track, n);
    im.frustumCulled=false; parent.add(im);
    const jit = Array.from({length:n},()=>[(Math.random()-0.5)*0.05,(Math.random()-0.5)*0.05,(Math.random()-0.5)*0.04]);
    return { im, n, phase: sz>0?0:0.5, jit, z: sz*cfg.z };
  });
  const d = new THREE.Object3D();
  return {
    wheels,
    update(dt, speed){
      sides.forEach(side=>{
        side.phase = ((side.phase - speed*dt/L) % 1 + 1) % 1;
        const N = pts.length;
        for(let k=0;k<side.n;k++){
          const u = ((k/side.n + side.phase) % 1 + 1) % 1;
          const f = u*N, i0 = Math.floor(f)%N, i1 = (i0+1)%N, ft = f-Math.floor(f);
          d.position.set(pts[i0].x+(pts[i1].x-pts[i0].x)*ft, pts[i0].y+(pts[i1].y-pts[i0].y)*ft, side.z);
          d.rotation.set(side.jit[k][0], side.jit[k][1], tans[i0]+side.jit[k][2]);
          d.updateMatrix(); side.im.setMatrixAt(k, d.matrix);
        }
        side.im.instanceMatrix.needsUpdate = true;
      });
      wheels.forEach(w=> w.mesh.rotation.z -= speed*dt/w.r);
    }
  };
}

        recoil = Math.max(0, recoil - dt*6);

      if(burst > 0){

    },
    fire(){ burst = 3; burstTimer = 0; },
    status(){ return { az: -turret.rotation.y, el: gunPivot.rotation.z }; }
  };
}

    if(!launched) launched = pylons[0];
    launched.visible = false;
    const p = new THREE.Vector3(), q = new THREE.Quaternion();
    launched.getWorldPosition(p); launched.getWorldQuaternion(q);

      M.orangeGlow.emissiveIntensity = 2.0 + Math.sin(t*9)*0.6;
      flaperons.forEach((fl,i)=> fl.rotation.x = Math.sin(t*0.9+i*1.7)*0.07 );
      let target = null, best = 1e9;
      targets.forEach(tg=>{ if(!tg.alive) return;
        const d = tg.g.position.length(); if(d<best){ best=d; target=tg; } });
      if(target){
        lockInfo.az = Math.atan2(-target.g.position.z, target.g.position.x);
        lockInfo.el = Math.atan2(target.g.position.y - 2.0, Math.hypot(target.g.position.x, target.g.position.z));
      }
    },
    fire(){ fireMissile(); },
    status(){ return { az: lockInfo.az, el: lockInfo.el }; }

  /* 旋翼塔 + 发动机 + 旋翼 */

  [[2.9,1],[-2.9,-1]].forEach(([px,dirn])=>{

    add(root, new THREE.BoxGeometry(0.5,0.3,0.05), M.armorDark, [gx,0.9,sz*1.34]);
  });

  /* 天线 / 灯光 */
  const antennas = [];
  [[-4.0,4.16,0.5],[-5.6,4.0,-0.4]].forEach(([ax,ay,az2])=>{
    const ant = new THREE.Group(); ant.position.set(ax,ay,az2); hullG.add(ant);
    add(ant, cylY(0.012,1.0,6), M.gun, [0,0.5,0]);
    ant.rotation.x = az2>0? 0.12 : -0.1; antennas.push(ant);
  });
  add(hullG, new THREE.BoxGeometry(0.08,0.07,0.08), M.redGlow, [5.0,3.0,-1.35]);
  add(hullG, new THREE.BoxGeometry(0.08,0.07,0.08), M.greenGlow, [5.0,3.0,1.35]);
  add(hullG, new THREE.BoxGeometry(0.06,0.05,0.06), M.redGlow, [-6.05,3.95,0]);
  [1,-1].forEach(sz=> add(hullG, new THREE.BoxGeometry(1.2,0.03,0.03), M.cyanGlow, [sz>0?2.9:-2.9,5.62,0]));
  boltsAlong(boltData, [3.6,4.16,1.2],[1.2,4.16,1.2],4,[0,1,0]);
  boltsAlong(boltData, [3.6,4.16,-1.2],[1.2,4.16,-1.2],4,[0,1,0]);
  buildBoltLayer(root, boltData);

  root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });

  let burst = 0, burstTimer = 0;
  function shoot(){
    const p = new THREE.Vector3(), q = new THREE.Quaternion();
    chinMuzzle.getWorldPosition(p); chinMuzzle.getWorldQuaternion(q);
    const dir = V3(1,0,0).applyQuaternion(q);
    chinLight.intensity = 16; S.shake = Math.max(S.shake, 0.1);
    spawnSprite(p, dir.clone().multiplyScalar(2)
      .add(V3(0,(Math.random()-.5)*1,(Math.random()-.5)*1)),
      0.07, 0.8+Math.random()*0.4, 0.22, [2.8,2.2,1.5], true);
    fireTracer(p.clone().addScaledVector(dir,0.4), dir, 115, 0.8, 1.2);
    if(S.ammo>0){ S.ammo--; ui.ammo.textContent = S.ammo; }
  }

  return {
    key:'heli', name:'VN-12', en:'「女武神」 VALKYRIE', sub:'纵列双旋翼重型武装运输直升机',
    specs:[['旋翼','纵列复合刚性旋翼 无尾桨布局'],['武器','25mm 机首转管炮 + 火箭巢'],
           ['载员','3 + 24 名 全装甲运兵舱'],['速度','巡航 310 km/h · 吊挂能力 16t']],
    camTarget: V3(0,3.9,0), blob:[1.4,1.3], ammoMax:300, ammoWord:'炮弹', aimWord:'炮塔',
    coolMax:0.7, camDist:15, maxDist:55, shadow:12,
    root, cool:0,
    setLights(on){ M.whiteLight.emissiveIntensity = on?4:0; },
    update(dt, t, ctx){
      rotors.forEach(r=> r.g.rotation.y += dt*r.s);
      hullG.position.y = 0.01*Math.sin(t*23);
      hullG.rotation.z = 0.004*Math.sin(t*19);
      const dx = ctx.aim.x - 6.0, dz = ctx.aim.z, dh = Math.hypot(dx,dz);
      const yawT = THREE.MathUtils.clamp(Math.atan2(-dz, dx), -0.85, 0.85);
      chinYaw.rotation.y += wrapPI(yawT - chinYaw.rotation.y) * Math.min(1, dt*4.5);
      const pitchT = THREE.MathUtils.clamp(Math.atan2(ctx.aim.y - 2.1, Math.max(dh,1)), -0.12, 0.55);
      chinYaw.rotation.z += (pitchT - chinYaw.rotation.z) * Math.min(1, dt*4.5);
      if(burst > 0){
        burstTimer -= dt;
        if(burstTimer <= 0){ burst--; burstTimer = 0.08; shoot(); }
      }
      chinLight.intensity *= Math.exp(-dt*16);
      antennas.forEach((a,i)=> a.rotation.z = Math.sin(t*2.2+i)*0.03 );
      M.orangeGlow.emissiveIntensity = 1.4 + Math.sin(t*13)*0.4;
      if(Math.random()<dt*9) spawnSprite(V3((Math.random()-.5)*9, 0.25, (Math.random()-.5)*4.5),
        V3((Math.random()-.5)*7, 0.8+Math.random()*1.2, (Math.random()-.5)*7),
        0.8, 0.4, 2.3, [0.3,0.31,0.34], false, 0.4);
    },
    fire(){ burst = 4; burstTimer = 0; },
    status(){ return { az: -chinYaw.rotation.y, el: chinYaw.rotation.z }; }
  };
}

  [1,-1].forEach(sz=>{
    const fin = add(body, extrudeProfile([[0,0],[0.85,0.3],[1.15,0.62],[0.55,0.68]],0.09,0.02), M.matBlack);
    fin.position.set(2.55,0.28,sz*1.28); fin.rotation.x = sz*0.55;
    add(body, chamferBox(1.15,0.08,0.95,0.03), M.matBlack, [-4.55,0.6,sz*0.72], [0,sz*-0.35,0.1]);
  });
  /* 四涵道风扇 */
  const fans = [];
  function fan(x,y,z,r){
    const g = new THREE.Group(); g.position.set(x,y,z); body.add(g);
    add(g, new THREE.TorusGeometry(r,0.17,12,26).rotateX(Math.PI/2), M.matBlack);
    add(g, cylZ(r*0.8,0.24,18), M.grille, [0,-0.05,0]);
    const spin = new THREE.Group(); spin.position.y = 0.07; g.add(spin);
    add(spin, cylZ(r*0.18,0.32,10), M.gun);
    for(let i=0;i<3;i++){ const hold=new THREE.Group(); hold.rotation.y=i*Math.PI*2/3; spin.add(hold);
      add(hold, new THREE.BoxGeometry(r*0.78,0.045,0.22), M.gun, [r*0.45,0,0]); }
    const glow = new THREE.Mesh(new THREE.CircleGeometry(r*0.78,22),
      new THREE.MeshBasicMaterial({ color:new THREE.Color(0.35,1.5,1.7), transparent:true, opacity:0.32,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }));
    glow.rotation.x = Math.PI/2; glow.position.y = -0.22; g.add(glow);
    add(g, cylY(0.2,0.36,10), M.gunDark, [0,r+0.12,0]);
    fans.push(spin);
  }
  fan( 2.6,1.25, 1.55, 0.75);  fan( 2.6,1.25,-1.55, 0.75);
  fan(-2.7,1.1,  1.35, 0.60);  fan(-2.7,1.1, -1.35, 0.60);
  /* 双联等离子炮 + 导弹舱 */
  const muzzles = [];
  [1,-1].forEach(sz=>{
    add(body, cylX(0.06,1.15,10), M.gun, [4.35,-0.05,sz*0.3]);
    add(body, new THREE.TorusGeometry(0.07,0.02,6,12).rotateY(Math.PI/2), M.cyanGlow, [4.9,-0.05,sz*0.3]);
    const mz = new THREE.Object3D(); mz.position.set(4.95,-0.05,sz*0.3); body.add(mz); muzzles.push(mz);
    add(body, chamferBox(1.1,0.5,0.55,0.05), M.gunDark, [0.3,0.5,sz*1.32]);
    for(let i=0;i<3;i++) add(body, cylX(0.055,0.1,8), M.grille, [0.88,0.5,sz*(1.2+i*0.12)]);
    add(body, new THREE.BoxGeometry(0.06,0.06,0.06), sz>0?M.greenGlow:M.redGlow, [-4.0,0.7,sz*1.1]);
  });

  root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  root.visible = false;

  let barrel = 0;
  return {
    key:'orca', name:'WK-3', en:'「虎鲸」 ORCA', sub:'四涵道矢量悬浮攻击艇 · 近海压制平台',
    specs:[['动力','四涵道矢量风扇 静音悬停'],['武器','双联等离子炮 + 制导鱼雷'],
           ['涂装','虎鲸仿生低可视涂装'],['速度','冲刺 210 km/h · 悬停高度 15m']],

    coolMax:0.26, camDist:11, maxDist:42, shadow:10,
    root, cool:0,
    setLights(on){ M.whiteLight.emissiveIntensity = on?4:0; },
    update(dt, t, ctx){
      fans.forEach(f=> f.rotation.y += dt*24);
      body.position.y = 2.3 + 0.1*Math.sin(t*1.8);
      body.rotation.z = 0.02*Math.sin(t*1.3);
      body.rotation.x = 0.015*Math.sin(t*1.1+1);
      const dx = ctx.aim.x, dz = ctx.aim.z;
      const yawT = Math.atan2(-dz, dx);
      body.rotation.y += wrapPI(yawT - body.rotation.y) * Math.min(1, dt*1.5);
      if(Math.random()<dt*10) spawnSprite(V3((Math.random()-.5)*6, 0.25, (Math.random()-.5)*4),
        V3((Math.random()-.5)*5, 0.7+Math.random(), (Math.random()-.5)*5),
        0.7, 0.35, 2.0, [0.3,0.31,0.34], false, 0.4);
    },
    fire(){
      const mz = muzzles[barrel++ % 2];
      const p = new THREE.Vector3(), q = new THREE.Quaternion();
      mz.getWorldPosition(p); mz.getWorldQuaternion(q);
      const dir = V3(1,0,0).applyQuaternion(q);
      S.shake = Math.max(S.shake, 0.15);
      spawnSprite(p, dir.clone().multiplyScalar(1.5), 0.1, 0.9, 0.3, [1.6,2.6,3.0], true);

        .add(V3(0,Math.random()*0.5,(Math.random()-.5)*0.8)),
        0.4, 0.25, 1.0, [0.3,0.5,0.55], false, 0.3);
      fireTracer(p.clone().addScaledVector(dir,0.4), dir, 135, 0.7, 1.1);
    },
    status(){ return { az: -body.rotation.y, el: 0 }; }
  };
}

  { const c = new THREE.Mesh(new THREE.CircleGeometry(3.2,36), M.deckWhite);

    c2.rotation.x = -Math.PI/2; c2.position.set(-18,LY+0.04,-4.8); deckG.add(c2); }
  { const num = new THREE.Mesh(new THREE.PlaneGeometry(4.6,4.6),
      new THREE.MeshStandardMaterial({ map:decal88, transparent:true, roughness:0.8 }));
    num.rotation.set(-Math.PI/2,0,Math.PI/2); num.position.set(19.5,LY+0.03,3.6); deckG.add(num); }
  [[-6,6.4],[-20,6.4]].forEach(([ex,ez])=> flat(ex,ez,8,9.5,0,M.grille));  // 升降机
  add(deckG, new THREE.BoxGeometry(56,0.5,0.07), M.grille, [0,LY+0.45,7.72]);
  add(deckG, new THREE.BoxGeometry(56,0.5,0.07), M.grille, [0,LY+0.45,-7.72]);

  /* 舰岛 */
  const island = new THREE.Group(); island.position.set(-6,LY,6.1); deckG.add(island);
  add(island, chamferBox(8,4.6,3.4,0.2), M.armorDark, [0,2.3,0]);
  add(island, chamferBox(5.6,1.9,3.0,0.15), M.armor, [0.4,5.4,0]);
  add(island, new THREE.BoxGeometry(0.06,0.7,2.7), M.glass, [3.22,5.5,0]);
  add(island, new THREE.BoxGeometry(0.06,0.7,2.7), M.glass, [-2.42,5.5,0]);
  [[1.9,1],[-1.1,-1]].forEach(([ax,az])=>{

  for(let i=0;i<4;i++) add(island, new THREE.BoxGeometry(0.06,1.6,0.3), M.grille, [-3.85,2.7,-0.7+i*0.47]);

  add(island, new THREE.BoxGeometry(2.4,0.08,0.08), M.gunDark, [1.6,9.2,-0.9]);
  const radar = new THREE.Group(); radar.position.set(1.6,10.8,0); island.add(radar);

/* ---------- 共享制导导弹系统（战机挂弹 / 航母垂发） ---------- */
const missiles = [];
function nearestTarget(){
  let best = null, bd = 1e9;
  targets.forEach(tg=>{ if(tg.alive){ const d = tg.g.position.length();
    if(d<bd){ bd=d; best=tg; } } });
  return best;
}
function launchGuided(o){
  const m = makeMissile();
  m.position.copy(o.pos);
  const dir = o.dir.clone().normalize();
  m.quaternion.setFromUnitVectors(V3(1,0,0), dir);
  scene.add(m);
  missiles.push({ m, vel:dir.clone().multiplyScalar(o.speed0), target:o.target, t:0,
    trailAcc:0, accel:o.accel??70, vmax:o.vmax??60, turnDelay:o.turnDelay??0 });
  if(o.smoke) for(let i=0;i<6;i++)
    spawnSprite(o.pos, V3((Math.random()-.5)*3,Math.random()*1.5,(Math.random()-.5)*3)
      .add(V3(-4-Math.random()*3,0,0)), 0.5+Math.random()*0.4, 0.6, 2.6, [0.4,0.41,0.44], false, 0.6);
  spawnSprite(o.pos, V3(0,0.5,0), 0.18, 1.4, 0.4, [2.6,2.2,1.6], true);
}
function updateMissiles(dt){
  for(let i=missiles.length-1;i>=0;i--){
    const ms = missiles[i]; ms.t += dt;
    const speed = Math.min(ms.vel.length() + ms.accel*dt, ms.vmax);
    const dir = ms.vel.clone().normalize();
    if(ms.t > ms.turnDelay && ms.target && ms.target.alive){
      const to = ms.target.g.position.clone().sub(ms.m.position).normalize();
      dir.lerp(to, Math.min(1, dt*3.2)).normalize();
    }
    ms.vel.copy(dir).multiplyScalar(speed);
    ms.m.position.addScaledVector(ms.vel, dt);
    ms.m.quaternion.setFromUnitVectors(V3(1,0,0), dir);
    ms.trailAcc += dt;
    if(ms.trailAcc > 0.035){ ms.trailAcc = 0;
      const tp = ms.m.position.clone().addScaledVector(dir,-0.8);
      spawnSprite(tp, dir.clone().multiplyScalar(-2).add(V3(0,0.4,0)), 0.7+Math.random()*0.5,
        0.28, 1.8, [0.42,0.43,0.46], false, 0.5);
      spawnSprite(tp, V3(0,0,0), 0.1, 0.5, 0.12, [2.4,1.6,0.8], true);
    }
    let hit = false;
    if(ms.target && ms.target.alive && ms.m.position.distanceTo(ms.target.g.position) < 3.2){
      explode(ms.target.g.position.clone());
      ms.target.alive = false; ms.target.respawn = tNow + 3; ms.target.g.visible = false;
      S.score++; ui.score.textContent = S.score; S.shake = Math.max(S.shake, 0.35);
      hit = true;
    }
    if(hit || ms.t > 7 || ms.m.position.y < 0.2){ scene.remove(ms.m); missiles.splice(i,1); }
  }
}

/* 相机预设（URL 参数 ?view=front|side|rear|top|close，需在初始相机设置之后） */
{
  const VIEWS = {
    front:[10.5,2.4,1.2], side:[0.2,2.8,12.5], rear:[-10.5,3.2,7.5],
    top:[5.5,12,5.5], close:[5.4,2.1,4.4]

  if(v && VIEWS[v]){ S.introT = 1;
    camera.position.set(...VIEWS[v]); controls.update(); controls.autoRotate = false; }
}
const easeOut = x=> 1-Math.pow(1-x,3);
function wrapPI(a){ return Math.atan2(Math.sin(a), Math.cos(a)); }

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  tNow += dt;

  if(S.introT < 1){
    S.introT = Math.min(1, S.introT + dt/3);
    camera.position.lerpVectors(camFrom, camTo, easeOut(S.introT));
  }
  controls.update();

  if(tNow - S.lastAim > 4.5){
    aimPoint.set(26*Math.cos(tNow*0.28), 1.2, 26*Math.sin(tNow*0.28)*0.6);
  } else {
    raycaster.setFromCamera(mouseNDC, camera);
    if(raycaster.ray.intersectPlane(groundPlane, aimTmp))
      aimPoint.lerp(aimTmp, Math.min(1, dt*14));
  }

  const veh = fleet[currentKey];
  if(veh.cool > 0) veh.cool -= dt;
  veh.update(dt, tNow, { aim: aimPoint, idle: tNow - S.lastAim > 4.5 });
  updateMissiles(dt);
  if(S.ammo<=0 && veh.cool<=0){ S.ammo = veh.ammoMax; ui.ammo.textContent = S.ammo; }

  for(let i=tracers.length-1;i>=0;i--){ const tr=tracers[i];
    tr.t += dt; tr.m.position.addScaledVector(tr.vel, dt);
    if(tr.t>tr.life){ scene.remove(tr.m); tr.m.material.dispose(); tracers.splice(i,1); continue; }
    for(const tg of targets){ if(!tg.alive) continue;
      if(tr.m.position.distanceTo(tg.g.position) < 2.0){
        explode(tg.g.position.clone()); tg.alive=false; tg.respawn=tNow+3; tg.g.visible=false;
        S.score++; ui.score.textContent=S.score;
        scene.remove(tr.m); tracers.splice(i,1); break; } }
  }
  targets.forEach(tg=>{
    if(!tg.alive){ if(tNow>tg.respawn){ tg.alive=true; tg.g.visible=true;
      const a=Math.PI*(0.15+Math.random()*0.7), rr=26+Math.random()*18;
      tg.g.position.set(Math.cos(a)*rr, 2.2+Math.random()*2.2, Math.sin(a)*rr*(Math.random()>0.5?1:-1)); } return; }
    tg.g.position.y += Math.sin(tNow*1.2+tg.bob)*dt*0.5;
    tg.g.rotation.y += dt*0.8; tg.ring.rotation.x += dt*1.4; tg.ring.rotation.y += dt*0.9;
  });
  boomLight.intensity *= Math.exp(-dt*7);

  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t += dt;
    const k = f.t/f.life;
    if(k>=1){ scene.remove(f.m); f.m.material.dispose(); fx.splice(i,1); continue; }
    if(f.ring){ const s=1+k*11; f.m.scale.set(s,s,s); f.m.material.opacity=0.95*(1-k);
      f.m.lookAt(camera.position); continue; }
    f.vel.multiplyScalar(1-dt*f.drag); f.vel.y += f.buoy*dt;
    f.m.position.addScaledVector(f.vel, dt);
    const s = f.s0+(f.s1-f.s0)*k; f.m.scale.set(s,s*(f.s1<f.s0?0.7:1.4),1);
    f.m.material.opacity = Math.pow(1-k,1.4);
  }

  if((currentKey==='tank'||currentKey==='ifv') && Math.random()<dt*6){ const sz = Math.random()>0.5?1:-1;
    const bx = currentKey==='tank' ? -3.4 : -2.9;
    spawnSprite(V3(bx,0.15,sz*(currentKey==='tank'?1.38:1.28)), V3(-1.2-Math.random(),0.5+Math.random()*0.5,(Math.random()-0.5)*0.6),
      1.4, 0.3, 1.8, [0.26,0.27,0.30], false, 0.35); }

  S.shake *= Math.exp(-dt*5.5);
  camShake.position.set((Math.random()-0.5)*S.shake*0.22,(Math.random()-0.5)*S.shake*0.18,(Math.random()-0.5)*S.shake*0.22);

  frames++; fpsAcc += dt;
  if(fpsAcc>0.5){ ui.fps.textContent = Math.round(frames/fpsAcc); frames=0; fpsAcc=0; }
  const st = veh.status();
  const azd = ((-st.az*180/Math.PI)%360+360)%360;
  ui.az.textContent = azd.toFixed(1).padStart(5,'0')+'°';
  const eld = st.el*180/Math.PI;
  ui.el.textContent = (eld>=0?'+':'')+eld.toFixed(1).padStart(4,'0')+'°';

  dust.rotation.y += dt*0.008;
  composer.render();
}
renderer.setAnimationLoop(animate);

window.__ok = true;
setTimeout(()=> document.getElementById('load').classList.add('off'), 400);
</script>
