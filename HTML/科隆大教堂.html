<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================================
   0 · 色板
   ========================================================================= */
const C = {
  ST1:1, ST2:2, ST3:3, ST4:4,
  ROOF:5, ROOFD:6, COP:7,
  GB:8, GR:9, GG:10, GY:11,
  GOLD:12, DARK:13, LAMP:14
};
const MATDEF = {
  1:{color:0xe8e1cf, roughness:0.95, metalness:0.0},
  2:{color:0xd4cbb5, roughness:0.95, metalness:0.0},
  3:{color:0xb6ad97, roughness:0.96, metalness:0.0},
  4:{color:0x928a76, roughness:0.96, metalness:0.0},
  5:{color:0x4e5b66, roughness:0.66, metalness:0.06},
  6:{color:0x37414b, roughness:0.70, metalness:0.06},
  7:{color:0x5f8d74, roughness:0.52, metalness:0.25},
  8:{color:0x4b83c4, roughness:0.16, metalness:0.12, glass:1, emis:0x3d78c0},
  9:{color:0xb5504a, roughness:0.16, metalness:0.12, glass:1, emis:0xa33d38},
  10:{color:0x45906f, roughness:0.16, metalness:0.12, glass:1, emis:0x357a5c},
  11:{color:0xd9a74f, roughness:0.16, metalness:0.12, glass:1, emis:0xc2913a},
  12:{color:0xf0c95c, roughness:0.30, metalness:0.85, emis:0x3a2a06},
  13:{color:0x2c2620, roughness:0.98, metalness:0.0},
  14:{color:0xffe9bb, roughness:0.50, metalness:0.0, emis:0xffcc70}
};

/* =========================================================================
   1 · 体素网格
   ========================================================================= */
const XMIN=-52, XMAX=52, YMIN=0, YMAX=168, ZMIN=-14, ZMAX=150;
const GW=XMAX-XMIN+1, GH=YMAX-YMIN+1, GD=ZMAX-ZMIN+1;
const G = new Uint8Array(GW*GH*GD);

function set(x,y,z,c){
  x|=0; y|=0; z|=0;
  if(x<XMIN||x>XMAX||y<YMIN||y>YMAX||z<ZMIN||z>ZMAX) return;
  G[((y-YMIN)*GD + (z-ZMIN))*GW + (x-XMIN)] = c;
}
const CV = (m,x,y,z) => (typeof m === 'function') ? m(x,y,z) : m;

function box(x0,y0,z0,x1,y1,z1,c){
  const xa=Math.min(x0,x1), xb=Math.max(x0,x1);
  const ya=Math.min(y0,y1), yb=Math.max(y0,y1);
  const za=Math.min(z0,z1), zb=Math.max(z0,z1);
  const f = (typeof c === 'function');
  for(let y=ya;y<=yb;y++) for(let z=za;z<=zb;z++) for(let x=xa;x<=xb;x++)
    set(x,y,z, f ? c(x,y,z) : c);
}
function shell(x0,z0,x1,z1,y0,y1,t,c){
  box(x0,y0,z0,x0+t-1,y1,z1,c);
  box(x1-t+1,y0,z0,x1,y1,z1,c);
  box(x0,y0,z0,x1,y1,z0+t-1,c);
  box(x0,y0,z1-t+1,x1,y1,z1,c);
}

/* --- 石材风化噪声 --- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const _rng = mulberry32(18800815);
const PN = new Float32Array(8192);
for(let i=0;i<8192;i++) PN[i]=_rng();
function vh(ix,iy,iz){ return PN[((Math.imul(ix,73856093)^Math.imul(iy,19349663)^Math.imul(iz,83492791))>>>0)&8191]; }
function vnoise(x,y,z){
  const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z);
  let fx=x-ix, fy=y-iy, fz=z-iz;
  fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); fz=fz*fz*(3-2*fz);
  const c000=vh(ix,iy,iz),     c100=vh(ix+1,iy,iz);
  const c010=vh(ix,iy+1,iz),   c110=vh(ix+1,iy+1,iz);
  const c001=vh(ix,iy,iz+1),   c101=vh(ix+1,iy,iz+1);
  const c011=vh(ix,iy+1,iz+1), c111=vh(ix+1,iy+1,iz+1);
  const x00=c000+(c100-c000)*fx, x10=c010+(c110-c010)*fx;
  const x01=c001+(c101-c001)*fx, x11=c011+(c111-c011)*fx;
  const y0=x00+(x10-x00)*fy,     y1=x01+(x11-x01)*fy;
  return y0+(y1-y0)*fz;
}
function h3(x,y,z){
  let h=(Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1274126177))>>>0;
  h=Math.imul(h^(h>>>13),1274126177);
  return ((h^(h>>>16))>>>0)/4294967296;
}
function st(base){
  return function(x,y,z){
    let n = vnoise(x*0.26, y*0.26, z*0.26)*0.70 + h3(x,y,z)*0.30;
    if(y < 12) n -= 0.10;
    else if(y > 95) n += 0.06;
    let c = base + (n<0.28 ? -1 : (n>0.72 ? 1 : 0));
    return c<1 ? 1 : (c>4 ? 4 : c);
  };
}
const S1 = st(1), S2 = st(2), S3 = st(3), S4 = st(4);

/* --- 尖拱剖面（顶点尖角、起拱处垂直切线） --- */
function archTop(u, span, yBase, A, m){
  const s = Math.abs(2*(u/Math.max(1,span)) - 1);
  return yBase + A*span*Math.pow(Math.max(0, 1-s), 1/(m||2));
}
/* --- 八边形度量：面法线在 0°/45°/90°… --- */
const K1=0.92388, K2=1.30656;
function rho(dx,dz){
  return Math.max(Math.abs(dx)/K1, Math.abs(dz)/K1,
                  Math.abs(dx+dz)/K2, Math.abs(dx-dz)/K2);
}

/* =========================================================================
   2 · 哥特构件
   ========================================================================= */

/* 尖拱窗（平面墙）：nrm='x' 墙厚沿 X(d0..d1)，洞口沿 Z 展开 */
function win(nrm, c, d0, d1, hs, yBase, A, glass, mat, lights, m){
  lights = lights||2; m = m||2;
  const S = hs*2;
  const topAt = u => Math.floor(archTop(u, S, yBase, A, m));
  const P = (t,s,y,mm) => {
    const X = nrm==='x' ? t : s, Z = nrm==='x' ? s : t;
    set(X, y, Z, CV(mm, X, y, Z));
  };
  const apex = yBase + A*S;
  for(let u=1;u<S;u++){
    const s=c-hs+u, tp=topAt(u);
    for(let y=yBase;y<=tp;y++) for(let t=d0;t<=d1;t++) P(t,s,y,glass);
  }
  for(let u=0;u<=S;u++){ const s=c-hs+u; for(let t=d0;t<=d1;t++) P(t,s,topAt(u)+1,mat); }
  for(let i=1;i<lights;i++){
    const u=Math.round(S*i/lights), s=c-hs+u, tp=topAt(u);
    for(let y=yBase;y<=tp;y++) for(let t=d0;t<=d1;t++) P(t,s,y,mat);
  }
  const ty = Math.round(yBase + (apex-yBase)*0.55);
  for(let u=1;u<S;u++){ const s=c-hs+u; if(topAt(u)>=ty) for(let t=d0;t<=d1;t++) P(t,s,ty,mat); }
  const r = Math.max(1.5, S*0.17), cy = ty + (apex-ty)*0.50;
  for(let a=0;a<72;a++){
    const ang=a*Math.PI/36;
    const s=Math.round(c+Math.cos(ang)*r), y=Math.round(cy+Math.sin(ang)*r);
    const u=s-(c-hs); if(u<1||u>=S) continue;
    if(topAt(u)>=y) for(let t=d0;t<=d1;t++) P(t,s,y,mat);
  }
  if(S>=8){
    for(let a=0;a<36;a++){
      const ang=a*Math.PI/18, rr=r*0.45;
      const s=Math.round(c+Math.cos(ang)*rr), y=Math.round(cy+Math.sin(ang)*rr);
      const u=s-(c-hs); if(u<1||u>=S) continue;
      if(topAt(u)>=y) for(let t=d0;t<=d1;t++) P(t,s,y,C.GY);
    }
  }
  for(let u=0;u<=S;u++){ const s=c-hs+u; for(let t=d0;t<=d1;t++) P(t,s,yBase-1,mat); }
}

/* 尖拱窗（曲面墙，极坐标） */
function winArc(czc, aC, halfA, yBase, apexH, glass, mat, rIn, rOut, lights){
  lights = lights||2;
  const N = 44;
  const topAt = i => Math.floor(yBase + apexH*Math.pow(Math.max(0,1-Math.abs(2*(i/N)-1)), 0.5));
  const ring = (i,y,v) => {
    const ang = aC + (i/N - 0.5)*2*halfA;
    for(let r=rIn; r<=rOut+0.01; r+=0.6){
      const x = Math.round(Math.sin(ang)*r), z = Math.round(czc + Math.cos(ang)*r);
      set(x, y, z, CV(v, x, y, z));
    }
  };
  for(let i=1;i<N;i++){ const tp=topAt(i); for(let y=yBase;y<=tp;y++) ring(i,y,glass); }
  for(let i=0;i<=N;i++) ring(i, topAt(i)+1, mat);
  for(let k=1;k<lights;k++){
    const i=Math.round(N*k/lights), tp=topAt(i);
    for(let y=yBase;y<=tp;y++) ring(i,y,mat);
  }
  const ty = Math.round(yBase + apexH*0.55);
  for(let i=1;i<N;i++) if(topAt(i)>=ty) ring(i, ty, mat);
  for(let i=0;i<=N;i++) ring(i, yBase-1, mat);
}

/* 盲拱浮雕 */
function blindArc(nrm, c, d0, hs, yBase, A, deep, mat){
  const S=hs*2, topAt = u=>Math.floor(archTop(u,S,yBase,A,2));
  for(let u=0;u<=S;u++){
    const s=c-hs+u, tp=topAt(u);
    if(nrm==='x') set(d0, tp+1, s, CV(mat,d0,tp+1,s));
    else          set(s, tp+1, d0, CV(mat,s,tp+1,d0));
  }
  for(let u=1;u<S;u++){
    const s=c-hs+u, tp=topAt(u);
    for(let y=yBase;y<=tp;y++){
      if((u+y)%3===0) continue;
      if(nrm==='x') set(d0,y,s, CV(deep,d0,y,s));
      else          set(s,y,d0, CV(deep,s,y,d0));
    }
  }
}

/* 玫瑰窗 */
function rose(nrm, c, cy, d0, d1, R, mat){
  const Ri=Math.ceil(R);
  const P=(t,s,y,mm)=>{
    const X = nrm==='x'?t:s, Z = nrm==='x'?s:t;
    set(X,y,Z, CV(mm,X,y,Z));
  };
  for(let ds=-Ri;ds<=Ri;ds++) for(let dy=-Ri;dy<=Ri;dy++){
    const d=Math.hypot(ds,dy); if(d>R) continue;
    let g=C.GB; if(d>R*0.72) g=C.GY; else if(d>R*0.42) g=C.GR;
    if(d<=R-1.15){ for(let t=d0;t<=d1;t++) P(t,c+ds,cy+dy,g); }
    else         { for(let t=d0;t<=d1;t++) P(t,c+ds,cy+dy,mat); }
  }
  const N=8;
  for(let i=0;i<N;i++){
    const a=i*2*Math.PI/N;
    for(let k=1.5;k<R-1;k+=0.5){
      const s=Math.round(c+Math.cos(a)*k), y=Math.round(cy+Math.sin(a)*k);
      for(let t=d0;t<=d1;t++) P(t,s,y,mat);
    }
  }
  for(let a=0;a<80;a++){
    const ang=a*Math.PI/40, r=R*0.42;
    const s=Math.round(c+Math.cos(ang)*r), y=Math.round(cy+Math.sin(ang)*r);
    for(let t=d0;t<=d1;t++) P(t,s,y,mat);
  }
  for(let i=0;i<N;i++){
    const a=(i+0.5)*2*Math.PI/N, rr=R*0.70, sr=R*0.19;
    const cs=c+Math.cos(a)*rr, cc=cy+Math.sin(a)*rr;
    for(let b=0;b<40;b++){
      const ang=b*Math.PI/20;
      const s=Math.round(cs+Math.cos(ang)*sr), y=Math.round(cc+Math.sin(ang)*sr);
      if(Math.hypot(s-c,y-cy) > R-1.3) continue;
      for(let t=d0;t<=d1;t++) P(t,s,y,mat);
    }
  }
}

/* 小尖塔 */
function pinnacle(cx,cz,y0,w,h,mat){
  const f = (typeof mat==='function');
  for(let i=0;i<h;i++){
    const t=i/Math.max(1,h-1);
    const r=Math.max(0.5,(w*0.5)*Math.pow(1-t,0.85));
    const ri=Math.ceil(r);
    for(let dz=-ri;dz<=ri;dz++) for(let dx=-ri;dx<=ri;dx++)
      if(Math.abs(dx)<=r && Math.abs(dz)<=r)
        set(cx+dx,y0+i,cz+dz, f?mat(cx+dx,y0+i,cz+dz):mat);
  }
  set(cx,y0+h,cz,C.GOLD);
}
function pinnacle8(cx,cz,y0,r0,h,mat){
  const f = (typeof mat==='function');
  for(let i=0;i<h;i++){
    const t=i/Math.max(1,h-1);
    const r=Math.max(0.5,r0*Math.pow(1-t,0.80));
    const ri=Math.ceil(r)+1;
    for(let dz=-ri;dz<=ri;dz++) for(let dx=-ri;dx<=ri;dx++)
      if(rho(dx,dz)<=r) set(cx+dx,y0+i,cz+dz, f?mat(cx+dx,y0+i,cz+dz):mat);
  }
  set(cx,y0+h,cz,C.GOLD); set(cx,y0+h+1,cz,C.GOLD);
}

/* 飞扶壁 */
function flyer(xIn,xOut,yIn,yOut,cz,mat){
  const n=Math.abs(xOut-xIn), sgn = xOut>xIn?1:-1;
  const f=(typeof mat==='function');
  for(let i=0;i<=n;i++){
    const t=i/n;
    const x=Math.round(xIn+sgn*i);
    const yT=Math.round(yIn+(yOut-yIn)*t - Math.sin(t*Math.PI)*1.2);
    for(let k=0;k<3;k++) for(let dz=-1;dz<=1;dz++)
      set(x,yT-k,cz+dz, f?mat(x,yT-k,cz+dz):mat);
  }
  for(let i=1;i<n;i++){
    const t=i/n;
    const x=Math.round(xIn+sgn*i);
    const y=Math.round(yIn+(yOut-yIn)*t - Math.sin(t*Math.PI)*1.2 - 3);
    for(let dz=-1;dz<=1;dz++) set(x,y,cz+dz, f?mat(x,y,cz+dz):mat);
  }
}

/* 镂空女儿墙 */
function parapet(x0,z0,x1,z1,y,mat){
  box(x0,y,z0,x1,y+1,z1,mat);
  const put=(x,yy,z)=>set(x,yy,z, CV(mat,x,yy,z));
  for(let x=x0+1;x<=x1-1;x+=3){
    put(x,y+2,z0); put(x+1,y+2,z0); put(x,y+3,z0);
    put(x,y+2,z1); put(x+1,y+2,z1); put(x,y+3,z1);
  }
  for(let z=z0+1;z<=z1-1;z+=3){
    put(x0,y+2,z); put(x0,y+3,z);
    put(x1,y+2,z); put(x1,y+3,z);
  }
  box(x0,y+4,z0,x1,y+4,z1,mat);
}

/* 山墙：法向 X（三角形在 Z-Y 面） */
function gableX(x0,x1,cz,hw,yBase,yPeak,mat){
  for(let dz=-hw;dz<=hw;dz++){
    const t=1-Math.abs(dz)/hw;
    const top=Math.round(yBase+(yPeak-yBase)*Math.pow(t,0.92));
    for(let y=yBase;y<=top;y++) box(x0,y,cz+dz,x1,y,cz+dz,mat);
  }
  for(let dz=-hw+1;dz<hw;dz++){
    const t=1-Math.abs(dz)/hw;
    const top=Math.round(yBase+(yPeak-yBase)*Math.pow(t,0.92));
    if((dz&1)===0) box(x0,top+1,cz+dz,x1,top+2,cz+dz,mat);
  }
  // 山墙内盲拱 + 圆花
  const yb=yBase+2, ah=Math.max(4,Math.floor((yPeak-yBase)*0.36));
  for(const off of [-Math.floor(hw*0.52), 0, Math.floor(hw*0.52)]){
    blindArc('x', cz+off, x1, Math.max(3,Math.floor(hw*0.34)), yb, ah/ (2*Math.max(3,Math.floor(hw*0.34))), C.ST4, mat);
  }
  const rr=Math.max(2,Math.floor(hw*0.26)), cyc=yBase+Math.round((yPeak-yBase)*0.66);
  for(let a=0;a<64;a++){
    const ang=a*Math.PI/32;
    const dz=Math.round(Math.cos(ang)*rr), dy=Math.round(Math.sin(ang)*rr);
    box(x0, cyc+dy, cz+dz, x1, cyc+dy, cz+dz, C.ST4);
  }
}
/* 山墙：法向 Z（三角形在 X-Y 面） */
function gableZ(z0,z1,cx,hw,yBase,yPeak,mat){
  for(let dx=-hw;dx<=hw;dx++){
    const t=1-Math.abs(dx)/hw;
    const top=Math.round(yBase+(yPeak-yBase)*Math.pow(t,0.92));
    for(let y=yBase;y<=top;y++) box(cx+dx,y,z0,cx+dx,y,z1,mat);
  }
  for(let dx=-hw+1;dx<hw;dx++){
    const t=1-Math.abs(dx)/hw;
    const top=Math.round(yBase+(yPeak-yBase)*Math.pow(t,0.92));
    if((dx&1)===0) box(cx+dx,top+1,z0,cx+dx,top+2,z1,mat);
  }
}

/* =========================================================================
   3 · 尺寸表（1 体素 ≈ 1.05 m）
   ========================================================================= */

  plinthTop:2,
  aisleTop:28, aisleRIn:33, aisleROut:28,
  clerTop:50, ridge:64,
  outIn:17, outOut:19,

  naveZ0:3, naveZ1:70,
  trZ0:70,  trZ1:96,   trX:39,
  choirZ0:96, choirZ1:122,
  apseCZ:122, apseR:19, apseClr:8,

};

/* =========================================================================
   4 · 建造
   ========================================================================= */
function buildCathedral(){

  /* ---- 4.1 台基 ---- */
  box(-21,0,-5, 21,1, 127, S4);
  box(-40,0,68, 40,1,  98, S4);
  box(-26,0,-5, -8,1, 19, S4);
  box(  8,0,-5, 26,1, 19, S4);
  for(let dx=-23;dx<=23;dx++) for(let dz=-1;dz<=24;dz++){
    if(Math.hypot(dx,dz) <= 23) box(dx,0,P.apseCZ+dz,dx,1,P.apseCZ+dz,S4);
  }
  for(let s=0;s<3;s++){
    box(-9,1,-5-s, 9,1+s,-5-s, S3);
    box(40+s,1,79, 40+s,1+s,87, S3);
    box(-40-s,1,79, -40-s,1+s,87, S3);
  }

  /* ---- 4.2 中殿 / 唱诗堂 ---- */
  const SEG = [[P.naveZ0,P.naveZ1],[P.choirZ0,P.choirZ1]];
  for(let si=0; si<SEG.length; si++){
    const za=SEG[si][0], zb=SEG[si][1];
    // 侧廊外墙
    box(-P.outOut,P.plinthTop,za, -P.outIn,P.aisleTop,zb, S2);
    box( P.outIn, P.plinthTop,za,  P.outOut,P.aisleTop,zb, S2);
    // 高侧墙（仅屋面以上可见段）
    box(-P.clrOut,30,za, -P.clrIn,P.clerTop,zb, S2);
    box( P.clrIn, 30,za,  P.clrOut,P.clerTop,zb, S2);
    // 侧廊檐口
    box(-22,P.aisleTop+1,za, -P.outIn,P.aisleTop+2,zb, S3);
    box( P.outIn,P.aisleTop+1,za, 22,P.aisleTop+2,zb, S3);
    parapet(-22,za,-P.outIn,P.aisleTop+3,S3);
    parapet( P.outIn,za,22,P.aisleTop+3,S3);
    // 侧廊屋面（单坡）
    for(let a=P.clrOut; a<=P.outOut; a++){
      const t=(a-P.clrOut)/(P.outOut-P.clrOut);
      const y=Math.round(P.aisleRIn + (P.aisleROut-P.aisleRIn)*t);
      box(-a,y,za,-a,y+1,zb, t>0.35?C.ROOF:C.ROOFD);
      box( a,y,za, a,y+1,zb, t>0.35?C.ROOF:C.ROOFD);
    }
    // 高侧墙檐口
    box(-P.clrOut-1,P.clerTop+1,za, -P.clrIn+1,P.clerTop+2,zb, S3);
    box( P.clrIn-1, P.clerTop+1,za,  P.clrOut+1,P.clerTop+2,zb, S3);
    // 中殿双坡屋顶
    for(let a=0; a<=P.clrOut+1; a++){
      const y=Math.round(P.ridge - (a/(P.clrOut+1))*(P.ridge-P.clerTop));
      if(a===0) box(0,y,za,0,y+1,zb, C.ROOFD);
      else { box(-a,y,za,-a,y+1,zb,(a%4===0)?C.ROOFD:C.ROOF);
             box( a,y,za, a,y+1,zb,(a%4===0)?C.ROOFD:C.ROOF); }
    }
    box(-1,P.ridge+1,za, 1,P.ridge+2,zb, C.COP);
    for(let z=za;z<zb;z+=6) box(0,P.ridge+3,z,0,P.ridge+4,z,C.GOLD);
  }

  /* ---- 4.3 侧廊窗 / 高侧窗 ---- */
  const GC=[C.GB,C.GR,C.GG,C.GB,C.GY,C.GB,C.GG,C.GR];
  let gi=0;
  for(let si=0; si<SEG.length; si++){
    const za=SEG[si][0], zb=SEG[si][1];
    for(let z=za+8; z<zb-4; z+=11){
      const g1=GC[(gi++)%GC.length], g2=GC[(gi++)%GC.length];
      win('x', z, -P.outOut,-P.outIn, 5, 6, 1.5, g1, S1, 3, 2.2);
      win('x', z,  P.outIn, P.outOut, 5, 6, 1.5, g1, S1, 3, 2.2);
      blindArc('x', z, -P.outOut, 4, 24, 1.2, C.ST4, S2);
      blindArc('x', z,  P.outOut, 4, 24, 1.2, C.ST4, S2);
      win('x', z, -P.clrOut,-P.clrIn, 5, 35, 1.15, g2, S1, 3, 2.0);
      win('x', z,  P.clrIn, P.clrOut, 5, 35, 1.15, g2, S1, 3, 2.0);
    }
  }

  /* ---- 4.4 飞扶壁 ---- */
  for(let si=0; si<SEG.length; si++){
    const za=SEG[si][0], zb=SEG[si][1];
    for(let z=za+1; z<zb; z+=11){
      for(const sgn of [-1,1]){
        box(sgn*P.outOut, P.plinthTop, z-2, sgn*22, P.aisleTop+2, z+2, S3);
        pinnacle(sgn*21, z, P.aisleTop+3, 5, 13, S1);
        flyer(sgn*(P.clrOut+1), sgn*22, 47, 33, z, S2);
        flyer(sgn*(P.clrOut+1), sgn*19, 40, 31, z, S2);
      }
    }
  }

  /* ---- 4.5 耳堂 ---- */
  for(const sgn of [-1,1]){
    const xa = sgn>0 ? 11 : -P.trX, xb = sgn>0 ? P.trX : -11;
    box(sgn*(P.trX-2), P.plinthTop, P.trZ0, sgn*P.trX, P.trWallTop, P.trZ1, S2);
    box(sgn*P.outOut, P.plinthTop, P.trZ0, sgn*P.trX, P.clerTop, P.trZ0+2, S2);
    box(sgn*P.outOut, P.plinthTop, P.trZ1-2, sgn*P.trX, P.clerTop, P.trZ1, S2);
    // 角塔
    for(const cz of [P.trZ0, P.trZ1]){
      pinnacle8(sgn*(P.trX-1), cz, P.plinthTop, 5.0, P.trWallTop-P.plinthTop, S1);
      pinnacle8(sgn*(P.trX-1), cz, P.trWallTop, 2.2, 16, S1);
    }
    // 三柳叶窗
    for(const cz of [P.trZ0+7, 83, P.trZ1-7])
      win('x', cz, sgn*(P.trX-2), sgn*P.trX, 4, 22, 1.6, C.GB, S1, 2, 2.4);
    // 盲拱带
    for(const cz of [P.trZ0+3, P.trZ0+11, 83-9, 83-5, 83+5, 83+9, P.trZ1-11, P.trZ1-3])
      blindArc('x', cz, sgn*P.trX, 2, 58, 1.1, C.ST4, S2);
    // 玫瑰窗
    rose('x', 83, 46, sgn*(P.trX-2), sgn*P.trX, 9, S1);
    // 主入口
    win('x', 83, sgn*(P.trX-2), sgn*P.trX, 4, 4, 1.35, C.DARK, S1, 2, 2.3);
    for(let dz=-3;dz<=3;dz++) for(let y=4;y<=12;y++)
      set(sgn*(P.trX-2), y, 83+dz, C.LAMP);
    // 侧墙窗
    for(const cx of [sgn*25, sgn*32]){
      win('z', cx, P.trZ0, P.trZ0+2, 4, 8, 1.7, C.GG, S1, 2, 2.3);
      win('z', cx, P.trZ1-2, P.trZ1, 4, 8, 1.7, C.GG, S1, 2, 2.3);
    }
    // 檐口 + 山墙
    box(sgn*(P.trX-2), P.trWallTop+1, P.trZ0, sgn*P.trX, P.trWallTop+2, P.trZ1, S3);
    gableX(sgn*(P.trX-2), sgn*P.trX, 83, 13, P.trWallTop+3, P.trGable, S1);
    // 耳堂屋顶（沿 X 起脊）
    for(let z=P.trZ0; z<=P.trZ1; z++){
      const t=Math.abs(z-83)/13;
      const y=Math.round(P.clerTop + (1-t)*(P.ridge-P.clerTop));
      box(xa,y,z,xb,y+1,z,(Math.round(y)%3===0)?C.ROOFD:C.ROOF);
    }
  }
  // 交叉部塔基楼板
  box(-12, P.ridge, 70, 12, P.ridge+1, 96, C.ROOFD);

  /* ---- 4.6 交叉部塔 ---- */
  crossingTower();

  /* ---- 4.7 后殿 ---- */
  buildApse();

  /* ---- 4.8 西立面中央段 ---- */
  westFacade();

  /* ---- 4.9 双塔 ---- */
  buildTower(-1);
  buildTower( 1);
}

/* ---------- 交叉部塔 ---------- */
function crossingTower(){
  const cx=0, cz=83;
  shell(-11,72,11,94, P.ridge, P.xTowerTop, 3, S2);
  for(const sgn of [-1,1]){
    win('x', cz, sgn*11, sgn*9,   4, P.ridge+3, 1.8, C.GB, S1, 2, 2.4);
    win('z', sgn*7, 94, 92,       4, P.ridge+3, 1.8, C.GB, S1, 2, 2.4);
    win('z', sgn*7, 74, 72,       4, P.ridge+3, 1.8, C.GB, S1, 2, 2.4);
  }
  box(-13, P.xTowerTop+1, 70, 13, P.xTowerTop+2, 96, S3);
  for(const sx of [-1,1]) for(const sz of [-1,1])
    pinnacle8(sx*11, 83+sz*11, P.xTowerTop+3, 2.6, 20, S1);

  // 八角鼓
  const R=11.9;
  for(let y=P.xTowerTop; y<=P.xOctTop; y++)
    for(let dz=-14;dz<=14;dz++) for(let dx=-14;dx<=14;dx++){
      const rr=rho(dx,dz);
      if(rr<=R && rr>R-2.4) set(cx+dx,y,cz+dz, CV(S1,cx+dx,y,cz+dz));
    }
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4, ca=Math.cos(a), sa=Math.sin(a);
    const px=Math.round(cx+ca*(R-1.6)), pz=Math.round(cz+sa*(R-1.6));
    if(k%2===0){
      if(Math.abs(ca)>Math.abs(sa)) win('x', pz, Math.min(px,px-Math.round(ca*2.6)), Math.max(px,px-Math.round(ca*2.6)), 3, P.xTowerTop+2, 1.8, C.DARK, S1, 2, 2.4);
      else                          win('z', px, Math.min(pz,pz-Math.round(sa*2.6)), Math.max(pz,pz-Math.round(sa*2.6)), 3, P.xTowerTop+2, 1.8, C.DARK, S1, 2, 2.4);
    } else {
      box(px-1, P.xTowerTop+2, pz-1, px+1, P.xTowerTop+11, pz+1, C.ST4);
    }
    const va=a+Math.PI/8;
    pinnacle8(cx+Math.round(Math.cos(va)*(R-0.6)), cz+Math.round(Math.sin(va)*(R-0.6)), P.xOctTop, 2.0, 14, S1);
  }
  buildSpire(cx, cz, P.xOctTop+2, P.xSpireTop, 9.2, S1, 4);
  pinnacle8(cx, cz, P.xSpireTop, 1.6, 4, S1);
  set(cx, P.xSpireTop+5, cz, C.GOLD);
}

/* ---------- 后殿 + 放射小礼拜堂 ---------- */
function buildApse(){
  const cz0=P.apseCZ, R=P.apseR, RC=P.apseClr;
  // 环墙（半径判定，无缝）
  for(let dx=-24;dx<=24;dx++) for(let dz=-2;dz<=25;dz++){
    if(dz<0) continue;
    const r=Math.hypot(dx,dz);
    if(r>=R-3 && r<=R+0.4)   box(dx,P.plinthTop,cz0+dz,dx,P.aisleTop,cz0+dz, S2);
    if(r>=RC-3 && r<=RC+0.4) box(dx,30,cz0+dz,dx,P.clerTop,cz0+dz, S2);
  }
  // 环廊锥屋面
  for(let dx=-24;dx<=24;dx++) for(let dz=0;dz<=25;dz++){
    const r=Math.hypot(dx,dz);
    if(r<RC-1 || r>R+2) continue;
    const t=(r-RC)/(R+1-RC);
    const y=Math.round(P.aisleRIn + (P.aisleROut-P.aisleRIn)*t);
    set(dx,y,cz0+dz, C.ROOF); set(dx,y+1,cz0+dz, C.ROOFD);
  }
  // 后殿主锥顶
  for(let dz=0; dz<=RC+1; dz++) for(let dx=-RC-1; dx<=RC+1; dx++){
    const r=Math.hypot(dx,dz); if(r>RC+1.2) continue;
    const y=Math.round(P.ridge - (r/(RC+1))*(P.ridge-P.clerTop));
    set(dx,y,cz0+dz, (Math.round(y)%3===0)?C.ROOFD:C.ROOF);
  }
  // 檐口
  for(let dx=-24;dx<=24;dx++) for(let dz=0;dz<=25;dz++){
    const r=Math.hypot(dx,dz);
    if(r>=R && r<=R+2){ set(dx,P.aisleTop+1,cz0+dz,C.ST3); set(dx,P.aisleTop+2,cz0+dz,C.ST3); }
    if(r>=RC && r<=RC+2){ set(dx,P.clerTop+1,cz0+dz,C.ST3); set(dx,P.clerTop+2,cz0+dz,C.ST3); }
  }
  // 高侧窗（极坐标）
  for(let i=0;i<7;i++){
    const a = -1.30 + i*(2.60/6);
    winArc(cz0, a, 0.50, 35, 11, (i%2?C.GR:C.GB), S1, RC-3, RC, 3);
  }
  // 环廊窗
  for(let i=0;i<9;i++){
    const a = -1.36 + i*(2.72/8);
    winArc(cz0, a, 0.185, 8, 13, (i%2?C.GG:C.GY), S1, R-3, R, 2);
  }
  // 放射小礼拜堂
  const CH=[0, 0.70, -0.70, 1.36, -1.36], cr=7;
  for(const a of CH){
    const ca=Math.cos(a), sa=Math.sin(a);
    const cxx=Math.round(sa*17), czz=Math.round(cz0+ca*17);
    for(let dx=-cr-1;dx<=cr+1;dx++) for(let dz=-cr-1;dz<=cr+1;dz++){
      const r=Math.hypot(dx,dz);
      if(r>cr+0.6 || r<cr-2.2) continue;
      if(dx*sa + dz*ca < -0.6) continue;
      box(cxx+dx, P.plinthTop, czz+dz, cxx+dx, 26, czz+dz, S2);
    }
    for(let dx=-cr-1;dx<=cr+1;dx++) for(let dz=-cr-1;dz<=cr+1;dz++){
      const r=Math.hypot(dx,dz);
      if(r>cr+0.8) continue;
      if(dx*sa + dz*ca < -0.6) continue;
      const y=Math.round(27 + (cr-r));
      set(cxx+dx, y, czz+dz, ((Math.round(r)%3)===0)?C.ROOFD:C.ROOF);
    }
    // 礼拜堂窗
    for(const off of [-0.42, 0, 0.42])
      winArc(czz, a+off, 0.30, 8, 12, C.GY, S1, cr-2.2, cr, 2);
    pinnacle8(Math.round(cxx+sa*(cr+1)), Math.round(czz+ca*(cr+1)), 27, 2.4, 13, S1);
  }
  // 后殿飞扶壁
  for(const a of [-1.03,-0.52, 0.52, 1.03]){
    const ca=Math.cos(a), sa=Math.sin(a);
    for(let i=0;i<12;i++){
      const t=i/11, rr=RC + (19-RC)*t;
      const y=Math.round(47 + (29-47)*t - Math.sin(t*Math.PI)*1.5);
      const x=Math.round(sa*rr), z=Math.round(cz0+ca*rr);
      box(x-1,y,z-1, x+1,y+2,z+1, S2);
    }
    pinnacle8(Math.round(sa*20), Math.round(cz0+ca*20), P.aisleTop+3, 2.6, 14, S1);
  }
}

/* ---------- 西立面中央段 ---------- */
function westFacade(){
  const z0=0, z1=3;
  box(-9, P.plinthTop, z0, 9, 58, z1, S2);
  // 三座尖拱门
  win('z',  0, z0, z1, 4, 4, 1.35, C.DARK, S1, 2, 2.3);

  for(let x=-3;x<=3;x++) for(let y=4;y<=11;y++) set(x,y,z1, C.LAMP);
  // 门楣雕像带 + 线脚
  for(let x=-8;x<=8;x++) if((x&1)===0){ set(x,17,-1,C.ST1); set(x,18,-1,C.ST3); }
  box(-10,19,z0, 10,20,z1, S3);
  // 国王廊
  for(let x=-8;x<=8;x+=2) blindArc('z', x, -1, 1, 22, 1.6, C.ST4, S1);
  box(-10,26,z0, 10,27,z1, S3);
  // 中央大窗 + 玫瑰窗

  rose('z', 0, 50, z0, z1, 6, S1);
  // 线脚 + 中央山墙
  box(-10,57,z0, 10,58,z1, S3);

  blindArc('z', 0, -1, 5, 62, 1.9, C.ST4, S1);

  blindArc('z',  6, -1, 2, 62, 1.8, C.ST4, S1);

}

/* ---------- 钟塔 ---------- */
function buildTower(sgn){
  const x0 = sgn>0 ? P.towIn : -P.towOut;
  const x1 = sgn>0 ? P.towOut : -P.towIn;
  const za=P.towZ0, zb=P.towZ1;
  const cx = sgn*17, cz = 8;
  const zf0=0, zf1=2;
  const T=P.towSqTop;

  // 塔身（实心后掏空）
  box(x0, P.plinthTop, za, x1, T, zb, S2);
  box(x0+3, P.plinthTop, za+3, x1-3, T-2, zb-3, 0);

  // 四角扶壁
  for(const sx of [0,1]) for(const sz of [0,1]){
    const bx = sx?x1:x0, bz = sz?zb:za;
    box(bx+(sx?1:-4), P.plinthTop, bz+(sz?1:-4),
        bx+(sx?4:-1), T,            bz+(sz?4:-1), S3);
    box(bx+(sx?1:-3), T-18, bz+(sz?1:-3),
        bx+(sx?3:-1), T-8,  bz+(sz?3:-1), S3);
  }
  // 横向线脚
  for(const y of [6,34,38,58])
    box(x0-2,y,za-2, x1+2,y+1,zb+2, S3);

  // 底部盲拱
  for(let k=-1;k<=1;k++) blindArc('z', cx+k*6, -1, 2, 9, 1.8, C.ST4, S1);

  // 中部大尖窗
  win('z', cx, zf0, zf1, 5, 13, 1.7, C.GB, S1, 3, 2.4);
  win('x', cz, x0, x0+2, 5, 13, 1.7, C.GB, S1, 3, 2.4);
  win('x', cz, x1-2, x1, 5, 13, 1.7, C.GB, S1, 3, 2.4);
  // 钟室百叶窗
  win('z', cx, zf0, zf1, 4, 40, 1.75, C.DARK, S1, 2, 2.3);
  win('x', cz, x0, x0+2, 4, 40, 1.75, C.DARK, S1, 2, 2.3);
  win('x', cz, x1-2, x1, 4, 40, 1.75, C.DARK, S1, 2, 2.3);
  for(let y=40;y<=54;y++){
    if((y&1)===0){
      for(let z=za;z<=zb;z++){ set(x0,y,z,C.ROOFD); set(x1,y,z,C.ROOFD); }
      for(let x=x0;x<=x1;x++){ set(x,y,zf0,C.ROOFD); set(x,y,zb,C.ROOFD); }
    }
  }
  // 女儿墙 + 角尖塔
  parapet(x0-2, za-2, x1+2, 58, S3);
  for(const sx of [0,1]) for(const sz of [0,1]){
    const bx = sx?x1+2:x0-2, bz = sz?zb+2:za-2;
    pinnacle8(bx, bz, 63, 2.8, 30, S1);
  }

  // 八角鼓座（内接于 15×15 方形）
  const octR = 8.2;
  for(let y=T; y<=P.towOctTop; y++)
    for(let dz=-11;dz<=11;dz++) for(let dx=-11;dx<=11;dx++){
      const rr=rho(dx,dz);
      if(rr<=octR && rr>octR-2.2) set(cx+dx,y,cz+dz, CV(S1,cx+dx,y,cz+dz));
    }
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4, ca=Math.cos(a), sa=Math.sin(a);
    let px, pz;
    if(k%2===0){
      // 轴面：开钟室洞
      if(Math.abs(ca)>Math.abs(sa)){
        px = Math.round(cx + ca*(octR-1.4)); pz = cz;
        const d = px - Math.round(ca*2.4);
        win('x', pz, Math.min(px,d), Math.max(px,d), 3, T+5, 1.9, C.DARK, S1, 2, 2.4);
      } else {
        pz = Math.round(cz + sa*(octR-1.4)); px = cx;
        const d = pz - Math.round(sa*2.4);
        win('z', px, Math.min(pz,d), Math.max(pz,d), 3, T+5, 1.9, C.DARK, S1, 2, 2.4);
      }
      // 小山花
      const gx=Math.round(cx+ca*(octR-0.2)), gz=Math.round(cz+sa*(octR-0.2));
      for(let i=0;i<7;i++){
        const w=Math.max(0, 3-i*0.5);
        for(let o=-Math.ceil(w);o<=Math.ceil(w);o++){
          const ox = Math.abs(ca)>Math.abs(sa) ? 0 : o;
          const oz = Math.abs(ca)>Math.abs(sa) ? o : 0;
          const X=gx+ox, Y=T+18+i, Z=gz+oz;
          set(X,Y,Z, CV(S1,X,Y,Z));
        }
      }
    } else {
      // 斜面：盲板
      px = Math.round(cx + ca*(octR-1.4)); pz = Math.round(cz + sa*(octR-1.4));
      box(px-1, T+5, pz-1, px+1, T+15, pz+1, C.ST4);
    }
    const va = a + Math.PI/8;
    pinnacle8(cx+Math.round(Math.cos(va)*(octR-0.6)),
              cz+Math.round(Math.sin(va)*(octR-0.6)), P.towOctTop, 2.2, 16, S1);
  }
  // 八角檐口
  for(let dz=-11;dz<=11;dz++) for(let dx=-11;dx<=11;dx++){
    const rr=rho(dx,dz);
    if(rr<=octR+1.2 && rr>octR-3.0){
      set(cx+dx,P.towOctTop+1,cz+dz,C.ST3);
      set(cx+dx,P.towOctTop+2,cz+dz,C.ST3);
    }
  }
  // 镂空尖顶 + 顶饰
  buildSpire(cx, cz, P.towOctTop+3, P.towSpireTop, 9.0, S1, 5);
  pinnacle8(cx, cz, P.towSpireTop, 2.0, 5, S1);
  set(cx, P.towSpireTop+6, cz, C.GOLD);
  for(const d of [-1,1]){ set(cx+d,P.towSpireTop+7,cz,C.GOLD); set(cx,P.towSpireTop+7,cz+d,C.GOLD); }
  set(cx, P.towSpireTop+8, cz, C.GOLD);
}

/* ---------- 八角镂空尖顶 ---------- */
function buildSpire(cx, cz, y0, y1, r0, mat, bandStep){
  const H = y1-y0;
  for(let y=y0; y<=y1; y++){
    const t=(y-y0)/Math.max(1,H);
    const r = r0*Math.pow(1-t, 0.82) + 0.45;
    const band = ((y-y0) % bandStep) < 2;
    const R = Math.ceil(r+2);
    for(let dz=-R;dz<=R;dz++) for(let dx=-R;dx<=R;dx++){
      const rr = rho(dx,dz);
      if(rr > r + 1.7) continue;
      const ang = Math.atan2(dz,dx);
      const k   = Math.round(ang/(Math.PI/4));
      const dev = Math.abs(ang - k*(Math.PI/4));
      const nFace = dev < 0.17;
      const nVert = dev > 0.31;
      let th = band ? 2.5 : (nVert ? 2.2 : (nFace ? 1.25 : 0));
      if(th <= 0) continue;
      const cr = (nVert && ((y-y0)%2===0)) ? 0.9 : 0;
      if(rr <= r+cr && rr > r-th) set(cx+dx, y, cz+dz, CV(mat,cx+dx,y,cz+dz));
    }
  }
  // 底部实心环 + 环上尖塔
  for(let y=y0; y<y0+5; y++){
    const t=(y-y0)/Math.max(1,H);
    const r = r0*Math.pow(1-t,0.82)+0.45;
    const R = Math.ceil(r+2);
    for(let dz=-R;dz<=R;dz++) for(let dx=-R;dx<=R;dx++){
      const rr=rho(dx,dz);
      if(rr<=r && rr>r-3) set(cx+dx,y,cz+dz, CV(mat,cx+dx,y,cz+dz));
    }
  }
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4 + Math.PI/8;
    pinnacle8(cx+Math.round(Math.cos(a)*(r0-0.7)),
              cz+Math.round(Math.sin(a)*(r0-0.7)), y0+5, 1.7, 13, mat);
  }
}

  uMoonC:{value:new THREE.Color(0x9fb8e0)},

const SKY = [
  { e:-1.00, zen:0x03050e, hor:0x070e22, sun:0x4a63a0, si:0.06, amb:0x161f3e, ai:0.22, hm:0.24, fog:0x0a1024 },
  { e:-0.18, zen:0x060b1e, hor:0x1b1c3e, sun:0x6f83c4, si:0.14, amb:0x1e2a50, ai:0.30, hm:0.32, fog:0x141a36 },
  { e: 0.00, zen:0x121a38, hor:0x9c4a34, sun:0xff7a38, si:0.42, amb:0x352f4c, ai:0.38, hm:0.42, fog:0x6b3a30 },
  { e: 0.14, zen:0x2a4c8c, hor:0xf0a25e, sun:0xffc070, si:1.35, amb:0x55607f, ai:0.44, hm:0.54, fog:0xc07a4c },
  { e: 0.42, zen:0x2f6cc0, hor:0xb8d6f2, sun:0xfff2d8, si:2.35, amb:0x7686a6, ai:0.50, hm:0.66, fog:0x9fb4cc },
  { e: 1.00, zen:0x1f5cb4, hor:0xc8e0f6, sun:0xfffaf0, si:2.75, amb:0x8392b0, ai:0.55, hm:0.74, fog:0xa6bcd4 }
];
const _cA=new THREE.Color(), _cB=new THREE.Color(), _cT=new THREE.Color();
function skyAt(e){
  e = Math.max(-1, Math.min(1, e));
  let i=0; while(i<SKY.length-2 && e>SKY[i+1].e) i++;
  const a=SKY[i], b=SKY[i+1];
  const t=(e-a.e)/((b.e-a.e)||1);
  const L = (ha,hb) => new THREE.Color().setHex(ha).lerp(_cT.setHex(hb), t);
  return { zen:L(a.zen,b.zen), hor:L(a.hor,b.hor), sun:L(a.sun,b.sun),
           amb:L(a.amb,b.amb), fog:L(a.fog,b.fog),
           si:a.si+(b.si-a.si)*t, ai:a.ai+(b.ai-a.ai)*t, hm:a.hm+(b.hm-a.hm)*t };
}
const _sv=new THREE.Vector3(), _sd=new THREE.Vector3(), _md=new THREE.Vector3(), _tmp=new THREE.Vector3();
const MOON_COL = new THREE.Color(0x8fa8d6);
function sunVector(hour){
  const th=(hour/24)*Math.PI*2 - Math.PI/2;
  return _sv.set(-0.45*Math.cos(th), Math.sin(th), 0.86*Math.cos(th)+0.22).normalize();
}
let dayFactor=1, nightFactor=0;
function applyTime(hour){
  const sv = sunVector(hour);
  const e = sv.y;
  const isNight = e < -0.03;
  _sd.copy(sv); _md.copy(sv).multiplyScalar(-1);
  const S = skyAt(e);

  skyU.uZen.value.copy(S.zen);
  skyU.uHor.value.copy(S.hor);
  skyU.uSunC.value.copy(S.sun);
  skyU.uSunD.value.copy(_sd);
  skyU.uSunI.value = Math.max(0, S.si);
  skyU.uMoonD.value.copy(_md);
  skyU.uMoonI.value = Math.max(0, 1 - Math.max(0,e)*5);

  const L = isNight ? _md : _sd;
  sun.position.copy(L).multiplyScalar(520).add(_tmp.set(0,50,0));
  sun.color.copy(isNight ? MOON_COL : S.sun);
  sun.intensity = isNight ? 0.42 : S.si;

  ambient.color.copy(S.amb); ambient.intensity = S.ai;
  hemi.intensity = S.hm;
  hemi.color.copy(S.zen).lerp(_cT.setHex(0xffffff), 0.32);
  hemi.groundColor.copy(S.hor).multiplyScalar(0.55);

  scene.fog.color.copy(S.fog);
  scene.fog.near = 330;
  scene.fog.far  = 1150 - Math.max(0,e)*100;
  renderer.setClearColor(S.fog);

  dayFactor   = THREE.MathUtils.smoothstep(e, -0.05, 0.30);
  nightFactor = 1 - dayFactor;

  for(const m of glassMats) m.emissiveIntensity = 0.06 + nightFactor*1.85;
  for(const m of goldMats)  m.emissiveIntensity = 0.10 + nightFactor*0.55;
  if(lampMat) lampMat.emissiveIntensity = 0.25 + nightFactor*1.5;
  stars.material.uniforms.uOpacity.value = Math.pow(nightFactor, 1.35)*0.95;
  for(const pl of portalLights) pl.intensity = nightFactor*180;

  document.getElementById('vTime').textContent =
    String(Math.floor(hour)).padStart(2,'0') + ':' +
    String(Math.floor((hour%1)*60)).padStart(2,'0');
}

/* =========================================================================
   7 · 体素 → InstancedMesh
   ========================================================================= */
const glassMats = [], goldMats = [];
let lampMat = null;

function buildMeshes(){
  const counts = new Uint32Array(256);
  for(let i=0;i<G.length;i++) counts[G[i]]++;
  const used = [];
  for(let c=1;c<256;c++) if(counts[c]) used.push(c);

  const bufs=new Map(), ptrs=new Map();
  for(const c of used){ bufs.set(c, new Int16Array(counts[c]*3)); ptrs.set(c,0); }
  for(let y=0;y<GH;y++) for(let z=0;z<GD;z++){
    const base=(y*GD+z)*GW;
    for(let x=0;x<GW;x++){
      const c=G[base+x]; if(!c) continue;
      const a=bufs.get(c); let p=ptrs.get(c);
      a[p]=x+XMIN; a[p+1]=y+YMIN; a[p+2]=z+ZMIN;
      ptrs.set(c,p+3);
    }
  }

  const geo=new THREE.BoxGeometry(1,1,1);
  const group=new THREE.Group();
  const warm=new THREE.Color(0xffb060);
  let total=0, tri=0;

  for(const c of used){
    const a=bufs.get(c), n=a.length/3;
    const d=MATDEF[c] || MATDEF[2];
    const mat=new THREE.MeshStandardMaterial({
      color:d.color, roughness:d.roughness, metalness:d.metalness||0,
      emissive:new THREE.Color(d.emis||0x000000), emissiveIntensity:0
    });
    if(d.glass){ mat.emissive.copy(new THREE.Color(d.color)).lerp(warm,0.34); glassMats.push(mat); }
    if(c===C.GOLD) goldMats.push(mat);
    if(c===C.LAMP){ lampMat = mat; mat.emissiveIntensity = 1; }

    const im=new THREE.InstancedMesh(geo, mat, n);
    const m4=new THREE.Matrix4();
    for(let i=0;i<n;i++){ m4.makeTranslation(a[i*3],a[i*3+1],a[i*3+2]); im.setMatrixAt(i,m4); }
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
    group.add(im);
    total += n; tri += n*12;
  }
  group.position.z = -70;
  scene.add(group);
  return { total, tri, meshes:group.children.length };
}

});

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   9 · 主循环
   ========================================================================= */
let last=performance.now(), fpsAcc=0, fpsN=0, fpsT=0, lowCnt=0;
const stFps=document.getElementById('stFps');

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.1,(now-last)/1000); last=now;

  if(playing){
    hour += dt*(24/cycleSec);
    if(hour>=24) hour-=24;
    sTime.value = Math.round(hour*60);
    applyTime(hour);
  }
  if(camAnim){
    const k=Math.min(1,(now-camAnim.t0)/camAnim.dur);
    const s = k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, s);
    controls.target.lerpVectors(camAnim.q0, camAnim.q1, s);
    if(k>=1) camAnim=null;
  }
  controls.update();
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){
    fpsT = Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0;
    stFps.textContent = fpsT;
    // 自动降质：持续低帧则关闭阴影
    if(fpsT>0 && fpsT<24){ if(++lowCnt>=6 && renderer.shadowMap.enabled){
        renderer.shadowMap.enabled=false; sun.castShadow=false;
        bShadow.classList.remove('on'); lowCnt=0;
        scene.traverse(o=>{ if(o.isInstancedMesh) o.material.needsUpdate=true; });
    }} else lowCnt=0;
  }
}

/* =========================================================================
   10 · 启动
   ========================================================================= */
function boot(){
  const t0=performance.now();
  buildCathedral();
  const t1=performance.now();
  const info=buildMeshes();
  const t2=performance.now();
  window.__booted = true;

  document.getElementById('stVox').textContent  = info.total.toLocaleString();
  document.getElementById('stMesh').textContent = info.meshes;
  document.getElementById('stTri').textContent  = (info.tri/1e6).toFixed(2)+'M';
  console.log(`[voxel] build ${(t1-t0).toFixed(0)}ms · mesh ${(t2-t1).toFixed(0)}ms · ${info.total} voxels`);

  sTime.value = Math.round(hour*60);
  applyTime(hour);
  const ld=document.getElementById('loading');
  ld.classList.add('hide');
  setTimeout(()=>ld.remove(), 800);
  requestAnimationFrame(animate);
}
setTimeout(boot, 60);

window.addEventListener('error', ev=>{
  const e=document.getElementById('err');
  if(e.style.display==='flex') return;
  e.style.display='flex';
  e.innerHTML='运行出错：'+(ev.message||'未知错误');
});
</script>
