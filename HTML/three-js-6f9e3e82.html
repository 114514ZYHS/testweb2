<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烟雨江南 · 宋明文人园林（听雨堂）</title>
<script src="./libs/tailwind.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0d10;color:#e8e4da;
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0}
  .panel{background:rgba(14,18,20,.52);backdrop-filter:blur(10px) saturate(120%);
    border:1px solid rgba(226,214,190,.16);border-radius:2px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
  .btn{font-size:12px;letter-spacing:.14em;padding:6px 10px;border:1px solid rgba(226,214,190,.22);
    background:rgba(255,255,255,.04);color:#e8e4da;transition:.25s;cursor:pointer;white-space:nowrap}
  .btn:hover{background:rgba(226,214,190,.16);border-color:rgba(226,214,190,.5)}
  .btn.on{background:rgba(206,168,96,.24);border-color:rgba(214,178,102,.7);color:#f6ecd6}
  .ver{writing-mode:vertical-rl;text-orientation:upright}
  .lbl{font-size:10px;letter-spacing:.22em;color:#b8ab90}
  input[type=range]{-webkit-appearance:none;height:2px;background:rgba(226,214,190,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;
    background:#d9b878;cursor:pointer;box-shadow:0 0 8px rgba(217,184,120,.6)}
  #load{position:fixed;inset:0;background:#0b0f12;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;z-index:99;transition:opacity 1.4s}
  #bar{width:200px;height:1px;background:rgba(226,214,190,.2);overflow:hidden}
  #barf{height:100%;width:0;background:#d9b878;transition:width .4s}
  .fade{animation:fade 2.6s ease forwards}
  @keyframes fade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
  #cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
    background:rgba(255,255,255,.5);display:none;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.8)}
</style>
<script type="importmap">
{"imports":{
  "three":"./libs/three/build/three.module.js",
  "three/addons/":"./libs/three/examples/jsm/"
}}
</script>

<body>
<canvas id="c"></canvas>
<div id="cross"></div>

<!-- 标题 -->
<div class="panel fade" style="position:fixed;left:22px;top:20px;padding:14px 18px;">
  <div style="font-size:11px;letter-spacing:.5em;color:#b8ab90">宋 明 江 南 · 私 家 园 林</div>
  <div style="font-size:26px;letter-spacing:.16em;margin-top:6px;color:#f3ecdc">听 雨 堂</div>
  <div style="font-size:11px;letter-spacing:.2em;margin-top:6px;color:#9c9职" id="tt"></div>
</div>

<!-- 控制 -->
<div class="panel fade" style="position:fixed;right:20px;bottom:20px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:min(92vw,760px)">
  <div style="display:flex;gap:6px">
    <button class="btn on" id="bDay">细雨白昼</button>
    <button class="btn" id="bNight">夜 · 灯火</button>
  </div>
  <div style="width:1px;height:26px;background:rgba(226,214,190,.18)"></div>
  <div style="display:flex;gap:6px">
    <button class="btn on" id="bOrbit">环绕赏景</button>
    <button class="btn" id="bFp">入室漫游</button>
  </div>
  <div style="width:1px;height:26px;background:rgba(226,214,190,.18)"></div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <span class="lbl">雨 · RAIN</span>
    <input type="range" id="rRain" min="0" max="1" step="0.01" value="1" style="width:110px">
  </div>
  <button class="btn" id="bRot">自动环绕</button>
  <button class="btn" id="bDoor">开合隔扇</button>
  <button class="btn" id="bInfo">◈ 说明</button>
</div>

<div class="panel" id="info" style="position:fixed;right:20px;bottom:96px;padding:16px 18px;width:330px;display:none;line-height:1.9;font-size:12px;color:#cfc7b4">
  <b style="color:#e9dfc6;letter-spacing:.2em">造 园 记</b><br>
  堂三间，抬梁木构、彻上明造：檐柱承檐檩，抱头梁搭金柱，五架梁上瓜柱承上金檩，三架梁上脊瓜柱承脊檩，椽望俱露。
  明间为堂屋，次间东作卧房、西作书斋，隔扇板壁分之。<br>
  <b style="color:#e9dfc6">环绕</b>：拖拽旋转 · 滚轮缩放<br>
  <b style="color:#e9dfc6">漫游</b>：W A S D 行走 · 拖动视线 · Shift 疾行 · E 隔扇<br>
  池水映檐，瓦口滴水，烟雨四时不歇。
</div>

<div id="load">
  <div style="font-size:12px;letter-spacing:.6em;color:#b8ab90">造 园 中</div>
  <div id="loadtx" style="font-size:13px;letter-spacing:.3em;color:#e8e4da">伐木采石…</div>
  <div id="bar"><div id="barf"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================ 基础工具 ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(9132761);
const rr=(a,b)=>a+(b-a)*rng(), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(rng()*a.length)];

const perm=new Uint8Array(512);{let s=77777;const R=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<256;i++){perm[i]=p[i];perm[i+256]=p[i];}}
const fade=t=>t*t*t*(t*(t*6-15)+10);
function pnoise(x,y){const X=Math.floor(x),Y=Math.floor(y);const xi=X&255,yi=Y&255;x-=X;y-=Y;
  const u=fade(x),v=fade(y);
  const g=(h,dx,dy)=>{switch(h&3){case 0:return dx+dy;case 1:return -dx+dy;case 2:return dx-dy;default:return -dx-dy;}};
  const a=perm[xi]+yi,b=perm[xi+1]+yi;
  const n0=lerp(g(perm[a],x,y),g(perm[b],x-1,y),u);
  const n1=lerp(g(perm[a+1],x,y-1),g(perm[b+1],x-1,y-1),u);
  return lerp(n0,n1,v)*0.72;}
function fbm(x,y,oct=3,gain=.5,lac=2.03){let a=1,f=1,s=0,n=0;for(let i=0;i<oct;i++){s+=a*pnoise(x*f,y*f);n+=a;a*=gain;f*=lac;}return s/n;}

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return{c,x:c.getContext('2d')};}
function T(c,{srgb=true,rep=[1,1],aniso=8}={}){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rep[0],rep[1]);t.anisotropy=aniso;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}
function normFromH(hc,str=1){const w=hc.width,h=hc.height;const src=hc.getContext('2d').getImageData(0,0,w,h).data;
  const o=cv(w,h),id=o.x.createImageData(w,h),d=id.data;
  const gv=(x,y)=>src[(((y+h)%h)*w+((x+w)%w))*4]/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(gv(x+1,y)-gv(x-1,y))*str,dy=(gv(x,y+1)-gv(x,y-1))*str;
    let nx=-dx,ny=-dy,nz=1;const l=Math.hypot(nx,ny,nz);
    const i=(y*w+x)*4;d[i]=(nx/l*.5+.5)*255;d[i+1]=(ny/l*.5+.5)*255;d[i+2]=(nz/l*.5+.5)*255;d[i+3]=255;}
  o.x.putImageData(id,0,0);return o.c;}

/* 逐像素贴图生成器 */
function pixTex(S,fn,{srgb=true,rep=[1,1],nstr=1.2,rough=null}={}){
  const a=cv(S,S),id=a.x.createImageData(S,S),d=id.data;
  const hcv=cv(S,S),hd=hcv.x.createImageData(S,S),hm=hd.data;
  const col=[0,0,0],ht=0;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S,v=y/S;const r=fn(u,v,x,y);col[0]=r[0];col[1]=r[1];col[2]=r[2];
    const i=(y*S+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
    hm[i]=r[3]!==undefined?r[3]*255:(col[0]+col[1]+col[2])/3;hm[i+1]=hm[i];hm[i+2]=hm[i];hm[i+3]=255;}
  a.x.putImageData(id,0,0);hcv.x.putImageData(hd,0,0);
  const map=T(a.c,{srgb,rep}),nrm=T(normFromH(hcv.c,nstr),{srgb:false,rep});
  let rgh=null;
  if(rough){const rc=cv(S,S),rd=rc.x.createImageData(S,S);
    for(let i=0;i<S*S;i++){const l=(d[i*4]+d[i*4+1]+d[i*4+2])/765;let v=lerp(rough[1],rough[0],clamp(l*rough[2]+rough[3],0,1));
      rd[i*4]=rd[i*4+1]=rd[i*4+2]=v*255;rd[i*4+3]=255;}
    rc.x.putImageData(rd,0,0);rgh=T(rc.c,{srgb:false,rep});}
  return{map,normalMap:nrm,roughnessMap:rgh};
}
const hex=h=>[(h>>16)&255,(h>>8)&255,h&255];
const mixc=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];

/* ============================ 渲染器 ============================ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',stencil:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x9db4bd,0.0135);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.05,500);
camera.position.set(19,12,24);

const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4,colorSpace:THREE.LinearSRGBColorSpace});
const composer=new EffectComposer(renderer,rt);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth*.5,innerHeight*.5),0.3,0.85,0.85);
composer.addPass(bloom);
const finalPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uExp:{value:1.05},uTime:{value:0},uVig:{value:1.0},uWarm:{value:0.5},uSat:{value:1.0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
  uniform sampler2D tDiffuse;uniform float uExp,uTime,uVig,uWarm,uSat;varying vec2 vUv;
  vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}
  float h21(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){
    vec3 c=texture2D(tDiffuse,vUv).rgb*uExp;
    c=aces(c);
    float l=dot(c,vec3(.2126,.7152,.0722));
    c=mix(vec3(l),c,uSat);
    c=mix(c,c*vec3(1.045,1.0,.955),uWarm);
    c=mix(c,c*vec3(.97,.99,1.04),1.-uWarm);
    float d=distance(vUv,vec2(.5,.46));
    c*=1.-uVig*0.55*smoothstep(.42,1.05,d);
    c=pow(max(c,0.),vec3(1./2.2));
    c+=(h21(vUv*vec2(1024.,768.)+fract(uTime))-.5)*0.022;
    gl_FragColor=vec4(c,1.);
  }`});
composer.addPass(finalPass);

/* ============================ 贴图 ============================ */
const TX={};
function makeTextures(){
  const S=512;
  /* 木料：杉木 / 深色硬木 / 老漆木 */
  TX.wood=(()=>{const tint=[...hex(0x9a7550)],dk=[...hex(0x4a3120)],lt=[...hex(0xc39a6d)];
    return pixTex(S,(u,v)=>{
      const w=fbm(v*2.2+4,u*9,3)*0.6;
      const ring=.5+.5*Math.sin((u*13+w*4.4)*6.283);
      let g=Math.pow(ring,1.7)*.78+.22*fbm(v*46,u*7,3);
      let c=mixc(dk,lt,g);
      c=mixc(c,tint,fbm(v*3,u*3,2)*.28);
      const edge=Math.min(v,1-v);if(edge<0.012){c=mixc(c,[26,18,12],1-edge/0.012);}
      const h=g*130+(edge<.02?0:70);
      return[c[0],c[1],c[2],h/255];
    },{rep:[1,1],nstr:2.2,rough:[.42,.72,1.1,.15]});})();
  TX.woodDark=(()=>{const dk=[...hex(0x2b1c12)],lt=[...hex(0x6d4a2d)];
    return pixTex(S,(u,v)=>{
      const w=fbm(v*2.5,u*8,3)*.7;
      const ring=.5+.5*Math.sin((u*17+w*5)*6.283);
      let g=Math.pow(ring,2.0)*.8+.2*fbm(v*52,u*6,3);
      let c=mixc(dk,lt,g);c=mixc(c,[...hex(0x8a5f33)],fbm(u*4,v*4,2)*.2);
      return[c[0],c[1],c[2],g*120/255+.3];
    },{rep:[1,1],nstr:2.4,rough:[.35,.6,1,.2]});})();
  TX.plank=(()=>{const dk=[...hex(0x5c4028)],lt=[...hex(0xa07c53)];
    const R=mulberry32(4242),pt=[];for(let i=0;i<7;i++)pt.push((R()-.5)*.5);
    return pixTex(S,(u,v)=>{
      const n=7,idx=Math.min(6,Math.floor(v*n)),ev=Math.min(v*n-idx,1-(v*n-idx));
      const w=fbm(u*3+pt[idx]*9,v*22,3)*.6;
      const ring=.5+.5*Math.sin((u*11+w*5)*6.283);
      let g=Math.pow(ring,1.6)*.75+.25*fbm(u*40,v*8,3);
      let c=mixc(dk,lt,g);c=mixc(c,dk,pt[idx]*.5+.25);
      if(ev<.05)c=mixc(c,[22,15,10],1-ev/.05);
      const wet=fbm(u*5+9,v*5,3);if(wet>.22)c=mixc(c,[...hex(0x3a2a1b)],sm(.22,.5,wet)*.65);
      return[c[0],c[1],c[2],(g*120+(ev<.06?0:60))/255];
    },{rep:[1,1],nstr:2.0,rough:[.3,.75,1.2,.1]});})();
  /* 青石板 */
  TX.stone=pixTex(S,(u,v)=>{
    const r=[[...hex(0x7c8280)],[...hex(0x59615f)],[...hex(0x8d938c)],[...hex(0x49514f)]];
    let n=fbm(u*7,v*7,4)*.5+.5;n=Math.pow(n,1.1);
    let c=mixc(r[1],r[2],n);
    c=mixc(c,r[3],fbm(u*17+3,v*17,3)*.4+.2);
    const sp=pnoise(u*220,v*220)*.5+.5;if(sp>.86)c=mixc(c,[150,152,146],(sp-.86)*3);
    const wet=fbm(u*3.2+11,v*3.2,3);c=mixc(c,[...hex(0x2f3735)],sm(.16,.55,wet)*.72);
    const cr=Math.abs(fbm(u*13,v*13,4));if(cr<.045)c=mixc(c,[38,42,40],1-cr/.045);
    const h=(n*90+sp*30+ (cr<.05?0:30))/255;
    return[c[0],c[1],c[2],h];
  },{rep:[1,1],nstr:2.6,rough:[.18,.85,1.3,.05]});
  /* 青砖 */
  TX.brick=pixTex(S,(u,v)=>{
    const bw=.333,bh=.16;const row=Math.floor(v/bh);const off=(row%2)*bw*.5;
    let cu=((u+off)%bw)/bw, cvv=(v%bh)/bh;
    const R=mulberry32(row*37+Math.floor((u+off)/bw));
    const t=R()*.5+.5;
    let c=mixc([...hex(0x5e686a)],[...hex(0x76797a)],t);
    c=mixc(c,[...hex(0x4b5254)],fbm(u*24,v*24,2)*.5);
    const mo=fbm(u*4,v*4+9,3);c=mixc(c,[...hex(0x4a5240)],sm(.2,.62,mo)*.55);
    let h=100;
    if(cu<.035||cvv<.05){c=mixc(c,[168,166,158],.75);h=30;}
    else h=lerp(h,70,fbm(u*30,v*30,2)*.5+.5);
    return[c[0],c[1],c[2],h/255];
  },{rep:[1,1],nstr:2.2,rough:[.4,.85,1,.15]});
  /* 粉墙 */
  TX.plaster=pixTex(S,(u,v)=>{
    let c=mixc([...hex(0xd8d4c6)],[...hex(0xbdb9aa)],fbm(u*6,v*6,4)*.5+.5);
    const st=fbm(u*2.2,v*9,3);c=mixc(c,[...hex(0x9a9a8e)],sm(.16,.6,st)*.4);
    const drip=fbm(u*26,v*3.4,3);if(drip>.2)c=mixc(c,[...hex(0x8e8e82)],sm(.2,.5,drip)*.35);
    c=mixc(c,[...hex(0x6f7364)],sm(.72,1,fbm(u*3.4+7,v*3.4,3))*.45);
    const cr=Math.abs(fbm(u*9+3,v*9,4));if(cr<.035)c=mixc(c,[110,110,102],1-cr/.035);
    return[c[0],c[1],c[2],lerp(150,200,fbm(u*20,v*20,2)*.5+.5)/255];
  },{rep:[1,1],nstr:1.5,rough:[.55,.9,1,.2]});
  /* 黛瓦 */
  TX.tile=pixTex(256,(u,v)=>{
    let c=mixc([...hex(0x3c4348)],[...hex(0x535c60)],fbm(u*8,v*8,3)*.5+.5);
    c=mixc(c,[...hex(0x2a3033)],fbm(u*30,v*6,2)*.4);
    c=mixc(c,[...hex(0x51603f)],sm(.6,1,fbm(u*3+5,v*3,3))*.5);
    return[c[0],c[1],c[2],lerp(90,160,fbm(u*14,v*14,2)*.5+.5)/255];
  },{rep:[1,1],nstr:1.6,rough:[.16,.6,1,.05]});
  /* 土 / 苔地 */
  TX.ground=pixTex(S,(u,v)=>{
    let c=mixc([...hex(0x4a4a34)],[...hex(0x5e5f42)],fbm(u*8,v*8,4)*.5+.5);
    c=mixc(c,[...hex(0x37402c)],sm(.1,.6,fbm(u*3.5,v*3.5,3))*.8);
    c=mixc(c,[...hex(0x6b6a52)],sm(.45,.9,fbm(u*11+4,v*11,3))*.4);
    c=mixc(c,[...hex(0x2f3a2c)],sm(.3,.85,fbm(u*2.1+9,v*2.1,3))*.6);
    return[c[0],c[1],c[2],lerp(120,190,fbm(u*18,v*18,2)*.5+.5)/255];
  },{rep:[14,10],nstr:2.2,rough:[.6,1,1,.1]});
  /* 纱纸 */
  TX.paper=pixTex(256,(u,v)=>{
    let c=mixc([...hex(0xf0e3c4)],[...hex(0xd8c69c)],fbm(u*20,v*20,3)*.5+.5);
    const f=Math.abs(fbm(u*40,v*5,2));c=mixc(c,[...hex(0xc7b28a)],sm(.18,.02,f)*.5);
    return[c[0],c[1],c[2],lerp(120,175,fbm(u*24,v*24,2)*.5+.5)/255];
  },{rep:[1,1],nstr:.8,rough:[.5,.85,1,.2]});
}

/* ---- 绘制类贴图（枝叶、水汽、光晕） ---- */
function drawTex(S,fn,{srgb=true}={}){const a=cv(S,S);fn(a.x,S);return T(a.c,{srgb});}
function leafTex(count,lw,lh,col1,col2,shape,seed){
  return drawTex(256,(x,S)=>{
    x.clearRect(0,0,S,S);const R=mulberry32(seed);
    for(let i=0;i<count;i++){
      const cx=R()*S,cy=R()*S,rot=(R()-.5)*3.0,sc=(.55+R()*.7)*S*0.09;

      #include <begin_vertex>

const POND=[[-3.4,1.4],[0.8,-0.7],[4.6,-0.9],[8.2,0.3],[10.8,2.3],[12.0,4.6],[11.6,6.4],
  [9.9,5.9],[8.2,5.2],[7.0,6.4],[6.4,9.4],[5.3,10.9],[5.7,12.6],[2.4,13.2],[2.0,11.5],
  [0.2,10.6],[-2.8,8.8],[-3.8,5.2]];
const GX0=-33,GX1=25,GZ0=-22,GZ1=24;
let reflector;
function shapeFrom(pts){const s=new THREE.Shape();
  pts.forEach((p,i)=>{const y=-p[1];i?s.lineTo(p[0],y):s.moveTo(p[0],y);});s.closePath();return s;}
function makeGround(){
  const sh=new THREE.Shape();sh.moveTo(GX0,-GZ1);sh.lineTo(GX1,-GZ1);sh.lineTo(GX1,-GZ0);sh.lineTo(GX0,-GZ0);sh.closePath();
  sh.holes.push(shapeFrom(POND));
  const g=new THREE.ShapeGeometry(sh,6);
  const p=g.attributes.position;const R=mulberry32(88);
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);
    let h=(fbm(x*.09+3,-y*.09,3)*.5+.5)*.22;
    const dEdge=Math.min(x-GX0,GX1-x,-y-GZ0,GZ1-(-y));
    if(dEdge<3)h*=sm(0,3,dEdge)*.8+.2;
    p.setZ(i,h*.35);}
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.ground);m.rotation.x=-Math.PI/2;m.receiveShadow=true;scene.add(m);
  // 池底
  const bed=new THREE.Mesh(new THREE.ShapeGeometry(shapeFrom(POND),6),M.waterBed);
  bed.rotation.x=-Math.PI/2;bed.position.y=-0.85;scene.add(bed);
  const wall=new THREE.Mesh(new THREE.ExtrudeGeometry(shapeFrom(POND),{depth:.9,bevelEnabled:false}),M.waterBed);
  wall.rotation.x=-Math.PI/2;wall.position.y=-0.02;scene.add(wall);
  // 池岸叠石
  const R2=mulberry32(3131);
  const rockGeo=BGU.mergeGeometries(Array.from({length:3},(_,k)=>{
    const g2=new THREE.IcosahedronGeometry(1,1);const q=g2.attributes.position;
    for(let i=0;i<q.count;i++){const x=q.getX(i),y=q.getY(i),z=q.getZ(i);
      const n=fbm(x*1.4+k,y*1.4+z*.7,3)*.34;
      q.setXYZ(i,x*(1+n),y*(1+n)*.72,z*(1+n));}
    g2.computeVertexNormals();return g2;}));
  const cnt=0;
  const N=POND.length*4;
  const bank=inst(rockGeo,M.rock,N);
  let idx=0;
  for(let i=0;i<POND.length;i++){
    const a=POND[i],b=POND[(i+1)%POND.length];
    const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),n=Math.ceil(len/0.75);
    for(let k=0;k<n;k++){const t=(k+R2())/n;
      let x=a[0]+dx*t,dz2=a[1]+dz*t;
      // 法向内缩
      const nx=-dz/len,nz=dx/len;
      const off=rr(-.15,.55);
      x+=nx*off;dz2+=nz*off;
      setI(bank,idx++,x,rr(-.18,.1),dz2,R2()*6.28,R2()*6.28,0,rr(.34,.72),rr(.3,.6),rr(.34,.7));}
  }
  bank.count=idx;scene.add(bank);
}
function makeWater(){
  const geo=new THREE.ShapeGeometry(shapeFrom(POND),8);
  reflector=new Reflector(geo,{clipBias:0.004,textureWidth:1024,textureHeight:1024,color:0x8d9a94});
  reflector.rotation.x=-Math.PI/2;reflector.position.y=-0.055;
  const mat=reflector.material;
  mat.uniforms.uTime=WT;mat.uniforms.uRain={value:1};
  mat.uniforms.uFogColor={value:new THREE.Color(0x9db4bd)};mat.uniforms.uFogDensity={value:0.0135};
  mat.uniforms.uLightDir={value:new THREE.Vector3(-.5,.7,.3)};mat.uniforms.uLightCol={value:new THREE.Color(0xfff1dd)};
  mat.uniforms.uDeep={value:new THREE.Color(0x2b3a30)};
  mat.vertexShader=mat.vertexShader.replace('void main() {','void main() {\n  vW=(modelMatrix*vec4(position,1.0)).xyz;\n  vVz=-(modelViewMatrix*vec4(position,1.0)).z;')
    .replace('varying vec4 vUv;','varying vec4 vUv;varying vec3 vW;varying float vVz;');
  mat.fragmentShader=`
    uniform vec3 color;uniform sampler2D tDiffuse;uniform float uTime,uRain,uFogDensity;
    uniform vec3 uFogColor,uLightDir,uLightCol,uDeep;
    varying vec4 vUv;varying vec3 vW;varying float vVz;
    float h21(vec2 p){return fract(sin(dot(p,vec2(23.1,71.7)))*43758.5453);}
    float rip(vec2 p,float rate,float sc){
      vec2 gp=p*sc;vec2 cell=floor(gp);vec2 fr=fract(gp)-0.5;
      float rn=h21(cell);float ph=fract(uTime*rate+rn);
      float r=length(fr);float rad=ph*0.52;
      float ring=smoothstep(rad,rad-0.09,r)*smoothstep(rad-0.16,rad-0.06,r);
      return ring*(1.0-ph)*(1.0-ph);}
    void main(){
      vec2 uv=vUv.xy/vUv.w;
      float t=uTime;
      vec2 p=vW.xz;
      float s1=sin(p.x*2.3+t*1.1)*.5+sin(p.y*1.9-t*.8)*.5+sin((p.x+p.y)*3.1+t*1.6)*.3;
      float s2=sin(p.x*5.7-t*2.2)*.5+sin(p.y*6.3+t*1.9)*.5;
      float r1=rip(p,1.05,7.0)*uRain, r2=rip(p,0.8,13.0)*uRain;
      vec2 dist=vec2(s1*0.9+s2*0.5, s1*0.6-s2*0.7)*0.0032 + vec2(r1,r2)*0.010*vec2(1.0,-1.0);
      vec4 base=texture2D(tDiffuse,uv+dist);
      vec3 refl=mix(base.rgb*1.0,base.rgb*0.55+vec3(.03,.05,.04),0.35);
      vec3 nrm=normalize(vec3(s1*0.09+s2*0.05+r1*0.5, 1.0, s2*0.07-r1*0.4));
      vec3 V=normalize(cameraPosition-vW);
      vec3 L=normalize(uLightDir);
      vec3 H=normalize(V+L);
      float spec=pow(max(dot(nrm,H),0.0),180.0)*1.4;
      float fres=pow(1.0-max(dot(nrm,V),0.0),3.4);
      vec3 col=mix(uDeep,refl,clamp(fres*1.5+0.28,0.0,1.0));
      col+=uLightCol*spec*(0.35+0.65*fres);
      col+=uLightCol*0.12*(r1+r2)*fres;
      float f=1.0-exp(-pow(uFogDensity*vVz,2.0));
      col=mix(col,uFogColor,f);
      gl_FragColor=vec4(col,1.0);
    }`;
  mat.needsUpdate=true;
  scene.add(reflector);
}

function updateFP(dt){
  const sp=(keys.ShiftLeft||keys.ShiftRight?3.4:1.55);
  const f=new THREE.Vector3(-Math.sin(FP.yaw),0,-Math.cos(FP.yaw));
  const r=new THREE.Vector3(Math.cos(FP.yaw),0,-Math.sin(FP.yaw));
  const mv=new THREE.Vector3();
  if(keys.KeyW||keys.ArrowUp)mv.add(f);if(keys.KeyS||keys.ArrowDown)mv.sub(f);
  if(keys.KeyD||keys.ArrowRight)mv.add(r);if(keys.KeyA||keys.ArrowLeft)mv.sub(r);
  if(mv.lengthSq()>0){mv.normalize();
    let nx=FP.pos.x+mv.x*sp*dt, nz=FP.pos.z+mv.z*sp*dt;
    if(!blocked(nx,FP.pos.z))FP.pos.x=nx;
    if(!blocked(FP.pos.x,nz))FP.pos.z=nz;
    FP.bob+=dt*sp*2.6;}
  const gy=groundY(FP.pos.x,FP.pos.z);
  const targetY=gy+1.62+Math.sin(FP.bob)*0.018;
  FP.pos.y+=(targetY-FP.pos.y)*Math.min(1,dt*7);
  camera.position.copy(FP.pos);

}

        if(y<0){y=rr(16,26);p[i*6]=ox+rr(-22,22);p[i*6+2]=oz+rr(-18,18);}

  /* 水汽漂移 */
  for(const m of mists){const u=m.userData;
    m.position.x+=Math.sin(WT.value*u.sp+u.ph)*dt*0.55+dt*u.sp*0.6;
    m.position.z+=Math.cos(WT.value*u.sp*0.7+u.ph)*dt*0.35;

  /* 檐滴 */
  if(drips.data){
    const rp=drips.points.geometry.attributes.position.array;
    const kd=lerp(.35,.55,ST.t)*rainAmt+0.12;
    for(let i=0;i<drips.data.length;i++){const d=drips.data[i];
      d.t+=dt*d.v*0.35*(0.5+kd);
      if(d.t>=1){d.t=0;d.p=EAVE_PTS[Math.floor(rng()*EAVE_PTS.length)]||d.p;}
      const y=d.p[1]-d.t*d.t*3.6;
      rp[i*3]=d.p[0]+d.t*0.03;rp[i*3+1]=y;rp[i*3+2]=d.p[2];

    for(let i=0;i<drips.data.length&&i<64;i++){const d=drips.data[i];
      const t=d.t, y0=d.p[1]-3.6;
      if(t>.97){const k=(t-.97)/0.03;setI(drips.rings,i,d.p[0],0.03,d.p[2],-1.5708,0,0,1+k*9,1+k*9,1);
        drips.rings.setColorAt(i,new THREE.Color(0xdfeef4).multiplyScalar((1-k)*0.5));}
      else setI(drips.rings,i,0,-99,0);}
    drips.rings.instanceMatrix.needsUpdate=true;
    if(drips.rings.instanceColor)drips.rings.instanceColor.needsUpdate=true;
  }
  /* 香烟 */
  if(smokes.length){const s0=smokes.src;
    smokes.forEach((s,i)=>{const ph=(WT.value*0.13+s.userData.ph)%1;
      s.position.set(s0.x+Math.sin(ph*9+i)*0.07*ph*4,s0.y+ph*1.5,s0.z+Math.cos(ph*7+i)*0.06*ph*4);
      s.scale.setScalar(0.14+ph*0.5);
      s.material.opacity=(1-ph)*0.14*ph*3;});}
  /* 隔扇动画 */
  if(typeof updateDoors==='function')updateDoors(dt);
  /* 摇曳植物 */

  requestAnimationFrame(animate);
}

function makeLattice(w,h,o={}){
  const cell=o.cell||0.115,bw=o.bw||0.018,t=o.t||0.032;
  const parts=[];
  const add=(x,y,W,Hh)=>{const g=new THREE.BoxGeometry(W,Hh,t);g.translate(x,y,0);parts.push(g);};
  if(o.type==='liu'){ // 柳条格：竖条为主
    const n=Math.max(2,Math.round(w/0.075));
    for(let i=0;i<=n;i++)add(-w/2+i*w/n,0,bw*0.72,h);
    add(0,h/2-0.02,w,bw*0.8);add(0,-h/2+0.02,w,bw*0.8);
    add(0,0,w*0.9,bw*0.42);
  }else{ // 方格眼 / 纱
    const c=o.cell||cell;
    const nx=Math.max(1,Math.round(w/c)),ny=Math.max(1,Math.round(h/(c*1.18)));
    for(let i=0;i<=nx;i++)add(-w/2+i*w/nx,0,bw,h);
    for(let j=0;j<=ny;j++)add(0,-h/2+j*h/ny,w,bw*0.9);
  }
  return BGU.mergeGeometries(parts);
}

function glyph(ctx,x,y,s,R){
  const n=4+Math.floor(R()*5);ctx.lineWidth=s*0.075;ctx.lineCap='round';
  for(let i=0;i<n;i++){ctx.beginPath();
    const px=x+(R()-.5)*s*.8,py=y+(R()-.5)*s*.8;
    ctx.moveTo(px,py);
    const t=R();if(t<.5)ctx.lineTo(px+(R()-.5)*s*.7,py+(R()-.5)*s*.7);
    else if(t<.8){ctx.lineTo(px+s*.1,py+s*.28);ctx.lineTo(px-s*.12,py+s*.34);}
    else{ctx.quadraticCurveTo(px+(R()-.5)*s,py+s*.3,px+(R()-.5)*s*.6,py+s*.3);}
    ctx.stroke();}
  if(R()>.4){ctx.beginPath();ctx.arc(x+(R()-.5)*s*.6,y+(R()-.5)*s*.6,s*.14,0,7);ctx.stroke();}}

function curvedRoof(curve,halfW,rise,yBase,steps,tileStep,PAR,PMAT){
  PAR=PAR||scene;PMAT=PMAT||new THREE.Matrix4();
  const cross=[];const nc=9;
  for(let j=0;j<=nc;j++){const u=j/nc*2-1;cross.push({u:u*halfW,y:rise*(1-u*u)+ (Math.abs(u)>.8?(Math.abs(u)-.8)*.5:0)});}
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=steps;i++){const t=i/steps;const P=curve.getPoint(t);const T=curve.getTangent(t);
    const N=new THREE.Vector3(-T.z,0,T.x).normalize();
    for(let j=0;j<=nc;j++){const c=cross[j];
      pos.push(P.x+N.x*c.u,yBase+c.y,P.z+N.z*c.u);uv.push(i*0.5,j/nc);}}
  for(let i=0;i<steps;i++)for(let j=0;j<nc;j++){
    const a=i*(nc+1)+j,b=a+1,c2=a+nc+1,d2=c2+1;idx.push(a,c2,b,b,c2,d2);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const deck=new THREE.Mesh(g,M.tile);deck.castShadow=true;deck.receiveShadow=true;PAR.add(deck);
  /* 筒瓦 */
  const len=curve.getLength();const nt=Math.max(2,Math.round(len/tileStep));
  const maxInst=nt*(nc)*2+8;
  const tl=inst(new THREE.CylinderGeometry(.078,.078,1,7,1,false),M.tile,Math.max(100,maxInst));
  let k=0;
  for(let i=0;i<nt;i++){const t=i/nt;const P=curve.getPoint(t);const T=curve.getTangent(t);
    const N=new THREE.Vector3(-T.z,0,T.x).normalize();
    for(let j=0;j<nc;j++){const c1=cross[j],c2=cross[j+1];
      const du=c2.u-c1.u,dy=c2.y-c1.y,L=Math.hypot(du,dy);
      if(L<0.02)continue;
      const d=new THREE.Vector3(N.x*du,dy,N.z*du).normalize();
      const q=new THREE.Quaternion().setFromUnitVectors(_up,d);
      setIQ(tl,k++,P.x+N.x*(c1.u+c2.u)/2,yBase+(c1.y+c2.y)/2,P.z+N.z*(c1.u+c2.u)/2,q,1,L*1.1,1);}}
  tl.count=k;PAR.add(tl);
  /* 檐口滴水 */
  const ed=inst(new THREE.CylinderGeometry(.085,.085,.06,8),M.tile,nt*2+8);let e=0;
  for(const jj of [0,nc]){const c=cross[jj];
    for(let i=0;i<nt;i++){const t=i/nt;const P=curve.getPoint(t);const T=curve.getTangent(t);
      const N=new THREE.Vector3(-T.z,0,T.x).normalize();
      setI(ed,e++,P.x+N.x*c.u,yBase+c.y,P.z+N.z*c.u);
      if(i%3===0)EAVE_PTS.push(new THREE.Vector3(P.x+N.x*c.u,yBase+c.y+0.02,P.z+N.z*c.u).applyMatrix4(PMAT));}}
  ed.count=e;PAR.add(ed);
  return deck;}
function walkway(pts,w,withRoof=true,colMat=M.plank){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const len=curve.getLength();const n=Math.max(3,Math.round(len/1.8));
  /* 地面 */
  const fl=[];const fuv=[];const fi=[];
  for(let i=0;i<=n;i++){const t=i/n;const P=curve.getPoint(t);const T=curve.getTangent(t);
    const N=new THREE.Vector3(-T.z,0,T.x).normalize();
    fl.push(P.x+N.x*w/2,P.y+0.06,P.z+N.z*w/2, P.x-N.x*w/2,P.y+0.06,P.z-N.z*w/2);
    fuv.push(t*len*0.6,0,t*len*0.6,1);}
  for(let i=0;i<n;i++){const a=i*2;fi.push(a,a+1,a+2,a+1,a+3,a+2);}
  const fg=new THREE.BufferGeometry();
  fg.setAttribute('position',new THREE.Float32BufferAttribute(fl,3));
  fg.setAttribute('uv',new THREE.Float32BufferAttribute(fuv,2));
  fg.setIndex(fi);fg.computeVertexNormals();
  const fm=new THREE.Mesh(fg,colMat);fm.receiveShadow=true;fm.castShadow=true;scene.add(fm);
  /* 柱 + 栏杆 */
  const ci=inst(new THREE.CylinderGeometry(.085,.095,1,10),M.woodDark,(n+1)*2);
  const rail=[];const rb=new THREE.BoxGeometry(1,.07,.09);
  for(let i=0;i<=n;i++){const t=i/n;const P=curve.getPoint(t);const T=curve.getTangent(t);
    const N=new THREE.Vector3(-T.z,0,T.x).normalize();
    const y0=0.06;
    setI(ci,i*2,P.x+N.x*w/2,y0+1.17,P.z+N.z*w/2,0,0,0,1,2.34,1);
    setI(ci,i*2+1,P.x-N.x*w/2,y0+1.17,P.z-N.z*w/2,0,0,0,1,2.34,1);
    rail.push({t,N,P});}
  scene.add(ci);
  const bl=inst(new THREE.BoxGeometry(.06,.5,.06),M.woodDark,(n+1)*2);
  for(let i=0;i<=n;i++){const r=rail[i];const y0=0.06;
    setI(bl,i*2,r.P.x+r.N.x*(w/2-.06),y0+.32,r.P.z+r.N.z*(w/2-.06));
    setI(bl,i*2+1,r.P.x-r.N.x*(w/2-.06),y0+.32,r.P.z-r.N.z*(w/2-.06));}
  scene.add(bl);
  for(const s of [1,-1]){
    const pos=[],uv=[],ind=[];
    for(let i=0;i<=n;i++){const r=rail[i];const q=s*r.N;
      pos.push(r.P.x+q.x*(w/2),0.62,r.P.z+q.z*(w/2), r.P.x+q.x*(w/2-.03),0.62,r.P.z+q.z*(w/2-.03));}
    for(let i=0;i<n;i++){const a=i*2;ind.push(a,a+1,a+2,a+1,a+3,a+2);}
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setIndex(ind);g.computeVertexNormals();
    const m=new THREE.Mesh(g,M.wood);m.castShadow=true;scene.add(m);}
  if(withRoof)curvedRoof(curve,w/2+.5,.52,2.36,n*3,0.21);
  /* 可行走 */
  for(let i=0;i<=n*2;i++){const t=i/(n*2);const P=curve.getPoint(t);
    addCol(P.x-w/2-.1,P.z-w/2-.1,P.x+w/2+.1,P.z+w/2+.1,true);
    ZONES.push({inv:new THREE.Matrix4(),cx:P.x,cz:P.z,hx:w/2+.1,hz:w/2+.1,y:0.08});}
  return curve;}

function wallSeg(x0,z0,x1,z1,h=2.6,gateX=null){

  body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);

  base.position.y=0.14;g.add(base);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.14,len+0.3),M.tile);
  cap.position.y=h+0.07;cap.castShadow=true;g.add(cap);
  const nt=Math.floor(len/0.2);
  const tl=inst(new THREE.CylinderGeometry(.088,.088,0.24,7),M.tile,nt+2);
  for(let i=0;i<=nt;i++)setI(tl,i,0,h+0.16,-len/2+i*(len/nt),Math.PI/2,0,0);
  scene.add(tl);
  addCol(Math.min(x0,x1)-0.2,Math.min(z0,z1)-0.2,Math.max(x0,x1)+0.2,Math.max(z0,z1)+0.2);

function moonGate(x,z,h=3.3,r=1.45,w=7){

  sh.holes.push(hole);

  const m=new THREE.Mesh(geo,M.plaster);m.castShadow=true;m.receiveShadow=true;g.add(m);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r+0.06,0.075,7,34),M.stoneDk);

  for(let i=0;i<nt;i++)setI(tl,i,-w/2-0.2+i*0.2,h+0.18,0,Math.PI/2,0,0);
  g.add(tl);
  addCol(x-w/2,z-0.25,x-w/2-1.0,z+0.25);addCol(x-w/2,z-0.25,x-w/2,z+0.25);
  addCol(x-w/2-1.2,z-0.25,x+w/2+1.2,z+0.25);

function stonePath(pts,w=0.95,seed=7){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const len=curve.getLength();const n=Math.round(len/0.62);

  for(let i=0;i<n;i++){const t=(i+0.5)/n;const P=curve.getPoint(t);const T=curve.getTangent(t);
    const sw=w*(0.7+R()*0.5),sd=0.55+R()*0.2;
    const a=Math.atan2(T.x,T.z);
    setI(im,i,P.x,groundY(P.x,P.z)+0.03,P.z,0,a+ (R()-.5)*.2,0,sw,1,sd);
    if(R()<.5)mossPatch(P.x+(R()-.5)*w*.8,groundY(P.x,P.z)+0.09,P.z+(R()-.5)*w*.8,.4+R()*.5,R()*3);}
  scene.add(im);}

  for(const s of [1,-1]){

     ZONES.push({inv:new THREE.Matrix4(),cx:x0+dx*t,cz:z0+dz*t,hx:.8,hz:.8,y:0.62});}}
