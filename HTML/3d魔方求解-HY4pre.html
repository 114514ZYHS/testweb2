<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>魔方 · CFOP / 桥式解法演示</title>
<style>
  :root{
    --ink:#1b1d24; --ink2:#5a6175; --ink3:#8a91a6;
    --bg1:#f6f8fd; --bg2:#e7edfa; --card:#fff; --line:#e8ebf4;
    --accent:#5b6cff; --accent2:#ff5f9e; --accent3:#22c1a4;
    --shadow:0 10px 30px rgba(60,72,120,.10), 0 2px 6px rgba(60,72,120,.06);
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 78% 12%, #ffffff 0%, rgba(255,255,255,0) 60%),
      radial-gradient(900px 600px at 8% 92%, #e6ecff 0%, rgba(230,236,255,0) 62%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow:hidden;
  }
  #app{display:flex;height:100%;width:100%}

  /* ---------------- 侧栏 ---------------- */
  #panel{
    width:352px;flex:0 0 352px;height:100%;display:flex;flex-direction:column;gap:12px;
    padding:16px 14px 14px;overflow:hidden;
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .brand{padding:14px 16px 13px;position:relative;overflow:hidden}
  .brand:after{content:"";position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;
    background:linear-gradient(135deg,rgba(91,108,255,.16),rgba(255,95,158,.14))}
  .brand h1{margin:0;font-size:19px;letter-spacing:.5px}
  .brand p{margin:5px 0 0;font-size:12px;color:var(--ink3)}

  .sec{padding:12px 14px}
  .sec-t{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1.4px;margin:0 0 9px}

  .seg{display:flex;background:#f1f3fa;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:13px;
    color:var(--ink2);cursor:pointer;font-weight:600;transition:.18s;font-family:inherit}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(60,72,120,.12)}
  .seg small{display:block;font-size:10px;font-weight:500;color:var(--ink3);margin-top:2px}
  .seg button.on small{color:#9aa3c6}

  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 6px;border-radius:12px;
    font-size:13px;font-weight:600;cursor:pointer;transition:.16s;font-family:inherit}
  .btn:hover{border-color:#cfd6ee;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#7b6bff);color:#fff;border-color:transparent;
    box-shadow:0 6px 16px rgba(91,108,255,.32)}
  .btn.wide{grid-column:span 3}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .row{display:flex;gap:8px}
  .row .btn{flex:1}
  .speed{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:12px;color:var(--ink2)}
  .speed input{flex:1;accent-color:var(--accent)}

  .bar{height:7px;background:#eef0f8;border-radius:99px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .18s}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:7px}
  .meta b{color:var(--ink2);font-weight:600}

  #steps{flex:1;overflow-y:auto;padding:12px 10px 12px 12px}
  #steps::-webkit-scrollbar{width:8px}
  #steps::-webkit-scrollbar-thumb{background:#dfe3f0;border-radius:99px}
  .empty{color:var(--ink3);font-size:12.5px;line-height:1.75;padding:6px 4px}
  .stage{margin-bottom:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
  .stage.now{border-color:#b9c1ff;box-shadow:0 4px 14px rgba(91,108,255,.14)}
  .stage.done{opacity:.62}
  .stage-h{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#fafbff;cursor:pointer;
    border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
  .stage.done .stage-h{background:#f6f8fc}
  .stage-h .dot{width:7px;height:7px;border-radius:50%;background:#d3d8e8;flex:0 0 auto}
  .stage.now .stage-h .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(91,108,255,.16)}
  .stage.done .stage-h .dot{background:var(--accent3)}
  .stage-h .n{margin-left:auto;font-weight:600;color:var(--ink3);font-size:11px}
  .moves{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px}
  .mv{min-width:30px;padding:4px 7px;border-radius:8px;background:#f2f4fb;font-size:12px;font-weight:700;
    color:var(--ink2);text-align:center;cursor:pointer;transition:.14s;border:1px solid transparent}
  .mv:hover{background:#e6ebfa}
  .mv.past{color:#b9c0d4;background:#f7f8fc}
  .mv.cur{background:linear-gradient(135deg,var(--accent),#7b6bff);color:#fff;
    box-shadow:0 4px 10px rgba(91,108,255,.35);transform:translateY(-1px)}
  .mv b{font-weight:700}

  .tip{font-size:11.5px;color:var(--ink3);line-height:1.85;padding:10px 13px}
  .tip kbd{background:#f1f3fa;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
    padding:1px 5px;font-size:10.5px;font-family:inherit;color:var(--ink2)}

  /* ---------------- 舞台 ---------------- */
  #main{flex:1;position:relative;min-width:0}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl.dragging{cursor:grabbing}
  #gl.turning{cursor:crosshair}

  .hud{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .pill{background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);
    border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:8px}
  .pill .k{color:var(--ink3);font-weight:500}
  .pill.big{font-size:14px}
  .pill .tag{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:99px;
    padding:2px 9px;font-size:11px}

  #legend{position:absolute;right:18px;top:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);
    font-size:11.5px;color:var(--ink2);display:grid;grid-template-columns:auto auto;gap:5px 10px;align-items:center}
  #legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1.5px solid rgba(0,0,0,.22)}

  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(27,29,36,.9);color:#fff;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;
    opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:rgba(246,248,253,.72);backdrop-filter:blur(3px)}
  #busy.on{display:flex}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid #dde1ef;border-top-color:var(--accent);
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #busy p{margin:0;font-size:13px;color:var(--ink2);font-weight:600}

  @media (max-width:900px){
    #app{flex-direction:column-reverse}
    #panel{width:100%;flex:0 0 auto;height:auto;max-height:52%;padding:10px}
    #main{flex:1 1 48%}
    .brand{padding:11px 14px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="card brand">
      <h1>魔方解法演示台</h1>
      <p>三阶 · 动漫卡线渲染 · 支持 CFOP 与桥式(Roux)</p>
    </div>

    <div class="card sec">
      <p class="sec-t">解法</p>
      <div class="seg" id="segMethod">
        <button class="on" data-method="CFOP">CFOP<small>十字→F2L→OLL→PLL</small></button>
        <button data-method="Roux">桥式 Roux<small>左块→右块→CMLL→LSE</small></button>
      </div>
    </div>

    <div class="card sec">
      <p class="sec-t">操作</p>
      <div class="btns">
        <button class="btn primary wide" id="btnSolve">求 解</button>
        <button class="btn" id="btnScramble">打乱</button>
        <button class="btn" id="btnReset">复原</button>
        <button class="btn primary" id="btnSpin">自动旋转</button>
      </div>
    </div>

    <div class="card sec">
      <p class="sec-t">分步演示</p>
      <div class="row">
        <button class="btn" id="btnPrev">◀ 上一步</button>
        <button class="btn" id="btnPlay">▶ 播放</button>
        <button class="btn" id="btnNext">下一步 ▶</button>
      </div>
      <label class="speed">速度<input type="range" id="speed" min="1" max="10" step="1" value="5"></label>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="meta"><span>步骤 <b id="stepText">0 / 0</b></span><span id="stageText">—</span></div>
    </div>

    <div class="card" id="steps">
      <div class="empty" id="stepsEmpty">
        尚未求解。<br>· 点「打乱」随机打乱，或直接手动拖动魔方表面转动任意层；<br>· 点「求解」后即可在这里看到分步还原过程，并随时播放 / 单步 / 跳转。
      </div>
    </div>

    <div class="card tip">
      拖动<b>方块表面</b>转动该层 · 拖动<b>空白背景</b>旋转视角 · 滚轮缩放<br>
      快捷键：<kbd>空格</kbd>播放/暂停 <kbd>←</kbd><kbd>→</kbd>单步 <kbd>S</kbd>打乱 <kbd>R</kbd>复原
    </div>
  </aside>

  <main id="main">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div class="pill big"><span class="tag" id="hudMethod">CFOP</span><span id="hudStage">未求解</span></div>
      <div class="pill"><span class="k">状态</span><span id="hudState">已还原</span></div>
    </div>
    <div id="legend"></div>
    <div id="toast"></div>
    <div id="busy"><div class="spin"></div><p id="busyText">正在构建解法查找表…</p></div>
  </main>
</div>
<script>
/* =========================================================================
 * cube.js — 三阶魔方内核 + CFOP / 桥式(Roux) 求解器
 * 纯 JS，无依赖，可在 Node 与浏览器中运行。
 *
 * 状态表示：st[piece] = 该块当前旋转编号(0..23)，位置由旋转唯一决定。
 * 中心块：只记录所在面，忽略自转（视觉不可见），因此中心块取值 0..5。
 * ========================================================================= */
const CubeCore = (function () {
  'use strict';

  /* ---------------------------------------------------------------- 矩阵 */
  function rotMat(axis, q) {
    const c = [1, 0, -1, 0][q & 3], s = [0, 1, 0, -1][q & 3];
    if (axis === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
    if (axis === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
    return [c, -s, 0, s, c, 0, 0, 0, 1];
  }
  function matMul(a, b) {
    const r = new Array(9);
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    return r;
  }
  function matVec(m, v) {
    return [
      m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
      m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
      m[6] * v[0] + m[7] * v[1] + m[8] * v[2],
    ];
  }

  /* ------------------------------------------------- 24 个合法旋转枚举 */
  const ROTS = [];
  const ROT_INDEX = new Map();
  (function () {
    const gens = [rotMat(0, 1), rotMat(1, 1), rotMat(2, 1)];
    ROTS.push([1, 0, 0, 0, 1, 0, 0, 0, 1]);
    ROT_INDEX.set('1,0,0,0,1,0,0,0,1', 0);
    for (let head = 0; head < ROTS.length; head++) {
      const a = ROTS[head];
      for (let g = 0; g < 3; g++) {
        const m = matMul(gens[g], a);
        const k = m.join(',');
        if (!ROT_INDEX.has(k)) { ROT_INDEX.set(k, ROTS.length); ROTS.push(m); }
      }
    }
  })();
  const NROT = ROTS.length; // 24
  const MUL = new Uint8Array(NROT * NROT);
  for (let a = 0; a < NROT; a++)
    for (let b = 0; b < NROT; b++)
      MUL[a * NROT + b] = ROT_INDEX.get(matMul(ROTS[a], ROTS[b]).join(','));

  /* ------------------------------------------------------------ 26 个块 */
  const cubies = [];
  for (let x = -1; x <= 1; x++)
    for (let y = -1; y <= 1; y++)
      for (let z = -1; z <= 1; z++)
        if (x || y || z) cubies.push({ id: cubies.length, home: [x, y, z] });
  const NC = cubies.length; // 26
  const ID_AT = new Int8Array(27).fill(-1);
  const slotKey = (v) => (v[0] + 1) * 9 + (v[1] + 1) * 3 + (v[2] + 1);
  for (const c of cubies) ID_AT[slotKey(c.home)] = c.id;
  const idAt = (x, y, z) => ID_AT[(x + 1) * 9 + (y + 1) * 3 + (z + 1)];

  const AX = { X: 0, Y: 1, Z: 2 };
  const AXIS_VEC = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];

  function kindOf(p) {
    const h = cubies[p].home;
    const n = Math.abs(h[0]) + Math.abs(h[1]) + Math.abs(h[2]);
    return n === 1 ? 'center' : n === 2 ? 'edge' : 'corner';
  }
  const KIND = cubies.map((c) => kindOf(c.id));
  const STICKER_AXES = cubies.map((c) => {
    const out = [];
    for (let a = 0; a < 3; a++) if (c.home[a] !== 0) out.push({ axis: a, sign: c.home[a] > 0 ? 1 : -1 });
    return out;
  });

  const POS = []; // POS[p][rot] = 位置(槽位 id)
  for (let p = 0; p < NC; p++) {
    const arr = new Int8Array(NROT);
    for (let r = 0; r < NROT; r++) {
      const v = matVec(ROTS[r], cubies[p].home);
      arr[r] = idAt(v[0], v[1], v[2]);
    }
    POS.push(arr);
  }

  // 中心块：只保留“位置”信息（同一槽位的多种自转归一）
  const CANON = [];
  for (let p = 0; p < NC; p++) {
    const arr = new Uint8Array(NROT);
    if (KIND[p] === 'center') {
      const rep = new Int8Array(NC).fill(-1);
      for (let r = 0; r < NROT; r++) { const s = POS[p][r]; if (rep[s] < 0) rep[s] = r; }
      for (let r = 0; r < NROT; r++) arr[r] = rep[POS[p][r]];
    } else for (let r = 0; r < NROT; r++) arr[r] = r;
    CANON.push(arr);
  }

  /* ------------------------------------------------------------ 转动定义 */
  const MOVES = [];
  const MOVE_BY_NAME = Object.create(null);
  function defMove(name, axis, layer, q) {
    const rot = ROT_INDEX.get(rotMat(axis, q).join(','));
    const idx = MOVES.length;
    MOVES.push({ idx, name, axis, layer, q, rot, inv: -1, base: -1, pow: 1 });
    MOVE_BY_NAME[name] = idx;
    return idx;
  }
  const BASE_DEFS = [
    ['U', AX.Y, 1, -1], ['D', AX.Y, -1, 1],
    ['F', AX.Z, 1, -1], ['B', AX.Z, -1, 1],
    ['R', AX.X, 1, -1], ['L', AX.X, -1, 1],
    ['M', AX.X, 0, 1], ['S', AX.Z, 0, -1], ['E', AX.Y, 0, 1],
  ];
  for (const [n, a, l, q] of BASE_DEFS) {
    const i0 = defMove(n, a, l, (q + 4) % 4);
    const i1 = defMove(n + "'", a, l, (q * 3 + 4) % 4);
    const i2 = defMove(n + '2', a, l, 2);
    MOVES[i0].inv = i1; MOVES[i1].inv = i0; MOVES[i2].inv = i2;
    MOVES[i0].base = i0; MOVES[i1].base = i0; MOVES[i2].base = i0;
    MOVES[i0].pow = 1; MOVES[i1].pow = 3; MOVES[i2].pow = 2;
  }
  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];
  const FACE_MOVES = FACE_NAMES.flatMap((f) => [f, f + "'", f + '2']).map((n) => MOVE_BY_NAME[n]);
  const SLICE_MOVES = ['M', 'S', 'E'].flatMap((f) => [f, f + "'", f + '2']).map((n) => MOVE_BY_NAME[n]);
  const ALL_MOVES = MOVES.map((m) => m.idx);

  // NEW[mv][p*24+rot] → 新状态编号（不在该层时不变）
  const NEW = [];
  for (const mv of MOVES) {
    const arr = new Uint8Array(NC * NROT);
    for (let p = 0; p < NC; p++) {
      for (let r = 0; r < NROT; r++) {
        const coord = cubies[POS[p][r]].home[mv.axis];
        arr[p * NROT + r] = (coord === mv.layer) ? CANON[p][MUL[mv.rot * NROT + r]] : r;
      }
    }
    NEW.push(arr);
  }

  /* ------------------------------------------------------------ 状态操作 */
  const newState = () => new Uint8Array(NC);
  function applyMove(st, mv) {
    const t = NEW[mv];
    for (let p = 0; p < NC; p++) st[p] = t[p * NROT + st[p]];
  }
  function applySeq(st, seq) { for (let i = 0; i < seq.length; i++) applyMove(st, seq[i]); }
  const parseSeq = (s) => s.trim().split(/\s+/).filter(Boolean).map((t) => {
    const i = MOVE_BY_NAME[t];
    if (i === undefined) throw new Error('未知转动: ' + t);
    return i;
  });
  const seqToString = (seq) => seq.map((m) => MOVES[m].name).join(' ');
  const isSolved = (st) => { for (let i = 0; i < NC; i++) if (st[i] !== 0) return false; return true; };
  function invertSeq(seq) { return seq.slice().reverse().map((m) => MOVES[m].inv); }

  function simplify(seq) {
    const out = [];
    for (const m of seq) {
      if (MOVES[m].pow === 0) continue;
      if (!out.length) { out.push(m); continue; }
      const a = out[out.length - 1];
      if (MOVES[a].axis === MOVES[m].axis && MOVES[a].layer === MOVES[m].layer) {
        let p = (MOVES[a].pow === 3 ? -1 : MOVES[a].pow) + (MOVES[m].pow === 3 ? -1 : MOVES[m].pow);
        p = ((p % 4) + 4) % 4;
        out.pop();
        if (p !== 0) out.push(MOVES[MOVES[a].base].idx + (p === 3 ? 1 : p === 2 ? 2 : 0));
      } else out.push(m);
    }
    return out;
  }

  // 该块是否有贴纸朝 +Y（配合位置用于判断“已翻正”）
  function upStickerUp(p, rot) {
    const m = ROTS[rot];
    for (const s of STICKER_AXES[p]) {
      const a = AXIS_VEC[s.axis];
      const v = matVec(m, [a[0] * s.sign, a[1] * s.sign, a[2] * s.sign]);
      if (v[1] === 1) return true;
    }
    return false;
  }
  // U 层块是否“已翻正”：位于 U 层 且 原本朝上的贴纸仍朝上
  function llOriented(p, rot) {
    if (cubies[POS[p][rot]].home[1] !== 1) return false;
    const v = matVec(ROTS[rot], [0, 1, 0]);
    return v[1] === 1;
  }

  function randomScramble(n, rng) {
    rng = rng || Math.random;
    const out = [];
    let lastAxis = -1, last2 = -1;
    while (out.length < n) {
      const f = FACE_NAMES[Math.floor(rng() * 6)];
      const mv = MOVE_BY_NAME[f + ['', "'", '2'][Math.floor(rng() * 3)]];
      const M = MOVES[mv];
      if (M.axis === lastAxis) continue;
      if (last2 === M.axis && M.axis === lastAxis) continue;
      out.push(mv); last2 = lastAxis; lastAxis = M.axis;
    }
    return out;
  }

  /* --------------------------------------------------- 编码 / 表构建工具 */
  function pack(vals) { let k = 0; for (let i = 0; i < vals.length; i++) k = k * 24 + vals[i]; return k; }
  function unpack(key, t) {
    const out = new Array(t);
    for (let i = t - 1; i >= 0; i--) { out[i] = key % 24; key = (key - out[i]) / 24; }
    return out;
  }

  // 全量 BFS 表（自还原态出发）
  function buildBFS(tracked, moveNames, budget) {
    const t = tracked.length;
    const mvIdx = moveNames.map((n) => MOVE_BY_NAME[n]);
    let total = 1;
    for (let i = 0; i < t; i++) total *= 24;
    const useArr = total <= 2000000;
    const distArr = useArr ? new Int32Array(total).fill(-1) : null;
    const viaArr = useArr ? new Uint8Array(total) : null;
    const distMap = useArr ? null : new Map();
    const viaMap = useArr ? null : new Map();
    const getD = (k) => (useArr ? distArr[k] : (distMap.has(k) ? distMap.get(k) : -1));
    const setD = (k, d, m) => {
      if (useArr) { distArr[k] = d; viaArr[k] = m === -1 ? 255 : m; }
      else { distMap.set(k, d); viaMap.set(k, m); }
    };
    const getV = (k) => (useArr ? viaArr[k] : viaMap.get(k));
    const key0 = pack(new Array(t).fill(0));
    setD(key0, 0, -1);
    let frontier = [key0];
    let d = 0, count = 1, maxDepth = 0;
    const tmp = new Array(t);
    const budgetMax = budget || 3000000;
    outer:
    while (frontier.length && count < budgetMax) {
      const next = [];
      d++;
      for (let fi = 0; fi < frontier.length; fi++) {
        const key = frontier[fi];
        const vals = unpack(key, t);
        for (let mi = 0; mi < mvIdx.length; mi++) {
          const tab = NEW[mvIdx[mi]];
          for (let i = 0; i < t; i++) tmp[i] = tab[tracked[i] * NROT + vals[i]];
          const nk = pack(tmp);
          if (getD(nk) === -1) {
            setD(nk, d, MOVES[mvIdx[mi]].inv);
            next.push(nk);
            if (++count >= budgetMax) break outer;
          }
        }
      }
      if (next.length) maxDepth = d;
      frontier = next;
    }
    return {
      tracked, t, useArr, getD, getV, count, maxDepth,
      solve(st) {
        const vals = tracked.map((p) => st[p]);
        const out = [];
        let guard = 0;
        const tmp2 = new Array(t);
        while (true) {
          const k = pack(vals);
          const dd = getD(k);
          if (dd < 0) return null;
          if (dd === 0) break;
          const m = getV(k);
          out.push(m);
          const tab = NEW[m];
          for (let i = 0; i < t; i++) tmp2[i] = tab[tracked[i] * NROT + vals[i]];
          for (let i = 0; i < t; i++) vals[i] = tmp2[i];
          if (++guard > 400) return null;
        }
        return out;
      },
    };
  }

  /* ---------------- 双向 BFS（要求 moveSet 对称含逆） */
  function pathFrom(seen, key) {
    const out = [];
    let k = key, node = seen.get(key);
    while (node) { out.push(node.mv); k = node.prev; node = seen.get(k); }
    return out.reverse();
  }
  function bidirSolve(tracked, moveNames, st, maxDepth) {
    const t = tracked.length;
    const mvIdx = moveNames.map((n) => MOVE_BY_NAME[n]);
    const startKey = pack(tracked.map((p) => st[p]));
    const goalKey = pack(new Array(t).fill(0));
    if (startKey === goalKey) return [];
    const fwdSeen = new Map([[startKey, null]]);
    const bwdSeen = new Map([[goalKey, null]]);
    let fF = [startKey], fB = [goalKey];
    const tmp = new Array(t);
    const LIMIT = maxDepth || 12;
    const CAP = 1200000;
    for (let depth = 0; depth < LIMIT; depth++) {
      for (let side = 0; side < 2; side++) {
        const cur = side === 0 ? fF : fB;
        const seen = side === 0 ? fwdSeen : bwdSeen;
        const other = side === 0 ? bwdSeen : fwdSeen;
        if (seen.size > CAP) return null;
        const next = [];
        for (let i = 0; i < cur.length; i++) {
          const vals = unpack(cur[i], t);
          for (let mi = 0; mi < mvIdx.length; mi++) {
            const tab = NEW[mvIdx[mi]];
            for (let j = 0; j < t; j++) tmp[j] = tab[tracked[j] * NROT + vals[j]];
            const nk = pack(tmp);
            if (seen.has(nk)) continue;
            seen.set(nk, { prev: cur[i], mv: mvIdx[mi] });
            next.push(nk);
            if (other.has(nk)) {
              const p1 = pathFrom(fwdSeen, nk);
              const p2 = pathFrom(bwdSeen, nk).map((m) => MOVES[m].inv).reverse();
              return p1.concat(p2);
            }
          }
        }
        if (side === 0) fF = next; else fB = next;
      }
    }
    return null;
  }

  /* ---------------- Dijkstra 表（生成器 = 一段序列，代价 = 步数） */
  function buildDijkstra(tracked, gens, isGoal) {
    // gens: [{seq, eff}]  eff = Uint8Array(t*24): eff[k*24+v]
    const t = tracked.length;
    const costs = gens.map((g) => g.seq.length);
    function applyEff(eff, vals, out) {
      for (let k = 0; k < t; k++) out[k] = eff[k * NROT + vals[k]];
      return out;
    }
    function step(vals, gi, out) { return applyEff(gens[gi].eff, vals, out); }
    // 1) 自还原态枚举可达状态
    const zero = new Array(t).fill(0);
    const reachable = new Set([pack(zero)]);
    let frontier = [zero];
    const tmpA = new Array(t);
    while (frontier.length) {
      const next = [];
      for (const vals of frontier) {
        for (let gi = 0; gi < gens.length; gi++) {
          step(vals, gi, tmpA);
          const k = pack(tmpA);
          if (!reachable.has(k)) { reachable.add(k); next.push(tmpA.slice()); }
        }
      }
      frontier = next;
    }
    // 2) 目标集合
    const goals = [];
    for (const k of reachable) if (isGoal(unpack(k, t))) goals.push(k);
    // 3) 多源 Dijkstra（自目标集合出发，走逆生成器）
    const invGens = [];
    for (const g of gens) {
      // 逆生成器的效果表：对每个 v 求 eff[v'] == v 的 v'（eff 是置换）
      const invEff = new Uint8Array(t * NROT);
      for (let k = 0; k < t; k++)
        for (let v = 0; v < NROT; v++) invEff[k * NROT + g.eff[k * NROT + v]] = v;
      invGens.push({ seq: invertSeq(g.seq), eff: invEff });
    }
    const maxCost = Math.max.apply(null, costs);
    const NB = Math.max(128, (maxCost + 1) * 64);
    const dist = new Map();
    const via = new Map();
    const buckets = [];
    for (const g of goals) { dist.set(g, 0); (buckets[0] = buckets[0] || []).push(g); }
    let d = 0, processed = 0, maxD = 0;
    const target = reachable.size;
    while (processed < target) {
      while (d < NB && !(buckets[d] && buckets[d].length)) d++;
      if (d >= NB) break;
      const b = buckets[d];
      const key = b.pop();
      if (dist.get(key) !== d) continue;
      processed++;
      if (d > maxD) maxD = d;
      const vals = unpack(key, t);
      // 反向松弛：nk --gens[gi]--> vals
      for (let gi = 0; gi < invGens.length; gi++) {
        const nv = applyEff(invGens[gi].eff, vals, tmpA);
        const nk = pack(nv);
        const nd = d + costs[gi];
        const old = dist.has(nk) ? dist.get(nk) : 1e9;
        if (nd < old) {
          dist.set(nk, nd);
          via.set(nk, gi); // 从 nk 出发应施加 gens[gi]
          (buckets[nd] = buckets[nd] || []).push(nk);
        }
      }
    }
    return {
      tracked, t, reachable, dist, via, gens, maxDepth: maxD, goalCount: goals.length,
      solve(st) {
        const vals = tracked.map((p) => st[p]);
        const out = [];
        let guard = 0;
        while (true) {
          if (isGoal(vals)) break;
          const k = pack(vals);
          const gi = via.get(k);
          if (gi === undefined) return null;
          for (const m of gens[gi].seq) out.push(m);
          const nv = step(vals, gi, new Array(t));
          for (let i = 0; i < t; i++) vals[i] = nv[i];
          if (++guard > 200) return null;
        }
        return out;
      },
    };
  }

  /* ---------------- 序列枚举：按“对跟踪块的作用”去重，保留最短 */
  // cb(seq, st, maps) —— maps[k] 为 Uint8Array(24)：该序列对 tracked[k] 的作用
  function enumerateSeqs(alphabet, maxLen, tracked, cb) {
    const t = tracked.length;
    const st = new Uint8Array(NC);
    // 每层一份 maps，避免分配
    const stack = [];
    for (let d = 0; d <= maxLen; d++) {
      const lvl = [];
      for (let k = 0; k < t; k++) {
        const m = new Uint8Array(NROT);
        for (let v = 0; v < NROT; v++) m[v] = v;
        lvl.push(m);
      }
      stack.push(lvl);
    }
    const seq = [];
    function dfs(depth, lastBase) {
      if (depth > 0) cb(seq, st, stack[depth]);
      if (depth === maxLen) return;
      for (let ai = 0; ai < alphabet.length; ai++) {
        const mv = alphabet[ai];
        const base = MOVES[mv].base;
        if (base === lastBase) continue;
        const tab = NEW[mv];
        applyMove(st, mv);
        const cur = stack[depth], nxt = stack[depth + 1];
        for (let k = 0; k < t; k++) {
          const c = cur[k], n = nxt[k], tp = tracked[k];
          for (let v = 0; v < NROT; v++) n[v] = tab[tp * NROT + c[v]];
        }
        seq.push(mv);
        dfs(depth + 1, base);
        seq.pop();
        applyMove(st, MOVES[mv].inv);
      }
    }
    dfs(0, -1);
  }

  // 只维护状态（不维护效果表）的快速枚举，用于按 support 过滤
  function enumerateBySupport(alphabet, maxLen, allowedMask, cb) {
    const st = new Uint8Array(NC);
    const seq = [];
    function dfs(depth, lastBase) {
      if (depth > 0) {
        let support = 0, bad = false;
        for (let p = 0; p < NC; p++) {
          if (st[p] === 0) continue;
          if (!(allowedMask & (1 << p))) { bad = true; break; }
          support |= 1 << p;
        }
        if (!bad) cb(seq, support);
      }
      if (depth === maxLen) return;
      for (let ai = 0; ai < alphabet.length; ai++) {
        const mv = alphabet[ai];
        const base = MOVES[mv].base;
        if (base === lastBase) continue;
        applyMove(st, mv);
        seq.push(mv);
        dfs(depth + 1, base);
        seq.pop();
        applyMove(st, MOVES[mv].inv);
      }
    }
    dfs(0, -1);
  }

  // 收集生成器：alphabet 上长度 ≤ maxLen 的序列，support ⊆ allowedMask
  // 按“对被跟踪块的作用”去重，保留最短；同时记录 support 掩码便于二次过滤
  function collectGens(alphabet, maxLen, tracked, allowedMask) {
    const t = tracked.length;
    const best = new Map(); // effectKey|support -> gen
    const buf = new Array(t * NROT);
    enumerateBySupport(alphabet, maxLen, allowedMask, (seq, support) => {
      const eff = effOf(seq, tracked);
      let idx = 0;
      for (let i = 0; i < t * NROT; i++) buf[idx++] = eff[i];
      const key = String.fromCharCode.apply(null, buf) + '|' + support;
      const prev = best.get(key);
      if (!prev || seq.length < prev.seq.length)
        best.set(key, { seq: seq.slice(), eff, support });
    });
    return Array.from(best.values());
  }

  function maskOf(pieces) { let m = 0; for (const p of pieces) m |= 1 << p; return m; }

  /* ==================================================== 阶段块定义 */
  const P = {};
  for (let x = -1; x <= 1; x++)
    for (let y = -1; y <= 1; y++)
      for (let z = -1; z <= 1; z++)
        if (x || y || z) {
          const n = ['D', '', 'U'][y + 1] + ['B', '', 'F'][z + 1] + ['L', '', 'R'][x + 1];
          P[n] = idAt(x, y, z);
        }
  const CENTERS = ['U', 'D', 'L', 'R', 'F', 'B'].map((n) => P[n]);
  const CROSS_EDGES = ['DF', 'DL', 'DB', 'DR'].map((n) => P[n]);
  const F2L_PAIRS = [
    { slot: 'FR', corner: P['DFR'], edge: P['FR'] },
    { slot: 'FL', corner: P['DFL'], edge: P['FL'] },
    { slot: 'BR', corner: P['DBR'], edge: P['BR'] },
    { slot: 'BL', corner: P['DBL'], edge: P['BL'] },
  ];
  const U_CORNERS = ['UFR', 'UFL', 'UBL', 'UBR'].map((n) => P[n]);
  const U_EDGES = ['UF', 'UL', 'UB', 'UR'].map((n) => P[n]);
  const LL_PIECES = U_CORNERS.concat(U_EDGES);
  const U_LAYER = U_CORNERS.concat(U_EDGES);
  const M_SLICE_CENTERS = ['U', 'F', 'D', 'B'].map((n) => P[n]);
  const LSE_EDGES = ['UF', 'UB', 'UL', 'UR', 'DF', 'DB'].map((n) => P[n]);
  const FB_SQUARE = [P['DL'], P['BL'], P['DBL']];
  const FB_REST = [P['FL'], P['DFL']];
  const FB_ALL = FB_SQUARE.concat(FB_REST);
  const SB_SQUARE = [P['DR'], P['BR'], P['DBR']];
  const SB_REST = [P['FR'], P['DFR']];
  const SB_ALL = SB_SQUARE.concat(SB_REST);
  const BLOCKS = FB_ALL.concat(SB_ALL, [P['L'], P['R']]);

  /* ==================================================== 表（惰性构建） */
  const T = {};
  let tablesReady = false;
  const timings = {};
  function timed(name, fn) { const t0 = Date.now(); const r = fn(); timings[name] = Date.now() - t0; return r; }

  // PLL 手工候选（长算法，枚举难以覆盖）
  const PLL_CANDIDATES = [
    "R U' R U R U R U' R' U' R2",
    "R2 U R U R' U' R' U' R' U R'",
    "R U R' U' R' F R2 U' R' U' R U R' F'",
    "F R U' R' U' R U R' F' R U R' U' R' F R F'",
    "R' U L' U2 R U' R' U2 R L U'",
    "R U R' F' R U R' U' R' F R2 U' R'",
    "R' F R' B2 R F' R' B2 R2",
    "R2 B2 R F R' B2 R F' R",
    "R U R' U' R' U' R U R U R' U' R U R U2 R'",
    "R' U' R U D' R U R' D R U' R' U' R",
    "R U' R' U' R U R D R' U' R D' R' U2 R'",
    "R' U R' U' R3 U' R U R' U' R U R2",
    "R2 U' R U' R U R' U R2 U' D R U R' D'",
    "R U R' F' R U R' U' R' F R2 U' R' U'",
    "L U' R' U L' U' R U2 L U' R' U L' U' R U2",
    "R' U' R U' R U R U' R' U R U R2 U' R' U",
    "R U R' U' R U R' U' R U R' U' R U R' U'",
    "R' U' R U' R' U2 R U R' U R U2 R' U' R",
    "R U R' F' R U R' U' R' F R2 U' R' U2 R U' R'",
    "R2 U R U R' U' R' U' R' U R' U2",
    "R U' R U R U R U' R' U' R2 U2",
    "R U' R' U' R U R U R U' R' U R U R2 U' R'",
    "R U' R' U' R U R D R' U' R D' R' U2 R'",
    "R' U R' U' R3 U' R U R' U' R U R2",
    "F' U' F R U R' U' R' F R F' U R U' R'",
    "R U R' U' R' U' R U R U R' U' R U R U2 R'",
    "R' U2 R U2 R' F R U R' U' R' F' R2 U2",
    "R U2 R' U' R U R' U2 R' U R U' R' U' R",
    "R' F R' B2 R F' R' B2 R2 U",
    "R U R' U' R2 U' R U R' U' R U R U' R' U' R2",
    "R2 U' R' U' R U R U R U' R U' R2 U2 R'",
    "R' U2 R2 U R2 U R2 U2 R'",
    "R U2 R2 U' R2 U' R2 U2 R",
  ];

  function buildTables(log) {
    if (tablesReady) return T;
    const say = log || function () { };

    T.centers = timed('centers', () => buildBFS(CENTERS, ['M', "M'", 'M2', 'S', "S'", 'S2', 'E', "E'", 'E2']));
    T.cross = timed('cross', () => buildBFS(CROSS_EDGES, FACE_MOVES.map((m) => MOVES[m].name)));

    /* -------- F2L：按 (槽位, 已还原掩码) 建表 -------- */
    const f2lAlpha = FACE_MOVES.slice();
    const slotPieces = F2L_PAIRS.flatMap((p) => [p.corner, p.edge]);
    const f2lMaxAllowed = maskOf(U_LAYER.concat(slotPieces));
    T.f2l = [];
    for (let si = 0; si < F2L_PAIRS.length; si++) {
      const pair = F2L_PAIRS[si];
      const tracked = [pair.corner, pair.edge];
      const gensAll = timed('f2lEnum' + si, () => collectGens(f2lAlpha, 5, tracked, f2lMaxAllowed));
      T.f2l[si] = [];
      for (let mask = 0; mask < 16; mask++) {
        if (mask & (1 << si)) { T.f2l[si][mask] = null; continue; }
        const open = U_LAYER.slice();
        for (let k = 0; k < 4; k++) if (!(mask & (1 << k))) open.push(F2L_PAIRS[k].corner, F2L_PAIRS[k].edge);
        const allowed = maskOf(open);
        const gens = gensAll.filter((g) => (g.support & ~allowed) === 0);
        T.f2l[si][mask] = buildDijkstra(tracked, gens, (v) => v[0] === 0 && v[1] === 0);
      }
      const n = 4;
      say('F2L ' + pair.slot + ' 生成器 ' + gensAll.length + '，可达(mask=0) ' + T.f2l[si][0].reachable.size + '，最深 ' + T.f2l[si][0].maxDepth);
    }

    /* -------- CFOP 最后一层 -------- */
    const llAlpha = ['R', "R'", 'U', "U'", 'U2', 'F', "F'", 'L', "L'"].map((n) => MOVE_BY_NAME[n]);
    const llAllowed = maskOf(LL_PIECES);
    const llGensAll = timed('llEnum', () => collectGens(llAlpha, 7, LL_PIECES, llAllowed));
    say('LL 可用序列 ' + llGensAll.length + ' 个');
    // OLL：整层一起翻色（目标 = 8 块全部朝向正确，位置随意）
    T.oll = timed('oll', () => buildDijkstra(LL_PIECES, llGensAll, (v) => v.every((r, i) => llOriented(LL_PIECES[i], r))));
    say('OLL 生成器 ' + llGensAll.length + ' 个，可达 ' + T.oll.reachable.size + '/' + T.oll.goalCount + '，最深 ' + T.oll.maxDepth);
    // PLL：保持全部朝向，只做换位
    const isOrientKeep = (seq) => {
      const st = newState(); applySeq(st, seq);
      return LL_PIECES.every((p) => st[p] === 0 || llOriented(p, st[p]));
    };
    const pllSrc = llGensAll.filter((g) => isOrientKeep(g.seq));
    // 两两相乘扩充（LL 内序列相乘仍保持 F2L，只需筛选保朝向者）
    timed('pllProd', () => {
      for (const a of llGensAll) {
        for (const b of llGensAll) {
          const seq = a.seq.concat(b.seq);
          if (seq.length > 16) continue;
          if (isOrientKeep(seq)) pllSrc.push({ seq, eff: effOf(seq, LL_PIECES), support: a.support | b.support });
        }
      }
    });
    for (const c of PLL_CANDIDATES) {
      let seq; try { seq = parseSeq(c); } catch (e) { continue; }
      const st = newState(); applySeq(st, seq);
      if (!LL_PIECES.every((p) => st[p] === 0 || (LL_PIECES.indexOf(p) >= 0 && llOriented(p, st[p])))) continue;
      let bad = false;
      for (let p = 0; p < NC; p++) if (st[p] !== 0 && LL_PIECES.indexOf(p) < 0) { bad = true; break; }
      if (bad) continue;
      pllSrc.push({ seq, eff: effOf(seq, LL_PIECES) });
    }
    const pllGens = timed('pllDedup', () => dedupeGens(pllSrc, LL_PIECES, LL_PIECES));
    T.pll = timed('pll', () => buildDijkstra(LL_PIECES, pllGens, (v) => v.every((x) => x === 0)));
    say('PLL 生成器 ' + pllGens.length + ' 个，可达 ' + T.pll.reachable.size + '，最深 ' + T.pll.maxDepth);

    /* -------- 桥式 -------- */
    T.fbSquare = timed('fbSquare', () => buildBFS(FB_SQUARE, FACE_MOVES.map((m) => MOVES[m].name)));
    T.sbSquare = timed('sbSquare', () => buildBFS(SB_SQUARE, ['R', "R'", 'R2', 'U', "U'", 'U2', 'M', "M'", 'M2']));
    // CMLL：只跟踪 4 个 U 层角块，生成器须不破坏左右两块
    const cmllAllowed = ~maskOf(BLOCKS) & ((1 << NC) - 1);
    const cmllGens = timed('cmllEnum', () => collectGens(llAlpha, 7, U_CORNERS, cmllAllowed));
    T.cmll = timed('cmll', () => buildDijkstra(U_CORNERS, cmllGens, (v) => v.every((x) => x === 0)));
    say('CMLL 生成器 ' + cmllGens.length + ' 个，可达 ' + T.cmll.reachable.size + '，最深 ' + T.cmll.maxDepth);
    // LSE：跟踪 6 棱 + 4 中心 + 1 个顶角（顶角记录 U 层整体转角，避免解法把顶层转走）
    T.lsePieces = LSE_EDGES.concat(M_SLICE_CENTERS, [U_CORNERS[0]]);
    T.lse = timed('lse', () => buildBFS(T.lsePieces, ['M', "M'", 'M2', 'U', "U'", 'U2']));
    say('LSE 状态 ' + T.lse.count + '，最深 ' + T.lse.maxDepth);

    tablesReady = true;
    return T;
  }

  function effOf(seq, tracked) {
    const t = tracked.length;
    const eff = new Uint8Array(t * NROT);
    for (let k = 0; k < t; k++) for (let v = 0; v < NROT; v++) eff[k * NROT + v] = v;
    for (const m of seq) {
      const tab = NEW[m];
      for (let k = 0; k < t; k++) {
        const tp = tracked[k];
        for (let v = 0; v < NROT; v++) eff[k * NROT + v] = tab[tp * NROT + eff[k * NROT + v]];
      }
    }
    return eff;
  }

  // 把 tracked=all 的生成器按“对 sub 子集的作用”去重（保留最短）
  function dedupeGens(src, all, sub) {

    const models = [];
    for (let p = 0; p < C.NC; p++) {
      let m = cubieMatrix(p);
      if (rotM && ((anim && inLayer(p, anim.axis, anim.layer)) || (turn && inLayer(p, turn.axis, turn.layer)))) {
        m = mul4(rotM, m);
      }
      if (popScale !== 1) {
        const s = popScale;
        m = mul4(new Float32Array([s, 0, 0, 0, 0, s, 0, 0, 0, 0, s, 0, 0, 0, 0, 1]), m);
      }
      models.push(m);
    }

    // 主体
    gl.useProgram(prog);
    bindAttribs(loc, true);
    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
    gl.uniform3fv(loc.uEye, new Float32Array(eye));
    gl.uniform3fv(loc.uBody, new Float32Array(BODY));
    gl.uniform1f(loc.uScale, CUBIE);
    gl.uniform1f(loc.uSticker, 1);
    for (let p = 0; p < C.NC; p++) {
      const cols = cubieColors[p];
      for (let f = 0; f < 6; f++) gl.uniform3fv(loc['uC' + f], new Float32Array(cols[f]));
      gl.uniformMatrix4fv(loc.uModel, false, models[p]);
      gl.uniformMatrix3fv(loc.uNm, false, mat3of(models[p]));
      gl.drawElements(gl.TRIANGLES, geo.idx.length, gl.UNSIGNED_SHORT, 0);
    }

    // 描边（反向外壳）
    gl.useProgram(progInk);
    bindAttribs(locInk, false);
    gl.cullFace(gl.FRONT);
    gl.uniformMatrix4fv(locInk.uProj, false, proj);
    gl.uniformMatrix4fv(locInk.uView, false, view);
    gl.uniform3fv(locInk.uInk, new Float32Array(INK));
    gl.uniform1f(locInk.uScale, CUBIE * 1.075);
    for (let p = 0; p < C.NC; p++) {
      gl.uniformMatrix4fv(locInk.uModel, false, models[p]);
      gl.drawElements(gl.TRIANGLES, geo.idx.length, gl.UNSIGNED_SHORT, 0);
    }
    gl.cullFace(gl.BACK);
  }
  const easeOut = (t) => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  /* ------------------------------------------------------------ 主循环 */
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(64, now - lastT);
    lastT = now;

    if (autoSpin && !interacting) cam.theta += dt * 0.00012;

    if (anim) {
      anim.t += dt;
      if (anim.t >= anim.dur) {
        const moves = anim.moves || [anim.move];
        anim = null;
        for (const m of moves) C.applyMove(state, m);
        afterMove();
        if (queue.length) { const n = queue.shift(); animateMove(n.move, n.dur); }
      }
    } else if (queue.length) {
      const n = queue.shift();
      animateMove(n.move, n.dur);
    }

    if (popScale !== 1) {
      popScale += (1 - popScale) * Math.min(1, dt / 90);
      if (Math.abs(popScale - 1) < 0.003) popScale = 1;
    }

    draw();
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------ 拾取 */
  function screenRay(px, py) {
    const x = (px * dpr) / W * 2 - 1, y = 1 - (py * dpr) / H * 2;
    const inv = invert4(viewProj);
    const near = unproject(inv, x, y, -1), far = unproject(inv, x, y, 1);
    return { o: eye, d: norm(sub(far, near)) };
  }
  function unproject(inv, x, y, z) {
    const w = inv[3] * x + inv[7] * y + inv[11] * z + inv[15];
    return [
      (inv[0] * x + inv[4] * y + inv[8] * z + inv[12]) / w,
      (inv[1] * x + inv[5] * y + inv[9] * z + inv[13]) / w,
      (inv[2] * x + inv[6] * y + inv[10] * z + inv[14]) / w,
    ];
  }
  function invert4(m) {
    const o = new Float32Array(16);
    const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3],
      a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7],
      a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11],
      a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10,
      b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12,
      b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30,
      b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    if (!det) return o;
    det = 1.0 / det;
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
    o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
    o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
    o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
    o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
    o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
    o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
    o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
    o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return o;
  }

  // 射线与 3x3x3 外框求交，返回 {point, axis, sign, cell:[ix,iy,iz]}
  function pickCube(px, py) {
    const { o, d } = screenRay(px, py);
    let best = null;
    for (let axis = 0; axis < 3; axis++) {
      for (const sign of [1, -1]) {
        if (Math.abs(d[axis]) < 1e-8) continue;
        const t = (sign * HALF - o[axis]) / d[axis];
        if (t <= 0) continue;
        const p = [o[0] + d[0] * t, o[1] + d[1] * t, o[2] + d[2] * t];
        let inside = true;
        for (let k = 0; k < 3; k++) {
          if (k === axis) continue;
          if (p[k] < -HALF - 1e-6 || p[k] > HALF + 1e-6) { inside = false; break; }
        }
        if (!inside) continue;
        if (!best || t < best.t) best = { t, p, axis, sign };
      }
    }
    if (!best) return null;
    const cell = [0, 0, 0];
    for (let k = 0; k < 3; k++) {
      let v = Math.floor(best.p[k] + HALF);
      if (v < 0) v = 0; if (v > 2) v = 2;
      cell[k] = v - 1; // -1,0,1
    }
    return { point: best.p, axis: best.axis, sign: best.sign, cell };
  }

  // 世界坐标 → 屏幕像素（用于把拖拽投影到切向）
  function project(p) {
    const m = viewProj;
    const w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
    const x = (m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12]) / w;
    const y = (m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13]) / w;
    return [(x * 0.5 + 0.5) * W / dpr, (0.5 - y * 0.5) * H / dpr];
  }
  const worldPerPixel = () => (2 * cam.dist * Math.tan(19 * Math.PI / 180)) / Math.max(1, H / dpr);

  const DRAG_GAIN = 1.7;   // 拖拽转动的灵敏度增益（约拖 3/4 格即可吸附 90°）

  // (axis, layer) → {pos: 顺时针(正角度)对应的转动, neg: 反向}
  const MOVE_AT = {};
  for (const mv of C.MOVES) {
    if (mv.name.endsWith('2')) continue;
    const key = mv.axis + ':' + mv.layer;
    if (!MOVE_AT[key]) MOVE_AT[key] = {};
    MOVE_AT[key][mv.q === 1 ? 'pos' : 'neg'] = mv.idx;
  }

  /* ------------------------------------------------------------ 交互 */
  let ptr = null;      // {mode, x, y, hit, startX, startY}
  let interacting = false;

  function setAutoSpin(on) {
    autoSpin = on;
    $('btnSpin').classList.toggle('primary', on);
  }

  canvas.addEventListener('pointerdown', (e) => {
    // 用户一上手就停掉自转，避免视角漂移影响精确拖拽
    if (autoSpin && !spinLocked) setAutoSpin(false);
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const hit = busy() ? null : pickCube(px, py);
    ptr = {
      mode: hit ? 'cube' : 'orbit', x: px, y: py, startX: px, startY: py, hit, moved: false,
    };
    interacting = true;
    canvas.classList.add(hit ? 'turning' : 'dragging');
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!ptr) return;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const dx = px - ptr.x, dy = py - ptr.y;
    ptr.x = px; ptr.y = py;
    if (Math.abs(px - ptr.startX) + Math.abs(py - ptr.startY) > 4) ptr.moved = true;

    if (ptr.mode === 'orbit') {
      cam.theta -= dx * 0.0075;
      cam.phi = Math.max(-1.45, Math.min(1.45, cam.phi + dy * 0.0075));
      return;
    }
    if (!turn && !anim && !queue.length) {
      // 确定拖拽方向对应的切向
      const h = ptr.hit;
      const n = [0, 0, 0]; n[h.axis] = h.sign;
      const tans = [];
      for (let k = 0; k < 3; k++) {
        if (k === h.axis) continue;
        const t = [0, 0, 0]; t[k] = 1;
        const sc = sub(project([h.point[0] + t[0] * 0.5, h.point[1] + t[1] * 0.5, h.point[2] + t[2] * 0.5]), project(h.point));
        const len = Math.hypot(sc[0], sc[1]);
        if (len > 0.001) tans.push({ w: t, s: [sc[0] / len, sc[1] / len] });
      }
      if (!tans.length) return;
      const tot = Math.abs(px - ptr.startX) + Math.abs(py - ptr.startY);
      if (tot < 7) return;
      const ddx = px - ptr.startX, ddy = py - ptr.startY;
      let best = tans[0], bs = -1;
      for (const t of tans) {
        const s = ddx * t.s[0] + ddy * t.s[1];
        if (Math.abs(s) > Math.abs(bs)) { bs = s; best = t; }
      }
      const dvec = bs >= 0 ? best.w : [-best.w[0], -best.w[1], -best.w[2]];
      const a = cross(n, dvec);          // 旋转轴（含符号）
      const axis = a[0] ? 0 : (a[1] ? 1 : 2);
      const dir = a[axis] > 0 ? 1 : -1;
      const layer = h.cell[axis];
      const at = MOVE_AT[axis + ':' + layer];
      if (!at) return;
      // 半径：命中点到旋转轴的距离
      const radial = Math.hypot(
        h.point[(axis + 1) % 3] || 0.001, h.point[(axis + 2) % 3] || 0.001);
      turn = {
        // DRAG_GAIN 提高跟手度：拖约 3/4 格即可吸附到 90°
        axis, layer, dir, angle: 0, radial: Math.max(0.6, radial) / DRAG_GAIN,
        screenDir: best.s, sign: bs >= 0 ? 1 : -1,
        startX: ptr.startX, startY: ptr.startY,
        vel: 0, lastAlong: 0, lastT: performance.now(),
      };
    }
    if (turn) {
      const ddx = px - turn.startX, ddy = py - turn.startY;
      const along = (ddx * turn.screenDir[0] + ddy * turn.screenDir[1]) * turn.sign;
      const now = performance.now();
      const dt = Math.max(1, now - turn.lastT);
      turn.vel = (along - turn.lastAlong) / dt;
      turn.lastAlong = along; turn.lastT = now;
      turn.angle = (along * worldPerPixel()) / turn.radial;
      const lim = Math.PI * 1.02;
      turn.angle = Math.max(-lim, Math.min(lim, turn.angle));
    }
  });

  function endPointer() {
    if (turn) {
      let q = Math.round(turn.angle / (Math.PI / 2));
      // 轻扫补足：快速划一下并立刻松手时，即使不足 45° 也补到下一档，
      // 避免"明明划了一下却弹回去"。停手后再松手则仍按 45° 阈值判定。
      const idle = performance.now() - turn.lastT;
      if (idle < 140 && Math.abs(turn.vel) > 0.22 && Math.abs(turn.angle) > 0.32) {
        const sg = turn.angle > 0 ? 1 : -1;
        const want = sg * (Math.floor(Math.abs(turn.angle) / (Math.PI / 2)) + 1);
        if (Math.abs(want) > Math.abs(q)) q = want;
      }
      const n = Math.abs(q);
      const at = MOVE_AT[turn.axis + ':' + turn.layer];
      if (n > 0 && at) {
        const s = (q >= 0 ? 1 : -1) * turn.dir;      // 绕 +axis 的方向
        const base = s > 0 ? at.pos : at.neg;
        const moves = (n === 2) ? [C.MOVES[base].base + 2] : new Array(n).fill(base);
        const target = s * n * Math.PI / 2;
        const from = turn.angle * turn.dir;
        const rest = Math.abs(target - from) / (Math.PI / 2);
        anim = { moves, axis: turn.axis, layer: turn.layer, from, target, t: 0,
                 dur: Math.max(70, Math.min(300, rest * 140)) };
        turn = null;
      } else {
        turn = null;
      }
    }
    ptr = null;
    interacting = false;
    canvas.classList.remove('dragging', 'turning');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { if (ptr && ptr.mode === 'orbit') endPointer(); });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.dist = Math.max(4.6, Math.min(16, cam.dist * (1 + Math.sign(e.deltaY) * 0.09)));
  }, { passive: false });

  /* ------------------------------------------------------------ 移动回调 */
  let wasSolved = true;
  function afterMove() {
    updateHud();
    const solved = C.isSolved(state);
    if (solved && !wasSolved) {
      popScale = 1.07;
      toast('🎉 已还原！');
      setPlaying(false);
    }
    wasSolved = solved;
    // 消费连按累积的步数（播放中交给播放节奏处理）
    if (pendingSteps !== 0 && !playing) {
      const d = pendingSteps > 0 ? 1 : -1;
      pendingSteps -= d;
      doStep(d);
    }
  }

  /* ------------------------------------------------------------ 求解 / 播放 */
  let solution = null;      // {method, stages, moves, start}
  let cursor = 0;           // 已执行步数
  let pendingSteps = 0;     // 连按「上一步/下一步」时累积的待执行步数
  let playing = false;
  let playTimer = null;
  let method = 'CFOP';
  let tablesReady = false;

  const $ = (id) => document.getElementById(id);
  const el = {
    steps: $('steps'), empty: $('stepsEmpty'), bar: $('progressBar'),
    stepText: $('stepText'), stageText: $('stageText'), hudStage: $('hudStage'),
    hudState: $('hudState'), hudMethod: $('hudMethod'), toast: $('toast'),
    busy: $('busy'), busyText: $('busyText'), play: $('btnPlay'), speed: $('speed'),
  };

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove('show'), 1600);
  }
  function showBusy(text) { el.busyText.textContent = text || '处理中…'; el.busy.classList.add('on'); }
  function hideBusy() { el.busy.classList.remove('on'); }

  function ensureTables(cb) {
    if (tablesReady) { cb(); return; }
    showBusy('首次使用：正在构建解法查找表（约 1~2 秒）');
    setTimeout(() => {
      const t0 = performance.now();
      C.buildTables();
      tablesReady = true;
      hideBusy();
      cb();
    }, 40);
  }

  function clearSolution(msg) {
    solution = null; cursor = 0; playing = false; pendingSteps = 0;
    clearInterval(playTimer); playTimer = null;
    el.play.textContent = '▶ 播放';
    el.steps.innerHTML = '';
    el.steps.appendChild(el.empty);
    el.empty.innerHTML = msg || '尚未求解。点「求解」后在这里显示分步过程。';
    el.bar.style.width = '0%';
    el.stepText.textContent = '0 / 0';
    el.stageText.textContent = '—';
    el.hudStage.textContent = '未求解';
  }

  function doSolve() {
    if (busy()) return;
    ensureTables(() => {
      if (C.isSolved(state)) { toast('魔方已经是还原状态'); clearSolution(); return; }
      const sol = C.solve(state, method);
      if (!sol) { toast('当前状态无法求解'); return; }
      if (!sol.moves.length) { clearSolution(); toast('已还原'); return; }
      solution = { method: sol.method, stages: sol.stages, moves: sol.moves, start: Uint8Array.from(state) };
      cursor = 0;
      renderSteps();
      updateProgress();
      toast(`${sol.method} · 共 ${sol.moves.length} 步 / ${sol.stages.length} 个阶段`);
    });
  }

  function renderSteps() {
    el.steps.innerHTML = '';
    let idx = 0;
    for (const st of solution.stages) {
      const box = document.createElement('div');
      box.className = 'stage';
      const head = document.createElement('div');
      head.className = 'stage-h';
      head.innerHTML = `<span class="dot"></span><span>${st.name}</span><span class="n">${st.moves.length} 步</span>`;
      head.onclick = () => jumpTo(st.from);
      box.appendChild(head);
      const mv = document.createElement('div');
      mv.className = 'moves';
      for (const m of st.moves) {
        const chip = document.createElement('span');
        chip.className = 'mv';
        chip.textContent = C.MOVES[m].name;
        chip.dataset.i = idx;
        chip.onclick = () => jumpTo(idx);
        mv.appendChild(chip);
        idx++;
      }
      box.appendChild(mv);
      el.steps.appendChild(box);
    }
    // 记录每个阶段的起始下标
    let k = 0;
    for (const st of solution.stages) { st.from = k; k += st.moves.length; }
  }

  function updateProgress() {
    if (!solution) return;
    const n = solution.moves.length;
    el.bar.style.width = (cursor / n * 100).toFixed(1) + '%';
    el.stepText.textContent = cursor + ' / ' + n;
    // 阶段
    let cur = null, ci = 0;
    for (let i = 0; i < solution.stages.length; i++) {
      const st = solution.stages[i];
      if (cursor >= st.from && cursor < st.from + st.moves.length) { cur = st; ci = i; }
    }
    if (!cur && cursor >= n) { cur = solution.stages[solution.stages.length - 1]; ci = solution.stages.length - 1; }
    el.stageText.textContent = cur ? cur.name : '';
    el.hudStage.textContent = (cur ? cur.name + ' · ' : '') + (cursor >= n ? '完成' : '第 ' + (cursor + 1) + ' 步');
    // 高亮
    const boxes = el.steps.querySelectorAll('.stage');
    boxes.forEach((b, i) => {
      b.classList.toggle('now', i === ci && cursor < n);
      // 全部走完时，最后一个阶段同样要标记为已完成
      b.classList.toggle('done', cursor >= n ? true : (!!cur && i < ci));
    });
    const chips = el.steps.querySelectorAll('.mv');
    chips.forEach((c) => {
      const i = +c.dataset.i;
      c.classList.toggle('past', i < cursor);
      c.classList.toggle('cur', i === cursor && cursor < n);
    });
    const active = el.steps.querySelector('.mv.cur');
    if (active && active.parentElement && active.parentElement.parentElement)
      active.parentElement.parentElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function stepInterval() {
    const v = +el.speed.value;
    return [620, 460, 340, 250, 180, 130, 95, 70, 50, 34][v - 1];
  }
  function setPlaying(on) {
    playing = on && !!solution && cursor < solution.moves.length;
    el.play.textContent = playing ? '❚❚ 暂停' : '▶ 播放';
    clearInterval(playTimer); playTimer = null;
    if (playing) playTimer = setInterval(() => {
      if (!solution || cursor >= solution.moves.length) { setPlaying(false); return; }
      if (!busy()) doStep(+1);
    }, stepInterval());
  }
  function doStep(dir) {
    if (!solution) return;
    // 动画未结束时先记账，等这一步落位后继续消费，避免快速连按丢步
    if (busy()) { pendingSteps += dir; return; }
    if (dir > 0) {
      if (cursor >= solution.moves.length) return;
      animateMove(solution.moves[cursor], Math.min(stepInterval() * 0.82, 260));
      cursor++;
      updateProgress();
    } else {
      if (cursor <= 0) return;
      cursor--;
      animateMove(C.MOVES[solution.moves[cursor]].inv, Math.min(stepInterval() * 0.82, 260));
      updateProgress();
    }
  }
  function jumpTo(i) {
    if (!solution || busy()) return;
    i = Math.max(0, Math.min(solution.moves.length, i));
    state.set(solution.start);
    for (let k = 0; k < i; k++) C.applyMove(state, solution.moves[k]);
    cursor = i;
    updateProgress(); updateHud();
  }

  /* ------------------------------------------------------------ HUD */
  function updateHud() {
    el.hudState.textContent = C.isSolved(state) ? '已还原' : '打乱中';
    el.hudMethod.textContent = method;
  }

  /* ------------------------------------------------------------ 按钮 */
  function doScramble() {
    if (busy()) return;
    clearSolution('已打乱。点「求解」查看分步还原过程。');
    const mv = C.randomScramble(24);
    pushQueue(mv, 62);
    updateHud();
    toast('打乱中…');
  }
  function doReset() {
    if (busy()) return;
    clearSolution();
    state.set(C.newState());
    wasSolved = true;
    popScale = 1.06;
    updateHud();
    toast('已复原');
  }

  $('btnSolve').onclick = doSolve;
  $('btnScramble').onclick = doScramble;
  $('btnReset').onclick = doReset;
  $('btnPlay').onclick = () => { if (!solution) { doSolve(); return; } setPlaying(!playing); };
  $('btnNext').onclick = () => { setPlaying(false); doStep(+1); };
  $('btnPrev').onclick = () => { setPlaying(false); doStep(-1); };
  $('btnSpin').onclick = function () { spinLocked = true; setAutoSpin(!autoSpin); };
  $('segMethod').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    method = b.dataset.method;
    [...$('segMethod').children].forEach((x) => x.classList.toggle('on', x === b));
    updateHud();
    if (solution) clearSolution('已切换解法，重新点「求解」即可。');
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); if (!solution) doSolve(); else setPlaying(!playing); }
    else if (e.code === 'ArrowRight') { setPlaying(false); doStep(+1); }
    else if (e.code === 'ArrowLeft') { setPlaying(false); doStep(-1); }
    else if (e.key === 's' || e.key === 'S') doScramble();
    else if (e.key === 'r' || e.key === 'R') doReset();
  });

  // 图例
  {
    const box = document.getElementById('legend');
    for (const f of ['U', 'D', 'F', 'B', 'R', 'L']) {
      const i = document.createElement('i');
      const c = FACE_COLOR[f];
      i.style.background = `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`;
      const s = document.createElement('span');
      s.textContent = FACE_CN[f];
      box.appendChild(i); box.appendChild(s);
    }
  }

  /* ------------------------------------------------------------ 启动 */
  resize();
  updateCamera();
  updateHud();
  requestAnimationFrame(frame);
  // 空闲时预构建解法表
  setTimeout(() => { if (!tablesReady) { C.buildTables(); tablesReady = true; } }, 500);

  /* ------------------------------------------------------------ 调试接口 */
  // 供浏览器控制台调试与自动化冒烟测试使用，不影响正常使用
  window.__cube = {
    C, state, cam,
    isSolved: () => C.isSolved(state),
    snapshot: () => Array.from(state),
    tablesReady: () => tablesReady,
    method: () => method,
    solve: (m) => C.solve(state, m || method),
    turn: (name) => { const mv = C.MOVE_BY_NAME[name]; if (mv == null) return false; animateMove(mv, 160); return true; },
    // px/py 为 canvas 左上角为原点的 CSS 像素坐标
    pick: (px, py) => pickCube(px, py),
    busy: () => busy(),
    internals: () => ({
      anim: !!anim, queue: queue.length, turn: !!turn,
      playing, cursor, hasSolution: !!solution, interacting, busy: busy(),
    }),
    size: () => ({ W: W / dpr, H: H / dpr, dpr }),
    autoSpin: () => autoSpin,
    turn: () => turn ? {
      axis: turn.axis, layer: turn.layer, dir: turn.dir,
      angle: +turn.angle.toFixed(4), deg: +(turn.angle * 180 / Math.PI).toFixed(2),
      radial: +turn.radial.toFixed(3), sign: turn.sign,
      screenDir: turn.screenDir.map((v) => +v.toFixed(3)),
    } : null,
    setAutoSpin: (on) => { spinLocked = true; setAutoSpin(!!on); return autoSpin; },
  };
})();

</script>
