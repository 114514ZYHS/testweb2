<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e6dc}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.weather-panel,.weather-panel *{box-sizing:border-box;letter-spacing:0}
.weather-panel{position:fixed;z-index:10;top:max(20px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));width:252px;max-width:calc(100vw - 24px);color:#394b46;background:rgba(248,249,243,.96);border:1px solid #b8b69c;border-radius:8px;box-shadow:0 5px 20px #283e3b1a,inset 0 0 0 3px #fdfdf6;font:13px/1.4 'Microsoft YaHei',system-ui,sans-serif;user-select:none}
.weather-panel::before{content:'';position:absolute;left:15px;right:15px;top:0;height:2px;background:#b49a63}
.weather-heading{display:flex;align-items:center;gap:10px;padding:14px 13px 12px 16px}
.weather-emblem{color:#8c774a;display:flex;flex:0 0 auto}.weather-emblem svg{width:25px;height:25px}
.weather-heading-text{flex:1;min-width:0}
.weather-heading h2{font:600 14px/1.5 'Microsoft YaHei',system-ui,sans-serif;margin:0}
.weather-status{margin:1px 0 0;font-size:11px;color:#687970}
.weather-collapse{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border:1px solid transparent;border-radius:4px;background:transparent;color:#647267;cursor:pointer}
.weather-collapse:hover{background:#e7ece4;border-color:#c5cdbf}
.weather-collapse svg{width:17px;height:17px}
.weather-options{margin:0;padding:0 12px 13px;border:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:60vh;overflow-y:auto}
.weather-options[hidden]{display:none}
.weather-choice{position:relative;min-width:0;cursor:pointer}
.weather-choice input{position:absolute;width:1px;height:1px;opacity:0}
.weather-choice span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:65px;padding:8px 3px;border:1px solid #d6dbcf;border-radius:4px;background:#f0f3ec;color:#58695e;transition:.15s}
.weather-choice svg{width:21px;height:21px;stroke-width:1.6;flex-shrink:0}
.weather-choice:hover span{background:#e5ece1;border-color:#a7b5a5}
.weather-choice input:checked+span{background:#526f65;color:#fffbee;border-color:#476458;box-shadow:inset 0 0 0 1px #d2c49755}
.weather-choice input:focus-visible+span,.weather-collapse:focus-visible{outline:2px solid #a27839;outline-offset:3px}
.weather-auto{grid-column:1/-1;margin-bottom:3px}.weather-auto span{flex-direction:row;min-height:38px;gap:8px}.weather-auto svg{width:16px;height:16px}
.music-bar{border-top:1px solid #d6dbcf;padding:10px 12px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) 32px;align-items:center;gap:7px}
.music-bar button{display:grid;place-items:center;width:32px;height:34px;border:1px solid transparent;border-radius:4px;background:transparent;color:#526f65;cursor:pointer}
.music-bar button:hover{background:#e5ece1;border-color:#a7b5a5}
.music-bar button:focus-visible,.music-volume:focus-visible{outline:2px solid #a27839;outline-offset:2px}
.music-bar button svg{width:18px;height:18px}
.music-bar .music-play{width:34px;background:#526f65;color:#fffbee;border-color:#476458}
.music-bar .music-play:hover{background:#426055}
.music-track{min-width:0}
.music-track strong{display:block;font-size:12px;font-weight:600}
.music-track small{display:block;font-size:10px;line-height:1.5;color:#687970;overflow-wrap:anywhere}
.music-volume{grid-column:1/-1;width:100%;min-width:0;height:16px;margin:0;accent-color:#526f65;cursor:pointer}
.music-loading{animation:music-spin 1.4s linear infinite}
@keyframes music-spin{to{transform:rotate(360deg)}}
@media (max-width:600px){
.weather-panel{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:222px}
.weather-heading{padding:10px 9px 10px 12px}
.weather-options{padding:0 10px 10px;gap:5px}
.weather-choice span{min-height:59px}
.weather-auto span{min-height:38px}
.weather-panel:has(.music-bar) .weather-choice:not(.weather-auto) span{min-height:48px;gap:3px;padding:5px 3px}
.music-bar{padding:7px 10px 9px;gap:4px 7px}
}
@media (prefers-reduced-motion:reduce){
.weather-choice span{transition:none}
.music-loading{animation:none}
}

    update(state, time) {
      const intensity = state.snow || 0;
      const on = intensity > 0.02;
      mesh.visible = on;
      if(!on) { prevT = time; return; }
      let dt = Math.min(0.06, time - prevT);
      if(dt <= 0) { prevT = time; return; }
      prevT = time;

      camQ.copy(ze.quaternion);

      const cx = ze.position.x, cz = ze.position.z;
      const active = Math.floor(COUNT * intensity);
      const wind = state.wind || 0;

      for(let i = 0; i < COUNT; i++) {
        const p = P[i];
        if(i >= active) {
          p.on = false;
          V.position.set(0, -500, 0); V.scale.setScalar(0.001);
          V.updateMatrix(); mesh.setMatrixAt(i, V.matrix);
          continue;
        }
        if(!p.on) spawn(p, cx, cz);

        const sway = Math.sin(time * 2.4 + p.phase) * 0.55;
        const sway2 = Math.cos(time * 1.7 + p.phase * 1.3) * 0.35;
        p.x += (p.vx + wind * 2.2 + sway * 0.5) * dt;
        p.y += p.vy * dt;
        p.z += (p.vz + sway2 * 0.4) * dt;
        p.spin += p.spinV * dt;

        const gY = terrainHeight(p.x, p.z) + 0.03;
        if(p.y <= gY || p.y < -4 ||
           Math.abs(p.x - cx) > 40 || Math.abs(p.z - cz) > 40) p.on = false;

        V.position.set(p.x, p.y, p.z);
        V.quaternion.copy(camQ);
        V.rotateZ(p.spin);
        V.scale.setScalar(p.size);
        V.updateMatrix();
        mesh.setMatrixAt(i, V.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }
  };
})();

// ---------- 沙尘暴：saltation 弹跳 + 地面沙浪 + 地面积沙 ----------
const SandSystem = (() => {
  const FINE = 900;
  const GUST = 120;

  const fineGeo = new THREE.PlaneGeometry(0.22, 0.06);
  const fineMat = new THREE.MeshBasicMaterial({
    color: '#c9a56a', transparent: true, opacity: 0.55,
    depthWrite: false, side: THREE.DoubleSide
  });
  const fine = new THREE.InstancedMesh(fineGeo, fineMat, FINE);
  fine.frustumCulled = false;
  fine.name = 'sand-fine';
  ue.add(fine);

  const gustGeo = new THREE.PlaneGeometry(2.4, 0.9);
  const gustMat = new THREE.MeshBasicMaterial({
    color: '#b18d52', transparent: true, opacity: 0.32,
    depthWrite: false, side: THREE.DoubleSide
  });
  const gust = new THREE.InstancedMesh(gustGeo, gustMat, GUST);
  gust.frustumCulled = false;
  gust.name = 'sand-gust';
  ue.add(gust);

  const groundGeo = new THREE.PlaneGeometry(120, 120);
  const groundMat = new THREE.MeshBasicMaterial({
    color: '#c9a56a', transparent: true, opacity: 0, depthWrite: false
  });
  const groundPlane = new THREE.Mesh(groundGeo, groundMat);
  groundPlane.rotation.x = -Math.PI/2;
  groundPlane.position.y = 0.16;
  groundPlane.renderOrder = 2;
  groundPlane.name = 'sand-ground';
  ue.add(groundPlane);

  let seed = 6619;
  const rnd = () => (seed = (1664525 * seed + 1013904223) >>> 0, seed / 4294967296);

  const FP = [];
  for(let i = 0; i < FINE; i++) FP.push({
    x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, phase: 0, size: 1, on: false
  });
  const GP = [];
  for(let i = 0; i < GUST; i++) GP.push({
    x: 0, y: 0, z: 0, vx: 0, vz: 0, phase: 0, scale: 1, rot: 0, on: false
  });

  const V = new THREE.Object3D();
  let prevT = 0;

  function spawnFine(p, cx, cz) {
    p.x = cx - 26 - rnd() * 10;
    p.z = cz + (rnd() - 0.5) * 50;
    p.y = 0.3 + rnd() * 6.5;
    p.vx = 12 + rnd() * 16;
    p.vy = (rnd() - 0.5) * 1.6;
    p.vz = (rnd() - 0.5) * 1.8;
    p.phase = rnd() * 6.28;
    p.size = 0.6 + rnd() * 1.4;
    p.on = true;
  }

  function spawnGust(p, cx, cz) {
    p.x = cx - 30 - rnd() * 14;
    p.z = cz + (rnd() - 0.5) * 55;
    p.y = 0.5 + rnd() * 2.2;
    p.vx = 8 + rnd() * 8;
    p.vz = (rnd() - 0.5) * 1.2;
    p.phase = rnd() * 6.28;
    p.scale = 0.8 + rnd() * 1.6;
    p.rot = (rnd() - 0.5) * 0.3;
    p.on = true;
  }

  return {
    update(state, time) {
      const intensity = state.sand || 0;
      const on = intensity > 0.02;
      fine.visible = gust.visible = groundPlane.visible = on;
      if(!on) { prevT = time; return; }
      let dt = Math.min(0.05, time - prevT);
      if(dt <= 0) { prevT = time; return; }
      prevT = time;

      const cx = ze.position.x, cz = ze.position.z;
      const wind = state.wind || 0;
      const fineActive = Math.floor(FINE * intensity);
      const gustActive = Math.floor(GUST * intensity);

      for(let i = 0; i < FINE; i++) {
        const p = FP[i];
        if(i >= fineActive) {
          p.on = false;
          V.position.set(0, -500, 0); V.scale.setScalar(0.001);
          V.updateMatrix(); fine.setMatrixAt(i, V.matrix);
          continue;
        }
        if(!p.on) spawnFine(p, cx, cz);

        const gustSway = Math.sin(time * 2.5 + p.phase) * 1.5;
        p.x += (p.vx + wind * 4 + gustSway) * dt;
        p.y += (p.vy + Math.sin(time * 4 + p.phase) * 0.4) * dt;
        p.z += (p.vz + Math.cos(time * 3 + p.phase) * 0.5) * dt;

        const gY = terrainHeight(p.x, p.z) + 0.1;
        if(p.y <= gY && p.vy < 0) {
          p.vy = 1.2 + rnd() * 2.2;
          p.vx *= 0.9;
        }
        if(p.x > cx + 30 || p.y < 0.1 || p.y > 8 ||
           Math.abs(p.z - cz) > 55) p.on = false;

        V.position.set(p.x, p.y, p.z);
        V.rotation.set(0, 0, Math.sin(time * 5 + p.phase) * 0.7);
        V.scale.set(p.size, 1, 1);
        V.updateMatrix();
        fine.setMatrixAt(i, V.matrix);
      }
      fine.instanceMatrix.needsUpdate = true;

      for(let i = 0; i < GUST; i++) {
        const p = GP[i];
        if(i >= gustActive) {
          p.on = false;
          V.position.set(0, -500, 0); V.scale.setScalar(0.001);
          V.updateMatrix(); gust.setMatrixAt(i, V.matrix);
          continue;
        }
        if(!p.on) spawnGust(p, cx, cz);

        p.x += (p.vx + wind * 6) * dt;
        p.y += Math.sin(time * 1.8 + p.phase) * 0.15 * dt;

        if(p.x > cx + 34 || Math.abs(p.z - cz) > 55) p.on = false;

        V.position.set(p.x, p.y, p.z);
        V.rotation.set(0, 0, p.rot);
        V.scale.set(p.scale, p.scale, 1);
        V.updateMatrix();
        gust.setMatrixAt(i, V.matrix);
      }
      gust.instanceMatrix.needsUpdate = true;

      groundMat.opacity = intensity * 0.42;
    }
  };
})();

// ---------- 闪电：天际线折线 + 伴随脉冲点光 ----------
const LightningSystem = (() => {
  const MAXBOLTS = 3;
  const SEG = 22;
  const bolts = [];
  for(let i = 0; i < MAXBOLTS; i++) {
    const g = new THREE.BufferGeometry();
    const positions = new Float32Array(SEG * 2 * 3);
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
    const m = new THREE.LineBasicMaterial({color:'#f4f7ff', transparent:true, opacity:0, depthWrite:false, linewidth:1});
    const line = new THREE.LineSegments(g, m);
    line.frustumCulled = false;
    line.visible = false;
    ue.add(line);
    const strike = new THREE.PointLight('#c8daff', 0, 40, 2);
    strike.position.set(0, 20, 0);
    ue.add(strike);
    bolts.push({line, mat:m, strike, life:0, dur:0, active:false, x:0, z:0, seed:0});
  }

  const skyFlash = new THREE.AmbientLight('#d8e0ff', 0);
  ue.add(skyFlash);

  let nextCheck = 0;
  let rndSeed = 9917;
  const rnd = () => (rndSeed = (1664525 * rndSeed + 1013904223) >>> 0, rndSeed / 4294967296);

  function makeBolt(b, cx, cz) {
    b.x = cx + (rnd() - 0.5) * 40;
    b.z = cz + (rnd() - 0.5) * 40;
    b.seed = rnd() * 6.28;
    const pos = b.line.geometry.attributes.position;
    let px = b.x, py = 28, pz = b.z;
    let vx = (rnd() - 0.5) * 0.9;
    let vz = (rnd() - 0.5) * 0.9;
    for(let i = 0; i < SEG; i++) {
      const nx = px + vx + (rnd() - 0.5) * 1.4;
      const nz = pz + vz + (rnd() - 0.5) * 1.4;
      const ny = py - 1.4 - rnd() * 0.7;
      pos.setXYZ(i * 2, px, py, pz);
      pos.setXYZ(i * 2 + 1, nx, ny, nz);
      px = nx; py = ny; pz = nz;
      if(py < 0) break;
    }
    pos.needsUpdate = true;
    b.line.geometry.computeBoundingSphere();
    b.strike.position.set(px, 8, pz);
  }

  return {
    update(state, time) {
      const intensity = state.lightning || 0;
      skyFlash.intensity *= 0.82;
      if(intensity > 0.01) {
        if(time > nextCheck) {
          nextCheck = time + 0.5 + rnd() * (3.5 - intensity * 3);
          const live = bolts.find(b => !b.active);
          if(live && rnd() < 0.35 + intensity * 0.5) {
            makeBolt(live, ze.position.x, ze.position.z);
            live.active = true;
            live.life = 0;
            live.dur = 0.28 + rnd() * 0.35;
            live.mat.opacity = 1;
            live.line.visible = true;
            live.strike.intensity = 4.5;
            skyFlash.intensity = 1.4 * intensity;
          }
        }
      }
      bolts.forEach(b => {
        if(!b.active) return;
        b.life += 0.016;
        const t = b.life / b.dur;
        if(t >= 1) {
          b.active = false;
          b.line.visible = false;
          b.mat.opacity = 0;
          b.strike.intensity = 0;
          return;
        }
        const flick = Math.sin(t * 60 + b.seed) > 0 ? 0.6 + 0.4 * Math.sin(t * 22) : 0.15;
        b.mat.opacity = Math.max(0, (1 - t) * flick);
        b.strike.intensity = (1 - t) * 4.5 * (0.5 + 0.5 * flick);
        b.line.geometry.attributes.position.needsUpdate = true;
      });
    }
  };
})();

// ---------- 龙卷风：Shader 漏斗 + 四类碎屑物理 + 接地暗环 ----------
const TornadoSystem = (() => {
  const H = 22, SEG = 48, RINGS = 36;

  const shellGeo = new THREE.BufferGeometry();
  const verts = [];
  const indices = [];
  for(let r = 0; r <= RINGS; r++) {
    const yFrac = r / RINGS;
    const y = yFrac * H;
    const radiusBase = 0.13 + Math.pow(yFrac, 1.65) * 5.4;
    for(let s = 0; s <= SEG; s++) {
      const a = s / SEG * Math.PI * 2;
      verts.push(Math.cos(a) * radiusBase, y, Math.sin(a) * radiusBase);
    }
  }
  for(let r = 0; r < RINGS; r++) {
    for(let s = 0; s < SEG; s++) {
      const i0 = r * (SEG + 1) + s;
      const i1 = i0 + 1;
      const i2 = i0 + (SEG + 1);
      const i3 = i2 + 1;
      indices.push(i0, i1, i2, i1, i3, i2);
    }
  }
  shellGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  shellGeo.setIndex(indices);

  const funnelUniforms = {
    uTime: {value: 0},
    uIntensity: {value: 0}
  };
  const shellMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: funnelUniforms,
    vertexShader: `
      uniform float uTime;
      uniform float uIntensity;
      varying vec3 vPos;
      varying vec3 vWorld;
      void main() {
        vPos = position;
        vec3 p = position;
        float yFrac = position.y / 22.0;
        float ang = atan(position.z, position.x);
        float wob = sin(position.y * 0.55 + uTime * 3.1 + ang * 2.0) * 0.24 * uIntensity
                  + sin(position.y * 1.3 - uTime * 2.4) * 0.11 * uIntensity;
        p.x += wob * cos(ang);
        p.z += wob * sin(ang);
        p.x += sin(position.y * 0.4 + uTime * 1.9) * 0.38 * yFrac * uIntensity;
        p.z += cos(position.y * 0.42 + uTime * 1.7) * 0.30 * yFrac * uIntensity;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uIntensity;
      varying vec3 vPos;
      varying vec3 vWorld;
      void main() {
        float yFrac = vPos.y / 22.0;
        float ang = atan(vWorld.z, vWorld.x);
        float band = sin(vPos.y * 2.6 - uTime * 5.5 + ang * 5.0) * 0.5 + 0.5;
        float band2 = sin(vPos.y * 8.0 + uTime * 9.0) * 0.5 + 0.5;
        float band3 = sin(ang * 8.0 + uTime * 6.0) * 0.5 + 0.5;
        float alpha = (0.12 + band * 0.30 + band2 * 0.14 + band3 * 0.08) * uIntensity;
        alpha *= smoothstep(0.0, 0.10, yFrac) * (1.0 - smoothstep(0.88, 1.0, yFrac) * 0.55);
        vec3 col = mix(vec3(0.28, 0.26, 0.24), vec3(0.60, 0.55, 0.47), band);
        col = mix(col, vec3(0.16, 0.14, 0.13), yFrac * 0.55);
        gl_FragColor = vec4(col, alpha);
      }
    `
  });
  const funnel = new THREE.Mesh(shellGeo, shellMat);
  funnel.frustumCulled = false;
  funnel.name = 'tornado-funnel';
  ue.add(funnel);

  const baseRing = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 3.2, 48, 1, 0, Math.PI * 1.72),
    new THREE.MeshBasicMaterial({
      color: '#2f2a24', transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide
    })
  );
  baseRing.rotation.x = -Math.PI / 2;
  baseRing.position.y = 0.19;
  baseRing.name = 'tornado-ring';
  ue.add(baseRing);

  const DUST = 90;
  const dustGeo = new THREE.PlaneGeometry(0.55, 0.3);
  const dustMat = new THREE.MeshBasicMaterial({
    color: '#a08a63', transparent: true, opacity: 0.4,
    depthWrite: false, side: THREE.DoubleSide
  });
  const groundDust = new THREE.InstancedMesh(dustGeo, dustMat, DUST);
  groundDust.frustumCulled = false;
  groundDust.name = 'tornado-ground-dust';
  ue.add(groundDust);
  let dSeed = 3319;
  const dRnd = () => (dSeed = (1664525 * dSeed + 1013904223) >>> 0, dSeed / 4294967296);
  const DP = [];
  for(let i = 0; i < DUST; i++) DP.push({
    r: 0, a: 0, y: 0, va: 0, vy: 0, phase: 0, on: false
  });

  const DEF = {
    plank: {n: 90, geo: new THREE.BoxGeometry(0.9, 0.06, 0.16), col: '#8a6a46', mass: 1.0},
    tile:  {n: 70, geo: new THREE.BoxGeometry(0.42, 0.05, 0.30), col: '#a6684e', mass: 0.85},
    hay:   {n: 50, geo: new THREE.BoxGeometry(0.62, 0.34, 0.44), col: '#cfa65a', mass: 0.38},
    stone: {n: 40, geo: new THREE.IcosahedronGeometry(0.17, 0), col: '#9c9684', mass: 1.6}
  };
  const debrisGroups = {};
  for(const k of Object.keys(DEF)) {
    const def = DEF[k];
    const mesh = new THREE.InstancedMesh(
      def.geo,
      new THREE.MeshToonMaterial({color: def.col, gradientMap: Ms}),
      def.n
    );
    mesh.frustumCulled = false;
    mesh.castShadow = true;
    mesh.name = `tornado-debris-${k}`;
    mesh.visible = false;
    ue.add(mesh);
    const items = [];
    for(let i = 0; i < def.n; i++) {
      items.push({
        mass: def.mass,
        x: 0, y: -500, z: 0, vx: 0, vy: 0, vz: 0,
        rx: 0, ry: 0, rz: 0, sx: 0, sy: 0, sz: 0,
        lr: 0, la: 0, ly: 0,
        state: 'idle',
        idleX: 0, idleZ: 0, idleRy: 0,
        timer: 0, seed: 0
      });
    }
    debrisGroups[k] = {mesh, items, kind: k};
  }

  let seed = 7781;
  const rnd = () => (seed = (1664525 * seed + 1013904223) >>> 0, seed / 4294967296);

  const anchor = new THREE.Vector3(-2, 0, 3);
  let wanderA = 0, wanderT = 0;
  let inited = false;

  function seedIdle(d, cx, cz) {
    const a = rnd() * 6.28;
    const r = 5 + rnd() * 24;
    d.idleX = cx + Math.cos(a) * r;
    d.idleZ = cz + Math.sin(a) * r;
    d.idleRy = rnd() * 6.28;
    d.x = d.idleX;
    d.z = d.idleZ;
    d.y = terrainHeight(d.idleX, d.idleZ) + 0.13;
    d.vx = d.vy = d.vz = 0;
    d.rx = 0; d.ry = d.idleRy; d.rz = 0;
    d.sx = d.sy = d.sz = 0;
    d.state = 'idle';
    d.seed = rnd() * 6.28;
    d.timer = 0;
  }

  const V = new THREE.Object3D();

  return {
    get position() { return anchor; },
    update(state, time) {
      const intensity = state.tornado || 0;
      const on = intensity > 0.02;
      funnel.visible = on;
      baseRing.visible = on;
      groundDust.visible = on;
      for(const k of Object.keys(debrisGroups)) debrisGroups[k].mesh.visible = on;
      if(!on) { inited = false; return; }

      const dt = 0.016;
      const cxWorld = ze.position.x, czWorld = ze.position.z;

      if(!inited) {
        inited = true;
        for(const k of Object.keys(debrisGroups))
          for(const d of debrisGroups[k].items) seedIdle(d, cxWorld, czWorld);
        for(let i = 0; i < DUST; i++) {
          const p = DP[i];
          p.r = 1.5 + dRnd() * 3.5;
          p.a = dRnd() * 6.28;
          p.y = dRnd() * 2.2;
          p.va = 3.5 + dRnd() * 3;
          p.vy = 0.9 + dRnd() * 2.2;
          p.phase = dRnd() * 6.28;
          p.on = true;
        }
      }

      wanderT += dt;
      wanderA = Math.sin(wanderT * 0.45) * 0.7 + Math.sin(wanderT * 0.14) * 0.35;
      const tx = -2 + Math.cos(wanderA) * 4;
      const tz = 3 + Math.sin(wanderA) * 4;
      anchor.x += (tx - anchor.x) * dt * 0.55;
      anchor.z += (tz - anchor.z) * dt * 0.55;

      funnel.position.set(anchor.x, 0.13, anchor.z);
      funnel.rotation.y = time * 1.6;
      funnelUniforms.uTime.value = time;
      funnelUniforms.uIntensity.value = intensity;

      baseRing.position.x = anchor.x;
      baseRing.position.z = anchor.z;
      baseRing.rotation.z = -time * 3.4;
      baseRing.scale.setScalar(0.85 + intensity * 0.5);
      baseRing.material.opacity = intensity * 0.6;

      const dustActive = Math.floor(DUST * intensity);
      const baseR = 1.4 + intensity * 2.4;
      for(let i = 0; i < DUST; i++) {
        const p = DP[i];
        if(i >= dustActive) {
          V.position.set(0, -500, 0); V.scale.setScalar(0.001);
          V.updateMatrix(); groundDust.setMatrixAt(i, V.matrix);
          continue;
        }
        p.a += p.va * dt;
        p.y += p.vy * dt;
        if(p.y > 3.2) { p.y = dRnd() * 0.6; p.r = baseR + dRnd() * 2.8; }
        p.r *= 1 - dt * 0.25;
        if(p.r < 0.6) p.r = baseR + dRnd() * 2.5;
        const px = anchor.x + Math.cos(p.a) * p.r;
        const pz = anchor.z + Math.sin(p.a) * p.r;
        const gy = terrainHeight(px, pz) + 0.2;
        V.position.set(px, gy + p.y, pz);
        V.rotation.set(0, p.a + Math.PI / 2, Math.sin(p.phase + time * 5) * 0.4);
        const sc = 0.6 + 0.7 * Math.abs(Math.sin(p.phase + time * 6));
        V.scale.set(sc, sc * 0.7, 1);
        V.updateMatrix();
        groundDust.setMatrixAt(i, V.matrix);
      }
      groundDust.instanceMatrix.needsUpdate = true;

      const captureR = 12 + intensity * 6;
      const captureR2 = captureR * captureR;

      for(const k of Object.keys(debrisGroups)) {
        const grp = debrisGroups[k];
        const items = grp.items;
        for(let i = 0; i < items.length; i++) {
          const d = items[i];

          if(d.state === 'idle') {
            const dx = d.x - anchor.x, dz = d.z - anchor.z;
            if(dx * dx + dz * dz < captureR2) {
              d.state = 'caught';
              d.lr = Math.sqrt(dx * dx + dz * dz) || 0.5;
              d.la = Math.atan2(dz, dx);
              d.ly = Math.max(0.1, d.y - terrainHeight(d.x, d.z));
              d.timer = 0;
            }
          } else if(d.state === 'caught') {
            const light = 1 / d.mass;
            d.lr *= 1 - dt * (0.50 + light * 0.55);
            d.la += dt * (2.4 + light * 3.2) / (0.55 + d.lr * 0.35);
            d.ly += dt * (3.0 + light * 3.2);
            d.rx += dt * 6;
            d.rz += dt * 4;
            d.timer += dt;

            const nx = anchor.x + Math.cos(d.la) * d.lr;
            const nz = anchor.z + Math.sin(d.la) * d.lr;
            d.x = nx;
            d.z = nz;
            d.y = terrainHeight(nx, nz) + 0.1 + d.ly;

            if(d.ly > 14 || d.lr < 0.25) {
              d.state = 'ejected';
              const light2 = 1 / d.mass;
              const tSpeed = 7 + light2 * 6 + intensity * 4;
