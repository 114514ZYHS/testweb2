/* =========================================================================

const V3 = THREE.Vector3;
const FX = 1;                       // layer for transparent / effect objects (excluded from outline pass)
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// deterministic random
let _seed = 20260923;
function rnd() { _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const pick = (a) => a[Math.floor(rnd() * a.length)];
const hash1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* =========================================================================

const G3 = (() => {
  const t = new THREE.DataTexture(new Uint8Array([88, 168, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const mcache = new Map();
function T(color, opts) {                               // toon (outdoor)
  if (!opts && mcache.has(color)) return mcache.get(color);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: G3, ...(opts || {}) });
  if (!opts) mcache.set(color, m);
  return m;
}
const icache = new Map();
function TI(color, glow = 0.3) {                        // toon (interior, self-lit warm)
  const k = color + '|' + glow;
  if (icache.has(k)) return icache.get(k);
  const c = new THREE.Color(color);
  const m = new THREE.MeshToonMaterial({ color: c, gradientMap: G3, emissive: c.clone().multiplyScalar(glow).multiply(new THREE.Color(1.0, 0.93, 0.82)) });
  icache.set(k, m); return m;
}
function TM(tex, opts = {}) { return new THREE.MeshToonMaterial({ map: tex, gradientMap: G3, ...opts }); }
function GL(color, k = 1.5) { const m = new THREE.MeshBasicMaterial({ color }); m.color.multiplyScalar(k); return m; }
function GLM(tex, k = 1.3, opts = {}) { return new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(k, k, k), ...opts }); }
function productMat(glow) {
  const m = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: G3 });
  m.onBeforeCompile = (s) => {
    s.fragmentShader = s.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       #ifdef USE_COLOR
         totalEmissiveRadiance += vColor.rgb * ${glow.toFixed(3)};
       #endif`);
  };
  m.customProgramCacheKey = () => 'prod' + glow;
  return m;
}

function mesh(geo, mat, parent = scene) { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; }
function B(w, h, d, mat, x, y, z, parent) { const m = mesh(new THREE.BoxGeometry(w, h, d), mat, parent); m.position.set(x, y + h / 2, z); return m; }
function BX(x0, x1, y0, y1, z0, z1, mat, parent) { return B(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, y0, (z0 + z1) / 2, parent); }
function C(r, h, mat, x, y, z, parent, seg = 16, rTop) { const m = mesh(new THREE.CylinderGeometry(rTop ?? r, r, h, seg), mat, parent); m.position.set(x, y + h / 2, z); return m; }
function rod(a, b, r, mat, parent, seg = 8) {
  const A = new V3(...a), Bv = new V3(...b), len = A.distanceTo(Bv);
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), mat, parent);
  m.position.copy(A).add(Bv).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), Bv.clone().sub(A).normalize());
  return m;
}
function P(w, h, mat, x, y, z, ry = 0, parent) { const m = mesh(new THREE.PlaneGeometry(w, h), mat, parent); m.position.set(x, y, z); m.rotation.y = ry; return m; }
function flat(w, d, mat, x, y, z, rz = 0, parent) { const m = mesh(new THREE.PlaneGeometry(w, d), mat, parent); m.rotation.set(-Math.PI / 2, 0, rz); m.position.set(x, y, z); return m; }
function fx(o, order) { o.traverse((c) => { c.layers.set(FX); if (order !== undefined) c.renderOrder = order; }); return o; }
function group(x = 0, y = 0, z = 0, ry = 0, parent = scene) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; }
const UB = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
function instanced(geo, mat, items, parent = scene) {
  if (!items.length) return null;
  const im = new THREE.InstancedMesh(geo, mat, items.length);
  const o = new THREE.Object3D(), col = new THREE.Color();
  items.forEach((it, i) => {
    o.position.set(...it.p); o.rotation.set(...(it.r || [0, 0, 0])); o.scale.set(...(it.s || [1, 1, 1]));
    o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    im.setColorAt(i, col.set(it.c || '#ffffff'));
  });
  im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
  im.computeBoundingSphere();
  parent.add(im); return im;
}

function ctex(w, h, draw) {

  const g = c.getContext('2d'); draw(g, w, h);

function txt(g, s, x, y, size, color, o = {}) {
  g.save();
  g.font = `${o.weight || 800} ${size}px ${o.font || JP}`;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  g.translate(x, y);
  if (o.sy) g.scale(1, o.sy);
  if (o.maxW) { const m = g.measureText(s).width; if (m > o.maxW) g.scale(o.maxW / m, 1); }
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.sw || size * 0.2; g.strokeStyle = o.stroke; g.strokeText(s, 0, 0); }
  g.fillStyle = color; g.fillText(s, 0, 0);
  g.restore();
}
function rr(g, x, y, w, h, r, fill, stroke, lw = 4) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function circ(g, x, y, r, fill, stroke, lw = 4) {
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}

/* =========================================================================
   Wet road reflector (puddles + ripples)
   ========================================================================= */
const WetShader = {
  name: 'WetShader',
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 } },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
    void main(){ vUv = textureMatrix * vec4(position,1.0); vec4 w = modelMatrix * vec4(position,1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime;
    varying vec4 vUv; varying vec3 vWorld;
    float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
    vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
    float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h12(i),h12(i+vec2(1,0)),f.x), mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
    vec3 ripples(vec2 p){
      vec2 acc = vec2(0.0); float ring = 0.0; vec2 ip = floor(p);
      for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
        vec2 c = ip + vec2(float(i), float(j));
        float h = h12(c);
        float cyc = uTime*(0.55+h*0.5) + h*9.7;
        float t = fract(cyc);
        vec2 ctr = c + 0.15 + 0.7*h22(c + floor(cyc)*1.37);
        vec2 d = p - ctr; float r = length(d);
        float R = t*0.85;
        float q = (r-R)*16.0;
        float w = exp(-q*q) * (1.0-t)*(1.0-t);
        ring += w; acc += (d/(r+1e-4)) * sin((r-R)*42.0) * w;
      }
      return vec3(acc, ring);
    }
    void main(){
      vec2 wp = vWorld.xz;
      float n = fbm(wp*0.3 + vec2(3.1, 7.7));
      float puddle = smoothstep(0.53, 0.58, n);
      vec3 rp = ripples(wp*2.3);
      vec2 dist = rp.xy*(0.012 + 0.028*puddle) + (vec2(fbm(wp*2.5), fbm(wp*2.5+5.0))-0.5)*0.035*(1.0-puddle);
      vec4 uv = vUv; uv.xy += dist*uv.w;
      vec3 refl = vec3(0.0);
      float streak = mix(0.028, 0.004, puddle);
      for(int k=0;k<6;k++){ vec4 u2 = uv; u2.y += (float(k)-1.5)*streak*uv.w; refl += texture2DProj(tDiffuse, u2).rgb; }
      refl /= 6.0;
      vec3 col = refl * color;
      col += rp.z * vec3(0.22,0.28,0.4) * (0.25 + 0.75*puddle) * 0.6;
      float rim = smoothstep(0.515,0.53,n) - smoothstep(0.53,0.545,n);
      col += rim * vec3(0.10,0.13,0.2);
      float a = mix(0.42, 0.92, puddle);
      gl_FragColor = vec4(col, a);
    }`
};

const glassVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const glassFS = /* glsl */`
  uniform float uTime; uniform vec2 uSize; uniform float uSeed; uniform float uTint; varying vec2 vUv;
  float h11(float n){ return fract(sin(n*127.1 + uSeed*31.7)*43758.5453); }
  float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)) + uSeed*17.0)*43758.5453); }
  void main(){
    vec2 p = vUv * uSize;
    float drops = 0.0, trail = 0.0;
    float cw = 0.085;
    float col = floor(p.x / cw);
    float hc = h11(col);
    if (hc > 0.42) {
      float speed = 0.1 + h11(col + 3.1)*0.32;
      float L = uSize.y + 0.9;
      float head = uSize.y + 0.25 - mod(uTime*speed + hc*L*5.0, L);
      float wob = sin(p.y*9.0 + col*1.7)*0.012 + sin(p.y*23.0 + col)*0.004;

{

  for (let i = 0; i < 5; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: st, color: 0xfff4e6, transparent: true, depthWrite: false, opacity: 0 }));
    s.scale.set(0.18, 0.18, 1); fx(s, 5); scene.add(s);
    steam.push({ s, off: i / 5, x: 0.8 + (i % 3) * 0.12, z: -4.7 + (i % 2) * 0.2 });
  }
}

/* =========================================================================
   Post-processing: outline (normals + depth) → bloom → output
   ========================================================================= */
const rtColor = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const rtNormal = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
rtNormal.depthTexture = new THREE.DepthTexture(1, 1);
const normalMat = new THREE.MeshNormalMaterial();
const edgeMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rtColor.texture }, tNormal: { value: rtNormal.texture }, tDepth: { value: rtNormal.depthTexture },
    uRes: { value: new THREE.Vector2(1, 1) }, uNear: { value: camera.near }, uFar: { value: camera.far }, uThick: { value: Math.max(1, DPR * 0.8) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    #include <packing>
    uniform sampler2D tColor, tNormal, tDepth; uniform vec2 uRes; uniform float uNear, uFar, uThick; varying vec2 vUv;
    float iz(vec2 uv){ return -1.0 / perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar); }
    vec3 nrm(vec2 uv){ return texture2D(tNormal, uv).xyz * 2.0 - 1.0; }
    void main(){
      vec2 px = uThick / uRes;
      vec3 col = texture2D(tColor, vUv).rgb;
      if (!(col.r >= 0.0 && col.g >= 0.0 && col.b >= 0.0 && col.r < 60000.0)) col = vec3(0.0);   // guard NaN/Inf
      float z0 = iz(vUv);
      float lap = (iz(vUv - vec2(px.x,0.0)) + iz(vUv + vec2(px.x,0.0)) + iz(vUv + vec2(0.0,px.y)) + iz(vUv - vec2(0.0,px.y)) - 4.0*z0) / z0;
      float eD = smoothstep(0.03, 0.09, lap);
      vec3 n0 = nrm(vUv);
      float dn = (1.0 - dot(n0, nrm(vUv - vec2(px.x,0.0)))) + (1.0 - dot(n0, nrm(vUv + vec2(0.0,px.y))));
      float eN = smoothstep(0.3, 0.7, dn);
      float fade = smoothstep(0.004, 0.012, z0);
      float e = clamp(max(eD, eN), 0.0, 1.0) * mix(0.5, 1.0, fade);
      vec3 ink = col * 0.16 + vec3(0.012, 0.016, 0.04);
      col = mix(col, ink, e * 0.9);
      vec2 q = vUv - 0.5;
      col *= mix(0.6, 1.0, smoothstep(0.95, 0.3, length(q * vec2(1.15, 1.0))));
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType }));
composer.addPass(new ShaderPass(edgeMat));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.52, 0.5, 0.94);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================================================
   Camera controls, resize
   ========================================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.2, 1.4, 0.4);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 10; controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.49; controls.minPolarAngle = 0.08;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9; controls.panSpeed = 0.6;
controls.screenSpacePanning = true;
function fitCamera() {
  const a = innerWidth / innerHeight;
  const dist = a >= 1.3 ? 41 : 41 * Math.min(2.2, 1.3 / Math.max(a, 0.45)) * 0.9;
  const dir = new V3(0.42, 0.44, 0.79).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
}
fitCamera();
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
  rtColor.setSize(w * DPR, h * DPR); rtNormal.setSize(w * DPR, h * DPR);
  edgeMat.uniforms.uRes.value.set(w * DPR, h * DPR);
}
resize();
addEventListener('resize', resize);

/* =========================================================================
   Animation
   ========================================================================= */
const clock = new THREE.Clock();
const flick = (t, rate, seed, thr) => { const r = hash1(Math.floor(t * rate) + seed); return r > thr ? (Math.sin(t * 97 + seed) > -0.2 ? 0.35 : 1.0) : 1.0; };
const ease = (x) => x * x * (3 - 2 * x);
const SIG = { g: new THREE.Color('#29e0b4'), y: new THREE.Color('#ffb52a'), r: new THREE.Color('#ff3a2a') };

function update(t) {
  sharedTime.value = t;
  // automatic door
  const dc = t % 11; let f = 0;
  if (dc < 0.7) f = ease(dc / 0.7); else if (dc < 3.2) f = 1; else if (dc < 3.9) f = ease(1 - (dc - 3.2) / 0.7);
  doorL.position.x = 0.15 - f * 0.86; doorR.position.x = 1.05 + f * 0.86;
  canopyLight.intensity = 7 + f * 2.5;
  sensorLed.material.color.set(f > 0.01 ? '#40ff70' : '#ff3030').multiplyScalar(2);
  // signs
  const hum = 1 + Math.sin(t * 60) * 0.01;
  const fk = flick(t, 5, 3.1, 0.955);
  fasciaFront.color.setScalar(1.12 * hum * (fk < 1 ? 0.8 : 1));
  fasciaSide.color.setScalar(1.12 * hum);
  pSignMat.color.setScalar(1.2 * flick(t, 7, 11.7, 0.9));
  tabakoMat.color.setScalar(1.1 * flick(t, 4, 5.3, 0.88));
  const ab = flick(t, 9, 1.9, 0.8);
  alleyBulb.material.color.set('#ffcf8a').multiplyScalar(3 * ab);
  alleyLight.intensity = 3 * ab;
  toggleWin.m.material = (t % 46) < 34 ? toggleWin.on : toggleWin.off;
  // traffic signals
  const cyc = t % 24;
  const A = cyc < 9 ? 'g' : cyc < 11.5 ? 'y' : 'r';
  const Bs = cyc < 12 ? 'r' : cyc < 21 ? 'g' : cyc < 23.5 ? 'y' : 'r';
  for (const l of lamps) { const st = l.grp === 'A' ? A : Bs; l.m.color.copy(l.m.userData.base).multiplyScalar(l.kind === st ? 2.4 : 0.07); }
  const blink = (Math.floor(t * 3) % 2) === 0;
  const walkF = Bs === 'g' && !(cyc > 19 && !blink), walkR = A === 'g' && !(cyc > 7 && !blink);
  for (const p of pedLamps) {
    const green = p.grp === 'F' ? Bs === 'g' : A === 'g';
    const on = p.walk ? (p.grp === 'F' ? walkF : walkR) : !green;
    p.m.color.setScalar(on ? 2.0 : 0.1);
  }
  sigLight.color.copy(SIG[A]);
  for (const fn of fans) fn.o.rotation[fn.axis] = t * fn.s;
  // eave drips
  for (const d of drips) {
    const lt = (t + d.off) % d.period, hang = d.period - 1.35;
    const fallT = Math.sqrt((d.top - d.ground) / 4.9);
    if (lt < hang) {
      const s = lt / hang; d.d.visible = true; d.d.scale.setScalar(0.35 + s * 0.75); d.d.position.set(d.x, d.top - s * 0.03, d.z); d.rm.opacity = 0;
    } else {
      const ft = lt - hang;
      if (ft < fallT) { d.d.visible = true; d.d.scale.set(0.9, 1.6, 0.9); d.d.position.set(d.x, d.top - 4.9 * ft * ft, d.z); d.rm.opacity = 0; }
      else { d.d.visible = false; const rt = (ft - fallT) / 0.6; d.r.scale.setScalar(0.03 + rt * 0.22); d.rm.opacity = Math.max(0, 0.75 * (1 - rt)); }
    }
  }
  for (const s of steam) {
    const k = (t * 0.35 + s.off) % 1;
    s.s.position.set(s.x + Math.sin(t * 1.3 + s.off * 9) * 0.04 * k, 1.3 + k * 0.7, s.z);
    s.s.material.opacity = Math.sin(k * Math.PI) * 0.35; s.s.scale.setScalar(0.12 + k * 0.28);
  }
}

const TB = new THREE.Box3(new V3(-9, 0, -9), new V3(9, 6, 9));
function render() {
  requestAnimationFrame(render);
  const t = clock.getElapsedTime();
  update(t);
  controls.update();
  controls.target.clamp(TB.min, TB.max);
  // 1) normals + depth (outline source), solid geometry only
  scene.overrideMaterial = normalMat;
  const bg = scene.background; scene.background = null;
  camera.layers.set(0);
  renderer.setClearColor(0x7f7fff, 1);
  renderer.setRenderTarget(rtNormal); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; scene.background = bg;
  camera.layers.enable(FX);
  renderer.setClearColor(0x070c18, 1);
  // 2) colour pass (with reflector, rain, glass)
  renderer.setRenderTarget(rtColor); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  // 3) outline composite → bloom → tone map
  composer.render();
}
render();
window.__ready = true;
</script>

</body>
</html>
