  冷通道 · COLD AISLE

  一段没有任务、没有敌人、也没有出口的第一人称漫游。你站在一条无限延伸的 AI 服务器机房走廊里：头顶的荧光灯管亮着，脚下的抛光地板映出两排走不完的机柜，只有硬盘寻道的咔哒声、继电器的轻响，和远处空调压缩机的启停，证明这里还活着。偶尔，一台黄色的履带巡检机器人从走廊深处驶来——它停下，机械臂抬起，扇形扫描光缓缓刷过机柜。那是这片空间里唯一会动的东西。

  操作：W A S D 移动 · 鼠标转向 · Shift 快走 · Space 跳跃 · Esc 释放鼠标
  需要 WebGL2。首次点击画面既是为了锁定指针，也是浏览器允许播放声音的前提。
-->
