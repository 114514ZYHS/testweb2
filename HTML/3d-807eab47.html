<!DOCTYPE html>
<html lang="zh-CN">

<head><base href="/preview/3d-807eab47/ve363613aebc0/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>箱庭小镇 · Diorama Town</title>
  <style>
    :root {
      --ink: #eaf1f8;
      --ink-dim: #9db0c4;
      --panel: rgba(16, 22, 32, 0.62);
      --panel-2: rgba(26, 34, 48, 0.72);
      --line: rgba(180, 205, 235, 0.16);
      --accent: #ffcb73;
      --accent-2: #7fc8ff;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #070b12;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #scene:active { cursor: grabbing; }

    /* ---------------- HUD ---------------- */
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 268px;
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      user-select: none;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .brand span {
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--ink-dim);
      font-weight: 500;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }

    button {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.12s, color 0.18s;
      white-space: nowrap;
    }
    button:hover { background: rgba(52, 68, 92, 0.85); border-color: rgba(200, 220, 245, 0.3); }
    button:active { transform: translateY(1px); }
    button.on {
      background: linear-gradient(180deg, rgba(255, 203, 115, 0.22), rgba(255, 203, 115, 0.1));
      border-color: rgba(255, 203, 115, 0.45);
      color: #ffe3ad;
    }
    #btnDayNight {
      font-weight: 600;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, rgba(255, 203, 115, 0.26), rgba(255, 176, 90, 0.12));
      border-color: rgba(255, 203, 115, 0.45);
      color: #ffdfa6;
    }
    #btnDayNight.night {
      background: linear-gradient(180deg, rgba(127, 200, 255, 0.24), rgba(80, 140, 220, 0.1));
      border-color: rgba(127, 200, 255, 0.4);
      color: #cfe8ff;
    }
    .ico { font-size: 13px; }

    .chips button { padding: 6px 4px; font-size: 11px; color: var(--ink-dim); }
    .chips button:hover { color: var(--ink); }

    #clock {
      width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .label { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.1em; white-space: nowrap; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, #12203a 0%, #3d5b86 22%, #7fc8ff 40%, #ffd79a 50%, #e08b52 62%, #25406b 78%, #0d1727 100%);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff6e2;
      border: 2px solid rgba(255, 203, 115, 0.9);
      box-shadow: 0 0 10px rgba(255, 203, 115, 0.7);
      cursor: pointer;
    }

    #fps {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(157, 176, 196, 0.75);
    }

    #tip {
      position: fixed;
      left: 20px;
      bottom: 18px;
      font-size: 11px;
      line-height: 1.8;
      color: rgba(157, 176, 196, 0.66);
      letter-spacing: 0.05em;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }
    #tip b { color: rgba(234, 241, 248, 0.9); font-weight: 600; }

    /* ---------------- 载入 ---------------- */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(120% 90% at 50% 20%, #152239 0%, #080c14 62%, #04070c 100%);
      z-index: 100;
      transition: opacity 0.85s ease, visibility 0.85s;
    }
    #loading.hide { opacity: 0; visibility: hidden; }
    #loading .t {
      font-size: 13px;
      letter-spacing: 0.5em;
      color: #cfe0f2;
      text-indent: 0.5em;
    }
    #loading .bar {
      width: 190px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #loading .bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #ffcb73, transparent);
      animation: sweep 1.15s ease-in-out infinite;
    }
    #loading .s { font-size: 10px; letter-spacing: 0.28em; color: rgba(157, 176, 196, 0.6); }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    @media (max-width: 700px) {
      #hud { width: calc(100vw - 32px); left: 16px; top: 16px; }
      #tip { display: none; }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="brand">
      <h1>箱庭小镇</h1>
      <span>DIORAMA TOWN</span>
    </div>

    <div class="row">
      <button id="btnDayNight"><span class="ico">☾</span> 切换到夜晚</button>
    </div>

    <div class="row">
      <span class="label">时刻</span>
      <input id="timeSlider" type="range" min="0" max="23.99" step="0.02" value="10.2" />
      <span id="clock">10:12</span>
    </div>

    <div class="row chips">
      <button data-time="6.3">黎明</button>
      <button data-time="12">正午</button>
      <button data-time="18.5">黄昏</button>
      <button data-time="22.8">深夜</button>
    </div>

    <div class="row">
      <button id="btnAuto" class="on">自动循环</button>
      <button id="btnSpin" class="on">自动旋转</button>
    </div>

    <div class="row chips">
      <button data-view="overview">全景</button>
      <button data-view="plaza">广场</button>
      <button data-view="harbor">港口</button>
      <button data-view="hill">灯塔</button>
      <button data-view="windmill">风车</button>
    </div>

    <div id="fps">正在生成…</div>
  </div>

  <div id="tip">
    <b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>右键</b> 平移<br />
    <b>N</b> 昼夜切换 · <b>H</b> 隐藏面板
  </div>

  <div id="loading">
    <div class="t">箱 庭 小 镇</div>
    <div class="bar"><i></i></div>
    <div class="s">正在堆叠地形与屋宇…</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
