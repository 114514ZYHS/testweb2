<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>孙悟空开飞机 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 18%, #17293f, #0a141f);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .stage { width: min(960px, 100%); }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }
  .bar {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 22px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #f0513a, #d6382a);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(214, 56, 42, .4);
    transition: transform .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  .tip { color: #9db8d4; font-size: 14px; }

  /* ---------- 动画定义 ---------- */
  #planeInner {
    transform-box: fill-box;
    transform-origin: center;
    animation: bob 3.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translate(0, 0) rotate(-1.4deg); }
    50%      { transform: translate(10px, -18px) rotate(2.4deg); }
  }
  .bannerFlap {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: flap 1.2s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(-1.8deg); }
    50%      { transform: rotate(2.2deg); }
  }
  .eyes {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.8s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(.12); }
  }
  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 1.8s linear infinite;
  }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.4); opacity: .7; }
    100% { transform: translate(-150px, 16px) scale(1.8); opacity: 0; }
  }
  .drift {
    animation: drift var(--d, 32s) linear infinite;
    animation-delay: var(--dl, 0s);
  }
  @keyframes drift {
    from { transform: translateX(2000px); }
    to   { transform: translateX(-520px); }
  }
  .slideA { animation: slide 46s linear infinite; }
  .slideB { animation: slide 30s linear infinite; }
  .slideC { animation: slide 18s linear infinite; }
  @keyframes slide {
    from { transform: translateX(0); }
    to   { transform: translateX(-900px); }
  }
  .whoosh {
    animation: whoosh var(--t, .85s) linear infinite;
    animation-delay: var(--dl, 0s);
    opacity: 0;
  }
  @keyframes whoosh {
    0%   { transform: translateX(70px); opacity: 0; }
    15%  { opacity: .55; }
    75%  { opacity: .4; }
    100% { transform: translateX(-250px); opacity: 0; }
  }
  .bubble { opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .bubble.show { opacity: 1; }
  #hit { cursor: pointer; }
  .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">孙悟空开飞机</title>
    <desc id="d">孙悟空驾驶红色螺旋桨飞机在云海中飞行：螺旋桨旋转、金围巾飘动、云朵滚动、机身起伏。</desc>

    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2f8fd6"/>
        <stop offset=".55" stop-color="#7cc7f2"/>
        <stop offset="1" stop-color="#d9f2ff"/>
      </linearGradient>
      <radialGradient id="sunGrad">
        <stop offset="0" stop-color="#fff7c4"/>
        <stop offset="1" stop-color="#ffd23e"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#ffe98a" stop-opacity=".6"/>
        <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="fusGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f0513a"/>
        <stop offset="1" stop-color="#b5271a"/>
      </linearGradient>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe08a"/>
        <stop offset="1" stop-color="#e9a63a"/>
      </linearGradient>
      <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd34d"/>
        <stop offset="1" stop-color="#eda32c"/>
      </linearGradient>
      <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eafaff"/>
        <stop offset="1" stop-color="#8fd4f2"/>
      </linearGradient>
      <radialGradient id="cloudGrad">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e4f2fa"/>
      </radialGradient>
      <radialGradient id="propBlur">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
        <stop offset=".7" stop-color="#ffffff" stop-opacity=".14"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>

      <!-- 可复用的云朵 -->
      <g id="cloud" fill="url(#cloudGrad)">
        <ellipse cx="0" cy="0" rx="46" ry="20"/>
        <ellipse cx="-32" cy="8" rx="26" ry="14"/>
        <ellipse cx="28" cy="9" rx="30" ry="15"/>
        <ellipse cx="4" cy="-13" rx="28" ry="14"/>
      </g>
      <!-- 可复用的小鸟（带扇翅动画） -->
      <g id="bird">
        <path fill="none" stroke="#37536e" stroke-width="3" stroke-linecap="round"
              d="M0,0 Q6,-7 12,0 Q18,-7 24,0">
          <animate attributeName="d" dur="0.55s" repeatCount="indefinite"
                   values="M0,0 Q6,-7 12,0 Q18,-7 24,0;
                           M0,-4 Q6,3 12,-2 Q18,3 24,-4;
                           M0,0 Q6,-7 12,0 Q18,-7 24,0"/>
        </path>
      </g>
      <!-- 可无缝平铺的山丘 / 云海 -->
      <path id="hFar" fill="#b7e0f2"
            d="M0,540 Q75,472 150,540 Q225,472 300,540 Q375,472 450,540 Q525,472 600,540 Q675,472 750,540 Q825,472 900,540 L900,600 L0,600 Z"/>
      <path id="hMid" fill="#9ad6b0"
            d="M0,572 Q90,506 180,572 Q270,506 360,572 Q450,506 540,572 Q630,506 720,572 Q810,506 900,572 L900,600 L0,600 Z"/>
      <path id="seaB" fill="#e6f4fc"
            d="M0,556 Q56,516 112,556 Q168,516 225,556 Q281,516 337,556 Q393,516 450,556 Q506,516 562,556 Q618,516 675,556 Q731,516 787,556 Q843,516 900,556 L900,600 L0,600 Z"/>
      <path id="seaF" fill="#ffffff"
            d="M0,580 Q56,524 112,580 Q168,524 225,580 Q281,524 337,580 Q393,524 450,580 Q506,524 562,580 Q618,524 675,580 Q731,524 787,580 Q843,524 900,580 L900,600 L0,600 Z"/>
    </defs>

    <!-- 天空 -->
    <rect x="0" y="0" width="900" height="600" fill="url(#skyGrad)"/>

    <!-- 太阳 -->
    <circle cx="760" cy="110" r="66" fill="url(#sunGlow)"/>
    <circle cx="760" cy="110" r="42" fill="url(#sunGrad)"/>
    <g stroke="#ffd94d" stroke-width="7" stroke-linecap="round">
      <line x1="814" y1="110" x2="834" y2="110"/>
      <line x1="798.2" y1="148.2" x2="812.3" y2="162.3"/>
      <line x1="760" y1="164" x2="760" y2="184"/>
      <line x1="721.8" y1="148.2" x2="707.7" y2="162.3"/>
      <line x1="706" y1="110" x2="686" y2="110"/>
      <line x1="721.8" y1="71.8" x2="707.7" y2="57.7"/>
      <line x1="760" y1="56" x2="760" y2="36"/>
      <line x1="798.2" y1="71.8" x2="812.3" y2="57.7"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 760 110" to="360 760 110" dur="36s" repeatCount="indefinite"/>
    </g>

    <!-- 背景云朵 -->
    <g transform="translate(0,90) scale(.8)">
      <g class="drift" style="--d:34s; --dl:-4s; opacity:.9"><use href="#cloud"/></g>
    </g>
    <g transform="translate(120,165) scale(.55)">
      <g class="drift" style="--d:26s; --dl:-16s; opacity:.85"><use href="#cloud"/></g>
    </g>
    <g transform="translate(-60,42) scale(1.05)">
      <g class="drift" style="--d:44s; --dl:-27s; opacity:.95"><use href="#cloud"/></g>
    </g>
    <g transform="translate(60,235) scale(.7)">
      <g class="drift" style="--d:22s; --dl:-9s; opacity:.8"><use href="#cloud"/></g>
    </g>

    <!-- 远山 / 近山 -->
    <g class="slideA"><use href="#hFar"/><use href="#hFar" x="900"/></g>
    <g class="slideB"><use href="#hMid"/><use href="#hMid" x="900"/></g>

    <!-- 小鸟 -->
    <g transform="translate(500,140) scale(.9)">
      <g class="drift" style="--d:12s; --dl:-3s"><use href="#bird"/></g>
    </g>
    <g transform="translate(700,205) scale(.7)">
      <g class="drift" style="--d:16s; --dl:-10s"><use href="#bird"/></g>
    </g>
    <g transform="translate(300,110) scale(1.1)">
      <g class="drift" style="--d:10s; --dl:-7s"><use href="#bird"/></g>
    </g>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <line class="whoosh" x1="120" y1="240" x2="200" y2="240" style="--t:.8s; --dl:0s"/>
      <line class="whoosh" x1="150" y1="285" x2="245" y2="285" style="--t:.9s; --dl:-.2s"/>
      <line class="whoosh" x1="100" y1="330" x2="170" y2="330" style="--t:.75s; --dl:-.45s"/>
      <line class="whoosh" x1="160" y1="372" x2="260" y2="372" style="--t:1s; --dl:-.65s"/>
      <line class="whoosh" x1="230" y1="215" x2="300" y2="215" style="--t:.85s; --dl:-.85s"/>
    </g>

    <!-- ============ 飞机 + 孙悟空 ============ -->
    <g transform="translate(470,320)">
      <g id="planeInner">

        <!-- 引擎尾烟 -->
        <g fill="#ffffff">
          <circle class="puff" cx="-210" cy="-8" r="9" style="animation-delay:0s"/>
          <circle class="puff" cx="-210" cy="-8" r="9" style="animation-delay:-.6s"/>
          <circle class="puff" cx="-210" cy="-8" r="9" style="animation-delay:-1.2s"/>
        </g>

        <!-- 拖拽绳 -->
        <path fill="none" stroke="#8a5a34" stroke-width="2.5" stroke-linecap="round"
              d="M-196,-12 C-214,-22 -224,-4 -236,-14">
          <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
                   values="M-196,-12 C-214,-22 -224,-4 -236,-14;
                           M-196,-12 C-214,-4 -224,-22 -236,-14;
                           M-196,-12 C-214,-22 -224,-4 -236,-14"/>
        </path>

        <!-- 横幅 -->
        <g class="bannerFlap">
          <rect x="-430" y="-52" width="200" height="64" rx="10" fill="#fff7e0" stroke="#e8452f" stroke-width="3"/>
          <rect x="-422" y="-44" width="184" height="48" rx="6" fill="none" stroke="#f2b13e" stroke-width="2" stroke-dasharray="6 5"/>
          <text x="-330" y="-14" text-anchor="middle" font-size="30" font-weight="700"
                fill="#d6382a" letter-spacing="4"
                font-family="'Kaiti SC','STKaiti','KaiTi','SimSun',serif">齐天大圣</text>
          <text x="-330" y="8" text-anchor="middle" font-size="12" fill="#b3541e" letter-spacing="3"
                font-family="'PingFang SC','Microsoft YaHei',sans-serif">腾云驾雾 · 巡天飞行</text>
        </g>

        <!-- 尾翼 -->
        <path d="M-136,-12 L-190,-76 Q-194,-84 -184,-85 L-156,-86 Q-150,-84 -147,-76 Q-140,-44 -132,-14 Z"
              fill="url(#fusGrad)" stroke="#8f1f14" stroke-width="1.5"/>
        <path d="M-172,-64 L-188,-46 L-166,-46 Z" fill="#ffd94d"/>
        <ellipse cx="-148" cy="8" rx="40" ry="12" fill="#eda32c" stroke="#c9871f" stroke-width="1.5"/>

        <!-- 起落架（画在机身后面） -->
        <line x1="12" y1="18" x2="12" y2="60" stroke="#5b4632" stroke-width="6"/>
        <circle cx="12" cy="64" r="13" fill="#2f2a26" stroke="#171412" stroke-width="3"/>
        <circle cx="12" cy="64" r="4.5" fill="#cfd6dc"/>
        <path d="M-146,34 L-156,48" stroke="#5b4632" stroke-width="4" stroke-linecap="round"/>

        <!-- 机身 -->
        <path d="M-160,2 Q-158,-28 -118,-34 L-6,-42 Q84,-44 118,-16 Q134,-2 118,16 Q82,42 -8,44 L-122,36 Q-158,30 -160,2 Z"
              fill="url(#fusGrad)" stroke="#8f1f14" stroke-width="2"/>
        <path d="M-128,30 Q-10,47 92,26" fill="none" stroke="#ffdcae" stroke-width="9" stroke-linecap="round" opacity=".9"/>
        <path d="M-70,-30 Q-10,-40 60,-26" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".4"/>
        <!-- 圆形徽章 + 五角星 -->
        <circle cx="-85" cy="-14" r="12" fill="#ffd94d" stroke="#c9871f" stroke-width="2"/>
        <polygon transform="translate(-85,-14)" fill="#d6382a"
                 points="0,-9 2.35,-3.24 8.56,-2.78 3.8,1.24 5.29,7.28 0,4 -5.29,7.28 -3.8,1.24 -8.56,-2.78 -2.35,-3.24"/>
        <!-- 引擎罩 -->
        <ellipse cx="112" cy="0" rx="21" ry="26" fill="url(#goldGrad)" stroke="#c9871f" stroke-width="2"/>

        <!-- 座舱口 -->
        <ellipse cx="0" cy="-39" rx="27" ry="6.5" fill="#8f1f14"/>

        <!-- ======== 孙悟空 ======== -->
        <g id="wukong">
          <!-- 卷卷的猴子尾巴 -->
          <g>
            <path d="M-16,-48 C-42,-44 -52,-64 -40,-72 C-31,-78 -27,-68 -34,-66"
                  fill="none" stroke="#d98f3f" stroke-width="5.5" stroke-linecap="round"/>
            <animateTransform attributeName="transform" type="rotate" dur="2.4s" repeatCount="indefinite"
                              values="0 -16 -48; 7 -16 -48; 0 -16 -48; -5 -16 -48; 0 -16 -48"/>
          </g>
          <!-- 身体（红色战袍） -->
          <path d="M-17,-38 C-19,-58 -12,-70 0,-72 C12,-70 19,-58 17,-38 Z"
                fill="#d6382a" stroke="#a32318" stroke-width="1.5"/>
          <rect x="-16" y="-47" width="32" height="6" rx="3" fill="#f2b13e"/>
          <path d="M-11,-60 L11,-60 L8,-46 L-8,-46 Z" fill="url(#goldGrad)" stroke="#c9871f" stroke-width="1"/>
          <!-- 左手扶舱沿 -->
          <path d="M-10,-62 C-18,-56 -22,-50 -24,-44" fill="none" stroke="#d6382a" stroke-width="9" stroke-linecap="round"/>
          <circle cx="-25" cy="-43" r="6" fill="#ffe0b8" stroke="#d99a63" stroke-width="1.5"/>
          <!-- 右手高举金箍棒（挥手动画） -->
          <g>
            <path d="M12,-64 C24,-84 30,-100 36,-116" fill="none" stroke="#d6382a" stroke-width="9" stroke-linecap="round"/>
            <circle cx="29" cy="-95" r="5.5" fill="url(#goldGrad)" stroke="#c9871f" stroke-width="1"/>
            <line x1="22" y1="-152" x2="50" y2="-96" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
            <circle cx="22" cy="-152" r="5" fill="#c9871f"/>
            <circle cx="50" cy="-96" r="5" fill="#c9871f"/>
            <circle cx="37" cy="-122" r="6.5" fill="#ffe0b8" stroke="#d99a63" stroke-width="1.5"/>
            <animateTransform attributeName="transform" type="rotate" dur="1.3s" repeatCount="indefinite"
                              values="-5 14 -66; 9 14 -66; -5 14 -66"/>
          </g>
          <!-- 金色围巾（飘动动画） -->
          <path fill="url(#goldGrad)" stroke="#c9871f" stroke-width="1"
                d="M-12,-74 C-32,-90 -50,-84 -76,-94 C-62,-76 -44,-72 -13,-64 Z">
            <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
                     values="M-12,-74 C-32,-90 -50,-84 -76,-94 C-62,-76 -44,-72 -13,-64 Z;
                             M-12,-74 C-32,-80 -50,-96 -76,-86 C-62,-68 -44,-76 -13,-64 Z;
                             M-12,-74 C-32,-90 -50,-84 -76,-94 C-62,-76 -44,-72 -13,-64 Z"/>
          </path>
          <ellipse cx="0" cy="-70" rx="14" ry="5" fill="#f2b13e"/>
          <!-- 耳朵 -->
          <circle cx="-24" cy="-104" r="9" fill="#d98f3f"/>
          <circle cx="-24" cy="-104" r="4.5" fill="#f7b98a"/>
          <circle cx="25" cy="-106" r="8" fill="#d98f3f"/>
          <circle cx="25" cy="-106" r="4" fill="#f7b98a"/>
          <!-- 头 -->
          <circle cx="0" cy="-100" r="26" fill="#e8a95c"/>
          <ellipse cx="2" cy="-97" rx="16.5" ry="14.5" fill="#ffe0b8"/>
          <!-- 紧箍咒（金箍） -->
          <path d="M-21,-111 Q1,-122 23,-110" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="1" cy="-119" r="3.2" fill="#e64530" stroke="#b32b1c" stroke-width="1"/>
          <!-- 眉毛 -->
          <path d="M-13,-108 Q-8,-111.5 -2,-109.5" fill="none" stroke="#7a4a1f" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M7,-110 Q13,-112.5 18,-109.5" fill="none" stroke="#7a4a1f" stroke-width="2.2" stroke-linecap="round"/>
          <!-- 眼睛（会眨眼） -->
          <g class="eyes">
            <ellipse cx="-6.5" cy="-99" rx="5.2" ry="6.2" fill="#ffffff"/>
            <ellipse cx="11" cy="-99" rx="5.2" ry="6.2" fill="#ffffff"/>
            <circle cx="-4.8" cy="-100" r="2.7" fill="#31241a"/>
            <circle cx="12.8" cy="-100" r="2.7" fill="#31241a"/>
            <circle cx="-4" cy="-102.5" r="1" fill="#ffffff"/>
            <circle cx="13.6" cy="-102.5" r="1" fill="#ffffff"/>
          </g>
          <!-- 鼻子 / 嘴巴 / 腮红 -->
          <ellipse cx="2.5" cy="-90" rx="2.6" ry="2" fill="#8a5a34"/>
          <path d="M-5,-84.5 Q2,-77.5 10,-84" fill="none" stroke="#a0522d" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="-11.5" cy="-90" rx="3.6" ry="2.2" fill="#f7a68c" opacity=".55"/>
          <ellipse cx="15.5" cy="-89" rx="3.6" ry="2.2" fill="#f7a68c" opacity=".55"/>
        </g>

        <!-- 挡风玻璃 -->
        <path d="M20,-42 L32,-64 Q34,-68 38,-66 L48,-60 Q50,-58 48,-55 L38,-38 Z"
              fill="url(#glassGrad)" stroke="#7fb6d9" stroke-width="2"/>
        <path d="M34,-60 L41,-46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

        <!-- 前翼 -->
        <ellipse cx="-12" cy="16" rx="104" ry="15" fill="url(#wingGrad)" stroke="#c9871f" stroke-width="2"/>

        <!-- 螺旋桨 -->
        <circle cx="130" cy="0" r="54" fill="url(#propBlur)"/>
        <g>
          <ellipse cx="130" cy="0" rx="5.5" ry="54" fill="#5b3a29" opacity=".92"/>
          <ellipse cx="130" cy="0" rx="5.5" ry="54" fill="#5b3a29" opacity=".92" transform="rotate(90 130 0)"/>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 130 0" to="360 130 0" dur="0.16s" repeatCount="indefinite"/>
        </g>
        <circle cx="136" cy="0" r="8" fill="#f0513a" stroke="#a32318" stroke-width="2"/>

        <!-- 点击气泡彩蛋 -->
        <g id="bubble" class="bubble">
          <rect x="-80" y="-180" width="160" height="46" rx="14" fill="#ffffff" stroke="#e8452f" stroke-width="2.5"/>
          <path d="M4,-136 L16,-116 L28,-136 Z" fill="#ffffff" stroke="#e8452f" stroke-width="2.5"/>
          <rect x="7" y="-139" width="18" height="6" fill="#ffffff"/>
          <text x="0" y="-150" text-anchor="middle" font-size="21" font-weight="700" fill="#d6382a"
                font-family="'Kaiti SC','STKaiti','KaiTi',serif">俺老孙来也！</text>
        </g>

        <!-- 透明点击热区 -->
        <rect id="hit" x="-445" y="-150" width="600" height="235" fill="transparent"/>
      </g>
    </g>

    <!-- 前景大云（在飞机前面，增加层次） -->
    <g transform="translate(-40,432) scale(1.7)">
      <g class="drift" style="--d:20s; --dl:-11s; opacity:.95"><use href="#cloud"/></g>
    </g>
    <g transform="translate(300,118) scale(.5)">
      <g class="drift" style="--d:14s; --dl:-6s; opacity:.8"><use href="#cloud"/></g>
    </g>

    <!-- 云海 -->
    <g class="slideC">
      <use href="#seaB"/><use href="#seaB" x="900"/>
      <use href="#seaF"/><use href="#seaF" x="900"/>
    </g>

    <!-- 标题 -->
    <text x="40" y="52" font-size="30" font-weight="800" fill="#14507e"
          font-family="'Kaiti SC','STKaiti','KaiTi',serif">孙悟空 · 开飞机</text>

<script>
  (function () {
    var svg = document.getElementById('scene');
    var btn = document.getElementById('pauseBtn');
    var paused = false;
    btn.addEventListener('click', function () {
      paused = !paused;
      svg.classList.toggle('paused', paused);
      if (paused) {
        svg.pauseAnimations();
        btn.textContent = '▶ 播放动画';
      } else {
        svg.unpauseAnimations();
        btn.textContent = '⏸ 暂停动画';
      }
    });

    var bubble = document.getElementById('bubble');
    var hit = document.getElementById('hit');
    var timer = null;
    hit.addEventListener('click', function () {
      bubble.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () { bubble.classList.remove('show'); }, 1800);
    });
  })();
</script>
