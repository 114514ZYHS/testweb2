<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>蓝鲸 · BLUE WHALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@200;300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eaf7ff; --ink-dim:rgba(214,236,255,.6);
  --cyan:#6fe0ff; --gold:#ffe6b0;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:#00060c; color:var(--ink);
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
/* ---------- LOADER ---------- */
#loader{
  position:fixed; inset:0; z-index:99;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  background:radial-gradient(120% 90% at 50% 110%, #0b4a6b 0%, #05233a 45%, #010912 100%);
  transition:transform 1.3s cubic-bezier(.76,0,.24,1), opacity 1s ease .3s;
}
body.ready #loader{ transform:translateY(-101%); opacity:0; pointer-events:none; }
.loader-vox{display:grid; grid-template-columns:repeat(7,9px); grid-template-rows:repeat(4,9px); gap:3px;}
.loader-vox i{background:rgba(120,210,255,.14); border-radius:1px; animation:vpop 1.6s ease-in-out infinite;}
.loader-vox i.on{background:#7fd8ff; box-shadow:0 0 10px rgba(110,215,255,.9);}
@keyframes vpop{0%,100%{opacity:.18}50%{opacity:1}}
.loader-txt{font-family:"Marcellus",serif; letter-spacing:.6em; font-size:12px; text-transform:uppercase; color:var(--ink-dim); text-indent:.6em;}
.loader-bar{width:210px; height:1px; background:rgba(160,220,255,.16); position:relative; overflow:hidden;}
.loader-bar i{position:absolute; inset:0; transform-origin:left; transform:scaleX(.05); background:linear-gradient(90deg,transparent,var(--cyan)); animation:load 2.2s cubic-bezier(.6,.05,.2,1) infinite;}
@keyframes load{0%{transform:scaleX(.05)}70%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:.15}}
/* ---------- STAGE ---------- */
#gl{position:fixed; inset:0; z-index:1;}
#gl canvas{display:block;}
.vignette{position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(128% 88% at 50% 44%, transparent 40%, rgba(0,4,9,.7) 100%);}
.grain{position:fixed; inset:-50%; z-index:3; pointer-events:none; opacity:.05;
  background-image:radial-gradient(rgba(190,235,255,.9) .5px, transparent .6px);
  background-size:3px 3px; animation:grain 1.1s steps(3) infinite;}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-1px,1px)}66%{transform:translate(1px,-1px)}100%{transform:translate(0,0)}}
/* ---------- HERO ---------- */
.hero{position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; padding-top:9vh; text-align:center; pointer-events:none;}
.hero > *{pointer-events:auto;}
.eyebrow{font-family:"Marcellus",serif; font-size:clamp(10px,1.05vw,13px); letter-spacing:.62em;
  text-indent:.62em; text-transform:uppercase; color:rgba(180,230,255,.7);
  display:flex; align-items:center; gap:16px; opacity:0; transform:translateY(18px);}
.eyebrow::before,.eyebrow::after{content:""; width:46px; height:1px; background:linear-gradient(90deg,transparent,rgba(140,220,255,.7));}
.eyebrow::after{transform:scaleX(-1);}
.title-cn{font-weight:200; font-size:clamp(4rem,13vw,12rem); line-height:.98;
  margin:.06em 0 0; letter-spacing:.16em; text-indent:.16em; transform-origin:center top;
  background:linear-gradient(180deg,#ffffff 0%,#d3f1ff 36%,#79cfff 68%,#2b86cf 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 46px rgba(90,200,255,.55)); opacity:0; transform:translateY(26px);
  transition:transform 1.6s cubic-bezier(.2,.7,.3,1), opacity 1.2s ease, filter 1.2s ease;}
.title-en{font-family:"Marcellus",serif; font-size:clamp(11px,1.6vw,19px);
  letter-spacing:.52em; text-indent:.52em; color:rgba(200,236,255,.82); margin-top:.45em;
  opacity:0; transform:translateY(20px); transition:opacity 1s ease .3s, transform 1s ease .3s;}
.rule{display:flex; align-items:center; gap:14px; margin:20px 0 0; opacity:0; transition:opacity 1s ease .3s;}
.rule span{width:clamp(50px,11vw,150px); height:1px; background:linear-gradient(90deg,transparent,rgba(150,220,255,.65));}
.rule span:last-child{transform:scaleX(-1);}
.rule i{width:7px; height:7px; transform:rotate(45deg); background:var(--cyan); box-shadow:0 0 16px var(--cyan);}
.tagline{max-width:48ch; margin:20px 0 0; padding:0 20px; font-weight:300;
  font-size:clamp(.82rem,1.1vw,1rem); line-height:2.1; color:var(--ink-dim); letter-spacing:.06em;
  opacity:0; transform:translateY(18px); transition:opacity 1s ease .35s, transform 1s ease .35s;}
.actions{display:flex; gap:16px; margin-top:30px; opacity:0; transform:translateY(18px); transition:opacity 1s ease .5s, transform 1s ease .5s;}
.btn{position:relative; overflow:hidden; cursor:pointer; border:none; background:rgba(120,200,255,.06);
  font-family:"Noto Serif SC",serif; font-size:14px; letter-spacing:.24em; text-indent:.24em; color:var(--ink);
  padding:15px 34px; border-radius:999px; border:1px solid rgba(150,220,255,.35);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:.45s cubic-bezier(.2,.7,.3,1);}
.btn:hover{color:#031420; border-color:transparent; box-shadow:0 0 40px rgba(110,215,255,.65);}
.btn::before{content:""; position:absolute; inset:0; z-index:-1; transform:translateY(101%);
  background:linear-gradient(120deg,#bff0ff,#5fd0ff 60%,#7ee8ff); transition:.45s cubic-bezier(.2,.7,.3,1);}
.btn:hover::before{transform:translateY(0);}
.btn.ghost{background:transparent;}
.btn.ghost:hover{color:var(--ink); box-shadow:0 0 32px rgba(110,215,255,.3);}
.btn.ghost::before{background:rgba(120,200,255,.16);}
/* CINEMA: hero recedes */
body.cinema .eyebrow,body.cinema .title-en,body.cinema .rule,
body.cinema .tagline,body.cinema .actions{opacity:0 !important; pointer-events:none !important; transform:translateY(-10px) !important;}
body.cinema .title-cn{transform:translateY(-34vh) scale(.24) !important; opacity:.92 !important; filter:drop-shadow(0 0 18px rgba(90,200,255,.4));}
body.cinema .hud{opacity:1;}
/* ---------- HUD ---------- */
.hud{position:fixed; top:24px; left:28px; z-index:6; display:flex; align-items:center; gap:14px;
  opacity:0; transition:opacity 1.2s ease; font-family:"Marcellus",serif; pointer-events:none;}
.hud .mark{width:10px; height:10px; border:1px solid var(--cyan); transform:rotate(45deg);
  box-shadow:0 0 14px rgba(110,215,255,.8); animation:pulse 3.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.hud .brand{font-size:15px; letter-spacing:.5em; color:rgba(226,245,255,.92);}
.hud .sub{font-size:9.5px; letter-spacing:.42em; color:rgba(170,220,255,.5); text-transform:uppercase;}
/* depth readout */
.depthbox{position:fixed; top:24px; right:28px; z-index:6; text-align:right;
  font-family:"Marcellus",serif; opacity:0; transition:opacity 1.2s ease .2s; pointer-events:none;}
.depthbox .lbl{font-size:9.5px; letter-spacing:.5em; color:rgba(170,220,255,.5); text-transform:uppercase;}
.depthbox .val{font-size:26px; letter-spacing:.06em; color:#dff3ff; margin-top:4px;
  font-variant-numeric:tabular-nums; text-shadow:0 0 22px rgba(90,200,255,.55);}
.depthbox .val small{font-size:12px; letter-spacing:.2em; color:rgba(170,220,255,.6); margin-left:4px;}
.depthbox .mode{font-size:9.5px; letter-spacing:.4em; color:rgba(120,215,255,.85); margin-top:6px;}
/* sound toggle */
.snd{position:fixed; top:92px; right:28px; z-index:7; width:40px; height:40px; border-radius:50%;
  border:1px solid rgba(150,220,255,.35); background:rgba(120,200,255,.06); cursor:pointer;
  display:flex; align-items:center; justify-content:center; opacity:0;
  transition:opacity 1.2s ease .3s, box-shadow .4s, border-color .4s;}
.snd:hover{border-color:rgba(150,220,255,.8); box-shadow:0 0 26px rgba(110,215,255,.45);}
.snd svg{width:17px; height:17px; stroke:#bfe8ff; fill:none; stroke-width:1.6;}
.snd.on{border-color:rgba(150,220,255,.85); box-shadow:0 0 30px rgba(110,215,255,.55);}
.snd.on::after{content:""; position:absolute; inset:-6px; border-radius:50%; border:1px solid rgba(110,215,255,.35); animation:rippleDot 2.4s ease-out infinite;}
@keyframes rippleDot{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
/* depth ruler */
.ruler{position:fixed; right:30px; top:50%; transform:translateY(-50%); z-index:6;
  width:2px; height:min(46vh,380px); background:rgba(150,220,255,.14); opacity:0; transition:opacity 1.2s ease .4s;}
.ruler .marker{position:absolute; left:-7px; width:16px; height:2px; background:var(--cyan);
  box-shadow:0 0 14px var(--cyan); transition:top .18s linear;}
.ruler .marker::after{content:attr(data-d); position:absolute; right:20px; top:-9px;
  font-size:9.5px; letter-spacing:.2em; color:rgba(190,235,255,.75); white-space:nowrap;
  font-family:"Marcellus",serif;}
.ruler .tick{position:absolute; left:-4px; width:8px; height:1px; background:rgba(150,220,255,.22);}
.ruler .tick::after{content:attr(data-l); position:absolute; right:16px; top:-6px; font-size:8.5px;
  letter-spacing:.16em; color:rgba(150,210,255,.35); font-family:"Marcellus",serif;}
/* caption */
.caption{position:fixed; left:50%; bottom:52px; z-index:6; transform:translate(-50%,14px);
  font-size:13px; letter-spacing:.42em; text-indent:.42em; color:rgba(214,240,255,.9);
  text-shadow:0 0 24px rgba(90,200,255,.6); opacity:0; pointer-events:none;
  transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1); white-space:nowrap;}
.caption.show{opacity:1; transform:translate(-50%,0);}
.caption em{font-style:normal; font-family:"Marcellus",serif; font-size:10px; letter-spacing:.5em;
  color:rgba(140,215,255,.7); display:block; margin-top:6px; text-indent:.5em;}
/* side + hint */
.side{position:fixed; left:28px; top:50%; z-index:6; transform:translateY(-50%) rotate(180deg);
  writing-mode:vertical-rl; font-family:"Marcellus",serif; font-size:10.5px; letter-spacing:.55em;
  text-transform:uppercase; color:rgba(160,215,255,.4); opacity:0; transition:opacity 1.2s ease .5s;}
.side b{font-weight:400; color:rgba(200,240,255,.78);}
.hint{position:fixed; left:50%; bottom:26px; z-index:6; transform:translateX(-50%);
  font-size:10.5px; letter-spacing:.36em; color:rgba(170,220,255,.45); opacity:0;
  transition:opacity 1.2s ease .8s; font-family:"Marcellus",serif;}
/* reveal */
body.ready .eyebrow{opacity:1; transform:none; transition:opacity .9s ease .4s, transform .9s cubic-bezier(.2,.7,.3,1) .4s;}
body.ready .title-cn{opacity:1; transform:none;}
body.ready .title-en{opacity:1; transform:none;}
body.ready .rule{opacity:1;}
body.ready .tagline{opacity:1; transform:none;}
body.ready .actions{opacity:1; transform:none;}
body.ready .hud,body.ready .depthbox,body.ready .snd,body.ready .ruler,body.ready .side,body.ready .hint{opacity:1;}
body.ready .side{opacity:.75;}
@media (max-width:760px){
  .hero{padding-top:7vh;}
  .side,.ruler{display:none;}
  .hud{left:18px; top:18px;} .depthbox{right:18px; top:18px;} .snd{right:18px; top:84px;}
  .depthbox .val{font-size:20px;}
  .caption{bottom:40px; font-size:11px;}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; animation-iteration-count:1 !important;}}


</style>
</head>
<body>
<div id="loader">
  <div class="loader-vox" id="loaderVox"></div>
  <div class="loader-txt">Summoning</div>
  <div class="loader-bar"><i></i></div>
</div>

<div id="gl"></div>
<div class="vignette"></div>
<div class="grain"></div>

<div class="hud">
  <span class="mark"></span>
  <span class="brand">蓝 鲸</span>
  <span class="sub">Blue Whale&nbsp;&nbsp;/&nbsp;&nbsp;Balaenoptera musculus</span>
</div>

<div class="depthbox">
  <div class="lbl">Depth 深度</div>
  <div class="val" id="dVal">0.0<small>m</small></div>
  <div class="mode" id="dMode">水面 SURFACE</div>
</div>

<button class="snd" id="sndBtn" title="鲸歌 / 深海之声">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h3l5 4V5L7 9H4z"/><path d="M16 9a4 4 0 010 6"/><path d="M19 6.5a8 8 0 010 11"/></svg>
</button>

<div class="ruler" id="ruler"><div class="marker" id="rMarker" data-d="0 m"></div></div>

<div class="caption" id="caption"></div>

<header class="hero">
  <div class="eyebrow">Deep Blue Voxel</div>
  <h1 class="title-cn">蓝鲸</h1>
  <div class="title-en">B L U E&nbsp;&nbsp;W H A L E</div>
  <div class="rule"><span></span><i></i><span></span></div>
  <p class="tagline">三万个方块，一头三十米的巨灵。<br>它下潜、浮起、喷气，然后继续游向更深的蓝。</p>
  <div class="actions">
    <button class="btn" id="btnStart">潜入深海</button>
    <button class="btn ghost" id="btnMore">浮出水面</button>
  </div>
</header>

<div class="side"><b>Balaenoptera musculus</b>&nbsp;&nbsp;·&nbsp;&nbsp;体素巨鲸&nbsp;&nbsp;·&nbsp;&nbsp;Mysticeti</div>
<div class="hint">拖拽环视 · 滚轮拉近 · 点击唤醒鲸歌</div>

<script>

	uniforms: {

		'tDiffuse': { value: null },
		'opacity': { value: 1.0 }

	vertexShader: [

		'varying vec2 vUv;',

		'uniform sampler2D tDiffuse;',

		'varying vec2 vUv;',

		'void main() {',

<script>
/**
 * Luminosity
 * http://en.wikipedia.org/wiki/Luminosity
 */

THREE.LuminosityHighPassShader = {

	shaderID: 'luminosityHighPass',

	uniforms: {

		'tDiffuse': { value: null },
		'luminosityThreshold': { value: 1.0 },
		'smoothWidth': { value: 1.0 },
		'defaultColor': { value: new THREE.Color( 0x000000 ) },
		'defaultOpacity': { value: 0.0 }

	},

	vertexShader: [

		'varying vec2 vUv;',

		'void main() {',

		'	vUv = uv;',

		'	gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );',

		'}'

	].join( '\n' ),

	fragmentShader: [

		'uniform sampler2D tDiffuse;',
		'uniform vec3 defaultColor;',
		'uniform float defaultOpacity;',
		'uniform float luminosityThreshold;',
		'uniform float smoothWidth;',

		'varying vec2 vUv;',

		'void main() {',

		'	vec4 texel = texture2D( tDiffuse, vUv );',

		'	vec3 luma = vec3( 0.299, 0.587, 0.114 );',

		'	float v = dot( texel.xyz, luma );',

		'	vec4 outputColor = vec4( defaultColor.rgb, defaultOpacity );',

		'	float alpha = smoothstep( luminosityThreshold, luminosityThreshold + smoothWidth, v );',

		'	gl_FragColor = mix( outputColor, texel, alpha );',

		'}'

	].join( '\n' )

};

  {t:0.06,h:2.30,w:2.15,cy:0.1},
  {t:0.16,h:4.10,w:3.50,cy:-0.3},
  {t:0.36,h:5.80,w:5.00,cy:-0.5},
  {t:0.55,h:6.30,w:5.60,cy:-0.6},

  {t:0.84,h:4.60,w:4.05,cy:-0.2},
  {t:0.93,h:3.30,w:2.85,cy:0.3},

function profile(t){
  t=clamp(t,0,1);

    var a=KEYS[i],b=KEYS[i+1];

      return {h:a.h+(b.h-a.h)*u,w:a.w+(b.w-a.w)*u,cy:a.cy+(b.cy-a.cy)*u};
    }

  var l=KEYS[KEYS.length-1]; return {h:l.h,w:l.w,cy:l.cy};
}

      this.vel[n*3]=vx; this.vel[n*3+1]=vy; this.vel[n*3+2]=vz;

    var ctx=this.ctx,t=ctx.currentTime;
    var len=Math.round(ctx.sampleRate*dur);
    var buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ var e=Math.pow(1-i/len,2.1); d[i]=(Math.random()*2-1)*e; }
    var src=ctx.createBufferSource(); src.buffer=buf;
    var bp=ctx.createBiquadFilter(); bp.type=btype||'bandpass'; bp.Q.value=q;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    var g=ctx.createGain(); g.gain.value=gain;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
  },
  playSpout:function(){ this.noise(1.9,1500,220,0.7,0.45); },
  playSplash:function(){ this.noise(1.1,2600,500,0.6,0.4); },
  playCall:function(){
    if(!this.ctx||!this.enabled) return;
    var buf=(Math.random()<0.6? this.ne : this.atl) || this.ne || this.atl;
    if(!buf) return;
    var ctx=this.ctx, t=ctx.currentTime;
    var rate=0.80+Math.random()*0.26;
    var src=ctx.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate;
    var lp=ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(300,t); lp.frequency.exponentialRampToValueAtTime(1100,t+2.0);
    var g=ctx.createGain();
    var dur=buf.duration/rate;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.95,t+1.1);
    g.gain.setValueAtTime(0.95,t+Math.max(1.2,dur*0.72));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.15);
  },
  update:function(dt){
    if(!this.enabled||!this.ctx) return;
    this.callIn-=dt;
    if(this.callIn<=0){
      this.playCall();
      this.callIn=16+Math.random()*22;
    }
  }
};
/* ---------- STATE ---------- */
var WY_PER_M=12;
var pos=new THREE.Vector3(0,-24,0);
var yaw=0.55, pitch=0, roll=0, speed=8.6;
var depth=11, targetDepth=-1.7;
var st={t:0};
var mode='surface', modeT=0, legT=0, legGoal=30, actionTimer=3.5;
var action='none', actionT=0, blowActive=0, slapT=-1, slapPitch=0, tailBeatPhase=0;

var dVal=document.getElementById('dVal'), dMode=document.getElementById('dMode');
var capEl=document.getElementById('caption'), capTimer=0;
function caption(cn,en,ms){
  capEl.innerHTML=cn+(en?('<em>'+en+'</em>'):'');
  capEl.classList.add('show');
  capTimer=(ms||2.6)/1000;
}
function setMode(m,msg){ mode=m; modeT=0; legT=0;
  if(m==='cruise') legGoal=22+Math.random()*18;
  if(msg) caption(msg[0],msg[1]);
}
function startBlow(){ action='blow'; actionT=0; blowActive=1.15; audio.playSpout(); caption('喷 气','B L O W',2.4); }
function startSlap(){ action='slap'; slapT=0; caption('击 尾','T A I L &nbsp; S L A P',2.8); }

function behavior(dt){
  modeT+=dt; legT+=dt;
  if(action==='blow'){ actionT+=dt; if(actionT>2.2) action='none'; }
  if(action==='slap'){
    slapT+=dt;
    if(slapT<0.95) slapPitch=-0.34*(1-Math.cos(Math.PI*slapT/0.95))/2 -0.06;
    else if(slapT<1.30) slapPitch=lerp(-0.40,0.14,(slapT-0.95)/0.35);
    else if(slapT<1.70){ slapPitch=lerp(0.14,0,(slapT-1.30)/0.40);
      if(!action._hit){ action._hit=true; audio.playSplash(); splashAtFlukes(); } }
    else { slapPitch=0; action='none'; action._hit=false; }
  }
  if(mode==='surface'){
    speed=58; targetDepth=-1.7;
    actionTimer-=dt;
    if(actionTimer<=0 && action==='none' && depth<6){
      if(Math.random()<0.6) startBlow(); else startSlap();
      actionTimer=5.0+Math.random()*6.5;
    }
    if(modeT>14){ actionTimer=99; setMode('dive',['下 潜','D I V I N G']); }
  } else if(mode==='dive'){
    speed=150; targetDepth=Math.max(targetDepth,60);
    if(depth>targetDepth-12) setMode('cruise');
    if(legT>32) setMode('rise',['上 浮','A S C E N D I N G']);
  } else if(mode==='cruise'){
    speed=132;
    if(modeT>9){ modeT=0; targetDepth=25+Math.random()*165; }
    if(legT>legGoal) setMode('rise',['上 浮','A S C E N D I N G']);
  } else if(mode==='rise'){
    speed=95; targetDepth=-1.7;
    if(depth<4){ setMode('surface',['浮出水面','S U R F A C E']); actionTimer=1.2; }
  }
  var dRate=0.17;
  depth+=(targetDepth-depth)*Math.min(1,dt*dRate);
}

function whaleLocalToWorld(v){ return whaleRoot.localToWorld(v.clone()); }

function updateWhale(dt){
  var prevY=pos.y;
  behavior(dt);
  pos.y=-depth*WY_PER_M;
  var vy=(pos.y-prevY)/Math.max(dt,0.0001);
  var vyS=vy*0.75+ (updateWhale._vy||0)*0.25; updateWhale._vy=vyS;
  var targetPitch=clamp(Math.atan2(vyS,speed+40),-0.5,0.5);
  pitch+=(targetPitch-pitch)*Math.min(1,dt*2.4);

  var yawRate=(Math.sin(st.t*0.11)*0.020+Math.sin(st.t*0.037+1.7)*0.013);
  yaw+=yawRate*dt;
  var targetRoll=clamp(-yawRate*9,-0.28,0.28);
  roll+=(targetRoll-roll)*Math.min(1,dt*1.6);

  pos.x+=Math.cos(yaw)*speed*dt;
  pos.z+=-Math.sin(yaw)*speed*dt;

  whaleRoot.position.copy(pos);
  whaleRoot.rotation.set(roll,yaw,pitch+slapPitch);

  tailBeatPhase+=dt*(1.05+speed*0.0022);
  flukesGroup.rotation.z=Math.sin(tailBeatPhase)*0.20;
  flipLGroup.rotation.x=Math.sin(tailBeatPhase*0.6)*0.14;
  flipRGroup.rotation.x=Math.sin(tailBeatPhase*0.6+0.5)*0.14;

  whaleRoot.updateMatrixWorld(true);

  if(blowActive>0){
    blowActive-=dt;
    var bpos=whaleLocalToWorld(blowLocal);
    var n=blowActive>0?7:0;
    for(var i=0;i<n;i++){
      var sp=rand(30,105);
      spray.spawn(bpos.x+rand(-40,40), Math.max(bpos.y,6), bpos.z+rand(-40,40),
        rand(-18,18), sp, rand(-18,18), rand(90,220), rand(1.3,2.4));
      drop.spawn(bpos.x+rand(-60,60), Math.max(bpos.y,4), bpos.z+rand(-60,60),
        rand(-26,26), sp*0.75, rand(-26,26), rand(30,80), rand(1.2,2.2));
    }
  }
  if(depth>10 && Math.random()<0.05){
    var hp=whaleLocalToWorld(headLocal);
    drop.spawn(hp.x+rand(-90,90),hp.y+rand(-40,40),hp.z+rand(-90,90),rand(-6,6),rand(14,30),rand(-6,6),rand(6,16),rand(2.2,4.0));
  }
}

function splashAtFlukes(){
  var f=whaleLocalToWorld(flukeLocal); f.y=Math.min(f.y,2);
  for(var i=0;i<180;i++){
    var a=Math.random()*6.283, r=Math.random()*160;
    spray.spawn(f.x+Math.cos(a)*r, 4+Math.random()*30, f.z+Math.sin(a)*r,
      Math.cos(a)*rand(10,70), rand(70,190), Math.sin(a)*rand(10,70), rand(120,300), rand(1.6,3.0));
  }
  for(var j=0;j<140;j++){
    var a2=Math.random()*6.283, r2=Math.random()*200;
    drop.spawn(f.x+Math.cos(a2)*r2, 6, f.z+Math.sin(a2)*r2,
      Math.cos(a2)*rand(20,110), rand(90,240), Math.sin(a2)*rand(20,110), rand(30,90), rand(1.4,2.6));
  }
}
/* ---------- CAMERA ---------- */
var camOff=0.34, camEl=0.12, camDist=250, tDist=650;
var tCamOff=0.30, tCamEl=0.10;
var camRoll=0.46, tCamRoll=0.46;
var camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), lookAt=new THREE.Vector3();
var fwd=new THREE.Vector3();
function updateCamera(dt,instant){
  camOff+=(tCamOff-camOff)*Math.min(1,dt*1.5);
  camEl+=(tCamEl-camEl)*Math.min(1,dt*1.5);
  camDist+=(tDist-camDist)*Math.min(1,dt*0.20);
  camRoll+=(tCamRoll-camRoll)*Math.min(1,dt*0.35);
  if(!dragging) tCamOff+=0.006*dt;
  fwd.set(Math.cos(yaw),0,-Math.sin(yaw));
  lookAt.set(pos.x+fwd.x*WHALE_LEN*0.14, pos.y+WHALE_LEN*0.05, pos.z+fwd.z*WHALE_LEN*0.14);
  var ce=Math.cos(camEl);
  var azW=yaw+camOff;
  camPos.set(lookAt.x+Math.sin(azW)*ce*camDist,
             lookAt.y+Math.sin(camEl)*camDist,
             lookAt.z+Math.cos(azW)*ce*camDist);
  if(camPos.y>-32) camPos.y=-32;
  var kp=instant?1:(1-Math.pow(0.0016,dt));
  var kl=instant?1:(1-Math.pow(0.00004,dt));
  camera.position.lerp(camPos,kp);
  camLook.lerp(lookAt,kl);
  camera.up.set(0,1,0);
  camera.lookAt(camLook);
  camera.rotateZ(camRoll);
}

/* ---------- CONTROLS ---------- */
var dragging=false, lx=0, ly=0;
dom.style.cursor='grab';
dom.addEventListener('pointerdown',function(e){ dragging=true; lx=e.clientX; ly=e.clientY; dom.style.cursor='grabbing'; });
addEventListener('pointermove',function(e){
  if(!dragging) return;
  tCamOff-=(e.clientX-lx)*0.0055;
  tCamEl=clamp(tCamEl+(e.clientY-ly)*0.0040,-0.22,0.95);
  lx=e.clientX; ly=e.clientY;
});
addEventListener('pointerup',function(){ dragging=false; dom.style.cursor='grab'; });
dom.addEventListener('wheel',function(e){ e.preventDefault(); tDist=clamp(tDist+e.deltaY*0.5,70,1000); },{passive:false});

/* ---------- ENVIRONMENT ---------- */
var DEPTH_DEEP=new THREE.Color(0x01060e), BG_DEEP=new THREE.Color(0x0b2c47), WHITE=new THREE.Color(0xffffff);
function updateEnvironment(dt){
  var dk=clamp((depth+2)/230,0,1);
  scene.fog.color.copy(C_SURF).lerp(DEPTH_DEEP,dk);
  scene.fog.density=0.00135-0.00078*dk;
  key.intensity=1.00-0.85*dk;
  hemi.intensity=0.62-0.53*dk;
  fill.intensity=0.50-0.38*dk;
  bgMat.color.copy(WHITE).lerp(BG_DEEP,dk);
  waterU.uOpacity.value=0.60*(1-dk*0.95);
  waterU.uTime.value=st.t;
  for(var i=0;i<rays.children.length;i++){
    var rm=rays.children[i];
    rm.material.opacity=(0.11+Math.abs(Math.sin(st.t*0.25+rm.userData.ph))*0.20)*(1-dk);
  }
  rays.visible=dk<0.96;
  rays.position.set(pos.x,0,pos.z);
  sun.material.opacity=0.34*(1-dk);
  sun.position.set(pos.x,-26,pos.z);
  var ss=Math.max(700,1500-depth*1.6);
  sun.scale.set(ss,ss,1);
  aura.material.opacity=0.45*(1-dk*0.8);
  aura.position.set(pos.x,pos.y,pos.z);
  rimLight.position.set(pos.x-700,pos.y+400,pos.z+700);
  underLight.position.set(pos.x+600,pos.y-600,pos.z+400);
  water.position.set(pos.x,0,pos.z);
  bubbleGroup.position.set(pos.x,0,pos.z);
  bgDome.position.copy(camera.position);
}
function updateFields(dt){
  var a=fBub.arr,s=fBub.sp,ph=fBub.ph,bx=fBub.box, n1=a.length/3;
  for(var i=0;i<n1;i++){
    a[i*3+1]+=s[i]*dt*70;
    a[i*3]+=Math.sin(st.t*s[i]*0.5+ph[i])*dt*26;
    if(a[i*3+1]>bx.y){ a[i*3+1]=-bx.y; a[i*3]=rand(-bx.x,bx.x); a[i*3+2]=rand(-bx.z,bx.z); }
  }
  fBub.geo.attributes.position.needsUpdate=true;
  var b=fSnow.arr,s2=fSnow.sp,ph2=fSnow.ph,bx2=fSnow.box, n2=b.length/3;
  for(var j=0;j<n2;j++){
    b[j*3+1]-=s2[j]*dt*18;
    b[j*3]+=Math.sin(st.t*0.3+ph2[j])*dt*14;
    b[j*3+2]+=Math.cos(st.t*0.24+ph2[j])*dt*10;
    if(b[j*3+1]<-bx2.y){ b[j*3+1]=bx2.y; b[j*3]=rand(-bx2.x,bx2.x); b[j*3+2]=rand(-bx2.z,bx2.z); }
  }
  fSnow.geo.attributes.position.needsUpdate=true;
}

/* ---------- POST ---------- */
var composer=new THREE.EffectComposer(renderer);
composer.setSize(W,H);
composer.addPass(new THREE.RenderPass(scene,camera));
var bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),0.50,0.70,0.86);
composer.addPass(bloom);
var copyPass=new THREE.ShaderPass(THREE.CopyShader);
copyPass.renderToScreen=true;
composer.addPass(copyPass);
composer.renderTarget1.texture.encoding=THREE.sRGBEncoding;
composer.renderTarget2.texture.encoding=THREE.sRGBEncoding;

/* ---------- UI ---------- */
var ruler=document.getElementById('ruler'), rMark=document.getElementById('rMarker');
var RMAX=300;
for(var rk=0;rk<=RMAX;rk+=50){
  var tk=document.createElement('div'); tk.className='tick';
  tk.style.top=(rk/RMAX*100)+'%'; tk.setAttribute('data-l',rk+'m');
  ruler.appendChild(tk);
}
var MODE_CN={surface:['水面','SURFACE'],dive:['下潜','DIVING'],cruise:['巡航','CRUISING'],rise:['上浮','ASCENDING']};
var hudT=0, lastMode='';
function updateHUD(){
  dVal.innerHTML=depth.toFixed(1)+'<small>m</small>';
  var d=clamp(depth,0,RMAX);
  rMark.style.top=(d/RMAX*100)+'%';
  rMark.setAttribute('data-d',depth.toFixed(0)+' m');
  var mc=MODE_CN[mode];
  if(mc && mc[0]!==lastMode){ dMode.textContent=mc[0]+'  '+mc[1]; lastMode=mc[0]; }
}
var sndBtn=document.getElementById('sndBtn');
function enableSound(){
  audio.enable();
  sndBtn.classList.add('on');
}
sndBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(audio.enabled){
    audio.enabled=false;
    if(audio.ctx) audio.master.gain.exponentialRampToValueAtTime(0.0001,audio.ctx.currentTime+0.6);
    sndBtn.classList.remove('on');
  } else enableSound();
});
var firstGesture=false;
addEventListener('pointerdown',function(){ if(!firstGesture){ firstGesture=true; enableSound(); } });

var btnStart=document.getElementById('btnStart');
if(btnStart) btnStart.addEventListener('click',function(){ setMode('dive',['下 潜','D I V I N G']); tDist=300; });
var btnMore=document.getElementById('btnMore');
if(btnMore) btnMore.addEventListener('click',function(){ setMode('rise',['上 浮','A S C E N D I N G']); tDist=430; });

addEventListener('resize',function(){
  W=innerWidth; H=innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H); composer.setSize(W,H);
  if(bloom.resolution) bloom.resolution.set(W,H);
});

/* ---------- LOOP ---------- */
updateCamera(0.016,true);
var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05); st.t+=dt;
  updateWhale(dt);
  updateEnvironment(dt);
  updateFields(dt);
  spray.update(dt); drop.update(dt);
  updateCamera(dt,false);
  audio.update(dt);
  hudT+=dt; if(hudT>0.1){ hudT=0; updateHUD(); }
  if(capTimer>0){ capTimer-=dt; if(capTimer<=0) capEl.classList.remove('show'); }
  composer.render();
}
animate();

/* ---------- BOOT ---------- */
setTimeout(function(){ document.body.classList.add('ready'); caption('蓝 鲸','B L U E &nbsp; W H A L E',3.4); }, 2100);
setTimeout(function(){ document.body.classList.add('cinema'); tCamRoll=0.10; }, 9500);
})();
