<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕单车日记 · Pelican on Wheels</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#1f4148;
    --ink-soft:#4a6a70;
    --coral:#ef6f5c;
    --teal:#2f93a8;
    --paper:#eaf4f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans SC', system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #f4fbfb 0%, var(--paper) 55%, #d9eaea 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 16px 36px;
    -webkit-font-smoothing:antialiased;
  }
  header{text-align:center;margin-bottom:18px;user-select:none;}
  header h1{
    font-family:'ZCOOL KuaiLe','Noto Sans SC',system-ui,sans-serif;
    font-size:clamp(30px,4.6vw,46px);
    letter-spacing:2px;
    color:var(--ink);
    line-height:1.1;
  }
  header h1 .dot{color:var(--coral);}
  header p{
    margin-top:6px;
    font-size:clamp(12px,1.6vw,14px);
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:500;
  }
  .card{
    position:relative;
    width:min(1080px,96vw);
    border-radius:26px;
    overflow:hidden;
    box-shadow:
      0 30px 60px -24px rgba(31,65,72,.38),
      0 10px 24px -12px rgba(31,65,72,.25),
      inset 0 0 0 1px rgba(255,255,255,.5);
    background:#bfe6f2;
  }
  svg#scene{display:block;width:100%;height:auto;}

  /* ---- 场景内 SVG 配色（白天 / 黄昏） ---- */
  .sky-top{stop-color:#6fc2ea;}
  .sky-mid{stop-color:#b3e3f3;}
  .sky-low{stop-color:#e6f6f8;}
  .sea{fill:#67b3d2;}
  .hill-far{fill:#9fd3c2;}
  .hill-near{fill:#7cbf6a;}
  .grass{fill:#86c263;}
  .grass-front{fill:#77b256;}
  .cloud{fill:#ffffff;}
  .cloud .shade{fill:#e7f4fa;}
  #scene[data-scene="dusk"] .sky-top{stop-color:#586590;}
  #scene[data-scene="dusk"] .sky-mid{stop-color:#e08a58;}
  #scene[data-scene="dusk"] .sky-low{stop-color:#fbd49a;}
  #scene[data-scene="dusk"] .sea{fill:#c07a52;}
  #scene[data-scene="dusk"] .hill-far{fill:#b08a86;}
  #scene[data-scene="dusk"] .hill-near{fill:#8d8a55;}
  #scene[data-scene="dusk"] .grass{fill:#7d9350;}
  #scene[data-scene="dusk"] .grass-front{fill:#6c8046;}
  #scene[data-scene="dusk"] .cloud{fill:#f3d3bd;}
  #scene[data-scene="dusk"] .cloud .shade{fill:#e7bda3;}
  .sky-top,.sky-mid,.sky-low,.sea,.hill-far,.hill-near,.grass,.grass-front,.cloud,.cloud .shade{transition:fill 1s ease,stop-color 1s ease;}

  #sunDay,#sunDusk,#stars,#warmVeil,#dimVeil,#beam{transition:opacity 1s ease;}
  #sunDusk,#stars,#warmVeil,#dimVeil,#beam{opacity:0;}
  #scene[data-scene="dusk"] #sunDay{opacity:0;}
  #scene[data-scene="dusk"] #sunDusk{opacity:1;}
  #scene[data-scene="dusk"] #stars{opacity:1;}
  #scene[data-scene="dusk"] #warmVeil{opacity:.16;}
  #scene[data-scene="dusk"] #dimVeil{opacity:.14;}
  #scene[data-scene="dusk"] #beam{opacity:.28;}

  .star{animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25;}50%{opacity:.95;}}
  .sun-halo{animation:breathe 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.12);opacity:.75;}}

  /* 铃铛波纹 */
  #bellRipple circle{opacity:0;transform-origin:center;transform-box:fill-box;}
  #bellRipple.ring circle{animation:ripple .7s ease-out;}
  #bellRipple.ring circle:nth-child(2){animation-delay:.12s;}
  @keyframes ripple{
    0%{transform:scale(.2);opacity:.7;}
    100%{transform:scale(2.4);opacity:0;}
  }
  #bellBtnSvg{cursor:pointer;}
  #bellBtnSvg:hover #bellBody{fill:#ffc846;}

  /* 身体呼吸（始终保留的微动） */
  #bodyCore{animation:breatheBody 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes breatheBody{0%,100%{transform:scale(1);}50%{transform:scale(1.012);}}

  /* ---- 控件 ---- */
  .controls{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:999px;
    padding:8px 10px;
    box-shadow:0 10px 26px -10px rgba(31,65,72,.4);
  }
  .seg{display:flex;background:rgba(31,65,72,.07);border-radius:999px;padding:3px;gap:2px;}
  .ctrl-btn{
    font-family:inherit;font-size:14px;font-weight:500;
    color:var(--ink-soft);
    background:transparent;border:0;cursor:pointer;
    padding:8px 15px;border-radius:999px;
    transition:background .2s ease,color .2s ease,transform .12s ease;
    white-space:nowrap;
    min-height:38px;
  }
  .ctrl-btn:hover{color:var(--ink);}
  .ctrl-btn:active{transform:scale(.94);}
  .seg .ctrl-btn.on{background:var(--coral);color:#fff;box-shadow:0 4px 12px -3px rgba(239,111,92,.7);}
  .icon-btn{
    width:42px;height:42px;border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(31,65,72,.07);
  }
  .icon-btn:hover{background:rgba(31,65,72,.14);}
  .icon-btn svg{width:21px;height:21px;}
  #sceneToggle.on{background:var(--teal);color:#fff;}
  #sceneToggle.on svg{color:#fff;}
  .hint{
    margin-top:14px;font-size:12.5px;color:var(--ink-soft);
    letter-spacing:1px;text-align:center;user-select:none;
  }

  @media (max-width:640px){
    .controls{gap:6px;padding:6px;bottom:10px;}
    .ctrl-btn{font-size:12.5px;padding:7px 9px;min-height:34px;}
    .icon-btn{width:36px;height:36px;}
  }
  @media (prefers-reduced-motion:reduce){
    .star,.sun-halo,#bodyCore{animation:none;}
    .ctrl-btn{transition:none;}
  }
</style>
</head>
<body>
<header>
  <h1>鹈鹕单车日记<span class="dot">。</span></h1>
  <p>Pelican&nbsp;on&nbsp;Wheels · 沿海骑行实况</p>
</header>

<div class="card">
<svg id="scene" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" data-scene="day" role="img" aria-label="一只鹈鹕骑着自行车在海边小路上前进的卡通动画">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop class="sky-top" offset="0"/>
      <stop class="sky-mid" offset=".55"/>
      <stop class="sky-low" offset="1"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff8c2a"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc069"/>
      <stop offset="1" stop-color="#ff932f"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd9ac"/>
      <stop offset="1" stop-color="#e2c891"/>
    </linearGradient>
    <radialGradient id="haloDay" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloDusk" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc07a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#skyDay)"/>

  <!-- 星星（黄昏） -->
  <g id="stars">
    <circle class="star" cx="120" cy="70" r="1.8" fill="#fff" style="animation-delay:0s"/>
    <circle class="star" cx="240" cy="130" r="1.4" fill="#fff" style="animation-delay:.5s"/>
    <circle class="star" cx="380" cy="60" r="1.7" fill="#fff" style="animation-delay:1s"/>
    <circle class="star" cx="520" cy="110" r="1.3" fill="#fff" style="animation-delay:1.5s"/>
    <circle class="star" cx="660" cy="60" r="1.6" fill="#fff" style="animation-delay:.3s"/>
    <circle class="star" cx="760" cy="150" r="1.4" fill="#fff" style="animation-delay:.9s"/>
    <circle class="star" cx="930" cy="80" r="1.8" fill="#fff" style="animation-delay:1.3s"/>
    <circle class="star" cx="60" cy="180" r="1.3" fill="#fff" style="animation-delay:1.8s"/>
    <circle class="star" cx="450" cy="180" r="1.3" fill="#fff" style="animation-delay:2.1s"/>
  </g>

  <!-- 太阳：白天 -->
  <g id="sunDay">
    <circle class="sun-halo" cx="858" cy="108" r="92" fill="url(#haloDay)"/>
    <circle cx="858" cy="108" r="46" fill="#ffd93d"/>
    <circle cx="842" cy="94" r="12" fill="#ffe98a" opacity=".7"/>
  </g>
  <!-- 太阳：黄昏 -->
  <g id="sunDusk">
    <circle class="sun-halo" cx="800" cy="330" r="108" fill="url(#haloDusk)"/>
    <circle cx="800" cy="330" r="58" fill="#ff7a3c"/>
    <circle cx="782" cy="314" r="15" fill="#ffab6e" opacity=".7"/>
  </g>

  <!-- ===== 云（JS 填充） ===== -->
  <g id="clouds"></g>

  <!-- ===== 海 ===== -->
  <rect class="sea" x="0" y="392" width="1000" height="46"/>
  <g stroke="#ffffff" stroke-width="2" opacity=".35" fill="none" stroke-linecap="round">
    <path d="M40 408 q14 -6 28 0 t28 0 t28 0"/>
    <path d="M520 420 q14 -6 28 0 t28 0 t28 0"/>
    <path d="M760 406 q14 -6 28 0 t28 0 t28 0"/>
  </g>

  <!-- ===== 远丘（双段循环） ===== -->
  <g id="hillsFar">
    <path class="hill-far" d="M0 470 L0 420 Q120 388 250 420 Q360 446 470 414 Q600 380 740 418 Q880 448 1000 420 L1000 470 Z"/>
  </g>
  <g id="hillsNear">
    <path class="hill-near" d="M0 470 L0 444 Q150 418 300 442 Q430 462 560 436 Q720 408 860 440 Q940 456 1000 444 L1000 470 Z"/>
  </g>

  <!-- ===== 中景树（JS 填充） ===== -->
  <g id="trees"></g>

  <!-- ===== 草地 ===== -->
  <rect class="grass" x="0" y="468" width="1000" height="132"/>

  <!-- ===== 骑行小路 ===== -->
  <path d="M0 500 Q500 488 1000 500 L1000 546 Q500 558 0 546 Z" fill="url(#roadGrad)"/>
  <path d="M0 500 Q500 488 1000 500" fill="none" stroke="#d3b57e" stroke-width="3"/>
  <path d="M0 546 Q500 558 1000 546" fill="none" stroke="#cdb07a" stroke-width="3" opacity=".8"/>
  <g id="roadMarks"></g>

  <!-- ===== 后缘栅栏（双段循环） ===== -->
  <g id="fence"></g>

  <!-- ============================================================ -->
  <!-- ==================== 骑行主体（鹈鹕 + 车） =================== -->
  <!-- ============================================================ -->
  <g id="rig">

    <!-- 后轮 -->
    <g transform="translate(372 440)">
      <circle r="76" fill="none" stroke="#33333b" stroke-width="11"/>
      <circle r="76" fill="none" stroke="#5a5b66" stroke-width="2"/>
      <g class="wheel-spin" id="spinBack">
        <circle r="71" fill="none" stroke="#d3d8de" stroke-width="4"/>
        <g stroke="#b6bcc7" stroke-width="2.4">
          <line x1="0" y1="0" x2="0" y2="-68"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(45)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(90)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(135)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(180)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(225)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(270)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(315)"/>
        </g>
        <circle r="11" fill="#6e7480"/>
        <circle r="4" fill="#3c3c44"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(630 440)">
      <circle r="76" fill="none" stroke="#33333b" stroke-width="11"/>
      <circle r="76" fill="none" stroke="#5a5b66" stroke-width="2"/>
      <g class="wheel-spin" id="spinFront">
        <circle r="71" fill="none" stroke="#d3d8de" stroke-width="4"/>
        <g stroke="#b6bcc7" stroke-width="2.4">
          <line x1="0" y1="0" x2="0" y2="-68"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(45)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(90)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(135)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(180)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(225)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(270)"/>
          <line x1="0" y1="0" x2="0" y2="-68" transform="rotate(315)"/>
        </g>
        <circle r="8" fill="#8a8f98"/>
        <circle r="4" fill="#3c3c44"/>
      </g>
    </g>

    <!-- 挡泥板 -->
    <path d="M297 483 A86 86 0 0 1 447 397" fill="none" stroke="#ef6f5c" stroke-width="8" stroke-linecap="round"/>
    <path d="M549 469 A86 86 0 0 1 696 385" fill="none" stroke="#ef6f5c" stroke-width="8" stroke-linecap="round"/>

    <!-- 车架 -->
    <g stroke="#ef6f5c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="372" y1="440" x2="472" y2="448"/>
      <line x1="372" y1="440" x2="428" y2="332"/>
      <line x1="472" y1="448" x2="428" y2="332"/>
      <line x1="472" y1="448" x2="588" y2="330"/>
      <line x1="428" y1="332" x2="588" y2="330"/>
      <line x1="588" y1="330" x2="630" y2="440"/>
    </g>
    <!-- 车把竖杆 + 弯把 -->
    <g stroke="#ef6f5c" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="588" y1="330" x2="598" y2="304"/>
      <path d="M586 302 Q602 294 617 307"/>
    </g>
    <!-- 握把套 -->
    <line x1="606" y1="297" x2="619" y2="311" stroke="#2e2e36" stroke-width="8" stroke-linecap="round"/>
    <!-- 车架节点 -->
    <circle cx="588" cy="330" r="7" fill="#ef6f5c"/>
    <circle cx="472" cy="448" r="6" fill="#ef6f5c"/>
    <!-- 坐垫 -->
    <ellipse cx="428" cy="329" rx="22" ry="8.5" fill="#3a3a42"/>
    <ellipse cx="424" cy="326" rx="16" ry="4" fill="#4d4d57"/>

    <!-- 链条 -->
    <g stroke="#9aa0aa" stroke-width="3" fill="none">
      <path d="M456 436 L382 430"/>
      <path d="M456 460 L382 466"/>
    </g>

    <!-- 车灯光束（黄昏） -->
    <path id="beam" d="M630 312 L772 296 L838 452 L636 326 Z" fill="#ffe98a"/>
    <!-- 车灯 -->
    <line x1="612" y1="308" x2="624" y2="314" stroke="#4a4a52" stroke-width="4" stroke-linecap="round"/>
    <circle cx="628" cy="315" r="8" fill="#2e2e36"/>
    <circle cx="631" cy="313" r="5.5" fill="#ffe066"/>

    <!-- 车铃（可点） -->
    <g id="bellBtnSvg">
      <line x1="584" y1="304" x2="582" y2="292" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
      <path id="bellBody" d="M572 290 a10 10 0 0 1 20 0 Z" fill="#f2b134" stroke="#cf8f16" stroke-width="2"/>
      <circle cx="582" cy="288" r="2.4" fill="#cf8f16"/>
    </g>
    <g id="bellRipple">
      <circle cx="582" cy="284" r="14" fill="none" stroke="#f2b134" stroke-width="3"/>
      <circle cx="582" cy="284" r="14" fill="none" stroke="#f2b134" stroke-width="3"/>
    </g>

    <!-- 远侧腿（暗色，JS 更新） -->
    <path id="legFar" d="" fill="none" stroke="#d67a2e" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footFar" transform="translate(0 0)" fill="#d67a2e">
      <path d="M-12 -2 Q0 -9 13 -3 L17 0 L13 3 Q0 9 -12 2 Z"/>
    </g>

    <!-- 牙盘 + 曲柄（旋转） -->
    <g id="crankSpin" transform="translate(472 448)">
      <circle r="19" fill="none" stroke="#c9ced6" stroke-width="4"/>
      <circle r="19" fill="rgba(255,255,255,.35)"/>
      <g stroke="#5a5f69" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="0" x2="27" y2="0"/>
        <line x1="0" y1="0" x2="-27" y2="0"/>
      </g>
      <circle r="5" fill="#3c3c44"/>
    </g>

    <!-- 踏板（JS 定位，保持水平） -->
    <rect id="pedalFar" x="-12" y="-4" width="24" height="8" rx="3" fill="#4a4a52"/>
    <rect id="pedalNear" x="-12" y="-4" width="24" height="8" rx="3" fill="#34343c"/>

    <!-- 近侧腿（JS 更新） -->
    <path id="legNear" d="" fill="none" stroke="#f2913c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footNear" transform="translate(0 0)" fill="#f2913c">
      <path d="M-12 -2 Q0 -9 13 -3 L17 0 L13 3 Q0 9 -12 2 Z"/>
      <path d="M2 -2 L12 -3 M2 2 L12 3" stroke="#d67a2e" stroke-width="1.6" fill="none"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 尾羽 -->
    <g fill="#fdfdfb" stroke="#d7dddb" stroke-width="2.5">
      <path d="M340 272 Q300 256 284 276 Q312 280 338 286 Z"/>
      <path d="M338 286 Q296 284 282 302 Q312 300 336 296 Z"/>
      <path d="M342 298 Q306 312 294 328 Q318 314 346 306 Z"/>
    </g>

    <!-- 身体 -->
    <g id="bodyCore">
      <ellipse cx="402" cy="288" rx="78" ry="62" transform="rotate(-6 402 288)" fill="#fdfdfb" stroke="#d7dddb" stroke-width="2.5"/>
      <ellipse cx="388" cy="300" rx="46" ry="38" transform="rotate(-6 388 300)" fill="#f4f6f5"/>
    </g>

    <!-- 收拢的翅膀 -->
    <path d="M368 256 Q420 236 464 262 Q472 296 446 318 Q404 334 372 314 Q354 284 368 256 Z"
          fill="#ecefee" stroke="#d3d9d7" stroke-width="2.5"/>
    <path d="M380 272 Q412 262 446 274 M378 290 Q410 284 440 294 M384 306 Q410 304 432 310"
          fill="none" stroke="#d3d9d7" stroke-width="2" stroke-linecap="round"/>

    <!-- 脖子（JS 每帧重绘，双层描边） -->
    <path id="neckEdge" d="" fill="none" stroke="#d7dddb" stroke-width="35" stroke-linecap="round"/>
    <path id="neckMain" d="" fill="none" stroke="#fdfdfb" stroke-width="29" stroke-linecap="round"/>

    <!-- 扶把的翅膀（手臂） -->
    <path d="M448 270 Q520 288 600 302 L612 306" fill="none" stroke="#d7dddb" stroke-width="24" stroke-linecap="round"/>
    <path d="M448 270 Q520 288 600 302 L612 306" fill="none" stroke="#fdfdfb" stroke-width="19" stroke-linecap="round"/>
    <!-- 握住车把的翅尖 -->
    <g fill="#fdfdfb" stroke="#d7dddb" stroke-width="2">
      <ellipse cx="610" cy="297" rx="5" ry="7" transform="rotate(38 610 297)"/>
      <ellipse cx="618" cy="299" rx="5" ry="7" transform="rotate(38 618 299)"/>
      <ellipse cx="624" cy="306" rx="5" ry="7" transform="rotate(38 624 306)"/>
    </g>

    <!-- 围巾（JS 补偿 + 飘带摆动） -->
    <g id="sashG">
      <path id="sash1Edge" d="" fill="none" stroke="#2c8fa5" stroke-width="14" stroke-linecap="round"/>
      <path id="sash1" d="" fill="none" stroke="#4fb6c9" stroke-width="9" stroke-linecap="round"/>
      <path id="sash2Edge" d="" fill="none" stroke="#2c8fa5" stroke-width="12" stroke-linecap="round"/>
      <path id="sash2" d="" fill="none" stroke="#62c2d3" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M518 208 L538 214 L528 226 L512 220 Z" fill="#37a6bd" stroke="#2c8fa5" stroke-width="1.5"/>
      <circle cx="527" cy="216" r="6" fill="#2c8fa5"/>
    </g>

    <!-- ===== 头部（鸡头稳定：补偿车身颠簸） ===== -->
    <g id="headG">
      <!-- 喉囊 -->
      <g id="pouchG">
        <path d="M568 200 C576 246 602 268 638 263 C670 259 692 232 694 210 C662 221 610 217 568 200 Z"
              fill="url(#pouchGrad)" stroke="#e8761c" stroke-width="2.5"/>
        <!-- 囊里的鱼 -->
        <g transform="translate(632 240) rotate(-10)">
          <path d="M-15 0 L-26 -8 L-23 0 L-26 8 Z" fill="#43a7ad"/>
          <ellipse cx="-4" cy="0" rx="15" ry="8.5" fill="#5cc2c6"/>
          <ellipse cx="-6" cy="-2" rx="9" ry="4" fill="#8fd9dc"/>
          <circle cx="8" cy="-2" r="2" fill="#1f4148"/>
          <circle cx="8.7" cy="-2.7" r=".8" fill="#fff"/>
        </g>
        <path d="M592 224 Q610 250 640 250 M600 214 Q624 232 660 226" fill="none"
              stroke="#e8761c" stroke-width="2" opacity=".45" stroke-linecap="round"/>
        <path d="M584 206 Q610 214 640 212" fill="none" stroke="#ffd09a" stroke-width="2.5" opacity=".6" stroke-linecap="round"/>
      </g>

      <!-- 上喙 -->
      <path d="M574 186 C622 180 678 188 697 198 C704 202 704 210 697 215 C694 208 687 206 683 209 L572 204 Z"
            fill="url(#beakGrad)" stroke="#e8761c" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="596" cy="190" r="1.8" fill="#c96a16"/>

      <!-- 脸 / 头 -->
      <ellipse cx="596" cy="197" rx="41" ry="33" fill="#fdfdfb" stroke="#d7dddb" stroke-width="2.5"/>

      <!-- 眼睛 -->
      <g id="eyeOpen">
        <ellipse cx="608" cy="183" rx="7.5" ry="8" fill="#fff" stroke="#c3cac7" stroke-width="1.5"/>
        <circle cx="609" cy="182" r="4.6" fill="#2b2b30"/>
        <circle cx="611" cy="180" r="1.7" fill="#fff"/>
      </g>
      <path id="eyeClosed" d="M601 183 Q608 189 615 183" fill="none" stroke="#2b2b30" stroke-width="2.6" stroke-linecap="round" opacity="0"/>

      <!-- 头顶羽毛 -->
      <g id="crest" fill="none" stroke="#d2d8d6" stroke-width="3.2" stroke-linecap="round">
        <path d="M586 165 Q581 151 588 142"/>
        <path d="M596 163 Q595 148 604 141"/>
        <path d="M605 166 Q610 154 619 149"/>
      </g>
    </g>
  </g>

  <!-- ===== 前景花草（JS 填充，最前层） ===== -->
  <g id="foreground"></g>

  <!-- 黄昏氛围罩 -->
  <rect id="warmVeil" x="0" y="0" width="1000" height="600" fill="#e8722b" pointer-events="none"/>
  <rect id="dimVeil" x="0" y="0" width="1000" height="600" fill="#33405e" pointer-events="none"/>
</svg>

  <!-- 控件 -->
  <div class="controls">
    <div class="seg" role="group" aria-label="骑行速度">
      <button class="ctrl-btn" data-gear="0" type="button">停车</button>
      <button class="ctrl-btn" data-gear="1" type="button">慢骑</button>
      <button class="ctrl-btn on" data-gear="2" type="button">巡航</button>
      <button class="ctrl-btn" data-gear="3" type="button">飞驰</button>
    </div>
    <button class="ctrl-btn icon-btn" id="bellBtn" type="button" aria-label="按车铃" title="按车铃">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f4148" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/>
        <path d="M10 19a2 2 0 0 0 4 0"/>
      </svg>
    </button>
    <button class="ctrl-btn icon-btn" id="sceneToggle" type="button" aria-label="切换白天黄昏" title="切换白天 / 黄昏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>

<p class="hint">切换速度看看车轮与风景，按按车铃——注意鹈鹕的头，它可是自带稳定器的。</p>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var scene = document.getElementById("scene");

  function el(tag, attrs, parent){
    var n = document.createElementNS(NS, tag);
    for(var k in attrs){ n.setAttribute(k, attrs[k]); }
    if(parent){ parent.appendChild(n); }
    return n;
  }
  function rand(a,b){ return a + Math.random()*(b-a); }

  /* ---------- 关键坐标 ---------- */
  var BB   = {x:472, y:448};   // 中轴（牙盘中心）
  var HIP  = {x:430, y:336};   // 腿根
  var CRANK = 27;              // 曲柄长度
  var L1 = 72, L2 = 84;        // 大腿 / 小腿
  var WHEEL_R = 76;
  var GEARS = [0, 0.55, 1, 1.75];
  var gear = 2;
  function factor(){ return GEARS[gear]; }

  /* ---------- 两连杆逆运动学：求膝盖 ---------- */
  function knee(H, P){
    var dx = P.x - H.x, dy = P.y - H.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    d = Math.max(Math.abs(L1-L2)+0.01, Math.min(L1+L2-0.01, d));
    var a = (L1*L1 - L2*L2 + d*d) / (2*d);
    var h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    var mx = H.x + a*dx/d, my = H.y + a*dy/d;
    var px = -dy/d, py = dx/d;
    var k1 = {x:mx + px*h, y:my + py*h};
    var k2 = {x:mx - px*h, y:my - py*h};
    // 选偏前（右）、偏上的交点作为膝盖
    var s1 = -k1.y*1.0 + k1.x*0.6;
    var s2 = -k2.y*1.0 + k2.x*0.6;
    return s1 > s2 ? k1 : k2;
  }

  /* ---------- 重复元素滚动池 ---------- */
  function Scroller(groupId, opts){
    this.g = document.getElementById(groupId);
    this.speed = opts.speed;
    this.gap = opts.gap;
    this.items = [];
    var count = Math.ceil(1000/this.gap) + 2;
    var span = count*this.gap;
    for(var i=0;i<count;i++){
      var item = {x:i*this.gap + rand(-this.gap*0.3, this.gap*0.3)};
      var node = opts.build(item);
      this.g.appendChild(node);
      item.node = node;
      opts.place(item);
      node.setAttribute("transform",
        "translate("+item.x.toFixed(1)+" "+item.y.toFixed(1)+") scale("+item.s.toFixed(2)+")");
      this.items.push(item);
    }
    this.opts = opts;
    this.span = span;
  }
  Scroller.prototype.update = function(f, dt){
    var wind = this.opts.wind ? 0.22 + 0.78*f : f;
    var v = this.speed * wind;
    for(var i=0;i<this.items.length;i++){
      var it = this.items[i];
      it.x -= v*dt;
      if(it.x < -this.opts.off){
        it.x += this.span;
        this.opts.place(it);
      }
      it.node.setAttribute("transform",
        "translate("+it.x.toFixed(1)+" "+it.y.toFixed(1)+") scale("+it.s.toFixed(2)+")");
    }
  };

  /* 云 */
  var clouds = new Scroller("clouds", {
    speed:9, gap:330, wind:true, off:160,
    build:function(){
      var g = el("g",{});
      el("ellipse",{class:"shade",cx:0,cy:14,rx:46,ry:20},g);
      el("ellipse",{class:"cloud",cx:-24,cy:6,rx:24,ry:20},g);
      el("ellipse",{class:"cloud",cx:2,cy:-6,rx:30,ry:26},g);
      el("ellipse",{class:"cloud",cx:28,cy:6,rx:24,ry:19},g);
      el("ellipse",{class:"cloud",cx:0,cy:12,rx:44,ry:16},g);
      return g;
    },
    place:function(it){ it.y = rand(50,175); it.s = rand(0.65,1.25); }
  });

  /* 树 */
  var treeGreens = ["#4f9a48","#5fa84b","#69b255","#57a047"];
  var trees = new Scroller("trees", {
    speed:52, gap:285, off:90,
    build:function(){
      var g = el("g",{});
      el("rect",{x:-4,y:-48,width:8,height:48,rx:3,fill:"#8a5a3b"},g);
      var c = treeGreens[(Math.random()*treeGreens.length)|0];
      el("circle",{cx:-17,cy:-50,r:20,fill:c},g);
      el("circle",{cx:3,cy:-64,r:25,fill:c},g);
      el("circle",{cx:22,cy:-49,r:18,fill:c},g);
      el("circle",{cx:-2,cy:-52,r:12,fill:"rgba(255,255,255,.12)"},g);
      return g;
    },
    place:function(it){ it.y = 474; it.s = rand(0.78,1.18); }
  });

  /* 路面痕迹 */
  var marks = new Scroller("roadMarks", {
    speed:210, gap:52, off:30,
    build:function(){
      var g = el("g",{});
      el("ellipse",{cx:0,cy:0,rx:rand(7,12),ry:2.6,fill:"#d4b57e"},g);
      return g;
    },
    place:function(it){ it.y = rand(505,538); it.s = rand(0.8,1.25); }
  });

  /* 前景草与花 */
  function buildGrass(){
    var g = el("g",{});
    var c = Math.random() < 0.42 ? "#5fa047" : "#6cab52";
    el("path",{d:"M0 0 Q-3 -16 -11 -25",fill:"none",stroke:c,"stroke-width":3.5,"stroke-linecap":"round"},g);
    el("path",{d:"M0 0 Q1 -20 3 -30",fill:"none",stroke:c,"stroke-width":3.5,"stroke-linecap":"round"},g);
    el("path",{d:"M0 0 Q9 -15 15 -22",fill:"none",stroke:c,"stroke-width":3.5,"stroke-linecap":"round"},g);
    return g;
  }
  function buildFlower(){
    var g = el("g",{});
    var petals = ["#ef6f5c","#f2b134","#e88aae","#ffffff","#b089d6"];
    var pc = petals[(Math.random()*petals.length)|0];
    var h = rand(18,30);
    el("line",{x1:0,y1:0,x2:0,y2:-h,stroke:"#5fa047","stroke-width":2.6,"stroke-linecap":"round"},g);
    for(var a=0;a<5;a++){
      var ang = a*72*Math.PI/180;
      el("circle",{cx:(Math.cos(ang)*4.6).toFixed(1),cy:(-h+Math.sin(ang)*4.6).toFixed(1),r:3.4,fill:pc},g);
    }
    el("circle",{cx:0,cy:-h,r:2.6,fill:"#f2b134"},g);
    return g;
  }
  var fore = new Scroller("foreground", {
    speed:278, gap:66, off:40,
    build:function(){ return Math.random()<0.32 ? buildFlower() : buildGrass(); },
    place:function(it){ it.y = rand(550,590); it.s = rand(0.8,1.3); }
  });

  /* ---------- 双段循环（丘 / 栅栏） ---------- */
  function DualTiles(id, tileW, pathHtml){
    this.g = document.getElementById(id);
    this.g.innerHTML = "";
    this.a = el("g",{},this.g);
    this.b = el("g",{},this.g);
    this.a.innerHTML = pathHtml;
    this.b.innerHTML = pathHtml;
    this.w = tileW; this.d = 0;
    this.a.setAttribute("transform","translate(0 0)");
    this.b.setAttribute("transform","translate("+tileW+" 0)");
  }
  DualTiles.prototype.update = function(f, dt, speed){
    this.d += speed*f*dt;
    var x = -(this.d % this.w);
    this.a.setAttribute("transform","translate("+x+" 0)");
    this.b.setAttribute("transform","translate("+(x+this.w)+" 0)");
  };

  var hillFarHtml = '<path class="hill-far" d="M0 470 L0 420 Q120 388 250 420 Q360 446 470 414 Q600 380 740 418 Q880 448 1000 420 L1000 470 Z"/>';
  var hillNearHtml = '<path class="hill-near" d="M0 470 L0 444 Q150 418 300 442 Q430 462 560 436 Q720 408 860 440 Q940 456 1000 444 L1000 470 Z"/>';
  var hillsFar = new DualTiles("hillsFar", 1000, hillFarHtml);
  var hillsNear = new DualTiles("hillsNear", 1000, hillNearHtml);

  /* 栅栏：一段 1000 宽的尖桩篱栅 */
  var fenceHtml = "";
  fenceHtml += '<rect x="0" y="462" width="1000" height="7" fill="#f4f1e8"/>';
  fenceHtml += '<rect x="0" y="480" width="1000" height="7" fill="#efe9db"/>';
  for(var fx=50; fx<1000; fx+=100){
    fenceHtml += '<rect x="'+(fx-5)+'" y="452" width="10" height="48" fill="#f7f4ec" stroke="#dcd4c2" stroke-width="1.5"/>';
    fenceHtml += '<path d="M'+(fx-5)+' 452 L'+fx+' 442 L'+(fx+5)+' 452 Z" fill="#f7f4ec" stroke="#dcd4c2" stroke-width="1.5"/>';
  }
  var fence = new DualTiles("fence", 1000, fenceHtml);

  /* ---------- 元素引用 ---------- */
  var spinBack = document.getElementById("spinBack");
  var spinFront = document.getElementById("spinFront");
  var crankSpin = document.getElementById("crankSpin");
  var rig = document.getElementById("rig");
  var headG = document.getElementById("headG");
  var pouchG = document.getElementById("pouchG");
  var crest = document.getElementById("crest");
  var neckEdge = document.getElementById("neckEdge");
  var neckMain = document.getElementById("neckMain");
  var sashG = document.getElementById("sashG");
  var sash1 = document.getElementById("sash1");
  var sash1Edge = document.getElementById("sash1Edge");
  var sash2 = document.getElementById("sash2");
  var sash2Edge = document.getElementById("sash2Edge");
  var legNear = document.getElementById("legNear");
  var legFar = document.getElementById("legFar");
  var footNear = document.getElementById("footNear");
  var footFar = document.getElementById("footFar");
  var pedalNear = document.getElementById("pedalNear");
  var pedalFar = document.getElementById("pedalFar");
  var eyeOpen = document.getElementById("eyeOpen");
  var eyeClosed = document.getElementById("eyeClosed");

  /* ---------- 眨眼 ---------- */
  var nextBlink = performance.now() + 1800, blinkStart = -1;
  function updateBlink(now){
    if(blinkStart < 0 && now > nextBlink){ blinkStart = now; }
    var closed = blinkStart >= 0 && (now - blinkStart) < 130;
    eyeOpen.setAttribute("opacity", closed ? "0" : "1");
    eyeClosed.setAttribute("opacity", closed ? "1" : "0");
    if(blinkStart >= 0 && now - blinkStart >= 130){
      blinkStart = -1;
      nextBlink = now + rand(1600, 4200);
    }
  }

  /* ---------- 车铃 ---------- */
  var bellRipple = document.getElementById("bellRipple");
  var bellSvg = document.getElementById("bellBtnSvg");
  var bellBtn = document.getElementById("bellBtn");
  var audioCtx = null;
  var ringUntil = 0;
  function ring(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    if(audioCtx){
      if(audioCtx.state === "suspended"){ audioCtx.resume(); }
      var notes = [1568, 2093];
      for(var i=0;i<2;i++){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = notes[i];
        var t0 = audioCtx.currentTime + i*0.03;
        gain.gain.setValueAtTime(i===0?0.22:0.12, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0+0.85);
      }
    }
    bellRipple.classList.remove("ring");
    void bellRipple.getBoundingClientRect();
    bellRipple.classList.add("ring");
    ringUntil = performance.now() + 650;
  }
  bellBtn.addEventListener("click", ring);
  bellSvg.addEventListener("click", ring);

  /* ---------- 速度档位 ---------- */
  var gearBtns = document.querySelectorAll(".seg .ctrl-btn");
  gearBtns.forEach(function(b){
    b.addEventListener("click", function(){
      gear = parseInt(b.getAttribute("data-gear"),10);
      gearBtns.forEach(function(x){ x.classList.toggle("on", x===b); });
    });
  });

  /* ---------- 白天 / 黄昏 ---------- */
  var sceneToggle = document.getElementById("sceneToggle");
  sceneToggle.addEventListener("click", function(){
    var dusk = scene.getAttribute("data-scene") === "dusk";
    scene.setAttribute("data-scene", dusk ? "day" : "dusk");
    sceneToggle.classList.toggle("on", !dusk);
  });

  /* ---------- 主循环 ---------- */
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion){
    gear = 0;
    document.querySelector('.seg .ctrl-btn[data-gear="2"]').classList.remove("on");
    document.querySelector('.seg .ctrl-btn[data-gear="0"]').classList.add("on");
  }

  var wheelAngle = 0, crankAngle = 0, t = 0, last = performance.now();
  var NECK_BASE = {x:448, y:256};
  var NECK_HEAD = {x:558, y:216};

  function frame(now){
    var dt = Math.min(0.05, (now-last)/1000);
    last = now;
    t += dt;
    var f = factor();

    /* 轮 / 曲柄（轮与地面无滑动：ω = v / r） */
    var wheelW = 210/WHEEL_R;
    wheelAngle += wheelW*f*dt;
    crankAngle += (wheelW/2.2)*f*dt;
    spinBack.setAttribute("transform","rotate("+(wheelAngle*180/Math.PI)+")");
    spinFront.setAttribute("transform","rotate("+(wheelAngle*180/Math.PI)+")");
    crankSpin.setAttribute("transform","translate(472 448) rotate("+(crankAngle*180/Math.PI)+")");

    /* 车身颠簸（幅度随速度） */
    var amp = f===0 ? 0 : Math.min(1.25, 0.35 + f*0.55);
    var bobY = Math.sin(crankAngle*2 - Math.PI/2) * 1.8 * amp;
    var rigR = Math.sin(crankAngle*2) * 0.5 * amp;
    rig.setAttribute("transform","translate(0 "+bobY.toFixed(2)+") rotate("+rigR.toFixed(2)+" 500 430)");

    /* 鸡头稳定：补偿绝大部分颠簸 */
    var compY = -bobY*0.9;
    var compR = -rigR*0.92;
    var bonk = 0;
    if(now < ringUntil){
      var p = 1 - (ringUntil-now)/650;
      bonk = Math.sin(p*Math.PI)*9; // 听到铃声点头
    }
    headG.setAttribute("transform","translate(0 "+compY.toFixed(2)+") rotate("+(compR+bonk).toFixed(2)+" 596 197)");

    /* 脖子跟随 */
    var hy = NECK_HEAD.y + compY;
    var neckD = "M"+NECK_BASE.x+" "+NECK_BASE.y+
      " C452 214 492 186 532 196 C552 201 "+(NECK_HEAD.x+4)+" "+(hy-8)+" "+NECK_HEAD.x+" "+hy;
    neckEdge.setAttribute("d", neckD);
    neckMain.setAttribute("d", neckD);

    /* 围巾：结随头微补偿，飘带随风速后扬、波浪摆动 */
    sashG.setAttribute("transform","translate(0 "+(compY*0.6).toFixed(2)+")");
    var w = 3 + f*8, back = f*15;
    var s1tx = 430 - back + Math.sin(t*7)*w;
    var s1ty = 240 + Math.cos(t*7)*w*0.7;
    var s2tx = 438 - back*1.15 + Math.sin(t*7+1.4)*w;
    var s2ty = 272 + Math.cos(t*7+1.4)*w*0.7;
    var d1 = "M526 218 C498 225 "+(466-back*0.4)+" 232 "+s1tx.toFixed(1)+" "+s1ty.toFixed(1);
    var d2 = "M530 222 C500 238 "+(470-back*0.5)+" 254 "+s2tx.toFixed(1)+" "+s2ty.toFixed(1);
    sash1Edge.setAttribute("d",d1); sash1.setAttribute("d",d1);
    sash2Edge.setAttribute("d",d2); sash2.setAttribute("d",d2);

    /* 喉囊被风吹得轻晃 */
    var pouchA = Math.sin(t*3.2)*2*(0.5+f) + f*1.6;
    pouchG.setAttribute("transform","rotate("+pouchA.toFixed(2)+" 575 202)");
    /* 头顶羽毛 */
    crest.setAttribute("transform","rotate("+(Math.sin(t*5)* (3+f*7)).toFixed(2)+" 596 162)");

    /* 踏板位置 + 腿 IK */
    var p1 = {x:BB.x + CRANK*Math.cos(crankAngle),        y:BB.y + CRANK*Math.sin(crankAngle)};
    var p2 = {x:BB.x + CRANK*Math.cos(crankAngle+Math.PI),y:BB.y + CRANK*Math.sin(crankAngle+Math.PI)};
    pedalNear.setAttribute("transform","translate("+p1.x.toFixed(1)+" "+p1.y.toFixed(1)+")");
    pedalFar.setAttribute("transform","translate("+p2.x.toFixed(1)+" "+p2.y.toFixed(1)+")");
    footNear.setAttribute("transform","translate("+p1.x.toFixed(1)+" "+p1.y.toFixed(1)+")");
    footFar.setAttribute("transform","translate("+p2.x.toFixed(1)+" "+(p2.y-1).toFixed(1)+")");

    var kn = knee(HIP, p1), kf = knee({x:HIP.x-4,y:HIP.y-3}, p2);
    legNear.setAttribute("d","M"+HIP.x+" "+HIP.y+" L"+kn.x.toFixed(1)+" "+kn.y.toFixed(1)+" L"+p1.x.toFixed(1)+" "+p1.y.toFixed(1));
    legFar.setAttribute("d","M"+(HIP.x-4)+" "+(HIP.y-3)+" L"+kf.x.toFixed(1)+" "+kf.y.toFixed(1)+" L"+p2.x.toFixed(1)+" "+p2.y.toFixed(1));

    /* 视差层 */
    clouds.update(f,dt);
    hillsFar.update(f,dt,22);
    hillsNear.update(f,dt,34);
    trees.update(f,dt);
    marks.update(f,dt);
    fence.update(f,dt,128);
    fore.update(f,dt);

    updateBlink(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
