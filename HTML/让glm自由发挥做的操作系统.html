  id:"files", name:"文件", icon:"📁", desc:"浏览虚拟文件系统",
  w:760, h:500, desktop:true,

  mount(body, win, args) {
    const state = {
      cwd: args.path || "/home/user",
      hist: [], hi: -1,
      sel: null,
    };
    const fileIcon = (name, node) => {
      if (node.t === "d") return "📁";
      if (name.startsWith("data:image") || /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(name)) return "🖼️";
      if (/\.md$/i.test(name)) return "📘";
      if (/\.(js|json)$/i.test(name)) return "📜";
      if (/\.(html|css)$/i.test(name)) return "🎨";
      if (/\.(txt|log)$/i.test(name)) return "📄";
      if (/\.(mp3|wav|ogg)$/i.test(name)) return "🎵";
      return "📄";
    };
    const sidebarItems = [
      ["🏠", "主目录", "/home/user"],
      ["🖥️", "桌面", "/home/user/Desktop"],
      ["📘", "文档", "/home/user/Documents"],
      ["🖼️", "图片", "/home/user/Pictures"],
      ["🎵", "音乐", "/home/user/Music"],
      ["📥", "下载", "/home/user/Downloads"],
      ["⚙️", "系统 · /etc", "/etc"],
      ["📦", "系统 · /bin", "/bin"],
    ];

    const side = el("div", { class:"fx-side" },
      el("div", { class:"fx-side-title", text:"位置" }),
      ...sidebarItems.map(([ico, label, path]) =>
        el("div", { class:"fx-side-item", dataset:{ path },
          onclick: () => nav(path),
          html: `<span>${ico}</span><span>${label}</span>` })));

    const crumbs = el("div", { class:"fx-crumbs" });
    const grid = el("div", { class:"fx-grid" });
    const status = el("div", { class:"fx-status" });
    const backB = el("button", { class:"btn btn-ghost icon-btn", text:"←", title:"后退", onclick: () => { if (state.hi > 0) { state.hi--; state.cwd = state.hist[state.hi]; render(); } } });
    const fwdB  = el("button", { class:"btn btn-ghost icon-btn", text:"→", title:"前进", onclick: () => { if (state.hi < state.hist.length-1) { state.hi++; state.cwd = state.hist[state.hi]; render(); } } });
    const upB   = el("button", { class:"btn btn-ghost icon-btn", text:"↑", title:"上一级", onclick: () => nav(FS.normalize("..", state.cwd)) });
    const main = el("div", { class:"fx-main" },
      el("div", { class:"fx-bar" },
        backB, fwdB, upB, crumbs,
        el("button", { class:"btn", text:"＋ 文件夹", onclick: () => newItem("dir") }),
        el("button", { class:"btn", text:"＋ 文件", onclick: () => newItem("file") })),
      grid, status);
    body.append(el("div", { class:"fx" }, side, main));

    function nav(path) {
      state.hist = state.hist.slice(0, state.hi+1);
      state.hist.push(path);
      state.hi = state.hist.length - 1;
      state.cwd = path;
      render();
    }
    function newItem(kind) {
      UI.prompt(kind === "dir" ? "新建文件夹" : "新建文件", kind === "dir" ? "新建文件夹" : "新建文本.txt").then(name => {
        if (!name) return;
        const finalName = FS.uniqueName(state.cwd, name);
        const err = kind === "dir" ? FS.mkdir(state.cwd + "/" + finalName) : FS.writeFile(state.cwd + "/" + finalName, "");
        if (err) UI.notify("文件", err, "⚠️");
        render();
      });
    }

    function render() {
      win.setTitle("文件 — " + (state.cwd.replace("/home/user","~") || "/"));
      backB.disabled = state.hi <= 0; fwdB.disabled = state.hi >= state.hist.length-1;
      // crumbs
      crumbs.innerHTML = "";
      const segs = state.cwd.split("/").filter(Boolean);
      crumbs.append(el("span", { class:"fx-crumb", text:"/ ", onclick: () => nav("/") }));
      let acc = "";
      segs.forEach((s, i) => {
        acc += "/" + s;
        const path = acc;
        crumbs.append(el("span", { class:"fx-crumb" + (i === segs.length-1 ? " last" : ""), text: s.replace(/^user$/, "~").replace(/^home$/, "home"),
          onclick: () => nav(path) }));
        if (i < segs.length-1) crumbs.append(el("span", { class:"fx-crumb-sep", text:"›" }));
      });
      // side highlight
      $$(".fx-side-item", side).forEach(s => s.classList.toggle("active", s.dataset.path === state.cwd));
      // grid
      grid.innerHTML = "";
      const items = FS.ls(state.cwd);
      if (!items) { nav("/"); return; }
      if (!items.length) grid.append(el("div", { class:"fx-empty", text:"这个文件夹是空的" }));
      for (const it of items) {
        const node = it.node;
        const g = el("div", { class:"fx-item" },
          el("span", { class:"fi-ico", text: fileIcon(it.name, node) }),
          el("span", { class:"fi-name", text: it.name }));
        g.addEventListener("click", () => {
          $$(".fx-item.sel", grid).forEach(x => x.classList.remove("sel"));
          g.classList.add("sel");
          state.sel = it.name;
          status.textContent = it.name + " · " + (node.t === "d" ? Object.keys(node.c).length + " 项" : fmtBytes(node.c.length));
        });
        g.addEventListener("dblclick", () => {
          const p = state.cwd + "/" + it.name;
          if (node.t === "d") nav(p);
          else Apps.openFile(p, node.c);
        });
        g.addEventListener("contextmenu", e => {
          e.preventDefault(); e.stopPropagation();
          const p = state.cwd + "/" + it.name;
          UI.menu(e.clientX, e.clientY, [
            { label:"打开", icon:"📂", action: () => node.t === "d" ? nav(p) : Apps.openFile(p, node.c) },
            "-",
            { label:"重命名", icon:"✏️", action: () => UI.prompt("重命名", it.name).then(n2 => {
              if (!n2 || n2 === it.name) return;
              FS.mv(p, state.cwd + "/" + n2);
              render();
            })},
            { label:"复制到当前", icon:"⧉", action: () => { FS.cp(p, state.cwd + "/" + FS.uniqueName(state.cwd, "副本 " + it.name)); render(); } },
            { label:"删除", icon:"🗑️", action: () => UI.confirm("删除", `确定删除「${it.name}」吗？此操作不可撤销。`, "🗑️").then(ok => {
              if (!ok) return;
              FS.rm(p); render();
              UI.notify("文件", "已删除 " + it.name, "🗑️");
            })},
          ]);
        });
        grid.append(g);
      }
      status.textContent = items.length + " 个项目";
    }

    grid.addEventListener("contextmenu", e => {
      if (e.target.closest(".fx-item")) return;
      e.preventDefault();
      UI.menu(e.clientX, e.clientY, [
        { label:"新建文件夹", icon:"📁", action: () => newItem("dir") },
        { label:"新建文本文件", icon:"📄", action: () => newItem("file") },
        "-",
        { label:"刷新", icon:"🔄", action: render },
        { label:"在终端中打开", icon:"⌨️", action: () => OS.launch("terminal") },
      ]);
    });

    nav(state.cwd);
    win.listen(win.el, "fsrefresh", render);
    Bus.on("fs.reset", () => { if (!win._closed) render(); });
  }
});

/* ================================================================
   APP: 代码编辑器
   ================================================================ */
const KEYWORDS = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|super|this|typeof|instanceof|in|of|try|catch|finally|throw|async|await|yield|import|export|from|default|delete|void|null|undefined|true|false|static|get|set)\b/g;

function highlightCode(code, lang) {
  let s = esc(code);
  if (lang === "js") {
    s = s.replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`[^`]*`)/g, '<span class="tok-str">$1</span>');
    s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, '<span class="tok-com">$1</span>');
    s = s.replace(KEYWORDS, '<span class="tok-kw">$1</span>');
    s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');
    s = s.replace(/([A-Za-z_$][\w$]*)(\s*\()/g, '<span class="tok-fn">$1</span>$2');
  } else if (lang === "html") {
    s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-com">$1</span>');
    s = s.replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g, '$1<span class="tok-tag">$2</span>');
    s = s.replace(/([\w-]+)=(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="tok-attr">$1</span>=<span class="tok-str">$2</span>');
  } else if (lang === "css") {
    s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="tok-com">$1</span>');
    s = s.replace(/([.#]?[\w-]+)(\s*\{)/g, '<span class="tok-tag">$1</span>$2');
    s = s.replace(/([\w-]+)(\s*:)/g, '<span class="tok-prop">$1</span>$2');
  } else if (lang === "md") {
    s = s.replace(/^(#{1,6} .*)$/gm, '<span class="tok-tag">$1</span>');
    s = s.replace(/(\*\*.*?\*\*)/g, '<span class="tok-kw">$1</span>');
    s = s.replace(/(`[^`]*`)/g, '<span class="tok-str">$1</span>');
  }
  return s;
}

OS.registerApp({
  id:"editor", name:"编辑器", icon:"📝", desc:"带语法高亮的代码编辑器，可以运行 JS / 预览 HTML",
  w:780, h:540, desktop:true,

  mount(body, win, args) {
    let path = args.path || null;
    let dirty = false;
    const langOf = p => !p ? "js" : /\.js$/i.test(p) ? "js" : /\.html?$/i.test(p) ? "html" : /\.css$/i.test(p) ? "css" : /\.md$/i.test(p) ? "md" : "plain";

    const langChip = el("span", { class:"ed-lang", text: langOf(path).toUpperCase() });
    const dirtyDot = el("span", { class:"ed-dirty" });
    const ta = el("textarea", { class:"ed-ta", spellcheck:"false", wrap:"off" });
    const pre = el("pre", { class:"ed-pre" }, el("code"));
    const gutter = el("div", { class:"ed-gutter" });
    const outBody = el("div", { class:"ed-out-body" });
    const outHead = el("div", { class:"ed-out-head" },
      el("span", { text:"控制台输出" }),
      el("button", { class:"btn btn-ghost icon-btn", text:"✕", onclick: () => { out.classList.remove("show"); iframe.classList.remove("show"); } }));
    const out = el("div", { class:"ed-out" }, outHead, outBody);
    const iframe = el("iframe", { class:"ed-preview", sandbox:"allow-scripts" });
    const statusL = el("span", { class:"muted", text:"" });

    const saveB = el("button", { class:"btn btn-primary", text:"💾 保存", onclick: save });
    const runB  = el("button", { class:"btn", text:"▶ 运行", onclick: run });

    const bar = el("div", { class:"ed-bar" },
      el("button", { class:"btn btn-ghost icon-btn", text:"📂", title:"打开文件", onclick: () => UI.prompt("打开文件", "/home/user/Documents/hello.js").then(p => {
        if (!p) return;
        const c = FS.read(p);
        if (c === null || c === undefined) return UI.notify("编辑器", "找不到文件: " + p, "⚠️");
        load(p, c);
      })}),
      saveB, runB,
      el("span", { class:"pt-sep" }),
      dirtyDot, langChip, statusL);

    const main = el("div", { class:"ed-main" }, gutter, el("div", { class:"ed-wrap" }, pre, ta));
    body.append(el("div", { class:"ed" }, bar, main, out, iframe));

    const codeEl = pre.firstChild;
    function refresh() {
      const code = ta.value;
      codeEl.innerHTML = highlightCode(code, langOf(path)) + "\n";
      const lines = code.split("\n").length;
      gutter.innerHTML = Array.from({length: lines}, (_,i) => i+1).join("<br>");
      syncScroll();
    }
    function syncScroll() {
      pre.style.transform = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`;
      gutter.style.transform = `translateY(${-ta.scrollTop}px)`;
    }
    ta.addEventListener("scroll", syncScroll);
    ta.addEventListener("input", () => { dirty = true; dirtyDot.classList.add("show"); refresh(); });
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab") {
        e.preventDefault();
        const s = ta.selectionStart;
        ta.setRangeText("  ", s, ta.selectionEnd, "end");
        ta.dispatchEvent(new Event("input"));
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
    });
    ta.addEventListener("keyup", updateStatus);
    ta.addEventListener("click", updateStatus);
    function updateStatus() {
      const upto = ta.value.slice(0, ta.selectionStart);
      const line = upto.split("\n").length;
      const col = upto.length - upto.lastIndexOf("\n");
      statusL.textContent = `行 ${line}, 列 ${col} · ${ta.value.length} 字符`;
    }

    function load(p, content) {
      path = p; dirty = false; dirtyDot.classList.remove("show");
      langChip.textContent = langOf(p).toUpperCase();
      ta.value = content;
      win.setTitle((p.split("/").pop() || "未命名") + " — 编辑器");
      refresh(); updateStatus();
    }
    function save() {
      if (!path) {
        UI.prompt("保存为", "/home/user/Documents/untitled.js").then(p => { if (p) { path = p; save(); } });
        return;
      }
      const err = FS.writeFile(path, ta.value);
      if (err) return UI.notify("编辑器", err, "⚠️");
      dirty = false; dirtyDot.classList.remove("show");
      UI.notify("编辑器", "已保存 " + path.split("/").pop(), "💾");
      langChip.textContent = langOf(path).toUpperCase();
    }
    function run() {
      const lang = langOf(path);
      outBody.innerHTML = "";
      if (lang === "js") {
        iframe.classList.remove("show"); out.classList.add("show");
        const t0 = performance.now();
        const logs = [];
        const fmt = v => {
          if (typeof v === "string") return v;
          try { return JSON.stringify(v, null, 1); } catch(e) { return String(v); }
        };
        const fakeConsole = {
          log: (...a) => logs.push(["log", a.map(fmt).join(" ")]),
          warn:(...a) => logs.push(["warn", a.map(fmt).join(" ")]),
          error:(...a) => logs.push(["error", a.map(fmt).join(" ")]),
          info:(...a) => logs.push(["log", a.map(fmt).join(" ")]),
        };
        try {
          const fn = new Function("console", `"use strict";\n${ta.value}`);
          fn(fakeConsole);
          logs.push(["dim", `— 运行完成，耗时 ${(performance.now()-t0).toFixed(1)}ms —`]);
        } catch(err) {
          logs.push(["error", "✖ " + (err.stack || err.message)]);
        }
        for (const [cls, text] of logs) {
          outBody.append(el("div", { class: cls === "warn" ? "t-warn" : cls === "error" ? "t-err" : cls === "dim" ? "t-dim" : "", style:{ whiteSpace:"pre-wrap" }, text }));
        }
      } else if (lang === "html") {
        out.classList.remove("show");
        iframe.srcdoc = ta.value;
        iframe.classList.add("show");
        UI.notify("编辑器", "HTML 预览已打开", "🌐");
      } else {
        out.classList.add("show");
        outBody.append(el("div", { class:"t-dim", text: "这个文件类型 (" + lang + ") 不支持直接运行。支持运行 .js，预览 .html。" }));
      }
    }

    if (path) {
      const c = FS.read(path);
      if (c !== null && c !== undefined) load(path, c);
      else { path = null; refresh(); }
    } else {
      ta.value = `// 新建脚本 — 按 Ctrl+S 保存，Ctrl+Enter 或 ▶ 运行\nconsole.log("Hello, Aurora!");\n`;
      refresh(); updateStatus();
    }
    win.after(80, () => ta.focus());
  }
});
</script>
<script>
"use strict";
/* ================================================================
   GAMES
   ================================================================ */
const gameOverlay = (stage, title, sub, btnText, onBtn) => {
  stage.querySelector(".g-overlay")?.remove();
  const ov = el("div", { class:"g-overlay", style:{ display:"none" } },
    el("h2", { text: title }),
    el("div", { class:"muted", text: sub }),
    el("button", { class:"btn btn-primary", text: btnText, onclick: () => { ov.style.display = "none"; onBtn(); } }));
  ov.show = (t, s) => {
    ov.querySelector("h2").textContent = t;
    ov.querySelector(".muted").textContent = s;
    ov.style.display = "flex";
  };
  stage.append(ov);
  return ov;
};

/* ---------------- Snake ---------------- */
OS.registerApp({
  id:"snake", name:"贪吃蛇", icon:"🐍", desc:"经典街机 · 方向键或 WASD · 空格暂停",
  w:520, h:600, desktop:true,

  mount(body, win) {
    const N = 20, CELL = 20;
    const scoreEl = el("b", { text:"0" }), bestEl = el("b", { text: localStorage.getItem("aurora.snake.best") || "0" });
    const speedEl = el("b", { text:"1.0x" });
    const cv = el("canvas", { class:"snake-cv", width:N*CELL, height:N*CELL });
    const stage = el("div", { class:"g-stage" }, el("div", { class:"g-canvas-frame" }, cv));
    body.append(el("div", { class:"game-shell" },
      el("div", { class:"g-hud" },
        el("div", { class:"g-stat" }, scoreEl, el("span", { text:"得分" })),
        el("div", { class:"g-stat" }, bestEl, el("span", { text:"最高分" })),
        el("div", { class:"g-stat" }, speedEl, el("span", { text:"速度" })),
        el("span", { class:"muted", style:{ fontSize:"11px" }, text:"方向键/WASD 移动 · 空格暂停" })),
      stage));

    const cx = cv.getContext("2d");
    let snake, dir, nextDir, food, score, dead, paused, timer, speedLv;

    const overlay = gameOverlay(stage, "🐍 贪吃蛇", "吃到发光的食物，别撞到自己", "开始游戏", () => start());

    function reset() {
      snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
      dir = {x:1,y:0}; nextDir = dir;
      score = 0; speedLv = 1; dead = false; paused = false;
      scoreEl.textContent = "0"; speedEl.textContent = "1.0x";
      placeFood();
    }
    function placeFood() {
      do { food = { x: randi(0,N-1), y: randi(0,N-1) }; }
      while (snake.some(s => s.x === food.x && s.y === food.y));
    }
    function start() {
      reset();
      overlay.style.display = "none";
      clearInterval(timer);
      schedule();
    }
    function schedule() {
      clearInterval(timer);
      const ms = Math.max(60, 150 - (speedLv-1)*10);
      timer = setInterval(tick, ms);
      win._cleanup.push(() => clearInterval(timer));
    }
    function tick() {
      if (paused || dead) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true;
        const best = Math.max(score, parseInt(localStorage.getItem("aurora.snake.best")||"0"));
        localStorage.setItem("aurora.snake.best", best);
        bestEl.textContent = best;
        overlay.show("💀 游戏结束", `得分 ${score} · 最高 ${best}`, "再来一局");
        draw();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        const nl = 1 + Math.floor(score/50);
        if (nl !== speedLv) { speedLv = nl; speedEl.textContent = speedLv + ".0x"; schedule(); }
        placeFood();
      } else snake.pop();
      draw();
    }
    function draw() {
      const acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      // bg
      cx.fillStyle = "#0b1120"; cx.fillRect(0,0,cv.width,cv.height);
      cx.strokeStyle = "rgba(255,255,255,.035)";
      for (let i = 0; i <= N; i++) {
        cx.beginPath(); cx.moveTo(i*CELL,0); cx.lineTo(i*CELL,cv.height); cx.stroke();
        cx.beginPath(); cx.moveTo(0,i*CELL); cx.lineTo(cv.width,i*CELL); cx.stroke();
      }
      if (!snake) return;
      // food
      const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
      cx.save();
      cx.shadowColor = "#ff5c8a"; cx.shadowBlur = 12;
      cx.fillStyle = "#ff5c8a";
      cx.beginPath(); cx.arc(fx, fy, CELL*.36, 0, 6.29); cx.fill();
      cx.restore();
      // snake
      snake.forEach((s, i) => {
        const t = 1 - i/snake.length;
        cx.fillStyle = i === 0 ? "#aef" : acc;
        cx.globalAlpha = i === 0 ? 1 : .35 + t*.6;
        cx.beginPath();
        cx.roundRect(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3, 5);
        cx.fill();
      });
      cx.globalAlpha = 1;
      if (paused) {
        cx.fillStyle = "rgba(0,0,0,.55)"; cx.fillRect(0,0,cv.width,cv.height);
        cx.fillStyle = "#fff"; cx.font = "600 20px sans-serif"; cx.textAlign = "center";
        cx.fillText("已暂停 — 空格继续", cv.width/2, cv.height/2);
      }
    }
    win.listen(document, "keydown", e => {
      if (OS.focused !== win) return;
      const k = e.key.toLowerCase();
      const map = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] };
      if (map[k]) {
        e.preventDefault();
        const [x,y] = map[k];
        if (x !== -dir.x || y !== -dir.y) nextDir = {x,y};
      }
      if (k === " " && !dead) { e.preventDefault(); paused = !paused; draw(); }
    });
    win.onClose(() => clearInterval(timer));
    reset(); draw();
    overlay.style.display = "flex";
  }
});

/* ---------------- 2048 ---------------- */
OS.registerApp({
  id:"g2048", name:"2048", icon:"🔢", desc:"滑动合并数字，冲向 2048",
  w:470, h:620, desktop:true,

  mount(body, win) {
    const scoreEl = el("b", { text:"0" }), bestEl = el("b", { text: localStorage.getItem("aurora.2048.best") || "0" });
    const board = el("div", { class:"g2048-board" });
    for (let i = 0; i < 16; i++) board.append(el("div", { class:"t2-cell" }));
    const stage = el("div", { class:"g-stage" }, board);
    body.append(el("div", { class:"game-shell" },
      el("div", { class:"g-hud" },
        el("div", { class:"g-stat" }, scoreEl, el("span", { text:"得分" })),
        el("div", { class:"g-stat" }, bestEl, el("span", { text:"最高分" })),
        el("button", { class:"btn", text:"↻ 新游戏", onclick: () => start() })),
      stage,
      el("div", { class:"muted", style:{ padding:"0 0 14px", fontSize:"11px" }, text:"方向键 / WASD / 滑动屏幕" })));

    let cells = [], grid, score, over, won;

    function start() {
      grid = Array(16).fill(0); score = 0; over = false; won = false;
      scoreEl.textContent = "0";
      addTile(); addTile(); render();
    }
    function addTile() {
      const empty = grid.map((v,i) => v ? -1 : i).filter(i => i >= 0);
      if (!empty.length) return;
      const i = empty[randi(0, empty.length-1)];
      grid[i] = Math.random() < 0.9 ? 2 : 4;
      cells.push({ i, v: grid[i], new:true });
    }
    function render() {
      $$(".t2-cell", board).forEach((c, i) => {
        const v = grid[i];
        c.innerHTML = "";
        if (!v) return;
        const cls = v <= 2048 ? "t2-v" + v : "t2-vbig";
        const isNew = cells.some(t => t.i === i && t.new);
        const merged = cells.some(t => t.i === i && t.merged && t.v === v);
        c.append(el("div", { class: "t2-tile " + cls + (isNew ? "" : "") + (merged ? " merged" : ""), text: v }));
      });
      cells = [];
    }
    function move(dir) {
      if (over) return;
      const before = grid.join(",");
      const lineIdx = [[],[],[],[]];
      for (let i = 0; i < 16; i++) {
        const r = Math.floor(i/4), c = i%4;
        if (dir === "left") lineIdx[r].push(i);
        if (dir === "right") lineIdx[r].unshift(i);
        if (dir === "up") lineIdx[c].push(i);
        if (dir === "down") lineIdx[c].unshift(i);
      }
      let gained = 0, mergedAny = false;
      for (const line of lineIdx) {
        const vals = line.map(i => grid[i]).filter(Boolean);
        const out = [];
        for (let i = 0; i < vals.length; i++) {
          if (vals[i] === vals[i+1]) {
            out.push(vals[i]*2);
            gained += vals[i]*2;
            mergedAny = true;
            const pos = line[out.length-1];
            cells.push({ i: pos, v: vals[i]*2, merged:true });
            i++;
          } else out.push(vals[i]);
        }
        line.forEach((idx, k) => grid[idx] = out[k] || 0);
      }
      if (grid.join(",") === before) return;
      score += gained;
      scoreEl.textContent = score;
      const best = Math.max(score, parseInt(localStorage.getItem("aurora.2048.best")||"0"));
      localStorage.setItem("aurora.2048.best", best);
      bestEl.textContent = best;
      addTile();
      render();
      if (grid.includes(2048) && !won) {
        won = true;
        UI.notify("2048", "🏆 你合成了 2048！可以继续挑战更高分", "🎉");
      }
      // game over check
      let canMove = false;
      for (let i = 0; i < 16 && !canMove; i++) {
        if (!grid[i]) canMove = true;
        else {
          const r = Math.floor(i/4), c = i%4;
          if (c < 3 && grid[i] === grid[i+1]) canMove = true;
          if (r < 3 && grid[i] === grid[i+4]) canMove = true;
        }
      }
      if (!canMove) {
        over = true;
        setTimeout(() => UI.alert("游戏结束", `本局得分 ${score}。最高分 ${best}。点「新游戏」再来一局。`, "🔢"), 250);
      }
    }
    const keymap = { arrowleft:"left", a:"left", arrowright:"right", d:"right", arrowup:"up", w:"up", arrowdown:"down", s:"down" };
    win.listen(document, "keydown", e => {
      if (OS.focused !== win) return;
      const d = keymap[e.key.toLowerCase()];
      if (d) { e.preventDefault(); move(d); }
    });
    let touchStart = null;
    win.listen(board, "pointerdown", e => touchStart = { x:e.clientX, y:e.clientY });
    win.listen(board, "pointerup", e => {
      if (!touchStart) return;
      const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });
    start();
  }
});

OS.registerApp({
  id:"mines", name:"扫雷", icon:"💣", desc:"左键翻开 · 右键插旗 · 首点必安全",
  w:560, h:560, desktop:true,

  mount(body, win) {
    const state = { W:9, H:9, M:10 };
    const ledMines = el("div", { class:"ms-led", text:"010" });
    const ledTime = el("div", { class:"ms-led", text:"000" });
    const face = el("button", { class:"ms-face", text:"🙂", onclick: () => start() });
    const sel = el("select", { onchange: () => start(),
      html: `<option value="9,9,10">初级 9×9</option><option value="16,16,40">中级 16×16</option><option value="16,30,80">高级 16×30</option>` });
    const board = el("div", { class:"ms-board" });
    const stage = el("div", { class:"g-stage", style:{ overflow:"auto" } }, board);
    body.append(el("div", { class:"game-shell" },
      el("div", { class:"g-hud" },
        el("div", { class:"ms-top" },
          ledMines, face, ledTime,
          sel)),
      stage));

    let cells, started, deadFlag, flags, revealedCount, timer, time;

    function start() {
      const [W,H,M] = sel.value.split(",").map(Number);
      Object.assign(state, { W,H,M });
      document.documentElement.style.setProperty("--cs", (W > 12 ? 26 : 30) + "px");
      cells = Array.from({length: W*H}, () => ({ mine:false, adj:0, st:0 })); // st 0 hidden 1 revealed 2 flag
      started = false; deadFlag = false; flags = 0; revealedCount = 0; time = 0;
      clearInterval(timer); timer = null;
      ledMines.textContent = String(M).padStart(3,"0");
      ledTime.textContent = "000";
      face.textContent = "🙂";
      board.style.gridTemplateColumns = `repeat(${W}, var(--cs))`;
      buildDom();
    }
    function buildDom() {
      board.innerHTML = "";
      for (let i = 0; i < cells.length; i++) {
        const d = el("div", { class:"ms-cell" });
        d.addEventListener("click", () => reveal(i));
        d.addEventListener("contextmenu", e => { e.preventDefault(); flag(i); });
        cells[i].el = d;
        board.append(d);
      }
    }
    function neighbors(i) {
      const r = Math.floor(i/state.W), c = i%state.W, out = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r+dr, nc = c+dc;
        if (nr>=0 && nr<state.H && nc>=0 && nc<state.W) out.push(nr*state.W+nc);
      }
      return out;
    }
    function plant(safe) {
      const banned = new Set([safe, ...neighbors(safe)]);
      let placed = 0;
      while (placed < state.M) {
        const i = randi(0, cells.length-1);
        if (cells[i].mine || banned.has(i)) continue;
        cells[i].mine = true; placed++;
      }
      cells.forEach((c,i) => c.adj = neighbors(i).filter(n => cells[n].mine).length);
      timer = setInterval(() => {
        time = Math.min(999, time+1);
        ledTime.textContent = String(time).padStart(3,"0");
      }, 1000);
      win._cleanup.push(() => clearInterval(timer));
    }
    function reveal(i) {
      if (deadFlag || cells[i].st === 2 || cells[i].st === 1) return;
      if (!started) { started = true; plant(i); }
      if (cells[i].mine) return boom(i);
      const stack = [i];
      while (stack.length) {
        const n = stack.pop();
        const c = cells[n];
        if (c.st === 1 || c.mine) continue;
        c.st = 1; revealedCount++;
        c.el.classList.add("revealed");
        if (c.adj) { c.el.textContent = c.adj; c.el.classList.add("ms-n" + c.adj); }
        else neighbors(n).forEach(m => { if (cells[m].st === 0) stack.push(m); });
      }
      checkWin();
    }
    function flag(i) {
      if (deadFlag || cells[i].st === 1) return;
      cells[i].st = cells[i].st === 2 ? 0 : 2;
      flags += cells[i].st === 2 ? 1 : -1;
      cells[i].el.classList.toggle("flag");
      cells[i].el.textContent = cells[i].st === 2 ? "🚩" : "";
      ledMines.textContent = String(Math.max(0, state.M - flags)).padStart(3,"0");
    }
    function boom(i) {
      deadFlag = true;
      clearInterval(timer);
      face.textContent = "😵";
      cells.forEach((c,n) => {
        if (c.mine) { c.el.classList.add("revealed"); c.el.textContent = "💣"; }
      });
      cells[i].el.classList.add("boom");
      cells[i].el.textContent = "💥";
      UI.notify("扫雷", "💥 踩雷了！点笑脸重新开始", "💣");
    }
    function checkWin() {
      if (revealedCount === cells.length - state.M) {
        deadFlag = true;
        clearInterval(timer);
        face.textContent = "😎";
        cells.forEach(c => { if (c.mine && c.st !== 2) { c.el.classList.add("flag"); c.el.textContent = "🚩"; }});
        ledMines.textContent = "000";
        UI.notify("扫雷", `🏆 胜利！用时 ${time} 秒`, "😎");
      }
    }
    win.onClose(() => clearInterval(timer));
    start();
  }
});

OS.registerApp({
  id:"breakout", name:"打砖块", icon:"🧱", desc:"鼠标控制挡板 · 点击发球",
  w:560, h:620, desktop:true,

  mount(body, win) {
    const W = 480, H = 520;
    const scoreEl = el("b", { text:"0" }), livesEl = el("b", { text:"3" }), levelEl = el("b", { text:"1" });
    const cv = el("canvas", { class:"brk-cv", width:W, height:H });
    const stage = el("div", { class:"g-stage" }, el("div", { class:"g-canvas-frame" }, cv));
    body.append(el("div", { class:"game-shell" },
      el("div", { class:"g-hud" },
        el("div", { class:"g-stat" }, scoreEl, el("span", { text:"得分" })),
        el("div", { class:"g-stat" }, livesEl, el("span", { text:"生命" })),
        el("div", { class:"g-stat" }, levelEl, el("span", { text:"关卡" }))),
      stage));

    const cx = cv.getContext("2d");
    let paddle, ball, bricks, score, lives, level, running, raf, launched;

    const overlay = gameOverlay(stage, "🧱 打砖块", "移动鼠标控制挡板，清空所有砖块", "开始游戏", () => startGame());
    const COLORS = ["#ff5c8a","#ff8a5c","#fbbf24","#4ade80","#39d3e8","#8f7dff"];

    function buildBricks() {
      bricks = [];
      const rows = 5, cols = 9, bw = (W-40)/cols, bh = 18;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        bricks.push({ x: 20 + c*bw, y: 56 + r*(bh+7), w: bw-7, h: bh, color: COLORS[r%COLORS.length], alive: true });
      }
    }
    function resetBall() {
      ball = { x: paddle.x + paddle.w/2, y: paddle.y - 10, r: 6, vx: 0, vy: 0 };
      launched = false;
    }
    function startGame() {
      score = 0; lives = 3; level = 1;
      scoreEl.textContent = "0"; livesEl.textContent = "3"; levelEl.textContent = "1";
      paddle = { x: W/2-45, y: H-26, w: 90, h: 11 };
      buildBricks();
      resetBall();
      overlay.style.display = "none";
      running = true;
    }
    function launch() {
      if (launched || !running) return;
      launched = true;
      const sp = 4 + level*.5;
      ball.vx = rand(-1.6,1.6) || 1; ball.vy = -sp;
    }
    function step() {
      raf = requestAnimationFrame(step);
      if (!running) return;
      if (launched) {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < ball.r || ball.x > W-ball.r) { ball.vx *= -1; ball.x = clamp(ball.x, ball.r, W-ball.r); }
        if (ball.y < ball.r) { ball.vy *= -1; ball.y = ball.r; }
        // paddle
        if (ball.vy > 0 && ball.y > paddle.y - ball.r && ball.y < paddle.y + paddle.h && ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r) {
          const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
          const sp = Math.hypot(ball.vx, ball.vy);
          const ang = hit * 1.05;
          ball.vx = sp * Math.sin(ang);
          ball.vy = -Math.abs(sp * Math.cos(ang));
        }
        // bricks
        for (const b of bricks) {
          if (!b.alive) continue;
          if (ball.x > b.x-ball.r && ball.x < b.x+b.w+ball.r && ball.y > b.y-ball.r && ball.y < b.y+b.h+ball.r) {
            b.alive = false;
            score += 10;
            scoreEl.textContent = score;
            const fromLeft = Math.abs(ball.x - b.x), fromRight = Math.abs(ball.x - (b.x+b.w));
            const fromTop = Math.abs(ball.y - b.y), fromBot = Math.abs(ball.y - (b.y+b.h));
            const minH = Math.min(fromLeft, fromRight), minV = Math.min(fromTop, fromBot);
            if (minV < minH) ball.vy *= -1; else ball.vx *= -1;
            break;
          }
        }
        // death
        if (ball.y > H + 20) {
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0) {
            running = false;
            overlay.show("💀 游戏结束", `得分 ${score} · 关卡 ${level}`, "再来一局");
          } else resetBall();
        }
        // win
        if (!bricks.some(b => b.alive)) {
          level++;
          levelEl.textContent = level;
          score += 100;
          scoreEl.textContent = score;
          buildBricks();
          resetBall();
          UI.notify("打砖块", `关卡 ${level}！球速提升`, "🧱");
        }
      } else if (ball) {
        ball.x = paddle.x + paddle.w/2;
        ball.y = paddle.y - ball.r - 2;
      }
      draw();
    }
    function draw() {
      cx.fillStyle = "#0b1024"; cx.fillRect(0,0,W,H);
      // starfield-ish
      cx.fillStyle = "rgba(255,255,255,.05)";
      for (let i = 0; i < 30; i++) {
        const x = (i*137) % W, y = (i*89) % H;
        cx.fillRect(x, y, 1.5, 1.5);
      }
      for (const b of bricks) {
        if (!b.alive) continue;
        cx.fillStyle = b.color;
        cx.shadowColor = b.color; cx.shadowBlur = 7;
        cx.beginPath(); cx.roundRect(b.x, b.y, b.w, b.h, 4); cx.fill();
        cx.shadowBlur = 0;
      }
      cx.fillStyle = "#e8ecf8";
      cx.beginPath(); cx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); cx.fill();
      cx.save();
      cx.shadowColor = "#7c6cff"; cx.shadowBlur = 14;
      cx.fillStyle = "#fff";
      cx.beginPath(); cx.arc(ball.x, ball.y, ball.r, 0, 6.29); cx.fill();
      cx.restore();
      if (!launched && running) {
        cx.fillStyle = "rgba(255,255,255,.7)"; cx.font = "13px sans-serif"; cx.textAlign = "center";
        cx.fillText("点击 / 空格 发射", W/2, H - 60);
      }
    }
    win.listen(cv, "pointermove", e => {
      const r = cv.getBoundingClientRect();
      const x = (e.clientX - r.left) * (W/r.width);
      if (paddle) paddle.x = clamp(x - paddle.w/2, 0, W - paddle.w);
    });
    win.listen(cv, "pointerdown", launch);
    win.listen(document, "keydown", e => {
      if (OS.focused !== win) return;
      if (e.key === " ") { e.preventDefault(); launch(); }
    });
    win.onClose(() => cancelAnimationFrame(raf));
    paddle = { x: W/2-45, y: H-26, w: 90, h: 11 };
    buildBricks(); resetBall(); draw();
    overlay.style.display = "flex";
    step();
  }
});

OS.registerApp({
  id:"calc", name:"计算器", icon:"🧮", desc:"标准计算器，支持历史记录",
  w:340, h:560, desktop:true,

  mount(body, win) {
    let cur = "0", expr = "", hist = [];
    const exprEl = el("div", { class:"calc-expr" });
    const valEl = el("div", { class:"calc-val", text:"0" });
    const histEl = el("div", { class:"calc-hist" });

    const buttons = [
      ["C","fn"],["(","fn"],[")","fn"],["÷","op"],
      ["7"],["8"],["9"],["×","op"],
      ["4"],["5"],["6"],["−","op"],
      ["1"],["2"],["3"],["+","op"],
      ["0"],["."],["⌫","fn"],["=","eq"],
    ];
    const grid = el("div", { class:"calc-grid" });
    for (const [label, cls] of buttons) {
      grid.append(el("button", {
        class: cls ? "c-" + cls : "",
        text: label,
        onclick: () => press(label),
      }));
    }
    body.append(el("div", { class:"calc" },
      el("div", { class:"calc-screen" }, exprEl, valEl),
      histEl, grid));

    const evalExpr = s => {
      const clean = s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
      if (!/^[\d+\-*/().%\s]+$/.test(clean) || !clean.trim()) return NaN;
      try { return Function(`"use strict";return (${clean})`)(); } catch(e) { return NaN; }
    };
    function render() {
      valEl.textContent = cur;
      exprEl.textContent = expr;
      if (valEl.textContent.length > 12) valEl.style.fontSize = "24px"; else valEl.style.fontSize = "";
    }
    function pushHist(e2, v) {
      hist.unshift([e2, v]);
      if (hist.length > 12) hist.pop();
      histEl.innerHTML = "";
      for (const [ex, vv] of hist) {
        histEl.append(el("div", {},
          el("span", { text: ex }),
          el("span", { text: "= " + vv }),
        ));
      }
    }
    function press(k) {
      if (k === "C") { cur = "0"; expr = ""; render(); return; }
      if (k === "⌫") { cur = cur.length > 1 ? cur.slice(0,-1) : "0"; render(); return; }
      if (k === "=") {
        const full = expr + cur;
        const v = evalExpr(full);
        if (isNaN(v) || !isFinite(v)) { cur = "错误"; expr = ""; render(); return; }
        const vs = String(Math.round(v*1e10)/1e10);
        pushHist(full, vs);
        cur = vs; expr = "";
        render(); return;
      }
      if ("÷×−+".includes(k)) {
        expr += cur + (k === "−" ? "-" : k);
        cur = "0"; render(); return;
      }
      if (k === "(" || k === ")") { expr += k; render(); return; }
      if (k === ".") {
        if (!cur.includes(".")) cur += ".";
        render(); return;
      }
      if (cur === "0" || cur === "错误") cur = k; else cur += k;
      render();
    }
    win.listen(document, "keydown", e => {
      if (OS.focused !== win) return;
      const k = e.key;
      if (/^[0-9.]$/.test(k)) press(k);
      else if (k === "+") press("+");
      else if (k === "-") press("−");
      else if (k === "*") press("×");
      else if (k === "/") { e.preventDefault(); press("÷"); }
      else if (k === "Enter" || k === "=") press("=");
      else if (k === "Backspace") press("⌫");
      else if (k === "Escape") press("C");
      else if (k === "(" || k === ")") press(k);
    });
    render();
  }
});
</script>
<script>
"use strict";
/* ================================================================
   APPS 3 — music / paint / shader / taskmgr / settings / welcome
   ================================================================ */

/* ---------------- 音乐工作室 ---------------- */
OS.registerApp({
  id:"music", name:"音乐工作室", icon:"🎹", desc:"合成器键盘 + 四轨鼓机音序器",
  w:820, h:640, desktop:true,

  mount(body, win) {
    let ctx = null, master = null, analyser = null, noiseBuf = null;
    let wave = "sine", attack = 0.01, release = 0.35, volume = 0.6;
    const active = new Map();

    const ensureAudio = () => {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = volume;
      analyser = ctx.createAnalyser(); analyser.fftSize = 256;
      master.connect(analyser); analyser.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    };
    const midiHz = m => 440 * Math.pow(2, (m-69)/12);

    function noteOn(midi) {
      ensureAudio();
      if (ctx.state === "suspended") ctx.resume();
      if (active.has(midi)) return;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = wave; osc.frequency.value = midiHz(midi);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.42, ctx.currentTime + Math.max(0.003, attack));
      osc.connect(g); g.connect(master);
      osc.start();
      active.set(midi, { osc, g });
      keyEls[midi]?.classList.add("on");
    }
    function noteOff(midi) {
      const v = active.get(midi);
      if (!v) return;
      active.delete(midi);
      const t = ctx.currentTime;
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t);
      v.g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.03, release));
      v.osc.stop(t + release + 0.1);
      keyEls[midi]?.classList.remove("on");
    }
    function drum(type, t) {
      ensureAudio();
      const g = ctx.createGain(); g.connect(master);
      if (type === 0) { // kick
        const o = ctx.createOscillator();
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(42, t+0.22);
        g.gain.setValueAtTime(0.9, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
        o.connect(g); o.start(t); o.stop(t+0.32);
      } else if (type === 1) { // snare
        const n = ctx.createBufferSource(); n.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.9;
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.18);
        n.connect(f); f.connect(g); n.start(t); n.stop(t+0.2);
        const o = ctx.createOscillator(); o.frequency.value = 190;
        const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.001, t+0.1);
        o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.12);
      } else if (type === 2) { // hat
        const n = ctx.createBufferSource(); n.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7500;
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
        n.connect(f); f.connect(g); n.start(t); n.stop(t+0.06);
      } else { // clap
        const n = ctx.createBufferSource(); n.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1200; f.Q.value = 1.5;
        for (let i = 0; i < 3; i++) {
          const tt = t + i*0.012;
          g.gain.setValueAtTime(0.4, tt);
          g.gain.exponentialRampToValueAtTime(0.08, tt+0.01);
        }
        g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
        n.connect(f); f.connect(g); n.start(t); n.stop(t+0.22);
      }
    }

    /* --- UI --- */
    const vizCv = el("canvas", { class:"mus-viz", height:64 });
    const waveSel = el("select", { html:"<option value=sine>正弦波 Sine</option><option value=square>方波 Square</option><option value=sawtooth>锯齿波 Saw</option><option value=triangle>三角波 Triangle</option>",
      onchange: e => wave = e.target.value });
    const atkSlider = el("input", { type:"range", min:"0.003", max:"0.5", step:"0.005", value:"0.01", oninput: e => attack = +e.target.value });
    const relSlider = el("input", { type:"range", min:"0.05", max:"2", step:"0.05", value:"0.35", oninput: e => release = +e.target.value });
    const volSlider = el("input", { type:"range", min:"0", max:"1", step:"0.05", value:"0.6", oninput: e => { volume = +e.target.value; if (master) master.gain.value = volume; } });

    /* keyboard: C4..F5 */
    const KEYMAP = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, ";":16, "'":17 };
    const KB_LABEL = { 0:"A",1:"W",2:"S",3:"E",4:"D",5:"F",6:"T",7:"G",8:"Y",9:"H",10:"U",11:"J",12:"K",13:"O",14:"L",15:"P",16:";",17:"'" };
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const keysBox = el("div", { class:"mus-keys" });
    const keyEls = {};
    let whiteCount = 0; const totalWhite = [];
    for (let off = 0; off <= 17; off++) if (![1,3,6,8,10].includes(off % 12)) totalWhite.push(off);
    const nWhite = totalWhite.length;
    let wIdx = 0;
    for (let off = 0; off <= 17; off++) {
      const midi = 60 + off;
      const black = [1,3,6,8,10].includes(off % 12);
      if (!black) {
        const k = el("div", { class:"mkey", dataset:{ midi } },
          el("span", { class:"mk-label", text: KB_LABEL[off] || NOTE_NAMES[off%12] + "4" }));
        k.addEventListener("pointerdown", e => { e.preventDefault(); noteOn(midi); });
        k.addEventListener("pointerup", () => noteOff(midi));
        k.addEventListener("pointerleave", () => noteOff(midi));
        keysBox.append(k);
        keyEls[midi] = k;
        wIdx++;
      } else {
        const k = el("div", { class:"mkey black", style:{ left: (wIdx * 100 / nWhite) + "%" }, dataset:{ midi } },
          el("span", { class:"mk-label", text: KB_LABEL[off] || "" }));
        k.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); noteOn(midi); });
        k.addEventListener("pointerup", () => noteOff(midi));
        k.addEventListener("pointerleave", () => noteOff(midi));
        keysBox.append(k);
        keyEls[midi] = k;
      }
    }

    /* sequencer */
    const TRACKS = ["🥁 底鼓","🪘 军鼓","🎩 踩镲","👏 拍手"];
    const pattern = TRACKS.map(() => Array(16).fill(0));
    // default groove
    [0,4,8,10].forEach(i => pattern[0][i] = 1);
    [4,12].forEach(i => pattern[1][i] = 1);
    [2,6,10,14].forEach(i => pattern[2][i] = 1);
    [7,15].forEach(i => pattern[3][i] = 1);
    let bpm = 112, playing = false, seqStep = 0, nextTime = 0, schedTimer = null;
    const stepEls = [];
    const seqBox = el("div", { class:"mus-seq" });
    TRACKS.forEach((label, ti) => {
      const row = el("div", { class:"seq-track" }, el("div", { class:"seq-track-label", text: label.split(" ")[1] || label }));
      const steps = el("div", { class:"seq-steps" });
      const rowEls = [];
      for (let s = 0; s < 16; s++) {
        const st = el("div", { class:"seq-step" + ((s%4 === 0) ? " beat" : "") + (pattern[ti][s] ? " on" : ""),
          onclick: () => { pattern[ti][s] ^= 1; st.classList.toggle("on"); ensureAudio(); if (ctx.state === "suspended") ctx.resume(); } });
        rowEls.push(st); steps.append(st);
      }
      stepEls.push(rowEls);
      row.append(steps); seqBox.append(row);
    });
    const bpmLabel = el("span", { class:"chip", text: bpm + " BPM" });
    const bpmSlider = el("input", { type:"range", min:"60", max:"180", value:bpm, style:{ width:"130px" },
      oninput: e => { bpm = +e.target.value; bpmLabel.textContent = bpm + " BPM"; } });
    const playBtn = el("button", { class:"btn btn-primary mus-btn-play", text:"▶", onclick: () => {
      ensureAudio();
      if (ctx.state === "suspended") ctx.resume();
      playing = !playing;
      playBtn.textContent = playing ? "⏸" : "▶";
      if (playing) { seqStep = 0; nextTime = ctx.currentTime + 0.06; schedTimer = setInterval(scheduler, 30); win._cleanup.push(() => clearInterval(schedTimer)); }
      else clearInterval(schedTimer);
      updatePlayhead(-1);
    }});
    const clearBtn = el("button", { class:"btn btn-ghost", text:"清空音序", onclick: () => {
      pattern.forEach(r => r.fill(0));
      stepEls.forEach(row => row.forEach(st => st.classList.remove("on")));
    }});
    function scheduler() {
      const spb = 60/bpm/4;
      while (nextTime < ctx.currentTime + 0.12) {
        const s = seqStep;
        for (let ti = 0; ti < 4; ti++) if (pattern[ti][s]) drum(ti, nextTime);
        const delay = Math.max(0, (nextTime - ctx.currentTime) * 1000);
        const ss = s;
        setTimeout(() => updatePlayhead(ss), delay);
        seqStep = (seqStep + 1) % 16;
        nextTime += spb;
      }
    }
    function updatePlayhead(s) {
      if (!playing && s !== -1) return;
      stepEls.forEach(row => row.forEach((st, i) => st.classList.toggle("playhead", i === s)));
    }

    /* visualizer */
    const vc = vizCv.getContext("2d");
    let vRaf;
    const drawViz = () => {
      vRaf = requestAnimationFrame(drawViz);
      if (document.hidden) return;
      const w = vizCv.width = vizCv.clientWidth;
      const h = vizCv.height;
      vc.clearRect(0,0,w,h);
      vc.fillStyle = "#0a0e1a"; vc.fillRect(0,0,w,h);
      if (!analyser) {
        vc.fillStyle = "rgba(140,150,190,.4)";
        vc.font = "11px sans-serif"; vc.textAlign = "center";
        vc.fillText("按一个琴键唤醒音频引擎…", w/2, h/2+4);
        return;
      }
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      const bars = 48;
      for (let i = 0; i < bars; i++) {
        const v = data[Math.floor(i*data.length/bars)] / 255;
        const bh = v * (h-8);
        const grad = vc.createLinearGradient(0, h-bh, 0, h);
        grad.addColorStop(0, "#22d3ee"); grad.addColorStop(1, "#7c6cff");
        vc.fillStyle = grad;
        vc.fillRect(i*(w/bars)+2, h-bh-4, w/bars-4, bh);
      }
    };
    drawViz();
    win.onClose(() => { cancelAnimationFrame(vRaf); clearInterval(schedTimer); if (ctx) ctx.close(); });

    /* computer keyboard */
    win.listen(document, "keydown", e => {
      if (OS.focused !== win || e.repeat || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      const off = KEYMAP[e.key.toLowerCase()];
      if (off != null) { e.preventDefault(); noteOn(60 + off); }
    });
    win.listen(document, "keyup", e => {
      const off = KEYMAP[e.key.toLowerCase()];
      if (off != null) noteOff(60 + off);
    });

    body.append(el("div", { class:"mus" },
      el("div", { class:"mus-sec" },
        el("div", { class:"mus-sec-title" }, el("span", { text:"频谱可视化" })),
        vizCv),
      el("div", { class:"mus-sec" },
        el("div", { class:"mus-sec-title" }, el("span", { text:"合成器" }),
          el("span", { class:"muted", style:{ fontSize:"11px" }, text:"用键盘 A–' 演奏（黑键 W E T Y U O P…）" })),
        keysBox,
        el("div", { class:"mus-controls" },
          el("label", {}, "波形", waveSel),
          el("label", {}, "起音", atkSlider),
          el("label", {}, "释音", relSlider),
          el("label", {}, "音量", volSlider))),
      el("div", { class:"mus-sec", style:{ borderBottom:"none" } },
        el("div", { class:"mus-sec-title" }, el("span", { text:"步进音序器 · 4 轨 × 16 步" }),
          el("span", { style:{ display:"flex", gap:"8px", alignItems:"center" } }, playBtn, clearBtn)),
        seqBox,
        el("div", { class:"mus-controls" },
          el("label", {}, "速度", bpmSlider, bpmLabel)))
    ));
  }
});

/* ---------------- 画板 ---------------- */
OS.registerApp({
  id:"paint", name:"画板", icon:"🎨", desc:"画笔 / 形状 / 油漆桶 / 撤销，可保存到图片文件夹",
  w:900, h:640, desktop:true,

  mount(body, win) {
    const W = 900, H = 540;
    let tool = "brush", color = "#7c6cff", size = 6, drawing = false, sx0, sy0;
    let snapshot = null;
    const undoStack = [];
    const PALETTE = ["#0f1222","#ffffff","#ff5c8a","#ff8a5c","#fbbf24","#4ade80","#39d3e8","#7c6cff","#c084fc","#8b6b57"];
    const main = el("canvas", { width:W, height:H });
    const prev = el("canvas", { width:W, height:H });
    const wrap = el("div", { class:"pt-canvas-wrap" }, main, prev);
    body.append(el("div", { class:"paint" }, toolbar(), el("div", { class:"pt-stage" }, wrap)));

    const cx = main.getContext("2d", { willReadFrequently: true });
    const px = prev.getContext("2d");
    cx.fillStyle = "#ffffff"; cx.fillRect(0,0,W,H);

    function toolbar() {
      const tools = [["brush","🖌️","画笔"],["eraser","🧽","橡皮"],["line","📏","直线"],["rect","▭","矩形"],["ellipse","◯","椭圆"],["fill","🪣","油漆桶"]];
      const toolBtns = [];
      for (const [id, ico, title] of tools) {
        const btn = el("button", { class:"pt-tool" + (id === tool ? " active" : ""), text: ico, title,
          onclick: () => { tool = id; $$(".pt-tool", bar).forEach(x => x.classList.remove("active")); btn.classList.add("active"); } });
        toolBtns.push(btn);
      }
      const pal = el("div", { class:"pt-pal" }, PALETTE.map(c => el("div", { class:"pt-sw" + (c === color ? " active" : ""), style:{ background:c },
        onclick: e => { color = c; $$(".pt-sw", bar).forEach(s => s.classList.remove("active")); e.target.classList.add("active"); } })));
      const colorInput = el("input", { type:"color", value: color, oninput: e => { color = e.target.value; $$(".pt-sw", bar).forEach(s => s.classList.remove("active")); } });
      const sizeLabel = el("span", { class:"muted", style:{ fontSize:"11px" }, text: size + "px" });
      const sizeSlider = el("input", { type:"range", min:"1", max:"60", value: size, style:{ width:"90px" },
        oninput: e => { size = +e.target.value; sizeLabel.textContent = size + "px"; } });

      const bar = el("div", { class:"pt-bar" },
        ...toolBtns,
        el("span", { class:"pt-sep" }),
        pal, colorInput,
        el("span", { class:"pt-sep" }),
        sizeSlider, sizeLabel,
        el("span", { class:"pt-sep" }),
        el("button", { class:"pt-tool", text:"↩️", title:"撤销 (Ctrl+Z)", onclick: undo }),
        el("button", { class:"pt-tool", text:"🗑️", title:"清空画布", onclick: () => UI.confirm("清空画布","确定要清空整块画布吗？","🗑️").then(ok => {
          if (!ok) return; pushUndo(); cx.fillStyle = "#fff"; cx.fillRect(0,0,W,H);
        })}),
        el("button", { class:"pt-tool", text:"💾", title:"保存到 图片 文件夹", onclick: saveToFS }));
      bar.dataset.ready = "1";
      return bar;
    }
    const bar = $(".pt-bar", body);

    function pushUndo() {
      undoStack.push(main.toDataURL());
      if (undoStack.length > 25) undoStack.shift();
    }
    function undo() {
      const d = undoStack.pop();
      if (!d) return;
      const img = new Image();
      img.onload = () => { cx.clearRect(0,0,W,H); cx.drawImage(img,0,0); };
      img.src = d;
    }
    function saveToFS() {
      const name = FS.uniqueName("/home/user/Pictures", `画作-${new Date().toTimeString().slice(0,8).replace(/:/g,"")}.png`);
      const err = FS.writeFile("/home/user/Pictures/" + name, main.toDataURL("image/png"));
      if (err) return UI.notify("画板", err, "⚠️");
      Bus.emit("fs.reset");
      UI.notify("画板", "已保存到 图片/" + name, "🎨");
    }
    function pos(e) {
      const r = main.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W/r.width, y: (e.clientY - r.top) * H/r.height };
    }
    function hex2rgb(h) { const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
    function flood(sx, sy) {
      const x0 = Math.round(sx), y0 = Math.round(sy);
      if (x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return;
      const img = cx.getImageData(0,0,W,H), d = img.data;
      const [fr,fg,fb] = hex2rgb(color);
      const si = (y0*W+x0)*4;
      const tr = d[si], tg = d[si+1], tb = d[si+2];
      if (Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb) < 10) return;
      const tol = 48;
      const match = i => Math.abs(d[i]-tr) + Math.abs(d[i+1]-tg) + Math.abs(d[i+2]-tb) <= tol*1.7;
      const stack = [[x0,y0]];
      while (stack.length) {
        const [x,y] = stack.pop();
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = (y*W+x)*4;
        if (!match(i)) continue;
        d[i] = fr; d[i+1] = fg; d[i+2] = fb; d[i+3] = 255;
        stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
      }
      cx.putImageData(img,0,0);
    }
    function strokeStyle() {
      cx.strokeStyle = color; cx.fillStyle = color;
      cx.lineWidth = size; cx.lineCap = "round"; cx.lineJoin = "round";
    }
    win.listen(main, "pointerdown", e => {
      const p = pos(e);
      if (tool === "fill") { pushUndo(); flood(p.x, p.y); return; }
      pushUndo();
      drawing = true; sx0 = p.x; sy0 = p.y;
      main.setPointerCapture(e.pointerId);
      if (tool === "brush" || tool === "eraser") {
        strokeStyle();
        if (tool === "eraser") { cx.strokeStyle = "#fff"; cx.fillStyle = "#fff"; }
        cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x+.01, p.y); cx.stroke();
      } else snapshot = cx.getImageData(0,0,W,H);
    });
    win.listen(main, "pointermove", e => {
      if (!drawing) return;
      const p = pos(e);
      if (tool === "brush" || tool === "eraser") { cx.lineTo(p.x, p.y); cx.stroke(); return; }
      px.clearRect(0,0,W,H);
      if (snapshot) cx.putImageData(snapshot, 0, 0);
      strokeStyle();
      if (tool === "line") { cx.beginPath(); cx.moveTo(sx0, sy0); cx.lineTo(p.x, p.y); cx.stroke(); }
      else if (tool === "rect") { px.strokeStyle = color; px.lineWidth = size; px.strokeRect(Math.min(sx0,p.x), Math.min(sy0,p.y), Math.abs(p.x-sx0), Math.abs(p.y-sy0)); }
      else if (tool === "ellipse") {
        px.strokeStyle = color; px.lineWidth = size;
        px.beginPath();
        px.ellipse((sx0+p.x)/2, (sy0+p.y)/2, Math.abs(p.x-sx0)/2, Math.abs(p.y-sy0)/2, 0, 0, 6.29);
        px.stroke();
      }
    });
    const finish = e => {
      if (!drawing) return;
      drawing = false;
      const p = pos(e);
      if (tool === "rect") { strokeStyle(); cx.strokeRect(Math.min(sx0,p.x), Math.min(sy0,p.y), Math.abs(p.x-sx0), Math.abs(p.y-sy0)); }
      else if (tool === "ellipse") {
        strokeStyle(); cx.beginPath();
        cx.ellipse((sx0+p.x)/2, (sy0+p.y)/2, Math.abs(p.x-sx0)/2, Math.abs(p.y-sy0)/2, 0, 0, 6.29);
        cx.stroke();
      }
      px.clearRect(0,0,W,H);
      snapshot = null;
    };
    win.listen(main, "pointerup", finish);
    win.listen(main, "pointercancel", () => { drawing = false; px.clearRect(0,0,W,H); });
    win.listen(document, "keydown", e => {
      if (OS.focused !== win) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveToFS(); }
    });
  }
});

  if(h>0.0){
    float tHit=-b-sqrt(h);
    vec3 pos=ro+rd*tHit; vec3 n=normalize(pos);
    float dif=max(dot(n,L),0.0);
    float spe=pow(max(dot(reflect(-L,n),-rd),0.0),42.0);
    col=vec3(0.10,0.13,0.32)*0.35+vec3(0.85,0.9,1.0)*dif*0.85+spe;
    col+=pow(1.0-max(dot(n,-rd),0.0),3.0)*vec3(0.25,0.5,1.0)*0.7;
  }
  gl_FragColor=vec4(col,1.0);
}`,
};

OS.registerApp({
  id:"shader", name:"星云", icon:"🌌", desc:"实时 WebGL 片元着色器引擎，四种可切换程序",
  w:760, h:540, desktop:true,

  mount(body, win) {
    const cv = el("canvas");
    const fpsEl = el("div", { class:"shd-fps", text:"-- fps" });
    const errBox = el("div", { class:"shd-err" });
    const presetSel = el("select", { onchange: e => load(e.target.value) });
    for (const name of Object.keys(SHADERS)) presetSel.append(el("option", { text:name }));
    const bar = el("div", { class:"shd-bar" }, presetSel,
      el("span", { class:"muted", style:{ fontSize:"11px", color:"#9fb" }, text:"移动鼠标可以和「星体」互动" }));
    body.append(el("div", { class:"shd" }, cv, bar, fpsEl, errBox));

    const gl = cv.getContext("webgl", { antialias:false, alpha:false });
    if (!gl) {
      errBox.style.display = "block";
      errBox.textContent = "你的浏览器不支持 WebGL。";
      return;
    }
    let program = null, uTime, uRes, uMouse, mouse = { x: 0.5, y: 0.5 }, raf, t0 = performance.now();
    const mouseCv = [0, 0];

    const VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    function load(name) {
      const FS_SRC = SHADERS[name];
      try {
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, FS_SRC));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        program = p;
        uTime = gl.getUniformLocation(p, "u_time");
        uRes  = gl.getUniformLocation(p, "u_res");
        uMouse = gl.getUniformLocation(p, "u_mouse");
        errBox.style.display = "none";
      } catch(err) {
        errBox.style.display = "block";
        errBox.textContent = "着色器编译失败:\n" + err.message;
      }
    }
    // fullscreen triangle
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    win.listen(cv, "pointermove", e => {
      const r = cv.getBoundingClientRect();
      mouse = { x: e.clientX - r.left, y: r.height - (e.clientY - r.top) };
    });

    let frames = 0, lastFps = performance.now();
    const loop = () => {
      raf = requestAnimationFrame(loop);
      if (document.hidden) return;
      const dpr = Math.min(devicePixelRatio, 1.5);
      const w = Math.floor(cv.clientWidth * dpr), h = Math.floor(cv.clientHeight * dpr);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      gl.viewport(0,0,w,h);
      if (program) {
        gl.useProgram(program);
        const loc = gl.getAttribLocation(program, "p");
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.uniform1f(uTime, (performance.now()-t0)/1000);
        gl.uniform2f(uRes, w, h);
        gl.uniform2f(uMouse, mouse.x*dpr, mouse.y*dpr);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      frames++;
      const now = performance.now();
      if (now - lastFps > 500) {
        fpsEl.textContent = Math.round(frames*1000/(now-lastFps)) + " fps · " + cv.width + "×" + cv.height;
        frames = 0; lastFps = now;
      }
    };
    win.onClose(() => { cancelAnimationFrame(raf); gl.getExtension("WEBGL_lose_context")?.loseContext(); });
    load(Object.keys(SHADERS)[0]);
    loop();
  }
});

  w:620, h:480, desktop:true,

  mount(body, win) {
    const sparkCv = el("canvas", { height:92 });
    const sparkVal = el("div", { class:"tm-viz-val", text:"0%" });
    const list = el("div", { class:"tm-list" });
    const statusLine = el("div", { class:"tm-status" });
    const mem = {}; const cpuHist = Array(80).fill(0);
    let total = 0;

    body.append(el("div", { class:"tm" },
      el("div", { class:"tm-viz" }, sparkCv, el("div", { class:"tm-viz-label", text:"TOTAL CPU" }), sparkVal),
      el("div", { class:"tm-head" },
        el("div", { class:"tm-name", text:"进程" }),
        el("div", { class:"tm-cpu", text:"CPU" }),
        el("div", { class:"tm-mem", text:"内存" }),
        el("div", { style:{ width:"70px" }, text:"" })),
      list, statusLine));

    const tick = () => {
      // simulate
      total = clamp(total + rand(-3,3.4), 4, 96);
      cpuHist.push(total); cpuHist.shift();
      sparkVal.textContent = total.toFixed(0) + "%";
      const sc = sparkCv.getContext("2d");
      const w = sparkCv.width = sparkCv.clientWidth;
      const h = sparkCv.height;
      sc.clearRect(0,0,w,h);
      const grad = sc.createLinearGradient(0,0,0,h);
      grad.addColorStop(0,"rgba(124,108,255,.5)"); grad.addColorStop(1,"rgba(124,108,255,0)");
      sc.beginPath(); sc.moveTo(0,h);
      cpuHist.forEach((v,i) => sc.lineTo(i/(cpuHist.length-1)*w, h - v/100*h));
      sc.lineTo(w,h); sc.closePath();
      sc.fillStyle = grad; sc.fill();
      sc.beginPath();
      cpuHist.forEach((v,i) => { const x = i/(cpuHist.length-1)*w, y = h - v/100*h; i ? sc.lineTo(x,y) : sc.moveTo(x,y); });
      sc.strokeStyle = "#8f7dff"; sc.lineWidth = 2; sc.stroke();

      // rows
      list.innerHTML = "";
      for (const w2 of OS.windows) {
        mem[w2.id] = (mem[w2.id] || 40 + (w2.app.w||600)/10) + rand(-1.5,1.8);
        mem[w2.id] = clamp(mem[w2.id], 24, 800);
        const cpu = Math.max(0, Math.min(99, (OS.focused === w2 ? 6 : 1.5) + rand(0,8) + (["shader","music","snake","breakout"].includes(w2.appId) ? 14 : 0)));
        const row = el("div", { class:"tm-row" },
          el("div", { class:"tm-name" }, el("span", { text: w2.app.icon }), el("span", { text: w2.titleEl.textContent })),
          el("div", { class:"tm-cpu" }, el("div", { class:"tm-meter" }, el("i", { style:{ width: cpu+"%" } })), el("span", { class:"muted", style:{ fontSize:"11px", width:"34px" }, text: cpu.toFixed(0)+"%" })),
          el("div", { class:"tm-mem", text: mem[w2.id].toFixed(0) + " MB" }),
          el("button", { class:"btn btn-danger", style:{ height:"26px", fontSize:"11.5px" }, text:"结束进程",
            onclick: () => OS.close(w2) }));
        list.append(row);
      }
      if (!OS.windows.length) list.append(el("div", { class:"muted", style:{ padding:"26px", textAlign:"center" }, text:"没有运行中的窗口" }));
      statusLine.innerHTML = "";

        el("span", { text:"窗口数 " + OS.windows.length }),
        el("span", { text:"运行时间 " + fmtUptime(Date.now()-OS.bootTime) }),

      return OS.launch("viewer", { path });
    const ext = (path.split(".").pop() || "").toLowerCase();
    if (["js","html","htm","css","md","txt","json","log"].includes(ext))
      return OS.launch("editor", { path });
    return OS.launch("editor", { path });
