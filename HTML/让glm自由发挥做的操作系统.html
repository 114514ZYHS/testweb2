<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuroraOS — Web Desktop Environment</title>
<meta name="description" content="A complete desktop operating system environment running in a single HTML file: window manager, virtual filesystem, terminal shell, code editor, games, synthesizer, paint studio and a WebGL shader engine.">
<style>
/* ============================================================
   AuroraOS 1.0 — single-file desktop environment
   Sections: 0.reset / 1.tokens+themes / 2.boot / 3.desktop
             4.taskbar+start / 5.windows / 6.ui-kit
             7.apps (terminal, files, editor, games, music,
             paint, calc, settings, taskmgr, welcome, viewer,
             shader) / 8.keyframes
   ============================================================ */

/* ---------- 0. reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;background-clip:content-box}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}

/* ---------- 1. tokens + themes ---------- */
:root{
  --tbh:48px;
  --bg:#070b14; --surface:#10162a; --surface2:#182038; --surface3:#1f2947;
  --border:#263156; --border2:#33406b;
  --text:#e9edfb; --muted:#93a0c4;
  --accent:#7c6cff; --accent2:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --shadow:0 10px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --shadow-soft:0 4px 18px rgba(0,0,0,.35);
  --glass:rgba(16,22,42,.72);
  --radius:10px;
  --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",Menlo,monospace;
}
body[data-theme="midnight"]{
  --bg:#04060d; --surface:#0d1320; --surface2:#141c2e; --surface3:#1b2540;
  --border:#22304d; --border2:#31446e;
  --text:#e6ecff; --muted:#7e8db0;
  --accent:#3b82f6; --accent2:#8b5cf6;
}
body[data-theme="sunset"]{
  --bg:#150a10; --surface:#231019; --surface2:#2e1521; --surface3:#3a1b2b;
  --border:#4a2334; --border2:#6b3249;
  --text:#ffeef2; --muted:#c793a5;
  --accent:#ff5c8a; --accent2:#ffb86b;
}
body[data-theme="forest"]{
  --bg:#071009; --surface:#0e1c12; --surface2:#142619; --surface3:#1b3222;
  --border:#24402c; --border2:#356040;
  --text:#e9fbee; --muted:#8fb79b;
  --accent:#34d399; --accent2:#a3e635;
}
body[data-theme="daylight"]{
  --bg:#e8edf9; --surface:#ffffff; --surface2:#f2f5fd; --surface3:#e9edfa;
  --border:#d7deef; --border2:#b9c4e2;
  --text:#18213a; --muted:#5c6a8c;
  --accent:#6d5cff; --accent2:#0ea5b7;
  --shadow:0 10px 34px rgba(40,60,120,.22),0 2px 8px rgba(40,60,120,.14);
  --shadow-soft:0 4px 16px rgba(40,60,120,.16);
  --glass:rgba(255,255,255,.78);
}

/* ---------- 2. boot ---------- */
#boot{
  position:fixed;inset:0;z-index:10000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .5s ease;
}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{
  font-size:44px;font-weight:200;letter-spacing:.42em;text-indent:.42em;
  background:linear-gradient(100deg,var(--accent),var(--accent2),var(--accent));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.6s linear infinite;
}
.boot-sub{color:var(--muted);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.boot-bar{width:280px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .18s ease;border-radius:2px}
.boot-msg{height:16px;font-size:11px;color:var(--muted);font-family:var(--mono)}
#shutdown{
  position:fixed;inset:0;z-index:10001;background:#000;color:#9aa;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
}
#shutdown.show{display:flex}
#shutdown .power-btn{
  width:74px;height:74px;border-radius:50%;border:2px solid #345;color:#8cf;font-size:30px;
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
#shutdown .power-btn:hover{border-color:#7cf;color:#bff;box-shadow:0 0 30px rgba(80,180,255,.35)}

/* ---------- 3. desktop ---------- */
#wallpaper{position:fixed;inset:0;z-index:0;width:100vw;height:100vh;display:block}
#desktop{position:fixed;inset:0 0 var(--tbh) 0;z-index:1;overflow:hidden}
#desk-icons{
  position:absolute;inset:14px auto 14px 10px;display:flex;flex-direction:column;flex-wrap:wrap;
  align-content:flex-start;gap:2px;max-height:calc(100% - 24px);
}
.desk-icon{
  width:92px;height:92px;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;cursor:default;border:1px solid transparent;transition:background .12s;
}
.desk-icon:hover{background:rgba(255,255,255,.07)}
.desk-icon.selected{background:color-mix(in srgb,var(--accent) 26%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.desk-icon .di-ico{font-size:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.desk-icon .di-label{
  font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);text-align:center;
  max-width:86px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
#snapGhost{
  position:absolute;z-index:8888;display:none;border-radius:12px;pointer-events:none;
  background:color-mix(in srgb,var(--accent) 20%,transparent);
  border:2px solid color-mix(in srgb,var(--accent) 60%,transparent);
  transition:all .12s ease;
}

/* ---------- 4. taskbar + start ---------- */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tbh);z-index:9000;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;
}
.tb-btn{
  height:36px;min-width:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0 10px;color:var(--text);transition:background .12s;flex:none;
}
.tb-btn:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}
#startBtn{font-weight:600;font-size:15px;padding:0 14px}
#startBtn .logo-dot{
  width:20px;height:20px;border-radius:6px;flex:none;
  background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent));
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent);
}
#taskItems{display:flex;align-items:center;gap:4px;flex:1;overflow:hidden}
.task-item{
  height:38px;max-width:190px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;
  position:relative;color:var(--text);transition:background .12s;flex:0 1 auto;min-width:0;
}
.task-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.task-item:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.task-item.active{background:color-mix(in srgb,var(--text) 12%,transparent)}
.task-item.active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
.task-item.min span{opacity:.55}
.task-item .ti-ico{font-size:16px;flex:none}
#tray{display:flex;align-items:center;gap:2px}
#clockBtn{flex-direction:column;gap:0;line-height:1.25;padding:0 12px;align-items:flex-end;min-width:76px}
#clockTime{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#clockDate{font-size:10.5px;color:var(--muted)}

#startMenu{
  position:fixed;left:8px;bottom:calc(var(--tbh) + 8px);width:600px;max-width:calc(100vw - 16px);
  max-height:calc(100vh - var(--tbh) - 24px);z-index:9500;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding:14px;gap:12px;
  opacity:0;transform:translateY(14px) scale(.98);pointer-events:none;transition:.18s ease;
}
#startMenu.open{opacity:1;transform:none;pointer-events:auto}
.sm-search{
  height:38px;border-radius:9px;border:1px solid var(--border);background:color-mix(in srgb,var(--text) 6%,transparent);
  padding:0 12px 0 34px;outline:none;width:100%;
}
.sm-search:focus{border-color:var(--accent)}
.sm-search-wrap{position:relative}
.sm-search-wrap::before{content:"🔍";position:absolute;left:10px;top:9px;font-size:14px;opacity:.7}
.sm-body{overflow-y:auto;flex:1;min-height:200px}
.sm-section{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:4px 2px 8px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sm-app{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border-radius:10px;
  transition:background .12s;text-align:center;
}
.sm-app:hover{background:color-mix(in srgb,var(--text) 9%,transparent)}
.sm-app .sa-ico{font-size:29px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
.sm-app .sa-name{font-size:12px}
.sm-empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
.sm-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:11px}
.sm-user{display:flex;align-items:center;gap:9px;font-size:13px}
.sm-avatar{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:13px;
}
.sm-power{display:flex;gap:4px}
.sm-power .tb-btn{font-size:15px}

#calendarPop{
  position:fixed;right:8px;bottom:calc(var(--tbh) + 8px);width:296px;z-index:9500;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;
  opacity:0;transform:translateY(14px);pointer-events:none;transition:.18s ease;
}
#calendarPop.open{opacity:1;transform:none;pointer-events:auto}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-weight:600;font-size:13.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:10.5px;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-size:12.5px;cursor:default;font-variant-numeric:tabular-nums;
}
.cal-day:hover{background:color-mix(in srgb,var(--text) 9%,transparent)}
.cal-day.dim{color:var(--muted);opacity:.45}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.cal-big-time{text-align:center;font-size:30px;font-weight:200;letter-spacing:.04em;font-variant-numeric:tabular-nums;margin-bottom:2px}
.cal-big-date{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}

/* ---------- 5. windows ---------- */
.window{
  position:absolute;min-width:320px;min-height:200px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:scale(.92);animation:winIn .16s ease forwards;
}
.window.closing{animation:winOut .14s ease forwards}
.window.min-anim{transition:transform .2s ease,opacity .2s ease;transform:scale(.3) translateY(46vh);opacity:0}
.window:not(.active){box-shadow:var(--shadow-soft);border-color:var(--border)}
.window.maximized{border-radius:0;border:none}
.win-head{
  height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;
  background:var(--surface2);border-bottom:1px solid var(--border);cursor:default;touch-action:none;
}
.window:not(.active) .win-head{opacity:.72}
.win-icon{font-size:15px;flex:none}
.win-title{
  flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text);
}
.win-btns{display:flex;gap:2px;flex:none}
.win-btns button{
  width:34px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);transition:.12s;
}
.win-btns button:hover{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.win-btns .wb-close:hover{background:#e5484d;color:#fff}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.rz{position:absolute;z-index:50;touch-action:none}
.rz-e{right:-3px;top:12px;bottom:12px;width:7px;cursor:ew-resize}
.rz-s{bottom:-3px;left:12px;right:12px;height:7px;cursor:ns-resize}
.rz-se{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}
.rz-w{left:-3px;top:12px;bottom:12px;width:7px;cursor:ew-resize}
.rz-n{top:-3px;left:12px;right:12px;height:7px;cursor:ns-resize}

/* ---------- 6. ui kit ---------- */
.btn{
  height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:7px;
  transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--surface3);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 84%,#fff);border-color:transparent}
.btn-danger{background:color-mix(in srgb,#e5484d 16%,transparent);border-color:color-mix(in srgb,#e5484d 45%,transparent);color:#ff8a8e}
.btn-danger:hover{background:#e5484d;color:#fff;border-color:#e5484d}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:color-mix(in srgb,var(--text) 8%,transparent);border-color:transparent}
.icon-btn{width:30px;height:30px;padding:0;justify-content:center;border-radius:7px}
input[type=text],input[type=number],select{
  height:32px;border-radius:8px;border:1px solid var(--border2);background:color-mix(in srgb,var(--text) 6%,transparent);
  padding:0 10px;outline:none;font-size:13px;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=color]{width:34px;height:30px;border:1px solid var(--border2);border-radius:7px;background:none;padding:2px;cursor:pointer}
input[type=range]{accent-color:var(--accent);cursor:pointer}
.switch{width:40px;height:22px;border-radius:12px;background:var(--surface3);border:1px solid var(--border2);position:relative;cursor:pointer;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:20px;background:#fff}
.h1{font-size:20px;font-weight:700}.h2{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.chip{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
}
.hr{height:1px;background:var(--border);border:none;margin:10px 0}

/* context menu */
.ctx-menu{
  position:fixed;z-index:9600;min-width:186px;padding:5px;border-radius:10px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--border2);box-shadow:var(--shadow);animation:menuIn .1s ease;
}
.ctx-item{
  display:flex;align-items:center;gap:9px;height:31px;padding:0 10px;border-radius:7px;font-size:13px;
  cursor:default;color:var(--text);white-space:nowrap;
}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-item .ci-ico{width:17px;text-align:center;font-size:13px;flex:none}
.ctx-item .ci-hint{margin-left:auto;font-size:11px;color:var(--muted)}
.ctx-item:hover .ci-hint{color:rgba(255,255,255,.75)}
.ctx-sep{height:1px;background:var(--border);margin:4px 8px}

/* toasts */
#toastStack{position:fixed;right:12px;bottom:calc(var(--tbh) + 12px);z-index:9900;display:flex;flex-direction:column;gap:9px;width:330px;max-width:calc(100vw - 24px)}
.toast{
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;
  display:flex;gap:11px;align-items:flex-start;animation:toastIn .22s ease;cursor:pointer;
}
.toast.out{animation:toastOut .2s ease forwards}
.toast .t-ico{font-size:19px;flex:none;margin-top:1px}
.toast .t-title{font-weight:700;font-size:13px;margin-bottom:2px}
.toast .t-body{font-size:12px;color:var(--muted);word-break:break-word}

/* modal dialog */
#modalLayer{position:fixed;inset:0;z-index:9800;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modalLayer.show{display:flex}
.modal{
  width:400px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;box-shadow:var(--shadow);padding:20px;animation:winIn .15s ease;
}
.modal-title{font-weight:700;font-size:15px;margin-bottom:9px;display:flex;gap:9px;align-items:center}
.modal-body{font-size:13px;color:var(--muted);line-height:1.55;user-select:text;word-break:break-word}
.modal-input{
  width:100%;margin-top:13px;height:36px;border-radius:8px;border:1px solid var(--border2);
  background:var(--surface2);padding:0 11px;outline:none;font-size:13.5px;
}
.modal-input:focus{border-color:var(--accent)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}

/* ---------- 7a. terminal ---------- */
.term{display:flex;flex-direction:column;height:100%;background:#0a0e1a;font-family:var(--mono);font-size:13px;color:#c9d4f2;cursor:text}
body[data-theme=daylight] .term{background:#0a0e1a}
.term-out{flex:1;overflow-y:auto;padding:12px 14px 4px;user-select:text;line-height:1.5}
.term-line{white-space:pre-wrap;word-break:break-all;min-height:1.3em}
.term-input-row{display:flex;align-items:center;padding:4px 14px 12px;flex:none}
.term-prompt{white-space:pre;flex:none}
.term-input{
  flex:1;background:none;border:none;outline:none;color:#e8eeff;font-family:var(--mono);
  font-size:13px;caret-color:var(--accent2);min-width:40px;
}
.t-dim{color:#5d6b93}.t-accent{color:#8f7dff}.t-cyan{color:#39d3e8}.t-ok{color:#4ade80}
.t-err{color:#ff7b81}.t-warn{color:#fbbf24}.t-pink{color:#f472b6}.t-white{color:#eef2ff}
.term-line b{color:#eef2ff;font-weight:600}

/* ---------- 7b. file explorer ---------- */
.fx{display:flex;height:100%}
.fx-side{
  width:172px;flex:none;border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;
  background:color-mix(in srgb,var(--surface2) 55%,transparent);
}
.fx-side-item{
  display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;
  color:var(--text);cursor:default;margin-bottom:1px;
}
.fx-side-item:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.fx-side-item.active{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--text)}
.fx-side-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:12px 10px 6px}
.fx-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fx-bar{
  height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;
  border-bottom:1px solid var(--border);
}
.fx-crumbs{
  flex:1;height:30px;border-radius:8px;border:1px solid var(--border);background:color-mix(in srgb,var(--text) 5%,transparent);
  display:flex;align-items:center;padding:0 6px;overflow:hidden;min-width:60px;
}
.fx-crumb{padding:3px 7px;border-radius:6px;font-size:12.5px;white-space:nowrap;cursor:default;color:var(--muted)}
.fx-crumb:hover{background:color-mix(in srgb,var(--text) 9%,transparent);color:var(--text)}
.fx-crumb.last{color:var(--text);font-weight:600}
.fx-crumb-sep{color:var(--muted);opacity:.5;font-size:11px}
.fx-grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:4px;align-content:start}
.fx-item{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 5px 10px;border-radius:9px;
  cursor:default;border:1px solid transparent;min-width:0;
}
.fx-item:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
.fx-item.sel{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fx-item .fi-ico{font-size:33px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.fx-item .fi-name{
  font-size:11.5px;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;
}
.fx-status{
  height:26px;flex:none;border-top:1px solid var(--border);display:flex;align-items:center;
  padding:0 12px;font-size:11.5px;color:var(--muted);gap:14px;
}
.fx-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:13px}

/* ---------- 7c. code editor ---------- */
.ed{display:flex;flex-direction:column;height:100%}
.ed-bar{
  height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface2) 60%,transparent);
}
.ed-lang{font-size:11px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-family:var(--mono)}
.ed-dirty{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;display:none}
.ed-dirty.show{display:block}
.ed-main{flex:1;display:flex;min-height:0}
.ed-gutter{
  width:46px;flex:none;background:color-mix(in srgb,var(--surface2) 70%,transparent);border-right:1px solid var(--border);
  overflow:hidden;text-align:right;padding:10px 8px 10px 0;color:var(--muted);font-family:var(--mono);
  font-size:12.5px;line-height:1.55;opacity:.7;user-select:none;
}
.ed-wrap{flex:1;position:relative;overflow:hidden;background:color-mix(in srgb,var(--surface) 92%,#000)}
.ed-pre,.ed-ta{
  position:absolute;inset:0;margin:0;padding:10px 14px;font-family:var(--mono);font-size:12.5px;
  line-height:1.55;white-space:pre;tab-size:2;
}
.ed-pre{pointer-events:none;overflow:hidden;color:var(--text);user-select:none;z-index:1;will-change:transform}
.ed-pre code{font:inherit}
.ed-ta{
  z-index:2;background:transparent;color:transparent;caret-color:var(--accent2);border:none;outline:none;
  resize:none;overflow:auto;user-select:text;
}
.ed-out{
  height:150px;flex:none;border-top:1px solid var(--border);display:none;flex-direction:column;
  font-family:var(--mono);font-size:12px;background:#0a0e1a;color:#c9d4f2;
}
.ed-out.show{display:flex}
.ed-out-head{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1c2440;color:#7c89b3}
.ed-out-body{flex:1;overflow-y:auto;padding:8px 12px;user-select:text;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.ed-preview{flex:1;display:none;border:none;background:#fff;width:100%}
.ed-preview.show{display:block}
.tok-kw{color:#c792ea}.tok-str{color:#a5e884}.tok-num{color:#f8a55b}.tok-com{color:#5f6c95;font-style:italic}
.tok-fn{color:#61d0f0}.tok-tag{color:#ff7b9c}.tok-attr{color:#ffcb6b}.tok-punc{color:#8b98c0}.tok-prop{color:#82aaff}
body[data-theme=daylight] .ed-wrap{background:#fbfcff}

/* ---------- 7d. games shared ---------- */
.game-shell{display:flex;flex-direction:column;height:100%;align-items:center;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%),var(--surface)}
.g-hud{
  width:100%;flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:11px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.g-stat{display:flex;flex-direction:column;align-items:center;min-width:74px}
.g-stat b{font-size:17px;font-variant-numeric:tabular-nums}
.g-stat span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.g-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:14px;width:100%}
.g-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
  background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:5;
}
.g-overlay h2{font-size:26px;font-weight:800}
.g-canvas-frame{border-radius:12px;overflow:hidden;border:1px solid var(--border2);box-shadow:var(--shadow-soft);position:relative}
canvas{display:block}

/* snake */
.snake-cv{background:#0b1120}
/* 2048 */
.g2048-board{
  background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:10px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(400px,72vw);aspect-ratio:1;
  touch-action:none;box-shadow:var(--shadow-soft);
}
.t2-cell{border-radius:9px;background:color-mix(in srgb,var(--text) 5%,transparent);position:relative}
.t2-tile{
  position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(15px,4.2vw,27px);animation:tilePop .16s ease;color:#fff;
}
.t2-tile.merged{animation:tileMerge .18s ease}
.t2-v2{background:#3b4a75}.t2-v4{background:#4a5ea8}.t2-v8{background:#4f7df0}
.t2-v16{background:#6a5cff}.t2-v32{background:#8f5cff}.t2-v64{background:#b44dff}
.t2-v128{background:#d84dff;box-shadow:0 0 18px color-mix(in srgb,#d84dff 55%,transparent)}
.t2-v256{background:#ff4dc4;box-shadow:0 0 20px color-mix(in srgb,#ff4dc4 55%,transparent)}
.t2-v512{background:#ff4d88;box-shadow:0 0 22px color-mix(in srgb,#ff4d88 60%,transparent)}
.t2-v1024{background:#ff5c5c;box-shadow:0 0 24px color-mix(in srgb,#ff5c5c 60%,transparent)}
.t2-v2048{background:linear-gradient(135deg,#fbbf24,#ff5c8a);box-shadow:0 0 28px rgba(251,191,36,.6)}
.t2-vbig{background:linear-gradient(135deg,#22d3ee,#7c6cff)}
/* minesweeper */
.ms-top{display:flex;align-items:center;gap:12px}
.ms-face{width:42px;height:42px;border-radius:10px;background:var(--surface2);border:1px solid var(--border2);font-size:22px;display:flex;align-items:center;justify-content:center;transition:.12s}
.ms-face:hover{background:var(--surface3)}
.ms-led{
  font-family:var(--mono);font-size:19px;font-weight:700;color:#ff5c5c;background:#16090c;
  border:1px solid #3a1420;border-radius:8px;padding:5px 11px;min-width:74px;text-align:center;
  letter-spacing:.1em;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,70,70,.6);
}
body[data-theme=daylight] .ms-led{background:#16090c;color:#ff5c5c}
.ms-board{display:grid;gap:2px;background:var(--border);padding:6px;border-radius:10px;border:1px solid var(--border2);touch-action:manipulation}
.ms-cell{
  width:var(--cs,30px);height:var(--cs,30px);border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cs,30px) * .48);cursor:default;user-select:none;
  background:var(--surface3);border:1px solid var(--border2);transition:background .08s;
  font-family:var(--mono);
}
.ms-cell:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface3))}
.ms-cell.revealed{background:color-mix(in srgb,var(--surface) 88%,#000);border-color:var(--border);cursor:default}
.ms-cell.flag{background:color-mix(in srgb,var(--warn) 24%,var(--surface3))}
.ms-cell.boom{background:#e5484d}
.ms-n1{color:#7fb2ff}.ms-n2{color:#5ee0a0}.ms-n3{color:#ff8a7a}.ms-n4{color:#c792ea}
.ms-n5{color:#fbbf24}.ms-n6{color:#39d3e8}.ms-n7{color:#ff7b9c}.ms-n8{color:#e8ecf8}
body[data-theme=daylight] .ms-n1{color:#2563eb}.ms-cell.revealed{color:var(--text)}

/* breakout */
.brk-cv{background:linear-gradient(180deg,#0b1024,#0d1230)}
/* ---------- 7e. calculator ---------- */
.calc{display:flex;flex-direction:column;height:100%;background:var(--surface)}
.calc-screen{
  padding:16px 18px 10px;text-align:right;flex:none;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--surface2) 55%,transparent);
}
.calc-expr{font-size:13px;color:var(--muted);font-family:var(--mono);min-height:18px;word-break:break-all}
.calc-val{
  font-size:37px;font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;
}
.calc-hist{height:74px;overflow-y:auto;flex:none;border-bottom:1px solid var(--border);padding:5px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);user-select:text}
.calc-hist div{padding:2px 0;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.calc-hist div:hover{color:var(--text)}
.calc-grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:11px;
  grid-auto-rows:1fr;min-height:0;
}
.calc-grid button{
  border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:17px;
  transition:.1s;font-variant-numeric:tabular-nums;min-height:0;
}
.calc-grid button:hover{background:var(--surface3)}
.calc-grid button:active{transform:scale(.96)}
.calc-grid .c-op{color:var(--accent2);font-weight:700}
.calc-grid .c-fn{color:var(--muted);font-size:14px}
.calc-grid .c-eq{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.calc-grid .c-eq:hover{background:color-mix(in srgb,var(--accent) 85%,#fff)}
.calc-grid .c-zero{grid-column:span 2}

/* ---------- 7f. music studio ---------- */
.mus{display:flex;flex-direction:column;height:100%;background:var(--surface);overflow-y:auto}
.mus-sec{border-bottom:1px solid var(--border);padding:12px 14px;flex:none}
.mus-sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.mus-viz{width:100%;height:64px;background:#0a0e1a;border-radius:9px;border:1px solid var(--border)}
.mus-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.mus-controls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.mus-keys{display:flex;position:relative;height:148px;user-select:none;margin-top:4px}
.mkey{
  flex:1;background:linear-gradient(180deg,#fff,#dfe4f2);border:1px solid #9aa3c0;border-radius:0 0 7px 7px;
  position:relative;cursor:pointer;transition:background .06s;
}
.mkey.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent))}
.mkey .mk-label{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:10px;color:#5a6488;font-weight:700}
.mkey.black{
  position:absolute;width:6.6%;height:60%;background:linear-gradient(180deg,#2a3150,#12172b);
  border-radius:0 0 5px 5px;z-index:2;border:1px solid #000;transform:translateX(-50%);
}
.mkey.black.on{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000))}
.mkey.black .mk-label{color:#8f9ac0}
.mus-seq{display:flex;flex-direction:column;gap:3px}
.seq-track{display:flex;align-items:center;gap:8px}
.seq-track-label{width:52px;flex:none;font-size:11px;color:var(--muted);text-align:right;font-weight:700}
.seq-steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;flex:1}
.seq-step{
  aspect-ratio:1.35;border-radius:5px;background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;transition:background .08s;min-width:0;
}
.seq-step.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 50%,transparent)}
.seq-step.playhead{outline:2px solid var(--accent2);outline-offset:1px}
.seq-step.beat{opacity:.85}
.mus-btn-play{width:40px}

/* ---------- 7g. paint ---------- */
.paint{display:flex;flex-direction:column;height:100%;background:var(--surface2)}
.pt-bar{
  height:46px;flex:none;display:flex;align-items:center;gap:7px;padding:0 11px;flex-wrap:nowrap;
  border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;background:var(--surface);
}
.pt-tool{
  width:34px;height:34px;border-radius:8px;border:1px solid transparent;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex:none;color:var(--text);
}
.pt-tool:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.pt-tool.active{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pt-sep{width:1px;height:24px;background:var(--border);flex:none}
.pt-pal{display:flex;gap:3px;flex:none}
.pt-sw{width:21px;height:21px;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:none}
.pt-sw.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
.pt-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.pt-canvas-wrap{position:relative;box-shadow:var(--shadow-soft);border-radius:6px;overflow:hidden;border:1px solid var(--border2);max-width:100%;max-height:100%}
.pt-canvas-wrap canvas{position:absolute;inset:0}
.pt-canvas-wrap canvas:first-child{position:relative}

/* ---------- 7h. settings ---------- */
.set{height:100%;overflow-y:auto;padding:22px 26px;user-select:text}
.set-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.set-section h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.set-section .set-desc{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.set-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:9px;
  display:flex;align-items:center;gap:13px;
}
.set-card .sc-main{flex:1;min-width:0}
.set-card .sc-title{font-size:13.5px;font-weight:600}
.set-card .sc-sub{font-size:12px;color:var(--muted);margin-top:2px}
.theme-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.theme-card{
  border-radius:11px;border:2px solid var(--border);overflow:hidden;cursor:pointer;background:var(--surface2);
  transition:.13s;
}
.theme-card:hover{transform:translateY(-2px)}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.theme-prev{height:52px;position:relative}
.theme-prev .tp-bar{position:absolute;left:8px;right:8px;bottom:0;height:14px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.14)}
.theme-name{padding:7px 10px;font-size:12px;font-weight:600}
.acc-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.acc-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s}
.acc-swatch:hover{transform:scale(1.12)}
.acc-swatch.active{border-color:var(--text);box-shadow:0 0 0 3px var(--surface)}
.wp-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.wp-card{
  height:76px;border-radius:11px;border:2px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:.13s;
}
.wp-card:hover{transform:translateY(-2px)}
.wp-card.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.wp-card span{position:absolute;left:9px;bottom:6px;font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);color:#fff}
.set-btn-row{display:flex;gap:9px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border:none}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- 7i. task manager ---------- */
.tm{display:flex;flex-direction:column;height:100%}
.tm-viz{height:92px;flex:none;border-bottom:1px solid var(--border);position:relative;background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.tm-viz canvas{width:100%;height:100%}
.tm-viz-label{position:absolute;top:8px;left:12px;font-size:11px;color:var(--muted);letter-spacing:.08em}
.tm-viz-val{position:absolute;top:6px;right:14px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tm-head{display:flex;padding:8px 16px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);gap:10px}
.tm-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.tm-row{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;font-size:13px;cursor:default;
}
.tm-row:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.tm-cpu{width:120px;flex:none;display:flex;align-items:center;gap:8px}
.tm-meter{flex:1;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.tm-meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.tm-mem{width:76px;flex:none;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.tm-pid{width:56px;flex:none;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tm-name{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.tm-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-status{padding:6px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:flex;gap:18px}

/* ---------- 7j. welcome ---------- */
.welcome{height:100%;overflow-y:auto;background:radial-gradient(ellipse at 70% -20%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 55%),var(--surface);user-select:text}
.welcome-inner{max-width:660px;margin:0 auto;padding:30px 28px;display:flex;flex-direction:column;gap:20px}
.wf-logo{font-family:var(--mono);font-size:11.5px;line-height:1.35;color:var(--accent);white-space:pre;overflow-x:auto;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.wf-title{font-size:26px;font-weight:800;letter-spacing:-.01em}
.wf-sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.6}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.wf-app{
  display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;background:var(--surface2);
  border:1px solid var(--border);cursor:pointer;transition:.13s;
}
.wf-app:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.wf-app .wa-ico{font-size:23px}
.wf-app .wa-name{font-size:13px;font-weight:600}
.wf-app .wa-desc{font-size:11px;color:var(--muted)}
.wf-tips{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:15px 17px;font-size:12.5px;line-height:1.9;color:var(--muted)}
.wf-tips b{color:var(--text)}
.wf-tips code{font-family:var(--mono);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);padding:1px 6px;border-radius:5px;font-size:11.5px}

/* ---------- 7k. image viewer ---------- */
.viewer{height:100%;display:flex;flex-direction:column;background:#0a0d18}
body[data-theme=daylight] .viewer{background:#e5e9f4}
.viewer-bar{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.viewer-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer-stage img{transition:transform .15s ease;box-shadow:var(--shadow);max-width:none;user-select:none}

/* ---------- 7l. shader studio ---------- */
.shd{position:relative;height:100%;background:#000;overflow:hidden}
.shd canvas{position:absolute;inset:0;width:100%;height:100%}
.shd-bar{
  position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:7px;align-items:center;
  flex-wrap:wrap;pointer-events:none;
}
.shd-bar>*{pointer-events:auto}
.shd-fps{
  position:absolute;bottom:10px;left:12px;z-index:3;font-family:var(--mono);font-size:11px;color:#9fe8ff;
  background:rgba(0,0,0,.4);padding:3px 9px;border-radius:6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.shd-err{
  position:absolute;inset:14px;z-index:4;background:rgba(10,0,5,.88);color:#ff9aa5;font-family:var(--mono);
  font-size:11.5px;padding:16px;border-radius:10px;overflow:auto;white-space:pre-wrap;display:none;user-select:text;
}

/* ---------- 8. keyframes ---------- */
@keyframes winIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.9) translateY(6px)}}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
@keyframes tilePop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes tileMerge{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shimmer{to{background-position:220% 0}}
@keyframes bootPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<script>
"use strict";
/* ================================================================
   AuroraOS 1.0 "Nebula" — a desktop environment in one file.
   Kernel: utils -> settings -> vfs -> window manager -> ui -> shell
   ================================================================ */

/* ---------------- 01 · utilities ---------------- */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pad2  = n => String(n).padStart(2,"0");
let __uid = 1000;
const uid = () => ++__uid;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = n => {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(2) + " MB";
};
const fmtUptime = ms => {
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), ss = s%60;
  return (d? d+"d ":"") + pad2(h)+":"+pad2(m)+":"+pad2(ss);
};
const el = (tag, attrs={}, ...children) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(e.dataset, v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
};
/* tiny event bus */
const Bus = {
  map: {},
  on(ev, fn) { (this.map[ev] ||= []).push(fn); return () => this.off(ev, fn); },
  off(ev, fn) { this.map[ev] = (this.map[ev]||[]).filter(f => f !== fn); },
  emit(ev, ...a) { (this.map[ev]||[]).slice().forEach(fn => { try { fn(...a); } catch(e){ console.error(e); } }); }
};

/* ---------------- 02 · settings ---------------- */
const Settings = {
  KEY: "aurora.settings",
  data: { theme:"aurora", accent:"#7c6cff", wallpaper:"aurora", animations:true, sfx:true },
  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem(this.KEY) || "{}")); } catch(e){}
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){} },
  set(k, v) { this.data[k] = v; this.save(); this.apply(); Bus.emit("settings", k, v); },
  apply() {
    document.body.dataset.theme = this.data.theme;
    document.documentElement.style.setProperty("--accent", this.data.accent);
    document.documentElement.style.setProperty("--accent2", this.data.accent2 || "");
    if (typeof Wallpaper !== "undefined") Wallpaper.set(this.data.wallpaper, this.data.animations);
  }
};

/* ---------------- 03 · virtual file system ---------------- */
const FS = {
  KEY: "aurora.fs.v1",
  root: null,
  _t: null,

  init() {
    let loaded = null;
    try { loaded = JSON.parse(localStorage.getItem(this.KEY)); } catch(e){}
    this.root = (loaded && loaded.t === "d") ? loaded : this.defaultTree();
    this.save();
  },
  save() {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.root)); } catch(e){ console.warn("FS save failed", e); }
    }, 250);
  },
  factoryReset() {
    this.root = this.defaultTree();
    this.save();
    Bus.emit("fs.reset");
  },

  defaultTree() {
    const welcomeMd =
`# 欢迎使用 AuroraOS

这是一台完全运行在你浏览器里的桌面电脑 —— 单个 HTML 文件，
没有服务器、没有构建工具，一切都在本地。

## 试试这些
- 双击桌面图标打开应用
- 打开「终端」输入 help 查看全部命令
- 在「编辑器」里打开 hello.js 然后点 ▶ 运行
- 「星云」是一个实时的 WebGL 着色器引擎
- 「音乐工作室」可以弹琴 + 编排鼓机音序

## 提示
- 终端里 Ctrl+L 清屏，Tab 补全路径
- 全局快捷键 Ctrl+Alt+T 快速召唤终端
- 所有文件保存在浏览器 localStorage 中
- 设置中心可以恢复出厂（一切数据会被清空）

玩得开心。
— Aurora Kernel`;
    const helloJs =
`// 在编辑器里点击 ▶ 运行我！
const name = "Aurora";
const stars = 42 * 1024;

console.log("Hello from", name + "!");
console.log("渲染了", stars.toLocaleString(), "颗虚拟星星");

for (let i = 1; i <= 5; i++) {
  console.log("  ✓ 启动子系统", i, "…", i % 2 ? "ok" : "ready");
}

const fib = n => n < 2 ? n : fib(n-1) + fib(n-2);
console.log("fib(20) =", fib(20));
console.warn("这是一个 warning 示例");
console.log("完成 ✓");`;
    const notesTxt =
`待办清单
========
[x] 制造一台浏览器里的电脑
[x] 给它写一个终端
[x] 再写一堆应用
[ ] 让用户发现右键菜单里藏着东西
[ ] 用星云着色器摸鱼一下午`;
    const readmeTxt =
"AuroraOS /bin\n\n这里假装是二进制目录。其实所有可执行文件\n都是 JS 函数，正在内存里盯着你。\n\n试试在终端里运行: neofetch";
    const d = children => ({ t:"d", c:children });
    const f = content => ({ t:"f", c:content });
    return d({
      home: d({
        user: d({
          Desktop: d({}),
          Documents: d({
            "welcome.md": f(welcomeMd),
            "todo.txt": f(notesTxt),
            "hello.js": f(helloJs),
          }),
          Pictures: d({}),
          Music: d({}),
          Downloads: d({}),
        })
      }),
      etc: d({ "os.json": f(JSON.stringify({name:"AuroraOS",version:"1.0",codename:"Nebula",kernel:"aurora-js",shell:"ash 1.0"},null,2)) }),
      bin: d({ "readme.txt": f(readmeTxt) }),
      var: d({ log: d({ "boot.log": f("[ok] aurora kernel 1.0\n[ok] vfs mounted\n[ok] compositor online\n[ok] audio daemon ready") }) })
    });
  },

  normalize(p, cwd="/") {
    if (!p || p === ".") p = cwd;
    if (p === "~") p = "/home/user";
    if (p.startsWith("~/")) p = "/home/user/" + p.slice(2);
    if (!p.startsWith("/")) p = (cwd === "/" ? "" : cwd.replace(/\/$/,"")) + "/" + p;
    const parts = [];
    for (const seg of p.split("/")) {
      if (!seg || seg === ".") continue;
      if (seg === "..") parts.pop();
      else parts.push(seg);
    }
    return "/" + parts.join("/");
  },
  get(p) {
    let node = this.root;
    for (const seg of p.split("/").filter(Boolean)) {
      if (!node || node.t !== "d" || !node.c[seg]) return null;
      node = node.c[seg];
    }
    return node;
  },
  exists(p)  { return !!this.get(p); },
  isDir(p)   { const n = this.get(p); return !!n && n.t === "d"; },
  parentOf(p) {
    p = this.normalize(p);
    const i = p.lastIndexOf("/");
    const dirPath = i <= 0 ? "/" : p.slice(0, i);
    const name = p.slice(i + 1);
    return { dirPath, name, dir: this.get(dirPath) };
  },
  ls(p) {
    const n = this.get(this.normalize(p));
    if (!n || n.t !== "d") return null;
    return Object.entries(n.c)
      .map(([name, node]) => ({ name, node }))
      .sort((a,b) => (a.node.t === b.node.t) ? a.name.localeCompare(b.name, "zh") : (a.node.t === "d" ? -1 : 1));
  },
  mkdir(p) {
    p = this.normalize(p);
    const { dirPath, name, dir } = this.parentOf(p);
    if (!dir || dir.t !== "d") return "no such directory: " + dirPath;
    if (dir.c[name]) return "already exists: " + p;
    dir.c[name] = { t:"d", c:{} };
    this.save(); return null;
  },
  writeFile(p, content) {
    p = this.normalize(p);
    const { dirPath, name, dir } = this.parentOf(p);
    if (!dir || dir.t !== "d") return "no such directory: " + dirPath;
    const existing = dir.c[name];
    if (existing && existing.t === "d") return "is a directory: " + p;
    dir.c[name] = { t:"f", c:String(content) };
    this.save(); return null;
  },
  read(p) {
    const n = this.get(this.normalize(p));
    if (!n) return null;
    if (n.t === "d") return undefined;
    return n.c;
  },
  rm(p) {
    p = this.normalize(p);
    if (p === "/") return "cannot remove root";
    const { dir, name } = this.parentOf(p);
    if (!dir || !dir.c[name]) return "no such file or directory: " + p;
    delete dir.c[name];
    this.save(); return null;
  },
  mv(from, to) {
    from = this.normalize(from); to = this.normalize(to);
    const node = this.get(from);
    if (!node) return "no such file or directory: " + from;
    // rename in place
    const fp = this.parentOf(from), tp = this.parentOf(to);
    if (tp.dir && tp.dir.c[to.split("/").pop()] === undefined && to.indexOf(from) === 0) {
      // moving into own subdir guard below
    }
    if (node.t === "d" && (to + "/").startsWith(from + "/")) return "cannot move into itself";
    if (!tp.dir || tp.dir.t !== "d") return "no such directory: " + tp.dirPath;
    let targetName = tp.name;
    if (this.isDir(to)) targetName = from.split("/").pop();
    if (tp.dir.c[targetName] && tp.dir.c[targetName].t === "d" && node.t !== "d") return "target is a directory";
    delete fp.dir.c[fp.name];
    tp.dir.c[targetName] = node;
    this.save(); return null;
  },
  cp(from, to) {
    from = this.normalize(from); to = this.normalize(to);
    const node = this.get(from);
    if (!node) return "no such file or directory: " + from;
    if (node.t === "d" && (to + "/").startsWith(from + "/")) return "cannot copy into itself";
    const clone = JSON.parse(JSON.stringify(node));
    const tp = this.parentOf(to);
    if (!tp.dir || tp.dir.t !== "d") return "no such directory: " + tp.dirPath;
    let targetName = tp.name;
    if (this.isDir(to)) targetName = from.split("/").pop();
    if (tp.dir.c[targetName] && tp.dir.c[targetName].t === "d" && node.t !== "d") return "target is a directory";
    tp.dir.c[targetName] = clone;
    this.save(); return null;
  },
  uniqueName(dirPath, base) {
    const dir = this.get(dirPath);
    if (!dir || !dir.c[base]) return base;
    const dot = base.lastIndexOf(".");
    const stem = dot > 0 ? base.slice(0, dot) : base;
    const ext  = dot > 0 ? base.slice(dot) : "";
    let i = 2;
    while (dir.c[`${stem} (${i})${ext}`]) i++;
    return `${stem} (${i})${ext}`;
  },
  size(node = this.root) {
    if (node.t === "f") return node.c.length;
    return Object.values(node.c).reduce((s,n) => s + this.size(n), 0);
  }
};

/* ---------------- 04 · window manager ---------------- */
const OS = {
  apps: {},
  windows: [],
  zTop: 100,
  seq: 0,
  bootTime: Date.now(),
  focused: null,

  registerApp(def) { this.apps[def.id] = def; },

  launch(appId, args) {
    const app = this.apps[appId];
    if (!app) { UI.notify("AuroraOS", "未找到应用: " + appId, "⚠️"); return null; }
    if (app.single) {
      const existing = this.windows.find(w => w.appId === appId);
      if (existing) { this.restore(existing); this.focus(existing); return existing; }
    }
    return this.createWindow(app, args);
  },

  createWindow(app, args={}) {
    const desktop = $("#desktop");
    const dw = desktop.clientWidth, dh = desktop.clientHeight;
    const w = Math.min(app.w || 640, dw - 20);
    const h = Math.min(app.h || 460, dh - 20);
    const off = (this.windows.length % 8) * 26;
    let x = app.x != null ? app.x : clamp(Math.round((dw - w)/2) + off - 90, 8, Math.max(8, dw - w - 8));
    let y = app.y != null ? app.y : clamp(Math.round((dh - h)/2.6) + off - 40, 8, Math.max(8, dh - h - 8));

    const win = {
      id: ++this.seq, appId: app.id, app, args,
      minimized: false, maximized: false, _preMax: null,
      onCloseFns: [], _cleanup: [],
      setTitle(t) { this.titleEl.textContent = t; if (this.taskEl) this.taskEl.querySelector(".ti-label").textContent = t; },
      onClose(fn) { this.onCloseFns.push(fn); },
      listen(target, type, fn, opt) {
        target.addEventListener(type, fn, opt);
        this._cleanup.push(() => target.removeEventListener(type, fn, opt));
      },
      every(ms, fn) { const iv = setInterval(fn, ms); this._cleanup.push(() => clearInterval(iv)); return iv; },
      after(ms, fn) { const to = setTimeout(fn, ms); this._cleanup.push(() => clearTimeout(to)); return to; },
    };
    win.$ = s => win.el.querySelector(s);

    const head = el("div", { class:"win-head" },
      el("div", { class:"win-icon", text: app.icon || "🗔" }),
      el("div", { class:"win-title", text: app.name || "Window" }),
      el("div", { class:"win-btns" },
        el("button", { class:"wb-min",  text:"—" , title:"最小化", onclick:e => { e.stopPropagation(); this.minimize(win); }}),
        el("button", { class:"wb-max",  text:"▢", title:"最大化", onclick:e => { e.stopPropagation(); this.toggleMax(win); }}),
        el("button", { class:"wb-close",text:"✕", title:"关闭",   onclick:e => { e.stopPropagation(); this.close(win); }}),
      ));
    win.titleEl = head.querySelector(".win-title");
    win.iconEl = head.querySelector(".win-icon");

    const body = el("div", { class:"win-body" });
    win.body = body;

    const wEl = el("div", { class:"window", style:{ left:x+"px", top:y+"px", width:w+"px", height:h+"px", zIndex: ++this.zTop } },
      head, body,
      el("div", { class:"rz rz-e" }), el("div", { class:"rz rz-s" }), el("div", { class:"rz rz-se" }),
      el("div", { class:"rz rz-w" }), el("div", { class:"rz rz-n" }),
    );
    win.el = wEl;

    /* --- dragging --- */
    let drag = null;
    head.addEventListener("pointerdown", e => {
      if (e.target.closest(".win-btns")) return;
      if (e.button !== 0) return;
      this.focus(win);
      if (win.maximized) {
        // drag off maximized: restore under cursor
        const rw = win._preMax ? win._preMax.w : Math.min(app.w||640, dw-40);
        const ratio = (e.clientX - desktop.getBoundingClientRect().left) / dw;
        this.toggleMax(win);
        win.el.style.width = rw + "px";
        win.el.style.left = clamp(e.clientX - desktop.getBoundingClientRect().left - rw*ratio, 0, dw - rw) + "px";
        win.el.style.top = Math.max(0, e.clientY - 19) + "px";
      }
      drag = { sx:e.clientX, sy:e.clientY, ox: win.el.offsetLeft, oy: win.el.offsetTop };
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener("pointermove", e => {
      if (!drag) return;
      const nx = clamp(drag.ox + e.clientX - drag.sx, -w + 90, dw - 90);
      const ny = clamp(drag.oy + e.clientY - drag.sy, 0, dh - 30);
      win.el.style.left = nx + "px";
      win.el.style.top  = ny + "px";
      this._showSnap(win, e.clientX, e.clientY);
    });
    head.addEventListener("pointerup", e => {
      if (!drag) return;
      drag = null;
      this._applySnap(win, e.clientX, e.clientY);
    });
    head.addEventListener("dblclick", e => { if (!e.target.closest(".win-btns")) this.toggleMax(win); });

    /* --- resizing --- */
    $$(".rz", wEl).forEach(h2 => {
      let rs = null;
      h2.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        e.stopPropagation();
        this.focus(win);
        rs = { sx:e.clientX, sy:e.clientY, ow: wEl.offsetWidth, oh: wEl.offsetHeight, ox: wEl.offsetLeft, oy: wEl.offsetTop, dir: h2.dataset.dir };
        h2.setPointerCapture(e.pointerId);
      });
      h2.addEventListener("pointermove", e => {
        if (!rs) return;
        const dx = e.clientX - rs.sx, dy = e.clientY - rs.sy;
        const d = rs.dir;
        if (d.includes("e")) wEl.style.width  = Math.max(320, rs.ow + dx) + "px";
        if (d.includes("s")) wEl.style.height = Math.max(200, rs.oh + dy) + "px";
        if (d.includes("w")) { const nw = Math.max(320, rs.ow - dx); wEl.style.width = nw + "px"; wEl.style.left = rs.ox + (rs.ow - nw) + "px"; }
        if (d.includes("n")) { const nh = Math.max(200, rs.oh - dy); wEl.style.height = nh + "px"; wEl.style.top = rs.oy + (rs.oh - nh) + "px"; }
      });
      h2.addEventListener("pointerup", () => rs = null);
    });

    wEl.addEventListener("pointerdown", () => this.focus(win));

    desktop.append(wEl);
    this.windows.push(win);
    if (app.mount) {
      try { app.mount(body, win, args); }
      catch(err) {
        console.error(err);
        body.append(el("div", { style:{ padding:"20px", color:"var(--err)", fontFamily:"var(--mono)", fontSize:"12px", userSelect:"text" } },
          "应用崩溃: " + (err && err.stack || err)));
      }
    }
    this.focus(win);
    Bus.emit("windows");
    return win;
  },

  _showSnap(win, cx, cy) {
    const g = $("#snapGhost"), d = $("#desktop").getBoundingClientRect();
    let zone = null;
    if (cy <= d.top + 4) zone = { l:0, t:0, w:d.width, h:d.height };
    else if (cx <= d.left + 4) zone = { l:0, t:0, w:d.width/2, h:d.height };
    else if (cx >= d.right - 5) zone = { l:d.width/2, t:0, w:d.width/2, h:d.height };
    if (!zone) { g.style.display = "none"; this._snapZone = null; return; }
    this._snapZone = zone;
    Object.assign(g.style, { display:"block", left:zone.l+"px", top:zone.t+"px", width:zone.w+"px", height:zone.h+"px" });
  },
  _applySnap(win, cx, cy) {
    $("#snapGhost").style.display = "none";
    const zone = this._snapZone; this._snapZone = null;
    if (!zone) return;
    if (zone.w >= $("#desktop").clientWidth - 5) { this.toggleMax(win, true); return; }
    if (!win.maximized) { win._preMax = { w:win.el.offsetWidth, h:win.el.offsetHeight }; }
    win.maximized = false;
    Object.assign(win.el.style, {
      left: zone.l+"px", top: zone.t+"px", width: zone.w+"px", height: zone.h+"px",
      borderRadius:"12px",
    });
    Bus.emit("windows");
  },

  focus(win) {
    if (this.focused === win && !win.minimized) { win.el.style.zIndex = ++this.zTop; return; }
    if (win.minimized) this.restore(win);
    this.focused = win;
    win.el.style.zIndex = ++this.zTop;
    this.windows.forEach(w => w.el.classList.toggle("active", w === win));
    Bus.emit("windows");
  },

  minimize(win) {
    win.minimized = true;
    win.el.classList.add("min-anim");
    if (this.focused === win) {
      const next = this.windows.filter(w => !w.minimized && w !== win).pop();
      this.focused = null;
      if (next) this.focus(next);
    }
    setTimeout(() => { if (win.minimized) win.el.style.display = "none"; }, 200);
    Bus.emit("windows");
  },
  restore(win) {
    win.minimized = false;
    win.el.style.display = "";
    requestAnimationFrame(() => win.el.classList.remove("min-anim"));
    Bus.emit("windows");
  },
  toggleMax(win, force) {
    const d = $("#desktop");
    if (!win.maximized) {
      if (!force) win._preMax = { l:win.el.offsetLeft, t:win.el.offsetTop, w:win.el.offsetWidth, h:win.el.offsetHeight };
      win.maximized = true;
      win.el.classList.add("maximized");
      Object.assign(win.el.style, { left:"0px", top:"0px", width:"100%", height:"100%", borderRadius:"0" });
      win.el.querySelector(".wb-max").textContent = "❐";
    } else {
      win.maximized = false;
      win.el.classList.remove("maximized");
      const p = win._preMax || { l:40, t:30, w:640, h:460 };
      Object.assign(win.el.style, { left:p.l+"px", top:p.t+"px", width:p.w+"px", height:p.h+"px" });
      win.el.querySelector(".wb-max").textContent = "▢";
    }
    Bus.emit("windows");
  },

  close(win) {
    if (!win || win._closed) return;
    win._closed = true;
    win.onCloseFns.forEach(fn => { try { fn(); } catch(e){} });
    win._cleanup.forEach(fn => { try { fn(); } catch(e){} });
    win.el.classList.add("closing");
    setTimeout(() => win.el.remove(), 140);
    this.windows = this.windows.filter(w => w !== win);
    if (this.focused === win) {
      this.focused = null;
      const next = this.windows.filter(w => !w.minimized).pop();
      if (next) this.focus(next);
    }
    Bus.emit("windows");
  },

  closeAll() { [...this.windows].forEach(w => this.close(w)); }
};

/* ---------------- 05 · ui kit (toast / menu / dialog) ---------------- */
const UI = {
  notify(title, body, icon="🔔", ms=4200) {
    const t = el("div", { class:"toast" },
      el("div", { class:"t-ico", text: icon }),
      el("div", {},
        el("div", { class:"t-title", text: title }),
        body ? el("div", { class:"t-body", text: body }) : null));
    const kill = () => { t.classList.add("out"); setTimeout(() => t.remove(), 200); };
    t.onclick = kill;
    $("#toastStack").append(t);
    setTimeout(kill, ms);
    return t;
  },

  _openMenu: null,
  menu(x, y, items) {
    this.closeMenu();
    const m = el("div", { class:"ctx-menu" });
    for (const it of items) {
      if (it === "-" || it.sep) { m.append(el("div", { class:"ctx-sep" })); continue; }
      if (!it) continue;
      m.append(el("div", {
        class:"ctx-item" + (it.disabled ? " disabled" : ""),
        onclick: e => { e.stopPropagation(); this.closeMenu(); it.action && it.action(); },
      },
        el("span", { class:"ci-ico", text: it.icon || "" }),
        el("span", { text: it.label }),
        it.hint ? el("span", { class:"ci-hint", text: it.hint }) : null,
      ));
    }
    document.body.append(m);
    const r = m.getBoundingClientRect();
    m.style.left = clamp(x, 4, innerWidth - r.width - 4) + "px";
    m.style.top  = clamp(y, 4, innerHeight - r.height - 4) + "px";
    this._openMenu = m;
    setTimeout(() => {
      this._closeHandlers.forEach(h => h());
      const off1 = e => { if (!m.contains(e.target)) this.closeMenu(); };
      document.addEventListener("pointerdown", off1, true);
      const off2 = e => { if (e.key === "Escape") this.closeMenu(); };
      document.addEventListener("keydown", off2, true);
      this._closeHandlers = [
        () => document.removeEventListener("pointerdown", off1, true),
        () => document.removeEventListener("keydown", off2, true),
      ];
    });
    return m;
  },
  _closeHandlers: [],
  closeMenu() {
    if (this._openMenu) { this._openMenu.remove(); this._openMenu = null; }
    this._closeHandlers.forEach(h => h()); this._closeHandlers = [];
  },

  modal(opts) {
    return new Promise(resolve => {
      const layer = $("#modalLayer");
      layer.innerHTML = "";
      const done = val => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(val); };
      const input = opts.input !== false && opts.prompt !== undefined || opts.prompt
        ? el("input", { class:"modal-input", type:"text", value: opts.value || "", placeholder: opts.placeholder || "" }) : null;
      const box = el("div", { class:"modal" },
        el("div", { class:"modal-title" },
          opts.icon ? el("span", { text: opts.icon }) : null,
          el("span", { text: opts.title || "AuroraOS" })),
        el("div", { class:"modal-body", html: opts.html || esc(opts.body || "") }),
        input,
        el("div", { class:"modal-btns" },
          el("button", { class:"btn", text: opts.cancelText || "取消", onclick: () => done(null) }),
          el("button", { class:"btn btn-primary", text: opts.okText || "确定", onclick: () => done(input ? input.value : true) }),
        ));
      layer.append(box);
      layer.classList.add("show");
      layer.onpointerdown = e => { if (e.target === layer) done(null); };
      layer.onkeydown = e => {
        if (e.key === "Escape") done(null);
        if (e.key === "Enter") done(input ? input.value : true);
      };
      if (input) { input.focus(); input.select(); }
      else layer.focus();
      layer.tabIndex = -1;
    });
  },
  confirm(title, body, icon="❔") { return this.modal({ title, body, icon, okText:"确定" }).then(v => v !== null); },
  prompt(title, value="", placeholder="", icon="✏️") { return this.modal({ title, prompt:true, value, placeholder, icon }); },
  alert(title, body, icon="ℹ️") { return this.modal({ title, body, icon, cancelText:"关闭", okText:"好" }); },
};

/* ---------------- 06 · wallpaper engine ---------------- */
const Wallpaper = {
  cv: null, ctx: null, mode: "aurora", animate: true, raf: 0, t: 0,
  _colors: { accent: "#7c6cff", accent2: "#22d3ee" },
  stars: [], blobs: [],

  init() {
    this.cv = $("#wallpaper");
    this.ctx = this.cv.getContext("2d");
    this.readColors();
    addEventListener("resize", () => { this.resize(); this.drawStatic(); });
    Bus.on("settings", () => { this.readColors(); this.build(); this.drawStatic(); });
    this.resize(); this.build();
    const loop = ts => {
      this.raf = requestAnimationFrame(loop);
      if (document.hidden) return;
      this.t = ts / 1000;
      if (this.animate) this.drawStatic();
    };
    this.raf = requestAnimationFrame(loop);
  },
  readColors() {
    const cs = getComputedStyle(document.documentElement);
    this._colors.accent  = cs.getPropertyValue("--accent").trim()  || "#7c6cff";
    this._colors.accent2 = cs.getPropertyValue("--accent2").trim() || "#22d3ee";
  },
  set(mode, animate) {
    this.mode = mode || "aurora";
    this.animate = animate !== false;
    this.build();
    this.drawStatic();
  },
  resize() {
    this.cv.width = innerWidth * (devicePixelRatio > 1.5 ? 1 : devicePixelRatio);
    this.cv.height = innerHeight * (devicePixelRatio > 1.5 ? 1 : devicePixelRatio);
    this.cv.style.width = innerWidth + "px";
    this.cv.style.height = innerHeight + "px";
    this.build();
  },
  build() {
    const W = this.cv.width, H = this.cv.height;
    this.stars = Array.from({ length: Math.round(W*H/9000) }, () => ({
      x: Math.random()*W, y: Math.random()*H, r: rand(.4,1.7), tw: rand(0,6.28), sp: rand(.4,1.6)
    }));
    this.blobs = Array.from({ length: 5 }, (_, i) => ({
      x: rand(0,W), y: rand(0,H), r: rand(W*.18, W*.32), sp: rand(.05,.16), ph: rand(0,6.28), i
    }));
  },
  hex2rgb(h) {
    h = h.replace("#","");
    if (h.length === 3) h = h.split("").map(c=>c+c).join("");
    const n = parseInt(h,16);
    return [n>>16 & 255, n>>8 & 255, n & 255];
  },
  drawStatic() {
    const c = this.ctx, W = this.cv.width, H = this.cv.height, t = this.t;
    const [ar,ag,ab] = this.hex2rgb(this._colors.accent);
    const [br,bg2,bb] = this.hex2rgb(this._colors.accent2);
    const dark = document.body.dataset.theme !== "daylight";
    // base
    const g = c.createLinearGradient(0,0,0,H);
    if (dark) { g.addColorStop(0, "#05070f"); g.addColorStop(1, "#0a1024"); }
    else { g.addColorStop(0, "#dfe7fb"); g.addColorStop(1, "#c4d2f2"); }
    c.fillStyle = g; c.fillRect(0,0,W,H);

    if (this.mode === "aurora") {
      c.globalCompositeOperation = "lighter";
      for (const b of this.blobs) {
        const x = b.x + Math.sin(t*b.sp + b.ph) * W*.16;
        const y = b.y + Math.cos(t*b.sp*.8 + b.ph*1.7) * H*.14;
        const mixT = (Math.sin(t*.1 + b.ph) + 1)/2;
        const rr = ar+(br-ar)*mixT, gg = ag+(bg2-ag)*mixT, rb = ab+(bb-ab)*mixT;
        const rg = c.createRadialGradient(x,y,0, x,y,b.r);
        rg.addColorStop(0, `rgba(${rr|0},${gg|0},${rb|0},${dark?0.16:0.20})`);
        rg.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = rg;
        c.beginPath(); c.arc(x,y,b.r,0,6.29); c.fill();
      }
      c.globalCompositeOperation = "source-over";
    }
    else if (this.mode === "starfield") {
      if (dark) {
        c.globalCompositeOperation = "lighter";
        for (const s of this.stars) {
          const a = .25 + .75*Math.abs(Math.sin(t*s.sp + s.tw));
          c.fillStyle = `rgba(230,240,255,${a*.8})`;
          c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.29); c.fill();
        }
        for (const b of this.blobs.slice(0,3)) {
          const x = b.x + Math.sin(t*b.sp*.5 + b.ph)*W*.1;
          const rg = c.createRadialGradient(x,b.y,0, x,b.y,b.r*.9);
          rg.addColorStop(0, `rgba(${ar},${ag},${ab},0.08)`);
          rg.addColorStop(1, "rgba(0,0,0,0)");
          c.fillStyle = rg; c.beginPath(); c.arc(x,b.y,b.r*.9,0,6.29); c.fill();
        }
        c.globalCompositeOperation = "source-over";
      }
    }
    else if (this.mode === "waves") {
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < 5; i++) {
        c.beginPath();
        const yBase = H*(.3 + i*.14);
        c.moveTo(0, yBase);
        for (let x = 0; x <= W; x += 14) {
          const y = yBase + Math.sin(x*.004 + t*(.5+i*.13) + i*1.7)*36 + Math.sin(x*.0013 - t*.3)*22;
          c.lineTo(x,y);
        }
        c.lineTo(W,H); c.lineTo(0,H); c.closePath();
        c.fillStyle = `rgba(${i%2?br:ar},${i%2?bg2:ag},${i%2?bb:ab},${dark?0.05:0.06})`;
        c.fill();
      }
      c.globalCompositeOperation = "source-over";
    }
    else if (this.mode === "grid") {
      const hz = H*.42;
      c.strokeStyle = dark ? `rgba(${ar},${ag},${ab},0.22)` : `rgba(${ar},${ag},${ab},0.3)`;
      c.lineWidth = 1;
      for (let i = 0; i < 26; i++) {
        const p = ((i/26 + (t*.06)%(1/26)) % 1);
        const y = hz + Math.pow(p, 2.2)*(H-hz);
        c.globalAlpha = p*.9;
        c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke();
      }
      for (let i = -14; i <= 14; i++) {
        c.globalAlpha = .5;
        c.beginPath(); c.moveTo(W/2 + i*W*.06, hz); c.lineTo(W/2 + i*W*.55, H); c.stroke();
      }
      c.globalAlpha = 1;
    }
    // vignette
    const vg = c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35, W/2,H/2, Math.max(W,H)*.75);
    vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1, dark ? "rgba(0,0,0,.5)" : "rgba(30,50,110,.18)");
    c.fillStyle = vg; c.fillRect(0,0,W,H);
  }
};

};

      for (const d of ["日","一","二","三","四","五","六"]) grid.append(el("div", { class:"cal-dow", text:d }));
      for (let i = 0; i < 42; i++) {
        const dayN = i - startDow + 1;
        let cls = "cal-day", label, dim = false;
        if (dayN < 1) { label = prevDays + dayN; dim = true; }
        else if (dayN > daysIn) { label = dayN - daysIn; dim = true; }
        else {
          label = dayN;
          if (dayN === today.getDate() && m === today.getMonth() && y === today.getFullYear()) cls += " today";
        }
        grid.append(el("div", { class: cls + (dim ? " dim" : ""), text: String(label) }));
      }
      pop.append(
        el("div", { class:"cal-big-time", id:"calBigTime" }),
        el("div", { class:"cal-big-date", id:"calBigDate" }),
        el("div", { class:"cal-head" },
          el("button", { class:"btn btn-ghost icon-btn", text:"‹", onclick: () => { view = new Date(y, m-1, 1); render(); }}),
          el("div", { class:"cal-title", text: y + " 年 " + (m+1) + " 月" }),
          el("button", { class:"btn btn-ghost icon-btn", text:"›", onclick: () => { view = new Date(y, m+1, 1); render(); }})),
        grid);
    };
    render();
    Bus.on("settings", render);
  },

  renderTaskItems() {
    const box = $("#taskItems");
    box.innerHTML = "";
    for (const win of OS.windows) {
      const t = el("button", { class: "task-item" + (OS.focused === win && !win.minimized ? " active" : "") + (win.minimized ? " min" : "") },
        el("span", { class:"ti-ico", text: win.app.icon }),
        el("span", { class:"ti-label", text: win.titleEl.textContent }));
      t.onclick = () => {
        if (win.minimized) { OS.restore(win); OS.focus(win); }
        else if (OS.focused === win) OS.minimize(win);
        else OS.focus(win);
      };
      t.oncontextmenu = e => {
        e.preventDefault();
        UI.menu(e.clientX, e.clientY, [
          { label: win.minimized ? "还原" : "最小化", icon:"▼", action: () => win.minimized ? (OS.restore(win), OS.focus(win)) : OS.minimize(win) },
          { label: win.maximized ? "向下还原" : "最大化", icon:"▢", action: () => OS.toggleMax(win) },
          "-",
          { label:"关闭窗口", icon:"✕", action: () => OS.close(win) },
        ]);
      };
      win.taskEl = t;
      box.append(t);
    }
  }
};

      if (e.key === "Enter") {

          state.hist.push(cmd);
          if (state.hist.length > 100) state.hist.shift();

          exec(cmd);

      else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!state.hist.length) return;
        state.hi = state.hi < 0 ? state.hist.length-1 : Math.max(0, state.hi-1);
        input.value = state.hist[state.hi];
      }
      else if (e.key === "ArrowDown") {
        e.preventDefault();

    def("history", "历史命令", "history", () => state.hist.map((h,i) => `${String(i+1).padStart(4)}  ${h}`).join("\n"));
    def("fortune", "随机格言", "fortune", () => FORTUNES[randi(0, FORTUNES.length-1)]);

    def("cowsay", "牛说", "cowsay [文本]", a => {

    def("mkdir", "创建目录", "mkdir <目录>", a => {

      if (err) throw new Error("mv: " + err);

    });
    def("cp", "复制", "cp <源> <目标>", a => {
      if (a.length < 2) throw new Error("用法: cp <源> <目标>");

      if (err) throw new Error("cp: " + err);
    });
    def("tree", "目录树", "tree [路径]", a => {
      const p = FS.normalize(a[0] || ".", state.cwd);
      if (!FS.isDir(p)) throw new Error("tree: 不是目录");
      const lines = [short(p)];
      const walk = (path, prefix, depth) => {
        if (depth > 4) return;
        const items = FS.ls(path) || [];
        items.forEach((it, i) => {
          const last = i === items.length-1;
          lines.push(prefix + (last ? "└─ " : "├─ ") + it.name + (it.node.t === "d" ? "/" : ""));
          if (it.node.t === "d") walk(path + "/" + it.name, prefix + (last ? "   " : "│  "), depth+1);
        });
      };
      walk(p, "", 0);
      return lines.join("\n") + `\n\n${(function count(n){let d=0,f=0;(function w(n){if(n.t==='d'){for(const k in n.c){n.c[k].t==='d'?w(n.c[k]):f++}d++}})(n);return d+" 个目录, "+f+" 个文件"})(FS.get(p))}`;

      const p = FS.normalize(a[0], state.cwd);
      const node = FS.get(p);
      if (!node) throw new Error("open: 没有那个文件: " + a[0]);
      if (node.t === "d") { OS.launch("files", { path: p }); return "在文件管理器中打开 " + short(p); }
      Apps.openFile(p, node.c);
      return "打开 " + short(p) + " …";

      if (!a[0]) return "当前主题: " + Settings.data.theme + " · 可选: aurora midnight sunset forest daylight";

    def("accent", "设置强调色", "accent <#hex>", a => {

      const expr = a.join(" ").replace(/×/g,"*").replace(/÷/g,"/");

      try {
        // eslint-disable-next-line no-new-func
        const v = Function(`"use strict";return (${expr})`)();
        if (typeof v !== "number" || !isFinite(v)) throw 0;

      } catch(e) { throw new Error("calc: 无效表达式"); }

        ["Shell", "ash 1.0"],

        "   /______\\     ",
        "  /\\      /\\    ",
        " /  \\    /  \\   ",
        "/____\\  /____\\  ",
        "                ",
      ];
      const gap = 3;
      const rows = Math.max(art.length, info.length);
      const lines = [];
      for (let i = 0; i < rows; i++) {
        const a2 = (art[i] || " ".repeat(16));
        const inf = info[i];
        let right = "";
        if (inf) right = `<span class="t-accent">${esc(inf[0])}</span><span class="t-white">: </span><span class="t-dim">${esc(inf[1])}</span>`;
        lines.push(`<span class="t-cyan">${esc(a2)}</span>` + " ".repeat(gap) + right);
      }
      lines.push("");
      lines.push(`<span class="t-cyan">■</span><span class="t-accent">■</span><span class="t-pink">■</span><span class="t-ok">■</span><span class="t-warn">■</span><span class="t-err">■</span>`);
      printHTML(lines.join("\n"));
      return undefined;
    });
    def("reboot", "重启系统", "reboot", () => { print("Rebooting…", "t-warn"); setTimeout(rebootOS, 400); });
    def("matrix", "跟随白兔🐇", "matrix", () => {
      print("Wake up, user…", "t-ok");
      print("跟随白兔。这个终端即将进入数字雨。按任意键返回。", "t-dim");
      const ov = el("canvas", { style:{ position:"absolute", inset:"0", zIndex:"9", background:"#000" } });
      body.style.position = "relative";
      body.append(ov);
      const cx = ov.getContext("2d");
      ov.width = body.clientWidth; ov.height = body.clientHeight;
      const cols = Math.floor(ov.width/14);
      const drops = Array(cols).fill(1);
      const stop = win.every(50, () => {
        cx.fillStyle = "rgba(0,0,0,.09)"; cx.fillRect(0,0,ov.width,ov.height);
        cx.font = "13px " + getComputedStyle(document.body).getPropertyValue("--mono");
        for (let i = 0; i < cols; i++) {
          const ch = String.fromCharCode(0x30A0 + Math.random()*96 | 0);
          cx.fillStyle = Math.random() < .02 ? "#d4ffe8" : "#37ff8b";
          cx.fillText(ch, i*14, drops[i]*15);
          if (drops[i]*15 > ov.height && Math.random() > .972) drops[i] = 0;
          drops[i]++;
        }
      });
      const quit = e => { e.stopPropagation(); clearInterval(stop); ov.remove(); ov.removeEventListener("keydown", quit); body.removeEventListener("keydown", quit); };
      body.tabIndex = -1; body.focus();
      body.addEventListener("keydown", quit);
      ov.addEventListener("pointerdown", quit);
      return undefined;
    });
    def("about", "关于本机", "about", () => OS.launch("welcome"));

    const exec = raw => {
      // handle redirections > and >>
      let text = raw.trim();
      let redir = null, append = false;
      const rm = text.match(/\s(>>|>)\s*([^\s>]+)\s*$/) || text.match(/^(>>|>)\s*([^\s>]+)\s*$/);
      if (rm) {
        append = rm[1] === ">>";
        redir = rm[2];
        text = text.slice(0, rm.index) + " " + text.slice(rm.index + rm[0].length);
      }
      const parts = text.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return;
      const name = parts[0];
      const args = parts.slice(1);
      const cmd = cmds[name];
      try {
        if (!cmd) throw new Error(`ash: 未找到命令: ${name}。输入 help 查看帮助。`);
        const result = cmd.run(args);
        if (result === undefined || result === null) return;
        if (redir) {
          const p = FS.normalize(redir, state.cwd);
          const prev = append && FS.exists(p) ? (FS.read(p) || "") : "";
          const err = FS.writeFile(p, prev + String(result) + "\n");
          if (err) throw new Error("重定向失败: " + err);
          Bus.emit("fs.reset");
        } else {
          print(String(result));
        }
      } catch(err) {
        print(String(err.message || err), "t-err");
      }
    };

    // banner
    printHTML(
`<span class="t-cyan">  A U R O R A   S H E L L</span>  <span class="t-dim">ash 1.0 — aurora kernel 1.0 (nebula)</span>
<span class="t-dim">输入</span> <span class="t-ok">help</span> <span class="t-dim">查看命令 ·</span> <span class="t-ok">neofetch</span> <span class="t-dim">看系统信息 · Tab 补全路径</span>
`);
    renderPrompt();
  }
});
