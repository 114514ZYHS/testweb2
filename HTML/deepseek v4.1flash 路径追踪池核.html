<script>
const GLSL_VS = `#version 300 es
precision highp float;
in vec3 aPos;
void main(){ gl_Position = vec4(aPos.xy, 0.0, 1.0); }
`;

const GLSL_HEAD = `#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;

uniform sampler2D u_scene;
uniform sampler2D u_grid;
uniform sampler2D u_history;
uniform vec2  u_res;
uniform vec3  u_camPos;
uniform vec3  u_camRight;
uniform vec3  u_camUp;
uniform vec3  u_camFwd;
uniform float u_tanHalf;
uniform int   u_frame;
uniform int   u_spp;
uniform int   u_bounces;
uniform float u_time;
uniform float u_blend;
uniform float u_waveAmp;
uniform float u_waterIor;
uniform vec3  u_waterSigA;
uniform float u_waterSigS;
uniform float u_waterG;
uniform vec3  u_airSigA;
uniform float u_airSigS;
uniform vec3  u_sunDir;
uniform vec3  u_sunE;
uniform float u_sunCos;
uniform vec3  u_skyRad;
uniform float u_slit;
uniform float u_caustic;
uniform float u_maxDist;

#define PI 3.14159265359
#define INVPI 0.31830988618
#define INF 1e19
#define OBJ_TEX 8

// ---------- RNG : PCG3D ----------
uvec3 g_seed;
uvec3 pcg3d(uvec3 v){
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
float rnd(){ g_seed = pcg3d(g_seed); return float(g_seed.x) * 2.3283064365386963e-10; }
vec2  rnd2(){ float a = rnd(); float b = rnd(); return vec2(a, b); }
float rndN(){ return fract(rnd() + rnd() + rnd() + rnd() + rnd() + rnd()); }

// ---------- 基础数学 ----------
void onb(vec3 n, out vec3 t, out vec3 b){
  float s = n.z >= 0.0 ? 1.0 : -1.0;
  float a = -1.0 / (s + n.z);
  float bb = n.x * n.y * a;
  t = vec3(1.0 + s * n.x * n.x * a, s * bb, -s * n.x);
  b = vec3(bb, s + n.y * n.y * a, -n.y);
}
vec3 toWorld(vec3 n, vec3 v){ vec3 t, b; onb(n, t, b); return v.x * t + v.y * b + v.z * n; }
float luminance(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float maxc(vec3 c){ return max(c.x, max(c.y, c.z)); }
bool isnan2(float x){ return !(x == x); }

vec3 cosineHemi(vec3 n, float u1, float u2){
  float r = sqrt(u1);
  float phi = 2.0 * PI * u2;
  return toWorld(n, vec3(r * cos(phi), r * sin(phi), sqrt(max(0.0, 1.0 - u1))));
}
vec3 uniformSphere(float u1, float u2){
  float z = 1.0 - 2.0 * u1;
  float r = sqrt(max(0.0, 1.0 - z * z));
  float phi = 2.0 * PI * u2;
  return vec3(r * cos(phi), r * sin(phi), z);
}

// Schlick 菲涅尔（标量 cos，颜色 F0）
vec3 fresnelSchlick(vec3 F0, float cosT){
  float m = clamp(1.0 - cosT, 0.0, 1.0);
  float m2 = m * m;
  return F0 + (vec3(1.0) - F0) * (m2 * m2 * m);
}
// 精确介质菲涅尔（无偏振）
float fresnelDielectric(float cosI, float eta){
  cosI = clamp(cosI, -1.0, 1.0);
  float s2 = (1.0 - cosI * cosI) / (eta * eta);
  if (s2 >= 1.0) return 1.0;
  float cosT = sqrt(max(0.0, 1.0 - s2));
  float rs = (cosI - eta * cosT) / (cosI + eta * cosT);
  float rp = (eta * cosI - cosT) / (eta * cosI + cosT);
  return 0.5 * (rs * rs + rp * rp);
}

// GGX 半程向量采样（各向同性，法线为 N）
vec3 sampleGGXH(vec3 N, float rough, float u1, float u2){
  float a = max(rough * rough, 1e-4);
  float a2 = a * a;
  float phi = 2.0 * PI * u1;
  float cosT = sqrt(max(0.0, (1.0 - u2) / (1.0 + (a2 - 1.0) * u2)));
  float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
  return toWorld(N, vec3(sinT * cos(phi), sinT * sin(phi), cosT));
}
float smithG1(float NoV, float a){
  float a2 = a * a;
  float d = NoV + sqrt(a2 + (1.0 - a2) * NoV * NoV);
  return 2.0 * NoV / max(d, 1e-6);
}
// Henyey-Greenstein 相位函数与采样
float hgPhase(float cosT, float g){
  float g2 = g * g;
  float d = 1.0 + g2 - 2.0 * g * cosT;
  return (1.0 - g2) / (4.0 * PI * max(d * sqrt(max(d, 1e-6)), 1e-6));
}
vec3 sampleHG(vec3 d, float g, float u1, float u2){
  float cosT;
  if (abs(g) < 1e-3) cosT = 1.0 - 2.0 * u1;
  else {
    float s = (1.0 - g * g) / (1.0 + g - 2.0 * g * u1);
    cosT = (1.0 + g * g - s * s) / (2.0 * g);
  }
  cosT = clamp(cosT, -1.0, 1.0);
  float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
  float phi = 2.0 * PI * u2;
  // 相位函数关于两方向对称 → 重要性采样沿当前方向 d 建 ONB，cosT 取自 d
  vec3 t, b; onb(d, t, b);
  return normalize(t * (sinT * cos(phi)) + b * (sinT * sin(phi)) + d * cosT);
}
`;
const GLSL_SCENE = `
// 行内 2 次幂布局（SW_SHIFT / GW_SHIFT 由 JS 端注入），兼容器件最大纹理尺寸
vec4 sTex(int i){ return texelFetch(u_scene, ivec2(i & ((1 << SW_SHIFT) - 1), i >> SW_SHIFT), 0); }
vec4 gTex(int i){ return texelFetch(u_grid,  ivec2(i & ((1 << GW_SHIFT) - 1), i >> GW_SHIFT), 0); }

struct Mat {
  vec3  albedo;
  float rough;
  float metal;
  float trans;
  float ior;
  float matId;
  float emis;
  float shape;
};
Mat fetchMat(int oi){
  int b = oi * OBJ_TEX;
  vec4 t4 = sTex(b + 4);
  vec4 t5 = sTex(b + 5);
  vec4 t6 = sTex(b + 6);
  Mat m;
  m.albedo = t4.xyz; m.rough = t4.w;
  m.metal = t5.x; m.trans = t5.y; m.ior = t5.z; m.matId = t5.w;
  m.shape = t6.x; m.emis = t6.y;
  return m;
}

struct Hit {
  bool  ok;
  float t;
  vec3  p;
  vec3  n;
  Mat   m;
};

vec3 safeDir(vec3 d){
  return vec3(abs(d.x) < 1e-7 ? (d.x < 0.0 ? -1e-7 : 1e-7) : d.x,
              abs(d.y) < 1e-7 ? (d.y < 0.0 ? -1e-7 : 1e-7) : d.y,
              abs(d.z) < 1e-7 ? (d.z < 0.0 ? -1e-7 : 1e-7) : d.z);
}

// 返回世界空间 t（局部方向未归一化 → 参数 t 与世界 t 一致）
bool boxTest(int oi, vec3 ro, vec3 rd, out float tHit, out vec3 nLoc){
  int b = oi * OBJ_TEX;
  mat4 invM = mat4(sTex(b), sTex(b + 1), sTex(b + 2), sTex(b + 3));
  vec3 ol = (invM * vec4(ro, 1.0)).xyz;
  vec3 dl = safeDir((invM * vec4(rd, 0.0)).xyz);
  vec3 inv = 1.0 / dl;
  vec3 t0 = (-1.0 - ol) * inv;
  vec3 t1 = ( 1.0 - ol) * inv;
  vec3 tsm = min(t0, t1);
  vec3 tbg = max(t0, t1);
  float tn = max(max(tsm.x, tsm.y), tsm.z);
  float tf = min(min(tbg.x, tbg.y), tbg.z);
  if (tf < max(tn, 0.0)) return false;
  tHit = tn;
  nLoc = vec3(0.0);
  if (tn > 0.0){
    if (tn == tsm.x)      nLoc = vec3(-sign(dl.x), 0.0, 0.0);
    else if (tn == tsm.y) nLoc = vec3(0.0, -sign(dl.y), 0.0);
    else                  nLoc = vec3(0.0, 0.0, -sign(dl.z));
  } else {
    // 起点在盒内（本场景不应出现，兜底）
    tHit = tf;
    if (tf == tbg.x)      nLoc = vec3(sign(dl.x), 0.0, 0.0);
    else if (tf == tbg.y) nLoc = vec3(0.0, sign(dl.y), 0.0);
    else                  nLoc = vec3(0.0, 0.0, sign(dl.z));
  }
  return true;
}

bool sphereTest(int oi, vec3 ro, vec3 rd, out float tHit, out vec3 nLoc){
  int b = oi * OBJ_TEX;
  mat4 invM = mat4(sTex(b), sTex(b + 1), sTex(b + 2), sTex(b + 3));
  vec3 ol = (invM * vec4(ro, 1.0)).xyz;
  vec3 dl = (invM * vec4(rd, 0.0)).xyz;
  float a = dot(dl, dl);
  float hb = dot(ol, dl);
  float c = dot(ol, ol) - 1.0;
  float disc = hb * hb - a * c;
  if (disc < 0.0 || a < 1e-12) return false;
  float sq = sqrt(disc);
  float t0 = (-hb - sq) / a;
  float t1 = (-hb + sq) / a;
  float t = (t0 > 1e-4) ? t0 : t1;
  if (t <= 1e-4) return false;
  tHit = t;
  nLoc = normalize(ol + dl * t);
  return true;
}

bool objTest(int oi, vec3 ro, vec3 rd, out float tHit, out vec3 nLoc, out float shape){
  shape = sTex(oi * OBJ_TEX + 6).x;
  if (shape < 0.5) return boxTest(oi, ro, rd, tHit, nLoc);
  return sphereTest(oi, ro, rd, tHit, nLoc);
}

// ============================================================
//  均匀网格 DDA 加速结构
//    texel0 : gridMin.xyz, cellSize
//    texel1 : dimX, dimY, dimZ, numCells
//    texel2 : cellOffset, indexOffset, 0, 0
// ============================================================
vec4 gridHeader(int i){ return gTex(i); }

bool sceneHit(vec3 ro, vec3 rd, float tMax, out Hit hit){
  hit.ok = false;
  hit.t = tMax;
  hit.n = vec3(0.0, 1.0, 0.0);
  hit.p = ro;

  vec4 g0 = gridHeader(0);
  vec4 g1 = gridHeader(1);
  vec4 g2 = gridHeader(2);
  vec3 gmin = g0.xyz;
  float cs = g0.w;
  ivec3 gdim = ivec3(g1.xyz + 0.5);

  vec3 rdS = safeDir(rd);
  vec3 invd = 1.0 / rdS;
  vec3 tA = (gmin - ro) * invd;
  vec3 tB = (gmin + vec3(gdim) * cs - ro) * invd;
  vec3 tsm = min(tA, tB);
  vec3 tbg = max(tA, tB);
  float tEnter = max(max(tsm.x, tsm.y), tsm.z);
  float tExit  = min(min(tbg.x, tbg.y), tbg.z);
  tEnter = max(tEnter, 0.0);
  if (tExit <= tEnter) return false;

  vec3 p = ro + rd * (tEnter + 2e-3);
  ivec3 cell = ivec3(floor((p - gmin) / cs));
  cell = clamp(cell, ivec3(0), gdim - ivec3(1));
  ivec3 stp = ivec3(sign(rdS));

  vec3 tNext, tDelta;
  tNext.x = (rdS.x >= 0.0) ? (gmin.x + (float(cell.x) + 1.0) * cs - ro.x) * invd.x

                          vec2(12.9898, 78.233))) * 43758.5453);
  col += (g - 0.5) * u_grain * 0.13;

  col = max(col, vec3(0.0));
  fragColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}

// ============================================================
//  GL 基础设施
// ============================================================
const canvasEl = document.getElementById('gl');
const bootEl = document.getElementById('boot');
const bootMsg = document.getElementById('boot-msg');
const bootErr = document.getElementById('boot-err');

function bootFail(msg){
  if (bootEl) bootEl.classList.remove('gone');
  if (bootMsg) bootMsg.textContent = '启动失败';
  if (bootErr) bootErr.textContent = msg;
  console.error('[POOLCORE]', msg);
}

const gl = canvasEl.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false,
  powerPreference: 'high-performance'
});

let RT_INTERNAL = gl && gl.RGBA32F;
let RT_TYPE = gl && gl.FLOAT;
if (gl){
  if (!gl.getExtension('EXT_color_buffer_float')){
    if (gl.getExtension('EXT_color_buffer_half_float')){
      RT_INTERNAL = gl.RGBA16F; RT_TYPE = gl.HALF_FLOAT;
    } else {
      RT_INTERNAL = null;
    }
  }
}
if (!gl) bootFail('当前浏览器/设备不支持 WebGL2。请使用 Chrome / Edge / Firefox 最新版，并确认硬件加速已开启。');
else if (!RT_INTERNAL) bootFail('缺少浮点渲染目标支持（EXT_color_buffer_float / half_float）。请更换到支持浮点 FBO 的桌面 GPU 环境。');

function compileShader(type, src, tag){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(sh) || '';
    const lines = src.split('\n');
    let detail = '';
    const m = /:(\d+):/.exec(log);
    if (m){
      const ln = parseInt(m[1], 10);
      for (let i = Math.max(0, ln - 4); i < Math.min(lines.length, ln + 3); i++){
        detail += (i + 1) + ' | ' + lines[i] + '\n';
      }
    }
    bootFail('着色器编译失败 [' + tag + ']：\n' + log + '\n' + detail);
    throw new Error('shader compile: ' + tag + ' ' + log);
  }
  return sh;
}

function makeProgram(vsSrc, fsSrc, tag){
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc, tag + '.vs'));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc, tag + '.fs'));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
    const log = gl.getProgramInfoLog(p);
    bootFail('着色器链接失败 [' + tag + ']：\n' + log);
    throw new Error('link: ' + tag + ' ' + log);
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u: u };
}

function makeRT(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, RT_INTERNAL, w, h, 0, gl.RGBA, RT_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) bootFail('浮点帧缓冲创建失败，状态码 0x' + st.toString(16));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: tex, fbo: fbo, w: w, h: h };
}

function freeRT(rt){
  if (!rt) return;
  gl.deleteFramebuffer(rt.fbo);
  gl.deleteTexture(rt.tex);
}

function clearRT(rt){
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
  gl.viewport(0, 0, rt.w, rt.h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

//  场景生成：无限相连的水下泳池廊道
// ============================================================
const S = {
  MOD: 13.0, NX: 3, NZ: 3,
  WT: 0.45,
  Y_DECK: -1.15, Y_POOL: -4.60, POOL_T: 0.70, Y_WELLBOT: -34.0,
  Y_CEIL: 4.60, CEIL_T: 0.55,
  ARCH_HW: 1.70, ARCH_TOP: 3.35,
  BASIN_IN: 1.60, HOLE_H: 2.50,
  SLIT: 0.55, SLAB: 2.60
};
S.WX = S.NX * S.MOD;
S.WZ = S.NZ * S.MOD;

const MATS = {
  tile: { albedo: [0.80, 0.85, 0.81], rough: 0.14, metal: 0.0, trans: 0.0, ior: 1.50, id: 0, emis: 0.0 },
  conc: { albedo: [0.38, 0.41, 0.39], rough: 0.62, metal: 0.0, trans: 0.0, ior: 1.50, id: 1, emis: 0.0 },
  silh: { albedo: [0.014, 0.017, 0.018], rough: 0.42, metal: 0.0, trans: 0.0, ior: 1.50, id: 2, emis: 0.0 },
  glow: { albedo: [0.04, 0.08, 0.08], rough: 0.30, metal: 0.0, trans: 0.0, ior: 1.50, id: 3, emis: 2.30 }
};

const objs = [];

function pushBox(x0, y0, z0, x1, y1, z1, mat){
  const lo = [Math.min(x0, x1), Math.min(y0, y1), Math.min(z0, z1)];
  const hi = [Math.max(x0, x1), Math.max(y0, y1), Math.max(z0, z1)];
  const c = [(lo[0] + hi[0]) * 0.5, (lo[1] + hi[1]) * 0.5, (lo[2] + hi[2]) * 0.5];
  const s = [Math.max((hi[0] - lo[0]) * 0.5, 1e-4),
             Math.max((hi[1] - lo[1]) * 0.5, 1e-4),
             Math.max((hi[2] - lo[2]) * 0.5, 1e-4)];
  const inv = new Float32Array(16);
  inv[0] = 1 / s[0]; inv[5] = 1 / s[1]; inv[10] = 1 / s[2]; inv[15] = 1;
  inv[12] = -c[0] / s[0]; inv[13] = -c[1] / s[1]; inv[14] = -c[2] / s[2];
  objs.push({ lo: lo, hi: hi, inv: inv, m: mat, shape: 0 });
}
function pushSphere(cx, cy, cz, r, mat){
  const lo = [cx - r, cy - r, cz - r];
  const hi = [cx + r, cy + r, cz + r];
  const inv = new Float32Array(16);
  inv[0] = 1 / r; inv[5] = 1 / r; inv[10] = 1 / r; inv[15] = 1;
  inv[12] = -cx / r; inv[13] = -cy / r; inv[14] = -cz / r;
  objs.push({ lo: lo, hi: hi, inv: inv, m: mat, shape: 1 });
}

// 单段墙体：两侧壁柱 + 门上过梁 + 门下填充
function wallSegment(axis, line, a0, a1, mat){
  const t = S.WT * 0.5;
  const mid = (a0 + a1) * 0.5;
  const yBot = S.Y_POOL - S.POOL_T;
  const ha = S.ARCH_HW;
  const segs = [
    [a0, mid - ha, yBot, S.Y_CEIL + S.CEIL_T],
    [mid + ha, a1, yBot, S.Y_CEIL + S.CEIL_T],
    [mid - ha, mid + ha, S.ARCH_TOP, S.Y_CEIL + S.CEIL_T],
    [mid - ha, mid + ha, yBot, S.Y_DECK]
  ];
  for (let k = 0; k < segs.length; k++){
    const s = segs[k];
    if (axis === 'x') pushBox(line - t, s[2], s[0], line + t, s[3], s[1], mat);
    else              pushBox(s[0], s[2], line - t, s[1], s[3], line + t, mat);
  }
}

function buildScene(){
  objs.length = 0;
  const M = S.MOD, NX = S.NX, NZ = S.NZ;

  // ---- 墙线（含拱门）----
  for (let i = 0; i <= NX; i++){
    const x = i * M;
    for (let j = 0; j < NZ; j++) wallSegment('x', x, j * M, (j + 1) * M, MATS.tile);
  }
  for (let j = 0; j <= NZ; j++){
    const z = j * M;
    for (let i = 0; i < NX; i++) wallSegment('z', z, i * M, (i + 1) * M, MATS.tile);
  }

  // ---- 天花（破损式大天窗：混凝土横梁投下条状阴影）----
  const beams = [0.40, 5.10, 9.80];
  const bw = 2.20;
  for (let i = 0; i < NX; i++){
    for (let k = 0; k < beams.length; k++){
      const x0 = i * M + beams[k];
      pushBox(x0, S.Y_CEIL, 0, x0 + bw, S.Y_CEIL + S.CEIL_T, S.WZ, MATS.conc);
    }
  }

  // ---- 每个模块：平台 / 池底 / 竖井 / 台阶 / 灯带 ----
  const dIn = S.BASIN_IN;
  for (let i = 0; i < NX; i++){
    for (let j = 0; j < NZ; j++){
      const x0 = i * M, x1 = x0 + M;
      const z0 = j * M, z1 = z0 + M;
      const cx = x0 + M * 0.5, cz = z0 + M * 0.5;
      const bx0 = x0 + dIn, bx1 = x1 - dIn, bz0 = z0 + dIn, bz1 = z1 - dIn;
      const hh = S.HOLE_H;
      const wBot = S.Y_WELLBOT, wTop = S.Y_POOL;

      // 平台（从池底到水面之上的干区，内侧面即池壁）
      pushBox(x0, wTop, z0, x1, S.Y_DECK, bz0, MATS.tile);              // 北
      pushBox(x0, wTop, bz1, x1, S.Y_DECK, z1, MATS.tile);              // 南
      pushBox(x0, wTop, bz0, bx0, S.Y_DECK, bz1, MATS.tile);            // 西
      pushBox(bx1, wTop, bz0, x1, S.Y_DECK, bz1, MATS.tile);            // 东

      // 池底（中央留竖井开口）
      const fy0 = S.Y_POOL - S.POOL_T, fy1 = S.Y_POOL;
      pushBox(bx0, fy0, bz0, bx1, fy1, cz - hh, MATS.tile);
      pushBox(bx0, fy0, cz + hh, bx1, fy1, bz1, MATS.tile);
      pushBox(bx0, fy0, cz - hh, cx - hh, fy1, cz + hh, MATS.tile);
      pushBox(cx + hh, fy0, cz - hh, bx1, fy1, cz + hh, MATS.tile);

      // 竖井（无底 → 深渊）
      pushBox(cx - hh - 0.5, wBot, cz - hh - 0.5, cx + hh + 0.5, fy1, cz - hh, MATS.conc);
      pushBox(cx - hh - 0.5, wBot, cz + hh, cx + hh + 0.5, fy1, cz + hh + 0.5, MATS.conc);
      pushBox(cx - hh - 0.5, wBot, cz - hh, cx - hh, fy1, cz + hh, MATS.conc);
      pushBox(cx + hh, wBot, cz - hh, cx + hh + 0.5, fy1, cz + hh, MATS.conc);

      // 层叠跌落的阶梯水池（+x 侧，四级）
      for (let k = 1; k <= 3; k++){
        const top = S.Y_POOL + k * 0.86;
        pushBox(bx1 - (4 - k) * 0.95, wTop, bz0, bx1, top, bz1, MATS.tile);
      }
      // 台阶下的灯带（水面下弱光）
      pushBox(bx0, -1.42, bz0 - 0.05, bx1, -1.28, bz0 + 0.05, MATS.glow);
      pushBox(bx0, -1.42, bz1 - 0.05, bx1, -1.28, bz1 + 0.05, MATS.glow);
    }
  }

  // ---- 水中不明物体（剪影）----
  const sil = MATS.silh;
  pushSphere(19.5, -9.4, 19.5, 2.25, sil);      // 中央竖井中的巨大轮廓
  pushSphere(19.5, -17.0, 19.5, 1.55, sil);
  pushSphere(6.5, -8.0, 19.5, 1.15, sil);
  pushSphere(32.5, -13.5, 6.5, 2.60, sil);
  pushSphere(6.5, -12.0, 32.5, 1.90, sil);
  pushSphere(23.5, -2.35, 21.6, 0.62, sil);     // 悬浮于水中（近处）
  pushSphere(15.2, -2.75, 17.4, 0.48, sil);
  pushSphere(25.4, -3.10, 15.8, 0.85, sil);
  pushSphere(11.5, -2.10, 26.4, 0.38, sil);
  pushSphere(30.0, -2.90, 24.5, 1.05, sil);
}

//  场景纹理打包 + 均匀网格加速结构
// ============================================================
const OBJ_TEX = 8;
let sceneW = 0, gridW = 0, numObjects = 0;

function packSceneTex(){
  numObjects = objs.length;
  sceneW = numObjects * OBJ_TEX;
  const data = new Float32Array(sceneW * 4);
  for (let i = 0; i < numObjects; i++){
    const o = objs[i], b = i * OBJ_TEX * 4, m = o.m;
    for (let k = 0; k < 16; k++) data[b + k] = o.inv[k];
    data[b + 16] = m.albedo[0]; data[b + 17] = m.albedo[1]; data[b + 18] = m.albedo[2];
    data[b + 19] = m.rough;
    data[b + 20] = m.metal; data[b + 21] = m.trans; data[b + 22] = m.ior; data[b + 23] = m.id;
    data[b + 24] = o.shape; data[b + 25] = m.emis; data[b + 26] = 0; data[b + 27] = 0;
    data[b + 28] = 0; data[b + 29] = 0; data[b + 30] = 0; data[b + 31] = 0;
  }
  return data;
}

function buildGrid(){
  const pad = 0.2;
  let mnx = 1e9, mny = 1e9, mnz = 1e9, mxx = -1e9, mxy = -1e9, mxz = -1e9;
  for (let i = 0; i < objs.length; i++){
    const o = objs[i];
    mnx = Math.min(mnx, o.lo[0]); mny = Math.min(mny, o.lo[1]); mnz = Math.min(mnz, o.lo[2]);
    mxx = Math.max(mxx, o.hi[0]); mxy = Math.max(mxy, o.hi[1]); mxz = Math.max(mxz, o.hi[2]);
  }
  const gmin = [mnx - pad, mny - pad, mnz - pad];
  const gmax = [mxx + pad, mxy + pad, mxz + pad];
  const cs = 2.6;
  const dx = Math.max(1, Math.ceil((gmax[0] - gmin[0]) / cs));
  const dy = Math.max(1, Math.ceil((gmax[1] - gmin[1]) / cs));
  const dz = Math.max(1, Math.ceil((gmax[2] - gmin[2]) / cs));
  const nCells = dx * dy * dz;

  const lists = new Array(nCells);
  for (let c = 0; c < nCells; c++) lists[c] = [];

  const idxOf = function(v, o, n){
    const t = Math.floor((v - gmin[o]) / cs);
    return t < 0 ? 0 : (t >= n ? n - 1 : t);
  };
  for (let i = 0; i < objs.length; i++){
    const o = objs[i];
    const ax = idxOf(o.lo[0], 0, dx), bx = idxOf(o.hi[0], 0, dx);
    const ay = idxOf(o.lo[1], 1, dy), by = idxOf(o.hi[1], 1, dy);
    const az = idxOf(o.lo[2], 2, dz), bz = idxOf(o.hi[2], 2, dz);
    for (let z = az; z <= bz; z++)
      for (let y = ay; y <= by; y++)
        for (let x = ax; x <= bx; x++)
          lists[(z * dy + y) * dx + x].push(i);
  }

  let totalIdx = 0;
  for (let c = 0; c < nCells; c++) totalIdx += lists[c].length;
  const totalTexels = 3 + nCells + totalIdx;
  const data = new Float32Array(totalTexels * 4);
  const put = function(t, a, b, c, d){
    data[t * 4] = a; data[t * 4 + 1] = b; data[t * 4 + 2] = c; data[t * 4 + 3] = d;
  };
  put(0, gmin[0], gmin[1], gmin[2], cs);
  put(1, dx, dy, dz, nCells);
  put(2, 3, 3 + nCells, 0, 0);

  let idxCur = 0;
  for (let c = 0; c < nCells; c++){
    const L = lists[c];
    put(3 + c, idxCur, L.length, 0, 0);
    for (let k = 0; k < L.length; k++) put(3 + nCells + idxCur + k, L[k], 0, 0, 0);
    idxCur += L.length;
  }
  gridW = totalTexels;
  return data;
}

const cam = {
  pos: [21.5, -3.30, 22.4],
  yaw: 0, pitch: 0,
  speed: 4.0,
  vel: [0, 0, 0],
  auto: false,
  frozen: false
};

const PRESETS = [
  { name: '池底·焦散', pos: [21.5, -3.30, 22.4], tgt: [18.3, -5.50, 19.2] },
  { name: '水面·斯涅尔窗', pos: [21.5, -0.70, 22.4], tgt: [19.3, 1.60, 19.4] },
  { name: '深渊·俯视', pos: [19.5, -3.60, 21.0], tgt: [19.5, -22.0, 19.5] }
];

function setLook(pos, tgt){
  cam.pos[0] = pos[0]; cam.pos[1] = pos[1]; cam.pos[2] = pos[2];
  let dx = tgt[0] - pos[0], dy = tgt[1] - pos[1], dz = tgt[2] - pos[2];
  const L = Math.hypot(dx, dy, dz) || 1;
  dx /= L; dy /= L; dz /= L;
  cam.pitch = Math.asin(Math.max(-1, Math.min(1, dy)));
  cam.yaw = Math.atan2(-dx, -dz);
  cam.vel[0] = cam.vel[1] = cam.vel[2] = 0;
}

function camBasis(){
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const fwd = [-sy * cp, sp, -cy * cp];
  const right = [cy, 0, -sy];
  const up = [
    right[1] * fwd[2] - right[2] * fwd[1],
    right[2] * fwd[0] - right[0] * fwd[2],
    right[0] * fwd[1] - right[1] * fwd[0]
  ];
  return { fwd: fwd, right: right, up: up };
}

const keys = Object.create(null);
let dragging = false, lastX = 0, lastY = 0;

canvasEl.addEventListener('mousedown', function(e){
  if (e.button !== 0) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvasEl.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', function(){
  dragging = false; canvasEl.style.cursor = 'crosshair';
});
window.addEventListener('mousemove', function(e){
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  cam.yaw -= dx * 0.0026;
  cam.pitch = Math.max(-1.53, Math.min(1.53, cam.pitch - dy * 0.0026));
});
canvasEl.addEventListener('touchstart', function(e){
  if (e.touches.length === 1){
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
}, { passive: true });
canvasEl.addEventListener('touchmove', function(e){
  if (!dragging || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - lastX, dy = t.clientY - lastY;
  lastX = t.clientX; lastY = t.clientY;
  cam.yaw -= dx * 0.0040;
  cam.pitch = Math.max(-1.53, Math.min(1.53, cam.pitch - dy * 0.0040));
}, { passive: true });
canvasEl.addEventListener('touchend', function(){ dragging = false; });

canvasEl.addEventListener('wheel', function(e){
  e.preventDefault();
  cam.speed = Math.max(0.4, Math.min(40, cam.speed * (e.deltaY > 0 ? 0.86 : 1.16)));
}, { passive: false });

window.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'h'){ togglePanels(); }
  if (k === 'p'){ cam.frozen = !cam.frozen; }
  if (k === 'g'){ cam.auto = !cam.auto; syncButtons(); }
  if (k === 'r'){ resetAccum(); }
  if (k === '1' || k === '2' || k === '3'){
    const p = PRESETS[parseInt(k, 10) - 1];
    setLook(p.pos, p.tgt);
    resetAccum();
  }
  if (['w','a','s','d','q','e',' ','shift','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', function(){ for (const k in keys) keys[k] = false; dragging = false; });

let panelsHidden = false;

  if (keys['d'] || keys['arrowright']) mx += 1;
  let uy = 0;
  if (keys['e'] || keys[' ']) uy += 1;
  if (keys['q']) uy -= 1;
  if (cam.auto) mz += 0.22;

  const sp = cam.speed * (keys['shift'] ? 3.0 : 1.0);
  const len = Math.hypot(mx, my, mz) || 1;
  const tx = (b.fwd[0] * mz + b.right[0] * mx) / len * sp;
  const ty = (b.fwd[1] * mz + b.right[1] * mx) / len * sp + uy * sp;
  const tz = (b.fwd[2] * mz + b.right[2] * mx) / len * sp;
  const k = 1 - Math.exp(-dt * 9.0);
  cam.vel[0] += (tx - cam.vel[0]) * k;
  cam.vel[1] += (ty - cam.vel[1]) * k;
  cam.vel[2] += (tz - cam.vel[2]) * k;
  cam.pos[0] += cam.vel[0] * dt;
  cam.pos[1] += cam.vel[1] * dt;
  cam.pos[2] += cam.vel[2] * dt;

  const v = Math.hypot(cam.vel[0], cam.vel[1], cam.vel[2]);
  const active = (v > 0.02) || dragging;
  return active;
}
// ============================================================
//  参数 + 控制面板
// ============================================================
const P = {
  scale: 0.65, spp: 2, bounces: 5, win: 16, auto: 1,
  waveAmp: 1.60, waveSpeed: 1.0, ior: 1.333,
  murk: 1.0, scatter: 1.0, caustic: 0.95, hg: 0.55,
  sunElev: 57, sunAzim: 38, sunE: 8.0, skyRad: 0.32, slit: 0.46,
  exposure: 1.25, vignette: 0.55, aberration: 0.45, grain: 0.18,
  saturation: 1.06, tintR: 0.94, tintG: 1.00, tintB: 1.03
};

const CTRL = [
  { g: '渲染 / RENDER' },
  { k: 'scale', l: '分辨率缩放', min: 0.30, max: 1.00, step: 0.02, f: 2, on: 1 },
  { k: 'spp', l: '每帧采样', min: 1, max: 6, step: 1, u: ' spp' },
  { k: 'bounces', l: '路径深度', min: 2, max: 8, step: 1 },
  { k: 'win', l: '累积窗口', min: 1, max: 40, step: 1, u: ' 帧' },
  { k: 'auto', l: '自动性能适配', min: 0, max: 1, step: 1, u: '' },
  { g: '水体 / WATER' },
  { k: 'waveAmp', l: '波幅', min: 0, max: 4, step: 0.05, f: 2 },
  { k: 'waveSpeed', l: '波速', min: 0, max: 3, step: 0.05, f: 2 },
  { k: 'murk', l: '浑浊度', min: 0.05, max: 3, step: 0.05, f: 2 },
  { k: 'scatter', l: '散射强度', min: 0, max: 4, step: 0.05, f: 2 },
  { k: 'hg', l: '前向散射 g', min: -0.6, max: 0.9, step: 0.02, f: 2 },
  { k: 'caustic', l: '焦散强度', min: 0, max: 1, step: 0.02, f: 2 },
  { k: 'ior', l: '折射率', min: 1.0, max: 2.0, step: 0.005, f: 3 },
  { g: '光照 / LIGHT' },
  { k: 'sunE', l: '太阳强度', min: 0, max: 20, step: 0.1, f: 1 },
  { k: 'sunElev', l: '太阳高度', min: 8, max: 88, step: 1, u: '°' },
  { k: 'sunAzim', l: '太阳方位', min: 0, max: 360, step: 1, u: '°' },
  { k: 'skyRad', l: '天光强度', min: 0, max: 2, step: 0.01, f: 2 },
  { k: 'slit', l: '天窗占比', min: 0, max: 1, step: 0.01, f: 2 },
  { g: '后处理 / GRADE' },
  { k: 'exposure', l: '曝光', min: 0.2, max: 6, step: 0.05, f: 2, noReset: 1 },
  { k: 'saturation', l: '饱和度', min: 0, max: 2, step: 0.01, f: 2, noReset: 1 },
  { k: 'vignette', l: '暗角', min: 0, max: 1, step: 0.01, f: 2, noReset: 1 },
  { k: 'aberration', l: '色散', min: 0, max: 3, step: 0.01, f: 2, noReset: 1 },
  { k: 'grain', l: '颗粒', min: 0, max: 1.5, step: 0.01, f: 2, noReset: 1 },
  { k: 'tintR', l: '色调 R', min: 0.5, max: 1.4, step: 0.01, f: 2, noReset: 1 },
  { k: 'tintG', l: '色调 G', min: 0.5, max: 1.4, step: 0.01, f: 2, noReset: 1 },
  { k: 'tintB', l: '色调 B', min: 0.5, max: 1.4, step: 0.01, f: 2, noReset: 1 }
];

function fmtOf(c, v){
  if (c.u !== undefined && c.u !== '') return (c.f ? v.toFixed(c.f) : String(v)) + c.u;
  if (c.f) return v.toFixed(c.f);
  if (c.k === 'auto') return v >= 0.5 ? '开' : '关';
  return String(v);
}

function buildGUI(){
  const body = document.getElementById('gui-body');
  if (!body) return;
  body.innerHTML = '';
  for (let i = 0; i < CTRL.length; i++){
    const c = CTRL[i];
    if (c.g){
      const d = document.createElement('div');
      d.className = 'grp'; d.textContent = c.g;
      body.appendChild(d);
      continue;
    }
    const wrap = document.createElement('div'); wrap.className = 'ctl';
    const lab = document.createElement('div'); lab.className = 'lab';
    const s1 = document.createElement('span'); s1.textContent = c.l;
    const s2 = document.createElement('span'); s2.id = 'v_' + c.k; s2.textContent = fmtOf(c, P[c.k]);
    lab.appendChild(s1); lab.appendChild(s2);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = P[c.k];
    inp.id = 'i_' + c.k;
    inp.addEventListener('input', function(){
      P[c.k] = parseFloat(inp.value);
      s2.textContent = fmtOf(c, P[c.k]);
      if (c.on) resizeRT();
      else if (!c.noReset) resetAccum();
    });
    wrap.appendChild(lab); wrap.appendChild(inp);
    body.appendChild(wrap);
  }
  // 按钮组
  const btns = document.createElement('div');
  btns.className = 'btns';
  const defs = [
    ['水下视角', 0], ['水面视角', 1], ['深渊视角', 2],
    ['冻结水体', 3], ['自动漫游', 4], ['重置累积', 5]
  ];
  for (let i = 0; i < defs.length; i++){
    const b = document.createElement('button');
    b.textContent = defs[i][0];
    b.dataset.id = defs[i][1];
    b.addEventListener('click', function(){ onButton(defs[i][1]); });
    btns.appendChild(b);
  }
  body.appendChild(btns);
  syncButtons();
}

function onButton(id){
  if (id <= 2){
    setLook(PRESETS[id].pos, PRESETS[id].tgt);
    resetAccum();
  } else if (id === 3){
    cam.frozen = !cam.frozen; syncButtons();
  } else if (id === 4){
    cam.auto = !cam.auto; syncButtons();
  } else {
    resetAccum();
  }
}

function syncButtons(){
  const btns = document.querySelectorAll('#gui-body .btns button');
  if (!btns.length) return;
  btns[3].classList.toggle('on', cam.frozen);
  btns[4].classList.toggle('on', cam.auto);
}

const guiHead = document.getElementById('gui-head');
if (guiHead){
  guiHead.addEventListener('click', function(){
    const b = document.getElementById('gui-body');
    const f = document.getElementById('gui-fold');
    const hid = b.style.display === 'none';
    b.style.display = hid ? '' : 'none';
    f.textContent = hid ? '−' : '+';
  });
}
// ============================================================
//  初始化与渲染循环
// ============================================================
let progPT = null, progDisp = null;
let texScene = null, texGrid = null;
let rtA = null, rtB = null, rtRead = null, rtWrite = null;
let internalW = 0, internalH = 0;
let histFrames = 0, frameIndex = 0, needClear = true;
let simTime = 0;
const MAX_DIST = 220.0;
let emaMs = 16.0, sinceAdapt = 0;

function resetAccum(){ histFrames = 0; needClear = true; }

function layoutRow(n, maxTex){
  const cap = Math.min(maxTex, 8192);
  let w = 1;
  while (w * 2 <= cap && w * 2 <= n) w *= 2;
  let h = Math.ceil(n / w);
  while (h > maxTex && w < cap){ w *= 2; h = Math.ceil(n / w); }
  return { w: w, h: h, shift: Math.round(Math.log2(w)) };
}

function makeDataTex(data, w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function resizeRT(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.0);
  const cw = Math.max(96, Math.floor((canvasEl.clientWidth || 960) * dpr));
  const ch = Math.max(96, Math.floor((canvasEl.clientHeight || 540) * dpr));
  canvasEl.width = cw;
  canvasEl.height = ch;
  internalW = Math.max(64, Math.floor(cw * P.scale));
  internalH = Math.max(64, Math.floor(ch * P.scale));
  freeRT(rtA); freeRT(rtB);
  rtA = makeRT(internalW, internalH);
  rtB = makeRT(internalW, internalH);
  rtRead = rtA; rtWrite = rtB;
  clearRT(rtA); clearRT(rtB);
  resetAccum();
  const el = document.getElementById('s-res');
  if (el) el.textContent = internalW + '×' + internalH;
  const es = document.getElementById('s-scale');
  if (es) es.textContent = P.scale.toFixed(2);
  const ei = document.getElementById('i_scale');
  if (ei) ei.value = P.scale;
  const ev = document.getElementById('v_scale');
  if (ev) ev.textContent = P.scale.toFixed(2);
}

function setU(prog, name, kind, v){
  const loc = prog.u[name];
  if (!loc) return;
  if (kind === 0) gl.uniform1f(loc, v);
  else if (kind === 1) gl.uniform1i(loc, v);
  else if (kind === 2) gl.uniform2f(loc, v[0], v[1]);
  else gl.uniform3f(loc, v[0], v[1], v[2]);
}

let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastT){ lastT = now; return; }
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  emaMs = emaMs * 0.93 + (dt * 1000) * 0.07;   // 平滑帧时（用于自动降采样）

  const moving = updateCamera(dt);
  if (!cam.frozen) simTime += dt * P.waveSpeed;
  if (moving) histFrames = 0;
  let blend = 0;
  if (!moving && P.win > 1){
    histFrames++;
    const n = Math.min(histFrames, P.win);
    blend = (n - 1) / n;
  }
  frameIndex++;

  // 自动性能适配
  if (P.auto >= 0.5 && now > sinceAdapt){
    if ((emaMs > 42 && P.scale > 0.32) || (emaMs < 12.5 && P.scale < 1.0)){
      P.scale = emaMs > 42 ? Math.max(0.30, P.scale * 0.84) : Math.min(1.0, P.scale * 1.07);
      resizeRT();
      sinceAdapt = now + 2600;
      emaMs = 20;
    }
  }
  if (needClear){ clearRT(rtRead); clearRT(rtWrite); needClear = false; }

  const b = camBasis();
  const el = P.sunElev * Math.PI / 180, az = P.sunAzim * Math.PI / 180;
  const sunDir = [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];

  // ---------- Pass 1 : 路径追踪 ----------
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtWrite.fbo);
  gl.viewport(0, 0, internalW, internalH);
  gl.useProgram(progPT.prog);
  gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texGrid);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, rtRead.tex);
  setU(progPT, 'u_scene', 1, 0);
  setU(progPT, 'u_grid', 1, 1);
  setU(progPT, 'u_history', 1, 2);
  setU(progPT, 'u_res', 2, [internalW, internalH]);
  setU(progPT, 'u_camPos', 3, cam.pos);
  setU(progPT, 'u_camRight', 3, b.right);
  setU(progPT, 'u_camUp', 3, b.up);
  setU(progPT, 'u_camFwd', 3, b.fwd);
  setU(progPT, 'u_tanHalf', 0, 0.60);
  setU(progPT, 'u_frame', 1, frameIndex % 100000);
  setU(progPT, 'u_spp', 1, moving ? 1 : Math.round(P.spp));   // 移动中强制单采样
  setU(progPT, 'u_bounces', 1, Math.round(P.bounces));
  setU(progPT, 'u_time', 0, simTime);
  setU(progPT, 'u_blend', 0, blend);
  setU(progPT, 'u_waveAmp', 0, P.waveAmp);
  setU(progPT, 'u_waterIor', 0, P.ior);
  setU(progPT, 'u_waterSigA', 3, [0.150 * P.murk, 0.045 * P.murk, 0.032 * P.murk]);
  setU(progPT, 'u_waterSigS', 0, 0.055 * P.scatter);
  setU(progPT, 'u_waterG', 0, P.hg);
  setU(progPT, 'u_airSigA', 3, [0.004, 0.005, 0.006]);
  setU(progPT, 'u_airSigS', 0, 0.010);
  setU(progPT, 'u_sunDir', 3, sunDir);
  setU(progPT, 'u_sunE', 3, [P.sunE * 0.92, P.sunE * 0.97, P.sunE * 1.06]);
  setU(progPT, 'u_sunCos', 0, 0.99985);
  setU(progPT, 'u_skyRad', 3, [P.skyRad * 0.72, P.skyRad * 0.92, P.skyRad]);
  setU(progPT, 'u_slit', 0, P.slit);
  setU(progPT, 'u_caustic', 0, P.caustic);
  setU(progPT, 'u_maxDist', 0, MAX_DIST);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ---------- Pass 2 : 显示 ----------
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvasEl.width, canvasEl.height);
  gl.useProgram(progDisp.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rtWrite.tex);
  setU(progDisp, 'u_tex', 1, 0);
  setU(progDisp, 'u_res', 2, [internalW, internalH]);
  setU(progDisp, 'u_canvas', 2, [canvasEl.width, canvasEl.height]);
  setU(progDisp, 'u_exposure', 0, P.exposure);
  setU(progDisp, 'u_vignette', 0, P.vignette);
  setU(progDisp, 'u_aberration', 0, P.aberration * 0.01);
  setU(progDisp, 'u_grain', 0, P.grain);
  setU(progDisp, 'u_saturation', 0, P.saturation);
  setU(progDisp, 'u_time', 0, now * 0.001);
  setU(progDisp, 'u_tint', 3, [P.tintR, P.tintG, P.tintB]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const tmp = rtRead; rtRead = rtWrite; rtWrite = tmp;

  if ((frameIndex & 7) === 0) updateHUD(dt, moving);
}

function updateHUD(dt, moving){
  const s = function(id, v){ const e = document.getElementById(id); if (e) e.textContent = v; };
  s('s-fps', (1 / Math.max(dt, 1e-4)).toFixed(0));
  s('s-ms', (dt * 1000).toFixed(1));
  s('s-acc', histFrames);
  s('s-spp', Math.round(P.spp));
  s('s-bnc', Math.round(P.bounces));
  s('s-state', moving ? '漫游中 / 采样重置' : (cam.frozen ? '时间冻结 / 累积中' : '累积中'));
  s('s-obj', numObjects);
  s('s-cell', gridW ? (gridW + ' texel') : '-');
  s('s-depth', (-cam.pos[1]).toFixed(2) + ' m');
  s('s-pos', cam.pos[0].toFixed(1) + ', ' + cam.pos[1].toFixed(1) + ', ' + cam.pos[2].toFixed(1));
  const bar = document.getElementById('bar');
  if (bar) bar.style.width = Math.min(100, (histFrames / Math.max(1, P.win)) * 100) + '%';
}

let resizeTimer = 0;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeRT, 160);
});

// ============================================================
//  启动
// ============================================================
function boot(){
  try {
    bootMsg.textContent = '生成泳池廊道结构…';
    buildScene();
    bootMsg.textContent = '打包场景与加速结构…';
    const sd = packSceneTex();
    const gd = buildGrid();
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const LS = layoutRow(sceneW, maxTex);
    const LG = layoutRow(gridW, maxTex);
    const sdP = new Float32Array(LS.w * LS.h * 4);
    sdP.set(sd);
    const gdP = new Float32Array(LG.w * LG.h * 4);
    gdP.set(gd);
    texScene = makeDataTex(sdP, LS.w, LS.h);
    texGrid = makeDataTex(gdP, LG.w, LG.h);

    bootMsg.textContent = '编译路径追踪着色器…';
    const PT_SRC = GLSL_HEAD +
      '#define SW_SHIFT ' + LS.shift + '\n#define GW_SHIFT ' + LG.shift + '\n' +
      GLSL_SCENE + GLSL_WATER + GLSL_TRACE;
    progPT = makeProgram(GLSL_VS, PT_SRC, 'pathtrace');
    progDisp = makeProgram(GLSL_VS, GLSL_DISPLAY, 'display');

    buildGUI();
    setLook(PRESETS[0].pos, PRESETS[0].tgt);
    resizeRT();
    bootMsg.textContent = '就绪';
    setTimeout(function(){ bootEl.classList.add('gone'); }, 120);
    requestAnimationFrame(loop);
  } catch (err){
    bootFail('启动异常：' + (err && err.message ? err.message : String(err)));
  }
}

if (gl && RT_INTERNAL) boot();
