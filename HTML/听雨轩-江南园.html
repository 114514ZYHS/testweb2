<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>听雨轩 · 江南园 — 宋明江南私家园林</title>
<style>
:root{
  --ink:#e9e2d4; --ink-dim:#b9b0a0; --gold:#c8a86a; --panel:rgba(18,20,22,.62);
  --line:rgba(200,168,106,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0c0e;
  font-family:"Songti SC","STSong","Noto Serif SC",'Source Han Serif SC',"SimSun",serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- loader ---------- */
#loader{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #1b2126 0%, #0a0c0e 70%);
  transition:opacity 1.1s ease, visibility 1.1s;}
#loader.gone{opacity:0;visibility:hidden}
.loader-inner{text-align:center;max-width:560px;padding:0 24px}
.seal{width:64px;height:64px;line-height:60px;margin:0 auto 22px;border:2px solid #9d3b30;color:#c04a3c;
  font-size:19px;letter-spacing:2px;border-radius:4px;opacity:.92;transform:rotate(-2deg)}
.loader-inner h1{font-size:30px;letter-spacing:.34em;margin:0 0 10px;font-weight:400;text-indent:.34em}
.loader-inner .sub{color:var(--ink-dim);font-size:13px;letter-spacing:.22em;margin:0 0 30px;text-indent:.22em}
.bar{height:2px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden;margin:0 auto;width:280px}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7d6a3f,#e2c98a);transition:width .35s}
.tip{font-size:12px;color:#8a8477;letter-spacing:.16em;margin-top:16px;height:16px}

/* ---------- cinema title ---------- */
#cinema-title{position:absolute;left:0;right:0;top:9%;text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity 1.6s}
#cinema-title.show{opacity:1}
.ct-main{font-size:clamp(28px,4.4vw,62px);letter-spacing:.42em;text-indent:.42em;color:#f2ece0;
  text-shadow:0 2px 30px rgba(0,0,0,.75),0 0 90px rgba(0,0,0,.5)}
.ct-sub{margin-top:14px;font-size:clamp(11px,1.2vw,15px);letter-spacing:.5em;text-indent:.5em;color:#cfc6b4;text-shadow:0 2px 18px rgba(0,0,0,.8)}

/* ---------- hint ---------- */
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
  font-size:12px;letter-spacing:.18em;color:rgba(233,226,212,.62);text-shadow:0 1px 8px #000;
  pointer-events:none;transition:opacity .5s}
#hint.gone{opacity:0}

/* ---------- panel ---------- */
#panel{position:absolute;top:18px;right:18px;z-index:30;width:286px;padding:16px 16px 12px;
  background:var(--panel);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  transition:opacity .45s, transform .45s}
#panel.gone{opacity:0;transform:translateX(14px) scale(.98);pointer-events:none}
.panel-head{margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.panel-head .title{font-size:16px;letter-spacing:.2em}
.panel-head .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.16em;margin-top:4px}
.row{display:flex;align-items:center;gap:8px;margin:9px 0}
.row label{width:30px;font-size:11.5px;color:var(--ink-dim);letter-spacing:.1em;flex:none}
.row .val{font-size:11.5px;color:var(--gold);min-width:76px;text-align:right;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.row.btns{flex-wrap:wrap;gap:6px}
.row.keys{flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font-size:10.5px;color:rgba(185,176,160,.78);letter-spacing:.04em}
.row.keys b{color:var(--gold);font-weight:400}
button{font-family:inherit;font-size:11.5px;color:var(--ink);letter-spacing:.12em;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:5px;
  padding:6px 10px;cursor:pointer;transition:background .22s,border-color .22s,color .22s}
button:hover{background:rgba(200,168,106,.16);border-color:rgba(200,168,106,.45)}
button.on{background:rgba(200,168,106,.22);border-color:rgba(200,168,106,.62);color:#f3e6c8}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--gold);margin-top:-4.5px;box-shadow:0 0 8px rgba(200,168,106,.7)}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--gold)}

#fps{position:absolute;left:14px;bottom:12px;z-index:20;font-size:11px;color:rgba(233,226,212,.5);
  letter-spacing:.1em;font-variant-numeric:tabular-nums;pointer-events:none}

#crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
  background:rgba(255,255,255,.5);box-shadow:0 0 5px rgba(0,0,0,.9);z-index:15;opacity:0;transition:opacity .3s;pointer-events:none}
#crosshair.on{opacity:.75}

body.cinema #panel,body.cinema #hint,body.cinema #fps{opacity:0;pointer-events:none}
body.cinema{cursor:none}

</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <!-- 载入界面 -->
  <div id="loader">
    <div class="loader-inner">
      <div class="seal">聽雨</div>
      <h1>听雨轩 · 江南园</h1>
      <p class="sub">宋明江南私家园林 · 木构营造与陈设<br><span style="font-size:11px;opacity:.7;letter-spacing:.14em">单文件离线版 · 贴图与几何实时生成</span></p>
      <div class="bar"><i id="loadbar"></i></div>
      <p class="tip" id="loadtip">正在营造…</p>
    </div>
  </div>

  <!-- 标题（电影模式） -->
  <div id="cinema-title">
    <div class="ct-main">听 雨 轩</div>
    <div class="ct-sub">江南园 · 雨后</div>
  </div>

  <!-- 提示 -->
  <div id="hint">
    <span id="hint-text">左键拖动环绕 · 滚轮远近 · 右键平移</span>
  </div>

  <!-- 控制面板 -->
  <div id="panel">
    <div class="panel-head">
      <div class="title">听雨轩 · 江南园</div>
      <div class="sub">宋明江南私家园林</div>
    </div>

    <div class="row">
      <label>时辰</label>
      <input id="time" type="range" min="0" max="24" step="0.01" value="8.4" />
      <span class="val" id="timeval">辰时 08:24</span>
    </div>

    <div class="row btns">
      <button data-preset="6.0">晨</button>
      <button data-preset="9.2">昼</button>
      <button data-preset="17.6">暮</button>
      <button data-preset="21.5">夜</button>
      <button id="autocycle" class="toggle">时光流转</button>
    </div>

    <div class="row btns">
      <button id="campreset" data-cam="orbit" class="on">环绕俯瞰</button>
      <button data-cam="first">第一人称漫游</button>
    </div>

    <div class="row">
      <label>雨</label>
      <input id="rain" type="range" min="0" max="1" step="0.01" value="0.55" />
      <span class="val" id="rainval">细雨</span>
    </div>

    <div class="row btns">
      <button data-rain="0.0">雨后</button>
      <button data-rain="0.35">微雨</button>
      <button data-rain="0.75">细雨</button>
      <button data-rain="1.0">霖雨</button>
    </div>

    <div class="row btns">
      <button id="qbtn" data-q="high">画质 高</button>
      <button id="cbtn">电影模式</button>
      <button id="hbtn">隐藏界面</button>
    </div>

    <div class="row keys" id="keys-hint">
      <span><b>W A S D</b> 行走</span><span><b>Shift</b> 疾行</span><span><b>空格/C</b> 蹲起</span>
      <span><b>鼠标</b> 视角</span><span><b>Esc</b> 退出漫游</span><span><b>1/2</b> 切换视角</span>
      <span><b>T</b> 昼夜</span><span><b>H</b> 界面</span><span><b>P</b> 截图</span>
    </div>
  </div>

  <div id="fps"></div>
  <div id="crosshair"></div>
</div>
