<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shor's Algorithm 3D Interactive Demonstration</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- MathJax v3 -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  },
  svg: { fontCache: 'global' },
  options: { enableMenu: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<!-- Three.js import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root {
  --bg: #0d1117;
  --panel: #1e1e1e;
  --panel2: #161b22;
  --border: #30363d;
  --text: #d4d4d4;
  --muted: #8b949e;
  --accent: #f0b429;
  --blue: #569cd6;
  --yellow: #dcdcaa;
  --orange: #ce9178;
  --green: #6a9955;
  --cyan: #4ec9b0;
  --purple: #c586c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Source Han Sans', sans-serif;
  font-size: 14px;
  user-select: none;
}

/* Top toolbar */
#toolbar {
  height: 60px;
  min-height: 60px;
  background: #010409;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  z-index: 10;
  position: relative;
}
#toolbar .title {
  font-weight: 700;
  font-size: 16px;
  color: #f0f6fc;
  white-space: nowrap;
  letter-spacing: 0.3px;
}
#toolbar .controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
  margin-left: auto;
}
#toolbar select {
  background: #21262d;
  color: #f0f6fc;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
#toolbar select:hover { border-color: #8b949e; }
#toolbar label {
  font-size: 12px;
  color: var(--muted);
  margin-right: 2px;
}
#toolbar button {
  background: #21262d;
  border: 1px solid var(--border);
  color: #f0f6fc;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  transition: background 0.15s, border-color 0.15s;
}
#toolbar button:hover { background: #30363d; border-color: #8b949e; }
#toolbar button.active { background: #1f3a5f; border-color: #58a6ff; }
#step-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #79c0ff;
  background: #0d1b2a;
  border: 1px solid #1f3a5f;
  border-radius: 20px;
  padding: 4px 12px;
  white-space: nowrap;
}

/* Main layout */
#main {
  display: flex;
  height: calc(100vh - 60px - 34px);
  width: 100%;
  overflow: hidden;
}
#left-panel {
  width: 330px;
  min-width: 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#center-panel {
  flex: 1;
  position: relative;
  background: #111827;
  overflow: hidden;
}
#right-panel {
  width: 410px;
  min-width: 320px;
  background: #0d1117;
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 18px;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}

/* IDE code panel */
#code-header {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: #8b949e;
  background: #161b22;
  border-bottom: 1px solid var(--border);
}
#code-lines {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.65;
  scrollbar-width: thin;
  scrollbar-color: #30363d transparent;
}
.code-line {
  display: flex;
  align-items: baseline;
  padding: 0 14px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
  white-space: pre;
}
.code-line:hover { background: #252a31; }
.code-line.active-step {
  background: rgba(240, 180, 41, 0.12);
  border-left-color: #f0b429;
}
.line-number {
  width: 32px;
  min-width: 32px;
  color: #6e7681;
  text-align: right;
  margin-right: 14px;
  font-size: 11px;
  user-select: none;
}
.code-line code {
  color: #d4d4d4;
  font-family: inherit;
}
.code-keyword { color: #569cd6; }
.code-function { color: #dcdcaa; }
.code-comment { color: #6a9955; font-style: italic; }
.code-number { color: #b5cea8; }
.code-string { color: #ce9178; }
.code-operator { color: #d4d4d4; }

/* 3D canvas container */
#canvas-container {
  width: 100%;
  height: 100%;
  position: relative;
}
#canvas-container canvas {
  display: block;
}
.css2d-renderer {
  pointer-events: none !important;
}
.css-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #e6edf3;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 5px;
  padding: 2px 6px;
  white-space: nowrap;
  pointer-events: none;
}
.css-label.register-label {
  font-weight: 700;
  color: #79c0ff;
}
.css-label.state-label {
  background: rgba(0,0,0,0.35);
  color: #8b949e;
}

/* Explanation panel */
#explanation-panel {
  scroll-behavior: smooth;
}
#explanation-panel h1, #explanation-panel h2, #explanation-panel h3 {
  color: #f0f6fc;
  margin-bottom: 10px;
  line-height: 1.25;
}
#explanation-panel h1 { font-size: 20px; margin-top: 0; }
#explanation-panel h2 { font-size: 16px; margin-top: 18px; }
#explanation-panel h3 { font-size: 14px; margin-top: 14px; }
#explanation-panel p, #explanation-panel li {
  color: #c9d1d9;
  font-size: 13.5px;
  line-height: 1.6;
  margin-bottom: 10px;
}
#explanation-panel ul, #explanation-panel ol {
  padding-left: 20px;
  margin-bottom: 12px;
}
#explanation-panel .step-context {
  font-size: 12px;
  color: #79c0ff;
  background: #0d1b2a;
  border-left: 3px solid #58a6ff;
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 14px;
}
#explanation-panel .formula-block {
  overflow-x: auto;
  padding: 8px 0;
  scrollbar-width: thin;
}
#explanation-panel .note {
  background: #161b22;
  border-left: 3px solid #8b949e;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 12.5px;
  color: #8b949e;
  margin: 10px 0;
}
#explanation-panel svg {
  max-width: 100%;
  height: auto;
  margin: 10px 0;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
}

/* Bottom status bar */
#status-bar {
  height: 34px;
  min-height: 34px;
  background: #010409;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 20px;
  font-size: 12px;
  color: #8b949e;
  overflow: hidden;
  white-space: nowrap;
}
#status-bar strong {
  color: #e6edf3;
}
#status-state {
  flex: 1;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  color: #9ecbff;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Scrollbars */
#code-lines::-webkit-scrollbar, #right-panel::-webkit-scrollbar {
  width: 10px;
}
#code-lines::-webkit-scrollbar-track, #right-panel::-webkit-scrollbar-track {
  background: transparent;
}
#code-lines::-webkit-scrollbar-thumb, #right-panel::-webkit-scrollbar-thumb {
  background: #30363d;
  border-radius: 5px;
}
</style>
</head>
<body>
  <div id="toolbar">
    <div class="title">Shor's Algorithm 3D Interactive Demonstration</div>
    <div class="controls">
      <label for="N-select">N</label>
      <select id="N-select">
        <option value="15" selected>15</option>
        <option value="21">21</option>
        <option value="33">33</option>
      </select>
      <label for="a-select">a</label>
      <select id="a-select"></select>
      <button id="btn-prev" title="Previous step">⏮ Previous</button>
      <button id="btn-play" title="Auto play / pause">▶ Auto Play</button>
      <button id="btn-next" title="Next step">Next Step ⏭</button>
      <button id="btn-reset" title="Reset">🔄 Reset</button>
      <span id="step-indicator">Step 0/12</span>
    </div>
  </div>

  <div id="main">
    <div id="left-panel">
      <div id="code-header">Pseudocode</div>
      <div id="code-lines"></div>
    </div>
    <div id="center-panel">
      <div id="canvas-container"></div>
    </div>
    <div id="right-panel">
      <div id="explanation-panel"></div>
    </div>
  </div>

  <div id="status-bar">
    <strong id="status-step">Initializing...</strong>
    <span id="status-desc"></span>
    <span id="status-state"></span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    /* ============================================================
       Helpers
    ============================================================ */
    const M = (s) => `\\(${s}\\)`;
    const DM = (s) => `\\[${s}\\]`;
    const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a; };
    const multiplicativeOrder = (a,N) => {
      let val = 1 % N;
      for (let r=1; r<N; r++) {
        val = (val * a) % N;
        if (val === 1) return r;
      }
      return null;
    };
    const coprimeOptions = (N) => {
      const arr = [];
      for (let a=2; a<N; a++) if (gcd(a,N)===1) arr.push(a);
      return arr;
    };
    const computeFactorsFromPeriod = (N,a,r) => {
      if (!r || r % 2 !== 0) return null;
      const half = Math.pow(a, r/2) % N;
      if (half === N-1) return null;
      const p = gcd(half - 1, N);
      const q = gcd(half + 1, N);
      if (p>1 && q>1 && p*N !== q*N && p*q===N) return [p,q];
      return p>1 && q>1 ? [p,q] : null;
    };

    /* ============================================================
       State
    ============================================================ */
    const state = {
      N: 15,
      a: 7,
      period: 4,
      factors: [3,5],
      currentStep: 0,
      playing: false
    };

    /* ============================================================
       Step data
    ============================================================ */
    const steps = [
      { id:0,  name:'Algorithm Overview',                codeLines:[1],            highlight:[],                                 desc:'Overall structure of Shor’s algorithm.' },
      { id:1,  name:'Classical Preprocessing',           codeLines:[2,3,4,5,6,7,8,9], highlight:['init'],                      desc:'Check N even, prime power, gcd(a,N).' },
      { id:2,  name:'Initialize Quantum Registers',      codeLines:[21],           highlight:['init','register-first','register-second'], desc:'State |0⟩⊗4 |1⟩⊗4.' },
      { id:3,  name:'Hadamard Superposition',            codeLines:[22],           highlight:['hadamard-0','hadamard-1','hadamard-2','hadamard-3'], desc:'First register in uniform superposition.' },
      { id:4,  name:'Controlled U^(2^0)',                codeLines:[23,24],        highlight:['controlledU-0'],               desc:'Apply U_a^1 controlled on x0.' },
      { id:5,  name:'Controlled U^(2^1)',                codeLines:[23,24],        highlight:['controlledU-1'],               desc:'Apply U_a^2 controlled on x1.' },
      { id:6,  name:'Controlled U^(2^2)',                codeLines:[23,24],        highlight:['controlledU-2'],               desc:'Apply U_a^4 controlled on x2.' },
      { id:7,  name:'Controlled U^(2^3)',                codeLines:[23,24],        highlight:['controlledU-3'],               desc:'Apply U_a^8 controlled on x3.' },
      { id:8,  name:'Second Register Measurement',       codeLines:[25],           highlight:['meas-second'],                 desc:'Collapse target register.' },
      { id:9,  name:'Inverse Quantum Fourier Transform', codeLines:[26],           highlight:['qft'],                         desc:'QFT† on first register.' },
      { id:10, name:'First Register Measurement',        codeLines:[27],           highlight:['meas-first'],                  desc:'Obtain measurement value y.' },
      { id:11, name:'Continued Fraction Post-processing',codeLines:[28],           highlight:['classical-post'],              desc:'Recover period r from y/Q.' },
      { id:12, name:'Compute Factors',                   codeLines:[14,15,16],     highlight:['output'],                      desc:'gcd(a^{r/2}±1,N) gives factors.' }
    ];

    /* ============================================================
       Pseudocode lines
    ============================================================ */
    const codeLines = [
      { n:1,  text:'def shor(N):', step:0 },
      { n:2,  text:'    if N % 2 == 0:', step:1 },
      { n:3,  text:'        return 2', step:1 },
      { n:4,  text:'    if N == p**q:', step:1 },
      { n:5,  text:'        return p', step:1 },
      { n:6,  text:'    a = random(2, N-1)', step:1 },
      { n:7,  text:'    d = gcd(a, N)', step:1 },
      { n:8,  text:'    if d > 1:', step:1 },
      { n:9,  text:'        return d', step:1 },
      { n:10, text:'    # Quantum period finding', step:1 },
      { n:11, text:'    r = find_period(a, N)', step:0 },
      { n:12, text:'    if r % 2 == 1 or a**(r//2) % N == N-1:', step:1 },
      { n:13, text:'        restart', step:1 },
      { n:14, text:'    p = gcd(a**(r//2)-1, N)', step:12 },
      { n:15, text:'    q = gcd(a**(r//2)+1, N)', step:12 },
      { n:16, text:'    return p, q', step:12 },
      { n:17, text:'', step:0 },
      { n:18, text:'def find_period(a, N):', step:0 },
      { n:19, text:'    n = ceil(log2(N))', step:2 },
      { n:20, text:'    Q = 2**(2*n)', step:2 },
      { n:21, text:'    init |0⟩⊗(2n) |1⟩⊗n', step:2 },
      { n:22, text:'    apply H⊗(2n) to first register', step:3 },
      { n:23, text:'    for j in 0..2n-1:', step:4 },
      { n:24, text:'        apply controlled U_a**(2**j)', step:4 },
      { n:25, text:'    measure second register', step:8 },
      { n:26, text:'    apply QFT† to first register', step:9 },
      { n:27, text:'    measure first register -> y', step:10 },
      { n:28, text:'    r = continued_fraction(y / Q).denominator', step:11 },
      { n:29, text:'    return r', step:11 }
    ];

    /* ============================================================
       Syntax highlighting
    ============================================================ */
    function highlightCode(text) {
      let esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      esc = esc.replace(/(#.*$)/g, '<span class="code-comment">$1</span>');
      esc = esc.replace(/\b(def|if|elif|else|return|for|in|or|and|not|continue|break|import|from|as|raise|pass)\b/g,
                         '<span class="code-keyword">$1</span>');
      esc = esc.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*(?=\()/g,
                         '<span class="code-function">$1</span>');
      esc = esc.replace(/\b(\d+)\b/g, '<span class="code-number">$1</span>');
      return esc;
    }

    /* ============================================================
       DOM refs
    ============================================================ */
    const codeLinesEl = document.getElementById('code-lines');
    const explanationPanel = document.getElementById('explanation-panel');
    const NSelect = document.getElementById('N-select');
    const aSelect = document.getElementById('a-select');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const stepIndicator = document.getElementById('step-indicator');
    const statusStep = document.getElementById('status-step');
    const statusDesc = document.getElementById('status-desc');
    const statusState = document.getElementById('status-state');
    const canvasContainer = document.getElementById('canvas-container');

    /* ============================================================
       Build IDE pseudocode
    ============================================================ */
    codeLines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'code-line';
      div.dataset.line = line.n;
      div.dataset.step = line.step;
      div.innerHTML = `<span class="line-number">${String(line.n).padStart(2,'0')}</span><code>${highlightCode(line.text)}</code>`;
      codeLinesEl.appendChild(div);
    });

    codeLinesEl.addEventListener('click', (e) => {
      const lineEl = e.target.closest('.code-line');
      if (!lineEl) return;
      const stepId = Number(lineEl.dataset.step);
      if (!Number.isNaN(stepId) && stepId >= 0 && stepId < steps.length) setStep(stepId);
    });

    /* ============================================================
       Three.js scene
    ============================================================ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);
    scene.fog = new THREE.Fog(0x111827, 15, 40);

    const camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 100);
    camera.position.set(8, 6, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x111827);
    canvasContainer.appendChild(renderer.domElement);

    const css2DRenderer = new CSS2DRenderer();
    css2DRenderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    css2DRenderer.domElement.classList.add('css2d-renderer');
    css2DRenderer.domElement.style.position = 'absolute';
    css2DRenderer.domElement.style.top = '0';
    css2DRenderer.domElement.style.left = '0';
    canvasContainer.appendChild(css2DRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(2, 0, 2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 25;
    controls.update();

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 12);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0x58a6ff, 0.5, 30);
    pointLight.position.set(2, 5, 2);
    scene.add(pointLight);

    // Grid floor
    const grid = new THREE.GridHelper(24, 20, 0x2d333b, 0x1c2128);
    grid.position.y = -1.2;
    scene.add(grid);

    /* ============================================================
       3D circuit objects
    ============================================================ */
    const interactiveMeshes = [];
    const gaugeNeedles = {};
    const controlledULabelDivs = [];
    let measSecondValueDiv = null;
    let measFirstValueDiv = null;
    let controlledX = [0.0, 1.6, 3.2, 4.8];

    const zFirst = [-1.8, -0.6, 0.6, 1.8];
    const zSecond = [3.2, 3.95, 4.7, 5.45];
    const xStart = -6.5, xEnd = 13.5;
    const registerLabels = [];

    function addCSSLabel(html, pos, className='') {
      const div = document.createElement('div');
      div.className = `css-label ${className}`;
      div.innerHTML = html;
      const label = new CSS2DObject(div);
      label.position.copy(pos);
      scene.add(label);
      return div;
    }

    function createMaterial(color, emissive, opts={}) {
      return new THREE.MeshStandardMaterial({
        color,
        emissive,
        roughness: 0.35,
        metalness: 0.1,
        transparent: true,
        opacity: opts.opacity ?? 0.85,
        emissiveIntensity: opts.emissiveIntensity ?? 0.4,
        depthWrite: false,
        ...opts
      });
    }

    function createWire(z, label, objectId) {
      const length = xEnd - xStart;
      const geo = new THREE.BoxGeometry(length, 0.12, 0.12);
      const mat = createMaterial(0x88ccff, 0x0a1a30, { opacity: 0.95, emissiveIntensity: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((xStart+xEnd)/2, 0, z);
      mesh.userData.objectId = objectId;
      mesh.userData.wire = true;
      scene.add(mesh);
      interactiveMeshes.push(mesh);
      addCSSLabel(label, new THREE.Vector3(xEnd+0.45, 0, z), 'register-label');
      return mesh;
    }

    // First register wires
    zFirst.forEach((z,i) => createWire(z, `x${i}`, 'register-first'));
    // Second register wires
    zSecond.forEach((z,i) => createWire(z, `y${i}`, 'register-second'));

    // Initial state labels
    zFirst.forEach((z,i) => addCSSLabel('|0⟩', new THREE.Vector3(xStart-0.5, 0, z), 'state-label'));
    zSecond.forEach((z,i) => addCSSLabel('|1⟩', new THREE.Vector3(xStart-0.5, 0, z), 'state-label'));

    // Initialization block
    const initBlock = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 8.8),
      createMaterial(0x6e7681, 0x2a2e35, { opacity: 0.5, emissiveIntensity: 0.15 })
    );
    initBlock.position.set(-5.0, 0, 1.825);
    initBlock.userData.objectId = 'init';
    scene.add(initBlock);
    interactiveMeshes.push(initBlock);
    addCSSLabel('INIT', new THREE.Vector3(-5.0, 0.9, 1.825), '');

    // Hadamard gates
    function createHadamard(index) {
      const geo = new THREE.BoxGeometry(0.7, 0.8, 0.8);
      const mat = createMaterial(0x3b82f6, 0x1e40af, { opacity: 0.9, emissiveIntensity: 0.5 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(-2.0, 0, zFirst[index]);
      mesh.userData.objectId = `hadamard-${index}`;
      scene.add(mesh);
      interactiveMeshes.push(mesh);
      addCSSLabel('H', new THREE.Vector3(-2.0, 0.75, zFirst[index]), '');
    }
    zFirst.forEach((_,i) => createHadamard(i));

    // Controlled U modules
    function createControlledU(j) {
      const x = controlledX[j];
      const objectId = `controlledU-${j}`;

      // Control node on first register wire j
      const controlGeo = new THREE.SphereGeometry(0.25, 24, 24);
      const controlMat = createMaterial(0xf59e0b, 0x78350f, { opacity: 0.95, emissiveIntensity: 0.5 });
      const control = new THREE.Mesh(controlGeo, controlMat);
      control.position.set(x, 0, zFirst[j]);
      control.userData.objectId = objectId;
      scene.add(control);
      interactiveMeshes.push(control);

      // Target module over second register wires
      const targetGeo = new THREE.BoxGeometry(1.1, 1.1, 3.2);
      const targetMat = createMaterial(0xf59e0b, 0x78350f, { opacity: 0.8, emissiveIntensity: 0.45 });
      const target = new THREE.Mesh(targetGeo, targetMat);
      target.position.set(x, 0, 4.325);
      target.userData.objectId = objectId;
      scene.add(target);
      interactiveMeshes.push(target);

      // Vertical connector
      const connectorLength = Math.abs(4.325 - zFirst[j]);
      const connectorGeo = new THREE.BoxGeometry(0.08, 0.08, connectorLength);
      const connectorMat = createMaterial(0xf59e0b, 0x78350f, { opacity: 0.35, emissiveIntensity: 0.2 });
      const connector = new THREE.Mesh(connectorGeo, connectorMat);
      connector.position.set(x, 0, (4.325 + zFirst[j])/2);
      connector.userData.objectId = objectId;
      scene.add(connector);
      interactiveMeshes.push(connector);

      const labelDiv = addCSSLabel(`U<sub>${state.a}</sub><sup>2<sup>${j}</sup></sup>`, new THREE.Vector3(x, 1.0, 4.325), '');
      controlledULabelDivs[j] = labelDiv;
    }
    for (let j=0; j<4; j++) createControlledU(j);

    // Measurement gauges
    function createMeasurementGauge(objectId, x, zCenter, zSpan, labelText) {
      const group = new THREE.Group();
      group.position.set(x, 0, zCenter);
      scene.add(group);

      const bodyGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32);
      const bodyMat = createMaterial(0x10b981, 0x064e3b, { opacity: 0.9, emissiveIntensity: 0.5 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI/2;
      body.userData.objectId = objectId;
      group.add(body);
      interactiveMeshes.push(body);

      const faceGeo = new THREE.BoxGeometry(1.0, 1.0, zSpan);
      const faceMat = createMaterial(0x10b981, 0x064e3b, { opacity: 0.55, emissiveIntensity: 0.3 });
      const face = new THREE.Mesh(faceGeo, faceMat);
      face.userData.objectId = objectId;
      group.add(face);
      interactiveMeshes.push(face);

      const needleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.9);
      const needleMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0x880000, emissiveIntensity: 1 });
      const needle = new THREE.Mesh(needleGeo, needleMat);
      needle.position.set(0, 0.15, 0.5);
      needle.userData.objectId = objectId;
      group.add(needle);
      gaugeNeedles[objectId] = needle;

      const labelDiv = addCSSLabel(labelText, new THREE.Vector3(x, 1.0, zCenter), '');
      if (objectId === 'meas-second') measSecondValueDiv = labelDiv;
      if (objectId === 'meas-first') measFirstValueDiv = labelDiv;
      return group;
    }

    createMeasurementGauge('meas-second', 7.0, 4.325, 3.2, 'MEAS');
    createMeasurementGauge('meas-first', 11.0, 0, 5.0, 'MEAS');

    // QFT† module
    const qftGeo = new THREE.BoxGeometry(1.1, 1.2, 5.2);
    const qftMat = createMaterial(0x8b5cf6, 0x4c1d95, { opacity: 0.85, emissiveIntensity: 0.45 });
    const qftMesh = new THREE.Mesh(qftGeo, qftMat);
    qftMesh.position.set(9.0, 0, 0);
    qftMesh.userData.objectId = 'qft';
    scene.add(qftMesh);
    interactiveMeshes.push(qftMesh);
    addCSSLabel('QFT†', new THREE.Vector3(9.0, 0.9, 0), '');

    // Classical post-processing highlight
    const classicalGeo = new THREE.BoxGeometry(0.8, 1.4, 9.0);
    const classicalMat = createMaterial(0xf0b429, 0x8a5a00, { opacity: 0.35, emissiveIntensity: 0.2 });
    const classicalMesh = new THREE.Mesh(classicalGeo, classicalMat);
    classicalMesh.position.set(12.8, 0, 1.825);
    classicalMesh.userData.objectId = 'classical-post';
    scene.add(classicalMesh);
    interactiveMeshes.push(classicalMesh);
    addCSSLabel('classical', new THREE.Vector3(12.8, 1.1, 1.825), '');

    // Output highlight
    const outputGeo = new THREE.BoxGeometry(0.8, 1.4, 9.0);
    const outputMat = createMaterial(0xf0b429, 0x8a5a00, { opacity: 0.45, emissiveIntensity: 0.25 });
    const outputMesh = new THREE.Mesh(outputGeo, outputMat);
    outputMesh.position.set(13.6, 0, 1.825);
    outputMesh.userData.objectId = 'output';
    scene.add(outputMesh);
    interactiveMeshes.push(outputMesh);
    addCSSLabel('output', new THREE.Vector3(13.6, 1.1, 1.825), '');

    /* ============================================================
       Animation pulses
    ============================================================ */
    let pulseMeshes = [];

    function clearPulses() {
      pulseMeshes.forEach(p => scene.remove(p.mesh));
      pulseMeshes = [];
    }

    function addPulse(z, startX, endX, speed=3.2) {
      const geo = new THREE.SphereGeometry(0.12, 16, 16);
      const mat = new THREE.MeshStandardMaterial({ color:0xffff00, emissive:0xffff00, emissiveIntensity:2 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(startX, 0.25, z);
      scene.add(mesh);
      pulseMeshes.push({ mesh, startX, endX, speed });
    }

    function animateDotsForStep(stepId) {
      clearPulses();
      if (stepId === 2) {
        [...zFirst, ...zSecond].forEach(z => addPulse(z, xStart+0.3, -5.0));
      } else if (stepId === 3) {
        zFirst.forEach(z => addPulse(z, -5.0, -2.0));
      } else if (stepId >= 4 && stepId <= 7) {
        const j = stepId - 4;
        addPulse(zFirst[j], -2.0, controlledX[j]);
        zSecond.forEach(z => addPulse(z, -5.0, controlledX[j]));
      } else if (stepId === 8) {
        zSecond.forEach(z => addPulse(z, controlledX[3]+0.5, 7.0));
      } else if (stepId === 9) {
        zFirst.forEach(z => addPulse(z, controlledX[3]+0.5, 9.0));
      } else if (stepId === 10) {
        zFirst.forEach(z => addPulse(z, 9.0, 11.0));
      }
    }

    function updatePulses(dt) {
      const toRemove = [];
      pulseMeshes.forEach(p => {
        if (p.mesh.position.x < p.endX) {
          p.mesh.position.x += p.speed * dt;
          if (p.mesh.position.x >= p.endX) p.mesh.position.x = p.endX;
        } else {
          toRemove.push(p);
        }
      });
      toRemove.forEach(p => {
        scene.remove(p.mesh);
        pulseMeshes = pulseMeshes.filter(x => x !== p);
      });
    }

    /* ============================================================
       3D highlighting
    ============================================================ */
    let currentActiveIds = [];

    function highlightObjects(step) {
      currentActiveIds = step.highlight;
      interactiveMeshes.forEach(mesh => {
        const id = mesh.userData.objectId;
        if (!id) return;
        const active = currentActiveIds.includes(id);
        const mat = mesh.material;
        if (!mat || mat.emissive === undefined) return;
        mat.opacity = active ? 0.9 : (mesh.userData.wire ? 0.35 : 0.15);
        mat.emissiveIntensity = active ? 0.7 : 0.05;
        mat.needsUpdate = true;
        if (id && id.startsWith('hadamard')) mesh.scale.setScalar(1);
      });
    }

    function updateGateAnimations(elapsed) {
      interactiveMeshes.forEach(mesh => {
        const id = mesh.userData.objectId;
        if (!id || !currentActiveIds.includes(id)) return;
        const mat = mesh.material;
        if (id.startsWith('hadamard')) {
          mesh.scale.setScalar(1 + 0.08 * Math.sin(elapsed * 8));
        } else if (id.startsWith('controlledU')) {
          mat.emissiveIntensity = 0.6 + 0.4 * Math.sin(elapsed * 5);
        } else if (id === 'qft') {
          mat.emissiveIntensity = 0.5 + 0.3 * Math.sin(elapsed * 4);
        } else if (id === 'meas-second' || id === 'meas-first') {
          mat.emissiveIntensity = 0.5 + 0.35 * Math.sin(elapsed * 6);
        }
      });
    }

    function updateMeasurementAnimations(elapsed) {
      if (state.currentStep === 8 && gaugeNeedles['meas-second']) {
        gaugeNeedles['meas-second'].rotation.y = Math.sin(elapsed * 3) * 0.8;
      }
      if (state.currentStep === 10 && gaugeNeedles['meas-first']) {
        gaugeNeedles['meas-first'].rotation.y = Math.sin(elapsed * 3) * 0.8;
      }
    }

    /* ============================================================
       Click picking
    ============================================================ */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes, false);
      if (intersects.length > 0) {
        const objectId = intersects[0].object.userData.objectId;
        if (objectId) {
          showExplanation(objectId);
          event.stopPropagation();
        }
      }
    });

    /* ============================================================
       Explanations
    ============================================================ */
    function getExplanation(objectId) {
      const N = state.N;
      const a = state.a;
      const r = state.period;
      const factors = state.factors;

      if (objectId.startsWith('step-')) {
        const sid = Number(objectId.split('-')[1]);
        const step = steps[sid];
        switch (sid) {
          case 0:
            return `<h1>Shor’s Algorithm Overview</h1>
              <div class="step-context">Step 0 of 12 · Whole algorithm</div>
              <p>Shor’s algorithm factors an integer ${M('N')} in polynomial time on a quantum computer. It reduces factoring to the problem of <strong>period finding</strong> for the modular exponentiation function ${M('f(x)=a^x \\bmod N')}. The quantum part is essentially a phase estimation of the unitary ${M('U_a')}.</p>
              ${DM('r = \\operatorname{ord}_N(a), \\qquad U_a |y\\rangle = |a y \\bmod N\\rangle')}
              <p>The algorithm has two registers: a control register used for phase estimation and a target register that stores modular powers. After a QFT, measurement of the control register gives an integer ${M('y')} such that ${M('\\left| y/Q - c/r \\right| \\le 1/2Q')}. Continued fractions then recover ${M('r')}. Finally, if ${M('r')} is even and ${M('a^{r/2} \\not\\equiv -1 \\bmod N')}, then</p>
              ${DM('p = \\gcd(a^{r/2}-1,N), \\quad q = \\gcd(a^{r/2}+1,N)')}
              <p>For ${M(`N=${N}, a=${a}`)}, the period is ${M(`r=${r}`)} and factors are ${M(`${factors ? factors.join(' × ') : 'not found'}`)}.</p>`;

          case 1:
            return `<h1>Classical Preprocessing</h1>
              <div class="step-context">Step 1 of 12 · Code lines 2–9</div>
              <p>Before invoking quantum hardware, Shor’s algorithm performs fast classical checks:</p>
              <ul>
                <li>If ${M('N')} is even, return ${M('2')}.</li>
                <li>If ${M('N=p^k')} for a prime ${M('p')}, return ${M('p')}.</li>
                <li>Choose a random ${M('a \\in (2,N-1)')}; if ${M('d=\\gcd(a,N)>1')}, then ${M('d')} is a factor.</li>
              </ul>
              ${DM('d = \\gcd(a,N)')}
              <p>This step eliminates trivial cases. Only if all checks pass do we enter the quantum period-finding subroutine. The chosen ${M('a')} must be coprime to ${M('N')}; otherwise the gcd immediately gives a factor.</p>`;

          case 2:
            return `<h1>Initialize Quantum Registers</h1>
              <div class="step-context">Step 2 of 12 · Code line 21</div>
              <p>The quantum state is initialized as</p>
              ${DM('|0\\rangle^{\\otimes 4} |1\\rangle^{\\otimes 4}')}
              <p>In the full algorithm, the first register contains ${M('2n')} qubits with ${M('n=\\lceil \\log_2 N\\rceil')}, giving ${M('Q=2^{2n}')} basis states. For ${M('N=15')}, this is ${M('Q=256')}, but this visual demonstration uses a compact 4-qubit control register. The second register stores modular powers and must be initialized in ${M('|1\\rangle')}.</p>
              ${DM('|\\psi_0\\rangle = |0\\rangle^{\\otimes 4} |1\\rangle^{\\otimes 4}')}`;

          case 3:
            return `<h1>Hadamard Superposition</h1>
              <div class="step-context">Step 3 of 12 · Code line 22</div>
              <p>Apply a Hadamard gate to each control qubit:</p>
              ${DM('H = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}')}
              <p>The first register becomes a uniform superposition over all ${M('Q=2^4=16')} computational basis states (${M('Q=256')} in the full circuit):</p>
              ${DM('|\\psi_1\\rangle = \\frac{1}{\\sqrt{Q}} \\sum_{x=0}^{Q-1} |x\\rangle |1\\rangle')}
              <p>This enables massive quantum parallelism: modular exponentiation will act on all ${M('x')} values simultaneously.</p>`;

          case 4:
          case 5:
          case 6:
          case 7: {
            const j = sid - 4;
            return `<h1>Controlled U<sub>a</sub><sup>2<sup>${j}</sup></sup></h1>
              <div class="step-context">Step ${sid} of 12 · Controlled modular exponentiation</div>
              <p>This gate applies the unitary ${M(`U_a^{2^${j}}`)} to the second register, controlled on the ${M(`x_${j}`)} qubit. The base unitary is</p>
              ${DM('U_a |y\\rangle = |a y \\bmod N\\rangle')}
              <p>Successive controlled powers are required for phase estimation because the overall transformation is</p>
              ${DM('|x\\rangle |y\\rangle \\mapsto |x\\rangle |a^x y \\bmod N\\rangle = \\sum_{x} |x\\rangle U_a^x |y\\rangle')}
              <p>For ${M(`N=${N}, a=${a}`)}, the first powers modulo ${M('N')} are:</p>
              <ul>
                ${[0,1,2,3,4].map(k => `<li>${M(`${a}^{${k}} \\equiv ${Math.pow(a,k)%N} \\bmod ${N}`)}</li>`).join('')}
              </ul>
              <p>The eigenstates of ${M('U_a')} are</p>
              ${DM('|\\psi_s\\rangle = \\frac{1}{\\sqrt{r}}\\sum_{k=0}^{r-1} e^{-2\\pi i s k / r} |a^k \\bmod N\\rangle,\\qquad U_a |\\psi_s\\rangle = e^{2\\pi i s / r}|\\psi_s\\rangle')}
              <p>Thus each controlled power contributes a phase ${M('e^{2\\pi i s 2^j / r}')}, exactly as needed for phase estimation.</p>`;
          }

          case 8:
            return `<h1>Second Register Measurement</h1>
              <div class="step-context">Step 8 of 12 · Code line 25</div>
              <p>Measure the target register in the computational basis. This is a projective measurement with operators ${M('P_m=|m\\rangle\\langle m|')}. After obtaining outcome ${M('m=a^{x_0} \\bmod N')}, the first register collapses to a superposition over all ${M('x')} congruent to ${M('x_0')} modulo the period ${M('r')}:</p>
              ${DM('|\\psi_2\\rangle = \\frac{1}{\\sqrt{Q/r}} \\sum_{j=0}^{Q/r-1} |x_0 + j r\\rangle |m\\rangle')}
              <p>This collapse is crucial: it effectively selects a phase eigenstate and prepares the control register for QFT-based phase estimation.</p>`;

          case 9:
            return `<h1>Inverse Quantum Fourier Transform</h1>
              <div class="step-context">Step 9 of 12 · Code line 26</div>
              <p>The inverse QFT on the first register transforms the periodic superposition into sharp peaks at integer multiples of ${M('Q/r')}. The QFT is defined by</p>
              ${DM('\\mathrm{QFT}_Q |x\\rangle = \\frac{1}{\\sqrt{Q}}\\sum_{k=0}^{Q-1} e^{2\\pi i x k / Q} |k\\rangle')}
              <p>Its inverse replaces ${M('i')} with ${M('-i')}. After the controlled-${M('U')} sequence, the first register is approximately</p>
              ${DM('|\\psi_3\\rangle = \\frac{1}{\\sqrt{r}}\\sum_{s=0}^{r-1} e^{2\\pi i s x_0 / r} |\\tilde{s}\\rangle')}
              <p>where ${M('\\tilde{s}')} is a state near ${M('\\frac{sQ}{r}')}. Measuring then yields an integer close to a multiple of ${M('Q/r')}.</p>
              <h3>Internal QFT† circuit</h3>
              <svg viewBox="0 0 620 230" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
                <g stroke="#88ccff" stroke-width="1.5" fill="none">
                  <line x1="40" y1="30" x2="580" y2="30"/>
                  <line x1="40" y1="90" x2="580" y2="90"/>
                  <line x1="40" y1="150" x2="580" y2="150"/>
                  <line x1="40" y1="210" x2="580" y2="210"/>
                </g>
                <g fill="#8b5cf6" stroke="#4c1d95" stroke-width="1">
                  <rect x="80" y="15" width="34" height="30" rx="4"/>
                  <rect x="190" y="75" width="34" height="30" rx="4"/>
                  <rect x="330" y="135" width="34" height="30" rx="4"/>
                  <rect x="460" y="195" width="34" height="30" rx="4"/>
                </g>
                <g fill="white" font-family="monospace" font-size="12" text-anchor="middle">
                  <text x="97" y="33">H</text>
                  <text x="207" y="93">H</text>
                  <text x="347" y="153">H</text>
                  <text x="477" y="213">H</text>
                  <text x="130" y="35">R2</text>
                  <text x="250" y="95">R3</text>
                  <text x="390" y="155">R4</text>
                </g>
              </svg>
              <p class="note">The QFT† decomposes into Hadamard gates and controlled phase rotations ${M('R_k=\\mathrm{diag}(1, e^{2\\pi i/2^k})')}. In a full circuit for ${M('N=15')}, eight control qubits are used.</p>`;

          case 10:
            return `<h1>First Register Measurement</h1>
              <div class="step-context">Step 10 of 12 · Code line 27</div>
              <p>Measure the control register after QFT†. With high probability, the outcome ${M('y')} satisfies</p>
              ${DM('\\left| \\frac{y}{Q} - \\frac{c}{r} \\right| \\le \\frac{1}{2Q}')}
              <p>for some integer ${M('c')}. This gives a rational approximation to a multiple of ${M('1/r')}. The value ${M('y')} is then passed to the classical continued-fraction routine.</p>
              <p>For ${M(`N=${N}, a=${a}, r=${r}`)}, the full-circuit measurement typically yields ${M('y \\in \\{0, Q/r, 2Q/r, \\ldots\\}')}. In a compact demonstration, the idea is identical.</p>`;

          case 11:
            return `<h1>Continued Fraction Post-processing</h1>
              <div class="step-context">Step 11 of 12 · Code line 28</div>
              <p>The continued fraction expansion of ${M('y/Q')} gives a sequence of rational approximations ${M('c/r')}. The denominator ${M('r')} is a candidate period. One tests it by checking</p>
              ${DM('a^r \\equiv 1 \\bmod N')}
              <p>Because of the phase estimation bound, the true period is among the denominators of the convergents. For ${M(`N=${N}, a=${a}`)}, the period is ${M(`r=${r}`)}.</p>`;

          case 12:
            return `<h1>Compute Factors</h1>
              <div class="step-context">Step 12 of 12 · Code lines 14–16</div>
              <p>If the recovered period ${M('r')} is even and ${M('a^{r/2} \\not\\equiv -1 \\bmod N')}, then</p>
              ${DM('p = \\gcd(a^{r/2}-1,N), \\quad q = \\gcd(a^{r/2}+1,N)')}
              <p>These are non-trivial factors of ${M('N')}. For the current demonstration</p>
              <ul>
                <li>${M(`N = ${N}`)}</li>
                <li>${M(`a = ${a}`)}</li>
                <li>${M(`r = ${r}`)}</li>
                <li>${M(`a^{r/2} \\bmod N = ${Math.pow(a, r/2) % N}`)}</li>
                <li>Factors: ${M(factors ? factors.join(' × ') : 'not found with this a')}</li>
              </ul>
              ${DM(`${N} = ${factors ? factors.join(' \\times ') : '?'}`)}`;
        }
      }

      // Non-step objects
      switch (objectId) {
        case 'init':
          return `<h1>Initialization Module</h1>
            <div class="step-context">Quantum state preparation</div>
            <p>This block initializes all qubits to the computational basis state:</p>
            ${DM('|\\psi_0\\rangle = |0\\rangle^{\\otimes 4} |1\\rangle^{\\otimes 4}')}
            <p>The second register must be in ${M('|1\\rangle')} because modular exponentiation uses it as the multiplicative identity. The first register starts in ${M('|0\\rangle^{\\otimes 4}')}.</p>`;

        case 'register-first':
          return `<h1>First Register — Control Register</h1>
            <p>The first register is used for phase estimation. In the full Shor circuit it contains ${M('2n')} qubits, giving ${M('Q=2^{2n}')} states. For ${M('N=15')}, the full size is 8 qubits; this visualization shows a reduced 4-qubit model.</p>
            ${DM('Q = 2^{2n}, \\qquad n = \\lceil \\log_2 N \\rceil')}
            <p>After Hadamard gates, it holds a uniform superposition. Later, controlled ${M('U_a')} gates encode the eigenvalue phases into this register.</p>`;

        case 'register-second':
          return `<h1>Second Register — Target Register</h1>
            <p>The second register holds the result of modular exponentiation. It is initialized to ${M('|1\\rangle')}. Under ${M('U_a |y\\rangle = |a y \\bmod N\\rangle')}, the value ${M('y')} is multiplied by ${M('a')} modulo ${M('N')}.</p>
            ${DM('|y\\rangle \\mapsto |a y \\bmod N\\rangle')}
            <p>Measuring this register collapses the first register into a periodic superposition, which is essential for period finding.</p>`;

        case 'hadamard-0':
        case 'hadamard-1':
        case 'hadamard-2':
        case 'hadamard-3':
          return `<h1>Hadamard Gate</h1>
            <div class="step-context">Quantum Fourier kernel</div>
            <p>The Hadamard gate is</p>
            ${DM('H = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}')}
            <p>It acts on the computational basis as</p>
            ${DM('H|0\\rangle = \\frac{|0\\rangle+|1\\rangle}{\\sqrt{2}},\\qquad H|1\\rangle = \\frac{|0\\rangle-|1\\rangle}{\\sqrt{2}}')}
            <p>In Shor’s algorithm, ${M('H^{\\otimes n}')} creates the uniform superposition over all control-register values ${M('x')}, enabling parallel evaluation of ${M('a^x \\bmod N')}. Hadamard gates are also the first stage in the QFT circuit.</p>`;

        case 'controlledU-0':
        case 'controlledU-1':
        case 'controlledU-2':
        case 'controlledU-3': {
          const j = Number(objectId.split('-')[1]);
          return `<h1>Controlled U<sub>a</sub><sup>2<sup>${j}</sup></sup></h1>
            <div class="step-context">Modular exponentiation gate</div>
            <p>This module applies ${M(`U_a^{2^${j}}`)} to the target register when the control qubit ${M(`x_${j}`)} is ${M('|1\\rangle')}. The base unitary is</p>
            ${DM('U_a |y\\rangle = |a y \\bmod N\\rangle')}
            <p>The power ${M('2^j')} comes from decomposing ${M('x = \\sum_j x_j 2^j')}, so</p>
            ${DM('a^x = \\prod_{j:x_j=1} a^{2^j}')}
            <p>Each controlled power has the same eigenstates ${M('|\\psi_s\\rangle')} with eigenvalue ${M('e^{2\\pi i s 2^j / r}')}. For ${M(`N=${N}, a=${a}, r=${r}`)}, this builds the phase ${M(`2\\pi i s 2^j / ${r}`)}.</p>`;
        }

        case 'qft':
          return `<h1>QFT† Module</h1>
            <p>The inverse quantum Fourier transform converts phase-encoded periodicity into a sharp computational-basis peak. Its forward definition is</p>
            ${DM('\\mathrm{QFT}_Q |x\\rangle = \\frac{1}{\\sqrt{Q}} \\sum_{k=0}^{Q-1} e^{2\\pi i x k / Q} |k\\rangle')}
            <p>The inverse simply uses ${M('e^{-2\\pi i x k / Q}')}. After the controlled modular exponentiation, the first register is approximately</p>
            ${DM('|\\psi\\rangle = \\frac{1}{\\sqrt{r}}\\sum_{s=0}^{r-1} e^{2\\pi i s x_0 / r} |\\frac{sQ}{r}\\rangle')}
            <p>Measurement then yields an integer ${M('y')} near a multiple of ${M('Q/r')}. In hardware, QFT† is built from Hadamard gates and controlled phase rotations ${M('R_k^{-1}')}.</p>`;

        case 'meas-second':
          return `<h1>Second Register Measurement</h1>
            <p>This is a projective measurement in the computational basis. In the density-matrix formalism, a measurement outcome ${M('m')} corresponds to the projection</p>
            ${DM('\\rho \\mapsto \\frac{P_m \\rho P_m}{\\mathrm{Tr}(P_m \\rho)}')}
            <p>where ${M('P_m=|m\\rangle\\langle m|')}. Measuring the target register collapses it to a single modular value ${M('m=a^{x_0}\\bmod N')} and leaves the control register in a periodic superposition with period ${M('r')}.</p>`;

        case 'meas-first':
          return `<h1>First Register Measurement</h1>
            <p>After QFT†, the first register is measured. The outcome ${M('y')} satisfies the approximation</p>
            ${DM('\\left| \\frac{y}{Q} - \\frac{c}{r} \\right| \\le \\frac{1}{2Q}')}
            <p>This yields a rational number close to ${M('c/r')}. The classical continued-fraction algorithm then extracts the period ${M('r')}.</p>`;

        case 'classical-post':
          return `<h1>Classical Post-processing</h1>
            <p>Once the quantum measurement gives ${M('y')}, a classical continued-fraction expansion of ${M('y/Q')} produces candidates for ${M('c/r')}. The denominator ${M('r')} is tested by computing ${M('a^r \\bmod N')}. If ${M('r')} is even and ${M('a^{r/2} \\not\\equiv -1 \\bmod N')}, then</p>
            ${DM('p=\\gcd(a^{r/2}-1,N),\\quad q=\\gcd(a^{r/2}+1,N)')}
            <p>This is entirely classical and usually takes negligible time compared with the quantum part.</p>`;

        case 'output':
          return `<h1>Output</h1>
            <p>The algorithm returns non-trivial factors ${M('p')} and ${M('q')} of ${M('N')}. For the current parameters:</p>
            <ul>
              <li>${M(`N = ${N}`)}</li>
              <li>${M(`a = ${a}`)}</li>
              <li>${M(`r = ${r}`)}</li>
              <li>${M(`a^{r/2} \\bmod N = ${Math.pow(a, r/2) % N}`)}</li>
            </ul>
            ${DM(`${N} = ${factors ? factors.join(' \\times ') : '?'}`)}`;

      return `<h1>Explanation</h1><p>Select a code line, 3D gate, register, or measurement component to see a detailed explanation.</p>`;
    }

    async function showExplanation(objectId) {
      explanationPanel.innerHTML = getExplanation(objectId);
      explanationPanel.scrollTop = 0;
      if (window.MathJax && window.MathJax.typesetPromise) {
        try {
          window.MathJax.typesetClear([explanationPanel]);
          await window.MathJax.typesetPromise([explanationPanel]);
        } catch (e) {
          console.warn('MathJax typeset error:', e);
        }
      }
    }

    /* ============================================================
       State update
    ============================================================ */
    function getStateSummary(stepId) {
      switch (stepId) {
        case 2: return '|ψ⟩ = |0⟩⊗4 |1⟩⊗4';
        case 3: return '|ψ⟩ = 1/4 Σ |x⟩ |1⟩';
        case 4:
        case 5:
        case 6:
        case 7:
          return `|ψ⟩ = 1/4 Σ |x⟩ |${state.a}^x mod ${state.N}⟩`;
        case 8: return 'First register: periodic superposition';
        case 9: return 'QFT† applied to first register';
        case 10: return 'Measurement outcome y → continued fractions';
        case 11: return `Recover period r=${state.period}`;
        case 12: return state.factors ? `Factors: ${state.factors.join(' × ')}` : 'Factors not found';
        default: return 'Quantum and classical phases';
      }
    }

    function updateCodeHighlight(step) {
      const lines = step.codeLines;
      document.querySelectorAll('.code-line').forEach(el => {
        const lineNum = Number(el.dataset.line);
        if (lines.includes(lineNum)) el.classList.add('active-step');
        else el.classList.remove('active-step');
      });
      const active = document.querySelector('.code-line.active-step');
      if (active) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function updateStepIndicator(step) {
      stepIndicator.textContent = `Step ${step.id}/${steps.length-1}: ${step.name}`;
    }

    function updateStatusBar(step) {
      statusStep.textContent = `Step ${step.id}: ${step.name}`;
      statusDesc.textContent = step.desc;
      statusState.textContent = getStateSummary(step.id);
    }

    function updateMeasurementDisplays(step) {
      if (step.id === 8 && measSecondValueDiv) {
        measSecondValueDiv.innerHTML = `MEAS · m=${state.a}?`;
      }
      if (step.id === 10 && measFirstValueDiv) {
        measFirstValueDiv.innerHTML = `MEAS · y=128`;
      }
      if (step.id === 0 || step.id === 1) {
        if (measSecondValueDiv) measSecondValueDiv.innerHTML = 'MEAS';
        if (measFirstValueDiv) measFirstValueDiv.innerHTML = 'MEAS';
      }
    }

    function setStep(stepId) {
      if (stepId < 0) stepId = 0;
      if (stepId > steps.length - 1) stepId = steps.length - 1;
      state.currentStep = stepId;
      const step = steps[stepId];
      updateCodeHighlight(step);
      highlightObjects(step);
      updateStepIndicator(step);
      updateStatusBar(step);
      updateMeasurementDisplays(step);
      showExplanation('step-' + stepId);
      animateDotsForStep(stepId);
    }

    function nextStep() {
      if (state.currentStep < steps.length - 1) setStep(state.currentStep + 1);
      else pausePlayback();
    }

    function prevStep() {
      if (state.currentStep > 0) setStep(state.currentStep - 1);
    }

    function playPlayback() {
      if (state.playing) return;
      state.playing = true;
      btnPlay.textContent = '⏸ Pause';
      btnPlay.classList.add('active');
      state._interval = setInterval(() => {
        if (state.currentStep < steps.length - 1) nextStep();
        else pausePlayback();
      }, 2200);
    }

    function pausePlayback() {
      state.playing = false;
      if (state._interval) clearInterval(state._interval);
      state._interval = null;
      btnPlay.textContent = '▶ Auto Play';
      btnPlay.classList.remove('active');
    }

    function togglePlayback() {
      if (state.playing) pausePlayback();
      else playPlayback();
    }

    function resetDemo() {
      pausePlayback();
      clearPulses();
      if (measSecondValueDiv) measSecondValueDiv.innerHTML = 'MEAS';
      if (measFirstValueDiv) measFirstValueDiv.innerHTML = 'MEAS';
      Object.values(gaugeNeedles).forEach(n => { if (n) n.rotation.y = 0; });
      setStep(0);
    }

    /* ============================================================
       Dynamic parameter updates
    ============================================================ */
    function recomputePeriodAndFactors() {
      state.period = multiplicativeOrder(state.a, state.N);
      state.factors = computeFactorsFromPeriod(state.N, state.a, state.period);
    }

    function updateDynamicLabels() {
      controlledULabelDivs.forEach((div, j) => {
        if (div) div.innerHTML = `U<sub>${state.a}</sub><sup>2<sup>${j}</sup></sup>`;
      });
    }

    function populateA(N) {
      const options = coprimeOptions(N);
      const current = state.a;
      aSelect.innerHTML = '';
      options.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        if (a === current) opt.selected = true;
        aSelect.appendChild(opt);
      });
      if (aSelect.selectedIndex === -1 && options.length > 0) {
        aSelect.selectedIndex = 0;
        state.a = options[0];
      }
    }

    NSelect.addEventListener('change', () => {
      state.N = Number(NSelect.value);
      populateA(state.N);
      state.a = Number(aSelect.value);
      recomputePeriodAndFactors();
      updateDynamicLabels();
      resetDemo();
    });

    aSelect.addEventListener('change', () => {
      state.a = Number(aSelect.value);
      recomputePeriodAndFactors();
      updateDynamicLabels();
      resetDemo();
    });

    /* ============================================================
       Buttons and keyboard
    ============================================================ */
    btnPrev.addEventListener('click', prevStep);
    btnNext.addEventListener('click', nextStep);
    btnPlay.addEventListener('click', togglePlayback);
    btnReset.addEventListener('click', resetDemo);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
      else if (e.key === ' ') { e.preventDefault(); togglePlayback(); }
      else if (e.key.toLowerCase() === 'r') { resetDemo(); }
    });

    window.addEventListener('resize', () => {
      camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
      css2DRenderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    });

    /* ============================================================
       Animation loop
    ============================================================ */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      updatePulses(dt);
      updateGateAnimations(elapsed);
      updateMeasurementAnimations(elapsed);

      controls.update();
      renderer.render(scene, camera);
      css2DRenderer.render(scene, camera);
    }

    /* ============================================================
       Init
    ============================================================ */
    populateA(15);
    aSelect.value = '7';
    state.a = 7;
    state.N = 15;
    recomputePeriodAndFactors();
    updateDynamicLabels();
    setStep(0);
    animate();
  </script>
