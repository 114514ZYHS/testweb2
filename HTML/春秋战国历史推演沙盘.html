<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>春秋戰國 · 五百五十年戰爭沙盤（觀賞模式）</title>
<style>
:root{
  --paper:#e6dcc0; --paper2:#dfd3b2; --sea:#b9c6c4; --ink:#20180f; --ink2:#3a2d1e;
  --gold:#c8a34a; --gold2:#efd79a; --seal:#9c2b1f; --seal2:#c4402c;
  --panel:rgba(24,19,14,.90); --panel2:rgba(34,27,19,.94); --line:#5c4a30;
  --dim:#a08d6c; --txt:#ecdfc2;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0b09}
body{font-family:var(--serif);color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;background:
  radial-gradient(1400px 900px at 50% 40%, #1d1813 0%, #0d0b09 78%);}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.30;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(8,6,4,.55) 78%, rgba(6,4,3,.88) 100%)}

/* ---------- 通用面板 ---------- */
.pnl{position:absolute;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(200,163,74,.14);
  backdrop-filter:blur(3px);border-radius:2px}
.pnl::before{content:"";position:absolute;inset:3px;border:1px solid rgba(200,163,74,.20);pointer-events:none;border-radius:1px}
.hd{font-size:12px;letter-spacing:.34em;color:var(--gold);padding:7px 10px 5px;border-bottom:1px solid rgba(200,163,74,.22);
  display:flex;justify-content:space-between;align-items:center}
.hd i{font-style:normal;color:var(--dim);letter-spacing:.05em;font-size:10px}

/* ---------- 顶栏：纪年 ---------- */
#top{left:50%;transform:translateX(-50%);top:14px;width:640px;padding:10px 16px 12px;text-align:center}
#era{font-size:12px;letter-spacing:.5em;color:var(--gold);margin-bottom:2px}
#yr{font-size:38px;line-height:1.05;letter-spacing:.06em;color:#f6ecd2;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#yr b{font-size:22px;color:var(--gold2);font-weight:400}
#reign{font-size:12.5px;color:var(--dim);letter-spacing:.16em;margin-top:3px;min-height:16px}
#bar{margin-top:9px;height:5px;background:rgba(0,0,0,.45);border:1px solid rgba(200,163,74,.25);position:relative}
#barf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7a5c33,#c8a34a,#efd79a);
  box-shadow:0 0 12px rgba(200,163,74,.6);transition:width .18s linear}
#ticks{position:absolute;inset:0}
#ticks span{position:absolute;top:-3px;width:1px;height:11px;background:rgba(236,223,194,.5)}

/* ---------- 左：旁白 ---------- */
#narr{left:20px;bottom:20px;width:436px;padding:0 0 10px}
#narrK{display:inline-block;margin:9px 0 0 11px;padding:2px 9px;font-size:11.5px;letter-spacing:.24em;
  color:#f3e6c6;background:var(--seal);border-radius:1px;box-shadow:0 1px 6px rgba(156,43,31,.6)}
#narrT{font-size:22px;letter-spacing:.13em;color:#f6ecd2;padding:6px 14px 2px;font-family:var(--kai)}
#narrY{font-size:11px;color:var(--dim);padding:0 14px 6px;letter-spacing:.14em}
#narrD{font-size:14.6px;line-height:1.85;color:#eadcb8;padding:2px 14px 8px;min-height:76px;font-family:var(--kai)}
#narrQ{font-size:12.6px;line-height:1.7;color:var(--gold2);padding:8px 14px 2px;margin:0 12px;
  border-top:1px solid rgba(200,163,74,.2);font-family:var(--kai);opacity:.95;min-height:20px}

/* ---------- 左上：人物 / 诸子 ---------- */
#sage{left:20px;top:14px;width:250px;padding-bottom:9px;opacity:0;transform:translateX(-14px);transition:opacity .5s,transform .5s}
#sage.on{opacity:1;transform:none}
#sageN{font-size:23px;letter-spacing:.18em;padding:9px 12px 0;color:#f6ecd2;font-family:var(--kai)}
#sageR{font-size:11px;letter-spacing:.2em;color:var(--gold);padding:3px 12px 6px}
#sageD{font-size:12.8px;line-height:1.75;color:#d6c6a0;padding:0 12px;font-family:var(--kai)}
#sageW{font-size:12.6px;line-height:1.7;color:var(--gold2);padding:8px 12px 0;margin-top:6px;border-top:1px solid rgba(200,163,74,.18);font-family:var(--kai)}

/* ---------- 右：列国榜 ---------- */
#rank{right:20px;top:14px;width:262px;padding-bottom:8px}
.row{display:flex;align-items:center;gap:7px;padding:3px 10px;font-size:13px;transition:opacity .4s}
.row .sq{width:11px;height:11px;flex:0 0 11px;border:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(236,223,194,.16)}
.row .nm{width:32px;letter-spacing:.08em;color:#f2e6c8}
.row .bw{flex:1;height:9px;background:rgba(0,0,0,.42);position:relative;overflow:hidden}
.row .bf{position:absolute;left:0;top:0;bottom:0;transition:width .45s cubic-bezier(.4,1.2,.4,1)}
.row .vl{width:66px;text-align:right;font-size:11px;color:#d3c19a;letter-spacing:.01em}
.row.dead{opacity:.24;filter:grayscale(1)}
.row .hg{color:var(--gold2);font-size:11px;width:12px}

/* ---------- 右下：战报 ---------- */
#war{right:20px;bottom:172px;width:262px;height:214px;display:flex;flex-direction:column}
#warL{flex:1;overflow:hidden;padding:4px 9px 6px;display:flex;flex-direction:column-reverse}
.wi{font-size:12.2px;line-height:1.55;color:#d3c3a0;padding:3px 0;border-bottom:1px dashed rgba(200,163,74,.13);animation:fi .5s}
.wi b{color:#f0dfb4;font-weight:400}
.wi .k{color:var(--seal2)}
.wi .y{color:var(--dim);font-size:10.5px;margin-right:5px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 右下：国力消长图 ---------- */
#chartBox{right:20px;bottom:20px;width:262px;height:142px}
#chart{position:absolute;left:6px;right:6px;top:26px;bottom:16px;width:calc(100% - 12px);height:calc(100% - 42px)}
#chartX{position:absolute;left:8px;right:8px;bottom:2px;display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}

/* ---------- 底部控制条 ---------- */
#ctl{left:50%;transform:translateX(-50%);bottom:20px;padding:7px 10px;display:flex;align-items:center;gap:7px}
.btn{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:#f2e5c4;background:rgba(72,58,39,.72);
  border:1px solid rgba(200,163,74,.28);padding:5px 11px;cursor:pointer;border-radius:1px;transition:.18s;white-space:nowrap}
.btn:hover{background:rgba(120,92,52,.7);color:#fff4d8;border-color:var(--gold)}
.btn.on{background:linear-gradient(180deg,#8a6a34,#6a5028);color:#ffeec4;border-color:var(--gold2)}
.sep{width:1px;height:20px;background:rgba(200,163,74,.22);margin:0 2px}
#spd{font-size:12px;color:var(--gold2);width:40px;text-align:center;letter-spacing:.06em}

/* ---------- 章节条 ---------- */
#chap{left:50%;transform:translateX(-50%);bottom:70px;display:flex;gap:5px;background:rgba(20,16,11,.72);
  border:1px solid rgba(200,163,74,.18);padding:5px 7px;border-radius:2px}
.cbtn{font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;color:#b8a680;background:transparent;border:0;
  padding:3px 8px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.cbtn:hover{color:#f2e3bd}
.cbtn.on{color:#ffeec4;border-bottom-color:var(--gold)}

/* ---------- 大事标题闪现 ---------- */
#flash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0}
#flashT{font-family:var(--kai);font-size:70px;letter-spacing:.3em;color:#fff2d0;
  text-shadow:0 0 30px rgba(200,163,74,.85),0 6px 26px rgba(0,0,0,.9);white-space:nowrap}
#flashS{font-size:15px;letter-spacing:.5em;color:var(--gold2);margin-top:12px;text-shadow:0 2px 10px #000}
@keyframes flashIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
 14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 78%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
#flash.go{animation:flashIn 3.1s ease-out}

/* ---------- 典故走马灯 ---------- */
#idiom{position:absolute;left:50%;transform:translateX(-50%);top:118px;font-family:var(--kai);font-size:15px;
  letter-spacing:.34em;color:rgba(246,236,210,.82);text-shadow:0 2px 12px rgba(0,0,0,.85);opacity:0;transition:opacity .8s;white-space:nowrap}
#idiom.on{opacity:1}
#idiom u{text-decoration:none;color:var(--gold2)}

/* ---------- 竖排书名 ---------- */
#title{position:absolute;left:22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  font-family:var(--kai);font-size:27px;letter-spacing:.34em;color:rgba(200,163,74,.30);pointer-events:none;
  text-shadow:0 2px 18px rgba(0,0,0,.7);opacity:0;transition:opacity .8s}

/* ---------- 序幕 ---------- */
#intro{position:absolute;inset:0;background:radial-gradient(900px 620px at 50% 45%,#231c14,#0b0908 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;transition:opacity 1.1s}
#intro.off{opacity:0;pointer-events:none}
#itl{font-family:var(--kai);font-size:82px;letter-spacing:.42em;color:#f4e4bb;text-indent:.42em;
  text-shadow:0 0 46px rgba(200,163,74,.5),0 8px 40px #000}
#isb{font-size:15px;letter-spacing:.72em;color:var(--gold);margin-top:20px;text-indent:.72em}
#idc{font-family:var(--kai);font-size:14px;line-height:2.1;color:#b9a986;margin-top:26px;text-align:center;max-width:620px}
#igo{margin-top:34px;font-family:var(--kai);font-size:16px;letter-spacing:.32em;color:#f6ecd2;background:transparent;
  border:1px solid var(--gold);padding:11px 40px;cursor:pointer;transition:.3s;text-indent:.32em}
#igo:hover{background:var(--gold);color:#241c10;box-shadow:0 0 34px rgba(200,163,74,.5)}
#iseal{position:absolute;right:9%;bottom:12%;width:96px;height:96px;border:3px solid rgba(156,43,31,.85);
  color:rgba(196,64,44,.92);font-family:var(--kai);font-size:30px;letter-spacing:.06em;display:grid;
  place-content:center;line-height:1.1;text-align:center;transform:rotate(-6deg);opacity:.9}

/* ---------- 提示 ---------- */
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;font-size:11.5px;letter-spacing:.24em;
  color:rgba(200,163,74,.55);pointer-events:none;transition:opacity .6s}
#tip{position:absolute;pointer-events:none;background:rgba(18,14,10,.94);border:1px solid var(--line);padding:5px 9px;
  font-size:12px;color:#e6d8b4;letter-spacing:.06em;opacity:0;transition:opacity .18s;white-space:nowrap;z-index:40;border-radius:2px}
#tip b{color:var(--gold2);font-weight:400}
@media (max-width:1400px){#narr{width:392px}#rank,#war,#chartBox{width:236px}#itl{font-size:62px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="title">春秋戰國‧五百五十年</div>
  <div id="idiom"></div>
  <div id="flash"><div id="flashT"></div><div id="flashS"></div></div>

  <div id="top" class="pnl">
    <div id="era">周 · 東遷</div>
    <div id="yr">公元前 <b>七七〇</b> 年</div>
    <div id="reign">周平王元年</div>
    <div id="bar"><div id="barf"></div><div id="ticks"></div></div>
  </div>

  <div id="sage" class="pnl">
    <div class="hd">人 物 誌 <i>PERSONA</i></div>
    <div id="sageN"></div><div id="sageR"></div><div id="sageD"></div><div id="sageW"></div>
  </div>

  <div id="rank" class="pnl">
    <div class="hd">列 國 消 長 <i id="alv"></i></div>
    <div id="rows"></div>
  </div>

  <div id="war" class="pnl">
    <div class="hd">戰 報 <i>DISPATCHES</i></div>
    <div id="warL"></div>
  </div>

  <div id="chartBox" class="pnl">
    <div class="hd">疆 域 曲 線 <i>550 YRS</i></div>
    <canvas id="chart"></canvas>
    <div id="chartX"><span>前770</span><span>前500</span><span>前221</span></div>
  </div>

  <div id="narr" class="pnl">
    <span id="narrK">紀</span>
    <div id="narrT"></div>
    <div id="narrY"></div>
    <div id="narrD"></div>
    <div id="narrQ"></div>
  </div>

  <div id="chap"></div>
  <div id="ctl" class="pnl">
    <button class="btn" id="bPlay">‖ 暫停</button>
    <button class="btn" id="bSlow">慢</button>
    <span id="spd">1.0×</span>
    <button class="btn" id="bFast">快</button>
    <div class="sep"></div>
    <button class="btn" id="bPrev">◂ 上一事</button>
    <button class="btn" id="bNext">下一事 ▸</button>
    <div class="sep"></div>
    <button class="btn on" id="bTer">疆域</button>
    <button class="btn on" id="bNam">城名</button>
    <button class="btn on" id="bArm">軍旅</button>
    <button class="btn on" id="bCam">運鏡</button>
    <button class="btn" id="bSnd">鼓吹</button>
    <div class="sep"></div>
    <button class="btn" id="bReset">重演</button>
  </div>
  <div id="hint">空格 播放/暫停　←→ 逐事件　1–9 章節　滾輪縮放　拖拽移圖</div>
  <div id="tip"></div>

  <div id="intro">
    <div id="itl">春秋戰國</div>
    <div id="isb">前 七 七 〇 — 前 二 二 一</div>
    <div id="idc">周室東遷，王綱解紐。五霸迭興，七雄並立。<br/>五百五十載，兵車馳於原野，百家鳴於稷下。<br/>此沙盤演其疆域之消長、戰陣之興亡、人文之流變。</div>
    <button id="igo">開 卷 觀 史</button>
    <div id="iseal">春秋<br/>戰國</div>
  </div>
</div>
<script>
"use strict";
/* ==================================================================
   春秋戰國 · 歷史戰爭沙盤（單文件 / 觀賞模式）
   ------------------------------------------------------------------
   一、地理層：經緯投影、海陸輪廓、河渠、長城
   二、政權層：列國、都邑、加權泰森多邊形疆域場
   三、編年層：約一百三十則信史事件驅動疆域與戰爭
   四、人文層：諸子百家、典故成語、詩騷雅言
   五、演出層：自動運鏡、行軍、會戰、旁白、國力曲線
   ================================================================== */

/* ============ 一、投影與地理 ============ */
var LON0=100.5, LAT0=42.8, SX=54, SY=60;
function P(lon,lat){ return [ (lon-LON0)*SX, (LAT0-lat)*SY ]; }
var MAPW=(124.2-LON0)*SX, MAPH=(LAT0-25.4)*SY;

/* 海陸輪廓（順時針，含渤海灣、山東半島、江浙海岸） */
var LAND=[[100.8,40.6],[103.4,41.7],[106.2,41.9],[109.0,41.2],[111.6,41.6],[114.2,42.3],[116.6,42.4],
[118.6,42.2],[120.6,41.7],[122.5,41.3],[123.8,40.7],[123.3,39.6],[121.7,39.2],[122.4,39.0],[121.3,38.8],
[119.3,39.1],[117.9,39.15],[117.55,38.3],[118.4,37.9],[119.2,37.3],[120.4,37.55],[121.7,37.45],[122.7,37.35],
[121.5,36.6],[120.3,36.0],[119.5,35.0],[119.9,34.3],[120.6,33.4],[120.9,32.6],[121.6,32.0],[121.9,31.4],
[121.3,30.6],[121.0,29.8],[120.5,28.6],[119.7,27.4],[118.7,26.4],[117.2,25.7],[115.2,25.2],[113.2,25.0],
[111.2,25.4],[109.2,25.8],[107.2,26.3],[105.2,27.0],[103.5,28.4],[102.3,30.0],[101.5,32.0],[101.0,34.0],
[101.2,36.5],[100.7,38.5]];

/* 大河：黃河（禹貢故道，東北入渤海）、長江、淮、漢、渭、濟 */
var RIVERS=[
 {n:"河水",w:3.4,p:[[103.4,36.0],[105.4,37.4],[106.7,38.8],[107.4,40.2],[110.4,40.8],[111.2,39.6],[110.6,37.6],
   [110.4,35.6],[110.3,34.72],[111.6,34.82],[112.6,34.88],[113.7,34.92],[114.5,35.5],[114.9,36.5],[115.4,37.5],
   [116.3,38.4],[117.5,38.95]]},
 {n:"江水",w:3.4,p:[[103.9,29.6],[105.8,29.4],[107.5,30.6],[109.5,30.8],[111.3,30.72],[112.2,30.35],[113.5,30.3],
   [114.3,30.6],[115.8,30.2],[117.0,30.9],[118.4,31.3],[119.5,32.0],[120.6,32.0],[121.7,31.6]]},
 {n:"淮水",w:2.2,p:[[113.0,33.5],[114.5,33.0],[116.0,32.7],[117.4,32.6],[118.6,32.9],[119.6,33.4],[120.4,33.6]]},
 {n:"漢水",w:2.1,p:[[106.9,33.1],[108.5,32.8],[110.0,32.7],[111.5,32.3],[112.1,31.5],[112.5,30.9],[114.3,30.6]]},
 {n:"渭水",w:2.0,p:[[105.4,34.6],[107.5,34.4],[108.9,34.32],[110.0,34.6],[110.35,34.72]]},
 {n:"濟水",w:1.6,p:[[113.6,34.95],[114.8,35.2],[115.9,35.6],[116.9,36.3],[117.9,36.9],[118.8,37.2]]},
 {n:"洛水",w:1.5,p:[[109.6,35.6],[110.4,34.9],[111.6,34.5],[112.4,34.65]]},
 {n:"泗水",w:1.5,p:[[117.0,35.7],[117.2,34.9],[117.4,34.3],[118.0,33.6]]}
];

/* 長城與關防（戰國諸長城） */
var WALLS=[
 {n:"趙北長城",p:[[110.6,40.9],[112.4,41.2],[114.3,41.3]],s:"zhao"},
 {n:"燕北長城",p:[[115.4,41.1],[117.6,41.5],[120.2,41.4],[122.4,41.2]],s:"yan"},
 {n:"秦昭王長城",p:[[105.2,36.2],[106.6,37.2],[108.4,37.8],[109.8,38.2]],s:"qin"},
 {n:"齊長城",p:[[116.9,36.3],[117.9,36.1],[119.0,35.9],[120.1,36.1]],s:"qi"},
 {n:"楚方城",p:[[112.3,33.8],[113.0,33.3],[113.6,32.9]],s:"chu"},
 {n:"魏西河長城",p:[[110.3,35.5],[110.15,34.9],[110.0,34.4]],s:"wei"},
 {n:"中山長城",p:[[113.9,38.6],[114.6,38.2],[115.1,37.8]],s:"zhongshan"}
];

/* ============ 二、列國 ============ */
/* n名 f全稱 c色 cap都 live存亡 desc國性 */
var STATES={
 zhou:{n:"周",f:"周王室",c:"#c9a227",cap:"luoyi",live:1,d:"天下共主，東遷後號令不行，僅存禮樂之名。"},
 qin:{n:"秦",f:"秦",c:"#3c4654",cap:"yong",live:1,d:"起於西陲牧馬，尚黑尚武，變法而後席捲天下。"},
 jin:{n:"晉",f:"晉",c:"#9e2b25",cap:"jiang",live:1,d:"中原霸主，六卿專權，終為三家所分。"},
 qi:{n:"齊",f:"齊",c:"#2f7d8c",cap:"linzi",live:1,d:"負海之國，魚鹽之利，稷下學宮甲於天下。"},

{y:-750,k:"戰",t:"秦逐戎至岐",s:"qifeng",d:"秦文公東獵至汧渭之會，逐戎人，收周餘民，以岐以東獻周。西陲牧馬之族始為諸侯。",own:[["longxi","qin"]]},
{y:-722,k:"政",t:"鄭伯克段于鄢",s:"xinzheng",d:"《春秋》始筆之年。鄭莊公縱弟共叔段之惡而後誅之，掘地及泉與母相見。",q:"《左傳》：多行不義，必自斃，子姑待之。"},
{y:-707,k:"戰",t:"繻葛之戰",s:"xinzheng",d:"周桓王率蔡衛陳伐鄭，鄭將祝聃射王中肩。王師敗績而諸侯莫救，天子權威掃地。",q:"《左傳》：君子不欲多上人，況敢陵天子乎？",war:{a:"zhou",d:"zheng",w:"zheng",ka:1.2,kd:0.6}},
{y:-701,k:"政",t:"鄭莊小霸",s:"xinzheng",d:"鄭莊公卒。其一生挾天子以令諸侯，會盟征伐三十餘年，史稱春秋小霸。其後鄭亂，霸業旋滅。"},
{y:-690,k:"戰",t:"楚服漢東",s:"suicheng",d:"楚武王卒於伐隨之途，秘不發喪而克隨。漢陽諸姬盡入楚之版圖，荊蠻自此北望中原。",q:"《史記》：我蠻夷也，不與中國之號諡。",own:[["suicheng","chu"]]},
{y:-685,k:"人",t:"管仲相齊",s:"linzi",sg:"guanzhong",d:"齊桓公不記射鉤之仇，以囚徒管夷吾為相。作內政而寄軍令，設鹽鐵之官，通輕重之權，齊遂富強。",q:"《管子》：倉廩實而知禮節，衣食足而知榮辱。"},
{y:-681,k:"盟",t:"北杏之會",s:"linzi",d:"齊始以諸侯之身會盟列國，曹沫執匕首劫桓公於柯，桓公許歸魯地而不悔，天下由是信齊。"},
{y:-679,k:"政",t:"曲沃代翼",s:"quwo",d:"曲沃武公盡併晉國，以寶器賂周僖王，命為晉侯。小宗代大宗六十七年而後成，晉之公族自此凋零。",own:[["jiang","jin"],["quwo","jin"],["anyi","jin"]]},
{y:-664,k:"戰",t:"齊救燕伐山戎",s:"guzhu",d:"山戎伐燕，桓公北征至孤竹，迷道而放老馬以識途。桓公割燕君所送之地予燕，諸侯服其義。",q:"《韓非子》：老馬之智可用也。",own:[["guzhu","yan"]],war:{a:"qi",d:"di",w:"qi",ka:0.8,kd:2.0}},
{y:-660,k:"滅",t:"狄滅衛",s:"chaoge",d:"衛懿公好鶴，鶴有祿位。狄人至，國人曰使鶴戰。衛師大潰，懿公死之，遺民僅七百三十人。",own:[["chaoge","di"]],war:{a:"di",d:"wey",w:"di",ka:0.5,kd:2.2}},
{y:-658,k:"政",t:"桓公存三亡國",s:"diqiu",d:"齊桓城楚丘以封衛，城夷儀以封邢，遷杞於緣陵。存亡繼絕，中國不絕如縷而復振。",own:[["diqiu","wey"]]},
{y:-656,k:"盟",t:"召陵之盟",s:"zhaoling",d:"桓公率八國之師南伐楚，責以包茅不入、昭王南征不復。楚使屈完當軍而問，遂盟於召陵，兵不血刃而屈強楚。",q:"《左傳》：君處北海，寡人處南海，唯是風馬牛不相及也。"},
{y:-655,k:"滅",t:"假道伐虢",s:"puban",d:"晉獻公以垂棘之璧、屈產之乘假道於虞。宮之奇諫曰輔車相依，唇亡齒寒。虞公不聽，虢亡而虞隨之。",q:"《左傳》：唇亡則齒寒，其虞虢之謂也。",own:[["puban","jin"]]},
{y:-651,k:"盟",t:"葵丘之會",s:"kuiqiu",fl:1,heg:"qi",d:"周襄王使宰孔賜齊侯胙，命無下拜。桓公下拜受賜，九合諸侯，一匡天下。尊王攘夷之業於此極盛。",q:"《孟子》：五霸桓公為盛，葵丘之會，束牲載書而不歃血。"},
{y:-645,k:"戰",t:"韓原之戰",s:"hanyuan",d:"晉惠公背秦約而伐秦，戰於韓原。晉侯馬陷泥淖，秦人獲之以歸。晉獻河西之地，秦晉之好蒙塵。",own:[["shaoliang","qin"]],war:{a:"qin",d:"jin",w:"qin",ka:1.0,kd:2.4}},
{y:-644,k:"人",t:"管仲之終",s:"linzi",d:"管仲病篤，桓公問誰可相。仲曰易牙殺子、豎刁自宮、開方去親，皆非人情，不可近。桓公不聽。"},
{y:-643,k:"政",t:"桓公之死",s:"linzi",d:"齊桓公卒，五公子爭立，停屍六十七日而蟲出於戶。首霸之業，一夕而墜。",q:"《史記》：桓公病，五公子各樹黨爭立。"},
{y:-638,k:"戰",t:"泓水之戰",s:"hongshui",d:"宋襄公欲繼齊業，與楚戰於泓。不鼓不成列，不擒二毛，遂大敗傷股而死。仁義之師終不敵蠻力。",q:"《左傳》：君子不重傷，不禽二毛。",war:{a:"chu",d:"song",w:"chu",ka:0.5,kd:1.8}},
{y:-636,k:"人",t:"重耳返國",s:"jiang",d:"晉公子重耳流亡十九年，歷狄齊曹宋鄭楚秦。介子推割股，秦穆公納之以歸。年六十二而立，是為晉文公。",q:"《左傳》：民生安樂，誰知其他？"},
{y:-635,k:"政",t:"文公勤王",s:"chaoge",own:[["chaoge","jin"]],d:"王子帶之亂，襄王出居於鄭。晉文公納王而誅帶，王賜陽樊、溫、原、攢茅之田。晉遂有南陽河內，兵鋒直抵大河。"},
{y:-632,k:"戰",t:"城濮之戰",s:"chengpu",fl:1,heg:"jin",d:"晉楚會於城濮。晉文公退避三舍以報楚惠，胥臣蒙馬以虎皮衝陳蔡，楚左右軍潰，子玉自殺。晉遂霸。",q:"《左傳》：晉侯在外十九年矣，險阻艱難，備嘗之矣。",war:{a:"jin",d:"chu",w:"jin",ka:1.2,kd:3.5}},
{y:-631,k:"盟",t:"踐土之盟",s:"jiantu",d:"晉文公朝王於踐土，王策命為侯伯，賜大輅之服、彤弓矢、虎賁三百人。孔子譏之曰以臣召君，不可以訓。"},
{y:-627,k:"戰",t:"崤之戰",s:"xiaoshan",d:"秦師襲鄭，弦高以十二牛犒師而鄭得備。師還過崤，晉伏兵盡殲之，三帥被擒。秦晉之好裂為世仇。",q:"《左傳》：勞師以襲遠，非所聞也。",war:{a:"jin",d:"qin",w:"jin",ka:0.4,kd:3.0},own:[["shaoliang","jin"]]},
{y:-624,k:"戰",t:"穆公霸西戎",s:"yong",d:"秦穆公用由余之謀，益國十二，開地千里，遂霸西戎。天子致賀以金鼓。東出之志既阻，乃營西土之基。",own:[["yuzhong","qin"]]},
{y:-621,k:"政",t:"三良殉秦",s:"yong",d:"秦穆公卒，以子車氏三子殉葬，國人哀之作黃鳥。君子曰秦之不復東征也宜哉。",q:"《詩·秦風·黃鳥》：彼蒼者天，殲我良人。"},
{y:-613,k:"人",t:"三年不鳴",s:"ying",d:"楚莊王即位三年不出號令，日夜為樂。伍舉進隱曰有鳥三年不飛不鳴。王曰三年不飛，飛將沖天。乃罷淫樂而聽政。",q:"《史記》：此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人。"},
{y:-606,k:"政",t:"問鼎中原",s:"luoyi",d:"楚莊王伐陸渾之戎，觀兵於周疆。使問九鼎之大小輕重，王孫滿對曰在德不在鼎。楚之志已在天下。",q:"《左傳》：在德不在鼎……周德雖衰，天命未改。"},
{y:-597,k:"戰",t:"邲之戰",s:"bi",fl:1,heg:"chu",d:"晉楚戰於邲。晉三軍不和，中軍先濟，舟中之指可掬。楚莊王飲馬黃河，遂霸中原。",q:"《左傳》：夫文，止戈為武。",war:{a:"chu",d:"jin",w:"chu",ka:1.5,kd:4.0}},
{y:-594,k:"戰",t:"楚圍宋九月",s:"shangqiu",d:"楚圍宋，城中易子而食，析骸而爨。華元夜入楚軍，登子反之床曰城下之盟有以國斃不能從也。楚為之退三十里。",q:"《左傳》：敝邑易子而食，析骸以爨。"},
{y:-594,k:"變",t:"魯初稅畝",s:"qufu",d:"魯宣公初稅畝，履畝而稅，井田之制自此崩。私田日闢，公室日卑，土地私有之端開於此。"},
{y:-589,k:"戰",t:"鞍之戰",s:"linzi",d:"齊頃公輕晉，曰余姑翦滅此而朝食。逢丑父易位而免其君，晉終大勝，齊歸侵地。",q:"《左傳》：余姑翦滅此而朝食。",war:{a:"jin",d:"qi",w:"jin",ka:1.0,kd:2.5}},
{y:-584,k:"謀",t:"巫臣通吳",s:"gusu",d:"申公巫臣奔晉，請使於吳，教吳乘車、戰陣、叛楚。楚自此疲於奔命，晉得東南之奇兵。",q:"《左傳》：吾使爾罷於奔命以死。"},
{y:-579,k:"盟",t:"第一次弭兵",s:"shangqiu",d:"宋大夫華元合晉楚之成，盟於宋西門之外。曰凡晉楚無相加戎，好惡同之。三年而復戰，然息兵之議自此始。"},
{y:-575,k:"戰",t:"鄢陵之戰",s:"yanling",d:"晉厲公敗楚於鄢陵，呂錡射中楚共王之目，子反醉而自殺。晉之霸業回光，而國內六卿之勢已成。",q:"《左傳》：困獸猶鬥，況國相乎？",war:{a:"jin",d:"chu",w:"jin",ka:1.2,kd:2.6}},
{y:-573,k:"政",t:"悼公復霸",s:"jiang",d:"晉悼公年十四而立，魏絳和戎、三分四軍以疲楚，八年之中九合諸侯，晉室中興。",own:[["shangdang","jin"]]},
{y:-562,k:"謀",t:"三駕疲楚",s:"xinzheng",d:"晉三分其軍更番伐鄭，楚不能救。鄭終附晉，中原復定，此後晉楚不復大戰十餘年。"},
{y:-551,k:"學",t:"孔子生於陬邑",s:"qufu",sg:"kongzi",d:"魯襄公二十二年，孔丘生。父叔梁紇，母顏徵在。其後刪詩書、定禮樂、修春秋，為萬世師表。",q:"《論語》：十有五而志於學，三十而立。"},
{y:-548,k:"政",t:"崔杼弒其君",s:"linzi",d:"齊太史書崔杼弒莊公，崔子殺之；其弟嗣書，又殺之；少弟又書，乃捨之。南史氏執簡而往，聞既書乃還。",q:"《左傳》：崔杼弒其君。"},
{y:-546,k:"盟",t:"向戌弭兵",s:"shangqiu",fl:1,d:"宋向戌合晉楚之成，十四國會於宋。晉楚之從交相見，中原自此四十餘年無大戰，兵禍南移於吳楚。",q:"《左傳》：兵，民之殘也，財用之蠹也。"},
{y:-543,k:"人",t:"子產為政",s:"xinzheng",sg:"zichan",d:"鄭子產執政，作封洫、立謗政、不毀鄉校。一年民歌其取我衣冠，三年而歌其教我子弟。",q:"《左傳》：苟利社稷，死生以之。"},
{y:-536,k:"變",t:"鄭鑄刑書",s:"xinzheng",d:"子產鑄刑書於鼎，公布成文之法。叔向責之曰民知爭端，將棄禮而徵於書。然法治之先聲自此發。"},
{y:-522,k:"人",t:"伍員奔吳",s:"gusu",d:"楚平王殺伍奢父子，伍員亡命，過昭關一夜白頭。漁父渡之，浣女飼之，終入於吳，誓覆楚國。",q:"《史記》：我必覆楚國。"},
{y:-515,k:"謀",t:"專諸刺王僚",s:"gusu",d:"公子光伏甲士於窟室，使專諸置魚腸劍於炙魚之腹，進而刺王僚，鈹交於胸。光立，是為闔閭。"},
{y:-512,k:"學",t:"孫武見吳王",s:"gusu",sg:"sunwu",d:"孫武以兵法十三篇見吳王，勒宮女為陣，斬愛姬二人以明軍法。闔閭知其能用兵，乃以為將。",q:"《孫子》：兵者，國之大事，死生之地，存亡之道。"},
{y:-506,k:"戰",t:"柏舉之戰",s:"baiju",fl:1,d:"吳以三萬之師破楚二十萬於柏舉，五戰及郢。昭王出奔，伍員掘平王墓鞭屍三百。楚幾亡矣。",q:"《史記》：吾日暮途遠，故倒行而逆施之。",war:{a:"wu",d:"chu",w:"wu",ka:1.0,kd:6.0},own:[["ying","wu"]]},
{y:-505,k:"人",t:"申包胥哭秦庭",s:"yong",d:"申包胥立於秦庭，晝夜哭，七日不絕聲。秦哀公為賦無衣，出車五百乘救楚。越人乘虛襲吳，吳師乃還。",q:"《詩·秦風·無衣》：豈曰無衣？與子同袍。王于興師，修我戈矛。",own:[["ying","chu"]]},
{y:-496,k:"戰",t:"檇李之戰",s:"kuaiji",d:"越王勾踐使罪人自剄於陣前，吳師屬目，越乘之而勝。闔閭傷指而死，遺命夫差曰爾忘勾踐殺汝父乎。",war:{a:"yue",d:"wu",w:"yue",ka:0.8,kd:1.5}},
{y:-494,k:"戰",t:"夫椒之戰",s:"fujiao",d:"夫差報父仇，敗越於夫椒。勾踐以五千人保棲會稽，卑辭厚幣，入吳為臣，執箕帚三年。",q:"《國語》：越必興，吳必亡。",war:{a:"wu",d:"yue",w:"wu",ka:1.0,kd:3.0}},
{y:-487,k:"滅",t:"宋滅曹",s:"taoyi",ann:[["cao","song"]],d:"曹伯陽好田弋，聽公孫彊之言而背晉伐宋。宋人圍之，執伯陽及彊以歸而殺之。天下之中陶邑，遂為宋有。"},
{y:-486,k:"變",t:"邗溝通江淮",s:"guangling",d:"吳城邗，溝通江淮，以舟師北上爭霸。中國運河之始，亦吳國國力耗盡之始。"},
{y:-484,k:"戰",t:"艾陵之戰",s:"ailing",d:"吳大敗齊師於艾陵，獲革車八百乘、甲首三千。同年，夫差賜伍子胥屬鏤之劍，胥曰抉吾眼懸東門，以觀越人之入吳。",q:"《史記》：必樹吾墓上以梓，令可以為器；而抉吾眼懸吳東門之上。",war:{a:"wu",d:"qi",w:"wu",ka:0.8,kd:3.0}},
{y:-482,k:"盟",t:"黃池爭長",s:"huangchi",d:"夫差會諸侯於黃池，與晉爭先歃。越王乘虛入吳，焚姑蘇，俘太子友。夫差聞之，秘不發喪，強盟而歸。"},
{y:-479,k:"學",t:"孔子卒",s:"qufu",d:"孔子卒於魯，年七十三。弟子三千，賢者七十二。哲人其萎，然六藝之教流布天下，儒者遂為顯學。",q:"《論語》：朝聞道，夕死可矣。"},
{y:-479,k:"滅",t:"楚滅陳",s:"chenqiu",ann:[["chen","chu"]],d:"楚惠王縣陳。舜後媯姓之國，歷五百餘年而絕。"},
{y:-473,k:"滅",t:"越滅吳",s:"gusu",fl:1,ann:[["wu","yue"]],d:"勾踐臥薪嘗膽二十二年，三戰而滅吳。夫差請為附庸不許，掩面自剄曰吾無面目見子胥。范蠡浮海而去。",q:"《史記》：飛鳥盡，良弓藏；狡兔死，走狗烹。",own:[["langya","yue"]]},
{y:-458,k:"謀",t:"四卿分范中行",s:"jiang",d:"晉之六卿相攻，范氏中行氏先亡，智、趙、韓、魏四家分其田邑。晉侯僅擁虛器。"},
{y:-457,k:"滅",t:"襄子滅代",s:"daidi",own:[["daidi","zhao"]],d:"趙襄子北登夏屋，請代王飲，使廚人以銅斗擊殺之。其姊摩笄自殺。趙北略胡地，遂有代馬之利。"},
{y:-453,k:"戰",t:"晉陽之戰",s:"jinyang",fl:1,d:"智伯圍晉陽，引汾水灌之，城不浸者三版。趙襄子夜使張孟談說韓魏反戈，決水灌智軍，智伯身死國分。豫讓漆身吞炭，五刺趙襄子而不成。",q:"《戰國策》：士為知己者死，女為悅己者容。",brt:["han","zhao","wei"],own:[["jinyang","zhao"],["handan","zhao"],["zhongmou","zhao"],["yuci","zhao"],["chaoge","zhao"],["anyi","wei"],["puban","wei"],["yewang","wei"],["shangdang","han"],["yiyang","han"]],war:{a:"zhao",d:"jin",w:"zhao",ka:1.0,kd:2.0}},
{y:-447,k:"滅",t:"楚滅蔡",s:"shangcai",ann:[["cai","chu"]],d:"楚惠王北上，滅蔡滅杞，東侵廣地至泗上。楚復強於南方。"},
{y:-445,k:"政",t:"魏文侯即位",s:"anyi",d:"魏斯立，師卜子夏，友田子方，禮段干木。以翟璜為相，樂羊吳起為將，西河之學甲於天下。"},
{y:-431,k:"滅",t:"楚滅莒",s:"jucheng",ann:[["ju","chu"]],d:"楚簡王北伐滅莒。莒遠而楚不能守，其地終歸於齊。"},
{y:-422,k:"變",t:"李悝變法",s:"anyi",sg:"likui",d:"魏用李悝，盡地力之教，行平糴之法，撰《法經》六篇。廢世卿世祿，食有勞而祿有功。戰國變法之始。",q:"《漢書》：治國之道，食有勞而祿有功。"},
{y:-419,k:"戰",t:"吳起守西河",s:"quwoyi",sg:"wuqi",own:[["shaoliang","wei"]],d:"魏築城少梁，吳起為西河守，與士卒最下者同衣食，臥不設席，親裹贏糧。秦兵不敢東向者數十年。",q:"《史記》：在德不在險。",war:{a:"wei",d:"qin",w:"wei",ka:0.6,kd:1.8}},
{y:-412,k:"政",t:"齊取莒地",s:"jucheng",own:[["jucheng","qi"]],d:"齊田氏北取莒及安陽，田氏之勢盡包海岱。"},
{y:-409,k:"變",t:"西門豹治鄴",s:"handan",d:"西門豹為鄴令，投巫於河以破河伯娶婦之俗，鑿十二渠溉民田。魏之河內遂為腹地。"},
{y:-408,k:"滅",t:"樂羊拔中山",s:"lingshou",ann:[["zhongshan","wei"]],d:"魏使樂羊伐中山，三年而拔之。羊食其子之羹以明志。文侯賞其功而疑其心，封太子擊於中山。"},
{y:-403,k:"政",t:"三家分晉",s:"jiang",fl:1,e:"戰國",d:"周威烈王命韓虔、趙籍、魏斯為諸侯。天子自壞其藩籬，名分既亡，戰國之世自此始。",q:"《資治通鑑》：非三晉之壞禮，乃天子自壞之也。"},
{y:-391,k:"戰",t:"魏取大梁",s:"daliang",own:[["daliang","wei"]],d:"魏敗楚於大梁榆關，取其地。中原之衝要入於魏，惠王後遂徙都於此。"},
{y:-386,k:"政",t:"田氏代齊",s:"linzi",fl:1,d:"周安王命田和為齊侯。姜太公之祀絕，而田齊立。二百年之陰謀，一朝而成。",q:"《史記》：田常成子取大斗出貸，以小斗收。"},
{y:-381,k:"變",t:"吳起死於楚",s:"ying",d:"楚悼公用吳起變法，明法審令，捐不急之官，廢公族疏遠者。悼公卒，宗室作亂，吳起伏王屍而死，射者盡夷三族。楚法遂廢。",q:"《史記》：楚之貴戚盡欲害吳起。"},
{y:-380,k:"政",t:"中山復國",s:"lingshou",brt:["zhongshan"],own:[["lingshou","zhongshan"],["quyang","zhongshan"]],d:"中山桓公復國於顧，遷都靈壽。白狄之邦再興，號千乘之國，與燕趙抗衡。"},
{y:-376,k:"滅",t:"晉絕祀",s:"jiang",ann:[["jin","wei"]],d:"三晉滅晉侯，遷靜公為家人，分其地。唐叔之後六百餘年而絕。"},
{y:-375,k:"滅",t:"韓滅鄭",s:"xinzheng",ann:[["zheng","han"]],d:"韓哀侯滅鄭，徙都新鄭。鄭自桓公東遷，四百三十二年而亡。天下之樞遂為韓有。",cap:[["han","xinzheng"]]},
{y:-364,k:"戰",t:"石門之敗",s:"shaoliang",d:"秦敗三晉於石門，斬首六萬。周顯王賀以黼黻之服。秦人東出之勢初露。",war:{a:"qin",d:"wei",w:"qin",ka:1.0,kd:6.0}},
{y:-361,k:"政",t:"秦孝公求賢",s:"yueyang",d:"孝公下令國中：賓客群臣有能出奇計強秦者，吾且尊官，與之分土。衛鞅聞是令，西入秦。",q:"《史記》：諸侯卑秦，醜莫大焉。"},
{y:-356,k:"變",t:"商鞅變法",s:"yueyang",sg:"shangyang",fl:1,d:"徙木立信，令行而後民從。什伍連坐，告姦者與斬敵同賞；宗室無軍功者不得屬籍；重農抑商，明尊卑爵秩。秦民勇於公戰而怯於私鬥。",q:"《商君書》：治世不一道，便國不法古。"},
{y:-354,k:"戰",t:"桂陵之戰",s:"guiling",d:"魏圍邯鄲，齊使田忌孫臏救趙。臏曰批亢搗虛，直走大梁。魏師還救，齊伏於桂陵而擒龐涓。",q:"《史記》：夫解雜亂紛糾者不控捲，救鬥者不搏撠。",war:{a:"qi",d:"wei",w:"qi",ka:0.8,kd:2.0}},
{y:-350,k:"變",t:"秦徙咸陽",s:"xianyang",own:[["xianyang","qin"],["hanguguan","qin"]],cap:[["qin","xianyang"]],d:"商鞅第二次變法：築冀闕宮廷於咸陽而徙都，並小鄉聚為縣，開阡陌封疆，平斗桶權衡丈尺。"},
{y:-344,k:"盟",t:"逢澤之會",s:"fenze",d:"魏惠王乘夏車、稱夏王，率十二諸侯朝天子於孟津。齊楚不與，霸業之虛榮乃招四面之怨。"},
{y:-341,k:"戰",t:"馬陵之戰",s:"maling",fl:1,sg:"sunbin",d:"魏伐韓，齊救之。孫臏減灶誘敵，龐涓夜至馬陵，見白書曰龐涓死於此樹之下。萬弩俱發，魏武卒精銳盡喪，太子申被虜。",q:"《史記》：善戰者因其勢而利導之。",war:{a:"qi",d:"wei",w:"qi",ka:1.0,kd:10.0}},
{y:-340,k:"戰",t:"商鞅取河西",s:"shaoliang",own:[["shaoliang","qin"]],d:"衛鞅詐執魏將公子卬而破其軍。魏割河西之地以和，徙都大梁。惠王歎曰寡人恨不用公叔座之言。",war:{a:"qin",d:"wei",w:"qin",ka:0.8,kd:2.5}},
{y:-338,k:"政",t:"商君車裂",s:"xianyang",d:"孝公卒，公子虔告商君欲反。鞅亡至關下，欲舍客舍，舍人曰商君之法舍人無驗者坐之。遂車裂於彤，滅其族，而秦法不廢。",q:"《史記》：嗟乎，為法之敝一至此哉！"},
{y:-334,k:"盟",t:"徐州相王",s:"xuzhou",d:"齊威王與魏惠王會於徐州，互尊為王。周室之號自此為列國所僭，天下無復共主之實。"},
{y:-333,k:"謀",t:"蘇秦合縱",s:"luoyi",sg:"suqin",d:"蘇秦說六國以縱親：以趙為從長，佩六國相印，約秦兵不敢窺函谷關者十五年。",q:"《史記》：使我有洛陽負郭田二頃，豈能佩六國相印乎！"},
{y:-328,k:"謀",t:"張儀相秦",s:"xianyang",sg:"zhangyi",own:[["shangjun","qin"]],d:"張儀為秦相，倡連橫以破縱。魏納上郡十五縣於秦，秦盡有河山之固。",q:"《史記》：視吾舌尚在不？足矣。"},
{y:-325,k:"政",t:"秦惠王稱王",s:"xianyang",d:"秦君始稱王，改元。西陲之國，於是與齊楚魏並列於天下。"},
{y:-323,k:"盟",t:"五國相王",s:"handan",d:"公孫衍倡魏韓趙燕中山五國相王，以抗齊楚秦。中山千乘而與萬乘並王，齊人恥之。"},
{y:-318,k:"戰",t:"五國攻秦",s:"hanguguan",d:"楚魏韓趙燕合縱攻秦，楚懷王為縱長。至函谷關，秦出兵逆之，五國之師皆引而歸。縱約之虛，於此見矣。",war:{a:"han",d:"qin",w:"qin",ka:8.2,kd:1.0}},
{y:-318,k:"學",t:"稷下學宮",s:"linzi",d:"齊宣王大興稷下之學，列大夫之號者七十六人，不治而議論。淳于髡、鄒衍、慎到、田駢、環淵之屬數百千人。",q:"《史記》：齊稷下學士復盛，且數百千人。"},
{y:-316,k:"滅",t:"秦滅巴蜀",s:"chengdu",fl:1,ann:[["shu","qin"],["ba","qin"]],d:"蜀侯與苴侯相攻，皆告急於秦。司馬錯曰得蜀則得楚，楚亡則天下并矣。乃循石牛道伐蜀，十月而定，秦益富厚輕諸侯。",q:"《戰國策》：利盡西海，諸侯不以為暴。"},
{y:-314,k:"戰",t:"齊破燕",s:"ji",own:[["ji","qi"],["wuyang","qi"]],d:"燕王噲讓國於子之，國大亂。齊宣王五旬而舉燕，燕人畔之。孟子曰取之而燕民悅則取之。",war:{a:"qi",d:"yan",w:"qi",ka:1.0,kd:3.0}},
{y:-313,k:"謀",t:"商於之欺",s:"shangyu",own:[["shangyu","qin"],["wuguan","qin"]],d:"張儀許楚商於之地六百里以絕齊。楚絕齊而使者受地，儀曰儀有奉邑六里。懷王大怒，發兵攻秦。",q:"《史記》：儀與王約六里，不聞六百里。"},
{y:-312,k:"戰",t:"丹陽藍田之戰",s:"danyang",d:"秦敗楚師於丹陽，斬首八萬，虜屈匄，取漢中六百里地。楚悉國兵復襲至藍田，又大敗。楚自此一蹶不振。",war:{a:"qin",d:"chu",w:"qin",ka:2.0,kd:8.0},own:[["hanzhong","qin"]]},
{y:-312,k:"政",t:"燕昭王築黃金臺",s:"wuyang",own:[["ji","yan"],["wuyang","yan"]],d:"燕昭王卑身厚幣以招賢者，郭隗曰請自隗始。於是築黃金臺，樂毅自魏往，鄒衍自齊往，劇辛自趙往，燕國殷富。",q:"《戰國策》：士爭湊燕。"},
{y:-307,k:"變",t:"胡服騎射",s:"handan",fl:1,d:"趙武靈王曰愚者闇於成事，智者見於未萌。遂胡服騎射，變車為騎，北破林胡樓煩，闢地千里，築長城自代並陰山至高闕。",q:"《戰國策》：法度制令各順其宜，衣服器械各便其用。",own:[["yanmen","zhao"],["jiuyuan","zhao"]]},
{y:-307,k:"戰",t:"秦拔宜陽",s:"yiyang",own:[["yiyang","qin"]],d:"甘茂拔宜陽，斬首六萬，遂通三川以窺周室。韓之膏腴盡入於秦。",war:{a:"qin",d:"han",w:"qin",ka:1.5,kd:6.0}},
{y:-306,k:"滅",t:"楚滅越",s:"kuaiji",ann:[["yue","chu"]],d:"越王無彊北伐齊而西伐楚，楚威王大敗之，殺無彊，盡取吳故地至浙江。越以此散，諸族子爭立，服朝於楚。"},
{y:-301,k:"戰",t:"垂沙之戰",s:"chuisha",d:"齊韓魏共攻楚，戰於垂沙，殺楚將唐昧。莊蹻起於楚境，楚分而為四。宗廟之危，始於背縱親秦。",war:{a:"qi",d:"chu",w:"qi",ka:2.0,kd:6.0},own:[["wan","qin"]]},
{y:-299,k:"謀",t:"懷王入秦",s:"wuguan",d:"秦昭王約楚懷王會於武關，執之以求割巫黔中郡。懷王不許，遂囚三年，客死於秦。楚人憐之如悲親戚。",q:"《史記》：楚雖三戶，亡秦必楚。"},
{y:-296,k:"滅",t:"趙滅中山",s:"lingshou",ann:[["zhongshan","zhao"]],d:"趙武靈王二十餘年攻中山，至是滅之，遷其王於膚施。趙地始連為一體，北疆無腹心之患。"},
{y:-295,k:"政",t:"沙丘之亂",s:"handan",d:"趙武靈王壯年傳位而自號主父，二子爭立，圍主父於沙丘宮三月，探雀鷇而食，卒餓死。一代雄主，死於己手。"},
{y:-293,k:"戰",t:"伊闕之戰",s:"yique",fl:1,sg:"baiqi",d:"白起以不足十萬之眾，破韓魏聯軍二十四萬於伊闕。韓魏之精銳盡於此。起自此十三年不敗，號為人屠。",q:"《史記》：斬首二十四萬，虜公孫喜，拔五城。",war:{a:"qin",d:"wei",w:"qin",ka:2.0,kd:24.0}},
{y:-288,k:"政",t:"東西二帝",s:"linzi",d:"秦昭王稱西帝，遣使立齊湣王為東帝。蘇代說齊去帝號以收天下之望，秦亦復稱王。名器之爭，終以齊之孤立收場。"},
{y:-286,k:"滅",t:"齊滅宋",s:"shangqiu",ann:[["song","qi"]],d:"宋康王射天笞地，號曰桀宋。齊湣王滅之，盡取淮北之地。天下震恐，而齊亦成眾矢之的。"},
{y:-284,k:"戰",t:"樂毅伐齊",s:"linzi",fl:1,d:"燕昭王使樂毅為上將軍，率燕秦韓趙魏五國之兵破齊於濟西，長驅入臨淄，載其寶器而歸。六月之間下齊七十餘城，唯莒與即墨不下。",q:"《戰國策》：先王之靈，得報齊之讎。",own:[["linzi","yan"],["gaotang","yan"],["jucheng","qi"]],war:{a:"yan",d:"qi",w:"yan",ka:2.0,kd:12.0}},
{y:-279,k:"戰",t:"火牛破燕",s:"jimo",d:"燕惠王疑樂毅，以騎劫代之。田單縱反間、假神師，束兵刃於牛角，灌脂束葦於牛尾，夜出千牛，五千壯士隨之。燕師大駭，七十餘城盡復。",own:[["linzi","qi"],["gaotang","qi"]],war:{a:"qi",d:"yan",w:"qi",ka:1.0,kd:5.0}},
{y:-279,k:"盟",t:"澠池之會",s:"mianchi",d:"秦王令趙王鼓瑟，藺相如請秦王擊缶，以頸血相濺為誓。歸而位在廉頗之上，頗欲辱之，相如引車避匿。頗肉袒負荊而謝。",q:"《史記》：吾所以為此者，以先國家之急而後私讎也。"},
{y:-278,k:"戰",t:"白起拔郢",s:"ying",fl:1,own:[["ying","qin"],["yancheng","qin"],["yiling","qin"]],cap:[["chu","chenqiu"]],d:"白起引西山長谷之水灌鄢城，東北角潰，死者數十萬。遂拔郢，燒夷陵之楚先王墓。楚頃襄王東徙於陳。同年，屈原懷石自沉汨羅。",q:"《楚辭·九章·哀郢》：鳥飛返故鄉兮，狐死必首丘。",sg:"quyuan",war:{a:"qin",d:"chu",w:"qin",ka:2.0,kd:20.0}},
{y:-277,k:"戰",t:"秦取黔中",s:"qianzhong",own:[["qianzhong","qin"]],d:"蜀守張若取巫郡及江南地為黔中郡。楚之西土盡失，僅存江淮之間。"},
{y:-273,k:"戰",t:"華陽之戰",s:"huayang",d:"白起、胡陽八日而至華陽，破趙魏之師，斬首十五萬，沉卒二萬於河。魏獻南陽以和。",war:{a:"qin",d:"wei",w:"qin",ka:2.0,kd:15.0}},
{y:-272,k:"滅",t:"滅義渠",s:"yiquc",ann:[["yiqu","qin"]],own:[["yuzhong","qin"]],d:"宣太后詐而殺義渠戎王於甘泉，遂起兵伐滅義渠。秦置隴西、北地、上郡，築長城以拒胡。後顧之憂盡除。"},
{y:-270,k:"戰",t:"閼與之戰",s:"eyu",d:"秦圍閼與，諸將皆曰道遠險狹難救。趙奢曰其道遠險狹，譬之猶兩鼠鬥於穴中，將勇者勝。乃卷甲而趨，大破秦軍。",q:"《史記》：狹路相逢勇者勝。",war:{a:"zhao",d:"qin",w:"zhao",ka:1.0,kd:3.0}},
{y:-266,k:"謀",t:"范雎相秦",s:"xianyang",d:"范雎說昭王曰王不如遠交而近攻，得寸則王之寸，得尺亦王之尺。又廢太后、逐四貴，秦之王權始專。",q:"《戰國策》：遠交而近攻。"},
{y:-262,k:"謀",t:"上黨歸趙",s:"shangdang",own:[["yewang","qin"],["shangdang","zhao"]],d:"秦拔野王，絕上黨歸路。韓守馮亭不降秦，以十七城歸趙。平原君曰發百萬之軍而攻，逾年歷歲未得一城。趙受之，禍結於此。"},
{y:-260,k:"戰",t:"長平之戰",s:"changping",fl:1,own:[["shangdang","qin"]],d:"廉頗堅壁三年不出。秦行反間，趙以趙括代之。括易將更法，出擊而中伏。白起絕其糧道四十六日，趙軍食人相殺。括自出銳卒搏戰，射殺之，四十萬眾降而盡坑之，遺其小者二百四十人歸趙。",q:"《史記》：括徒能讀其父書傳，不知合變也。",war:{a:"qin",d:"zhao",w:"qin",ka:20.0,kd:45.0}},
{y:-257,k:"戰",t:"邯鄲之圍",s:"handan",d:"秦圍邯鄲三年，趙人炊骨易子。平原君散家財、編妻妾入行伍；毛遂按劍上階說楚；信陵君竊符矯殺晉鄙，率八萬人赴之。三國之師夾擊，秦軍大敗於城下。",q:"《史記》：白起之死非其罪，而秦人憐之。",war:{a:"zhao",d:"qin",w:"zhao",ka:5.0,kd:20.0}},
{y:-256,k:"滅",t:"九鼎入秦",s:"luoyi",fl:1,own:[["luoyi","qin"]],d:"西周君與諸侯約縱攻秦，秦使將軍摎伐之。周君頓首受罪，盡獻其邑三十六、口三萬。赧王卒，周民東亡，九鼎入於秦。八百六十七年之周祚，於是乎終。",q:"《史記》：周初亡。"},
{y:-256,k:"滅",t:"楚滅魯",s:"qufu",ann:[["lu","chu"]],d:"楚考烈王伐滅魯，遷頃公於莒。周公之後，禮樂之邦，至是而絕祀。"},
{y:-251,k:"戰",t:"鄗代之役",s:"haocheng",d:"燕相栗腹以趙壯者盡於長平為由，率六十萬伐趙。廉頗以八萬破燕於鄗，樂乘破之於代，遂圍燕都。趙人雖創，其鋒未鈍。",war:{a:"yan",d:"zhao",w:"zhao",ka:6.0,kd:1.0}},
{y:-249,k:"政",t:"呂不韋相秦",s:"xianyang",sg:"lvbuwei",ann:[["zhou","qin"]],d:"莊襄王立，以呂不韋為相國，封文信侯，食藍田十二縣。滅東周，周祀盡絕。不韋招致賓客三千，著《呂氏春秋》，懸於咸陽市門，能增損一字者予千金。"},
{y:-247,k:"戰",t:"河外之師",s:"hanguguan",d:"信陵君歸魏，率五國之兵敗蒙驁於河外，追至函谷關，秦兵不敢出。此山東合縱之絕唱。秦行反間，魏王廢信陵君，君日夜飲醇酒近婦人而卒。",war:{a:"wei",d:"qin",w:"wei",ka:2.0,kd:4.0}},
{y:-246,k:"政",t:"嬴政即位",s:"xianyang",d:"莊襄王卒，太子政立，年十三，國事皆決於文信侯。同年，韓使水工鄭國說秦鑿涇水為渠，欲疲秦，渠成而關中為沃野，秦以富強。"},
{y:-241,k:"戰",t:"最後合縱",s:"hanguguan",own:[["shouchun","chu"]],cap:[["chu","shouchun"]],d:"趙魏韓燕楚五國攻秦，至蕞而還。楚考烈王懼，東徙都壽春。山東之縱，至此永絕。",war:{a:"chu",d:"qin",w:"qin",ka:4.0,kd:1.0}},
{y:-239,k:"政",t:"秦置東郡",s:"diqiu",own:[["diqiu","qin"],["yewang","wey"]],d:"秦拔衛濮陽，置東郡，徙衛君角於野王。山東諸國之間，橫亙一秦之郡，縱路遂斷。"},
{y:-237,k:"政",t:"諫逐客書",s:"xianyang",sg:"lisi",d:"嫪毐之亂既平，呂不韋免。宗室請一切逐客，李斯上書曰泰山不讓土壤故能成其大。王乃除逐客之令，復斯官。",q:"《諫逐客書》：河海不擇細流，故能就其深。"},
{y:-233,k:"學",t:"韓非死於雲陽",s:"xianyang",sg:"hanfei",d:"秦王見《孤憤》《五蠹》曰嗟乎，寡人得見此人與之遊，死不恨矣。及韓非入秦，李斯姚賈毀之，下獄，遺藥令自殺。其書則為秦法之骨。",q:"《韓非子》：法不阿貴，繩不撓曲。"},
{y:-230,k:"滅",t:"秦滅韓",s:"xinzheng",fl:1,ann:[["han","qin"]],d:"內史騰攻韓，得韓王安，盡納其地為潁川郡。七雄之滅，自韓始。",war:{a:"qin",d:"han",w:"qin",ka:1.0,kd:3.0}},
{y:-229,k:"謀",t:"反間殺李牧",s:"handan",d:"王翦伐趙，李牧司馬尚拒之，歲餘不能下。秦多與趙王寵臣郭開金，言牧欲反。趙王使趙蔥代之，牧不受命，捕而殺之。三月而趙亡。",q:"《史記》：牧死，趙滅。"},
{y:-228,k:"滅",t:"秦破邯鄲",s:"handan",ann:[["zhao","qin"]],d:"王翦破趙軍，虜趙王遷。公子嘉率宗族數百人奔代，自立為代王。趙之社稷，名存而實亡。",war:{a:"qin",d:"zhao",w:"qin",ka:3.0,kd:10.0},own:[["daidi","zhao"]]},
{y:-227,k:"謀",t:"荊軻刺秦",s:"wuyang",fl:1,sg:"jingke",d:"燕太子丹遣荊軻奉樊於期首與督亢地圖入秦。圖窮而匕首見，軻左手把秦王之袖，右手持匕首揕之。王負劍，遂斷其股。軻倚柱而笑，箕踞以罵。",q:"《易水歌》：風蕭蕭兮易水寒，壯士一去兮不復還。"},
{y:-226,k:"戰",t:"秦拔薊城",s:"ji",own:[["ji","qin"],["wuyang","qin"]],d:"王翦破燕，取薊城。燕王喜東保遼東，斬太子丹以獻，秦兵少解。",war:{a:"qin",d:"yan",w:"qin",ka:1.0,kd:4.0}},
{y:-225,k:"滅",t:"水灌大梁",s:"daliang",ann:[["wei","qin"]],d:"王賁引河溝灌大梁，三月城壞，魏王假降。李悝之法、吳起之兵、信陵之才，皆成流水。",war:{a:"qin",d:"wei",w:"qin",ka:1.0,kd:5.0}},
{y:-224,k:"戰",t:"王翦傾國伐楚",s:"shouchun",d:"李信以二十萬伐楚而敗。王翦曰非六十萬不可。王悉發國中兵以委之。翦堅壁不戰，日休士洗沐，投石超距。楚師東引，翦追而破之，項燕自殺。",q:"《史記》：秦王之為人，暴戾恣睢。",war:{a:"qin",d:"chu",w:"qin",ka:5.0,kd:20.0}},
{y:-223,k:"滅",t:"秦滅楚",s:"shouchun",ann:[["chu","qin"]],d:"王翦蒙武破壽春，虜楚王負芻。地方五千里、帶甲百萬之楚，遂為三郡。"},
{y:-222,k:"滅",t:"燕代越盡平",s:"ji",ann:[["yan","qin"],["zhao","qin"]],d:"王賁攻遼東，虜燕王喜；還攻代，虜代王嘉。王翦定江南，降越君，置會稽郡。",own:[["kuaiji","qin"],["gusu","qin"],["langya","qin"]]},

/* --- 底圖 --- */
function poly(g,pts,close){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); if(close) g.closePath(); }
function smooth(g,pts){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(var i=0;i<pts.length-1;i++){ var a=pts[i],b=pts[i+1];
    g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2); }
  var l=pts[pts.length-1]; g.lineTo(l[0],l[1]); }
function buildBase(){
  var g=bx, W=BASE.width, H=BASE.height;
  g.clearRect(0,0,W,H);
  var sg=g.createLinearGradient(0,0,W,H);
  sg.addColorStop(0,"#a8b8b8"); sg.addColorStop(1,"#93a6a8");
  g.fillStyle=sg; g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(255,255,255,.22)"; g.lineWidth=1;
  for(var y=20;y<H;y+=17){ g.beginPath();
    for(var x=0;x<=W;x+=26) g.lineTo(x, y+Math.sin((x+y)*0.012)*4);
    g.stroke(); }
  /* 陸地 */
  var lg=g.createLinearGradient(0,0,W*0.7,H);
  lg.addColorStop(0,"#efe6cd"); lg.addColorStop(.45,"#e6dcc0"); lg.addColorStop(1,"#dbcfae");
  poly(g,LANDP,true); g.fillStyle=lg; g.fill();
  g.save(); poly(g,LANDP,true); g.clip();
  /* 山脈皴筆：秦嶺、太行、崤函、燕山、大別 */
  var MTS=[[[105,34.2],[107,34.0],[109,33.9],[111,33.8],[112.6,33.6]],
   [[112.6,38.6],[113.2,37.4],[113.4,36.3],[113.2,35.4]],
   [[110.6,34.9],[111.6,34.4],[112.4,34.3]],
   [[115.5,40.6],[117.2,40.7],[119.0,41.0],[120.8,41.2]],
   [[113.6,31.4],[115.0,31.2],[116.2,30.9]],
   [[103.2,31.5],[104.0,33.0],[105.4,34.0]],
   [[118.6,35.9],[119.6,36.2],[120.8,36.3]],
   [[110.0,29.3],[111.6,29.0],[113.0,28.6]]];
  g.strokeStyle="rgba(92,74,48,.42)";
  for(var m=0;m<MTS.length;m++){ var pl=MTS[m].map(function(p){return P(p[0],p[1]);});
    for(var k=0;k<pl.length-1;k++){ var a=pl[k],b=pl[k+1];
      var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),n=Math.max(2,Math.round(L/13));
      for(var q=0;q<n;q++){ var t=q/n, px=a[0]+dx*t, py=a[1]+dy*t, h=6+((q*37)%5);
        g.lineWidth=1.35; g.beginPath(); g.moveTo(px-6,py+2); g.lineTo(px,py-h); g.lineTo(px+6,py+2); g.stroke();
        g.lineWidth=1; g.beginPath(); g.moveTo(px+3,py+1); g.lineTo(px+7,py-h*0.55); g.lineTo(px+11,py+1); g.stroke(); } } }
  /* 水系 */
  for(var r=0;r<RIVERS.length;r++){ var rv=RIVERS[r], pl2=rv.p.map(function(p){return P(p[0],p[1]);});
    g.lineCap="round"; g.lineJoin="round";
    smooth(g,pl2); g.strokeStyle="rgba(120,140,150,.35)"; g.lineWidth=rv.w+3.2; g.stroke();
    smooth(g,pl2); g.strokeStyle="#6f8f9c"; g.lineWidth=rv.w; g.stroke();
    smooth(g,pl2); g.strokeStyle="rgba(215,232,236,.55)"; g.lineWidth=rv.w*0.35; g.stroke();
    /* 水名 */
    var mi=Math.floor(pl2.length*0.55), pA=pl2[mi], pB=pl2[Math.min(pl2.length-1,mi+1)];
    g.save(); g.translate(pA[0],pA[1]); g.rotate(Math.atan2(pB[1]-pA[1],pB[0]-pA[0]));
    g.font="13px "+FK; g.fillStyle="rgba(58,80,92,.72)"; g.textAlign="center";
    g.fillText(rv.n,0,-6); g.restore(); }
  g.restore();
  /* 海域題名 */
  var SEAS=[[118.9,38.5,"渤 海"],[121.4,34.6,"黃 海"],[122.6,29.6,"東 海"],[123.0,37.0,"滄 溟"]];
  for(var q3=0;q3<SEAS.length;q3++){ var sp=P(SEAS[q3][0],SEAS[q3][1]);
    g.font="15px "+FK; g.textAlign="center"; g.fillStyle="rgba(58,80,92,.55)";
    g.fillText(SEAS[q3][2],sp[0],sp[1]); }
  /* 海岸線 */
  g.lineJoin="round";
  for(var i2=0;i2<LANDP.length;i2++){ var a2=LANDP[i2], b2=LANDP[(i2+1)%LANDP.length];
    var coast=(i2>=10&&i2<=35);
    g.beginPath(); g.moveTo(a2[0],a2[1]); g.lineTo(b2[0],b2[1]);
    if(coast){ g.strokeStyle="rgba(46,38,26,.62)"; g.lineWidth=1.9; g.setLineDash([]); }
    else { g.strokeStyle="rgba(90,76,52,.28)"; g.lineWidth=1.2; g.setLineDash([7,6]); }
    g.stroke(); }
  g.setLineDash([]);
  /* 長城 */
  for(var w=0;w<WALLS.length;w++){ var wl=WALLS[w], wp=wl.p.map(function(p){return P(p[0],p[1]);});
    smooth(g,wp); g.strokeStyle="rgba(70,56,38,.75)"; g.lineWidth=3.4; g.stroke();
    smooth(g,wp); g.strokeStyle="rgba(232,220,190,.85)"; g.lineWidth=1.2; g.setLineDash([2,5]); g.stroke(); g.setLineDash([]);
    for(var k2=0;k2<wp.length;k2++){ g.fillStyle="rgba(70,56,38,.8)"; g.fillRect(wp[k2][0]-2.5,wp[k2][1]-4.5,5,7); } }
  /* 紙紋 */
  g.globalAlpha=.05;
  for(var n2=0;n2<2600;n2++){ g.fillStyle=(n2%3)?"#6b5a3a":"#fff8e0";
    g.fillRect(Math.random()*W,Math.random()*H,1.4,1.4); }
  g.globalAlpha=1;
}

/* --- 疆域場：加權泰森多邊形 --- */
var fieldC=mk(GW,GH), fx2=fieldC.getContext("2d");
function buildTerr(){
  var act=[]; for(var i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w>0&&c.o&&STATES[c.o]) act.push(c); }
  var img=fx2.createImageData(GW,GH), D=img.data;
  var MAXD=132;
  for(var j=0;j<GH;j++){ var gy=j*CS+CS/2;
    for(var i2=0;i2<GW;i2++){ var idx=j*GW+i2, o=idx*4;
      if(!mask[idx]){ owg[idx]=-1; D[o+3]=0; continue; }
      var gx=i2*CS+CS/2, best=1e18, bi=-1;
      for(var k=0;k<act.length;k++){ var c2=act[k], dx=gx-c2.x, dy=gy-c2.y;
        var d=(dx*dx+dy*dy)/(c2.w*c2.w); if(d<best){ best=d; bi=k; } }
      if(bi<0||best>MAXD*MAXD){ owg[idx]=-1; D[o+3]=0; continue; }
      var st=STATES[act[bi].o]; owg[idx]=sIdx(act[bi].o);
      var col=st.c; D[o]=parseInt(col.substr(1,2),16); D[o+1]=parseInt(col.substr(3,2),16);
      D[o+2]=parseInt(col.substr(5,2),16); D[o+3]=118; } }
  fx2.putImageData(img,0,0);
  var g=tx2; g.clearRect(0,0,TERR.width,TERR.height);
  g.imageSmoothingEnabled=true; g.globalAlpha=1;
  g.drawImage(fieldC,0,0,GW,GH,0,0,TERR.width,TERR.height);
  /* 邊界 */
  var inner=[], outer=[];
  for(var j2=0;j2<GH;j2++) for(var i3=0;i3<GW;i3++){ var a=owg[j2*GW+i3];
    if(i3+1<GW){ var b=owg[j2*GW+i3+1]; if(a!==b){ (a>=0&&b>=0?inner:outer).push([(i3+1)*CS,j2*CS,(i3+1)*CS,(j2+1)*CS]); } }
    if(j2+1<GH){ var c3=owg[(j2+1)*GW+i3]; if(a!==c3){ (a>=0&&c3>=0?inner:outer).push([i3*CS,(j2+1)*CS,(i3+1)*CS,(j2+1)*CS]); } } }
  g.lineCap="round";
  g.strokeStyle="rgba(60,44,26,.30)"; g.lineWidth=2.4; g.beginPath();
  for(var e2=0;e2<outer.length;e2++){ var s2=outer[e2]; g.moveTo(s2[0],s2[1]); g.lineTo(s2[2],s2[3]); } g.stroke();
  g.strokeStyle="rgba(48,34,18,.72)"; g.lineWidth=2.0; g.beginPath();
  for(var e3=0;e3<inner.length;e3++){ var s3=inner[e3]; g.moveTo(s3[0],s3[1]); g.lineTo(s3[2],s3[3]); } g.stroke();
  SIM.dirty=false;
}

/* ============ 十二、演出物件 ============ */
function addFX(o){ o.t=0; SIM.fx.push(o); }
function spawnBattle(e){
  var st=CITY[e.s]; if(!st) return; var w=e.war;
  var A=STATES[w.a]&&CITY[STATES[w.a].cap], D=STATES[w.d]&&CITY[STATES[w.d].cap];
  var mar=2.55;
  if(A) for(var i=0;i<4;i++) SIM.armies.push({x0:A.x+(i-1.5)*10,y0:A.y+(i-1.5)*8,x1:st.x,y1:st.y,t:-i*0.12,dur:mar,c:STATES[w.a].c,n:w.a});
  if(D) for(var j=0;j<4;j++) SIM.armies.push({x0:D.x+(j-1.5)*10,y0:D.y+(j-1.5)*8,x1:st.x,y1:st.y,t:-j*0.12,dur:mar,c:STATES[w.d].c,n:w.d});
  addFX({k:"clash",x:st.x,y:st.y,dur:6.0,d0:mar*0.86});
  var tot=(w.ka||0)+(w.kd||0);
  if(tot>0) addFX({k:"num",x:st.x,y:st.y-26,dur:7.4,d0:mar*0.95,s:"斬首 "+fmtWan(tot)+" 級"});
  SIM.kills+=tot; SIM.battles++;
  SIM.marks.push({x:st.x,y:st.y,y0:SIM.year,s:Math.min(1,tot/24)});
  if(SIM.marks.length>70) SIM.marks.shift();
  beat(tot);
}
function fmtWan(v){ return (v>=10? Math.round(v): Math.round(v*10)/10)+"萬"; }
function spawnMarch(){
  var alive=[]; for(var s in STATES) if(STATES[s].live&&CITY[STATES[s].cap]) alive.push(s);
  if(alive.length<2) return;
  var a=alive[(Math.random()*alive.length)|0], b=alive[(Math.random()*alive.length)|0];
  if(a===b) return; var A=CITY[STATES[a].cap];
  var cand=[]; for(var i=0;i<CLIST.length;i++){ var c=CLIST[i];
    if(c.o===b&&c.w>0&&Math.hypot(c.x-A.x,c.y-A.y)<330) cand.push(c); }
  if(!cand.length) return; var T=cand[(Math.random()*cand.length)|0];
  SIM.armies.push({x0:A.x,y0:A.y,x1:T.x,y1:T.y,t:0,dur:4.5+Math.random()*3,c:STATES[a].c,n:a,ghost:1});
}

/* ============ 十三、主繪製 ============ */
var pulseT=0;
function draw(dt){
  pulseT+=dt;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,CW,CH);
  var z=fitZ()*SIM.camz;
  cx.save();
  cx.translate(CW/2,CH/2+14); cx.scale(z,z); cx.translate(-SIM.camx,-SIM.camy);
  cx.shadowColor="rgba(0,0,0,.6)"; cx.shadowBlur=40; cx.shadowOffsetY=10;
  cx.drawImage(BASE,0,0); cx.shadowBlur=0; cx.shadowOffsetY=0;
  if(SIM.layTer) cx.drawImage(TERR,0,0);
  drawMarks(); drawArmies(dt); drawCities(z); drawFX(dt,z); drawHeg();
  cx.restore();
}
function drawMarks(){
  for(var i=0;i<SIM.marks.length;i++){ var m=SIM.marks[i];
    var age=(SIM.year-m.y0)/70; if(age>1) continue;
    cx.globalAlpha=(1-age)*0.42; cx.strokeStyle="#8b1f13"; cx.lineWidth=1.4+m.s*2.2;
    var r=3+m.s*7;
    cx.beginPath(); cx.moveTo(m.x-r,m.y-r); cx.lineTo(m.x+r,m.y+r);
    cx.moveTo(m.x+r,m.y-r); cx.lineTo(m.x-r,m.y+r); cx.stroke(); }
  cx.globalAlpha=1;
}
function drawArmies(dt){
  if(!SIM.layArm){ SIM.armies=[]; return; }
  for(var i=SIM.armies.length-1;i>=0;i--){ var a=SIM.armies[i]; a.t+=dt;
    var p=a.t/a.dur; if(p>=1){ SIM.armies.splice(i,1); continue; }
    if(p<0) continue;
    var dx=a.x1-a.x0, dy=a.y1-a.y0, L=Math.hypot(dx,dy)||1;
    var nx=-dy/L, ny=dx/L, bow=Math.min(64,L*0.19);
    var mx=(a.x0+a.x1)/2+nx*bow, my=(a.y0+a.y1)/2+ny*bow;
    function bez(t){ var u=1-t; return [u*u*a.x0+2*u*t*mx+t*t*a.x1, u*u*a.y0+2*u*t*my+t*t*a.y1]; }
    var tail=Math.max(0,p-0.30), head=p;
    cx.globalAlpha=a.ghost?0.36:0.85;
    cx.strokeStyle=a.c; cx.lineWidth=a.ghost?1.6:2.6; cx.lineCap="round";
    cx.beginPath(); var st=bez(tail); cx.moveTo(st[0],st[1]);
    for(var t=tail;t<=head;t+=0.035){ var q=bez(Math.min(head,t)); cx.lineTo(q[0],q[1]); } cx.stroke();
    var h=bez(head), h2=bez(Math.max(0,head-0.02));
    var ang=Math.atan2(h[1]-h2[1],h[0]-h2[0]);
    cx.save(); cx.translate(h[0],h[1]); cx.rotate(ang);
    cx.fillStyle=a.c; cx.beginPath(); cx.moveTo(7,0); cx.lineTo(-4,4); cx.lineTo(-4,-4); cx.closePath(); cx.fill();
    if(!a.ghost){ cx.fillStyle="rgba(30,22,14,.85)"; cx.fillRect(-3,-9,1.4,9);
      cx.fillStyle=a.c; cx.beginPath(); cx.moveTo(-1.6,-9); cx.lineTo(4,-7); cx.lineTo(-1.6,-5); cx.closePath(); cx.fill(); }
    cx.restore(); }
  cx.globalAlpha=1;
}
function drawCities(z){
  var showAll=z>fitZ()*1.3;
  for(var i=0;i<CLIST.length;i++){ var c=CLIST[i];
    if(c.t===4){ continue; }
    var st=STATES[c.o], col=st?st.c:"#7a6a52";
    if(c.flash>0){ c.flash-=0.012; cx.globalAlpha=Math.max(0,c.flash);
      cx.strokeStyle="#f0d38a"; cx.lineWidth=2; cx.beginPath();
      cx.arc(c.x,c.y,7+ (1-c.flash)*16,0,6.283); cx.stroke(); cx.globalAlpha=1; }
    var iscap=st&&st.cap===c.id;
    if(iscap){
      cx.fillStyle=col; cx.strokeStyle="rgba(24,18,10,.9)"; cx.lineWidth=1.3;
      cx.beginPath(); cx.moveTo(c.x,c.y-7.4); cx.lineTo(c.x+6.6,c.y); cx.lineTo(c.x,c.y+7.4); cx.lineTo(c.x-6.6,c.y); cx.closePath();
      cx.fill(); cx.stroke();
      cx.fillStyle="rgba(255,246,220,.92)"; cx.fillRect(c.x-1.2,c.y-15,1.1,8);
      cx.fillStyle=col; cx.beginPath(); cx.moveTo(c.x-0.1,c.y-15); cx.lineTo(c.x+6,c.y-13); cx.lineTo(c.x-0.1,c.y-11); cx.closePath(); cx.fill();
    } else if(c.t===3){
      cx.fillStyle="rgba(40,30,18,.9)"; cx.fillRect(c.x-4.5,c.y-3.5,9,7);
      cx.fillStyle=col; cx.fillRect(c.x-3.2,c.y-2.2,6.4,4.4);
    } else {
      var r=c.t===1?4.4:3.1;
      cx.fillStyle=col; cx.strokeStyle="rgba(24,18,10,.8)"; cx.lineWidth=1.1;
      cx.beginPath(); cx.arc(c.x,c.y,r,0,6.283); cx.fill(); cx.stroke();
      if(c.t===1){ cx.strokeStyle="rgba(255,248,222,.6)"; cx.lineWidth=.9;
        cx.beginPath(); cx.arc(c.x,c.y,r+2.4,0,6.283); cx.stroke(); } }
  }
  if(!SIM.layNam) return;
  cx.textAlign="center"; cx.textBaseline="alphabetic";
  for(var k=0;k<CLIST.length;k++){ var c2=CLIST[k]; if(c2.t===4) continue;
    var st2=STATES[c2.o]; var iscap2=st2&&st2.cap===c2.id;
    if(!(iscap2||c2.t<=1||showAll)) continue;
    var fs=iscap2?14:(c2.t<=1?12:10.5);
    cx.font=fs+"px "+FK;
    var tw=cx.measureText(c2.n).width, ty=c2.y-(iscap2?21:12.5);
    cx.fillStyle="rgba(240,232,208,.82)"; cx.fillRect(c2.x-tw/2-3,ty-fs+2.5,tw+6,fs+1.5);
    cx.fillStyle="rgba(28,20,12,.94)"; cx.fillText(c2.n,c2.x,ty);
    if(iscap2){ cx.font="9.5px "+FT; cx.fillStyle=st2.c;
      cx.fillText(st2.n,c2.x,ty-fs-1.5); } }
}
function drawHeg(){
  if(!SIM.heg||!STATES[SIM.heg]||!STATES[SIM.heg].live) return;
  var c=CITY[STATES[SIM.heg].cap]; if(!c) return;
  var r=16+Math.sin(pulseT*2)*2.4;
  cx.strokeStyle="rgba(240,211,138,.75)"; cx.lineWidth=1.6;
  cx.beginPath(); cx.arc(c.x,c.y,r,0,6.283); cx.stroke();
  cx.setLineDash([3,5]); cx.strokeStyle="rgba(240,211,138,.5)";
  cx.beginPath(); cx.arc(c.x,c.y,r+5,0,6.283); cx.stroke(); cx.setLineDash([]);
}
function drawFX(dt,z){
  for(var i=SIM.fx.length-1;i>=0;i--){ var f=SIM.fx[i]; f.t+=dt;
    if(f.t>f.dur){ SIM.fx.splice(i,1); continue; }
    var lt=f.t-(f.d0||0); if(lt<0) continue;
    var p=lt/(f.dur-(f.d0||0));
    if(f.k==="clash"){
      for(var r=0;r<3;r++){ var pp=p-r*0.14; if(pp<0||pp>1) continue;
        cx.globalAlpha=(1-pp)*0.8; cx.strokeStyle=r?"rgba(200,163,74,.9)":"rgba(180,50,34,.95)";
        cx.lineWidth=(1-pp)*3.4+0.6; cx.beginPath(); cx.arc(f.x,f.y,10+pp*76,0,6.283); cx.stroke(); }
      cx.globalAlpha=Math.max(0,1-p*0.85); var s=20+Math.sin(p*26)*2.4;
      cx.strokeStyle="#2b1a10"; cx.lineWidth=3.4;
      cx.beginPath(); cx.moveTo(f.x-s,f.y-s); cx.lineTo(f.x+s,f.y+s);
      cx.moveTo(f.x+s,f.y-s); cx.lineTo(f.x-s,f.y+s); cx.stroke();
      cx.strokeStyle="rgba(255,240,200,.9)"; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(f.x-s,f.y-s); cx.lineTo(f.x+s,f.y+s);
      cx.moveTo(f.x+s,f.y-s); cx.lineTo(f.x-s,f.y+s); cx.stroke();
      if(!f.ink){ f.ink=[]; for(var q=0;q<26;q++){ var a=Math.random()*6.283, d=6+Math.random()*40;
        f.ink.push([Math.cos(a)*d,Math.sin(a)*d,1+Math.random()*2.6]); } }
      for(var q2=0;q2<f.ink.length;q2++){ var ik=f.ink[q2];
        cx.globalAlpha=Math.max(0,(1-p)*0.65); cx.fillStyle="#8b1f13";
        cx.beginPath(); cx.arc(f.x+ik[0]*p*1.5,f.y+ik[1]*p*1.5,ik[2]*(1-p*0.5),0,6.283); cx.fill(); }
    } else if(f.k==="num"){
      cx.globalAlpha=Math.max(0,Math.min(1,(1-p)*1.6));
      cx.font="22px "+FK; cx.textAlign="center";
      cx.lineWidth=4.6; cx.strokeStyle="rgba(20,14,8,.92)";
      cx.strokeText(f.s,f.x,f.y-p*30); cx.fillStyle="#ffdcc2";
      cx.fillText(f.s,f.x,f.y-p*30); }
  }
  cx.globalAlpha=1;
}

var rankT=0;
function updateRank(dt){
  rankT-=dt; if(rankT>0) return; rankT=0.45;
  var arr=[],n=0;
  for(var s in STATES){ if(!STATES[s].live) continue; var v=stStrength(s);
    if(v<=0&&s!=="zhou") continue; arr.push({id:s,v:v,c:cityCount(s)}); n++; }
  arr.sort(function(a,b){return b.v-a.v;});
  var mx=arr.length?arr[0].v:1, h="";
  var ef=(SIM.year<-600?0.22:SIM.year<-475?0.36:SIM.year<-350?0.7:1.0);
  for(var i=0;i<Math.min(12,arr.length);i++){ var a=arr[i], st=STATES[a.id];
    var tro=Math.max(1,Math.round(18*Math.sqrt(a.v)*ef)); 
    h+="<div class=\"row\"><span class=\"sq\" style=\"background:"+st.c+"\"></span>";
    h+="<span class=\"nm\">"+st.n+"</span><span class=\"hg\">"+(SIM.heg===a.id?"霸":"")+"</span>";
    h+="<span class=\"bw\"><i class=\"bf\" style=\"width:"+(a.v/mx*100).toFixed(1)+"%;background:"+st.c+"\"></i></span>";
    h+="<span class=\"vl\">"+a.c+"邑·"+tro+"萬甲</span></div>"; }

function pushWar(y,txt,kill){
  var d=document.createElement("div"); d.className="wi";
  d.innerHTML="<span class=\"y\">前"+(-y)+"</span>"+txt+(kill?" <span class=\"k\">斬"+fmtWan(kill)+"</span>":"");
  var L=$("warL"); L.insertBefore(d,L.firstChild);
  while(L.children.length>40) L.removeChild(L.lastChild);
}
var narrFull="",narrShown=0,narrSpd=42;

  narrFull=txt; narrShown=0; $("narrD").textContent=""; $("narrQ").textContent=""; $("narrQ").style.display="none";

var chartC=$("chart"), ccx=chartC.getContext("2d");

/* ============ 十五、聲音 ============ */
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beat(mag){ if(!SIM.snd) return; var a=audio(); if(!a) return;
  var t=a.currentTime;
  var o=a.createOscillator(), g=a.createGain();
  o.type="sine"; o.frequency.setValueAtTime(74,t); o.frequency.exponentialRampToValueAtTime(38,t+0.5);
  g.gain.setValueAtTime(Math.min(0.5,0.16+mag*0.012),t); g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.8);
  var o2=a.createOscillator(), g2=a.createGain();
  o2.type="triangle"; o2.frequency.setValueAtTime(392,t+0.05);
  g2.gain.setValueAtTime(0.10,t+0.05); g2.gain.exponentialRampToValueAtTime(0.001,t+1.5);
  o2.connect(g2); g2.connect(a.destination); o2.start(t+0.05); o2.stop(t+1.6); }
function bell(){ if(!SIM.snd) return; var a=audio(); if(!a) return; var t=a.currentTime;
  [523.3,392.0,261.6].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain();
    o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.001,t+i*0.09);
    g.gain.exponentialRampToValueAtTime(0.13,t+i*0.09+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+2.2);
    o.connect(g); g.connect(a.destination); o.start(t+i*0.09); o.stop(t+i*0.09+2.4); }); }

/* ============ 十六、時間推進 ============ */
var YPS=1.75;
function fireEvent(e){
  applyEv(e); SIM.lastEv=e;
  setNarr(e);
  if(e.sg) showSage(e.sg);
  if(e.fl){ showFlash(e.t,"前 "+(-e.y)+" 年"); bell(); }
  if(e.war){ spawnBattle(e);
    var w=e.war, A=STATES[w.a], D=STATES[w.d];
    pushWar(e.y,"<b>"+e.t+"</b>　"+(A?A.n:"")+" 攻 "+(D?D.n:"")+"，"+(STATES[w.w]?STATES[w.w].n:"")+"勝",(w.ka||0)+(w.kd||0)); }
  else if(e.k==="滅"||e.k==="盟"||e.k==="變") pushWar(e.y,"<b>"+e.t+"</b>　"+e.k,0);
  if(SIM.layCam&&!userCam&&e.s) focusOn(e.s, e.war?1.85:1.5);
  var hold=2.0+Math.min(3.2,e.d.length/48);
  if(e.fl) hold+=1.0;
  SIM.hold=hold/Math.max(0.35,SIM.speed);
}
var ambI=0;
function ambientFor(y){ for(var i=0;i<AMBI.length;i++) if(y>=AMBI[i].y0&&y<=AMBI[i].y1){
  var a=AMBI[i].a; return a[(ambI++)%a.length]; } return ""; }
var sinceAmb=0, sinceMarch=0;
function step(dt){
  if(SIM.hold>0){ SIM.hold-=dt; if(SIM.hold<0) SIM.hold=0; return; }
  if(!SIM.playing) return;
  if(SIM.ei<EV.length&&EV[SIM.ei].y<=SIM.year){ fireEvent(EV[SIM.ei]); SIM.ei++; sinceAmb=0; return; }
  if(SIM.year>=-221){ SIM.playing=false; $("bPlay").textContent="▶ 播放";
    setNarr({k:"終",t:"六王畢，四海一",y:-221,s:"xianyang",d:"秦既併天下，議帝號，稱始皇帝。分天下為三十六郡，郡置守尉監。收天下兵聚咸陽，銷鋒鏑鑄金人十二。一法度衡石丈尺，車同軌，書同文字。五百五十年之春秋戰國，於是乎終。",q:"《史記·秦始皇本紀》：六合之內，皇帝之土。人跡所至，無不臣者。"});
    showFlash("天下一統","前 二二一 年"); bell(); focusWide(); return; }
  SIM.t+=dt*YPS*SIM.speed;
  while(SIM.t>=1){ SIM.t-=1; SIM.year++;
    sampleHist(SIM.year); if(SIM.hist.length>800) SIM.hist.shift();
    showIdiom(SIM.year);
    sinceAmb++; sinceMarch++;
    if(sinceMarch>=3&&SIM.layArm){ sinceMarch=0; spawnMarch(); }
    if(SIM.ei<EV.length&&EV[SIM.ei].y<=SIM.year){ fireEvent(EV[SIM.ei]); SIM.ei++; sinceAmb=0; return; }
    if(sinceAmb>=9){ sinceAmb=0; setAmbient(ambientFor(SIM.year));
      if(SIM.layCam&&!userCam) focusWide(); }
  }
}
function jumpTo(y){
  rewindTo(y); idiomI=0; for(var i=0;i<IDIOMS.length;i++) if(IDIOMS[i][0]<=y) idiomI=i+1;
  $("warL").innerHTML=""; $("sage").classList.remove("on");
  var last=null; for(var j=0;j<EV.length;j++) if(EV[j].y<=y) last=EV[j];
  if(last) setNarr(last); else setAmbient(ambientFor(y));
  lastTopY=null; updateTop(); drawChart(); focusWide(); SIM.hold=0.4;
}
function gotoEvent(dir){
  var i=(dir>0? SIM.ei : SIM.ei-2);
  i=Math.max(0,Math.min(EV.length-1,i));
  var y=EV[i].y;
  rewindTo(y-1); $("warL").innerHTML=""; $("sage").classList.remove("on");
  idiomI=0; for(var k=0;k<IDIOMS.length;k++) if(IDIOMS[k][0]<=y) idiomI=k+1;
  while(SIM.ei<i){ applyEv(EV[SIM.ei]); SIM.ei++; }
  SIM.year=y; fireEvent(EV[i]); SIM.ei=i+1;
  lastTopY=null; updateTop(); drawChart();
}

/* ============ 十七、交互 ============ */

/* ============ 十八、主循環 ============ */
var prev=performance.now(), chartT=0, frameNo=0;
function loop(now){
  var dt=SIM.fixed? SIM.fixed : Math.min(0.06,(now-prev)/1000); prev=now;
  frameNo++; if(SIM.limit&&frameNo>SIM.limit) dt=0;  /* 定格：截幀與錄製用 */
  step(dt); tickNarr(dt); updateTop(); updateRank(dt);
  if(SIM.dirty) buildTerr();
  var k=1-Math.pow(0.0016,dt);
  SIM.camx+=(SIM.tx-SIM.camx)*k; SIM.camy+=(SIM.ty-SIM.camy)*k; SIM.camz+=(SIM.tz-SIM.camz)*k;
  if(idiomT>0){ idiomT-=dt; if(idiomT<=0) $("idiom").classList.remove("on"); }
  chartT-=dt; if(chartT<=0){ chartT=0.5; drawChart(); }
  draw(dt);
  requestAnimationFrame(loop);
}

/* ============ 十九、啟動 ============ */
function boot(){
  buildBase(); rewindTo(-770); buildTerr();
  setAmbient("周室東遷，王綱解紐。天子之令不出王畿，而諸侯之兵起於四方。");
  lastTopY=null; updateTop(); drawChart();
  focusWide(); SIM.camx=SIM.tx; SIM.camy=SIM.ty; SIM.camz=SIM.tz;
  /* 深鏈：?y=-260 直達某年，?auto=1 略過序幕，?z=1.8 指定景別 */
  try{ var qs=location.search||"";
    var my=/[?&]y=(-?[0-9]+)/.exec(qs), mz=/[?&]z=([0-9.]+)/.exec(qs);
    if(my){ jumpTo(Math.max(-770,Math.min(-221,parseInt(my[1],10)))); }
    if(mz){ SIM.tz=SIM.camz=Math.max(0.72,Math.min(4.6,parseFloat(mz[1]))); }
    var ms=/[?&]spd=([0-9.]+)/.exec(qs); if(ms){ SIM.speed=Math.max(0.25,Math.min(8,parseFloat(ms[1]))); $("spd").textContent=SIM.speed.toFixed(2)+"×"; }
    /* 確定性步進：錄製或截幀用，每幀固定 1/60 秒 */
    if(/[?&]step=1/.test(qs)) SIM.fixed=1/60;
    var mf=/[?&]frame=([0-9]+)/.exec(qs); if(mf) SIM.limit=parseInt(mf[1],10);
    if(/[?&]auto=1/.test(qs)){ var iv=$("intro"); iv.classList.add("off"); iv.style.display="none"; $("title").style.opacity=1;
      SIM.playing=true; $("bPlay").textContent="‖ 暫停"; $("hint").style.opacity=0; }
  }catch(e){}
  requestAnimationFrame(loop);
}
