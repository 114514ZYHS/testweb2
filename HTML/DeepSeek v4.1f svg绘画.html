<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1220">
<title>SVG 手绘复刻 · 白鲸女仆</title>
<style>
  :root{
    --ink:#e9edf8;
    --dim:#8d99b8;
    --accent:#5b86cf;
    --accent-2:#9bbddd;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(130% 95% at 50% -10%, #1b2645 0%, #101829 48%, #070b14 100%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.2vh,20px);
    min-height:100vh;
    min-height:100dvh;
    padding:clamp(12px,2.4vh,24px) 14px calc(clamp(12px,2.4vh,24px) + var(--safe-b));
    overflow-x:hidden;
    overflow-y:auto;
    user-select:none;-webkit-user-select:none;
  }
  /* ---------- 画纸 ---------- */
  .stage{position:relative;display:grid;place-items:center;width:100%}
  .paper{
    position:relative;
    width:min(90vw, 64vh, 660px);
    aspect-ratio:1 / 1;
    border-radius:16px;
    overflow:hidden;
    background:#fefefe;
    box-shadow:
      0 26px 60px -22px rgba(0,0,0,.82),
      0 0 0 1px rgba(155,189,221,.16),
      0 0 70px -26px rgba(91,134,207,.6);
  }
  .paper::after{ /* 纸面高光 */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.5),rgba(255,255,255,0) 42%);
    mix-blend-mode:soft-light;
  }
  svg#art{width:100%;height:100%;display:block}
  /* 无 JS 时也直接显示成稿 */
  #sketch{opacity:0}
  #fills,#inks{opacity:1}
  .sk{stroke-dasharray:1;stroke-dashoffset:1}
  /* ---------- 控制条 ---------- */
  .hud{
    width:min(90vw, 64vh, 660px);
    display:flex;flex-direction:column;gap:9px;
  }
  .row{display:flex;align-items:center;gap:12px}
  button#play{
    flex:0 0 auto;
    appearance:none;border:1px solid rgba(155,189,221,.28);
    background:linear-gradient(180deg,#3a5da8,#2b4784);
    color:#f2f6ff;font:600 15px/1 inherit;
    padding:12px 20px;border-radius:999px;cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(91,134,207,.95),inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .16s ease,filter .16s ease,opacity .2s ease;
    white-space:nowrap;letter-spacing:.02em;
  }
  button#play:active{transform:translateY(1px) scale(.985)}
  button#play[disabled]{opacity:.55;filter:saturate(.6);cursor:default}
  @media (hover:hover){button#play:hover:not([disabled]){filter:brightness(1.1)}}
  .track{
    position:relative;flex:1 1 auto;height:6px;border-radius:999px;
    background:rgba(155,189,221,.16);overflow:hidden;
  }
  .track i{
    position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#4f7ac2,#9bbddd);
    box-shadow:0 0 14px rgba(155,189,221,.75);
    transition:width .09s linear;
  }
  .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--dim)}
  .meta b{color:var(--accent-2);font-weight:600;letter-spacing:.04em}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .steps span{
    padding:3px 9px;border-radius:999px;font-size:11.5px;letter-spacing:.03em;
    background:rgba(155,189,221,.09);color:var(--dim);
    border:1px solid transparent;transition:all .3s ease;
  }
  .steps span.on{background:rgba(91,134,207,.24);color:#dfe9ff;border-color:rgba(155,189,221,.45)}
  .steps span.done{color:#8fa7cc}
  @media (max-width:420px){
    .meta{font-size:11.5px}
    .steps span{padding:2px 7px;font-size:10.5px}
    button#play{padding:11px 16px;font-size:14px}
  }
  /* 载入遮罩 */
  #boot{
    position:fixed;inset:0;display:grid;place-items:center;z-index:9;
    background:#0a0f1c;color:var(--dim);font-size:13px;letter-spacing:.14em;
    transition:opacity .5s ease;pointer-events:none;
  }
  #boot.off{opacity:0}
  @media (prefers-reduced-motion:reduce){
    .track i{transition:none}
  }
</style>
</head>

  <div class="hud">
    <div class="row">
      <button id="play" type="button">▶ 播放绘画过程</button>
      <div class="track"><i id="prog"></i></div>
    </div>
    <div class="meta">
      <div class="steps" id="steps">
        <span data-k="sketch">草稿</span>
        <span data-k="ink">勾线</span>
        <span data-k="color">上色</span>
        <span data-k="done">完成</span>
      </div>
      <div id="hint">点击按钮，从头看这幅画被画出来</div>
    </div>
  </div>

  <noscript><style>#sketch{opacity:0}#fills,#inks{opacity:1}</style></noscript>
  <div id="boot">正在准备画布…</div>

<script>
(function(){
  "use strict";
  var art      = document.getElementById('art');
  var paperEl  = document.getElementById('paper');
  var sketchG  = document.getElementById('sketch');
  var fillsG   = document.getElementById('fills');
  var inksG    = document.getElementById('inks');
  var btn      = document.getElementById('play');
  var prog     = document.getElementById('prog');
  var hint     = document.getElementById('hint');
  var stepsBox = document.getElementById('steps');
  var stepEls  = {};
  Array.prototype.forEach.call(stepsBox.querySelectorAll('span'), function(s){ stepEls[s.dataset.k] = s; });

  var sk = Array.prototype.slice.call(sketchG.querySelectorAll('.sk'));
  var ik = Array.prototype.slice.call(inksG.querySelectorAll('.ik'));
  var fl = Array.prototype.slice.call(fillsG.querySelectorAll('.fl'));

  /* 按纵坐标排布，让"落笔"自上而下推进 */
  sk.sort(function(a,b){ return (+a.dataset.y) - (+b.dataset.y); });
  ik.sort(function(a,b){ return (+a.dataset.y) - (+b.dataset.y); });

  /* 上色顺序：底色 → 皮肤 → 头发 → 深色衣物 → 灰调 → 缎带 → 腮红 → 红叉 */
  var CAT = ['white','skin','hair','dark','other','ribbon','blush','red'];
  var byCat = {};
  fl.forEach(function(el){ (byCat[el.dataset.cat] = byCat[el.dataset.cat] || []).push(el); });
  CAT.forEach(function(c){ (byCat[c]||[]).sort(function(a,b){ return (+a.dataset.y)-(+b.dataset.y); }); });

  /* ---------------- 时间轴（毫秒） ---------------- */
  var D = {
    paper:    260,
    skStart:  260,  skDur: 430, skStag: 20,
    inkStart: 3180, inkDur: 560, inkStag: 92,
    colStart: 5400, colDur: 500, colStag: 82, colGap: 130,
    fadeAt:   8850, fadeDur: 750
  };

  var plan = [];       /* {el, delay, dur, kind} */
  sk.forEach(function(el,i){
    plan.push({el:el, delay:D.skStart + i*D.skStag, dur:D.skDur, kind:'sk'});
  });
  ik.forEach(function(el,i){
    plan.push({el:el, delay:D.inkStart + i*D.inkStag, dur:D.inkDur, kind:'ink'});
  });
  var cursor = D.colStart;
  CAT.forEach(function(c){
    var list = byCat[c] || [];
    list.forEach(function(el,i){
      plan.push({el:el, delay:cursor + i*D.colStag, dur:D.colDur, kind:'fill'});
    });
    if(list.length) cursor += list.length*D.colStag + D.colGap;
  });

  var colEnd = 0;
  plan.forEach(function(p){ colEnd = Math.max(colEnd, p.delay + p.dur); });
  var TOTAL = Math.max(colEnd, D.fadeAt + D.fadeDur);

  var anims = [];
  var raf = 0, t0 = 0, playing = false;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function anim(el, frames, opts){
    var a = el.animate(frames, opts);
    if(opts && opts.compositeHint){ el.style.willChange = 'opacity, transform'; }
    try{
      a.finished.then(function(){ if(opts && opts.compositeHint) el.style.willChange = ''; }, function(){});
    }catch(e){}
    anims.push(a);
    return a;
  }

  function clearAnims(){
    anims.forEach(function(a){ try{ a.cancel(); }catch(e){} });
    anims = [];
    if(raf) cancelAnimationFrame(raf), raf = 0;
  }

  /* 终态：完整画作 */
  function showFinal(){
    clearAnims();
    sk.forEach(function(el){ el.style.strokeDashoffset = '0'; el.style.opacity = '1'; });
    sketchG.style.opacity = '0';
    ik.forEach(function(el){ el.style.opacity = '1'; });
    fl.forEach(function(el){ el.style.opacity = '1'; });
    paperEl.style.opacity = '1';
    prog.style.width = '100%';
    setStep('done'); hint.textContent = '已完成 · 可再次播放';
  }

  /* 空白起点 */
  function setStart(){
    clearAnims();
    paperEl.style.opacity = '0';
    sk.forEach(function(el){ el.style.strokeDashoffset = '1'; el.style.opacity = '1'; });
    sketchG.style.opacity = '0.9';
    ik.forEach(function(el){ el.style.opacity = '0'; });
    fl.forEach(function(el){ el.style.opacity = '0'; });
    prog.style.width = '0%';
    setStep('');
  }

  function setStep(k){
    Object.keys(stepEls).forEach(function(key){
      stepEls[key].classList.toggle('on', key === k);
      if(!k) stepEls[key].classList.remove('done');
    });
  }
  function markDone(k){
    var order = ['sketch','ink','color'];
    var idx = order.indexOf(k);
    order.forEach(function(key,i){ if(i < idx) stepEls[key].classList.add('done'); });
  }

  function play(){
    if(playing) return;
    playing = true;
    btn.disabled = true;
    btn.textContent = '绘画中…';
    hint.textContent = '正在绘制…';
    setStart();

    /* 画纸淡入 */
    anim(paperEl, [{opacity:0},{opacity:1}], {duration:D.paper, fill:'both', easing:'ease-out'});

    /* 起稿：逐笔描出草稿 */
    plan.forEach(function(p){
      if(p.kind !== 'sk') return;
      p.el.style.opacity = '1';
      anim(p.el, [{strokeDashoffset:1},{strokeDashoffset:0}],
        {duration:p.dur, delay:p.delay, fill:'both', easing:'ease-out'});
    });

    /* 勾线：墨线自上而下浮现 */
    plan.forEach(function(p){
      if(p.kind !== 'ink') return;
      anim(p.el, [{opacity:0, transform:'translateY(-16px)'},{opacity:1, transform:'translateY(0)'}],
        {duration:p.dur, delay:p.delay, fill:'both', easing:'cubic-bezier(.22,.72,.28,1)', compositeHint:true});
    });

    /* 上色：分区铺色 */
    plan.forEach(function(p){
      if(p.kind !== 'fill') return;
      anim(p.el, [{opacity:0, transform:'translateY(-12px)'},{opacity:1, transform:'translateY(0)'}],
        {duration:p.dur, delay:p.delay, fill:'both', easing:'cubic-bezier(.22,.72,.28,1)', compositeHint:true});
    });

    /* 草稿褪去，露出成稿 */
    anim(sketchG, [{opacity:0.9},{opacity:0}],
      {duration:D.fadeDur, delay:D.fadeAt, fill:'both', easing:'ease-in-out'});

    t0 = performance.now();
    tick();

    var last = null;
    plan.forEach(function(p){
      var e = p.delay + p.dur;
      if(!last || e > last) last = e;
    });
    last = Math.max(last, D.fadeAt + D.fadeDur);
    window.setTimeout(function(){
      if(!playing) return;
      playing = false;
      btn.disabled = false;
      btn.textContent = '↺ 重新播放';
      hint.textContent = '完成 · 这张画共 ' + (fl.length + ik.length) + ' 个色块 / 墨线层';
      setStep('done');
      prog.style.width = '100%';
    }, last + 40);
  }

  function tick(){
    var t = performance.now() - t0;
    var pct = Math.max(0, Math.min(1, t / TOTAL));
    prog.style.width = (pct*100).toFixed(2) + '%';

    var stage;
    if(t < D.inkStart)        stage = 'sketch';
    else if(t < D.colStart)   stage = 'ink';
    else if(t < D.fadeAt)     stage = 'color';
    else                      stage = 'done';
    if(stage !== tick._s){
      tick._s = stage;
      setStep(stage);
      markDone(stage === 'done' ? 'color' : stage);
      if(stage === 'sketch') hint.textContent = '第 1 步 · 起稿：先定出轮廓与结构';
      else if(stage === 'ink') hint.textContent = '第 2 步 · 勾线：墨线自上而下落下';
      else if(stage === 'color') hint.textContent = '第 3 步 · 上色：从底色到细节逐层铺开';
      else hint.textContent = '完成 · 这张画共 ' + (fl.length + ik.length) + ' 个色块 / 墨线层';
    }
    if(playing) raf = requestAnimationFrame(tick);
  }

  btn.addEventListener('click', function(){
    if(REDUCED){ showFinal(); return; }
    play();
  });

  /* 首屏直接呈现成稿 */
  function boot(){
    showFinal();
    prog.style.width = '100%';
    var b = document.getElementById('boot');
    b.classList.add('off');
    window.setTimeout(function(){ b.style.display = 'none'; }, 520);
  }
  if(document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
  /* 兜底：即使资源未就绪也不至于卡在遮罩 */
  window.setTimeout(function(){
    var b = document.getElementById('boot');
    if(b && !b.classList.contains('off')) boot();
  }, 1500);
})();
</script>
