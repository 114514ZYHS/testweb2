/* ═══════════════════════════════════════════════════════════════════
   第二部分：宋明木构体系（柱 · 梁 · 檩 · 椽 · 屋面瓦作）
   ═══════════════════════════════════════════════════════════════════ */

/* —— 构件累积器（同类材质合并，减少 draw call） —— */
function Acc(mat) { this.mat = mat; this.geos = []; }
Acc.prototype.add = function (g, tint, vary) {
  if (!g) return this;
  if (tint) tintG(g, tint, vary === undefined ? 0.10 : vary);
  this.geos.push(g); return this;
};
Acc.prototype.mesh = function (parent, opt = {}) {
  if (!this.geos.length) return null;
  const g = mergeG(this.geos);
  const m = mk(g, this.mat, { parent, cast: opt.cast !== false, recv: opt.recv !== false, collide: opt.collide });
  this.geos = [];
  return m;
};

/* —— 构件生成 —— */
function postG(r, h, rTop, seg = 12) { return cylG(rTop === undefined ? r : rTop, r, h, seg, 1.0); }
function plinthG(rTop, h) {
  return latheG([
    [0.0001, 0], [rTop * 1.42, 0], [rTop * 1.45, h * 0.14], [rTop * 1.30, h * 0.34],
    [rTop * 1.12, h * 0.62], [rTop * 1.16, h * 0.80], [rTop * 1.30, h * 0.90],
    [rTop * 1.28, h * 0.97], [rTop * 1.05, h], [0.0001, h]
  ], 14);
}
function quetiG(w, h, t) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(w, h * 0.14);
  s.quadraticCurveTo(w * 0.52, h * 0.06, w * 0.30, h * 0.52);
  s.quadraticCurveTo(w * 0.16, h * 0.86, 0, h);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 6 });
  g.translate(0, 0, -t / 2); return g;
}

/* —— 屋面（举折曲面 + 翼角起翘） —— */
function makeRoofSurf(c) {
  const { zJin, zEave, yRidge, yJin, yEave, overhang, upturn, halfW, cornerSpan, cornerLift } = c;
  const s0 = (yJin - yEave) / (zEave - zJin) * 0.86;
  const zTip = zEave + overhang;
  function f(x, z) {
    const az = Math.abs(z); let y;
    if (az <= zJin) { const t = az / zJin; y = yRidge - (yRidge - yJin) * (t * 0.32 + t * t * 0.68); }
    else if (az <= zEave) { const t = (az - zJin) / (zEave - zJin); y = yJin - (yJin - yEave) * (t * 0.76 + t * t * 0.24); }
    else { const t = clamp((az - zEave) / overhang, 0, 1); y = yEave - s0 * overhang * t + upturn * t * t; }
    const ax = Math.abs(x);
    if (ax > halfW - cornerSpan) {
      const ct = clamp((ax - (halfW - cornerSpan)) / cornerSpan, 0, 1);
      const zt = clamp(az / zTip, 0, 1);
      y += cornerLift * ct * ct * zt * zt;
    }
    return y;
  }
  f.zTip = zTip; return f;
}

/** 瓦作：仰瓦 / 盖瓦交替的筒瓦屋面 */
function tileRoof(surf, o) {
  const { x0, x1, zA, zB, pitch = 0.185, r = 0.072, steps = 26, uvL = 0.42 } = o;
  const K = 7, geos = [];
  const zAf = typeof zA === 'function' ? zA : () => zA;
  const zBf = typeof zB === 'function' ? zB : () => zB;
  for (let pass = 0; pass < 2; pass++) {
    const off = pass === 0 ? 0.050 : 0.010;
    for (let x = x0 + (pass ? pitch * 0.5 : 0); x < x1 - 0.02; x += pitch) {
      const pos = [], nor = [], uvs = [], cols = [], idx = [];
      const tint = 0.74 + Math.random() * 0.5;
      const grn = 0.92 + Math.random() * 0.14;
      const za = zAf(x), zb = zBf(x);
      for (let i = 0; i <= steps; i++) {
        const t = i / steps, u = lerp(za, zb, t);
        const y = surf(x, u) + off;
        const du = (zb - za) / steps * 0.5;
        const sl = (surf(x, u + du) - surf(x, u - du)) / (2 * du);
        const fl = Math.hypot(1, sl), upy = 1 / fl, upz = -sl / fl;
        for (let k = 0; k < K; k++) {
          const a = (pass === 0 ? 0 : Math.PI) + (k / (K - 1)) * Math.PI;
          const ca = Math.cos(a) * r, sa = Math.sin(a) * r;
          pos.push(x + ca * 1.0, y + sa * upy, u + sa * upz);
          nor.push(ca, sa * upy, sa * upz);
          uvs.push(k / (K - 1), u / uvL);
          const v = tint * (0.95 + Math.random() * 0.1);
          cols.push(v * (0.97 + Math.random() * 0.06), v * grn, v * (0.98 + Math.random() * 0.05));
        }
      }
      for (let i = 0; i < steps; i++) for (let k = 0; k < K - 1; k++) {
        const a = i * K + k, b = a + 1, c = a + K, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      g.setIndex(idx);
      geos.push(g);
    }
  }
  return geos;
}
/** 檐口瓦当与滴水 */
function eaveOrnaments(surf, o) {
  const { x0, x1, zEnd, pitch = 0.185, r = 0.072, flip = 1 } = o;
  const geos = [];
  for (let pass = 0; pass < 2; pass++) {
    const off = pass === 0 ? 0.050 : 0.010;
    for (let x = x0 + (pass ? pitch * 0.5 : 0); x < x1 - 0.02; x += pitch) {
      const u = zEnd, y = surf(x, u) + off;
      const du = 0.25;
      const sl = (surf(x, u + du * flip) - surf(x, u - du * flip)) / (2 * du * flip);
      const phi = Math.atan(-sl * flip);
      if (pass === 0) {                       // 瓦当
        const g = cylG(r * 1.02, r * 1.02, 0.045, 12, 0.4);
        g.rotateX(Math.PI / 2 - phi); g.translate(x, y, u + flip * 0.02);
        geos.push(g);
      } else {                                 // 滴水
        const s = new THREE.Shape();
        s.moveTo(-r * 0.98, 0.01); s.lineTo(r * 0.98, 0.01);
        s.lineTo(r * 0.60, -0.105); s.quadraticCurveTo(0, -0.155, -r * 0.60, -0.105); s.closePath();
        const g = new THREE.ExtrudeGeometry(s, { depth: 0.024, bevelEnabled: false, curveSegments: 4 });
        g.translate(0, 0, -0.012); g.rotateX(-phi); g.translate(x, y - 0.03, u + flip * 0.03);
        geos.push(g);
      }
    }
  }
  return geos;
}
/** 椽子 + 飞椽 + 望板（室内彻上明造可见） */
function raftersAndDeck(surf, o) {
  const { x0, x1, zA, zB, zEave, spacing = 0.235, w = 0.088, h = 0.078, surfOff = 0.115 } = o;
  const geos = [], deck = [];
  for (let x = x0 + spacing * 0.5; x < x1 - 0.05; x += spacing) {
    const pts = [];
    const N = 30;
    for (let i = 0; i <= N; i++) {
      const u = lerp(zA, zB, i / N);
      pts.push(new THREE.Vector3(x, surf(x, u) - surfOff - h * 0.5, u));
    }
    const prof = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2], [-w / 2, -h / 2]];
    geos.push(sweepG(pts, prof, 1.2));
    // 飞椽（檐口加厚一层，形成起翘）
    for (const sgn of [1, -1]) {
      const p2 = [];
      for (let i = 0; i <= 8; i++) {
        const u = lerp(sgn * zEave, sgn * zB, i / 8);
        p2.push(new THREE.Vector3(x, surf(x, u) - surfOff + h * 0.62, u));
      }
      geos.push(sweepG(p2, [[-w * 0.46, -h * 0.34], [w * 0.46, -h * 0.34], [w * 0.46, h * 0.34], [-w * 0.46, h * 0.34], [-w * 0.46, -h * 0.34]], 1.2));
    }
  }
  // 望板
  const NX = Math.max(2, Math.round((x1 - x0) / 0.25));
  for (let i = 0; i < NX; i++) {
    const xa = lerp(x0, x1, i / NX), xb = lerp(x0, x1, (i + 1) / NX);
    const pos = [], idx = [], uvs = [];
    const NZ = 30;
    for (let k = 0; k <= NZ; k++) {
      const u = lerp(zA, zB, k / NZ);
      pos.push(xa, surf(xa, u) - surfOff + 0.012, u, xb, surf(xb, u) - surfOff + 0.012, u);
      uvs.push(0, u * 1.6, 1, u * 1.6);
    }
    for (let k = 0; k < NZ; k++) {
      const a = k * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx); g.computeVertexNormals();
    deck.push(g);
  }
  return { rafters: geos, deck };
}
/** 正脊（含脊饰） */
function ridgeG(surf, o) {
  const { x0, x1, h = 0.26, w = 0.15 } = o;
  const pts = [];
  const N = Math.max(6, Math.round((x1 - x0) * 2));
  for (let i = 0; i <= N; i++) {
    const x = lerp(x0, x1, i / N);
    pts.push(new THREE.Vector3(x, surf(x, 0) + 0.03, 0));
  }
  const prof = [[-w, 0], [w, 0], [w, h * 0.62], [w * 0.72, h * 0.84], [w * 0.44, h],
  [-w * 0.44, h], [-w * 0.72, h * 0.84], [-w, h * 0.62], [-w, 0]];
  return sweepG(pts, prof, 1.0);
}
/** 鸱吻（简化脊兽） */
function chiwenG(s) {
  const geos = [];
  const base = latheG([[0.001, 0], [0.085, 0], [0.10, 0.05], [0.07, 0.10], [0.095, 0.17], [0.055, 0.22], [0.001, 0.24]], 10);
  base.scale(s, s, s); geos.push(base);
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    pts.push(new THREE.Vector3(t * 0.10 * s, (0.20 + t * 0.52) * s, Math.sin(t * 2.2) * 0.10 * s - t * 0.10 * s));
  }
  const horn = sweepG(pts, [[-0.05, -0.05], [0.05, -0.05], [0.05, 0.05], [-0.05, 0.05], [-0.05, -0.05]].map(p => [p[0] * s, p[1] * s]), 0.5);
  geos.push(horn);
  return mergeG(geos);
}
/** 博风板 + 悬鱼 */
function bofengG(surf, o) {
  const { x, zA, zB, w = 0.30, t = 0.055 } = o;
  const pts = [];
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const u = lerp(zA, zB, i / N);
    pts.push(new THREE.Vector3(x, surf(x, u) - 0.10, u));
  }
  const prof = [[0, -w], [t, -w + 0.02], [t, 0], [0, 0], [0, -w]];
  return sweepG(pts, prof, 1.0);
}
function xuanyuG(w, h, t) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(w, -h * 0.35);
  s.quadraticCurveTo(w * 0.5, -h * 0.72, 0, -h);
  s.quadraticCurveTo(-w * 0.2, -h * 0.5, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 6 });
  g.translate(0, 0, -t / 2);
  return g;
}

/* —— 主体木构架（抬梁式 · 五架） —— */
function buildFrame(cfg) {
  const {
    bays, zJin, zEave, overhang, upturn, yRidge, yJin, yEave,
    veranda = 0, yLan = 3.45, xuan = true
  } = cfg;
  const W = bays.reduce((a, b) => a + b, 0);
  const halfW = W / 2;
  const G = new THREE.Group();
  const A = new Acc(MAT.timber), S = new Acc(MAT.stone), B = new Acc(MAT.timber);
  const tint = [1.0, 0.97, 0.92];

  // 开间分界（榀架位置）
  const xs = [-halfW]; let acc = 0;
  for (const b of bays) { acc += b; xs.push(-halfW + acc); }
  const zTip = zEave + overhang;
  const surf = makeRoofSurf({
    zJin, zEave, yRidge, yJin, yEave, overhang, upturn,
    halfW: halfW + 0.72, cornerSpan: 2.4, cornerLift: 0.62
  });
  const P = 0.245;                       // 檩中心相对屋面的下沉
  const yEaveP = surf(0, zEave) - P, yJinP = surf(0, zJin) - P, yRidgeP = surf(0, 0) - P;

  // ── 柱与柱础 ──
  const colPos = [];
  for (const x of xs) for (const z of [zEave, -zEave]) colPos.push({ x, z, r: 0.150, h: yEaveP, t: 'eave' });
  for (const x of xs) for (const z of [zJin, -zJin]) colPos.push({ x, z, r: 0.162, h: yJinP, t: 'jin' });
  if (veranda) for (const x of xs) colPos.push({ x, z: zEave + veranda, r: 0.112, h: yLan, t: 'lan' });
  for (const c of colPos) {
    const g = postG(c.r, c.h, c.r * 0.90);
    g.translate(c.x, c.h / 2, c.z);
    A.add(g, tint, 0.12);
    const p = plinthG(c.r * 1.15, 0.155); p.translate(c.x, 0, c.z);
    S.add(p, [0.86, 0.85, 0.80], 0.16);
    const sq = boxG(c.r * 3.0, 0.055, c.r * 3.0, 0.5); sq.translate(c.x, 0.026, c.z);
    S.add(sq, [0.80, 0.79, 0.75], 0.14);
  }

  // ── 梁（沿 Z）──
  const beam = (xa, za, xb, zb, y0, y1, w) => {
    const len = Math.hypot(xb - xa, zb - za);
    const g = boxG(w, y1 - y0, len, 1.1);
    g.rotateY(Math.atan2(xb - xa, zb - za));
    g.translate((xa + xb) / 2, (y0 + y1) / 2, (za + zb) / 2);
    B.add(g, tint, 0.10);
  };
  const purlin = (z, y, r, x0, x1) => {
    const g = cylG(r, r, x1 - x0, 12, 0.9);
    g.rotateZ(Math.PI / 2); g.translate((x0 + x1) / 2, y, z);
    B.add(g, tint, 0.12);
  };
  const x0 = -halfW - 0.42, x1 = halfW + 0.42;
  for (const x of xs) {
    // 抱头梁（金柱—檐柱—廊柱）
    if (veranda) beam(x, zJin, x, zEave + veranda, yEaveP - 0.42, yEaveP - 0.10, 0.235);
    else beam(x, zJin, x, zEave, yEaveP - 0.40, yEaveP - 0.10, 0.235);
    // 穿插枋
    beam(x, zJin, x, zEave, yEaveP - 1.05, yEaveP - 0.87, 0.155);
    beam(x, -zJin, x, -zEave, yEaveP - 1.05, yEaveP - 0.87, 0.155);
    // 五架梁（金柱—金柱）
    beam(x, -zJin, x, zJin, yJinP - 0.44, yJinP - 0.06, 0.275);
    // 童柱 + 三架梁
    for (const s of [1, -1]) {
      const g = postG(0.088, yJinP - 0.06, 0.082);
      g.translate(x, (yJinP - 0.06) + (yRidgeP - 0.92 - (yJinP - 0.06)) / 2, s * zJin * 0.52);
      const hgt = (yRidgeP - 0.92) - (yJinP - 0.06);
      const g2 = postG(0.088, hgt, 0.082);
      g2.translate(x, (yJinP - 0.06) + hgt / 2, s * zJin * 0.52);
      B.add(g2, tint, 0.1);
    }
    beam(x, -zJin * 0.52, x, zJin * 0.52, yRidgeP - 0.92, yRidgeP - 0.64, 0.235);
    // 脊童柱
    const gg = postG(0.082, yRidgeP - 0.64 - (yRidgeP - 0.92), 0.076);
    gg.translate(x, yRidgeP - 0.78, 0); B.add(gg, tint, 0.1);
    // 角背/驼峰（简化）
    for (const s of [1, -1]) {
      const gp = boxG(0.10, 0.26, 0.30, 0.5); gp.translate(x, yJinP - 0.06 + 0.13, s * zJin * 0.52);
      A.add(gp, tint, 0.1);
    }
  }
  // ── 檩（沿 X 贯通）──
  purlin(0, yRidgeP, 0.145, x0 - 0.20, x1 + 0.20);
  for (const s of [1, -1]) {
    purlin(s * zJin, yJinP, 0.132, x0, x1);
    purlin(s * zEave, yEaveP, 0.132, x0, x1);
    if (veranda) purlin(s * (zEave + veranda), yLan, 0.108, x0, x1);
  }
  // ── 额枋 / 金枋 / 廊枋（沿 X）──
  const fang = (y, z, w, h, xa, xb) => {
    for (let i = 0; i < bays.length; i++) {
      const a = xs[i], b = xs[i + 1];
      const g = boxG(b - a - 0.28, h, w, 1.0); g.translate((a + b) / 2, y, z);
      A.add(g, tint, 0.1);
    }
  };
  fang(yEaveP - 0.52, zEave, 0.135, 0.245);
  fang(yEaveP - 0.52, -zEave, 0.135, 0.245);
  fang(yJinP - 0.66, zJin, 0.115, 0.195);
  fang(yJinP - 0.66, -zJin, 0.115, 0.195);
  if (veranda) fang(yLan - 0.40, zEave + veranda, 0.105, 0.175);
  // 由额垫板
  for (const z of [zEave, -zEave]) {
    for (let i = 0; i < bays.length; i++) {
      const g = boxG(xs[i + 1] - xs[i] - 0.28, 0.13, 0.045, 0.6);
      g.translate((xs[i] + xs[i + 1]) / 2, yEaveP - 0.34, z + (z > 0 ? 0.09 : -0.09));
      A.add(g, tint, 0.1);
    }
  }
  // ── 雀替 ──
  for (const x of xs) for (const z of [zEave, -zEave]) {
    for (const s of [1, -1]) {
      const g = quetiG(0.62, 0.30, 0.055);
      g.rotateY(s > 0 ? 0 : Math.PI);
      g.translate(x + s * 0.075, yEaveP - 0.50, z + (z > 0 ? 0.10 : -0.10));
      A.add(g, tint, 0.1);
    }
  }
  if (veranda) for (const x of xs) for (const s of [1, -1]) {
    const g = quetiG(0.46, 0.22, 0.05);
    g.rotateY(s > 0 ? 0 : Math.PI);
    g.translate(x + s * 0.06, yLan - 0.36, zEave + veranda + 0.09);
    A.add(g, tint, 0.1);
  }

  // ── 屋面 ──
  const rx0 = -halfW - 0.72, rx1 = halfW + 0.72;
  const T = new Acc(MAT.tile);
  for (const g of tileRoof(surf, { x0: rx0, x1: rx1, zA: -zTip, zB: zTip, pitch: 0.185, r: 0.072, steps: 28 })) T.add(g, [1, 1, 1], 0);
  T.mesh(G);
  const O = new Acc(MAT.tile);
  for (const g of eaveOrnaments(surf, { x0: rx0, x1: rx1, zEnd: -zTip, pitch: 0.185, r: 0.072, flip: -1 })) O.add(g, [0.95, 0.97, 1], 0.06);
  for (const g of eaveOrnaments(surf, { x0: rx0, x1: rx1, zEnd: zTip, pitch: 0.185, r: 0.072, flip: 1 })) O.add(g, [0.95, 0.97, 1], 0.06);
  O.mesh(G);

  const RD = raftersAndDeck(surf, { x0: rx0 + 0.10, x1: rx1 - 0.10, zA: -zTip + 0.05, zB: zTip - 0.05, zEave, spacing: 0.235 });
  const RAF = new Acc(MAT.timber);
  for (const g of RD.rafters) RAF.add(g, [0.86, 0.80, 0.70], 0.12);
  RAF.mesh(G);
  const DEC = new Acc(MAT.timber);
  for (const g of RD.deck) DEC.add(g, [0.40, 0.34, 0.28], 0.14);
  DEC.mesh(G);

  // 正脊 + 鸱吻
  const RG = new Acc(MAT.tile);
  RG.add(ridgeG(surf, { x0: rx0 + 0.02, x1: rx1 - 0.02, h: 0.30, w: 0.16 }), [0.98, 1.0, 1.0], 0.05);
  for (const s of [1, -1]) {
    const cw = chiwenG(1.0);
    cw.scale(s, 1, 1);
    cw.translate(s * (rx1 - 0.16), surf(rx1 - 0.16, 0) + 0.04, 0);
    RG.add(cw, [0.95, 0.97, 1.0], 0.06);
  }
  RG.mesh(G);

  // 博风板 + 悬鱼
  const BF = new Acc(MAT.timberPale);
  for (const s of [1, -1]) {
    const g = bofengG(surf, { x: s * rx1, zA: -zTip + 0.02, zB: zTip - 0.02, w: 0.32, t: 0.06 });
    BF.add(g, [0.72, 0.66, 0.58], 0.1);
    const xy = xuanyuG(0.30, 0.52, 0.05);
    xy.translate(s * (rx1 - 0.17), surf(rx1, 0) - 0.36, 0);
    BF.add(xy, [0.70, 0.63, 0.55], 0.08);
  }
  BF.mesh(G);

  // ── 前廊轩（卷棚） ──
  if (veranda && xuan) {
    const z1 = zEave + veranda - 0.10, z2 = zEave + 0.12;
    const y1 = yLan + 0.02, y2 = yEaveP - 0.62;
    const xz = new Acc(MAT.timber);
    const curve = (t) => {                 // t: 0(廊柱) → 1(檐柱)
      const base = lerp(y1, y2, t);
      return base + Math.sin(Math.PI * clamp(t, 0, 1)) * 0.17;
    };
    const NX = Math.max(4, Math.round(W / 0.22));
    for (let i = 0; i <= NX; i++) {          // 弯椽
      const x = lerp(-halfW - 0.30, halfW + 0.30, i / NX);
      const pts = [];
      for (let k = 0; k <= 14; k++) {
        const t = k / 14; pts.push(new THREE.Vector3(x, curve(t) + 0.075, lerp(z1, z2, t)));
      }
      xz.add(sweepG(pts, [[-0.045, -0.038], [0.045, -0.038], [0.045, 0.038], [-0.045, 0.038], [-0.045, -0.038]], 0.8), [0.9, 0.86, 0.78], 0.1);
    }
    // 轩板
    const pos = [], idx = [], uvs = [];
    const NZ = 16;
    for (let k = 0; k <= NZ; k++) {
      const t = k / NZ, z = lerp(z1, z2, t), y = curve(t) + 0.115;
      pos.push(-halfW - 0.30, y, z, halfW + 0.30, y, z);
      uvs.push(0, t * 3, 4, t * 3);
    }
    for (let k = 0; k < NZ; k++) { const a = k * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    dg.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    dg.setIndex(idx); dg.computeVertexNormals();
    xz.add(dg, [0.52, 0.45, 0.38], 0.1);
    xz.mesh(G);
  }

  A.mesh(G); B.mesh(G); S.mesh(G);
  return { group: G, surf, halfW, W, xs, zTip, yEaveP, yJinP, yRidgeP, zEave, zJin, veranda, yLan };
}

/* ═══════════════════════════════════════════════════════════════════
   第三部分：墙体 · 门窗 · 隔断 · 台基
   ═══════════════════════════════════════════════════════════════════ */
function bx(w, h, d, x, y, z, uv = 1) { const g = boxG(w, h, d, uv); g.translate(x, y, z); return g; }
function floorG(w, d, uv = 0.8) {
  const g = new THREE.PlaneGeometry(w, d);
  g.rotateX(-Math.PI / 2);
  const a = g.attributes.uv;
  for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * w / uv, a.getY(i) * d / uv);
  return g;
}
function addCollider(gp, x0, x1, y0, y1, z0, z1) {
  gp.updateWorldMatrix(true, false);
  const b = new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
  b.applyMatrix4(gp.matrixWorld); COLLIDERS.push(b);
}
function addFloor(gp, x0, x1, z0, z1, y) {
  gp.updateWorldMatrix(true, false);
  const b = new THREE.Box3(new THREE.Vector3(x0, y - 0.2, z0), new THREE.Vector3(x1, y + 2.6, z1));
  b.applyMatrix4(gp.matrixWorld);
  const p = new THREE.Vector3(0, y, 0).applyMatrix4(gp.matrixWorld);
  FLOORS.push({ minX: b.min.x, maxX: b.max.x, minZ: b.min.z, maxZ: b.max.z, y: p.y });
}
/** 把点推到岸上（离水一定距离） */
function landPoint(x, z, margin = 0.14) {
  for (let i = 0; i < 40; i++) {
    const pf = pondF(x, z);
    if (pf >= margin) break;
    const dx = (x - POND.cx) / POND.rx, dz = (z - POND.cz) / POND.rz;
    const l = Math.hypot(dx, dz) || 0.001;
    const need = (margin - pf) * 1.02;
    x += (dx / l) * need * POND.rx;
    z += (dz / l) * need * POND.rz;
  }
  return [x, z];
}

/* —— 棂格：方格眼 / 柳条格 —— */
function latticeG(w, h, style, dep = 0.030, bar = 0.014) {
  const geos = [];
  const cell = 0.115;
  if (style === 'square') {
    const n = Math.max(2, Math.round(w / cell)), m = Math.max(2, Math.round(h / cell));
    for (let i = 1; i < n; i++) geos.push(bx(bar, h, dep, -w / 2 + w * i / n, 0, 0, 0.4));
    for (let j = 1; j < m; j++) geos.push(bx(w, bar, dep, 0, -h / 2 + h * j / m, 0, 0.4));
    // 菱角小装饰
    for (let i = 1; i < n; i++) for (let j = 1; j < m; j++) {
      if ((i + j) % 2) continue;
      const cx = -w / 2 + w * i / n, cy = -h / 2 + h * j / m;
      const d = Math.min(w / n, h / m) * 0.22;
      const s = bx(d, bar * 0.8, dep * 0.8, cx + d * 0.9, cy, 0, 0.3);
      geos.push(s);
    }
  } else {
    const n = Math.max(3, Math.round(w / 0.062));
    for (let i = 1; i < n; i++) geos.push(bx(bar * 0.85, h, dep, -w / 2 + w * i / n, 0, 0, 0.4));
    for (const yy of [-h * 0.30, h * 0.16]) geos.push(bx(w, bar, dep, 0, yy, 0, 0.4));
  }
  return mergeG(geos);
}
/** 一扇隔扇（格心 + 绦环板 + 裙板） */
function geShanG(w, h, style = 'square') {
  const A = new Acc(MAT.timberPale);
  const t = 0.062, d = 0.048;
  A.add(bx(t, h, d, -w / 2 + t / 2, 0, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(t, h, d, w / 2 - t / 2, 0, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(w - 2 * t, t, d, 0, h / 2 - t / 2, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(w - 2 * t, t, d, 0, -h / 2 + t / 2, 0, 0.8), [1, 0.98, 0.94], 0.06);
  const yXin = h * 0.13, hXin = h * 0.56, yQun = -h * 0.42, hQun = h * 0.30;
  A.add(bx(w - 2 * t + 0.01, t * 0.75, d, 0, yXin - hXin / 2 - t * 0.4, 0, 0.8), [0.96, 0.94, 0.90], 0.06);
  A.add(bx(w - 2 * t + 0.01, t * 0.75, d, 0, yQun + hQun / 2 + t * 0.4, 0, 0.8), [0.96, 0.94, 0.90], 0.06);
  const lat = latticeG(w - 2 * t - 0.03, hXin - 0.02, style, d * 0.55);
  lat.translate(0, yXin + 0.01, 0); A.add(lat, [1, 0.97, 0.92], 0.06);
  A.add(bx(w - 2 * t - 0.02, hQun, d * 0.55, 0, yQun, 0, 0.9), [0.80, 0.74, 0.65], 0.10);
  A.add(bx(w - 2 * t - 0.02, h * 0.055, d * 0.55, 0, yXin + hXin / 2 + h * 0.045, 0, 0.9), [0.82, 0.76, 0.66], 0.1);
  return A;
}
/** 窗（用于槛窗上段 / 横披） */
function windowG(w, h, style = 'willow') {
  const A = new Acc(MAT.timberPale);
  const t = 0.055, d = 0.042;
  A.add(bx(t, h, d, -w / 2 + t / 2, 0, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(t, h, d, w / 2 - t / 2, 0, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(w, t, d, 0, h / 2 - t / 2, 0, 0.8), [1, 0.98, 0.94], 0.06);
  A.add(bx(w, t, d, 0, -h / 2 + t / 2, 0, 0.8), [1, 0.98, 0.94], 0.06);
  const lat = latticeG(w - 2 * t - 0.02, h - 2 * t - 0.02, style, d * 0.55);
  A.add(lat, [1, 0.97, 0.92], 0.06);
  return A;
}
/** 窗纸（夜間透光） */
function paperG(w, h, y, z, parent, rot) {
  const g = new THREE.PlaneGeometry(w, h);
  if (rot) g.rotateY(rot);
  g.translate(0, y, z);
  const m = mk(g, MAT.paper, { parent, cast: false });
  return m;
}
/** 板壁（竖向木板墙），可留门洞 */
function boardWallG(len, h, thick, opt = {}) {
  const A = new Acc(MAT.timberPale);
  const plank = 0.165;
  const n = Math.max(2, Math.round(len / plank));
  for (let i = 0; i < n; i++) {
    const w = len / n;
    A.add(bx(w * 0.94, h, thick, -len / 2 + w * (i + 0.5), 0, 0, 1.2), [0.9, 0.86, 0.78], 0.16);
  }
  for (const s of [1, -1]) A.add(bx(len, 0.10, thick * 1.5, 0, s * (h / 2 - 0.05), 0, 1.0), [0.82, 0.77, 0.68], 0.1);
  if (opt.rails) for (const yy of [-0.6, 0.9]) A.add(bx(len, 0.09, thick * 1.4, 0, yy, 0, 1.0), [0.82, 0.77, 0.68], 0.1);
  return A;
}
/** 山墙（填充三角形，随屋面举折） */
function gableWallG(surf, x, zE, zTip, top0, hBase, thick) {
  const s = new THREE.Shape();
  const N = 22;
  s.moveTo(-zE - 0.30, 0); s.lineTo(zE + 0.30, 0);
  s.lineTo(zE + 0.30, surf(x, zE + 0.30) - 0.14);
  for (let i = N; i >= 0; i--) { const u = (zE + 0.30) * i / N; s.lineTo(u, surf(x, u) - 0.16); }
  for (let i = 1; i <= N; i++) { const u = -(zE + 0.30) * i / N; s.lineTo(u, surf(x, u) - 0.16); }
  s.lineTo(-zE - 0.30, surf(x, zE + 0.30) - 0.14);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 4 });
  g.translate(0, 0, -thick / 2);
  g.rotateY(-Math.PI / 2);
  return g;
}

/* —— 台基与踏跺 —— */
function buildPlatform(G, cfg) {
  const { halfW, zEave, veranda, platH = 0.55 } = cfg;
  const x0 = -halfW - 1.35, x1 = halfW + 1.35;
  const z0 = -zEave - 1.05, z1 = zEave + (veranda || 0) + 0.95;
  const S = new Acc(MAT.stone), B = new Acc(MAT.brick);
  // 台明石（四周陡板）
  const t = 0.22;
  S.add(bx(x1 - x0, platH, t, 0, -platH / 2, z1 - t / 2, 1.4), [0.92, 0.90, 0.86], 0.12, true);
  S.add(bx(x1 - x0, platH, t, 0, -platH / 2, z0 + t / 2, 1.4), [0.92, 0.90, 0.86], 0.12);
  S.add(bx(t, platH, z1 - z0 - 2 * t, x0 + t / 2, -platH / 2, 0, 1.4), [0.92, 0.90, 0.86], 0.12);
  S.add(bx(t, platH, z1 - z0 - 2 * t, x1 - t / 2, -platH / 2, 0, 1.4), [0.92, 0.90, 0.86], 0.12);
  S.add(bx(x1 - x0 + 0.16, platH, z1 - z0 + 0.16, 0, -platH - 0.02, 0, 1.6), [0.62, 0.60, 0.56], 0.1); // 内部填芯
  // 土衬石
  S.add(bx(x1 - x0 + 0.22, 0.10, z1 - z0 + 0.22, 0, -platH + 0.05, 0, 1.4), [0.80, 0.79, 0.75], 0.12);
  // 阶条石（台面周边）
  const sw = 0.62;
  S.add(bx(x1 - x0, 0.09, sw, 0, -0.045, z1 - sw / 2, 1.2), [0.94, 0.93, 0.89], 0.10);
  S.add(bx(x1 - x0, 0.09, sw, 0, -0.045, z0 + sw / 2, 1.2), [0.94, 0.93, 0.89], 0.10);
  S.add(bx(sw, 0.09, z1 - z0 - 2 * sw, x0 + sw / 2, -0.045, 0, 1.2), [0.94, 0.93, 0.89], 0.10);
  S.add(bx(sw, 0.09, z1 - z0 - 2 * sw, x1 - sw / 2, -0.045, 0, 1.2), [0.94, 0.93, 0.89], 0.10);
  S.mesh(G, { collide: false });
  // 室内方砖
  const fg = floorG(x1 - x0 - 2 * sw + 0.4, z1 - z0 - 2 * sw + 0.4, 0.62);
  fg.translate(0, 0.005, 0);
  B.add(fg, [1, 0.99, 0.96], 0.06);
  B.mesh(G, { cast: false });
  // 台帮碰撞（踏跺处开口）
  const t2 = 0.32;
  addCollider(G, x0, -1.48, -platH, 0.02, z1 - t2, z1 + 0.06);
  addCollider(G, 1.48, x1, -platH, 0.02, z1 - t2, z1 + 0.06);
  addCollider(G, x0, -0.58, -platH, 0.02, z0 - 0.06, z0 + t2);
  addCollider(G, 1.28, x1, -platH, 0.02, z0 - 0.06, z0 + t2);
  addCollider(G, x0 - 0.06, x0 + t2, -platH, 0.02, z0, z1);
  addCollider(G, x1 - t2, x1 + 0.06, -platH, 0.02, z0, z1);
  return { x0, x1, z0, z1 };
}
function buildSteps(G, cfg, xCenter, w, dir = 1) {
  const { zEave, veranda, platH = 0.55 } = cfg;
  const zFront = zEave + (veranda || 0) + 0.95;
  const n = 3, rise = platH / n, tread = 0.34;
  const S = new Acc(MAT.stone);
  for (let i = 0; i < n; i++) {
    S.add(bx(w, rise, tread, xCenter, -rise * i - rise / 2, zFront + dir * tread * (i + 0.5), 1.0), [0.90, 0.89, 0.85], 0.12);
    const zA = Math.min(zFront + dir * tread * i, zFront + dir * tread * (i + 1));
    const zB = Math.max(zFront + dir * tread * i, zFront + dir * tread * (i + 1));
    addFloor(G, xCenter - w / 2, xCenter + w / 2, zA, zB, -rise * i);
  }
  // 垂带石
  const L = Math.hypot(platH, tread * n);
  for (const s of [1, -1]) {
    const g = boxG(0.20, 0.13, L + 0.20, 1.0);
    g.rotateX(Math.atan2(platH, tread * n) * dir);
    g.translate(xCenter + s * (w / 2 + 0.10), -platH / 2 + 0.10, zFront + dir * tread * n / 2);
    S.add(g, [0.88, 0.87, 0.83], 0.12);
  }
  // 砚窝石
  S.add(bx(w + 0.5, 0.14, tread + 0.2, xCenter, -platH + 0.07, zFront + dir * (tread * n + 0.1), 1.0), [0.86, 0.85, 0.81], 0.12);
  S.mesh(G);
}

/** 带洞口的墙 */
function wallWithHole(G, o) {
  const pieces = [];
  if (!o.hole) pieces.push([o.x0, o.x1, o.y0, o.y1]);
  else {
    const h = o.hole;
    if (h.x0 - o.x0 > 0.02) pieces.push([o.x0, h.x0, o.y0, o.y1]);
    if (o.x1 - h.x1 > 0.02) pieces.push([h.x1, o.x1, o.y0, o.y1]);
    if (h.y0 - o.y0 > 0.02) pieces.push([h.x0, h.x1, o.y0, h.y0]);
    if (o.y1 - h.y1 > 0.02) pieces.push([h.x0, h.x1, h.y1, o.y1]);
  }
  const A = new Acc(o.mat);
  for (const p of pieces) {
    A.add(bx(p[1] - p[0], p[3] - p[2], o.thick, (p[0] + p[1]) / 2, (p[2] + p[3]) / 2, o.z, o.uv || 1.6), o.tint || [1, 1, 1], 0.07);
    if (o.collide) addCollider(G, p[0] - 0.03, p[1] + 0.03, p[2], p[3], o.z - o.thick / 2 - 0.04, o.z + o.thick / 2 + 0.04);
  }
  A.mesh(G, { collide: false });
}
/** 挂落（廊下装饰挂落，万川式） */
function buildGualuo(G, x0, x1, yTop, z) {
  const A = new Acc(MAT.timberPale);
  const n = Math.max(3, Math.round((x1 - x0) / 0.30));
  A.add(bx(x1 - x0, 0.055, 0.07, (x0 + x1) / 2, yTop, z, 0.8), [1, .97, .92], .06);
  const yBot = yTop - 0.28;
  for (let i = 0; i <= n; i++) {
    const x = lerp(x0, x1, i / n), t = i / n;
    const yy = yBot + Math.sin(Math.PI * t) * 0.15;
    A.add(bx(0.032, yTop - yy - 0.05, 0.045, x, (yTop + yy) / 2 - 0.02, z, 0.6), [1, .97, .92], .06);
    const b = latheG([[0.001, 0], [0.028, 0.008], [0.032, 0.040], [0.016, 0.068], [0.001, 0.082]], 8);
    b.translate(x, yy - 0.035, z); A.add(b, [1, .97, .92], .06);
    if (i > 0) {
      const xa = lerp(x0, x1, (i - 1) / n), ta = (i - 1) / n;
      const ya = yBot + Math.sin(Math.PI * ta) * 0.15;
      const len = Math.hypot(x - xa, yy - ya);
      const g = boxG(len, 0.032, 0.040, 0.6);
      g.rotateZ(Math.atan2(yy - ya, x - xa));
      g.translate((x + xa) / 2, (yy + ya) / 2 - 0.035, z);
      A.add(g, [1, .97, .92], .06);
    }
  }
  A.mesh(G);
}

/* —— 主体厅堂：三开间（明间堂屋 + 次间书房 / 卧房） —— */
function buildHall(o) {
  const cfg = Object.assign({
    bays: [3.6, 4.4, 3.6], zJin: 1.9, zEave: 3.8, overhang: 1.5, upturn: 0.32,
    yRidge: 7.133, yJin: 5.328, yEave: 4.15, veranda: 1.2, yLan: 3.45, platH: 0.55
  }, o);
  const G = new THREE.Group();
  G.position.set(o.px || 0, o.py === undefined ? 0.55 : o.py, o.pz || 0);
  G.rotation.y = o.rot || 0;
  WORLD.add(G);
  G.updateWorldMatrix(true, false);

  const F = buildFrame(cfg);
  G.add(F.group);
  const { halfW, zEave, zJin, veranda, yEaveP, yJinP, zTip, surf } = F;
  const bays = cfg.bays;
  const bayX = [-halfW]; let a = 0; for (const b of bays) { a += b; bayX.push(-halfW + a); }
  const mid = bays.length > 1 ? 1 : 0;                  // 明间索引
  const m0 = bayX[mid], m1 = bayX[mid + 1], mw = m1 - m0;
  const hWall = 3.42;

  // 台基 / 踏跺
  const PL = buildPlatform(G, { halfW, zEave, veranda, platH: cfg.platH });
  buildSteps(G, { zEave, veranda, platH: cfg.platH }, 0, 2.7, 1);
  buildSteps(G, { zEave, veranda, platH: cfg.platH }, 0.35, 1.5, -1);
  addFloor(G, -halfW - 1.2, halfW + 1.2, -zEave - 0.9, zEave + veranda + 0.8, 0);

  // ── 山墙 ──
  const GW = new Acc(MAT.plaster);
  for (const s of [1, -1]) {
    const g = gableWallG(surf, s * (halfW + 0.20), zEave, zTip, 0, hWall, 0.34);
    g.translate(s * (halfW + 0.20), 0, 0);
    GW.add(g, [1, 0.99, 0.96], 0.06);
    addCollider(G, s * halfW - 0.05, s * (halfW + 0.40), 0, 4.6, -zEave - 0.4, zEave + 0.4);
  }
  GW.mesh(G);
  // 墙裙（石/砖护脚）
  const GB = new Acc(MAT.stone);
  for (const s of [1, -1]) GB.add(bx(0.40, 0.46, zEave * 2 + 0.8, s * (halfW + 0.20), 0.23, 0, 1.2), [0.82, 0.81, 0.77], 0.12);
  GB.mesh(G);

  // ── 后檐墙（明间后门 + 次间后窗） ──
  const zR = -zEave;
  wallWithHole(G, {
    mat: MAT.plaster, x0: m0 + 0.16, x1: m1 - 0.16, y0: 0, y1: hWall, z: zR, thick: 0.30,
    hole: { x0: -0.50, x1: 0.50, y0: 0, y1: 2.15 }, tint: [1, 0.99, 0.96], collide: true, uv: 1.8
  });
  for (const side of [0, 2]) {
    const x0 = bayX[side] + 0.16, x1 = bayX[side + 1] - 0.16;
    wallWithHole(G, {
      mat: MAT.plaster, x0, x1, y0: 0, y1: hWall, z: zR, thick: 0.30,
      hole: { x0: (x0 + x1) / 2 - 0.62, x1: (x0 + x1) / 2 + 0.62, y0: 0.95, y1: 2.25 },
      tint: [1, 0.99, 0.96], collide: true, uv: 1.8
    });
  }
  // 后门板 + 后窗棂
  {
    const A = new Acc(MAT.timberPale);
    for (const s of [1, -1]) {
      A.add(bx(0.49, 2.12, 0.045, s * 0.25, 1.06, zR, 1.2), [0.86, 0.80, 0.70], 0.1);
      A.add(bx(0.49, 0.10, 0.06, s * 0.25, 1.75, zR, 1.0), [0.7, 0.65, 0.58], 0.1);
    }
    A.add(bx(1.10, 0.10, 0.16, 0, 2.19, zR, 1.0), [0.8, 0.75, 0.66], 0.1);
    A.mesh(G);
    addCollider(G, -0.52, 0.52, 0, 2.15, zR - 0.2, zR + 0.2);
    // 次间后窗
    for (const side of [0, 2]) {
      const cx = (bayX[side] + bayX[side + 1]) / 2;
      const W1 = windowG(1.24, 1.30, 'square'); W1.mesh(G).position.set(cx, 1.60, zR);
      const p = new THREE.PlaneGeometry(1.20, 1.26); p.translate(cx, 1.60, zR + 0.02);
      mk(p, MAT.paper, { parent: G, cast: false });
    }
  }

  // ── 前檐：明间隔扇 / 次间槛窗 ──
  const zF = zEave;
  {
    // 明间：六扇隔扇，中间两扇敞开
    const n = 6, w = (mw - 0.34) / n, h = 2.98;
    for (let i = 0; i < n; i++) {
      const open = (i === 2 || i === 3);
      const xL = m0 + 0.17 + w * i;
      const piv = new THREE.Group(); piv.position.set(xL, 0, zF); G.add(piv);
      const A = geShanG(w, h, 'square');
      const mesh = A.mesh(piv);
      mesh.position.x = w / 2; mesh.position.y = h / 2 + 0.14;
      if (open) { piv.rotation.y = -1.30 - (i === 2 ? 0.06 : -0.06); }
      else addCollider(piv, -0.02, w + 0.02, 0, 3.1, -0.10, 0.10);
      // 窗纸
      if (!open) {
        const p = new THREE.PlaneGeometry(w - 0.14, h * 0.56);
        p.translate(w / 2, h / 2 + 0.14 + h * 0.13, -0.028);
        mk(p, MAT.paper, { parent: piv, cast: false });
      }
    }
    // 横披
    const H1 = windowG(mw - 0.34, 0.44, 'willow'); H1.mesh(G).position.set((m0 + m1) / 2, 3.20, zF);
    addCollider(G, m0 + 0.1, m1 - 0.1, 3.12, 3.45, zF - 0.1, zF + 0.1);
    // 次间：槛墙 + 槛窗
    for (const side of [0, 2]) {
      const x0 = bayX[side] + 0.16, x1 = bayX[side + 1] - 0.16, cx = (x0 + x1) / 2, bw = x1 - x0;
      const KW = new Acc(MAT.plaster);
      KW.add(bx(bw, 0.92, 0.26, cx, 0.46, zF, 1.6), [1, 0.99, 0.96], 0.07);
      KW.mesh(G);
      addCollider(G, x0, x1, 0, 0.92, zF - 0.18, zF + 0.18);
      const n2 = 3, ww = (bw - 0.2) / n2;
      for (let i = 0; i < n2; i++) {
        const W1 = windowG(ww, 1.34, 'willow');
        W1.mesh(G).position.set(x0 + 0.1 + ww * (i + 0.5), 1.61, zF);
      }
      const p = new THREE.PlaneGeometry(bw - 0.24, 1.30);
      p.translate(cx, 1.61, zF - 0.03); mk(p, MAT.paper, { parent: G, cast: false });
      addCollider(G, x0, x1, 0.92, 2.30, zF - 0.14, zF + 0.14);
      const H2 = windowG(bw, 0.66, 'willow'); H2.mesh(G).position.set(cx, 2.62, zF);
      addCollider(G, x0, x1, 2.30, 3.45, zF - 0.14, zF + 0.14);
      // 木槛
      const A2 = new Acc(MAT.timberPale);
      A2.add(bx(bw, 0.09, 0.30, cx, 0.955, zF, 1.2), [0.88, 0.83, 0.74], 0.08);
      A2.mesh(G);
    }
  }

  // ── 次间隔断板壁（留门洞） ──
  for (const s of [1, -1]) {
    const xp = s * (mw / 2);
    const A = new Acc(MAT.timberPale);
    const seg = boardWallG(zEave - 2.20, hWall, 0.085);
    const m1a = seg.mesh(G); m1a.position.set(xp, hWall / 2, (zEave + 2.20) / 2);
    const seg2 = boardWallG(zEave + 1.15, hWall, 0.085);
    const m2a = seg2.mesh(G); m2a.position.set(xp, hWall / 2, (-zEave + 1.15) / 2);
    addCollider(G, xp - 0.08, xp + 0.08, 0, hWall, 2.15, zEave + 0.05);
    addCollider(G, xp - 0.08, xp + 0.08, 0, hWall, -zEave - 0.05, 1.15);
    // 门上横板
    A.add(bx(0.10, hWall - 2.15, 0.085, 0, (hWall + 2.15) / 2, (2.15 + 1.15) / 2, 1.2), [0.86, 0.81, 0.72], 0.08);
    A.add(bx(0.16, 0.12, 0.16, 0, 2.20, (2.15 + 1.15) / 2, 1.0), [0.8, 0.75, 0.66], 0.08);
    const mm = A.mesh(G); mm.position.set(xp, 0, 0);
    addCollider(G, xp - 0.08, xp + 0.08, 2.15, hWall, 1.15, 2.15);
    // 门框抱柱
    const A3 = new Acc(MAT.timberPale);
    for (const zz of [1.15, 2.15]) A3.add(bx(0.13, 2.20, 0.13, 0, 1.10, zz, 1.0), [0.84, 0.79, 0.70], 0.06);
    const m3 = A3.mesh(G); m3.position.set(xp, 0, 0);
  }

  // ── 太师壁（明间后金柱位） ──
  {
    const zT = -zJin;
    const A = new Acc(MAT.timberPale);
    const wC = 2.10;
    const seg = boardWallG(wC, hWall + 0.5, 0.075);
    const mm = seg.mesh(G); mm.position.set(0, (hWall + 0.5) / 2, zT);
    addCollider(G, -wC / 2, wC / 2, 0, hWall + 0.4, zT - 0.08, zT + 0.08);
    for (const s of [1, -1]) {
      A.add(bx(0.14, hWall + 0.5, 0.16, s * (wC / 2 + 0.07), (hWall + 0.5) / 2, zT, 1.2), [0.84, 0.78, 0.68], 0.08);
      A.add(bx(mw / 2 - wC / 2 + 0.2, 0.16, 0.14, s * (wC / 2 + mw / 4 - 0.1), hWall + 0.42, zT, 1.2), [0.82, 0.76, 0.66], 0.08);
    }
    A.mesh(G);
  }

  // ── 廊下挂落 ──
  if (veranda) for (let i = 0; i < bays.length; i++) {
    buildGualuo(G, bayX[i] + 0.18, bayX[i + 1] - 0.18, cfg.yLan - 0.46, zEave + veranda);
  }

  return { G, F, cfg, bayX, mid, m0, m1, mw, halfW, zEave, zJin, zTip, veranda, yEaveP, yJinP, surf };
}

/* ═══════════════════════════════════════════════════════════════════
   第四部分：室内陈设（明式家具 · 文房 · 灯具 · 书画）
   ═══════════════════════════════════════════════════════════════════ */
const T_WOOD = [1, 0.97, 0.93], T_DARK = [0.86, 0.80, 0.72], T_LACQ = [0.94, 0.80, 0.74];

function addLamp(parent, x, y, z, o = {}) {
  const l = new THREE.PointLight(new THREE.Color(o.color || '#ffb266'), o.intensity || 3.0, o.distance || 6.5, o.decay === undefined ? 2 : o.decay);
  l.position.set(x, y, z); parent.add(l);
  LAMPS.push({ light: l, base: o.intensity || 3.0, flick: o.flick === undefined ? 0.10 : o.flick, phase: Math.random() * 10 });
  return l;
}
function turnedLeg(A, x, z, h, r, tint) {
  const g = latheG([
    [r * 0.42, 0], [r * 0.60, h * 0.03], [r * 1.05, h * 0.07], [r * 0.72, h * 0.14],
    [r * 0.52, h * 0.42], [r * 0.48, h * 0.66], [r * 0.62, h * 0.86], [r * 0.72, h * 0.95],
    [r * 0.60, h], [0.001, h]
  ], 10);
  g.translate(x, 0, z); A.add(g, tint, 0.08);
}
function curvedRail(pts, w, h) {
  const prof = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2], [-w / 2, -h / 2]];
  return sweepG(pts, prof, 0.7);
}
/** 收尾：建组、定位、并入碰撞体 */
function finish(parent, accs, x, y, z, ry, collide = true) {
  const grp = new THREE.Group();
  grp.position.set(x, y, z); grp.rotation.y = ry || 0; parent.add(grp);
  for (const a of accs) if (a) a.mesh(grp, {});
  grp.updateWorldMatrix(true, false);
  if (collide) COLLIDERS.push(new THREE.Box3().setFromObject(grp));
  return grp;
}

/* —— 条案（翘头案） —— */
function altarTable(parent, x, y, z, ry, o = {}) {
  const w = o.w || 2.55, d = o.d || 0.46, h = o.h || 0.93;
  const A = new Acc(MAT.furn);
  A.add(bx(w, 0.055, d, 0, h - 0.028, 0, 1.1), T_WOOD, 0.06);

/* ═══════════════════════════════════════════════════════════════════
   第五部分：园林（地形 · 水池 · 假山 · 石径 · 桥）
   ═══════════════════════════════════════════════════════════════════ */
const POND = { cx: -9.0, cz: 2.0, rx: 12.5, rz: 10.0 };
function pondRF(a) { return 1 + 0.17 * Math.sin(a * 2 + 0.7) + 0.11 * Math.sin(a * 3 - 1.2) + 0.07 * Math.sin(a * 5 + 2.0); }
function pondF(x, z) {
  const dx = (x - POND.cx) / POND.rx, dz = (z - POND.cz) / POND.rz;
  return Math.hypot(dx, dz) - pondRF(Math.atan2(dz, dx));
}
const FLAT = [];
function terrainH(x, z) {
  let h = 0.33 + (fbm3(x * 0.035, 0.5, z * 0.035, 4, 3) - 0.5) * 1.45
    + (fbm3(x * 0.13, 2.5, z * 0.13, 3, 7) - 0.5) * 0.30;
  const pf = pondF(x, z);
  if (pf < 0.65) {
    let hh;
    if (pf < -0.5) hh = lerp(-1.32, -1.62, smoothstep(-0.5, -3.2, pf));
    else if (pf < 0) hh = lerp(-1.32, -0.06, smoothstep(-0.5, 0, pf));
    else hh = lerp(-0.06, 0.28, smoothstep(0, 0.62, pf));
    h = lerp(h, hh, smoothstep(0.65, 0.45, pf));
  }
  for (const f of FLAT) {
    const d = Math.hypot(x - f.x, z - f.z);
    h = lerp(h, f.y, 1 - smoothstep(f.r * 0.55, f.r, d));
  }
  const dd = Math.max(Math.abs(x + 2) / 40, Math.abs(z) / 32);
  if (dd > 1) h += (dd - 1) * (dd - 1) * 26 + (dd - 1) * 3.0;
  return h;
}

function buildTerrain() {
  const SIZE = 200, SEG = 300;
  const g = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), uvA = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const y = terrainH(x, z);
    p.setY(i, y);
    const u = x / 1.15, v = z / 1.15;
    uvA.setXY(i, u, v);
    // 顶点色：高处草、低处苔、池底淤泥、岸边石
    const pf = pondF(x, z);
    const mos = smoothstep(0.15, 0.85, fbm3(x * 0.09, 7.3, z * 0.09, 3, 11));
    const wet = smoothstep(0.9, 0.05, pf);
    let c = [0.94, 1.0, 0.86];
    const mossC = [0.66, 0.92, 0.60], soilC = [0.92, 0.80, 0.62], siltC = [0.44, 0.52, 0.40];
    for (let k = 0; k < 3; k++) c[k] = lerp(lerp(c[k], mossC[k], mos * 0.7), soilC[k], smoothstep(0.45, 0.9, fbm3(x * 0.07, 3.1, z * 0.07, 3, 17)) * 0.5);
    for (let k = 0; k < 3; k++) c[k] = lerp(c[k], siltC[k], wet);
    const sh = 0.88 + fbm3(x * 0.4, 9.1, z * 0.4, 2, 23) * 0.26;
    col[i * 3] = c[0] * sh; col[i * 3 + 1] = c[1] * sh; col[i * 3 + 2] = c[2] * sh;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = mk(g, MAT.ground, { parent: WORLD, cast: false, recv: true });
  return m;
}

/* —— 水面 —— */
const WATER_GLSL_COMMON = `
float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+34.56); return fract(p.x*p.y); }
float vn2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1.0,0.0)), c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float pondRF(float a){ return 1.0 + 0.17*sin(a*2.0+0.7) + 0.11*sin(a*3.0-1.2) + 0.07*sin(a*5.0+2.0); }
float pondF(vec2 p){ vec2 d = (p - vec2(${POND.cx.toFixed(2)},${POND.cz.toFixed(2)})) / vec2(${POND.rx.toFixed(2)},${POND.rz.toFixed(2)});
  return length(d) - pondRF(atan(d.y,d.x)); }
float rr_h(vec2 p, float t){
  vec2 q = p*1.35; vec2 c = floor(q); float h=0.0;
  for(int i=0;i<2;i++){ for(int j=0;j<2;j++){
    vec2 cc = c + vec2(float(i),float(j));
    vec2 rd = fract(sin(vec2(dot(cc,vec2(127.1,311.7)),dot(cc,vec2(269.5,183.3))))*43758.5453);
    vec2 d = q - (cc + rd); float dd = length(d);
    h += sin(dd*15.0 - t*5.2 + rd.x*6.283) * exp(-dd*3.4) * exp(-dd*dd*0.45);

}`;

function buildWater() {
  const g = new THREE.PlaneGeometry(64, 56, 140, 120);
  g.rotateX(-Math.PI / 2);
  g.translate(POND.cx + 2, 0, POND.cz);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uNight: U.uNight, uRain: U.uRain,
      envDay: { value: null }, envNight: { value: null },
      uDeep: { value: new THREE.Color('#17271f') },
      uShallow: { value: new THREE.Color('#2c4636') },
      uSky: { value: new THREE.Color('#b9c3c6') },
      uFogColor: { value: new THREE.Color('#9aa4a8') },
      uFogDensity: { value: 0.014 },
      uSunDir: { value: new THREE.Vector3(0.3, 0.8, 0.5) },
      uSunColor: { value: new THREE.Color('#ffffff') },
      uSunI: { value: 1.0 }
    },
    vertexShader: `
      uniform float uTime; varying vec3 vWP;
      void main(){
        vec3 p = position;
        p.y += sin(p.x*1.9 + uTime*1.15)*0.011 + sin(p.z*2.3 - uTime*0.95)*0.009;
        vec4 wp = modelMatrix * vec4(p,1.0);

      uniform float uTime, uNight, uRain, uFogDensity, uSunI;
      uniform samplerCube envDay, envNight;
      uniform vec3 uDeep, uShallow, uSky, uFogColor, uSunDir, uSunColor;
      varying vec3 vWP;
      ${WATER_GLSL_COMMON}
      float waveH(vec2 p, float t){
        float h = 0.0;
        h += sin(p.x*2.05 + t*1.25)*0.0105;
        h += sin(p.y*1.73 - t*1.05)*0.0100;
        h += sin((p.x+p.y)*1.31 + t*0.85)*0.0075;
        h += (vn2(p*0.75 + vec2(t*0.055,-t*0.037))-0.5)*0.055;
        h += (vn2(p*1.9 - vec2(t*0.10, t*0.065))-0.5)*0.022;
        h += rr_h(p, t) * 0.030 * (0.35+0.65*uRain);
        return h;
      }
      void main(){
        float pf = pondF(vWP.xz);
        if (pf > -0.005) discard;
        float depth = clamp(-pf*1.7, 0.0, 1.0);
        float e = 0.085;
        float h0 = waveH(vWP.xz, uTime);
        float hx = waveH(vWP.xz+vec2(e,0.0), uTime);
        float hz = waveH(vWP.xz+vec2(0.0,e), uTime);
        vec3 N = normalize(vec3(-(hx-h0)/e, 1.0, -(hz-h0)/e));
        vec3 V = normalize(cameraPosition - vWP);
        vec3 R = reflect(-V, N);

        vec3 refl = mix(textureCube(envDay, R).rgb, textureCube(envNight, R).rgb, uNight);

        fres = clamp(fres*0.92 + 0.035, 0.0, 1.0);

        vec3 col = mix(base, refl*1.02, fres);
        vec3 Hv = normalize(normalize(uSunDir) + V);
        float spec = pow(max(dot(N,Hv),0.0), 110.0);
        col += uSunColor * spec * uSunI * (0.30 + 1.4*fres);
        // 浮萍般的细碎高光
        col += uSunColor * 0.05 * uSunI * smoothstep(0.75,1.0,vn2(vWP.xz*3.0+uTime*0.03));

    transparent: true,
    side: THREE.FrontSide
  });
  const m = new THREE.Mesh(g, mat);
  m.renderOrder = 2;
  WORLD.add(m);
  MAT.water = mat;
  return m;
}

/* —— 太湖石 —— */
function rockGeo(seed, o = {}) {
  const g = new THREE.IcosahedronGeometry(1, o.detail || 3);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i), p.getY(i), p.getZ(i));
    const n = fbm3(v.x * 1.65 + seed, v.y * 1.65, v.z * 1.65 + seed, 4, seed);
    const n2 = fbm3(v.x * 4.4, v.y * 4.4 + 3, v.z * 4.4, 3, seed + 7);
    const ridge = Math.abs(n2 - 0.5) * 2;
    const hole = smoothstep(0.70, 0.94, fbm3(v.x * 2.7 + 9, v.y * 2.7, v.z * 2.7 + 4, 3, seed + 13));
    let r = 1 + (n - 0.5) * 0.80 + (0.5 - ridge) * 0.34 - hole * 0.40;
    v.multiplyScalar(r);
    v.x *= (o.sx || 1); v.y *= (o.sy || 1); v.z *= (o.sz || 1);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  const col = new Float32Array(p.count * 3);
  const nrm = g.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i), up = clamp(nrm.getY(i), 0, 1);
    const mos = smoothstep(0.25, 0.85, fbm3(p.getX(i) * 1.1 + seed, p.getY(i) * 1.1, p.getZ(i) * 1.1, 3, 31)) * (0.35 + 0.65 * up);
    const low = smoothstep(0.9, -0.9, y);
    const dark = smoothstep(0.2, -1.0, nrm.getY(i)) * 0.4;
    let c = [0.86, 0.85, 0.82];
    c = [lerp(c[0], 0.42, mos), lerp(c[1], 0.60, mos), lerp(c[2], 0.30, mos)];
    for (let k = 0; k < 3; k++) c[k] = lerp(c[k], [0.30, 0.34, 0.26][k], low * 0.6);
    const sh = 0.86 + fbm3(p.getX(i) * 3, 5, p.getZ(i) * 3, 2, 41) * 0.3 - dark;
    col[i * 3] = c[0] * sh; col[i * 3 + 1] = c[1] * sh; col[i * 3 + 2] = c[2] * sh;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
function rockGroup(list) {
  const A = new Acc(MAT.rock);

    g.scale(r.s, r.s, r.s);
    g.rotateY(r.ry || 0); if (r.rz) g.rotateZ(r.rz); if (r.rx) g.rotateX(r.rx);

    new THREE.Vector3(r.x + r.s * 1.1, r.y + r.s * (r.sy || 1) * 1.3, r.z + r.s * 1.1)));

}

/* —— 石径（花街铺地石板） —— */
function stonePath(points, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.4);
  const L = curve.getLength();
  const n = Math.max(4, Math.round(L / (o.step || 0.62)));
  const A = new Acc(MAT.slab), B = new Acc(MAT.pebble);
  const shapes = [];
  for (let k = 0; k < 4; k++) {
    const s = new THREE.Shape();
    const N = 7;
    for (let i = 0; i <= N; i++) {
      const a = i / N * TAU;
      const rr2 = 0.30 * (0.80 + 0.34 * ((Math.sin(a * 3 + k * 2.1) + 1) * 0.5) + 0.16 * ((Math.sin(a * 5 + k) + 1) * 0.5));
      if (i === 0) s.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); else s.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    s.closePath();
    shapes.push(new THREE.ExtrudeGeometry(s, { depth: 0.075, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.010, bevelSegments: 1, curveSegments: 4 }));
  }
  const pebbles = [];
  for (let k = 0; k < 5; k++) {
    const s = new THREE.Shape();
    for (let i = 0; i <= 6; i++) {
      const a = i / 6 * TAU, rr2 = 0.055 * (0.7 + Math.random() * 0.7);
      if (i === 0) s.moveTo(Math.cos(a) * rr2, Math.sin(a) * rr2); else s.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
    }
    pebbles.push(new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: false, curveSegments: 3 }));
  }
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const p = curve.getPointAt(t), tg = curve.getTangentAt(t);
    const side = new THREE.Vector3().crossVectors(up, tg).normalize();
    const y = (o.y ? o.y(t) : terrainH(p.x, p.z)) + 0.02;
    const jx = (Math.random() - 0.5) * 0.10, jz = (Math.random() - 0.5) * 0.10;
    const g = shapes[(Math.random() * shapes.length) | 0].clone();
    g.rotateX(-Math.PI / 2);
    g.rotateY(Math.random() * TAU);
    g.scale(0.92 + Math.random() * 0.3, 1, 0.92 + Math.random() * 0.3);
    g.translate(p.x + side.x * jz + jx, y, p.z + side.z * jz + jx * 0.5);
    A.add(g, [1, 1, 1], 0.14);
    for (let k = 0; k < 5; k++) {
      const pg = pebbles[(Math.random() * pebbles.length) | 0].clone();
      pg.rotateX(-Math.PI / 2); pg.rotateY(Math.random() * TAU);
      const off = (Math.random() - 0.5) * 1.15, off2 = (Math.random() - 0.5) * 0.55;
      pg.translate(p.x + side.x * off + tg.x * off2, y - 0.012, p.z + side.z * off + tg.z * off2);
      B.add(pg, [1, 1, 1], 0.2);
    }
  }
  A.mesh(WORLD, {}); B.mesh(WORLD, {});
  return curve;
}

/* —— 亭（四角攒尖，带美人靠） —— */

function wallSeg(a, b, o) {
  const { h = 2.62, t = 0.38, wave = 0, waveF = 0.35, holes = [] } = o;
  const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
  const s = new THREE.Shape();
  const ph = o.phase || 0;
  const topAt = (u) => h + (wave ? Math.sin(u / len * Math.PI * waveF * 8 + ph) * wave : 0);
  s.moveTo(0, -0.30); s.lineTo(len, -0.30);
  const N = Math.max(4, Math.round(len / 0.6));
  for (let i = N; i >= 0; i--) { const u = len * i / N; s.lineTo(u, topAt(u)); }
  s.closePath();
  for (const hl of holes) {
    if (hl.type === 'circle') {
      const p = new THREE.Path();
      p.absarc(hl.x + hl.r, hl.y + hl.r, hl.r, 0, TAU, true);
      s.holes.push(p);
    } else {
      const p = new THREE.Path();
      p.moveTo(hl.x, hl.y); p.lineTo(hl.x + hl.w, hl.y); p.lineTo(hl.x + hl.w, hl.y + hl.h); p.lineTo(hl.x, hl.y + hl.h); p.closePath();
      s.holes.push(p);
    }
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 6 });
  g.translate(0, 0, -t / 2);
  const dir = new THREE.Vector3(dx / len, 0, dz / len);
  const side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
  const m = new THREE.Matrix4().makeBasis(dir, new THREE.Vector3(0, 1, 0), side);
  const tr = new THREE.Matrix4().makeTranslation(a.x, 0, a.z);
  g.applyMatrix4(m); g.applyMatrix4(tr);
  return g;
}

        float cl = fbmv(cuv*0.55 + vec2(uTime*0.0035, uTime*0.0021));

/* —— 日夜控制 —— */
const TIMESTATE = { t: 0.12, target: 0.12, auto: false };

const COL = {
  dayFog: new THREE.Color('#9aa4a8'), nightFog: new THREE.Color('#0c1418'),

  const fogC = COL.dayFog.clone().lerp(new THREE.Color('#c2a184'), dusk * 0.6).lerp(COL.nightFog, night);

  scene.fog.density = lerp(lerp(0.0135, 0.0190, dusk), 0.0265, night);

    wu.uSunDir.value.copy(dir);

    const g = m.userData.glow;

/* —— 视角控制 —— */
const CAM = {

      const fwd = new THREE.Vector3(Math.sin(o.th), 0, Math.cos(o.th));
      const s = o.r * 0.0016;
      o.tt.addScaledVector(right, dx * s).addScaledVector(fwd, -dy * s);

    } else {

      CAM.orbit.tph = clamp(CAM.orbit.tph - dy * 0.0042, 0.10, 1.47);
    }

    e.preventDefault();

    o.r = lerp(o.r, o.tr, 1 - Math.exp(-dt * 7));
    o.th = lerp(o.th, o.tth, 1 - Math.exp(-dt * 9));
    o.ph = lerp(o.ph, o.tph, 1 - Math.exp(-dt * 9));
    o.t.lerp(o.tt, 1 - Math.exp(-dt * 9));
    const sp = Math.sin(o.ph), cp = Math.cos(o.ph);
    camera.position.set(o.t.x + o.r * sp * Math.sin(o.th), o.t.y + o.r * cp, o.t.z + o.r * sp * Math.cos(o.th));
    camera.lookAt(o.t);
  } else {
    const fp = CAM.fp;
    const sp = (KEYS['ShiftLeft'] || KEYS['ShiftRight']) ? 3.3 : 1.5;
    let mx = 0, mz = 0;
    if (KEYS['KeyW'] || KEYS['ArrowUp']) mz += 1;
    if (KEYS['KeyS'] || KEYS['ArrowDown']) mz -= 1;
    if (KEYS['KeyA'] || KEYS['ArrowLeft']) mx -= 1;
    if (KEYS['KeyD'] || KEYS['ArrowRight']) mx += 1;
    const fwd = new THREE.Vector3(-Math.sin(fp.yaw), 0, -Math.cos(fp.yaw));
    const right = new THREE.Vector3(Math.cos(fp.yaw), 0, -Math.sin(fp.yaw));
    const move = new THREE.Vector3().addScaledVector(fwd, mz).addScaledVector(right, mx);
    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(sp * dt);
      const nx = fp.p.x + move.x, nz = fp.p.z + move.z;
      const gy = landY(nx, nz);
      const t = new THREE.Vector3(nx, fp.y, nz);
      fpCollide(t, 0.34);
      const blocked = (Math.abs(t.x - nx) > 0.004 || Math.abs(t.z - nz) > 0.004);
      if (!blocked && Math.abs(gy - fp.y) < 0.45) { fp.p.x = nx; fp.p.z = nz; }
      else if (!blocked) { fp.p.x = nx; fp.p.z = nz; fp.y = lerp(fp.y, gy, 0.4); }
      else { fp.p.x = t.x; fp.p.z = t.z; }
    }
    fp.y = lerp(fp.y, landY(fp.p.x, fp.p.z), 1 - Math.exp(-dt * 11));
    fp.p.y = fp.y;
    const eye = fp.y + 1.62;
    camera.position.set(fp.p.x, eye, fp.p.z);
    const cp = Math.cos(fp.pitch), sp2 = Math.sin(fp.pitch);
    camera.lookAt(fp.p.x - Math.sin(fp.yaw) * cp, eye + sp2, fp.p.z - Math.cos(fp.yaw) * cp);
  }
}

  setTimeout(() => { const l = document.getElementById('load'); if (l) l.style.display = 'none'; }, 1000);

  let last = performance.now(), fc = 0, fpsT = 0, frame = 0;
  const fpsEl = document.getElementById('fps');
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; frame++;
    U.uTime.value += dt;
    // 时辰过渡
    if (Math.abs(TIMESTATE.target - TIMESTATE.t) > 0.0008) {
      const d = TIMESTATE.target - TIMESTATE.t;
      TIMESTATE.t += clamp(d, -dt * 0.30, dt * 0.30);
      applyTime(TIMESTATE.t);
      sT.value = Math.round(TIMESTATE.t * 1000);
    }
    updateCamera(dt);
    SKY.position.copy(camera.position);
    // 灯烛摇曳
    const nf = smoothstep(0.28, 0.80, TIMESTATE.t);
    for (const L of LAMPS) {
      const t = U.uTime.value;
      const f = 1 + L.flick * (Math.sin(t * 7.3 + L.phase) * 0.5 + Math.sin(t * 13.1 + L.phase * 2.3) * 0.32 + Math.sin(t * 23.7 + L.phase * 3.1) * 0.18);
      L.light.intensity = L.base * (0.03 + 0.97 * nf) * f;
      L.light.visible = L.light.intensity > 0.04;
    }
    // 锦鲤
    for (const f of FISH) {
      f.t += f.sp * dt; if (f.t > 1) f.t -= 1;
      const a = f.t * TAU + f.ph;
      f.g.position.set(f.cx + Math.cos(a) * f.r, -0.26 + Math.sin(a * 2.0) * 0.07, f.cz + Math.sin(a) * f.r * 0.82);
      f.g.rotation.y = -a + Math.PI / 2 + Math.sin(a * 3) * 0.12;
      f.g.rotation.z = Math.sin(a * 6) * 0.035;
      if (f.tail) f.tail.rotation.y = Math.sin(U.uTime.value * 3.6 + f.ph) * 0.45;
    }
    // 雾气漂移
    for (const m of RAINSTATE.mist) {
      m.rotation.z += m.userData.dr * dt;
      m.position.y = m.userData.y0 + Math.sin(U.uTime.value * 0.08 + m.userData.ph) * 0.55;
    }
    if (RAINTATE_MESH()) RAINSTATE.mesh.material.uniforms.uCam.value.copy(camera.position);
    if (shadowDirty || frame % 40 === 0) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
    renderFrame();
    fc++; fpsT += dt;
    if (fpsT > 0.5) { fpsEl.textContent = Math.round(fc / fpsT) + ' FPS'; fc = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function RAINTATE_MESH() { return !!(RAINSTATE && RAINSTATE.mesh); }

main().catch(e => {
  console.error(e);
  document.getElementById('load').style.display = 'none';
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.innerHTML = '场景构建出错：<br>' + (e && e.message ? e.message : e);
});
</script>
