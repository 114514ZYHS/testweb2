<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>江南庭院 · 宋明私家园林</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0c0d;
    font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC","KaiTi",serif;
    color:#ece7dd;-webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block;width:100%;height:100%;outline:none}
  .veil{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.28) 100%)}
  /* 标题 */
  #title{position:fixed;left:28px;top:24px;pointer-events:none;opacity:.92}
  #title h1{font-size:23px;font-weight:400;letter-spacing:.42em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  #title p{font-size:11.5px;letter-spacing:.3em;opacity:.62;margin-top:7px}
  #seal{position:fixed;left:30px;top:96px;width:38px;height:38px;border:1.4px solid rgba(190,70,55,.85);
    border-radius:2px;color:rgba(200,80,62,.92);font-size:11px;line-height:1.05;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:center;text-align:center;opacity:.8;pointer-events:none;
    writing-mode:vertical-rl;padding:3px}
  /* 底部控制条 */
  #bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:20px;align-items:center;
    background:rgba(14,17,18,.52);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.10);border-radius:3px;padding:11px 20px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .grp{display:flex;align-items:center;gap:9px}
  .lab{font-size:11.5px;letter-spacing:.2em;opacity:.62;white-space:nowrap}
  .btn{font-family:inherit;font-size:12.5px;letter-spacing:.18em;color:#e6e0d5;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:2px;
    padding:6px 13px;transition:.25s}
  .btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
  .btn.on{background:rgba(205,150,80,.20);border-color:rgba(220,165,95,.6);color:#f4dfc0}
  .sep{width:1px;height:22px;background:rgba(255,255,255,.12)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:2px;background:rgba(255,255,255,.25);
    border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#e2d9c8;box-shadow:0 0 8px rgba(0,0,0,.5);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#e2d9c8}
  /* 提示 */
  #tip{position:fixed;right:26px;bottom:26px;text-align:right;font-size:11.5px;line-height:2;opacity:.5;pointer-events:none}
  #tip b{font-weight:400;opacity:.9}
  #fps{position:fixed;right:26px;top:26px;font-size:11px;opacity:.35;letter-spacing:.1em}
  /* 加载 */
  #load{position:fixed;inset:0;background:#0b0e10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:50;transition:opacity .9s ease}
  #load.hide{opacity:0;pointer-events:none}
  #load h2{font-size:26px;font-weight:400;letter-spacing:.6em;margin-bottom:8px;opacity:.9}
  #load .sub{font-size:11px;letter-spacing:.35em;opacity:.45;margin-bottom:34px}
  #prog{width:280px;height:1px;background:rgba(255,255,255,.14);position:relative}
  #prog i{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,#8a7a5c,#d8c39a);transition:width .3s}
  #stat{margin-top:16px;font-size:11px;letter-spacing:.22em;opacity:.5;height:14px}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    padding:40px;font-size:14px;line-height:2.2;opacity:.8;z-index:60}
  @media(max-width:720px){#bar{gap:10px;padding:8px 12px;transform:translateX(-50%) scale(.86)} #tip{display:none} #title h1{font-size:18px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="veil"></div>

<div id="title"><h1>江南庭院</h1><p>宋明私家园林 · 雨中听雨</p></div>
<div id="seal">听雨</div>
<div id="fps"></div>

<div id="bar">
  <div class="grp"><span class="lab">时辰</span><input id="sTime" type="range" min="0" max="1000" value="120"></div>
  <div class="sep"></div>
  <div class="grp">
    <button class="btn" id="bDay">昼</button>
    <button class="btn" id="bDusk">暮</button>
    <button class="btn" id="bNight">夜</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lab">雨</span><input id="sRain" type="range" min="0" max="100" value="55"></div>
  <div class="sep"></div>
  <div class="grp">
    <button class="btn on" id="bOrbit">环视</button>
    <button class="btn" id="bFp">漫游</button>
  </div>
</div>

<div id="tip">
  <div><b>拖拽</b> 旋转 · <b>滚轮</b> 远近 · <b>右键</b> 平移</div>
  <div>漫游：<b>W A S D</b> 行走 · <b>按住左键</b> 转头 · <b>Shift</b> 快走 · <b>Esc</b> 退出</div>
</div>

<div id="load">
  <h2>江南庭院</h2>
  <div class="sub">SONG-MING PRIVATE GARDEN</div>
  <div id="prog"><i></i></div>
  <div id="stat">正在准备…</div>
</div>
<div id="err"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════
   江南庭院 · 宋明私家园林  —— 单文件 Three.js 场景
   所有纹理均由 Canvas 程序化生成，场景几何全部按宋明木构逻辑搭建
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 0. 载入 Three.js（多 CDN 回退） ───────────────────────────────── */
const CDNS = [
  'https://unpkg.com/three@0.161.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js',
  'https://esm.sh/three@0.161.0',
  'https://cdn.skypack.dev/three@0.161.0'
];
let THREE = null;
for (const url of CDNS) {
  try { THREE = await import(/* @vite-ignore */ url); if (THREE && THREE.Scene) break; }
  catch (e) { THREE = null; }
}
if (!THREE) {
  document.getElementById('load').style.display = 'none';
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.innerHTML = '未能载入 Three.js。<br>本页需要联网从 CDN 获取 three.js（r161）。<br>请检查网络后刷新。';
  throw new Error('three.js load failed');
}

/* ── 1. 基础工具 ──────────────────────────────────────────────────── */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rint = (a, b) => Math.floor(rnd(b + 1, a));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20260806);           // 固定随机种子，保证布局稳定
const rr = (a = 1, b = 0) => b + R() * (a - b);

/* 整数哈希噪声（快） */
function ihash(x, y, s) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  n = (n ^ (n >>> 13)) | 0; n = Math.imul(n, 1274126177) | 0;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
/* 可平铺值噪声：u,v∈[0,1)，per=单元格数 */
function tnoise(u, v, per, s) {
  per = Math.max(1, Math.round(per));
  const x = u * per, y = v * per, xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const w = (n) => ((n % per) + per) % per;
  const a = ihash(w(xi), w(yi), s), b = ihash(w(xi + 1), w(yi), s);
  const c = ihash(w(xi), w(yi + 1), s), d = ihash(w(xi + 1), w(yi + 1), s);
  const ux = xf * xf * (3 - 2 * xf), uy = yf * yf * (3 - 2 * yf);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function tfbm(u, v, per, oct = 4, s = 0) {
  let f = per, a = 0.5, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * tnoise(u, v, f, s + i * 17); norm += a; f *= 2; a *= 0.5; }
  return sum / norm;
}
/* 3D 噪声（山石用） */
function h3(x, y, z, s) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1274126177) + Math.imul(s | 0, 2246822519)) | 0;
  n = (n ^ (n >>> 13)) | 0; n = Math.imul(n, 1274126177) | 0;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function n3(x, y, z, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const ux = xf * xf * (3 - 2 * xf), uy = yf * yf * (3 - 2 * yf), uz = zf * zf * (3 - 2 * zf);
  const c = (i, j, k) => h3(xi + i, yi + j, zi + k, s);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), ux), x10 = lerp(c(0, 1, 0), c(1, 1, 0), ux);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), ux), x11 = lerp(c(0, 1, 1), c(1, 1, 1), ux);
  return lerp(lerp(x00, x10, uy), lerp(x01, x11, uy), uz);
}
function fbm3(x, y, z, oct = 4, s = 0) {
  let f = 1, a = 0.5, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * n3(x * f, y * f, z * f, s + i * 31); norm += a; f *= 2.03; a *= 0.5; }
  return sum / norm;
}
const wait = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* ── 2. Canvas 纹理工厂 ───────────────────────────────────────────── */
function mkCanvas(size) { const c = document.createElement('canvas'); c.width = c.height = size; return c; }

/* 由高度图生成切线空间法线图 */
function heightToNormal(img, w, h, strength) {
  const out = mkCanvas(w), octx = out.getContext('2d');
  const o = octx.createImageData(w, h);
  const H = (x, y) => img.data[((((y + h) % h) * w) + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
    const dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    let nx = -dx, ny = -dy, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const i = (y * w + x) * 4;
    o.data[i] = (nx * 0.5 + 0.5) * 255; o.data[i + 1] = (ny * 0.5 + 0.5) * 255;
    o.data[i + 2] = (nz * 0.5 + 0.5) * 255; o.data[i + 3] = 255;
  }
  octx.putImageData(o, 0, 0); return out;
}

const TEXCACHE = [];
function mkTex(canvas, { srgb = false, repeat = 1, aniso = 8, wrap = THREE.RepeatWrapping } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = wrap;
  if (repeat !== 1) t.repeat.set(repeat, repeat);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = aniso;
  t.needsUpdate = true;
  TEXCACHE.push(t);
  return t;
}

/**
 * 一次性生成 颜色/法线/粗糙度 三张图
 * shade(u,v,x,y) -> {c:[r,g,b] 0..1, h:高度 0..1, r:粗糙度 0..1}
 */
function genTex(size, shade, { repeat = 1, nrm = 1.0, colorSpace = true } = {}) {
  const cc = mkCanvas(size), hc = mkCanvas(size), rc = mkCanvas(size);
  const cx = cc.getContext('2d'), hx = hc.getContext('2d'), rx = rc.getContext('2d');
  const ci = cx.createImageData(size, size), hi = hx.createImageData(size, size), ri = rx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const s = shade(x / size, y / size, x, y) || {};
      const i = (y * size + x) * 4;
      const c = s.c || [0.5, 0.5, 0.5];
      const h = s.h === undefined ? 0.5 : s.h;
      const r = s.r === undefined ? 0.7 : s.r;
      ci.data[i] = clamp(c[0], 0, 1) * 255; ci.data[i + 1] = clamp(c[1], 0, 1) * 255; ci.data[i + 2] = clamp(c[2], 0, 1) * 255; ci.data[i + 3] = 255;
      const hv = clamp(h, 0, 1) * 255; hi.data[i] = hv; hi.data[i + 1] = hv; hi.data[i + 2] = hv; hi.data[i + 3] = 255;
      const rv = clamp(r, 0, 1) * 255; ri.data[i] = rv; ri.data[i + 1] = rv; ri.data[i + 2] = rv; ri.data[i + 3] = 255;
    }
  }
  cx.putImageData(ci, 0, 0); hx.putImageData(hi, 0, 0); rx.putImageData(ri, 0, 0);
  return {
    map: mkTex(cc, { srgb: colorSpace, repeat }),
    normalMap: mkTex(heightToNormal(hi, size, size, nrm * size / 64), { repeat }),
    roughnessMap: mkTex(rc, { repeat })
  };
}

/* 生成一张带 alpha 的叶片/花纹贴图（用于 alphaTest 植被） */
function genAlpha(size, draw, { repeat = 1 } = {}) {
  const c = mkCanvas(size), x = c.getContext('2d');
  x.clearRect(0, 0, size, size);
  draw(x, size);
  return mkTex(c, { srgb: true, repeat });
}

/* ── 3. 全局共享 uniform ──────────────────────────────────────────── */
const U = {
  uTime:  { value: 0 },
  uNight: { value: 0 },     // 0=白昼 1=夜
  uDusk:  { value: 0 },     // 黄昏权重
  uWet:   { value: 0.85 },  // 湿润度
  uRain:  { value: 0.55 }   // 雨量
};

/* ── 4. 程序化纹理集 ───────────────────────────────────────────────
   木 / 砖 / 石 / 瓦 / 灰 / 纸 / 绸 / 铜 / 瓷 / 竹 / 叶 / 书画
   ─────────────────────────────────────────────────────────────── */
const TEX = {};

function buildTextures() {

  /* —— 木材 —— */
  function woodShade(o) {
    const { light, dark, weatherCol, weatherAmt, plank = 5, polish = 0.0, seed = 3 } = o;
    const knots = [];
    for (let i = 0; i < 3; i++) knots.push({ u: rr(1), v: rr(1), r: rr(0.1, 0.045), d: rr(TAU) });
    return (u, v) => {
      const pid = Math.floor(u * plank);
      const pu = (u * plank) % 1;
      const tone = 0.80 + ihash(pid, 9, seed) * 0.36;
      // 年轮：沿 v 方向的条纹
      const w1 = tfbm(u, v, 6, 4, seed + 1);
      const rings = Math.abs(Math.sin((u * 46 + w1 * 5.2) * Math.PI));
      let g = Math.pow(rings, 0.55);
      const fine = tfbm(u * 3.0, v * 0.22, 22, 3, seed + 5);
      g = clamp(g * 0.75 + fine * 0.35, 0, 1);
      // 节疤
      let knotMask = 0;
      for (const k of knots) {
        let du = (k.u - u), dv = (k.v - v) * 0.35;
        du -= Math.round(du); dv -= Math.round(dv);
        const d = Math.hypot(du, dv * 2.2);
        if (d < k.r * 3) knotMask = Math.max(knotMask, (1 - smoothstep(k.r * 0.5, k.r * 3, d)) * (0.5 + 0.5 * Math.sin(d * 190)));
      }
      // 风化：斑驳灰化 + 竖向水渍
      const wea = smoothstep(0.46, 0.92, tfbm(u, v, 4.2, 4, seed + 11) * 0.75 + tfbm(u * 1.2, v * 0.30, 9, 3, seed + 13) * 0.45);
      const seam = 1 - smoothstep(0.0, 0.028, Math.min(pu, 1 - pu));
      let c = [0, 0, 0];
      for (let i = 0; i < 3; i++) c[i] = lerp(lerp(dark[i], light[i], g), weatherCol[i], wea * weatherAmt);
      for (let i = 0; i < 3; i++) c[i] *= tone * (1 - seam * 0.35) * (1 - knotMask * 0.42) * (0.93 + fine * 0.14);
      // 细小裂纹
      const crack = smoothstep(0.86, 0.995, tfbm(u, v, 16, 3, seed + 21));
      for (let i = 0; i < 3; i++) c[i] *= 1 - crack * 0.35;
      const h = 0.55 - g * 0.28 - seam * 0.3 - crack * 0.3 + wea * 0.1;
      let rgh = lerp(0.60, 0.93, wea) + (g - 0.5) * 0.12 - polish * (1 - wea) * 0.42;
      rgh = clamp(rgh + (fine - 0.5) * 0.08, 0.12, 0.98);
      return { c, h, r: rgh };
    };
  }
  TEX.wood = genTex(256, woodShade({
    light: [0.290, 0.216, 0.150], dark: [0.150, 0.103, 0.062], weatherCol: [0.360, 0.336, 0.290], weatherAmt: 0.72, plank: 4, seed: 3
  }), { repeat: 1, nrm: 0.85 });                                   // 构架用老杉木
  TEX.woodPale = genTex(256, woodShade({
    light: [0.400, 0.330, 0.250], dark: [0.235, 0.180, 0.125], weatherCol: [0.420, 0.400, 0.360], weatherAmt: 0.55, plank: 5, seed: 17
  }), { repeat: 1, nrm: 0.8 });                                    // 门窗装修
  TEX.woodDark = genTex(256, woodShade({
    light: [0.180, 0.098, 0.062], dark: [0.072, 0.040, 0.028], weatherCol: [0.200, 0.170, 0.140], weatherAmt: 0.28, plank: 3, polish: 0.85, seed: 31
  }), { repeat: 1, nrm: 0.55 });                                   // 家具硬木（擦漆）
  TEX.woodLacq = genTex(256, woodShade({
    light: [0.235, 0.088, 0.062], dark: [0.130, 0.040, 0.030], weatherCol: [0.260, 0.190, 0.140], weatherAmt: 0.20, plank: 2, polish: 1.0, seed: 47
  }), { repeat: 1, nrm: 0.4 });                                    // 朱漆

  /* —— 青砖地面（方砖） —— */
  TEX.brick = genTex(256, (u, v) => {
    const n = 4, cu = u * n, cv = v * n, ix = Math.floor(cu), iy = Math.floor(cv);
    const fx = cu - ix, fy = cv - iy;
    const edge = Math.min(fx, 1 - fx, fy, 1 - fy);
    const joint = smoothstep(0.0, 0.030, edge);            // 0=砖缝
    const st = (ix % 2) * 0.5 + (iy % 2) * 0.25;
    const tone = 0.80 + ihash(ix + (iy << 4), 3, 7) * 0.34;
    const spec = tfbm(u, v, 42, 3, 5);
    const wear = smoothstep(0.35, 0.95, tfbm(u, v, 3.4, 4, 19));   // 磨耗发白
    let c = [0, 0, 0];
    const base = [0.318, 0.318, 0.312], warm = [0.372, 0.348, 0.312];
    for (let i = 0; i < 3; i++) c[i] = lerp(base[i], warm[i], st) * tone * (0.88 + spec * 0.26);
    // 砖缝灰浆 + 缝中苔痕
    const moss = (1 - joint) * smoothstep(0.25, 0.85, tfbm(u, v, 4.0, 4, 27)) + joint * smoothstep(0.72, 0.96, tfbm(u, v, 6.0, 4, 33)) * 0.55;
    const mossC = [0.190, 0.235, 0.130];
    const mortarC = [0.290, 0.288, 0.272];
    for (let i = 0; i < 3; i++) c[i] = lerp(lerp(c[i] * (1 + wear * 0.16), mortarC[i], (1 - joint) * 0.92), mossC[i], clamp(moss, 0, 1) * 0.85);
    // 水渍（低处更深）
    const damp = smoothstep(0.45, 1.0, tfbm(u, v, 2.6, 3, 41) * 0.6 + v * 0.45);
    for (let i = 0; i < 3; i++) c[i] *= 1 - damp * 0.14;
    const h = joint * (0.55 + spec * 0.2) + (1 - joint) * 0.18 - moss * 0.05;
    const r = clamp(0.70 + (1 - joint) * 0.14 - damp * 0.20 + moss * 0.12, 0.25, 0.98);
    return { c, h, r };
  }, { repeat: 1, nrm: 1.1 });

  /* —— 石板铺地 —— */
  TEX.slab = genTex(256, (u, v) => {
    const nx = 2, ny = 3, cu = u * nx, cv = v * ny;
    const row = Math.floor(cv); const off = (row % 2) * 0.5;
    const cx2 = (cu + off) % 1 === cu + off ? cu + off : cu + off; const ix = Math.floor(cu + off), iy = row;
    const fx = (cu + off) - ix, fy = cv - iy;
    const edge = Math.min(fx, 1 - fx, fy, 1 - fy);
    const joint = smoothstep(0.0, 0.045, edge);
    const id = ihash(ix + 31, iy + 7, 11);
    const tone = 0.76 + id * 0.38;
    // 花岗斑晶
    const grain = tfbm(u, v, 60, 3, 23);
    const blot = tfbm(u, v, 7, 4, 29);
    let c = [0, 0, 0];
    const g1 = [0.400, 0.400, 0.392], g2 = [0.300, 0.305, 0.300];
    for (let i = 0; i < 3; i++) c[i] = lerp(g1[i], g2[i], blot) * tone * (0.86 + grain * 0.28);
    const speck = smoothstep(0.80, 0.98, tfbm(u, v, 90, 2, 37));
    for (let i = 0; i < 3; i++) c[i] += speck * 0.10;
    const moss = (1 - joint) * smoothstep(0.30, 0.9, tfbm(u, v, 3.4, 4, 43)) + joint * smoothstep(0.55, 0.95, tfbm(u, v, 5.0, 3, 47)) * 0.7;
    const mossC = [0.180, 0.225, 0.120];
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], mossC[i], clamp(moss, 0, 1) * 0.8);
    const damp = smoothstep(0.4, 1.0, tfbm(u, v, 2.2, 3, 51) * 0.6 + v * 0.4);
    for (let i = 0; i < 3; i++) c[i] *= 1 - damp * 0.16;
    const h = joint * (0.5 + grain * 0.3) + (1 - joint) * 0.12;
    return { c, h, r: clamp(0.62 + (1 - joint) * 0.2 - damp * 0.28 + moss * 0.15, 0.18, 0.98) };
  }, { repeat: 1, nrm: 1.2 });

  /* —— 卵石花街铺地 —— */
  TEX.pebble = genTex(256, (u, v) => {
    const N = 11;
    let best = 9, bid = 0, bx = 0, by = 0;
    const gu = u * N, gv = v * N, gi = Math.floor(gu), gj = Math.floor(gv);
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const ci = gi + i, cj = gj + j;
      const rx = ihash(ci, cj, 61), ry = ihash(ci, cj, 67), rr2 = ihash(ci, cj, 71), ra = ihash(ci, cj, 73);
      const px = ci + 0.18 + rx * 0.64, py = cj + 0.18 + ry * 0.64;
      const a = ra * TAU;
      let dx = gu - px, dy = gv - py;
      const ca = Math.cos(-a), sa = Math.sin(-a);
      const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      const w = 0.20 + rr2 * 0.22, hh = w * (0.55 + rr2 * 0.35);
      const d = Math.hypot(lx / w, ly / hh);
      if (d < best) { best = d; bid = ihash(ci, cj, 79); bx = lx / w; by = ly / hh; }
    }
    const inside = smoothstep(1.0, 0.86, best);
    const pal = [[0.52, 0.51, 0.49], [0.34, 0.34, 0.33], [0.62, 0.60, 0.56], [0.44, 0.40, 0.35], [0.26, 0.26, 0.25], [0.55, 0.52, 0.45]];
    const col = pal[(bid * 6) | 0];
    const shade = 0.72 + (1 - best * 0.5) * 0.3 * inside + (bx * 0.12);
    let c = [col[0] * shade, col[1] * shade, col[2] * shade];
    const grout = [0.215, 0.215, 0.205];
    const moss = smoothstep(0.55, 0.95, tfbm(u, v, 4.0, 3, 83)) * (1 - inside) * 1.0 + smoothstep(0.75, 1.0, tfbm(u, v, 3, 3, 87)) * inside * 0.5;
    for (let i = 0; i < 3; i++) c[i] = lerp(lerp(grout[i], c[i], inside), [0.17, 0.22, 0.12][i], clamp(moss, 0, 1) * 0.75);
    return { c, h: inside * (0.45 + (1 - best) * 0.5) + 0.1, r: clamp(0.72 - inside * 0.2 + moss * 0.2, 0.2, 0.98) };
  }, { repeat: 1, nrm: 1.4 });

  /* —— 白粉墙 —— */
  TEX.plaster = genTex(256, (u, v) => {
    const f1 = tfbm(u, v, 3.0, 4, 5);
    const f2 = tfbm(u, v, 9.0, 3, 9);
    const fine = tfbm(u, v, 40, 2, 13);
    let c = [0.795, 0.788, 0.752];
    for (let i = 0; i < 3; i++) c[i] *= 0.86 + f1 * 0.26 + f2 * 0.07;
    // 雨水顺墙流痕（自上而下加深）
    const streak = Math.pow(clamp(tfbm(u * 1.1, v * 0.10, 7, 3, 17), 0, 1), 2.2) * (0.30 + 0.70 * v);
    const damp = smoothstep(0.25, 1.0, tfbm(u, v, 2.4, 3, 19) * 0.55 + v * 0.5);
    for (let i = 0; i < 3; i++) { c[i] *= 1 - streak * 0.30; c[i] *= 1 - damp * 0.22; }
    // 霉斑（下部）
    const mold = clamp(smoothstep(0.50, 0.95, tfbm(u, v, 4.6, 4, 23) * 0.7 + v * 0.45) * 0.9, 0, 1);
    const moldC = [0.330, 0.345, 0.300];
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], moldC[i], mold);
    // 剥落露出灰底
    const peel = smoothstep(0.80, 0.97, tfbm(u, v, 3.2, 4, 29));
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.470, 0.430, 0.375][i], peel * 0.85);
    // 细孔
    const pit = smoothstep(0.93, 1.0, tfbm(u, v, 60, 2, 31));
    for (let i = 0; i < 3; i++) c[i] *= 1 - pit * 0.35;
    return { c, h: 0.6 - pit * 0.4 - peel * 0.25 + fine * 0.06, r: clamp(0.90 - damp * 0.22 + peel * 0.05, 0.4, 1.0) };
  }, { repeat: 1, nrm: 0.7 });

  /* —— 小青瓦 —— */
  TEX.tile = genTex(256, (u, v) => {
    const m1 = tfbm(u, v, 5.0, 4, 3), m2 = tfbm(u, v, 18, 3, 7), fine = tfbm(u, v, 55, 2, 11);
    let c = [0.205, 0.222, 0.232];
    for (let i = 0; i < 3; i++) c[i] *= 0.78 + m1 * 0.42 + m2 * 0.14;
    // 地衣苔痕
    const lich = smoothstep(0.56, 0.90, tfbm(u, v, 4.2, 4, 13));
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.330, 0.360, 0.300][i], lich * 0.72);
    // 烟熏与雨痕
    const soot = smoothstep(0.60, 1.0, tfbm(u, v, 3.0, 3, 17) * 0.6 + v * 0.35);
    for (let i = 0; i < 3; i++) c[i] *= 1 - soot * 0.22;
    c[0] += fine * 0.03; c[1] += fine * 0.028; c[2] += fine * 0.026;
    return { c, h: 0.5 + m2 * 0.25 + fine * 0.12, r: clamp(0.60 - lich * 0.05 + m2 * 0.2 + soot * 0.08, 0.28, 0.95) };
  }, { repeat: 1, nrm: 0.9 });

  /* —— 太湖石 —— */
  TEX.rock = genTex(256, (u, v) => {
    const m = tfbm(u, v, 4.0, 5, 3), m2 = tfbm(u, v, 14, 3, 7);
    const vein = smoothstep(0.60, 0.80, tfbm(u, v, 5.5, 5, 11));
    const vein2 = smoothstep(0.72, 0.88, tfbm(u * 1.7, v * 1.7, 9, 3, 13));
    const pit = smoothstep(0.66, 0.94, tfbm(u, v, 11, 4, 17));
    let c = [0.430, 0.428, 0.418];
    for (let i = 0; i < 3; i++) c[i] *= 0.72 + m * 0.5 + m2 * 0.12;
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.760, 0.760, 0.735][i], vein * 0.7);
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.710, 0.700, 0.660][i], vein2 * 0.5);
    for (let i = 0; i < 3; i++) c[i] *= 1 - pit * 0.62;
    const moss = smoothstep(0.62, 0.95, tfbm(u, v, 5.0, 4, 23)) * (0.35 + 0.65 * pit);
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.170, 0.230, 0.115][i], moss * 0.8);
    return { c, h: 0.55 - pit * 0.5 + m2 * 0.2, r: clamp(0.86 - pit * 0.05 + moss * 0.1, 0.4, 1.0) };
  }, { repeat: 1, nrm: 1.5 });

  /* —— 泥土 / 地被 —— */
  TEX.soil = genTex(256, (u, v) => {
    const m = tfbm(u, v, 6, 4, 3), f = tfbm(u, v, 34, 3, 7);
    const stone = smoothstep(0.80, 0.96, tfbm(u, v, 26, 2, 11));
    let c = [0.205, 0.160, 0.115];
    for (let i = 0; i < 3; i++) c[i] *= 0.7 + m * 0.6 + f * 0.25;
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.40, 0.39, 0.36][i], stone * 0.8);
    return { c, h: 0.45 + f * 0.3 + stone * 0.25, r: clamp(0.92 - stone * 0.15, 0.5, 1.0) };
  }, { repeat: 1, nrm: 1.0 });

  TEX.ground = genTex(256, (u, v) => {
    const m = tfbm(u, v, 4.0, 4, 3), f = tfbm(u, v, 26, 3, 7);
    const mossA = smoothstep(0.36, 0.72, tfbm(u, v, 5.0, 4, 11) * 0.75 + m * 0.35);
    const bare = smoothstep(0.62, 0.92, tfbm(u, v, 3.0, 3, 13));
    const grassC = [0.150, 0.215, 0.105], mossC = [0.105, 0.185, 0.085], soilC = [0.200, 0.160, 0.115];
    let c = [0, 0, 0];
    for (let i = 0; i < 3; i++) {
      c[i] = lerp(lerp(grassC[i], mossC[i], mossA), soilC[i], bare * 0.75);
      c[i] *= 0.72 + m * 0.5 + f * 0.32;
    }
    return { c, h: 0.5 + f * 0.35, r: clamp(0.90 - mossA * 0.05, 0.5, 1.0) };
  }, { repeat: 1, nrm: 0.8 });

  TEX.moss = genTex(128, (u, v) => {
    const m = tfbm(u, v, 6, 4, 3), f = tfbm(u, v, 30, 3, 7);
    let c = [0.115, 0.200, 0.085];
    for (let i = 0; i < 3; i++) c[i] *= 0.62 + m * 0.75 + f * 0.3;
    c[1] += f * 0.05;
    return { c, h: 0.5 + f * 0.4, r: clamp(0.95 - m * 0.08, 0.6, 1.0) };
  }, { repeat: 1, nrm: 1.2 });

  /* —— 窗纸 / 灯笼纸 —— */
  TEX.paper = genTex(128, (u, v) => {
    const f = tfbm(u, v, 7, 3, 3);
    const fib = tfbm(u * 1.5, v * 0.2, 14, 2, 7);
    const fib2 = tfbm(u * 0.2, v * 1.6, 12, 2, 11);
    let c = [0.845, 0.795, 0.680];
    for (let i = 0; i < 3; i++) c[i] *= 0.86 + f * 0.22 + fib * 0.06 + fib2 * 0.05;
    const spot = smoothstep(0.85, 1.0, tfbm(u, v, 12, 3, 17));
    for (let i = 0; i < 3; i++) c[i] *= 1 - spot * 0.16;
    return { c, h: 0.5 + fib * 0.2, r: 0.88 };
  }, { repeat: 1, nrm: 0.35 });

  /* —— 帐幔织物 —— */
  TEX.silk = genTex(256, (u, v) => {
    const dam = Math.pow(Math.abs(Math.sin(u * 9 * Math.PI) * Math.sin(v * 9 * Math.PI)), 0.25);
    const fl = tfbm(u, v, 9, 4, 3);
    const pat = Math.abs(Math.sin((u * 6 + fl * 2) * Math.PI)) * Math.abs(Math.sin((v * 6 + fl * 2) * Math.PI));
    let c = [0.700, 0.672, 0.610];
    for (let i = 0; i < 3; i++) c[i] *= 0.86 + pat * 0.16 + dam * 0.05;
    return { c, h: 0.5 + pat * 0.15, r: 0.80 - pat * 0.06 };
  }, { repeat: 1, nrm: 0.5 });

  /* —— 铜（香炉） —— */
  TEX.bronze = genTex(256, (u, v) => {
    const m = tfbm(u, v, 5, 4, 3), f = tfbm(u, v, 24, 3, 7);
    const pat = smoothstep(0.52, 0.86, tfbm(u, v, 6.5, 4, 11));
    let c = [0.330, 0.265, 0.140];
    for (let i = 0; i < 3; i++) c[i] *= 0.7 + m * 0.6 + f * 0.15;
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.235, 0.360, 0.290][i], pat * 0.85);
    return { c, h: 0.5 + f * 0.2 - pat * 0.15, r: clamp(0.40 + pat * 0.42 + f * 0.1, 0.15, 0.95) };
  }, { repeat: 1, nrm: 0.8 });

  /* —— 青瓷 —— */
  TEX.celadon = genTex(256, (u, v) => {
    const m = tfbm(u, v, 4, 4, 3);
    const cr = Math.abs(tfbm(u, v, 7.0, 3, 11) - 0.5);
    const crack = 1 - smoothstep(0.006, 0.03, cr);
    let c = [0.545, 0.660, 0.605];
    for (let i = 0; i < 3; i++) c[i] *= 0.85 + m * 0.28;
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.330, 0.400, 0.360][i], crack * 0.75);
    return { c, h: 0.5 - crack * 0.12, r: clamp(0.14 + m * 0.16, 0.05, 0.5) };
  }, { repeat: 1, nrm: 0.35 });

  /* —— 竹秆 —— */
  TEX.bamboo = genTex(128, (u, v) => {
    const nodes = 3;
    const nv = (v * nodes) % 1;
    const ring = 1 - smoothstep(0.0, 0.055, Math.min(nv, 1 - nv));
    const stripe = tfbm(u, v * 0.10, 20, 3, 3);
    const blot = tfbm(u, v, 5, 4, 7);
    const age = smoothstep(0.35, 0.85, blot);
    let c = [0, 0, 0];
    const young = [0.330, 0.420, 0.180], old = [0.520, 0.500, 0.270];
    for (let i = 0; i < 3; i++) c[i] = lerp(young[i], old[i], age) * (0.85 + stripe * 0.28);
    for (let i = 0; i < 3; i++) c[i] *= 1 - ring * 0.42;
    // 白粉与地衣
    const bloom = smoothstep(0.72, 0.95, tfbm(u, v, 8, 3, 13));
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], [0.560, 0.560, 0.480][i], bloom * 0.55);
    return { c, h: 0.5 + ring * 0.35 + stripe * 0.1, r: clamp(0.52 + age * 0.2 + bloom * 0.15, 0.3, 0.9) };
  }, { repeat: 1, nrm: 0.6 });
}

/* ── 5. 书画 / 匾额 / 灯笼纹样（Canvas 2D 绘制） ──────────────────── */
const CJK = '"KaiTi","STKaiti","Kaiti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif';

function paintInkScroll(W, H, seed) {
  const c = mkCanvas(W), x = c.getContext('2d');
  const s = mulberry32(seed);
  // 绢/纸底
  x.fillStyle = '#d9cfb4'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) {
    const a = s() * 0.05;
    x.fillStyle = `rgba(${120 + s() * 60 | 0},${100 + s() * 50 | 0},${70 + s() * 40 | 0},${a})`;
    x.fillRect(s() * W, s() * H, 2 + s() * 26, 1 + s() * 3);
  }
  // 装裱边
  const m = Math.round(W * 0.07);
  x.fillStyle = '#6d6a55'; x.fillRect(0, 0, W, m); x.fillRect(0, H - m, W, m);
  x.fillStyle = '#8d876c'; x.fillRect(0, 0, m, H); x.fillRect(W - m, 0, m, H);
  x.strokeStyle = 'rgba(60,55,40,.5)'; x.lineWidth = 2;
  x.strokeRect(m, m, W - 2 * m, H - 2 * m);
  const x0 = m + 6, y0 = m + 6, w0 = W - 2 * m - 12, h0 = H - 2 * m - 12;
  x.save(); x.beginPath(); x.rect(x0, y0, w0, h0); x.clip();
  const ink = (a) => `rgba(38,42,46,${a})`;
  // 层叠远山
  for (let L = 0; L < 4; L++) {
    const baseY = h0 * (0.42 + L * 0.13);
    const amp = h0 * (0.30 - L * 0.055);
    const al = 0.13 + L * 0.13;
    x.beginPath(); x.moveTo(x0, y0 + h0);
    for (let px = 0; px <= w0; px += 2) {
      const t = px / w0;
      let nn = 0, a2 = 1, f2 = 1.6 + L * 2.2;
      for (let o = 0; o < 4; o++) { nn += a2 * n3(t * f2 + L * 7, seed * 0.07 + L, o * 0.3, 5); f2 *= 2.1; a2 *= 0.5; }
      const hgt = baseY - amp * (nn - 0.35) * 1.5;
      x.lineTo(x0 + px, y0 + hgt);
    }
    x.lineTo(x0 + w0, y0 + h0); x.closePath();
    x.fillStyle = ink(al); x.fill();
  }
  // 雾气横带
  for (let i = 0; i < 7; i++) {
    const yy = y0 + h0 * (0.35 + s() * 0.5);
    const g = x.createLinearGradient(0, yy - h0 * 0.05, 0, yy + h0 * 0.05);
    g.addColorStop(0, 'rgba(217,207,180,0)'); g.addColorStop(.5, `rgba(222,213,188,${0.55 + s() * 0.3})`); g.addColorStop(1, 'rgba(217,207,180,0)');
    x.fillStyle = g; x.fillRect(x0, yy - h0 * 0.05, w0, h0 * 0.1);
  }
  // 树丛点叶
  for (let i = 0; i < 90; i++) {
    const px = x0 + s() * w0, py = y0 + h0 * (0.55 + s() * 0.4);
    x.fillStyle = ink(0.25 + s() * 0.4);
    for (let k = 0; k < 6; k++) x.fillRect(px + (s() - .5) * 9, py + (s() - .5) * 9, 1.6, 1.6);
  }
  // 屋舍
  if (s() > 0.4) {
    const px = x0 + w0 * (0.2 + s() * 0.6), py = y0 + h0 * 0.72;
    x.strokeStyle = ink(0.75); x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(px - 12, py); x.lineTo(px - 9, py - 7); x.lineTo(px + 9, py - 7); x.lineTo(px + 12, py); x.stroke();
    x.beginPath(); x.moveTo(px - 10, py - 7); x.lineTo(px, py - 12); x.lineTo(px + 10, py - 7); x.stroke();
  }
  x.restore();
  // 题款
  x.fillStyle = 'rgba(40,38,34,.85)';
  x.font = `${Math.round(W * 0.035)}px ${CJK}`;
  const ins = '空山新雨後';
  for (let i = 0; i < ins.length; i++) x.fillText(ins[i], x0 + w0 - W * 0.055, y0 + h0 * 0.10 + i * W * 0.042);
  // 印章
  const sw = Math.round(W * 0.062);
  x.fillStyle = 'rgba(150,42,32,.85)'; x.fillRect(x0 + w0 - sw * 1.25, y0 + h0 * 0.10 + ins.length * W * 0.042, sw, sw);
  x.fillStyle = 'rgba(232,222,200,.9)'; x.font = `${Math.round(sw * 0.44)}px ${CJK}`;
  x.fillText('聽', x0 + w0 - sw * 1.18, y0 + h0 * 0.10 + ins.length * W * 0.042 + sw * 0.46);
  x.fillText('雨', x0 + w0 - sw * 1.18, y0 + h0 * 0.10 + ins.length * W * 0.042 + sw * 0.92);
  return c;
}

function paintBoard(W, H, text, opt = {}) {
  const { vertical = false, bg = '#1d1611', fg = '#c8a25a', border = true, fontScale = 0.62 } = opt;
  const c = mkCanvas(W), x = c.getContext('2d');
  // 木底
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const g = document.createElement('canvas'); g.width = W; g.height = H;
  const gx = g.getContext('2d');
  const img = gx.createImageData(W, H);
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const i = (yy * W + xx) * 4;
    const v = tfbm(xx / W, yy / H, 3, 4, 3) * 0.5 + tfbm(xx / W * 2, yy / H * 0.15, 12, 3, 7) * 0.5;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = 120 + v * 90; img.data[i + 3] = 60;
  }
  gx.putImageData(img, 0, 0);
  x.globalAlpha = 0.5; x.drawImage(g, 0, 0); x.globalAlpha = 1;
  if (border) {
    x.strokeStyle = fg; x.lineWidth = Math.max(2, W * 0.012);
    x.strokeRect(W * 0.045, H * 0.10, W * 0.91, H * 0.80);
  }
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  const chars = [...text];
  if (vertical) {
    const fs = Math.min(W * 0.7, (H * 0.80) / chars.length) * 1.0;
    x.font = `${fs}px ${CJK}`;
    chars.forEach((ch, i) => x.fillText(ch, W * 0.5, H * 0.10 + (i + 0.5) * (H * 0.80 / chars.length)));
  } else {
    const n = chars.length;
    const fs = Math.min(H * fontScale, (W * 0.86) / n);
    const step = fs * 1.08;
    x.font = `${fs}px ${CJK}`;
    chars.forEach((ch, i) => x.fillText(ch, W * 0.5 + (i - (n - 1) / 2) * step, H * 0.52));
  }
  return c;
}

function paintStoneBoard(W, H, text) {
  const c = mkCanvas(W), x = c.getContext('2d');
  x.fillStyle = '#8b8a82'; x.fillRect(0, 0, W, H);
  const img = x.createImageData(W, H);
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const i = (yy * W + xx) * 4;
    const v = tfbm(xx / W, yy / H, 4, 4, 9) * 0.6 + tfbm(xx / W, yy / H, 22, 3, 13) * 0.4;
    img.data[i] = (110 + v * 90); img.data[i + 1] = (108 + v * 88); img.data[i + 2] = (100 + v * 80); img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  x.strokeStyle = 'rgba(60,58,52,.7)'; x.lineWidth = Math.max(2, H * 0.05);
  x.strokeRect(H * 0.14, H * 0.14, W - H * 0.28, H * 0.72);
  x.fillStyle = 'rgba(46,44,40,.86)'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const chars = [...text];
  const fs = H * 0.44;
  x.font = `${fs}px ${CJK}`;
  const step = (W - H * 0.5) / chars.length;
  chars.forEach((ch, i) => x.fillText(ch, H * 0.25 + step * (i + 0.5), H * 0.52));
  return c;
}

function paintLantern(W, H, ch) {
  const c = mkCanvas(W), x = c.getContext('2d');

/* ── 6. 植被贴图（带 alpha） ─────────────────────────────────────── */
function leafCanvas(w, h, drawFn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.clearRect(0, 0, w, h); drawFn(x, w, h);
  return mkTex(c, { srgb: true });
}
function drawLeaf(x, cx, cy, len, wid, ang, curv, c1, c2, mid) {
  x.save(); x.translate(cx, cy); x.rotate(ang);
  const g = x.createLinearGradient(0, 0, 0, -len);
  g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, c1);
  x.fillStyle = g;
  x.beginPath(); x.moveTo(0, 0);
  x.quadraticCurveTo(wid, -len * 0.5, curv * len, -len);
  x.quadraticCurveTo(-wid, -len * 0.5, 0, 0);
  x.fill();
  if (mid !== false) {
    x.strokeStyle = 'rgba(215,228,170,.30)'; x.lineWidth = Math.max(1, len * 0.014);
    x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(curv * len * 0.5, -len * 0.55, curv * len, -len * 0.97); x.stroke();
    for (let k = 1; k < 6; k++) {
      const t = k / 6;
      x.strokeStyle = 'rgba(215,228,170,.13)'; x.lineWidth = Math.max(0.7, len * 0.007);
      x.beginPath(); x.moveTo(0, -len * t);
      x.lineTo(wid * (1 - t) * 0.7, -len * (t + 0.11)); x.stroke();
      x.beginPath(); x.moveTo(0, -len * t);
      x.lineTo(-wid * (1 - t) * 0.7, -len * (t + 0.11)); x.stroke();
    }
  }
  x.restore();
}

/* ── 7. 几何工具 ─────────────────────────────────────────────────── */
function ensureAttrs(g) {
  if (!g.attributes.uv) {
    const n = g.attributes.position.count;
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  }
  if (!g.attributes.color) {
    const n = g.attributes.position.count;
    const a = new Float32Array(n * 3); a.fill(1);
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  }
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function tintG(g, col, vary = 0) {
  ensureAttrs(g);
  const n = g.attributes.position.count, a = g.attributes.color;
  for (let i = 0; i < n; i++) {
    const f = vary ? 1 + (Math.random() - 0.5) * vary : 1;
    a.setXYZ(i, col[0] * f, col[1] * f, col[2] * f);
  }
  a.needsUpdate = true; return g;
}
function mergeG(list) {
  const gs = list.filter(Boolean).map(g => ensureAttrs(g.index ? g.toNonIndexed() : g));
  let total = 0; for (const g of gs) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3),
    uv = new Float32Array(total * 2), col = new Float32Array(total * 3);
  let o = 0;
  for (const g of gs) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    uv.set(g.attributes.uv.array, o * 2);
    col.set(g.attributes.color.array, o * 3);
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}
/** 带正确 UV 密度的长方体 */
function boxG(w, h, d, uvS = 1) {
  const g = new THREE.BoxGeometry(w, h, d);
  const a = g.attributes.uv;
  const m = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    a.setXY(k, a.getX(k) * m[f][0] / uvS, a.getY(k) * m[f][1] / uvS);
  }
  return g;
}
/** 圆柱（可锥形），UV 按周长/高度 */
function cylG(rt, rb, h, seg = 12, uvS = 1, open = false) {
  const g = new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
  const a = g.attributes.uv;
  const circ = Math.PI * (rt + rb);
  for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * circ / uvS, a.getY(i) * h / uvS);
  return g;
}
/** 沿路径扫掠闭合剖面 → 管状/梁状 */
function sweepG(path, prof, uvS = 1) {
  const N = path.length, P = prof.length;
  const pos = [], nor = [], uv = [], idx = [];
  const F = [], Rt = [], Up = [];
  for (let i = 0; i < N; i++) {
    const p = path[i], a = path[Math.max(0, i - 1)], b = path[Math.min(N - 1, i + 1)];
    const f = new THREE.Vector3().subVectors(b, a).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const r = new THREE.Vector3().crossVectors(up, f).normalize();
    if (r.lengthSq() < 0.001) r.set(1, 0, 0);
    const u = new THREE.Vector3().crossVectors(f, r).normalize();
    F.push(f); Rt.push(r); Up.push(u);
  }
  let run = 0;
  for (let i = 0; i < N; i++) {
    const p = path[i];
    if (i > 0) run += p.distanceTo(path[i - 1]);
    for (let j = 0; j < P; j++) {
      const v = new THREE.Vector3().copy(p)
        .addScaledVector(Rt[i], prof[j][0])
        .addScaledVector(Up[i], prof[j][1]);
      pos.push(v.x, v.y, v.z);
      nor.push(0, 0, 0);
      uv.push(j / (P - 1) * 1.0, run / uvS);
    }
  }
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < P - 1; j++) {
    const a = i * P + j, b = a + 1, c = a + P, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
/** 旋转体（柱础、香炉、瓶、灯笼） */
function latheG(pts, seg = 16) {
  const v = pts.map(p => new THREE.Vector2(Math.max(0.0001, p[0]), p[1]));
  const g = new THREE.LatheGeometry(v, seg);
  const a = g.attributes.uv;
  for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i), a.getY(i));
  return g;
}
/** 简易网格创建 */
const OBJ = [];
function mk(g, mat, opt = {}) {
  const m = new THREE.Mesh(g, mat);
  if (opt.x !== undefined || opt.y !== undefined || opt.z !== undefined) m.position.set(opt.x || 0, opt.y || 0, opt.z || 0);
  if (opt.rx) m.rotation.x = opt.rx; if (opt.ry) m.rotation.y = opt.ry; if (opt.rz) m.rotation.z = opt.rz;
  if (opt.sx || opt.sy || opt.sz) m.scale.set(opt.sx || 1, opt.sy || 1, opt.sz || 1);
  m.castShadow = opt.cast !== false; m.receiveShadow = opt.recv !== false;
  if (opt.parent) opt.parent.add(m);
  if (opt.collide) m.userData.collide = true;
  OBJ.push(m);
  return m;
}
function boxMesh(mat, w, h, d, x, y, z, opt = {}) {

const MAT = {};

const RIPPLE_GLSL = `
float rr_h(vec2 p, float t){
  vec2 q = p*1.55; vec2 c = floor(q); float h=0.0;
  for(int i=0;i<2;i++){ for(int j=0;j<2;j++){
    vec2 cc = c + vec2(float(i),float(j));
    vec2 rd = fract(sin(vec2(dot(cc,vec2(127.1,311.7)),dot(cc,vec2(269.5,183.3))))*43758.5453);
    vec2 d = q - (cc + rd); float dd = length(d);
    h += sin(dd*13.0 - t*4.6 + rd.x*6.283) * exp(-dd*3.0) * exp(-dd*dd*0.5);
  }}
  return h;
}
vec3 rainRippleGrad(vec2 p, float t){
  float e=0.09, h=rr_h(p,t);
  float hx=rr_h(p+vec2(e,0.0),t), hz=rr_h(p+vec2(0.0,e),t);
  return vec3(-(hx-h)/e, 0.0, -(hz-h)/e);
}`;

/** 湿润化：雨水打湿的材质 —— 加深漫反射、降低粗糙度、地面雨滴涟漪 */
function wetify(mat, opt = {}) {
  const dark = opt.dark === undefined ? 0.76 : opt.dark;
  const gloss = opt.gloss === undefined ? 0.44 : opt.gloss;
  const ripple = opt.ripple || 0;
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh) => {
    if (prev) prev(sh);
    sh.uniforms.uWet = U.uWet; sh.uniforms.uTime = U.uTime; sh.uniforms.uRain = U.uRain;
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader
      .replace('#include <project_vertex>', `#include <project_vertex>
        #ifdef USE_INSTANCING
          vWP = (modelMatrix * instanceMatrix * vec4(transformed,1.0)).xyz;
        #else
          vWP = (modelMatrix * vec4(transformed,1.0)).xyz;
        #endif`);
    let f = `uniform float uWet; uniform float uTime; uniform float uRain; varying vec3 vWP;
        ${ripple ? RIPPLE_GLSL : ''}
        ` + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= mix(1.0, ${dark.toFixed(3)}, uWet);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, clamp(roughnessFactor*${gloss.toFixed(3)},0.03,1.0), uWet);`);
    if (ripple) {
      f = f.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        { vec3 rg = rainRippleGrad(vWP.xz, uTime);
          normal = normalize(normal + (viewMatrix * vec4(rg,0.0)).xyz * ${ripple.toFixed(3)} * (0.35+0.65*uRain)); }`);
    }
    sh.fragmentShader = f;
  };
  mat.userData.ck = (mat.userData.ck || '') + '|w' + dark + '_' + gloss + '_' + ripple;
  mat.customProgramCacheKey = () => mat.userData.ck;
  return mat;
}
/** 风动：叶/草/藤的轻微摇曳 */
function windify(mat, amp = 0.05, freq = 1.1) {
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh) => {
    if (prev) prev(sh);
    sh.uniforms.uTime = U.uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          #ifdef USE_INSTANCING
            vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
          #else
            vec3 ip = vec3(0.0);
          #endif
          vec3 wp = (modelMatrix * vec4(ip,1.0)).xyz;
          float ph = wp.x*0.65 + wp.z*0.83;
          float sw = sin(uTime*${freq.toFixed(2)} + ph)*0.62 + sin(uTime*${(freq * 1.73).toFixed(2)} + ph*1.7)*0.38;
          float st = max(0.0, transformed.y);
          transformed.x += sw * ${amp.toFixed(4)} * st;
          transformed.z += cos(uTime*${(freq * 0.87).toFixed(2)} + ph*1.31) * ${(amp * 0.7).toFixed(4)} * st;
        }`);
  };
  mat.userData.ck = (mat.userData.ck || '') + '|wind' + amp + '_' + freq;
  mat.customProgramCacheKey = () => mat.userData.ck;
  return mat;
}
/** 登记夜间自发光 */

}
