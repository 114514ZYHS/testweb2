<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大语言模型底层架构原理 · 可视化画布</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070d;color:#e6edf7;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif}
.app{height:100vh;display:grid;grid-template-columns:238px 1fr 336px;grid-template-rows:58px 1fr 62px;gap:10px;padding:10px}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-radius:13px;
  background:linear-gradient(100deg,rgba(56,225,255,.13),rgba(167,139,250,.09) 45%,rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08)}
.hd h1{font-size:17px;margin:0;letter-spacing:.6px;white-space:nowrap}
.hd .dot{width:9px;height:9px;border-radius:50%;background:#38e1ff;box-shadow:0 0 12px #38e1ff}
.hd .sub{color:#8ba0bf;font-size:12px;flex:1}
.hd .kbd{font-size:11px;color:#7b8fae;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 7px}
.side,.info{background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.075);border-radius:13px;padding:10px;overflow-y:auto}
.side::-webkit-scrollbar,.info::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb,.info::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:9px}
.cap{font-size:10.5px;letter-spacing:2px;color:#61779a;margin:2px 0 8px 6px}
.step{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:12.5px;color:#9db1cd;transition:.18s;margin-bottom:2px}
.step:hover{background:rgba(255,255,255,.055);color:#dbe7f7}
.step.on{background:linear-gradient(90deg,rgba(56,225,255,.2),rgba(56,225,255,.02));color:#eaf6ff;box-shadow:inset 0 0 0 1px rgba(56,225,255,.34)}
.step .n{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.07);flex:none}
.step.on .n{background:#38e1ff;color:#04121a;font-weight:700}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.075);
  background:radial-gradient(1100px 560px at 50% -10%,rgba(56,225,255,.08),transparent 62%),#070b13}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.info h2{font-size:15.5px;margin:4px 0 6px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(167,139,250,.17);color:#c9b8fd;margin-bottom:6px}
.desc{font-size:12.5px;line-height:1.8;color:#a9bcd6;border-left:2px solid rgba(56,225,255,.5);padding-left:9px;margin:8px 0}
.info ul{margin:10px 0 4px;padding-left:17px}
.info li{font-size:12.5px;line-height:1.78;color:#b9c9e0;margin-bottom:6px}
.info li b{color:#7ee8ff;font-weight:600}
.formula{margin-top:10px;padding:10px 8px;border-radius:10px;background:rgba(56,225,255,.075);
  border:1px solid rgba(56,225,255,.22);font-size:13px;color:#9beaff;text-align:center;font-family:"Cambria Math",Georgia,serif}
.ft{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:0 14px;border-radius:13px;
  background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.075);overflow-x:auto}
button{background:rgba(255,255,255,.06);color:#dbe7f7;border:1px solid rgba(255,255,255,.13);border-radius:9px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
button:hover{background:rgba(56,225,255,.16);border-color:rgba(56,225,255,.42);color:#eafaff}
.sep{width:1px;height:26px;background:rgba(255,255,255,.1);flex:none}
label.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:#9db1cd;white-space:nowrap;cursor:pointer}
input[type=range]{accent-color:#38e1ff;width:96px}
select{background:#0d1524;color:#dbe7f7;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:5px 7px;font-size:12px;font-family:inherit}
.ctl{display:none;align-items:center;gap:8px;font-size:12px;color:#9db1cd;white-space:nowrap}
.ctl.on{display:flex}
.hint{margin-left:auto;font-size:11.5px;color:#6f86a8;white-space:nowrap}
b.v{color:#7ee8ff;font-variant-numeric:tabular-nums;display:inline-block;min-width:30px}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <span class="dot"></span>
    <h1>大语言模型 · 底层架构原理可视化</h1>
    <span class="sub">Tokenizer → Embedding → Multi-Head Attention → FFN → ×N Layers → Softmax → 自回归生成</span>
    <span class="kbd">← / → 切换</span><span class="kbd">空格 播放</span>
  </div>
  <div class="side"><div class="cap">流 程 步 骤</div><div id="steps"></div></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="info">
    <span class="tag" id="i-tag"></span>
    <h2 id="i-title"></h2>
    <div class="desc" id="i-desc"></div>
    <ul id="i-list"></ul>
    <div class="formula" id="i-formula"></div>
  </div>
  <div class="ft">
    <button id="prev">◀ 上一步</button>
    <button id="play">⏸ 暂停</button>
    <button id="next">下一步 ▶</button>
    <button id="replay">↻ 重播</button>
    <div class="sep"></div>
    <label class="sw"><input type="checkbox" id="auto" checked> 自动播放</label>
    <label class="sw">速度 <input type="range" id="speed" min="0.3" max="2.2" step="0.1" value="1"></label>
    <div class="sep"></div>
    <div class="ctl" data-for="4">查询词 <select id="qsel"></select></div>
    <div class="ctl" data-for="5">高亮头 <select id="hsel"></select></div>
    <div class="ctl" data-for="7">层数 N <select id="lsel"><option>12</option><option selected>32</option><option>80</option><option>120</option></select></div>
    <div class="ctl" data-for="8">温度 T <input type="range" id="temp" min="0.05" max="2" step="0.05" value="0.8"><b class="v" id="tempv">0.80</b>
      &nbsp;top-k <input type="range" id="topk" min="1" max="8" step="1" value="5" style="width:70px"><b class="v" id="topkv">5</b></div>
    <div class="hint" id="hint">画布可交互：把鼠标移到图形上试试</div>
  </div>
</div>
<script>
(function(){
'use strict';
var F='"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
var C={cy:'#38e1ff',vi:'#a78bfa',gr:'#4ade80',am:'#fbbf24',pk:'#f472b6',or:'#fb923c',
       tx:'#e6edf7',dim:'#8ba0bf',faint:'rgba(255,255,255,.25)',line:'rgba(255,255,255,.14)'};
var VW=1200,VH=700;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var view={s:1,ox:0,oy:0,cs:1,cox:0,coy:0};
var M={x:-9999,y:-9999},HITS=[];
var P={temp:0.8,topk:5,layers:32,query:-1,head:-1};

/* ---------- 基础工具 ---------- */
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function ease(t){t=clamp(t,0,1);return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function eout(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3)}
function seg(p,a,b){return clamp((p-a)/(b-a),0,1)}
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function rr(x,y,w,h,r){if(r===undefined)r=9;r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function txt(s,x,y,size,color,align,weight){ctx.save();ctx.fillStyle=color||C.tx;ctx.textAlign=align||'left';
  ctx.textBaseline='middle';ctx.font=(weight||'400')+' '+(size||13)+'px '+F;ctx.fillText(s,x,y);ctx.restore()}
function box(x,y,w,h,o){o=o||{};var c=o.color||C.cy;ctx.save();
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  if(o.glow){ctx.shadowColor=c;ctx.shadowBlur=o.glow}
  ctx.fillStyle=o.fill||'rgba(255,255,255,.045)';rr(x,y,w,h,o.r);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=c;ctx.lineWidth=o.lw||1.5;ctx.stroke();
  if(o.title)txt(o.title,x+w/2,y+h/2+(o.sub?-9:0),o.ts||15,o.tc||'#eaf3ff','center','600');
  if(o.sub)txt(o.sub,x+w/2,y+h/2+11,10.5,o.sc||C.dim,'center');
  ctx.restore()}
function arrow(x1,y1,x2,y2,o){o=o||{};var c=o.color||'rgba(255,255,255,.35)';ctx.save();
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;ctx.strokeStyle=c;ctx.lineWidth=o.lw||2;
  if(o.dash){ctx.setLineDash(o.dash===true?[7,6]:o.dash);ctx.lineDashOffset=-(o.flow||0)*24}
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  if(o.head!==false){var a=Math.atan2(y2-y1,x2-x1),h=o.head||9;ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-h*Math.cos(a-0.42),y2-h*Math.sin(a-0.42));ctx.lineTo(x2-h*Math.cos(a+0.42),y2-h*Math.sin(a+0.42));
    ctx.closePath();ctx.fillStyle=c;ctx.fill()}
  ctx.restore()}
function curve(x1,y1,cx,cy,x2,y2,o){o=o||{};ctx.save();ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  ctx.strokeStyle=o.color||'rgba(255,255,255,.3)';ctx.lineWidth=o.lw||2;
  if(o.dash){ctx.setLineDash([7,6]);ctx.lineDashOffset=-(o.flow||0)*24}
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
var HEAT=[[10,22,48],[26,72,142],[32,152,192],[92,222,178],[250,214,120],[255,118,88]];
function heat(v){v=clamp(v,0,1);var f=v*(HEAT.length-1),i=Math.floor(f),k=f-i;
  var a=HEAT[i],b=HEAT[Math.min(HEAT.length-1,i+1)];
  return 'rgb('+Math.round(lerp(a[0],b[0],k))+','+Math.round(lerp(a[1],b[1],k))+','+Math.round(lerp(a[2],b[2],k))+')'}
function strip(x,y,w,h,vals,o){o=o||{};var n=vals.length,cw=w/n;ctx.save();
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  for(var i=0;i<n;i++){ctx.fillStyle=heat(vals[i]);ctx.fillRect(x+i*cw,y,cw+0.6,h)}
  ctx.globalAlpha=1;if(o.border!==false){ctx.strokeStyle=o.border||'rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h)}
  ctx.restore()}
function vec(seed,n,mix){var a=[];for(var i=0;i<n;i++){var v=rnd(seed*97+i*3.3);
  if(mix!==undefined)v=lerp(v,0.5+0.5*Math.sin(i*0.35+seed),mix);a.push(v)}return a}
function chip(x,y,w,h,label,o){o=o||{};var c=o.color||C.cy;ctx.save();
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  if(o.glow){ctx.shadowColor=c;ctx.shadowBlur=o.glow}
  ctx.fillStyle=o.fill||('rgba('+(o.rgb||'56,225,255')+',.13)');rr(x,y,w,h,o.r||8);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle=c;ctx.lineWidth=o.lw||1.4;ctx.stroke();
  txt(label,x+w/2,y+h/2+(o.sub?-7:0),o.ts||15,o.tc||'#f0f7ff','center','600');
  if(o.sub)txt(o.sub,x+w/2,y+h/2+11,9.5,o.sc||'rgba(255,255,255,.5)','center');
  ctx.restore()}
function hit(x,y,w,h,fn){HITS.push({x:x,y:y,w:w,h:h,fn:fn})}
function inside(x,y,w,h){return M.x>=x&&M.x<=x+w&&M.y>=y&&M.y<=y+h}
function tip(x,y,lines){ctx.save();ctx.font='12px '+F;var w=0,i;
  for(i=0;i<lines.length;i++)w=Math.max(w,ctx.measureText(lines[i]).width);
  var pw=w+18,ph=lines.length*17+12;var px=clamp(x+14,4,VW-pw-4),py=clamp(y-ph-8,4,VH-ph-4);
  ctx.fillStyle='rgba(6,12,22,.95)';ctx.strokeStyle='rgba(56,225,255,.5)';ctx.lineWidth=1;
  rr(px,py,pw,ph,7);ctx.fill();ctx.stroke();
  for(i=0;i<lines.length;i++)txt(lines[i],px+9,py+16+i*17,12,i?C.dim:'#eaf6ff','left',i?'400':'600');
  ctx.restore()}
function softmax(a,T){T=T||1;var m=-1e9,i,s=0,o=[];
  for(i=0;i<a.length;i++)m=Math.max(m,a[i]/T);
  for(i=0;i<a.length;i++){o[i]=Math.exp(a[i]/T-m);s+=o[i]}
  for(i=0;i<a.length;i++)o[i]/=s;return o}

/* ---------- 共享数据 ---------- */
var TOK=['人工','智能','正在','深刻','改变','世界'];
var TID=[27686,34851,15400,68219,9902,41577];
var RAW=[[0.95,0,0,0,0,0],
         [0.90,0.45,0,0,0,0],
         [0.30,0.62,0.35,0,0,0],
         [0.22,0.30,0.72,0.30,0,0],
         [0.25,0.52,0.80,0.92,0.32,0],
         [0.42,0.60,0.20,0.28,0.95,0.30]];
function attnRow(i){var s=[],j;for(j=0;j<=i;j++)s.push(RAW[i][j]*4.2);
  var p=softmax(s,1),full=[];for(j=0;j<6;j++)full.push(j<=i?p[j]:0);return full}
var HEADS=[
 {n:'邻近词',f:function(i,j){return j===i-1?3.2:(j===i?0.6:0.1)}},
 {n:'首词汇聚',f:function(i,j){return j===0?3.4:0.3}},
 {n:'语义关联',f:function(i,j){return RAW[i][j]*4}},
 {n:'自身特征',f:function(i,j){return j===i?3.5:0.2}},
 {n:'长距依赖',f:function(i,j){return (i>2&&j<2)?2.8:0.4}},
 {n:'主谓搭配',f:function(i,j){return (i===4&&j===1)||(i===5&&j===4)?3.6:0.35}},
 {n:'均匀平摊',f:function(i,j){return 1.0}},
 {n:'跳跃两格',f:function(i,j){return j===i-2?3.0:0.25}}];
function headMat(h){var m=[],i,j;for(i=0;i<6;i++){var s=[];for(j=0;j<=i;j++)s.push(HEADS[h].f(i,j));
  var p=softmax(s,1),row=[];for(j=0;j<6;j++)row.push(j<=i?p[j]:-1);m.push(row)}return m}
var CAND=[['世界',8.4],['生活',7.5],['一切',7.0],['未来',6.2],['社会',5.5],['格局',4.6],['历史',3.9],['香蕉',-1.8]];

/* ---------- 场景元数据 ---------- */
var SCENES=[
{t:'全景总览',tag:'一句话看懂',dur:7,hold:8,
 d:'大模型本质是一个巨大的函数：读入前面所有的词，输出「下一个词」的概率分布。',
 b:['输入文本先被切成 <b>token</b>，再查表变成<b>向量</b>','向量在 <b>N 层 Transformer</b> 中反复「互相观察 + 各自加工」',
    '最后一层输出经词表投影，得到下一个词的<b>概率</b>','采样出的新词接回输入，循环往复 —— <b>自回归生成</b>'],
 f:'P(w<sub>t</sub> | w<sub>1</sub>, w<sub>2</sub>, …, w<sub>t-1</sub>)'},
{t:'① 分词 Tokenization',tag:'文字 → 整数',dur:7,hold:7,
 d:'模型不认识汉字和字母，只认识整数 ID。分词器把文本切成词表里的最小片段。',
 b:['<b>BPE/BBPE</b>：把语料里高频相邻片段反复合并成一个 token','英文 1 token ≈ 0.75 个单词；中文 1 token ≈ 1~2 个汉字',
    '词表规模 <b>V</b> 通常 3 万 ~ 20 万','结果：一串整数 ID，这才是模型真正的输入'],
 f:'"人工智能" → [27686, 34851]'},
{t:'② 词嵌入 + 位置编码',tag:'整数 → 向量',dur:8,hold:7,
 d:'每个 token ID 去 Embedding 大表里取出一行 d 维向量；再叠加位置信息。',
 b:['Embedding 是 <b>V × d</b> 的查找表，一个 ID 对应一行','向量<b>方向即语义</b>：国王-男人+女人 ≈ 女王',
    'Attention 天然对顺序无感，必须注入<b>位置编码</b>（正弦 / RoPE）','于是每个词变成 d 个浮点数（d = 4096 很常见）'],
 f:'h<sup>(0)</sup> = Embedding[id] + PosEnc(pos)'},
{t:'③ 注意力三件套 Q/K/V',tag:'核心直觉',dur:8,hold:8,
 d:'每个词向量乘三个权重矩阵，得到 Query、Key、Value —— 一次「图书馆检索」。',
 b:['<b>Query</b>：我在找什么？　<b>Key</b>：我是什么？　<b>Value</b>：我能提供什么内容',
    'q 与 k 的<b>点积</b>越大，说明两个词越相关，分数越高','分数决定从哪些词的 Value 里搬运多少信息',
    '这就是「上下文理解」的物理实现'],
 f:'q = xW<sub>Q</sub>,　k = xW<sub>K</sub>,　v = xW<sub>V</sub>'},
{t:'④ 注意力矩阵 + 因果掩码',tag:'词与词的通信',dur:9,hold:9,
 d:'所有 q 与所有 k 两两点积，得到 n×n 分数矩阵；再按行 softmax，对 V 加权求和。',
 b:['除以 <b>√d<sub>k</sub></b>：防止点积过大导致 softmax 饱和','<b>因果掩码</b>：不许看未来，右上三角置为 -∞',
    '每行归一化后是一组和为 1 的<b>注意力权重</b>','输出 = 权重 × Value 的加权平均 → 融合了上下文'],
 f:'Attention(Q,K,V) = softmax( QK<sup>T</sup>/√d<sub>k</sub> + M ) V'},
{t:'⑤ 多头注意力',tag:'多角度并行',dur:8,hold:8,
 d:'把 d 维拆成 h 份，各自独立做一次注意力，再拼接融合。',
 b:['不同的头学会不同关系：邻近词、指代、主谓、句法、全局汇聚…','相当于<b>多位专家</b>从不同角度同时读一句话',
    '各头输出拼接后乘 <b>W<sub>O</sub></b> 融合成一个向量','头之间完全并行 —— GPU 最喜欢的计算形态'],
 f:'MultiHead = Concat(head<sub>1</sub>…head<sub>h</sub>) W<sub>O</sub>'},
{t:'⑥ FFN + 残差 + 归一化',tag:'一个完整的层',dur:8,hold:8,
 d:'注意力负责「词与词交流」，前馈网络负责「每个词自己思考」。',
 b:['<b>FFN</b>：d → 4d → d 两层 MLP，逐位置独立计算','大量<b>事实知识</b>以「键-值记忆」形式存在 FFN 权重里',
    '<b>残差连接</b>让梯度直通，几十上百层也能训练','<b>LayerNorm / RMSNorm</b> 稳住数值尺度，训练不炸'],
 f:'x ← x + Attn(Norm(x))　;　x ← x + FFN(Norm(x))'},
{t:'⑦ 堆叠 N 层',tag:'深度带来抽象',dur:8,hold:8,

var cur=0,sceneT=0,playing=true,speed=1,auto=true,clock=0,last=performance.now();
function resize(){var r=cv.parentNode.getBoundingClientRect();
