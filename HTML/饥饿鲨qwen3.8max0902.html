}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    if(p.k==='bub'){p.wob+=dt*4;p.x+=p.vx*dt+Math.sin(p.wob)*10*dt;p.y+=p.vy*dt;p.vy*=Math.pow(.985,dt*60);}
    else if(p.k==='drop'){p.vy+=1000*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.93,dt*60);p.vy*=Math.pow(.93,dt*60);}
  }
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t+=dt;t.y+=t.vy*dt;t.vy*=Math.pow(.94,dt*60);if(t.t>=t.life)texts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;if(r.t>=r.life)rings.splice(i,1);}
  if(G.shake>0){G.shake=Math.max(0,G.shake-dt*46);G.shx=rand(-G.shake,G.shake);G.shy=rand(-G.shake,G.shake);}
  else{G.shx=G.shy=0;}
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.1);
}

/* ============================== 生物生成 ============================== */
function makeCreature(type,x,y,opt){
  const sp=SP[type];
  const c={
    type,sp,x,y,vx:0,vy:0,ang:rand(0,TAU),t:rand(0,9),
    len:sp.len*rand(.9,1.12),hp:sp.hp,maxHp:sp.hp,tier:sp.tier,
    r:sp.len*sp.r,state:'idle',st:0,flash:0,biteT:0,inflate:0,dead:false,
    fx:x,fy:y,phase:rand(0,TAU),sc:rand(.92,1.1),extra:opt||null,
    col:sp.col,hunting:false,turnT:rand(0,2)
  };
  c.r=c.len*sp.r;
  return c;
}

let flockSeq=1;
function newFlock(x,y,n){
  const id='f'+(flockSeq++);
  const f={id,x,y,vx:rand(-60,60),vy:0,ang:rand(0,TAU),t:rand(0,9),n,upd:-1,
    band:[clamp(y-130,SURFACE_Y+30,FLOOR_Y-60),clamp(y+130,SURFACE_Y+30,FLOOR_Y-60)]};
  flocksById[id]=f;flocks.push(f);
  return f;
}

function spawnPos(zone,avoid){
  const zf=ZONES[zone]||ZONES.any;
  let x,y,tries=0;
  do{
    const side=randi(0,3);
    const pad=rand(180,520);
    if(side===0){x=G.camX-pad;y=G.camY+rand(-60,view.h+60);}
    else if(side===1){x=G.camX+view.w+pad;y=G.camY+rand(-60,view.h+60);}
    else if(side===2){x=G.camX+rand(0,view.w);y=G.camY-pad;}
    else{x=G.camX+rand(0,view.w);y=G.camY+view.h+pad;}
    y=zf();
    x=clamp(x,WORLD.left+120,WORLD.right-120);
    tries++;
  }while(avoid&&dist2(x,y,P.x,P.y)<420*420&&tries<8);
  return{x,y:clamp(y,WORLD.top+70,FLOOR_Y-30)};
}

function weightedPick(){
  let pool=[],total=0;
  for(const k of SP_KEYS){
    const sp=SP[k];
    if(P.tier<sp.from||P.tier>sp.to)continue;
    let w=sp.w;
    if(sp.tier<P.tier-1)w*=.42;
    if(sp.tier>P.tier)w*=1.35;              /* 威胁略多，制造张力 */
    if(sp.zone==='abyss'||sp.zone==='floor')w*=1;
    pool.push([k,w]);total+=w;
  }
  if(!pool.length)pool=[['sardine',1]],total=1;
  let r=Math.random()*total;
  for(const p of pool){r-=p[1];if(r<=0)return p[0];}
  return pool[pool.length-1][0];
}

function spawnOne(forceType,px,py){
  const type=forceType||weightedPick();
  const sp=SP[type];
  let x,y;
  if(px!==undefined){x=px;y=py;}
  else{const p=spawnPos(sp.zone,!sp.hazard);x=p.x;y=p.y;}

  if(sp.ai==='school'){
    const f=newFlock(x,y,sp.count);
    for(let i=0;i<sp.count;i++){
      const c=makeCreature(type,x+rand(-70,70),y+rand(-46,46));
      c.flock=f;c.ox=rand(-84,84);c.oy=rand(-52,52);
      creatures.push(c);
    }
    return;
  }
  const c=makeCreature(type,x,y);
  if(type==='boat'){c.y=SURFACE_Y-6;c.vx=(chance(.5)?1:-1)*rand(34,58);c.ang=c.vx>0?0:Math.PI;c.bombT=rand(1,2.4);}
  if(type==='chest'){c.y=FLOOR_Y-c.len*.34;c.vx=0;c.vy=0;c.ang=0;c.opened=false;c.glow=rand(0,TAU);}
  if(type==='mine'){c.homeY=y;c.drift=rand(0,TAU);}
  if(type==='gull'){c.ang=chance(.5)?0:Math.PI;c.vx=Math.cos(c.ang)*rand(70,120);c.flap=rand(0,TAU);}
  if(type==='ray'){c.y=FLOOR_Y-rand(16,60);c.ang=chance(.5)?0:Math.PI;c.vx=Math.cos(c.ang)*rand(28,52);}
  if(type==='whale'){c.ang=chance(.5)?0:Math.PI;c.vx=Math.cos(c.ang)*rand(24,40);}
  creatures.push(c);
}

function spawnInitial(){
  const list=['sardine','sardine','coral','coral','jelly','jelly','turtle','puffer','gull','ray','squid','chest','diver'];
  for(const t of list){
    const sp=SP[t];
    if(P.tier<sp.from||P.tier>sp.to)continue;
    const x=rand(WORLD.left+400,WORLD.right-400);
    const y=(ZONES[sp.zone]||ZONES.any)();
    spawnOne(t,x,y);
  }
  for(let i=0;i<5;i++)spawnOne('sardine',rand(300,2200),rand(SURFACE_Y+120,1000));
}

function director(dt){
  G.spawnT-=dt;
  const cap=Math.min(160,70+P.tier*10+Math.floor(G.time/30)*3);
  if(G.spawnT<=0&&creatures.length<cap){
    G.spawnT=Math.max(.16,.5-G.time*.0014);
    spawnOne();
  }
  /* 低血量怜悯投放 */
  G.meatT-=dt;
  if(G.meatT<=0){
    G.meatT=rand(7,13);
    const ratio=P.hunger/P.maxHunger;
    if(ratio<.34&&chance(ratio<.16?.9:.55)){
      const a=rand(0,TAU),d=rand(300,520);
      addPickup('meat',clamp(P.x+Math.cos(a)*d,WORLD.left+80,WORLD.right-80),
                      clamp(P.y+Math.sin(a)*d,SURFACE_Y+50,FLOOR_Y-60));
    }
    if(chance(.16))addPickup(chance(.5)?'coin':'meat',
      clamp(P.x+rand(-900,900),WORLD.left+80,WORLD.right-80),
      clamp(P.y+rand(-500,500),SURFACE_Y+50,FLOOR_Y-60));
  }
  /* 远处清理 */
  const lim=(Math.max(view.w,view.h)*1.35+900);
  const lim2=lim*lim;
  for(let i=creatures.length-1;i>=0;i--){
    const c=creatures[i];
    if(dist2(c.x,c.y,G.camX+view.w/2,G.camY+view.h/2)>lim2){
      if(c.flock)removeFlockMember(c);
      creatures.splice(i,1);
    }
  }
  /* 猎杀小队（Boss 之后的无尽压力） */
  if(G.bossKills>0&&P.tier>=4){
    G.huntT-=dt;
    if(G.huntT<=0){
      G.huntT=88;
      showBanner('猎杀小队','HUNTER SQUAD','#ff9b9b');
      for(let i=0;i<3;i++){
        const p=spawnPos('any',true);
        spawnOne(P.tier>=5?'orca':'bull',p.x+i*90,p.y+i*40);
      }
      for(let i=0;i<3;i++){const p=spawnPos('any',true);spawnOne('mine',p.x,p.y);}
    }
  }
}
function removeFlockMember(c){
  const f=c.flock;if(!f)return;
  f.n--;
  if(f.n<=0){const i=flocks.indexOf(f);if(i>=0)flocks.splice(i,1);delete flocksById[f.id];}
}

/* ============================== 生物 AI ============================== */
function inView(c,pad){
  pad=pad||260;
  return c.x>G.camX-pad&&c.x<G.camX+view.w+pad&&c.y>G.camY-pad&&c.y<G.camY+view.h+pad;
}

function fleeFrom(c,dt,speed){
  const a=Math.atan2(c.y-P.y,c.x-P.x);
  c.vx=lerp(c.vx,Math.cos(a)*speed,smooth(3,dt));
  c.vy=lerp(c.vy,Math.sin(a)*speed*.7,smooth(3,dt));
}

function updateCreature(c,dt){
  const sp=c.sp;
  c.t+=dt;
  if(c.flash>0)c.flash-=dt*4;
  if(c.biteT>0)c.biteT-=dt;

  const d=dist(c.x,c.y,P.x,P.y);
  const canEatMe=(sp.tier>P.tier||sp.hazard)&&P.frenzy<=0;
  const fearMe=(sp.tier<=P.tier)&&sp.ai!=='giant';
  const near=inView(c,520);
  c.hunting=false;

  switch(sp.ai){
    case 'school':{
      const f=c.flock;
      if(f&&f.upd!==G.frame){
        f.upd=G.frame;f.t+=dt;
        f.turnT=(f.turnT||0)-dt;
        let ta=f.ang;
        if(fearMe&&d<330+P.len){
          ta=Math.atan2(f.y-P.y,f.x-P.x);
          f.spd=lerp(f.spd||0,Math.min(196,sp.len*4.6+142),smooth(3.2,dt));
        }else{
          if(f.turnT<=0){f.turnT=rand(.8,2.4);f.wander=rand(-1.3,1.3);}
          ta=f.ang+(f.wander||0)*.7;
          f.spd=lerp(f.spd||0,sp.len*4.6,smooth(2,dt));
        }
        f.ang=angTo(f.ang,ta,smooth(3.4,dt));
        const s=(f.spd||70);
        f.vx=Math.cos(f.ang)*s;f.vy=Math.sin(f.ang)*s;
        f.x+=f.vx*dt;f.y+=f.vy*dt;
        if(f.y<f.band[0])f.vy+=90*dt,f.y=Math.max(f.y,f.band[0]-70);
        if(f.y>f.band[1])f.vy-=90*dt,f.y=Math.min(f.y,f.band[1]+70);
        if(f.y<SURFACE_Y+24){f.y=SURFACE_Y+24;f.ang=angTo(f.ang,.4,smooth(6,dt));}
        if(f.y>FLOOR_Y-40){f.y=FLOOR_Y-40;f.ang=angTo(f.ang,-.4,smooth(6,dt));}
        if(f.x<WORLD.left+90){f.x=WORLD.left+90;f.ang=angTo(f.ang,0,smooth(6,dt));}
        if(f.x>WORLD.right-90){f.x=WORLD.right-90;f.ang=angTo(f.ang,Math.PI,smooth(6,dt));}
      }
      if(f){
        const tx=f.x+Math.cos(f.ang)*0+c.ox, ty=f.y+c.oy+Math.sin(c.t*2.6+c.phase)*5;
        c.x=lerp(c.x,tx,smooth(6.5,dt));
        c.y=lerp(c.y,ty,smooth(6.5,dt));
        c.ang=lerp(c.ang,f.ang,smooth(6,dt));
      }
      c.vx=Math.cos(c.ang)*70;c.vy=0;
      break;
    }
    case 'drift':{ /* 水母 */
      c.phase+=dt*1.5;
      const pulse=Math.sin(c.phase);
      c.vy=lerp(c.vy,-26+pulse*24,smooth(2,dt));
      c.vx=lerp(c.vx,Math.sin(c.t*.35+c.phase)*16,smooth(1,dt));
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=Math.sin(c.t*.6)*.16;
      if(c.y<SURFACE_Y+50){c.y=SURFACE_Y+50;c.vy=8;}
      if(c.y>FLOOR_Y-40){c.y=FLOOR_Y-40;c.vy=-14;}
      break;
    }
    case 'fly':{ /* 海鸥 */
      c.flap+=dt*7.4;
      c.x+=c.vx*dt;
      c.y+=Math.sin(c.t*1.7)*22*dt;
      c.y=clamp(c.y,WORLD.top+80,SURFACE_Y-26);
      if(fearMe&&d<260&&P.y<SURFACE_Y+40){c.vx+=(c.vx>0?1:-1)*220*dt;c.vx=clamp(c.vx,-186,186);}
      if(c.x<WORLD.left+80){c.x=WORLD.left+80;c.vx=Math.abs(c.vx);}
      if(c.x>WORLD.right-80){c.x=WORLD.right-80;c.vx=-Math.abs(c.vx);}
      c.ang=c.vx>0?0:Math.PI;
      break;
    }
    case 'graze':{ /* 海龟 */
      c.turnT-=dt;
      if(c.turnT<=0){c.turnT=rand(1.8,4.4);c.want=rand(0,TAU);}
      if(fearMe&&d<250)c.want=Math.atan2(c.y-P.y,c.x-P.x);
      c.ang=angTo(c.ang,c.want===undefined?c.ang:c.want,smooth(1.3,dt));
      const s=(fearMe&&d<250)?64:27;
      c.vx=lerp(c.vx,Math.cos(c.ang)*s,smooth(2,dt));
      c.vy=lerp(c.vy,Math.sin(c.ang)*s*.55+Math.sin(c.t*1.1)*7,smooth(2,dt));
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      keepInWater(c);
      break;
    }
    case 'puff':{ /* 河豚 */
      const target=(d<190&&fearMe)?1:((d<190&&P.tier<1)?1:0);
      c.inflate=lerp(c.inflate,d<190?1:0,smooth(target?5:2.4,dt));
      if(c.inflate>.35&&fearMe){
        const a=Math.atan2(c.y-P.y,c.x-P.x);
        c.vx=lerp(c.vx,Math.cos(a)*46,smooth(2,dt));
        c.vy=lerp(c.vy,Math.sin(a)*46,smooth(2,dt));
      }else{
        c.vx=lerp(c.vx,Math.sin(c.t*.6+c.phase)*24,smooth(1,dt));
        c.vy=lerp(c.vy,Math.cos(c.t*.45+c.phase)*17,smooth(1,dt));
      }
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=Math.atan2(c.vy,c.vx)*.35;
      keepInWater(c);
      break;
    }
    case 'jet':{ /* 鱿鱼 */
      c.st-=dt;
      if(fearMe&&d<300){
        if(c.st<=0){
          c.st=rand(.9,1.7);
          const a=Math.atan2(c.y-P.y,c.x-P.x)+rand(-.4,.4);
          c.vx=Math.cos(a)*rand(230,320);c.vy=Math.sin(a)*rand(200,280);
          inkFx(c.x-Math.cos(a)*20,c.y-Math.sin(a)*20,3);
          if(P.tier>=sp.tier&&d<340&&chance(.45))fireShot('ink',c.x,c.y,a,190,7);
        }
      }else{
        c.vx=lerp(c.vx,Math.sin(c.t*.8+c.phase)*30,smooth(1.4,dt));
        c.vy=lerp(c.vy,-16+Math.cos(c.t*.6)*14,smooth(1.4,dt));
      }
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.vx*=Math.pow(.965,dt*60);c.vy*=Math.pow(.965,dt*60);
      c.ang=Math.atan2(c.vy,c.vx);
      keepInWater(c);
      break;
    }
    case 'floor':{ /* 魟鱼 */
      c.vx=lerp(c.vx,(c.ang===0||Math.abs(c.ang)<1?1:-1)*44,smooth(1.2,dt));
      if(fearMe&&d<230){c.vx*=1.9;c.vy=lerp(c.vy,-58,smooth(2,dt));}
      else c.vy=lerp(c.vy,Math.sin(c.t*1.5)*16,smooth(2,dt));
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=c.vx>0?0:Math.PI;
      if(c.y>FLOOR_Y-16){c.y=FLOOR_Y-16;if(chance(dt*3))sandFx(c.x,FLOOR_Y-6,2);}
      if(c.y<FLOOR_Y-420)c.y=FLOOR_Y-420;
      if(c.x<WORLD.left+120){c.x=WORLD.left+120;c.vx=Math.abs(c.vx);}
      if(c.x>WORLD.right-120){c.x=WORLD.right-120;c.vx=-Math.abs(c.vx);}
      break;
    }
    case 'charge':{ /* 剑鱼 */
      c.st-=dt;
      if(c.state==='idle'){
        c.vx=lerp(c.vx,Math.cos(c.ang)*58,smooth(1.6,dt));
        c.vy=lerp(c.vy,Math.sin(c.ang)*44+Math.sin(c.t*1.2)*14,smooth(1.6,dt));
        c.turnT-=dt;
        if(c.turnT<=0){c.turnT=rand(1.2,3);c.ang=rand(0,TAU);}
        if(fearMe&&d<430&&P.tier>=sp.tier){c.state='flee';c.st=rand(1.4,2.6);}
        else if(canEatMe&&d<470&&near){c.state='aim';c.st=.72;}
      }else if(c.state==='aim'){
        c.vx*=Math.pow(.9,dt*60);c.vy*=Math.pow(.9,dt*60);
        c.ang=angTo(c.ang,Math.atan2(P.y-c.y,P.x-c.x),smooth(7,dt));
        c.charging=1;
        if(c.st<=0){c.state='dash';c.st=.62;
          c.vx=Math.cos(c.ang)*620;c.vy=Math.sin(c.ang)*620;SFX.tone(700,1400,.2,'sawtooth',.1);}
      }else if(c.state==='dash'){
        c.charging=1;
        c.vx*=Math.pow(.995,dt*60);c.vy*=Math.pow(.995,dt*60);
        if(chance(dt*26))part({k:'bub',x:c.x,y:c.y,vx:rand(-20,20),vy:rand(-40,-10),r:rand(1.5,4),life:.6,t:0,col:'rgba(220,245,255,.6)'});
        if(c.st<=0){c.state='rest';c.st=rand(.9,1.6);c.charging=0;}
      }else{ /* rest */
        c.charging=0;
        c.vx*=Math.pow(.94,dt*60);c.vy*=Math.pow(.94,dt*60);
        if(c.st<=0){c.state='idle';c.turnT=rand(1,2.4);}
      }
      if(c.state==='flee'){
        fleeFrom(c,dt,190);
        if(c.st<=0)c.state='idle';
      }
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      keepInWater(c);
      break;
    }
    case 'diver':{ /* 潜水员 */
      c.st-=dt;
      const threat=(P.tier>=sp.tier||P.frenzy>0);
      if(threat&&d<430){
        c.vx=lerp(c.vx,(P.x>c.x?-1:1)*70,smooth(2,dt));
        c.vy=lerp(c.vy,-46,smooth(2,dt));
        if(c.st<=0){
          c.st=1.5;
          const a=Math.atan2(P.y-c.y,P.x-c.x);
          fireShot('harpoon',c.x+Math.cos(a)*26,c.y+Math.sin(a)*26,a,430,15);
          SFX.tone(1400,420,.13,'square',.11);
        }
      }else{
        c.vx=lerp(c.vx,Math.sin(c.t*.7)*16,smooth(1.4,dt));
        c.vy=lerp(c.vy,Math.cos(c.t*.5)*13-4,smooth(1.4,dt));
        if(c.st<=0){c.st=rand(1.6,3);if(threat&&d<760){
          const a=Math.atan2(P.y-c.y,P.x-c.x);
          fireShot('harpoon',c.x+Math.cos(a)*26,c.y+Math.sin(a)*26,a,400,13);
          SFX.tone(1300,400,.12,'square',.08);} }
      }
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=(P.x>c.x?0:Math.PI);
      if(chance(dt*3))bubbleFx(c.x+rand(-8,8),c.y-16,1);
      keepInWater(c,true);
      break;
    }
    case 'lurk':{ /* 鮟鱇 */
      c.vx=lerp(c.vx,Math.cos(c.ang)*22,smooth(1,dt));
      c.vy=lerp(c.vy,Math.sin(c.t*.8)*11,smooth(1,dt));
      c.turnT-=dt;
      if(c.turnT<=0){c.turnT=rand(2,4.5);c.ang=rand(0,TAU);}
      if(canEatMe&&d<380){c.ang=angTo(c.ang,Math.atan2(P.y-c.y,P.x-c.x),smooth(2.4,dt));
        c.vx=lerp(c.vx,Math.cos(c.ang)*96,smooth(2,dt));c.hunting=true;}
      else if(fearMe&&d<300){fleeFrom(c,dt,110);}
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      keepInWater(c);
      break;
    }
    case 'evade':{ /* 海豚 */
      c.turnT-=dt;
      if(c.turnT<=0){c.turnT=rand(1.1,2.6);c.want=rand(0,TAU);}
      if(fearMe&&d<430){
        c.want=Math.atan2(c.y-P.y,c.x-P.x)+Math.sin(c.t*3)*.7;
        c.vx=lerp(c.vx,Math.cos(c.want)*250,smooth(3,dt));
        c.vy=lerp(c.vy,Math.sin(c.want)*180,smooth(3,dt));
      }else{
        c.ang=angTo(c.ang,c.want,smooth(2.4,dt));
        c.vx=lerp(c.vx,Math.cos(c.ang)*110,smooth(2,dt));
        c.vy=lerp(c.vy,Math.sin(c.ang)*70+Math.sin(c.t*1.4)*24,smooth(2,dt));
      }
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=Math.atan2(c.vy,c.vx);
      keepInWater(c);
      if(c.y<SURFACE_Y+70&&chance(dt*2)){splashFx(c.x,SURFACE_Y,.5);}
      break;
    }
    case 'hunt':{ /* 公牛鲨 / 虎鲸 */
      if(canEatMe){
        c.hunting=true;
        c.ang=angTo(c.ang,Math.atan2(P.y-c.y,P.x-c.x),smooth(2.1,dt));
        const chase=d<900?200:110;
        c.vx=lerp(c.vx,Math.cos(c.ang)*chase,smooth(2.2,dt));
        c.vy=lerp(c.vy,Math.sin(c.ang)*chase*.85,smooth(2.2,dt));
        if(d<190&&c.st<=0){c.st=1.0;c.lunge=.45;
          c.vx+=Math.cos(c.ang)*260;c.vy+=Math.sin(c.ang)*260;
          SFX.tone(180,90,.2,'sawtooth',.13);}
      }else{
        c.hunting=false;
        c.turnT-=dt;
        if(c.turnT<=0){c.turnT=rand(1.6,3.6);c.want=rand(0,TAU);}
        if(fearMe&&d<460){
          c.want=Math.atan2(c.y-P.y,c.x-P.x);
          c.vx=lerp(c.vx,Math.cos(c.want)*230,smooth(2.6,dt));
          c.vy=lerp(c.vy,Math.sin(c.want)*170,smooth(2.6,dt));
        }else{
          c.ang=angTo(c.ang,c.want,smooth(1.7,dt));
          c.vx=lerp(c.vx,Math.cos(c.ang)*88,smooth(1.6,dt));
          c.vy=lerp(c.vy,Math.sin(c.ang)*62,smooth(1.6,dt));
        }
      }
      c.st-=dt;if(c.lunge>0)c.lunge-=dt;
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.ang=Math.atan2(c.vy,c.vx);
      keepInWater(c);
      break;
    }
    case 'giant':{ /* 蓝鲸 */
      c.vx=lerp(c.vx,Math.cos(c.ang)*38,smooth(.8,dt));
      c.vy=lerp(c.vy,Math.sin(c.t*.32)*22,smooth(.8,dt));
      if(c.x<WORLD.left+300&&Math.cos(c.ang)<0)c.ang=0;
      if(c.x>WORLD.right-300&&Math.cos(c.ang)>0)c.ang=Math.PI;
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      c.y=clamp(c.y,900,FLOOR_Y-260);
      if(chance(dt*1.1))bubbleFx(c.x+Math.cos(c.ang)*c.len*.3,c.y-c.len*.12,2);
      break;
    }
    case 'mine':{
      c.drift+=dt*.7;
      c.x+=Math.sin(c.drift)*7*dt;
      c.y=c.homeY+Math.sin(c.drift*.6)*16;
      if(d<c.r+P.len*.24+52){explode(c.x,c.y,150,34);killCreature(c,false);}
      break;
    }
    case 'boat':{
      c.x+=c.vx*dt;
      c.y=SURFACE_Y-6+Math.sin(c.t*1.1)*4;
      c.ang=c.vx>0?0:Math.PI;
      if(c.x<WORLD.left+200){c.x=WORLD.left+200;c.vx=Math.abs(c.vx);}
      if(c.x>WORLD.right-200){c.x=WORLD.right-200;c.vx=-Math.abs(c.vx);}
      const pd=dist(c.x,c.y,P.x,P.y);
      c.bombT-=dt;
      if(pd<900&&P.y>SURFACE_Y&&c.bombT<=0){
        c.bombT=rand(1.9,3.1);
        fireShot('bomb',c.x,c.y+18,Math.PI/2+rand(-.16,.16),60,30);
        SFX.tone(220,120,.16,'square',.1);
      }
      break;
    }
    case 'chest':{
      c.glow+=dt*2.4;
      if(!c.opened&&d<c.r+P.len*.3){
        c.opened=true;
        const n=randi(14,26);
        for(let i=0;i<n;i++){
          const a=rand(0,TAU),s=rand(70,260);
          addPickup('coin',c.x,c.y,Math.cos(a)*s,Math.sin(a)*s-60);
        }
        for(let i=0;i<10;i++)sparkFx(c.x,c.y,'#ffe08a');
        ringFx(c.x,c.y,150,'#ffd76a');
        floatText(c.x,c.y-40,'宝箱!','#ffd76a',22);
        SFX.coin();SFX.tone(660,1320,.3,'triangle',.18);
        killCreature(c,false);
      }
      break;
    }
  }
}

function keepInWater(c,allowShallow){
  const m=c.len*.5;
  if(c.y<SURFACE_Y+(allowShallow?40:70)){c.y=SURFACE_Y+(allowShallow?40:70);c.vy=Math.abs(c.vy)*.4;}
  if(c.y>FLOOR_Y-m*.5){c.y=FLOOR_Y-m*.5;c.vy=-Math.abs(c.vy)*.4;}
  if(c.x<WORLD.left+m){c.x=WORLD.left+m;c.vx=Math.abs(c.vx)*.5;c.ang=0;}
  if(c.x>WORLD.right-m){c.x=WORLD.right-m;c.vx=-Math.abs(c.vx)*.5;c.ang=Math.PI;}
}

/* ============================== 可食 / 危险判定 ============================== */
function isEdible(c){
  const sp=c.sp;
  if(sp.item)return false;
  if(P.frenzy>0)return true;
  if(sp.hazard)return false;
  if(sp.tier>P.tier)return false;
  if(c.charging)return false;
  if(c.type==='puffer'&&c.inflate>.55)return false;
  return true;
}
function isDangerous(c){
  if(P.frenzy>0)return false;
  const sp=c.sp;
  if(sp.hazard)return true;
  if(sp.tier>P.tier)return true;
  if(c.charging)return true;
  if(c.type==='puffer'&&c.inflate>.55)return true;
  return false;
}
function dmgOf(c){
  const sp=c.sp;
  if(c.type==='mine')return 0;
  if(sp.hazard)return 16;
  if(c.type==='puffer')return 7;
  if(c.type==='jelly')return 0;
  return 9+sp.tier*8+(c.lunge>0?7:0);
}

/* ============================== 进食 / 战斗 ============================== */
function tryBite(dt){
  if(!P.alive)return;
  const mx=P.x+Math.cos(P.ang)*P.len*.46;
  const my=P.y+Math.sin(P.ang)*P.len*.46;
  const reach=P.len*.30+(P.dashing?P.len*.14:0);
  const bodyR=playerR();

  for(let i=creatures.length-1;i>=0;i--){
    const c=creatures[i];
    if(c.dead)continue;
    const rr=c.r+reach;
    const dm=dist2(mx,my,c.x,c.y);
    const db=dist2(P.x,P.y,c.x,c.y);
    const cr2=(c.r+bodyR)*(c.r+bodyR);
    if(dm>rr*rr&&db>cr2)continue;

    if(isEdible(c)){
      if(P.biteCd>0)continue;
      P.biteCd=.13;P.biteAnim=.16;
      biteCreature(c,i);
    }else if(isDangerous(c)){
      if(db<=cr2){
        if(c.type==='jelly'){ /* 水母只麻痹 */ }
        hurtPlayer(dmgOf(c),c.x,c.y);
        if(c.type==='puffer'&&c.inflate>.55){poisonPlayer(3.4);floatText(P.x,P.y-50,'中毒!','#b6ff6a');}
        if(c.sp.ai==='hunt'&&c.lunge>0)addShake(9);
      }
    }
  }
  /* Boss 碰撞 */
  if(G.boss)bossContact();
}

function biteCreature(c,idx){
  const sp=c.sp;
  SFX.bite();
  c.flash=1;
  bloodFx(c.x,c.y,4,sp.tier>=3?'#d0342c':'#e0655a');
  if(c.hp>1){
    c.hp--;c.biteT=.2;
    const chip=Math.max(2,Math.round(sp.food*.22));
    P.hunger=Math.min(P.maxHunger,P.hunger+chip);
    P.mouth=1;P.biteAnim=.2;
    floatText(c.x,c.y-c.r,'-'+(c.maxHp-c.hp),'#ffd0c0',14);
    addShake(2.5);
    if(c.hp<=0)killCreature(c,true,idx);
    else{
      /* 反咬：大型猎物被咬会挣脱 */
      if(sp.tier>=3&&c.sp.ai!=='giant'){
        const a=Math.atan2(c.y-P.y,c.x-P.x);
        c.vx+=Math.cos(a)*180;c.vy+=Math.sin(a)*180;
      }
      if(chance(.35))dropLoot(c,.35);
    }
    return;
  }
  killCreature(c,true,idx);
}

function killCreature(c,reward,idx){
  if(c.dead)return;
  c.dead=true;
  const i=(idx!==undefined)?idx:creatures.indexOf(c);
  if(i>=0){
    if(c.flock)removeFlockMember(c);
    creatures.splice(i,1);
  }
  const sp=c.sp;
  bloodFx(c.x,c.y,Math.min(26,4+sp.tier*4),sp.tier>=3?'#c22b26':'#d9564a');
  if(sp.tier>=3){ringFx(c.x,c.y,c.len*1.5,'rgba(255,120,90,.55)');addShake(3+sp.tier);}
  for(let k=0;k<Math.min(8,2+sp.tier*2);k++)bubbleFx(c.x,c.y,1);

  if(!reward)return;
  P.combo=Math.min(12,P.combo+1);
  P.comboT=2.9;
  G.maxCombo=Math.max(G.maxCombo,P.combo);
  const m=comboMult()*(P.frenzy>0?2:1);
  const food=sp.food*(P.frenzy>0?1.25:1);
  const xp=Math.round(sp.xp*m);
  P.hunger=Math.min(P.maxHunger,P.hunger+food);
  G.kills++;
  gainXP(xp);
  dropLoot(c,1);
  const col=sp.tier>=4?'#ffd76a':(sp.tier>=2?'#b8f6e6':'#e6f7ff');
  floatText(c.x,c.y-c.r*.7,'+'+Math.round(food)+(P.combo>1?'  x'+m.toFixed(1):''),col,P.combo>3?20:16);
  if(sp.tier>=3)SFX.big();else SFX.eat();
  if(P.combo===4)bonusText(P.x,P.y-P.len*.6,'连击 x4!','#ff9ae0');
  if(P.combo===8)bonusText(P.x,P.y-P.len*.6,'疯狂进食 x8!','#ff7ad9',26);
  if(P.combo===12)bonusText(P.x,P.y-P.len*.6,'食物链顶端 x12!','#ffd76a',28);
  if(P.inAir&&P.y<SURFACE_Y)P.airEat=true;
}

function dropLoot(c,mult){
  const sp=c.sp;
  const n=Math.max(1,Math.round(sp.coin*mult*.7));
  for(let i=0;i<n;i++){
    const a=rand(0,TAU),s=rand(50,190);
    addPickup('coin',c.x,c.y,Math.cos(a)*s,Math.sin(a)*s);
  }
  if(sp.coin*mult>=6)addPickup('coin',c.x+rand(-14,14),c.y+rand(-14,14));
  const low=P.hunger/P.maxHunger;
  if(chance((low<.18?.50:(low<.3?.30:.055))*mult))addPickup('meat',c.x,c.y);
  if(chance(.030*mult))addPickup('frenzy',c.x,c.y);
  if(chance(.026*mult))addPickup('shield',c.x,c.y);
}

/* ============================== 道具 ============================== */
function addPickup(type,x,y,vx,vy){
  pickups.push({type,x,y,vx:vx||rand(-24,24),vy:vy||rand(-24,24),t:0,
    life:type==='coin'?26:20,r:type==='coin'?9:15,got:false});
  if(pickups.length>200)pickups.shift();
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.t+=dt;
    if(p.t>p.life){pickups.splice(i,1);continue;}
    const d=dist(p.x,p.y,P.x,P.y);
    const magnet=p.type==='coin'?430:300;
    if(d<magnet&&P.alive){
      const a=Math.atan2(P.y-p.y,P.x-p.x);
      const pull=(1-d/magnet)*1500;
      p.vx+=Math.cos(a)*pull*dt;p.vy+=Math.sin(a)*pull*dt;
    }else{
      p.vx*=Math.pow(.965,dt*60);
      p.vy*=Math.pow(.965,dt*60);
      if(p.type==='coin')p.vy-=6*dt;
      else p.vy+=Math.sin(p.t*2)*10*dt;
    }
    p.vx=clamp(p.vx,-760,760);p.vy=clamp(p.vy,-760,760);
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.y=clamp(p.y,WORLD.top+30,FLOOR_Y-8);
    p.x=clamp(p.x,WORLD.left+20,WORLD.right-20);
    if(d<P.len*.34+p.r+8){
      applyPickup(p);
      pickups.splice(i,1);
    }
  }
}
function applyPickup(p){
  if(p.type==='coin'){
    const v=Math.round(1+P.tier*.6);
    P.coins+=v;SFX.coin();
    sparkFx(p.x,p.y,'#ffd76a');
    if(chance(.25))floatText(p.x,p.y,'+'+v,'#ffd76a',13);
  }else if(p.type==='meat'){
    const heal=Math.round(P.maxHunger*.30);
    P.hunger=Math.min(P.maxHunger,P.hunger+heal);
    floatText(P.x,P.y-P.len*.5,'饱食 +'+heal,'#ff9a6a',20);
    ringFx(P.x,P.y,P.len*1.1,'#ff9a6a');SFX.eat();
  }else if(p.type==='frenzy'){
    P.frenzy=Math.max(P.frenzy,9);P.inv=Math.max(P.inv,.4);
    D.vignette.classList.add('gold');
    showBanner('狂暴模式','FRENZY · 吞噬一切','#ffd76a');
    ringFx(P.x,P.y,P.len*2.2,'#ffd76a');SFX.frenzy();
  }else if(p.type==='shield'){
    P.shield=Math.max(P.shield,8);
    floatText(P.x,P.y-P.len*.5,'气泡护盾','#bfefff',19);
    ringFx(P.x,P.y,P.len*1.4,'#8fe6ff');SFX.tone(520,1180,.35,'sine',.2);
  }
}

/* ============================== 弹药 ============================== */
function fireShot(type,x,y,ang,spd,dmg){
  shots.push({type,x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,ang,t:0,dmg,
    life:type==='bomb'?6:3.2,fuse:type==='bomb'?rand(1.9,2.6):0,r:type==='bomb'?15:(type==='harpoon'?26:13)});
  if(shots.length>80)shots.shift();
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];s.t+=dt;
    if(s.type==='bomb'){
      s.vy+=150*dt;s.vx*=Math.pow(.99,dt*60);
      s.ang=Math.atan2(s.vy,s.vx);
      s.fuse-=dt;
      if(chance(dt*8))bubbleFx(s.x,s.y-8,1);
      if(s.fuse<=0||dist(s.x,s.y,P.x,P.y)<s.r+P.len*.26+16){
        explode(s.x,s.y,190,s.dmg);shots.splice(i,1);continue;
      }
    }else if(s.type==='harpoon'){
      s.vx*=Math.pow(.995,dt*60);s.vy*=Math.pow(.995,dt*60);
      s.ang=Math.atan2(s.vy,s.vx);
      if(chance(dt*22))part({k:'bub',x:s.x,y:s.y,vx:rand(-14,14),vy:rand(-40,-14),r:rand(1,3),life:.5,t:0,col:'rgba(220,245,255,.55)'});
    }else{ /* ink */
      const a=Math.atan2(P.y-s.y,P.x-s.x);
      s.vx=lerp(s.vx,Math.cos(a)*170,smooth(1.1,dt));
      s.vy=lerp(s.vy,Math.sin(a)*170,smooth(1.1,dt));
      s.ang=Math.atan2(s.vy,s.vx);
      if(chance(dt*20))inkFx(s.x,s.y,1);
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.t>s.life||s.x<WORLD.left||s.x>WORLD.right||s.y<WORLD.top||s.y>FLOOR_Y+40){shots.splice(i,1);continue;}
    const rr=s.r+P.len*.24;
    if(dist2(s.x,s.y,P.x,P.y)<rr*rr){
      if(P.frenzy>0){
        sparkFx(s.x,s.y,'#ffd76a');
        if(s.type==='bomb'){explode(s.x,s.y,120,0);}
        shots.splice(i,1);continue;
      }
      if(s.type==='ink'){
        hurtPlayer(s.dmg,s.x,s.y);
        inkFx(s.x,s.y,7);
        P.paralyze=Math.max(P.paralyze,.7);
      }else if(s.type==='bomb'){explode(s.x,s.y,190,s.dmg);}
      else{hurtPlayer(s.dmg,s.x,s.y);SFX.tone(1500,300,.1,'square',.14);}
      shots.splice(i,1);
    }
  }
}
function explode(x,y,radius,dmg){
  ringFx(x,y,radius*2.1,'rgba(255,190,90,.9)');
  ringFx(x,y,radius*1.2,'rgba(255,255,220,.95)');
  for(let i=0;i<30;i++)sparkFx(x,y,pick(['#ffd76a','#ff8a3c','#fff3c4']));
  for(let i=0;i<14;i++)part({k:'blob',x,y,vx:rand(-160,160),vy:rand(-160,160),r:rand(8,22),life:rand(.6,1.4),t:0,col:'rgba(60,50,50,.6)'});
  bubbleFx(x,y,18);
  addShake(20);G.flash=Math.max(G.flash,.35);G.flashCol='255,190,90';
  SFX.boom();
  if(dmg>0){
    const d=dist(x,y,P.x,P.y);
    if(d<radius+P.len*.24)hurtPlayer(Math.round(dmg*(1-d/(radius+P.len*.3)*.55)),x,y);
  }
  for(let i=creatures.length-1;i>=0;i--){
    const c=creatures[i];
    if(c.sp.hazard||c.sp.item)continue;
    if(dist2(x,y,c.x,c.y)<radius*radius*1.1){
      c.hp-=3;c.flash=1;
      if(c.hp<=0)killCreature(c,P.tier>=c.sp.tier);
    }
  }
}

/* ============================== Boss：克拉肯 ============================== */
function queueBoss(lvl){
  G.bossQueue=lvl;G.warnT=3.2;
  D.bossWarn.classList.add('on');
  SFX.boss();
}
function spawnBoss(lvl){
  const side=P.x<(WORLD.left+WORLD.right)/2?1:-1;
  const b={
    lvl,x:P.x+side*980,y:clamp(P.y+rand(-200,200),1100,FLOOR_Y-400),
    vx:0,vy:0,ang:side>0?Math.PI:0,
    maxHp:lvl===0?480:1050,hp:lvl===0?480:1050,
    len:lvl===0?520:660,state:'intro',st:2.6,t:0,flash:0,
    tent:[],summonT:0,phaseT:0,dead:false,dying:0,name:lvl===0?'深渊霸主 · 克拉肯':'深渊之母 · 利维坦'
  };
  const n=7;
  for(let i=0;i<n;i++){
    const segs=[];
    for(let j=0;j<13;j++)segs.push({x:b.x,y:b.y});
    b.tent.push({segs,base:(i/(n-1)-.5)*2.1,phase:rand(0,TAU),hurt:0,slam:0,tipR:lvl===0?26:32});
  }
  G.boss=b;
  D.bossWrap.classList.add('on');
  D.bossName.textContent=b.name;
  showBanner(b.name,'ABYSSAL OVERLORD','#ff9b9b');
  addShake(24);SFX.boss();
}
function bossContact(){
  const b=G.boss;if(!b||b.dead)return;
  const bodyR=playerR();
  /* 触手 */
  for(const t of b.tent){
    for(let j=3;j<t.segs.length;j++){
      const s=t.segs[j];
      const rr=(b.len*.045*(1-j/t.segs.length*.55)+t.tipR*.6)+bodyR;
      if(dist2(s.x,s.y,P.x,P.y)<rr*rr){
        if(P.frenzy>0||P.biteCd<=0&&isBiteable(b)){
          if(P.biteCd<=0){
            P.biteCd=.16;P.biteAnim=.18;
            damageBoss(P.frenzy>0?16:9+P.tier*3,s.x,s.y,false);
            t.hurt=.35;
          }
        }
        if(P.frenzy<=0)hurtPlayer(24+b.lvl*8,s.x,s.y);
        break;
      }
    }
  }
  /* 头部 */
  const hr=b.len*.30+bodyR;
  const hx=b.x+Math.cos(b.ang)*b.len*.06, hy=b.y+Math.sin(b.ang)*b.len*.06;
  if(dist2(hx,hy,P.x,P.y)<hr*hr){
    if(P.biteCd<=0){
      P.biteCd=.16;P.biteAnim=.2;
      const vuln=b.state==='vulnerable'||b.state==='chargeEnd'||P.frenzy>0;
      damageBoss(vuln?(24+P.tier*9):(7+P.tier*2),hx,hy,vuln);
    }
    if(P.frenzy<=0&&b.state!=='vulnerable')hurtPlayer(20+b.lvl*6,hx,hy);
  }
}
function isBiteable(b){return true;}
function damageBoss(dmg,x,y,crit){
  const b=G.boss;if(!b||b.dead)return;
  b.hp-=dmg;b.flash=1;
  bloodFx(x,y,crit?12:5,'#7a2fb0');
  sparkFx(x,y,crit?'#ffd76a':'#d8a6ff');
  floatText(x,y-16,(crit?'暴击 ':'')+Math.round(dmg),crit?'#ffd76a':'#e6c9ff',crit?22:15);
  addShake(crit?7:3);
  SFX.bite();
  if(crit)SFX.tone(880,1500,.14,'square',.14);
  if(b.hp<=0)killBoss();
}
function killBoss(){
  const b=G.boss;b.dead=true;b.dying=0;
  G.bossKills++;
  addShake(34);G.flash=1;G.flashCol='210,160,255';
  SFX.boom();SFX.evolve();
  const coins=180+b.lvl*260;
  P.coins+=coins;
  for(let i=0;i<60;i++)addPickup('coin',b.x+rand(-220,220),b.y+rand(-160,160),rand(-260,260),rand(-260,260));
  for(let i=0;i<50;i++)sparkFx(b.x+rand(-260,260),b.y+rand(-200,200),'#c46bff');
  for(let i=0;i<8;i++)ringFx(b.x+rand(-160,160),b.y+rand(-120,120),260,'rgba(200,120,255,.8)');
  P.hunger=P.maxHunger;P.frenzy=Math.max(P.frenzy,8);P.shield=Math.max(P.shield,6);
  gainXP(b.lvl===0?220:420);
  showBanner('深渊霸主已陨落','+'+coins+' 金币 · 形态解放','#d8a6ff');
  D.bossWrap.classList.remove('on');
}
function updateBoss(dt){
  const b=G.boss;if(!b)return;
  b.t+=dt;
  if(b.flash>0)b.flash-=dt*4;
  if(b.dead){
    b.dying+=dt;
    if(b.dying>2.4){G.boss=null;return;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.vx*=Math.pow(.96,dt*60);b.vy*=Math.pow(.96,dt*60);
    if(chance(dt*22)){
      const x=b.x+rand(-260,260),y=b.y+rand(-200,200);
      sparkFx(x,y,'#c46bff');bloodFx(x,y,3,'#5a2080');
      if(chance(.3))addShake(4);
    }
    for(const t of b.tent)updateTentacle(b,t,dt,true);
    return;
  }
  const hx=b.x+Math.cos(b.ang)*b.len*.06, hy=b.y+Math.sin(b.ang)*b.len*.06;
  b.st-=dt;

  if(b.state==='intro'){
    b.ang=angTo(b.ang,Math.atan2(P.y-b.y,P.x-b.x),smooth(1.2,dt));
    const dd=dist(b.x,b.y,P.x,P.y);
    const want=dd>620?150:(dd<420?-70:0);
    b.vx=lerp(b.vx,Math.cos(b.ang)*want,smooth(1.4,dt));
    b.vy=lerp(b.vy,Math.sin(b.ang)*want,smooth(1.4,dt));
    if(b.st<=0){b.state='idle';b.st=1.6;}
  }
  else if(b.state==='idle'){
    b.ang=angTo(b.ang,Math.atan2(P.y-b.y,P.x-b.x),smooth(.9,dt));
    const dd=dist(b.x,b.y,P.x,P.y);
    const target=dd>560?110:(dd<380?-60:24);
    b.vx=lerp(b.vx,Math.cos(b.ang)*target,smooth(1.2,dt));
    b.vy=lerp(b.vy,Math.sin(b.ang)*target*.8+Math.sin(b.t*.7)*24,smooth(1.2,dt));
    if(b.st<=0)chooseBossAction();
  }
  else if(b.state==='slamWind'){
    b.vx*=Math.pow(.94,dt*60);b.vy*=Math.pow(.94,dt*60);
    for(const t of b.tent)if(t.slam>0)t.slam=Math.min(1,t.slam+dt*1.6);
    if(b.st<=0){b.state='slam';b.st=.55;SFX.tone(160,60,.4,'sawtooth',.24);addShake(10);}
  }
  else if(b.state==='slam'){
    for(const t of b.tent){
      if(t.slam>0){
        t.slam=Math.min(2,t.slam+dt*4.5);
        const tip=t.segs[t.segs.length-1];
        if(dist2(tip.x,tip.y,P.x,P.y)<(t.tipR+playerR()+26)*(t.tipR+playerR()+26)){
          hurtPlayer(30+b.lvl*10,tip.x,tip.y);
          sandFx(tip.x,tip.y,6);
        }
      }
    }
    if(b.st<=0){b.state='idle';b.st=rand(1.1,1.9);for(const t of b.tent)t.slam=0;}
  }
  else if(b.state==='ink'){
    b.vx*=Math.pow(.95,dt*60);b.vy*=Math.pow(.95,dt*60);
    b.summonT-=dt;
    if(b.summonT<=0){
      b.summonT=.28;
      const n=3,a0=Math.atan2(P.y-b.y,P.x-b.x);
      for(let i=0;i<n;i++)fireShot('ink',hx,hy,a0+rand(-.42,.42),230+b.lvl*40,12+b.lvl*4);
      SFX.tone(320,140,.18,'sine',.14);
      if(b.st<=0){b.state='idle';b.st=rand(1.2,2);}
    }
  }
  else if(b.state==='chargeWind'){
    b.ang=angTo(b.ang,Math.atan2(P.y-b.y,P.x-b.x),smooth(4.5,dt));
    b.vx*=Math.pow(.9,dt*60);b.vy*=Math.pow(.9,dt*60);
    if(chance(dt*30))bubbleFx(hx+rand(-40,40),hy+rand(-40,40),2);
    if(b.st<=0){b.state='charge';b.st=1.15;
      b.vx=Math.cos(b.ang)*(430+b.lvl*90);b.vy=Math.sin(b.ang)*(430+b.lvl*90);
      SFX.tone(90,220,.6,'sawtooth',.28);addShake(12);}
  }
  else if(b.state==='charge'){
    b.vx*=Math.pow(.995,dt*60);b.vy*=Math.pow(.995,dt*60);
    if(chance(dt*40))part({k:'bub',x:b.x+rand(-90,90),y:b.y+rand(-70,70),vx:rand(-40,40),vy:rand(-90,-20),r:rand(2,7),life:.8,t:0,col:'rgba(220,245,255,.6)'});
    const rr=b.len*.3+playerR();
    if(dist2(hx,hy,P.x,P.y)<rr*rr&&P.frenzy<=0)hurtPlayer(34+b.lvl*10,P.x,P.y);
    if(b.st<=0){b.state='vulnerable';b.st=2.5+b.lvl*.4;
      floatText(hx,hy-b.len*.3,'破绽!','#ffd76a',26);
      ringFx(hx,hy,b.len*.9,'#ffd76a');SFX.tone(1200,600,.3,'triangle',.16);}
  }
  else if(b.state==='vulnerable'){
    b.vx*=Math.pow(.93,dt*60);b.vy*=Math.pow(.93,dt*60);
    if(chance(dt*16))sparkFx(hx+rand(-50,50),hy+rand(-50,50),'#ffd76a');
    if(b.st<=0){b.state='idle';b.st=rand(1,1.8);}
  }
  else if(b.state==='summon'){
    b.vx*=Math.pow(.95,dt*60);b.vy*=Math.pow(.95,dt*60);
    if(b.st<=0){
      b.state='idle';b.st=rand(1.2,2);
      const n=3+b.lvl*2;
      for(let i=0;i<n;i++){
        const a=rand(0,TAU);
        const c=makeCreature('squid',b.x+Math.cos(a)*160,b.y+Math.sin(a)*160);
        creatures.push(c);
        ringFx(c.x,c.y,80,'rgba(180,120,255,.7)');
      }
      SFX.tone(200,520,.5,'sine',.2);
    }
  }

  b.x+=b.vx*dt;b.y+=b.vy*dt;
  b.x=clamp(b.x,WORLD.left+320,WORLD.right-320);
  b.y=clamp(b.y,760,FLOOR_Y-260);
  for(const t of b.tent)updateTentacle(b,t,dt,false);
}
function chooseBossAction(){
  const b=G.boss;
  const r=Math.random();
  const hpR=b.hp/b.maxHp;
  if(r<.30){b.state='slamWind';b.st=.85-hpR*.2;
    for(const t of b.tent)if(chance(.55)){t.slam=.01;t.tx=P.x+rand(-120,120);t.ty=P.y+rand(-120,120);} }
  else if(r<.55){b.state='ink';b.st=1.5;b.summonT=.1;}
  else if(r<.80){b.state='chargeWind';b.st=.8;}
  else{b.state='summon';b.st=.8;}
}
function updateTentacle(b,t,dt,dying){
  const n=t.segs.length;
  const baseA=b.ang+Math.PI+t.base*.85;
  const ax=b.x+Math.cos(baseA)*b.len*.20;
  const ay=b.y+Math.sin(baseA)*b.len*.20;
  t.segs[0].x=ax;t.segs[0].y=ay;
  if(t.hurt>0)t.hurt-=dt*3;
  const segLen=b.len*.085;
  let targetA;
  if(t.slam>0){
    targetA=Math.atan2((t.ty||P.y)-ay,(t.tx||P.x)-ax);
    targetA+=Math.sin(b.t*10+t.phase)*.10*(1-Math.min(1,t.slam));
  }else{
    targetA=baseA+Math.sin(b.t*(dying?.6:1.05)+t.phase)*.62+Math.sin(b.t*.5+t.phase*2)*.3;
    if(!dying)targetA=angTo(targetA,Math.atan2(P.y-ay,P.x-ax),.14);
  }
  for(let j=1;j<n;j++){
    const prev=t.segs[j-1],s=t.segs[j];
    const fr=j/n;
    const a=lerp(targetA,targetA+Math.sin(b.t*2.1+t.phase+j*.5)*.42,fr);
    const k=smooth(t.slam>0?16:9,dt);
    const nx=prev.x+Math.cos(a)*segLen*(1-fr*.16);
    const ny=prev.y+Math.sin(a)*segLen*(1-fr*.16);
    s.x=lerp(s.x,nx,k);s.y=lerp(s.y,ny,k);
  }
}

/* ============================== 渐变缓存 ============================== */
let gradFloor=null,gradWall=null;
function buildGrads(){
  gradFloor=ctx.createLinearGradient(0,FLOOR_Y-70,0,WORLD.bottom);
  gradFloor.addColorStop(0,'#4a4029');
  gradFloor.addColorStop(.35,'#2c2618');
  gradFloor.addColorStop(1,'#120f09');
  gradWall=ctx.createLinearGradient(0,0,0,FLOOR_Y);
  gradWall.addColorStop(0,'#123043');
  gradWall.addColorStop(1,'#050d16');
}

/* ============================== 相机 ============================== */
function computeCamera(dt){
  const base=clamp(1.13-P.tier*.086,.60,1.13);
  const fit=Math.min(1,Math.min(VW/1180,VH/680)*1.06);
  const zt=clamp(base*Math.max(.62,fit),.42,1.15);
  G.zoom=G.zoom?lerp(G.zoom,zt,smooth(2.2,dt||.016)):zt;
  view.w=VW/G.zoom;view.h=VH/G.zoom;
  const lead=clamp(P.len*.55,40,190);
  const cx=P.x+Math.cos(P.ang)*lead*.55+P.vx*.10;
  const cy=P.y+Math.sin(P.ang)*lead*.30+P.vy*.08;
  const spanX=WORLD.right-WORLD.left, spanY=WORLD.bottom-WORLD.top;
  G.camX=view.w>=spanX?WORLD.left+(spanX-view.w)/2:clamp(cx-view.w/2,WORLD.left,WORLD.right-view.w);
  G.camY=view.h>=spanY?WORLD.top+(spanY-view.h)/2:clamp(cy-view.h/2,WORLD.top,WORLD.bottom-view.h);
}
function applyCam(f){
  const z=G.zoom*DPR;
  ctx.setTransform(z,0,0,z,-G.camX*f*z+G.shx*DPR,-G.camY*f*z+G.shy*DPR);
}
function applyScreen(){ctx.setTransform(DPR,0,0,DPR,0,0);}
function waterLine(){return (SURFACE_Y-G.camY)*G.zoom+G.shy;}

/* ============================== 场景装饰（一次性生成） ============================== */
let decoRocks=[],decoKelp=[],decoCoral=[],decoPillar=[];
function generateDeco(){
  decoRocks=[];decoKelp=[];decoCoral=[];decoPillar=[];
  for(let x=WORLD.left-100;x<WORLD.right+100;x+=rand(95,240))
    decoRocks.push({x,y:FLOOR_Y+rand(-4,30),r:rand(28,96),k:rand(0,1)});
  for(let x=WORLD.left-60;x<WORLD.right+60;x+=rand(44,140))
    decoKelp.push({x,h:rand(110,470),n:randi(3,7),ph:rand(0,TAU),k:rand(0,1)});
  for(let x=WORLD.left;x<WORLD.right;x+=rand(240,660))
    decoCoral.push({x,t:randi(0,2),r:rand(24,64),ph:rand(0,TAU),k:rand(0,1)});
  for(let x=WORLD.left+700;x<WORLD.right-700;x+=rand(900,1900))
    decoPillar.push({x,w:rand(90,230),h:rand(400,1500),k:rand(0,1)});
}

/* ============================== 背景绘制 ============================== */
function drawBackground(){
  applyScreen();
  const wl=waterLine();
  /* 天空 */
  if(wl>-40){
    const g=ctx.createLinearGradient(0,Math.min(-60,wl-620),0,wl);
    g.addColorStop(0,'#1d6fb8');g.addColorStop(.45,'#63b6e8');
    g.addColorStop(.82,'#b9e6f7');g.addColorStop(1,'#e8f8ff');
    ctx.fillStyle=g;ctx.fillRect(0,0,VW,Math.max(0,wl+2));
    /* 太阳 */
    const sy=wl-Math.min(430,VH*.44),sx=VW*.74;
    if(sy>-160){
      const sg=ctx.createRadialGradient(sx,sy,4,sx,sy,190);
      sg.addColorStop(0,'rgba(255,255,240,.95)');sg.addColorStop(.16,'rgba(255,246,200,.55)');
      sg.addColorStop(1,'rgba(255,240,190,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,190,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,253,235,.95)';ctx.beginPath();ctx.arc(sx,sy,30,0,TAU);ctx.fill();
    }
    /* 云（无限平铺，视差 .16） */
    drawTiles(.16,760,(j,sx)=>{
      const cy=wl-Math.min(520,VH*.5)-Math.abs(hash1(j*3))*150-40;
      if(cy<-90||cy>wl)return;
      const s=(.55+Math.abs(hash1(j*11))*.85)*G.zoom*1.1;
      ctx.fillStyle='rgba(255,255,255,'+(.30+Math.abs(hash1(j*5))*.34)+')';
      for(let k=0;k<5;k++){
        const ox=(k-2)*30*s+hash1(j*17+k)*10*s, oy=Math.sin(k*1.7+j)*7*s;
        ctx.beginPath();ctx.ellipse(sx+ox,cy+oy,(34-Math.abs(k-2)*6)*s,(17-Math.abs(k-2)*2.4)*s,0,0,TAU);ctx.fill();
      }
    });
  }else{
    ctx.fillStyle='#06263c';ctx.fillRect(0,0,VW,VH);
  }
  /* 海水 */
  const yBot=(WORLD.bottom-G.camY)*G.zoom+G.shy;
  const wg=ctx.createLinearGradient(0,wl,0,Math.max(wl+80,yBot));
  wg.addColorStop(0,'#39b6d8');wg.addColorStop(.10,'#1f8fc0');
  wg.addColorStop(.30,'#116a9c');wg.addColorStop(.55,'#0a4a76');
  wg.addColorStop(.78,'#052c4c');wg.addColorStop(1,'#02121f');
  ctx.fillStyle=wg;
  ctx.fillRect(0,Math.max(0,wl),VW,VH-Math.max(0,wl)+2);

  /* 远山（两层视差） */
  drawHills(.34,FLOOR_Y+40,300,'rgba(9,38,60,.55)',520,3);
  drawHills(.56,FLOOR_Y+16,190,'rgba(6,28,46,.72)',380,17);

  /* 光柱 */
  const rf=clamp(1-(G.camY-SURFACE_Y)/2300,0,1);
  if(rf>0.01&&wl<VH+200){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const spacing=330,f=.92;
    const x0=G.camX*f,j0=Math.floor(x0/spacing)-1,j1=Math.ceil((x0+view.w)/spacing)+1;
    for(let j=j0;j<=j1;j++){
      const sx=(j*spacing-x0)*G.zoom+G.shx;
      const w=(46+hash1(j*7)*30)*G.zoom;
      const sp=(150+hash1(j*13)*110)*G.zoom;
      const a=(.045+.028*Math.sin(G.time*.55+j*1.7))*rf;
      if(a<=0)continue;
      ctx.fillStyle='rgba(186,238,255,'+a.toFixed(3)+')';
      ctx.beginPath();
      ctx.moveTo(sx-w/2,wl);ctx.lineTo(sx+w/2,wl);
      ctx.lineTo(sx+sp+w*.4,VH+80);ctx.lineTo(sx+sp-w*.9,VH+80);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  /* 水面波光 */
  if(wl>-30&&wl<VH+30){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(215,250,255,.42)';ctx.lineWidth=2.2*G.zoom;
    ctx.beginPath();
    for(let x=-20;x<=VW+20;x+=12){
      const wx=G.camX+x/G.zoom;
      const y=wl+(Math.sin(wx*.014+G.time*1.7)*4+Math.sin(wx*.031-G.time*2.3)*2.6)*G.zoom;
      if(x===-20)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(232,252,255,.20)';
    ctx.fillRect(0,wl-3*G.zoom,VW,7*G.zoom);
    ctx.restore();
  }
}
function drawTiles(f,spacing,fn){
  const x0=G.camX*f;
  const j0=Math.floor(x0/spacing)-1, j1=Math.ceil((x0+view.w)/spacing)+1;
  for(let j=j0;j<=j1;j++){
    const sx=(j*spacing-x0)*G.zoom+G.shx;
    if(sx<-700||sx>VW+700)continue;
    fn(j,sx);
  }
}
function drawHills(f,baseY,amp,col,spacing,seed){
  const sy=(baseY-G.camY)*G.zoom+G.shy;
  if(sy<-amp*G.zoom-40||sy>VH+amp*G.zoom)return;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(-40,VH+60);
  const x0=G.camX*f;
  const j0=Math.floor(x0/spacing)-1,j1=Math.ceil((x0+view.w)/spacing)+1;
  for(let j=j0;j<=j1;j++){
    const sx=(j*spacing-x0)*G.zoom+G.shx;
    const h=(amp*(.45+Math.abs(hash1(j*seed))*0.85))*G.zoom;
    const w=spacing*G.zoom;
    ctx.lineTo(sx-w*.5,sy);
    ctx.quadraticCurveTo(sx-w*.22,sy-h,sx,sy-h*(.72+hash1(j*seed*3)*.3));
    ctx.quadraticCurveTo(sx+w*.24,sy-h*.55,sx+w*.5,sy);
  }
  ctx.lineTo(VW+40,VH+60);
  ctx.closePath();ctx.fill();
}

function drawFloor(){
  applyCam(1);
  if(G.camY+view.h<FLOOR_Y-700)return;
  const x0=G.camX-160,x1=G.camX+view.w+160;
  /* 石柱 */
  for(const p of decoPillar){
    if(p.x<x0-400||p.x>x1+400)continue;
    ctx.fillStyle='rgba(10,32,50,.55)';
    ctx.beginPath();
    ctx.moveTo(p.x-p.w*.5,FLOOR_Y+40);
    ctx.lineTo(p.x-p.w*.26,FLOOR_Y-p.h);
    ctx.quadraticCurveTo(p.x,FLOOR_Y-p.h-40,p.x+p.w*.28,FLOOR_Y-p.h*.86);
    ctx.lineTo(p.x+p.w*.5,FLOOR_Y+40);
    ctx.closePath();ctx.fill();
  }
  /* 海床 */
  ctx.fillStyle=gradFloor;
  ctx.beginPath();
  ctx.moveTo(x0,WORLD.bottom+80);
  ctx.lineTo(x0,FLOOR_Y+16);
  const step=90;
  for(let x=Math.floor(x0/step)*step;x<x1+step;x+=step){
    const y=FLOOR_Y+hash1(Math.round(x/step)*29)*17;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(x1+step,WORLD.bottom+80);
  ctx.closePath();ctx.fill();
  /* 沙面高光 */
  ctx.strokeStyle='rgba(214,190,138,.20)';ctx.lineWidth=3;
  ctx.beginPath();
  for(let x=Math.floor(x0/step)*step;x<x1+step;x+=step){
    const y=FLOOR_Y+hash1(Math.round(x/step)*29)*17;
    if(x===Math.floor(x0/step)*step)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  /* 岩石 */
  for(const r of decoRocks){
    if(r.x<x0-140||r.x>x1+140)continue;
    ctx.fillStyle=r.k>.5?'#2f2a1c':'#3a3222';
    ctx.beginPath();
    ctx.moveTo(r.x-r.r,r.y+8);
    ctx.quadraticCurveTo(r.x-r.r*.7,r.y-r.r*(.6+r.k*.5),r.x-r.r*.1,r.y-r.r*(.75+r.k*.3));
    ctx.quadraticCurveTo(r.x+r.r*.6,r.y-r.r*(.5+r.k*.4),r.x+r.r,r.y+8);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,240,200,.05)';
    ctx.beginPath();ctx.ellipse(r.x-r.r*.25,r.y-r.r*.42,r.r*.3,r.r*.16,-.4,0,TAU);ctx.fill();
  }
  /* 珊瑚 */
  for(const c of decoCoral){
    if(c.x<x0-120||c.x>x1+120)continue;
    drawCoral(c);
  }
  /* 海草 */
  for(const k of decoKelp){
    if(k.x<x0-90||k.x>x1+90)continue;
    drawKelp(k);
  }
}
function drawKelp(k){
  const sway=Math.sin(G.time*1.05+k.ph)*16;
  const col=k.k>.5?'rgba(38,96,60,.85)':'rgba(52,124,74,.8)';
  ctx.strokeStyle=col;ctx.lineWidth=5+k.k*3;ctx.lineCap='round';
  for(let i=0;i<k.n;i++){
    const off=(i-(k.n-1)/2)*9;
    ctx.beginPath();
    ctx.moveTo(k.x+off,FLOOR_Y+6);
    const segs=5;
    for(let s=1;s<=segs;s++){
      const f=s/segs;
      ctx.lineTo(k.x+off+sway*f*f+Math.sin(G.time*1.6+k.ph+s*.8)*7*f,FLOOR_Y+6-k.h*f);
    }
    ctx.stroke();
  }
  ctx.lineCap='butt';
}
function drawCoral(c){
  const y=FLOOR_Y+4;
  ctx.save();ctx.translate(c.x,y);
  if(c.t===0){ /* 扇形珊瑚 */
    ctx.strokeStyle=c.k>.5?'rgba(214,96,110,.85)':'rgba(236,150,90,.85)';
    ctx.lineWidth=4;
    for(let i=-3;i<=3;i++){
      const a=-Math.PI/2+i*.22+Math.sin(G.time*.8+c.ph)*.03;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(Math.cos(a)*c.r*.5,Math.sin(a)*c.r*.55,Math.cos(a)*c.r,Math.sin(a)*c.r);
      ctx.stroke();
    }
  }else if(c.t===1){ /* 管状 */
    ctx.fillStyle=c.k>.5?'rgba(226,178,84,.85)':'rgba(150,206,120,.85)';
    for(let i=0;i<5;i++){
      const ox=(i-2)*c.r*.32,h=c.r*(.7+Math.abs(hash1(i*31+c.ph*10))*.9);
      ctx.beginPath();
      ctx.moveTo(ox-c.r*.11,0);ctx.lineTo(ox-c.r*.08,-h);
      ctx.lineTo(ox+c.r*.08,-h);ctx.lineTo(ox+c.r*.11,0);
      ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.ellipse(ox,-h,c.r*.09,c.r*.04,0,0,TAU);
      ctx.fillStyle='rgba(255,240,200,.5)';ctx.fill();
      ctx.fillStyle=c.k>.5?'rgba(226,178,84,.85)':'rgba(150,206,120,.85)';
    }
  }else{ /* 脑珊瑚 */
    ctx.fillStyle=c.k>.5?'rgba(178,120,190,.8)':'rgba(120,178,190,.8)';
    ctx.beginPath();ctx.ellipse(0,-c.r*.32,c.r*.62,c.r*.44,0,Math.PI,0);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.ellipse(0,-c.r*.32,c.r*(.16+Math.abs(i)*.14),c.r*(.12+Math.abs(i)*.1),0,Math.PI,0);ctx.stroke();
    }
  }
  ctx.restore();
}

/* 浮游生物（环境粒子，围绕相机重生） */
let plankton=[];
function updatePlankton(dt){
  const want=Math.round(clamp(view.w*view.h/16000,40,190));
  while(plankton.length<want)plankton.push(newPlank(true));
  if(plankton.length>want)plankton.length=want;
  for(let i=0;i<plankton.length;i++){
    const p=plankton[i];
    p.t+=dt;p.x+=p.vx*dt+Math.sin(p.t*p.w)*7*dt;p.y+=p.vy*dt;
    if(p.x<G.camX-90||p.x>G.camX+view.w+90||p.y<G.camY-90||p.y>G.camY+view.h+90)plankton[i]=newPlank(false);
  }
}
function newPlank(anywhere){
  return{x:anywhere?G.camX+rand(0,view.w):G.camX+rand(0,view.w),
    y:anywhere?G.camY+rand(0,view.h):G.camY+rand(0,view.h),
    vx:rand(-9,9),vy:rand(-14,4),r:rand(.7,2.4),t:rand(0,9),w:rand(.6,2.2),a:rand(.12,.42)};
}
function drawPlankton(){
  applyCam(1);
  for(const p of plankton){
    const deep=clamp((p.y-1500)/1600,0,1);
    ctx.fillStyle=deep>.25?'rgba(140,235,255,'+(p.a*(.6+deep))+')':'rgba(226,248,255,'+p.a*.6+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
}

/* ============================== 鲨鱼绘制（玩家 + 鲨形生物） ============================== */
function sharkBodyPath(L,h){
  ctx.beginPath();
  ctx.moveTo(-L*.42,0);
  ctx.quadraticCurveTo(-L*.06,-h*1.30,L*.50,-h*.14);
  ctx.quadraticCurveTo(L*.545,h*.02,L*.455,h*.24);
  ctx.quadraticCurveTo(-L*.02,h*1.10,-L*.42,h*.13);
  ctx.closePath();
}
function drawSharkShape(L,o){
  const h=L*.175;
  const tail=Math.sin(o.tail)*.42;
  const col=o.col;
  /* 尾鳍 */
  ctx.save();ctx.translate(-L*.40,0);ctx.rotate(tail*.55);
  ctx.fillStyle=col[1];
  ctx.beginPath();
  ctx.moveTo(L*.02,-h*.30);
  ctx.quadraticCurveTo(-L*.12,-h*.75,-L*.20,-h*2.35);
  ctx.quadraticCurveTo(-L*.13,-h*.62,-L*.04,h*.02);
  ctx.quadraticCurveTo(-L*.11,h*.55,-L*.16,h*1.55);
  ctx.quadraticCurveTo(-L*.06,h*.55,L*.02,h*.30);
  ctx.closePath();ctx.fill();
  ctx.restore();
  /* 背鳍 */
  ctx.fillStyle=col[1];
  ctx.beginPath();
  ctx.moveTo(L*.07,-h*.92);
  ctx.quadraticCurveTo(L*.01,-h*2.05,-L*.145,-h*2.18);
  ctx.quadraticCurveTo(-L*.11,-h*1.35,-L*.135,-h*.86);
  ctx.closePath();ctx.fill();
  /* 第二背鳍 + 臀鳍 */
  ctx.beginPath();
  ctx.moveTo(-L*.20,-h*.62);ctx.quadraticCurveTo(-L*.26,-h*1.20,-L*.335,-h*1.05);
  ctx.quadraticCurveTo(-L*.30,-h*.66,-L*.29,-h*.46);ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-L*.20,h*.66);ctx.quadraticCurveTo(-L*.27,h*1.16,-L*.335,h*1.0);
  ctx.quadraticCurveTo(-L*.30,h*.70,-L*.29,h*.52);ctx.closePath();ctx.fill();
  /* 胸鳍（远侧） */
  ctx.fillStyle=o.dark||col[1];
  ctx.beginPath();
  ctx.moveTo(L*.16,h*.30);
  ctx.quadraticCurveTo(L*.02,h*1.35,-L*.13,h*1.85);
  ctx.quadraticCurveTo(-L*.02,h*.95,-L*.02,h*.42);
  ctx.closePath();ctx.fill();
  /* 身体 */
  sharkBodyPath(L,h);
  ctx.fillStyle=col[0];ctx.fill();
  ctx.save();
  sharkBodyPath(L,h);ctx.clip();
  /* 腹部 */
  ctx.fillStyle=col[2];
  ctx.beginPath();ctx.ellipse(L*.02,h*1.02,L*.52,h*.86,0,0,TAU);ctx.fill();
  /* 侧线渐变 */
  const lg=ctx.createLinearGradient(0,-h*1.4,0,h*1.2);
  lg.addColorStop(0,'rgba(0,0,0,.20)');lg.addColorStop(.42,'rgba(255,255,255,.07)');
  lg.addColorStop(.62,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,.10)');
  ctx.fillStyle=lg;ctx.fillRect(-L*.5,-h*2,L*1.1,h*4);
  /* 虎鲨条纹 */
  if(o.stripes){
    ctx.strokeStyle='rgba(20,32,30,.34)';ctx.lineWidth=L*.022;
    for(let i=0;i<7;i++){
      const x=L*(.34-i*.115);
      ctx.beginPath();ctx.moveTo(x,-h*1.2);
      ctx.quadraticCurveTo(x-L*.02,0,x-L*.045,h*1.1);ctx.stroke();
    }
  }
  /* 巨齿鲨伤疤 */
  if(o.scars){
    ctx.strokeStyle='rgba(230,240,250,.20)';ctx.lineWidth=L*.012;
    for(let i=0;i<4;i++){
      const x=L*(.22-i*.16);
      ctx.beginPath();ctx.moveTo(x,-h*.55);ctx.lineTo(x-L*.05,h*.35);ctx.stroke();
    }
  }
  /* 鳃裂 */
  ctx.strokeStyle='rgba(0,0,0,.30)';ctx.lineWidth=Math.max(1,L*.011);
  for(let i=0;i<5;i++){
    const x=L*(.26-i*.042);
    ctx.beginPath();ctx.moveTo(x,-h*.34);ctx.quadraticCurveTo(x-L*.008,h*.02,x-L*.014,h*.40);ctx.stroke();
  }
  ctx.restore();
  /* 轮廓 */
  ctx.strokeStyle=o.line||'rgba(6,18,28,.55)';ctx.lineWidth=Math.max(1,L*.012);
  sharkBodyPath(L,h);ctx.stroke();
  /* 胸鳍（近侧） */
  ctx.fillStyle=col[1];
  ctx.beginPath();
  ctx.moveTo(L*.19,h*.34);
  ctx.quadraticCurveTo(L*.06,h*1.55,-L*.10,h*2.05);
  ctx.quadraticCurveTo(L*.02,h*1.0,L*.02,h*.44);
  ctx.closePath();ctx.fill();
  /* 嘴 */
  const m=o.mouth||.1;
  const mo=m*L*.10;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(L*.495,h*.06);
  ctx.quadraticCurveTo(L*.36,h*.20+mo,L*.155,h*.44+mo*.7);
  ctx.quadraticCurveTo(L*.33,h*.30+mo*.5,L*.47,h*.16);
  ctx.closePath();
  ctx.fillStyle='rgba(24,8,12,.92)';ctx.fill();
  if(m>.28){
    ctx.fillStyle='#fdfdf6';
    for(let i=0;i<6;i++){
      const f=i/5.0;
      const tx=lerp(L*.47,L*.185,f), ty=lerp(h*.13,h*.44+mo*.7,f*f*.6+f*.4);
      ctx.beginPath();
      ctx.moveTo(tx-L*.011,ty-L*.006);ctx.lineTo(tx+L*.011,ty-L*.004);
      ctx.lineTo(tx,ty+L*.026*(0.5+m));ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();
  /* 眼 */
  const ex=L*.355,ey=-h*.30,er=Math.max(1.7,L*.026);
  ctx.fillStyle=o.eyeCol||'#0d1418';
  ctx.beginPath();ctx.arc(ex,ey,er,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.arc(ex-er*.3,ey-er*.34,er*.34,0,TAU);ctx.fill();
}

/* ============================== 生物绘制 ============================== */
function fishShape(L,col,tailPhase,belly){
  const h=L*.34;
  ctx.save();ctx.translate(-L*.40,0);ctx.rotate(Math.sin(tailPhase)*.42);
  ctx.fillStyle=col[1];
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-L*.28,-h*.95);
  ctx.quadraticCurveTo(-L*.17,0,-L*.28,h*.95);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle=col[1];
  ctx.beginPath();ctx.moveTo(L*.04,-h*.80);
  ctx.quadraticCurveTo(-L*.05,-h*1.75,-L*.19,-h*.74);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-L*.04,h*.72);
  ctx.quadraticCurveTo(-L*.12,h*1.42,-L*.22,h*.62);ctx.closePath();ctx.fill();
  ctx.fillStyle=col[0];
  ctx.beginPath();
  ctx.moveTo(L*.50,0);
  ctx.quadraticCurveTo(L*.12,-h*1.10,-L*.40,-h*.14);
  ctx.quadraticCurveTo(-L*.42,h*.10,-L*.40,h*.14);
  ctx.quadraticCurveTo(L*.12,h*1.10,L*.50,0);
  ctx.closePath();ctx.fill();
  if(belly){
    ctx.save();ctx.clip();
    ctx.fillStyle=belly;
    ctx.beginPath();ctx.ellipse(0,h*.62,L*.44,h*.52,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.beginPath();ctx.ellipse(L*.10,-h*.42,L*.20,h*.16,-.2,0,TAU);ctx.fill();
  ctx.fillStyle='#101820';
  ctx.beginPath();ctx.arc(L*.30,-h*.16,Math.max(1.2,L*.055),0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(L*.315,-h*.20,Math.max(.5,L*.02),0,TAU);ctx.fill();
}

function drawCreatureShape(c){
  const L=c.len,col=c.col,t=c.t;
  switch(c.sp.draw){
    case 'fish': fishShape(L,col,t*7+c.phase,col[2]);break;
    case 'jelly':{
      const pu=Math.sin(t*1.9+c.phase);
      const w=L*.52*(1+pu*.13),hh=L*.42*(1-pu*.16);
      const g=ctx.createRadialGradient(0,-hh*.2,L*.05,0,0,L*.6);
      g.addColorStop(0,col[2]);g.addColorStop(.55,col[0]);g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha=.9;
      ctx.fillStyle=g;
      ctx.beginPath();ctx.ellipse(0,-hh*.15,w,hh,0,Math.PI,0);ctx.fill();
      ctx.fillStyle=col[0];ctx.globalAlpha=.55;
      ctx.beginPath();ctx.ellipse(0,-hh*.1,w*.94,hh*.62,0,Math.PI,0);ctx.fill();
      ctx.globalAlpha=.72;
      ctx.strokeStyle=col[1];ctx.lineWidth=Math.max(1,L*.028);
      for(let i=-3;i<=3;i++){
        ctx.beginPath();ctx.moveTo(i*w*.24,-hh*.05);
        for(let s=1;s<=4;s++){
          const f=s/4;
          ctx.lineTo(i*w*.24+Math.sin(t*2.6+i*.9+f*3.2)*L*.10*f,-hh*.05+L*.62*f);
        }
        ctx.stroke();
      }
      for(let i=-1;i<=1;i++){
        ctx.beginPath();ctx.moveTo(i*w*.3,-hh*.05);
        ctx.quadraticCurveTo(i*w*.42+Math.sin(t*1.8+i)*L*.08,L*.24,i*w*.30+Math.sin(t*2.1+i)*L*.14,L*.52);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
      break;
    }
    case 'gull':{
      const f=Math.sin(c.flap);
      ctx.fillStyle=col[0];
      ctx.beginPath();ctx.ellipse(0,0,L*.30,L*.13,0,0,TAU);ctx.fill();
      ctx.fillStyle=col[1];
      for(const s of[-1,1]){
        ctx.save();ctx.scale(1,s);
        ctx.beginPath();ctx.moveTo(-L*.05,0);
        ctx.quadraticCurveTo(L*.02,-L*.30*(.55+f*.55),-L*.20,-L*.42*(.5+f*.6));
        ctx.quadraticCurveTo(-L*.12,-L*.10,-L*.24,0);
        ctx.closePath();ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle=col[0];
      ctx.beginPath();ctx.ellipse(L*.30,-L*.02,L*.11,L*.085,0,0,TAU);ctx.fill();
      ctx.fillStyle=col[2];
      ctx.beginPath();ctx.moveTo(L*.38,-L*.02);ctx.lineTo(L*.52,L*.01);ctx.lineTo(L*.38,L*.045);ctx.closePath();ctx.fill();
      ctx.fillStyle='#141a20';ctx.beginPath();ctx.arc(L*.33,-L*.045,L*.020+1,0,TAU);ctx.fill();
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(-L*.26,0);ctx.lineTo(-L*.44,-L*.09);ctx.lineTo(-L*.44,L*.09);ctx.closePath();ctx.fill();
      break;
    }
    case 'turtle':{
      const h=L*.34;
      ctx.fillStyle=col[2];
      for(const s of[-1,1]){
        ctx.save();ctx.scale(1,s);
        const sw=Math.sin(t*2.4+c.phase+s*.6)*.42;
        ctx.translate(L*.14,h*.55);ctx.rotate(sw+.5);
        ctx.beginPath();ctx.ellipse(0,L*.14,L*.10,L*.22,0,0,TAU);ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle=col[2];
      ctx.beginPath();ctx.ellipse(-L*.28,h*.30,L*.10,L*.16,.5,0,TAU);ctx.fill();
      ctx.beginPath();ctx.ellipse(L*.42,-h*.05,L*.11,L*.09,0,0,TAU);ctx.fill();
      ctx.fillStyle='#1a2018';
      ctx.beginPath();ctx.arc(L*.48,-h*.13,L*.028+1,0,TAU);ctx.fill();
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.ellipse(0,0,L*.42,h*.92,0,0,TAU);ctx.fill();
      ctx.fillStyle=col[0];
      ctx.beginPath();ctx.ellipse(0,-h*.10,L*.40,h*.80,0,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(30,44,20,.42)';ctx.lineWidth=Math.max(1,L*.018);
      for(let i=-2;i<=2;i++){
        ctx.beginPath();ctx.ellipse(i*L*.13,-h*.10,L*.075,h*.30,0,0,TAU);ctx.stroke();
      }
      ctx.beginPath();ctx.ellipse(0,-h*.10,L*.40,h*.80,0,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.14)';
      ctx.beginPath();ctx.ellipse(-L*.08,-h*.52,L*.20,h*.22,-.2,0,TAU);ctx.fill();
      break;
    }
    case 'puffer':{
      const inf=c.inflate;
      const R=L*(.34+inf*.24);
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(-R*.85,0);ctx.lineTo(-R*1.5,-R*.62);ctx.lineTo(-R*1.5,R*.62);ctx.closePath();ctx.fill();
      ctx.strokeStyle=col[2];ctx.lineWidth=Math.max(1,L*.030);
      const n=Math.round(12+inf*10);
      for(let i=0;i<n;i++){
        const a=(i/n)*TAU+t*.25;
        const sp=(L*.05+inf*L*.13);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*R*.92,Math.sin(a)*R*.92);
        ctx.lineTo(Math.cos(a)*(R+sp),Math.sin(a)*(R+sp));
        ctx.stroke();
      }
      const g=ctx.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R*1.1);
      g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.16)';
      ctx.beginPath();ctx.ellipse(-R*.28,-R*.34,R*.34,R*.22,-.4,0,TAU);ctx.fill();
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(R*.55,-R*.55);ctx.quadraticCurveTo(R*1.0,-R*.9,R*1.05,-R*.25);
      ctx.quadraticCurveTo(R*.85,-R*.35,R*.68,-R*.20);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(R*.46,-R*.20,L*.055+1.4,0,TAU);ctx.fill();
      ctx.fillStyle='#12181c';
      ctx.beginPath();ctx.arc(R*.50,-R*.20,L*.030+.8,0,TAU);ctx.fill();
      if(inf>.4){
        ctx.fillStyle='rgba(40,20,10,.8)';
        ctx.beginPath();ctx.arc(R*.60,R*.20,L*.05*(0.5+inf),0,TAU);ctx.fill();
      }
      break;
    }
    case 'squid':{
      const h=L*.20;
      ctx.strokeStyle=col[1];ctx.lineWidth=Math.max(1.2,L*.032);
      for(let i=0;i<8;i++){
        const a=(i/7-.5)*1.15+Math.PI;
        ctx.beginPath();ctx.moveTo(-L*.30,Math.sin(a)*h*.5);
        for(let s=1;s<=4;s++){
          const f=s/4;
          ctx.lineTo(-L*.30-Math.cos(a)*L*.40*f*-1-L*.34*f,Math.sin(a)*h*.5+Math.sin(t*4+i*.8+f*4)*L*.07*f);
        }
        ctx.stroke();
      }
      const g=ctx.createLinearGradient(0,-h,0,h);
      g.addColorStop(0,col[2]);g.addColorStop(.5,col[0]);g.addColorStop(1,col[1]);
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(L*.52,0);
      ctx.quadraticCurveTo(L*.20,-h*1.25,-L*.24,-h*.85);
      ctx.quadraticCurveTo(-L*.34,0,-L*.24,h*.85);
      ctx.quadraticCurveTo(L*.20,h*1.25,L*.52,0);
      ctx.closePath();ctx.fill();
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(-L*.20,-h*.8);ctx.lineTo(-L*.44,-h*1.7);ctx.lineTo(-L*.14,-h*.4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-L*.20,h*.8);ctx.lineTo(-L*.44,h*1.7);ctx.lineTo(-L*.14,h*.4);ctx.closePath();ctx.fill();
      ctx.fillStyle='#f6f2e8';
      ctx.beginPath();ctx.arc(L*.30,-h*.30,L*.075+1.4,0,TAU);ctx.fill();
      ctx.fillStyle='#141018';
      ctx.beginPath();ctx.arc(L*.33,-h*.30,L*.038+.8,0,TAU);ctx.fill();
      break;
    }
    case 'ray':{
      const flap=Math.sin(t*2.1+c.phase)*.34;
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(-L*.30,0);ctx.lineTo(-L*.62,-L*.05);ctx.lineTo(-L*.50,0);ctx.lineTo(-L*.62,L*.05);ctx.closePath();ctx.fill();
      ctx.strokeStyle=col[2];ctx.lineWidth=Math.max(1.4,L*.022);
      ctx.beginPath();ctx.moveTo(-L*.32,0);
      ctx.quadraticCurveTo(-L*.62,Math.sin(t*3)*L*.06,-L*.92,Math.sin(t*3+.6)*L*.10);ctx.stroke();
      const g=ctx.createLinearGradient(0,-L*.4,0,L*.4);
      g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);
      ctx.fillStyle=g;
      ctx.save();ctx.scale(1,1+flap*.25);
      ctx.beginPath();
      ctx.moveTo(L*.44,0);
      ctx.quadraticCurveTo(L*.16,-L*.16,-L*.04,-L*.44);
      ctx.quadraticCurveTo(-L*.20,-L*.30,-L*.32,0);
      ctx.quadraticCurveTo(-L*.20,L*.30,-L*.04,L*.44);
      ctx.quadraticCurveTo(L*.16,L*.16,L*.44,0);
      ctx.closePath();ctx.fill();
      ctx.restore();
      ctx.fillStyle=col[2];
      ctx.beginPath();ctx.ellipse(L*.16,L*.05,L*.10,L*.05,0,0,TAU);ctx.fill();
      ctx.fillStyle='#121a20';
      ctx.beginPath();ctx.arc(L*.30,-L*.055,L*.021+1,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(L*.30,L*.055,L*.021+1,0,TAU);ctx.fill();
      break;
    }
    case 'sword':{
      const h=L*.13;
      ctx.fillStyle=col[1];
      ctx.beginPath();ctx.moveTo(-L*.34,0);ctx.lineTo(-L*.54,-h*1.5);ctx.lineTo(-L*.46,0);ctx.lineTo(-L*.54,h*1.5);ctx.closePath();ctx.fill();
      ctx.fillStyle=col[2];
      ctx.beginPath();ctx.moveTo(L*.02,-h*.9);ctx.quadraticCurveTo(-L*.04,-h*2.5,-L*.20,-h*2.1);
      ctx.quadraticCurveTo(-L*.14,-h*1.2,-L*.16,-h*.7);ctx.closePath();ctx.fill();
      const g=ctx.createLinearGradient(0,-h,0,h);
      g.addColorStop(0,col[2]);g.addColorStop(.42,col[0]);g.addColorStop(1,col[1]);
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(L*.50,-h*.05);
      ctx.quadraticCurveTo(L*.10,-h*1.15,-L*.34,-h*.20);
      ctx.quadraticCurveTo(-L*.36,h*.10,-L*.34,h*.22);
      ctx.quadraticCurveTo(L*.10,h*1.10,L*.50,h*.06);
