function drawCreatures(){
  applyCam(1);
  /* 先画远的小生物，再画大的，层次感 */
  const list=creatures;
  for(let i=0;i<list.length;i++){
    const c=list[i];
    if(!inView(c,c.len+220))continue;
    ctx.save();
    ctx.translate(c.x,c.y);
    const a=c.ang;
    const flipSide=(a>Math.PI/2||a<-Math.PI/2);
    if(c.sp.draw==='boat'){ctx.scale(c.ang===0?1:-1,1);}
    else if(flipSide){ctx.rotate(a+Math.PI);ctx.scale(-1,1);}
    else ctx.rotate(a);
    ctx.globalAlpha=c.type==='jelly'?.96:1;
    drawCreatureShape(c);
    ctx.globalAlpha=1;
    if(c.flash>0){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=c.flash*.5;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(0,0,c.len*.5,c.len*.34,0,0,TAU);ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    /* 威胁标记 */
    if(c.hunting&&!c.dead){
      const p=.5+Math.sin(G.time*9)*.5;
      ctx.save();
      ctx.translate(c.x,c.y-c.len*.55-16);
      ctx.fillStyle='rgba(255,70,60,'+(.55+p*.45)+')';
      ctx.font='900 '+(15+c.len*.05).toFixed(0)+'px system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('!',0,0);
      ctx.restore();
    }
    if(c.sp.hp>2&&c.hp<c.maxHp&&c.hp>0){
      const w=c.len*.7,hh=4;
      ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.fillRect(c.x-w/2,c.y-c.len*.5-10,w,hh);
      ctx.fillStyle='#ff6a5a';
      ctx.fillRect(c.x-w/2,c.y-c.len*.5-10,w*(c.hp/c.maxHp),hh);
    }
  }
}

/* ============================== 玩家绘制 ============================== */
function drawPlayer(){
  applyCam(1);
  const s=spec();
  const blink=(P.inv>0&&P.frenzy<=0&&Math.floor(P.inv*14)%2===0);
  ctx.save();
  ctx.translate(P.x,P.y+Math.sin(P.bob)*P.len*.014);
  if(P.ang>Math.PI/2||P.ang<-Math.PI/2){ctx.rotate(P.ang+Math.PI);ctx.scale(-1,1);}
  else ctx.rotate(P.ang);
  if(blink)ctx.globalAlpha=.42;

  /* 狂暴光环 */
  if(P.frenzy>0){
    const pulse=.55+Math.sin(G.time*11)*.2;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,0,P.len*.2,0,0,P.len*1.05);
    g.addColorStop(0,'rgba(255,200,80,0)');
    g.addColorStop(.72,'rgba(255,190,60,'+(.20*pulse)+')');
    g.addColorStop(1,'rgba(255,150,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,P.len*1.05,P.len*.62,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  if(s.glow){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,0,P.len*.1,0,0,P.len*.95);
    g.addColorStop(0,'rgba(190,110,255,.24)');g.addColorStop(1,'rgba(150,70,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,P.len*.95,P.len*.55,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  /* 冲刺拖尾 */
  if(P.dashing){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(160,225,255,.16)';
    ctx.beginPath();ctx.ellipse(-P.len*.55,0,P.len*.55,P.len*.13,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  drawSharkShape(P.len,{
    col:[s.top,s.fin,s.bot],tail:P.tail,mouth:P.mouth,
    stripes:s.stripes,scars:s.scars,
    eyeCol:(P.frenzy>0?'#ff3b2a':(s.glow?'#ff4bd8':s.eye)),
    dark:s.glow?'#120b1e':null,
    line:s.glow?'rgba(200,120,255,.5)':'rgba(6,18,28,.5)'
  });
  /* 护盾 */
  if(P.shield>0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const a=P.shield<2?(.25+Math.sin(G.time*18)*.2):.38;
    ctx.strokeStyle='rgba(150,230,255,'+a+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,P.len*.66,P.len*.40,0,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(120,215,255,.10)';
    ctx.beginPath();ctx.ellipse(0,0,P.len*.66,P.len*.40,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  if(P.hitFlash>0){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=P.hitFlash*.5;
    ctx.fillStyle='#ff4030';
    ctx.beginPath();ctx.ellipse(0,0,P.len*.55,P.len*.28,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ============================== Boss 绘制 ============================== */
function drawBoss(){
  const b=G.boss;if(!b)return;
  applyCam(1);
  const dying=b.dead?clamp(1-b.dying/2.4,0,1):1;
  ctx.save();ctx.globalAlpha=dying;
  /* 触手 */
  for(const t of b.tent){
    const n=t.segs.length;
    ctx.lineCap='round';
    for(let pass=0;pass<2;pass++){
      ctx.beginPath();
      ctx.moveTo(t.segs[0].x,t.segs[0].y);
      for(let j=1;j<n;j++)ctx.lineTo(t.segs[j].x,t.segs[j].y);
      ctx.lineWidth=(pass===0?b.len*.085:b.len*.052);
      ctx.strokeStyle=pass===0?'#2a1140':'#54227a';
      ctx.stroke();
    }
    /* 吸盘 */
    ctx.fillStyle='rgba(226,150,255,.55)';
    for(let j=3;j<n;j+=2){
      const s=t.segs[j],r=b.len*.020*(1-j/n*.6)+1.4;
      ctx.beginPath();ctx.arc(s.x,s.y,r,0,TAU);ctx.fill();
    }
    /* 尖端 */
    const tip=t.segs[n-1];
    ctx.fillStyle=t.slam>0?'#ff7a5a':'#7a3bb0';
    ctx.beginPath();ctx.arc(tip.x,tip.y,t.tipR*.55,0,TAU);ctx.fill();
    if(t.slam>0&&t.slam<1){
      ctx.strokeStyle='rgba(255,90,70,'+(.30+Math.sin(G.time*20)*.22)+')';
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(tip.x,tip.y,t.tipR*1.7,0,TAU);ctx.stroke();
    }
    if(t.hurt>0){
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=t.hurt;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tip.x,tip.y,t.tipR,0,TAU);ctx.fill();ctx.restore();
    }
    ctx.lineCap='butt';
  }
  /* 外套膜 */
  const L=b.len;
  ctx.save();
  ctx.translate(b.x,b.y);
  const fa=b.ang;
  if(fa>Math.PI/2||fa<-Math.PI/2){ctx.rotate(fa+Math.PI);ctx.scale(-1,1);}else ctx.rotate(fa);
  const g=ctx.createRadialGradient(-L*.06,-L*.10,L*.05,0,0,L*.44);
  g.addColorStop(0,'#6b2f9c');g.addColorStop(.55,'#3d1a5e');g.addColorStop(1,'#1c0b2e');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(L*.30,0);
  ctx.quadraticCurveTo(L*.22,-L*.24,-L*.04,-L*.30);
  ctx.quadraticCurveTo(-L*.34,-L*.28,-L*.40,0);
  ctx.quadraticCurveTo(-L*.34,L*.28,-L*.04,L*.30);
  ctx.quadraticCurveTo(L*.22,L*.24,L*.30,0);
  ctx.closePath();ctx.fill();
  ctx.save();ctx.clip();
  ctx.fillStyle='rgba(220,150,255,.16)';
  for(let i=0;i<14;i++){
    const a=(i/14)*TAU+b.t*.2;
    ctx.beginPath();ctx.ellipse(Math.cos(a)*L*.20,Math.sin(a)*L*.17,L*.055,L*.038,a,0,TAU);ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='rgba(230,170,255,.35)';ctx.lineWidth=Math.max(1.5,L*.006);
  ctx.beginPath();
  ctx.moveTo(L*.30,0);
  ctx.quadraticCurveTo(L*.22,-L*.24,-L*.04,-L*.30);
  ctx.quadraticCurveTo(-L*.34,-L*.28,-L*.40,0);
  ctx.quadraticCurveTo(-L*.34,L*.28,-L*.04,L*.30);
  ctx.quadraticCurveTo(L*.22,L*.24,L*.30,0);
  ctx.closePath();ctx.stroke();
  /* 眼 */
  const vuln=b.state==='vulnerable';
  const ex=L*.16,ey=-L*.055,er=L*.062;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const eg=ctx.createRadialGradient(ex,ey,1,ex,ey,er*3.4);
  eg.addColorStop(0,vuln?'rgba(255,220,120,.85)':'rgba(255,90,60,.55)');
  eg.addColorStop(1,'rgba(255,80,40,0)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,ey,er*3.4,0,TAU);ctx.fill();
  ctx.restore();
  ctx.fillStyle=vuln?'#ffd76a':'#ffe9c8';
  ctx.beginPath();ctx.ellipse(ex,ey,er,er*.82,0,0,TAU);ctx.fill();
  ctx.fillStyle='#180810';
  const px=clamp((P.x-b.x)*.0015,-1,1)*er*.34, py=clamp((P.y-b.y)*.0015,-1,1)*er*.3;
  ctx.beginPath();ctx.ellipse(ex+px,ey+py,er*.42,er*.56,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ff5a3c';
  ctx.beginPath();ctx.ellipse(ex+px,ey+py,er*.20,er*.34,0,0,TAU);ctx.fill();
  /* 第二只眼 */
  ctx.fillStyle=vuln?'rgba(255,215,106,.5)':'rgba(255,233,200,.45)';
  ctx.beginPath();ctx.ellipse(L*.14,L*.075,er*.55,er*.45,0,0,TAU);ctx.fill();
  /* 喙 */
  ctx.fillStyle='#120820';
  ctx.beginPath();ctx.moveTo(L*.30,0);ctx.lineTo(L*.40,-L*.045);ctx.lineTo(L*.40,L*.045);ctx.closePath();ctx.fill();
  if(vuln){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(255,215,110,'+(.5+Math.sin(G.time*12)*.35)+')';
    ctx.lineWidth=Math.max(2,L*.008);
    ctx.beginPath();ctx.ellipse(L*.10,0,L*.34,L*.34,0,0,TAU);ctx.stroke();
    ctx.restore();
  }
  if(b.flash>0){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=b.flash*.45;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,L*.42,L*.32,0,0,TAU);ctx.fill();ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}

/* ============================== 弹药 / 道具 / 粒子 ============================== */
function drawShots(){
  applyCam(1);
  for(const s of shots){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);
    if(s.type==='harpoon'){
      ctx.strokeStyle='#c9b48c';ctx.lineWidth=3.4;
      ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(16,0);ctx.stroke();
      ctx.fillStyle='#dfe8ee';
      ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(12,-6);ctx.lineTo(12,6);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(220,240,255,.35)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-70,Math.sin(s.t*20)*5);ctx.stroke();
    }else if(s.type==='bomb'){
      const bl=(s.fuse<1&&Math.sin(s.t*26)>0)?1:.35;
      ctx.fillStyle='#2b3238';ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,120,60,'+bl+')';ctx.beginPath();ctx.arc(0,-6,4,0,TAU);ctx.fill();
      ctx.strokeStyle='#59636b';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-21);ctx.stroke();
      if(bl>.8){
        ctx.save();ctx.globalCompositeOperation='lighter';
        const g=ctx.createRadialGradient(0,-20,1,0,-20,20);
        g.addColorStop(0,'rgba(255,200,120,.7)');g.addColorStop(1,'rgba(255,150,60,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-20,20,0,TAU);ctx.fill();ctx.restore();
      }
    }else{
      ctx.fillStyle='rgba(38,18,62,.92)';
      ctx.beginPath();
      for(let i=0;i<7;i++){
        const a=(i/7)*TAU,rr=11+Math.sin(s.t*6+i*1.7)*4;
        const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(150,90,220,.35)';
      ctx.beginPath();ctx.arc(-3,-3,4,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}
function drawPickups(){
  applyCam(1);
  for(const p of pickups){
    const fade=p.life-p.t<3?(.35+Math.abs(Math.sin(p.t*9))*.65):1;
    ctx.save();ctx.globalAlpha=fade;ctx.translate(p.x,p.y);
    if(p.type==='coin'){
      const sq=Math.abs(Math.cos(p.t*3.4));
      ctx.save();ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(0,0,1,0,0,20);
      g.addColorStop(0,'rgba(255,215,110,.42)');g.addColorStop(1,'rgba(255,200,80,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.fill();ctx.restore();
      ctx.fillStyle='#ffd76a';
      ctx.beginPath();ctx.ellipse(0,0,8.5*(.35+sq*.65),8.5,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#a97a1e';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(0,0,8.5*(.35+sq*.65),8.5,0,0,TAU);ctx.stroke();
      if(sq>.5){ctx.fillStyle='rgba(255,255,240,.85)';ctx.beginPath();ctx.ellipse(-2,-2.6,2.4,1.8,-.5,0,TAU);ctx.fill();}
    }else if(p.type==='meat'){
      ctx.save();ctx.rotate(Math.sin(p.t*2)*.3);
      ctx.fillStyle='#c0453c';
      ctx.beginPath();
      ctx.moveTo(-16,-6);ctx.quadraticCurveTo(-4,-18,12,-10);
      ctx.quadraticCurveTo(20,0,10,12);ctx.quadraticCurveTo(-6,18,-16,7);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,220,210,.55)';
      ctx.beginPath();ctx.ellipse(-4,-4,7,4,-.4,0,TAU);ctx.fill();
      ctx.fillStyle='#f0e6d8';
      ctx.beginPath();ctx.ellipse(13,7,5,3.4,.5,0,TAU);ctx.fill();
      ctx.restore();
    }else if(p.type==='frenzy'){
      const pu=1+Math.sin(p.t*6)*.13;
      ctx.save();ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(0,0,2,0,0,34*pu);
      g.addColorStop(0,'rgba(255,220,110,.75)');g.addColorStop(1,'rgba(255,160,30,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34*pu,0,TAU);ctx.fill();ctx.restore();
      ctx.save();ctx.rotate(p.t*1.4);ctx.scale(pu,pu);
      ctx.fillStyle='#ffd76a';
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=(i/10)*TAU-Math.PI/2,r=i%2?6.4:15;
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#b06a10';ctx.lineWidth=1.4;ctx.stroke();
      ctx.restore();
    }else{
      ctx.save();ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(0,0,2,0,0,30);
      g.addColorStop(0,'rgba(140,225,255,.5)');g.addColorStop(1,'rgba(100,200,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,30,0,TAU);ctx.fill();ctx.restore();
      ctx.strokeStyle='rgba(190,240,255,.9)';ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(0,0,13+Math.sin(p.t*4)*1.4,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(140,215,255,.22)';
      ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.beginPath();ctx.ellipse(-4.5,-5,3.4,2.2,-.6,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}
function drawParticles(){
  applyCam(1);
  for(const p of parts){
    const k=1-p.t/p.life;
    if(p.k==='bub'){
      ctx.strokeStyle=p.col;ctx.globalAlpha=k*.85;ctx.lineWidth=1.1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();
      ctx.globalAlpha=k*.4;ctx.fillStyle='rgba(230,250,255,.8)';
      ctx.beginPath();ctx.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.32,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }else if(p.k==='spark'){
      ctx.strokeStyle=p.col;ctx.globalAlpha=k;ctx.lineWidth=p.r*.85;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.022,p.y-p.vy*.022);ctx.stroke();
      ctx.lineCap='butt';ctx.globalAlpha=1;
    }else if(p.k==='drop'){
      ctx.fillStyle=p.col;ctx.globalAlpha=k;
      ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*1.5,Math.atan2(p.vy,p.vx)+Math.PI/2,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=p.col;ctx.globalAlpha=k*.85;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.6+k*.7),0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  for(const r of rings){
    const k=r.t/r.life;
    ctx.strokeStyle=r.col;ctx.globalAlpha=(1-k)*.8;ctx.lineWidth=Math.max(1.5,(1-k)*9);
    ctx.beginPath();ctx.arc(r.x,r.y,lerp(r.r,r.rr,k),0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawTexts(){
  applyCam(1);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of texts){
    const k=1-t.t/t.life;
    ctx.globalAlpha=Math.min(1,k*1.7);
    ctx.font='900 '+t.size+'px system-ui,"Segoe UI","Microsoft YaHei",sans-serif';
    ctx.lineWidth=3.4;ctx.strokeStyle='rgba(2,12,22,.82)';
    ctx.strokeText(t.str,t.x,t.y);
    ctx.fillStyle=t.col;ctx.fillText(t.str,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawBioGlow(){
  applyCam(1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const c of creatures){
    if(c.sp.draw!=='angler'||!inView(c,200))continue;
    const lx=c.x+Math.cos(c.ang)*c.len*.5,ly=c.y+Math.sin(c.ang)*c.len*.5;
    const g=ctx.createRadialGradient(lx,ly,1,lx,ly,c.len*1.5);
    g.addColorStop(0,'rgba(255,232,140,.34)');g.addColorStop(1,'rgba(255,220,110,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,ly,c.len*1.5,0,TAU);ctx.fill();
  }
  if(G.boss&&!G.boss.dead){
    const b=G.boss;
    const hx=b.x+Math.cos(b.ang)*b.len*.16,hy=b.y+Math.sin(b.ang)*b.len*.16;
    const g=ctx.createRadialGradient(hx,hy,2,hx,hy,b.len*.5);
    g.addColorStop(0,'rgba(255,80,50,.24)');g.addColorStop(1,'rgba(255,60,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,b.len*.5,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function drawDepthFog(){
  applyCam(1);
  const g=ctx.createLinearGradient(0,1450,0,WORLD.bottom);
  g.addColorStop(0,'rgba(2,10,20,0)');
  g.addColorStop(.35,'rgba(2,10,20,.34)');
  g.addColorStop(.72,'rgba(1,7,15,.62)');
  g.addColorStop(1,'rgba(0,4,10,.82)');
  ctx.fillStyle=g;
  ctx.fillRect(G.camX-40,1450,view.w+80,WORLD.bottom-1450);
}
function drawWalls(){
  applyCam(1);
  for(const side of[0,1]){
    const x=side?WORLD.right:WORLD.left;
    const dir=side?-1:1;
    ctx.fillStyle=gradWall;
    ctx.beginPath();
    ctx.moveTo(x,WORLD.top);
    for(let y=WORLD.top;y<=FLOOR_Y+60;y+=130){
      ctx.lineTo(x+dir*(110+hash1(Math.round(y/130)*7+side*91)*70),y);
    }
    ctx.lineTo(x,FLOOR_Y+80);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(120,200,240,.05)';
    ctx.beginPath();
    ctx.moveTo(x,WORLD.top);
    for(let y=WORLD.top;y<=FLOOR_Y+60;y+=130){
      ctx.lineTo(x+dir*(110+hash1(Math.round(y/130)*7+side*91)*70),y);
    }
    ctx.lineTo(x+dir*40,FLOOR_Y+80);ctx.lineTo(x,WORLD.top);ctx.closePath();ctx.fill();
  }
}
function drawScreenFx(){
  applyScreen();
  /* 屏外威胁 / Boss 指示 */
  const marks=[];
  if(G.boss&&!G.boss.dead)marks.push({x:G.boss.x,y:G.boss.y,c:'#ff5a4a',big:true});
  for(const c of creatures){
    if(!c.hunting)continue;
    if(c.x>G.camX-40&&c.x<G.camX+view.w+40&&c.y>G.camY-40&&c.y<G.camY+view.h+40)continue;
    marks.push({x:c.x,y:c.y,c:'#ff8a5a',big:false});
  }
  for(const m of marks){
    const sx=(m.x-G.camX)*G.zoom+G.shx, sy=(m.y-G.camY)*G.zoom+G.shy;
    const pad=m.big?54:34;
    const cx=clamp(sx,pad,VW-pad),cy=clamp(sy,pad,VH-pad);
    const a=Math.atan2(sy-VH/2,sx-VW/2);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
    ctx.globalAlpha=m.big?(.65+Math.sin(G.time*7)*.3):.5;
    ctx.fillStyle=m.c;
    const s=m.big?15:10;
    ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s*.7,-s*.72);ctx.lineTo(-s*.35,0);ctx.lineTo(-s*.7,s*.72);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  /* 准星 */
  if(mouse.used&&G.state==='play'){
    ctx.save();
    ctx.globalAlpha=.55;
    ctx.strokeStyle=P.frenzy>0?'#ffd76a':'#bfeaff';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,11,0,TAU);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouse.x-17,mouse.y);ctx.lineTo(mouse.x-6,mouse.y);
    ctx.moveTo(mouse.x+6,mouse.y);ctx.lineTo(mouse.x+17,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-17);ctx.lineTo(mouse.x,mouse.y-6);
    ctx.moveTo(mouse.x,mouse.y+6);ctx.lineTo(mouse.x,mouse.y+17);
    ctx.stroke();ctx.restore();
  }
  /* 全屏闪光 */
  if(G.flash>0){
    ctx.fillStyle='rgba('+G.flashCol+','+(G.flash*.55).toFixed(3)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  /* 狂暴滤镜 */
  if(P.frenzy>0){
    ctx.save();ctx.globalCompositeOperation='overlay';
    ctx.fillStyle='rgba(255,170,40,'+(.10+Math.sin(G.time*8)*.04)+')';
    ctx.fillRect(0,0,VW,VH);ctx.restore();
  }
  /* 低饥饿心跳 */
  if(G.state==='play'){
    const ratio=P.hunger/P.maxHunger;
    if(ratio<.28){
      const beat=Math.pow(Math.abs(Math.sin(G.time*(ratio<.12?5.2:3.1))),3);
      ctx.save();
      const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.24,VW/2,VH/2,Math.max(VW,VH)*.72);
      g.addColorStop(0,'rgba(150,0,10,0)');
      g.addColorStop(1,'rgba(150,0,10,'+(.20+beat*.40*(1-ratio/.28))+')');
      ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);ctx.restore();
    }
    if(P.poison>0){
      ctx.fillStyle='rgba(90,180,40,'+(.07+Math.sin(G.time*4)*.03)+')';ctx.fillRect(0,0,VW,VH);
    }
    if(P.paralyze>0){
      ctx.fillStyle='rgba(160,90,255,'+(.10)+')';ctx.fillRect(0,0,VW,VH);
    }
  }
}

/* ============================== HUD ============================== */
let hudCache={};
function setTxt(el,v){if(hudCache[el.id]!==v){hudCache[el.id]=v;el.textContent=v;}}
function setW(el,v){const s=v.toFixed(1)+'%';if(hudCache['w'+el.id]!==s){hudCache['w'+el.id]=s;el.style.width=s;}}
function updateHUD(){
  const s=spec();
  setTxt(D.sharkName,s.name);
  setTxt(D.sharkLv,'LV.'+(P.tier+1)+' · '+s.en);
  const hr=clamp(P.hunger/P.maxHunger,0,1);
  setW(D.hungerFill,hr*100);
  setTxt(D.hungerTxt,'饱食度 '+Math.ceil(P.hunger)+' / '+P.maxHunger);
  D.left.classList.toggle('low',hr<.25);
  if(P.tier>=SHARKS.length-1){setW(D.xpFill,100);setTxt(D.xpTxt,'终极形态 · 无尽吞噬');}
  else{setW(D.xpFill,clamp(P.xp/s.need,0,1)*100);setTxt(D.xpTxt,'进化 '+Math.floor(P.xp)+' / '+s.need);}
  setTxt(D.coinTxt,String(P.coins));
  const cm=comboMult();
  D.comboRow.classList.toggle('on',P.combo>1);
  setTxt(D.comboTxt,'x'+cm.toFixed(1)+(P.combo>1?' ('+P.combo+')':''));
  setW(D.comboFill,clamp(P.comboT/2.9,0,1)*100);
  const depth=P.y<=SURFACE_Y?0:Math.round((P.y-SURFACE_Y)*.13);
  setTxt(D.depthTxt,depth+' m');
  setTxt(D.timeTxt,fmtTime(G.time));
  setW(D.dashFill,clamp(P.dash/100,0,1)*100);
  D.dashWrap.classList.toggle('empty',P.dash<12);
  const on=(el,v)=>el.classList.toggle('on',v>0);
  on(D.buffFrenzy,P.frenzy);on(D.buffShield,P.shield);on(D.buffPoison,P.poison);on(D.buffStun,P.paralyze);
  if(P.frenzy>0)setTxt(D.buffFrenzy,'狂暴 '+P.frenzy.toFixed(1)+'s');
  if(P.shield>0)setTxt(D.buffShield,'护盾 '+P.shield.toFixed(1)+'s');
  if(G.boss&&!G.boss.dead){
    D.bossWrap.classList.add('on');
    setW(D.bossFill,clamp(G.boss.hp/G.boss.maxHp,0,1)*100);
  }
  const low=hr<.25;
  D.vignette.classList.toggle('danger',low&&G.state==='play');
  if(P.frenzy<=0)D.vignette.classList.remove('gold');
}
let bannerTO=null;
function showBanner(title,sub,col){
  D.banner.innerHTML=title+(sub?'<small>'+sub+'</small>':'');
  D.banner.style.color=col||'#c8fbff';
  D.banner.classList.remove('show');
  void D.banner.offsetWidth;
  D.banner.classList.add('show');
  if(bannerTO)clearTimeout(bannerTO);
  bannerTO=setTimeout(()=>D.banner.classList.remove('show'),2200);
}

/* ============================== 界面 / 流程 ============================== */
function showMenu(){
  G.state='menu';
  D.hud.classList.remove('on');
  D.screen.classList.remove('hide');
  D.screen.innerHTML=
   '<div class="card">'+
   '<h1>深渊猎手</h1>'+
   '<div class="sub">ABYSS PREDATOR</div>'+
   '<div class="rule"></div>'+
   '<div class="keys">'+
     '<span><kbd>鼠标</kbd> 转向游动</span>'+
     '<span><kbd>WASD</kbd><kbd>↑↓←→</kbd> 键盘操控</span>'+
     '<span><kbd>空格</kbd>/<kbd>左键</kbd> 冲刺</span>'+
     '<span><kbd>P</kbd> 暂停</span>'+
     '<span><kbd>M</kbd> 静音</span>'+
   '</div>'+
   '<div class="tip">吃掉比你小的生物填饱肚子、积攒进化；撞上比你大的家伙会掉饱食度。<br>'+
   '饱食度归零即死亡 —— 它既是你的胃，也是你的命。<br>'+
   '连续进食可叠出连击倍率，进化更快。冲到巨齿鲨形态，深渊霸主会来找你。</div>'+
   '<button class="btn" id="startBtn">开 始 狩 猎</button>'+
   (G.best>0?'<div class="tip" style="margin-top:14px;color:#ffd76a">历史最佳 '+G.best+' 金币 · '+SHARKS[Math.min(G.bestTier,5)].name+'</div>':'')+
   '</div>';
  D.screen.style.pointerEvents='auto';
  $('startBtn').addEventListener('click',()=>{SFX.init();SFX.resume();startGame();});
}
function showPause(){
  D.screen.classList.remove('hide');
  D.screen.innerHTML=
   '<div class="card"><h1 style="font-size:clamp(30px,5vw,52px)">已 暂 停</h1>'+
   '<div class="rule"></div>'+
   '<div class="tip">按 <kbd>P</kbd> 或 <kbd>空格</kbd> 继续狩猎</div>'+
   '<button class="btn" id="resumeBtn">继 续</button></div>';
  D.screen.style.pointerEvents='auto';
  $('resumeBtn').addEventListener('click',resume);
}
function showGameOver(){
  D.screen.classList.remove('hide');
  D.screen.style.pointerEvents='auto';
  const s=SHARKS[P.tier];
  let chips='';
  for(let i=0;i<SHARKS.length;i++)
    chips+='<div class="evoChip'+(i<=P.tier?' got':'')+'">'+SHARKS[i].name+'</div>';
  const isBest=P.coins>=G.best&&P.coins>0;
  D.screen.innerHTML=
   '<div class="card">'+
   '<div id="overTitle">'+G.deathReason+'</div>'+
   '<div class="sub" style="letter-spacing:5px;margin-top:10px">'+
     (isBest?'★ 新纪录 ★':'最佳 '+G.best+' 金币')+'</div>'+
   '<div class="stats">'+
     '<div class="stat"><b>'+P.coins+'</b><span>金币</span></div>'+
     '<div class="stat"><b>'+fmtTime(G.time)+'</b><span>存活</span></div>'+
     '<div class="stat"><b>'+G.kills+'</b><span>捕食</span></div>'+
     '<div class="stat"><b>x'+(1+G.maxCombo*.06).toFixed(2)+'</b><span>最高连击 '+G.maxCombo+'</span></div>'+
     '<div class="stat"><b>'+s.name+'</b><span>最终形态 LV.'+(P.tier+1)+'</span></div>'+
     '<div class="stat"><b>'+G.bossKills+'</b><span>讨伐霸主</span></div>'+
   '</div>'+
   '<div class="evoList">'+chips+'</div>'+
   '<button class="btn" id="againBtn">再 来 一 次</button>'+
   '<div class="tip">按 <kbd>空格</kbd> 立即重开</div>'+
   '</div>';
  $('againBtn').addEventListener('click',startGame);
}
function pause(){
  if(G.state!=='play')return;
  G.state='pause';showPause();
}
function resume(){
  if(G.state!=='pause')return;
  G.state='play';D.screen.classList.add('hide');D.screen.style.pointerEvents='none';
  SFX.resume();
}
function startGame(){
  SFX.init();SFX.resume();
  creatures=[];parts=[];texts=[];shots=[];pickups=[];rings=[];flocks=[];
  for(const k in flocksById)delete flocksById[k];
  G.boss=null;G.bossQueue=-1;G.warnT=0;G.bossKills=0;G.huntT=76;
  G.time=0;G.kills=0;G.maxCombo=0;G.shake=0;G.flash=0;G.spawnT=0;G.meatT=5;G.deathReason='';
  hudCache={};
  D.bossWrap.classList.remove('on');
  D.bossWarn.classList.remove('on');
  D.vignette.classList.remove('gold');
  D.vignette.classList.remove('danger');
  resetPlayer();
  generateDeco();
  spawnInitial();
  computeCamera(.016);
  G.state='play';
  D.screen.classList.add('hide');
  D.screen.style.pointerEvents='none';
  D.hud.classList.add('on');
  D.sndBtn.classList.add('on');
  showBanner('开始狩猎','REEF SHARK · LV.1','#c8fbff');
}

/* 菜单演示模式下的“吃”，不给任何数值奖励 */
function menuBite(){
  const mx=P.x+Math.cos(P.ang)*P.len*.46, my=P.y+Math.sin(P.ang)*P.len*.46;
  for(let i=creatures.length-1;i>=0;i--){
    const c=creatures[i];
    if(c.sp.hazard||c.sp.item||c.sp.tier>P.tier)continue;
    if(dist2(mx,my,c.x,c.y)<(c.r+P.len*.3)*(c.r+P.len*.3)){
      if(P.biteCd>0)return;
      P.biteCd=.22;P.biteAnim=.2;
      bloodFx(c.x,c.y,5,'#d9564a');
      killCreature(c,false,i);
      return;
    }
  }
}

/* ============================== 主循环 ============================== */
function step(dt){
  G.frame++;
  const playing=(G.state==='play');
  if(playing)G.time+=dt;

  if(playing&&G.warnT>0){
    G.warnT-=dt;
    if(G.warnT<=0){
      D.bossWarn.classList.remove('on');
      if(!G.boss)spawnBoss(G.bossQueue);
    }
  }

  updatePlayer(dt);
  computeCamera(dt);

  const snap=creatures.slice();
  for(let n=0;n<snap.length;n++){
    const c=snap[n];
    if(c.dead||creatures.indexOf(c)<0)continue;
    updateCreature(c,dt);
  }
  for(let i=creatures.length-1;i>=0;i--){
    if(creatures[i].dead)creatures.splice(i,1);
  }
  if(playing)tryBite(dt); else if(G.state==='menu')menuBite();
  updateShots(dt);
  updatePickups(dt);
  if(G.boss)updateBoss(dt);
  updateFx(dt);
  updatePlankton(dt);
  if(playing)director(dt);

  /* 环境气泡 */
  if(chance(dt*7)){
    const x=G.camX+rand(0,view.w),y=G.camY+rand(view.h*.3,view.h);
    if(y>SURFACE_Y)part({k:'bub',x,y,vx:rand(-8,8),vy:rand(-52,-22),r:rand(1.2,3.6),life:rand(1.6,3.4),t:0,col:'rgba(205,240,255,.4)'});
  }
  if(P.dashing&&chance(dt*40))
    part({k:'bub',x:P.x-Math.cos(P.ang)*P.len*.3+rand(-14,14),y:P.y-Math.sin(P.ang)*P.len*.3+rand(-14,14),
      vx:-Math.cos(P.ang)*60,vy:-Math.sin(P.ang)*60-20,r:rand(1.6,4.4),life:rand(.4,.9),t:0,col:'rgba(220,248,255,.6)'});
  if(!P.inAir&&chance(dt*4))bubbleFx(P.x+Math.cos(P.ang)*P.len*.34,P.y+Math.sin(P.ang)*P.len*.3,1);
}

function render(){
  applyScreen();
  ctx.fillStyle='#02101c';ctx.fillRect(0,0,VW,VH);
  drawBackground();
  drawWalls();
  drawFloor();
  drawPlankton();
  drawPickups();
  drawCreatures();
  drawBoss();
  drawShots();
  drawPlayer();
  drawParticles();
  drawBioGlow();
  drawDepthFog();
  drawTexts();
  drawScreenFx();
}

let last=performance.now();
function tick(dt){
  G.dt=dt;
  if(G.state==='play'||G.state==='menu'){step(dt);}
  else if(G.state==='dead'){
    step(dt*.45);
    G.deadT+=dt;
    if(!G.overShown&&G.deadT>1.05){G.overShown=true;showGameOver();}
  }
  else{computeCamera(dt);updateFx(dt);updatePlankton(dt);}
  render();
  if(G.state!=='menu')updateHUD();
}
function loop(ts){
  requestAnimationFrame(loop);
  let dt=(ts-last)/1000;last=ts;
  if(!(dt>0))dt=.016;
  tick(Math.min(dt,1/24));
}

/* ============================== 启动 ============================== */
resize();
buildGrads();
resetPlayer();
generateDeco();
computeCamera(.016);
spawnInitial();
for(let i=0;i<8;i++)spawnOne('sardine',rand(WORLD.left+500,WORLD.right-500),rand(SURFACE_Y+150,1200));
G.state='menu';
D.sndBtn.classList.add('on');
showMenu();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
})();
</script>
