<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深渊猎手 · Abyss Predator</title>
<style>
:root{
  --glass:rgba(6,22,38,.60);
  --line:rgba(120,215,255,.22);
  --hunger:#ff9a3c;
  --xp:#45e0c0;
  --dash:#5fb2ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02101c;
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:#e6f5ff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 6px 24px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.09)}

#left{position:absolute;left:14px;top:12px;padding:9px 13px 11px;width:284px}
#sharkRow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
#sharkIco{width:34px;height:34px;flex:0 0 34px;border-radius:9px;
  background:radial-gradient(circle at 35% 30%,#7fd8ff,#12456b);display:flex;align-items:center;justify-content:center;
  font-size:19px;box-shadow:0 0 12px rgba(90,200,255,.35) inset}
#sharkName{font-size:16px;font-weight:700;letter-spacing:.5px;line-height:1.15}
#sharkLv{font-size:11px;color:#8fd6ff;font-weight:600;letter-spacing:1px}

.bar{position:relative;height:15px;border-radius:8px;background:rgba(0,0,0,.45);
  overflow:hidden;border:1px solid rgba(255,255,255,.09);margin-top:5px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;
  transition:width .14s linear}
.bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:10px;font-weight:700;letter-spacing:.6px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
#hungerFill{background:linear-gradient(90deg,#ff5d3c,#ffab3c 60%,#ffd977);
  box-shadow:0 0 12px rgba(255,150,60,.55)}
#xpFill{background:linear-gradient(90deg,#19b394,#45e0c0 55%,#a6fff0);
  box-shadow:0 0 12px rgba(70,225,195,.45)}
.bar.xp{height:11px}
#left.low #hungerFill{animation:pulseH .55s infinite alternate}
@keyframes pulseH{from{filter:brightness(1)}to{filter:brightness(1.85)}}

#right{position:absolute;right:14px;top:12px;padding:9px 14px;text-align:right;min-width:158px}
.rRow{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:13px;line-height:1.7}
.rRow b{font-size:17px;font-weight:800;letter-spacing:.5px}
#coinRow b{color:#ffd76a;text-shadow:0 0 10px rgba(255,200,80,.5)}
#comboRow{opacity:.25;transition:opacity .18s}
#comboRow.on{opacity:1}
#comboRow b{color:#ff7ad9;text-shadow:0 0 10px rgba(255,120,220,.55)}
#comboBar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:3px;overflow:hidden}
#comboBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff7ad9,#ffd76a)}
#depthRow{color:#8fc9e8;font-size:12px}
#depthRow b{font-size:14px;color:#cfeeff}

#dashWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;
  width:236px;padding:6px 11px 8px;text-align:center}
#dashLabel{font-size:10px;letter-spacing:2.5px;color:#9fd4ff;font-weight:700}
.bar.dash{height:8px;margin-top:4px}
#dashFill{background:linear-gradient(90deg,#2b7fd4,#7fd0ff);box-shadow:0 0 10px rgba(110,200,255,.5)}
#dashWrap.empty #dashFill{background:linear-gradient(90deg,#5a4a4a,#8a6a6a)}

#buffs{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;display:flex;gap:8px}
.buff{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.5px;
  border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 18px rgba(0,0,0,.4);display:none}
.buff.on{display:block;animation:buffIn .25s}
@keyframes buffIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#buffFrenzy{background:linear-gradient(90deg,#ff9a00,#ffe14d);color:#3a1c00}
#buffShield{background:linear-gradient(90deg,#2fb0ff,#b6f0ff);color:#00263f}
#buffPoison{background:linear-gradient(90deg,#6fbf2f,#c6ff7a);color:#12300a}
#buffStun{background:linear-gradient(90deg,#b06bff,#e9c9ff);color:#22003f}

#bossWrap{position:absolute;left:50%;transform:translateX(-50%);top:16px;width:min(560px,62vw);
  padding:8px 14px 10px;text-align:center;display:none}
#bossWrap.on{display:block}
#bossName{font-size:14px;font-weight:800;letter-spacing:3px;color:#ff9b9b;
  text-shadow:0 0 14px rgba(255,60,60,.6);margin-bottom:5px}
.bar.boss{height:13px;background:rgba(40,0,0,.55)}
#bossFill{background:linear-gradient(90deg,#8b0f2a,#ff3b52 55%,#ff9a6a);
  box-shadow:0 0 14px rgba(255,60,80,.6)}

#banner{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%) scale(.7);
  font-size:46px;font-weight:900;letter-spacing:5px;text-align:center;opacity:0;
  text-shadow:0 0 30px rgba(120,230,255,.85),0 4px 0 rgba(0,0,0,.45);white-space:nowrap}
#banner small{display:block;font-size:15px;letter-spacing:7px;font-weight:700;opacity:.85;margin-top:6px}
#banner.show{animation:ban 2.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ban{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  26%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}
}
#bossWarn{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:27px;font-weight:900;
  letter-spacing:6px;color:#ff5a5a;text-shadow:0 0 26px rgba(255,0,0,.9);opacity:0;display:none}
#bossWarn.on{display:block;animation:warn 1s infinite}
@keyframes warn{0%,100%{opacity:.15}50%{opacity:1}}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 200px 40px rgba(0,10,22,.75);transition:box-shadow .3s}
#vignette.danger{box-shadow:inset 0 0 210px 55px rgba(120,0,10,.8)}
#vignette.gold{box-shadow:inset 0 0 230px 50px rgba(120,70,0,.55)}

#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(4,26,48,.55),rgba(1,8,16,.9) 72%);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .4s}
#screen.hide{opacity:0;pointer-events:none}
.card{text-align:center;padding:26px 34px;max-width:min(760px,92vw)}
h1{font-size:clamp(38px,7.4vw,74px);font-weight:900;letter-spacing:6px;line-height:1.05;
  background:linear-gradient(180deg,#eafcff 0%,#69d8ff 46%,#1f7fc4 78%,#0d3f6b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 22px rgba(50,180,255,.42))}
.sub{margin-top:6px;font-size:clamp(12px,1.9vw,16px);letter-spacing:9px;color:#8fd0f0;font-weight:600}
.rule{height:1px;margin:20px auto;width:min(460px,80%);
  background:linear-gradient(90deg,transparent,rgba(140,220,255,.55),transparent)}
.keys{display:flex;flex-wrap:wrap;gap:9px 16px;justify-content:center;font-size:13px;color:#c4e6f8;line-height:1.7}
.keys span{display:inline-flex;align-items:center;gap:6px}
kbd{display:inline-block;min-width:26px;padding:2px 7px;border-radius:6px;font-size:12px;font-weight:700;
  background:linear-gradient(180deg,#1d4c72,#0d2c46);border:1px solid rgba(150,225,255,.35);
  box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);color:#dff3ff;font-family:inherit}
.btn{margin-top:22px;padding:13px 46px;font-size:19px;font-weight:800;letter-spacing:5px;cursor:pointer;
  border:none;border-radius:34px;color:#04222f;font-family:inherit;
  background:linear-gradient(180deg,#b8f4ff,#3fc4f0 52%,#1a86c4);
  box-shadow:0 8px 26px rgba(50,190,255,.42),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(60,200,255,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:translateY(1px)}
.tip{margin-top:16px;font-size:12px;color:#7fb6d6;letter-spacing:1.4px;line-height:1.8}
#overTitle{font-size:clamp(32px,6vw,58px);font-weight:900;letter-spacing:8px;color:#ff6a5a;
  text-shadow:0 0 34px rgba(255,60,40,.6)}
.stats{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;margin-top:20px}
.stat{min-width:118px;padding:11px 15px;border-radius:13px;background:rgba(8,30,52,.6);
  border:1px solid rgba(120,215,255,.2)}
.stat b{display:block;font-size:24px;font-weight:900;color:#ffe08a;letter-spacing:1px}
.stat span{display:block;font-size:11px;color:#93c4de;letter-spacing:2px;margin-top:3px}
.evoList{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.evoChip{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:1px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#7fa8c0}
.evoChip.got{background:linear-gradient(90deg,rgba(70,224,192,.28),rgba(120,220,255,.24));
  border-color:rgba(120,255,225,.5);color:#d8fff5;box-shadow:0 0 14px rgba(70,224,192,.28)}

#touch{position:fixed;right:18px;bottom:20px;z-index:6;display:none}
#touch.on{display:block}
#btnDash{width:88px;height:88px;border-radius:50%;border:2px solid rgba(150,225,255,.45);
  background:radial-gradient(circle at 40% 34%,rgba(120,210,255,.55),rgba(10,50,86,.6));
  color:#eaf8ff;font-size:16px;font-weight:800;letter-spacing:2px;font-family:inherit;
  box-shadow:0 6px 22px rgba(0,0,0,.45)}
#btnDash:active{background:radial-gradient(circle at 40% 34%,rgba(190,240,255,.8),rgba(30,110,170,.7))}
#sndBtn{position:fixed;right:14px;bottom:14px;z-index:7;width:36px;height:36px;border-radius:11px;
  border:1px solid var(--line);background:var(--glass);color:#bfe4ff;font-size:16px;cursor:pointer;
  pointer-events:auto;display:none}
#sndBtn.on{display:block}
@media (max-width:760px){
  #left{width:210px;padding:7px 10px 9px}
  #sharkIco{width:26px;height:26px;flex:0 0 26px;font-size:15px}
  #sharkName{font-size:13px}
  #right{min-width:118px;padding:7px 10px}
  .rRow b{font-size:15px}
  #dashWrap{width:170px;bottom:112px}
  #buffs{bottom:158px}
  #banner{font-size:30px;letter-spacing:2px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div class="panel" id="left">
    <div id="sharkRow">
      <div id="sharkIco">🦈</div>
      <div>
        <div id="sharkName">礁鲨</div>
        <div id="sharkLv">LV.1 · REEF SHARK</div>
      </div>
    </div>
    <div class="bar"><i id="hungerFill"></i><em id="hungerTxt">饱食度 100 / 100</em></div>
    <div class="bar xp"><i id="xpFill"></i><em id="xpTxt">进化 0 / 70</em></div>
  </div>

  <div class="panel" id="right">
    <div class="rRow" id="coinRow"><span>金币</span><b id="coinTxt">0</b></div>
    <div class="rRow" id="comboRow"><span>连击</span><b id="comboTxt">x1.0</b></div>
    <div id="comboBar"><i id="comboFill"></i></div>
    <div class="rRow" id="depthRow"><span>深度</span><b id="depthTxt">0 m</b></div>
    <div class="rRow" id="timeRow"><span>存活</span><b id="timeTxt">0:00</b></div>
  </div>

  <div id="bossWrap" class="panel">
    <div id="bossName">深渊霸主 · 克拉肯</div>
    <div class="bar boss"><i id="bossFill"></i></div>
  </div>

  <div id="buffs">
    <div class="buff" id="buffFrenzy">狂暴 0.0s</div>
    <div class="buff" id="buffShield">护盾 0.0s</div>
    <div class="buff" id="buffPoison">中毒</div>
    <div class="buff" id="buffStun">麻痹</div>
  </div>

  <div class="panel" id="dashWrap">
    <div id="dashLabel">冲 刺 能 量</div>
    <div class="bar dash"><i id="dashFill"></i></div>
  </div>

  <div id="banner"></div>
  <div id="bossWarn">⚠ 深渊霸主正在接近 ⚠</div>
</div>

<div id="touch"><button id="btnDash">冲刺</button></div>
<button id="sndBtn">🔊</button>
<div id="screen"></div>

<script>
(function(){
'use strict';
/* ============================== 工具 ============================== */
const TAU=Math.PI*2;
const rand=(a,b)=>{ if(b===undefined){b=a;a=0;} return a+Math.random()*(b-a); };
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);
const dist2=(x1,y1,x2,y2)=>{const a=x1-x2,b=y1-y2;return a*a+b*b;};
const chance=p=>Math.random()<p;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function angTo(a,b,t){return a+angDiff(a,b)*clamp(t,0,1);}
function smooth(k,dt){return 1-Math.exp(-k*dt);}
function hash1(n){n=(n<<13)^n;const m=(n*(n*n*15731+789221)+1376312589)&0x7fffffff;return 1-m/1073741824;}
function fmtTime(s){const m=Math.floor(s/60);const ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}

/* ============================== 世界配置 ============================== */
const WORLD={left:-900,right:7400,top:-560,bottom:3420};
const SURFACE_Y=300;
const FLOOR_Y=3240;

const ZONES={
  air:      ()=>rand(WORLD.top+90, SURFACE_Y-70),
  surface:  ()=>rand(SURFACE_Y+16, SURFACE_Y+240),
  shallow:  ()=>rand(SURFACE_Y+40, 1150),
  mid:      ()=>rand(750, 1950),
  deep:     ()=>rand(1500, 2850),
  abyss:    ()=>rand(2450, FLOOR_Y-70),
  floor:    ()=>rand(FLOOR_Y-140, FLOOR_Y-24),
  any:      ()=>rand(SURFACE_Y+60, FLOOR_Y-70)
};

/* 进化链：玩家形态 */
const SHARKS=[
  {name:'礁鲨',    en:'REEF SHARK',      len:80,  speed:252,turn:3.6,hunger:100,need:180,
   top:'#6d93ab',bot:'#e6f0f5',fin:'#41627a',accent:'#9dc4d8',eye:'#101a22'},
  {name:'沙虎鲨',  en:'SAND TIGER',      len:116, speed:264,turn:3.3,hunger:148,need:520,
   top:'#96845c',bot:'#efe7d2',fin:'#71603d',accent:'#c2b183',eye:'#1a1206'},
  {name:'大白鲨',  en:'GREAT WHITE',     len:158, speed:276,turn:3.0,hunger:205,need:1100,
   top:'#61717f',bot:'#f4f7f9',fin:'#414e5b',accent:'#8d9ead',eye:'#0c1116'},
  {name:'虎鲨',    en:'TIGER SHARK',     len:204, speed:290,turn:2.8,hunger:278,need:2000,
   top:'#4d7069',bot:'#e2ebe5',fin:'#33544e',accent:'#79a396',eye:'#120c04',stripes:true},
  {name:'巨齿鲨',  en:'MEGALODON',       len:268, speed:302,turn:2.55,hunger:370,need:3400,
   top:'#3f4855',bot:'#d3dae1',fin:'#282f3a',accent:'#66727f',eye:'#2a0a0a',scars:true},
  {name:'深渊巨噬',en:'ABYSSAL DEVOURER',len:348, speed:320,turn:2.35,hunger:500,need:Infinity,
   top:'#2c2140',bot:'#8a63bd',fin:'#170f26',accent:'#c46bff',eye:'#ff3b3b',glow:true}
];

/* 生物图鉴 */
const SP={
  sardine:{n:'沙丁鱼群',tier:0,len:15,hp:1,food:5, xp:2, coin:1, from:0,to:2,w:30,zone:'shallow',ai:'school',count:12,r:.44,draw:'fish',col:['#a9dcf0','#6fa8c4','#dff4ff']},
  coral:  {n:'珊瑚鱼',  tier:0,len:23,hp:1,food:8, xp:4, coin:1, from:0,to:3,w:24,zone:'shallow',ai:'school',count:6, r:.44,draw:'fish',col:['#ffc46b','#ff8f5a','#fff0c9']},
  jelly:  {n:'水母',    tier:0,len:30,hp:1,food:12,xp:5, coin:1, from:0,to:5,w:13,zone:'any',    ai:'drift', r:.50,draw:'jelly',col:['#c9a6ff','#8fd8ff','#ffd6f2'],sting:true},
  gull:   {n:'海鸥',    tier:0,len:30,hp:1,food:10,xp:5, coin:2, from:0,to:5,w:9, zone:'air',    ai:'fly',   r:.44,draw:'gull',col:['#f6fbff','#c8d6e0','#ffb648']},
  turtle: {n:'海龟',    tier:1,len:58,hp:3,food:38,xp:12,coin:5, from:0,to:4,w:15,zone:'shallow',ai:'graze', r:.50,draw:'turtle',col:['#6f8f4a','#a8c46a','#3d5227']},
  puffer: {n:'河豚',    tier:1,len:38,hp:2,food:28,xp:10,coin:4, from:0,to:4,w:13,zone:'mid',    ai:'puff',  r:.56,draw:'puffer',col:['#e8d3a0','#c9a86a','#6b5636'],poison:true},
  squid:  {n:'鱿鱼',    tier:1,len:48,hp:2,food:32,xp:11,coin:4, from:1,to:5,w:15,zone:'deep',   ai:'jet',   r:.44,draw:'squid',col:['#ff9e8a','#d9534f','#ffd9cf']},
  ray:    {n:'魟鱼',    tier:2,len:82,hp:3,food:54,xp:18,coin:7, from:1,to:5,w:12,zone:'floor',  ai:'floor', r:.50,draw:'ray',col:['#6b7f96','#3f5064','#c3d2e0']},
  sword:  {n:'剑鱼',    tier:2,len:88,hp:3,food:58,xp:19,coin:7, from:1,to:5,w:12,zone:'mid',    ai:'charge',r:.38,draw:'sword',col:['#5f8fc4','#2f5680','#d8ecff']},
  diver:  {n:'潜水员',  tier:2,len:48,hp:2,food:26,xp:10,coin:10,from:0,to:4,w:8, zone:'mid',    ai:'diver', r:.48,draw:'diver',col:['#2f3b46','#ffd166','#8fd6ff'],gun:true},
  angler: {n:'鮟鱇鱼',  tier:3,len:74,hp:3,food:74,xp:24,coin:9, from:2,to:5,w:12,zone:'abyss',  ai:'lurk',  r:.50,draw:'angler',col:['#3a2f4a','#1d1728','#ffe680']},
  dolphin:{n:'海豚',    tier:3,len:104,hp:4,food:78,xp:28,coin:11,from:2,to:5,w:13,zone:'shallow',ai:'evade',r:.42,draw:'dolphin',col:['#8fa9bd','#e8f3fa','#4d6577']},
  bull:   {n:'公牛鲨',  tier:3,len:124,hp:5,food:88,xp:32,coin:13,from:2,to:5,w:12,zone:'any',  ai:'hunt',  r:.42,draw:'sharkish',col:['#7a6a55','#d8cbb4','#4a3d2c']},
  orca:   {n:'虎鲸',    tier:4,len:210,hp:9,food:140,xp:56,coin:24,from:3,to:5,w:11,zone:'any', ai:'hunt',  r:.40,draw:'orca',col:['#16181d','#f4f8fa','#ff6a4a']},
  whale:  {n:'蓝鲸',    tier:5,len:460,hp:18,food:430,xp:170,coin:80,from:4,to:5,w:9,zone:'deep',ai:'giant',r:.38,draw:'whale',col:['#3d5a78','#8fb0cc','#1d2f42']},

/* ============================== 音效（WebAudio 合成，无外部资源） ============================== */
const SFX={
  ac:null,master:null,on:true,nbuf:null,
  init(){
    if(this.ac)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){this.on=false;return;}
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=.26;
      this.master.connect(this.ac.destination);
      const len=Math.floor(this.ac.sampleRate*.7);
      this.nbuf=this.ac.createBuffer(1,len,this.ac.sampleRate);
      const d=this.nbuf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    }catch(e){this.on=false;}
  },
  resume(){ if(this.ac&&this.ac.state==='suspended')this.ac.resume(); },
  tone(f,f2,d,type,v,delay){
    if(!this.on||!this.ac)return;
    const t=this.ac.currentTime+(delay||0);
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(20,f),t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(v||.3,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03);
  },
  noise(d,v,freq,q,delay){
    if(!this.on||!this.ac||!this.nbuf)return;
    const t=this.ac.currentTime+(delay||0);
    const s=this.ac.createBufferSource();s.buffer=this.nbuf;
    const bp=this.ac.createBiquadFilter();bp.type='bandpass';
    bp.frequency.setValueAtTime(freq||800,t);bp.Q.value=q||1;
    bp.frequency.exponentialRampToValueAtTime(Math.max(60,(freq||800)*.35),t+d);
    const g=this.ac.createGain();
    g.gain.setValueAtTime(v||.3,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t);s.stop(t+d+.03);
  },
  bite(){this.noise(.07,.22,1500,1.6);this.tone(320,180,.07,'square',.12);},
  eat(){this.tone(520,880,.10,'triangle',.20);this.noise(.09,.14,2200,1.2);},
  big(){this.tone(150,70,.34,'sawtooth',.26);this.noise(.30,.24,500,.8);},
  coin(){this.tone(1180,1180,.06,'square',.13);this.tone(1720,1720,.10,'square',.11,.055);},
  hurt(){this.tone(220,64,.30,'sawtooth',.28);this.noise(.22,.26,340,.7);},
  boom(){this.noise(.60,.45,220,.4);this.tone(120,32,.55,'sine',.32);},
  evolve(){
    [0,.09,.18,.30].forEach((d,i)=>this.tone([330,440,550,880][i],[440,550,660,1320][i],.28,'triangle',.24,d));
    this.noise(.75,.28,700,.5,.05);this.tone(90,180,.8,'sawtooth',.16,.05);
  },
  frenzy(){for(let i=0;i<7;i++)this.tone(300+i*150,340+i*170,.14,'square',.13,i*.045);},
  boss(){this.tone(58,44,1.7,'sawtooth',.30);this.tone(87,66,1.7,'sine',.20,.06);this.noise(1.5,.20,160,.35);},
  splash(){this.noise(.30,.24,1800,.6);},
  dash(){this.noise(.22,.13,900,.9);},
  dead(){this.tone(300,50,1.3,'sawtooth',.30);this.noise(1.1,.24,300,.5);}
};

function spec(){return SHARKS[P.tier];}

function resetPlayer(){
  const s=SHARKS[0];
  P.x=900;P.y=760;P.vx=120;P.vy=0;P.ang=0;
  P.tier=0;P.len=s.len;P.maxHunger=s.hunger;P.hunger=s.hunger;P.xp=0;P.need=s.need;
  P.dash=100;P.dashing=false;P.inv=1.2;P.frenzy=0;P.shield=0;P.paralyze=0;P.poison=0;P.poisonTick=0;
  P.combo=0;P.comboT=0;P.biteCd=0;P.biteAnim=0;P.mouth=.12;P.tail=0;
  P.coins=0;P.alive=true;P.maxed=0;P.inAir=false;P.airEat=false;P.hitFlash=0;P.bob=0;
  G.zoom=1.12;
}

function playerR(){return P.len*.26;}

function updatePlayer(dt){
  const s=spec();
  const menuMode=(G.state==='menu');

  /* --- 期望方向 --- */
  let tx=null,ty=null,thrust=1;
  if(menuMode){
    G.attractT-=dt;
    if(G.attractT<=0){
      G.attractT=rand(1.4,3.2);
      G.attractX=clamp(P.x+rand(-700,700),WORLD.left+300,WORLD.right-300);
      G.attractY=clamp(P.y+rand(-380,380),SURFACE_Y+180,FLOOR_Y-260);
    }
    tx=G.attractX;ty=G.attractY;
  }else{
    let dx=0,dy=0;
    if(keys.ArrowLeft||keys.KeyA)dx-=1;
    if(keys.ArrowRight||keys.KeyD)dx+=1;
    if(keys.ArrowUp||keys.KeyW)dy-=1;
    if(keys.ArrowDown||keys.KeyS)dy+=1;
    if(dx||dy){tx=P.x+dx;ty=P.y+dy;}
    else if(mouse.used){
      const w=toWorld(mouse.x,mouse.y);
      tx=w.x;ty=w.y;
      const d=dist(P.x,P.y,w.x,w.y);
      thrust=clamp((d-26)/150,.12,1);
    }else{tx=P.x+Math.cos(P.ang)*300;ty=P.y+Math.sin(P.ang)*300;}
  }

  const wantAng=Math.atan2(ty-P.y,tx-P.x);
  let turnK=s.turn;
  if(P.paralyze>0)turnK*=.34;
  if(P.inAir)turnK*=.45;
  P.ang=angTo(P.ang,wantAng,smooth(turnK,dt));

  /* --- 冲刺 --- */
  const wantDash=!menuMode&&(keys.Space||keys.ShiftLeft||keys.ShiftRight||mouse.down||touchDash);
  P.dashing=false;
  if(wantDash&&P.dash>1&&!menuMode){
    P.dashing=true;
    P.dash=Math.max(0,P.dash-30*dt);
    if(P.dash<=0)SFX.dash();
  }else{
    P.dash=Math.min(100,P.dash+(P.dash<26?15:23)*dt);
  }

  /* --- 速度 --- */
  let spd=s.speed*(P.dashing?1.78:1)*(P.frenzy>0?1.28:1);
  if(P.paralyze>0)spd*=.52;
  if(P.poison>0)spd*=.90;
  if(P.inAir)spd*=.5;
  spd*=lerp(.62,1,thrust);
  if(P.biteAnim>0)spd*=1.12;

  const dvx=Math.cos(P.ang)*spd, dvy=Math.sin(P.ang)*spd;
  const acc=P.inAir?1.6:(P.dashing?13:9);
  P.vx=lerp(P.vx,dvx,smooth(acc,dt));
  P.vy=lerp(P.vy,dvy,smooth(acc,dt));

  if(P.y<SURFACE_Y){ /* 出水：重力 */
    P.inAir=true;
    P.vy+=1180*dt;
    P.vx*=Math.pow(.995,dt*60);
  }else{
    if(P.inAir){
      P.inAir=false;
      splashFx(P.x,SURFACE_Y,1.5);
      SFX.splash();
      addShake(7);
      if(P.airEat){P.airEat=false;bonusText(P.x,P.y-40,'空中捕食! +50','#ffe08a');P.coins+=50;}
    }
  }

  P.x+=P.vx*dt;P.y+=P.vy*dt;

  /* --- 边界 --- */
  const pad=P.len*.3;
  if(P.x<WORLD.left+pad){P.x=WORLD.left+pad;P.vx=Math.abs(P.vx)*.4;}
  if(P.x>WORLD.right-pad){P.x=WORLD.right-pad;P.vx=-Math.abs(P.vx)*.4;}
  if(P.y<WORLD.top+pad){P.y=WORLD.top+pad;P.vy=Math.abs(P.vy)*.35;}
  const floorLim=FLOOR_Y-P.len*.16;
  if(P.y>floorLim){
    P.y=floorLim;P.vy=-Math.abs(P.vy)*.3;
    if(Math.abs(P.vx)>90&&chance(dt*14))sandFx(P.x,FLOOR_Y-rand(0,18),3);
  }

  /* --- 姿态 --- */
  const spdNow=Math.hypot(P.vx,P.vy);
  P.tail+=dt*(4.4+spdNow*.028);
  P.bob+=dt*1.6;
  P.mouth=lerp(P.mouth,(P.biteAnim>0?1:(P.dashing?.42:.14)),smooth(11,dt));
  if(P.biteAnim>0)P.biteAnim-=dt;

  /* --- 计时器 --- */
  if(P.inv>0)P.inv-=dt;
  if(P.hitFlash>0)P.hitFlash-=dt*3;
  if(P.biteCd>0)P.biteCd-=dt;
  if(P.frenzy>0){P.frenzy-=dt;if(P.frenzy<=0)D.vignette.classList.remove('gold');}
  if(P.shield>0)P.shield-=dt;
  if(P.paralyze>0)P.paralyze-=dt;
  if(P.poison>0){
    P.poison-=dt;P.poisonTick-=dt;
    if(P.poisonTick<=0){P.poisonTick=.55;hurtPlayer(3.2,null,true);}
    if(chance(dt*10))bubbleFx(P.x+rand(-P.len*.2,P.len*.2),P.y+rand(-10,10),2,'#9fe06a');
  }
  if(P.comboT>0){P.comboT-=dt;if(P.comboT<=0)P.combo=0;}

  /* --- 饥饿 --- */
  if(!menuMode){
    let drain=3.0+P.tier*1.6;
    if(P.dashing)drain*=1.9;
    if(P.frenzy>0)drain*=.35;
    P.hunger-=drain*dt;
    if(P.hunger<=0){P.hunger=0;die('饥饿而死');}
  }
}

function comboMult(){return 1+P.combo*.06;}

function hurtPlayer(dmg,sx,sy,silent){
  if(G.state!=='play')return;
  if(P.inv>0||P.frenzy>0)return;
  if(P.shield>0){
    P.shield=0;P.inv=.85;
    ringFx(P.x,P.y,P.len*.9,'#8fe6ff');
    floatText(P.x,P.y-P.len*.4,'护盾破碎','#bfefff');
    SFX.tone(900,200,.25,'triangle',.24);addShake(6);
    return;
  }
  P.hunger-=dmg;
  P.inv=silent?.35:1.0;
  P.hitFlash=1;
  P.combo=0;P.comboT=0;
  if(!silent){
    addShake(9+dmg*.35);
    G.flash=.42;G.flashCol='255,60,50';
    SFX.hurt();
    bloodFx(P.x,P.y,10,'#ff5a4a');
    floatText(P.x,P.y-P.len*.45,'-'+Math.round(dmg),'#ff7a6a');
    if(sx!==null&&sx!==undefined){
      const a=Math.atan2(P.y-sy,P.x-sx);
      P.vx+=Math.cos(a)*230;P.vy+=Math.sin(a)*230;
    }
  }
  if(P.hunger<=0){P.hunger=0;die(dmg>=25?'被撕碎':'重伤不治');}
}

function poisonPlayer(sec){P.poison=Math.max(P.poison,sec);}
function paralyzePlayer(sec){P.paralyze=Math.max(P.paralyze,sec);}

function gainXP(n){
  if(P.tier>=SHARKS.length-1){
    P.maxed+=n;
    P.coins+=Math.round(n*.12);
    if(P.maxed>=340){P.maxed=0;P.hunger=Math.min(P.maxHunger,P.hunger+55);
      floatText(P.x,P.y-P.len*.5,'吞噬无尽 +55','#ffd76a');SFX.coin();}
    return;
  }
  P.xp+=n;
  let guard=0;
  while(P.tier<SHARKS.length-1&&P.xp>=SHARKS[P.tier].need&&guard++<8){
    P.xp-=SHARKS[P.tier].need;
    evolve();
  }
}

function evolve(){
  P.tier++;
  const s=spec();
  P.len=s.len;P.maxHunger=s.hunger;P.hunger=s.hunger;P.need=s.need;
  if(P.tier>=SHARKS.length-1)P.xp=0;
  P.frenzy=Math.max(P.frenzy,4.5);
  P.inv=Math.max(P.inv,2.4);
  P.dash=100;
  G.flash=.85;G.flashCol='190,250,255';
  addShake(16);
  ringFx(P.x,P.y,P.len*1.5,'#a9f4ff');
  ringFx(P.x,P.y,P.len*2.3,'#ffffff');
  for(let i=0;i<44;i++)sparkFx(P.x+rand(-P.len,P.len)*.6,P.y+rand(-P.len,P.len)*.4,'#bff6ff');
  showBanner('进化！'+s.name,s.en+' · LV.'+(P.tier+1),'#c8fbff');
  SFX.evolve();
  if(P.tier>=G.bestTier){G.bestTier=P.tier;try{localStorage.setItem('abyss_tier',String(G.bestTier));}catch(e){}}
  if(P.tier===4)queueBoss(0);
  else if(P.tier===5)queueBoss(1);
}

function die(reason){
  if(G.state!=='play')return;
  P.alive=false;G.state='dead';G.deathReason=reason|| '死亡';
  addShake(26);G.flash=.9;G.flashCol='255,40,30';
  bloodFx(P.x,P.y,50,'#c02a2a');
  SFX.dead();
  if(P.coins>G.best){G.best=P.coins;try{localStorage.setItem('abyss_best',String(G.best));}catch(e){}}
  G.deadT=0;G.overShown=false;
}

function part(o){ if(parts.length>760)parts.shift(); parts.push(o); return o; }

function bubbleFx(x,y,n,col){

function ringFx(x,y,r,col){ rings.push({x,y,r:r*.25,rr:r,t:0,life:.55,col:col||'#fff'}); if(rings.length>40)rings.shift(); }
