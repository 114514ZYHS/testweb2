<script>
"use strict";
(function(){
/* ==================================================================================
   全镂空大复杂功能机械表 —— 物理级实时仿真（单文件 / 免安装 / 纯本地离线）
   · 渐开线齿廓数学生成 + 严格啮合运动学（中心距 d = r1 + r2，ω1·z1 = -ω2·z2）
   · 60 秒飞行陀飞轮：无卡度 Gyromax 砝码摆轮 3Hz / 宝玑双层游丝 / 瑞士杠杆式擒纵
   · 表盘侧三问报时：双黑镜面抛光音锤 + 双环形音簧 + Web Audio 模态合成，毫秒级同步
   · 高级制表打磨：鱼鳞粒纹、日内瓦波纹、高光倒角、烤蓝钢螺丝、红宝石 + 黄金套筒
   ================================================================================== */

/* @CORE-BEGIN@ */
/* ----------------------------------------------------------------------------------
   齿轮核心：纯数学，无 DOM 依赖（可被外部脚本抽取做几何验证）
   ---------------------------------------------------------------------------------- */
var TAU = Math.PI * 2, D2R = Math.PI / 180;

/* 表盘极坐标 -> 直角坐标（y 轴向下；0° = 12 点方向，顺时针为正） */
function dial(r, deg){ var a = deg * D2R; return { x: r * Math.sin(a), y: -r * Math.cos(a) }; }

/* 渐开线函数 inv(a) = tan(a) - a */
function involuteFN(a){ return Math.tan(a) - a; }

/* 两圆求交（pick = +1 / -1 选择分支） */
function circleHit(c1, r1, c2, r2, pick){
  var dx = c2.x - c1.x, dy = c2.y - c1.y;
  var d = Math.sqrt(dx*dx + dy*dy);
  if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return null;
  var a = (d*d + r1*r1 - r2*r2) / (2*d);
  var h2 = r1*r1 - a*a, h = h2 > 0 ? Math.sqrt(h2) : 0;
  var ux = dx/d, uy = dy/d;
  return { x: c1.x + a*ux + pick*h*(-uy), y: c1.y + a*uy + pick*h*ux };
}

/*
   标准渐开线齿廓（滚切展成原理）
   z 齿数 / m 模数 / opt.shift 变位系数 x / opt.backlash 齿厚减薄量（单位模数，极小侧隙）
   返回闭合外轮廓点集 [[x,y]...]，齿中心线位于 0°
*/
function gearOutlinePoints(z, m, opt){
  opt = opt || {};
  var alpha = (opt.alpha == null ? 20 : opt.alpha) * D2R;
  var ha = (opt.ha == null ? 1.00 : opt.ha);
  var hf = (opt.hf == null ? 1.25 : opt.hf);
  var xc = (opt.shift == null ? 0 : opt.shift);
  var bl = (opt.backlash == null ? 0.045 : opt.backlash);
  var ns = (opt.samples == null ? 7 : opt.samples);

  var r  = m * z / 2;                    /* 分度圆（节圆） */
  var rb = r * Math.cos(alpha);          /* 基圆 */
  var ra = m * (z/2 + ha + xc);          /* 齿顶圆 */
  var rf = m * (z/2 - hf + xc);          /* 齿根圆 */
  var invA = involuteFN(alpha);
  var halfA = Math.PI/(2*z) - bl*m/(2*r);
  var aTip  = Math.acos(Math.min(1, rb/ra));
  var aRoot = (rb < rf) ? Math.acos(Math.min(1, rb/rf)) : 0;
  var thTip  = halfA + invA - involuteFN(aTip);
  var thRoot = halfA + invA - involuteFN(aRoot);
  var thBase = halfA + invA;

  var P = [];
  function push(rr, th){ P.push([rr*Math.cos(th), rr*Math.sin(th)]); }
  function arc(rr, a0, a1, n){ for (var i = 1; i <= n; i++) push(rr, a0 + (a1 - a0)*i/n); }
  var step = TAU / z;
  for (var k = 0; k < z; k++){
    var base = k * step;
    var prevPlus = base - step + thRoot;
    var thisMinus = base - thRoot;
    if (k === 0) push(rf, prevPlus);
    arc(rf, prevPlus, thisMinus, 3);                       /* 齿根圆弧 */
    var flankStart = (rf < rb) ? thBase : thRoot;
    if (rf < rb) push(rb, base - flankStart);              /* 基圆以下径向段（根切区） */
    var i, t, a, rr;
    for (i = 0; i <= ns; i++){                             /* - 侧渐开线 */
      t = i/ns; a = aRoot + (aTip - aRoot)*t;
      rr = (a < 1e-6) ? rb : rb/Math.cos(a);
      push(rr, base - (halfA + invA - involuteFN(a)));
    }
    arc(ra, base - thTip, base + thTip, 3);                /* 齿顶圆弧 */
    for (i = ns; i >= 0; i--){                             /* + 侧渐开线 */
      t = i/ns; a = aRoot + (aTip - aRoot)*t;
      rr = (a < 1e-6) ? rb : rb/Math.cos(a);
      push(rr, base + (halfA + invA - involuteFN(a)));
    }
    if (rf < rb) push(rb, base + flankStart);
  }
  return P;
}

/* 齿廓特征圆 */
function gearMetrics(z, m, opt){
  opt = opt || {};
  var alpha = (opt.alpha == null ? 20 : opt.alpha) * D2R;
  var ha = (opt.ha == null ? 1.00 : opt.ha);
  var hf = (opt.hf == null ? 1.25 : opt.hf);
  var xc = (opt.shift == null ? 0 : opt.shift);
  return { r: m*z/2, rb: m*z/2*Math.cos(alpha), ra: m*(z/2 + ha + xc),
           rf: m*(z/2 - hf + xc), m: m, z: z, alpha: alpha };
}

/*
   啮合运动学不变量
   外啮合两轮：A 的齿中心线对准连心线 φ（由 A 心指向 B 心）时，B 必须以其齿槽中心对准 φ+π，
   由此得到守恒量 S = zA·θA + zB·θB = (zA+zB)·φ + π·(zB-1) + 2πk
   =>  θB = (S - zA·θA) / zB ，自动满足 ωA·zA = -ωB·zB（转速与齿数成反比、转向相反）
*/
function meshS(zA, zB, phi, k){
  return (zA + zB)*phi + Math.PI*(zB - 1) + TAU*(k || 0);
}

/* ---- 齿面间隙 / 干涉检测（世界坐标多边形） ---- */
function worldPoly(pts, pos, ang, win, pitch){
  var c = Math.cos(ang), s = Math.sin(ang), out = [];
  for (var i = 0; i < pts.length; i++){
    var x = pts[i][0]*c - pts[i][1]*s + pos.x;
    var y = pts[i][0]*s + pts[i][1]*c + pos.y;
    if (Math.abs(x - pitch.x) < win && Math.abs(y - pitch.y) < win) out.push(x, y);
  }
  return out;
}
function segDist(px, py, x1, y1, x2, y2){
  var dx = x2 - x1, dy = y2 - y1;
  var L2 = dx*dx + dy*dy;
  var t = L2 > 0 ? ((px - x1)*dx + (py - y1)*dy) / L2 : 0;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var qx = x1 + t*dx - px, qy = y1 + t*dy - py;
  return Math.sqrt(qx*qx + qy*qy);
}
function polyMinDist(A, B){
  var best = Infinity, i, j, j2, d;
  for (i = 0; i < A.length; i += 2){
    for (j = 0; j < B.length; j += 2){
      j2 = (j + 2) % B.length;
      d = segDist(A[i], A[i+1], B[j], B[j+1], B[j2], B[j2+1]);
      if (d < best) best = d;
    }
  }
  return best;
}
function pointInPoly(x, y, P){
  var inside = false, n = P.length / 2;
  for (var i = 0, j = n - 1; i < n; j = i++){
    var xi = P[i*2], yi = P[i*2+1], xj = P[j*2], yj = P[j*2+1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi)*(y - yi)/((yj - yi) || 1e-12) + xi)) inside = !inside;
  }
  return inside;
}
/* 返回最小齿面间隙：> 0 无干涉；< 0 表示齿廓重叠（穿模） */
function meshClearance(polyA, posA, angA, polyB, posB, angB, win, pitch){
  var A = worldPoly(polyA, posA, angA, win, pitch);
  var B = worldPoly(polyB, posB, angB, win, pitch);
  if (A.length < 6 || B.length < 6) return NaN;
  var d = Math.min(polyMinDist(A, B), polyMinDist(B, A));
  var pen = pointInPoly(A[0], A[1], B) || pointInPoly(B[0], B[1], A);
  return pen ? -d : d;
}

/* ----------------------------------------------------------------------------------
   轮系布局（仿真单位：机芯半径 300，表壳外径 400）
   ---------------------------------------------------------------------------------- */
function buildLayout(){
  var arb = {};
  function A(id, x, y){ arb[id] = { id:id, x:x, y:y }; }

  A('barrel', 0, -135);                                   /* 条盒轮 · 12 点 */
  A('center', 0, 0);                                      /* 中心轮 · 表盘中心 */
  var t3 = dial(90, 205); A('third', t3.x, t3.y);         /* 三轮 */
  A('tourb', 0, 195);                                     /* 陀飞轮 · 6 点 */
  var f4 = circleHit(t3, 70, { x:0, y:195 }, 72, 1);      /* 四轮：严格节圆相切交点 */
  A('fourth', f4.x, f4.y);
  var mw = dial(24, 150); A('minute', mw.x, mw.y);        /* 分轮（拨针轮系） */
  A('hour', 0, 0);                                        /* 时轮（与中心同轴套筒） */

  var W = {
    barrel:        { z: 96, m: 2.5, x:-0.30, arb:'barrel' },
    centerPinion:  { z: 12, m: 2.5, x: 0.30, arb:'center' },
    centerWheel:   { z: 64, m: 2.5, x:-0.30, arb:'center' },
    thirdPinion:   { z:  8, m: 2.5, x: 0.30, arb:'third'  },
    thirdWheel:    { z: 60, m: 2.0, x:-0.35, arb:'third'  },
    fourthPinion:  { z: 10, m: 2.0, x: 0.35, arb:'fourth' },
    fourthWheel:   { z: 50, m: 1.6, x:-0.30, arb:'fourth' },
    carriageWheel: { z: 40, m: 1.6, x: 0.30, arb:'tourb'  },
    cannonPinion:  { z: 10, m: 1.2, x: 0.30, arb:'center' },
    minuteWheel:   { z: 30, m: 1.2, x:-0.30, arb:'minute' },
    minutePinion:  { z:  8, m: 1.2, x: 0.35, arb:'minute' },
    hourWheel:     { z: 32, m: 1.2, x:-0.35, arb:'hour'   }
  };
  var meshes = [
    { a:'centerPinion', b:'barrel',        k:0 },
    { a:'centerWheel',  b:'thirdPinion',   k:0 },
    { a:'thirdWheel',   b:'fourthPinion',  k:0 },
    { a:'fourthWheel',  b:'carriageWheel', k:0 },
    { a:'cannonPinion', b:'minuteWheel',   k:0 },
    { a:'minutePinion', b:'hourWheel',     k:0 }
  ];
  for (var i = 0; i < meshes.length; i++){
    var ms = meshes[i];
    var pa = arb[W[ms.a].arb], pb = arb[W[ms.b].arb];
    ms.phi = Math.atan2(pb.y - pa.y, pb.x - pa.x);
    ms.d = Math.sqrt((pb.x-pa.x)*(pb.x-pa.x) + (pb.y-pa.y)*(pb.y-pa.y));
    ms.zA = W[ms.a].z; ms.zB = W[ms.b].z;
    ms.S = meshS(ms.zA, ms.zB, ms.phi, ms.k);
    ms.centerSum = W[ms.a].m*ms.zA/2 + W[ms.b].m*ms.zB/2;
    ms.centerErr = Math.abs(ms.centerSum - ms.d);
    ms.rA = W[ms.a].m*ms.zA/2; ms.rB = W[ms.b].m*ms.zB/2;
    ms.pitch = { x: pa.x + (pb.x-pa.x)*(ms.rA/ms.d), y: pa.y + (pb.y-pa.y)*(ms.rA/ms.d) };
  }
  return { arbors: arb, W: W, meshes: meshes };
}

/* 由中心轮角度解算全轮系（θ 弧度；同轴轮共用轴角） */
function solveTrain(lay, thetaCenter){
  var th = {};
  th.center = thetaCenter;
  for (var i = 0; i < lay.meshes.length; i++){
    var ms = lay.meshes[i];
    var zA = lay.W[ms.a].z, zB = lay.W[ms.b].z;
    th[lay.W[ms.b].arb] = (ms.S - zA * th[lay.W[ms.a].arb]) / zB;
  }
  return th;
}
/* @CORE-END@ */

/* ==================================================================================
   0. 通用工具
   ================================================================================== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ t = clamp(t,0,1); return t*t*(3-2*t); }
function pathOf(pts){
  var p = new Path2D();
  p.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  p.closePath();
  return p;
}
/* 圆角矩形点集（中心在原点，顺时针） */
function rrPoly(w, h, r, seg){
  seg = seg || 5;
  var hw = w/2, hh = h/2;
  r = Math.min(r, hw, hh);
  var cs = [[hw-r, -hh+r, -90], [hw-r, hh-r, 0], [-hw+r, hh-r, 90], [-hw+r, -hh+r, 180]];
  var pts = [];
  for (var i = 0; i < 4; i++){
    for (var k = 0; k <= seg; k++){
      var a = (cs[i][2] + k*90/seg) * D2R;
      pts.push([cs[i][0] + Math.cos(a)*r, cs[i][1] + Math.sin(a)*r]);
    }
  }
  return pts;
}
/* 点集变换 -> Path2D */
function polyPath(pts, tx, ty, ang){
  var c = Math.cos(ang || 0), s = Math.sin(ang || 0), p = new Path2D();
  for (var i = 0; i < pts.length; i++){
    var x = pts[i][0]*c - pts[i][1]*s + (tx||0);
    var y = pts[i][0]*s + pts[i][1]*c + (ty||0);
    if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
  }
  p.closePath();
  return p;
}
/* 把点集按 平移+旋转 追加进已有路径（不使用 Path2D.addPath，避免子路径被连线） */
function addPolyToPath(p, pts, tx, ty, ang){
  var c = Math.cos(ang || 0), s = Math.sin(ang || 0);
  for (var i = 0; i < pts.length; i++){
    var x = pts[i][0]*c - pts[i][1]*s + (tx || 0);
    var y = pts[i][0]*s + pts[i][1]*c + (ty || 0);
    if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
  }
  p.closePath();
}
/* 环形槽（轮辐镂空开口） */
function annularSlot(p, r0, r1, a0, a1){
  p.moveTo(r1*Math.cos(a0), r1*Math.sin(a0));
  p.arc(0, 0, r1, a0, a1, false);
  p.lineTo(r0*Math.cos(a1), r0*Math.sin(a1));
  p.arc(0, 0, r0, a1, a0, true);
  p.closePath();
}

/* ==================================================================================
   1. 材质
   ================================================================================== */
var MAT = {
  gold : { lo:'#43200f', mid:'#8c5426', hi:'#d9a35f', top:'#ffe6bd', deep:'#2c1408' },
  steel: { lo:'#2b3742', mid:'#6f8496', hi:'#c3d4e2', top:'#f4fbff', deep:'#151d25' },

function metalGrad(g, x, y, r, mat, bias){
  bias = bias || 0;
  var grd = g.createRadialGradient(x - r*0.36, y - r*0.44, r*0.04, x, y, r*1.18);
  grd.addColorStop(0.00, mat.top);
  grd.addColorStop(clamp(0.16 + bias, 0, 0.9), mat.hi);
  grd.addColorStop(clamp(0.52 + bias, 0, 0.95), mat.mid);
  grd.addColorStop(0.86, mat.lo);
  grd.addColorStop(1.00, mat.deep);
  return grd;
}
function linGrad(g, x0, y0, x1, y1, stops){
  var grd = g.createLinearGradient(x0, y0, x1, y1);
  for (var i = 0; i < stops.length; i++) grd.addColorStop(stops[i][0], stops[i][1]);
  return grd;
}

function paintPerlage(g, R){

/* 收腰条形夹板（Finger Bridge / Cock）：沿轴线变宽度 + 圆头 */
function taperedBarPath(x0, y0, x1, y1, w0, w1, bulge){
  var dx = x1-x0, dy = y1-y0, L = Math.sqrt(dx*dx + dy*dy);
  var ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
  var p = new Path2D(), N = 22, i, t, w, x, y;
  for (i = 0; i <= N; i++){
    t = i/N; w = w0 + (w1-w0)*t + bulge*Math.sin(Math.PI*t);
    x = x0 + dx*t + nx*w; y = y0 + dy*t + ny*w;
    if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
  }
  for (i = 0; i <= 10; i++){
    var th = Math.PI*i/10;
    p.lineTo(x1 + w1*(nx*Math.cos(th) + ux*Math.sin(th)),
             y1 + w1*(ny*Math.cos(th) + uy*Math.sin(th)));
  }
  for (i = N; i >= 0; i--){
    t = i/N; w = w0 + (w1-w0)*t + bulge*Math.sin(Math.PI*t);
    p.lineTo(x0 + dx*t - nx*w, y0 + dy*t - ny*w);
  }
  for (i = 0; i <= 10; i++){
    var th2 = Math.PI*i/10;
    p.lineTo(x0 - w0*(nx*Math.cos(th2) + ux*Math.sin(th2)),
             y0 - w0*(ny*Math.cos(th2) + uy*Math.sin(th2)));
  }
  p.closePath();
  return p;
}

function platePath(){

  var ex = (P4.x-P3.x)/d34, ey = (P4.y-P3.y)/d34;

  /* 分轮小夹板 */

  b4.bezierCurveTo(P2.x-40, P2.y-18, P2.x-6, P2.y-40, P2.x+26, P2.y-32);

  b4.bezierCurveTo(P2.x+10, P2.y+40, P2.x-20, P2.y+40, P2.x-34, P2.y+22);

  var rTip = m*(z/2 + 0.85), rRoot = m*(z/2 - 0.95);
  var p = new Path2D(), step = TAU/z;
  p.moveTo(rRoot, 0);
  for (var i = 0; i < z; i++){
    var a = i*step;
    p.lineTo(Math.cos(a + step*0.30)*rRoot*1.06, Math.sin(a + step*0.30)*rRoot*1.06);
    p.lineTo(Math.cos(a + step*0.52)*rTip*0.97, Math.sin(a + step*0.52)*rTip*0.97);
    p.lineTo(Math.cos(a + step*0.62)*rTip,      Math.sin(a + step*0.62)*rTip);

    p.lineTo(Math.cos(a + step*0.82)*rRoot*1.12,Math.sin(a + step*0.82)*rRoot*1.12);
    p.lineTo(Math.cos(step*(i+1))*rRoot,        Math.sin(step*(i+1))*rRoot);

var GONG = {
  low : { R:338, w:5.8, a0: 20, a1:310, hitDeg:296 },

var HAMMER = [];
(function initHammers(){
  function mk(pivDeg, pivR, gongR, sign){
    var p = dial(pivR, pivDeg);
    var L = 74, tipL = L;
    var cosB = (gongR*gongR - pivR*pivR - tipL*tipL)/(2*pivR*tipL);
    var touch = Math.acos(clamp(cosB, -1, 1));
    return {
      pivDeg:pivDeg, pivR:pivR, L:L, x:p.x, y:p.y, sign:sign,
      radial: Math.atan2(p.y, p.x), touch: touch,
      rest: touch + 17*D2R, hit: touch - 5*D2R, ang: touch + 17*D2R,
      hitAt: -1e9, gong: (gongR === GONG.low.R) ? 'low' : 'high'
    };
  }
  HAMMER.push(mk(300, 268, GONG.low.R, -1));
  HAMMER.push(mk(330, 252, GONG.high.R, -1));
})();

function gongRadius(kind, deg, t){
  var G = GONG[kind], phi = deg*D2R, r = G.R;
  for (var i = 0; i < VIB.length; i++){
    var v = VIB[i];
    if (v.gong !== kind) continue;
    var e = t - v.t0;
    if (e < 0 || e > 2.2) continue;
    var amp = 2.6*Math.exp(-e/0.34);
    var sigma = 0.22 + 2.6*e;
    var d = phi - v.phi;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    r += amp*Math.exp(-(d*d)/(2*sigma*sigma))*Math.sin(TAU*26*e - d*7.0);
  }
  return r;
}
function drawGong(g, kind, t){
  var G = GONG[kind], a0 = G.a0*D2R, a1 = G.a1*D2R, N = 420, i, a;
  g.beginPath();
  for (i = 0; i <= N; i++){
    a = a0 + (a1 - a0)*i/N;
    var r = gongRadius(kind, a/D2R, t);
    var x = Math.cos(a - Math.PI/2)*r, y = Math.sin(a - Math.PI/2)*r;
    if (i === 0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.lineWidth = G.w + 4.6; g.lineCap = 'round';
  g.strokeStyle = 'rgba(0,0,0,.72)'; g.stroke();
  g.lineWidth = G.w;
  g.strokeStyle = linGrad(g, -G.R, -G.R, G.R, G.R,

  g.stroke();
  g.lineWidth = G.w*0.36; g.strokeStyle = 'rgba(255,255,255,.72)'; g.stroke();
  var ex = Math.cos(a0 - Math.PI/2)*G.R, ey = Math.sin(a0 - Math.PI/2)*G.R;

  g.restore();
}

function hammerUpdate(t){
  for (var i = 0; i < HAMMER.length; i++){
    var h = HAMMER[i], u = t - h.hitAt;
    if (u < -0.050) h.ang = h.rest;
    else if (u < 0.014) h.ang = lerp(h.rest, h.hit, smooth((u + 0.050)/0.064));
    else if (u < 0.9){
      var damp = Math.exp(-(u - 0.014)*7.5);
      h.ang = lerp(h.hit, h.rest, smooth((u - 0.014)/0.886)) + Math.sin(u*TAU*19)*2.0*D2R*damp;
    } else h.ang = h.rest;
  }
}

function drawSnails(g){
  var hw, mw, cw, i;
  if (!WATCH.th) return;
  hw = WATCH.th.hour; mw = WATCH.th.minute; cw = WATCH.th.center;
  g.save();
  g.save(); g.rotate(hw);
  var p1 = new Path2D(), steps = 12;
  for (i = 0; i < steps; i++){
    var a0 = i*TAU/steps, a1 = (i+1)*TAU/steps;
    var r0 = Math.max(15.5, 22 + (steps - i - 1)*1.55);
    var r1 = Math.max(15.5, 22 + (steps - i - 2)*1.55);
    p1.moveTo(Math.cos(a0)*r0, Math.sin(a0)*r0);
    p1.arc(0,0,r0,a0,a1,false);
    p1.lineTo(Math.cos(a1)*r1, Math.sin(a1)*r1);
    p1.arc(0,0,r1,a1,a0,true);
    p1.closePath();
  }
  g.fillStyle = metalGrad(g, 0, 0, 42, MAT.steel, 0.0);
  g.fill(p1, 'evenodd');
  g.lineWidth = 0.7; g.strokeStyle = 'rgba(255,252,240,.55)'; g.stroke(p1);
  g.restore();
  g.save(); g.rotate(-mw);
  var p2 = new Path2D(), q = 4;
  for (i = 0; i < q; i++){
    var b0 = i*TAU/q, b1 = (i+1)*TAU/q;
    var s0 = 15.5 - i*1.2, s1 = Math.max(9.4, 15.5 - (i+1)*1.2);
    p2.moveTo(Math.cos(b0)*s0, Math.sin(b0)*s0);
    p2.arc(0,0,s0,b0,b1,false);
    p2.lineTo(Math.cos(b1)*s1, Math.sin(b1)*s1);
    p2.arc(0,0,s1,b1,b0,true);
    p2.closePath();
  }
  g.fillStyle = metalGrad(g, 0, 0, 24, MAT.gold, 0.0);
  g.fill(p2, 'evenodd');
  g.lineWidth = 0.6; g.strokeStyle = 'rgba(255,240,210,.6)'; g.stroke(p2);
  g.restore();
  g.save(); g.rotate(cw);
  var p3 = new Path2D();
  for (var seg = 0; seg < 4; seg++){
    var sa = seg*TAU/4, N = 26;
    for (var k = 0; k <= N; k++){
      var tt = k/N, aa = sa + tt*TAU/4, rad = 4.4 + (1 - tt)*3.4;
      if (seg === 0 && k === 0) p3.moveTo(Math.cos(aa)*rad, Math.sin(aa)*rad);
      else p3.lineTo(Math.cos(aa)*rad, Math.sin(aa)*rad);
    }
    p3.lineTo(Math.cos(sa)*4.4, Math.sin(sa)*4.4);
  }
  p3.closePath();
  g.fillStyle = metalGrad(g, 0, 0, 9, MAT.steel, 0.0); g.fill();
  g.lineWidth = 0.5; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
  g.restore();
  drawJewel(g, 0, 0, 4.6, true, false);
  g.restore();
}

function drawHand(g, ang, len, tail, w, thick){
  g.save(); g.rotate(ang);
  /* 指针指向 -Y 方向：ang = 0 即 12 点，顺时针为正 */
  var p = new Path2D();
  p.moveTo(0, tail);
  p.bezierCurveTo(w*0.55, tail*0.4, w*0.62, -len*0.30, w*0.52, -len*0.72);
  p.lineTo(w*0.30, -len*0.965);
  p.lineTo(0, -len);
  p.lineTo(-w*0.30, -len*0.965);
  p.lineTo(-w*0.52, -len*0.72);
  p.bezierCurveTo(-w*0.62, -len*0.30, -w*0.55, tail*0.4, 0, tail);
  p.closePath();
  g.fillStyle = metalGrad(g, -len*0.25, -len*0.35, len, MAT.gold, 0.0);
  g.fill(p);
  if (thick > 0){ g.lineWidth = thick; g.strokeStyle = 'rgba(255,238,205,.66)'; g.stroke(p); }
  var q = new Path2D();
  q.moveTo(0, tail*0.45);
  q.bezierCurveTo(w*0.22, 0, w*0.24, -len*0.34, w*0.16, -len*0.66);
  q.lineTo(0, -len*0.74);
  q.lineTo(-w*0.16, -len*0.66);
  q.bezierCurveTo(-w*0.24, -len*0.34, -w*0.22, 0, 0, tail*0.45);
  q.closePath();
  g.fillStyle = 'rgba(14,9,5,.86)'; g.fill(q);
  g.lineWidth = 0.7; g.strokeStyle = 'rgba(255,232,196,.35)'; g.stroke(q);
  g.restore();
}
function drawHands(g){
  var sec = WATCH.sec;

    g.strokeStyle = 'rgba(216,168,106,.5)'; g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.arc(L.tx, L.ty, 3.2, 0, TAU);
    g.fillStyle = 'rgba(232,190,126,.9)'; g.fill();
    g.beginPath(); g.arc(L.tx, L.ty, 5.6, 0, TAU);
    g.strokeStyle = 'rgba(232,190,126,.45)'; g.stroke();
    var w = g.measureText(L.text).width;
    var bx = (L.ha === 'left') ? ax + 8 : ax - w - 16;
    g.beginPath();
    g.moveTo(bx + 6, ay - 12);
    g.lineTo(bx + w + 10, ay - 12);
    g.quadraticCurveTo(bx + w + 16, ay - 12, bx + w + 16, ay - 6);
    g.lineTo(bx + w + 16, ay + 6);
    g.quadraticCurveTo(bx + w + 16, ay + 12, bx + w + 10, ay + 12);
    g.lineTo(bx + 6, ay + 12);
    g.quadraticCurveTo(bx, ay + 12, bx, ay + 6);
    g.lineTo(bx, ay - 6);
    g.quadraticCurveTo(bx, ay - 12, bx + 6, ay - 12);
    g.closePath();
    g.fillStyle = 'rgba(18,13,9,.82)'; g.fill();
    g.lineWidth = 1; g.strokeStyle = 'rgba(216,168,106,.35)'; g.stroke();
    g.fillStyle = '#f0dfc0';
    g.fillText(L.text, bx + 8, ay + 0.5);
  }
  g.restore();
}

/* ==================================================================================
   10. 三问报时音频：Web Audio 模态合成 + 毫秒级同步
   ================================================================================== */
var AUDIO = { ctx:null, master:null, buf:{}, ready:false, muted:false };
function ensureAudio(){
  if (AUDIO.ctx){
    if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
    return;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var c = new AC();
  AUDIO.ctx = c;
  var master = c.createGain(); master.gain.value = 0.85;
  var comp = c.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 3.2;
  comp.attack.value = 0.002; comp.release.value = 0.28;
  var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
  master.connect(comp); comp.connect(hp); hp.connect(c.destination);
  AUDIO.master = master;
  AUDIO.buf.low  = renderGong(438, 4.2, 1.00);
  AUDIO.buf.high = renderGong(660, 3.8, 0.92);
  AUDIO.ready = true;
}
/* 自由-自由金属棒非谐分音 1 / 2.756 / 5.404 / 8.933 / 13.34 —— 真实音簧金属共鸣 */
function smooth01(v){ v = v < 0 ? 0 : (v > 1 ? 1 : v); return v*v*(3 - 2*v); }
function renderGong(f0, dur, gain){
  var c = AUDIO.ctx, sr = c.sampleRate, N = Math.floor(sr*dur);
  var buf = c.createBuffer(2, N, sr);
  var parts = [
    { r:1.000, a:1.00, tau:3.30, ph:0.0 },
    { r:1.004, a:0.62, tau:2.70, ph:1.1 },
    { r:2.756, a:0.44, tau:1.65, ph:2.3 },
    { r:2.765, a:0.22, tau:1.35, ph:0.7 },
    { r:5.404, a:0.24, tau:0.92, ph:3.1 },
    { r:8.933, a:0.13, tau:0.55, ph:4.4 },
    { r:13.340,a:0.07, tau:0.34, ph:5.6 },
    { r:18.100,a:0.04, tau:0.22, ph:2.8 }
  ];
  /* 用二阶递推振荡器合成衰减正弦（y[n] = 2r·cosω·y[n-1] - r²·y[n-2]），
     与逐样本 sin/exp 完全等价，但快一个数量级，避免首次报时卡顿 */
  for (var ch = 0; ch < 2; ch++){
    var d = buf.getChannelData(ch);
    var det = ch === 0 ? 0.0 : 0.0016;
    var n = parts.length;
    var y1 = new Float64Array(n), y2 = new Float64Array(n);
    var c1 = new Float64Array(n), c2 = new Float64Array(n);
    for (var k = 0; k < n; k++){
      var P = parts[k];
      var w = TAU*f0*(P.r + det)/sr;
      var rf = Math.exp(-1/(P.tau*sr));
      var phi = P.ph + ch*0.6;
      y1[k] = P.a*Math.sin(phi);
      y2[k] = (P.a/rf)*Math.sin(phi - w);
      c1[k] = 2*rf*Math.cos(w);
      c2[k] = -rf*rf;
    }
    for (var i = 0; i < N; i++){
      var t = i/sr, s = 0;
      for (k = 0; k < n; k++){
        var y = c1[k]*y1[k] + c2[k]*y2[k];
        y2[k] = y1[k]; y1[k] = y;
        s += y;
      }
      if (t < 0.006){ var e = 1 - t/0.006; s += e*e*(Math.random()*2 - 1)*0.9; }
      s += 0.10*Math.exp(-t/0.22)*Math.sin(TAU*173*t);
      var tail = dur - t;                       /* 末尾淡出，杜绝截断爆音 */
      var fade = tail < 0.32 ? smooth01(tail/0.32) : 1;
      d[i] = s*Math.min(1, t/0.0016)*fade*0.30*gain;
    }
  }
  return buf;
}
function playGong(kind, at){
  if (!AUDIO.ready || AUDIO.muted) return;
  var c = AUDIO.ctx;
  var src = c.createBufferSource();
  src.buffer = AUDIO.buf[kind];
  var gn = c.createGain();
  gn.gain.value = (kind === 'low') ? 0.95 : 0.78;
  if (c.createStereoPanner){
    var pan = c.createStereoPanner();
    pan.pan.value = (kind === 'low') ? -0.22 : 0.20;
    src.connect(gn); gn.connect(pan); pan.connect(AUDIO.master);
  } else {
    src.connect(gn); gn.connect(AUDIO.master);
  }
  src.start(at);
}
/* 音频时钟 -> 页面时钟（用输出时间戳换算，保证视觉与声音同步） */
function perfFromAudio(at){
  var c = AUDIO.ctx;
  if (!c) return performance.now()/1000;
  if (c.getOutputTimestamp){
    var ts = c.getOutputTimestamp();
    if (ts && ts.contextTime) return ts.performanceTime/1000 + (at - ts.contextTime);
  }
  var lat = c.outputLatency || c.baseLatency || 0;
  return performance.now()/1000 + (at - c.currentTime) + lat;
}
/* 三问报时序列：低音报时 / 高低合音报刻 / 高音报分 */
function buildStrikeSequence(hours, minutes){
  var h = ((hours + 11) % 12) + 1;
  var q = Math.floor(minutes/15);
  var mm = minutes % 15;
  var ev = [], t = 0, i;
  for (i = 0; i < h; i++){ ev.push({ t:t, low:true,  high:false, kind:'h' }); t += 0.62; }
  for (i = 0; i < q; i++){ ev.push({ t:t, low:true,  high:true,  kind:'q' }); t += 0.97; }
  for (i = 0; i < mm; i++){ ev.push({ t:t, low:false, high:true,  kind:'m' }); t += 0.40; }
  return { events:ev, duration:t + 3.4, h:h, q:q, mm:mm };
}
function startRepeat(){
  ensureAudio();
  if (!AUDIO.ctx){ if (hmStrike) hmStrike.textContent = '无音频支持'; return; }
  if (REPEAT.active) return;
  var d = new Date();
  var seq = buildStrikeSequence(d.getHours(), d.getMinutes());
  REPEAT.seq = seq;
  var t0 = AUDIO.ctx.currentTime + 0.10;
  var base = perfFromAudio(t0);
  REPEAT.events = [];
  VIB.length = 0;
  for (var i = 0; i < seq.events.length; i++){
    var e = seq.events[i];
    REPEAT.events.push({ time: base + e.t, low:e.low, high:e.high, kind:e.kind, fired:false, vib:false });
    if (e.low)  playGong('low',  t0 + e.t);
    if (e.high) playGong('high', t0 + e.t);
  }
  REPEAT.active = true;
  REPEAT.end = base + seq.duration;
  REPEAT.govVel = 1;
  var txt = seq.h + ' 时';
  if (seq.q) txt += ' ' + seq.q + ' 刻';
  if (seq.mm) txt += ' ' + seq.mm + ' 分';
  if (hmStrike) hmStrike.textContent = '报时中 · ' + txt;
  if (hmSub) hmSub.textContent = '低音报时 / 合音报刻 / 高音报分';
  var btn = el('btnRepeat');
  if (btn) btn.classList.add('live');
}
function updateRepeat(t){
  var i, e;
  for (i = 0; i < REPEAT.events.length; i++){
    e = REPEAT.events[i];
    if (!e.fired && t >= e.time - 0.050){
      e.fired = true;
      if (e.low)  HAMMER[0].hitAt = e.time;
      if (e.high) HAMMER[1].hitAt = e.time;
    }
    if (!e.vib && t >= e.time){
      e.vib = true;
      if (e.low)  VIB.push({ gong:'low',  t0:e.time, phi:GONG.low.hitDeg*D2R });
      if (e.high) VIB.push({ gong:'high', t0:e.time, phi:GONG.high.hitDeg*D2R });
    }
  }
  if (REPEAT.active){
    REPEAT.governor += 0.62*REPEAT.govVel;
    if (t > REPEAT.end){
      REPEAT.active = false;
      if (hmStrike) hmStrike.textContent = '报时完成';
      if (hmSub) hmSub.textContent = '三问报时';
      var btn = el('btnRepeat');
      if (btn) btn.classList.remove('live');
    }
  } else {
    REPEAT.govVel *= 0.985;
    REPEAT.governor += 0.62*REPEAT.govVel;
  }
  for (i = VIB.length - 1; i >= 0; i--){ if (t - VIB[i].t0 > 2.3) VIB.splice(i,1); }
  if (VIB.length > 40) VIB.splice(0, VIB.length - 40);
}

/* ==================================================================================
   11. 主渲染
   ================================================================================== */
var showLabels = true, soundOn = true, fps = 60, lastFrame = performance.now();
function render(t){
  var g = ctx, s = VIEW.s;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  g.setTransform(s, 0, 0, s, (VIEW.ox + 500*VIEW.scale)*VIEW.dpr, (VIEW.oy + 500*VIEW.scale)*VIEW.dpr);

  var bg = g.createRadialGradient(-90,-190, 60, 0,0, 620);
  bg.addColorStop(0,'rgba(70,50,32,.30)');
  bg.addColorStop(0.42,'rgba(30,22,15,.13)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = bg;
  g.fillRect(-520,-520,1040,1040);

  if (layersDirty){ buildLayers(); layersDirty = false; }
  g.drawImage(layerA.cv, -LAYER_SIZE/2, -LAYER_SIZE/2, LAYER_SIZE, LAYER_SIZE);

  var th = WATCH.th, A = LAY.arbors;
  drawBarrel(g, th.barrel);
  drawGearArt(g, 'centerWheel',  A.center.x, A.center.y, th.centerWheel,  { mat:MAT.gold,  bias:0.04 });
  drawGearArt(g, 'thirdWheel',   A.third.x,  A.third.y,  th.thirdWheel,   { mat:MAT.gold,  bias:0.04 });
  drawGearArt(g, 'fourthWheel',  A.fourth.x, A.fourth.y, th.fourthWheel,  { mat:MAT.gold,  bias:0.04 });
  drawGearArt(g, 'centerPinion', A.center.x, A.center.y, th.centerPinion, { mat:MAT.steel });
  drawGearArt(g, 'thirdPinion',  A.third.x,  A.third.y,  th.thirdPinion,  { mat:MAT.steel });
  drawGearArt(g, 'fourthPinion', A.fourth.x, A.fourth.y, th.fourthPinion, { mat:MAT.steel });
  drawGearArt(g, 'cannonPinion', A.center.x, A.center.y, th.cannonPinion, { mat:MAT.steel });
  drawGearArt(g, 'minuteWheel',  A.minute.x, A.minute.y, th.minuteWheel,  { mat:MAT.steel });
  drawGearArt(g, 'minutePinion', A.minute.x, A.minute.y, th.minutePinion, { mat:MAT.steel });
  drawGearArt(g, 'hourWheel',    A.hour.x,   A.hour.y,   th.hourWheel,    { mat:MAT.gold, bias:0.02 });

  g.drawImage(layerB.cv, -LAYER_SIZE/2, -LAYER_SIZE/2, LAYER_SIZE, LAYER_SIZE);

  drawGong(g, 'low', t);
  drawGong(g, 'high', t);
  drawTourbillon(g, t);
  drawSnails(g);
  drawGovernor(g);
  for (var hi = 0; hi < HAMMER.length; hi++) drawHammer(g, HAMMER[hi]);
  drawHands(g);
  drawCaseTop(g);
  if (showLabels) drawLabels(g);
}

/* ==================================================================================
   12. 交互
   ================================================================================== */
function hitSlide(vx, vy){
  var sx = slide.x - slide.pull*20;
  return vx > sx - slide.w/2 - 16 && vx < sx + slide.w/2 + 16 &&
         vy > slide.y - slide.h/2 - 16 && vy < slide.y + slide.h/2 + 16;
}
var pointerActive = false, pointerStartX = 0;
cv.addEventListener('pointerdown', function(ev){
  var r = cv.getBoundingClientRect();
  var v = toView(ev.clientX - r.left, ev.clientY - r.top);
  if (hitSlide(v.x, v.y)){
    pointerActive = true;
    pointerStartX = v.x;
    slide.pull = Math.max(slide.pull, 0.02);
    if (cv.setPointerCapture) cv.setPointerCapture(ev.pointerId);
    cv.style.cursor = 'grabbing';
  }
});
cv.addEventListener('pointermove', function(ev){
  var r = cv.getBoundingClientRect();
  var v = toView(ev.clientX - r.left, ev.clientY - r.top);
  if (pointerActive){
    slide.pull = clamp((pointerStartX - v.x)/22, 0, 1);
  } else {
    cv.style.cursor = hitSlide(v.x, v.y) ? 'grab' : 'default';
  }
});
function endPointer(){
  if (!pointerActive) return;
  pointerActive = false;
  startRepeat();
  cv.style.cursor = 'default';
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
el('btnRepeat').addEventListener('click', function(){ ensureAudio(); startRepeat(); });
el('chkLabels').addEventListener('change', function(e){ showLabels = e.target.checked; });
el('chkSound').addEventListener('change', function(e){
  soundOn = e.target.checked;
  AUDIO.muted = !soundOn;
  if (AUDIO.master) AUDIO.master.gain.value = soundOn ? 0.85 : 0.0;
});
window.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); ensureAudio(); startRepeat(); }
  if (e.key === 'l' || e.key === 'L'){ showLabels = !showLabels; el('chkLabels').checked = showLabels; }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ==================================================================================
   13. 启动与自检
   ================================================================================== */
buildGearArt();
resize();
syncTime();
hmClock = el('roClock'); hmStrike = el('roStrike'); hmSub = el('roStrikeSub');
hmFps = el('roFps'); hmTour = el('roTour');

/* 自检：中心距误差 + 齿面最小间隙（负值 = 穿模；过大 = 脱节） */
function selfTest(){
  var worstErr = 0, i, report = { 中心距最大误差:0, 齿廓啮合检验:[] };
  for (i = 0; i < LAY.meshes.length; i++){
    if (LAY.meshes[i].centerErr > worstErr) worstErr = LAY.meshes[i].centerErr;
  }
  report.中心距最大误差 = worstErr.toExponential(3);
  for (i = 0; i < 4; i++){
    var ms = LAY.meshes[i], Ga = GEAR[ms.a], Gb = GEAR[ms.b];
    var pa = LAY.arbors[Ga.arb], pb = LAY.arbors[Gb.arb];
    var minGap = Infinity, maxGap = -Infinity;
    for (var k = 0; k < 24; k++){
      var th = solveTrain(LAY, k/24*TAU/12);
      var gap = meshClearance(Ga.pts, pa, th[Ga.arb], Gb.pts, pb, th[Gb.arb],
                              3.6*Math.max(Ga.m, Gb.m), ms.pitch);
      if (gap < minGap) minGap = gap;
      if (gap > maxGap) maxGap = gap;
    }
    report.齿廓啮合检验.push(ms.a + ' ↔ ' + ms.b + '  z=' + ms.zA + '/' + ms.zB +
      '  中心距 d=' + ms.d.toFixed(2) + '  r1+r2=' + ms.centerSum.toFixed(2) +
      '  齿面间隙 ' + minGap.toFixed(3) + ' ~ ' + maxGap.toFixed(3));
  }
  window.__WATCH_SELFTEST__ = report;
  try { console.log('%c[轮系几何自检]', 'color:#d8a86a;font-weight:700', report); } catch(e){}
}
selfTest();

function frame(now){
  requestAnimationFrame(frame);
  var t = now/1000;
  var dt = Math.min(0.1, (now - lastFrame)/1000);
  lastFrame = now;
  if (dt > 0) fps = fps*0.92 + (1/dt)*0.08;

  syncTime();
  updateRepeat(t);        /* 先触发敲击时刻，再求音锤姿态 —— 保证与打簧声同帧同步 */
  hammerUpdate(t);
  if (!pointerActive){ slide.pull *= 0.84; if (slide.pull < 0.01) slide.pull = 0; }

  render(t);

  if (hmClock){
    var d = new Date();
    hmClock.textContent = String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  }
  if (hmFps) hmFps.textContent = fps.toFixed(0);
  if (hmTour) hmTour.textContent = '1 转 / 60 s';
}
requestAnimationFrame(frame);
window.__WATCH__ = { LAY:LAY, GEAR:GEAR, WATCH:WATCH, esc:esc, escpos:ESCPOS, pallet:PALLET,
                    hammer:HAMMER, gong:GONG, vib:VIB, repeat:REPEAT, bal:BAL,
                    startRepeat:startRepeat, selfTest:selfTest };
})();
</script>
