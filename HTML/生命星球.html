// 确定性伪随机与噪声：整个模拟只用这一个随机源，保证同种子同结果。
function makeRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

function gauss(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
}

function smooth(t) { return t * t * (3 - 2 * t); }

// x 方向周期（星球东西相接），y 方向夹紧（南北极是边界）的分形值噪声。
function makeFbm(rng, baseGw, baseGh, octaves) {
  const layers = [];
  for (let o = 0; o < octaves; o++) {
    const gw = baseGw << o, gh = baseGh << o;
    const g = new Float32Array(gw * gh);
    for (let i = 0; i < g.length; i++) g[i] = rng();
    layers.push({ gw, gh, g });
  }
  return function fbm(u, v) {
    let sum = 0, amp = 1, norm = 0;
    for (let k = 0; k < layers.length; k++) {
      const L = layers[k], gw = L.gw, gh = L.gh, g = L.g;

      let x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = smooth(fx - x0), ty = smooth(fy - y0);
      const xa = ((x0 % gw) + gw) % gw, xb = (xa + 1) % gw;
      const ya = Math.max(0, Math.min(gh - 1, y0)), yb = Math.max(0, Math.min(gh - 1, y0 + 1));
      const a = g[ya * gw + xa], b = g[ya * gw + xb], c = g[yb * gw + xa], d = g[yb * gw + xb];

      norm += amp; amp *= 0.5;

  for (let i = 0; i < p.capacity; i++) if (p.alive[i]) biomass += p.mass[i];

const BIOME_NAMES = ["深海", "浅海", "冰原", "荒漠", "草原", "雨林", "高山"];

function biomeOf(world, i) {
  const t = world.temperatureAt(i);

    return world.depth[i] > 0.35 ? 0 : 1;

  const pa = new Float64Array(na), pb = new Float64Array(nb);
  for (let i = 0; i < n; i++) { joint[a[i] * nb + b[i]]++; pa[a[i]]++; pb[b[i]]++; }
  let mi = 0;
  for (let x = 0; x < na; x++) {

    for (let y = 0; y < nb; y++) {

function biomeTraitMutualInfo(sim, permutations = 40) {

    if (tl > max) max = tl;
    if (tl >= 2) above2++;
    if (tl >= 3) above3++;
    sum += tl; n++;

  return { max, mean: n ? sum / n : 0, hist, above2, above3, count: n };

function stableLinks(sim, minSpan = 1000, minCount = 5) {
  const out = [];
  for (const rec of sim.foodWeb.values()) {
    if (rec.count >= minCount && rec.last - rec.first >= minSpan) out.push(rec);
  }
  out.sort((a, b) => b.count - a.count);
  return out;
}

  const rows = [];
  for (const sp of sim.species.values()) {
    if (sp.count > 0) rows.push(sp);
  }
  rows.sort((a, b) => b.count - a.count);
  return rows.slice(0, limit);
}

  for (let i = 0; i < w.size; i++) cells[biomeOf(w, i)]++;

            ctx.beginPath(); ctx.arc(px, py, r, 0, 6.283); ctx.fill();
            if (genes[go + G.SPEED] > 0.25) {
              ctx.strokeStyle = "rgba(255,255,255,.55)";
              ctx.beginPath(); ctx.moveTo(px, py);
              ctx.lineTo(px + Math.cos(p.heading[j]) * r * 2.1, py + Math.sin(p.heading[j]) * r * 2.1);
              ctx.stroke();
            }
          }
        }
        j = p.next[j];
      }
    }
  }
}

// ———————————————— 星球纪事：只从统计里读事件，不参与任何规则 ————————————————
const evLog = [];
let lastEvT = -1, lastMaxTL = 1, bioRecord = 0, specRecord = 0, ashSeen = 0;
const spTier = new Map(), goneReported = new Set();
const TIERS = [200, 1000, 5000, 20000];

function pushEv(text, kind) {
  evLog.unshift({ t: sim.t, text, kind: kind || "" });
  if (evLog.length > 80) evLog.pop();
  const el = $("tickerText");
  if (el) el.textContent = "t=" + fmt(sim.t) + " · " + text;
}

function scanEvents() {
  const h = sim.history;
  if (h.length < 2) return;
  const cur = h[h.length - 1], prev = h[h.length - 2];
  if (cur.t === lastEvT) return;
  lastEvT = cur.t;
  const dp = (cur.pop - prev.pop) / Math.max(1, prev.pop);
  if (dp > 0.35) pushEv("种群暴涨 " + (dp * 100).toFixed(0) + "%，现有 " + fmt(cur.pop) + " 个体", "good");
  else if (dp < -0.3) pushEv("种群骤降 " + (-dp * 100).toFixed(0) + "%，只剩 " + fmt(cur.pop) + " 个体", "bad");
  const mt = sim.stats.maxTrophicEver;
  if (Math.floor(mt) > Math.floor(lastMaxTL)) {
    pushEv("食物链再延长一层：出现营养级 " + mt.toFixed(1) + " 的捕食者", "good");
  }
  lastMaxTL = mt;
  if (cur.biomass > bioRecord * 1.35) { bioRecord = cur.biomass; if (h.length > 3) pushEv("总生物量创新高：" + fmt(cur.biomass), "good"); }
  if (cur.species > specRecord * 1.4) { specRecord = cur.species; if (h.length > 3) pushEv("同时存活物种数创新高：" + fmt(cur.species), "good"); }
  if (sim.world.ash > 0.05 && sim.world.ash > ashSeen + 0.05) {
    ashSeen = sim.world.ash;
    pushEv("尘埃遮蔽 " + (sim.world.ash * 100).toFixed(0) + "% 阳光，全球降温", "bad");
  } else if (sim.world.ash < 0.02) ashSeen = 0;
  for (const sp of speciesTable(sim, 40)) {
    const tier = spTier.get(sp.id) || 0;
    for (let k = TIERS.length - 1; k >= 0; k--) {
      if (sp.count >= TIERS[k] && tier < TIERS[k]) {
        spTier.set(sp.id, TIERS[k]);
        pushEv("物种 #" + sp.id + " 扩张到 " + fmt(sp.count) + " 个体（营养级 " + sp.trophic.toFixed(1) + "）", "good");
        break;
      }
    }
  }
  for (const n of sim.notable.values()) {
    if (n.extinct > 0 && n.peak >= 200 && !goneReported.has(n.id)) {
      goneReported.add(n.id);
      pushEv("物种 #" + n.id + " 灭绝，曾达 " + fmt(n.peak) + " 个体，存续 " + fmt(n.extinct - n.born) + " tick", "bad");
    }
  }
}

function logPanel() {
  if (!evLog.length) return '<div class="hint">还没有值得记录的事件。</div>';
  return evLog.map((e) => '<div class="kv"><span style="color:' +
    (e.kind === "bad" ? "#ff8a7a" : e.kind === "good" ? "#4ce0b3" : "#9fb2c9") + '">' + e.text +
    "</span><b>t=" + fmt(e.t) + "</b></div>").join("");
}

function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return (n | 0) + "";
}
function updateHud() {

function geneBars(i) {
  const g = sim.population.genes, go = i * GENE_COUNT;
  let s = "";
  for (let k = 0; k < GENE_COUNT; k++) {
    const v = g[go + k];
    s += '<div class="gene"><span style="color:#7b8ba3">' + GENE_NAMES[k] + '</span><div class="bar"><i style="width:' +
      (v * 100).toFixed(0) + '%"></i></div><span>' + v.toFixed(2) + "</span></div>";
  }
  return s;
}

function brainSVG(i) {
  const b = sim.brains, n = b.connCount[i];
  const wpx = 300, hpx = 210;
  const posOf = (node) => {
    if (node < NUM_IN) return [26, 12 + node * (hpx - 24) / (NUM_IN - 1)];
    if (node < OUT_BASE) return [wpx / 2, 24 + (node - NUM_IN) * (hpx - 48) / (MAX_HIDDEN - 1)];
    return [wpx - 26, 14 + (node - OUT_BASE) * (hpx - 28) / (NUM_OUT - 1)];
  };
  let s = '<svg width="' + wpx + '" height="' + hpx + '" style="background:#0a0f18;border-radius:6px">';
  const used = new Set();
  for (let k = 0; k < n; k++) {
    const f = b.connFrom[i * MAX_CONN + k], t = b.connTo[i * MAX_CONN + k], w = b.connW[i * MAX_CONN + k];
    used.add(f); used.add(t);
    const [x1, y1] = posOf(f), [x2, y2] = posOf(t);
    const col = w > 0 ? "76,224,179" : "255,110,110";
    s += '<line x1="' + x1 + '" y1="' + y1.toFixed(1) + '" x2="' + x2 + '" y2="' + y2.toFixed(1) +
      '" stroke="rgba(' + col + ',' + Math.min(0.95, 0.25 + Math.abs(w) / 3).toFixed(2) + ')" stroke-width="' +
      Math.min(3, 0.5 + Math.abs(w) / 2).toFixed(2) + '"/>';
  }
  const st = sim.brains.state;
  for (let node = 0; node < NODES; node++) {
    if (!used.has(node) && node >= NUM_IN && node < OUT_BASE) continue;
    const [x, y] = posOf(node);
    const act = st[i * NODES + node];
    const v = Math.max(-1, Math.min(1, act));
    const c = v >= 0 ? "rgb(" + (40 + 120 * v | 0) + "," + (90 + 165 * v | 0) + "," + (80 + 80 * v | 0) + ")"
      : "rgb(" + (90 - 60 * v | 0) + ",60,70)";
    s += '<circle cx="' + x + '" cy="' + y.toFixed(1) + '" r="4" fill="' + c + '" stroke="#233045"/>';
    if (node < NUM_IN) s += '<text x="' + (x - 8) + '" y="' + (y + 3).toFixed(1) + '" font-size="8" fill="#6d7f96" text-anchor="end">' + IN_NAMES[node] + "</text>";
    else if (node >= OUT_BASE) s += '<text x="' + (x + 8) + '" y="' + (y + 3).toFixed(1) + '" font-size="8" fill="#6d7f96">' + OUT_NAMES[node - OUT_BASE] + "</text>";
  }
  s += "</svg>";
  return s;
}

function treePanel() {
  const notes = [...sim.notable.values()].sort((a, b) => b.peak - a.peak).slice(0, 90);
  if (!notes.length) return '<div class="hint">还没有物种达到可入谱系的规模（峰值 ≥ 8 个体）。</div>';

  const X = (t) => 8 + (t - t0) / Math.max(1, t1 - t0) * (wpx - 40);
  const order = new Map(); notes.forEach((n, k) => order.set(n.id, k));
  let s = '<div class="hint">横轴=时间，每条线是一个成规模的物种，分叉=物种形成。</div><svg width="' + wpx + '" height="' + hpx + '" style="background:#0a0f18;border-radius:6px">';
  for (const n of notes) {

function chartPanel() {

// ———————————————— 交互 ————————————————
function screenToWorld(ev) {
  const r = canvas.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  return { x: ((view.x + sx / view.scale) % W + W) % W, y: Math.max(0, Math.min(H - 1, view.y + sy / view.scale)) };
}
let dragging = false, dragMoved = 0, lastPt = null;
canvas.addEventListener("pointerdown", (e) => { dragging = true; dragMoved = 0; lastPt = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  view.x -= dx / view.scale; view.y -= dy / view.scale;
  view.y = Math.max(-40, Math.min(H - 10, view.y));
  lastPt = { x: e.clientX, y: e.clientY };
  follow = false;
});
canvas.addEventListener("pointerup", (e) => {
  dragging = false;
  if (dragMoved > 6) return;
  const wpt = screenToWorld(e);
  const power = +$("cl-power").value;
  if (tool === "meteor") {
    const before = sim.population.count;
    sim.meteor(wpt.x, wpt.y, 26 + 34 * power, power); baseDirty = true;
    pushEv("陨石撞击 (" + (wpt.x | 0) + "," + (wpt.y | 0) + ")，瞬间抹去 " + fmt(before - sim.population.count) + " 个生命", "bad");
  } else if (tool === "volcano") {
    const before = sim.population.count;
    sim.volcano(wpt.x, wpt.y, 10 + 14 * power, power); baseDirty = true;
    pushEv("火山喷发 (" + (wpt.x | 0) + "," + (wpt.y | 0) + ")，吞噬 " + fmt(before - sim.population.count) + " 个生命，同时喷出大量矿物", "bad");
  }
  else {
    let best = -1, bestD = 1e9;
    const p = sim.population;
    for (let dy = -3; dy <= 3; dy++) {
      const y = (wpt.y | 0) + dy;
      if (y < 0 || y >= H) continue;
      for (let dx = -3; dx <= 3; dx++) {
        const x = (((wpt.x | 0) + dx) % W + W) % W;
        let j = sim.cellHead[y * W + x];
        while (j >= 0) {
          if (p.alive[j]) {
            const d = (p.x[j] - wpt.x) ** 2 + (p.y[j] - wpt.y) ** 2;
            if (d < bestD) { bestD = d; best = j; }
          }
          j = p.next[j];
        }
      }
    }
    if (best >= 0) { selected = best; tab = "ind"; syncTabs(); refreshPanel(); }
  }
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const wx = view.x + sx / view.scale, wy = view.y + sy / view.scale;
  const f = e.deltaY < 0 ? 1.25 : 0.8;
  view.scale = Math.max(Math.min(canvas.clientWidth / W, canvas.clientHeight / H) * 0.9, Math.min(40, view.scale * f));
  view.x = wx - sx / view.scale; view.y = wy - sy / view.scale;
  follow = false;
}, { passive: false });

let cinema = false, cinemaTimer = 0, camTarget = null;

// 纪录片模式：镜头自动巡游到当下最有看头的地方（纯观看功能，不影响任何规则）
function pickCinemaTarget() {
  const p = sim.population;
  const rows = speciesTable(sim, 6);
  let pick = -1;
  const mode = (Math.random() * 3) | 0;
  if (mode === 0) {
    let best = -1, bestTL = 1.6;
    for (let i = 0; i < p.capacity; i += 3) {
      if (!p.alive[i]) continue;
      const tl = p.trophicOf(i);
      if (tl > bestTL) { bestTL = tl; best = i; }
    }
    pick = best;
    if (pick >= 0) pushEv("镜头转向一只营养级 " + bestTL.toFixed(1) + " 的猎手", "");
  } else if (mode === 1 && rows.length) {
    const sp = rows[(Math.random() * rows.length) | 0];
    for (let i = 0; i < p.capacity; i++) if (p.alive[i] && p.speciesId[i] === sp.id) { pick = i; break; }
    if (pick >= 0) pushEv("镜头转向当下最兴旺的物种之一 #" + sp.id + "（" + fmt(sp.count) + " 个体）", "");
  } else {
    let bestCell = -1, bestM = 0;
    for (let k = 0; k < sim.touchedCount; k += 7) {
      const c = sim.touched[k];
      if (sim.cellBiomass[c] > bestM) { bestM = sim.cellBiomass[c]; bestCell = c; }
    }
    if (bestCell >= 0) {
      let j = sim.cellHead[bestCell];
      while (j >= 0 && !p.alive[j]) j = p.next[j];
      pick = j;
      if (pick >= 0) pushEv("镜头转向生命最密集的一片群落", "");
    }
  }
  if (pick >= 0) { selected = pick; camTarget = { zoom: 5 + Math.random() * 5 }; refreshPanel(); }
}

function loop() {
  requestAnimationFrame(loop);
  const budget = speed === 99 ? 55 : 13;
  const want = speed === 99 ? 1e9 : speed;
