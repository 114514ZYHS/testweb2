<!-- 视图脚本：独立打开时 type=module 生效；被 load() 时按普通脚本复制执行 -->
<script data-diorama-view type="module">
(function () {
  // ---------- 内联资产解码（gzip+base64 → 文本，用原生 DecompressionStream） ----------
  function assetParts(name) {
    var bag = window.__DIORAMA_ASSETS__
    if (!bag || !bag[name]) return ''
    var parts = bag[name]
    if (Object.prototype.toString.call(parts) !== '[object Array]') return ''
    return parts.join('')
  }

  function decodeText(b64) {
    if (!b64) return Promise.reject(new Error('资产为空'))
    var bin = atob(b64)
    var u8 = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i)
    if (typeof DecompressionStream !== 'function') {
      return Promise.reject(new Error('浏览器不支持 DecompressionStream'))
    }
    var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))
    return new Response(stream).text()
  }

  function importText(src) {
    var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))
    return import(url).then(function (mod) {
      try { URL.revokeObjectURL(url) } catch (e) {}
      return mod
    })
  }

  // 顺序尝试多个来源，返回第一个成功的 Promise 结果
  function firstOf(thunks) {
    var chain = Promise.reject(new Error('start'))
    var lastErr = null
    thunks.forEach(function (fn) {
      chain = chain.catch(function () {
        return Promise.resolve().then(fn).catch(function (e) { lastErr = e; throw e })
      })
    })
    return chain.catch(function () { throw lastErr || new Error('全部来源失败') })
  }

  // ---------- three.js：内联 blob → 同目录文件 → CDN ----------
  function loadThree() {
    if (window.THREE_INJECTED) return Promise.resolve(window.THREE_INJECTED)
    var sources = []
    if (assetParts('three')) sources.push(function () { return decodeText(assetParts('three')).then(importText) })
    if (window.__DIORAMA_BASE__) sources.push(function () { return import(window.__DIORAMA_BASE__ + '/vendor/three.module.js') })
    sources.push(function () { return import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js') })
    return firstOf(sources)
  }

  // ---------- 场景 bundle：内联 blob → 同目录文件 ----------
  function loadBundle() {
    var sources = []
    if (assetParts('bundle')) sources.push(function () { return decodeText(assetParts('bundle')).then(importText) })
    if (window.__DIORAMA_BASE__) sources.push(function () { return import(window.__DIORAMA_BASE__ + '/build/bundle.js?v=' + Date.now()) })
    sources.push(function () { return import(new URL('build/bundle.js?v=' + Date.now(), document.baseURI).href) })
    return firstOf(sources)
  }

  function fail(msg) {
    var f = document.getElementById('fatal')
    if (!f) { console.error('[diorama] ' + msg); return }
    f.style.display = 'block'
    f.textContent += msg + String.fromCharCode(10)
  }

  // ---------- boot(el)：可以被独立页面或 Cordis 插件调用 ----------
  function boot(el) {
    var host = el || document.getElementById('stage') || document.body
    if (host.getAttribute && host.getAttribute('data-diorama-booted') === '1') return null
    if (host.setAttribute) host.setAttribute('data-diorama-booted', '1')
    return loadThree().then(function (THREE) {
      window.THREE_INJECTED = THREE
      // bundle 已由经典 script 执行过（独立页）或由 loader 预载（插件）→ 只在缺失时补载
      return window.__DT__ ? null : loadBundle()
    }).then(function () {
      var DT = window.__DT__
      if (!DT) { fail('场景 bundle 未初始化 window.__DT__'); return null }
      DT.three = DT.three || window.THREE_INJECTED
      var app = DT.build({ hostEl: host })
      if (!app) { fail('DT.build 返回空'); return null }
      var boot = document.getElementById('boot')
      if (boot) {
        setTimeout(function () { boot.classList.add('hidden') }, 240)
        setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot) }, 1000)
      }
      var r = app.report
      if (r && r.errors && r.errors.length) {
        var lines = ['模块异常：']
        for (var i = 0; i < r.errors.length; i++) lines.push(' · ' + r.errors[i].name + ': ' + r.errors[i].message)
        fail(lines.join(String.fromCharCode(10)))
      }
      function fit() {
        var w = host.clientWidth || 900
        var h = host.clientHeight || 560
        app.renderer.setSize(w, h, false)
        app.camera.aspect = w / Math.max(1, h)
        app.camera.updateProjectionMatrix()
      }
      window.addEventListener('resize', fit)
      setTimeout(fit, 50)
      if (typeof ResizeObserver === 'function') {
        try { new ResizeObserver(fit).observe(host) } catch (e) {}
      }
      window.__DIORAMA_APP__ = app
      console.warn('[diorama] 3D 箱庭小镇 v1.0.0 就绪 · 模块 ' +
        (r && r.modules ? r.modules.map(function (m) { return m.name }).join(',') : '?') +
        ' · 三角面 ' + (r ? r.triangles : 0) + ' · draw ' + (r ? r.drawCalls : 0))
      return app
    }).catch(function (err) {
      fail('启动失败: ' + (err && err.message ? err.message : err))
      return null
    })
  }

  window.__DIORAMA_VIEW__ = { boot: boot, loadThree: loadThree, loadBundle: loadBundle, fail: fail }

  // 独立页面自举：等 DOM 就绪。
  // 注意：bundle 已由下面的经典 <script id="bundle-src"> 执行过一次，所以这里绝不重复 import bundle，
  // 否则每个模块会 register 两次（并出现两份场景）。
  function selfBoot() {
    loadThree().then(function (THREE) {
      window.THREE_INJECTED = THREE
      return boot(document.getElementById('stage'))
    })
  }
  if (document.getElementById('stage')) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(selfBoot, 0) })
    else setTimeout(selfBoot, 0)
  }
})()
</script>
