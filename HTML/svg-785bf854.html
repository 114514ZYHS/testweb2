<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>北极熊骑着秦始皇</title>
  <desc>Q版扁平矢量卡通：一头白色北极熊骑着半蹲匍匐、奋力前爬的秦始皇，在冰原雪地上狂奔。纯 SVG + 内联 CSS 动画，无 JS、无外部资源。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17527c"/>
      <stop offset="45%" stop-color="#5ea3cd"/>
      <stop offset="100%" stop-color="#d6ecfa"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6ff"/>
      <stop offset="45%" stop-color="#c2e1f4"/>
      <stop offset="100%" stop-color="#8dc0de"/>
    </linearGradient>
    <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#eaf6ff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40688a"/>
      <stop offset="100%" stop-color="#26465f"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#dcecf7"/>
    </linearGradient>
  </defs>

  <style>
    /* ============ 通用 ============ */
    .ln{stroke-linejoin:round;stroke-linecap:round}

    /* 1. 整体组合奔跑颠簸（上下起伏 + 轻微俯仰） */
    @keyframes gallop{
      0%  {transform:translate(0,0) rotate(0deg)}
      20% {transform:translate(0,-16px) rotate(-1.5deg)}
      40% {transform:translate(0,-3px) rotate(.4deg)}
      60% {transform:translate(0,-18px) rotate(1.6deg)}
      80% {transform:translate(0,-4px) rotate(-.6deg)}
      100%{transform:translate(0,0) rotate(0deg)}
    }
    #runner{transform-box:fill-box;transform-origin:50% 92%;animation:gallop .62s ease-in-out infinite}

    /* 2. 秦始皇双腿交替蹬地 */
    @keyframes legSwing{
      0%,100%{transform:rotate(-17deg)}
      50%    {transform:rotate(19deg)}
    }
    .legFar{transform-box:fill-box;transform-origin:84% 16%;animation:legSwing .62s ease-in-out infinite}
    .legNear{transform-box:fill-box;transform-origin:77% 16%;animation:legSwing .62s ease-in-out infinite;animation-delay:-.31s}

    /* 3. 双臂（袖）前撑摆动 */
    @keyframes armPush{
      0%,100%{transform:rotate(-4deg)}
      50%    {transform:rotate(5deg)}
    }
    .armFar{transform-box:fill-box;transform-origin:18% 12%;animation:armPush .62s ease-in-out infinite;animation-delay:-.16s}
    .armNear{transform-box:fill-box;transform-origin:14% 10%;animation:armPush .62s ease-in-out infinite}

    /* 4. 冕冠珠帘左右摇晃 */
    @keyframes beadSwing{
      0%,100%{transform:rotate(-8deg)}
      50%    {transform:rotate(8deg)}
    }
    .beads{transform-box:fill-box;transform-origin:50% 0%;animation:beadSwing 1.1s ease-in-out infinite}
    .beads.b2{animation-duration:1.32s;animation-delay:-.42s}
    .beads.b3{animation-duration:1.24s;animation-delay:-.78s}

    /* 5. 披风 / 衣袖飘动 */
    @keyframes capeFlutter{
      0%,100%{transform:rotate(-2.5deg) skewX(0deg)}
      50%    {transform:rotate(3.5deg) skewX(-3deg)}
    }
    .cape{transform-box:fill-box;transform-origin:100% 30%;animation:capeFlutter .9s ease-in-out infinite}

    /* 6. 北极熊身体前倾后仰 */
    @keyframes bearLean{
      0%,100%{transform:rotate(-3.4deg) translate(2px,2px)}
      50%    {transform:rotate(3.8deg) translate(-2px,-3px)}
    }
    .bearLean{transform-box:fill-box;transform-origin:45% 96%;animation:bearLean .62s ease-in-out infinite}

    /* 7. 前爪挥动 / 搭肩爪微动 */
    @keyframes pawWave{
      0%,100%{transform:rotate(-13deg)}
      50%    {transform:rotate(15deg)}
    }
    .pawWave{transform-box:fill-box;transform-origin:6% 88%;animation:pawWave .75s ease-in-out infinite}
    @keyframes pawRest{
      0%,100%{transform:translateY(0) rotate(0deg)}
      50%    {transform:translateY(-4px) rotate(-2.5deg)}
    }
    .pawRest{transform-box:fill-box;transform-origin:20% 0%;animation:pawRest .62s ease-in-out infinite}

    /* 8. 耳朵 / 尾巴轻摆 */
    @keyframes earWiggle{
      0%,100%{transform:rotate(-7deg)}
      50%    {transform:rotate(8deg)}
    }
    .earL{transform-box:fill-box;transform-origin:50% 100%;animation:earWiggle .7s ease-in-out infinite}
    .earR{transform-box:fill-box;transform-origin:50% 100%;animation:earWiggle .72s ease-in-out infinite;animation-delay:-.36s}
    @keyframes tailWag{
      0%,100%{transform:rotate(-15deg)}
      50%    {transform:rotate(15deg)}
    }
    .tail{transform-box:fill-box;transform-origin:100% 50%;animation:tailWag .48s ease-in-out infinite}

    /* 9. 眨眼 */
    @keyframes blink{
      0%,90%,100%{transform:scaleY(1)}
      94%        {transform:scaleY(.08)}
    }
    .eyeBlink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.6s ease-in-out infinite}
    .eyeBlink.e2{animation-delay:-1.2s}

    /* 10. 胡子抖动 */
    @keyframes beardShake{
      0%,100%{transform:rotate(-2.6deg)}
      50%    {transform:rotate(3.2deg)}
    }
    .beard{transform-box:fill-box;transform-origin:50% 4%;animation:beardShake .45s ease-in-out infinite}

    /* 11. 汗滴 */
    @keyframes sweatFly{
      0%  {transform:translate(0,0) scale(.5);opacity:0}
      20% {transform:translate(6px,6px) scale(.9);opacity:1}
      100%{transform:translate(30px,34px) scale(1.1);opacity:0}
    }
    .sweat{transform-box:fill-box;transform-origin:50% 0%;animation:sweatFly 1.8s ease-out infinite}

    /* 12. 雪花飘落 */
    @keyframes snowfall{
      0%  {transform:translate(0,-70px);opacity:0}
      10% {opacity:1}
      90% {opacity:1}
      100%{transform:translate(-80px,660px);opacity:0}
    }
    @keyframes snowSway{
      0%,100%{transform:translateX(-11px)}
      50%    {transform:translateX(11px)}
    }
    .flake{animation:snowfall linear infinite}
    .flake>circle{transform-box:fill-box;transform-origin:center;animation:snowSway ease-in-out infinite}

    /* 13. 速度线循环移动 */
    @keyframes speedLine{
      0%  {transform:translateX(180px);opacity:0}
      14% {opacity:.85}
      78% {opacity:.85}
      100%{transform:translateX(-900px);opacity:0}
    }
    .speed{animation:speedLine linear infinite}

    /* 14. 地面雪尘向后飞 */
    @keyframes puffFly{
      0%  {transform:translate(34px,4px) scale(.35);opacity:.95}
      100%{transform:translate(-140px,-34px) scale(1.6);opacity:0}
    }
    .puff{transform-box:fill-box;transform-origin:center;animation:puffFly 1.1s linear infinite}

    /* 15. 影子随颠簸缩放 */
    @keyframes shadowPulse{
      0%,100%{transform:scaleX(1);opacity:.3}
      50%    {transform:scaleX(.86);opacity:.19}
    }
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadowPulse .62s ease-in-out infinite}

    /* 16. 长城旗帜飘动 */
    @keyframes flagWave{
      0%,100%{transform:skewY(-5deg) scaleX(1)}
      50%    {transform:skewY(6deg) scaleX(.9)}
    }
    .flag{transform-box:fill-box;transform-origin:0% 50%;animation:flagWave .8s ease-in-out infinite}
  </style>
