<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>齐天大圣 · 腾云驾机 | SVG 2D 动画</title>
<style>
  :root{ --spd:1; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(1100px 620px at 50% -12%, #1d3055 0%, #0a1226 55%, #04060c 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#eaf3ff; overflow:auto; padding:18px;
  }
  .stage{
    position:relative;
    width:min(100%, calc((100vh - 60px) * 16 / 9));
    aspect-ratio:16 / 9;
    border-radius:20px; overflow:hidden;
    --spd:1;
    box-shadow:
      0 42px 90px -34px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.10),
      0 0 120px -30px rgba(86,168,255,.45);
  }
  .stage svg{ display:block; width:100%; height:100%; }

  /* ---------- 视差滚动 ---------- */
  @keyframes cloudDrift{ from{ transform:translateX(0); } to{ transform:translateX(-2300px); } }
  .drift{ animation:cloudDrift calc(58s / var(--spd)) linear infinite; }
  .drift.m{ animation-duration:calc(30s / var(--spd)); }
  .drift.n{ animation-duration:calc(12s / var(--spd)); }
  @keyframes mtnDrift{ from{ transform:translateX(0); } to{ transform:translateX(-600px); } }
  .mtn{ animation:mtnDrift calc(120s / var(--spd)) linear infinite; }
  .mtn.b{ animation-duration:calc(74s / var(--spd)); }

  .stage.paused *{ animation-play-state:paused !important; }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:clamp(12px,2.2%,26px);
  }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .title{ text-shadow:0 3px 14px rgba(4,20,44,.85); line-height:1.25; }
  .title .zh{
    display:block; font-size:clamp(16px,2.5vw,31px); font-weight:800; letter-spacing:.16em;
    background:linear-gradient(180deg,#fffdf2 12%,#ffd766 58%,#f0a52c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 rgba(120,60,0,.35));
  }
  .title .en{
    display:block; margin-top:.35em; font-size:clamp(8px,.95vw,11px);
    letter-spacing:.34em; color:#dceaff; opacity:.72;
  }
  .seal{
    font-size:clamp(10px,1.1vw,13px); letter-spacing:.24em; color:#ffe6a8;
    border:1px solid rgba(255,214,102,.5); border-radius:999px;
    padding:.42em .95em; background:rgba(9,22,44,.42); backdrop-filter:blur(3px);
    white-space:nowrap; opacity:.9;
  }
  .controls{ display:flex; gap:10px; align-items:center; pointer-events:auto; }
  .controls button{
    font:inherit; font-size:clamp(11px,1.05vw,14px); letter-spacing:.06em;
    color:#eaf3ff; cursor:pointer;
    padding:.62em 1.15em; border-radius:999px;
    border:1px solid rgba(190,222,255,.34);
    background:linear-gradient(180deg,rgba(48,86,138,.62),rgba(12,26,50,.72));
    backdrop-filter:blur(6px); transition:transform .16s, border-color .16s, background .16s;
    white-space:nowrap;
  }
  .controls button:hover{ transform:translateY(-2px); border-color:rgba(255,214,102,.72); background:linear-gradient(180deg,rgba(70,118,178,.7),rgba(16,34,64,.8)); }
  .controls button:active{ transform:translateY(0) scale(.97); }
  .hint{ font-size:clamp(9px,.92vw,11px); letter-spacing:.12em; color:#dbe9fb; opacity:.78; align-self:center; }

  @media (max-width:640px){ .hint{ display:none; } }
  @media (prefers-reduced-motion:reduce){ .stage *{ animation-play-state:paused !important; } }
</style>
</head>
<body>
<main class="stage" id="stage">
<svg id="scene" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="孙悟空驾驶红色螺旋桨飞机穿行在云海之上的 2D 动画">

  <defs>
    <!-- ============ 渐变 ============ -->
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b3a76"/>
      <stop offset="26%"  stop-color="#2a7ac2"/>
      <stop offset="52%"  stop-color="#6fb8e6"/>
      <stop offset="76%"  stop-color="#b7dff6"/>
      <stop offset="100%" stop-color="#e9f7ff"/>
    </linearGradient>
    <radialGradient id="gSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8d6" stop-opacity=".95"/>
      <stop offset="34%"  stop-color="#ffe28c" stop-opacity=".42"/>
      <stop offset="70%"  stop-color="#ffd76a" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSun" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#fffdf3"/>
      <stop offset="55%"  stop-color="#ffeda9"/>
      <stop offset="100%" stop-color="#ffcb4f"/>
    </radialGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="58%"  stop-color="#f4faff"/>
      <stop offset="100%" stop-color="#c9e0f3"/>
    </linearGradient>
    <linearGradient id="gCloudWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffdf6"/>
      <stop offset="60%"  stop-color="#fdf1dc"/>
      <stop offset="100%" stop-color="#e6d3bb"/>
    </linearGradient>
    <linearGradient id="gMtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bcdcf3"/>
      <stop offset="100%" stop-color="#9dc3e3"/>
    </linearGradient>
    <linearGradient id="gMtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9dc4e4"/>
      <stop offset="100%" stop-color="#7ba6cd"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff6cf"/>
      <stop offset="34%"  stop-color="#ffdc6b"/>
      <stop offset="68%"  stop-color="#f0a92c"/>
      <stop offset="100%" stop-color="#c07a0c"/>
    </linearGradient>
    <linearGradient id="gGoldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c07a0c"/>
      <stop offset="26%"  stop-color="#ffe07a"/>
      <stop offset="58%"  stop-color="#f5b93f"/>
      <stop offset="100%" stop-color="#a86608"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff7f68"/>
      <stop offset="42%"  stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d1418"/>
    </linearGradient>
    <linearGradient id="gRedDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d33540"/>
      <stop offset="100%" stop-color="#8d1116"/>
    </linearGradient>
    <linearGradient id="gCape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff8a72"/>
      <stop offset="45%"  stop-color="#e63946"/>
      <stop offset="100%" stop-color="#a01318"/>
    </linearGradient>
    <linearGradient id="gFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d59a5c"/>
      <stop offset="100%" stop-color="#8d5726"/>
    </linearGradient>
    <linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff0d6"/>
      <stop offset="100%" stop-color="#f0c795"/>
    </linearGradient>
    <linearGradient id="gGlass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".46"/>
      <stop offset="42%"  stop-color="#cdeeff" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#5ea8d6" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="gFeather" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#ff9a5a"/>
      <stop offset="46%"  stop-color="#e63946"/>
      <stop offset="100%" stop-color="#8d1116"/>
    </linearGradient>

    <!-- ============ 滤镜 ============ -->
    <filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- ============ 云朵元件 ============ -->
    <g id="cloudA">
      <ellipse cx="76"  cy="62" rx="72" ry="29" fill="url(#gCloud)"/>
      <ellipse cx="152" cy="54" rx="58" ry="36" fill="url(#gCloud)"/>
      <ellipse cx="112" cy="34" rx="48" ry="30" fill="url(#gCloud)"/>
      <ellipse cx="192" cy="70" rx="50" ry="21" fill="url(#gCloud)"/>
      <ellipse cx="36"  cy="72" rx="40" ry="18" fill="url(#gCloud)"/>
      <ellipse cx="112" cy="22" rx="30" ry="17" fill="#ffffff" opacity=".85"/>
    </g>
    <g id="cloudB">
      <ellipse cx="60"  cy="52" rx="60" ry="26" fill="url(#gCloud)"/>
      <ellipse cx="140" cy="46" rx="66" ry="34" fill="url(#gCloud)"/>
      <ellipse cx="206" cy="60" rx="46" ry="22" fill="url(#gCloud)"/>
      <ellipse cx="100" cy="26" rx="42" ry="24" fill="#ffffff" opacity=".9"/>
      <ellipse cx="24"  cy="64" rx="32" ry="15" fill="url(#gCloud)"/>
    </g>
    <g id="cloudC">
      <ellipse cx="90"  cy="46" rx="88" ry="34" fill="url(#gCloud)"/>
      <ellipse cx="186" cy="52" rx="70" ry="30" fill="url(#gCloud)"/>
      <ellipse cx="132" cy="22" rx="52" ry="22" fill="#ffffff" opacity=".92"/>
      <ellipse cx="34"  cy="60" rx="46" ry="20" fill="url(#gCloud)"/>
    </g>

    <path id="ray" d="M -13 -70 L 0 -196 L 13 -70 Z" fill="#fff7d2"/>
    <g id="mtnTile">
      <path d="M0 606 L 46 520 L 78 566 L 122 486 L 160 552 L 196 520 L 236 588
               L 284 500 L 322 560 L 366 512 L 404 574 L 448 508 L 492 566
               L 540 522 L 574 578 L 600 606 L600 700 L0 700 Z"/>
      <path d="M 105 518 L 122 486 L 139 518 L 130 506 L 122 518 L 113 506 Z" fill="#ffffff" opacity=".72"/>
      <path d="M 271 530 L 284 500 L 297 530 L 290 519 L 284 530 L 277 519 Z" fill="#ffffff" opacity=".6"/>
      <path d="M 431 540 L 448 508 L 465 540 L 456 527 L 448 540 L 440 527 Z" fill="#ffffff" opacity=".72"/>
      <path d="M 32 536 L 46 520 L 60 536 L 54 529 L 46 540 L 39 529 Z" fill="#ffffff" opacity=".5"/>
    </g>
    <path id="mtnTile2" d="M0 628 Q 74 556 142 604 Q 214 654 268 600 Q 330 540 392 606 Q 452 668 512 612 Q 566 562 600 590 L600 700 L0 700 Z"/>

    <clipPath id="clipFuselage">
      <path d="M 196 -44 C 214 -38 224 -22 224 -2 C 224 18 214 34 196 40
               C 150 58 70 62 -10 58 C -110 53 -200 36 -244 16
               C -254 11 -256 -9 -246 -14 C -200 -34 -110 -52 -10 -58
               C 70 -63 150 -58 196 -44 Z"/>
    </clipPath>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="1200" height="675" fill="url(#gSky)"/>

  <!-- ================= 太阳 ================= -->
  <g transform="translate(1012,118)">
    <circle r="235" fill="url(#gSunGlow)"/>
    <g opacity=".45" filter="url(#fSoft)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <use href="#ray"/>
      <use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(315)"/>
    </g>
    <circle r="62" fill="#fffbe8" opacity=".55" filter="url(#fGlow)"/>
    <circle r="54" fill="url(#gSun)"/>
  </g>

  <!-- ================= 远山 ================= -->
  <g opacity=".6">
    <g class="mtn">
      <use href="#mtnTile" x="0" fill="url(#gMtnFar)"/>
      <use href="#mtnTile" x="600" fill="url(#gMtnFar)"/>
      <use href="#mtnTile" x="1200" fill="url(#gMtnFar)"/>
      <use href="#mtnTile" x="1800" fill="url(#gMtnFar)"/>
    </g>
  </g>
  <g opacity=".85">
    <g class="mtn b">
      <use href="#mtnTile2" x="0" fill="url(#gMtnNear)"/>
      <use href="#mtnTile2" x="600" fill="url(#gMtnNear)"/>
      <use href="#mtnTile2" x="1200" fill="url(#gMtnNear)"/>
      <use href="#mtnTile2" x="1800" fill="url(#gMtnNear)"/>
    </g>
  </g>
  <rect y="596" width="1200" height="79" fill="#eaf7ff" opacity=".55"/>

  <!-- ================= 远层云 ================= -->
  <g opacity=".55">
    <g transform="translate(1300,108)"><g class="drift"><use href="#cloudC" transform="scale(.5)"/></g></g>
    <g transform="translate(840,214)"><g class="drift"><use href="#cloudA" transform="scale(.72)"/></g></g>
    <g transform="translate(380,86)"><g class="drift"><use href="#cloudB" transform="scale(.46)"/></g></g>
    <g transform="translate(-80,246)"><g class="drift"><use href="#cloudC" transform="scale(.66)"/></g></g>
    <g transform="translate(-540,164)"><g class="drift"><use href="#cloudB" transform="scale(.58)"/></g></g>
  </g>

  <!-- ================= 鸟群 ================= -->
  <g fill="none" stroke="#3d6b96" stroke-width="2.6" stroke-linecap="round" opacity=".55">
    <g transform="translate(1120,392)"><g class="drift">
      <path d="M0 0 q 9 -8 18 0 q 9 -8 18 0"><animate attributeName="d" dur=".62s" repeatCount="indefinite"
        values="M0 0 q 9 -8 18 0 q 9 -8 18 0; M0 4 q 9 6 18 0 q 9 6 18 0; M0 0 q 9 -8 18 0 q 9 -8 18 0"/></path>
      <path d="M 30 26 q 7 -6 14 0 q 7 -6 14 0" transform="translate(0,0)"><animate attributeName="d" dur=".54s" repeatCount="indefinite"
        values="M 30 26 q 7 -6 14 0 q 7 -6 14 0; M 30 30 q 7 5 14 0 q 7 5 14 0; M 30 26 q 7 -6 14 0 q 7 -6 14 0"/></path>
      <path d="M -18 34 q 6 -5 12 0 q 6 -5 12 0"><animate attributeName="d" dur=".7s" repeatCount="indefinite"
        values="M -18 34 q 6 -5 12 0 q 6 -5 12 0; M -18 38 q 6 4 12 0 q 6 4 12 0; M -18 34 q 6 -5 12 0 q 6 -5 12 0"/></path>
    </g></g>
  </g>

  <!-- ================= 中层云 ================= -->
  <g opacity=".82">
    <g transform="translate(1300,300)"><g class="drift m"><use href="#cloudB" transform="scale(.95)"/></g></g>
    <g transform="translate(840,196)"><g class="drift m"><use href="#cloudC" transform="scale(1.02)"/></g></g>
    <g transform="translate(380,372)"><g class="drift m"><use href="#cloudA" transform="scale(.86)"/></g></g>
    <g transform="translate(-80,262)"><g class="drift m"><use href="#cloudB" transform="scale(1.08)"/></g></g>
    <g transform="translate(-540,344)"><g class="drift m"><use href="#cloudC" transform="scale(.9)"/></g></g>
  </g>

  <!-- ================= 速度线 ================= -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".5">
    <g>
      <animateTransform attributeName="transform" type="translate" values="420 0; -520 0" dur="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="252" x2="150" y2="252" stroke-width="3" opacity=".5">
        <animate attributeName="opacity" values="0;.75;0" dur="1.5s" repeatCount="indefinite"/></line>
      <line x1="0" y1="418" x2="96" y2="418" stroke-width="2.4" opacity=".4">
        <animate attributeName="opacity" values="0;.6;0" dur="1.9s" begin="-.6s" repeatCount="indefinite"/></line>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="480 0; -460 0" dur="2.1s" begin="-1.1s" repeatCount="indefinite"/>
      <line x1="0" y1="182" x2="120" y2="182" stroke-width="2.6">
        <animate attributeName="opacity" values="0;.55;0" dur="2.1s" begin="-1.1s" repeatCount="indefinite"/></line>
      <line x1="0" y1="486" x2="170" y2="486" stroke-width="3">
        <animate attributeName="opacity" values="0;.5;0" dur="2.1s" begin="-1.1s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <!-- =================================================================
       飞机 + 孙悟空
       ================================================================= -->
  <g transform="translate(618,332)">
    <g id="planeBob">
      <animateTransform attributeName="transform" type="translate" values="0 13; 0 -13; 0 13"
        dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g id="planeTilt">
        <animateTransform attributeName="transform" type="rotate" values="-1.8;1.8;-1.8"
          dur="5.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>

        <!-- 机翼投影 -->
        <ellipse cx="-30" cy="150" rx="260" ry="26" fill="#7fb4dd" opacity=".28" filter="url(#fSoft)"/>

        <!-- 尾翼（竖） -->
        <g>
          <path d="M -246 -4 C -254 -42 -246 -80 -228 -106 C -219 -119 -204 -117 -200 -102
                   C -190 -70 -184 -34 -184 -2 Z"
                fill="url(#gRedDark)" stroke="#7d1119" stroke-width="3" stroke-linejoin="round"/>
          <path d="M -238 -14 C -244 -46 -238 -76 -224 -98 C -219 -106 -211 -105 -208 -96
                   C -200 -68 -195 -38 -194 -12 Z" fill="url(#gGold)" opacity=".9"/>
          <path d="M -232 -96 C -224 -110 -206 -110 -200 -98 L -206 -78 C -216 -88 -224 -92 -232 -96 Z" fill="#ffd166"/>
        </g>

        <!-- 平尾 -->
        <path d="M -238 4 C -280 -2 -312 -4 -320 0 C -328 5 -322 14 -312 16 C -282 22 -256 18 -232 14 Z"
              fill="url(#gRedDark)" stroke="#7d1119" stroke-width="3" stroke-linejoin="round"/>

        <!-- 远侧机翼（低单翼，仅露出一点暗色翼尖） -->
        <g transform="translate(-16,10) rotate(-171)">
          <path d="M 0 -28 L 128 -22 Q 162 -17 164 0 Q 162 17 128 22 L 0 28 Z"
                fill="#8f151c" stroke="#6d0f16" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 126 -20 Q 158 -15 160 0 Q 158 14 126 20 Z" fill="url(#gGold)" opacity=".8"/>
        </g>

        <!-- 尾流 -->
        <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".38">
          <path d="M -320 12 C -400 22 -470 34 -560 44" stroke-width="7" filter="url(#fSoft)">
            <animate attributeName="opacity" values=".14;.42;.14" dur="2.8s" repeatCount="indefinite"/></path>
          <path d="M -168 -86 C -250 -104 -330 -118 -430 -128" stroke-width="5" filter="url(#fSoft)">
            <animate attributeName="opacity" values=".1;.3;.1" dur="3.4s" begin="-.8s" repeatCount="indefinite"/></path>
        </g>

        <!-- 机身 -->
        <path d="M 196 -44 C 214 -38 224 -22 224 -2 C 224 18 214 34 196 40
                 C 150 58 70 62 -10 58 C -110 53 -200 36 -244 16
                 C -254 11 -256 -9 -246 -14 C -200 -34 -110 -52 -10 -58
                 C 70 -63 150 -58 196 -44 Z"
              fill="url(#gRed)" stroke="#8f1d24" stroke-width="3.5" stroke-linejoin="round"/>

        <!-- 机身涂装（裁切） -->
        <g clip-path="url(#clipFuselage)">
          <rect x="112" y="-70" width="116" height="142" fill="#c8272f"/>
          <rect x="192" y="-70" width="40"  height="142" fill="url(#gGold)"/>
          <rect x="-260" y="24" width="500" height="42" fill="#ffd166" opacity=".92"/>
          <rect x="-260" y="18" width="500" height="5"  fill="#fff3c4" opacity=".8"/>
          <rect x="-260" y="-66" width="500" height="18" fill="#a4161a" opacity=".35"/>
          <rect x="-40" y="-70" width="4" height="142" fill="#7d1119" opacity=".28"/>
          <rect x="34"  y="-70" width="4" height="142" fill="#7d1119" opacity=".28"/>
          <rect x="-124" y="-70" width="4" height="142" fill="#7d1119" opacity=".2"/>
          <rect x="224" y="-70" width="8" height="142" fill="#8a5a0c" opacity=".45"/>
        </g>

        <!-- 机身徽记 -->
        <g transform="translate(-96,4)">
          <circle r="24" fill="#c1272d" stroke="url(#gGold)" stroke-width="5"/>
          <text y="1" text-anchor="middle" dominant-baseline="central"
                font-family="'Songti SC','STSong','PingFang SC','Microsoft YaHei',serif"
                font-size="27" font-weight="700" fill="url(#gGold)">孫</text>
        </g>

        <!-- 座舱内部 -->
        <path d="M -40 -40 C -6 -50 32 -52 62 -48 L 62 -34 C 32 -38 -6 -36 -40 -30 Z"
              fill="#4a2415" opacity=".75"/>
        <ellipse cx="16" cy="-44" rx="56" ry="13" fill="#2e1509" opacity=".5"/>

        <!-- 操纵杆 -->
        <path d="M 84 -38 L 76 -76" stroke="#3a2618" stroke-width="8" stroke-linecap="round"/>
        <path d="M 84 -38 L 76 -76" stroke="#6b4a2f" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
        <circle cx="75" cy="-80" r="8" fill="#e63946" stroke="#8f1d24" stroke-width="2.5"/>

        <!-- 螺旋桨（含旋转模糊） -->
        <g transform="translate(238,0)">
          <ellipse rx="7" ry="96" fill="#ffffff" opacity=".22" filter="url(#fSoft)"/>
          <ellipse rx="15" ry="90" fill="#e8f4ff" opacity=".16" filter="url(#fSoft)"/>
          <g opacity=".92">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".3s" repeatCount="indefinite"/>

<script>
(function () {
  var stage = document.getElementById('stage');
  var svg   = document.getElementById('scene');
  var bP    = document.getElementById('btnPause');
  var bS    = document.getElementById('btnSpeed');
  var paused = false;

  function applyPause() {
    stage.classList.toggle('paused', paused);
    if (svg.pauseAnimations) { paused ? svg.pauseAnimations() : svg.unpauseAnimations(); }
    bP.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    bP.setAttribute('aria-pressed', String(paused));
  }

  bP.addEventListener('click', function () { paused = !paused; applyPause(); });

  var speeds = [1, 2, 0.5], si = 0;
  bS.addEventListener('click', function () {
    si = (si + 1) % speeds.length;
    stage.style.setProperty('--spd', speeds[si]);
    bS.textContent = '☁ 云速 ×' + speeds[si];
  });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); paused = !paused; applyPause(); }
  });

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paused = true; applyPause();
  }
})();
</script>
