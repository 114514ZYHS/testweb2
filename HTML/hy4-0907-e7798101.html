<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="./">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>齊天大聖 · 雲端翱翔 — 孙悟空开飞机</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 15%, #1b2b52 0%, #090d1c 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 100vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: #cfe2ff;
  }
  .stage {
    width: min(96vw, 1020px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 动画 ---------- */
  .bob   { animation: bob 2.8s ease-in-out infinite alternate; }
  .tilt  { transform-box: fill-box; transform-origin: 50% 50%;
           animation: tilt 3.6s ease-in-out infinite alternate; }
  .prop  { transform-box: fill-box; transform-origin: 50% 50%;
           animation: spin .16s linear infinite; }
  .spinSlow { transform-box: fill-box; transform-origin: 50% 50%;
           animation: spin 70s linear infinite; }
  .sway  { transform-box: fill-box; transform-origin: 100% 100%;
           animation: sway 1.9s ease-in-out infinite alternate; }
  .sway2 { transform-box: fill-box; transform-origin: 100% 100%;
           animation: sway 2.4s ease-in-out infinite alternate-reverse; }
  .tail  { transform-box: fill-box; transform-origin: 90% 90%;
           animation: tailWag 2.2s ease-in-out infinite alternate; }
  .eye   { transform-box: fill-box; transform-origin: 50% 50%;
           animation: blink 4.8s ease-in-out infinite; }
  .armL  { transform-box: fill-box; transform-origin: 10% 10%;
           animation: nudge 1.4s ease-in-out infinite alternate; }
  .cloudFloat { transform-box: fill-box; transform-origin: 50% 50%;
           animation: float 3.2s ease-in-out infinite alternate; }
  .puff  { transform-box: fill-box; transform-origin: 100% 50%;
           animation: puff 1.5s linear infinite; }
  .speed { animation: dash 1.5s linear infinite; opacity: 0; }
  .glowPulse { animation: glowPulse 2.6s ease-in-out infinite alternate; }

  .s1 { animation: scrollX 30s linear infinite; }
  .s2 { animation: scrollX 18s linear infinite; }
  .s3 { animation: scrollX 9s  linear infinite; }
  .sM { animation: scrollX 55s linear infinite; }

  @keyframes bob    { from { transform: translateY(-9px); } to { transform: translateY(9px); } }
  @keyframes tilt   { from { transform: rotate(-3.2deg); }  to { transform: rotate(2.6deg); } }
  @keyframes spin   { to   { transform: rotate(360deg); } }
  @keyframes sway   { from { transform: rotate(-5deg)  translateY(1px); } to { transform: rotate(5deg) translateY(-1px); } }
  @keyframes tailWag{ from { transform: rotate(-9deg); } to { transform: rotate(7deg); } }
  @keyframes nudge  { from { transform: rotate(-4deg); } to { transform: rotate(3deg); } }
  @keyframes float  { from { transform: translateY(-4px) scale(1); } to { transform: translateY(4px) scale(1.03); } }
  @keyframes blink  { 0%, 90%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.1); } }
  @keyframes puff   { 0%   { transform: translate(0,0) scale(.35); opacity: .85; }
                      70%  { opacity: .35; }
                      100% { transform: translate(-190px, 14px) scale(1.7); opacity: 0; } }
  @keyframes dash   { 0%   { transform: translateX(280px); opacity: 0; }
                      18%  { opacity: .85; }
                      75%  { opacity: .45; }
                      100% { transform: translateX(-360px); opacity: 0; } }
  @keyframes scrollX{ to   { transform: translateX(-900px); } }
  @keyframes glowPulse { from { opacity: .35; } to { opacity: .8; } }

  .caption { font-size: 13px; letter-spacing: .18em; opacity: .55; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
  <title id="ttl">孙悟空驾驶飞机在云端翱翔</title>
  <desc id="desc">2D SVG 动画：齐天大圣孙悟空头戴紫金冠、手持金箍棒，驾驶红色金色战机穿越云海。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1a63c8"/>
      <stop offset="0.35" stop-color="#4ea6ee"/>
      <stop offset="0.66" stop-color="#a8dcff"/>
      <stop offset="0.86" stop-color="#e8f6ff"/>
      <stop offset="1"    stop-color="#ffe7bd"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fffbe0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd964" stop-opacity=".6"/>
      <stop offset="1"   stop-color="#ffc93c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ff7161"/>
      <stop offset="0.42" stop-color="#ea2f22"/>
      <stop offset="1"    stop-color="#98150d"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8452f"/>
      <stop offset="1" stop-color="#8f1a13"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#f7c532"/>
      <stop offset="1"   stop-color="#c1830c"/>
    </linearGradient>
    <linearGradient id="goldCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="1"   stop-color="#e59a12"/>
    </linearGradient>
    <linearGradient id="furG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ab6b"/>
      <stop offset="1" stop-color="#b3763c"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeacb"/>
      <stop offset="1" stop-color="#f2c592"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="0.55" stop-color="#cdeeff" stop-opacity=".28"/>
      <stop offset="1"   stop-color="#7fbde8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="cloudW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5e9fb"/>
    </linearGradient>
    <linearGradient id="bladeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7482"/>
      <stop offset="1" stop-color="#22252e"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1a33" flood-opacity=".45"/>
    </filter>

    <!-- 云朵组件 -->
    <g id="cloudA">
      <ellipse cx="0"   cy="0"   rx="46" ry="26"/>
      <ellipse cx="-36" cy="9"   rx="30" ry="17"/>
      <ellipse cx="36"  cy="9"   rx="34" ry="19"/>
      <ellipse cx="4"   cy="-17" rx="30" ry="21"/>
      <rect x="-66" y="6"  width="132" height="20" rx="10"/>
    </g>
    <g id="cloudB">
      <ellipse cx="0"   cy="0"   rx="34" ry="19"/>
      <ellipse cx="-26" cy="7"   rx="22" ry="12"/>
      <ellipse cx="26"  cy="7"   rx="24" ry="13"/>
      <ellipse cx="0"   cy="-12" rx="22" ry="15"/>
      <rect x="-48" y="4" width="96" height="15" rx="7.5"/>
    </g>

    <!-- 远云层（0~900 可无缝平铺） -->
    <g id="farClouds" fill="#ffffff" opacity=".55">
      <use href="#cloudB" x="80"  y="150"/>
      <use href="#cloudB" x="300" y="105"/>
      <use href="#cloudB" x="520" y="168"/>
      <use href="#cloudB" x="700" y="118"/>
      <use href="#cloudB" x="860" y="175"/>
    </g>
    <!-- 中云层 -->
    <g id="midClouds" fill="url(#cloudW)" opacity=".8">
      <use href="#cloudA" x="140" y="300"/>
      <use href="#cloudA" x="430" y="248"/>
      <use href="#cloudA" x="660" y="330"/>
      <use href="#cloudA" x="850" y="270"/>
    </g>
    <!-- 近云层（前景） -->
    <g id="nearClouds" fill="url(#cloudW)" opacity=".95">
      <use href="#cloudA" x="60"  y="520"/>
      <use href="#cloudA" x="380" y="560"/>
      <use href="#cloudA" x="720" y="525"/>
    </g>

    <!-- 远山 -->
    <g id="mtn">
      <path d="M0 540 L90 470 L150 505 L240 438 L330 500 L420 452 L520 512 L610 458 L700 505 L800 462 L900 540 L900 600 L0 600 Z"
            fill="#2b5f9e" opacity=".38"/>
      <path d="M0 566 L110 520 L210 556 L320 512 L430 562 L540 522 L650 566 L760 524 L900 566 L900 600 L0 600 Z"
            fill="#1e477c" opacity=".45"/>
    </g>

    <g id="star">
      <path d="M0 -12 L3.4 -4 L11.6 -3.5 L5.4 1.8 L7.4 10 L0 5.6 L-7.4 10 L-5.4 1.8 L-11.6 -3.5 L-3.4 -4 Z"/>
    </g>

    <clipPath id="cockpitClip"><ellipse cx="48" cy="-40" rx="64" ry="18"/></clipPath>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="742" cy="112" r="150" fill="url(#sunGlow)"/>
  <circle cx="742" cy="112" r="42" fill="#fff6d2" opacity=".95"/>
  <g class="spinSlow" opacity=".35">
    <g transform="translate(742,112)" stroke="#fff3b0" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-96"/>
      <line x1="0" y1="56"  x2="0" y2="96"/>
      <line x1="-56" y1="0" x2="-96" y2="0"/>
      <line x1="56"  y1="0" x2="96"  y2="0"/>
      <line x1="-40" y1="-40" x2="-68" y2="-68"/>
      <line x1="40"  y1="40"  x2="68"  y2="68"/>
      <line x1="-40" y1="40"  x2="-68" y2="68"/>
      <line x1="40"  y1="-40" x2="68"  y2="-68"/>
    </g>
  </g>

  <!-- ============ 视差云层 ============ -->
  <g class="s1"><use href="#farClouds"/><use href="#farClouds" x="900"/></g>
  <g class="sM"><use href="#mtn"/><use href="#mtn" x="900"/></g>
  <g class="s2"><use href="#midClouds"/><use href="#midClouds" x="900"/></g>

  <!-- ============ 速度线 ============ -->
  <g>
    <rect class="speed" x="820" y="180" width="95"  height="5" rx="2.5" fill="#ffffff" style="animation-delay:-.1s"/>
    <rect class="speed" x="840" y="232" width="130" height="6" rx="3"   fill="#e8f6ff" style="animation-delay:-.7s"/>
    <rect class="speed" x="800" y="290" width="80"  height="4" rx="2"   fill="#ffffff" style="animation-delay:-1.2s"/>
    <rect class="speed" x="850" y="352" width="120" height="5" rx="2.5" fill="#ffffff" style="animation-delay:-.45s"/>
    <rect class="speed" x="810" y="404" width="70"  height="4" rx="2"   fill="#e8f6ff" style="animation-delay:-1.35s"/>
    <rect class="speed" x="835" y="452" width="105" height="5" rx="2.5" fill="#ffffff" style="animation-delay:-.9s"/>
  </g>

  <!-- ============ 飞机 + 悟空 ============ -->
  <g transform="translate(430,300)" filter="url(#drop)">
   <g class="bob">
    <g class="tilt">

      <!-- 筋斗云（机身下方） -->
      <g class="cloudFloat" transform="translate(-14,92)" opacity=".95">
        <ellipse cx="0" cy="6" rx="96" ry="14" fill="#ffd15e" opacity=".35" filter="url(#soft)"/>
        <path d="M-94 6 C-102 -16 -78 -32 -54 -24 C-52 -48 -18 -60 6 -46 C28 -64 68 -54 72 -28 C94 -30 106 -10 94 6 Z" fill="url(#goldCloud)"/>
        <rect x="-94" y="-2" width="190" height="18" rx="9" fill="url(#goldCloud)"/>
        <path d="M-62 -8 C-54 -22 -34 -22 -28 -10" fill="none" stroke="#fff8dc" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
        <path d="M18 -12 C28 -26 48 -24 52 -10" fill="none" stroke="#fff8dc" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
        <circle cx="-74" cy="-4" r="4.5" fill="#fff8dc" opacity=".9"/>
        <circle cx="64"  cy="-6" r="5.5" fill="#fff8dc" opacity=".9"/>
      </g>

      <!-- 尾迹筋斗云 -->
      <g class="cloudFloat" transform="translate(-268,56)" opacity=".8" style="animation-delay:-1.4s">
        <path d="M-56 4 C-62 -10 -46 -20 -32 -15 C-31 -30 -12 -37 2 -28 C15 -39 40 -33 43 -18 C56 -19 63 -8 55 4 Z" fill="url(#goldCloud)"/>
        <rect x="-56" y="-1" width="114" height="12" rx="6" fill="url(#goldCloud)"/>
        <path d="M-34 -6 C-29 -16 -16 -16 -12 -8" fill="none" stroke="#fff8dc" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>
      </g>

      <!-- 尾气云团 -->
      <g fill="#ffffff">
        <ellipse class="puff" cx="-206" cy="4"  rx="16" ry="12" style="animation-delay:-.2s"/>
        <ellipse class="puff" cx="-212" cy="10" rx="12" ry="9"  style="animation-delay:-.75s"/>
        <ellipse class="puff" cx="-200" cy="-2" rx="10" ry="8"  style="animation-delay:-1.15s"/>
      </g>

      <!-- 远侧机翼（机身之后） -->
      <path d="M20 -6 C-16 -26 -76 -45 -142 -53 L-164 -42 C-110 -28 -50 -12 -8 -2 Z" fill="#8d1a12"/>
      <!-- 垂尾 -->
      <path d="M-126 -34 C-146 -60 -160 -86 -166 -110 L-198 -110 L-192 -28 Z" fill="#c9231b" stroke="#7d140e" stroke-width="2"/>
      <path d="M-166 -110 L-198 -110 L-196 -92 L-164 -94 Z" fill="url(#goldG)"/>
      <g transform="translate(-166,-72) scale(.85)"><use href="#star" fill="url(#goldG)"/></g>
      <!-- 平尾 -->
      <path d="M-150 -4 C-180 -10 -208 -15 -222 -6 L-216 11 C-196 4 -170 9 -152 11 Z" fill="#a81d16"/>

      <!-- 金箍棒（远侧手举起，向后上方） -->
      <g>
        <line x1="-28" y1="-94" x2="-200" y2="-170" stroke="url(#goldG)" stroke-width="9" stroke-linecap="round"/>
        <line x1="-28" y1="-94" x2="-54"  y2="-107" stroke="#d63a2c" stroke-width="10" stroke-linecap="round"/>
        <line x1="-174" y1="-158" x2="-200" y2="-170" stroke="#d63a2c" stroke-width="10" stroke-linecap="round"/>
        <line x1="-28" y1="-97" x2="-200" y2="-173" stroke="#fff3bd" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- 机身 -->
      <path d="M182 -2 C176 -22 150 -34 118 -38 L30 -42 C-30 -46 -96 -44 -140 -34
               C-172 -26 -188 -10 -188 2 C-188 20 -156 36 -110 40 L34 44 C118 42 172 24 182 -2 Z"
            fill="url(#bodyG)" stroke="#7d140e" stroke-width="2.5"/>
      <!-- 机身金色腰线 -->
      <path d="M-184 6 C-80 -4 60 -6 178 4" fill="none" stroke="url(#goldG)" stroke-width="6" stroke-linecap="round" opacity=".9"/>
      <path d="M-184 18 C-80 10 60 8 172 17" fill="none" stroke="#ffd977" stroke-width="2" opacity=".45"/>

      <!-- 座舱开口 -->
      <ellipse cx="48" cy="-40" rx="64" ry="18" fill="#3a1a2e"/>
      <ellipse cx="48" cy="-40" rx="64" ry="18" fill="none" stroke="url(#goldG)" stroke-width="3"/>

      <!-- 座舱内：躯干 -->
      <g clip-path="url(#cockpitClip)">
        <path d="M16 -58 C22 -76 60 -76 64 -56 L68 -18 L12 -18 Z" fill="url(#goldG)"/>
        <path d="M16 -58 C24 -72 58 -72 64 -56 L58 -47 C48 -56 28 -56 20 -47 Z" fill="#d63a2c"/>
        <path d="M34 -50 L44 -34 L54 -50" fill="none" stroke="#b8830c" stroke-width="2.5" opacity=".7"/>
      </g>

      <!-- 尾巴 -->
      <path class="tail" d="M-4 -58 C-40 -58 -58 -84 -42 -102 C-30 -114 -12 -106 -16 -92"
            fill="none" stroke="url(#furG)" stroke-width="6.5" stroke-linecap="round"/>

      <!-- 远侧手臂 -->
      <path d="M20 -60 C6 -70 -6 -82 -24 -92" fill="none" stroke="url(#furG)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-28" cy="-94" r="8.5" fill="#e0a463" stroke="#a8702f" stroke-width="1.5"/>

      <!-- ======= 孙悟空头部 ======= -->
      <g>
        <!-- 雉尾（凤翅紫金冠的长羽） -->
        <g class="sway">
          <path d="M76 -116 C68 -158 30 -188 -14 -196" fill="none" stroke="url(#goldG)" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M76 -116 C68 -158 30 -188 -14 -196" fill="none" stroke="#ff8d76" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
        </g>
        <g class="sway2">
          <path d="M78 -108 C78 -150 50 -178 12 -192" fill="none" stroke="url(#goldG)" stroke-width="5" stroke-linecap="round"/>
          <path d="M78 -108 C78 -150 50 -178 12 -192" fill="none" stroke="#ff8d76" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
        </g>

        <!-- 耳朵 -->
        <ellipse cx="4"  cy="-88" rx="10" ry="12" fill="url(#furG)"/>
        <ellipse cx="76" cy="-88" rx="10" ry="12" fill="url(#furG)"/>
        <ellipse cx="5"  cy="-88" rx="5"  ry="7"  fill="#f3a79c"/>
        <ellipse cx="75" cy="-88" rx="5"  ry="7"  fill="#f3a79c"/>

        <!-- 脸 -->
        <ellipse cx="40" cy="-86" rx="33" ry="30" fill="url(#faceG)"/>
        <!-- 猴毛/鬓发 -->
        <path d="M8 -80 C2 -66 6 -58 14 -56 C10 -66 12 -74 16 -80 Z" fill="#c98a4b"/>
        <path d="M72 -80 C78 -66 74 -58 66 -56 C70 -66 68 -74 64 -80 Z" fill="#c98a4b"/>
        <!-- 头顶毛发 -->
        <path d="M6 -96 C2 -128 22 -146 44 -144 C68 -146 84 -122 76 -94
                 C70 -110 58 -116 44 -114 C28 -116 14 -110 6 -96 Z" fill="#402615"/>
        <path d="M14 -104 C12 -124 26 -136 42 -134" fill="none" stroke="#6b4325" stroke-width="3" stroke-linecap="round" opacity=".8"/>

        <!-- 红色眼罩（桃形） -->
        <path d="M9 -98 C15 -118 30 -123 40 -115 C50 -123 65 -118 71 -98
                 C64 -84 52 -79 40 -81 C28 -79 16 -84 9 -98 Z" fill="#e0402c"/>
        <path d="M13 -100 C19 -114 30 -117 38 -111" fill="none" stroke="#ff8d76" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

        <!-- 眉毛 -->
        <path d="M17 -111 C23 -117 33 -115 35 -111" fill="none" stroke="#402615" stroke-width="3" stroke-linecap="round"/>
        <path d="M45 -111 C47 -115 57 -117 63 -111" fill="none" stroke="#402615" stroke-width="3" stroke-linecap="round"/>

        <!-- 眼睛（带眨眼） -->
        <g class="eye">
          <ellipse cx="28" cy="-95" rx="10" ry="8" fill="#ffffff"/>
          <circle cx="31" cy="-95" r="4.6" fill="#171717"/>
          <circle cx="33" cy="-97" r="1.7" fill="#ffffff"/>
        </g>
        <g class="eye">
          <ellipse cx="52" cy="-95" rx="10" ry="8" fill="#ffffff"/>
          <circle cx="55" cy="-95" r="4.6" fill="#171717"/>
          <circle cx="57" cy="-97" r="1.7" fill="#ffffff"/>
        </g>

        <!-- 鼻子 -->
        <path d="M36 -80 C38 -83 42 -83 44 -80" fill="none" stroke="#b3702f" stroke-width="2" stroke-linecap="round"/>
        <circle cx="36.5" cy="-78.5" r="1.8" fill="#8a4a2a"/>
        <circle cx="43.5" cy="-78.5" r="1.8" fill="#8a4a2a"/>

        <!-- 笑口 -->
        <path d="M27 -71 C33 -58 49 -58 55 -71 C47 -64 35 -64 27 -71 Z" fill="#7d1f14"/>
        <path d="M34 -66 C38 -59 45 -59 48 -66 Z" fill="#e8705f"/>

        <!-- 金箍 -->
        <path d="M4 -110 C16 -132 64 -132 76 -108 L79 -117 C64 -142 16 -142 1 -117 Z"
              fill="url(#goldG)" stroke="#a97b12" stroke-width="1.2"/>
        <circle cx="40" cy="-126" r="7" fill="url(#goldG)" stroke="#a97b12" stroke-width="1.2"/>
        <circle cx="40" cy="-126" r="3" fill="#d63a2c"/>
      </g>

      <!-- 风挡 -->
      <path d="M104 -42 C124 -66 148 -69 161 -55 L159 -38 Z" fill="url(#glassG)" stroke="url(#goldG)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M112 -46 C128 -62 144 -64 153 -56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

      <!-- 近侧手臂 + 操纵杆 -->
      <g class="armL">
        <path d="M62 -58 C72 -52 80 -48 86 -44" fill="none" stroke="url(#furG)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="88" cy="-42" r="8.5" fill="#e8b678" stroke="#a8702f" stroke-width="1.5"/>
