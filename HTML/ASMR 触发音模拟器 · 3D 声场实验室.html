    }
  },

  /* 播放一个触发音（同时切画面 + 运镜） */
  playTrigger(id){
    const tr = TRIG_MAP[id];
    if (!tr || !A.ok) return 0;
    A.resume();
    const t = A.now() + 0.06;
    PROP.show(id);
    if (tr.cam){
      Cam.azT = tr.cam.az; Cam.elT = tr.cam.el; Cam.distT = tr.cam.dist;
      Cam.targetT[0] = tr.cam.target[0]; Cam.targetT[1] = tr.cam.target[1]; Cam.targetT[2] = tr.cam.target[2];
      Cam.idle = 0;
    }
    this.curId = id; this.curStart = A.now(); 
    UI.markActive(id);
    const dur = tr.play(t) || 6;
    this.curDur = dur;
    this.pauseUntil = Math.max(this.pauseUntil, A.now() + dur + 0.6);
    return dur;
  },

  /* 用户点击：立刻播放（自动串场会被让位） */
  userTrigger(id){
    if (!A.ok){ return; }
    A.resume();
    this.token++;
    const d = this.playTrigger(id);
    this.pauseUntil = A.now() + d + 1.1;
    if (this.running && this.mode === 'auto'){
      requestHost();
    }
  },

  async waitIdle(alive){
    while (alive() && A.now() < this.pauseUntil) await hsleep(180);
  },

  async intro(tr, alive){
    const line = pick(INTROS).replace('{n}', tr.name);
    const t0 = A.now() + 0.18;
    const d = whisperLine(line, t0, { pan: rr(-0.35, 0.35), gain: 0.26 });
    await hsleep((d + 0.95) * 1000);
    if (!alive()) return;
    const dur = this.playTrigger(tr.id);
    await hsleep((dur + rr(0.6, 1.4)) * 1000);
  }
};

async function hostLoop(){
  if (loopActive || !Host.running || Host.mode !== 'auto' || !A.ok) return;
  loopActive = true;
  const my = ++Host.token;
  const alive = () => Host.token === my && Host.running && Host.mode === 'auto';
  try {
    // 开场
    if (Host.firstRun){
      Host.firstRun = false;
      await Host.micCheck(alive);
      if (!alive()) return;
      whisperLine('耳机戴好了吗？今晚就慢慢地睡。', A.now() + 0.2, { pan: -0.32, gain: 0.26 });
      await hsleep(4200);
      if (!alive()) return;
    }
    let deck = shuffle(TRIGGERS.slice());
    while (alive()){
      await Host.waitIdle(alive);
      if (!alive()) return;
      if (!deck.length) deck = shuffle(TRIGGERS.slice());
      const tr = deck.shift();
      await Host.intro(tr, alive);
      if (!alive()) return;

      // 串场：有时说一句，有时只是呼吸
      const r = Math.random();
      if (r < 0.34){
        whisperLine(pick(FILLER), A.now() + 0.12, { pan: rr(-0.4, 0.4), gain: 0.25 });
        await hsleep(3200);
      } else if (r < 0.62){
        const t = A.now() + 0.15;
        breath(t, 2.0, rr(-0.3, 0.3), 0.026);
        breath(t + 2.4, 2.2, rr(-0.3, 0.3), 0.024);
        await hsleep(5200);
      } else {
        await hsleep(rr(900, 2600));
      }
      if (!alive()) return;
      // 偶尔再试一次音
      if (Math.random() < 0.14){
        const t = A.now() + 0.1;
        SFX.micTap(t, rr(-0.2, 0.2));
        await hsleep(900);
      }
    }
  } finally {
    loopActive = false;
    // 循环被外部打断后，如果仍有重启请求且依然处于自动模式，就重新拉起
    if (Host.restart){
      Host.restart = false;
      if (Host.running && Host.mode === 'auto') hostLoop();
    }
  }
}

/* 请求（重新）启动自动串场；正在运行时记一个待重启标记 */
function requestHost(){
  if (loopActive){ Host.restart = true; return; }
  hostLoop();
}

/* ---------------------------------------------------------------------------
   15. UI
   --------------------------------------------------------------------------- */
const UI = {
  btns: {},
  build(){
    const wrap = $('triggers');
    $('count').textContent = TRIGGERS.length + ' 种';
    TRIGGERS.forEach(tr => {
      const b = document.createElement('button');
      b.className = 'trig';
      b.dataset.id = tr.id;
      b.innerHTML = '<span class="ic">' + tr.icon + '</span>' +
                    '<span class="tx"><span class="nm">' + tr.name + '</span>' +
                    '<span class="ds">' + tr.desc + '</span></span>' +
                    '<span class="kbd">' + tr.key.toUpperCase() + '</span>' +
                    '<span class="bar"><i></i></span>';
      b.addEventListener('click', () => Host.userTrigger(tr.id));
      wrap.appendChild(b);
      this.btns[tr.id] = b;
    });
  },
  markActive(id){
    for (const k in this.btns) this.btns[k].classList.toggle('on', k === id);
  },
  tick(){
    const b = this.btns[Host.curId];
    if (!b) return;
    const bar = b.querySelector('.bar i');
    if (!bar) return;
    const p = Host.curDur > 0 ? clamp((A.now() - Host.curStart) / Host.curDur, 0, 1) : 0;
    bar.style.width = (p * 100).toFixed(1) + '%';
  }
};

/* ---------------------------------------------------------------------------
   16. 场景组装
   --------------------------------------------------------------------------- */
const Scene = {
  root: null, mic: null,
  build(){
    GLX.mesh.fluff = GLX.upload(gBlob(1, 24, 18, 0.10, 3.1));

    const root = N({});
    add(root, buildStage());

    const mic = buildMic();
    add(root, mic);

    // 试音用的小指头
    const tapF = add(mic, N({
      mesh: 'sphere', color: MAT.skin, scl: [0.023, 0.019, 0.023],
      pos: [0.30, 0.55, 0.16], visible: false, spec: 0.36
    }));

    PROP.init(root);

    Cam.targetT = [0, 0.20, 0];
    const _camUpd = Cam.update.bind(Cam);
    Cam.update = function(T, DT){
      const k = 1 - Math.pow(0.004, DT);
      for (let i = 0; i < 3; i++) this.target[i] = lerp(this.target[i], this.targetT[i], k);
      _camUpd(T, DT);
    };

    // 麦克风随取景轻轻侧倾 + 试音手指
    const _micUpd = mic.upd;
    mic.upd = (T, DT, n) => {
      _micUpd(T, DT, n);
      const k = 1 - Math.pow(0.02, DT);
      n.rot[0] = lerp(n.rot[0], clamp(Cam.targetT[1] * 0.20, -0.05, 0.13), k);
      n.rot[1] = lerp(n.rot[1], clamp(Cam.targetT[0] * 0.26, -0.16, 0.16), k);
      const e = Math.max(0, A.now() - MICFX.t);
      if (e < 0.6){
        tapF.visible = true;
        const kk = e < 0.16 ? e / 0.16 : 1 - (e - 0.16) / 0.44;
        tapF.pos[0] = 0.30 - easeOut(clamp(e / 0.14, 0, 1)) * 0.19;
        tapF.pos[1] = 0.55 - easeOut(clamp(e / 0.14, 0, 1)) * 0.06 + Math.max(0, 1 - e / 0.3) * 0.02;
        tapF.scl[0] = tapF.scl[1] = tapF.scl[2] = 0.023 * clamp(0.4 + kk * 0.6, 0.2, 1.2);
        tapF.alpha = clamp(kk, 0, 1);
      } else {
        tapF.visible = false;
      }
    };

    this.root = root; this.mic = mic;
    return root;
  }
};
const MICFX = { t: -99 };

/* 敲麦克风的声音（试音用） */
SFX.micTap = function(t, pan){
  nz({ t, dur: 0.06, type: 'bandpass', f: 340, f2: 190, q: 2.2, gain: 0.10, a: 0.001, d: 0.05, pan, send: 0.22 });
  tone({ t, f: 205, f2: 138, dur: 0.17, d: 0.15, gain: 0.085, pan, send: 0.24 });
  tone({ t, f: 640, f2: 470, dur: 0.09, d: 0.08, gain: 0.030, pan, send: 0.22 });
  nz({ t, dur: 0.012, type: 'highpass', f: 4200, gain: 0.020, a: 0.0006, d: 0.012, pan, send: 0.12 });
  vis(t, () => { MICFX.t = A.now(); });
};

/* ---------------------------------------------------------------------------
   17. 电平表
   --------------------------------------------------------------------------- */
const MCV = $('meter'), MCTX = MCV.getContext('2d');
function drawMeter(){
  const w = MCV.width, h = MCV.height;
  MCTX.clearRect(0, 0, w, h);
  if (!A.analyser) return;
  A.analyser.getByteTimeDomainData(A.data);
  const n = A.data.length;
  MCTX.lineWidth = 2;
  MCTX.strokeStyle = 'rgba(142,231,255,.95)';
  MCTX.beginPath();
  for (let i = 0; i < n; i += 2){
    const x = (i / n) * w;
    const y = h / 2 + (A.data[i] - 128) / 128 * (h * 0.40);
    if (i === 0) MCTX.moveTo(x, y); else MCTX.lineTo(x, y);
  }
  MCTX.stroke();
  MCTX.globalAlpha = 0.35;
  MCTX.beginPath();
  MCTX.moveTo(0, h / 2); MCTX.lineTo(w, h / 2);
  MCTX.strokeStyle = 'rgba(255,255,255,.25)';
  MCTX.stroke();
  MCTX.globalAlpha = 1;
}

/* ---------------------------------------------------------------------------
   18. 主循环
   --------------------------------------------------------------------------- */
let lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const T = ts * 0.001;
  let DT = lastT ? T - lastT : 0.016;
  lastT = T;
  if (DT > 0.06) DT = 0.06;

  // 到点的视觉事件（与音频时钟对齐）
  if (A.ctx){
    const now = A.now();
    for (let i = 0; i < VIS.q.length; i++){
      if (VIS.q[i].t <= now){
        const fn = VIS.q[i].fn;
        VIS.q.splice(i, 1); i--;
        try { fn(); } catch (e){}
      }
    }
  }

  Cam.update(T, DT);
  renderScene(Scene.root, Cam.proj, Cam.view, Cam.eye, T, DT);
  drawMeter();
  UI.tick();
}

/* ---------------------------------------------------------------------------
   19. 启动
   --------------------------------------------------------------------------- */
function boot(){
  try {
    GLX.init();
  } catch (e){
    $('warn').style.display = 'block';
    $('warn').textContent = '3D 场景初始化失败：' + e.message;
  }
  UI.build();
  Scene.build();
  Cam.attach(GLX.canvas);
  requestAnimationFrame(frame);

  // 控件
  $('vol').addEventListener('input', e => A.setVol(e.target.value / 100));
  $('rev').addEventListener('input', e => A.setRev(e.target.value / 100));
  $('room').addEventListener('input', e => A.setRoom(e.target.value / 100));

  const autoBtn = $('autoBtn');
  autoBtn.addEventListener('click', () => {
    Host.mode = Host.mode === 'auto' ? 'manual' : 'auto';
    autoBtn.classList.toggle('on', Host.mode === 'auto');
    autoBtn.textContent = '自动串场：' + (Host.mode === 'auto' ? '开' : '关');
    Host.token++;
    if (Host.mode === 'auto' && Host.running) requestHost();
  });

  // 键盘
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    for (const tr of TRIGGERS){
      if (tr.key === k){ e.preventDefault(); Host.userTrigger(tr.id); return; }
    }
  });

  // 浏览器自动播放策略：任何交互都尝试恢复音频
  const wake = () => { if (A.ok) A.resume(); };
  window.addEventListener('pointerdown', wake);
  window.addEventListener('keydown', wake);

  // 开始
  $('startBtn').addEventListener('click', () => {
    try {
      A.init();
      A.setVol($('vol').value / 100);
      A.setRev($('rev').value / 100);
      A.setRoom($('room').value / 100);
      A.resume();
    } catch (e){
      $('warn').style.display = 'block';
      $('warn').textContent = '音频初始化失败：' + e.message;
      return;
    }
    $('intro').classList.add('gone');
    Host.running = true;
    Host.firstRun = true;
    if (Host.mode === 'auto') hostLoop();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
