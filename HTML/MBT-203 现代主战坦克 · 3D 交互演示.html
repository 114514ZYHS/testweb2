<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>现代主战坦克 · 3D 交互演示</title>
  <style>
:root {
  --olive: #8ea36a;
  --amber: #e8b34a;
  --amber-dim: #a97c22;
  --panel: rgba(14, 18, 15, 0.72);
  --panel-solid: #12171200;
  --line: rgba(142, 163, 106, 0.28);
  --text: #d8e0cf;
  --text-dim: #8b947f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0e0c;
  color: var(--text);
  font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scene { display: block; width: 100%; height: 100%; touch-action: none; }

/* ---------- 顶部 ---------- */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  pointer-events: none;
  z-index: 10;
  background: linear-gradient(180deg, rgba(8, 11, 9, 0.55), rgba(8, 11, 9, 0));
}

.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 10px var(--amber);
  align-self: center;
}
.brand-main {
  font-size: 19px; font-weight: 700; letter-spacing: 3px;
  color: #eef2e6;
}
.brand-sub {
  font-size: 12px; letter-spacing: 1.5px; color: var(--text-dim);
}

.hud { display: flex; gap: 8px; }
.hud-item {
  display: flex; align-items: baseline; gap: 5px;
  padding: 6px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(8px);
}
.hud-item label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
.hud-item b {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 16px; font-variant-numeric: tabular-nums;
  color: var(--amber); min-width: 32px; text-align: right;
}
.hud-item span { font-size: 10px; color: var(--text-dim); }

/* ---------- 左侧控制面板 ---------- */
#panel {
  position: fixed;
  top: 70px; left: 20px;
  width: 288px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 4px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 10;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
#panel::-webkit-scrollbar { width: 5px; }
#panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.group {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px 14px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
}
.group h3 {
  font-size: 11px; font-weight: 600; letter-spacing: 3px;
  color: var(--olive);
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
  text-transform: uppercase;
}

.row {
  display: grid;
  grid-template-columns: 56px 1fr 44px;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.row label { font-size: 12px; color: var(--text-dim); }
.row output {
  font-family: ui-monospace, monospace;
  font-size: 12px; text-align: right; color: var(--amber);
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--olive) 0%, var(--olive) 50%, rgba(255,255,255,0.14) 50%);
  border-radius: 2px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px; border-radius: 50%;
  background: #e9e3d2; border: 2px solid #2c3529;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: #e9e3d2; border: 2px solid #2c3529; cursor: grab;
}

button {
  font: inherit; font-size: 12px;
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  transition: background 0.16s, border-color 0.16s, color 0.16s, transform 0.08s;
  letter-spacing: 1px;
}
button:hover { background: rgba(142, 163, 106, 0.18); border-color: var(--olive); }
button:active { transform: translateY(1px); }
button.active {
  background: rgba(232, 179, 74, 0.16);
  border-color: var(--amber);
  color: var(--amber);
}
button.primary {
  width: 100%;
  margin-top: 2px;
  padding: 10px;
  font-weight: 600; letter-spacing: 4px;
  color: #1b1408;
  background: linear-gradient(180deg, #f0c35c, #c8901f);
  border-color: #f0c35c;
}
button.primary:hover { background: linear-gradient(180deg, #ffd677, #d89c22); }
button.primary kbd { background: rgba(0,0,0,0.18); color: #3a2c0c; border: none; }

.btns { display: flex; gap: 8px; margin-top: 10px; }
.btns.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.btns.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 0; }
.btns button { flex: 1; }

kbd {
  font-family: ui-monospace, monospace;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--text);
}

/* ---------- 底部提示 ---------- */
#tips {
  position: fixed;
  left: 20px; right: 20px; bottom: 14px;
  display: flex; flex-wrap: wrap; gap: 14px;
  justify-content: center;
  font-size: 11px; color: var(--text-dim);
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
#tips span { display: flex; align-items: center; gap: 4px; }
#tips .ml { color: rgba(139, 148, 127, 0.65); }

/* ---------- 加载层 ---------- */
#loading {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: #0b0e0c;
  z-index: 100;
  transition: opacity 0.6s ease;
}
#loading.hide { opacity: 0; pointer-events: none; }
.load-box { text-align: center; }
.load-title {
  font-size: 22px; letter-spacing: 12px; color: var(--olive); margin-bottom: 16px;
}
.load-bar {
  width: 220px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden;
}
.load-bar i {
  display: block; width: 40%; height: 100%; background: var(--amber);
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}
.load-text { margin-top: 12px; font-size: 11px; letter-spacing: 3px; color: var(--text-dim); }

/* ---------- 移动端 ---------- */
@media (max-width: 780px) {
  #panel { width: 232px; top: 62px; left: 10px; transform: scale(0.92); transform-origin: top left; }
  .hud-item:nth-child(n + 3) { display: none; }
  #tips { font-size: 10px; gap: 8px; }
}

</style>
  </head>
<body>
  <canvas id="scene"></canvas>

  <div id="loading">
    <div class="load-box">
      <div class="load-title">MODERN MBT</div>
      <div class="load-bar"><i></i></div>
      <div class="load-text">正在装填弹药…</div>
    </div>
  </div>

  <header id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-main">MBT-203</span>
      <span class="brand-sub">现代主战坦克 · 实时渲染</span>
    </div>
    <div class="hud" id="hud">
      <div class="hud-item"><label>车速</label><b id="hud-speed">0</b><span>km/h</span></div>
      <div class="hud-item"><label>炮塔</label><b id="hud-turret">0</b><span>°</span></div>
      <div class="hud-item"><label>俯仰</label><b id="hud-pitch">0</b><span>°</span></div>
      <div class="hud-item"><label>弹药</label><b id="hud-ammo">42</b><span>发</span></div>
    </div>
  </header>

  <aside id="panel">
    <section class="group">
      <h3>火控</h3>
      <div class="row">
        <label>炮塔方位</label>
        <input id="s-turret" type="range" min="-180" max="180" step="1" value="0" />
        <output id="o-turret">0°</output>
      </div>
      <div class="row">
        <label>主炮俯仰</label>
        <input id="s-pitch" type="range" min="-9" max="20" step="0.5" value="3" />
        <output id="o-pitch">3°</output>
      </div>
      <button id="btn-fire" class="primary">开 火 &nbsp;<kbd>F</kbd></button>
    </section>

    <section class="group">
      <h3>机动</h3>
      <div class="row">
        <label>油门</label>
        <input id="s-throttle" type="range" min="-40" max="100" step="1" value="0" />
        <output id="o-throttle">0%</output>
      </div>
      <div class="row">
        <label>转向</label>
        <input id="s-steer" type="range" min="-100" max="100" step="1" value="0" />
        <output id="o-steer">0</output>
      </div>
      <div class="btns">
        <button id="btn-cruise" class="toggle">自动巡航</button>
        <button id="btn-reset">归位</button>
      </div>
    </section>

    <section class="group">
      <h3>视角</h3>
      <div class="btns grid2">
        <button data-cam="orbit" class="cam active">环绕</button>
        <button data-cam="front" class="cam">正面</button>
        <button data-cam="side" class="cam">侧面</button>
        <button data-cam="top" class="cam">俯视</button>
        <button data-cam="muzzle" class="cam">炮口</button>
        <button data-cam="driver" class="cam">车长</button>
      </div>
      <div class="btns">
        <button id="btn-orbit" class="toggle active">自动环绕</button>
      </div>
    </section>

    <section class="group">
      <h3>环境</h3>
      <div class="btns grid3">
        <button data-env="day" class="env active">白天</button>
        <button data-env="dusk" class="env">黄昏</button>
        <button data-env="night" class="env">夜间</button>
      </div>
      <div class="btns">
        <button id="btn-lights" class="toggle">车灯</button>
        <button id="btn-wire" class="toggle">线框</button>
      </div>
    </section>
  </aside>

  <footer id="tips">
    <span><kbd>W</kbd><kbd>S</kbd> 前进/倒车</span>
    <span><kbd>A</kbd><kbd>D</kbd> 转向</span>
    <span><kbd>Q</kbd><kbd>E</kbd> 炮塔回旋</span>
    <span><kbd>R</kbd><kbd>T</kbd> 火炮俯仰</span>
    <span><kbd>空格</kbd> 刹车</span>
    <span><kbd>F</kbd> 开火</span>
    <span><kbd>Shift</kbd> 加速</span>
    <span class="ml">鼠标左键拖拽旋转 · 滚轮缩放 · 右键平移</span>
  </footer>
