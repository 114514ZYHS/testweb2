  function add(t,px,py){ var d=BDEF[t]; var p=spot(px,py,d.s); if(!p) return null;

  function wallTile(x,y){ var key=x+','+y; if(wallSet[key]) return; if(x<2||y<2||x>=MAP-2||y>=MAP-2) return;
    if(occ[y*MAP+x]) return; wallSet[key]=1; occ[y*MAP+x]=2; W.push({x:x,y:y}); }
  function wallRect(x0,y0,x1,y1,gaps){
    var per=[], x, y;
    for(x=x0;x<=x1;x++){ per.push([x,y0]); per.push([x,y1]); }
    for(y=y0+1;y<y1;y++){ per.push([x0,y]); per.push([x1,y]); }
    var skip = {};
    for(var g=0; g<(gaps||0); g++){ var st=Math.floor(R()*per.length); for(var k=0;k<4;k++) skip[(st+k)%per.length]=1; }
    for(var i=0;i<per.length;i++){ if(skip[i]) continue; wallTile(per[i][0],per[i][1]); }
  }

  // ---- 布局骨架 ----
  var A = L.arch, cores = [{x:cx,y:cy}], zones = [], outer = 11;
  if(A==='open'){ outer=0; zones=[[cx-8,cy-8,cx+8,cy+8]]; }
  else if(A==='cluster'){ outer=0; zones=[[cx-6,cy-6,cx+6,cy+6]]; }
  else if(A==='ring'){ wallRect(cx-9,cy-8,cx+9,cy+8, L.id===4?1:0); zones=[[cx-7,cy-6,cx+7,cy+6]]; }
  else if(A==='corridor'){ wallRect(cx-13,cy-5,cx+13,cy+5,1); zones=[[cx-11,cy-3,cx+11,cy+3]]; }
  else if(A==='ring2'){ wallRect(cx-11,cy-9,cx+11,cy+9,0); wallRect(cx-6,cy-5,cx+6,cy+5,0);
    zones=[[cx-4,cy-3,cx+4,cy+3],[cx-10,cy-8,cx+10,cy+8]]; }
  else if(A==='compart'){ wallRect(cx-11,cy-10,cx+11,cy+10,0);
    for(var y=cy-10;y<=cy+10;y++) wallTile(cx,y);
    for(var x=cx-11;x<=cx+11;x++) wallTile(x,cy);
    zones=[[cx-9,cy-8,cx-2,cy-2],[cx+2,cy-8,cx+9,cy-2],[cx-9,cy+2,cx-2,cy+8],[cx+2,cy+2,cx+9,cy+8]]; }
  else if(A==='concentric'){ wallRect(cx-13,cy-11,cx+13,cy+11,0); wallRect(cx-9,cy-7,cx+9,cy+7,0); wallRect(cx-4,cy-3,cx+4,cy+3,0);
    zones=[[cx-3,cy-2,cx+3,cy+2],[cx-8,cy-6,cx+8,cy+6],[cx-12,cy-10,cx+12,cy+10]]; }
  else if(A==='twin'){ cores=[{x:cx-8,y:cy},{x:cx+8,y:cy}];
    wallRect(cx-14,cy-7,cx-2,cy+7,0); wallRect(cx+2,cy-7,cx+14,cy+7,0);
    zones=[[cx-12,cy-5,cx-4,cy+5],[cx+4,cy-5,cx+12,cy+5]]; }
  else if(A==='islands'){ var off=[[-8,-8],[8,-8],[-8,8],[8,8]];
    for(var i2=0;i2<4;i2++){ wallRect(cx+off[i2][0]-5,cy+off[i2][1]-4,cx+off[i2][0]+5,cy+off[i2][1]+4,0);
      zones.push([cx+off[i2][0]-3,cy+off[i2][1]-2,cx+off[i2][0]+3,cy+off[i2][1]+2]); } }
  if(!zones.length) zones=[[cx-8,cy-8,cx+8,cy+8]];
  function inZone(zi){ var z=zones[zi%zones.length];
    return { x: z[0]+R()*(z[2]-z[0]), y: z[1]+R()*(z[3]-z[1]) }; }

  // ---- 大本营 ----
  var th = add('townhall', cores[0].x-2, cores[0].y-2); if(th) th.th = true;

  // ---- 防御 ----
  var defList = [];
  var order = ['wizard','airdef','mortar','tesla','cannon','archer'];
  for(var oi=0; oi<order.length; oi++){ var n = L.def[order[oi]]||0; for(var q=0;q<n;q++) defList.push(order[oi]); }
  for(var di=0; di<defList.length; di++){
    var deep = di < defList.length*0.5 ? 0 : 1;
    var p = inZone(deep === 0 ? 0 : di);
    add(defList[di], p.x, p.y);
  }
  // ---- 储存 / 资源 ----
  for(var si=0; si<L.sto; si++){ var p2=inZone(si+1); add(si%2?'elix':'gold', p2.x, p2.y); }
  for(var ri=0; ri<L.res; ri++){
    var out = ri >= Math.ceil(L.res/2);
    var ang = R()*Math.PI*2, rad = out ? outer+3+R()*4 : 6+R()*3;
    add(ri%2?'coll':'mine', cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad);
  }
  // ---- 诱饵 / 小屋 ----
  for(var ci=0; ci<L.decoy; ci++){
    var an=R()*Math.PI*2, rd=(outer||8)+2.5+R()*6;
    add(ci%4===0?'hut':'decoy', cx+Math.cos(an)*rd, cy+Math.sin(an)*rd);
  }
  // ---- 陷阱 ----
  var tk=['bomb','giant','spring','airbomb'];
  for(var ti=0; ti<tk.length; ti++){ var cnt=L.trap[tk[ti]]||0;
    for(var c=0;c<cnt;c++){ var tries=0,tx,ty;
      do{ var pz=inZone(c+ti); tx=Math.round(pz.x); ty=Math.round(pz.y); tries++; }
      while(tries<30 && (tx<2||ty<2||tx>=MAP-2||ty>=MAP-2||occ[ty*MAP+tx]));
      if(tx>=2&&ty>=2&&tx<MAP-2&&ty<MAP-2&&!occ[ty*MAP+tx]) T.push({t:tk[ti],x:tx,y:ty}); } }
  return {B:B, W:W, T:T, cx:cx, cy:cy};
}

/* ---------------- 战斗 ---------------- */
function Battle(L, army, spells, heroes, power){
  var v = buildVillage(L);
  var hpM = HPM[L.ch-1], dmM = DMM[L.ch-1];
  this.L = L; this.t = 0; this.over = false; this.power = power;
  this.buildings = []; this.walls = []; this.traps = []; this.troops = [];
  this.proj = []; this.fx = []; this.spellsActive = []; this.log = [];
  var self = this;
  for(var i=0;i<v.B.length;i++){ var b=v.B[i], d=BDEF[b.t];
    var hp = Math.round(d.hp*hpM*(d.th?3.2:1));
    this.buildings.push({ id:i, t:b.t, x:b.x, y:b.y, s:d.s, hp:hp, mx:hp, alive:true,
      def:!!d.def, res:!!d.res, th:!!d.th, decoy:!!d.decoy, air:!!d.air, gnd:!!d.gnd,
      dps: d.dps? d.dps*dmM : 0, rng:d.rng||0, cd:d.cd||1, min:d.min||0, splash:d.splash||0,
      cdT: Math.random()*0.6, hidden: !!d.hide, flash:0 }); }
  var whp = WALLHP[L.ch-1];
  this.wallGrid = new Int32Array(MAP*MAP).fill(-1);
  for(var w=0;w<v.W.length;w++){ this.walls.push({x:v.W[w].x,y:v.W[w].y,hp:whp,mx:whp,alive:true,flash:0});
    this.wallGrid[v.W[w].y*MAP+v.W[w].x]=w; }
  for(var tt=0;tt<v.T.length;tt++){ var td=TRAPDEF[v.T[tt].t];
    this.traps.push({t:v.T[tt].t,x:v.T[tt].x,y:v.T[tt].y,rad:td.rad,dmg:td.dmg,air:!!td.air,
      spring:!!td.spring,used:false}); }
  this.totalB = 0;
  for(var q=0;q<this.buildings.length;q++) this.totalB++;
  this.destroyed = 0; this.thDown = false;
  this.army = army; this.spellBank = spells; this.heroBank = heroes;
  this.blockGrid = new Uint8Array(MAP*MAP);
  this.rebuildBlock();
  this.fieldCache = {}; this.ver = 0; this.damaged = []; this.dmgVer = 0;
}
Battle.prototype.rebuildBlock = function(){
  var g = this.blockGrid; g.fill(0);
  for(var i=0;i<this.buildings.length;i++){ var b=this.buildings[i]; if(!b.alive) continue;
    for(var j=0;j<b.s;j++) for(var k=0;k<b.s;k++) g[(b.y+j)*MAP+(b.x+k)] = 1; }
  for(var w=0;w<this.walls.length;w++){ var q=this.walls[w]; if(q.alive) g[q.y*MAP+q.x]=2; }
};
Battle.prototype.canDeploy = function(tx,ty){
  if(tx<1||ty<1||tx>=MAP-1||ty>=MAP-1) return false;
  for(var j=-2;j<=2;j++) for(var i=-2;i<=2;i++){
    var x=tx+i, y=ty+j; if(x<0||y<0||x>=MAP||y>=MAP) continue;
    if(this.blockGrid[y*MAP+x]) return false; }
  return true;
};
// 统一 BFS 流场：每个"破坏回合"全图计算一次；
// 每帧用受限 A*（最多 80 次扩展）重算本回合被破坏单元，模拟部队重新规划路线。
Battle.prototype.fieldFor = function(ignoreWalls){
  var key = ignoreWalls?'jump':'walk';
  var c = this.fieldCache[key];
  if(c && c.ver === this.ver) return c.d;
  var d = new Float32Array(MAP*MAP).fill(1e9);
  var q = new Int32Array(MAP*MAP), qh = 0, qt = 0;
  for(var bi=0; bi<this.buildings.length; bi++){
    var b = this.buildings[bi]; if(!b.alive) continue;
    for(var j=-1;j<=b.s;j++) for(var i=-1;i<=b.s;i++){
      var x=b.x+i, y=b.y+j; if(x<0||y<0||x>=MAP||y>=MAP) continue;
      var id=y*MAP+x; if(d[id]!==0){ d[id]=0; q[qt++]=id; } } }
  while(qh<qt){
    var n=q[qh++], wd=d[n];
    var x0=n%MAP, y0=(n-x0)/MAP;
    for(var k=0;k<4;k++){
      var nx=x0+(k===0?1:k===1?-1:0), ny=y0+(k===2?1:k===3?-1:0);
      if(nx<0||ny<0||nx>=MAP||ny>=MAP) continue;
      var ni=ny*MAP+nx, bg=this.blockGrid[ni], cost=1;
      if(bg===2) cost = ignoreWalls?1:WCOST;
      var nw=wd+cost;
      if(nw<d[ni]){ d[ni]=nw; q[qt++]=ni; } } }
  this.fieldCache[key] = {ver:this.ver, d:d};
  return d;
};
// 目标 = 场中最近存活建筑；每帧重算破坏单元（<80 格扩展即停，只在破坏发生的那几帧生效）
Battle.prototype.patchField = function(ignoreWalls){
  var fld = this.fieldFor(ignoreWalls);
  var q = new Int32Array(256), qi=0, qh=0, cnt=0;
  for(var i=0;i<this.damaged.length;i++){ var id=this.damaged[i];
    fld[id]=0; q[qh++]=id; }
  while(qh>qi && cnt<80){
    var n=q[qi++], wd=fld[n]; cnt++;
    var x0=n%MAP, y0=(n-x0)/MAP;
    for(var k=0;k<4;k++){
      var nx=x0+(k===0?1:k===1?-1:0), ny=y0+(k===2?1:k===3?-1:0);
      if(nx<0||ny<0||nx>=MAP||ny>=MAP) continue;
      var ni=ny*MAP+nx, nw=wd+1;
      if(nw<fld[ni]){ fld[ni]=nw; if(qh<256) q[qh++]=ni; } } } };
Battle.prototype.deploy = function(kind, tx, ty, isHero){
  var def = null;
  if(isHero){ for(var h=0;h<HEROES.length;h++) if(HEROES[h].k===kind) def=HEROES[h]; }
  else { for(var i=0;i<TROOPS.length;i++) if(TROOPS[i].k===kind) def=TROOPS[i]; }
  if(!def) return false;
  var P = this.power;
  var t = { k:kind, def:def, hero:!!isHero, x:tx+0.5, y:ty+0.5,
    hp: Math.round(def.hp*P), mx: Math.round(def.hp*P), dps: def.dps? def.dps*P : 0,
    heal: def.heal? def.heal*P : 0, rng: def.rng, spd: def.spd, pref: def.pref,
    air: !!def.air, jump: !!def.jump, splash: def.splash||0, wall40: !!def.wall40,
    mult: def.mult||1, lone: !!def.lone, wdmg:(def.wdmg||0)*P, target:null, wallT:null, atk:0, alive:true,
    stuckT:0, lx:0, ly:0, ret:0,
    ab:0, invuln:0, flash:0, born:this.t };
  this.troops.push(t); return true;
};
Battle.prototype.castSpell = function(k, x, y){
  var s=null; for(var i=0;i<SPELLS.length;i++) if(SPELLS[i].k===k) s=SPELLS[i];
  if(!s) return false;
  if(k==='light'){ this.damageArea(x,y,s.rad,s.dmg*this.power,true,true); this.fx.push({t:'light',x:x,y:y,r:s.rad,life:0.5,max:0.5}); return true; }
  this.spellsActive.push({k:k, x:x, y:y, r:s.rad, life:s.dur, max:s.dur, c:s.c});
  return true;
};
Battle.prototype.damageArea = function(x,y,r,dmg,hitB,hitW){
  for(var i=0;i<this.buildings.length;i++){ var b=this.buildings[i]; if(!b.alive) continue;
    if(!hitB) continue;
    var dx=Math.max(b.x-x, 0, x-(b.x+b.s)), dy=Math.max(b.y-y, 0, y-(b.y+b.s));
    if(Math.sqrt(dx*dx+dy*dy)<=r) this.hitB(b,dmg); }
  if(hitW) for(var w=0;w<this.walls.length;w++){ var q=this.walls[w]; if(!q.alive) continue;
    var ddx=q.x+0.5-x, ddy=q.y+0.5-y;
    if(Math.sqrt(ddx*ddx+ddy*ddy)<=r) this.hitW(q,dmg); }
};
Battle.prototype.hitB = function(b, dmg){
  if(!b.alive) return; b.hp -= dmg; b.flash = 0.14;
  if(b.hp<=0){ b.alive=false; this.destroyed++;
    if(b.th) this.thDown = true;
    for(var j=0;j<b.s;j++) for(var k=0;k<b.s;k++){ if(this.damaged.length<512) this.damaged.push((b.y+j)*MAP+(b.x+k)); }
    this.dmgVer++;
    this.fx.push({t:'boom',x:b.x+b.s/2,y:b.y+b.s/2,r:b.s*0.9,life:0.45,max:0.45});
    this.ver++; this.rebuildBlock(); }
};
Battle.prototype.hitW = function(q, dmg){
  if(!q.alive) return; q.hp -= dmg; q.flash = 0.14;
  if(q.hp<=0){ q.alive=false; this.ver++; this.blockGrid[q.y*MAP+q.x]=0; this.fieldCache={}; if(this.damaged.length<512) this.damaged.push(q.y*MAP+q.x); this.dmgVer++;
    this.fx.push({t:'boom',x:q.x+0.5,y:q.y+0.5,r:0.8,life:0.3,max:0.3}); } };
Battle.prototype.pct = function(){ return this.totalB? this.destroyed/this.totalB : 0; };
Battle.prototype.stars = function(){ var p=this.pct(); var s=0;
  if(p>=0.5) s++; if(this.thDown) s++; if(p>=0.999) s++; return s; };


/* ---------------- 更新循环 ---------------- */
function dB(t,b){ var dx=Math.max(b.x-t.x,0,t.x-(b.x+b.s)), dy=Math.max(b.y-t.y,0,t.y-(b.y+b.s));
  return Math.sqrt(dx*dx+dy*dy); }
Battle.prototype.teslaOK = function(b){
  if(!b.hidden) return true; if(b.revealed) return true;
  if(this.pct()>=0.51){ b.revealed=true; return true; }
  for(var i=0;i<this.troops.length;i++){ var t=this.troops[i]; if(!t.alive) continue;
    if(dB(t,b)<6.5){ b.revealed=true; this.fx.push({t:'reveal',x:b.x+1,y:b.y+1,r:1.6,life:0.4,max:0.4}); return true; } }
  return false; };
Battle.prototype.pick = function(t){
  var best=null, bd=1e9, L=this.buildings, wd=(t.pref==='def'), wr=(t.pref==='res');
  for(var i=0;i<L.length;i++){ var b=L[i]; if(!b.alive) continue;
    if(b.hidden && !this.teslaOK(b)) continue;
    if(wd && !b.def) continue; if(wr && !b.res) continue;
    var d=dB(t,b); if(d<bd){bd=d;best=b;} }
  if(!best){ for(var j=0;j<L.length;j++){ var b2=L[j]; if(!b2.alive) continue;
      if(b2.hidden && !this.teslaOK(b2)) continue;
      var d2=dB(t,b2); if(d2<bd){bd=d2;best=b2;} } }
  return best; };
Battle.prototype.nearWall = function(t){
  var best=null, bd=1e9;
  for(var i=0;i<this.walls.length;i++){ var q=this.walls[i]; if(!q.alive) continue;
    var dx=q.x+0.5-t.x, dy=q.y+0.5-t.y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=q;} }
  return best; };
Battle.prototype.hitT = function(t,dmg){ if(!t.alive||t.invuln>0) return;
  t.hp-=dmg; t.flash=0.12; if(t.hp<=0){ t.alive=false;
    this.fx.push({t:'pop',x:t.x,y:t.y,r:0.6,life:0.28,max:0.28}); } };
Battle.prototype.damageTroops = function(x,y,r,dmg,air){
  for(var i=0;i<this.troops.length;i++){ var t=this.troops[i]; if(!t.alive) continue;
    if(air===false && t.air) continue; if(air===true && !t.air) continue;
    var dx=t.x-x, dy=t.y-y; if(Math.sqrt(dx*dx+dy*dy)<=r) this.hitT(t,dmg); } };

Battle.prototype.update = function(dt){
  if(this.over) return;
  this.t += dt;
  var i,j,k,t,b,q;
  for(i=this.spellsActive.length-1;i>=0;i--){ this.spellsActive[i].life-=dt;
    if(this.spellsActive[i].life<=0) this.spellsActive.splice(i,1); }
  for(i=this.fx.length-1;i>=0;i--){ this.fx[i].life-=dt; if(this.fx[i].life<=0) this.fx.splice(i,1); }

  // ---- 部队 ----
  var alive=0;
  for(i=0;i<this.troops.length;i++){
    t=this.troops[i]; if(!t.alive) continue; alive++;
    if(t.flash>0) t.flash-=dt; if(t.invuln>0) t.invuln-=dt; if(t.ab>0) t.ab-=dt;
    var dmgMul=1, spdMul=1;
    for(j=0;j<this.spellsActive.length;j++){ var s=this.spellsActive[j];
      var dx=t.x-s.x, dy=t.y-s.y, dd=Math.sqrt(dx*dx+dy*dy);
      if(dd<=s.r){ if(s.k==='rage'){dmgMul*=1.8;spdMul*=1.55;}
        else if(s.k==='heal'){ t.hp=Math.min(t.mx, t.hp+58*this.power*dt); } } }
    if(t.ab>0){ if(t.k==='bk'){dmgMul*=1.5;spdMul*=1.3;} else if(t.k==='aq'){dmgMul*=1.4;} }
    if(t.lone){ var solo=true;
      for(j=0;j<this.troops.length;j++){ var o=this.troops[j];
        if(o!==t&&o.alive&&o.air){ var ox=o.x-t.x,oy=o.y-t.y; if(ox*ox+oy*oy<25){solo=false;break;} } }
      if(solo) dmgMul*=1.7; }

    // 治疗药师
    if(t.pref==='heal'){
      var hb=null,hbd=1e9;
      for(j=0;j<this.troops.length;j++){ var f=this.troops[j];
        if(f===t||!f.alive||f.air) continue; var r0=f.hp/f.mx;
        var fx0=f.x-t.x, fy0=f.y-t.y, fd=Math.sqrt(fx0*fx0+fy0*fy0)+r0*8;
        if(fd<hbd){hbd=fd;hb=f;} }
      if(hb){ var hx=hb.x-t.x, hy=hb.y-t.y, hd=Math.sqrt(hx*hx+hy*hy);
        if(hd>t.rng*0.7){ t.x+=hx/hd*t.spd*spdMul*dt; t.y+=hy/hd*t.spd*spdMul*dt; }
        if(hd<=t.rng){ hb.hp=Math.min(hb.mx, hb.hp+t.heal*dt); t.atk=0.2; } }
      continue; }

    // 炸弹人
    if(t.pref==='wall'){
      if(!t.wallT||!t.wallT.alive) t.wallT=this.nearWall(t);
      if(!t.wallT){ t.pref='any'; }
      else { var wx=t.wallT.x+0.5-t.x, wy=t.wallT.y+0.5-t.y, wd=Math.sqrt(wx*wx+wy*wy);
        if(wd<0.85){ this.damageArea(t.x,t.y,1.9,t.wdmg*dmgMul,false,true);
          this.damageArea(t.x,t.y,1.3,t.wdmg*0.12*dmgMul,true,false);
          this.fx.push({t:'boom',x:t.x,y:t.y,r:1.7,life:0.4,max:0.4}); t.alive=false; }
        else { t.x+=wx/wd*t.spd*spdMul*dt; t.y+=wy/wd*t.spd*spdMul*dt; }
        continue; } }

    if(!t.target||!t.target.alive){ t.target=this.pick(t); t.ret=0; }
    if(!t.target) continue;
    var mvx=t.x-t.lx, mvy=t.y-t.ly; t.lx=t.x; t.ly=t.y;
    if(mvx*mvx+mvy*mvy < 0.0006*dt*dt*4){ t.stuckT+=dt; } else t.stuckT=0;
    if(t.stuckT>2.2){ t.stuckT=0; t.ret++;
      if(t.ret>=2){ t.ret=0; t.target=this.pick(t); } }
    var d1=dB(t,t.target);
    if(d1<=t.rng+0.45){
      t.atk=0.25;
      var dmg=t.dps*dmgMul*dt*(t.target.res?t.mult:1);

    for(var i=0;i<6;i++){ var an=i*1.047+f.x; c.beginPath();
      c.moveTo(X+Math.cos(an)*R*0.5,Y+Math.sin(an)*R*0.35);
      c.lineTo(X+Math.cos(an)*R*1.15,Y+Math.sin(an)*R*0.8); c.stroke(); }
  } else if(f.t==='pop'){
    c.globalAlpha=a*0.9; c.fillStyle='#ff8a5a'; ell(c,X,Y,f.r*TILE*(1.7-a),f.r*TILE*(1.4-a)*0.8); c.fill();
    c.globalAlpha=a*0.7; c.fillStyle='#ffe0b0';
    for(var j=0;j<5;j++){ var aj=j*1.257; ell(c,X+Math.cos(aj)*(1-a)*13,Y+Math.sin(aj)*(1-a)*9,2.2*a,2.2*a); c.fill(); }
  } else if(f.t==='hit'){
    c.globalAlpha=a*0.85; c.fillStyle='#fff0a0'; ell(c,X,Y,Math.max(3,f.r*TILE*0.55)*(1.4-a*0.4),Math.max(2.4,f.r*TILE*0.42)); c.fill();
  } else if(f.t==='spring'){
    c.globalAlpha=a; c.strokeStyle='#ffd45a'; c.lineWidth=2.6;
    for(var s=0;s<3;s++){ c.beginPath(); c.ellipse(X,Y-(1-a)*10-s*4,f.r*TILE*0.5,f.r*TILE*0.2,0,0,6.28); c.stroke(); }
  } else if(f.t==='light'){
    c.globalAlpha=a; c.strokeStyle='#fff4a0'; c.lineWidth=4;
    c.beginPath(); c.moveTo(X,Y-160);
    for(var q=1;q<=6;q++){ c.lineTo(X+(q%2?10:-10)*(1-q/8),Y-160+q*26); } c.stroke();
    c.fillStyle='rgba(255,244,160,'+(a*0.5)+')'; ell(c,X,Y,f.r*TILE,f.r*TILE*0.55); c.fill();
  } else if(f.t==='ability'){
    c.globalAlpha=a*0.85; c.strokeStyle='#ffd85a'; c.lineWidth=3.4;
    ell(c,X,Y,f.r*TILE*(1.6-a),f.r*TILE*(1.6-a)*0.55); c.stroke();
  } else {
    c.globalAlpha=a*0.85; c.strokeStyle='#7adcff'; c.lineWidth=3;
    ell(c,X,Y,f.r*TILE*(1.6-a),f.r*TILE*(1.6-a)); c.stroke(); }
  c.globalAlpha=1;
}

function drawSpell(c,sp,time){
  var X=sp.x*TILE, Y=sp.y*TILE, R=sp.r*TILE, ph=time*2.2;
  if(sp.k==='rage'){
    c.globalAlpha=0.24+0.06*Math.sin(time*6); c.fillStyle='#b83ce0'; ell(c,X,Y,R,R*0.62); c.fill();
    c.globalAlpha=0.8; c.strokeStyle='#e07aff'; c.lineWidth=2.4; ell(c,X,Y,R,R*0.62); c.stroke();
    for(var i=0;i<8;i++){ var a2=ph+i*0.785;
      c.globalAlpha=0.5; c.fillStyle='#f0a0ff';
      ell(c,X+Math.cos(a2)*R*0.72,Y+Math.sin(a2)*R*0.45-((time*30+i*9)%26),2.6,3.4); c.fill(); }
  } else if(sp.k==='heal'){
    c.globalAlpha=0.22+0.06*Math.sin(time*5); c.fillStyle='#40d060'; ell(c,X,Y,R,R*0.62); c.fill();
    c.globalAlpha=0.85; c.strokeStyle='#6ef07a'; c.lineWidth=2.4; ell(c,X,Y,R,R*0.62); c.stroke();
    for(var j=0;j<7;j++){ var a3=j*0.897+ph*0.4, yy=((time*26+j*11)%30);
      c.globalAlpha=0.65*(1-yy/30); c.fillStyle='#b4ffb4';
      var px2=X+Math.cos(a3)*R*0.66, py2=Y+Math.sin(a3)*R*0.40-yy;
      c.fillRect(px2-3,py2-1,6,2); c.fillRect(px2-1,py2-3,2,6); }
  } else {
    c.globalAlpha=0.28; c.fillStyle='#5fbdf0'; ell(c,X,Y,R,R*0.62); c.fill();
    c.globalAlpha=0.9; c.strokeStyle='#bfeaff'; c.lineWidth=2.4; ell(c,X,Y,R,R*0.62); c.stroke();
    for(var m=0;m<9;m++){ var a4=m*0.698;
      c.globalAlpha=0.55; c.fillStyle='#e8f8ff';
      var cx2=X+Math.cos(a4)*R*0.62, cy2=Y+Math.sin(a4)*R*0.38;
      tri(c,cx2,cy2-5,cx2-3.4,cy2+3,cx2+3.4,cy2+3); c.fill(); } }
  c.globalAlpha=1;
}

function drawBattle(ctx, bt, sel, mouse){
  var time=bt.t, ch=bt.L.ch, i;
  ctx.drawImage(groundCanvas(bt.L),0,0);
  for(i=0;i<bt.traps.length;i++){ var tr=bt.traps[i]; if(!tr.used) continue;
    ctx.fillStyle='rgba(30,22,16,.42)'; ell(ctx,(tr.x+0.5)*TILE,(tr.y+0.5)*TILE,TILE*0.62,TILE*0.40); ctx.fill();
    ctx.fillStyle='rgba(10,8,6,.30)'; ell(ctx,(tr.x+0.5)*TILE,(tr.y+0.5)*TILE,TILE*0.34,TILE*0.22); ctx.fill(); }
  if(sel){ var m=bt.deployMask();
    ctx.fillStyle='rgba(110,255,120,.16)'; ctx.strokeStyle='rgba(150,255,150,.22)'; ctx.lineWidth=1;
    for(var y=0;y<MAP;y++) for(var x=0;x<MAP;x++) if(m[y*MAP+x]) ctx.fillRect(x*TILE,y*TILE,TILE,TILE); }
  for(i=0;i<bt.spellsActive.length;i++) drawSpell(ctx,bt.spellsActive[i],time);

  var list=[];
  for(i=0;i<bt.walls.length;i++){ var w=bt.walls[i]; if(w.alive) list.push({y:w.y*TILE+TILE, k:0, r:w}); }
  for(i=0;i<bt.buildings.length;i++){ var b=bt.buildings[i];
    if(b.alive && !(b.hidden&&!b.revealed)) list.push({y:(b.y+b.s)*TILE, k:1, r:b}); }
  for(i=0;i<bt.troops.length;i++){ var t=bt.troops[i]; if(t.alive) list.push({y:t.y*TILE+(t.air?18:0), k:2, r:t}); }
  list.sort(function(a,z){ return a.y-z.y; });
  var wallsDone=false;
  for(i=0;i<list.length;i++){ var it=list[i];
    if(it.k===1) drawBuilding(ctx,it.r,time,ch);
    else if(it.k===2) drawTroop(ctx,it.r,time);
    else { var q=it.r, xx=q.x*TILE, yy=q.y*TILE, H=TILE*0.55;
      var col = ch>=6?'#6d5f57' : ch>=5?'#c8d6de' : ch>=4?'#c9ab72' : ch>=3?'#8e9a86' : ch>=2?'#b5ab92':'#c2b08a';
      var up=bt.wallGrid[(q.y-1)*MAP+q.x], dn=bt.wallGrid[(q.y+1)*MAP+q.x];
      var upA=up>=0&&bt.walls[up]&&bt.walls[up].alive, dnA=dn>=0&&bt.walls[dn]&&bt.walls[dn].alive;
      ctx.fillStyle='rgba(0,0,0,.30)'; ctx.fillRect(xx+1,yy+TILE-2,TILE-1,3);
      ctx.fillStyle=q.flash>0?'#fff':sh(col,-0.32); ctx.fillRect(xx,yy+TILE-H,TILE,H);
      ctx.fillStyle=q.flash>0?'#fff':col; rr(ctx,xx,yy+TILE-H-4,TILE,7,2.2); ctx.fill();
      ctx.fillStyle=q.flash>0?'#fff':sh(col,0.20); ctx.fillRect(xx+1,yy+TILE-H-3,TILE-2,2.4);
      if(!upA){ ctx.fillStyle=sh(col,0.30); ctx.fillRect(xx+1.5,yy+TILE-H-6,3.6,3); ctx.fillRect(xx+TILE-5,yy+TILE-H-6,3.6,3); }
      ctx.strokeStyle='rgba(0,0,0,.20)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xx+TILE/2,yy+TILE-H+1); ctx.lineTo(xx+TILE/2,yy+TILE-2); ctx.stroke();
      if(q.hp<q.mx){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(xx+1,yy+TILE-H-9,TILE-2,2.4);
        ctx.fillStyle='#5ad85a'; ctx.fillRect(xx+1,yy+TILE-H-9,(TILE-2)*(q.hp/q.mx),2.4); } } }

  for(i=0;i<bt.proj.length;i++) drawProj(ctx,bt.proj[i],time);
  for(i=0;i<bt.fx.length;i++) drawFx(ctx,bt.fx[i],time);

  if(sel && mouse){ var mx=Math.floor(mouse.x), my=Math.floor(mouse.y), ok=bt.canDeploy(mx,my);
    if(sel.spell){ ctx.globalAlpha=0.20; ctx.fillStyle=sel.spell.c;
      ell(ctx,(mx+0.5)*TILE,(my+0.5)*TILE,sel.spell.rad*TILE,sel.spell.rad*TILE*0.62); ctx.fill();
      ctx.globalAlpha=0.8; ctx.strokeStyle=sel.spell.c; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1; }
    ctx.strokeStyle=ok?'#8dff8d':'#ff6a6a'; ctx.lineWidth=2.6;
    rr(ctx,mx*TILE+1,my*TILE+1,TILE-2,TILE-2,3); ctx.stroke();
    if(ok){ ctx.fillStyle='rgba(140,255,140,.28)'; ctx.fill(); } }
}

function drawPreview(ctx, L, W, H){
  var v=buildVillage(L), T=THEMES[L.theme]||THEMES.forest, sc=W/MAP, R=rngOf(L.id*31+9);
  ctx.fillStyle=T.g1; ctx.fillRect(0,0,W,H);
  for(var y=0;y<MAP;y+=2) for(var x=0;x<MAP;x+=2){ if((x+y)%4===0){ ctx.fillStyle=T.g2; ctx.fillRect(x*sc,y*sc,sc*2,sc*2); } }
  for(var n=0;n<14;n++){ ctx.fillStyle=sh(T.d,0.05); ctx.globalAlpha=0.25;
    ell(ctx,R()*W,R()*H,6+R()*16,4+R()*9); ctx.fill(); }
  ctx.globalAlpha=1;
  var wc = L.ch>=6?'#6d5f57' : L.ch>=5?'#c8d6de' : L.ch>=4?'#c9ab72' : L.ch>=3?'#8e9a86' : L.ch>=2?'#b5ab92':'#c2b08a';
  for(var i=0;i<v.W.length;i++){ ctx.fillStyle=sh(wc,-0.28); ctx.fillRect(v.W[i].x*sc,v.W[i].y*sc+sc*0.35,sc,sc*0.75);
    ctx.fillStyle=wc; ctx.fillRect(v.W[i].x*sc,v.W[i].y*sc,sc,sc*0.6); }
  for(var j=0;j<v.B.length;j++){ var b=v.B[j], d=BDEF[b.t], s=d.s*sc;
    var col = d.th?'#e0b53a' : d.def?'#d8503a' : d.res?'#e8c14a' : '#9d8a6a';
    ctx.fillStyle='rgba(0,0,0,.28)'; rr(ctx,b.x*sc+1,b.y*sc+2,s-1.5,s-1.5,2); ctx.fill();
    ctx.fillStyle=sh(col,-0.22); rr(ctx,b.x*sc+0.5,b.y*sc+0.5,s-1.5,s-1.5,2); ctx.fill();
    ctx.fillStyle=col; rr(ctx,b.x*sc+0.5,b.y*sc+0.5,s-1.5,(s-1.5)*0.45,2); ctx.fill(); }
}

// 哥布林战役 · UI 与游戏流程
var SAVEKEY = 'goblin_campaign_v1';
var S = null, CUR = null, BT = null, SEL = null, RAF = 0, MOUSE = null, RESERVE = {}, HEROSTATE = {};
var lastT = 0, painting = false, lastPaint = 0, SPEED = 1;

function load(){ try{ var r = JSON.parse(localStorage.getItem(SAVEKEY)); if(r&&r.stars) return r; }catch(e){}
  return { stars:{}, pct:{}, gold:0, elix:0, de:0, gems:0, claimed:{}, titles:[] }; }
function save(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(S)); }catch(e){} }
function totalStars(){ var n=0; for(var k in S.stars) n+=S.stars[k]; return n; }
function maxUnlocked(){ var m=1; for(var i=1;i<=75;i++){ if(i===1||(S.stars[i-1]||0)>=1) m=i; else break; } return m; }
function chOf(id){ return id<=15?1:id<=30?2:id<=45?3:id<=60?4:id<=70?5:6; }
function curCh(){ return chOf(maxUnlocked()); }
function powerOf(){ return 1 + 0.30*(curCh()-1) + 0.004*totalStars(); }
function capOf(){ return CAMPCAP[curCh()]; }
function spellCapOf(){ return SPELLCAP[curCh()]; }
function unlockedTroops(){ var m=maxUnlocked(), r=[]; for(var i=0;i<TROOPS.length;i++) if(TROOPS[i].unlock<=m) r.push(TROOPS[i]); return r; }
function unlockedSpells(){ var m=maxUnlocked(), r=[]; for(var i=0;i<SPELLS.length;i++) if(SPELLS[i].unlock<=m) r.push(SPELLS[i]); return r; }
function unlockedHeroes(){ var m=maxUnlocked(), r=[]; for(var i=0;i<HEROES.length;i++) if(HEROES[i].unlock<=m) r.push(HEROES[i]); return r; }
function fmt(n){ return (n||0).toLocaleString('en-US'); }
function el(id){ return document.getElementById(id); }
function starHtml(n,size){ var s=''; for(var i=0;i<3;i++) s += '<span class="st'+(i<n?' on':'')+'">★</span>'; return '<span class="stars '+(size||'')+'">'+s+'</span>'; }

/* ---------------- 顶栏 ---------------- */
function paintHud(){
  el('hud').innerHTML =
   '<div class="brand" onclick="showMap()"><span>👺</span><b>哥布林战役</b></div>'
  +'<div class="res"><i class="rg">🪙</i>'+fmt(S.gold)+'</div>'
  +'<div class="res"><i class="re">💧</i>'+fmt(S.elix)+'</div>'
  +'<div class="res"><i class="rd">🛢️</i>'+fmt(S.de)+'</div>'
  +'<div class="res"><i class="rm">💎</i>'+fmt(S.gems)+'</div>'
  +'<div class="sp"></div>'
  +'<div class="res star">'+starHtml(3)+' '+totalStars()+' / 225</div>'
  +'<button class="btn sm" onclick="showRewards()">🎁 星级奖励</button>'
  +'<button class="btn sm gray" onclick="resetGame()">↺ 重置</button>';
}

/* ---------------- 战役地图 ---------------- */
var mapCh = 1;
function showMap(){
  cancelAnimationFrame(RAF); BT=null;
  mapCh = Math.min(6, curCh());
  paintHud(); paintMap();
}
function paintMap(){
  var m = maxUnlocked(), h = '<div class="chtabs">';
  for(var c=0;c<CHAPTERS.length;c++){ var C=CHAPTERS[c];
    var lock = C.a > m;
    h += '<button class="chtab'+(mapCh===C.n?' on':'')+(lock?' lock':'')+'" '
      +(lock?'disabled':'onclick="mapCh='+C.n+';paintMap()"')+' style="--c:'+C.c+'">'
      +'<b>第'+C.n+'章</b><span>'+(lock?'🔒 未解锁':C.name)+'</span></button>'; }
  h += '</div>';
  var C2 = CHAPTERS[mapCh-1];
  var got=0, max=0;
  for(var i=C2.a;i<=C2.b;i++){ got += S.stars[i]||0; max += 3; }
  h += '<div class="chhead" style="--c:'+C2.c+'"><h2>'+C2.name+' · '+C2.en+'</h2>'
     + '<div class="chbar"><i style="width:'+(got/max*100)+'%"></i></div>'
     + '<span>'+got+' / '+max+' ★</span></div>';
  h += '<div class="grid">';
  for(var id=C2.a; id<=C2.b; id++){
    var L = LEVELS[id-1], st = S.stars[id]||0, lock = id>m, p = S.pct[id]||0;
    var left = Math.round((1-p)*100);
    h += '<div class="card'+(lock?' lock':'')+(st===3?' perfect':'')+'" '+(lock?'':'onclick="showArmy('+id+')"')+'>'
      +'<div class="cno">'+id+'</div>'
      +(lock? '<div class="clock">🔒</div>' : '<canvas class="cprev" width="120" height="120" data-lv="'+id+'"></canvas>')
      +'<div class="cname"><b>'+L.en+'</b><span>'+L.zh+'</span></div>'
      +'<div class="cmeta">TH'+L.th+' · 难度 D'+L.d+'</div>'
      +'<div class="cstars">'+starHtml(st)+'</div>'
      +(lock?'':'<div class="cloot">'+(left>0?'💰 剩余 '+left+'%':'<span class="done">✔ 已搜刮</span>')+'</div>')
      +'</div>'; }
  h += '</div>';
  el('screen').innerHTML = h; el('screen').className='sc-map';
  var cvs = document.querySelectorAll('canvas.cprev');
  for(var q=0;q<cvs.length;q++){ var cv=cvs[q]; drawPreview(cv.getContext('2d'), LEVELS[+cv.dataset.lv-1], 120,120); }
}

/* ---------------- 备战 ---------------- */
var ARMY = {}, SPBUY = {}, HEROSEL = {};
function showArmy(id){
  CUR = LEVELS[id-1]; ARMY = {}; SPBUY = {}; HEROSEL = {};
  var hs = unlockedHeroes(); for(var i=0;i<hs.length;i++) HEROSEL[hs[i].k]=true;
  paintHud(); paintArmy();
}
function armyUsed(){ var n=0, T=TROOPS; for(var k in ARMY){ for(var i=0;i<T.length;i++) if(T[i].k===k) n+=T[i].h*ARMY[k]; } return n; }
function spellUsed(){ var n=0; for(var k in SPBUY) n+=SPBUY[k]; return n; }
function addT(k,n){ var cur=ARMY[k]||0, def=null;
  for(var i=0;i<TROOPS.length;i++) if(TROOPS[i].k===k) def=TROOPS[i];
  var nv = Math.max(0, cur+n);
  if(n>0 && armyUsed()+def.h*n > capOf()) return; ARMY[k]=nv; if(!nv) delete ARMY[k]; paintArmy(); }
function addS(k,n){ var cur=SPBUY[k]||0, nv=Math.max(0,cur+n);
  if(n>0 && spellUsed()+1 > spellCapOf()) return; SPBUY[k]=nv; if(!nv) delete SPBUY[k]; paintArmy(); }
function toggleH(k){ HEROSEL[k]=!HEROSEL[k]; paintArmy(); }
function autoFill(){
  ARMY={}; SPBUY={};
  var av=unlockedTroops(), cap=capOf();
  var plan = CUR.def.airdef>0 ? ['gian','wiz','arch','wb','barb'] : ['ball','gian','arch','barb'];
  if(CUR.def.airdef===0 && CUR.def.archer===0 && CUR.def.wizard===0 && CUR.def.tesla===0){ plan=['ball','arch','barb']; }
  var pool=[]; for(var i=0;i<plan.length;i++){ for(var j=0;j<av.length;j++) if(av[j].k===plan[i]) pool.push(av[j]); }
  if(!pool.length) pool=av.slice(0,3);
  var ratio=[0.45,0.25,0.18,0.08,0.04], guard=0;
  for(var p=0;p<pool.length;p++){ var want=Math.floor(cap*(ratio[p]||0.05)/pool[p].h); if(want>0) ARMY[pool[p].k]=want; }
  while(armyUsed()<cap-1 && guard++<400){ var t=pool[guard%pool.length]; if(armyUsed()+t.h<=cap) ARMY[t.k]=(ARMY[t.k]||0)+1; else break; }
  var sp=unlockedSpells();
  if(sp.length){ var li2=0, g2=0;
    while(spellUsed()<spellCapOf() && g2++<40){ var pick=sp[li2++ % sp.length];
      SPBUY[pick.k]=(SPBUY[pick.k]||0)+1; } }
  paintArmy(); }
function paintArmy(){
  var L=CUR, st=S.stars[L.id]||0, p=S.pct[L.id]||0, C=CHAPTERS[L.ch-1];
  var dn={cannon:'加农炮',archer:'箭塔',mortar:'迫击炮',wizard:'法师塔',airdef:'防空火箭',tesla:'隐形特斯拉'};
  var defs=''; for(var k in dn) if(L.def[k]) defs += '<span class="dtag">'+BDEF[k].ico+' '+dn[k]+' ×'+L.def[k]+'</span>';
  if(!L.def.airdef && !L.def.archer && !L.def.wizard && !L.def.tesla) defs += '<span class="dtag warn">🎈 无对空火力！</span>';
  var tn={bomb:'炸弹',giant:'巨型炸弹',spring:'弹簧',airbomb:'空气炸弹'}, tps='';
  for(var k2 in tn) if(L.trap[k2]) tps += '<span class="dtag t">'+tn[k2]+' ×'+L.trap[k2]+'</span>';
  var h = '<div class="abar"><button class="btn gray" onclick="showMap()">← 返回战役地图</button>'
    +'<h2 style="--c:'+C.c+'">第 '+L.id+' 关 · '+L.en+' <small>'+L.zh+'</small></h2>'
    +starHtml(st)+'</div>';
  h += '<div class="acols"><div class="apanel">'
    +'<canvas id="prev" width="300" height="300"></canvas>'
    +'<div class="tip">💡 <b>本关战术要点：</b>'+L.teach+'</div>'
    +'<div class="dlist"><h4>敌方防御</h4>'+defs+'</div>'
    +(tps?'<div class="dlist"><h4>已知陷阱</h4>'+tps+'</div>':'')
    +'<div class="dlist"><h4>可掠夺资源（剩余 '+Math.round((1-p)*100)+'%）</h4>'
      +'<span class="dtag">🪙 '+fmt(Math.round(L.gold*(1-p)))+'</span>'
      +'<span class="dtag">💧 '+fmt(Math.round(L.elix*(1-p)))+'</span>'
      +(L.de?'<span class="dtag">🛢️ '+fmt(Math.round(L.de*(1-p)))+'</span>':'')+'</div>'
    +'</div><div class="apanel wide">';
  h += '<div class="cap">兵力 <b>'+armyUsed()+' / '+capOf()+'</b>'
     + (spellCapOf()? ' 　法术 <b>'+spellUsed()+' / '+spellCapOf()+'</b>':'')
     + '<button class="btn sm" onclick="autoFill()">⚡ 推荐配兵</button>'
     + '<button class="btn sm gray" onclick="ARMY={};SPBUY={};paintArmy()">清空</button></div>';
  h += '<div class="troops">';
  var av=unlockedTroops();
  for(var i=0;i<av.length;i++){ var T=av[i], n=ARMY[T.k]||0;
    h += '<div class="tcard'+(n?' has':'')+'"><div class="tic" style="background:'+T.c+'">'+T.ico+'</div>'

/* ---------------- 战斗 ---------------- */

function selT(k){ for(var i=0;i<TROOPS.length;i++) if(TROOPS[i].k===k){ SEL={troop:TROOPS[i]}; } paintDock(); }
