<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>孙悟空开飞机 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 16px;
    overflow: hidden;
    background: radial-gradient(1200px 700px at 50% 12%, #17325e 0%, #0a1224 55%, #05070f 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .stage {
    width: min(96vw, 1060px);
    aspect-ratio: 4 / 3;
    border-radius: 22px;
    overflow: hidden;
    background: #9fd8ff;
    box-shadow:
      0 30px 90px rgba(0, 0, 0, .65),
      0 0 0 1px rgba(255, 255, 255, .10),
      inset 0 0 0 1px rgba(0, 0, 0, .25);
  }

  svg { display: block; width: 100%; height: 100%; }

  /* ============================================================
     动画定义
     说明：所有 transform-origin 都写在 SVG 的 viewBox 用户坐标系里，
     因此统一声明 transform-box: view-box，保证原点计算一致。
     ============================================================ */

  /* ---- 太阳 ---- */
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  .sun {
    transform-box: view-box; transform-origin: 668px 112px;
    animation: sunPulse 5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sun-rays {
    transform-box: view-box; transform-origin: 668px 112px;
    animation: spin 90s linear infinite;
  }

  /* ---- 云层视差：轨道里放两份云，位移 800 后无缝循环 ---- */
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  .track {
    transform-box: view-box; transform-origin: 0 0;
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .track.far  { animation-duration: 110s; }
  .track.mid  { animation-duration: 52s; }
  .track.near { animation-duration: 24s; }

  /* ---- 飞机整体：上下浮动 + 轻微俯仰 ---- */
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.1deg); }
    50%      { transform: translateY(-14px) rotate(1.1deg); }
  }
  .plane {
    transform-box: view-box; transform-origin: 400px 300px;
    animation: bob 3.4s ease-in-out infinite;
  }

  /* ---- 螺旋桨 ---- */
  @keyframes propSpin { to { transform: rotate(360deg); } }
  .prop {
    transform-box: view-box; transform-origin: 614px 305px;
    animation: propSpin .26s linear infinite;
  }
  @keyframes blurPulse { 0%, 100% { opacity: .08; } 50% { opacity: .18; } }
  .prop-blur {
    transform-box: view-box; transform-origin: 614px 305px;
    animation: blurPulse .9s ease-in-out infinite;
  }

  /* ---- 眨眼 ---- */
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(.10); }
  }
  .eye {
    transform-box: fill-box; transform-origin: center;
    animation: blink 4.6s ease-in-out infinite;
  }

  /* ---- 披风 ---- */
  @keyframes capeFlap {
    0%, 100% { transform: rotate(0deg) skewY(0deg); }
    50%      { transform: rotate(-4deg) skewY(3.5deg); }
  }
  .cape {
    transform-box: view-box; transform-origin: 374px 236px;
    animation: capeFlap 1.15s ease-in-out infinite;
  }

  /* ---- 挥手 ---- */
  @keyframes wave {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(13deg); }
  }
  .arm-wave {
    transform-box: view-box; transform-origin: 438px 238px;
    animation: wave 1.35s ease-in-out infinite;
  }

  /* ---- 尾巴 ---- */
  @keyframes tailSway {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(7deg); }
  }
  .tail {
    transform-box: view-box; transform-origin: 352px 272px;
    animation: tailSway 2.3s ease-in-out infinite;
  }

  /* ---- 紧箍咒闪光 ---- */
  @keyframes bandGlow {
    0%, 100% { opacity: .22; transform: scale(1); }
    50%      { opacity: .70; transform: scale(1.25); }
  }
  .band-glow {
    transform-box: fill-box; transform-origin: center;
    animation: bandGlow 1.8s ease-in-out infinite;
  }

  /* ---- 尾迹云 ---- */
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.30); opacity: 0; }
    12%  { opacity: .78; }
    70%  { opacity: .40; }
    100% { transform: translate(-320px, -34px) scale(1.9); opacity: 0; }
  }
  .puff {
    transform-box: view-box; transform-origin: 168px 302px;
    animation: puff 2.8s linear infinite;
  }

  /* ---- 速度线 ---- */
  @keyframes streak {
    0%   { transform: translateX(340px); opacity: 0; }
    18%  { opacity: .75; }
    100% { transform: translateX(-460px); opacity: 0; }
  }
  .streak {
    transform-box: view-box; transform-origin: 0 0;
    animation: streak 1.5s linear infinite;
  }

  /* ---- 无障碍：尊重系统「减弱动态效果」 ---- */
  @media (prefers-reduced-motion: reduce) {
    .plane, .prop, .cape, .arm-wave, .tail, .sun, .sun-rays, .track, .puff, .streak, .eye, .band-glow, .prop-blur {
      animation-duration: 12s !important;
    }
    .prop { animation-duration: 3s !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="孙悟空驾驶飞机在云海中飞行的 2D 动画">
    <defs>
      <!-- 天空 -->
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0d3f86" />
        <stop offset="42%"  stop-color="#3f9ae0" />
        <stop offset="78%"  stop-color="#9fd8ff" />
        <stop offset="100%" stop-color="#dff3ff" />

      <!-- 太阳 -->
      <radialGradient id="sunG" cx="50%" cy="45%" r="60%">
        <stop offset="0%"   stop-color="#fffde7" />
        <stop offset="55%"  stop-color="#ffe066" />
        <stop offset="100%" stop-color="#ffc02e" />
      </radialGradient>

      <!-- 机身 -->
      <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ff7b6b" />
        <stop offset="45%"  stop-color="#e63946" />
        <stop offset="100%" stop-color="#a81f2e" />

      <!-- 机翼 -->
      <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#d6303f" />
        <stop offset="100%" stop-color="#8e1a26" />
      </linearGradient>

      <!-- 金色 -->
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#fff2b8" />
        <stop offset="45%"  stop-color="#f5c518" />
        <stop offset="100%" stop-color="#c9920f" />
      </linearGradient>

      <!-- 螺旋桨残影 -->
      <radialGradient id="propG" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0" />
        <stop offset="68%"  stop-color="#ffffff" stop-opacity=".03" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity=".20" />
      </radialGradient>

      <!-- 云 -->
      <linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffffff" />
        <stop offset="100%" stop-color="#cfe6fb" />
      </linearGradient>

      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#04203f" flood-opacity=".35" />
      </filter>

      <!-- 可复用的云朵 -->
      <g id="cloudShape">

        <circle  cx="-30" cy="-6" r="23" />
        <circle  cx="2"   cy="-18" r="30" />
        <circle  cx="36"  cy="-4" r="21" />
      </g>

      <clipPath id="skyClip"><rect width="800" height="600" /></clipPath>
    </defs>

    <g clip-path="url(#skyClip)">

      <!-- ================= 天空 ================= -->
      <rect width="800" height="600" fill="url(#sky)" />

      <!-- ================= 太阳 ================= -->
      <g class="sun">
        <circle class="sun-rays" cx="668" cy="112" r="80" fill="none"
                stroke="#ffe9a8" stroke-width="13" stroke-dasharray="6 27"
                stroke-linecap="round" opacity=".7" />
        <circle cx="668" cy="112" r="46" fill="url(#sunG)" filter="url(#glow)" />
      </g>

      <!-- ================= 远山 ================= -->
      <g opacity=".55">
        <path d="M0 600 V505 Q 44 452 92 486 Q 132 512 172 468 Q 222 414 272 478
                 Q 314 528 356 490 Q 404 442 452 490 Q 502 540 552 486
                 Q 604 432 654 490 Q 704 544 754 496 Q 780 470 800 492 V600 Z"
              fill="#93b9ea" />
      </g>
      <g opacity=".78">
        <path d="M0 600 V556 Q 62 514 124 548 Q 186 582 246 538 Q 306 494 366 544
                 Q 426 594 486 548 Q 546 502 606 550 Q 666 596 726 550
                 Q 764 522 800 546 V600 Z"
              fill="#5f92d8" />
      </g>

      <!-- ================= 远景云层 ================= -->
      <g class="track far" fill="url(#cloudG)" opacity=".55">
        <use href="#cloudShape" transform="translate(70,132) scale(.85)" />
        <use href="#cloudShape" transform="translate(268,86) scale(.62)" />
        <use href="#cloudShape" transform="translate(452,158) scale(.78)" />
        <use href="#cloudShape" transform="translate(642,104) scale(.70)" />
        <use href="#cloudShape" transform="translate(770,168) scale(.55)" />
        <use href="#cloudShape" transform="translate(870,132) scale(.85)" />
        <use href="#cloudShape" transform="translate(1068,86) scale(.62)" />
        <use href="#cloudShape" transform="translate(1252,158) scale(.78)" />
        <use href="#cloudShape" transform="translate(1442,104) scale(.70)" />
        <use href="#cloudShape" transform="translate(1570,168) scale(.55)" />
      </g>

      <!-- ================= 中景云层 ================= -->
      <g class="track mid" fill="url(#cloudG)" opacity=".82">

        <use href="#cloudShape" transform="translate(392,206) scale(.9)" />
        <use href="#cloudShape" transform="translate(612,282) scale(1.05)" />
        <use href="#cloudShape" transform="translate(786,224) scale(.82)" />

        <circle class="puff" cx="168" cy="302" r="15" style="animation-delay:-.92s" />

        <circle class="puff" cx="168" cy="302" r="15" style="animation-delay:-1.84s" />
        <circle class="puff" cx="168" cy="302" r="15" style="animation-delay:-2.30s" />
      </g>

      <!-- ================= 速度线 ================= -->

        <line class="streak" x1="600" y1="248" x2="664" y2="248" stroke-width="2.5" style="animation-delay:-.75s" />
        <line class="streak" x1="640" y1="392" x2="716" y2="392" stroke-width="3" style="animation-delay:-1.15s" />
        <line class="streak" x1="590" y1="452" x2="650" y2="452" stroke-width="2.5" style="animation-delay:-.45s" />
        <line class="streak" x1="628" y1="536" x2="690" y2="536" stroke-width="3" style="animation-delay:-1.35s" />
        <line class="streak" x1="612" y1="96"  x2="672" y2="96"  stroke-width="2.5" style="animation-delay:-.95s" />
      </g>

      <!-- ================= 飞机 ================= -->
      <g transform="translate(18,22)">
        <g class="plane" filter="url(#soft)">

          <!-- = 尾翼 = -->
          <path d="M170 270 C150 246, 137 210, 154 203 C173 196, 200 222, 214 256 Z"
                fill="url(#bodyG)" stroke="#7a1220" stroke-width="4" stroke-linejoin="round" />
          <path d="M150 296 L212 284 L217 301 L154 314 Z"
                fill="url(#bodyG)" stroke="#7a1220" stroke-width="4" stroke-linejoin="round" />
          <path d="M158 292 L206 283 L208 290 L160 299 Z" fill="#ffd166" opacity=".85" />

          <!-- = 机身 = -->
          <path d="M168 268
                   C214 248, 296 238, 380 238
                   C468 238, 542 256, 582 290
                   C594 300, 594 314, 582 324
                   C540 352, 436 360, 344 358
                   C272 356, 206 348, 172 332
                   C156 324, 154 278, 168 268 Z"
                fill="url(#bodyG)" stroke="#7a1220" stroke-width="4" stroke-linejoin="round" />

          <!-- 机身高光 -->
          <path d="M196 268 C240 250, 310 242, 384 242 C450 242, 512 254, 556 276
                   C516 264, 452 256, 384 256 C312 256, 244 264, 200 278 Z"
                fill="#ffffff" opacity=".22" />

          <!-- 机身金色饰条 -->
          <path d="M186 322 C270 344, 380 350, 470 342 C520 337, 556 328, 578 318"
                fill="none" stroke="url(#goldG)" stroke-width="7" stroke-linecap="round" opacity=".95" />

          <!-- 机头金环 -->
          <path d="M560 268 C578 278, 588 290, 592 302 C588 314, 576 326, 558 334"
                fill="none" stroke="url(#goldG)" stroke-width="7" stroke-linecap="round" />

          <!-- 云纹贴纸 -->
          <g opacity=".85" transform="translate(272,280) scale(.5)" fill="#ffe9a8">
            <ellipse cx="0" cy="6" rx="26" ry="9" />
            <circle cx="-12" cy="-2" r="10" />
            <circle cx="2" cy="-9" r="12" />
            <circle cx="15" cy="-1" r="9" />

          <!-- = 座舱内部 = -->

              <path d="M354 141 L358 132" stroke="#8e2b2b" stroke-width="15" stroke-linecap="round" fill="none" />

            <path d="M360 260 C358 232, 380 218, 404 218 C428 218, 450 232, 448 260 Z"

              <!-- 腮红 -->
              <ellipse cx="382" cy="196" rx="8" ry="6" fill="#f2a9a0" opacity=".75" />
