<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LOFI·STUDIO — 终极极简专业级 LOFI 音乐编辑器</title>
<style>
  :root{
    --bg:#15161b; --panel:#1c1d23; --panel2:#23242b; --panel3:#2b2d35;
    --border:#2c2e37; --border2:#3a3d47;
    --text:#e3e5ea; --muted:#9a9da7; --dim:#6b6e79;
    --accent:#dcab5f; --accent2:#eed3a0; --accent-dim:#3a3323;
    --rec:#d86060; --solo:#d8c457;
    --r-sm:6px; --r-md:9px; --r-lg:14px;
    --mono:"SF Mono","JetBrains Mono",Consolas,"Roboto Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:13px; overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  button,input,select,textarea{
    font-family:var(--sans); color:var(--text); background:var(--panel2);
    border:1px solid var(--border2); border-radius:var(--r-sm); font-size:12px;
    transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .05s ease;
  }
  button{cursor:pointer; padding:7px 12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text);}
  button:hover{background:var(--panel3); border-color:var(--dim);}
  button:active{background:var(--bg); transform:translateY(1px);}
  button.accent{background:linear-gradient(180deg,#4a3d24,#39311f); border-color:var(--accent); color:var(--accent2); font-weight:600; box-shadow:0 1px 0 rgba(0,0,0,.25);}
  button.accent:hover{background:linear-gradient(180deg,#574822,#443a23);}
  button.on{background:var(--accent-dim); border-color:var(--accent); color:var(--accent2);}
  button.rec-on{background:#3a2020; border-color:var(--rec); color:#f0a0a0;}
  input[type=number],input[type=text],select,textarea{background:var(--bg); border:1px solid var(--border2); padding:6px 9px; outline:none;}
  input[type=number]{width:60px;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(220,171,95,.13);}
  select{appearance:none; -webkit-appearance:none; padding-right:22px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%; background-size:4px 4px,4px 4px; background-repeat:no-repeat;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:var(--border2); outline:none; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:14px; height:14px;
    background:var(--accent); cursor:pointer; border:0; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.45);}
  input[type=range]::-moz-range-thumb{width:14px; height:14px; background:var(--accent); border:0; border-radius:50%; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.45);}
  label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  .hidden{display:none !important;}

  /* 柔和滚动条 */
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim);}
  *{scrollbar-width:thin; scrollbar-color:var(--border2) transparent;}

  /* ===== Top bar ===== */
  #topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:nowrap;
    padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    box-shadow:0 4px 20px rgba(0,0,0,.18);
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none; flex:0 0 auto; position:relative; z-index:5;
  }
  #topbar::-webkit-scrollbar{display:none;}
  .brand{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.12em; white-space:nowrap; color:var(--text);}
  .brand span{color:var(--accent);}
  .tb-group{display:flex; align-items:center; gap:7px; white-space:nowrap; padding-right:14px; border-right:1px solid var(--border);}
  .tb-group:last-child{border-right:0;}
  .tb-group select{max-width:130px;}
  .sep{width:1px; height:20px; background:var(--border);}

  /* ===== Toolbar ===== */
  #toolbar{
    display:flex; align-items:center; gap:5px; padding:6px 12px;
    background:var(--panel2); border-bottom:1px solid var(--border); flex:0 0 auto; overflow-x:auto;
  }
  #toolbar button{padding:4px 10px; font-size:11px; border-radius:6px;}
  #toolbar .tb-label{color:var(--dim); font-size:10px; letter-spacing:.08em; margin:0 6px 0 2px; text-transform:uppercase;}
  #toolbar .sp{flex:1;}

  /* ===== Piano roll ===== */
  #main{flex:1 1 auto; position:relative; min-height:0; background:#0e0f12; overflow:hidden;}
  #roll{display:block; position:absolute; inset:0; cursor:crosshair; touch-action:none;}

  /* ===== Bottom panels ===== */
  #bottom{flex:0 0 240px; display:flex; border-top:1px solid var(--border); min-height:0; background:var(--panel); box-shadow:0 -4px 20px rgba(0,0,0,.15);}
  .panel-head{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--border); background:var(--panel2); white-space:nowrap;
  }
  .panel-head .title{color:var(--text); font-weight:600;}
  #tracks-panel{flex:1 1 60%; display:flex; flex-direction:column; border-right:1px solid var(--border); min-width:0;}
  #tracks-list{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:4px 0;}
  #fx-panel{flex:0 0 340px; display:flex; flex-direction:column; min-width:280px;}
  #fx-body{flex:1 1 auto; overflow-y:auto; padding:10px 16px;}

  .track-row{
    display:grid; grid-template-columns:18px 1fr 110px 60px 46px 46px 40px;
    gap:8px; align-items:center; padding:7px 12px; margin:3px 8px;
    border-radius:var(--r-sm); cursor:pointer; border:1px solid transparent;
    transition:background .12s ease,border-color .12s ease;
  }
  .track-row:hover{background:var(--panel2); border-color:var(--border);}
  .track-row.active{background:var(--panel3); border-color:var(--border2);}
  .track-row .swatch{width:14px; height:14px; background:var(--accent); border-radius:4px;}
  .track-row input[type=text]{width:100%; background:transparent; border:1px solid transparent; padding:3px 6px; font-size:12px; font-weight:600; border-radius:5px;}
  .track-row input[type=text]:focus{border-color:var(--border2); background:var(--bg);}
  .track-row select{width:100%; padding:4px 6px; font-size:11px;}
  .tbtn{width:30px; height:24px; padding:0; font-size:10px; line-height:1; border-radius:6px;}
  .tbtn.m.on{background:#3a2020; border-color:var(--rec); color:#f0a0a0;}
  .tbtn.s.on{background:#3a3520; border-color:var(--solo); color:#efe0a0;}
  .tbtn.l.on{background:var(--panel3); border-color:var(--dim); color:var(--muted);}
  .tbtn.del{color:#c08080;}
  .track-row .tvol{display:flex; align-items:center; gap:5px;}
  .track-row .tvol input[type=range]{width:100%;}
  .track-row .tcnt{font-size:10px; color:var(--dim); text-align:center; font-family:var(--mono);}

  .fx-row{display:grid; grid-template-columns:88px 1fr 38px; gap:10px; align-items:center; margin:9px 0;}
  .fx-row .fx-name{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .fx-row .fx-val{font-size:11px; color:var(--text); font-family:var(--mono); text-align:right;}

  .add-track{width:100%; padding:8px; background:transparent; border:1px dashed var(--border2); color:var(--muted); margin:0; border-radius:8px;}
  .add-track:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-dim);}

  /* ===== Loading ===== */
  #loading{
    position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:100;
  }
  #loading .l1{font-family:var(--mono); letter-spacing:.2em; font-size:16px;}
  #loading .l1 span{color:var(--accent);}
  .spinner{width:34px; height:34px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading .l2{color:var(--muted); font-size:12px; letter-spacing:.1em;}

  /* ===== Modal ===== */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(3px);}
  #modal .box{background:var(--panel); border:1px solid var(--border2); border-radius:var(--r-lg); width:min(680px,92vw); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.55); overflow:hidden;}
  #modal .m-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border);}
  #modal .m-head .t{font-weight:600; letter-spacing:.08em;}
  #modal .m-body{padding:16px; overflow:auto;}
  #modal textarea{width:100%; height:200px; background:var(--bg); font-family:var(--mono); font-size:11px; resize:vertical; border:1px solid var(--border2); border-radius:8px; padding:10px;}
  #modal .m-actions{display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--border);}
  .kbd{font-family:var(--mono); font-size:11px; background:var(--panel2); border:1px solid var(--border2); padding:1px 6px; border-radius:5px;}

  @media (max-width:900px){
    #bottom{flex-direction:column; flex-basis:auto; height:44vh;}
    #tracks-panel{flex:1 1 auto; border-right:0; border-bottom:1px solid var(--border);}
    #fx-panel{flex:0 0 46%; min-width:0;}
    #topbar button,#topbar select,#topbar input{padding:9px 13px; font-size:13px;}
    #toolbar button{padding:7px 11px;}
  }
</style>
</head>
<body>

<div id="loading">
  <div class="l1">LOFI<span>·</span>STUDIO</div>
  <div class="spinner"></div>
  <div class="l2" id="loading-msg">正在生成内置真实采样音色库…</div>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <div class="brand">LOFI<span>·</span>STUDIO</div>
    <div class="tb-group">
      <button id="btn-play" title="空格">▶ 播放</button>
      <button id="btn-stop">■ 停止</button>
      <button id="btn-record" title="R">● 录音</button>
      <button id="btn-loop" class="on">⟳ 循环</button>
    </div>
    <div class="tb-group">
      <label>BPM <input id="in-bpm" type="number" min="50" max="140" step="1" value="75"></label>
      <label>吸附
        <select id="sel-snap">
          <option value="0.0625">1/64</option>
          <option value="0.125">1/32</option>
          <option value="0.25" selected>1/16</option>
          <option value="0.5">1/8</option>
          <option value="1">1/4</option>
        </select>
      </label>
      <label>循环
        <select id="sel-loopmode">
          <option value="song" selected>整首</option>
          <option value="selection">选区</option>
          <option value="track">单轨</option>
        </select>
      </label>
    </div>
    <div class="tb-group">
      <select id="sel-style">
        <option value="chill">Chill 温柔</option>
        <option value="sad">悲伤深夜</option>
        <option value="summer">夏日清新</option>
        <option value="vintage">复古怀旧</option>
        <option value="chip">8Bit 童趣</option>
        <option value="lazy">慵懒低保真</option>
      </select>
      <button id="btn-generate" class="accent">✦ 一键生成</button>
    </div>
    <div class="tb-group">
      <select id="sel-export">
        <option value="44100-16">44.1kHz / 16bit · 标准</option>
        <option value="48000-24">48kHz / 24bit · 高清</option>
        <option value="96000-24" selected>96kHz / 24bit · 母带级</option>
      </select>
      <button id="btn-export">导出 WAV</button>
    </div>
    <div class="tb-group">
      <button id="btn-save">保存</button>
      <button id="btn-load">导入</button>
      <button id="btn-help">?</button>
    </div>
  </header>

  <div id="toolbar">
    <span class="tb-label">工具</span>
    <button id="tool-select" class="on" title="V">选择</button>
    <button id="tool-draw" title="B">画笔</button>
    <button id="tool-erase" title="E">橡皮</button>
    <span class="sep" style="width:1px;height:16px;background:var(--border);margin:0 6px;"></span>
    <span class="tb-label">编辑</span>
    <button id="btn-copy" title="Ctrl+C">复制</button>
    <button id="btn-paste" title="Ctrl+V">粘贴</button>
    <button id="btn-duplicate" title="Ctrl+D">克隆</button>
    <button id="btn-delete" title="Del">删除</button>
    <button id="btn-undo" title="Ctrl+Z">撤销</button>
    <span class="sp"></span>
    <button id="btn-zoom-out" title="-">−</button>
    <button id="btn-zoom-in" title="+">＋</button>
    <button id="btn-fit">适配</button>
    <button id="btn-loopreset">循环=整首</button>
  </div>

  <main id="main">
    <canvas id="roll"></canvas>
  </main>

  <div id="bottom">
    <div id="tracks-panel">
      <div class="panel-head">
        <span class="title">轨道</span><span id="tracks-count"></span>
        <span style="flex:1"></span>
        <button id="btn-addtrack" style="padding:3px 9px;">＋ 新增轨道</button>
      </div>
      <div id="tracks-list"></div>
    </div>
    <div id="fx-panel">
      <div class="panel-head">
        <span class="title">效果器</span>
        <span style="flex:1"></span>
        <select id="sel-fxpreset" style="font-size:11px;padding:4px 18px 4px 6px;">
          <option value="lofi" selected>标准 LOFI</option>
          <option value="tape">复古磁带</option>
          <option value="dream">梦幻氛围</option>
          <option value="clean">干净明亮</option>
          <option value="dark">暗黑深夜</option>
          <option value="manual">手动精调</option>
        </select>
      </div>
      <div id="fx-body"></div>
    </div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="box">
    <div class="m-head"><span class="t" id="modal-title">标题</span><button id="modal-close">✕</button></div>
    <div class="m-body" id="modal-body"></div>
    <div class="m-actions" id="modal-actions"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   LOFI·STUDIO —— 单文件全能 LOFI 音乐编辑器
   纯本地运行 · 无外部依赖 · Web Audio 实时合成采样级音色
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const isBlackKey = m => { const p=((m%12)+12)%12; return [1,3,6,8,10].includes(p); };
const pitchName = m => NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1);
let _uid=1; const uid = ()=>('t'+(_uid++));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick = (rng,a)=>a[Math.floor(rng()*a.length)];
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true;}catch(e){try{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e2){return false;}}}

/* ---------------- 音色定义 ---------------- */
const INSTRUMENTS = {
  piano:       {name:'温暖钢琴',      color:'#d8a657', base:[48,60,72,84], dur:6, loop:null},
  piano_stac:  {name:'钢琴·跳音',     color:'#e0b877', base:[48,60,72,84], dur:2, loop:null},
  epiano:      {name:'复古电钢琴',    color:'#c98f5a', base:[48,60,72,84], dur:5, loop:null},
  epiano_bell: {name:'电钢·钟铃',     color:'#e0a877', base:[48,60,72,84], dur:4, loop:null},
  bass:        {name:'温柔贝斯',      color:'#8f9ad8', base:[36,48,60],    dur:3, loop:[0.5,2.85]},
  bass_mute:   {name:'贝斯·闷音',     color:'#a0aae0', base:[36,48,60],    dur:2, loop:null},
  bass_slap:   {name:'贝斯·击弦',     color:'#b0a0e0', base:[36,48,60],    dur:2, loop:null},
  pad:         {name:'氛围铺底',      color:'#7fa8c9', base:[48,60,72],    dur:6, loop:[1.1,5.85]},
  sax:         {name:'LOFI萨克斯',    color:'#c97f7f', base:[48,60,72],    dur:5, loop:[0.6,4.85]},
  sax_air:     {name:'萨克斯·气音',   color:'#e09090', base:[48,60,72],    dur:4, loop:[0.6,3.0]},
  guitar:      {name:'尼龙吉他',      color:'#b9a86f', base:[48,60,72],    dur:5, loop:null},
  guitar_pluck:{name:'吉他·勾弦',     color:'#c9b87f', base:[48,60,72],    dur:4, loop:null},
  guitar_mute: {name:'吉他·闷音',     color:'#c9b080', base:[48,60,72],    dur:2, loop:null},
  guitar_harm: {name:'吉他·泛音',     color:'#d0c090', base:[48,60,72],    dur:4, loop:null},
  guitar_slide:{name:'吉他·滑弦',     color:'#c0b890', base:[48,60,72],    dur:4, loop:null},
  chip:        {name:'8Bit芯片',      color:'#7fc97f', base:[48,60,72],    dur:3, loop:[0.25,2.85]},
  chip_slide:  {name:'8Bit·滑音',     color:'#8fd08f', base:[48,60,72],    dur:3, loop:[0.25,2.85]},
  drums:       {name:'复古鼓组',      color:'#c9c2a6', base:[60],           dur:0, loop:null, type:'drums'},
};
const DRUM_MAP = {36:'kick',38:'snare',42:'chat',46:'ohat',41:'tomLo',47:'tomHi',45:'tomHi'};
const DRUM_NAMES = {kick:'Kick',snare:'Snare',chat:'闭合镲',ohat:'开镲',tomLo:'低通鼓',tomHi:'高通鼓'};
const TRACK_COLORS = ['#d8a657','#c98f5a','#8f9ad8','#7fa8c9','#c97f7f','#b9a86f','#7fc97f','#b39fc9','#9fb4c7','#c9b28f'];

/* ---------------- 音色库缓存 ---------------- */
let samples = {};       // instrument -> {baseNote -> AudioBuffer}
let drumBufs = {};      // drumName -> AudioBuffer
let samplesReady = false;

/* ---------------- 合成构建器 ---------------- */
function makeNoiseBuffer(ctx, seconds){
  const rate = ctx.sampleRate, len = Math.max(1,Math.floor(rate*seconds));
  const buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}
function renderSample(buildFn, midi, durSec, rate){
  const len = Math.ceil(durSec*rate);
  const ctx = new OfflineAudioContext(1, len, rate);
  buildFn(ctx, ctx.destination, midiToFreq(midi), durSec, midi);
  return ctx.startRendering();
}
/* 温暖钢琴 —— 加性合成 + 微失谐 + 锤击瞬态 */
function buildPiano(ctx, dest, f, dur){
  const out = ctx.createGain();
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9200; lp.Q.value=0.4;
  out.connect(lp); lp.connect(dest);
  const P=[
    [1.000,1.00,7.0],[2.000,0.52,4.2],[3.000,0.30,2.6],[4.000,0.19,1.8],
    [5.000,0.12,1.2],[6.000,0.08,0.9],[7.000,0.055,0.7],[8.000,0.035,0.5]
  ];
  for(const p of P){
    const o=ctx.createOscillator(); o.type='sine';
    const inh=1+0.0006*p[0]*p[0];
    o.frequency.value=f*p[0]*inh; o.detune.value=(Math.random()*1.4-0.7);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,0);
    g.gain.exponentialRampToValueAtTime(p[1],0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,p[2]);
    o.connect(g); g.connect(out); o.start(0); o.stop(dur+0.05);
  }
  // 锤击噪声

  const ng=ctx.createGain(); ng.gain.value=0.05;
  n.connect(nf); nf.connect(ng); ng.connect(out); n.start(0);
  env.gain.setValueAtTime(0.0001,0);
  env.gain.linearRampToValueAtTime(0.8,0.06);
  env.gain.setValueAtTime(0.72,Math.max(0.1,dur-0.2));
  env.gain.linearRampToValueAtTime(0.0001,dur);
  [o1,o2].forEach(o=>{o.start(0); o.stop(dur+0.05);});
}

  const out = ctx.createGain();
  const body = ctx.createBiquadFilter(); body.type='peaking'; body.frequency.value=190; body.gain.value=2.5; body.Q.value=0.9;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.4;
  out.connect(body); body.connect(lp); lp.connect(dest);
  // 弦振动：基频强、泛音按序衰减、轻微非谐
  const P = [
    [1, 1.00, 3.0],
    [2, 0.40, 1.5],
    [3, 0.19, 0.85],
    [4, 0.10, 0.5],
    [5, 0.05, 0.32],
    [6, 0.024, 0.2],
  ];
  for(const p of P){
    const o = ctx.createOscillator(); o.type='sine';
    o.frequency.value = f*p[0]*(1+0.00015*p[0]*p[0]);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.exponentialRampToValueAtTime(p[1], 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, p[2]);
    o.connect(g); g.connect(out);
    o.start(0); o.stop(dur + 0.05);
  }
  pluckTransient(ctx, out, f, 0.22);
}

function buildClosedHat(ctx,dest){
  const n=ctx.createBufferSource(); n.buffer=makeNoiseBuffer(ctx,0.1);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7600;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.6,0); g.gain.exponentialRampToValueAtTime(0.0001,0.06);
  n.connect(hp); hp.connect(g); g.connect(dest); n.start(0);
}
function buildOpenHat(ctx,dest){
  const n=ctx.createBufferSource(); n.buffer=makeNoiseBuffer(ctx,0.7);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6400;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.55,0); g.gain.exponentialRampToValueAtTime(0.0001,0.55);
  n.connect(hp); hp.connect(g); g.connect(dest); n.start(0);
}
function buildTom(ctx,dest,hi){
  const o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(hi?210:150,0); o.frequency.exponentialRampToValueAtTime(hi?90:70,0.3);
  const g=ctx.createGain(); g.gain.setValueAtTime(0.9,0); g.gain.exponentialRampToValueAtTime(0.0001,0.4);
  o.connect(g); g.connect(dest); o.start(0); o.stop(0.45);
}

async function buildSampleLibrary(){
  const rate = 44100;
  const jobs = [];
  for(const name in INSTRUMENTS){
    const spec = INSTRUMENTS[name];
    if(spec.type==='drums') continue;
    samples[name] = {};
    for(const b of spec.base){
      jobs.push(renderSample(SYNTH_BUILDERS[name], b, spec.dur, rate).then(buf=>{ samples[name][b]=buf; }));
    }
  }
  drumBufs.kick   = await renderDrum(buildKick,0.6,rate);
  drumBufs.snare  = await renderDrum(buildSnare,0.5,rate);
  drumBufs.chat   = await renderDrum(buildClosedHat,0.3,rate);
  drumBufs.ohat   = await renderDrum(buildOpenHat,0.8,rate);
  drumBufs.tomLo  = await renderDrum(ctx=>buildTom(ctx,ctx.destination,false),0.6,rate);
  drumBufs.tomHi  = await renderDrum(ctx=>buildTom(ctx,ctx.destination,true),0.6,rate);
  await Promise.all(jobs);
  samplesReady = true;
}
const SYNTH_BUILDERS = {
  piano:buildPiano, piano_stac:buildPianoStaccato,
  epiano:buildEPiano, epiano_bell:buildEPianoBell,
  bass:buildBass, bass_mute:buildBassMute, bass_slap:buildBassSlap,
  pad:buildPad,
  sax:buildSax, sax_air:buildSaxAir,
  guitar:buildGuitar, guitar_pluck:buildGuitarPluck, guitar_mute:buildGuitarMute, guitar_harm:buildGuitarHarm, guitar_slide:buildGuitarSlide,
  chip:buildChip, chip_slide:buildChipSlide,
};

/* ---------------- 状态 ---------------- */
const state = {
  bpm: 75,
  grid: 0.25,
  loopMode: 'song',
  loopStart: 0,
  loopEnd: 32,
  songLength: 32,
  tracks: [],
  activeTrackId: null,
  fx: {noise:12, saturation:28, filter:8200, reverb:32, compression:30, delay:14, tremolo:6},
  master: 0.9,
  loopEnabled: true,
  tool: 'select',
  selection: new Set(),
  zoom: 44,
  noteH: 15,
  viewTop: 88,
  viewStart: 0,
  copyClip: null,
  pasteBeat: 0,
};

function addTrack(opts){
  const t = Object.assign({
    id: uid(), name:'轨道', instrument:'piano', color: TRACK_COLORS[state.tracks.length % TRACK_COLORS.length],
    volume:0.9, pan:0, mute:false, solo:false, lock:false, notes:[]
  }, opts||{});
  state.tracks.push(t);
  if(!state.activeTrackId) state.activeTrackId = t.id;
  return t;
}
function getTrack(id){ return state.tracks.find(t=>t.id===id); }
function activeTrack(){ return getTrack(state.activeTrackId); }
function computeSongLength(){
  let end = state.loopEnd;
  for(const t of state.tracks) for(const n of t.notes) end = Math.max(end, n.t + n.len);
  state.songLength = Math.max(4, Math.ceil(end/4)*4);
  return state.songLength;
}
function currentLoopRange(){
  if(state.loopMode==='selection') return {s:state.loopStart, e:Math.max(state.loopStart+1,state.loopEnd)};
  if(state.loopMode==='track'){
    const tr = activeTrack();
    if(tr && tr.notes.length){
      let s=Infinity,e=-Infinity;
      for(const n of tr.notes){ s=Math.min(s,n.t); e=Math.max(e,n.t+n.len); }
      return {s:Math.floor(s/1)*1, e:Math.max(s+4,Math.ceil(e/4)*4)};
    }
  }
  computeSongLength();
  return {s:0, e:state.songLength};
}

/* ---------------- 音频引擎 ---------------- */
const Engine = {
  ctx:null, mixer:null, trackNodes:{}, playing:false, recording:false,
  currentBeat:0, nextNoteTime:0, lookahead:0.14, timer:null,
  timeline:[], schedIndex:0, activeSources:[], stepBeats:0.25,
  recKeyNotes:{}, pressedKeys:new Set(), previewSources:[],

  ensureCtx(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.mixer = buildMixer(this.ctx, this.ctx.destination);
    this.rebuildTrackNodes();
    this.applyFx();
  },
  rebuildTrackNodes(){
    if(!this.ctx) return;
    for(const id in this.trackNodes){
      const n=this.trackNodes[id];
      try{ n.gain.disconnect(); n.pan.disconnect(); n.out.disconnect(); }catch(e){}
    }
    this.trackNodes = {};
    for(const t of state.tracks){
      const gain=this.ctx.createGain(); gain.gain.value=t.volume;
      const pan=this.ctx.createStereoPanner(); pan.pan.value=t.pan;
      const out=this.ctx.createGain(); out.gain.value=1;
      gain.connect(pan); pan.connect(out);
      out.connect(this.mixer.busDry);
      out.connect(this.mixer.reverbIn);
      out.connect(this.mixer.delayIn);
      this.trackNodes[t.id] = {gain,pan,out};
    }
  },
  setTrackVolume(id,v){ const n=this.trackNodes[id]; if(n) n.gain.gain.value=v; },
  setTrackPan(id,p){ const n=this.trackNodes[id]; if(n) n.pan.pan.value=p; },

  play(){
    this.ensureCtx();
    if(this.ctx.state==='suspended') this.ctx.resume();
    if(this.playing) return;
    this.playing = true;
    const r = currentLoopRange();
    this.currentBeat = r.s;
    this.buildTimeline();
    this.nextNoteTime = this.ctx.currentTime + 0.06;
    this.setTapeGate(true);
    this.timer = setInterval(()=>this.schedule(), 25);
    updatePlayButton();
  },
  stop(){
    this.playing = false; this.recording = false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    this.setTapeGate(false);
    for(const a of this.activeSources){ try{ a.gain.gain.cancelScheduledValues(this.ctx.currentTime); a.gain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.04); a.src.stop(this.ctx.currentTime+0.06); }catch(e){} }
    this.activeSources = [];
    for(const p of this.previewSources){ try{ p.gain.gain.cancelScheduledValues(this.ctx.currentTime); p.gain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.02); p.src.stop(this.ctx.currentTime+0.03); }catch(e){} }
    this.previewSources = [];
    this.pressedKeys.clear(); this.recKeyNotes = {};
    const r = currentLoopRange(); this.currentBeat = r.s;
    updatePlayButton(); updateRecordButton();
  },
  setTapeGate(on){
    if(!this.mixer) return;
    const t = this.mixer.tape.gain, now=this.ctx.currentTime;
    t.cancelScheduledValues(now);
    t.setTargetAtTime(on ? state.fx.noise/100*0.03 : 0, now, 0.05);
  },
  buildTimeline(){
    const soloAny = state.tracks.some(t=>t.solo);
    const ev=[];
    for(const t of state.tracks){
      if(t.mute) continue;
      if(soloAny && !t.solo) continue;
      for(const n of t.notes) ev.push({beat:n.t, trackId:t.id, note:n});
    }
    ev.sort((a,b)=>a.beat-b.beat);
    this.timeline = ev;
    this.schedIndex = this.lowerBound(this.timeline, this.currentBeat);
  },
  lowerBound(arr, val){
    let lo=0, hi=arr.length;
    while(lo<hi){ const mid=(lo+hi)>>1; if(arr[mid].beat < val) lo=mid+1; else hi=mid; }
    return lo;
  },
  schedule(){
    const ctx=this.ctx, beatDur=60/state.bpm;
    const r = currentLoopRange();
    while(this.nextNoteTime < ctx.currentTime + this.lookahead){
      const tickEnd = this.currentBeat + this.stepBeats;
      while(this.schedIndex < this.timeline.length && this.timeline[this.schedIndex].beat < tickEnd){
        const ev=this.timeline[this.schedIndex];
        const offset = ev.beat - this.currentBeat;
        if(offset >= -1e-9) this.playNote(ev.trackId, ev.note, this.nextNoteTime + offset*beatDur, beatDur);
        this.schedIndex++;
      }
      this.currentBeat += this.stepBeats;
      this.nextNoteTime += this.stepBeats*beatDur;
      if(this.currentBeat >= r.e){
        if(!state.loopEnabled){ this.stop(); return; }
        this.currentBeat = r.s + ((this.currentBeat - r.e) % (r.e - r.s));
        this.schedIndex = this.lowerBound(this.timeline, this.currentBeat);
      }
    }
    this.pruneActive();
  },
  playNote(trackId, note, when, beatDur){
    const track = getTrack(trackId); if(!track) return;
    const tn = this.trackNodes[trackId]; if(!tn) return;
    let srcBuf, rate, loop=null;
    if(track.instrument==='drums'){
      const dn = DRUM_MAP[note.p] || 'kick';
      srcBuf = drumBufs[dn]; rate=1;
    } else {
      const spec = INSTRUMENTS[track.instrument] || INSTRUMENTS.piano;
      const bases = spec.base; let b=bases[0];
      for(const x of bases){ if(note.p>=x) b=x; else break; }
      b=Math.min(b, bases[bases.length-1]);
      srcBuf = samples[track.instrument][b];
      rate = Math.pow(2,(note.p-b)/12);
      loop = spec.loop;
    }
    if(!srcBuf) return;
    const src=this.ctx.createBufferSource();
    src.buffer=srcBuf; src.playbackRate.value=rate;
    if(loop){ src.loop=true; src.loopStart=loop[0]; src.loopEnd=loop[1]; }
    const g=this.ctx.createGain();
    const vel = note.v!=null?note.v:0.85;
    const level = Math.pow(vel,1.35)*0.95;
    const durSec = note.len*beatDur;
    g.gain.setValueAtTime(0.0001,when);
    g.gain.linearRampToValueAtTime(level, when+0.004);
    const stopAt = when + durSec;
    g.gain.setValueAtTime(level, Math.max(when+0.006, stopAt-0.05));
    g.gain.linearRampToValueAtTime(0.0001, stopAt+0.03);
    src.connect(g); g.connect(tn.gain);
    src.start(when); src.stop(stopAt+0.06);
    this.activeSources.push({src,gain:g, until:stopAt+0.1});
  },
  pruneActive(){
    const now=this.ctx.currentTime;
    this.activeSources = this.activeSources.filter(a=>a.until>now);
  },
  /* 键盘/预览发声 */
  preview(pitch, vel){
    this.ensureCtx();
    if(this.ctx.state==='suspended') this.ctx.resume();
    const tr = activeTrack();
    const instrument = tr && tr.instrument!=='drums' ? tr.instrument : 'piano';
    const spec = INSTRUMENTS[instrument];
    const bases=spec.base; let b=bases[0];
    for(const x of bases){ if(pitch>=x) b=x; else break; }
    b=Math.min(b,bases[bases.length-1]);
    const srcBuf=samples[instrument][b]; if(!srcBuf) return;
    const src=this.ctx.createBufferSource(); src.buffer=srcBuf;
    src.playbackRate.value=Math.pow(2,(pitch-b)/12);
    if(spec.loop){ src.loop=true; src.loopStart=spec.loop[0]; src.loopEnd=spec.loop[1]; }
    const tn = tr && this.trackNodes[tr.id] ? this.trackNodes[tr.id] : null;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(Math.pow(vel||0.9,1.35)*0.95, this.ctx.currentTime+0.004);
    src.connect(g);
    if(tn) g.connect(tn.gain); else g.connect(this.mixer.busDry);
    src.start();
    this.previewSources.push({src,gain:g, pitch});
  },
  releasePreview(pitch){
    // 仅释放指定音高（或全部）的预览音
    const keep=[];
    for(const p of this.previewSources){
      if(pitch!=null && p.pitch!==pitch){ keep.push(p); continue; }
      try{
        p.gain.gain.cancelScheduledValues(this.ctx.currentTime);
        p.gain.gain.setTargetAtTime(0.0001,this.ctx.currentTime,0.04);
        p.src.stop(this.ctx.currentTime+0.25);
      }catch(e){}
    }
    this.previewSources=keep;
  },
};

function makeSaturationCurve(k){
  if(k<0.02) return null;
  const n=1024, curve=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=i/(n-1)*2-1;
    curve[i]=Math.tanh(k*x)/Math.tanh(k);
  }
  return curve;
}
function makeIR(ctx, seconds, decay){
  const rate=ctx.sampleRate, len=Math.floor(rate*seconds);
  const ir=ctx.createBuffer(2,len,rate);
  const preDelay = Math.floor(rate*0.015); // 15ms 预延迟，分离直达声
  for(let c=0;c<2;c++){
    const d=ir.getChannelData(c);
    let lp=0;
    for(let i=0;i<len;i++){
      if(i<preDelay){ d[i]=0; continue; }
      const white=Math.random()*2-1;
      // 一阶低通去刺：让高频随反射快速衰减，混响更温润、不金属
      lp += 0.3*(white-lp);
      const t=(i-preDelay)/(len-preDelay);
      d[i]=lp*Math.pow(1-t,decay);
    }
  }
  return ir;
}
function makeNoiseLoop(ctx){
  const rate=ctx.sampleRate, len=rate*2;
  const buf=ctx.createBuffer(2,len,rate);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=0.98*last+0.02*w; d[i]=last*2.2; }
  }
  return buf;
}
function buildMixer(ctx, dest){
  const m={};
  m.masterIn = ctx.createGain(); m.masterIn.gain.value=1;
  m.busDry = ctx.createGain(); m.busDry.gain.value=1;
  m.busDry.connect(m.masterIn);
  // 混响
  m.reverbIn = ctx.createGain(); m.reverbIn.gain.value=0;
  m.convolver = ctx.createConvolver(); m.convolver.buffer = makeIR(ctx,2.8,3.2);
  m.reverbReturn = ctx.createGain(); m.reverbReturn.gain.value=1;
  m.reverbIn.connect(m.convolver); m.convolver.connect(m.reverbReturn); m.reverbReturn.connect(m.masterIn);
  // 延迟
  m.delayIn = ctx.createGain(); m.delayIn.gain.value=0;
  m.delay = ctx.createDelay(3); m.delay.delayTime.value=0.45;
  m.delayFbLp = ctx.createBiquadFilter(); m.delayFbLp.type='lowpass'; m.delayFbLp.frequency.value=2600;
  m.delayFb = ctx.createGain(); m.delayFb.gain.value=0.4;
  m.delayWet = ctx.createGain(); m.delayWet.gain.value=1;
  m.delayIn.connect(m.delay);
  m.delay.connect(m.delayFbLp); m.delayFbLp.connect(m.delayFb); m.delayFb.connect(m.delay);
  m.delay.connect(m.delayWet); m.delayWet.connect(m.masterIn);
  // 主链：低通 → 饱和 → 颤音 → 压缩 → 主音量
  m.filter = ctx.createBiquadFilter(); m.filter.type='lowpass'; m.filter.frequency.value=16000; m.filter.Q.value=0.6;
  m.sat = ctx.createWaveShaper(); m.sat.curve=null; m.sat.oversample='2x';
  m.trem = ctx.createGain(); m.trem.gain.value=1;
  m.lfo = ctx.createOscillator(); m.lfo.frequency.value=4.5;
  m.lfoGain = ctx.createGain(); m.lfoGain.gain.value=0;
  m.lfo.connect(m.lfoGain); m.lfoGain.connect(m.trem.gain); m.lfo.start(0);
  m.comp = ctx.createDynamicsCompressor();
  m.comp.threshold.value=-18; m.comp.knee.value=20; m.comp.ratio.value=4; m.comp.attack.value=0.003; m.comp.release.value=0.25;
  m.master = ctx.createGain(); m.master.gain.value=state.master;
  // 磁带噪声
  m.tape = ctx.createGain(); m.tape.gain.value=0;
  m.tapeSrc = ctx.createBufferSource(); m.tapeSrc.buffer=makeNoiseLoop(ctx); m.tapeSrc.loop=true; m.tapeSrc.connect(m.tape); m.tapeSrc.start(0);
  m.tape.connect(m.master);
  m.masterIn.connect(m.filter); m.filter.connect(m.sat); m.sat.connect(m.trem);
  m.trem.connect(m.comp); m.comp.connect(m.master); m.master.connect(dest);
  return m;
}
function applyFx(){
  const m=Engine.mixer; if(!m) return;
  const fx=state.fx, now=Engine.ctx.currentTime;
  m.filter.frequency.setTargetAtTime(fx.filter, now, 0.03);
  m.sat.curve = makeSaturationCurve(fx.saturation/100*8);
  m.reverbIn.gain.setTargetAtTime(fx.reverb/100*0.85, now, 0.03);
  m.delayIn.gain.setTargetAtTime(fx.delay/100*0.7, now, 0.03);
  m.delay.delayTime.setTargetAtTime(60/state.bpm*0.75, now, 0.03);
  m.comp.threshold.setTargetAtTime(-6 - (fx.compression/100)*24, now, 0.03);
  m.comp.ratio.setTargetAtTime(1 + (fx.compression/100)*9, now, 0.03);
  const depth=fx.tremolo/100*0.5;
  m.trem.gain.setTargetAtTime(1-depth, now, 0.03);
  m.lfoGain.gain.setTargetAtTime(depth, now, 0.03);
  if(Engine.playing) m.tape.gain.setTargetAtTime(fx.noise/100*0.03, now, 0.03);
}

/* ---------------- 画布 / 钢琴卷帘 ---------------- */
const canvas=document.getElementById('roll');
const ctx2d=canvas.getContext('2d');
const GUTTER=62, RULER=26;
let dragState=null;
let hoverPitch=null;

function canvasSize(){
  const main=document.getElementById('main');
  const r=main.getBoundingClientRect();
  return {w:r.width,h:r.height};
}
function setupCanvas(){
  const {w,h}=canvasSize(), dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}
function visiblePitchRange(){
  const {h}=canvasSize();
  const rows=Math.floor((h-RULER)/state.noteH)+1;
  const top=state.viewTop, bottom=top-rows;
  return {top,bottom,rows};
}
function snapBeat(b){ return Math.round(b/state.grid)*state.grid; }
function screenToBeat(x){ return state.viewStart + (x-GUTTER)/state.zoom; }
function screenToPitch(y){ return Math.round(state.viewTop - (y-RULER)/state.noteH); }
function noteRect(n){
  const x=GUTTER+(n.t-state.viewStart)*state.zoom;
  const y=RULER+(state.viewTop-n.p)*state.noteH;
  return {x,y,w:n.len*state.zoom,h:state.noteH};
}
function hitTestNotes(x,y,onlyActive){
  const tr=activeTrack(); if(!tr) return null;
  const b=screenToBeat(x), p=screenToPitch(y);
  for(let i=tr.notes.length-1;i>=0;i--){
    const n=tr.notes[i], r=noteRect(n);
    if(x>=r.x-1 && x<=r.x+r.w+1 && y>=r.y-1 && y<=r.y+r.h+1 && b>=n.t && b<=n.t+n.len && p===n.p) return n;
  }
  return null;
}

function draw(){
  const {w,h}=canvasSize();
  ctx2d.clearRect(0,0,w,h);
  const vr=visiblePitchRange();
  const beatDur=60/state.bpm;
  // 背景
  ctx2d.fillStyle='#0d0e10'; ctx2d.fillRect(GUTTER,0,w-GUTTER,h);
  // 网格
  ctx2d.fillStyle='#14161a'; ctx2d.fillRect(0,0,w,h);
  // 网格竖线
  const endBeat = state.viewStart + (w-GUTTER)/state.zoom + 4;
  const startBar = Math.floor(state.viewStart/4)*4;
  ctx2d.lineWidth=1;
  for(let bar=startBar; bar<=endBeat; bar+=4){
    const x=GUTTER+(bar-state.viewStart)*state.zoom;
    ctx2d.strokeStyle='#26292f'; ctx2d.beginPath(); ctx2d.moveTo(x,RULER); ctx2d.lineTo(x,h); ctx2d.stroke();
  }
  for(let b=Math.floor(state.viewStart); b<=endBeat; b+=1){
    if(b%4===0) continue;
    const x=GUTTER+(b-state.viewStart)*state.zoom;
    ctx2d.strokeStyle='#1a1c20'; ctx2d.beginPath(); ctx2d.moveTo(x,RULER); ctx2d.lineTo(x,h); ctx2d.stroke();
  }
  // 网格横线（半音 + 八度 C 高亮）
  for(let p=vr.top; p>=vr.bottom; p--){
    const y=RULER+(state.viewTop-p)*state.noteH;
    const isC = ((p%12)+12)%12===0;
    ctx2d.strokeStyle = isC ? '#2a2d33' : '#17191d';
    ctx2d.beginPath(); ctx2d.moveTo(GUTTER,y); ctx2d.lineTo(w,y); ctx2d.stroke();
  }
  // 循环选区阴影
  const r=currentLoopRange();
  const lsx=GUTTER+(r.s-state.viewStart)*state.zoom;
  const lex=GUTTER+(r.e-state.viewStart)*state.zoom;
  ctx2d.fillStyle='rgba(220,171,95,0.06)';
  ctx2d.fillRect(clamp(lsx,GUTTER,w),RULER,clamp(lex-lsx,0,w-GUTTER),h-RULER);
  ctx2d.fillStyle='rgba(220,171,95,0.18)';
  ctx2d.fillRect(clamp(lsx,GUTTER,w),RULER,1,h-RULER);
  ctx2d.fillRect(clamp(lex,GUTTER,w)-1,RULER,1,h-RULER);

  // 音符（全部轨道，当前轨道高亮）
  for(const t of state.tracks){
    const isActive = t.id===state.activeTrackId;
    ctx2d.globalAlpha = isActive ? 1 : 0.32;
    for(const n of t.notes){
      const rct=noteRect(n);
      if(rct.x>w || rct.x+rct.w<GUTTER) continue;
      if(rct.y<RULER || rct.y>h) continue;
      const selected = isActive && state.selection.has(n);
      ctx2d.fillStyle = t.color;
      ctx2d.globalAlpha = isActive ? (selected?0.95:0.82) : 0.28;
      rr(ctx2d, rct.x+0.5, rct.y+1.5, rct.w-1, rct.h-3, 4);
      ctx2d.fill();
      ctx2d.globalAlpha = isActive ? 1 : 0.3;
      ctx2d.strokeStyle = selected ? '#f0e6d0' : 'rgba(0,0,0,0.35)';
      ctx2d.lineWidth = selected?1.4:1;
      ctx2d.stroke();
    }
  }
  ctx2d.globalAlpha=1;

  // 播放头
  if(Engine.playing){
    const px=GUTTER+(Engine.currentBeat-state.viewStart)*state.zoom;
    if(px>=GUTTER && px<=w){
      ctx2d.strokeStyle='#f0e6d0'; ctx2d.lineWidth=1; ctx2d.beginPath();
      ctx2d.moveTo(px,RULER); ctx2d.lineTo(px,h); ctx2d.stroke();
    }
  }
  // 框选矩形
  if(dragState && dragState.mode==='box' && dragState.x2!=null){
    const x1=Math.min(dragState.x0,dragState.x2), x2=Math.max(dragState.x0,dragState.x2);
    const y1=Math.min(dragState.y0,dragState.y2), y2=Math.max(dragState.y0,dragState.y2);
    ctx2d.fillStyle='rgba(216,166,87,0.12)'; ctx2d.fillRect(x1,y1,x2-x1,y2-y1);
    ctx2d.strokeStyle='rgba(216,166,87,0.5)'; ctx2d.strokeRect(x1,y1,x2-x1,y2-y1);
  }

  drawGutter(vr);
  drawRuler();
}
function drawGutter(vr){
  const {h}=canvasSize();
  ctx2d.fillStyle='#16181c'; ctx2d.fillRect(0,0,GUTTER,h);
  for(let p=vr.top; p>=vr.bottom; p--){
    const y=RULER+(state.viewTop-p)*state.noteH;
    const isC=((p%12)+12)%12===0;
    if(isBlackKey(p)){
      ctx2d.fillStyle='#0f1013'; ctx2d.fillRect(0,y,GUTTER*0.62,state.noteH);
      ctx2d.fillStyle='#26282e'; ctx2d.fillRect(0,y,GUTTER*0.62,1);
    } else {
      ctx2d.fillStyle='#c9cbd1'; ctx2d.fillRect(0,y,GUTTER-1,state.noteH);
      ctx2d.fillStyle='#2a2c31'; ctx2d.fillRect(0,y+state.noteH-1,GUTTER-1,1);
      ctx2d.fillStyle='#3a3c42'; ctx2d.font='9px '+MONO;
      ctx2d.textBaseline='middle';
      if(isC){ ctx2d.fillStyle='#5a5d64'; ctx2d.fillText(pitchName(p),4,y+state.noteH/2); }
    }
  }
  ctx2d.strokeStyle='#2c2f36'; ctx2d.beginPath(); ctx2d.moveTo(GUTTER-0.5,0); ctx2d.lineTo(GUTTER-0.5,h); ctx2d.stroke();
}
function drawRuler(){
  const {w}=canvasSize();
  ctx2d.fillStyle='#16181c'; ctx2d.fillRect(GUTTER,0,w-GUTTER,RULER);
  const endBeat=state.viewStart+(w-GUTTER)/state.zoom+4;
  ctx2d.font='10px '+MONO; ctx2d.textBaseline='middle';
  for(let bar=Math.floor(state.viewStart/4)*4; bar<=endBeat; bar+=4){
    const x=GUTTER+(bar-state.viewStart)*state.zoom;
    ctx2d.strokeStyle='#3a3e46'; ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,RULER); ctx2d.stroke();
    ctx2d.fillStyle='#8b8e96'; ctx2d.fillText(String(bar/4+1), x+4, RULER/2);
  }
  ctx2d.strokeStyle='#2c2f36'; ctx2d.beginPath(); ctx2d.moveTo(0,RULER-0.5); ctx2d.lineTo(w,RULER-0.5); ctx2d.stroke();
}
const MONO = '"SF Mono",Consolas,"Roboto Mono",Menlo,monospace';

/* 圆角矩形路径（音符等） */
function rr(ctx,x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  if(r<=0){ ctx.beginPath(); ctx.rect(x,y,w,h); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

let _lastW=0, _lastH=0;
function frame(){
  const {w,h}=canvasSize();
  if(w!==_lastW || h!==_lastH){ setupCanvas(); _lastW=w; _lastH=h; }
  draw();
  requestAnimationFrame(frame);
}

/* ---------------- 交互 ---------------- */
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function noteUnder(x,y){ return hitTestNotes(x,y,true); }
function isResizeZone(x,y){
  const n=noteUnder(x,y); if(!n) return false;
  const rct=noteRect(n);
  return x > rct.x+rct.w-7;
}
function applyDrag(e){
  if(!dragState) return;
  const {x,y}=pointerPos(e);
  if(dragState.mode==='move'){
    const db=snapBeat(screenToBeat(x))-dragState.startBeat;
    const dp=Math.round(screenToPitch(y))-dragState.startPitch;
    if(db!==0 || dp!==0){
      if(!dragState.undoPushed){ pushUndo(); dragState.undoPushed=true; }
      for(const o of dragState.orig){
        o.note.t = Math.max(0, snapBeat(o.t+db));
        o.note.p = clamp(o.p+dp, 0, 127);
      }
    }
  } else if(dragState.mode==='resize'){
    const db=snapBeat(screenToBeat(x))-dragState.startBeat;
    if(db!==0){
      if(!dragState.undoPushed){ pushUndo(); dragState.undoPushed=true; }
      for(const o of dragState.orig){
        o.note.len = Math.max(state.grid, snapBeat(o.len+db));
      }
    }
  } else if(dragState.mode==='draw'){
    const b=snapBeat(screenToBeat(x));
    const len=Math.max(state.grid, snapBeat(b-dragState.startBeat+state.grid));
    dragState.note.len=len;
  } else if(dragState.mode==='box' || dragState.mode==='loop' || dragState.mode==='erase'){
    dragState.x2=x; dragState.y2=y;
    if(dragState.mode==='erase'){
      const n=noteUnder(x,y); if(n) deleteNote(n,true);
    }
  }
}
function clearSelection(){ state.selection.clear(); }

canvas.addEventListener('pointerdown', e=>{
  const {x,y}=pointerPos(e);
  canvas.setPointerCapture(e.pointerId);
  Engine.ensureCtx();
  const tr=activeTrack();
  // 点击琴键预览
  if(x<GUTTER && y>RULER){
    const p=clamp(screenToPitch(y),0,127);
    Engine.preview(p);
    dragState={mode:'preview', pitch:p};
    return;
  }
  if(!tr) return;
  if(tr.lock){ return; }
  if(y<RULER){
    // 标尺拖动设定循环选区
    const b=Math.max(0,snapBeat(screenToBeat(x)));
    state.loopStart=b; state.loopEnd=b+state.grid;
    dragState={mode:'loop', x0:x, y0:y, x2:x, y2:y};
    return;
  }
  if(state.tool==='draw'){
    pushUndo();
    const b=snapBeat(screenToBeat(x));
    const p=clamp(screenToPitch(y),0,127);
    const n={t:b,len:state.grid,p:p,v:0.85};
    tr.notes.push(n);
    state.selection=new Set([n]);
    dragState={mode:'draw', startBeat:b, startPitch:p, note:n};
    Engine.preview(p,0.6);
    return;
  }
  if(state.tool==='erase'){
    const n=noteUnder(x,y); if(n){ pushUndo(); deleteNote(n,true); }
    dragState={mode:'erase',x0:x,y0:y,x2:x,y2:y};
    return;
  }
  // select 工具
  const hit=noteUnder(x,y);
  if(hit){
    if(state.selection.has(hit)){
      if(isResizeZone(x,y)){
        dragState={mode:'resize',undoPushed:false,startBeat:snapBeat(screenToBeat(x)),orig:[...state.selection].map(n=>({note:n,t:n.t,len:n.len}))};
        if(!dragState.orig.length) dragState.orig=[{note:hit,t:hit.t,len:hit.len}];
      } else {
        dragState={mode:'move',undoPushed:false,startBeat:snapBeat(screenToBeat(x)),startPitch:hit.p,orig:[...state.selection].map(n=>({note:n,t:n.t,p:n.p}))};
        if(!dragState.orig.length) dragState.orig=[{note:hit,t:hit.t,p:hit.p}];
      }
    } else {
      if(!e.shiftKey) clearSelection();
      state.selection.add(hit);
      dragState={mode:'move',undoPushed:false,startBeat:snapBeat(screenToBeat(x)),startPitch:hit.p,orig:[...state.selection].map(n=>({note:n,t:n.t,p:n.p}))};
    }
    return;
  }
  // 空白：框选
  if(!e.shiftKey) clearSelection();
  dragState={mode:'box', x0:x, y0:y, x2:null, y2:null, add:e.shiftKey};
});

canvas.addEventListener('pointermove', e=>{
  const {x,y}=pointerPos(e);
  if(!dragState){ updateCursor(x,y); return; }
  if(dragState.mode==='preview'){
    const p=clamp(screenToPitch(y),0,127);
    if(p!==dragState.pitch){ Engine.releasePreview(dragState.pitch); Engine.preview(p); dragState.pitch=p; }
    return;
  }
  applyDrag(e);
});
function updateCursor(x,y){
  if(x<GUTTER){ canvas.style.cursor='pointer'; return; }
  if(state.tool==='draw'){ canvas.style.cursor='crosshair'; return; }
  if(state.tool==='erase'){ canvas.style.cursor='cell'; return; }
  if(noteUnder(x,y)){ canvas.style.cursor = isResizeZone(x,y)?'ew-resize':'move'; }
  else canvas.style.cursor='default';
}
canvas.addEventListener('pointerup', e=>{
  if(!dragState){ return; }
  if(dragState.mode==='preview'){ Engine.releasePreview(dragState.pitch); }
  if(dragState.mode==='box' && dragState.x2!=null){
    const x1=Math.min(dragState.x0,dragState.x2), x2=Math.max(dragState.x0,dragState.x2);
    const y1=Math.min(dragState.y0,dragState.y2), y2=Math.max(dragState.y0,dragState.y2);
    if(x2-x1>3 || y2-y1>3){
      if(!dragState.add) clearSelection();
      const b1=screenToBeat(x1), b2=screenToBeat(x2);
      const p1=Math.ceil(screenToPitch(y2)), p2=Math.floor(screenToPitch(y1));
      const tr=activeTrack();
      for(const n of tr.notes){
        if(n.t<b2 && n.t+n.len>b1 && n.p>=p1 && n.p<=p2) state.selection.add(n);
      }
    } else if(!dragState.add){ clearSelection(); }
  }
  if(dragState.mode==='loop'){
    let s=dragState.x0, e=dragState.x2!=null?dragState.x2:s;
    const b1=Math.max(0,snapBeat(screenToBeat(s))), b2=Math.max(b1+state.grid,snapBeat(screenToBeat(e)));
    state.loopStart=b1; state.loopEnd=b2;
  }
  if(dragState.mode==='move' || dragState.mode==='resize' || dragState.mode==='draw'){
    // 编辑后同步播放时间线
  }
  dragState=null;
  if(Engine.playing) Engine.buildTimeline();
  refreshTracksPanel();
});
canvas.addEventListener('pointercancel', ()=>{ dragState=null; });
canvas.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const {x,y}=pointerPos(e);
  const n=noteUnder(x,y);
  if(n){ pushUndo(); deleteNote(n,true); }
});

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    const f=e.deltaY<0?1.1:0.9;
    state.zoom=clamp(state.zoom*f, 12, 200);
  } else if(e.shiftKey){
    state.viewStart=clamp(state.viewStart + e.deltaY/state.zoom*3, 0, 400);
  } else {
    state.viewTop=clamp(state.viewTop + (e.deltaY>0?-1:1)*2, 40, 110);
  }
}, {passive:false});

/* 触屏双指缩放 */
let pinchDist=null;
canvas.addEventListener('pointerdown', e=>{
  // 已在主 handler 处理；此处留空避免重复
});
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && pinchDist){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    state.zoom=clamp(state.zoom*d/pinchDist,12,200);
    pinchDist=d;
  }
},{passive:true});
canvas.addEventListener('touchend', ()=>{ pinchDist=null; });

function deleteNote(n, withUndo){
  const tr=activeTrack(); if(!tr) return;
  const i=tr.notes.indexOf(n);
  if(i>=0) tr.notes.splice(i,1);
  state.selection.delete(n);
}

/* ---------------- 撤销 ---------------- */
let undoStack=[]; let undoIndex=-1;
function pushUndo(){
  const snap=JSON.stringify(state.tracks.map(t=>({id:t.id,notes:t.notes,instrument:t.instrument,name:t.name,volume:t.volume,pan:t.pan,mute:t.mute,solo:t.solo,lock:t.lock,color:t.color})));
  undoStack=undoStack.slice(0,undoIndex+1);
  undoStack.push(snap);
  if(undoStack.length>60) undoStack.shift();
  undoIndex=undoStack.length-1;
}
function doUndo(){
  if(undoIndex<0) return;
  const data=JSON.parse(undoStack[undoIndex]);
  undoIndex--;
  for(const t of state.tracks){
    const d=data.find(x=>x.id===t.id);
    if(d){ Object.assign(t,{notes:d.notes,instrument:d.instrument,name:d.name,volume:d.volume,pan:d.pan,mute:d.mute,solo:d.solo,lock:d.lock,color:d.color}); }
  }
  clearSelection();
  if(Engine.playing) Engine.buildTimeline();
  refreshAll();
}

/* ---------------- 键盘输入 & 录音 ---------------- */
const KEYMAP = {
  'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59,
  'a':60,'s':62,'d':64,'f':65,'g':67,'h':69,'j':71,'k':72,'l':74,';':76,
};
const keyHeld={};
window.addEventListener('keydown', e=>{
  if(e.repeat) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(tag==='button') e.target.blur();
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); togglePlay(); return; }
  if(k==='r'){ toggleRecord(); return; }
  if(k==='b'){ setTool('draw'); return; }
  if(k==='e'){ setTool('erase'); return; }
  if(k==='v'){ setTool('select'); return; }
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); doUndo(); return; }
  if((e.ctrlKey||e.metaKey) && k==='c'){ copySelection(); return; }
  if((e.ctrlKey||e.metaKey) && k==='v'){ pasteSelection(); return; }
  if((e.ctrlKey||e.metaKey) && k==='d'){ e.preventDefault(); duplicateSelection(); return; }
  if((e.ctrlKey||e.metaKey) && k==='a'){ e.preventDefault(); selectAll(); return; }
  if(k==='delete'||k==='backspace'){ deleteSelection(); return; }
  if(k==='escape'){ clearSelection(); return; }
  const pitch=KEYMAP[k];
  if(pitch!=null && !keyHeld[k]){
    keyHeld[k]=true;
    Engine.ensureCtx();
    Engine.preview(pitch,0.9);
    if(Engine.recording && Engine.playing){
      const tr=activeTrack(); if(tr && !tr.lock){
        const b=snapBeat(Engine.currentBeat);
        const n={t:b,len:state.grid,p:pitch,v:0.85};
        tr.notes.push(n);
        Engine.recKeyNotes[k]={note:n,start:b};
        if(Engine.playing) Engine.buildTimeline();
      }
    }
  }
});
window.addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  if(keyHeld[k]){
    keyHeld[k]=false;
    if(Engine.recKeyNotes[k]){
      const rec=Engine.recKeyNotes[k];
      rec.note.len=Math.max(state.grid, snapBeat(Engine.currentBeat)-rec.start);
      delete Engine.recKeyNotes[k];
      if(Engine.playing) Engine.buildTimeline();
    } else {
      Engine.releasePreview(KEYMAP[k]);
    }
  }
});

function togglePlay(){ if(Engine.playing) Engine.stop(); else Engine.play(); }
function toggleRecord(){
  if(!Engine.playing){ Engine.play(); }
  Engine.recording=!Engine.recording;
  updateRecordButton();
}
function setTool(t){ state.tool=t; updateToolbar(); }
function selectAll(){ const tr=activeTrack(); if(tr){ state.selection=new Set(tr.notes); } }
function deleteSelection(){
  const tr=activeTrack(); if(!tr) return;
  if(state.selection.size){ pushUndo(); for(const n of [...state.selection]) deleteNote(n,false); clearSelection(); }
}
function copySelection(){
  const tr=activeTrack(); if(!tr) return;
  const sel=[...state.selection];
  if(!sel.length) return;
  let min=Infinity; for(const n of sel) min=Math.min(min,n.t);
  state.copyClip={notes:sel.map(n=>({t:n.t-min,len:n.len,p:n.p,v:n.v})), min};
  state.pasteBeat=min+4;
}
function pasteSelection(){
  const tr=activeTrack(); if(!tr || !state.copyClip) return;
  pushUndo();
  const base=state.pasteBeat;
  const added=[];
  for(const n of state.copyClip.notes){
    const nn={t:snapBeat(base+n.t),len:snapBeat(n.len),p:n.p,v:n.v};
    tr.notes.push(nn); added.push(nn);
  }
  state.selection=new Set(added);
  state.pasteBeat=base+4;
  if(Engine.playing) Engine.buildTimeline();
}
function duplicateSelection(){
  const tr=activeTrack(); if(!tr) return;
  const sel=[...state.selection];
  if(!sel.length) return;
  pushUndo();
  const added=[];
  for(const n of sel){
    const nn={t:n.t+n.len,len:n.len,p:n.p,v:n.v};
    tr.notes.push(nn); added.push(nn);
  }
  state.selection=new Set(added);
  if(Engine.playing) Engine.buildTimeline();
}

function chordPitches(rootPC, scaleArr, degree0, octave, seventh){
  const degrees = seventh?[0,2,4,6]:[0,2,4];
  return degrees.map(k=>{
    const idx=degree0+k;
    const oct=octave+Math.floor(idx/7);
    return oct*12 + rootPC + scaleArr[((idx%7)+7)%7];
  });
}
function scalePitch(rootPC, scaleArr, degree0, octave){
  return octave*12 + rootPC + scaleArr[((degree0%7)+7)%7];
}

function generateSong(styleId, rng){
  const st=STYLES[styleId]; if(!st) return;
  const root=pick(rng,KEY_ROOTS);
  const scaleArr=SCALES[st.scale];
  const bars=8;
  const prog=[]; for(let i=0;i<bars;i++) prog.push(st.prog[i%st.prog.length]-1); // 0-based
  // 音区
  const chordOct=4, leadOct=5, bassOct=3;
  state.bpm=st.bpm;
  state.tracks=[];
  // 轨道1：旋律
  const lead=addTrack({name:'旋律', instrument:st.lead, color:TRACK_COLORS[0], volume:0.85});
  // 轨道2：和弦
  const chord=addTrack({name:'和弦', instrument:st.chord, color:TRACK_COLORS[1], volume:0.62});
  // 轨道3：贝斯
  const bass=addTrack({name:'贝斯', instrument:'bass', color:TRACK_COLORS[2], volume:0.85});
  // 轨道4：鼓组
  const drums=addTrack({name:'鼓组', instrument:'drums', color:TRACK_COLORS[3], volume:0.8});

  // 和弦
  for(let bar=0;bar<bars;bar++){
    const d=prog[bar];
    const notes=chordPitches(root,scaleArr,d,chordOct,st.seventh);
    // 展开为铺底/分解
    if(st.chord==='pad'){
      chord.notes.push({t:bar*4,len:4,p:notes[0],v:0.6});
      chord.notes.push({t:bar*4,len:4,p:notes[1],v:0.55});
      chord.notes.push({t:bar*4,len:4,p:notes[2],v:0.5});
      if(notes[3]!=null) chord.notes.push({t:bar*4,len:4,p:notes[3],v:0.45});
    } else if(st.chord==='chip'){
      // 8bit 分解和弦
      const arp=[0,1,2,1];
      for(let s=0;s<4;s++) chord.notes.push({t:bar*4+s,len:0.6,p:notes[arp[s]]+12,v:0.6});
    } else {
      // 柔和柱式，弱起铺底
      chord.notes.push({t:bar*4,len:3.8,p:notes[0],v:0.6});
      chord.notes.push({t:bar*4,len:3.8,p:notes[1],v:0.55});
      chord.notes.push({t:bar*4,len:3.8,p:notes[2],v:0.5});
      if(notes[3]!=null) chord.notes.push({t:bar*4,len:3.8,p:notes[3],v:0.45});
    }
  }

  // 贝斯
  const bassPats=BASS_PATTERNS[st.drums]||BASS_PATTERNS.chill;
  for(let bar=0;bar<bars;bar++){
    const d=prog[bar];
    const rootMidi=scalePitch(root,scaleArr,d,bassOct);
    const pat=pick(rng,bassPats);
    for(const o of pat){
      bass.notes.push({t:bar*4+o, len: st.chord==='chip'?0.5:1.6, p:rootMidi, v:0.85});
    }
  }

  // 旋律
  const mRhy=MELODY_RHYTHMS[st.drums]||MELODY_RHYTHMS.chill;
  let prevPitch=null;
  for(let bar=0;bar<bars;bar++){
    const d=prog[bar];
    const chordTones=chordPitches(root,scaleArr,d,leadOct,false).map(x=>x);
    const pat=pick(rng,mRhy);
    for(let i=0;i<pat.length;i++){
      const o=pat[i];
      const strong = (o%1===0); // 整拍为强拍
      let pitch;
      const scalePool=[];
      for(let deg=0;deg<7;deg++) scalePool.push(scalePitch(root,scaleArr,deg,leadOct));
      if(strong || i===0){
        pitch=pick(rng,chordTones);
        if(prevPitch!=null){
          // 就近解决
          let best=chordTones[0], bd=1e9;
          for(const c of chordTones){ const dd=Math.abs(c-prevPitch); if(dd<bd){bd=dd;best=c;} }
          pitch=best;
        }
      } else {
        pitch=pick(rng,scalePool);
        if(prevPitch!=null){
          // 限制音程跳跃
          let tries=0;
          while(Math.abs(pitch-prevPitch)>7 && tries<8){ pitch=pick(rng,scalePool); tries++; }
        }
      }
      if(prevPitch!=null && Math.abs(pitch-prevPitch)>9){ pitch = prevPitch + Math.sign(pitch-prevPitch)*2; }
      const dur = (i<pat.length-1)? Math.min(pat[i+1]-o, 3): (o<3? 3-o+ (rng()<0.4?1:0) : 1.5);
      lead.notes.push({t:bar*4+o, len:Math.max(0.25,Math.min(dur,3)), p:pitch, v:0.85});
      prevPitch=pitch;
    }
  }

  // 鼓组
  const dp=DRUM_PATTERNS[st.drums]||DRUM_PATTERNS.chill;
  for(let bar=0;bar<bars;bar++){
    for(const k of dp.kicks){
      const sw = k%2===1? dp.swing*0.25:0;
      drums.notes.push({t:bar*4 + k*0.25 + sw, len:0.25, p:36, v:0.95});
    }
    for(const s of dp.snares){
      const sw = s%2===1? dp.swing*0.25:0;
      drums.notes.push({t:bar*4 + s*0.25 + sw, len:0.25, p:38, v:0.85});
    }
    for(const hh of dp.hats){
      const sw = hh%2===1? dp.swing*0.25:0;
      drums.notes.push({t:bar*4 + hh*0.25 + sw, len:0.18, p:42, v:dp.hatVel});
    }
    if(rng()<0.3){ drums.notes.push({t:bar*4+3.75, len:0.2, p:46, v:0.5}); }
  }

  state.activeTrackId=lead.id;
  computeSongLength();
  state.loopStart=0; state.loopEnd=state.songLength; state.loopMode='song';
  clearSelection();
  if(Engine.ctx){ Engine.rebuildTrackNodes(); Engine.buildTimeline(); }
  refreshAll();
}

/* ---------------- WAV 导出 ---------------- */
function encodeWAV(channels, sampleRate, bitDepth){
  const numCh=channels.length, frames=channels[0].length;
  const bytesPerSample=bitDepth/8, blockAlign=numCh*bytesPerSample;
  const dataSize=frames*blockAlign;
  const buf=new ArrayBuffer(44+dataSize), view=new DataView(buf);
  const writeStr=(off,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(off+i,s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4,36+dataSize,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true); view.setUint16(32,blockAlign,true);
  view.setUint16(34,bitDepth,true); writeStr(36,'data'); view.setUint32(40,dataSize,true);
  let off=44;
  for(let i=0;i<frames;i++){
    for(let c=0;c<numCh;c++){
      let s=clamp(channels[c][i],-1,1);
      if(bitDepth===16){
        // 轻微三角抖动
        s += (Math.random()*2-1)/65536;
        s=clamp(s,-1,1);
        view.setInt16(off, s<0? s*0x8000 : s*0x7FFF, true);
      } else if(bitDepth===24){
        s += (Math.random()*2-1)/8388608;
        s=clamp(s,-1,1);
        const v=Math.round(s*0x7FFFFF);
        view.setUint8(off, v & 0xff); view.setUint8(off+1, (v>>8)&0xff); view.setUint8(off+2, (v>>16)&0xff);
      }
      off+=bytesPerSample;
    }
  }
  return new Blob([buf],{type:'audio/wav'});
}
function buildOfflineMixer(ctx){
  const m=buildMixer(ctx, ctx.destination);
  m.trackNodes={};
  for(const t of state.tracks){
    const gain=ctx.createGain(); gain.gain.value=t.volume;
    const pan=ctx.createStereoPanner(); pan.pan.value=t.pan;
    const out=ctx.createGain();
    gain.connect(pan); pan.connect(out);
    out.connect(m.busDry); out.connect(m.reverbIn); out.connect(m.delayIn);
    m.trackNodes[t.id]={gain,pan,out};
  }
  // 应用效果
  const fx=state.fx;
  m.filter.frequency.value=fx.filter;
  m.sat.curve=makeSaturationCurve(fx.saturation/100*8);
  m.reverbIn.gain.value=fx.reverb/100*0.85;
  m.delayIn.gain.value=fx.delay/100*0.7;
  m.delay.delayTime.value=60/state.bpm*0.75;
  m.comp.threshold.value=-6-(fx.compression/100)*24;
  m.comp.ratio.value=1+(fx.compression/100)*9;
  const depth=fx.tremolo/100*0.5;
  m.trem.gain.value=1-depth; m.lfoGain.gain.value=depth;
  m.tape.gain.value=fx.noise/100*0.03;
  m.master.gain.value=state.master;
  return m;
}
async function exportWAV(){
  if(!samplesReady){ alert('音色库仍在生成，请稍候'); return; }
  computeSongLength();
  const endBeat=state.songLength;
  const [rateStr,bitStr]=document.getElementById('sel-export').value.split('-');
  const sampleRate=parseInt(rateStr), bitDepth=parseInt(bitStr);
  const beatDur=60/state.bpm;
  const durSec=endBeat*beatDur+2.5;
  const len=Math.ceil(durSec*sampleRate);
  document.getElementById('btn-export').textContent='导出中…';
  document.getElementById('btn-export').disabled=true;
  await new Promise(r=>setTimeout(r,30));
  try{
    const ctx=new OfflineAudioContext(2,len,sampleRate);
    const m=buildOfflineMixer(ctx);
    const soloAny=state.tracks.some(t=>t.solo);
    for(const t of state.tracks){
      if(t.mute) continue; if(soloAny&&!t.solo) continue;
      const tn=m.trackNodes[t.id];
      for(const n of t.notes){
        let srcBuf,rate,loop=null;
        if(t.instrument==='drums'){
          srcBuf=drumBufs[DRUM_MAP[n.p]||'kick']; rate=1;
        } else {
          const spec=INSTRUMENTS[t.instrument]||INSTRUMENTS.piano;
          const bases=spec.base; let b=bases[0];
          for(const x of bases){ if(n.p>=x) b=x; else break; }
          b=Math.min(b,bases[bases.length-1]);
          srcBuf=samples[t.instrument][b]; rate=Math.pow(2,(n.p-b)/12); loop=spec.loop;
        }
        if(!srcBuf) continue;
        const when=n.t*beatDur;
        const src=ctx.createBufferSource(); src.buffer=srcBuf; src.playbackRate.value=rate;
        if(loop){ src.loop=true; src.loopStart=loop[0]; src.loopEnd=loop[1]; }
        const g=ctx.createGain();
        const level=Math.pow(n.v!=null?n.v:0.85,1.35)*0.95;
        const durSecN=n.len*beatDur;
        g.gain.setValueAtTime(0.0001,when); g.gain.linearRampToValueAtTime(level,when+0.004);
        g.gain.setValueAtTime(level,Math.max(when+0.006,when+durSecN-0.05));
        g.gain.linearRampToValueAtTime(0.0001,when+durSecN+0.03);
        src.connect(g); g.connect(tn.gain);
        src.start(when); src.stop(when+durSecN+0.06);
      }
    }
    const rendered=await ctx.startRendering();
    const channels=[rendered.getChannelData(0), rendered.getChannelData(1)];
    const blob=encodeWAV(channels,sampleRate,bitDepth);
    downloadBlob(blob, `lofi-studio_${sampleRate}Hz_${bitDepth}bit.wav`);
  } finally {
    document.getElementById('btn-export').textContent='导出 WAV';
    document.getElementById('btn-export').disabled=false;
  }
}

function projectJSON(){
  return JSON.stringify({
    version:1, bpm:state.bpm, grid:state.grid,
    loopMode:state.loopMode, loopStart:state.loopStart, loopEnd:state.loopEnd,
    fx:state.fx, master:state.master,
    tracks:state.tracks.map(t=>({id:t.id,name:t.name,instrument:t.instrument,color:t.color,volume:t.volume,pan:t.pan,mute:t.mute,solo:t.solo,lock:t.lock,notes:t.notes}))
  });
}
function loadProject(data){
  pushUndo();
  const d=typeof data==='string'?JSON.parse(data):data;
  state.bpm=d.bpm||75; state.grid=d.grid||0.25;
  state.loopMode=d.loopMode||'song'; state.loopStart=d.loopStart||0; state.loopEnd=d.loopEnd||32;
  state.fx=Object.assign({},state.fx,d.fx||{}); state.master=d.master!=null?d.master:0.9;
  state.tracks=(d.tracks||[]).map(t=>({id:t.id||uid(),name:t.name||'轨道',instrument:t.instrument||'piano',color:t.color||TRACK_COLORS[0],volume:t.volume!=null?t.volume:0.9,pan:t.pan||0,mute:!!t.mute,solo:!!t.solo,lock:!!t.lock,notes:(t.notes||[]).map(n=>({t:n.t,len:n.len,p:n.p,v:n.v}))}));
  if(!state.tracks.length) addTrack({name:'旋律',instrument:'piano'});
  state.activeTrackId=state.tracks[0].id;
  computeSongLength();
  if(Engine.ctx){ Engine.rebuildTrackNodes(); Engine.buildTimeline(); }
  refreshAll();
}

function buildFxPanel(){
  const body=document.getElementById('fx-body');
  body.innerHTML='';
  const defs=[
    ['noise','磁带噪声','%',100,0],
    ['saturation','磁带饱和','%',100,0],
    ['filter','复古低通','Hz',18000,400],
    ['reverb','温润混响','%',100,0],
    ['compression','动态压缩','%',100,0],
    ['delay','Delay 延迟','%',100,0],
    ['tremolo','音色颤音','%',100,0],
  ];
  for(const [id,name,unit,max,min] of defs){
    const row=document.createElement('div'); row.className='fx-row';
    const nm=document.createElement('div'); nm.className='fx-name'; nm.textContent=name;
    const sl=document.createElement('input'); sl.type='range'; sl.min=min; sl.max=max; sl.step=(id==='filter'?100:1);
    sl.value=state.fx[id];
    const vl=document.createElement('div'); vl.className='fx-val'; vl.textContent=fmtFx(id,state.fx[id],unit);
    sl.addEventListener('input',()=>{ state.fx[id]=parseFloat(sl.value); vl.textContent=fmtFx(id,state.fx[id],unit); applyFx(); document.getElementById('sel-fxpreset').value='manual'; });
    row.appendChild(nm); row.appendChild(sl); row.appendChild(vl);
    body.appendChild(row);
  }
  // 主音量
  const row=document.createElement('div'); row.className='fx-row';
  const nm=document.createElement('div'); nm.className='fx-name'; nm.textContent='总输出';
  const sl=document.createElement('input'); sl.type='range'; sl.min=0; sl.max=1.5; sl.step=0.01; sl.value=state.master;
  const vl=document.createElement('div'); vl.className='fx-val'; vl.textContent=Math.round(state.master*100)+'%';
  sl.addEventListener('input',()=>{ state.master=parseFloat(sl.value); vl.textContent=Math.round(state.master*100)+'%'; if(Engine.mixer){Engine.mixer.master.gain.setTargetAtTime(state.master,Engine.ctx.currentTime,0.03);} });
  row.appendChild(nm); row.appendChild(sl); row.appendChild(vl);
  body.appendChild(row);
  // 重置按钮
  const r2=document.createElement('div'); r2.style.cssText='margin-top:6px;display:flex;gap:8px;';
  const rb=document.createElement('button'); rb.textContent='重置效果'; rb.style.width='100%';
  rb.addEventListener('click',()=>{ Object.assign(state.fx,{noise:12,saturation:28,filter:8200,reverb:32,compression:30,delay:14,tremolo:6}); buildFxPanel(); applyFx(); document.getElementById('sel-fxpreset').value='lofi'; });
  r2.appendChild(rb);
  body.appendChild(r2);
}
function fmtFx(id,val,unit){
  if(id==='filter') return Math.round(val)+unit;
  return Math.round(val)+unit;
}
const FX_PRESETS={
  lofi:  {noise:12,saturation:28,filter:8200,reverb:32,compression:30,delay:14,tremolo:6},
  tape:  {noise:30,saturation:48,filter:5200,reverb:24,compression:38,delay:10,tremolo:10},
  dream: {noise:8,saturation:16,filter:10000,reverb:62,compression:18,delay:36,tremolo:14},
  clean: {noise:2,saturation:5,filter:16000,reverb:14,compression:22,delay:4,tremolo:0},
  dark:  {noise:20,saturation:32,filter:3600,reverb:46,compression:46,delay:20,tremolo:8},
};

function buildTracksPanel(){
  const list=document.getElementById('tracks-list');
  list.innerHTML='';
  for(const t of state.tracks){
    const row=document.createElement('div');
    row.className='track-row'+(t.id===state.activeTrackId?' active':'');
    row.dataset.id=t.id;
    const sw=document.createElement('div'); sw.className='swatch'; sw.style.background=t.color;
    const nm=document.createElement('input'); nm.type='text'; nm.value=t.name;
    nm.addEventListener('input',()=>{ t.name=nm.value; });
    const inst=document.createElement('select');
    for(const k in INSTRUMENTS){ const o=document.createElement('option'); o.value=k; o.textContent=INSTRUMENTS[k].name; if(k===t.instrument) o.selected=true; inst.appendChild(o); }
    inst.addEventListener('change',()=>{ t.instrument=inst.value; });
    const vol=document.createElement('input'); vol.type='range'; vol.min=0; vol.max=1.5; vol.step=0.01; vol.value=t.volume; vol.title='音量';
    vol.addEventListener('input',()=>{ t.volume=parseFloat(vol.value); Engine.setTrackVolume(t.id,t.volume); });
    const pan=document.createElement('input'); pan.type='range'; pan.min=-1; pan.max=1; pan.step=0.02; pan.value=t.pan; pan.title='声像';
    pan.addEventListener('input',()=>{ t.pan=parseFloat(pan.value); Engine.setTrackPan(t.id,t.pan); });
    const mk=(txt,cls,fn)=>{ const b=document.createElement('button'); b.className='tbtn '+cls; b.textContent=txt; if(fn()) b.classList.add('on'); b.addEventListener('click',e=>{e.stopPropagation();}); return b; };
    const bm=mk('M','m',()=>t.mute); bm.addEventListener('click',e=>{e.stopPropagation(); t.mute=!t.mute; buildTracksPanel(); if(Engine.playing)Engine.buildTimeline();});
    const bs=mk('S','s',()=>t.solo); bs.addEventListener('click',e=>{e.stopPropagation(); t.solo=!t.solo; buildTracksPanel(); if(Engine.playing)Engine.buildTimeline();});
    const bl=mk('L','l',()=>t.lock); bl.addEventListener('click',e=>{e.stopPropagation(); t.lock=!t.lock; buildTracksPanel();});
    const bd=mk('×','del',()=>false); bd.addEventListener('click',e=>{e.stopPropagation(); if(state.tracks.length<=1){alert('至少保留一条轨道');return;} pushUndo(); state.tracks=state.tracks.filter(x=>x.id!==t.id); if(state.activeTrackId===t.id) state.activeTrackId=state.tracks[0].id; if(Engine.ctx)Engine.rebuildTrackNodes(); buildTracksPanel();});
    const cnt=document.createElement('div'); cnt.className='tcnt'; cnt.textContent=String(t.notes.length);
    row.appendChild(sw); row.appendChild(nm); row.appendChild(inst);
    const vw=document.createElement('div'); vw.className='tvol'; vw.appendChild(vol);
    row.appendChild(vw);
    const pw=document.createElement('div'); pw.className='tvol'; pw.appendChild(pan);
    row.appendChild(pw);
    const btns=document.createElement('div'); btns.style.cssText='display:flex;gap:3px;'; btns.appendChild(bm); btns.appendChild(bs); btns.appendChild(bl); btns.appendChild(bd);
    row.appendChild(btns);
    row.appendChild(cnt);
    row.addEventListener('click',e=>{ if(e.target.closest('input,select,button')) return; state.activeTrackId=t.id; buildTracksPanel(); });
    list.appendChild(row);
  }
  document.getElementById('tracks-count').textContent='('+state.tracks.length+')';
}

  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  // 保存
  document.getElementById('btn-save').addEventListener('click',async ()=>{
    const json=projectJSON();
    openModal('保存工程', '<p style="color:var(--muted);margin-bottom:10px;">复制下方字符串备份，或下载工程文件。纯本地，不联网。</p><textarea id="save-text" readonly></textarea>',
      [
        {label:'复制字符串',accent:true,fn:async()=>{ const t=document.getElementById('save-text'); t.select(); const ok=await copyText(json); alert(ok?'已复制到剪贴板':'复制失败，请手动全选复制'); }},
        {label:'下载 .lofi 文件',fn:()=>{ downloadBlob(new Blob([json],{type:'application/json'}),'project.lofi'); }},
        {label:'关闭',fn:closeModal},
      ]);
    document.getElementById('save-text').value=json;
  });
  // 导入
  document.getElementById('btn-load').addEventListener('click',()=>{
    openModal('导入工程','<p style="color:var(--muted);margin-bottom:10px;">粘贴工程字符串，或选择 .lofi / .json 文件。</p><textarea id="load-text" placeholder="粘贴工程 JSON …"></textarea><div style="margin-top:10px;"><input type="file" id="load-file" accept=".lofi,.json" style="width:100%;"></div>',
      [
        {label:'导入',accent:true,fn:()=>{ const t=document.getElementById('load-text').value.trim(); if(!t){alert('请粘贴工程字符串');return;} try{ loadProject(t); closeModal(); }catch(e){ alert('解析失败：'+e.message); } }},
        {label:'关闭',fn:closeModal},
      ]);
    document.getElementById('load-file').addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ try{ loadProject(rd.result); closeModal(); }catch(err){ alert('解析失败：'+err.message); } };
      rd.readAsText(f);
    });
  });
  // 帮助
  document.getElementById('btn-help').addEventListener('click',()=>{
    openModal('快捷键 & 说明', `
      <div style="line-height:2;font-size:12px;">
        <div style="color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;">演奏</div>
        <div><span class="kbd">A S D F G H J K L ;</span> 白键 C4–E5（即时发声）</div>
        <div><span class="kbd">Z X C V B N M</span> 白键 C3–B3</div>
        <div><span class="kbd">空格</span> 播放/暂停　<span class="kbd">R</span> 录音（弹奏写入钢琴卷帘）</div>
        <div style="color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 6px;">编辑</div>
        <div><span class="kbd">V</span> 选择　<span class="kbd">B</span> 画笔　<span class="kbd">E</span> 橡皮</div>
        <div><span class="kbd">Ctrl+C/V/D</span> 复制/粘贴/克隆　<span class="kbd">Del</span> 删除　<span class="kbd">Ctrl+Z</span> 撤销　<span class="kbd">Ctrl+A</span> 全选</div>
        <div>拖拽音符=移动　拖右边缘=拉伸　空白拖拽=框选　Shift+点击=加选</div>
        <div style="color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 6px;">视图</div>
        <div><span class="kbd">Ctrl+滚轮</span> 缩放　<span class="kbd">Shift+滚轮</span> 横向滚动　<span class="kbd">滚轮</span> 纵向滚动　标尺拖拽=设定循环选区</div>
        <div style="color:var(--muted);margin-top:12px;">触屏：点音符选中、拖拽移动、拉伸右缘、双指缩放、点控件播放。</div>
      </div>`,
      [{label:'关闭',accent:true,fn:closeModal}]);
  });

  window.addEventListener('resize',()=>{ setupCanvas(); });
}

/* ---------------- 启动 ---------------- */
window.addEventListener('DOMContentLoaded', ()=>{
  bindUI();
  buildFxPanel();
  loadDemoProject();
  buildTracksPanel();
  setupCanvas();
  requestAnimationFrame(frame);
  buildSampleLibrary().then(()=>{
    document.getElementById('loading-msg').textContent='音色库就绪 ✓';
    setTimeout(()=>{
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      setupCanvas();
    },250);
  });
  // 首次手势启用音频（示例：任意点击空白也启用）
  document.addEventListener('pointerdown',()=>{ Engine.ensureCtx(); },{once:true});
});
</script>

</body>
</html>
