<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体素望仙谷 · Voxel Cliff Village</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1714'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23e0b34c' font-family='serif'%3E%E4%BB%99%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #1b1714;
      --paper: #f3ece0;
      --gold: #e0b34c;
      --seal: #9e3b2f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e1116; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 20;
      font: 12px/1.55 ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
      color: var(--paper);
      background: rgba(20, 17, 14, 0.62);
      border: 1px solid rgba(224, 179, 76, 0.35);
      border-radius: 8px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      min-width: 202px;
      pointer-events: none;
      user-select: none;
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.35);
    }
    #hud .title {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 14px; letter-spacing: 2px; color: var(--gold);
      border-bottom: 1px solid rgba(224, 179, 76, 0.25);
      padding-bottom: 6px; margin-bottom: 7px;
    }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; }
    #hud .k { opacity: 0.72; }
    #hud .v { color: var(--gold); font-weight: 600; }
    #hud .v.warn { color: #e07a4c; }
    #hud .v.good { color: #8fd07a; }
    #hud .foot { margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); opacity: .55; font-size: 11px; }

    /* ---------- 加载遮罩 ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 60;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(120% 90% at 50% 12%, #3f5f78 0%, #24313d 55%, #171d24 100%);
      color: var(--paper);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      transition: opacity .6s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .seal {
      width: 58px; height: 58px; border: 2px solid var(--seal); border-radius: 6px;
      display: grid; place-items: center; color: var(--seal);
      font-size: 26px; letter-spacing: -2px; padding-left: 2px;
      box-shadow: 0 0 0 4px rgba(158, 59, 47, .18);
    }
    #loading h1 { margin: 0; font-size: 24px; letter-spacing: 8px; font-weight: 500; }
    #loading p { margin: 0; font-size: 12px; letter-spacing: 3px; opacity: .65; font-family: ui-monospace, monospace; }
    #bar { width: 240px; height: 3px; background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
    #bar i { display: block; height: 100%; width: 30%; background: var(--gold); animation: slide 1.15s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(340%); } }

    /* ---------- 提示 ---------- */
    #tip {
      position: fixed; right: 14px; bottom: 14px; z-index: 20;
      font: 11px/1.6 ui-monospace, monospace; color: rgba(243, 236, 224, .5);
      text-align: right; pointer-events: none; user-select: none;
    }
