<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>博麗神社</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04060a; }
  body > canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* ── 操作說明面板（H 鍵開閉；不攔截滑鼠事件） ───────────────────── */
  #hud {
    position:fixed; left:16px; bottom:16px; z-index:10; pointer-events:none;
    font:12.5px/1.62 "Hiragino Sans","Noto Sans CJK JP","Yu Gothic UI","Microsoft YaHei",system-ui,sans-serif;
    color:#f3ece1; letter-spacing:.02em;
    background:linear-gradient(180deg, rgba(26,20,17,.74), rgba(16,12,11,.68));
    border:1px solid rgba(214,175,96,.34); border-radius:11px;
    padding:11px 15px 10px; max-width:min(50vw,560px);
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,235,195,.07);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    transition:opacity .28s ease, transform .28s ease;
  }
  #hud.off { opacity:0; transform:translateY(8px); }
  #hud h1 {
    margin:0 0 7px; font-size:11.5px; font-weight:600; letter-spacing:.20em; color:#e6bd76;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  #hud h1 span { color:#8e8574; font-weight:400; letter-spacing:.08em; font-size:10.5px; }
  #hud .row { display:flex; gap:9px; align-items:baseline; }
  #hud .k { flex:0 0 3.4em; color:#c8a45f; font-size:11px; letter-spacing:.10em; }
  #hud .v { flex:1 1 auto; color:#efe7d9; }
  #hud .dim { color:#9c9283; }
  #hud kbd {
    display:inline-block; min-width:1.05em; text-align:center; margin:0 1px; padding:1px 5px 2px;
    border:1px solid rgba(232,212,172,.34); border-bottom-width:2px; border-radius:5px;
    background:rgba(255,244,225,.10); font:inherit; font-size:11px; color:#fcf6e8;
  }
  #hud .stat {
    margin-top:8px; padding-top:7px; border-top:1px solid rgba(214,175,96,.20);
    color:#e8dcc4; font-size:12px; display:flex; gap:8px; align-items:baseline;
  }
  #hud .stat b { color:#f0c987; font-weight:600; }
</style>
</head>
<body>
<div id="hud">
  <h1>博麗神社 ・ 操作説明<span>H 開閉</span></h1>
  <div class="row"><span class="k">時刻</span><span class="v"><kbd>1</kbd>黎明 <kbd>2</kbd>白晝 <kbd>3</kbd>黄昏 <kbd>4</kbd>夜 <kbd>5</kbd>深夜　<kbd>空格</kbd>自動晝夜</span></div>
  <div class="row"><span class="k">季節</span><span class="v"><kbd>Q</kbd>春 <kbd>W</kbd>夏 <kbd>E</kbd>秋 <kbd>R</kbd>冬<span class="dim">　櫻吹雪 / 螢火 / 紅葉 / 積雪</span></span></div>
  <div class="row"><span class="k">天氣</span><span class="v"><kbd>A</kbd>晴 <kbd>S</kbd>陰 <kbd>D</kbd>雨 <kbd>F</kbd>霧 <kbd>G</kbd>雷<span class="dim">　濕滑 / 閃電</span></span></div>
  <div class="row"><span class="k">視角</span><span class="v">拖曳 旋轉　滾輪 縮放　<kbd>P</kbd>自動旋轉</span></div>
  <div class="row"><span class="k">顯示</span><span class="v"><kbd>O</kbd>描邊　<kbd>B</kbd>景深　<kbd>H</kbd>本面板</span></div>
  <div class="row"><span class="k">互動</span><span class="v">點擊 <span class="dim">鈴 · 水面 · 櫻樹 · 烏鴉</span> 觸發動效</span></div>
  <div class="stat" id="hud-stat">春 ・ 白晝 ・ 晴 ・ 12:00</div>
</div>
