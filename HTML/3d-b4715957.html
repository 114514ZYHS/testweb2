<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>翠谷时光 · Verdant Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ======================= HUD ======================= -->
  <div id="hud" class="hidden">
    <div class="hud-corner tl">
      <div class="card date-card">
        <div class="season-sigil" id="ui-season-sigil">春</div>
        <div class="date-text">
          <div class="date-line"><span id="ui-season">春季</span><span class="dot">·</span><span id="ui-day">第 1 天</span></div>
          <div class="clock" id="ui-clock">06:00</div>
        </div>
      </div>
      <div class="vitals card">
        <div class="bar" title="体力">
          <i class="ico">✦</i>
          <div class="track"><span id="ui-energy-fill" class="fill energy"></span></div>
        </div>
        <div class="bar" title="生命">
          <i class="ico">♥</i>
          <div class="track"><span id="ui-health-fill" class="fill health"></span></div>
        </div>
      </div>
    </div>

    <div class="hud-corner tr">
      <div class="card gold-card"><span class="coin">◈</span><span id="ui-gold">500</span></div>
      <div class="card weather-card"><span id="ui-weather">晴</span></div>
    </div>

    <div id="prompt" class="prompt hidden"><kbd>E</kbd><span id="prompt-text"></span></div>
    <div id="toasts" class="toasts"></div>
    <div id="tool-readout" class="tool-readout hidden"></div>
    <div id="hotbar" class="hotbar"></div>
    <div id="hint-bar" class="hint-bar">WASD 移动 · 右键拖动转视角 · 左键使用 · 1-9 切换工具 · Tab 背包</div>
  </div>

  <!-- ======================= 面板层 ======================= -->
  <div id="panel-layer" class="panel-layer hidden">
    <div class="panel card" id="panel">
      <header class="panel-head">
        <h2 id="panel-title">背包</h2>
        <button id="panel-close" class="icon-btn" title="关闭 (Esc)">✕</button>
      </header>
      <div class="panel-tabs" id="panel-tabs"></div>
      <div class="panel-body" id="panel-body"></div>
      <footer class="panel-foot" id="panel-foot"></footer>
    </div>
  </div>

  <!-- ======================= 主菜单 ======================= -->
  <div id="menu" class="overlay">
    <div class="menu-bg"></div>
    <div class="menu-inner">
      <div class="title-block">
        <p class="title-kicker">A Pastoral Life Simulation</p>
        <h1 class="title-main">翠谷时光</h1>
        <p class="title-sub">Verdant Hollow</p>
        <div class="rule"></div>
        <p class="title-desc">继承一片山谷，耕耘、浇灌、收获，看四季流转、光影更迭。</p>
      </div>
      <nav class="menu-nav" id="menu-nav">
        <button class="menu-btn primary" data-action="new">
          <span class="mb-label">新的农场</span><span class="mb-sub">开始新的一天</span>
        </button>
        <button class="menu-btn" data-action="continue">
          <span class="mb-label">继续游戏</span><span class="mb-sub" id="continue-sub">暂无存档</span>
        </button>
        <button class="menu-btn" data-action="load">
          <span class="mb-label">读取存档</span><span class="mb-sub">本地槽位管理</span>
        </button>
        <button class="menu-btn" data-action="import">
          <span class="mb-label">导入存档</span><span class="mb-sub">从 .json 文件恢复</span>
        </button>
        <button class="menu-btn" data-action="settings">
          <span class="mb-label">画面设置</span><span class="mb-sub">画质 / 水面 / 泛光</span>
        </button>
        <button class="menu-btn" data-action="help">
          <span class="mb-label">操作说明</span><span class="mb-sub">如何经营这座山谷</span>
        </button>
      </nav>
      <p class="menu-foot">使用本地 vendor 版 three.js 运行 · 存档保存在浏览器与本地文件</p>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden />
  </div>

  <!-- ======================= 加载层 ======================= -->
  <div id="loading" class="overlay loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <h2 id="loading-title">正在开垦山谷…</h2>
      <p id="loading-step">生成地形与植被</p>
      <div class="progress"><span id="loading-bar"></span></div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>

<!-- source: deepdemos.top | author: minghuaanliu | title: 3D版的星露谷物语 -->
</body>
</html>
