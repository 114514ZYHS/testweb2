<script type="module">

catch(e){ THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }

/* ==================================================================
   0. 调色板 —— 文艺复兴意大利
   ================================================================== */
const P = {
  traver:0xE6D8BA, traver2:0xD8C7A4, stone:0xD0C09F, stoneD:0xB8A583, stoneX:0x9C8B6C,
  serena:0x8B8E85, serena2:0x74786F, marble:0xF0E9D9, marbleD:0xDCD3BD,
  prato:0x466B5A, prato2:0x37564A, verona:0xBE887E, verona2:0xA9736A,
  ochre:0xD5A661, ochre2:0xC08F4E, gold2:0xDDBF8B, sand:0xDAC49A,
  rose:0xCC9B8B, sienna:0xC17B51, cream:0xE4D4B1, apricot:0xDCAE7A,
  vRed:0xAB4A31, vRose:0xC97E6C, vOch:0xD09E54, vTeal:0x5E807B, vBlue:0x6F8DA9,
  vPlum:0x8C5A5E, vMint:0x8FA894,
  roof:0xB0603C, roofD:0x98522F, roofL:0xC2734B, roofX:0x8B4931,
  brick:0xA05739, brickD:0x87472D, lead:0xAAA99A, lead2:0x949380, copper:0x6F8F83,
  gold:0xDAA73D, bronze:0x8B6B3C, wood:0x6C4B30, woodD:0x553B25, woodL:0x8A6440,
  shut:0x4C6451, shut2:0x3F5445, shut3:0x6A5236, dark:0x281f19, glass:0x1E2734,
  cyp:0x2F4B35, cyp2:0x25392A, olive:0x7D8C60, olive2:0x69795012&0xFFFFFF, grass:0x718447,
  grass2:0x63763D, vine:0x556B34, boat:0x1D1B1B,
  cloth1:0xB3574B, cloth2:0xC79B4B, cloth3:0x4F6F77, cloth4:0x7C5A86, cloth5:0xD8CDB4,
  skin:0xE7C6A0, skin2:0xD1A87E, lampG:0xFFCE7A, lampW:0xFFF0C8,
  fest1:0xD34B4B, fest2:0xE8B33C, fest3:0x3F7FA8, fest4:0x8E5AA8, fest5:0x4FA07A
};
P.olive2=0x69795A;

/* ==================================================================
   1. 体素引擎
   ================================================================== */
const KX=1048576, KY=1024;
const VOX=new Map();            /* 主体（静态） */
const FEST=new Map();           /* 节庆装饰层 */
const LAMPS=[];                 /* 灯光位置 */
let TARGET=VOX;
let TX=0,TZ=0,TR=0;
function at(ox,oz,rot){ TX=Math.round(ox); TZ=Math.round(oz); TR=((rot|0)%4+4)%4; }
function put(x,y,z,c){
  if(c==null) return;
  x=Math.round(x); y=Math.round(y); z=Math.round(z);
  let wx,wz;
  if(TR===0){wx=x;wz=z;} else if(TR===1){wx=-z;wz=x;} else if(TR===2){wx=-x;wz=-z;} else {wx=z;wz=-x;}
  wx+=TX; wz+=TZ;
  if(wx<-511||wx>511||wz<-511||wz>511||y<-127||y>895) return;
  TARGET.set((wx+512)*KX+(y+128)*KY+(wz+512), c);
}
function world(x,z){
  let wx,wz;
  if(TR===0){wx=x;wz=z;} else if(TR===1){wx=-z;wz=x;} else if(TR===2){wx=-x;wz=-z;} else {wx=z;wz=-x;}
  return [wx+TX,wz+TZ];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry32(0x5EED17);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const hash3=(x,y,z)=>{let h=(x*374761393+y*668265263+z*1442695040)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;};
const lerp=(a,b,t)=>a+(b-a)*t;
function vnoise(x,z){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash3(xi,17,zi), b=hash3(xi+1,17,zi), c=hash3(xi,17,zi+1), d=hash3(xi+1,17,zi+1);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm(x,z,o){let s=0,a=0.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,z*f);n+=a;a*=0.5;f*=2;}return s/n;}

/* ==================================================================
   2. 建筑基元
   ================================================================== */
const cf=(c,x,y,z)=>typeof c==='function'?c(x,y,z):c;
function box(x0,y0,z0,x1,y1,z1,c){
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++) put(x,y,z,cf(c,x,y,z));
}
const slab=(x0,z0,x1,z1,y,c)=>box(x0,y,z0,x1,y,z1,c);
function walls(x0,z0,x1,z1,y0,y1,fn){
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){
    if(x!==x0&&x!==x1&&z!==z0&&z!==z1) continue;
    const side=(z===z0)?0:(x===x1)?1:(z===z1)?2:3;
    const u=(side===0||side===2)?x-x0:z-z0;
    put(x,y,z,fn(u,y,side,x,z));
  }
}
function gableRoof(x0,z0,x1,z1,y0,c,ridgeX,over,slope){
  over=over==null?1:over; slope=slope||0.55;
  const a0=(ridgeX?z0:x0)-over, a1=(ridgeX?z1:x1)+over;
  const b0=(ridgeX?x0:z0)-over, b1=(ridgeX?x1:z1)+over;
  for(let a=a0;a<=a1;a++){
    const d=Math.min(a-a0,a1-a), y=y0+Math.round(d*slope);
    for(let b=b0;b<=b1;b++){
      const X=ridgeX?b:a, Z=ridgeX?a:b;
      put(X,y,Z,cf(c,X,y,Z));
      if(d===0) put(X,y-1,Z,P.roofX);
    }
  }
}
function hipRoof(x0,z0,x1,z1,y0,c,over,slope){
  over=over==null?1:over; slope=slope||0.6;
  const X0=x0-over,X1=x1+over,Z0=z0-over,Z1=z1+over;
  for(let x=X0;x<=X1;x++)for(let z=Z0;z<=Z1;z++){
    const d=Math.min(x-X0,X1-x,z-Z0,Z1-z), y=y0+Math.round(d*slope);
    put(x,y,z,cf(c,x,y,z));
    if(d===0) put(x,y-1,z,P.roofX);
  }
}
function terrace(x0,z0,x1,z1,y,cF,cR){ slab(x0,z0,x1,z1,y,cF); walls(x0,z0,x1,z1,y+1,y+1,()=>cR); }
function merlons(x0,z0,x1,z1,y,c,sw){
  for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){
    if(x!==x0&&x!==x1&&z!==z0&&z!==z1) continue;
    const u=(z===z0||z===z1)?x-x0:z-z0, m=((u%5)+5)%5;
    put(x,y,z,c);
    if(m<3){ put(x,y+1,z,c); if(sw&&m!==1) put(x,y+2,z,c); }
  }
}
function roundArch(du,dy,w,sp){ return dy<sp?Math.abs(du)<=w:(du*du+(dy-sp)*(dy-sp)<=(w+0.4)*(w+0.4)); }
function gothicArch(du,dy,w,sp){ const a=Math.abs(du); return dy<sp?a<=w:a<=w-(dy-sp)*0.75+0.2; }
function arcadeOpen(u,y,y0,pitch,h,pointed){
  const m=((u%pitch)+pitch)%pitch, du=m-(pitch-1)/2, w=(pitch-2)/2, dy=y-y0, sp=h-w-1;
  if(dy<0||dy>h) return false;
  return pointed?gothicArch(du,dy,w,sp):roundArch(du,dy,w,sp);
}
function cyl(cx,cz,r,y0,y1,c,solid){
  const R0=Math.ceil(r)+1;
  for(let y=y0;y<=y1;y++)for(let dx=-R0;dx<=R0;dx++)for(let dz=-R0;dz<=R0;dz++){
    const d=Math.hypot(dx,dz);
    if(d>r+0.4) continue;
    if(!solid&&d<r-1.1) continue;
    put(cx+dx,y,cz+dz,cf(c,dx,y,dz));
  }
}
function domeShell(cx,cz,r,y0,k,c){
  const R0=Math.ceil(r)+1, H=Math.max(1,Math.round(r*k));
  for(let h=0;h<=H;h++){
    const t=h/H, rr=r*Math.sqrt(Math.max(0,1-t*t)), r2=r*Math.sqrt(Math.max(0,1-((h+1)/H)**2));
    const th=Math.max(1.2,rr-r2+1.1);
    for(let dx=-R0;dx<=R0;dx++)for(let dz=-R0;dz<=R0;dz++){
      const d=Math.hypot(dx,dz);
      if(d>rr+0.4||d<rr-th) continue;
      put(cx+dx,y0+h,cz+dz,cf(c,dx,h,dz));
    }
  }
}
const OCTK=1.41421356;
const inOct=(dx,dz,a)=>Math.abs(dx)<=a&&Math.abs(dz)<=a&&Math.abs(dx)+Math.abs(dz)<=a*OCTK;
function octRing(cx,cz,a,t,y,fn){
  const R0=Math.ceil(a)+1;
  for(let dx=-R0;dx<=R0;dx++)for(let dz=-R0;dz<=R0;dz++)
    if(inOct(dx,dz,a)&&!inOct(dx,dz,a-t)) put(cx+dx,y,cz+dz,fn(dx,dz));
}
function octFill(cx,cz,a,y,c){
  const R0=Math.ceil(a)+1;
  for(let dx=-R0;dx<=R0;dx++)for(let dz=-R0;dz<=R0;dz++) if(inOct(dx,dz,a)) put(cx+dx,y,cz+dz,cf(c,dx,y,dz));
}
function faceU(dx,dz){const ax=Math.abs(dx),az=Math.abs(dz),T=2.4142;
  if(ax>=az*T)return dz; if(az>=ax*T)return dx; return (ax-az)*0.7071;}
function marble(u,y){
  const uu=((Math.round(u)%8)+8)%8, yy=((y%10)+10)%10;
  if(yy===0||uu===0) return P.prato;
  if(yy===1||yy===9) return P.marbleD;
  if(uu>=2&&uu<=6&&yy>=3&&yy<=7) return (uu===2||uu===6||yy===3||yy===7)?P.verona:P.marble;
  return P.marble;
}
const rustic=(u,y,a,b)=>((Math.floor(y/2)+Math.floor(u/3))%2?a:b);
const MARKS=[];
const mark=(name,en,th,ph,d,tx,ty,tz)=>MARKS.push({name,en,th,ph,d,tx,ty,tz});

/* ==================================================================
   3. 地理：海岸线 / 阿诺河 / 威尼斯泻湖群岛 / 运河 / 丘陵
   ================================================================== */
const GW=640, GO=320;
const G=new Uint8Array(GW*GW);                 /* 0野地 1街道 2广场 3驳岸 4园圃 5水 6占用 7沙滩 8农田 */
const inW=(x,z)=>x>=-GO&&x<GO&&z>=-GO&&z<GO;
const gidx=(x,z)=>((z+GO)|0)*GW+((x+GO)|0);
const gget=(x,z)=>inW(x,z)?G[gidx(x,z)]:0;
const gset=(x,z,v)=>{ if(inW(x,z)) G[gidx(x,z)]=v; };
const isWater=(x,z)=>gget(Math.round(x),Math.round(z))===5;

function seaF(x,z){ return 0.55*x+0.62*z-40+(fbm(x/260+4.7,z/260-2.3,4)-0.5)*150; }
const rivZ=x=>30+0.30*x+44*Math.sin((x+280)/175)+12*Math.sin((x+50)/48);
const rivW=x=>13+3*Math.sin(x/37)+2*Math.sin(x/17);
const ISL=[{x:130,z:170,rx:168,rz:124,p:1.7,wb:0.40},{x:268,z:34,rx:50,rz:42,p:0.4},
           {x:292,z:274,rx:54,rz:42,p:2.9},{x:-24,z:292,rx:44,rz:36,p:1.1}];
const gcX=z=>95+58*Math.sin((z-60)/82);
const CANALS=[

function occupy(x0,z0,x1,z1){ for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++) gset(x,z,6); }
function pave(x0,z0,x1,z1){ for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){const g=gget(x,z); if(g===0||g===4||g===8) gset(x,z,2);} }
function apron(cx,cz,rx,rz,seed){
  for(let dx=-rx;dx<=rx;dx++)for(let dz=-rz;dz<=rz;dz++){
    const ang=Math.atan2(dz,dx), wob=1+0.13*Math.sin(ang*3+seed)+0.09*(vnoise((cx+dx)/11+seed,(cz+dz)/11)-0.5)*2;
    if(Math.hypot(dx/(rx*wob),dz/(rz*wob))>1) continue;
    const g=gget(cx+dx,cz+dz); if(g===0||g===4||g===8||g===1) gset(cx+dx,cz+dz,2);
  }
}
/* 通用石桥：自动量测水面宽度 */
function bridge(cx,cz,axis,W,style){
  at(0,0,0);
  if(!isWater(cx,cz)) return null;
  /* u = 跨越方向，v = 桥面宽度方向；始终以世界坐标 (cx,cz) 为桥心 */
  const H=(u,v)=>axis==='x'?[cx+u,cz+v]:[cx+v,cz+u];
  let a=0,b=0;
  while(a>-70&&isWater(H(a,0)[0],H(a,0)[1])) a--;
  while(b<70&&isWater(H(b,0)[0],H(b,0)[1])) b++;
  if(b-a<3) return null;
  a-=5; b+=5;
  const span=b-a, mid=(a+b)/2, hw=Math.floor(W/2);
  const top=Math.max(5,Math.min(12,3+Math.round(span*0.22)));
  const deckY=u=>{ const t=(u-mid)/(span/2); return Math.round(top-t*t*(top-2.5)); };
  const nA=(span>30)?3:1, seg=span/nA;
  function archTop(u){
    const k=Math.min(nA-1,Math.max(0,Math.floor((u-a)/seg)));
    const c=a+seg*(k+0.5), t=(u-c)/(seg*0.42);
    if(Math.abs(t)>=1) return -99;
    return Math.round(Math.sqrt(1-t*t)*Math.min(top-2,seg*0.44));
  }
  /* 桥体 */
  for(let u=a;u<=b;u++){
    const dy=deckY(u), ar=archTop(u);
    for(let v=-hw;v<=hw;v++){
      const P0=H(u,v), X=P0[0], Z=P0[1];
      for(let y=dy;y>=-4;y--){
        if(y<=ar&&y>=-1) continue;
        put(X,y,Z, y===dy?(((u+v)&1)?P.traver:P.traver2):rustic(u,y,P.stone,P.stoneD));
      }
      gset(X,Z,6);
    }
    /* 拱券石圈 */
    if(ar>0) for(const v of[-hw,hw]){
      const P0=H(u,v); put(P0[0],ar+1,P0[1],P.marbleD);
    }
  }
  /* 栏杆（无店铺处） */
  const rail=(u)=>{
    const dy=deckY(u);
    for(const v of[-hw,hw]){
      const P0=H(u,v);
      put(P0[0],dy+1,P0[1],P.marbleD);
      if(((u%3)+3)%3!==1) put(P0[0],dy+2,P0[1],P.marble);
    }
  };
  if(!style) for(let u=a;u<=b;u++) rail(u);

  /* —— 老桥：两侧参差的彩色店铺 + 悬挑木构 + 中央观景敞廊 + 瓦萨里走廊 —— */
  if(style==='shops'){
    const cols=[P.ochre,P.sienna,P.cream,P.gold2,P.rose,P.ochre2,P.apricot,P.sand];
    const gap0=Math.round(mid-4), gap1=Math.round(mid+4);
    for(const sgn of[-1,1]){
      let u=a+4;
      while(u<b-6){
        const w=ri(4,7);
        if(u<=gap1&&u+w>=gap0){ u=gap1+1; continue; }
        const c=cols[((Math.abs(u)*7+(sgn+1)*3)|0)%cols.length], hh=ri(7,10), dy=deckY(u);
        for(let uu=u;uu<=u+w;uu++)for(let k=0;k<=3;k++){
          const v=sgn*(hw-k), P0=H(uu,v), X=P0[0], Z=P0[1];
          const edge=(uu===u||uu===u+w||k===0||k===3);
          for(let y=dy+1;y<=dy+hh;y++){
            if(!edge&&y<dy+hh) continue;
            const fy=((y-dy-1)%5+5)%5;
            let cc=c;
            if(y===dy+1) cc=P.wood;
            else if(k===0&&fy===2&&((uu%3)+3)%3===1) cc=P.glass;
            else if(k===3&&fy===2&&((uu%3)+3)%3===1) cc=P.dark;
            put(X,y,Z,cc);
          }
        }
        /* 屋顶 */
        for(let uu=u-1;uu<=u+w+1;uu++)for(let k=-1;k<=4;k++){
          const v=sgn*(hw-k), P0=H(uu,v);
          const d=Math.min(k+1,4-k+1);
          put(P0[0],deckY(u)+hh+1+Math.max(0,Math.round(d*0.5)),P0[1],((uu+k)%3===0)?P.roofD:P.roof);
        }
        /* 悬挑水面的木构 */
        for(let uu=u;uu<=u+w;uu++){
          const P0=H(uu,sgn*(hw+1));
          for(let y=dy+3;y<=dy+hh-1;y++) put(P0[0],y,P0[1],(y===dy+3)?P.woodD:c);
          put(P0[0],dy+2,P0[1],P.woodD);
        }
        u+=w+ri(0,1);
      }
      /* 中央敞廊：柱 + 拱 + 栏杆 */
      for(let u=gap0;u<=gap1;u++){
        const dy=deckY(u), P0=H(u,sgn*hw);
        put(P0[0],dy+1,P0[1],P.traver);
        if(((u-gap0)%3)===0){ for(let y=dy+2;y<=dy+7;y++) put(P0[0],y,P0[1],P.traver); }
        else if(u>gap0&&u<gap1){ put(P0[0],dy+2,P0[1],P.marbleD); put(P0[0],dy+6,P0[1],P.traver2); put(P0[0],dy+7,P0[1],P.traver); }
        put(P0[0],dy+8,P0[1],P.traver2);
        const P1=H(u,sgn*(hw-1));
        put(P1[0],deckY(u)+8,P1[1],P.traver2);
      }
    }
    /* 瓦萨里走廊：东侧连续拱窗长廊 */
    for(let u=a;u<=b;u++){
      const dy=deckY(u);
      for(let y=dy+12;y<=dy+16;y++){
        const P0=H(u,hw), P1=H(u,hw-1);
        const c=(y===dy+12)?P.serena:((((u%4)+4)%4===2&&y<dy+16)?P.glass:P.ochre);
        put(P0[0],y,P0[1],c); put(P1[0],y,P1[1],(y===dy+12)?P.serena:P.ochre);
      }
      for(let k=-1;k<=2;k++){ const P0=H(u,hw-k+1);
        put(P0[0],deckY(u)+17,P0[1],((u+k)%3===0)?P.roofD:P.roof); }
    }
  }

  /* —— 里亚托桥：对称白石店铺两列 + 中央券廊 + 石栏 —— */
  if(style==='rialto'){
    const g0=Math.round(mid-4), g1=Math.round(mid+4);
    for(const sgn of[-1,1]){
      for(let u=a+4;u<=b-4;u++){
        if(u>=g0&&u<=g1) continue;
        const dy=deckY(u), hh=7;
        for(let k=0;k<=3;k++){
          const v=sgn*(hw-k), P0=H(u,v), X=P0[0], Z=P0[1];
          for(let y=dy+1;y<=dy+hh;y++){
            let c=null;
            if(k===0||k===3) c=P.marble;
            if(k===3&&y>=dy+2&&y<=dy+4&&((u%3)+3)%3===1) c=P.dark;
            if(k===0&&y>=dy+3&&y<=dy+4&&((u%3)+3)%3===1) c=P.glass;
            if(y===dy+1) c=P.marbleD;
            if(y===dy+hh) c=((u+k)%3===0)?P.roofD:P.roof;
            if(c!=null) put(X,y,Z,c);
          }
        }
        for(let k=-1;k<=4;k++){
          const P0=H(u,sgn*(hw-k));
          put(P0[0],deckY(u)+hh+1,P0[1],((u+k)%4===0)?P.roofD:P.roof);
        }
      }
      /* 端头台阶栏杆 */
      for(let u=a;u<a+5;u++) rail(u);
      for(let u=b-4;u<=b;u++) rail(u);
    }
    /* 中央券廊 */
    for(let u=g0;u<=g1;u++){
      const dy=deckY(u);
      for(const v of[-hw,hw]){
        const P0=H(u,v);
        if(((u-g0)%4)===0){ for(let y=dy+1;y<=dy+7;y++) put(P0[0],y,P0[1],P.marble); }
        else { put(P0[0],dy+1,P0[1],P.marbleD);
          if(((u-g0)%2)===1) put(P0[0],dy+2,P0[1],P.marble);
          for(let y=dy+6;y<=dy+7;y++) put(P0[0],y,P0[1],P.marble); }
        put(P0[0],dy+8,P0[1],P.marbleD);
      }
      for(let v=-hw;v<=hw;v++){ const P0=H(u,v); put(P0[0],deckY(u)+9,P0[1],((u+v)%3===0)?P.roofD:P.roof); }
    }
  }
  return {a:(axis==='x')?cx+a:cz+a, b:(axis==='x')?cx+b:cz+b, top:top};
}
/* 在给定点附近吸附到真实河道上再建桥；找不到合适水面就不建 */
function bridgeNear(x,z,axis,W,style,rad){
  rad=rad||24;
  for(let d=0;d<=rad;d++){
    const offs=(d===0)?[0]:[-d,d];
    for(const s of offs){
      const px=(axis==='x')?x:x+s, pz=(axis==='x')?z+s:z;
      if(!isWater(px,pz)) continue;
      let a=0,b=0;
      while(a>-40&&isWater((axis==='x')?px+a:px,(axis==='x')?pz:pz+a)) a--;
      while(b<40&&isWater((axis==='x')?px+b:px,(axis==='x')?pz:pz+b)) b++;
      const wdt=b-a-1;
      if(wdt<4||wdt>34) continue;
      const eax=(axis==='x')?px+a-2:px, eaz=(axis==='x')?pz:pz+a-2;
      const ebx=(axis==='x')?px+b+2:px, ebz=(axis==='x')?pz:pz+b+2;
      if(isWater(eax,eaz)||isWater(ebx,ebz)) continue;
      if(!inW(eax,eaz)||!inW(ebx,ebz)) continue;
      return bridge(px,pz,axis,W,style);
    }
  }
  return null;
}
/* 石砌驳岸 */
function quayWalls(){
  at(0,0,0);
  for(let z=-GO+1;z<GO-1;z++)for(let x=-GO+1;x<GO-1;x++){
    if(gget(x,z)!==3) continue;
    let edge=false;
    for(let d=1;d<=2&&!edge;d++) if(gget(x+d,z)===5||gget(x-d,z)===5||gget(x,z+d)===5||gget(x,z-d)===5) edge=true;
    if(!edge) continue;
    for(let y=-4;y<=0;y++) put(x,y,z,(y===0)?(((x+z)&1)?P.traver:P.traver2):rustic(x,y,P.stone,P.stoneD));
  }
}

/* 城墙：遇地标跳过，遇水改建船闸 */
function waterGate(a,b){
  const mid=(a+b)/2, span=Math.max(4,b-a), deck=13;
  for(const t of [a-6,b+2]){
    walls(t,-4,t+4,6,1,21,(u,y)=>rustic(u,y,P.stone,P.stoneD));
    slab(t,-4,t+4,6,21,P.stoneD); merlons(t,-4,t+4,6,22,P.stone,true);
    for(let y=7;y<=17;y+=5) for(let x=t+1;x<=t+3;x++){ put(x,y,-4,P.dark); put(x,y,6,P.dark); }
    for(let y=1;y<=3;y++) put(t+2,y,-4,P.dark);
  }
  for(let u=a-5;u<=b+1;u++){
    const tt=(u-mid)/(span/2+0.001), arch=Math.round((1-Math.min(1,tt*tt))*9);
    for(let z=-1;z<=3;z++){
      for(let y=deck;y>=-5;y--){ if(y<arch&&y>=-2) continue; put(u,y,z,rustic(u,y,P.stone,P.stoneD)); }
    }
    put(u,deck+1,-1,P.stone); put(u,deck+1,3,P.stone);
    if(((u%4)+4)%4<2){ put(u,deck+2,-1,P.stone); put(u,deck+2,3,P.stone); }
    if(Math.abs(u-mid)<span*0.34) for(let y=-1;y<=arch-1;y++) if(((u+y)&1)===0) put(u,y,1,P.dark);
  }
  /* 闸室与木闸门 */
  for(const uu of [a-6,b+2]) for(let z=-16;z<=18;z++){
    if(z>=-4&&z<=6) continue;
    for(let y=-4;y<=1;y++) put(uu+2,y,z,rustic(z,y,P.stone,P.stoneD));
    put(uu+2,2,z,P.traver2);
  }
  for(const gz of [-13,15]) for(let u=a-4;u<=b;u++) for(let y=-4;y<=2;y++)
    put(u,y,gz,(y===2)?P.woodD:((u+y)%2?P.wood:P.woodD));
  for(const gz of [-13,15]) for(let u=a-4;u<=b;u++) put(u,3,gz,P.bronze);
  /* 闸官小屋 */
  at2(a-6,10); 
}

function wallRun(len,gateAt){
  let wf=-1;

    const w0=world(u,1), g=gget(w0[0],w0[1]);
    if(g===6){ if(wf>=0){ waterGate(wf,u-1); wf=-1; } continue; }
    if(g===5){ if(wf<0) wf=u; continue; }
    if(wf>=0){ waterGate(wf,u-1); wf=-1; }
    const gate=gateAt>=0&&Math.abs(u-gateAt)<=4;
    for(let z=0;z<=2;z++)for(let y=1;y<=13;y++){
      if(gate&&gothicArch(u-gateAt,y-1,4,7)) continue;
      put(u,y,z,rustic(u,y,P.stone,P.stoneD));

    if(((u%46)+46)%46===0){

      slab(u-3,-2,u+3,4,20,P.stoneD); merlons(u-3,-2,u+3,4,21,P.stone,true);

  if(gateAt>=0){

    walls(gateAt+5,-3,gateAt+7,5,1,22,(u,y)=>rustic(u,y,P.stone,P.stoneD));

      if(!gothicArch(x-gateAt,y-1,4,7)) put(x,y,1,P.dark);
  }
}

function teatro(r){
  BUILD++;
  for(let dx=-r-2;dx<=r+2;dx++)for(let dz=-r-2;dz<=r+2;dz++){
    const dd=Math.hypot(dx,dz);
    if(dz<-1) continue;
    if(dd>r+2) continue;
    if(dd>r-1){ for(let y=1;y<=Math.round(r*0.7);y++) put(dx,y,dz,rustic(dx+dz,y,P.traver,P.traver2)); continue; }
    if(dd<r*0.42) { put(dx,1,dz,((dx+dz)&1)?P.traver2:P.stoneD); continue; }
    const t=(dd-r*0.42)/(r*0.58), y=1+Math.round(t*(r*0.55));
    put(dx,y,dz,((Math.round(dd)&1)?P.traver:P.traver2)); put(dx,y-1,dz,P.stoneD);
  }
  for(let dx=-r;dx<=r;dx++)for(let y=1;y<=Math.round(r*0.85);y++){
    const m=((dx%4)+4)%4;
    if(m===0||y>Math.round(r*0.85)-2) put(dx,y,-2,rustic(dx,y,P.traver,P.traver2));
    else if(y<=6&&m===2) put(dx,y,-2,P.dark);
  }
  for(let dx=-r;dx<=r;dx++) put(dx,Math.round(r*0.85)+1,-2,P.marbleD);
  for(const sx of[-Math.round(r*0.5),0,Math.round(r*0.5)]){
    for(let y=1;y<=5;y++) put(sx,y,-1,P.marble); put(sx,6,-1,P.marbleD);
  }
}

const navEl=document.getElementById('nav'), navList=document.getElementById('navList');
document.getElementById('navTgl').onclick=()=>navEl.classList.toggle('fold');
let NAVITEMS=[];
function buildNav(){
  navList.innerHTML='';
  NAVITEMS=[];
  for(const g of NAVG){
    let head=null;
    for(const nm of g.items){
      let idx=-1;
      for(let i=0;i<MARKS.length;i++) if(MARKS[i].name===nm){ idx=i; break; }
      if(idx<0) continue;
      if(!head){ head=document.createElement('div'); head.className='ngrp';
        head.textContent=(LANG==='zh')?(g.zh+' · '+g.en):g.en; navList.appendChild(head); }
      const m=MARKS[idx], info=INFO[nm]||{};
      const d=document.createElement('div'); d.className='nitem';
      const b=document.createElement('b'); b.textContent=(LANG==='zh')?nm:(info.en2||m.en);
      const s=document.createElement('i'); s.textContent=m.en;
      const p=document.createElement('p'); p.textContent=(LANG==='zh')?(info.zh||''):(info.en||'');
      d.appendChild(b); d.appendChild(s); d.appendChild(p);
      d.onclick=()=>{ if(tour){tour=false;bTour.classList.remove('on');} goTo(idx); };
      navList.appendChild(d);
      NAVITEMS.push({idx:idx,el:d});
    }
  }
  syncNav();
}
function syncNav(){
  for(const it of NAVITEMS){
    const on=(it.idx===vi);
    it.el.classList.toggle('on',on);
    if(on&&it.el.scrollIntoView) it.el.scrollIntoView({block:'nearest'});
  }
}

  const list2=document.querySelectorAll('[data-i18n-html]');
  for(let i=0;i<list2.length;i++){ const k=list2[i].dataset.i18nHtml; if(D[k]!=null) list2[i].innerHTML=D[k]; }
  document.title=D.title;
  const ld=document.querySelector('#load .s'); if(ld) ld.textContent=D.loading;

    pl.querySelector('b').textContent=(LANG==='zh')?m.name:(info.en2||m.en); }
  apply();

/* ==================================================================
   17. 主循环
   ================================================================== */
let prog=0, building=true, last=performance.now(), started=false, REFL=true, frames=0, acc=0;
const tmpV=new THREE.Vector3(), tmpT=new THREE.Vector3();
function renderReflection(){
  if(!REFL||camera.position.y<=WY+0.5){ wU.reflAmt.value=0; return; }
  wU.reflAmt.value=(WX[WI].rain?0.72:0.94);
  tmpV.copy(camera.position); tmpV.y=2*WY-tmpV.y;
  camera.getWorldDirection(tmpT); tmpT.add(camera.position); tmpT.y=2*WY-tmpT.y;
  refCam.position.copy(tmpV); refCam.up.set(0,-1,0); refCam.lookAt(tmpT);
  refCam.fov=camera.fov; refCam.aspect=camera.aspect; refCam.near=camera.near; refCam.far=camera.far;
  refCam.updateProjectionMatrix(); refCam.updateMatrixWorld(true);
  texM.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
  texM.multiply(refCam.projectionMatrix); texM.multiply(refCam.matrixWorldInverse);
  water.visible=false; rain.visible=false; glow.visible=false;
  renderer.setRenderTarget(refRT); renderer.clear(); renderer.render(scene,refCam);
  renderer.setRenderTarget(null);
  water.visible=true; rain.visible=!!WX[WI].rain; glow.visible=true;
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const time=now*0.001;
  if(building){ prog+=dt*0.42; if(prog>=1.2){prog=1.2;building=false;} }
  BU.value=prog;
  wU.t.value=time; sU.t.value=time; rainU.t.value=time;
  if(tour){ tourT+=dt; if(tourT>9) goTo(vi+1); }
  if(goal){
    let done=true;
    for(const k of ['th','ph','d','tx','ty','tz']){
      const df=goal[k]-cam[k];
      if(Math.abs(df)>0.003) done=false;
      cam[k]+=df*Math.min(1,dt*2.2);
    }
    if(done) goal=null;
  } else if(auto&&!drag) cam.th+=dt*0.022;
  const sp=Math.sin(cam.ph);
  camera.position.set(cam.tx+cam.d*sp*Math.sin(cam.th),Math.max(WY+2,cam.ty+cam.d*Math.cos(cam.ph)),cam.tz+cam.d*sp*Math.cos(cam.th));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
  wU.cam.value.copy(camera.position);
  rainU.org.value.copy(camera.position);
  const ss=Math.max(110,Math.min(340,cam.d*0.62));
  const sc2=sun.shadow.camera;
  if(sc2.right!==ss){ sc2.left=-ss;sc2.right=ss;sc2.top=ss;sc2.bottom=-ss;sc2.updateProjectionMatrix(); }
  sun.target.position.set(cam.tx,0,cam.tz);
  sun.position.copy(sun.target.position).addScaledVector(sunDir,900);
  updateAgents(dt,time);
  sun.shadow.needsUpdate=true;
  renderReflection();
  renderer.render(scene,camera);
  frames++; acc+=dt;
  if(frames===70){
    const fps=frames/acc;
    if(fps<19){ REFL=false; wU.reflAmt.value=0.18; SM=1024; sun.shadow.mapSize.set(SM,SM);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
      PR=Math.min(devicePixelRatio,1.2); renderer.setPixelRatio(PR);
    } else if(fps<30){ RS=[Math.floor(RS[0]*0.75),Math.floor(RS[1]*0.75)]; refRT.setSize(RS[0],RS[1]); }
  }
  if(!started){ started=true; setTimeout(()=>document.getElementById('load').classList.add('hide'),400); }
}
requestAnimationFrame(frame);
