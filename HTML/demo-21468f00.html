<body>
  <main id="app">
    <canvas id="world" aria-label="玻璃罩下的四季微缩小岛，可旋转与缩放" tabindex="0"></canvas>
    <header class="masthead">
      <div class="wordmark"><span class="edition">MICROSCAPES / COLLECTION 001</span><h1>四时屿<span class="title-dot">.</span></h1><span class="english-title">FOUR SEASONS</span></div>
      <div class="mode-switch" role="group" aria-label="季节模式">
        <button id="temporal" class="mode active" aria-pressed="true"><i data-lucide="orbit"></i><span>时序流转</span></button>
        <button id="spatial" class="mode" aria-pressed="false"><i data-lucide="grid-2x2"></i><span>四季同框</span></button>
      </div>
      <div class="performance" aria-label="渲染性能">
        <div class="perf-top"><span class="live-dot"></span><span id="renderer-label">WEBGL</span><span class="fps"><b id="fps">--</b> FPS</span></div>
        <div id="gpu" class="gpu" title="GPU 信息读取中">GPU · 读取中</div>
        <div class="frame-meter" aria-hidden="true"><span id="frame-bar"></span></div>
      </div>
    </header>
    <aside class="scene-tools" aria-label="视图工具">
      <button id="rotate" class="icon-button" aria-label="自动旋转" aria-pressed="false" data-tip="自动旋转"><i data-lucide="rotate-3d"></i></button>
      <button id="reset" class="icon-button" aria-label="重置视角" data-tip="重置视角"><i data-lucide="focus"></i></button>
      <button id="fullscreen" class="icon-button" aria-label="全屏" data-tip="全屏"><i data-lucide="maximize"></i></button>
    </aside>
    <section class="season-caption" aria-label="当前季节">
      <div class="caption-line"><span id="season-index">01</span><span class="caption-rule"></span><span id="season-english">SPRING</span></div>
      <div id="season-name">春生</div>
      <div class="season-date"><span id="season-detail">万物初醒</span><span class="date-separator">/</span><span id="day">第 001 日</span></div>
    </section>
    <footer class="bottom-ui">
      <div class="timeline-label"><span id="timeline-title">一年，一座岛</span><span id="cycle-label">144 s / 年</span></div>
      <div class="transport">
        <button id="play" class="icon-button play-button" aria-label="暂停时间" aria-pressed="false" data-tip="暂停时间"><i data-lucide="pause"></i></button>
        <div class="timeline">
          <input id="season-slider" type="range" min="0" max="4000" step="1" value="0" aria-label="四季时间" aria-valuetext="春">
          <div class="season-stops" aria-label="选择季节">
            <button data-season="0" class="season-stop active"><span class="swatch spring"></span>春</button>
            <button data-season="1" class="season-stop"><span class="swatch summer"></span>夏</button>
            <button data-season="2" class="season-stop"><span class="swatch autumn"></span>秋</button>
            <button data-season="3" class="season-stop"><span class="swatch winter"></span>冬</button>
          </div>
        </div>
        <label class="speed-control"><span class="sr-only">时间速度</span><select id="speed" aria-label="时间速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
        <span class="control-divider"></span>
        <button id="snow" class="icon-button" aria-label="卷起飞雪" data-tip="卷起飞雪"><i data-lucide="snowflake"></i></button>
        <button id="motion" class="icon-button" aria-label="启用摇一摇" aria-pressed="false" data-tip="启用摇一摇" hidden><i data-lucide="smartphone"></i></button>
      </div>
    </footer>
    <div class="corner-note"><span class="status-dot"></span><span>微缩自然 · Nº 001</span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="loading" class="loading"><span class="loading-mark"></span><span>四季正在苏醒</span></div>
    <section id="error" class="error" role="alert" hidden><h2>无法开启这座小岛</h2><p id="error-text"></p><button id="retry">重新加载</button></section>
    <noscript><div class="error">请启用 JavaScript 后打开小岛。</div></noscript>
  </main>
