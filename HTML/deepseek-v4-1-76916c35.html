<script>
/* ===== cube.js ===== */
/* =========================================================================
 * cube.js — 三阶魔方核心模型
 *  - 贴纸(facelet)模型由几何自动推导，保证转动定义与 3D 渲染完全一致
 *  - 由贴纸模型自动推导角块/棱块(cubie)模型与所有转动的置换表
 *  - 求解器使用的紧凑状态表示 Uint8Array(20) = [cp(8), co(8), ep(12), eo(12)]
 * ========================================================================= */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CubeCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------------- 几何定义 ---------------- */
  // 每个面: n = 外法线, t1 = 行方向(行号增大), t2 = 列方向(列号增大), 满足 t1 × t2 = n
  var FACE_DEFS = [
    { name: 'U', n: [0, 1, 0], t1: [0, 0, 1], t2: [1, 0, 0] },
    { name: 'R', n: [1, 0, 0], t1: [0, -1, 0], t2: [0, 0, -1] },
    { name: 'F', n: [0, 0, 1], t1: [0, -1, 0], t2: [1, 0, 0] },
    { name: 'D', n: [0, -1, 0], t1: [0, 0, -1], t2: [1, 0, 0] },
    { name: 'L', n: [-1, 0, 0], t1: [0, -1, 0], t2: [0, 0, 1] },
    { name: 'B', n: [0, 0, -1], t1: [0, -1, 0], t2: [-1, 0, 0] }
  ];
  var FACE_INDEX = { U: 0, R: 1, F: 2, D: 3, L: 4, B: 5 };
  var FACE_NAMES = ['U', 'R', 'F', 'D', 'L', 'B'];

  // 贴纸索引: face*9 + row*3 + col
  // 贴纸几何中心 (单位 = 半格, 表面坐标 ±1.5)
  var STICKER_POS = [];   // [54] -> [x,y,z]
  var STICKER_NRM = [];   // [54] -> [x,y,z]
  var STICKER_FACE = [];  // [54] -> 0..5
  var STICKER_RC = [];    // [54] -> [row,col]
  var STICKER_KEY = [];   // [54] -> 数值键(位置+法线)

  // 坐标编码: -1.5,-1,0,1,1.5 -> 唯一整数
  function icoord(v) { return Math.round(v * 2) + 3; }
  function keyOf(p, n) {
    var ni = (n[0] === 1 ? 1 : n[0] === -1 ? 2 : n[1] === 1 ? 3 : n[1] === -1 ? 4 : n[2] === 1 ? 5 : 0);
    return ((icoord(p[0]) * 3 + icoord(p[1])) * 3 + icoord(p[2])) * 6 + ni;
  }

  (function buildStickers() {
    for (var f = 0; f < 6; f++) {
      var d = FACE_DEFS[f];
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          var i = f * 9 + r * 3 + c;
          var p = [
            d.n[0] * 1.5 + (r - 1) * d.t1[0] + (c - 1) * d.t2[0],
            d.n[1] * 1.5 + (r - 1) * d.t1[1] + (c - 1) * d.t2[1],
            d.n[2] * 1.5 + (r - 1) * d.t1[2] + (c - 1) * d.t2[2]
          ];
          STICKER_POS[i] = p;
          STICKER_NRM[i] = d.n.slice();
          STICKER_FACE[i] = f;
          STICKER_RC[i] = [r, c];
          STICKER_KEY[i] = keyOf(p, d.n);
        }
      }
    }
  })();

  function keyToSticker() {
    var m = {};
    for (var i = 0; i < 54; i++) m[STICKER_KEY[i]] = i;
    return m;
  }
  var KEY_TO_STICKER = keyToSticker();

  // 每个贴纸所属 cubie 的中心坐标 (表面 ±1.5 -> ±1)
  var STICKER_CUBIE_POS = STICKER_POS.map(function (q) {
    return q.map(function (v) { return Math.abs(v) === 1.5 ? (v > 0 ? 1 : -1) : v; });
  });


  /* ---------------- 旋转工具 ---------------- */
  // 绕坐标轴 +90° (右手定则): axis 0=x,1=y,2=z
  function rot90(v, axis) {
    var x = v[0], y = v[1], z = v[2];
    if (axis === 0) return [x, -z, y];
    if (axis === 1) return [z, y, -x];
    return [-y, x, z];
  }
  function rot90n(v, axis, times) {
    var out = v.slice();
    for (var i = 0; i < ((times % 4) + 4) % 4; i++) out = rot90(out, axis);
    return out;
  }

  /* ---------------- 转动定义 ---------------- */
  // 面转动: 顺时针(从外侧看) = 绕外法线 -90°
  // 中层转动: M = 绕 +x +90°, E = 绕 +y +90°, S = 绕 +z -90°
  var MOVE_DEFS = [];
  (function buildMoveDefs() {
    var faces = [
      { name: 'U', axis: 1, sign: -1, layer: 1 },
      { name: 'D', axis: 1, sign: 1, layer: -1 },
      { name: 'R', axis: 0, sign: -1, layer: 1 },
      { name: 'L', axis: 0, sign: 1, layer: -1 },
      { name: 'F', axis: 2, sign: -1, layer: 1 },
      { name: 'B', axis: 2, sign: 1, layer: -1 }
    ];
    for (var i = 0; i < faces.length; i++) {
      var f = faces[i];
      // 该层所有贴纸: 坐标沿 axis 等于 layer*1.5
      MOVE_DEFS.push({ name: f.name, axis: f.axis, sign: f.sign, layer: f.layer, kind: 'face', quarter: 1 });
      MOVE_DEFS.push({ name: f.name + '2', axis: f.axis, sign: f.sign, layer: f.layer, kind: 'face', quarter: 2 });
      MOVE_DEFS.push({ name: f.name + "'", axis: f.axis, sign: f.sign, layer: f.layer, kind: 'face', quarter: 3 });
    }
    var slices = [
      { name: 'M', axis: 0, sign: 1, layer: 0 },
      { name: 'E', axis: 1, sign: 1, layer: 0 },
      { name: 'S', axis: 2, sign: -1, layer: 0 }
    ];
    for (var j = 0; j < slices.length; j++) {
      var s = slices[j];
      MOVE_DEFS.push({ name: s.name, axis: s.axis, sign: s.sign, layer: s.layer, kind: 'slice', quarter: 1 });
      MOVE_DEFS.push({ name: s.name + '2', axis: s.axis, sign: s.sign, layer: s.layer, kind: 'slice', quarter: 2 });
      MOVE_DEFS.push({ name: s.name + "'", axis: s.axis, sign: s.sign, layer: s.layer, kind: 'slice', quarter: 3 });
    }
    // 宽层转动 (两层): r 同 R 方向, l 同 L, f 同 F, b 同 B, u 同 U, d 同 D
    var wides = [
      { name: 'r', axis: 0, sign: -1, layer: 1 },
      { name: 'l', axis: 0, sign: 1, layer: -1 },
      { name: 'u', axis: 1, sign: -1, layer: 1 },
      { name: 'd', axis: 1, sign: 1, layer: -1 },
      { name: 'f', axis: 2, sign: -1, layer: 1 },
      { name: 'b', axis: 2, sign: 1, layer: -1 }
    ];
    for (var w = 0; w < wides.length; w++) {
      var wd = wides[w];
      MOVE_DEFS.push({ name: wd.name, axis: wd.axis, sign: wd.sign, layer: wd.layer, kind: 'wide', quarter: 1 });
      MOVE_DEFS.push({ name: wd.name + '2', axis: wd.axis, sign: wd.sign, layer: wd.layer, kind: 'wide', quarter: 2 });
      MOVE_DEFS.push({ name: wd.name + "'", axis: wd.axis, sign: wd.sign, layer: wd.layer, kind: 'wide', quarter: 3 });
    }
    // 整体旋转: x 同 R, y 同 U, z 同 F (会带动中心块)
    var rots = [
      { name: 'x', axis: 0, sign: -1 },
      { name: 'y', axis: 1, sign: -1 },
      { name: 'z', axis: 2, sign: -1 }
    ];
    for (var r = 0; r < rots.length; r++) {
      var rt = rots[r];
      MOVE_DEFS.push({ name: rt.name, axis: rt.axis, sign: rt.sign, layer: 0, kind: 'rotation', quarter: 1 });
      MOVE_DEFS.push({ name: rt.name + '2', axis: rt.axis, sign: rt.sign, layer: 0, kind: 'rotation', quarter: 2 });
      MOVE_DEFS.push({ name: rt.name + "'", axis: rt.axis, sign: rt.sign, layer: 0, kind: 'rotation', quarter: 3 });
    }
  })();

  var MOVE_NAME_TO_ID = {};
  for (var mi = 0; mi < MOVE_DEFS.length; mi++) MOVE_NAME_TO_ID[MOVE_DEFS[mi].name] = mi;

  // 每个转动对应的贴纸置换 map[i] = 目标索引
  // 注意: 层的判定必须用 cubie 中心坐标, 不能用贴纸表面坐标
  // (例如 U 层的贴纸有的在 y=1.5 的顶面, 有的在 y=1 的侧面)
  function buildFaceletPerm(def) {
    var map = new Array(54);
    var turns = def.quarter;
    var whole = (def.kind === 'rotation');
    for (var i = 0; i < 54; i++) {
      var p = STICKER_POS[i], n = STICKER_NRM[i];
      var cubieCoord = STICKER_CUBIE_POS[i][def.axis];
      // 真实魔方的核心在该轴上具有四重对称性: 中层/宽层转动会带着这一层的
      // 中心块一起转 (面转动则让该面中心块原地自转)
      if (def.kind === 'wide') {
        if (cubieCoord !== def.layer && cubieCoord !== 0) { map[i] = i; continue; }
      } else if (!whole && cubieCoord !== def.layer) { map[i] = i; continue; }
      // 绕 axis 旋转 sign * 90° * turns  (sign 已包含方向)
      var total = ((def.sign * turns) % 4 + 4) % 4;
      var p2 = rot90n(p, def.axis, total);
      var n2 = rot90n(n, def.axis, total);
      var j = KEY_TO_STICKER[keyOf(p2, n2)];
      if (j === undefined) throw new Error('facelet perm lookup failed for ' + def.name + ' sticker ' + i);

  const LSE_SLOTS = [0, 1, 2, 3, 4, 6];

  const LSE_U_QUARTERS = { M: 0, M2: 0, "M'": 0, U: 1, U2: 2, "U'": 3 };

    if (solutionCache[key]) return solutionCache[key].slice();
    const res = verifiedSearch(table, start, goal, pairMove, groups, 14, nodeLimit || 6000000, flat);
    if (res) solutionCache[key] = res.slice();
    return res;

    return res;

  function solveCFOP(state) {
    const t0 = Date.now();
    const steps = [];
    let flat = toFlat(state);
    if (C.isSolved(state)) return { method: 'CFOP', steps: [], moves: [], time: 0 };

    // 1) 十字

layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec4 aM0;
layout(location=3) in vec4 aM1;
layout(location=4) in vec4 aM2;
layout(location=5) in vec4 aM3;
uniform mat4 uViewProj;
uniform float uOutline;
out vec3 vNormal;
out vec3 vWorld;
void main() {
  mat4 model = mat4(aM0, aM1, aM2, aM3);
  vec3 wp = (model * vec4(aPos, 1.0)).xyz;
  vec3 n = normalize(mat3(model) * aNormal);
  wp += n * uOutline;
  vNormal = n;
  vWorld = wp;
  gl_Position = uViewProj * vec4(wp, 1.0);
}`;

  const FS_BODY = `#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vWorld;
uniform vec3 uLightDir;
uniform vec3 uCamera;
uniform vec3 uBaseColor;
uniform float uOutline;
out vec4 fragColor;
void main() {
  if (uOutline > 0.0001) { fragColor = vec4(0.05, 0.055, 0.075, 1.0); return; }
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamera - vWorld);
  vec3 L = normalize(uLightDir);
  float ndl = dot(N, L);
  float band = ndl > 0.42 ? 1.0 : (ndl > -0.02 ? 0.76 : 0.56);
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  float top = 0.5 + 0.5 * N.y;
  vec3 col = uBaseColor * (0.60 + 0.40 * band) * (0.92 + 0.08 * top);
  col += vec3(0.55, 0.72, 1.0) * rim * 0.30;
  fragColor = vec4(col, 1.0);
}`;

  const VS_STICKER = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aUv;
layout(location=3) in vec4 aM0;
layout(location=4) in vec4 aM1;
layout(location=5) in vec4 aM2;
layout(location=6) in vec4 aM3;
layout(location=7) in vec3 aColor;
uniform mat4 uViewProj;
out vec3 vNormal;
out vec3 vWorld;
out vec2 vUv;
out vec3 vColor;
void main() {
  mat4 model = mat4(aM0, aM1, aM2, aM3);
  vec3 wp = (model * vec4(aPos, 1.0)).xyz;
  vNormal = normalize(mat3(model) * aNormal);
  vWorld = wp;
  vUv = aUv;
  vColor = aColor;
  gl_Position = uViewProj * vec4(wp, 1.0);
}`;

  const FS_STICKER = `#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vWorld;
in vec2 vUv;
in vec3 vColor;
uniform vec3 uLightDir;
uniform vec3 uCamera;
out vec4 fragColor;
void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(uCamera - vWorld);
  vec3 L = normalize(uLightDir);
  float ndl = dot(N, L);
  float band = ndl > 0.42 ? 1.0 : (ndl > -0.02 ? 0.80 : 0.64);

  // 圆角方形 SDF (墨线边框)
  vec2 q = abs(vUv) - vec2(0.62);
  float d = length(max(q, vec2(0.0))) + min(max(q.x, q.y), 0.0) - 0.18;
  float aa = fwidth(d) * 1.2;
  float shape = 1.0 - smoothstep(-aa, aa, d);
  float ink = smoothstep(-0.115, -0.035, d);
  float hl = smoothstep(-0.20, -0.14, d) * (1.0 - smoothstep(-0.14, -0.10, d));

  vec3 base = vColor * (0.72 + 0.28 * band);
  // 轻微的内渐变, 更像赛璐璐上色
  base *= 0.94 + 0.10 * (1.0 - clamp(length(vUv * 0.9), 0.0, 1.0));
  vec3 col = mix(base, vec3(0.06, 0.07, 0.10), ink);
  col += vec3(0.30, 0.34, 0.40) * hl * 0.5;
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  col += vec3(0.6, 0.75, 1.0) * rim * 0.12;
  fragColor = vec4(col, shape);
}`;

  const VS_SHADOW = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aUv;
uniform mat4 uViewProj;
out vec2 vUv;
void main() {
  vUv = aUv;
  gl_Position = uViewProj * vec4(aPos, 1.0);
}`;

  const FS_SHADOW = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float r = length(vUv * 2.0 - 1.0);
  float a = smoothstep(1.0, 0.15, r) * 0.42;
  fragColor = vec4(0.05, 0.07, 0.13, a);
}`;

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error('着色器编译失败: ' + gl.getShaderInfoLog(s) + '\n' + src);
    }
    return s;
  }
  function program(gl, vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('着色器链接失败: ' + gl.getProgramInfoLog(p));
    }
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace(/\[0\]$/, '');
      uniforms[name] = gl.getUniformLocation(p, name);
    }
    return { program: p, u: uniforms };
  }

  const VS_SOLID = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=3) in vec4 aM0;
layout(location=4) in vec4 aM1;
layout(location=5) in vec4 aM2;
layout(location=6) in vec4 aM3;
uniform mat4 uViewProj;
void main() {
  mat4 model = mat4(aM0, aM1, aM2, aM3);
  gl_Position = uViewProj * model * vec4(aPos, 1.0);
}`;
  const FS_SOLID = `#version 300 es
precision highp float;
out vec4 fragColor;
void main() { fragColor = vec4(1.0, 0.0, 1.0, 1.0); }`;

  function createRenderer(canvas) {
    const gl = canvas.getContext('webgl2', {
      alpha: true, antialias: true, depth: true, premultipliedAlpha: false,
      preserveDrawingBuffer: false, powerPreference: 'high-performance'
    });
    if (!gl) throw new Error('当前环境不支持 WebGL2');

    const progBody = program(gl, VS_BODY, FS_BODY);
    const progSticker = program(gl, VS_STICKER, FS_STICKER);
    const progShadow = program(gl, VS_SHADOW, FS_SHADOW);
    const progSolid = program(gl, VS_SOLID, FS_SOLID);

    // ---- 几何 ----
    const box = GEO.roundedBox(0.5, 0.09, 5);
    const boxPos = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, boxPos);
    gl.bufferData(gl.ARRAY_BUFFER, box.positions, gl.STATIC_DRAW);
    const boxNrm = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, boxNrm);
    gl.bufferData(gl.ARRAY_BUFFER, box.normals, gl.STATIC_DRAW);
    const boxIdx = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, boxIdx);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, box.indices, gl.STATIC_DRAW);

    const quad = GEO.stickerQuad(1.0);
    const quadPos = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadPos);
    gl.bufferData(gl.ARRAY_BUFFER, quad.positions, gl.STATIC_DRAW);
    const quadNrm = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadNrm);
    gl.bufferData(gl.ARRAY_BUFFER, quad.normals, gl.STATIC_DRAW);
    const quadUv = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadUv);
    gl.bufferData(gl.ARRAY_BUFFER, quad.uvs, gl.STATIC_DRAW);

    const disc = GEO.shadowDisc(1.0);
    const discPos = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, discPos);
    gl.bufferData(gl.ARRAY_BUFFER, disc.positions, gl.STATIC_DRAW);
    const discUv = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, discUv);
    gl.bufferData(gl.ARRAY_BUFFER, disc.uvs, gl.STATIC_DRAW);

    // ---- 实例缓冲 ----
    const MAX_INST = 128;
    const bodyMat = gl.createBuffer();
    const stickerMat = gl.createBuffer();
    const stickerCol = gl.createBuffer();
    const bodyData = new Float32Array(MAX_INST * 16);
    const stickerData = new Float32Array(MAX_INST * 16);
    const stickerColors = new Float32Array(MAX_INST * 3);

    // 统一属性绑定: 始终显式设置 divisor, 避免不同 pass 之间互相污染
    function setAttrib(loc, buffer, size, divisor, stride, offset) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride || 0, offset || 0);
      gl.vertexAttribDivisor(loc, divisor || 0);
    }
    function bindInstancedMat(locBase, buffer) {
      for (let i = 0; i < 4; i++) {
        setAttrib(locBase + i, buffer, 4, 1, 64, i * 16);
      }
    }

    const debug = { noCull: false, noDepth: false, skipBodies: false, skipOutline: false, stickerNoDepth: false, solidStickers: false };
    const camera = { theta: -0.62, phi: 1.05, dist: 9.6, target: [0, 0, 0], fov: 0.72 };
    const proj = GL.mat4(), view = GL.mat4(), viewProj = GL.mat4();
    const eye = [0, 0, 0];
    let width = 1, height = 1;

    function updateCamera() {
      const sp = Math.sin(camera.phi), cp = Math.cos(camera.phi);
      eye[0] = camera.target[0] + camera.dist * sp * Math.sin(camera.theta);
      eye[1] = camera.target[1] + camera.dist * cp;
      eye[2] = camera.target[2] + camera.dist * sp * Math.cos(camera.theta);
      GL.perspective(proj, camera.fov, width / Math.max(1, height), 0.1, 100);
      GL.lookAt(view, eye, camera.target, [0, 1, 0]);
      GL.multiply(viewProj, proj, view);
    }

    function resize(cssW, cssH, dpr) {
      width = cssW; height = cssH;
      const w = Math.max(1, Math.round(cssW * dpr));
      const h = Math.max(1, Math.round(cssH * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
      gl.viewport(0, 0, w, h);
    }

    // 主渲染
    // scene: { bodies: [{m: Float32Array(16)}...], stickers: [{m, color:[r,g,b]}...] }
    function render(scene) {
      updateCamera();
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (debug.noDepth) gl.disable(gl.DEPTH_TEST); else { gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); }
      if (debug.noCull) gl.disable(gl.CULL_FACE); else gl.enable(gl.CULL_FACE);

      // --- 地面阴影 ---
      gl.useProgram(progShadow.program);
      gl.uniformMatrix4fv(progShadow.u.uViewProj, false, viewProj);
      setAttrib(0, discPos, 3, 0);
      setAttrib(1, discUv, 2, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      const sh = GL.mat4();
      GL.identity(sh);
      sh[12] = 0; sh[13] = -2.35; sh[14] = 0;
      sh[0] = 5.4; sh[5] = 5.4; sh[10] = 5.4;
      const shMvp = GL.mat4();
      GL.multiply(shMvp, viewProj, sh);
      gl.uniformMatrix4fv(progShadow.u.uViewProj, false, shMvp);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
      gl.enable(gl.CULL_FACE);

      // --- 描边 (反向外扩) ---
      if (debug.skipBodies) { gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); }
      gl.useProgram(progBody.program);
      gl.uniformMatrix4fv(progBody.u.uViewProj, false, viewProj);
      gl.uniform3fv(progBody.u.uCamera, eye);
      gl.uniform3f(progBody.u.uLightDir, 0.45, 0.86, 0.42);
      gl.uniform3f(progBody.u.uBaseColor, 0.10, 0.11, 0.145);
      gl.uniform1f(progBody.u.uOutline, 0.055);
      setAttrib(0, boxPos, 3, 0);
      setAttrib(1, boxNrm, 3, 0);
      bindInstancedMat(2, bodyMat);
      if (!debug.skipBodies) {
        if (!debug.skipOutline) {
          gl.cullFace(gl.FRONT);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, boxIdx);
          gl.drawElementsInstanced(gl.TRIANGLES, box.indices.length, gl.UNSIGNED_SHORT, 0, scene.bodies.length);
        }
        gl.cullFace(gl.BACK);
        gl.uniform1f(progBody.u.uOutline, 0.0);
        gl.drawElementsInstanced(gl.TRIANGLES, box.indices.length, gl.UNSIGNED_SHORT, 0, scene.bodies.length);
      }

      // --- 贴纸 ---
      gl.useProgram(progSticker.program);
      gl.uniformMatrix4fv(progSticker.u.uViewProj, false, viewProj);
      gl.uniform3fv(progSticker.u.uCamera, eye);
      gl.uniform3f(progSticker.u.uLightDir, 0.45, 0.86, 0.42);
      setAttrib(0, quadPos, 3, 0);
      setAttrib(1, quadNrm, 3, 0);
      setAttrib(2, quadUv, 2, 0);
      bindInstancedMat(3, stickerMat);
      setAttrib(7, stickerCol, 3, 1);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      if (debug.stickerNoDepth) gl.disable(gl.DEPTH_TEST);
      if (debug.solidStickers) {
        gl.useProgram(progSolid.program);
        gl.uniformMatrix4fv(progSolid.u.uViewProj, false, viewProj);
        setAttrib(0, quadPos, 3, 0);
        setAttrib(1, quadNrm, 3, 0);
        setAttrib(2, quadUv, 2, 0);
        bindInstancedMat(3, stickerMat);
        setAttrib(7, stickerCol, 3, 1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, scene.stickers.length);
      } else {
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, scene.stickers.length);
      }
      if (debug.stickerNoDepth) gl.enable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
    }

    function upload(scene) {
      for (let i = 0; i < scene.bodies.length; i++) bodyData.set(scene.bodies[i].m, i * 16);
      gl.bindBuffer(gl.ARRAY_BUFFER, bodyMat);
      gl.bufferData(gl.ARRAY_BUFFER, bodyData.subarray(0, scene.bodies.length * 16), gl.DYNAMIC_DRAW);
      for (let i = 0; i < scene.stickers.length; i++) {
        stickerData.set(scene.stickers[i].m, i * 16);
        stickerColors[i * 3] = scene.stickers[i].color[0];
        stickerColors[i * 3 + 1] = scene.stickers[i].color[1];
        stickerColors[i * 3 + 2] = scene.stickers[i].color[2];
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, stickerMat);
      gl.bufferData(gl.ARRAY_BUFFER, stickerData.subarray(0, scene.stickers.length * 16), gl.DYNAMIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, stickerCol);
      gl.bufferData(gl.ARRAY_BUFFER, stickerColors.subarray(0, scene.stickers.length * 3), gl.DYNAMIC_DRAW);
    }

    function screenToRay(cssX, cssY) {
      updateCamera();
      const inv = GL.mat4();
      GL.invert(inv, viewProj);
      const ndcX = (cssX / width) * 2 - 1;
      const ndcY = 1 - (cssY / height) * 2;
      const p0 = GL.transformPoint([0, 0, 0], inv, [ndcX, ndcY, -1]);
      const p1 = GL.transformPoint([0, 0, 0], inv, [ndcX, ndcY, 1]);
      const dir = [p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]];
      const len = Math.hypot(dir[0], dir[1], dir[2]) || 1;
      return { origin: p0, dir: [dir[0] / len, dir[1] / len, dir[2] / len] };
    }

    return {
      gl: gl,
      camera: camera,
      debug: debug,
      render: function (scene) { upload(scene); render(scene); },
      resize: resize,
      screenToRay: screenToRay,
      getEye: function () { return eye.slice(); },
      getViewProj: function () { updateCamera(); return viewProj.slice(); }
    };
  }

  return { createRenderer: createRenderer };
});

/* =========================================================================
 * app.js — 应用主逻辑: 状态管理 / 拖拽转动 / 动画 / 求解器接入 / 界面
 * ========================================================================= */
(function () {
  'use strict';
  const Core = window.CubeCore;
  const Solver = window.CubeSolver;
  const R = window.CubeRenderer;
  const GL = window.GLUtil;

  /* ---------------- 颜色 ---------------- */
  const COLORS = [
    [0.96, 0.97, 0.99],  // U 白
    [1.00, 0.30, 0.36],  // R 红
    [0.18, 0.80, 0.45],  // F 绿
    [1.00, 0.83, 0.24],  // D 黄
    [1.00, 0.60, 0.22],  // L 橙
    [0.29, 0.62, 1.00]   // B 蓝
  ];
  const FACE_NAMES = Core.FACE_NAMES;

  /* ---------------- 状态 ---------------- */
  const state = {
    facelets: Core.SOLVED_FACELETS.slice(),
    stickerPos: new Int8Array(54 * 3),   // 单位: 半格 (乘2)
    stickerNrm: new Int8Array(54 * 3),
    stickerColor: new Int8Array(54),
    cubiePos: new Int8Array(26 * 3),
    cubieIndex: [],
    anim: null,
    queue: [],
    solution: null,
    playIndex: 0,
    playing: false,
    speed: 1,
    busy: false
  };

  function initGeometry() {
    for (let i = 0; i < 54; i++) {
      for (let k = 0; k < 3; k++) {
        state.stickerPos[i * 3 + k] = Math.round(Core.STICKER_POS[i][k] * 2);
        state.stickerNrm[i * 3 + k] = Core.STICKER_NRM[i][k];
      }
      state.stickerColor[i] = Core.STICKER_FACE[i];
    }
    const seen = {};
    let n = 0;
    const addCubie = function (x, y, z) {
      const key = x + ',' + y + ',' + z;
      if (seen[key]) return;
      seen[key] = 1;
      state.cubiePos[n * 3] = x; state.cubiePos[n * 3 + 1] = y; state.cubiePos[n * 3 + 2] = z;
      state.cubieIndex.push([x, y, z]);
      n++;
    };
    const axisCoord = function (v) { return Math.abs(v) === 1.5 ? Math.sign(v) : Math.round(v); };
    for (let i = 0; i < 54; i++) {
      addCubie(
        axisCoord(Core.STICKER_POS[i][0]),
        axisCoord(Core.STICKER_POS[i][1]),
        axisCoord(Core.STICKER_POS[i][2])
      );
    }
  }

  /* ---------------- 整数旋转 ---------------- */
  // 绕 axis 旋转 quarter 个 90° (v 单位: 半格)
  function rot90i(v, axis, quarter) {
    let x = v[0], y = v[1], z = v[2];
    const q = ((quarter % 4) + 4) % 4;
    for (let i = 0; i < q; i++) {
      if (axis === 0) { const t = y; y = -z; z = t; }
      else if (axis === 1) { const t = x; x = z; z = -t; }
      else { const t = x; x = -y; y = t; }
    }
    return [x, y, z];
  }

  /* ---------------- 移动 ---------------- */
  // 判断某个 cubie 是否属于本次转动
  // 注意: 真实魔方中, 中层/宽层转动会带着该层的中心块一起转 (核心具有四重对称性)
  function isAffected(def, coord) {
    if (def.kind === 'rotation') return true;
    if (def.kind === 'wide') return coord === def.layer || coord === 0;
    if (def.kind === 'slice') return coord === 0;
    return coord === def.layer;
  }

  // 把移动作用到几何上 (贴纸位置/法线, 方块中心)
  function applyMoveGeometry(moveId) {
    const def = Core.MOVE_DEFS[moveId];
    const total = ((def.sign * def.quarter) % 4 + 4) % 4;
    for (let i = 0; i < 54; i++) {
      const p = [state.stickerPos[i * 3], state.stickerPos[i * 3 + 1], state.stickerPos[i * 3 + 2]];
      const cc = Math.abs(p[def.axis]) === 3 ? Math.sign(p[def.axis]) : p[def.axis] / 2;
      if (!isAffected(def, cc)) continue;
      const n = [state.stickerNrm[i * 3], state.stickerNrm[i * 3 + 1], state.stickerNrm[i * 3 + 2]];
      const np = rot90i(p, def.axis, total);
      const nn = rot90i(n, def.axis, total);
      for (let k = 0; k < 3; k++) {
        state.stickerPos[i * 3 + k] = np[k];
        state.stickerNrm[i * 3 + k] = nn[k];
      }
    }
    for (let c = 0; c < state.cubieIndex.length; c++) {
      const p = [state.cubiePos[c * 3], state.cubiePos[c * 3 + 1], state.cubiePos[c * 3 + 2]];
      if (!isAffected(def, p[def.axis])) continue;
      const np = rot90i(p, def.axis, total);
      for (let k = 0; k < 3; k++) state.cubiePos[c * 3 + k] = np[k];
    }
  }

  function applyMoveNow(moveId) {
    Core.applyFaceletMoveInPlace(state.facelets, moveId);
    applyMoveGeometry(moveId);
  }

  /* ---------------- 渲染场景 ---------------- */
  const scene = { bodies: [], stickers: [] };
  for (let i = 0; i < 26; i++) scene.bodies.push({ m: GL.mat4() });
  for (let i = 0; i < 54; i++) scene.stickers.push({ m: GL.mat4(), color: [1, 1, 1] });

  const tmpMat = GL.mat4();

  function setMat(m, pos, rot3) {
    // 列主序: 平移在 12,13,14
    if (rot3) {
      m[0] = rot3[0]; m[1] = rot3[3]; m[2] = rot3[6]; m[3] = 0;
      m[4] = rot3[1]; m[5] = rot3[4]; m[6] = rot3[7]; m[7] = 0;
      m[8] = rot3[2]; m[9] = rot3[5]; m[10] = rot3[8]; m[11] = 0;
    } else {
      m[0] = 1; m[1] = 0; m[2] = 0; m[3] = 0;
      m[4] = 0; m[5] = 1; m[6] = 0; m[7] = 0;
      m[8] = 0; m[9] = 0; m[10] = 1; m[11] = 0;
    }
    m[12] = pos[0]; m[13] = pos[1]; m[14] = pos[2]; m[15] = 1;
  }

  // 贴纸朝向: 由法线构造旋转 (把 +z 转到法线方向)
  function orientFromNormal(n) {
    const zx = n[0], zy = n[1], zz = n[2];
    // 选择与法线不平行的参考轴
    let ux = 0, uy = 1, uz = 0;
    if (Math.abs(zy) > 0.9) { ux = 1; uy = 0; uz = 0; }
    // x 轴 = normalize(cross(up, n))
    let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
    let len = Math.hypot(xx, xy, xz) || 1;
    xx /= len; xy /= len; xz /= len;
    // y 轴 = cross(n, x)
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    // 行主序: [x, y, z] 三列
    return new Float32Array([xx, yx, zx, xy, yy, zy, xz, yz, zz]);
  }

  function buildScene() {
    const anim = state.anim;
    let animAxis = 0, animAngle = 0, animLayer = 0, animKind = 'none';
    if (anim) {
      animAxis = anim.def.axis;
      animKind = anim.def.kind;
      animLayer = anim.def.layer;
      animAngle = anim.angle;
    }
    const rotCache = {};
    const getRot = function (axis, angle) {
      const key = axis + ':' + angle.toFixed(5);
      if (!rotCache[key]) rotCache[key] = GL.rotationMat3(
        axis === 0 ? [1, 0, 0] : axis === 1 ? [0, 1, 0] : [0, 0, 1], angle);
      return rotCache[key];
    };

    // 方块本体
    for (let c = 0; c < scene.bodies.length; c++) {
      const p = [state.cubiePos[c * 3], state.cubiePos[c * 3 + 1], state.cubiePos[c * 3 + 2]];
      let pos = p, rot = null;
      if (anim && isAffected(anim.def, p[animAxis])) {
        rot = getRot(animAxis, animAngle);
        pos = GL.applyMat3(p, rot);
      }
      setMat(scene.bodies[c].m, pos, rot);
    }

    // 贴纸
    for (let i = 0; i < 54; i++) {
      const n = [state.stickerNrm[i * 3], state.stickerNrm[i * 3 + 1], state.stickerNrm[i * 3 + 2]];
      const sp = [state.stickerPos[i * 3] / 2, state.stickerPos[i * 3 + 1] / 2, state.stickerPos[i * 3 + 2] / 2];
      let pos = sp, nn = n, rot = null;
      const cubieCoord = Math.abs(sp[animAxis]) === 1.5 ? Math.sign(sp[animAxis]) : sp[animAxis];
      if (anim && isAffected(anim.def, cubieCoord)) {
        rot = getRot(animAxis, animAngle);
        pos = GL.applyMat3(sp, rot);
        nn = GL.applyMat3(n, rot);
      }
      // 贴纸稍微浮出表面 (贴纸中心本身就在表面上, 只需极小偏移避免 z-fighting)
      const out = 0.014;
      const q = [pos[0] + nn[0] * out, pos[1] + nn[1] * out, pos[2] + nn[2] * out];
      const orient = orientFromNormal(nn);
      setMat(scene.stickers[i].m, q, orient);
      const col = COLORS[state.stickerColor[i]];
      scene.stickers[i].color[0] = col[0];
      scene.stickers[i].color[1] = col[1];
      scene.stickers[i].color[2] = col[2];
    }
    return scene;
  }

  /* ---------------- 渲染器与循环 ---------------- */
  let renderer = null;
  const canvas = document.getElementById('cube-canvas');

  function fitDistance() {
    // 根据视口宽高比计算能完整容纳魔方的距离
    const aspect = Math.max(0.25, canvas.clientWidth / Math.max(1, canvas.clientHeight));
    const half = 2.8;
    const t = Math.tan(renderer.camera.fov / 2);
    return Math.max(7.5, half / (t * Math.min(1, aspect)));
  }
  let userZoomed = false;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.resize(canvas.clientWidth, canvas.clientHeight, dpr);
    const fit = fitDistance();
    if (!userZoomed && fit > orbit.dist) orbit.dist = fit;
    else if (fit > orbit.dist) orbit.dist = fit;
  }

  /* ---------------- 动画 ---------------- */
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // 动画目标角: 取最短旋转方向
  // 转动 3 个 90° (即 X') 与反向转 1 个 90° 终态相同, 但视觉上必须走 90°
  function animTargetAngle(def) {
    let q = def.sign * def.quarter;   // ±1 / ±2 / ±3
    if (q > 2) q -= 4;
    if (q < -2) q += 4;
    return q * Math.PI / 2;
  }

  function startNextMove() {
    if (state.anim || !state.queue.length) return;
    const moveId = state.queue.shift();
    const def = Core.MOVE_DEFS[moveId];
    state.anim = {
      def: def,
      moveId: moveId,
      t0: performance.now(),
      dur: Math.max(60, 190 / state.speed),
      angle: 0,
      target: animTargetAngle(def)
    };
    updateMoveBadge(def.name);
  }

  function tick(now) {
    renderer.camera.theta = orbit.theta;
    renderer.camera.phi = orbit.phi;
    renderer.camera.dist = orbit.dist;
    if (state.anim) {
      const a = state.anim;
      let t = (now - a.t0) / a.dur;
      if (t >= 1) t = 1;
      a.angle = a.target * easeOutCubic(t);
      if (t >= 1) {
        const mv = a.moveId;
        const back = a.back;
        state.anim = null;
        applyMoveNow(mv);
        if (!back) state.playIndex++;
        updateStepUI();
        if (state.queue.length) startNextMove();
        else if (state.playing) {
          state.playing = false;
          updatePlayButton();
          if (state.solution && state.playIndex >= state.solution.moves.length) {
            if (isVisuallySolved()) showToast('还原完成 · ' + state.solution.moves.length + ' 步');
          }
        }
      }
    }
    renderer.render(buildScene());
    requestAnimationFrame(tick);
  }

  /* ---------------- 拖拽转动 ---------------- */
  let pointer = null;   // {id, x0, y0, hit, moved, mode}
  let orbit = { theta: -0.62, phi: 1.05, dist: 9.6 };

  function pick(cssX, cssY) {
    const ray = renderer.screenToRay(cssX, cssY);
    let best = null, bestT = Infinity;
    const anim = state.anim;
    for (let i = 0; i < 54; i++) {
      const n = [state.stickerNrm[i * 3], state.stickerNrm[i * 3 + 1], state.stickerNrm[i * 3 + 2]];
      // 与渲染保持一致: 贴纸中心在表面上, 仅极小偏移
      let center = [state.stickerPos[i * 3] / 2 + n[0] * 0.014, state.stickerPos[i * 3 + 1] / 2 + n[1] * 0.014, state.stickerPos[i * 3 + 2] / 2 + n[2] * 0.014];
      let nn = n;
      if (anim) {
        const cubieCoord = Math.abs(center[anim.def.axis]) === 1.5 ? Math.sign(center[anim.def.axis]) : center[anim.def.axis];
        if (isAffected(anim.def, cubieCoord)) {
          const rot = GL.rotationMat3(anim.def.axis === 0 ? [1, 0, 0] : anim.def.axis === 1 ? [0, 1, 0] : [0, 0, 1], anim.angle);
          center = GL.applyMat3(center, rot);
          nn = GL.applyMat3(n, rot);
        }
      }
      const denom = ray.dir[0] * nn[0] + ray.dir[1] * nn[1] + ray.dir[2] * nn[2];
      if (Math.abs(denom) < 1e-6) continue;
      const dx = center[0] - ray.origin[0], dy = center[1] - ray.origin[1], dz = center[2] - ray.origin[2];
      const t = (dx * nn[0] + dy * nn[1] + dz * nn[2]) / denom;
      if (t < 0.1 || t > bestT) continue;
      const hx = ray.origin[0] + ray.dir[0] * t, hy = ray.origin[1] + ray.dir[1] * t, hz = ray.origin[2] + ray.dir[2] * t;
      const vx = hx - center[0], vy = hy - center[1], vz = hz - center[2];
      if (Math.hypot(vx, vy, vz) > 0.46) continue;
      bestT = t;
      best = { index: i, normal: nn, point: [hx, hy, hz], t: t };
    }
    return best;
  }

  function screenDir(dx, dy) {
    // 屏幕位移 -> 世界方向
    const eye = renderer.getEye();
    const cam = renderer.camera;
    const fwd = [cam.target[0] - eye[0], cam.target[1] - eye[1], cam.target[2] - eye[2]];
    let fl = Math.hypot(fwd[0], fwd[1], fwd[2]) || 1;
    fwd[0] /= fl; fwd[1] /= fl; fwd[2] /= fl;
    let rl = Math.hypot(fwd[2], fwd[0]) || 1;
    const right = [-fwd[2] / rl, 0, fwd[0] / rl];
    const up = [
      right[1] * fwd[2] - right[2] * fwd[1],
      right[2] * fwd[0] - right[0] * fwd[2],
      right[0] * fwd[1] - right[1] * fwd[0]
    ];
    return [
      right[0] * dx - up[0] * dy,
      right[1] * dx - up[1] * dy,
      right[2] * dx - up[2] * dy
    ];
  }

  // 根据 (旋转轴, 层, 方向) 找到对应的转动
  function moveFromTurn(axisIndex, layer, sign) {
    // sign: +1 表示绕 +axis 正方向旋转
    const faceBase = ['R', 'U', 'F'];   // +x, +y, +z 方向的面
    const negFace = ['L', 'D', 'B'];
    const sliceName = ['M', 'E', 'S'];
    const sliceSign = [1, 1, -1];
    let name = null;
    if (layer === 1) {
      // 外侧正方向层: 顺时针 = 绕 +axis 转 -90
      name = faceBase[axisIndex] + (sign === -1 ? '' : "'");
    } else if (layer === -1) {
      // 外侧负方向层: 顺时针 = 绕 +axis 转 +90
      name = negFace[axisIndex] + (sign === 1 ? '' : "'");
    } else {
      // 中层: 定义 M/E 为 +90, S 为 -90
      name = sliceName[axisIndex] + (sign === sliceSign[axisIndex] ? '' : "'");
    }
    return Core.MOVE_NAME_TO_ID[name];
  }

  function onPointerDown(e) {
    if (pointer) return;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const hit = state.anim ? null : pick(x, y);
    pointer = {
      id: e.pointerId, x0: x, y0: y, x: x, y: y, hit: hit, mode: hit ? 'pending' : 'orbit',
      theta0: orbit.theta, phi0: orbit.phi
    };
  }

  function onPointerMove(e) {
    if (!pointer || e.pointerId !== pointer.id) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const dx = x - pointer.x0, dy = y - pointer.y0;
    pointer.x = x; pointer.y = y;

    if (pointer.mode === 'pending') {
      if (Math.hypot(dx, dy) < 8) return;
      // 决定转动方向
      const hit = pointer.hit;
      const n = hit.normal;
      const dir = screenDir(dx, dy);
      const dn = dir[0] * n[0] + dir[1] * n[1] + dir[2] * n[2];
      let p = [dir[0] - n[0] * dn, dir[1] - n[1] * dn, dir[2] - n[2] * dn];
      const pl = Math.hypot(p[0], p[1], p[2]) || 1;
      p = [p[0] / pl, p[1] / pl, p[2] / pl];
      // 面内的两个坐标轴
      const axes = [];
      for (let k = 0; k < 3; k++) if (Math.abs(n[k]) < 0.5) axes.push(k);
      let bestAxis = axes[0], bestDot = -1;
      for (const k of axes) {
        const d = Math.abs(p[k]);
        if (d > bestDot) { bestDot = d; bestAxis = k; }
      }
      const dragSign = p[bestAxis] > 0 ? 1 : -1;
      // 旋转轴 r = n × a
      const a = [0, 0, 0]; a[bestAxis] = dragSign;
      const r = [
        n[1] * a[2] - n[2] * a[1],
        n[2] * a[0] - n[0] * a[2],
        n[0] * a[1] - n[1] * a[0]
      ];
      let axisIndex = 0, sign = 1;
      for (let k = 0; k < 3; k++) {
        if (Math.abs(r[k]) > 0.5) { axisIndex = k; sign = r[k] > 0 ? 1 : -1; }
      }
      // 层: 命中点所在 cubie 沿旋转轴的坐标
      const layer = Math.max(-1, Math.min(1, Math.round(hit.point[axisIndex])));
      const moveId = moveFromTurn(axisIndex, layer, sign);
      pointer.mode = 'done';
      state.playing = false;
      state.queue.length = 0;
      updatePlayButton();
      if (state.anim) return;
      state.queue.push(moveId);
      startNextMove();
      return;
    }

    if (pointer.mode === 'orbit') {
      orbit.theta = pointer.theta0 - dx * 0.008;
      orbit.phi = Math.max(0.25, Math.min(Math.PI - 0.25, pointer.phi0 - dy * 0.008));
    }
  }

  function onPointerUp(e) {
    if (!pointer || e.pointerId !== pointer.id) return;
    pointer = null;
  }

  function onWheel(e) {
    e.preventDefault();
    userZoomed = true;
    orbit.dist = Math.max(6.0, Math.min(22, orbit.dist + e.deltaY * 0.004));
  }

  /* ---------------- UI ---------------- */
  const ui = {};
  function $(id) { return document.getElementById(id); }

  function updateMoveBadge(name) {
    if (ui.moveBadge) {
      ui.moveBadge.textContent = name || '·';
      ui.moveBadge.classList.remove('pop');
      void ui.moveBadge.offsetWidth;
      ui.moveBadge.classList.add('pop');
    }
  }

  function updatePlayButton() {
    if (!ui.play) return;
    ui.play.textContent = state.playing ? '暂停' : '播放';
    ui.play.classList.toggle('active', state.playing);
  }

  let stepEls = null;   // [{el, chips: [], start, end}]

  function buildSteps() {
    const box = ui.steps;
    box.innerHTML = '';
    stepEls = [];
    if (!state.solution) {
      box.innerHTML = '<div class="empty">点击「求解」后在此显示分步演示</div>';
      return;
    }
    const sol = state.solution;
    let moveIdx = 0;
    sol.steps.forEach(function (step) {
      const start = moveIdx, end = moveIdx + step.moves.length;
      const div = document.createElement('div');
      div.className = 'step';
      const head = document.createElement('div');
      head.className = 'step-head';
      head.innerHTML = '<span class="dot"></span><span class="sname"></span><span class="scount">' +
        step.moves.length + ' 步</span>';
      head.querySelector('.sname').textContent = step.name;
      div.appendChild(head);
      if (step.algs && step.algs.length) {
        const alg = document.createElement('div');
        alg.className = 'algs';
        alg.textContent = '公式: ' + step.algs.join('  |  ');
        div.appendChild(alg);
      }
      const moves = document.createElement('div');
      moves.className = 'moves';
      const chips = [];
      step.moves.forEach(function (m) {
        const sp = document.createElement('span');
        sp.className = 'mv';
        sp.textContent = Core.MOVE_DEFS[m].name;
        moves.appendChild(sp);
        chips.push(sp);
      });
      div.appendChild(moves);
      box.appendChild(div);
      stepEls.push({ el: div, chips: chips, start: start, end: end });
      moveIdx = end;
    });
  }

  let lastScrollIdx = -1;
  function updateStepHighlight() {
    if (!stepEls) return;
    const cur = state.playIndex;
    let target = null;
    for (let i = 0; i < stepEls.length; i++) {
      const st = stepEls[i];
      const active = cur >= st.start && cur < st.end;
      st.el.classList.toggle('active', active);
      st.el.classList.toggle('done', cur >= st.end);
      for (let k = 0; k < st.chips.length; k++) {
        const idx = st.start + k;
        const c = st.chips[k];
        const isNow = idx === cur;
        const isPast = idx < cur;
        if (c._now !== isNow) { c.classList.toggle('now', isNow); c._now = isNow; }
        if (c._past !== isPast) { c.classList.toggle('past', isPast); c._past = isPast; }
      }
      if (active) target = st.el;
    }
    if (target && lastScrollIdx !== cur) {
      lastScrollIdx = cur;
      setTimeout(function () { target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 10);
    }
  }

  function updateStepUI() {
    updateStepHighlight();
    if (state.solution) {
      const total = state.solution.moves.length;
      ui.progress.textContent = state.playIndex + ' / ' + total;
      ui.progressBar.style.width = (total ? (state.playIndex / total * 100) : 0) + '%';
    } else {
      ui.progress.textContent = '0 / 0';
      ui.progressBar.style.width = '0%';
    }
    updatePlayButton();
  }

  function stopPlayback() {
    state.playing = false;
    state.queue.length = 0;
    updatePlayButton();
  }

  function scramble() {
    stopPlayback();
    const moves = Core.randomScramble(22);
    state.solution = null;
    state.playIndex = 0;
    state.queue = moves.slice();
    buildSteps();
    startNextMove();
    updateStepUI();
    showToast('已打乱');
  }

  function reset() {
    stopPlayback();
    state.solution = null;
    state.playIndex = 0;
    state.queue.length = 0;
    state.anim = null;
    state.facelets = Core.SOLVED_FACELETS.slice();
    initGeometry();
    buildSteps();
    updateStepUI();
    updateMoveBadge('·');
    showToast('已复位');
  }

  // 视觉上是否已还原 (考虑中心块朝向: 六面各自同色)
  function isVisuallySolved() {
    const frameMoves = Core.frameRotationMoves(state.facelets) || [];
    return Core.isSolved(Core.applyMoves(Core.faceletsToCubie(state.facelets), frameMoves));
  }

  function applySolution(method) {
    stopPlayback();
    if (state.anim) { setTimeout(function () { applySolution(method); }, 60); return; }
    // 中层转动会让中心块带着整个魔方换向; 求解前先把它摆正
    const frameMoves = Core.frameRotationMoves(state.facelets) || [];
    let st = Core.faceletsToCubie(state.facelets);
    if (frameMoves.length) st = Core.applyMoves(st, frameMoves);
    if (Core.isSolved(st)) { showToast('魔方已经是还原状态'); return; }
    showLoading(true, '计算解法中…');
    setTimeout(function () {
      let sol = null;
      try {
        sol = Solver.solve(st, method);
      } catch (e) {
        console.error(e);
      }
      showLoading(false);
      if (!sol) { showToast('求解失败，请重试'); return; }
      if (frameMoves.length) {
        sol.steps.unshift({ key: 'orient', group: '摆正', name: '摆正魔方（中心块归位）', moves: frameMoves });
        sol.moves = frameMoves.concat(sol.moves);
      }
      state.solution = sol;
      state.playIndex = 0;
      state.queue = sol.moves.slice();
      buildSteps();
      updateStepUI();
      state.playing = true;
      updatePlayButton();
      startNextMove();
      showToast((method === 'roux' ? '桥式' : 'CFOP') + ' 解法 · ' + sol.moves.length + ' 步');
    }, 30);
  }

  function stepForward() {
    if (state.anim) return;
    if (state.solution) {
      if (state.playIndex >= state.solution.moves.length) return;
      state.queue = [state.solution.moves[state.playIndex]];
      startNextMove();
    }
  }
  function stepBack() {
    if (state.anim || state.queue.length) return;
    if (state.solution && state.playIndex > 0) {
      const idx = state.playIndex - 1;
      const inv = Core.invertMove(state.solution.moves[idx]);
      state.playIndex = idx;
      // 反向执行, 不计入 playIndex 递增: 用特殊标记
      const def = Core.MOVE_DEFS[inv];
      state.anim = {
        def: def, moveId: inv, t0: performance.now(),
        dur: Math.max(60, 190 / state.speed), angle: 0,
        target: animTargetAngle(def),
        back: true
      };
      updateStepUI();
    }
  }

  function togglePlay() {
    if (state.playing) {
      state.playing = false;
      state.queue.length = 0;
    } else {
      if (!state.solution) { showToast('请先点击「求解」'); return; }
      if (state.playIndex >= state.solution.moves.length) {
        // 重播: 先用逆序把魔方瞬间退回打乱状态, 再重新播放
        const inv = Core.invertMoves(state.solution.moves);
        for (let i = 0; i < inv.length; i++) applyMoveNow(inv[i]);
        state.playIndex = 0;
        state.playing = true;
        state.queue = state.solution.moves.slice();
        updateStepUI();
        startNextMove();
        updatePlayButton();
        return;
      }
      state.playing = true;
      state.queue = state.solution.moves.slice(state.playIndex);
      startNextMove();
    }
    updatePlayButton();
  }

  let toastTimer = null;
  function showToast(msg) {
    if (!ui.toast) return;
    ui.toast.textContent = msg;
    ui.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast.classList.remove('show'); }, 1800);
  }
  function showLoading(on, text) {
    if (!ui.loading) return;
    ui.loading.textContent = text || '处理中…';
    ui.loading.classList.toggle('show', !!on);
  }

  let currentMethod = 'cfop';

  /* ---------------- 启动 ---------------- */
  function boot() {
    ui.steps = $('steps');
    ui.play = $('btn-play');
    ui.progress = $('progress-text');
    ui.progressBar = $('progress-bar');
    ui.moveBadge = $('move-badge');
    ui.toast = $('toast');
    ui.loading = $('loading');
    ui.hint = $('hint');

    try {
      renderer = R.createRenderer(canvas);
    } catch (e) {
      console.error(e);
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
        'flex-direction:column;gap:10px;text-align:center;padding:24px;font-size:15px;line-height:1.9;color:#2b3f6b;';
      box.innerHTML = '<b style="font-size:20px">无法启动 3D 渲染</b>' +
        '<span>当前浏览器不支持 WebGL2，请使用最新版 Chrome / Edge / Firefox / Safari 打开本页面。</span>';
      document.getElementById('app').appendChild(box);
      return;
    }
    initGeometry();
    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('wheel', onWheel, { passive: false });

    $('btn-scramble').addEventListener('click', scramble);
    $('btn-reset').addEventListener('click', reset);
    $('btn-play').addEventListener('click', togglePlay);
    $('btn-next').addEventListener('click', stepForward);
    $('btn-prev').addEventListener('click', stepBack);
    $('method-cfop').addEventListener('click', function () { setMethod('cfop'); });
    $('method-roux').addEventListener('click', function () { setMethod('roux'); });
    $('btn-solve').addEventListener('click', function () { applySolution(currentMethod); });
    const speed = $('speed');
    speed.addEventListener('input', function () {
      state.speed = parseFloat(speed.value);
      $('speed-label').textContent = state.speed.toFixed(1) + '×';
    });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); stepForward(); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); stepBack(); }
    });

    // 求解器查表(后台预热)
    setTimeout(function () {
      try { Solver.preload(); } catch (e) { console.error(e); }
    }, 400);

    buildSteps();
    updateStepUI();
    requestAnimationFrame(tick);

    // 首次提示: 几秒后或首次交互后淡出
    if (ui.hint) {
      setTimeout(function () { ui.hint.classList.add('show'); }, 500);
      const hideHint = function () { ui.hint.classList.remove('show'); };
      setTimeout(hideHint, 7000);
      canvas.addEventListener('pointerdown', hideHint, { once: true });
    }
  }

  function setMethod(m) {
    currentMethod = m;
    $('method-cfop').classList.toggle('active', m === 'cfop');
    $('method-roux').classList.toggle('active', m === 'roux');
  }

  window.__cube = { state: state, getScene: buildScene, getRenderer: function () { return renderer; },
    applyMoveNow: applyMoveNow, isVisuallySolved: isVisuallySolved, Core: Core, Solver: Solver,
    playMove: function (id) { state.queue.push(id); startNextMove(); } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
