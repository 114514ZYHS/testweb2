<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   基础工具
   ===================================================================== */
const V3 = THREE.Vector3;
const PI = Math.PI;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20260924);
const rr = (a,b)=>a+(b-a)*rand();
const pick = a=>a[Math.floor(rand()*a.length)];
const JP = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
const EN = '"Arial Black","Segoe UI Black",Arial,sans-serif';
const PAL = ['#e84a5f','#ff847c','#fecea8','#2a9d8f','#e9c46a','#f4a261','#6a4c93','#1982c4','#8ac926','#ffca3a','#ff595e','#f1faee','#48cae4','#b5179e','#ffffff'];
const DRINK = ['#3aa6e0','#e84a4a','#f7c948','#6bcb77','#ff8fab','#8e7dff','#f4f4f4','#2f9e8f','#f08a3a','#c6e6ff','#8a5a2b','#1d3557'];

/* =====================================================================
   渲染器 / 场景 / 相机
   ===================================================================== */
const DPR = Math.min(window.devicePixelRatio, 2);
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 300);
camera.position.set(11.5, 15.5, 28);
camera.layers.enable(1);          // 图层1：描边/雨/光晕，不参与地面反射

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 1.3, -0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 70;
controls.minPolarAngle = 0.08;
controls.maxPolarAngle = PI*0.485;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.update();

/* ---------- 画布贴图 ---------- */
function ctex(w,h,draw,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(g,s,x,y,size,color,o={}){
  g.font=`${o.weight||'900'} ${size}px ${o.font||JP}`;
  g.textAlign=o.align||'center'; g.textBaseline=o.base||'middle';
  if(o.stroke){g.lineWidth=o.sw||4;g.strokeStyle=o.stroke;g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillStyle=color; g.fillText(s,x,y);
}
function vtxt(g,s,x,y,size,color,gap=1.05,o={}){ [...s].forEach((ch,i)=>txt(g,ch,x,y+i*size*gap,size,color,o)); }
function shade(hex,amt){const c=new THREE.Color(hex);const h={};c.getHSL(h);c.setHSL(h.h,h.s,Math.max(0,Math.min(1,h.l+amt/255)));return '#'+c.getHexString();}
function star(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5;const d=i%2?r*0.45:r;g.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}g.closePath();g.fill();}
function moonLogo(g,x,y,r){
  g.fillStyle='#13a192';g.beginPath();g.arc(x,y,r,0,PI*2);g.fill();
  g.fillStyle='#fff6d2';g.beginPath();g.arc(x-r*0.1,y,r*0.64,0,PI*2);g.fill();
  g.fillStyle='#13a192';g.beginPath();g.arc(x+r*0.2,y-r*0.18,r*0.56,0,PI*2);g.fill();
  g.fillStyle='#f28a2e';star(g,x+r*0.42,y+r*0.36,r*0.2);
}

/* 背景：竖向夜空渐变 */
scene.background = ctex(8,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#04060d'); gr.addColorStop(0.5,'#0b1326'); gr.addColorStop(0.85,'#171a33'); gr.addColorStop(1,'#1d1733');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});

/* ---------- 三渲二材质 ---------- */
const grad = new THREE.DataTexture(new Uint8Array([95,95,95,255, 172,172,172,255, 255,255,255,255]),3,1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const mcache = {};
function selfLit(m,k){
  m.onBeforeCompile=(s)=>{ s.fragmentShader=s.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n totalEmissiveRadiance += diffuseColor.rgb * '+k.toFixed(3)+';'); };
  m.customProgramCacheKey=()=>'selfLit'+k;
}
// T: 卡通材质；glow>0 时会叠加少量自发光（店内“被灯照亮”的感觉）
function T(hex,glow=0,extra){
  const key=hex+'|'+glow;
  if(!extra && mcache[key]) return mcache[key];
  const m=new THREE.MeshToonMaterial({color:hex, gradientMap:grad, ...(extra||{})});
  if(glow>0) selfLit(m,glow);
  if(!extra) mcache[key]=m;
  return m;
}
const I = (hex)=>T(hex,0.2);                 // 店内物件
function G(hex,k=1.5,map=null,extra={}){      // 发光（Unlit）材质
  return new THREE.MeshBasicMaterial({color:new THREE.Color(hex).multiplyScalar(k), map, ...extra});
}

/* ---------- 描边 ---------- */
const edgeMat = new THREE.LineBasicMaterial({color:0x14152a});
const edgeCache = new Map();
function addEdge(mesh,th=40){
  let e=edgeCache.get(mesh.geometry);
  if(!e){e=new THREE.EdgesGeometry(mesh.geometry,th);edgeCache.set(mesh.geometry,e);}
  const l=new THREE.LineSegments(e,edgeMat); l.layers.set(1); l.raycast=()=>{}; mesh.add(l); return l;
}
const hullCache = {};
function addHull(mesh,t=0.012){
  const m = hullCache[t] ||= new THREE.ShaderMaterial({ side:THREE.BackSide,
    vertexShader:`void main(){ vec3 p = position + normalize(normal)*${t.toFixed(4)}; gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
    fragmentShader:`void main(){ gl_FragColor = vec4(0.007,0.0075,0.023,1.0); }` });
  const h=new THREE.Mesh(mesh.geometry,m); h.layers.set(1); h.raycast=()=>{}; mesh.add(h); return h;
}

/* ---------- 几何体工厂 ---------- */
const gc = {};
const gBox=(w,h,d)=>gc[`b${w},${h},${d}`] ||= new THREE.BoxGeometry(w,h,d);
const gCyl=(rt,rb,h,s=16,open=false)=>gc[`c${rt},${rb},${h},${s},${open}`] ||= new THREE.CylinderGeometry(rt,rb,h,s,1,open);
let CAST = true;
function box(p,w,h,d,mat,x,y,z,o={}){ // y = 底部高度
  const m=new THREE.Mesh(gBox(w,h,d),mat);
  m.position.set(x,y+h/2,z);
  if(o.rx) m.rotation.x=o.rx; if(o.ry) m.rotation.y=o.ry; if(o.rz) m.rotation.z=o.rz;
  m.castShadow = o.cast ?? CAST; m.receiveShadow=true;
  if(o.edge!==false) addEdge(m,o.th);
  p.add(m); return m;
}
function cyl(p,r,h,mat,x,y,z,o={}){
  const m=new THREE.Mesh(gCyl(o.rt??r,r,h,o.seg??16,o.open),mat);
  m.position.set(x,y+h/2,z);
  if(o.rx) m.rotation.x=o.rx; if(o.ry) m.rotation.y=o.ry; if(o.rz) m.rotation.z=o.rz;
  m.castShadow = o.cast ?? CAST; m.receiveShadow=true;
  if(o.hull!==0) addHull(m,o.hull??0.012);
  if(o.edge) addEdge(m,o.th);
  p.add(m); return m;
}
function rod(p,a,b,r,mat,o={}){
  const d=new V3().subVectors(b,a); const L=d.length();
  const m=new THREE.Mesh(gCyl(r,r,L,o.seg??8),mat);
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());
  m.castShadow = o.cast ?? CAST;
  if(o.hull!==0) addHull(m,o.hull??0.008);
  p.add(m); return m;
}
function plane(p,w,h,mat,x,y,z,ry=0,o={}){
  const m=new THREE.Mesh(gc[`p${w},${h}`] ||= new THREE.PlaneGeometry(w,h),mat);
  m.rotation.order='YXZ';
  m.position.set(x,y,z); m.rotation.y=ry; if(o.rx) m.rotation.x=o.rx;
  m.receiveShadow=!!o.receive;
  if(o.edge) addEdge(m);
  p.add(m); return m;
}
function plight(color,intensity,dist,x,y,z){
  const l=new THREE.PointLight(color,intensity,dist,2); l.position.set(x,y,z); scene.add(l); return l;
}
const softTex = ctex(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,0.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
function halo(x,y,z,color,size,op=0.6){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.position.set(x,y,z); s.scale.set(size,size,1); s.layers.set(1); scene.add(s); return s;
}
const glowMats = {};
function glowPlaneMat(hex){ return glowMats[hex] ||= new THREE.MeshBasicMaterial({map:softTex,color:new THREE.Color(hex).multiplyScalar(1.6),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}); }

class Flicker{
  constructor(gmin=4,gmax=12,depth=1){this.gmin=gmin;this.gmax=gmax;this.depth=depth;this.next=rr(2,gmax);this.burst=0;this.tick=0;this.v=1;}
  update(t,dt){
    if(this.burst>0){
      this.burst-=dt; this.tick-=dt;
      if(this.tick<=0){ this.v = rand()<0.55 ? rr(0.05,0.4) : 1; this.tick=rr(0.03,0.11); }
      if(this.burst<=0){ this.v=1; this.next=t+rr(this.gmin,this.gmax); }
    } else if(t>this.next){ this.burst=rr(0.25,0.9); }
    else this.v = 0.97+0.03*Math.sin(t*47+this.gmax);
    return 1-(1-this.v)*this.depth;
  }
}

/* 共享时间 uniform */
const timeU = { value:0 };

/* =====================================================================
   全局尺寸（单位≈米）
   底座 16×16，便利店位于中心偏左后，两条道路在右前方形成街角
   ===================================================================== */
const PUDDLES = [
  [4.95,-5.2,0.45,1.3],[5.1,-2.0,0.32,0.8],[6.6,0.6,0.45,1.1],[5.8,5.7,0.95,0.55],[6.4,6.5,0.5,0.35],
  [-5.5,6.6,1.2,0.35],[-1.5,4.95,0.9,0.3],[1.0,6.7,0.6,0.3],[3.3,5.0,0.5,0.35],[5.6,3.2,0.4,0.5],
  [-2.0,2.4,0.8,0.45],[-3.9,1.9,0.5,0.3],[1.3,2.6,0.6,0.35],[3.9,-3.5,0.22,0.5],[-3.5,3.9,0.45,0.2],
  [-6.2,-1.8,0.32,0.9],[-6.3,1.4,0.3,0.5],[-1.5,-6.6,0.7,0.4],[1.7,-7.1,0.4,0.3],[7.6,-2,0.2,0.6],[-7.2,5.6,0.6,0.4]
].map(([x,z,rx,rz])=>{ // 预生成不规则水洼形状（多椭圆叠加）
  const parts=[]; for(let k=0;k<4;k++) parts.push([x+rr(-rx,rx)*0.35,z+rr(-rz,rz)*0.35,rx*rr(0.55,1),rz*rr(0.55,1),rr(-0.3,0.3)]);
  return parts;
});

/* =====================================================================
   地面贴图
   ===================================================================== */
function drawGround(g,w){
  const s=w/16, X=x=>(x+8)*s, Z=z=>(z+8)*s;
  const R=(x0,z0,x1,z1,c)=>{g.fillStyle=c;g.fillRect(X(x0),Z(z0),(x1-x0)*s,(z1-z0)*s);};
  const speck=(x0,z0,x1,z1,n,cols,sz=2,a0=0.15,a1=0.5)=>{for(let i=0;i<n;i++){g.globalAlpha=rr(a0,a1);g.fillStyle=pick(cols);const q=sz*rr(0.6,1.6);g.fillRect(X(rr(x0,x1)),Z(rr(z0,z1)),q,q);}g.globalAlpha=1;};
  const tiles=(x0,z0,x1,z1,base,line,tw,th,off=true)=>{
    R(x0,z0,x1,z1,base); g.save(); g.beginPath(); g.rect(X(x0),Z(z0),(x1-x0)*s,(z1-z0)*s); g.clip();
    for(let z=z0,row=0;z<z1;z+=th,row++){const o=off&&(row%2)?tw/2:0;for(let x=x0-o;x<x1;x+=tw){const v=rr(-12,12);const c=v>0?255:0;g.fillStyle=`rgba(${c},${c},${c},${Math.abs(v)/260})`;g.fillRect(X(x),Z(z),tw*s,th*s);}}
    g.strokeStyle=line; g.lineWidth=1.6; g.beginPath();
    for(let z=z0,row=0;z<=z1+1e-6;z+=th,row++){g.moveTo(X(x0),Z(z));g.lineTo(X(x1),Z(z));const o=off&&(row%2)?tw/2:0;if(z<z1)for(let x=x0-o;x<x1;x+=tw){g.moveTo(X(x),Z(z));g.lineTo(X(x),Z(Math.min(z+th,z1)));}}
    g.stroke(); g.restore();
  };
  const grate=(x0,z0,x1,z1,alongX)=>{ R(x0,z0,x1,z1,'#1c1f27'); g.strokeStyle='#4a4f5c'; g.lineWidth=2; g.beginPath();
    if(alongX){for(let x=x0;x<x1;x+=0.06){g.moveTo(X(x),Z(z0));g.lineTo(X(x),Z(z1));}} else {for(let z=z0;z<z1;z+=0.06){g.moveTo(X(x0),Z(z));g.lineTo(X(x1),Z(z));}}
    g.stroke(); g.strokeStyle='#5d6270'; g.strokeRect(X(x0),Z(z0),(x1-x0)*s,(z1-z0)*s); };

  // 停车场混凝土
  R(-8,-8,8,8,'#4a4f5b'); speck(-8,-8,8,8,9000,['#3b3f4a','#5b606c'],2);
  g.strokeStyle='rgba(28,30,38,0.55)'; g.lineWidth=2; g.beginPath();
  for(let x=-5.6;x<=3.41;x+=1.5){g.moveTo(X(x),Z(0.4));g.lineTo(X(x),Z(3.25));}
  g.moveTo(X(-5.6),Z(1.9));g.lineTo(X(3.4),Z(1.9)); g.stroke();
  // 道路沥青
  R(4.4,-8,7.2,8,'#2a2f3b'); R(-8,4.4,8,7.2,'#2a2f3b');
  speck(4.4,-8,7.2,8,7000,['#1e222c','#3a404d','#4a505e'],2); speck(-8,4.4,8,7.2,7000,['#1e222c','#3a404d','#4a505e'],2);
  g.globalAlpha=0.35; R(5.0,-6.8,6.2,-5.9,'#232733'); R(-4.2,5.9,-2.6,6.9,'#343a47'); g.globalAlpha=1;
  // 人行道 / 小巷 / 后院
  tiles(3.4,-8,4.4,4.4,'#5b606d','#474b57',0.3,0.15);
  tiles(-8,3.4,3.4,4.4,'#5b606d','#474b57',0.3,0.15);
  tiles(7.2,-8,8,8,'#565b68','#444855',0.3,0.15);
  tiles(-8,7.2,7.2,8,'#565b68','#444855',0.3,0.15);
  tiles(-5.6,0.4,2.4,1.38,'#6c717d','#575b66',0.45,0.45,false);
  R(-6.8,-8,-5.6,3.4,'#3d414b'); speck(-6.8,-8,-5.6,3.4,1500,['#2f333c','#4b505b'],2);
  R(-8,2.6,-6.8,3.4,'#3a3e48');
  R(-5.6,-8,3.4,-5.4,'#434852'); speck(-5.6,-8,3.4,-5.4,1500,['#353943','#565b66'],2);
  // 点字块（盲道）
  const tactile=(x0,z0,x1,z1)=>{R(x0,z0,x1,z1,'#d4b13c');g.fillStyle='#b8952b';for(let x=x0+0.05;x<x1;x+=0.075)for(let z=z0+0.05;z<z1;z+=0.075){g.beginPath();g.arc(X(x),Z(z),2.6,0,PI*2);g.fill();}};
  tactile(2.7,4.0,4.3,4.3); tactile(4.0,2.7,4.3,4.0);
  // 道路标线
  const W='#dedcd2';
  R(4.59,-8,4.66,2.3,W); R(6.94,-8,7.01,2.3,W); R(-8,4.59,2.3,4.66,W); R(-8,6.94,2.3,7.01,W);
  for(let z=4.55;z<7.1;z+=0.55) R(2.7,z,4.25,z+0.3,'#e6e5dc');   // 斑马线（前路）
  for(let x=4.55;x<7.1;x+=0.55) R(x,2.7,x+0.3,4.25,'#e6e5dc');   // 斑马线（右路）
  R(2.4,4.4,2.52,5.8,W); R(5.8,2.4,7.2,2.52,W);                   // 停止线
  speck(2.7,4.4,4.3,7.2,500,['#2a2f3b','#555b66'],3,0.3,0.7); speck(4.4,2.7,7.2,4.3,500,['#2a2f3b','#555b66'],3,0.3,0.7);
  g.strokeStyle=W; g.lineWidth=0.07*s;
  const diamond=(cx,cz,lx,lz)=>{g.beginPath();g.moveTo(X(cx-lx),Z(cz));g.lineTo(X(cx),Z(cz-lz));g.lineTo(X(cx+lx),Z(cz));g.lineTo(X(cx),Z(cz+lz));g.closePath();g.stroke();};
  diamond(6.5,-0.8,0.28,0.75); diamond(-0.8,5.1,0.75,0.28);
  // 停车位
  for(const x of [-4.6,-2.7,-0.8]) R(x-0.04,1.0,x+0.04,3.15,'#e2e0d6');
  R(-4.64,3.07,-0.76,3.15,'#e2e0d6');
  // 排水沟
  R(4.4,-8,4.58,2.6,'#62666f'); for(let z=-7.6;z<2.3;z+=1.1) grate(4.43,z,4.55,z+0.45,false);
  R(-8,4.4,2.6,4.58,'#62666f'); for(let x=-7.6;x<2.3;x+=1.1) grate(x,4.43,x+0.45,4.55,true);
  grate(-5.6,3.26,3.4,3.39,true);
  R(-6.3,-8,-6.1,3.4,'#50555f'); for(let z=-7.8;z<3.2;z+=0.8) grate(-6.27,z,-6.13,z+0.5,false);
  // 井盖
  const manhole=(cx,cz,r)=>{g.fillStyle='#3a3e48';g.beginPath();g.arc(X(cx),Z(cz),r*s,0,PI*2);g.fill();g.strokeStyle='#5c616d';g.lineWidth=3;
    for(const k of [1,0.8,0.55]){g.beginPath();g.arc(X(cx),Z(cz),r*s*k,0,PI*2);g.stroke();}
    for(let a=0;a<PI*2;a+=PI/8){g.beginPath();g.moveTo(X(cx)+Math.cos(a)*r*s*0.55,Z(cz)+Math.sin(a)*r*s*0.55);g.lineTo(X(cx)+Math.cos(a)*r*s*0.8,Z(cz)+Math.sin(a)*r*s*0.8);g.stroke();}};
  manhole(5.8,-3.2,0.32); manhole(-2.2,5.9,0.32); manhole(-6.2,-4.5,0.22);
  // 污渍、水洼暗色

const maskTex = ctex(512,512,(g,w)=>drawMask(g,w),false);
const WetShader = {
  name:'WetShader',
  uniforms:{ color:{value:null}, tDiffuse:{value:null}, textureMatrix:{value:null}, tMask:{value:null}, uTime:{value:0} },
  vertexShader:`
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vUv2; varying vec3 vWorld;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main(){
      vUv = textureMatrix*vec4(position,1.0); vUv2 = uv;
      vWorld = (modelMatrix*vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader:`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform sampler2D tMask; uniform float uTime;
    varying vec4 vUv; varying vec2 vUv2; varying vec3 vWorld;
    #include <logdepthbuf_pars_fragment>
    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    vec3 ripples(vec2 p,float t){
      vec2 n=vec2(0.0); float ring=0.0;
      for(int L=0;L<2;L++){
        float sc = L==0 ? 3.6 : 5.7;
        vec2 q = p*sc + float(L)*17.3;
        vec2 cell = floor(q);
        for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
          vec2 c = cell+vec2(float(i),float(j));
          float h = h21(c);
          vec2 ctr = c+0.5+(vec2(h21(c+3.1),h21(c+7.7))-0.5)*0.7;
          float ph = fract(t*(0.8+h*0.7)+h*13.0);
          vec2 d = q-ctr; float dist=length(d);
          float w = dist - ph*0.95;
          float env = (1.0-ph)*(1.0-ph)*smoothstep(0.14,0.0,abs(w));
          n += d/(dist+1e-3)*sin(w*38.0)*env;
          ring += max(0.0,cos(w*38.0))*env;
        }
      }
      return vec3(n,ring);
    }
    void main(){
      #include <logdepthbuf_fragment>
      vec4 mk = texture2D(tMask,vUv2);
      float wet = mk.r, pud = mk.g;
      if(wet<0.02) discard;
      vec3 rp = ripples(vWorld.xz,uTime);
      vec4 uvp = vUv; uvp.xy += rp.xy*(0.004+0.014*pud)*uvp.w;
      float blur = (1.0-pud)*0.016+0.0015;
      vec3 refl = vec3(0.0);
      for(int k=-3;k<=3;k++){ vec4 u2=uvp; u2.y += float(k)*blur*uvp.w; refl += texture2DProj(tDiffuse,u2).rgb; }
      refl /= 7.0;
      vec3 V = normalize(cameraPosition-vWorld);
      float fres = 0.6+0.4*pow(1.0-clamp(V.y,0.0,1.0),2.0);
      float strength = wet*fres*mix(0.85,1.35,pud);
      vec3 col = refl*color*strength + vec3(0.55,0.66,0.9)*rp.z*0.09*wet*(0.3+pud);
      float darken = wet*0.26 + pud*0.14;
      gl_FragColor = vec4(col,darken);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
};

/* =====================================================================
   玻璃（透明 + 雨滴沿玻璃滑落的程序化着色器）
   ===================================================================== */
const GLASS_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const GLASS_FS = `
  varying vec2 vUv; uniform float uTime; uniform vec2 uSize;
  #define S(a,b,t) smoothstep(a,b,t)
  vec3 N13(float p){ vec3 p3=fract(vec3(p)*vec3(.1031,.11369,.13787)); p3+=dot(p3,p3.yzx+19.19); return fract(vec3((p3.x+p3.y)*p3.z,(p3.x+p3.z)*p3.y,(p3.y+p3.z)*p3.x)); }
  float N(float t){ return fract(sin(t*12345.564)*7658.76); }
  float Saw(float b,float t){ return S(0.,b,t)*S(1.,b,t); }
  vec2 DropLayer(vec2 uv,float t){
    vec2 UV=uv; uv.y+=t*0.75; vec2 a=vec2(6.,1.); vec2 grid=a*2.; vec2 id=floor(uv*grid);
    float colShift=N(id.x); uv.y+=colShift; id=floor(uv*grid);
    vec3 n=N13(id.x*35.2+id.y*2376.1); vec2 st=fract(uv*grid)-vec2(.5,0.);
    float x=n.x-.5; float y=UV.y*20.; float wig=sin(y+sin(y)); x+=wig*(.5-abs(x))*(n.z-.5); x*=.7;
    float ti=fract(t+n.z); y=(Saw(.85,ti)-.5)*.9+.5; vec2 p=vec2(x,y);
    float d=length((st-p)*a.yx); float mainDrop=S(.4,.0,d);
    float r=sqrt(S(1.,y,st.y)); float cd=abs(st.x-x);
    float trail=S(.23*r,.15*r*r,cd); float trailFront=S(-.02,.02,st.y-y); trail*=trailFront*r*r;
    y=UV.y; y=fract(y*10.)+(st.y-.5); float dd=length(st-vec2(x,y)); float droplets=S(.3,0.,dd);
    return vec2(mainDrop+droplets*r*trailFront, trail);
  }
  float StaticDrops(vec2 uv,float t){ uv*=40.; vec2 id=floor(uv); uv=fract(uv)-.5; vec3 n=N13(id.x*107.45+id.y*3543.654);
    vec2 p=(n.xy-.5)*.7; float d=length(uv-p); float fade=Saw(.025,fract(t+n.z)); return S(.3,0.,d)*fract(n.z*10.)*fade; }
  void main(){
    vec2 uv=vUv*uSize*0.36; float t=uTime*0.2;
    float s=StaticDrops(uv*0.6,t)*0.8;
    vec2 l1=DropLayer(uv,t); vec2 l2=DropLayer(uv*1.7+3.1,t*1.1);
    float drops=clamp(s+l1.x+l2.x*0.8,0.,1.); float trail=clamp(l1.y+l2.y,0.,1.);
    vec3 tint=vec3(0.6,0.75,0.95);
    vec3 col=mix(tint,vec3(0.92,0.96,1.0),drops)*(0.7+drops*0.35);
    float a=0.06+drops*0.3+trail*0.05+pow(vUv.y,3.0)*0.09;
    gl_FragColor=vec4(col,a);
  }`;
function glassMat(w,h){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uTime:timeU,uSize:{value:new THREE.Vector2(w,h)}},vertexShader:GLASS_VS,fragmentShader:GLASS_FS});
}

for(let i=0;i<3;i++){const m=new THREE.Mesh(gc.hb,T(0x3a7050));m.position.set(-7.75+i*0.35,0.45,3.0);m.castShadow=true;addHull(m,0.012);scene.add(m);}

/* =====================================================================
   后院

box(scene,10.2,1.2,0.15,T(0xffffff,0,{map:blockTex}),-1.7,0,-7.85);
box(scene,10.3,0.06,0.22,T(0x9ea2a8),-1.7,1.2,-7.85);
const acBack=[T(0xdad7cf),T(0xdad7cf),T(0xdad7cf),T(0xdad7cf),T(0xdad7cf),T(0xffffff,0,{map:fanTex})];
for(const x of [-4.6,-3.6,-2.6]) box(scene,0.85,0.62,0.3,acBack,x,0,-5.72);
for(const x of [-4.6,-3.6,-2.6]) rod(scene,new V3(x+0.3,0.5,-5.5),new V3(x+0.3,2.4,-5.5),0.025,T(0xe8e4dc));
for(const x of [1.85,2.2]){ cyl(scene,0.14,0.9,T(0x9aa0a6),x,0,-5.7,{hull:0.01}); cyl(scene,0.06,0.08,T(0x5a606c),x,0.9,-5.7,{hull:0.006,seg:8}); }
box(scene,0.8,2.0,0.05,T(0x8d95a3),0.75,0,-5.43);
box(scene,1.0,0.04,0.45,T(0x5a606c),0.75,2.25,-5.62);
const backBulbMat=G(0xffc070,2.5);
cyl(scene,0.05,0.08,backBulbMat,0.75,2.1,-5.5,{hull:0,seg:10});
halo(0.75,2.12,-5.52,0xffb060,0.7,0.6);
const backLight=plight(0xffbc70,2.5,4,0.75,2.0,-5.9);
for(let i=0;i<3;i++) box(scene,0.52,0.24,0.38,T(0xf2c230),-0.5,i*0.24,-6.4);
for(let i=0;i<2;i++) box(scene,0.52,0.24,0.38,T(0x2f6fd6),-1.1,i*0.24,-6.5,{ry:0.15});
// 垃圾集积所
for(let i=0;i<6;i++){const m=new THREE.Mesh(gc.bag ||= new THREE.SphereGeometry(0.2,12,8),new THREE.MeshToonMaterial({color:i%2?0xf2f2f2:0xdce8f0,gradientMap:grad,transparent:true,opacity:0.92}));m.scale.set(1,0.8,1);m.position.set(1.0+(i%3)*0.3,0.16+Math.floor(i/3)*0.2,-7.25+rr(-0.08,0.08));m.castShadow=true;addHull(m,0.01);scene.add(m);}
box(scene,1.1,0.6,0.6,new THREE.MeshToonMaterial({color:0x2f6fd6,gradientMap:grad,transparent:true,opacity:0.3,depthWrite:false}),1.3,0,-7.25);
// 树
{
  const x=2.85,z=-7.1;
  cyl(scene,0.09,1.9,T(0x5b4032),x,0,z,{rt:0.06,hull:0.012,seg:8});
  const lm=T(0x2f6450);
  for(const [dx,y,dz,r] of [[0,2.2,0,0.7],[0.35,1.9,0.2,0.5],[-0.3,2.0,-0.1,0.55],[0.1,2.65,-0.1,0.5],[-0.1,1.75,0.35,0.42]]){
    const m=new THREE.Mesh(gc['ico'+r] ||= new THREE.IcosahedronGeometry(r,1),lm); m.position.set(x+dx,y,z+dz); m.castShadow=true; m.receiveShadow=true; addHull(m,0.02); scene.add(m);
  }
}

/* =====================================================================
   雨：雨丝（LineSegments）+ 溅落（Points）
   ===================================================================== */
const FLOOR_GLSL = `
  float floorAt(vec2 p){
    float f=0.0;
    if(p.x>-5.75&&p.x<2.55&&p.y>-5.55&&p.y<0.55) f=3.55;
    else if(p.x>-5.65&&p.x<2.45&&p.y>=0.55&&p.y<1.42) f=2.46;
    if(p.x<-6.8&&p.y<2.6) f=5.74;
    if(p.x>2.45&&p.x<3.15&&p.y>-4.6&&p.y<-2.55) f=1.91;
    return f;
  }`;
{
  const N=3000, seed=new Float32Array(N*8), end=new Float32Array(N*2);
  for(let i=0;i<N;i++){const x=rr(-8,8),z=rr(-8,8),ph=rand(),sp=rr(9,13);for(let e=0;e<2;e++){seed.set([x,z,ph,sp],(i*2+e)*4);end[i*2+e]=e;}}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*6),3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,4));
  geo.setAttribute('aEnd',new THREE.BufferAttribute(end,1));
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:timeU},
    vertexShader:`uniform float uTime; attribute vec4 aSeed; attribute float aEnd; varying float vA;
      ${FLOOR_GLSL}
      void main(){
        float top=10.0; float fy=floorAt(aSeed.xy); float range=top-fy;
        float y=fy+range-mod(aSeed.z*range+uTime*aSeed.w,range);
        float len=0.26+aSeed.w*0.012;
        vec3 p=vec3(aSeed.x+(y-fy)*0.07,y,aSeed.y+(y-fy)*0.025);
        if(aEnd>0.5) p+=vec3(0.07*len,len,0.025*len);
        vA=smoothstep(fy,fy+0.35,y)*smoothstep(top,top-3.0,y)*(aEnd>0.5?0.03:0.2);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader:`varying float vA; void main(){ gl_FragColor=vec4(0.72,0.82,1.0,vA); }`});
  const rain=new THREE.LineSegments(geo,mat); rain.frustumCulled=false; rain.layers.set(1); scene.add(rain);
}
const splashU={uScale:{value:1}};
{
  const N=1100, seed=new Float32Array(N*4);
  for(let i=0;i<N;i++) seed.set([rr(-7.9,7.9),rr(-7.9,7.9),rand(),rr(1.1,2.2)],i*4);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,4));
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:timeU,uScale:splashU.uScale},
    vertexShader:`uniform float uTime; uniform float uScale; attribute vec4 aSeed; varying float vA;
      ${FLOOR_GLSL}
      float h(float n){ return fract(sin(n)*43758.5453); }
      void main(){
        float k=uTime*aSeed.w+aSeed.z*10.0; float id=floor(k); float c=fract(k);
        vec2 xz=aSeed.xy+(vec2(h(id*12.9898+aSeed.x*7.1),h(id*78.233+aSeed.y*3.7))-0.5)*1.4;
        xz=clamp(xz,vec2(-7.95),vec2(7.95));
        float fy=floorAt(xz); float life=c/0.3;
        vA=life<1.0?(1.0-life):0.0;
        vec4 mv=modelViewMatrix*vec4(xz.x,fy+0.03,xz.y,1.0);
        gl_PointSize=uScale*(0.06+0.2*min(life,1.0))/(-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`varying float vA; void main(){
        vec2 p=gl_PointCoord-0.5; p.y*=2.4; float d=length(p)*2.0;
        float ring=smoothstep(0.55,0.8,d)*smoothstep(1.0,0.82,d);
        float a=ring*vA*0.65; if(a<0.01) discard;
        gl_FragColor=vec4(0.78,0.87,1.0,a); }`});
  const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; pts.layers.set(1); scene.add(pts);
}

/* 屋檐滴水 */
const drips=[];
const dripGeo=new THREE.SphereGeometry(1,8,6), dripMat=G(0xd6e6ff,1.2,null,{transparent:true,opacity:0.85});
const ringGeo=new THREE.RingGeometry(0.8,1.0,32);
function addDrip(x,y0,z,fy){
  const m=new THREE.Mesh(dripGeo,dripMat); m.position.set(x,y0,z); scene.add(m);
  const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0xc4d8ff,transparent:true,opacity:0,depthWrite:false}));
  ring.rotation.x=-PI/2; ring.position.set(x,fy+0.025,z); ring.layers.set(1); scene.add(ring);
  drips.push({m,ring,x,y0,z,fy,phase:0,t:rr(0,2),grow:rr(0.6,2.4),rt:-1});
}
for(let i=0;i<16;i++) addDrip(-5.45+i*0.5+rr(-0.15,0.15),2.26,1.43,0);
for(let i=0;i<4;i++) addDrip(2.56,3.52,-1.6+i*0.5+rr(-0.1,0.1),0);
for(let i=0;i<5;i++) addDrip(-6.72,5.55,-7.0+i*1.9+rr(-0.3,0.3),0);
addDrip(-6.47,2.2,-3.5,0); addDrip(-6.47,2.2,-3.1,0);
function updDrips(dt){
  for(const d of drips){
    d.t+=dt;
    if(d.phase===0){
      const k=Math.min(d.t/d.grow,1);
      d.m.position.set(d.x,d.y0-0.03*k,d.z); d.m.scale.set(0.012+0.012*k,0.016+0.026*k,0.012+0.012*k);
      if(d.t>=d.grow){d.phase=1;d.t=0;}
    } else {
      const y=d.y0-0.03-4.9*d.t*d.t;
      d.m.scale.set(0.016,0.055,0.016);
      if(y<=d.fy){ d.phase=0; d.t=0; d.grow=rr(0.5,2.5); d.rt=0; d.m.position.y=d.y0; }
      else d.m.position.y=y;
    }
    if(d.rt>=0){
      d.rt+=dt; const k=d.rt/0.75;
      if(k>1){d.rt=-1;d.ring.material.opacity=0;}
      else{const s=0.02+k*0.24;d.ring.scale.set(s,s,s);d.ring.material.opacity=(1-k)*0.75;}
    }
  }
}

/* 关东煮蒸汽 */
const steams=[];
for(let i=0;i<9;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
  s.layers.set(1); scene.add(s); steams.push({s,off:i/9});
}
function updSteam(t){
  for(const st of steams){
    const k=(t*0.33+st.off)%1;
    st.s.position.set(0.8+Math.sin(k*6+st.off*20)*0.06,1.25+k*0.75,-2.1+Math.cos(k*5+st.off*9)*0.05);
    const sc=0.12+k*0.35; st.s.scale.set(sc,sc,1);
    st.s.material.opacity=Math.sin(k*PI)*0.28;
  }
}

/* =====================================================================
   动效更新
   ===================================================================== */
const door={state:0,t:0,wait:rr(3,6),off:0};
function updDoor(dt){
  door.t+=dt;
  const ease=x=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  if(door.state===0){ if(door.t>door.wait){door.state=1;door.t=0;} }
  else if(door.state===1){ door.off=ease(Math.min(door.t/0.8,1)); if(door.t>=0.8){door.state=2;door.t=0;} }
  else if(door.state===2){ if(door.t>rr(2.2,2.4)){door.state=3;door.t=0;} }
  else { door.off=1-ease(Math.min(door.t/1.0,1)); if(door.t>=1.0){door.state=0;door.t=0;door.wait=rr(6,14);} }
  movePanel.position.x=0.675+door.off*0.93;
  doorLed.material.color.setRGB(door.state===0?2:0.2,door.state===0?0.1:2,door.state===0?0.1:0.4);
}
function updSignals(t){
  const cyc=t%23;
  for(const s of signals){
    const l=(cyc+(s.group==='V'?0:11.5))%23;
    if(s.type==='car'){
      const on=l<8?0:(l<10.5?1:2);
      s.lamps.forEach((L,i)=>{const o=i===on;L.lamp.material.color.copy(L.base).multiplyScalar(o?3.0:0.07);L.glow.visible=o;});
    } else {
      const g=l<6?1:(l<8?(Math.floor(t*4)%2):0), r=l>=8?1:0;
      s.grn.material.color.setScalar(g?2.2:0.12); s.red.material.color.setScalar(r?2.2:0.12);
    }
  }
}
const fPole=new Flicker(5,14,0.8), fNeon=new Flicker(3,9,1), fCeil=new Flicker(6,16,0.9), fAlley=new Flicker(4,11,0.85), fBand=new Flicker(10,22,0.35), fBack=new Flicker(8,20,0.7);
const baseColor=m=>m.color.clone();
const bc={pole:baseColor(poleSignMat),neon:baseColor(neonMat),ceil:baseColor(ceilFlickMat),alley:baseColor(alleyLampMat),band:baseColor(bandMat),side:baseColor(sideBandMat),back:baseColor(backBulbMat)};
function updFlicker(t,dt){
  const p=fPole.update(t,dt); poleSignMat.color.copy(bc.pole).multiplyScalar(p); poleSignLight.intensity=3.5*p;
  neonMat.color.copy(bc.neon).multiplyScalar(fNeon.update(t,dt));
  ceilFlickMat.color.copy(bc.ceil).multiplyScalar(fCeil.update(t,dt));
  const a=fAlley.update(t,dt); alleyLampMat.color.copy(bc.alley).multiplyScalar(a); alleyLight.intensity=3.5*a; alleyHalo.material.opacity=0.6*a;
  const b=fBand.update(t,dt); bandMat.color.copy(bc.band).multiplyScalar(b); sideBandMat.color.copy(bc.side).multiplyScalar(0.5+0.5*b);
  const k=fBack.update(t,dt); backBulbMat.color.copy(bc.back).multiplyScalar(k); backLight.intensity=2.5*k;
}
function updFlags(t){
  for(const f of flags){
    const pos=f.geo.attributes.position, b=f.base;
    for(let i=0;i<pos.count;i++){
      const x=b[i*3], y=b[i*3+1]; const a=(x/0.5)*(0.55+0.45*(0.9-y)/1.8);
      pos.array[i*3+2]=Math.sin(t*2.1+x*6+y*1.4+f.seed)*0.05*a+Math.sin(t*3.6+y*3+f.seed)*0.015*a;
    }
    pos.needsUpdate=true; f.geo.computeVertexNormals();
  }
}

/* =====================================================================
   后期（Bloom）+ 渲染循环
   ===================================================================== */
const rt=new THREE.WebGLRenderTarget(innerWidth*DPR,innerHeight*DPR,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.55,0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function updScale(){ splashU.uScale.value = renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))); }
updScale();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); bloom.setSize(innerWidth,innerHeight);
  wet.getRenderTarget().setSize(Math.floor(innerWidth*DPR*0.6),Math.floor(innerHeight*DPR*0.6));
  updScale();
});

const clock=new THREE.Clock(); let time=0;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05); time+=dt;
  timeU.value=time; wet.material.uniforms.uTime.value=time;
  updDrips(dt); updDoor(dt); updSignals(time); updFlicker(time,dt); updFlags(time); updSteam(time);
  controls.update();
  const tg=controls.target; tg.x=THREE.MathUtils.clamp(tg.x,-7,7); tg.z=THREE.MathUtils.clamp(tg.z,-7,7); tg.y=THREE.MathUtils.clamp(tg.y,0,5);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
