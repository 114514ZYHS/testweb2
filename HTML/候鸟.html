/* ---------- 0. 数学工具 ---------- */
const TAU=Math.PI*2, DEG=Math.PI/180;

const lerp=(a,b,t)=>a+(b-a)*t;
const smt=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0||1e-9),0,1);return t*t*(3-2*t);};

function n1(x){const i=Math.floor(x),f=x-i,a=h1(i),b=h1(i+1);return lerp(a,b,f*f*(3-2*f));}
function n2(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;
const a=h2(i,j),b=h2(i+1,j),c=h2(i,j+1),d=h2(i+1,j+1);
const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
return lerp(lerp(a,b,ux),lerp(c,d,ux),uy);}
function fbm(x){return n1(x)*.62+n1(x*2.07+7.1)*.27+n1(x*4.13+3.7)*.11;}

function hex(s){return [parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)];}
function mixc(a,b,t,o){o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;}
const _cc=new Map();

/* 风格锋面参差：x 向微扰 + y 向大幅蜿蜒，形成长过渡带 */
function styleAt(x,y,out){

const _ax=new Float64Array(72),_ay=new Float64Array(72),_az=new Float64Array(72);

  FLOCK.x+=132*dt;
  FLOCK.y=riverY(FLOCK.x)*.75+92*Math.sin(FLOCK.x*.00053);
  FLOCK.z=82+15*Math.sin(FLOCK.x*.00037);
  GX0=FLOCK.x; GY0=FLOCK.y; GZ0=FLOCK.z;
  updWind(dt);
  updCamera();
  updBirds(dt);
  updParticles(dt);
  const t0=performance.now();
  render();
  qacc+=performance.now()-t0; qn++;
  if(qn>60){ QLOW=(qacc/qn>24); qacc=0; qn=0; }
  updAudio(dt);
  updPoem(dt);
  updHUD();
}
resize(); POE.on=true;
requestAnimationFrame(frame);
</script>
