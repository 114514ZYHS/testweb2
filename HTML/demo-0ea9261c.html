<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>春秋戰國 · 五百五十年戰爭沙盤（觀賞模式）</title>
<style>
:root{
  --paper:#e6dcc0; --paper2:#dfd3b2; --sea:#b9c6c4; --ink:#20180f; --ink2:#3a2d1e;
  --gold:#c8a34a; --gold2:#efd79a; --seal:#9c2b1f; --seal2:#c4402c;
  --panel:rgba(24,19,14,.90); --panel2:rgba(34,27,19,.94); --line:#5c4a30;
  --dim:#a08d6c; --txt:#ecdfc2;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0b09}
body{font-family:var(--serif);color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;background:
  radial-gradient(1400px 900px at 50% 40%, #1d1813 0%, #0d0b09 78%);}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.30;mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(8,6,4,.55) 78%, rgba(6,4,3,.88) 100%)}

/* ---------- 通用面板 ---------- */
.pnl{position:absolute;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(200,163,74,.14);
  backdrop-filter:blur(3px);border-radius:2px}
.pnl::before{content:"";position:absolute;inset:3px;border:1px solid rgba(200,163,74,.20);pointer-events:none;border-radius:1px}
.hd{font-size:12px;letter-spacing:.34em;color:var(--gold);padding:7px 10px 5px;border-bottom:1px solid rgba(200,163,74,.22);
  display:flex;justify-content:space-between;align-items:center}
.hd i{font-style:normal;color:var(--dim);letter-spacing:.05em;font-size:10px}

/* ---------- 顶栏：纪年 ---------- */
#top{left:50%;transform:translateX(-50%);top:14px;width:640px;padding:10px 16px 12px;text-align:center}
#era{font-size:12px;letter-spacing:.5em;color:var(--gold);margin-bottom:2px}
#yr{font-size:38px;line-height:1.05;letter-spacing:.06em;color:#f6ecd2;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#yr b{font-size:22px;color:var(--gold2);font-weight:400}
#reign{font-size:12.5px;color:var(--dim);letter-spacing:.16em;margin-top:3px;min-height:16px}
#bar{margin-top:9px;height:5px;background:rgba(0,0,0,.45);border:1px solid rgba(200,163,74,.25);position:relative}
#barf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7a5c33,#c8a34a,#efd79a);
  box-shadow:0 0 12px rgba(200,163,74,.6);transition:width .18s linear}
#ticks{position:absolute;inset:0}
#ticks span{position:absolute;top:-3px;width:1px;height:11px;background:rgba(236,223,194,.5)}

/* ---------- 左：旁白 ---------- */
#narr{left:20px;bottom:20px;width:436px;padding:0 0 10px}
#narrK{display:inline-block;margin:9px 0 0 11px;padding:2px 9px;font-size:11.5px;letter-spacing:.24em;
  color:#f3e6c6;background:var(--seal);border-radius:1px;box-shadow:0 1px 6px rgba(156,43,31,.6)}
#narrT{font-size:22px;letter-spacing:.13em;color:#f6ecd2;padding:6px 14px 2px;font-family:var(--kai)}
#narrY{font-size:11px;color:var(--dim);padding:0 14px 6px;letter-spacing:.14em}
#narrD{font-size:14.6px;line-height:1.85;color:#eadcb8;padding:2px 14px 8px;min-height:76px;font-family:var(--kai)}
#narrQ{font-size:12.6px;line-height:1.7;color:var(--gold2);padding:8px 14px 2px;margin:0 12px;
  border-top:1px solid rgba(200,163,74,.2);font-family:var(--kai);opacity:.95;min-height:20px}

/* ---------- 左上：人物 / 诸子 ---------- */
#sage{left:20px;top:14px;width:250px;padding-bottom:9px;opacity:0;transform:translateX(-14px);transition:opacity .5s,transform .5s}
#sage.on{opacity:1;transform:none}
#sageN{font-size:23px;letter-spacing:.18em;padding:9px 12px 0;color:#f6ecd2;font-family:var(--kai)}
#sageR{font-size:11px;letter-spacing:.2em;color:var(--gold);padding:3px 12px 6px}
#sageD{font-size:12.8px;line-height:1.75;color:#d6c6a0;padding:0 12px;font-family:var(--kai)}
#sageW{font-size:12.6px;line-height:1.7;color:var(--gold2);padding:8px 12px 0;margin-top:6px;border-top:1px solid rgba(200,163,74,.18);font-family:var(--kai)}

/* ---------- 右：列国榜 ---------- */
#rank{right:20px;top:14px;width:262px;padding-bottom:8px}
.row{display:flex;align-items:center;gap:7px;padding:3px 10px;font-size:13px;transition:opacity .4s}
.row .sq{width:11px;height:11px;flex:0 0 11px;border:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(236,223,194,.16)}
.row .nm{width:32px;letter-spacing:.08em;color:#f2e6c8}
.row .bw{flex:1;height:9px;background:rgba(0,0,0,.42);position:relative;overflow:hidden}
.row .bf{position:absolute;left:0;top:0;bottom:0;transition:width .45s cubic-bezier(.4,1.2,.4,1)}
.row .vl{width:66px;text-align:right;font-size:11px;color:#d3c19a;letter-spacing:.01em}
.row.dead{opacity:.24;filter:grayscale(1)}
.row .hg{color:var(--gold2);font-size:11px;width:12px}

/* ---------- 右下：战报 ---------- */
#war{right:20px;bottom:172px;width:262px;height:214px;display:flex;flex-direction:column}
#warL{flex:1;overflow:hidden;padding:4px 9px 6px;display:flex;flex-direction:column-reverse}
.wi{font-size:12.2px;line-height:1.55;color:#d3c3a0;padding:3px 0;border-bottom:1px dashed rgba(200,163,74,.13);animation:fi .5s}
.wi b{color:#f0dfb4;font-weight:400}
.wi .k{color:var(--seal2)}
.wi .y{color:var(--dim);font-size:10.5px;margin-right:5px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 右下：国力消长图 ---------- */
#chartBox{right:20px;bottom:20px;width:262px;height:142px}
#chart{position:absolute;left:6px;right:6px;top:26px;bottom:16px;width:calc(100% - 12px);height:calc(100% - 42px)}
#chartX{position:absolute;left:8px;right:8px;bottom:2px;display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}

/* ---------- 底部控制条 ---------- */
#ctl{left:50%;transform:translateX(-50%);bottom:20px;padding:7px 10px;display:flex;align-items:center;gap:7px}
.btn{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:#f2e5c4;background:rgba(72,58,39,.72);
  border:1px solid rgba(200,163,74,.28);padding:5px 11px;cursor:pointer;border-radius:1px;transition:.18s;white-space:nowrap}
.btn:hover{background:rgba(120,92,52,.7);color:#fff4d8;border-color:var(--gold)}
.btn.on{background:linear-gradient(180deg,#8a6a34,#6a5028);color:#ffeec4;border-color:var(--gold2)}
.sep{width:1px;height:20px;background:rgba(200,163,74,.22);margin:0 2px}
#spd{font-size:12px;color:var(--gold2);width:40px;text-align:center;letter-spacing:.06em}

/* ---------- 章节条 ---------- */
#chap{left:50%;transform:translateX(-50%);bottom:70px;display:flex;gap:5px;background:rgba(20,16,11,.72);
  border:1px solid rgba(200,163,74,.18);padding:5px 7px;border-radius:2px}
.cbtn{font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;color:#b8a680;background:transparent;border:0;
  padding:3px 8px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.cbtn:hover{color:#f2e3bd}
.cbtn.on{color:#ffeec4;border-bottom-color:var(--gold)}

/* ---------- 大事标题闪现 ---------- */
#flash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0}
#flashT{font-family:var(--kai);font-size:70px;letter-spacing:.3em;color:#fff2d0;
  text-shadow:0 0 30px rgba(200,163,74,.85),0 6px 26px rgba(0,0,0,.9);white-space:nowrap}
#flashS{font-size:15px;letter-spacing:.5em;color:var(--gold2);margin-top:12px;text-shadow:0 2px 10px #000}
@keyframes flashIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}
 14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 78%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
#flash.go{animation:flashIn 3.1s ease-out}

/* ---------- 典故走马灯 ---------- */
#idiom{position:absolute;left:50%;transform:translateX(-50%);top:118px;font-family:var(--kai);font-size:15px;
  letter-spacing:.34em;color:rgba(246,236,210,.82);text-shadow:0 2px 12px rgba(0,0,0,.85);opacity:0;transition:opacity .8s;white-space:nowrap}
#idiom.on{opacity:1}
#idiom u{text-decoration:none;color:var(--gold2)}

/* ---------- 竖排书名 ---------- */
#title{position:absolute;left:22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  font-family:var(--kai);font-size:27px;letter-spacing:.34em;color:rgba(200,163,74,.30);pointer-events:none;
  text-shadow:0 2px 18px rgba(0,0,0,.7);opacity:0;transition:opacity .8s}

/* ---------- 序幕 ---------- */
#intro{position:absolute;inset:0;background:radial-gradient(900px 620px at 50% 45%,#231c14,#0b0908 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;transition:opacity 1.1s}
#intro.off{opacity:0;pointer-events:none}
#itl{font-family:var(--kai);font-size:82px;letter-spacing:.42em;color:#f4e4bb;text-indent:.42em;
  text-shadow:0 0 46px rgba(200,163,74,.5),0 8px 40px #000}
#isb{font-size:15px;letter-spacing:.72em;color:var(--gold);margin-top:20px;text-indent:.72em}
#idc{font-family:var(--kai);font-size:14px;line-height:2.1;color:#b9a986;margin-top:26px;text-align:center;max-width:620px}
#igo,#ipl{font-family:var(--kai);font-size:16px;letter-spacing:.32em;color:#f6ecd2;background:transparent;
  border:1px solid var(--gold);padding:11px 40px;cursor:pointer;transition:.3s;text-indent:.32em}
#igo:hover,#ipl:hover{background:var(--gold);color:#241c10;box-shadow:0 0 34px rgba(200,163,74,.5)}
#ipl{border-color:var(--seal2);color:#f3d9c8}
#ipl:hover{background:var(--seal);color:#f6ecd2;box-shadow:0 0 34px rgba(156,43,31,.55)}
#iseal{position:absolute;right:9%;bottom:12%;width:96px;height:96px;border:3px solid rgba(156,43,31,.85);
  color:rgba(196,64,44,.92);font-family:var(--kai);font-size:30px;letter-spacing:.06em;display:grid;
  place-content:center;line-height:1.1;text-align:center;transform:rotate(-6deg);opacity:.9}

/* ---------- 提示 ---------- */
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;font-size:11.5px;letter-spacing:.24em;
  color:rgba(200,163,74,.55);pointer-events:none;transition:opacity .6s}
#tip{position:absolute;pointer-events:none;background:rgba(18,14,10,.94);border:1px solid var(--line);padding:5px 9px;
  font-size:12px;color:#e6d8b4;letter-spacing:.06em;opacity:0;transition:opacity .18s;white-space:nowrap;z-index:40;border-radius:2px}
#tip b{color:var(--gold2);font-weight:400}
/* ---------- 爭霸模式 ---------- */
body.play #ctl,body.play #chap,body.play #war,body.play #chartBox,body.play #hint{display:none}
#gbar{left:50%;transform:translateX(-50%);bottom:18px;padding:8px 14px;display:none;align-items:center;gap:14px}
body.play #gbar{display:flex}
.res{display:flex;flex-direction:column;align-items:center;min-width:52px}
.res b{font-size:16px;color:#f4e6c2;font-weight:400;letter-spacing:.02em}
.res i{font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.2em;margin-top:1px}
#acts{display:flex;gap:3px}
#acts s{width:9px;height:16px;background:#4a3d2a;border:1px solid rgba(200,163,74,.4);text-decoration:none;display:block}
#acts s.on{background:linear-gradient(180deg,#f0d38a,#c8a34a);box-shadow:0 0 7px rgba(240,211,138,.7)}
#bEnd{font-size:14px;padding:7px 18px;letter-spacing:.2em;background:linear-gradient(180deg,#7d4a2c,#5c331d);border-color:#b06a3a;color:#ffe6c8}
#bEnd:hover{background:linear-gradient(180deg,#a35f36,#7d4425)}
#gpan{right:20px;top:262px;bottom:18px;width:262px;display:none;flex-direction:column}
body.play #gpan{display:flex}
#gtab{display:flex;border-bottom:1px solid rgba(200,163,74,.22)}
#gtab button{flex:1;font-family:var(--serif);font-size:11.5px;letter-spacing:.06em;color:#b8a680;background:transparent;
  border:0;padding:6px 0;cursor:pointer;border-bottom:2px solid transparent;transition:.18s}
#gtab button:hover{color:#f2e3bd}
#gtab button.on{color:#ffeec4;border-bottom-color:var(--gold);background:rgba(200,163,74,.09)}
#gbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:7px 9px}
#gbody::-webkit-scrollbar{width:7px}
#gbody::-webkit-scrollbar-thumb{background:#4a3d2c}
.gh{font-size:11px;letter-spacing:.22em;color:var(--gold);margin:7px 0 4px;border-bottom:1px dashed rgba(200,163,74,.2);padding-bottom:2px}
.gr{display:flex;align-items:center;gap:6px;padding:3px 2px;font-size:12px;color:#dccfae}
.gr .k{color:var(--dim);min-width:34px}
.gb{font-family:var(--serif);font-size:11.5px;color:#efe0bc;background:rgba(70,56,38,.72);border:1px solid rgba(200,163,74,.3);
  padding:3px 8px;margin:2px 3px 2px 0;cursor:pointer;border-radius:1px;letter-spacing:.06em;transition:.15s}
.gb:hover{background:rgba(120,92,52,.85);border-color:var(--gold);color:#fff4d8}
.gb.no{opacity:.4;cursor:not-allowed}
.gb.hot{background:linear-gradient(180deg,#7d3a2c,#5c281d);border-color:#b0503a}
.gc{border:1px solid rgba(200,163,74,.18);padding:5px 7px;margin:4px 0;background:rgba(0,0,0,.2)}
.gc h5{font-size:13px;color:#f2e3bd;font-weight:400;letter-spacing:.1em;margin-bottom:2px}
.gc p{font-size:11.4px;line-height:1.6;color:#bfae8b;font-family:var(--kai)}
.gc .q{color:var(--gold2);font-size:11.4px;font-family:var(--kai);margin-top:3px}
.stg{display:inline-block;font-size:10.5px;padding:0 4px;border:1px solid rgba(200,163,74,.35);color:var(--gold2);margin-left:4px}
.stg.w{color:#e08f7a;border-color:#8a4436}
.stg.a{color:#9fd39f;border-color:#3f7a4a}
#gcity{left:50%;transform:translateX(-50%);bottom:86px;width:576px;padding:8px 12px 10px;display:none}
body.play #gcity.on{display:block}
#gcity h4{font-size:17px;letter-spacing:.14em;color:#f6ecd2;font-weight:400;font-family:var(--kai);margin-bottom:2px}
#gcity .note{font-size:11.4px;color:#a8977a;font-family:var(--kai);margin-bottom:5px}
#gcity .stats{display:flex;gap:13px;font-size:11.6px;color:#cfc0a0;margin-bottom:6px;flex-wrap:wrap}
#gcity .stats b{color:#f2e3bd;font-weight:400}
#mask{position:absolute;inset:0;background:rgba(8,6,4,.72);display:none;align-items:center;justify-content:center;z-index:70}
#mask.on{display:flex}
#modal{width:560px;max-height:78vh;overflow:auto;background:var(--panel2);border:1px solid var(--gold);
  box-shadow:0 20px 70px rgba(0,0,0,.8);padding:18px 22px}
#modal h3{font-size:22px;letter-spacing:.2em;color:#f6ecd2;font-weight:400;font-family:var(--kai);margin-bottom:10px;
  border-bottom:1px solid rgba(200,163,74,.28);padding-bottom:7px}
#modal p{font-size:13.4px;line-height:1.9;color:#dccfae;font-family:var(--kai);margin:6px 0}
#modal p.q{color:var(--gold2)}
#modal p.sm{font-size:11.6px;color:var(--dim);letter-spacing:.08em}
#mbtn{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:120px;background:rgba(24,18,12,.94);
  border:1px solid var(--gold);padding:8px 20px;font-size:13px;color:#f2e3bd;letter-spacing:.1em;
  opacity:0;transition:opacity .3s;z-index:80;pointer-events:none;font-family:var(--kai)}
#toast.on{opacity:1}
#start{position:absolute;inset:0;background:radial-gradient(1000px 700px at 50% 42%,#241d15,#0b0908 76%);
  display:none;flex-direction:column;align-items:center;justify-content:center;z-index:65;padding:26px}
#start.on{display:flex}
#start h2{font-family:var(--kai);font-size:34px;letter-spacing:.3em;color:#f4e4bb;text-indent:.3em;margin-bottom:6px}
#start .sub{font-size:12px;letter-spacing:.4em;color:var(--gold);margin-bottom:20px}
#scl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1352px}
.sci{width:180px;border:1px solid rgba(200,163,74,.3);background:rgba(30,24,17,.8);padding:10px 12px;cursor:pointer;transition:.2s}
.sci:hover{border-color:var(--gold);background:rgba(60,46,30,.9);transform:translateY(-3px)}
.sci.on{border-color:var(--gold2);background:rgba(88,66,38,.9);box-shadow:0 0 24px rgba(200,163,74,.3)}
.sci b{display:block;font-size:16px;color:#f6ecd2;font-weight:400;letter-spacing:.14em;font-family:var(--kai)}
.sci i{display:block;font-style:normal;font-size:10.5px;color:var(--gold);letter-spacing:.14em;margin:3px 0 5px}
.sci p{font-size:11px;line-height:1.58;color:#b3a284;font-family:var(--kai)}
#stl{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:1000px;margin-top:18px;min-height:64px}
.sti{width:108px;border:1px solid rgba(200,163,74,.26);background:rgba(28,22,16,.82);padding:7px 8px;cursor:pointer;transition:.18s;text-align:center}
.sti:hover{border-color:var(--gold);transform:translateY(-2px)}
.sti.on{border-color:var(--gold2);box-shadow:0 0 18px rgba(200,163,74,.35)}
.sti b{display:block;font-size:19px;font-weight:400;font-family:var(--kai);letter-spacing:.1em}
.sti span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.sti em{display:block;font-style:normal;font-size:10.5px;color:#c9b993;margin-top:3px;font-family:var(--kai)}
#sgo{margin-top:20px;display:flex;gap:12px}
@media (max-width:1400px){#narr{width:392px}#rank,#war,#chartBox{width:236px}#itl{font-size:62px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="title">春秋戰國‧五百五十年</div>
  <div id="idiom"></div>
  <div id="flash"><div id="flashT"></div><div id="flashS"></div></div>

  <div id="top" class="pnl">
    <div id="era">周 · 東遷</div>
    <div id="yr">公元前 <b>七七〇</b> 年</div>
    <div id="reign">周平王元年</div>
    <div id="bar"><div id="barf"></div><div id="ticks"></div></div>
  </div>

  <div id="sage" class="pnl">
    <div class="hd">人 物 誌 <i>PERSONA</i></div>
    <div id="sageN"></div><div id="sageR"></div><div id="sageD"></div><div id="sageW"></div>
  </div>

  <div id="rank" class="pnl">
    <div class="hd">列 國 消 長 <i id="alv"></i></div>
    <div id="rows"></div>
  </div>

  <div id="war" class="pnl">
    <div class="hd">戰 報 <i>DISPATCHES</i></div>
    <div id="warL"></div>
  </div>

  <div id="chartBox" class="pnl">
    <div class="hd">疆 域 曲 線 <i>550 YRS</i></div>
    <canvas id="chart"></canvas>
    <div id="chartX"><span>前770</span><span>前500</span><span>前221</span></div>
  </div>

  <div id="narr" class="pnl">
    <span id="narrK">紀</span>
    <div id="narrT"></div>
    <div id="narrY"></div>
    <div id="narrD"></div>
    <div id="narrQ"></div>
  </div>

  <div id="chap"></div>
  <div id="ctl" class="pnl">
    <button class="btn" id="bPlay">‖ 暫停</button>
    <button class="btn" id="bSlow">慢</button>
    <span id="spd">1.0×</span>
    <button class="btn" id="bFast">快</button>
    <div class="sep"></div>
    <button class="btn" id="bPrev">◂ 上一事</button>

var EV=[
{y:-770,k:"政",t:"平王東遷",s:"luoyi",fl:1,d:"犬戎破鎬京，幽王死於驪山之下。平王避戎東遷洛邑，王畿由千里縮為六百里。天子之尊自此不出成周。",q:"《詩·王風·黍離》：知我者謂我心憂，不知我者謂我何求。",own:[["qifeng","qin"]],e:"春秋"},
{y:-769,k:"滅",t:"鄭滅虢鄶",s:"xinzheng",d:"鄭武公東遷取虢、鄶十邑，據天下之樞，開春秋兼併之端。"},
{y:-750,k:"戰",t:"秦逐戎至岐",s:"qifeng",d:"秦文公東獵至汧渭之會，逐戎人，收周餘民，以岐以東獻周。西陲牧馬之族始為諸侯。",own:[["longxi","qin"]]},
{y:-722,k:"政",t:"鄭伯克段于鄢",s:"xinzheng",d:"《春秋》始筆之年。鄭莊公縱弟共叔段之惡而後誅之，掘地及泉與母相見。",q:"《左傳》：多行不義，必自斃，子姑待之。"},
{y:-707,k:"戰",t:"繻葛之戰",s:"xinzheng",d:"周桓王率蔡衛陳伐鄭，鄭將祝聃射王中肩。王師敗績而諸侯莫救，天子權威掃地。",q:"《左傳》：君子不欲多上人，況敢陵天子乎？",war:{a:"zhou",d:"zheng",w:"zheng",ka:1.2,kd:0.6}},
{y:-701,k:"政",t:"鄭莊小霸",s:"xinzheng",d:"鄭莊公卒。其一生挾天子以令諸侯，會盟征伐三十餘年，史稱春秋小霸。其後鄭亂，霸業旋滅。"},
{y:-690,k:"戰",t:"楚服漢東",s:"suicheng",d:"楚武王卒於伐隨之途，秘不發喪而克隨。漢陽諸姬盡入楚之版圖，荊蠻自此北望中原。",q:"《史記》：我蠻夷也，不與中國之號諡。",own:[["suicheng","chu"]]},
{y:-685,k:"人",t:"管仲相齊",s:"linzi",sg:"guanzhong",d:"齊桓公不記射鉤之仇，以囚徒管夷吾為相。作內政而寄軍令，設鹽鐵之官，通輕重之權，齊遂富強。",q:"《管子》：倉廩實而知禮節，衣食足而知榮辱。"},
{y:-681,k:"盟",t:"北杏之會",s:"linzi",d:"齊始以諸侯之身會盟列國，曹沫執匕首劫桓公於柯，桓公許歸魯地而不悔，天下由是信齊。"},
{y:-679,k:"政",t:"曲沃代翼",s:"quwo",d:"曲沃武公盡併晉國，以寶器賂周僖王，命為晉侯。小宗代大宗六十七年而後成，晉之公族自此凋零。",own:[["jiang","jin"],["quwo","jin"],["anyi","jin"]]},
{y:-664,k:"戰",t:"齊救燕伐山戎",s:"guzhu",d:"山戎伐燕，桓公北征至孤竹，迷道而放老馬以識途。桓公割燕君所送之地予燕，諸侯服其義。",q:"《韓非子》：老馬之智可用也。",own:[["guzhu","yan"]],war:{a:"qi",d:"di",w:"qi",ka:0.8,kd:2.0}},
{y:-660,k:"滅",t:"狄滅衛",s:"chaoge",d:"衛懿公好鶴，鶴有祿位。狄人至，國人曰使鶴戰。衛師大潰，懿公死之，遺民僅七百三十人。",own:[["chaoge","di"]],war:{a:"di",d:"wey",w:"di",ka:0.5,kd:2.2}},
{y:-658,k:"政",t:"桓公存三亡國",s:"diqiu",d:"齊桓城楚丘以封衛，城夷儀以封邢，遷杞於緣陵。存亡繼絕，中國不絕如縷而復振。",own:[["diqiu","wey"]]},
{y:-656,k:"盟",t:"召陵之盟",s:"zhaoling",d:"桓公率八國之師南伐楚，責以包茅不入、昭王南征不復。楚使屈完當軍而問，遂盟於召陵，兵不血刃而屈強楚。",q:"《左傳》：君處北海，寡人處南海，唯是風馬牛不相及也。"},
{y:-655,k:"滅",t:"假道伐虢",s:"puban",d:"晉獻公以垂棘之璧、屈產之乘假道於虞。宮之奇諫曰輔車相依，唇亡齒寒。虞公不聽，虢亡而虞隨之。",q:"《左傳》：唇亡則齒寒，其虞虢之謂也。",own:[["puban","jin"]]},
{y:-651,k:"盟",t:"葵丘之會",s:"kuiqiu",fl:1,heg:"qi",d:"周襄王使宰孔賜齊侯胙，命無下拜。桓公下拜受賜，九合諸侯，一匡天下。尊王攘夷之業於此極盛。",q:"《孟子》：五霸桓公為盛，葵丘之會，束牲載書而不歃血。"},
{y:-645,k:"戰",t:"韓原之戰",s:"hanyuan",d:"晉惠公背秦約而伐秦，戰於韓原。晉侯馬陷泥淖，秦人獲之以歸。晉獻河西之地，秦晉之好蒙塵。",own:[["shaoliang","qin"]],war:{a:"qin",d:"jin",w:"qin",ka:1.0,kd:2.4}},
{y:-644,k:"人",t:"管仲之終",s:"linzi",d:"管仲病篤，桓公問誰可相。仲曰易牙殺子、豎刁自宮、開方去親，皆非人情，不可近。桓公不聽。"},
{y:-643,k:"政",t:"桓公之死",s:"linzi",d:"齊桓公卒，五公子爭立，停屍六十七日而蟲出於戶。首霸之業，一夕而墜。",q:"《史記》：桓公病，五公子各樹黨爭立。"},
{y:-638,k:"戰",t:"泓水之戰",s:"hongshui",d:"宋襄公欲繼齊業，與楚戰於泓。不鼓不成列，不擒二毛，遂大敗傷股而死。仁義之師終不敵蠻力。",q:"《左傳》：君子不重傷，不禽二毛。",war:{a:"chu",d:"song",w:"chu",ka:0.5,kd:1.8}},
{y:-636,k:"人",t:"重耳返國",s:"jiang",d:"晉公子重耳流亡十九年，歷狄齊曹宋鄭楚秦。介子推割股，秦穆公納之以歸。年六十二而立，是為晉文公。",q:"《左傳》：民生安樂，誰知其他？"},
{y:-635,k:"政",t:"文公勤王",s:"chaoge",own:[["chaoge","jin"]],d:"王子帶之亂，襄王出居於鄭。晉文公納王而誅帶，王賜陽樊、溫、原、攢茅之田。晉遂有南陽河內，兵鋒直抵大河。"},
{y:-632,k:"戰",t:"城濮之戰",s:"chengpu",fl:1,heg:"jin",d:"晉楚會於城濮。晉文公退避三舍以報楚惠，胥臣蒙馬以虎皮衝陳蔡，楚左右軍潰，子玉自殺。晉遂霸。",q:"《左傳》：晉侯在外十九年矣，險阻艱難，備嘗之矣。",war:{a:"jin",d:"chu",w:"jin",ka:1.2,kd:3.5}},
{y:-631,k:"盟",t:"踐土之盟",s:"jiantu",d:"晉文公朝王於踐土，王策命為侯伯，賜大輅之服、彤弓矢、虎賁三百人。孔子譏之曰以臣召君，不可以訓。"},
{y:-627,k:"戰",t:"崤之戰",s:"xiaoshan",d:"秦師襲鄭，弦高以十二牛犒師而鄭得備。師還過崤，晉伏兵盡殲之，三帥被擒。秦晉之好裂為世仇。",q:"《左傳》：勞師以襲遠，非所聞也。",war:{a:"jin",d:"qin",w:"jin",ka:0.4,kd:3.0},own:[["shaoliang","jin"]]},
{y:-624,k:"戰",t:"穆公霸西戎",s:"yong",d:"秦穆公用由余之謀，益國十二，開地千里，遂霸西戎。天子致賀以金鼓。東出之志既阻，乃營西土之基。",own:[["yuzhong","qin"]]},
{y:-621,k:"政",t:"三良殉秦",s:"yong",d:"秦穆公卒，以子車氏三子殉葬，國人哀之作黃鳥。君子曰秦之不復東征也宜哉。",q:"《詩·秦風·黃鳥》：彼蒼者天，殲我良人。"},
{y:-613,k:"人",t:"三年不鳴",s:"ying",d:"楚莊王即位三年不出號令，日夜為樂。伍舉進隱曰有鳥三年不飛不鳴。王曰三年不飛，飛將沖天。乃罷淫樂而聽政。",q:"《史記》：此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人。"},
{y:-606,k:"政",t:"問鼎中原",s:"luoyi",d:"楚莊王伐陸渾之戎，觀兵於周疆。使問九鼎之大小輕重，王孫滿對曰在德不在鼎。楚之志已在天下。",q:"《左傳》：在德不在鼎……周德雖衰，天命未改。"},
{y:-597,k:"戰",t:"邲之戰",s:"bi",fl:1,heg:"chu",d:"晉楚戰於邲。晉三軍不和，中軍先濟，舟中之指可掬。楚莊王飲馬黃河，遂霸中原。",q:"《左傳》：夫文，止戈為武。",war:{a:"chu",d:"jin",w:"chu",ka:1.5,kd:4.0}},
{y:-594,k:"戰",t:"楚圍宋九月",s:"shangqiu",d:"楚圍宋，城中易子而食，析骸而爨。華元夜入楚軍，登子反之床曰城下之盟有以國斃不能從也。楚為之退三十里。",q:"《左傳》：敝邑易子而食，析骸以爨。"},
{y:-594,k:"變",t:"魯初稅畝",s:"qufu",d:"魯宣公初稅畝，履畝而稅，井田之制自此崩。私田日闢，公室日卑，土地私有之端開於此。"},
{y:-589,k:"戰",t:"鞍之戰",s:"linzi",d:"齊頃公輕晉，曰余姑翦滅此而朝食。逢丑父易位而免其君，晉終大勝，齊歸侵地。",q:"《左傳》：余姑翦滅此而朝食。",war:{a:"jin",d:"qi",w:"jin",ka:1.0,kd:2.5}},
{y:-584,k:"謀",t:"巫臣通吳",s:"gusu",d:"申公巫臣奔晉，請使於吳，教吳乘車、戰陣、叛楚。楚自此疲於奔命，晉得東南之奇兵。",q:"《左傳》：吾使爾罷於奔命以死。"},
{y:-579,k:"盟",t:"第一次弭兵",s:"shangqiu",d:"宋大夫華元合晉楚之成，盟於宋西門之外。曰凡晉楚無相加戎，好惡同之。三年而復戰，然息兵之議自此始。"},
{y:-575,k:"戰",t:"鄢陵之戰",s:"yanling",d:"晉厲公敗楚於鄢陵，呂錡射中楚共王之目，子反醉而自殺。晉之霸業回光，而國內六卿之勢已成。",q:"《左傳》：困獸猶鬥，況國相乎？",war:{a:"jin",d:"chu",w:"jin",ka:1.2,kd:2.6}},
{y:-573,k:"政",t:"悼公復霸",s:"jiang",d:"晉悼公年十四而立，魏絳和戎、三分四軍以疲楚，八年之中九合諸侯，晉室中興。",own:[["shangdang","jin"]]},
{y:-562,k:"謀",t:"三駕疲楚",s:"xinzheng",d:"晉三分其軍更番伐鄭，楚不能救。鄭終附晉，中原復定，此後晉楚不復大戰十餘年。"},
{y:-551,k:"學",t:"孔子生於陬邑",s:"qufu",sg:"kongzi",d:"魯襄公二十二年，孔丘生。父叔梁紇，母顏徵在。其後刪詩書、定禮樂、修春秋，為萬世師表。",q:"《論語》：十有五而志於學，三十而立。"},
{y:-548,k:"政",t:"崔杼弒其君",s:"linzi",d:"齊太史書崔杼弒莊公，崔子殺之；其弟嗣書，又殺之；少弟又書，乃捨之。南史氏執簡而往，聞既書乃還。",q:"《左傳》：崔杼弒其君。"},
{y:-546,k:"盟",t:"向戌弭兵",s:"shangqiu",fl:1,d:"宋向戌合晉楚之成，十四國會於宋。晉楚之從交相見，中原自此四十餘年無大戰，兵禍南移於吳楚。",q:"《左傳》：兵，民之殘也，財用之蠹也。"},
{y:-543,k:"人",t:"子產為政",s:"xinzheng",sg:"zichan",d:"鄭子產執政，作封洫、立謗政、不毀鄉校。一年民歌其取我衣冠，三年而歌其教我子弟。",q:"《左傳》：苟利社稷，死生以之。"},
{y:-536,k:"變",t:"鄭鑄刑書",s:"xinzheng",d:"子產鑄刑書於鼎，公布成文之法。叔向責之曰民知爭端，將棄禮而徵於書。然法治之先聲自此發。"},
{y:-522,k:"人",t:"伍員奔吳",s:"gusu",d:"楚平王殺伍奢父子，伍員亡命，過昭關一夜白頭。漁父渡之，浣女飼之，終入於吳，誓覆楚國。",q:"《史記》：我必覆楚國。"},
{y:-515,k:"謀",t:"專諸刺王僚",s:"gusu",d:"公子光伏甲士於窟室，使專諸置魚腸劍於炙魚之腹，進而刺王僚，鈹交於胸。光立，是為闔閭。"},
{y:-512,k:"學",t:"孫武見吳王",s:"gusu",sg:"sunwu",d:"孫武以兵法十三篇見吳王，勒宮女為陣，斬愛姬二人以明軍法。闔閭知其能用兵，乃以為將。",q:"《孫子》：兵者，國之大事，死生之地，存亡之道。"},
{y:-506,k:"戰",t:"柏舉之戰",s:"baiju",fl:1,d:"吳以三萬之師破楚二十萬於柏舉，五戰及郢。昭王出奔，伍員掘平王墓鞭屍三百。楚幾亡矣。",q:"《史記》：吾日暮途遠，故倒行而逆施之。",war:{a:"wu",d:"chu",w:"wu",ka:1.0,kd:6.0},own:[["ying","wu"]]},
{y:-505,k:"人",t:"申包胥哭秦庭",s:"yong",d:"申包胥立於秦庭，晝夜哭，七日不絕聲。秦哀公為賦無衣，出車五百乘救楚。越人乘虛襲吳，吳師乃還。",q:"《詩·秦風·無衣》：豈曰無衣？與子同袍。王于興師，修我戈矛。",own:[["ying","chu"]]},
{y:-496,k:"戰",t:"檇李之戰",s:"kuaiji",d:"越王勾踐使罪人自剄於陣前，吳師屬目，越乘之而勝。闔閭傷指而死，遺命夫差曰爾忘勾踐殺汝父乎。",war:{a:"yue",d:"wu",w:"yue",ka:0.8,kd:1.5}},
{y:-494,k:"戰",t:"夫椒之戰",s:"fujiao",d:"夫差報父仇，敗越於夫椒。勾踐以五千人保棲會稽，卑辭厚幣，入吳為臣，執箕帚三年。",q:"《國語》：越必興，吳必亡。",war:{a:"wu",d:"yue",w:"wu",ka:1.0,kd:3.0}},
{y:-487,k:"滅",t:"宋滅曹",s:"taoyi",ann:[["cao","song"]],d:"曹伯陽好田弋，聽公孫彊之言而背晉伐宋。宋人圍之，執伯陽及彊以歸而殺之。天下之中陶邑，遂為宋有。"},
{y:-486,k:"變",t:"邗溝通江淮",s:"guangling",d:"吳城邗，溝通江淮，以舟師北上爭霸。中國運河之始，亦吳國國力耗盡之始。"},
{y:-484,k:"戰",t:"艾陵之戰",s:"ailing",d:"吳大敗齊師於艾陵，獲革車八百乘、甲首三千。同年，夫差賜伍子胥屬鏤之劍，胥曰抉吾眼懸東門，以觀越人之入吳。",q:"《史記》：必樹吾墓上以梓，令可以為器；而抉吾眼懸吳東門之上。",war:{a:"wu",d:"qi",w:"wu",ka:0.8,kd:3.0}},
{y:-482,k:"盟",t:"黃池爭長",s:"huangchi",d:"夫差會諸侯於黃池，與晉爭先歃。越王乘虛入吳，焚姑蘇，俘太子友。夫差聞之，秘不發喪，強盟而歸。"},
{y:-479,k:"學",t:"孔子卒",s:"qufu",d:"孔子卒於魯，年七十三。弟子三千，賢者七十二。哲人其萎，然六藝之教流布天下，儒者遂為顯學。",q:"《論語》：朝聞道，夕死可矣。"},
{y:-479,k:"滅",t:"楚滅陳",s:"chenqiu",ann:[["chen","chu"]],d:"楚惠王縣陳。舜後媯姓之國，歷五百餘年而絕。"},
{y:-473,k:"滅",t:"越滅吳",s:"gusu",fl:1,ann:[["wu","yue"]],d:"勾踐臥薪嘗膽二十二年，三戰而滅吳。夫差請為附庸不許，掩面自剄曰吾無面目見子胥。范蠡浮海而去。",q:"《史記》：飛鳥盡，良弓藏；狡兔死，走狗烹。",own:[["langya","yue"]]},
{y:-458,k:"謀",t:"四卿分范中行",s:"jiang",d:"晉之六卿相攻，范氏中行氏先亡，智、趙、韓、魏四家分其田邑。晉侯僅擁虛器。"},
{y:-457,k:"滅",t:"襄子滅代",s:"daidi",own:[["daidi","zhao"]],d:"趙襄子北登夏屋，請代王飲，使廚人以銅斗擊殺之。其姊摩笄自殺。趙北略胡地，遂有代馬之利。"},
{y:-453,k:"戰",t:"晉陽之戰",s:"jinyang",fl:1,d:"智伯圍晉陽，引汾水灌之，城不浸者三版。趙襄子夜使張孟談說韓魏反戈，決水灌智軍，智伯身死國分。豫讓漆身吞炭，五刺趙襄子而不成。",q:"《戰國策》：士為知己者死，女為悅己者容。",brt:["han","zhao","wei"],own:[["jinyang","zhao"],["handan","zhao"],["zhongmou","zhao"],["yuci","zhao"],["chaoge","zhao"],["anyi","wei"],["puban","wei"],["yewang","wei"],["shangdang","han"],["yiyang","han"]],war:{a:"zhao",d:"jin",w:"zhao",ka:1.0,kd:2.0}},
{y:-447,k:"滅",t:"楚滅蔡",s:"shangcai",ann:[["cai","chu"]],d:"楚惠王北上，滅蔡滅杞，東侵廣地至泗上。楚復強於南方。"},
{y:-445,k:"政",t:"魏文侯即位",s:"anyi",d:"魏斯立，師卜子夏，友田子方，禮段干木。以翟璜為相，樂羊吳起為將，西河之學甲於天下。"},
{y:-431,k:"滅",t:"楚滅莒",s:"jucheng",ann:[["ju","chu"]],d:"楚簡王北伐滅莒。莒遠而楚不能守，其地終歸於齊。"},
{y:-422,k:"變",t:"李悝變法",s:"anyi",sg:"likui",d:"魏用李悝，盡地力之教，行平糴之法，撰《法經》六篇。廢世卿世祿，食有勞而祿有功。戰國變法之始。",q:"《漢書》：治國之道，食有勞而祿有功。"},
{y:-419,k:"戰",t:"吳起守西河",s:"quwoyi",sg:"wuqi",own:[["shaoliang","wei"]],d:"魏築城少梁，吳起為西河守，與士卒最下者同衣食，臥不設席，親裹贏糧。秦兵不敢東向者數十年。",q:"《史記》：在德不在險。",war:{a:"wei",d:"qin",w:"wei",ka:0.6,kd:1.8}},
{y:-412,k:"政",t:"齊取莒地",s:"jucheng",own:[["jucheng","qi"]],d:"齊田氏北取莒及安陽，田氏之勢盡包海岱。"},
{y:-409,k:"變",t:"西門豹治鄴",s:"handan",d:"西門豹為鄴令，投巫於河以破河伯娶婦之俗，鑿十二渠溉民田。魏之河內遂為腹地。"},
{y:-408,k:"滅",t:"樂羊拔中山",s:"lingshou",ann:[["zhongshan","wei"]],d:"魏使樂羊伐中山，三年而拔之。羊食其子之羹以明志。文侯賞其功而疑其心，封太子擊於中山。"},
{y:-403,k:"政",t:"三家分晉",s:"jiang",fl:1,e:"戰國",d:"周威烈王命韓虔、趙籍、魏斯為諸侯。天子自壞其藩籬，名分既亡，戰國之世自此始。",q:"《資治通鑑》：非三晉之壞禮，乃天子自壞之也。"},
{y:-391,k:"戰",t:"魏取大梁",s:"daliang",own:[["daliang","wei"]],d:"魏敗楚於大梁榆關，取其地。中原之衝要入於魏，惠王後遂徙都於此。"},
{y:-386,k:"政",t:"田氏代齊",s:"linzi",fl:1,d:"周安王命田和為齊侯。姜太公之祀絕，而田齊立。二百年之陰謀，一朝而成。",q:"《史記》：田常成子取大斗出貸，以小斗收。"},
{y:-381,k:"變",t:"吳起死於楚",s:"ying",d:"楚悼公用吳起變法，明法審令，捐不急之官，廢公族疏遠者。悼公卒，宗室作亂，吳起伏王屍而死，射者盡夷三族。楚法遂廢。",q:"《史記》：楚之貴戚盡欲害吳起。"},
{y:-380,k:"政",t:"中山復國",s:"lingshou",brt:["zhongshan"],own:[["lingshou","zhongshan"],["quyang","zhongshan"]],d:"中山桓公復國於顧，遷都靈壽。白狄之邦再興，號千乘之國，與燕趙抗衡。"},
{y:-376,k:"滅",t:"晉絕祀",s:"jiang",ann:[["jin","wei"]],d:"三晉滅晉侯，遷靜公為家人，分其地。唐叔之後六百餘年而絕。"},
{y:-375,k:"滅",t:"韓滅鄭",s:"xinzheng",ann:[["zheng","han"]],d:"韓哀侯滅鄭，徙都新鄭。鄭自桓公東遷，四百三十二年而亡。天下之樞遂為韓有。",cap:[["han","xinzheng"]]},
{y:-364,k:"戰",t:"石門之敗",s:"shaoliang",d:"秦敗三晉於石門，斬首六萬。周顯王賀以黼黻之服。秦人東出之勢初露。",war:{a:"qin",d:"wei",w:"qin",ka:1.0,kd:6.0}},
{y:-361,k:"政",t:"秦孝公求賢",s:"yueyang",d:"孝公下令國中：賓客群臣有能出奇計強秦者，吾且尊官，與之分土。衛鞅聞是令，西入秦。",q:"《史記》：諸侯卑秦，醜莫大焉。"},
{y:-356,k:"變",t:"商鞅變法",s:"yueyang",sg:"shangyang",fl:1,d:"徙木立信，令行而後民從。什伍連坐，告姦者與斬敵同賞；宗室無軍功者不得屬籍；重農抑商，明尊卑爵秩。秦民勇於公戰而怯於私鬥。",q:"《商君書》：治世不一道，便國不法古。"},
{y:-354,k:"戰",t:"桂陵之戰",s:"guiling",d:"魏圍邯鄲，齊使田忌孫臏救趙。臏曰批亢搗虛，直走大梁。魏師還救，齊伏於桂陵而擒龐涓。",q:"《史記》：夫解雜亂紛糾者不控捲，救鬥者不搏撠。",war:{a:"qi",d:"wei",w:"qi",ka:0.8,kd:2.0}},
{y:-350,k:"變",t:"秦徙咸陽",s:"xianyang",own:[["xianyang","qin"],["hanguguan","qin"]],cap:[["qin","xianyang"]],d:"商鞅第二次變法：築冀闕宮廷於咸陽而徙都，並小鄉聚為縣，開阡陌封疆，平斗桶權衡丈尺。"},
{y:-344,k:"盟",t:"逢澤之會",s:"fenze",d:"魏惠王乘夏車、稱夏王，率十二諸侯朝天子於孟津。齊楚不與，霸業之虛榮乃招四面之怨。"},
{y:-341,k:"戰",t:"馬陵之戰",s:"maling",fl:1,sg:"sunbin",d:"魏伐韓，齊救之。孫臏減灶誘敵，龐涓夜至馬陵，見白書曰龐涓死於此樹之下。萬弩俱發，魏武卒精銳盡喪，太子申被虜。",q:"《史記》：善戰者因其勢而利導之。",war:{a:"qi",d:"wei",w:"qi",ka:1.0,kd:10.0}},
{y:-340,k:"戰",t:"商鞅取河西",s:"shaoliang",own:[["shaoliang","qin"]],d:"衛鞅詐執魏將公子卬而破其軍。魏割河西之地以和，徙都大梁。惠王歎曰寡人恨不用公叔座之言。",war:{a:"qin",d:"wei",w:"qin",ka:0.8,kd:2.5}},
{y:-338,k:"政",t:"商君車裂",s:"xianyang",d:"孝公卒，公子虔告商君欲反。鞅亡至關下，欲舍客舍，舍人曰商君之法舍人無驗者坐之。遂車裂於彤，滅其族，而秦法不廢。",q:"《史記》：嗟乎，為法之敝一至此哉！"},
{y:-334,k:"盟",t:"徐州相王",s:"xuzhou",d:"齊威王與魏惠王會於徐州，互尊為王。周室之號自此為列國所僭，天下無復共主之實。"},
{y:-333,k:"謀",t:"蘇秦合縱",s:"luoyi",sg:"suqin",d:"蘇秦說六國以縱親：以趙為從長，佩六國相印，約秦兵不敢窺函谷關者十五年。",q:"《史記》：使我有洛陽負郭田二頃，豈能佩六國相印乎！"},
{y:-328,k:"謀",t:"張儀相秦",s:"xianyang",sg:"zhangyi",own:[["shangjun","qin"]],d:"張儀為秦相，倡連橫以破縱。魏納上郡十五縣於秦，秦盡有河山之固。",q:"《史記》：視吾舌尚在不？足矣。"},
{y:-325,k:"政",t:"秦惠王稱王",s:"xianyang",d:"秦君始稱王，改元。西陲之國，於是與齊楚魏並列於天下。"},
{y:-323,k:"盟",t:"五國相王",s:"handan",d:"公孫衍倡魏韓趙燕中山五國相王，以抗齊楚秦。中山千乘而與萬乘並王，齊人恥之。"},
{y:-318,k:"戰",t:"五國攻秦",s:"hanguguan",d:"楚魏韓趙燕合縱攻秦，楚懷王為縱長。至函谷關，秦出兵逆之，五國之師皆引而歸。縱約之虛，於此見矣。",war:{a:"han",d:"qin",w:"qin",ka:8.2,kd:1.0}},
{y:-318,k:"學",t:"稷下學宮",s:"linzi",d:"齊宣王大興稷下之學，列大夫之號者七十六人，不治而議論。淳于髡、鄒衍、慎到、田駢、環淵之屬數百千人。",q:"《史記》：齊稷下學士復盛，且數百千人。"},
{y:-316,k:"滅",t:"秦滅巴蜀",s:"chengdu",fl:1,ann:[["shu","qin"],["ba","qin"]],d:"蜀侯與苴侯相攻，皆告急於秦。司馬錯曰得蜀則得楚，楚亡則天下并矣。乃循石牛道伐蜀，十月而定，秦益富厚輕諸侯。",q:"《戰國策》：利盡西海，諸侯不以為暴。"},
{y:-314,k:"戰",t:"齊破燕",s:"ji",own:[["ji","qi"],["wuyang","qi"]],d:"燕王噲讓國於子之，國大亂。齊宣王五旬而舉燕，燕人畔之。孟子曰取之而燕民悅則取之。",war:{a:"qi",d:"yan",w:"qi",ka:1.0,kd:3.0}},
{y:-313,k:"謀",t:"商於之欺",s:"shangyu",own:[["shangyu","qin"],["wuguan","qin"]],d:"張儀許楚商於之地六百里以絕齊。楚絕齊而使者受地，儀曰儀有奉邑六里。懷王大怒，發兵攻秦。",q:"《史記》：儀與王約六里，不聞六百里。"},
{y:-312,k:"戰",t:"丹陽藍田之戰",s:"danyang",d:"秦敗楚師於丹陽，斬首八萬，虜屈匄，取漢中六百里地。楚悉國兵復襲至藍田，又大敗。楚自此一蹶不振。",war:{a:"qin",d:"chu",w:"qin",ka:2.0,kd:8.0},own:[["hanzhong","qin"]]},
{y:-312,k:"政",t:"燕昭王築黃金臺",s:"wuyang",own:[["ji","yan"],["wuyang","yan"]],d:"燕昭王卑身厚幣以招賢者，郭隗曰請自隗始。於是築黃金臺，樂毅自魏往，鄒衍自齊往，劇辛自趙往，燕國殷富。",q:"《戰國策》：士爭湊燕。"},
{y:-307,k:"變",t:"胡服騎射",s:"handan",fl:1,d:"趙武靈王曰愚者闇於成事，智者見於未萌。遂胡服騎射，變車為騎，北破林胡樓煩，闢地千里，築長城自代並陰山至高闕。",q:"《戰國策》：法度制令各順其宜，衣服器械各便其用。",own:[["yanmen","zhao"],["jiuyuan","zhao"]]},
{y:-307,k:"戰",t:"秦拔宜陽",s:"yiyang",own:[["yiyang","qin"]],d:"甘茂拔宜陽，斬首六萬，遂通三川以窺周室。韓之膏腴盡入於秦。",war:{a:"qin",d:"han",w:"qin",ka:1.5,kd:6.0}},
{y:-306,k:"滅",t:"楚滅越",s:"kuaiji",ann:[["yue","chu"]],d:"越王無彊北伐齊而西伐楚，楚威王大敗之，殺無彊，盡取吳故地至浙江。越以此散，諸族子爭立，服朝於楚。"},
{y:-301,k:"戰",t:"垂沙之戰",s:"chuisha",d:"齊韓魏共攻楚，戰於垂沙，殺楚將唐昧。莊蹻起於楚境，楚分而為四。宗廟之危，始於背縱親秦。",war:{a:"qi",d:"chu",w:"qi",ka:2.0,kd:6.0},own:[["wan","qin"]]},
{y:-299,k:"謀",t:"懷王入秦",s:"wuguan",d:"秦昭王約楚懷王會於武關，執之以求割巫黔中郡。懷王不許，遂囚三年，客死於秦。楚人憐之如悲親戚。",q:"《史記》：楚雖三戶，亡秦必楚。"},
{y:-296,k:"滅",t:"趙滅中山",s:"lingshou",ann:[["zhongshan","zhao"]],d:"趙武靈王二十餘年攻中山，至是滅之，遷其王於膚施。趙地始連為一體，北疆無腹心之患。"},
{y:-295,k:"政",t:"沙丘之亂",s:"handan",d:"趙武靈王壯年傳位而自號主父，二子爭立，圍主父於沙丘宮三月，探雀鷇而食，卒餓死。一代雄主，死於己手。"},
{y:-293,k:"戰",t:"伊闕之戰",s:"yique",fl:1,sg:"baiqi",d:"白起以不足十萬之眾，破韓魏聯軍二十四萬於伊闕。韓魏之精銳盡於此。起自此十三年不敗，號為人屠。",q:"《史記》：斬首二十四萬，虜公孫喜，拔五城。",war:{a:"qin",d:"wei",w:"qin",ka:2.0,kd:24.0}},
{y:-288,k:"政",t:"東西二帝",s:"linzi",d:"秦昭王稱西帝，遣使立齊湣王為東帝。蘇代說齊去帝號以收天下之望，秦亦復稱王。名器之爭，終以齊之孤立收場。"},
{y:-286,k:"滅",t:"齊滅宋",s:"shangqiu",ann:[["song","qi"]],d:"宋康王射天笞地，號曰桀宋。齊湣王滅之，盡取淮北之地。天下震恐，而齊亦成眾矢之的。"},
{y:-284,k:"戰",t:"樂毅伐齊",s:"linzi",fl:1,d:"燕昭王使樂毅為上將軍，率燕秦韓趙魏五國之兵破齊於濟西，長驅入臨淄，載其寶器而歸。六月之間下齊七十餘城，唯莒與即墨不下。",q:"《戰國策》：先王之靈，得報齊之讎。",own:[["linzi","yan"],["gaotang","yan"],["jucheng","qi"]],war:{a:"yan",d:"qi",w:"yan",ka:2.0,kd:12.0}},
{y:-279,k:"戰",t:"火牛破燕",s:"jimo",d:"燕惠王疑樂毅，以騎劫代之。田單縱反間、假神師，束兵刃於牛角，灌脂束葦於牛尾，夜出千牛，五千壯士隨之。燕師大駭，七十餘城盡復。",own:[["linzi","qi"],["gaotang","qi"]],war:{a:"qi",d:"yan",w:"qi",ka:1.0,kd:5.0}},
{y:-279,k:"盟",t:"澠池之會",s:"mianchi",d:"秦王令趙王鼓瑟，藺相如請秦王擊缶，以頸血相濺為誓。歸而位在廉頗之上，頗欲辱之，相如引車避匿。頗肉袒負荊而謝。",q:"《史記》：吾所以為此者，以先國家之急而後私讎也。"},
{y:-278,k:"戰",t:"白起拔郢",s:"ying",fl:1,own:[["ying","qin"],["yancheng","qin"],["yiling","qin"]],cap:[["chu","chenqiu"]],d:"白起引西山長谷之水灌鄢城，東北角潰，死者數十萬。遂拔郢，燒夷陵之楚先王墓。楚頃襄王東徙於陳。同年，屈原懷石自沉汨羅。",q:"《楚辭·九章·哀郢》：鳥飛返故鄉兮，狐死必首丘。",sg:"quyuan",war:{a:"qin",d:"chu",w:"qin",ka:2.0,kd:20.0}},
{y:-277,k:"戰",t:"秦取黔中",s:"qianzhong",own:[["qianzhong","qin"]],d:"蜀守張若取巫郡及江南地為黔中郡。楚之西土盡失，僅存江淮之間。"},
{y:-273,k:"戰",t:"華陽之戰",s:"huayang",d:"白起、胡陽八日而至華陽，破趙魏之師，斬首十五萬，沉卒二萬於河。魏獻南陽以和。",war:{a:"qin",d:"wei",w:"qin",ka:2.0,kd:15.0}},
{y:-272,k:"滅",t:"滅義渠",s:"yiquc",ann:[["yiqu","qin"]],own:[["yuzhong","qin"]],d:"宣太后詐而殺義渠戎王於甘泉，遂起兵伐滅義渠。秦置隴西、北地、上郡，築長城以拒胡。後顧之憂盡除。"},
{y:-270,k:"戰",t:"閼與之戰",s:"eyu",d:"秦圍閼與，諸將皆曰道遠險狹難救。趙奢曰其道遠險狹，譬之猶兩鼠鬥於穴中，將勇者勝。乃卷甲而趨，大破秦軍。",q:"《史記》：狹路相逢勇者勝。",war:{a:"zhao",d:"qin",w:"zhao",ka:1.0,kd:3.0}},
{y:-266,k:"謀",t:"范雎相秦",s:"xianyang",d:"范雎說昭王曰王不如遠交而近攻，得寸則王之寸，得尺亦王之尺。又廢太后、逐四貴，秦之王權始專。",q:"《戰國策》：遠交而近攻。"},
{y:-262,k:"謀",t:"上黨歸趙",s:"shangdang",own:[["yewang","qin"],["shangdang","zhao"]],d:"秦拔野王，絕上黨歸路。韓守馮亭不降秦，以十七城歸趙。平原君曰發百萬之軍而攻，逾年歷歲未得一城。趙受之，禍結於此。"},
{y:-260,k:"戰",t:"長平之戰",s:"changping",fl:1,own:[["shangdang","qin"]],d:"廉頗堅壁三年不出。秦行反間，趙以趙括代之。括易將更法，出擊而中伏。白起絕其糧道四十六日，趙軍食人相殺。括自出銳卒搏戰，射殺之，四十萬眾降而盡坑之，遺其小者二百四十人歸趙。",q:"《史記》：括徒能讀其父書傳，不知合變也。",war:{a:"qin",d:"zhao",w:"qin",ka:20.0,kd:45.0}},
{y:-257,k:"戰",t:"邯鄲之圍",s:"handan",d:"秦圍邯鄲三年，趙人炊骨易子。平原君散家財、編妻妾入行伍；毛遂按劍上階說楚；信陵君竊符矯殺晉鄙，率八萬人赴之。三國之師夾擊，秦軍大敗於城下。",q:"《史記》：白起之死非其罪，而秦人憐之。",war:{a:"zhao",d:"qin",w:"zhao",ka:5.0,kd:20.0}},
{y:-256,k:"滅",t:"九鼎入秦",s:"luoyi",fl:1,own:[["luoyi","qin"]],d:"西周君與諸侯約縱攻秦，秦使將軍摎伐之。周君頓首受罪，盡獻其邑三十六、口三萬。赧王卒，周民東亡，九鼎入於秦。八百六十七年之周祚，於是乎終。",q:"《史記》：周初亡。"},
{y:-256,k:"滅",t:"楚滅魯",s:"qufu",ann:[["lu","chu"]],d:"楚考烈王伐滅魯，遷頃公於莒。周公之後，禮樂之邦，至是而絕祀。"},
{y:-251,k:"戰",t:"鄗代之役",s:"haocheng",d:"燕相栗腹以趙壯者盡於長平為由，率六十萬伐趙。廉頗以八萬破燕於鄗，樂乘破之於代，遂圍燕都。趙人雖創，其鋒未鈍。",war:{a:"yan",d:"zhao",w:"zhao",ka:6.0,kd:1.0}},
{y:-249,k:"政",t:"呂不韋相秦",s:"xianyang",sg:"lvbuwei",ann:[["zhou","qin"]],d:"莊襄王立，以呂不韋為相國，封文信侯，食藍田十二縣。滅東周，周祀盡絕。不韋招致賓客三千，著《呂氏春秋》，懸於咸陽市門，能增損一字者予千金。"},
{y:-247,k:"戰",t:"河外之師",s:"hanguguan",d:"信陵君歸魏，率五國之兵敗蒙驁於河外，追至函谷關，秦兵不敢出。此山東合縱之絕唱。秦行反間，魏王廢信陵君，君日夜飲醇酒近婦人而卒。",war:{a:"wei",d:"qin",w:"wei",ka:2.0,kd:4.0}},
{y:-246,k:"政",t:"嬴政即位",s:"xianyang",d:"莊襄王卒，太子政立，年十三，國事皆決於文信侯。同年，韓使水工鄭國說秦鑿涇水為渠，欲疲秦，渠成而關中為沃野，秦以富強。"},
{y:-241,k:"戰",t:"最後合縱",s:"hanguguan",own:[["shouchun","chu"]],cap:[["chu","shouchun"]],d:"趙魏韓燕楚五國攻秦，至蕞而還。楚考烈王懼，東徙都壽春。山東之縱，至此永絕。",war:{a:"chu",d:"qin",w:"qin",ka:4.0,kd:1.0}},
{y:-239,k:"政",t:"秦置東郡",s:"diqiu",own:[["diqiu","qin"],["yewang","wey"]],d:"秦拔衛濮陽，置東郡，徙衛君角於野王。山東諸國之間，橫亙一秦之郡，縱路遂斷。"},
{y:-237,k:"政",t:"諫逐客書",s:"xianyang",sg:"lisi",d:"嫪毐之亂既平，呂不韋免。宗室請一切逐客，李斯上書曰泰山不讓土壤故能成其大。王乃除逐客之令，復斯官。",q:"《諫逐客書》：河海不擇細流，故能就其深。"},
{y:-233,k:"學",t:"韓非死於雲陽",s:"xianyang",sg:"hanfei",d:"秦王見《孤憤》《五蠹》曰嗟乎，寡人得見此人與之遊，死不恨矣。及韓非入秦，李斯姚賈毀之，下獄，遺藥令自殺。其書則為秦法之骨。",q:"《韓非子》：法不阿貴，繩不撓曲。"},
{y:-230,k:"滅",t:"秦滅韓",s:"xinzheng",fl:1,ann:[["han","qin"]],d:"內史騰攻韓，得韓王安，盡納其地為潁川郡。七雄之滅，自韓始。",war:{a:"qin",d:"han",w:"qin",ka:1.0,kd:3.0}},
{y:-229,k:"謀",t:"反間殺李牧",s:"handan",d:"王翦伐趙，李牧司馬尚拒之，歲餘不能下。秦多與趙王寵臣郭開金，言牧欲反。趙王使趙蔥代之，牧不受命，捕而殺之。三月而趙亡。",q:"《史記》：牧死，趙滅。"},
{y:-228,k:"滅",t:"秦破邯鄲",s:"handan",ann:[["zhao","qin"]],d:"王翦破趙軍，虜趙王遷。公子嘉率宗族數百人奔代，自立為代王。趙之社稷，名存而實亡。",war:{a:"qin",d:"zhao",w:"qin",ka:3.0,kd:10.0},own:[["daidi","zhao"]]},
{y:-227,k:"謀",t:"荊軻刺秦",s:"wuyang",fl:1,sg:"jingke",d:"燕太子丹遣荊軻奉樊於期首與督亢地圖入秦。圖窮而匕首見，軻左手把秦王之袖，右手持匕首揕之。王負劍，遂斷其股。軻倚柱而笑，箕踞以罵。",q:"《易水歌》：風蕭蕭兮易水寒，壯士一去兮不復還。"},
{y:-226,k:"戰",t:"秦拔薊城",s:"ji",own:[["ji","qin"],["wuyang","qin"]],d:"王翦破燕，取薊城。燕王喜東保遼東，斬太子丹以獻，秦兵少解。",war:{a:"qin",d:"yan",w:"qin",ka:1.0,kd:4.0}},
{y:-225,k:"滅",t:"水灌大梁",s:"daliang",ann:[["wei","qin"]],d:"王賁引河溝灌大梁，三月城壞，魏王假降。李悝之法、吳起之兵、信陵之才，皆成流水。",war:{a:"qin",d:"wei",w:"qin",ka:1.0,kd:5.0}},
{y:-224,k:"戰",t:"王翦傾國伐楚",s:"shouchun",d:"李信以二十萬伐楚而敗。王翦曰非六十萬不可。王悉發國中兵以委之。翦堅壁不戰，日休士洗沐，投石超距。楚師東引，翦追而破之，項燕自殺。",q:"《史記》：秦王之為人，暴戾恣睢。",war:{a:"qin",d:"chu",w:"qin",ka:5.0,kd:20.0}},
{y:-223,k:"滅",t:"秦滅楚",s:"shouchun",ann:[["chu","qin"]],d:"王翦蒙武破壽春，虜楚王負芻。地方五千里、帶甲百萬之楚，遂為三郡。"},
{y:-222,k:"滅",t:"燕代越盡平",s:"ji",ann:[["yan","qin"],["zhao","qin"]],d:"王賁攻遼東，虜燕王喜；還攻代，虜代王嘉。王翦定江南，降越君，置會稽郡。",own:[["kuaiji","qin"],["gusu","qin"],["langya","qin"]]},
{y:-221,k:"滅",t:"天下一統",s:"linzi",fl:1,ann:[["qi","qin"],["wey","qin"]],d:"齊王建聽相后勝之計，不修攻戰之備，秦兵自燕南下，不戰而降。六王畢，四海一。秦王政議帝號曰始皇帝，分天下為三十六郡，收兵器鑄十二金人，車同軌，書同文。五百五十年之亂世，於是乎定。",q:"《過秦論》：奮六世之餘烈，振長策而御宇內。"}

 guanzhong:{n:"管仲",r:"齊相 · 法家先驅",y:"？—前645",d:"通貨積財，富國強兵。設鹽鐵之官，行輕重之術，區士農工商而處之。桓公九合諸侯，一匡天下，皆仲之謀。",w:"倉廩實而知禮節，衣食足而知榮辱。"},
 kongzi:{n:"孔子",r:"儒家 · 至聖先師",y:"前551—前479",d:"名丘字仲尼。周遊列國十四年而道不行，退而修《春秋》，弟子三千。以仁為體，以禮為用，開私學之風。",w:"己所不欲，勿施於人。"},

 mozi:{n:"墨子",r:"墨家 · 鉅子",y:"約前468—前376",d:"名翟。倡兼愛非攻尚賢節葬，率弟子三百人守宋城以拒公輸之械，九攻九拒。摩頂放踵利天下而為之。",w:"兼相愛，交相利。"},
 likui:{n:"李悝",r:"魏相 · 法家",y:"前455—前395",d:"作《法經》六篇：盜、賊、囚、捕、雜、具。行盡地力之教與平糴之法，魏由是最先富強。",w:"食有勞而祿有功，使有能而賞必行。"},
 wuqi:{n:"吳起",r:"兵家 · 楚令尹",y:"？—前381",d:"仕魯仕魏仕楚，戰七十六，全勝六十四。為將與士卒同衣食，親吮士卒之疽。變法於楚而死於楚。",w:"在德不在險。"},
 shangyang:{n:"商鞅",r:"秦大良造 · 法家",y:"約前395—前338",d:"衛之公孫。徙木立信，什伍連坐，廢井田開阡陌，軍功爵二十等。身死而秦法行百年。",w:"法之不行，自上犯之。"},
 sunbin:{n:"孫臏",r:"兵家 · 齊軍師",y:"約前382—前316",d:"與龐涓同學，涓忌其能而刖之。齊使載之以歸，圍魏救趙於桂陵，減灶誘敵於馬陵，遂雪其恥。",w:"必攻不守，批亢搗虛。"},
 mengzi:{n:"孟子",r:"儒家 · 亞聖",y:"約前372—前289",d:"名軻。道性善，言必稱堯舜。遊齊梁而不見用，退與萬章之徒序《詩》《書》。倡王道，斥霸術。",w:"民為貴，社稷次之，君為輕。"},
 zhuangzi:{n:"莊子",r:"道家 · 蒙漆園吏",y:"約前369—前286",d:"名周。楚威王聘以為相，笑謂使者曰寧遊戲污瀆之中自快，無為有國者所羈。著書十餘萬言，汪洋恣肆。",w:"天地與我並生，而萬物與我為一。"},
 suqin:{n:"蘇秦",r:"縱橫家 · 六國相",y:"？—前284",d:"師事鬼谷。初說秦不用，裘敝金盡而歸，讀書欲睡則引錐刺股。後倡合縱，佩六國相印。",w:"寧為雞口，無為牛後。"},
 zhangyi:{n:"張儀",r:"縱橫家 · 秦相",y:"？—前309",d:"與蘇秦同門。倡連橫以事秦，一怒而諸侯懼，安居而天下熄。以六百里之欺離楚齊之交。",w:"視吾舌尚在不？舌在，足矣。"},
 quyuan:{n:"屈原",r:"楚三閭大夫 · 辭賦之祖",y:"約前340—前278",d:"名平。博聞強志，明於治亂。被讒放逐江南，作《離騷》《九章》《天問》。郢破之歲，懷石自沉於汨羅。",w:"路漫漫其修遠兮，吾將上下而求索。"},
 xunzi:{n:"荀子",r:"儒家 · 稷下祭酒",y:"約前313—前238",d:"名況。言性惡而重禮法，三為祭酒，最為老師。弟子韓非李斯，皆以其學佐秦。",w:"青，取之於藍而青於藍。"},
 baiqi:{n:"白起",r:"秦武安君 · 兵家",y:"？—前257",d:"伊闕斬二十四萬，鄢郢淹數十萬，華陽斬十五萬，長平坑四十萬。攻城七十餘座，未嘗一敗。功高震主，賜劍杜郵。",w:"我固當死。長平之戰，趙卒降者數十萬人，我詐而盡坑之，是足以死。"},
 lianpo:{n:"藺相如",r:"趙上卿",y:"生卒不詳",d:"完璧歸趙，澠池抗秦，位在廉頗之上而引車避匿。廉頗肉袒負荊，遂為刎頸之交。",w:"先國家之急而後私讎也。"},
 hanfei:{n:"韓非",r:"法家 · 集大成者",y:"約前280—前233",d:"韓之諸公子，口吃而善著書。合法、術、勢為一體，倡事在四方要在中央。書入秦而身死秦。",w:"事在四方，要在中央；聖人執要，四方來效。"},
 lvbuwei:{n:"呂不韋",r:"秦文信侯",y:"？—前235",d:"陽翟大賈，見異人於邯鄲曰此奇貨可居。相秦十三年，門下食客三千，著《呂氏春秋》，一字千金。",w:"欲上人者，必以其言下之。"},
 lisi:{n:"李斯",r:"秦廷尉 · 丞相",y:"？—前208",d:"上蔡人，見廁鼠倉鼠而歎人之賢不肖譬如鼠。西入秦說並天下之計，書同文，廢封建，立郡縣。",w:"泰山不讓土壤，故能成其大。"},
 jingke:{n:"荊軻",r:"衛人 · 刺客",y:"？—前227",d:"好讀書擊劍，與高漸離飲於燕市，酒酣而歌，相樂而泣，旁若無人。奉圖入秦，事敗而箕踞罵之。",w:"事所以不成者，以欲生劫之，必得約契以報太子也。"},
 limu:{n:"李牧",r:"趙武安君",y:"？—前229",d:"守代雁門，日擊數牛饗士，習騎射謹烽火。一戰而破匈奴十餘萬騎，其後十餘歲胡人不敢近趙邊城。",w:"匈奴每入，烽火謹，輒入收保，不敢戰。"},
 tiandan:{n:"田單",r:"齊安平君",y:"生卒不詳",d:"臨淄市掾。城破而以鐵籠護車軸得脫。守即墨三年，縱反間、假神師、行火牛，一舉復七十餘城。",w:"神來下教我。"},
 yueyi:{n:"樂毅",r:"燕昌國君",y:"生卒不詳",d:"魏將樂羊之後。合五國之兵破強齊，下七十餘城，修整燕軍，禁止侵掠，求齊之逸民而顯其賢。惠王疑之，奔趙而不叛。",w:"君子交絕不出惡聲，忠臣去國不潔其名。"},
 bianque:{n:"扁鵲",r:"醫家",y:"約前407—前310",d:"姓秦名越人。過齊而望桓侯之色，四見而四言其病，桓侯不信，五日而死。倡望聞問切之術。",w:"疾在腠理，湯熨之所及也；在骨髓，雖司命無奈之何。"}

  if(e.ann) for(i=0;i<e.ann.length;i++){ var v=e.ann[i][0], k=e.ann[i][1];
    for(j=0;j<CLIST.length;j++) if(CLIST[j].o===v){ CLIST[j].o=k; CLIST[j].flash=1; }
    if(STATES[v]) STATES[v].live=0; if(STATES[k]) STATES[k].live=1; }
  if(e.own) for(i=0;i<e.own.length;i++){ var c=CITY[e.own[i][0]]; if(c){ if(c.o!==e.own[i][1]){ c.flash=1; } c.o=e.own[i][1]; if(STATES[e.own[i][1]]) STATES[e.own[i][1]].live=1; } }
  if(e.cap) for(i=0;i<e.cap.length;i++){ if(STATES[e.cap[i][0]]) STATES[e.cap[i][0]].cap=e.cap[i][1]; }
  if(e.heg) SIM.heg=e.heg;

var fieldC=mk(GW,GH), fx2=fieldC.getContext("2d");
function buildTerr(){
  var act=[]; for(var i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w>0&&c.o&&STATES[c.o]) act.push(c); }
  var img=fx2.createImageData(GW,GH), D=img.data;

  for(var j=0;j<GH;j++){ var gy=j*CS+CS/2;
    for(var i2=0;i2<GW;i2++){ var idx=j*GW+i2, o=idx*4;
      if(!mask[idx]){ owg[idx]=-1; D[o+3]=0; continue; }
      var gx=i2*CS+CS/2, best=1e18, bi=-1;
      for(var k=0;k<act.length;k++){ var c2=act[k], dx=gx-c2.x, dy=gy-c2.y;
        var d=(dx*dx+dy*dy)/(c2.w*c2.w); if(d<best){ best=d; bi=k; } }
      if(bi<0||best>MAXD*MAXD){ owg[idx]=-1; D[o+3]=0; continue; }
      var st=STATES[act[bi].o]; owg[idx]=sIdx(act[bi].o);
      var col=st.c; D[o]=parseInt(col.substr(1,2),16); D[o+1]=parseInt(col.substr(3,2),16);

    if(j2+1<GH){ var c3=owg[(j2+1)*GW+i3]; if(a!==c3){ (a>=0&&c3>=0?inner:outer).push([i3*CS,(j2+1)*CS,(i3+1)*CS,(j2+1)*CS]); } } }
  g.lineCap="round";
  g.strokeStyle="rgba(60,44,26,.30)"; g.lineWidth=2.4; g.beginPath();
  for(var e2=0;e2<outer.length;e2++){ var s2=outer[e2]; g.moveTo(s2[0],s2[1]); g.lineTo(s2[2],s2[3]); } g.stroke();
  g.strokeStyle="rgba(48,34,18,.72)"; g.lineWidth=2.0; g.beginPath();
  for(var e3=0;e3<inner.length;e3++){ var s3=inner[e3]; g.moveTo(s3[0],s3[1]); g.lineTo(s3[2],s3[3]); } g.stroke();
  SIM.dirty=false;

    var m=s2m(e.clientX,e.clientY), best=null,bd=1e9;
    for(var i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w<=0) continue;
      var d=Math.hypot(c.x-m[0],c.y-m[1]); if(d<bd){bd=d;best=c;} }
    if(best&&bd<16) clickCity(best);
  }
  drag=null; if(userCam) setTimeout(function(){userCam=0;},9000); });
window.addEventListener("mousemove",function(e){

    SIM.camx=SIM.tx; SIM.camy=SIM.ty; return; }
  var m=s2m(e.clientX,e.clientY), best=null,bd=1e9;

/* ============ 十八、主循環 ============ */
var prev=performance.now(), chartT=0, frameNo=0;
function loop(now){
  var dt=SIM.fixed? SIM.fixed : Math.min(0.06,(now-prev)/1000); prev=now;
  frameNo++; if(SIM.limit&&frameNo>SIM.limit) dt=0;  /* 定格：截幀與錄製用 */
  step(dt); tickNarr(dt); updateTop(); updateRank(dt);
  if(SIM.dirty) buildTerr();
  var k=1-Math.pow(0.0016,dt);
  SIM.camx+=(SIM.tx-SIM.camx)*k; SIM.camy+=(SIM.ty-SIM.camy)*k; SIM.camz+=(SIM.tz-SIM.camz)*k;
  if(idiomT>0){ idiomT-=dt; if(idiomT<=0) $("idiom").classList.remove("on"); }
  if(toastT>0){ toastT-=dt; if(toastT<=0) $("toast").classList.remove("on"); }
  chartT-=dt; if(chartT<=0){ chartT=0.5; drawChart(); }
  draw(dt);
  requestAnimationFrame(loop);
}

/* ============ 十九、啟動 ============ */
function boot(){
  buildBase(); rewindTo(-770); buildTerr();
  setAmbient("周室東遷，王綱解紐。天子之令不出王畿，而諸侯之兵起於四方。");
  lastTopY=null; updateTop(); drawChart();
  focusWide(); SIM.camx=SIM.tx; SIM.camy=SIM.ty; SIM.camz=SIM.tz;
  /* 深鏈：?y=-260 直達某年，?auto=1 略過序幕，?z=1.8 指定景別 */
  try{ var qs=location.search||"";
    var my=/[?&]y=(-?[0-9]+)/.exec(qs), mz=/[?&]z=([0-9.]+)/.exec(qs);
    if(my){ jumpTo(Math.max(-770,Math.min(-221,parseInt(my[1],10)))); }
    if(mz){ SIM.tz=SIM.camz=Math.max(0.72,Math.min(4.6,parseFloat(mz[1]))); }
    var ms=/[?&]spd=([0-9.]+)/.exec(qs); if(ms){ SIM.speed=Math.max(0.25,Math.min(8,parseFloat(ms[1]))); $("spd").textContent=SIM.speed.toFixed(2)+"×"; }
    /* 確定性步進：錄製或截幀用，每幀固定 1/60 秒 */
    if(/[?&]step=1/.test(qs)) SIM.fixed=1/60;
    var mf=/[?&]frame=([0-9]+)/.exec(qs); if(mf) SIM.limit=parseInt(mf[1],10);
    /* 深鏈入局：?play=s5:qin */
    var mp=/[?&]play=([a-z0-9]+):([a-z0-9]+)/.exec(qs);
    if(/[?&]quiet=1/.test(qs)) GM.quiet=1;
    if(/[?&]start=1/.test(qs)){ $("intro").style.display="none"; openStart(); }
    if(mp){ SELG.sc=mp[1]; SELG.me=mp[2]; $("intro").style.display="none"; $("intro").classList.add("off"); startGame();
      var mt=/[?&]turns=([0-9]+)/.exec(qs);
      if(mt){ var tn=Math.min(200,parseInt(mt[1],10)); for(var ti=0;ti<tn&&!GM.ended;ti++) endTurn(); } }
    if(/[?&]auto=1/.test(qs)){ var iv=$("intro"); iv.classList.add("off"); iv.style.display="none"; $("title").style.opacity=1;
      SIM.playing=true; $("bPlay").textContent="‖ 暫停"; $("hint").style.opacity=0; }
  }catch(e){}
  requestAnimationFrame(loop);
}

};

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function pick(a){ return a[rnd(a.length)]; }

function gCityOf(sid){ var r=[]; for(var i=0;i<CLIST.length;i++){ var c=CLIST[i];
  if(c.w>0&&c.o===sid) r.push(c); } return r; }

  for(var i=0;i<cs.length;i++) t+=cs[i].troop||0; return t; }

function officers(sid){ var o={xiang:null,jiang:null,mou:null,list:[]};
  for(var i=0;i<CHAR_LIST.length;i++){ var c=CHAR_LIST[i];
    if(c.alive&&c.st===sid){ o.list.push(c);
      if(c.job==="相") o.xiang=c; if(c.job==="將") o.jiang=c; if(c.job==="謀") o.mou=c; } }
  return o; }
var FKEYS=["farm","trade","tax","levy","atk","def","dip","adm","plot","talent","pop","cost","build","move","aggr","mood","omen"];

  function add(o){ for(k in o){ if(k==="all"){ for(i=0;i<10;i++) f[FKEYS[i]]=(f[FKEYS[i]]||0)+o.all; }
    else f[k]=(f[k]||0)+o[k]; } }
  var s=SCH[st.school]; if(s) add(s.f);
  var rf=st.reforms||[];
  for(i=0;i<rf.length;i++) for(k=0;k<REFORMS.length;k++) if(REFORMS[k].id===rf[i]) add(REFORMS[k].f);
  var of=officers(st.id);
  if(of.xiang){ f.adm=(f.adm||0)+of.xiang.adm/420; f.tax=(f.tax||0)+of.xiang.adm/900; }
  if(of.jiang){ f.atk=(f.atk||0)+of.jiang.lead/520; }
  if(of.mou){ f.plot=(f.plot||0)+of.mou.int/520; f.dip=(f.dip||0)+of.mou.int/900; }
  var ru=st.ruler; if(ru){ f.adm=(f.adm||0)+(ru.adm-60)/600; f.dip=(f.dip||0)+(ru.cha-60)/600; }

function relOf(a,b){ if(a===b) return 100; var s=STATES[a]; return (s&&s.rel&&s.rel[b]!==undefined)?s.rel[b]:0; }

  if(STATES[a]) (STATES[a].rel=STATES[a].rel||{})[b]=v;
  if(STATES[b]) (STATES[b].rel=STATES[b].rel||{})[a]=v; }

function atWar(a,b){ return !!(STATES[a]&&STATES[a].war&&STATES[a].war[b]); }
function isAlly(a,b){ return !!(STATES[a]&&STATES[a].ally&&STATES[a].ally[b]); }
function declareWar(a,b,quiet){

  STATES[a].war[b]=1; STATES[b].war[a]=1;
  delete STATES[a].ally[b]; delete STATES[b].ally[a];
  addRel(a,b,-30);
  if(!quiet) glog("〔兵興〕"+sn(a)+"與"+sn(b)+"絕好，陳師境上。","war");
}
function makePeace(a,b,quiet){

  STATES[a].truce[b]=GM.year+3; STATES[b].truce[a]=GM.year+3;
  addRel(a,b,16);

}
function makeAlly(a,b){ if(atWar(a,b)) makePeace(a,b,1);
  STATES[a].ally[b]=1; STATES[b].ally[a]=1; addRel(a,b,22);
  glog("〔盟〕"+sn(a)+"與"+sn(b)+"歃血為盟，同好同惡。","dip"); }

  if(GM.log.length>160) GM.log.pop(); renderLog(); }

/* ---------------- 開局 ---------------- */
function initGame(scenId,meId){
  var sc=null,i; for(i=0;i<SCEN.length;i++) if(SCEN[i].id===scenId) sc=SCEN[i];
  if(!sc) return;
  rewindTo(sc.y);
  SIM.playing=false; SIM.hold=0; SIM.armies=[]; SIM.fx=[]; SIM.marks=[];
  GM.on=1; GM.me=meId; GM.scen=scenId; GM.year=sc.y; GM.ended=0; GM.log=[];
  GM.armies=[]; GM.stats={battles:0,killed:0,taken:0}; GM.sel=""; GM.lastRep=[];
  for(i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w<=0) continue;
    var a=cattr(c);
    c.terr=a.terr; c.farm=a.farm*10; c.trade=a.trade*10; c.defv=a.def;
    c.wall=a.def*16; c.pop=18+a.farm*2.6+(c.t===0?12:c.t===1?6:0);
    c.mood=58+rnd(12); c.siege=0; c.dev=0;
    var own=STATES[c.o];
    c.troop=Math.round((1400+c.pop*40)*(own&&own.cap===c.id?1.5:1)*(0.85+Math.random()*0.4));
  }
  for(var s in STATES){ var st=STATES[s]; st.id=s;
    st.rel={}; st.war={}; st.ally={}; st.truce={}; st.reforms=[]; st.exhaust=0;
    st.meets=0; st.troop=0; st.income={gold:0,grain:0};
    if(!st.live){ continue; }
    var cs=gCityOf(s);
    st.gold=Math.round(180+cs.length*46); st.grain=Math.round(260+cs.length*72);
    st.pres=clamp(18+cs.length*3.2+(s==="zhou"?26:0),0,120);
    st.mood=60+rnd(10); st.school=defSchool(s);
    st.ruler=rulerOf(s,sc.y);
    st.aggr=clamp(0.28+Math.random()*0.5+(s==="qin"||s==="chu"?0.22:0),0.1,0.98);
  }
  /* 邦交初值：接壤者相疑，遠者無交 */
  var live=[]; for(var s2 in STATES) if(STATES[s2].live) live.push(s2);
  for(i=0;i<live.length;i++) for(var j=i+1;j<live.length;j++){
    var d=capDist(live[i],live[j]); var v=d<150? -14+rnd(16) : d<300? rnd(18)-4 : 6+rnd(14);
    setRel(live[i],live[j],v); }
  /* 人物出場 */
  for(i=0;i<CHAR_LIST.length;i++){ var ch=CHAR_LIST[i];
    ch.alive=(sc.y>=ch.b+16&&sc.y<=ch.d)?1:0; ch.st=""; ch.job="";
    if(ch.alive&&STATES[ch.home]&&STATES[ch.home].live&&Math.random()<0.68) ch.st=ch.home; }
  autoAppoint(); fillCourt();
  GM.maxa=3; GM.acts=actQuota(meId);
  SIM.dirty=true;
}
function defSchool(sid){
  var m={qin:"fa",qi:"ru",chu:"dao",yan:"ru",han:"fa",zhao:"bing",wei:"fa",
         lu:"ru",song:"mo",zheng:"fa",wu:"bing",yue:"bing",zhou:"ru",jin:"bing"};
  return m[sid]||pick(["ru","dao","bing","nong","mo"]);
}
function capDist(a,b){ var ca=CITY[STATES[a].cap],cb=CITY[STATES[b].cap];
  if(!ca||!cb) return 999; return Math.hypot(ca.x-cb.x,ca.y-cb.y); }
function actQuota(sid){ var st=STATES[sid]; if(!st) return 3;
  var f=sf(st); var n=3+(f.act||0)+(gCityOf(sid).length>=8?1:0)+(gCityOf(sid).length>=16?1:0);
  return Math.min(7,n); }
var GSUR=["公孫","司馬","士","申","樂","范","苗","籍","叔","仲","子","伯","孟","季","華","向","狐","荀"];
var GNAM=["嬰","牟","彊","啟","獲","黶","偃","朔","罃","肸","衎","舍","克","絕","它","禦","盈","鞅"];
function fillCourt(){
  for(var s in STATES){ var st=STATES[s]; if(!st.live) continue;
    var o=officers(s), need=3-o.list.length;
    for(var i=0;i<need;i++){
      var h=(s.charCodeAt(0)*131+CHAR_LIST.length*17+i*29+Math.abs(GM.year))&65535;
      var id="g"+s+"_"+CHAR_LIST.length;
      var c={id:id,n:GSUR[h%GSUR.length]+GNAM[(h>>4)%GNAM.length],zi:"—",
             b:GM.year-42,d:GM.year+14+(h%26),sch:st.school||"ru",
             lead:44+h%26,adm:44+(h>>3)%26,int:44+(h>>6)%26,cha:44+(h>>9)%26,
             home:s,deed:"世卿之族，佐其君以守社稷，史失其詳。",q:"",st:s,job:"",alive:1,gen:1};
      CHARS[id]=c; CHAR_LIST.push(c); } }
}
function autoAppoint(){
  for(var s in STATES){ if(!STATES[s].live) continue;
    var o=officers(s); var free=o.list.filter(function(c){ return !c.job; });
    if(!o.xiang){ free.sort(function(a,b){return b.adm-a.adm;}); if(free[0]){ free[0].job="相"; free=free.slice(1);} }
    if(!o.jiang){ free.sort(function(a,b){return b.lead-a.lead;}); if(free[0]){ free[0].job="將"; free=free.slice(1);} }
    if(!o.mou){ free.sort(function(a,b){return b.int-a.int;}); if(free[0]) free[0].job="謀"; } }
}
/* ---------------- 經濟 ---------------- */
function terrOf(c){ return TERRA[c.terr]||TERRA["平原"]; }
function econTurn(){
  for(var s in STATES){ var st=STATES[s]; if(!st.live) continue;
    var f=sf(st), cs=gCityOf(s), gold=0, grain=0, i;
    for(i=0;i<cs.length;i++){ var c=cs[i], t=terrOf(c);
      var eff=(c.mood/60)*(0.72+c.pop/64);
      grain+=c.farm*0.40*t.f*(1+(f.farm||0))*eff;
      gold +=c.trade*0.30*t.t*(1+(f.trade||0))*eff;
      var g=(c.mood>55?1:-1)*(0.34+c.farm/420)*(1+(f.pop||0));
      if(c.siege>0){ g-=1.3; c.siege--; }
      c.pop=clamp(c.pop+g,3,120);
      c.mood=clamp(c.mood+(c.siege>0?-4:0.85)+(st.mood>66?0.5:0)-((f.mood||0)<0?0.7:0),5,100);
      c.wall=Math.min(c.wall+1.3,c.defv*24); }
    gold*=(1+(f.tax||0)); grain*=(1+(f.tax||0)*0.4);
    var tt=gTroop(s);
    var upG=tt*0.0060+cs.length*3+officers(s).list.length*2;
    var upF=tt*0.0120+cs.length*2;
    upG*=(1+(f.cost||0)); upF*=(1+(f.cost||0));
    st.gold=Math.max(0,st.gold+gold-upG); st.grain=st.grain+grain-upF;
    st.income={gold:gold-upG,grain:grain-upF};
    if(st.grain<0){ var lost=Math.min(tt*0.12,-st.grain*34); st.grain=0; st.mood-=6;
      if(lost>200){ loseTroops(s,lost);
        if(s===GM.me) glog("府庫空虛，士卒乏食，逃散"+wan(lost)+"人。","eco"); } }
    var nw=0; for(var w in st.war) nw++;
    st.mood=clamp(st.mood+(f.mood||0)*0.5+(st.grain>240?0.6:-1.1)+(nw?-1.0:0.7),5,100);
    st.pres=clamp(st.pres+(st.reforms.length?0.25:0)-(nw>2?0.5:0)+(GM.hegemon===s?0.9:0),0,120);
    st.exhaust=Math.max(0,(st.exhaust||0)-1);
    for(var k in st.truce) if(st.truce[k]<=GM.year) delete st.truce[k];
  }
}
function loseTroops(sid,n){ var cs=gCityOf(sid).sort(function(a,b){return b.troop-a.troop;});
  var st=STATES[sid], take=Math.min(st.troop,n); st.troop-=take; n-=take;
  for(var i=0;i<cs.length&&n>0;i++){ var t=Math.min(cs[i].troop,n); cs[i].troop-=t; n-=t; } }

/* ---------------- 行軍與會戰 ---------------- */
function gMarch(owner,fromId,toId,n,genId){
  var f=CITY[fromId], t=CITY[toId]; if(!f||!t||n<=0) return null;
  f.troop-=n;
  var a={owner:owner,from:fromId,to:toId,n:n,gen:genId||"",d:Math.hypot(f.x-t.x,f.y-t.y)};
  GM.armies.push(a);
  if(SIM.layArm) SIM.armies.push({x0:f.x,y0:f.y,x1:t.x,y1:t.y,t:0,dur:2.2,c:STATES[owner].c,n:owner});
  return a;
}
function fatigue(d){ return clamp(1.06-d/900,0.7,1.05); }
function stratagem(gen,f){
  var names=["伏兵","火攻","水淹","疑兵","斷糧","奇襲","反間","背水"];
  var p=0.06+(gen?gen.int/520:0)+(f.plot||0)*0.55;
  if(Math.random()<p) return {n:pick(names),m:1.18+Math.random()*0.55};
  return null;
}
function gBattle(a){
  var c=CITY[a.to], att=STATES[a.owner], dsid=c.o, def=dsid?STATES[dsid]:null;
  var fa=sf(att), fd=def?sf(def):{};
  var gen=a.gen?CHARS[a.gen]:null, dOff=dsid?officers(dsid):{jiang:null,mou:null};
  var dgen=dOff.jiang, t=terrOf(c);
  var relief=0, rlist=[];
  if(dsid){ var dc=gCityOf(dsid);
    for(var ri=0;ri<dc.length;ri++){ var oc=dc[ri]; if(oc.id===c.id) continue;
      var dd=Math.hypot(oc.x-c.x,oc.y-c.y);
      if(dd<175&&oc.troop>400){ var part=oc.troop*0.32*(1-dd/230);
        relief+=part; rlist.push([oc,part]); } } }
  var pa=a.n*(1+(fa.atk||0))*(gen?1+gen.lead/210:1)*fatigue(a.d)*(0.88+Math.random()*0.26);
  var pd=(c.troop+relief+(def?def.troop*0.15:0))*(1+(fd.def||0))*t.d*(dgen?1+dgen.lead/240:1)
        *(1+c.wall/240)*(0.55+c.mood/90)*(0.88+Math.random()*0.26);
  if(!dsid) pd=Math.max(600,c.troop)*t.d*(1+c.wall/300)*(0.9+Math.random()*0.3);
  var sA=stratagem(gen||officers(a.owner).mou,fa), sD=def?stratagem(dOff.mou,fd):null;
  if(sA) pa*=sA.m; if(sD) pd*=sD.m;
  var ratio=pa/(pa+pd);
  var win=ratio>0.5+(c.terr==="關隘"?0.07:0.02);
  var lossA=Math.round(a.n*clamp((1-ratio)*0.85,0.05,0.85));
  var lossD=Math.round(c.troop*clamp(ratio*0.9,0.05,0.92));
  var restA=Math.max(0,a.n-lossA), restD=Math.max(0,c.troop-lossD);
  c.troop=restD;
  if(relief>0){ var rk=clamp(ratio*0.55,0.03,0.6);
    for(var rj=0;rj<rlist.length;rj++){ var rc=rlist[rj][0];
      var rl=Math.round(rlist[rj][1]*rk); rc.troop=Math.max(0,rc.troop-rl); lossD+=rl; }
  }
  GM.stats.battles++; GM.stats.killed+=lossA+lossD;
  var rep={c:c.id,cn:c.n,att:a.owner,def:dsid,n:a.n,la:lossA,ld:lossD,rel:Math.round(relief),win:win,sA:sA,sD:sD,
           gen:gen?gen.n:"",dgen:dgen?dgen.n:"",taken:false};
  var breach=(c.wall<c.defv*9)||(restA>restD*4+3000);
  if(win&&breach&&restA>restD*1.55+700){ rep.taken=true; gCapture(c,a.owner,restA);
    att.pres=clamp(att.pres+3,0,120);
    if(def){ def.pres=clamp(def.pres-2,0,120); def.mood-=4; def.exhaust=(def.exhaust||0)+3; } }
  else if(win){ c.wall=Math.max(0,c.wall-42); c.siege=2; c.mood-=7;
    var b1=CITY[a.from]; if(b1&&b1.o===a.owner) b1.troop+=Math.round(restA*0.85); else att.troop+=Math.round(restA*0.8); }
  else { var b2=CITY[a.from]; if(b2&&b2.o===a.owner) b2.troop+=Math.round(restA*0.8); else att.troop+=Math.round(restA*0.75);
    att.pres=clamp(att.pres-1.5,0,120); if(def) def.pres=clamp(def.pres+1.5,0,120); }
  att.exhaust=(att.exhaust||0)+2;
  var tot=(lossA+lossD)/10000;
  addFX({k:"clash",x:c.x,y:c.y,dur:3.6,d0:0});
  if(tot>0.05) addFX({k:"num",x:c.x,y:c.y-26,dur:4.6,d0:0.25,s:"斬首 "+wan(lossA+lossD)});
  SIM.marks.push({x:c.x,y:c.y,y0:GM.year,s:Math.min(1,tot/8)});
  if(SIM.marks.length>70) SIM.marks.shift();
  beat(tot*6);
  glog("〔"+c.n+"之役〕"+sn(a.owner)+(rep.gen?"·"+rep.gen:"")+"以"+wan(a.n)+"攻"+(dsid?sn(dsid):"自治小邦")+
    (rep.dgen?"·"+rep.dgen:"")+"："+(sA?sA.n+"見效，":"")+(sD?"守方"+sD.n+"以待，":"")+
    (rep.taken?"拔其城":(win?"破其軍而未克":"師敗績"))+"，攻方死傷"+wan(lossA)+"，守方死傷"+wan(lossD)+"。","war");
  return rep;
}
function gCapture(c,newOwner,garrison){
  var old=c.o; c.o=newOwner; c.troop=Math.round(garrison*0.9); c.mood=clamp(c.mood-22,5,100);
  c.wall=Math.max(20,c.wall*0.45); c.siege=1; c.flash=1;
  GM.stats.taken++; SIM.dirty=true;
  if(STATES[newOwner]) STATES[newOwner].live=1;
  if(old&&STATES[old]&&gCityOf(old).length===0) fallState(old,newOwner);
}
function fallState(sid,toSid){
  var st=STATES[sid]; if(!st||!st.live) return; st.live=0;
  for(var i=0;i<CHAR_LIST.length;i++){ var ch=CHAR_LIST[i];
    if(ch.st===sid){ ch.st=(Math.random()<0.42?toSid:""); ch.job=""; } }
  for(var k in st.war){ delete STATES[k].war[sid]; } st.war={};
  for(var k2 in st.ally){ delete STATES[k2].ally[sid]; } st.ally={};
  glog("〔亡國〕"+st.n+"社稷不守，宗廟為墟，其地入於"+sn(toSid)+"。","big");
  if(sid===GM.me) endGame(0,"社稷傾覆，宗廟不血食。君之國除矣。");
  autoAppoint(); SIM.dirty=true;
}
function resolveArmies(){
  var arms=GM.armies.slice(); GM.armies=[]; var reps=[];
  for(var i=0;i<arms.length;i++){ var a=arms[i], c=CITY[a.to];
    if(!c||!STATES[a.owner]||!STATES[a.owner].live) continue;
    if(c.o===a.owner){ c.troop+=a.n; continue; }
    if(c.o&&!atWar(a.owner,c.o)) declareWar(a.owner,c.o);
    reps.push(gBattle(a)); }
  GM.lastRep=reps; return reps;
}
/* ---------------- 人物生卒 ---------------- */
function charTurn(){
  var y=GM.year, chg=0;
  for(var i=0;i<CHAR_LIST.length;i++){ var c=CHAR_LIST[i];
    if(!c.alive&&y>=c.b+16&&y<=c.d){ c.alive=1; chg=1;
      if(STATES[c.home]&&STATES[c.home].live&&Math.random()<0.6) c.st=c.home;
      if(c.st===GM.me) glog("〔得士〕"+c.n+"起於"+sn(c.st)+"，"+c.deed+"。","cul");
      else if(!c.st) glog("〔士出〕"+c.n+"名聞於天下，未有所主。","cul"); }
    else if(c.alive&&y>c.d){ c.alive=0; chg=1;
      if(c.st===GM.me) glog("〔喪〕"+c.n+"卒。"+(c.q?"「"+c.q+"」":""),"cul");
      c.st=""; c.job=""; } }
  for(var p=CHAR_LIST.length-1;p>=0;p--){ var gc=CHAR_LIST[p];
    if(gc.gen&&!gc.alive){ delete CHARS[gc.id]; CHAR_LIST.splice(p,1); chg=1; } }
  if(chg){ autoAppoint(); fillCourt(); }
  for(var s in STATES){ var st=STATES[s]; if(!st.live) continue;
    var r=st.ruler; if(r&&r.y1!==undefined&&y>r.y1){ st.ruler=rulerOf(s,y);
      if(s===GM.me) glog("〔即位〕君薨，"+st.ruler.n+"立。"+(st.ruler.note||""),"big");
      st.pres=clamp(st.pres-3,0,120); } }
}
/* ---------------- 列國之謀（AI） ---------------- */
function neighborCities(sid){
  var mine=gCityOf(sid), out=[], i, j;
  for(i=0;i<CLIST.length;i++){ var c=CLIST[i];
    if(c.w<=0||c.o===sid) continue;
    var best=1e9,bf=null;
    for(j=0;j<mine.length;j++){ var d=Math.hypot(c.x-mine[j].x,c.y-mine[j].y);
      if(d<best){ best=d; bf=mine[j]; } }
    if(bf&&best<230) out.push({c:c,from:bf,d:best}); }
  out.sort(function(a,b){ return a.d-b.d; });
  return out;
}
function aiTurn(sid){
  var st=STATES[sid]; if(!st||!st.live||sid===GM.me) return;
  var f=sf(st), cs=gCityOf(sid); if(!cs.length) return;
  var i, aggr=clamp(st.aggr+(f.aggr||0),0.05,1);
  /* 內政 */
  if(st.gold>200){ var wk=cs.slice().sort(function(a,b){ return a.mood-b.mood; })[0];
    if(wk.mood<48&&st.grain>200){ st.grain-=110; wk.mood=clamp(wk.mood+16,5,100); }
    else { var t=pick(cs); if(Math.random()<0.5){ st.gold-=70; t.farm+=12*(1+(f.farm||0)); }
      else { st.gold-=80; t.wall+=26*(1+(f.def||0)); } } }
  /* 徵兵 */
  var tt=gTroop(sid);
  if(tt<cs.length*4600&&st.gold>150&&st.grain>150){
    var cap=CITY[st.cap]&&CITY[st.cap].o===sid?CITY[st.cap]:cs[0];
    st.gold-=100; st.grain-=60;
    cap.troop+=Math.round((650+cap.pop*22)*(1+(f.levy||0))); cap.mood=clamp(cap.mood-6,5,100); }
  /* 變法 */
  if(st.gold>420&&st.grain>360&&Math.random()<0.35){
    for(i=0;i<REFORMS.length;i++){ var r=REFORMS[i];
      if(st.reforms.indexOf(r.id)>=0) continue;
      if(r.st&&r.st!==sid) continue;
      if(GM.year<r.y-30) continue;
      if(r.era&&(GM.year<r.era[0]||GM.year>r.era[1])) continue;
      if(st.gold<r.g||st.grain<r.r) continue;
      st.gold-=r.g; st.grain-=r.r; st.reforms.push(r.id);
      if(r.f.pres) st.pres=clamp(st.pres+r.f.pres,0,120);
      glog("〔變法〕"+st.n+"行"+r.n+"。","eco"); break; } }
  /* 邦交 */
  var wars=[]; for(var w in st.war) wars.push(w);
  if(wars.length){ var weak=wars.sort(function(a,b){ return gPower(a)-gPower(b); });
    var strongest=wars[wars.length-1];
    if((wars.length>1||st.exhaust>7||gPower(strongest)>gPower(sid)*1.5)&&Math.random()<0.45)
      if(Math.random()<0.4+(f.dip||0)) makePeace(sid,strongest); }
  else if(Math.random()<0.30){
    var cands=[]; for(var k in STATES){ if(k===sid||!STATES[k].live) continue;
      if(isAlly(sid,k)||st.truce[k]) continue; cands.push(k); }
    if(cands.length){ var tg=pick(cands), rr=relOf(sid,tg);
      if(rr>44&&Math.random()<0.4) makeAlly(sid,tg);
      else if(rr<-16&&gPower(tg)<gPower(sid)*0.85&&Math.random()<aggr) declareWar(sid,tg);
      else addRel(sid,tg,3); } }
  /* 聚兵：內地之卒輸於邊城 */
  var ns0=neighborCities(sid);
  if(ns0.length&&Math.random()<0.55){ var front=ns0[0].from;
    for(i=0;i<cs.length;i++){ var ci=cs[i];
      if(ci.id!==front.id&&ci.troop>2800&&Math.hypot(ci.x-front.x,ci.y-front.y)<270){
        var mv=Math.round(ci.troop*0.45); ci.troop-=mv; front.troop+=mv; } } }
  /* 出兵 */
  if(st.exhaust>9) return;
  var ns=ns0;
  for(i=0;i<ns.length&&i<6;i++){ var o=ns[i], tc=o.c;
    if(tc.o&&isAlly(sid,tc.o)) continue;
    if(tc.o&&st.truce[tc.o]) continue;
    if(tc.o&&!atWar(sid,tc.o)){
      if(Math.random()>aggr*0.35) continue;
      if(gPower(tc.o)>gPower(sid)*1.25) continue;
      declareWar(sid,tc.o); }
    var from=o.from;
    for(var j2=0;j2<cs.length;j2++){ var cc=cs[j2];
      if(Math.hypot(cc.x-tc.x,cc.y-tc.y)<250&&cc.troop>from.troop) from=cc; }
    if(tc.o&&gPower(tc.o)>gPower(sid)*1.6) continue;
    var need=tc.troop*1.9+tc.wall*7;
    if(from.troop>need+800&&st.grain>180){
      var send=Math.round(Math.min(from.troop-500,from.troop*0.78));
      var gid=officers(sid).jiang?officers(sid).jiang.id:"";
      st.grain-=Math.round(send*0.02+o.d*0.3);
      gMarch(sid,from.id,tc.id,send,gid); break; } }
}
/* ---------------- 史筆（爭霸模式的歷史暗流） ---------------- */
function histFlavor(){
  while(SIM.ei<EV.length&&EV[SIM.ei].y<=GM.year){
    var e=EV[SIM.ei]; SIM.ei++;
    setNarr(e); if(e.sg) showSage(e.sg);
    glog("〔史筆〕"+e.t+"："+e.d.slice(0,44)+"…","hist");
    if(e.fl) showFlash(e.t,"前 "+(-e.y)+" 年");
    if(e.war&&STATES[e.war.w]&&STATES[e.war.w].live)
      STATES[e.war.w].pres=clamp(STATES[e.war.w].pres+2.5,0,120);
    if(e.heg&&STATES[e.heg]&&STATES[e.heg].live){ GM.hegemon=e.heg; SIM.heg=e.heg; }
    if(e.k==="學"||e.k==="人"){ for(var s in STATES) if(STATES[s].live) STATES[s].mood=clamp(STATES[s].mood+0.6,5,100); }
  }
  showIdiom(GM.year);
}
function hegemonyCheck(){
  var best="",bv=0;
  for(var s in STATES){ var st=STATES[s]; if(!st.live) continue;
    var na=0; for(var k in st.ally) na++;
    var v=st.pres+na*6+(st.meets||0)*4;
    if(v>bv){ bv=v; best=s; } }
  if(bv>=88&&best){ if(GM.hegemon!==best){ GM.hegemon=best; SIM.heg=best;
      glog("〔霸〕"+sn(best)+"為諸侯長，會盟而天下從之。","big");
      if(best===GM.me) toastG("君已為天下霸主。"); } }
}
function checkEnd(){
  if(GM.ended) return;
  var mine=gCityOf(GM.me).length;
  if(!mine){ endGame(0,"社稷傾覆，宗廟為墟。"); return; }
  var all=0,own=0;
  for(var i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w<=0) continue; all++; if(c.o===GM.me) own++; }
  if(own===all){ endGame(2,"六王畢，四海一。天下歸於"+sn(GM.me)+"，功蓋三皇，德邁五帝。"); return; }
  if(GM.year>=-221){
    var rank=[]; for(var s in STATES) if(STATES[s].live) rank.push({s:s,v:gPower(s)});
    rank.sort(function(a,b){ return b.v-a.v; });
    var pos=1; for(var j=0;j<rank.length;j++) if(rank[j].s===GM.me) pos=j+1;
    endGame(pos===1?1:0,"歲在辛卯，天下之勢已定。"+sn(GM.me)+"據城"+own+"，列於諸侯第"+pos+
      "。"+(pos===1?"雖未混一，然威加海內，霸業成矣。":"史筆如刀，成敗自有後人論之。")); }
}
function endGame(win,text){
  GM.ended=1;
  var t=win===2?"天下一統":(win===1?"霸業有成":"社稷不守");
  showFlash(t,"前 "+(-GM.year)+" 年"); bell();
  modalG(t,"<p>"+text+"</p><p class=q>「兵者，國之大事，死生之地，存亡之道，不可不察也。」</p>"+
    "<p class=sm>會戰 "+GM.stats.battles+" 次　斬首 "+wan(GM.stats.killed)+"　拔城 "+GM.stats.taken+" 座</p>",
    [{t:"再起爐灶",f:function(){ closeModalG(); openStart(); }},{t:"觀此殘局",f:closeModalG}]);
}
/* ---------------- 歲終 ---------------- */
function endTurn(){
  if(!GM.on||GM.ended) return;
  var order=[]; for(var s in STATES) if(STATES[s].live&&s!==GM.me) order.push(s);
  order.sort(function(){ return Math.random()-0.5; });
  for(var i=0;i<order.length;i++) aiTurn(order[i]);
  resolveArmies();
  econTurn();
  GM.year++; SIM.year=GM.year; lastTopY=null;
  charTurn(); histFlavor(); hegemonyCheck(); checkEnd();
  GM.acts=actQuota(GM.me);
  sampleHist(GM.year);
  var st=STATES[GM.me];
  if(st&&st.live) glog("〔歲首〕"+(-GM.year)+"年。金"+Math.round(st.gold)+"　粟"+Math.round(st.grain)+
    "　甲士"+wan(gTroop(GM.me))+"　政令"+GM.acts,"eco");
  SIM.dirty=true; refreshAll(); yearReport();
}
function yearReport(){
  if(GM.ended) return;
  var mine=[],i;
  for(i=0;i<GM.lastRep.length;i++){ var r=GM.lastRep[i];
    if(r.att===GM.me||r.def===GM.me) mine.push(r); }
  if(!mine.length) return;
  var h="",win=0,lose=0;
  for(i=0;i<mine.length;i++){ var r2=mine[i], we=r2.att===GM.me;
    if(we?r2.win:!r2.win) win++; else lose++;
    h+="<p><b>"+r2.cn+"之役</b>　"+sn(r2.att)+(r2.gen?"·"+r2.gen:"")+" 以 "+wan(r2.n)+" 攻 "+
       (r2.def?sn(r2.def):"自治小邦")+(r2.dgen?"·"+r2.dgen:"")+"<br/>"+
       (r2.sA?"<span style='color:#f0d38a'>"+r2.sA.n+"見效。</span>":"")+
       (r2.sD?"<span style='color:#a9c8d8'>守方"+r2.sD.n+"以待。</span>":"")+
       (r2.taken?"<span style='color:#e08f7a'>拔其城。</span>":(r2.win?"破其軍而未克城。":"師敗績。"))+
       "　攻方死傷 "+wan(r2.la)+"，守方死傷 "+wan(r2.ld)+"。</p>"; }
  modalG("歲 報 · 前 "+(-(GM.year-1))+" 年",h+
    "<p class=sm>是歲我之戰事 "+mine.length+"：得志 "+win+"，失利 "+lose+"。</p>"+
    "<p class=q>「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。」</p>");
}

function costG(g,r){ var st=STATES[GM.me];

  if(st.grain<r){ toastG("倉廩粟不足（需 "+Math.round(r)+"）。"); return false; }

function actCity(kind){
  var c=CITY[GM.sel]; if(!c||c.o!==GM.me) return;
  var st=STATES[GM.me], f=sf(st);
  if(kind==="farm"){ if(!needAct()||!costG(70,0)) return; c.farm+=14*(1+(f.farm||0)); c.dev++;

  else if(kind==="trade"){ if(!needAct()||!costG(90,0)) return; c.trade+=13*(1+(f.trade||0)); c.dev++;
    glog("開"+c.n+"關市，通商賈，輕其徵。","eco"); }
  else if(kind==="wall"){ if(!needAct()||!costG(Math.round(80*(1+(f.build||0))),0)) return;
    c.wall+=30*(1+(f.def||0)); glog("繕"+c.n+"城郭，浚溝池，具守備。","eco"); }
  else if(kind==="levy"){ if(!needAct()||!costG(100,60)) return;
    var n=Math.round((700+c.pop*24)*(1+(f.levy||0)));
    c.troop+=n; c.mood=clamp(c.mood-7,5,100);
    glog("發"+c.n+"之卒"+wan(n)+"，簡練以時。","war"); }
  else if(kind==="relief"){ if(!needAct()||!costG(0,120)) return;
    c.mood=clamp(c.mood+18,5,100); glog("發"+c.n+"倉廩以賑饑，民大悅。","eco"); }

function actFeast(){ var st=STATES[GM.me];

  st.mood=clamp(st.mood+6,5,100); glog("大饗士卒，賜爵一級，國人歌舞。","eco"); useAct(); }
function actRecruit(){

    glog("〔得士〕"+c.n+"入"+sn(GM.me)+"，君上厚幣以延之。","cul"); }

function actAppoint(cid,job){

}
function actDiplo(target,kind){
  var st=STATES[GM.me], f=sf(st);
  if(!STATES[target]||!STATES[target].live) return;
  if(kind==="envoy"){ if(!needAct()||!costG(70,0)) return;
    var d=8+Math.round((f.dip||0)*14)+rnd(6); addRel(GM.me,target,d);
    glog("遣使聘於"+sn(target)+"，執玉帛以修好（＋"+d+"）。","dip"); }
  else if(kind==="marry"){ if(!needAct()||!costG(160,80)) return;
    addRel(GM.me,target,20); st.truce[target]=GM.year+4; STATES[target].truce[GM.me]=GM.year+4;
    glog("以公女妻"+sn(target)+"之君，秦晉之好，姻親相援。","dip"); }
  else if(kind==="ally"){ if(!needAct()) return;
    var r=relOf(GM.me,target);
    if(r<35){ toastG("交誼未孚（"+r+"），不足以結盟。"); return; }
    if(!costG(120,0)) return;
    if(Math.random()<0.42+r/160+(f.dip||0)*0.4) makeAlly(GM.me,target);
    else { glog(sn(target)+"辭盟：寡人願修好，未敢與聞歃血。","dip"); addRel(GM.me,target,5); } }
  else if(kind==="peace"){ if(!atWar(GM.me,target)||!needAct()) return;
    var pw=gPower(GM.me)/(gPower(target)+1);
    var ask=pw<0.8?Math.round(120/pw):0;
    if(ask>0&&!costG(Math.min(ask,st.gold),0)) return;
    if(Math.random()<0.33+pw*0.3+(f.dip||0)*0.4+(STATES[target].exhaust||0)*0.03){
      makePeace(GM.me,target); if(ask>0) glog("以幣帛謝罪，"+sn(target)+"許成。","dip"); }
    else glog(sn(target)+"不許成，曰：孤之願也，然兵猶未戢。","dip"); }
  else if(kind==="war"){ if(!needAct()) return;
    if(isAlly(GM.me,target)){ delete st.ally[target]; delete STATES[target].ally[GM.me]; }
    declareWar(GM.me,target); st.pres=clamp(st.pres-(relOf(GM.me,target)>30?6:2),0,120); }
  else if(kind==="plot"){ if(!needAct()||!costG(150,0)) return;
    var ms=officers(GM.me).mou, p=0.28+(ms?ms.int/300:0)+(f.plot||0);
    if(Math.random()<p){ var vic=STATES[target], eff=pick(["間其君臣","散其盟約","惑其民心"]);
      if(eff==="間其君臣"){ var o=officers(target);
        if(o.jiang&&Math.random()<0.55){ glog("反間行於"+sn(target)+"："+o.jiang.n+"見疑去位。","dip"); o.jiang.st=""; o.jiang.job=""; autoAppoint(); }
        else { vic.mood=clamp(vic.mood-8,5,100); glog(sn(target)+"君臣相疑，國人離心。","dip"); } }
      else if(eff==="散其盟約"){ var cnt=0;
        for(var k in vic.ally){ delete STATES[k].ally[target]; addRel(target,k,-25); cnt++; }
        vic.ally={}; glog("縱橫之士遊說列國，"+sn(target)+"之盟盡散（"+cnt+"約）。","dip"); }
      else { vic.mood=clamp(vic.mood-12,5,100);
        var vc=gCityOf(target); for(var i=0;i<vc.length;i++) vc[i].mood=clamp(vc[i].mood-6,5,100);
        glog("行金玉於"+sn(target)+"之豪臣，其國內亂。","dip"); } }
    else { glog("間諜事泄，"+sn(target)+"大怒。","dip"); addRel(GM.me,target,-18); } }
  useAct();
}
function actMeet(){
  var st=STATES[GM.me];
  if(!needAct(2)||!costG(200,150)) return;
  var others=[],come=[];
  for(var k in STATES){ if(k!==GM.me&&STATES[k].live&&relOf(GM.me,k)>-24) others.push(k); }
  for(var i=0;i<others.length;i++){ var o=others[i];
    if(Math.random()<0.22+relOf(GM.me,o)/200+st.pres/230+gPower(GM.me)/(gPower(o)*4+1)) come.push(o); }
  st.meets=(st.meets||0)+1;
  var gain=4+come.length*3; st.pres=clamp(st.pres+gain,0,120);
  for(var j=0;j<come.length;j++) addRel(GM.me,come[j],10);
  var zk=STATES.zhou&&STATES.zhou.live;
  modalG("會盟","<p>大會諸侯於"+pick(["葵丘","踐土","黃池","徐州","召陵","溴梁"])+"，"+
    (zk?"王使宰孔賜胙，曰：伯舅耋老，加勞，賜一級，無下拜。":"周室已亡，唯以力相尚耳。")+"</p>"+
    "<p>與會者："+(come.length?come.map(sn).join("、"):"諸侯莫至，寡人之德薄也")+"</p>"+
    "<p class=q>兵車之會三，乘車之會六，九合諸侯，一匡天下。</p><p class=sm>威望 ＋"+gain+"</p>");
  glog("〔會盟〕"+sn(GM.me)+"合諸侯，與會者"+come.length+"國，威望增"+gain+"。","dip");
  GM.acts-=2; refreshAll();
}
function actReform(id){
  var r=null; for(var i=0;i<REFORMS.length;i++) if(REFORMS[i].id===id) r=REFORMS[i];
  var st=STATES[GM.me]; if(!r) return;
  if(st.reforms.indexOf(id)>=0){ toastG("此法已行。"); return; }
  if(r.st&&r.st!==GM.me){ toastG("此乃"+sn(r.st)+"之政，非我國所可行。"); return; }
  if(GM.year<r.y-40){ toastG("時未至也（前"+(-r.y)+"年前後方可行）。"); return; }
  if(r.era&&(GM.year<r.era[0]||GM.year>r.era[1])){ toastG("時移世易，此策已不合時宜。"); return; }
  if(!needAct(2)||!costG(r.g,r.r)) return;
  st.reforms.push(id);
  if(r.f.pres) st.pres=clamp(st.pres+r.f.pres,0,120);
  if(r.f.mood) st.mood=clamp(st.mood+r.f.mood,5,100);
  modalG("變法 · "+r.n,"<p>"+r.d+"</p><p class=q>「"+r.q+"」</p><p class=sm>國策既定，其效見於歲月之間。</p>");
  glog("〔變法〕"+sn(GM.me)+"行"+r.n+"。"+r.d,"eco");
  GM.acts-=2; refreshAll();
}
function actSchool(id){
  var st=STATES[GM.me]; if(st.school===id) return;
  if(!needAct()||!costG(100,60)) return;

function doMarch(fromId,toId,ratio,genId){

  gMarch(GM.me,fromId,toId,n,genId);

  GM.year=d.y; SIM.year=d.y; SIM.ei=d.ei; GM.acts=d.acts; GM.hegemon=d.heg; SIM.heg=d.heg;
  GM.stats=d.stats||GM.stats; GM.log=d.log||[]; GM.ended=0; GM.armies=[]; GM.sel=""; GM.marchFrom="";
  lastTopY=null; updateTop(); SIM.dirty=true; setTab("nei"); refreshAll();
  if(CITY[STATES[d.me].cap]) focusOn(STATES[d.me].cap,1.45);
  toastG("石室啟封，復于前"+(-d.y)+"年。");
}
/* ---------------- 綁定與掛鉤 ---------------- */
function findA(el,root){ while(el&&el!==root){ if(el.getAttribute&&el.getAttribute("data-a")) return el; el=el.parentNode; } return null; }
function onAct(el){
  var a=el.getAttribute("data-a"), v=el.getAttribute("data-v"), w=el.getAttribute("data-w");
  if(a==="feast") actFeast();
  else if(a==="meet") actMeet();
  else if(a==="sel"){ GM.sel=v; if(CITY[v]&&CITY[v].o===GM.me) GM.marchFrom=v; renderCityPanel(); if(SIM.layCam) focusOn(v,1.65); }
  else if(a==="dip") actDiplo(w,v);
  else if(a==="recruit") actRecruit();
  else if(a==="app") actAppoint(w,v);
  else if(a==="reform") actReform(v);
  else if(a==="school") actSchool(v);
  else if(a==="city") actCity(v);
  else if(a==="march") openMarch(GM.marchFrom,v);
}
$("gtab").addEventListener("click",function(e){ var t=e.target.getAttribute("data-t"); if(t) setTab(t); });
$("gbody").addEventListener("click",function(e){ var el=findA(e.target,this); if(el) onAct(el); });
$("gcity").addEventListener("click",function(e){ var el=findA(e.target,this); if(el) onAct(el); });
$("bEnd").onclick=function(){ endTurn(); };
$("bSave").onclick=function(){ saveGame(); };
$("bLoad").onclick=function(){ loadGame(); };
$("bQuit").onclick=function(){ modalG("出局","<p>棄此殘局，別擇一世而入？</p>",
  [{t:"別擇一世",f:function(){ closeModalG(); quitGame(); }},{t:"仍守社稷",f:closeModalG}]); };
$("bMe").onclick=function(){
  var st=STATES[GM.me], o=officers(GM.me), s=SCH[st.school];
  var ws=[],als=[]; for(var k in st.war) ws.push(sn(k)); for(var k2 in st.ally) als.push(sn(k2));
  modalG(st.f+" 國 情",
    "<p>"+st.d+"</p>"+
    "<p class=sm>君 "+(st.ruler?st.ruler.n:"")+"　相 "+(o.xiang?o.xiang.n:"虛")+"　將 "+(o.jiang?o.jiang.n:"虛")+"　謀 "+(o.mou?o.mou.n:"虛")+"</p>"+
    "<p class=sm>國是 "+(s?s.n:"—")+"　變法 "+st.reforms.length+" 條　威望 "+Math.round(st.pres)+"　民心 "+Math.round(st.mood)+"</p>"+
    "<p class=sm>疆域 "+gCityOf(GM.me).length+" 邑　甲士 "+wan(gTroop(GM.me))+"　會盟 "+(st.meets||0)+" 次</p>"+
    "<p class=sm>交兵："+(ws.length?ws.join("、"):"無")+"　　盟好："+(als.length?als.join("、"):"無")+"</p>"+
    "<p class=q>「"+(s?s.q:"")+"」</p>"); };
$("bAnn").onclick=function(){
  var h="",n=0;
  for(var i=0;i<EV.length&&n<26;i++){ var e=EV[i];
    if(e.y<GM.year-70||e.y>GM.year+70) continue; n++;
    h+="<p class=sm style='color:"+(e.y<=GM.year?"#dccfae":"#7d6f58")+"'>前"+(-e.y)+"　"+e.t+
       (e.y<=GM.year?"":"（未至）")+"</p>"; }
  modalG("編 年","<p class=sm>天下大勢，非一國所能移；然史筆所書，未必即今日之事。</p>"+h); };
$("scl").addEventListener("click",function(e){
  var el=e.target; while(el&&el!==this&&!el.getAttribute("data-s")) el=el.parentNode;
  if(el&&el.getAttribute){ var s=el.getAttribute("data-s"); if(s){ SELG.sc=s; SELG.me=""; renderScen(); } } });
$("stl").addEventListener("click",function(e){
  var el=e.target; while(el&&el!==this&&!el.getAttribute("data-m")) el=el.parentNode;
  if(el&&el.getAttribute){ var m=el.getAttribute("data-m"); if(m){ SELG.me=m; renderPick(); } } });
$("sPlay").onclick=function(){ startGame(); };
$("sLoad").onclick=function(){ loadGame(); };
$("sBack").onclick=function(){ $("start").classList.remove("on"); $("intro").style.display="flex";
  $("intro").classList.remove("off"); SIM.playing=false; };
$("ipl").onclick=function(){ audio(); openStart(); };

function clickCity(c){
  if(!GM.on||!c||c.w<=0) return;
  GM.sel=c.id;
  if(c.o===GM.me) GM.marchFrom=c.id;
  renderCityPanel();
}
/* ---------------- 地圖上的爭霸圖層 ---------------- */
function drawGame(z){
  var showN=z>fitZ()*1.02, i;
  for(i=0;i<CLIST.length;i++){ var c=CLIST[i]; if(c.w<=0) continue;
    if(c.o===GM.me){ cx.strokeStyle="rgba(240,211,138,.8)"; cx.lineWidth=1.5;
      cx.beginPath(); cx.arc(c.x,c.y,9.5,0,6.283); cx.stroke(); }
    if(c.siege>0){ cx.strokeStyle="rgba(214,70,44,.85)"; cx.setLineDash([3,3]); cx.lineWidth=1.5;
      cx.beginPath(); cx.arc(c.x,c.y,13,0,6.283); cx.stroke(); cx.setLineDash([]); }
    if(showN||c.o===GM.me){
      var s=wan(c.troop||0); cx.font="9.5px "+FT; cx.textAlign="center";
      var w=cx.measureText(s).width;
      cx.fillStyle="rgba(16,12,7,.74)"; cx.fillRect(c.x-w/2-2.5,c.y+4.5,w+5,10.5);
      cx.fillStyle=(c.o===GM.me?"#ffeec4":"#ded0ad"); cx.fillText(s,c.x,c.y+12.8); } }
  var sel=CITY[GM.sel];
  if(sel&&sel.w>0){ var r=13+Math.sin(pulseT*4)*2.6;
    cx.strokeStyle="#ffeec4"; cx.lineWidth=1.9;
    cx.beginPath(); cx.arc(sel.x,sel.y,r,0,6.283); cx.stroke(); }
  var mf=CITY[GM.marchFrom];
  if(mf&&mf.o===GM.me&&GM.marchFrom!==GM.sel){
    cx.strokeStyle="rgba(240,211,138,.5)"; cx.setLineDash([4,4]); cx.lineWidth=1.4;
    cx.beginPath(); cx.arc(mf.x,mf.y,15.5,0,6.283); cx.stroke(); cx.setLineDash([]);
    if(sel&&sel.w>0&&sel.o!==GM.me){
      cx.strokeStyle="rgba(224,143,122,.5)"; cx.setLineDash([5,5]); cx.lineWidth=1.6;
      cx.beginPath(); cx.moveTo(mf.x,mf.y); cx.lineTo(sel.x,sel.y); cx.stroke(); cx.setLineDash([]); } }
}

boot();
