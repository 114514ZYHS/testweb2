<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>夜空烟火大会 3D 场景 🎆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:linear-gradient(180deg,#020309 0%,#071022 45%,#0d1830 78%,#17233f 100%);
    touch-action:none;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  #c3d{position:fixed;inset:0;display:block}
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;user-select:none;-webkit-user-select:none}
  .title{position:fixed;top:20px;left:24px;color:#ffe9c0;text-shadow:0 0 22px rgba(255,170,70,.45),0 2px 8px rgba(0,0,0,.6)}
  .title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.14em}
  .title p{margin:4px 0 0;font-size:11px;letter-spacing:.5em;color:#8ea2cf}
  #count{position:fixed;top:24px;right:26px;color:#8fa3d0;font-size:13px;letter-spacing:.08em;
         text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
       padding:10px 14px;background:rgba(9,13,28,.55);border:1px solid rgba(140,170,255,.18);border-radius:14px;
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto;flex-wrap:wrap;justify-content:center;
       width:max-content;max-width:94vw}
  .bar button{appearance:none;border:1px solid rgba(150,180,255,.25);background:rgba(22,30,58,.65);color:#dfe8ff;
       font:500 13px/1 inherit;padding:9px 14px;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:.05em}
  .bar button:hover{background:rgba(52,72,132,.6);border-color:rgba(190,215,255,.5);box-shadow:0 0 16px rgba(120,160,255,.3)}
  .bar button.finale{color:#ffd9a0;border-color:rgba(255,190,110,.4)}
  .bar button.finale:hover{box-shadow:0 0 18px rgba(255,170,80,.4)}
  .bar button.sel{background:rgba(88,128,255,.5);border-color:#9fc0ff;color:#fff}
  #btnHide{position:fixed;right:14px;bottom:22px;z-index:12;appearance:none;pointer-events:auto;
    border:1px solid rgba(150,180,255,.22);background:rgba(22,30,58,.55);color:#cdd8f5;
    font:500 12px/1 inherit;padding:8px 11px;border-radius:9px;cursor:pointer;transition:all .2s;letter-spacing:.05em}
  #btnHide:hover{background:rgba(52,72,132,.6);border-color:rgba(190,215,255,.5)}
  body.ui-hidden .title,body.ui-hidden #count,body.ui-hidden .panel,
  body.ui-hidden .bar,body.ui-hidden .hint{display:none}
  body.ui-hidden #btnHide{opacity:.35;background:rgba(9,13,28,.3)}
  body.ui-hidden #btnHide:hover{opacity:1}
  @media (max-width:900px){ #btnHide{bottom:86px} }
  .panel{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;
    padding:10px 12px;background:rgba(9,13,28,.55);border:1px solid rgba(140,170,255,.18);border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto;width:max-content;max-width:94vw;z-index:11}
  .panel .row{display:flex;align-items:center;gap:8px}
  .panel .lab{color:#8ea2cf;font-size:12px;letter-spacing:.2em;flex:0 0 3.4em;text-align:right}
  .opts{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
  .opts::-webkit-scrollbar{display:none}
  .opts button{appearance:none;border:1px solid rgba(150,180,255,.22);background:rgba(22,30,58,.55);color:#cdd8f5;
    font:500 12px/1 inherit;padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .opts button:hover{background:rgba(52,72,132,.6)}
  .opts button.sel{background:rgba(88,128,255,.5);border-color:#9fc0ff;color:#fff}
  .sw{width:30px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.28);cursor:pointer;flex:0 0 auto}
  .sw.sel{outline:2px solid #9fc0ff;outline-offset:1px}
  #sizeR{width:140px;accent-color:#7fa4ff}
  #sizeV{color:#cdd8f5;font-size:12px;width:2.6em}
  .hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);color:#7d90bf;font-size:12px;
        letter-spacing:.1em;text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap}
  #toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);color:#ffe9c0;font-size:21px;
         letter-spacing:.42em;text-shadow:0 0 18px rgba(255,170,80,.6),0 2px 8px rgba(0,0,0,.7);
         opacity:0;pointer-events:none;white-space:nowrap}
  #toast.on{animation:toast 3s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}15%{opacity:1;transform:translate(-50%,0)}
                   72%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
  .clickfx{position:fixed;z-index:30;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    border:2px solid rgba(255,232,180,.95);box-shadow:0 0 14px rgba(255,200,110,.85),inset 0 0 8px rgba(255,210,130,.7);
    pointer-events:none;animation:clickfx .7s ease-out forwards}
  @keyframes clickfx{0%{transform:scale(.35);opacity:1}60%{opacity:.9}100%{transform:scale(3.4);opacity:0}}
  #start{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:rgba(2,4,12,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    cursor:pointer;pointer-events:auto;transition:opacity .6s;text-align:center}
  #start.off{opacity:0;pointer-events:none}
  #start h2{margin:0;color:#ffe9c0;font-size:34px;letter-spacing:.18em;
    text-shadow:0 0 30px rgba(255,170,70,.55),0 2px 10px rgba(0,0,0,.7)}
  #start .go{color:#fff;font-size:16px;letter-spacing:.35em;padding:13px 30px;border-radius:999px;
    border:1px solid rgba(255,210,140,.55);background:rgba(30,26,18,.5);
    box-shadow:0 0 24px rgba(255,180,80,.35);animation:pulse 1.8s ease-in-out infinite}
  #start em{color:#7d90bf;font-size:12px;letter-spacing:.25em;font-style:normal}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 24px rgba(255,180,80,.35)}
                   50%{transform:scale(1.06);box-shadow:0 0 40px rgba(255,180,80,.6)}}
  @media (max-width:640px){ .hint{display:none} .title h1{font-size:17px} #count{font-size:11px} }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="start">
  <h2>🎆 夜空烟火大会</h2>
  <div class="go">🎇 点击开启烟火大会</div>
  <em>声音与烟花同步绽放 · 拖动环绕视角 · 滚轮缩放</em>
</div>
<div id="ui">
  <div class="title"><h1>🎆 夜空烟火大会</h1><p>HANABI&nbsp;NIGHT&nbsp;·&nbsp;3D&nbsp;SCENE</p></div>
  <div id="count">已燃放 0 发</div>
  <div class="hint">点击燃放 · 拖动环绕 · 滚轮缩放 · R 复位视角 · 空格随机 · 数字键换花型 · X 即爆 · H 特效 · U 观赏 · F 终极</div>
  <div class="panel" id="panel">
    <div class="row"><span class="lab">花型</span><div class="opts" id="typeOpts"></div></div>
    <div class="row"><span class="lab">配色</span><div class="opts" id="palOpts"></div></div>
    <div class="row"><span class="lab">大小</span><input type="range" id="sizeR" min="60" max="200" value="110"><span id="sizeV">1.1</span></div>
  </div>
  <div class="bar">
    <button id="btnAuto">自动燃放：开</button>
    <button id="btnSound">音效：开</button>
    <button id="btnFx">✨ 震撼特效：开</button>
    <button id="btnView">⦿ 视角复位</button>
    <button id="btnInstant">⚡ 即爆：关</button>
    <button id="btnShot">📸 拍照</button>
    <button id="btnShow">🎬 烟火晚会</button>
    <button id="btnFinale" class="finale">✨ 终极烟花秀</button>
  </div>
  <div id="toast"></div>
  <button id="btnHide" title="观赏模式 (U)">🎬 观赏模式</button>
</div>
<script src="three.min.js"></script>
<script>
if (!window.THREE) {
  // 本地 three.min.js 缺失时尝试在线加载
  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
}
</script>
<script src="examples/js/shaders/CopyShader.js"></script>
<script src="examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="examples/js/postprocessing/EffectComposer.js"></script>
<script src="examples/js/postprocessing/RenderPass.js"></script>
<script src="examples/js/postprocessing/ShaderPass.js"></script>
<script src="examples/js/postprocessing/MaskPass.js"></script>
<script src="examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8fa3d0;font-size:14px">Three.js 加载失败：请将 three.min.js 放在本页面同目录，或联网后刷新。</div>');
  return;
}
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick  = arr => arr[(Math.random() * arr.length) | 0];
window.addEventListener('error', e => { window.__err = String(e.message || e); });

/* ---------- 基本参数 ---------- */
const isMobile = Math.min(innerWidth, innerHeight) < 700;
let MAXP = isMobile ? 3600 : 12000;
let S = clamp(innerHeight / 900, 0.7, 1.5);
const GP = 110 * S, GR = 360 * S;
let W = innerWidth, H = innerHeight;

/* ---------- 静音/特效启动参数：?mute 关音效，?nofx 关震撼特效 ---------- */
const urlQ = new URLSearchParams(location.search);
let soundOn = !(urlQ.has('mute') || urlQ.has('silent') || urlQ.get('sound') === '0');
let fxOn = urlQ.get('fx') === '1';   // 默认关闭震撼特效，?fx=1 可开启
let started = urlQ.has('mute');      // 浏览器要求用户交互后才能出声：点开场页解锁，?mute 静音测试则直接开场

/* ---------- 音效（WebAudio 合成 + 立体声定位） ---------- */
let AC = null, master = null, noiseBuf = null;
const thr = {};
function throttled(key, n, ms) {
  const now = performance.now();
  if (!thr[key] || now - thr[key].t > ms) thr[key] = { t: now, c: 0 };
  return ++thr[key].c > n;
}
function ensureAudio() {
  try {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 6;
      master = AC.createGain(); master.gain.value = 0.85;
      master.connect(comp); comp.connect(AC.destination);
      const len = AC.sampleRate * 1.5;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function makePan(pan) {
  if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); return p; }
  return AC.createGain();
}
function playBoom(sz, pan) {
  if (!soundOn || !AC || AC.state !== 'running' || throttled('boom', 8, 500)) return;
  const t0 = AC.currentTime, v = Math.min(1.4, sz);
  const pn = makePan(pan); pn.connect(master);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(600 + 500 * v, t0);
  f.frequency.exponentialRampToValueAtTime(50, t0 + 1.0);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, t0);
  g.gain.exponentialRampToValueAtTime(0.42 + 0.34 * v, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
  s.connect(f); f.connect(g); g.connect(pn);
  s.start(t0); s.stop(t0 + 1.15);
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(95 + 40 * v, t0);
  o.frequency.exponentialRampToValueAtTime(34, t0 + 0.55);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.5 * v, t0);
  og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
  o.connect(og); og.connect(pn);
  o.start(t0); o.stop(t0 + 0.6);
}
function playWhoosh(pan) {
  if (!soundOn || !AC || AC.state !== 'running' || throttled('whoosh', 6, 600)) return;
  const t0 = AC.currentTime;
  const pn = makePan(pan); pn.connect(master);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.2;
  f.frequency.setValueAtTime(240, t0);
  f.frequency.exponentialRampToValueAtTime(1500, t0 + 0.6);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, t0);
  g.gain.linearRampToValueAtTime(0.05, t0 + 0.12);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.65);
  s.connect(f); f.connect(g); g.connect(pn);
  s.start(t0); s.stop(t0 + 0.7);
}
function playCrackle(delay, pan) {
  if (!soundOn || !AC || AC.state !== 'running' || throttled('crackle', 4, 600)) return;
  const t0 = AC.currentTime + (delay || 0);
  const pn = makePan(pan); pn.connect(master);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600;
  const g = AC.createGain(); g.gain.setValueAtTime(0, t0);
  for (let i = 0; i < 7; i++) {
    const tt = t0 + i * 0.055 + rand(0, 0.03);
    g.gain.linearRampToValueAtTime(rand(0.04, 0.13), tt);
    g.gain.linearRampToValueAtTime(0.005, tt + 0.03);
  }
  s.connect(f); f.connect(g); g.connect(pn);
  s.start(t0); s.stop(t0 + 0.5);
}

/* ================= Three.js 场景 ================= */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(W, H);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x101b34, 0.00042);
{
  // 场景内置渐变夜空（泛光后期需要不透明背景）
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#020309'); gr.addColorStop(0.45, '#071022');
  gr.addColorStop(0.78, '#0d1830'); gr.addColorStop(1, '#17233f');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  scene.background = new THREE.CanvasTexture(c);
}
const camera = new THREE.PerspectiveCamera(55, W / H, 1, 12000);

/* ---------- 泛光后期（UnrealBloom，缺失模块时自动降级直渲） ---------- */
let composer = null;
if (THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass && THREE.UnrealBloomPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 1.05, 0.55, 0.16));
}
window.__fwDebug = { get bloom() { return !!composer; }, get fx() { return fxOn; }, get particles() { return particles.length; }, get camY() { return Math.round(camera.position.y); }, get started() { return started; }, get audio() { return AC ? AC.state : 'none'; } };

function radialTex(stops, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (const [o, col] of stops) rg.addColorStop(o, col);
  g.fillStyle = rg; g.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}
const texGlow   = radialTex([[0,'rgba(255,255,255,1)'],[0.3,'rgba(255,220,160,0.55)'],[1,'rgba(255,180,80,0)']]);
const texFlash  = radialTex([[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,240,210,0.7)'],[1,'rgba(255,220,180,0)']]);
const texSmoke  = radialTex([[0,'rgba(172,168,164,0.5)'],[0.25,'rgba(158,155,152,0.28)'],[0.55,'rgba(148,146,146,0.1)'],[1,'rgba(140,140,142,0)']]);
const texDot    = radialTex([[0,'rgba(255,255,255,1)'],[1,'rgba(255,255,255,0)']], 64);
const texRing   = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,240,210,0.9)'; g.lineWidth = 6;
  g.shadowColor = 'rgba(255,220,160,0.9)'; g.shadowBlur = 12;
  g.beginPath(); g.arc(64, 64, 50, 0, TAU); g.stroke();
  return new THREE.CanvasTexture(c);
})();

/* ---------- 星空穹顶（闪烁） ---------- */
const STAR_N = isMobile ? 500 : 900;
{
  const pos = new Float32Array(STAR_N * 3), col = new Float32Array(STAR_N * 3);
  const siz = new Float32Array(STAR_N), ph = new Float32Array(STAR_N);
  for (let i = 0; i < STAR_N; i++) {
    // 上半球均匀采样，半径 4200
    const u = Math.random(), a = rand(0, TAU), r = 4200;
    const el = Math.asin(0.03 + 0.97 * u); // 稍微压低地平线附近的星星
    pos[i*3]   = r * Math.cos(el) * Math.cos(a);
    pos[i*3+1] = r * Math.sin(el) - 260;
    pos[i*3+2] = r * Math.cos(el) * Math.sin(a);
    const c = Math.random();
    const warm = c < 0.15, cool = c > 0.85;
    col[i*3] = warm ? 1 : cool ? 0.75 : 0.9;
    col[i*3+1] = warm ? 0.88 : cool ? 0.83 : 0.91;
    col[i*3+2] = warm ? 0.72 : cool ? 1 : 1;
    siz[i] = rand(1.2, 3.4) * (Math.random() < 0.06 ? 2 : 1);
    ph[i] = rand(0, TAU);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float aSize; attribute float aPhase; attribute vec3 aColor;
      uniform float uTime; varying vec3 vColor; varying float vA;
      void main(){
        vColor = aColor;
        vA = 0.5 + 0.5 * sin(uTime * (0.5 + fract(aPhase) * 1.3) + aPhase * 9.0);
        gl_PointSize = aSize;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vA;
      void main(){
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = pow(max(0.0, 1.0 - d), 2.0) * (0.35 + 0.65 * vA);
        gl_FragColor = vec4(vColor, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const stars = new THREE.Points(geo, mat);
  stars.frustumCulled = false;
  scene.add(stars);
  scene.userData.starMat = mat;
}

/* ---------- 月亮 + 光晕 ---------- */
const moonGroup = new THREE.Group();
{
  const moonTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#f3efdd'; g.beginPath(); g.arc(128, 128, 120, 0, TAU); g.fill();
    g.fillStyle = 'rgba(170,160,140,0.4)';
    for (const [x, y, r] of [[95, 90, 26], [160, 150, 18], [120, 170, 14], [170, 90, 11]]) {
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    return new THREE.CanvasTexture(c);
  })();
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, fog: false, depthWrite: false }));
  moon.scale.set(240, 240, 1);
  moon.position.set(1500, 1150, -3400);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texGlow, color: 0xfff4d6, transparent: true, opacity: 0.2, fog: false, depthWrite: false,
    blending: THREE.AdditiveBlending }));
  glow.scale.set(1300, 1300, 1);
  glow.position.copy(moon.position);
  moonGroup.add(moon, glow);
  scene.add(moonGroup);
}

/* ---------- 海面 ---------- */
{
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(9000, 5200),
    new THREE.MeshBasicMaterial({ color: 0x081124 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, 0, -900);
  scene.add(water);
  // 月光水路

function hslRgb(h, s, l, out, o) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
  out[o] = r + m; out[o + 1] = g + m; out[o + 2] = b + m;
}

function P(o) {

}
function planeBasis() {
  const n = randDir3();

  if (ul < 0.001) { u = { x: 1, y: 0, z: 0 }; ul = 1; }
  u = { x: u.x / ul, y: u.y / ul, z: u.z / ul };
  const v = { x: n.y * u.z - n.z * u.y, y: n.z * u.x - n.x * u.z, z: n.x * u.y - n.y * u.x };
  return { u, v };
}

/* ---------- 主循环 ---------- */
let t = 0, last = performance.now(), nextLaunch = 0.6, finaleEnd = 0;
let perfAcc = 0, perfN = 0, perfCheck = 0;
const projV = new THREE.Vector3();

function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = (now - last) / 1000;
  const dt = Math.min(0.033, rawDt);
  last = now;
  if (dt <= 0) return;
  t += dt;
  const wind = (Math.sin(t * 0.22) * 15 + Math.sin(t * 0.07 + 3) * 11) * S;

  // 相机：惯性 + 闲置缓慢环绕
  if (!dragCam) {
    ORBIT.yaw = clamp(ORBIT.yaw + velYaw * dt, -1.15, 1.15);
    velYaw *= Math.exp(-dt * 3);
    if (t - lastInteract > 6) ORBIT.yaw += dt * 0.014;
  }
  applyCamera();
  // 大爆炸镜头震动（叠加在轨道相机之上，每帧从基准位重算，不漂移）
  if (fxOn && shakeAmp > 0.002) {
    const s = shakeAmp * 6.5 * S;
    camera.position.x += (Math.sin(t * 43.7) * 0.6 + Math.sin(t * 29.3) * 0.4) * s;
    camera.position.y += Math.cos(t * 37.1) * s * 0.5;
    camera.position.z += Math.sin(t * 31.9) * s * 0.35;
    shakeAmp *= Math.exp(-dt * 4.5);
  }

  // 调度：开场页点击前保持安静；晚会期间只按节目单燃放
  if (started) {
    for (let i = queue.length - 1; i >= 0; i--) {
      if (queue[i].t <= t) { const q = queue[i]; queue.splice(i, 1); launch(q); }
    }
    const inShow = t < showEnd;
    if (!inShow && (autoOn || t < finaleEnd) && t >= nextLaunch) {
      if (t < finaleEnd) { launchRandom(); if (Math.random() < 0.35) launchRandom(); nextLaunch = t + rand(0.1, 0.22); }
      else {
        const r = Math.random();
        if (r < 0.3) { launchRandom(); queue.push({ t: t + 0.15 }, { t: t + 0.3 }); }
        else if (r < 0.42) launch({ size: rand(1.5, 1.9) });
        else launchRandom();
        nextLaunch = t + rand(0.24, 0.7);
      }
    }
    if (held && heldPos && t >= heldNext) {
      fireAt(heldPos.x, heldPos.y);
      heldNext = t + 0.16;
    }
  }
  for (let i = toastQ.length - 1; i >= 0; i--) {
    if (toastQ[i].t <= t) { showToast(toastQ[i].text); toastQ.splice(i, 1); }
  }

  // 火箭
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.vy -= GR * dt;
    r.vx *= Math.exp(-0.3 * dt); r.vz *= Math.exp(-0.3 * dt);
    r.x += (r.vx + Math.sin(t * 7 + r.sway) * 10 * S) * dt;
    r.y += r.vy * dt; r.z += r.vz * dt;
    for (let k = 0; k < 3; k++) {
      P({ x: r.x + rand(-2, 2), y: r.y + rand(-2, 2), z: r.z + rand(-2, 2),
          vx: rand(-16, 16) * S, vy: rand(-55, -8) * S, vz: rand(-10, 10) * S,
          life: rand(0.25, 0.55), drag: 1.5, g: GP * 0.6, hue: 38 + rand(0, 10), sat: 90, lig: 65, w: 1.3 });
    }
    if (r.sprite) {
      r.sprite.sp.position.set(r.x, r.y, r.z);
      r.sprite.sp.scale.set(11, 11, 1);
      r.sprite.sp.material.opacity = 0.85;
    }
    if (r.y >= r.ty || r.vy < 40 * S || t - r.born > 4.5) {
      burst(r.x, r.y, r.z, r.type, r.size, r.pal);
      playBoom(r.size, worldPan(r.x, r.z));
      if (r.sprite) { r.sprite.live = false; r.sprite.sp.visible = false; }
      rockets.splice(i, 1);
    }
  }

  // 粒子物理
  const fExp = dt;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const f = Math.exp(-p.drag * fExp);
    p.vx = p.vx * f + wind * p.windW * fExp;
    p.vy = p.vy * f - p.g * fExp;
    p.vz = p.vz * f;
    p.x += p.vx * fExp; p.y += p.vy * fExp; p.z += p.vz * fExp;
    p.age += fExp;
    if (p.kind === 2 && p.age < p.life * 0.75) {
      p.dropT -= fExp;
      if (p.dropT <= 0) {
        p.dropT = 0.05;
        P({ x: p.x, y: p.y, z: p.z, vx: p.vx * 0.12 + rand(-13, 13), vy: p.vy * 0.1 - rand(0, 26),
            vz: p.vz * 0.12 + rand(-7, 7), life: rand(0.4, 0.8), drag: 0.6, g: GP * 1.5,
            hue: 42 + rand(0, 10), sat: 90, lig: 55, w: 1.2 });
      }
    }
    if (p.splitAt && !p.splitDone && p.age >= p.splitAt) {
      p.splitDone = true; splitCrossette(p); particles.splice(i, 1); continue;
    }
    if (p.age >= p.life) {
      if (p.kind === 4) miniPop(p);
      particles.splice(i, 1);
    }
  }

  // 写入 GPU 缓冲
  let n = 0;
  for (let i = 0; i < particles.length && n < MAXP; i++, n++) {
    const p = particles[i], k = p.age / p.life;
    bufPos[n*3] = p.x; bufPos[n*3+1] = p.y; bufPos[n*3+2] = p.z;
    let a = Math.pow(1 - k, 1.35);
    let lig = p.lig + (k < 0.12 ? (0.12 - k) * 120 : 0);
    if (p.kind === 3) a *= Math.sin(p.age * p.fQ * TAU + p.ph) > -0.15 ? 1 : 0.05;
    if (p.kind === 4 && k > 0.45) a *= Math.random() < 0.55 ? 1 : 0.08;
    bufAlpha[n] = clamp(a, 0, 1);
    bufSize[n] = p.w * 2.1 * S;
    hslRgb(p.hue2 == null ? p.hue : p.hue + (p.hue2 - p.hue) * k, p.sat, Math.min(100, lig), bufCol, n * 3);
    // 拖尾：头在粒子处，尾沿速度反向回拉
    const tk = p.kind === 1 ? 0.085 : p.kind === 2 ? 0.07 : p.kind === 3 ? 0.03 : 0.055;
    trPos[n*6]   = p.x; trPos[n*6+1] = p.y; trPos[n*6+2] = p.z;
    trPos[n*6+3] = p.x - p.vx * tk; trPos[n*6+4] = p.y - p.vy * tk; trPos[n*6+5] = p.z - p.vz * tk;
    trCol[n*6]   = bufCol[n*3];   trCol[n*6+1] = bufCol[n*3+1]; trCol[n*6+2] = bufCol[n*3+2];
    trCol[n*6+3] = bufCol[n*3] * 0.35; trCol[n*6+4] = bufCol[n*3+1] * 0.35; trCol[n*6+5] = bufCol[n*3+2] * 0.35;
    trA[n*2] = clamp(a, 0, 1); trA[n*2+1] = clamp(a, 0, 1) * 0.3;
  }
  fwGeo.setDrawRange(0, n);
  fwGeo.attributes.position.needsUpdate = true;
  fwGeo.attributes.aColor.needsUpdate = true;
  fwGeo.attributes.aSize.needsUpdate = true;
  fwGeo.attributes.aAlpha.needsUpdate = true;
  trGeo.setDrawRange(0, n * 2);
  trGeo.attributes.position.needsUpdate = true;
  trGeo.attributes.aColor.needsUpdate = true;
  trGeo.attributes.aAlpha.needsUpdate = true;

  // 闪光
  for (let i = flashes.length - 1; i >= 0; i--) {
    const fl = flashes[i];
    fl.age += dt;
    const k = fl.age / fl.life;
    if (fl.sprite) {
      const kk = Math.min(1, k);
      fl.sprite.sp.position.set(fl.x, fl.y, fl.z);
      const rr = fl.r * (0.45 + 0.55 * kk);
      fl.sprite.sp.scale.set(rr, rr, 1);
      fl.sprite.sp.material.opacity = Math.pow(1 - kk, 2) * 0.42;
      if (k >= 1) { fl.sprite.live = false; fl.sprite.sp.visible = false; }
    }
    if (fl.age >= fl.life) flashes.splice(i, 1);
  }
  // 烟雾
  for (let i = smokes.length - 1; i >= 0; i--) {
    const s = smokes[i];
    s.age += dt;
    if (s.age >= s.life || !s.it.live) {
      if (s.it.live) { s.it.live = false; s.it.sp.visible = false; }
      smokes.splice(i, 1); continue;
    }
    s.vx += wind * 0.004 * dt * 60;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    const k = s.age / s.life, r = s.size * (1 + k * 1.8) * 2;
    s.it.sp.position.set(s.x, s.y, s.z);
    s.it.sp.scale.set(r, r, 1);
    s.it.sp.material.opacity = 0.16 * Math.min(1, k / 0.18) * (1 - (k - 0.18) / 0.82);
  }
  // 冲击波环
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.age += dt;
    const k = r.age / r.life;
    if (k >= 1 || !r.it.live) {
      if (r.it.live) { r.it.live = false; r.it.sp.visible = false; }
      rings.splice(i, 1); continue;
    }
    const rr = r.r0 * (0.5 + 2.6 * k);
    r.it.sp.position.set(r.x, r.y, r.z);
    r.it.sp.scale.set(rr, rr, 1);
    r.it.sp.material.opacity = (1 - k) * 0.55;
  }

  // 城市照亮 + 各着色器时间
  cityGlow *= Math.exp(-dt * 3);
  for (const row of cityRows) {
    row.mat.color.copy(row.base).lerp(row.lit, Math.min(1, cityGlow) * 0.55);
    row.winMat.uniforms.uTime.value = t;
  }
  scene.userData.starMat.uniforms.uTime.value = t;
  fwMat.uniforms.uTime.value = t; refMat.uniforms.uTime.value = t;
  trMat.uniforms.uTime.value = t; trMatR.uniforms.uTime.value = t;
  scene.userData.cityGlowSprite.material.opacity = 0.08 + Math.min(0.1, cityGlow * 0.1);
  scene.userData.glade.material.opacity = 0.08 + 0.03 * Math.sin(t * 1.3);

  // 自适应性能
  perfAcc += rawDt; perfN++;
  if (t - perfCheck > 2) {
    if (perfN > 10 && perfAcc / perfN > 0.024) {
      MAXP = Math.max(1400, Math.round(MAXP * 0.78));
      if (renderer.getPixelRatio() > 1) renderer.setPixelRatio(1);
    }
    perfAcc = 0; perfN = 0; perfCheck = t;
  }

  if (fxOn && composer) composer.render(); else renderer.render(scene, camera);

  if (shotPending) { // 紧跟渲染之后截取，避免缓冲被清除
    shotPending = false;
    try { takeShot(); } catch (e) { window.__err = 'shot: ' + e.message; }
  }
}

/* ---------- 尺寸 ---------- */
function resize() {
  W = innerWidth; H = innerHeight;
  S = clamp(H / 900, 0.7, 1.5);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  if (composer) composer.setSize(W, H);
  const uScale = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  fwMat.uniforms.uScale.value = uScale;
  refMat.uniforms.uScale.value = uScale;
}
window.addEventListener('resize', () => { clearTimeout(window.__rs); window.__rs = setTimeout(resize, 120); });
resize();

/* ---------- 启动 ---------- */
if (started) queue.push({ t: 0.25, size: 1.3 }, { t: 0.55 }, { t: 0.9, size: 1.5 });
applyCamera();
requestAnimationFrame(now => { last = now; requestAnimationFrame(frame); });
})();
</script>
