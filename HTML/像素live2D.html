<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
  像素 Live2D · 小鲸（whalegirl）—— 单文件版本
  全部资源（调色板、像素引擎、自编点阵字体、角色美术、房间背景、
  音乐与音效）均由本文件内的原生 JavaScript/Canvas/WebAudio 生成，
  不含任何外部文件、第三方库或网络请求，双击即可离线运行。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素 Live2D · 小鲸 whalegirl</title>
<style>
/* ============================================================================
 * style.css  —  页面外壳样式
 * 颜色一律使用 app.js 从 palette.js 注入的 CSS 变量，不出现硬编码色值。
 * ==========================================================================*/
* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--ink);
  overflow: hidden;
}

#app {
  display: flex; height: 100vh; width: 100vw;
}

/* 主显示区：左侧 3/4 */
#stagepane {
  flex: 3 1 0;
  min-width: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background: var(--sky);
  border-right: 3px solid var(--navyMid);
  overflow: hidden;
}

#stage {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  box-shadow: 0 0 0 3px var(--navyMid), 0 0 0 6px var(--navy), 0 10px 30px rgba(0, 0, 0, .45);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}

#hint {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  padding: 6px 12px;
  background: var(--panel);
  border: 2px solid var(--line);
  color: var(--white);
  font-size: 13px;
  letter-spacing: 1px;
  pointer-events: none;
  transition: opacity .35s ease;
  image-rendering: pixelated;
}
#hint.hide { opacity: 0; }

/* 右边栏：交互 UI 区 */
#side {
  flex: 1 1 0;
  min-width: 258px;
  max-width: 360px;
  padding: 12px 12px 24px;
  background: var(--panel);
  color: var(--white);
  overflow-y: auto;
  overflow-x: hidden;
}

.title { margin: 2px 0 2px; }
.subtitle { margin-bottom: 7px; opacity: .85; }

.status {
  border: 2px solid var(--line);
  background: var(--navyMid);
  padding: 5px 7px;
  margin-bottom: 9px;
}
.statusrow { line-height: 1.5; }

.sec { margin-bottom: 10px; }
.sechead {
  border-bottom: 2px solid var(--line);
  margin-bottom: 6px;
  padding-bottom: 2px;
}

.grid { display: grid; gap: 5px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }

.pxbtn {
  display: flex; align-items: center; justify-content: center;
  padding: 3px 2px;
  background: var(--navy);
  border: 0;
  border-top: 2px solid var(--navyHi);
  border-left: 2px solid var(--navyHi);
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  cursor: pointer;
  transition: background .08s linear;
}
.pxbtn:hover { background: var(--navyHi); }
.pxbtn:active {
  border-top-color: var(--ink);
  border-left-color: var(--ink);
  border-right-color: var(--navyHi);
  border-bottom-color: var(--navyHi);
}
.pxbtn.on { background: var(--gold); }
.pxbtn.on:hover { background: var(--gold); }
.pxbtn.on .pxlabel { filter: none; }
.pxbtn.off { background: var(--purpleDk); opacity: .85; }
.pxbtn.off::after { content: ''; }

.pxlabel {
  image-rendering: pixelated;
  display: block;
  pointer-events: none;
}

.tip { margin-top: 4px; opacity: .7; }

/* 窄屏时改为上下布局 */
@media (max-width: 860px) {
  #app { flex-direction: column; }
  #stagepane { flex: 1 1 auto; border-right: 0; border-bottom: 3px solid var(--navyMid); }
  #side { max-width: none; min-width: 0; flex: 0 0 auto; max-height: 46vh; }
}
  </style>
</head>
<body>
  <div id="app">
    <section id="stagepane">
      <canvas id="stage" width="336" height="288"></canvas>
      <div id="hint">点击画面开启声音</div>
    </section>
    <aside id="side"></aside>
  </div>

  <!-- 引擎：调色板 -> 像素图元 -> 字体 -> 美术 -> 系统 -->
  <script>
/* ===================== palette.js ===================== */
/* ============================================================================
 * palette.js  —  受限调色板（集中管理，唯一色值来源）
 * ----------------------------------------------------------------------------
 * 全工程所有像素只允许使用本表索引。禁止在绘制代码中出现硬编码色值。
 * 约定：索引 0 为“透明/空”，任何绘制函数遇到 0 都视为不写盘。
 * ==========================================================================*/
(function (global) {
  'use strict';
  var PIX = global.PIX || (global.PIX = {});

  // 名称 -> 色值。顺序即索引。相近功能色聚在一起便于维护。
  var DEFS = [
    ['VOID',       '#10121f'], // 0  透明/空 标记（同时作为底色兜底）
    ['OUTLINE',    '#141a33'], // 1  通用深色描边
    ['HAIR_LINE',  '#1b2560'], // 2  头发描边
    ['HAIR_HI',    '#a8c4ff'], // 3  发丝高光
    ['HAIR_LIT',   '#7c9cf0'], // 4  发丝亮部
    ['HAIR',       '#5578e0'], // 5  头发基色
    ['HAIR_MID',   '#3a55bb'], // 6  头发中调
    ['HAIR_DARK',  '#2a3d92'], // 7  头发暗部
    ['HAIR_DEEP',  '#1d2b6b'], // 8  头发最深
    ['SKIN_HI',    '#fff0e6'], // 9  皮肤高光
    ['SKIN',       '#ffe0d0'], // 10 皮肤基色
    ['SKIN_SHD',   '#f3c3ae'], // 11 皮肤暗部
    ['SKIN_LINE',  '#d19484'], // 12 皮肤描边
    ['WHITE_HI',   '#ffffff'], // 13 纯白
    ['WHITE',      '#f6f7ff'], // 14 蕾丝白
    ['WHITE_SHD',  '#dde2f7'], // 15 白色暗部
    ['WHITE_MID',  '#c2c9ea'], // 16 白色中间调
    ['WHITE_DEEP', '#9aa2cf'], // 17 白色深调
    ['NAVY_HI',    '#4a5fbf'], // 18 藏青亮部
    ['NAVY',       '#303f95'], // 19 藏青基色
    ['NAVY_MID',   '#232f74'], // 20 藏青中调
    ['NAVY_DARK',  '#182154'], // 21 藏青暗部
    ['NAVY_DEEP',  '#10163a'], // 22 藏青最深
    ['GOLD_HI',    '#ffeeb0'], // 23 金饰高光
    ['GOLD',       '#f0c258'], // 24 金饰基色
    ['GOLD_DARK',  '#b07f26'], // 25 金饰暗部
    ['WHALE_HI',   '#9fe4f7'], // 26 鲸鱼亮部
    ['WHALE',      '#4fb3e0'], // 27 鲸鱼基色
    ['WHALE_DARK', '#2a72ad'], // 28 鲸鱼暗部
    ['EYE_HI',     '#d8f0ff'], // 29 眼高光
    ['EYE_IRIS',   '#4f8fe0'], // 30 虹膜
    ['EYE_DEEP',   '#2456a8'], // 31 虹膜深
    ['EYE_PUPIL',  '#16224d'], // 32 瞳孔
    ['BLUSH',      '#ffb3b3'], // 33 腮红
    ['BLUSH_SHD',  '#ef8f95'], // 34 腮红暗
    ['MOUTH',      '#b8566a'], // 35 口腔
    ['MOUTH_DK',   '#7d3446'], // 36 口腔深
    ['SHOE_HI',    '#3a4aa0'], // 37 鞋亮部
    ['SHOE',       '#26307c'], // 38 鞋基色
    ['SHOE_DARK',  '#161d4e'], // 39 鞋暗部
    ['ROOM_WALL',  '#cfd8f5'], // 40 墙面上
    ['ROOM_WALL2', '#b9c4ee'], // 41 墙面下
    ['ROOM_FLOOR', '#8f9ede'], // 42 地板上
    ['ROOM_FLOOR2','#7b8bd0'], // 43 地板下
    ['ROOM_WOOD',  '#c9b6e6'], // 44 木质/家具浅紫
    ['PURPLE',     '#8f7ad6'], // 45 紫色主调
    ['PURPLE_DK',  '#6a54b8'], // 46 紫色暗
    ['LAMP_GLOW',  '#ffe9a8'], // 47 灯光
    ['GLASS',      '#addcff'], // 48 玻璃/水
    ['GLASS_DK',   '#6fb2e8'], // 49 玻璃深
    ['CURTAIN',    '#eef1ff'], // 50 窗帘亮
    ['CURTAIN_SHD','#c9d1f0'], // 51 窗帘暗
    ['SHADOW',     '#b7c0e8'], // 52 投影
    ['SKY',        '#2a3f8f'], // 53 夜空
    ['SKY_DEEP',   '#1b2a63'], // 54 夜空深
    ['POT',        '#c98f6a'], // 55 花盆
    ['PLANT',      '#6bbf8a'], // 56 植物亮
    ['PLANT_DK',   '#3f8f66'], // 57 植物暗
    ['METAL',      '#c8cee8'], // 58 金属亮
    ['METAL_DK',   '#8e96c4'], // 59 金属暗
    ['TEAR',       '#9fd8ff'], // 60 泪滴
    ['SWEAT',      '#bfe8ff'], // 61 汗滴
    ['UI_PANEL',   '#1b2450'], // 62 面板底
    ['UI_LINE',    '#7f8fd8']  // 63 面板描边
  ];

  var PAL = {}, HEX = [], i;
  for (i = 0; i < DEFS.length; i++) { PAL[DEFS[i][0]] = i; HEX.push(DEFS[i][1]); }

  // ImageData 视图用：小端序 0xAABBGGRR
  var ABGR = new Uint32Array(HEX.length);
  for (i = 0; i < HEX.length; i++) {
    var h = HEX[i];
    var r = parseInt(h.substr(1, 2), 16), g = parseInt(h.substr(3, 2), 16), b = parseInt(h.substr(5, 2), 16);
    ABGR[i] = (255 << 24) | (b << 16) | (g << 8) | r;
  }

  PIX.PAL = PAL;          // 名称 -> 索引
  PIX.HEX = HEX;          // 索引 -> '#rrggbb'
  PIX.ABGR = ABGR;        // 索引 -> ImageData 32bit
  PIX.ABGR32 = ABGR;      // 引擎内部别名
  PIX.PALETTE_DEFS = DEFS;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
/* ===================== pixel.js ===================== */
/* ============================================================================
 * pixel.js  —  索引化像素绘图引擎
 * ----------------------------------------------------------------------------
 * 设计决策：
 *  1) 所有美术资源与合成缓冲都是 Uint8Array 索引位图（0 = 透明），
 *     绘制过程完全不经过浮点颜色混合，从根本上杜绝抗锯齿 / 半像素。
 *  2) 只有在最后输出到屏幕时，才通过调色板 LUT 一次性转成 RGBA。
 *  3) 旋转 / 缩放一律用“逆向映射 + 最近邻取样”，取样点为像素中心。
 *  4) 透明度用 4x4 有序抖动（Bayer）实现，保持调色板纯色不变。
 * ==========================================================================*/
(function (global) {
  'use strict';
  var PIX = global.PIX || (global.PIX = {});

  var Bayer4 = new Uint8Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]);
  PIX.Bayer4 = Bayer4;

  /* ------------------------------ Bitmap ------------------------------ */
  function Bitmap(w, h) {
    this.w = w; this.h = h;
    this.d = new Uint8Array(w * h);
    this._bb = null;             // 惰性计算的紧包围盒
  }
  Bitmap.prototype.dirty = function () { this._bb = null; return this; };
  Bitmap.prototype.get = function (x, y) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
    return this.d[y * this.w + x];
  };
  Bitmap.prototype.set = function (x, y, c) {
    x |= 0; y |= 0;
    if (!c || x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    this.d[y * this.w + x] = c;
  };
  Bitmap.prototype.clone = function () {
    var b = new Bitmap(this.w, this.h);
    b.d.set(this.d);
    return b;
  };
  Bitmap.prototype.clear = function () { this.d.fill(0); this._bb = null; return this; };
  Bitmap.prototype.fill = function (c) { this.d.fill(c); this._bb = null; return this; };

  /** 不透明像素的紧包围盒；空图返回 null。所有 blit 都靠它跳过空白区域。 */
  function bbox(bm) {
    if (bm._bb !== null) return bm._bb;
    var d = bm.d, w = bm.w, h = bm.h, x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) {
      var row = y * w, any = false;
      for (var x = 0; x < w; x++) if (d[row + x]) { any = true; if (x < x0) x0 = x; if (x > x1) x1 = x; }
      if (any) { if (y < y0) y0 = y; y1 = y; }
    }
    bm._bb = (x1 < 0) ? null : { x0: x0, y0: y0, x1: x1, y1: y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    return bm._bb;
  }

  /* ------------------------------ 基础图元 ------------------------------ */

  function rect(bm, x, y, w, h, c) {
    if (!c) return;
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    var x0 = Math.max(0, x), y0 = Math.max(0, y);
    var x1 = Math.min(bm.w, x + w), y1 = Math.min(bm.h, y + h);
    if (x1 <= x0 || y1 <= y0) return;
    for (var yy = y0; yy < y1; yy++) {
      var row = yy * bm.w;
      for (var xx = x0; xx < x1; xx++) bm.d[row + xx] = c;
    }
    bm._bb = null;
  }

  function hline(bm, x0, x1, y, c) {
    if (x1 < x0) { var t = x0; x0 = x1; x1 = t; }
    rect(bm, x0, y, x1 - x0 + 1, 1, c);
  }
  function vline(bm, x, y0, y1, c) {
    if (y1 < y0) { var t = y0; y0 = y1; y1 = t; }
    rect(bm, x, y0, 1, y1 - y0 + 1, c);
  }

  function line(bm, x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    for (;;) {
      bm.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    bm._bb = null;
  }

  /** 实心椭圆；中心允许 .5 偏移，半径可为小数。以像素中心做判定。 */
  function ellipse(bm, cx, cy, rx, ry, c) {
    if (rx <= 0 || ry <= 0) return;
    var x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(bm.w - 1, Math.ceil(cx + rx));
    var y0 = Math.max(0, Math.floor(cy - ry)), y1 = Math.min(bm.h - 1, Math.ceil(cy + ry));
    var irx = 1 / (rx * rx), iry = 1 / (ry * ry);
    for (var y = y0; y <= y1; y++) {
      var dy = y + 0.5 - cy, dy2 = dy * dy * iry, row = y * bm.w;
      if (dy2 > 1) continue;
      for (var x = x0; x <= x1; x++) {
        var dx = x + 0.5 - cx;
        if (dx * dx * irx + dy2 <= 1) bm.d[row + x] = c;
      }
    }
    bm._bb = null;
  }

  /** 椭圆环：外椭圆减内椭圆（扫描线直接判定，无临时缓冲） */
  function ellipseRing(bm, cx, cy, rx, ry, thick, c) {
    var x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(bm.w - 1, Math.ceil(cx + rx));
    var y0 = Math.max(0, Math.floor(cy - ry)), y1 = Math.min(bm.h - 1, Math.ceil(cy + ry));
    var irx = rx - thick, iry = ry - thick;
    var orx = 1 / (rx * rx), ory = 1 / (ry * ry);
    var nrx = irx > 0 ? 1 / (irx * irx) : Infinity, nry = iry > 0 ? 1 / (iry * iry) : Infinity;
    for (var y = y0; y <= y1; y++) {
      var dy = y + 0.5 - cy, ady = dy * dy, row = y * bm.w;
      for (var x = x0; x <= x1; x++) {
        var dx = x + 0.5 - cx, adx = dx * dx;
        if (adx * orx + ady * ory <= 1 && adx * nrx + ady * nry > 1) bm.d[row + x] = c;
      }
    }
    bm._bb = null;
    return bm;
  }

  /** 把 mask 中非 0 处用颜色 c 盖到 bm 上 */
  function stampMask(bm, mask, c) {
    var bb = bbox(mask); if (!bb) return;
    for (var y = bb.y0; y <= bb.y1; y++) {
      var row = y * mask.w;
      for (var x = bb.x0; x <= bb.x1; x++) if (mask.d[row + x]) bm.set(x, y, c);
    }
  }

  /** 扫描线多边形填充（偶奇规则），pts = [[x,y],...] */
  function poly(bm, pts, c) {
    var n = pts.length; if (n < 3) return;
    var minY = Infinity, maxY = -Infinity, i;
    for (i = 0; i < n; i++) { if (pts[i][1] < minY) minY = pts[i][1]; if (pts[i][1] > maxY) maxY = pts[i][1]; }
    var y0 = Math.max(0, Math.floor(minY)), y1 = Math.min(bm.h - 1, Math.ceil(maxY));
    var xs = [];
    for (var y = y0; y <= y1; y++) {
      var yc = y + 0.5, cnt = 0;
      for (i = 0; i < n; i++) {
        var a = pts[i], b = pts[(i + 1) % n];
        var ay = a[1], by = b[1];
        if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) {
          xs[cnt++] = a[0] + (yc - ay) / (by - ay) * (b[0] - a[0]);
        }
      }
      xs.length = cnt;
      xs.sort(function (p, q) { return p - q; });
      for (i = 0; i + 1 < cnt; i += 2) {
        var sx = Math.round(xs[i]), ex = Math.round(xs[i + 1]) - 1;
        if (ex < sx) ex = sx;
        hline(bm, sx, ex, y, c);
      }
    }
    bm._bb = null;
  }

  /** 胶囊（粗线段），用于肢体 */
  function capsule(bm, x0, y0, x1, y1, r, c) {
    var steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      ellipse(bm, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, r, c);
    }
  }

  /** 水平镜像（生成左右对称部件） */
  function mirrorX(src) {
    var out = new Bitmap(src.w, src.h);
    for (var y = 0; y < src.h; y++) {
      var row = y * src.w;
      for (var x = 0; x < src.w; x++) out.d[row + (src.w - 1 - x)] = src.d[row + x];
    }
    return out;
  }

  /** 给所有不透明像素的外缘补一圈描边（4 邻域），不改变原色块 */
  function outlineSilhouette(bm, c) {
    var src = bm.d.slice(), w = bm.w, h = bm.h;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (src[y * w + x]) continue;
        if ((x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) ||
            (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x])) {
          bm.d[y * w + x] = c;
        }
      }
    }
    bm._bb = null;
    return bm;
  }

  /* ------------------------------ 合成 / 变换 ------------------------------ */

  /**
   * 把 src 画进 dst。
   * 变换：dst = T(x,y) · R(angle) · S(scaleX,scaleY) · T(-anchorX,-anchorY)
   * 即 src 上 (anchorX,anchorY) 这一点会落在 dst 的 (x,y) 上。
   * 最近邻取样 + 像素中心，硬边；alpha<1 时用 Bayer 抖动做溶解。
   */
  function draw(dst, src, o) {
    o = o || {};
    var dx = o.x || 0, dy = o.y || 0;
    var a = o.angle || 0;
    var sx = (o.scaleX === undefined) ? 1 : o.scaleX;
    var sy = (o.scaleY === undefined) ? 1 : o.scaleY;
    var ax = o.anchorX || 0, ay = o.anchorY || 0;
    var alpha = (o.alpha === undefined) ? 1 : o.alpha;
    if (alpha <= 0 || sx === 0 || sy === 0) return;
    var bb = o.box || bbox(src);
    if (!bb) return;
    if (bb.x1 < 0 || bb.y1 < 0 || bb.x0 >= src.w || bb.y0 >= src.h) return;
    var sd = src.d, sw = src.w, sh = src.h, dd = dst.d, dw = dst.w, dh = dst.h;

    // ---- 快速通道：无旋转无缩放（绝大多数部件每帧都走这里）----
    if (a === 0 && sx === 1 && sy === 1) {

    A.el(bm, 128, 98, 21, 16, P.SKIN);         // 面颊
    A.el(bm, 128, 106, 17, 9, P.SKIN);         // 下巴
    A.el(bm, 128, 84, 19, 15, P.SKIN_HI);      // 额头高光

 * · 被动跟随：每个柔性部件持有一条“延迟链”，链上刚度逐级递减，

    ['hipR', 137, 176, 'hip'],

      Scene.pressT = Scene.t;
      Scene.maybeDrag = on;
      Scene.dragMoved = false;
      if (on) Scene.grabDX = p.x - Scene.charX; Scene.grabDY = p.y - Scene.charY;
    },
    onUp: function (clientX, clientY) {
      var p = Scene.toLogical(clientX, clientY);
      if (Scene.dragging) {
        Scene.dragging = false;
        Scene.maybeDrag = false;
        D.react('drop');
      } else if (Scene.maybeDrag && !Scene.dragMoved) {
        if (Scene.t - Scene.pressT < 0.8) D.react('poke');
      } else if (!Scene.pressOn) {
        // 点击空白处：角色看向该处
        var gx = Math.max(-1, Math.min(1, (p.x - Scene.charX - CHAR_ANCHOR[0]) / 78));
        var gy = Math.max(-1, Math.min(1, (p.y - Scene.charY - 94) / 62));
        Scene.gaze.x = gx; Scene.gaze.y = gy;
        D.react('stage');
      }
      Scene.maybeDrag = false;
      Scene.pressOn = false;
      if (PIX.Audio) PIX.Audio.sfx('click');
    },
    onLeave: function () {
      Scene.pointer.x = -999; Scene.pointer.y = -999;
      Scene.hoverOn = false;
      if (Scene.dragging) { Scene.dragging = false; D.react('drop'); }
      Scene.gaze.x = 0; Scene.gaze.y = 0;
    },

    /* ------------------------------------------------------ 每帧更新 */
    update: function (dt) {
      Scene.t += dt;
      // 拖拽阈值
      if (Scene.maybeDrag && !Scene.dragging && Scene.pointer.x > -900) {
        var dx = Scene.pointer.x - Scene.pressAt[0], dy = Scene.pointer.y - Scene.pressAt[1];
        if (dx * dx + dy * dy > 16) {
          Scene.dragging = true;
          Scene.dragMoved = true;
          D.react('dragStart');
        }
      }

      var res = D.update(dt);
      var tgt = res.target;

      // 拖拽中的附加反应：手臂后甩 + 惊恐
      if (Scene.dragging) {
        var vk = Math.max(-1, Math.min(1, Scene.vel.x / 420));
        tgt.armL = 0.5 + vk * 0.7;
        tgt.armR = -0.5 + vk * 0.7;
        tgt.foreL = -0.5; tgt.foreR = 0.5;
        tgt.headX = -vk * 3;
        tgt.headA = -vk * 0.07;
        F.set('surprise');
      }
      Scene.vel.x *= Math.pow(0.02, dt);
      Scene.vel.y *= Math.pow(0.02, dt);

      R.update(dt, tgt, Scene.t, { vx: Scene.vel.x, vy: Scene.vel.y });

      // 表情上下文：视线 + 转头 + 口型
      F.setTalk(res.mouthOpen > 0 ? res.mouthOpen : (S.cur ? 0.5 + 0.5 * Math.sin(Scene.t * 22) * (S.cur.shown < S.cur.text.length ? 1 : 0) : 0));
      var faceSt = F.update(dt, {
        gazeX: Scene.gaze.x + res.gazeX,
        gazeY: Scene.gaze.y + res.gazeY,
        turn: Math.max(-1, Math.min(1, tgt.headX / 6 + Scene.gaze.x * 0.35))
      });

      // 先按表情参数逐帧重绘面部（可眨眼 / 追随视线 / 口型开合）
      PIX.Art.drawFace(faceSt);

      // 部件 alpha（人鱼形态的抖动淡入淡出）必须在合成之前设置
      if (res.alphas) {
        for (var i = 0; i < R.parts.length; i++) {
          var it = R.parts[i];
          it.alpha = res.alphas[it.name] === undefined ? 1 : res.alphas[it.name];
        }
      } else {
        for (var j = 0; j < R.parts.length; j++) R.parts[j].alpha = R.parts[j].alpha0;
      }
      R.compose(Scene.charFb, faceSt);

      S.update(dt);
      S.anchor = [Scene.charX + CHAR_ANCHOR[0], Scene.charY + 56];
      Scene.emit(dt, res);
      Scene.fx.update(dt);
    },

    /** 依据当前动作 / 表情发射装饰粒子 */
    emit: function (dt, res) {
      Scene._eT = (Scene._eT || 0) + dt;
      if (Scene._eT < 0.11) return;
      Scene._eT = 0;
      var a = D.action, e = D.expr;
      var hx = Scene.charX + 128, hy = Scene.charY + 40;
      var r = D.rand ? D.rand() : 0.5;
      if ((a === 'dance' || a === 'cheer') && r < 0.8) {
        Scene.fx.spawn('note', hx + (r - 0.5) * 60, hy, { vx: (r - 0.5) * 12, vy: -20, life: 1.3 });
      } else if ((e === 'star' || e === 'excited') && r < 0.6) {
        Scene.fx.spawn('spark', hx + (r - 0.5) * 70, hy + 10, { vx: (r - 0.5) * 14, vy: -8, life: 1.0 });
      } else if (e === 'shy' && r < 0.45) {
        Scene.fx.spawn('heart', hx + (r - 0.5) * 46, hy + 16, { vx: (r - 0.5) * 10, vy: -16, life: 1.5 });
      } else if (a === 'mermaid' && r < 0.7) {
        Scene.fx.spawn('bubble', Scene.charX + 128 + (r - 0.5) * 80, Scene.charY + 210, { vy: -22, life: 1.6 });
      } else if (a === 'sleepy' && r < 0.35) {
        Scene.fx.spawn('sleep', Scene.charX + 190, Scene.charY + 60, { vx: 6, vy: -10, life: 1.8 });
      } else if (a === 'jump' && r < 0.5) {
        Scene.fx.spawn('dust', Scene.charX + 128 + (r - 0.5) * 50, Scene.charY + 250, { vx: (r - 0.5) * 18, vy: -6, life: 0.5 });
      } else if (e === 'angry' && r < 0.3) {
        Scene.fx.spawn('anger', Scene.charX + 168, Scene.charY + 52, { vy: -4, life: 0.9 });
      }
    },

    /* -------------------------------------------------------- 渲染 */
    render: function () {
      var fb = Scene.fb;
      var src = Scene.bgOn ? Scene.bg.room : Scene.bg.plain;
      fb.d.set(src.d);
      fb._bb = null;

      // 影子（抖动半透明，随跳跃高度收缩）
      var tgt = D.lastOut || { rootY: 0, scaleY: 1 };
      var lift = Math.max(0, -tgt.rootY);
      var sw = Math.max(16, 40 - lift * 0.5), sh = Math.max(4, 9 - lift * 0.09);
      Scene.shadow(fb, Scene.charX + 128, Scene.charY + 254, sw, sh, lift);

      S.render(fb);

      var scX = (D.lastOut ? D.lastOut.scaleX : 1) * 1;
      var scY = (D.lastOut ? D.lastOut.scaleY : 1) * 1;
      PIX.draw(fb, Scene.charFb, {
        x: Scene.charX + CHAR_ANCHOR[0], y: Scene.charY + CHAR_ANCHOR[1],
        anchorX: CHAR_ANCHOR[0], anchorY: CHAR_ANCHOR[1],
        scaleX: scX, scaleY: scY, box: CHAR_BOX
      });

      Scene.fx.draw(fb);

      PIX.toRGBA(fb, Scene.rgba);
      Scene.ctx.putImageData(Scene.imageData, 0, 0);
    },

    shadow: function (fb, cx, cy, rx, ry, lift) {
      var dens = 7 - Math.min(4, Math.floor(lift / 8));
      for (var y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
        for (var x = -Math.ceil(rx); x <= Math.ceil(rx); x++) {
          var dd = (x * x) / (rx * rx) + (y * y) / (ry * ry);
          if (dd > 1) continue;
          var px = Math.round(cx + x), py = Math.round(cy + y);
          if (px < 0 || py < 0 || px >= W || py >= H) continue;
          var th = PIX.Bayer4[((py & 3) << 2) | (px & 3)];
          if (th < dens) fb.d[py * W + px] = P.SHADOW;
        }
      }
      fb._bb = null;
    },

    /* ---------------------------------------------------- 主循环 */
    start: function () {
      if (Scene.running) return;
      Scene.running = true;
      Scene.lastT = (global.performance || Date).now();
      var loop = function (now) {
        if (!Scene.running) return;
        var dt = (now - Scene.lastT) / 1000;
        Scene.lastT = now;
        if (!isFinite(dt) || dt < 0) dt = 0.016;
        if (dt > 0.05) dt = 0.05;          // 防止切标签页后瞬移
        Scene.update(dt);
        Scene.render();
        // 统计
        Scene._acc += dt; Scene._frames++;
        if (Scene._acc >= 0.5) {
          Scene.fps = Math.round(Scene._frames / Scene._acc);
          Scene._acc = 0; Scene._frames = 0;
          if (Scene.onStats) Scene.onStats(Scene.fps);
        }
        global.requestAnimationFrame(loop);
      };
      global.requestAnimationFrame(loop);
    },
    stop: function () { Scene.running = false; }
  };

  PIX.Scene = Scene;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
/* ===================== app.js ===================== */
/* ============================================================================
 * app.js  —  启动装配：初始化各模块、绑定事件、驱动主循环
 * ----------------------------------------------------------------------------
 * 页面加载后立即构建美术并开始渲染，无白屏期。
 * 所有事件监听器只在启动时绑定一次（页面级单例），不存在重复注册或泄漏。
 * ==========================================================================*/
(function (global) {
  'use strict';
  var PIX = global.PIX;
  var P = PIX.PAL;

  var errors = [];
  global.addEventListener('error', function (e) {
    errors.push(String(e.message || e.error));
  });
  global.addEventListener('unhandledrejection', function (e) {
    errors.push('unhandledrejection: ' + e.reason);
  });

  /** 调色板 -> CSS 变量：CSS 中不出现任何硬编码色值 */
  function injectPalette() {
    var map = {
      void: 'VOID', panel: 'UI_PANEL', line: 'UI_LINE', ink: 'NAVY_DEEP', navy: 'NAVY',
      navyHi: 'NAVY_HI', navyMid: 'NAVY_MID', hair: 'HAIR', hairLit: 'HAIR_LIT',
      white: 'WHITE', whiteSd: 'WHITE_SHD', whiteMid: 'WHITE_MID', gold: 'GOLD',
      purple: 'PURPLE', purpleDk: 'PURPLE_DK', sky: 'SKY', dim: 'WHITE_DEEP', glare: 'HAIR_HI'
    };
    var st = document.documentElement.style;
    for (var k in map) st.setProperty('--' + k, PIX.HEX[P[map[k]]]);
  }

  function boot() {
    var t0 = (global.performance || Date).now();
    injectPalette();

    // ---- 美术（一次性生成，之后只做变换）----
    PIX.Art.buildHead();
    PIX.Art.buildBody();
    var tArt = (global.performance || Date).now();

    // ---- 系统 ----
    PIX.Face.init();
    PIX.Actions.init();
    PIX.Rig.init();
    PIX.Speech.init();
    PIX.Director.init(20240919);

    var canvas = document.getElementById('stage');
    PIX.Scene.init(canvas);

    // ---- 面板 ----
    PIX.UI.build(document.getElementById('side'), {
      onAction: function (name) {
        var line = PIX.LINES.act[name];
        PIX.Director.setAction(name, { restart: true, line: line, speech: { prio: 1 } });
      },
      onExpr: function (name) { PIX.Director.setExpr(name); },
      onTopic: function (i) {
        var tp = PIX.topics[i];
        PIX.Director.say(tp.lines[(Math.random() * tp.lines.length) | 0], { prio: 2, hold: 2.4 });
        if (PIX.Audio) PIX.Audio.sfx('happy');
      },
      onToggle: function (key, on) {
        if (key === 'sound') PIX.Audio.setEnabled(on);
        if (key === 'music') PIX.Audio.setMusic(on);
        if (key === 'sfx') PIX.Audio.setSfx(on);
        if (key === 'bg') PIX.Scene.bgOn = on;
        if (key === 'bubbles') PIX.Speech.visible = on;
        if (key === 'auto') PIX.Director.autoEnabled = on;
      }
    });

    // 语音逐字弹出音
    PIX.Speech.onBlip = function (ch, msg) {
      if (PIX.Audio) PIX.Audio.sfx('blip', { i: ch.charCodeAt(0), pitch: ((ch.charCodeAt(0) % 7) - 3) });
    };

    PIX.Scene.onStats = function (fps) {
      PIX.UI.setFps(fps);
      PIX.UI.refresh();
      if (diag) updateDiag(fps);
    };

    // ---- 自适应整数缩放 ----
    function fit() {
      var pane = document.getElementById('stagepane');
      var w = pane.clientWidth - 20, h = pane.clientHeight - 20;
      var k = Math.floor(Math.min(w / PIX.Scene.W, h / PIX.Scene.H));
      if (k < 1) k = 1;
      if (k > 5) k = 5;
      PIX.Scene.setScale(k);
    }

    // ---- 事件绑定（仅一次）----
    var audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      PIX.Audio.unlock();
      var hint = document.getElementById('hint');
      if (hint) hint.classList.add('hide');
    }

    // 任意位置的首次交互都解锁音频（含侧栏按钮）
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('touchstart', unlockAudio, { passive: true });
    global.addEventListener('keydown', unlockAudio);
    canvas.addEventListener('pointerdown', function (e) {
      unlockAudio();
      if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
      PIX.Scene.onDown(e.clientX, e.clientY);
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', function (e) {
      PIX.Scene.onMove(e.clientX, e.clientY);
      canvas.style.cursor = PIX.Scene.pointer.onChar ? 'grab' : (PIX.Scene.dragging ? 'grabbing' : 'default');
    });
    canvas.addEventListener('pointerup', function (e) {
      if (canvas.releasePointerCapture) { try { canvas.releasePointerCapture(e.pointerId); } catch (err) {} }
      PIX.Scene.onUp(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', function () {
      PIX.Scene.onLeave();
      canvas.style.cursor = 'default';
    });
    canvas.addEventListener('pointercancel', function () { PIX.Scene.onLeave(); });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    // 快捷键：空格/回车 触发一次自主行为切换，方便键盘用户
    global.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        if (e.preventDefault) e.preventDefault();
        var pool = ['wave', 'jump', 'dance', 'cheer', 'spin', 'stretch', 'shy', 'mermaid', 'think', 'bow'];
        var pick = pool[(Math.random() * pool.length) | 0];
        PIX.Director.setAction(pick, { line: PIX.LINES.act[pick], speech: { prio: 1 } });
      }
    });
    global.addEventListener('resize', fit);
    // 布局稳定后再校正一次（首帧前 clientWidth 可能尚未最终确定）
    global.requestAnimationFrame(fit);
    global.addEventListener('load', fit);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) PIX.Scene.lastT = (global.performance || Date).now();
    });

    // ---- 调试钩子（仅在 #debug 时启用，用于自动化核对）----
    var diag = null;
    if (global.location && String(global.location.hash).indexOf('debug') >= 0) {
      diag = document.createElement('div');
      diag.id = 'diag';
      diag.style.display = 'none';
      document.body.appendChild(diag);
    }
    function updateDiag(fps) {
      if (!diag) return;
      var pane = document.getElementById('stagepane');
      diag.textContent = JSON.stringify({
        pane: [pane.clientWidth, pane.clientHeight],
        fps: fps,
        errors: errors,
        artMs: Math.round(tArt - t0),
        action: PIX.Director.action,
        expr: PIX.Director.expr,
        parts: PIX.Art.order.length,
        cjk: Object.keys(PIX.CJK || {}).length,
        scale: PIX.Scene.scale
      });
    }

    fit();
    PIX.Scene.update(0.016);
    PIX.Scene.render();
    PIX.Scene.start();
    if (diag) updateDiag(0);

    // 开局问候
    setTimeout(function () {
      PIX.Director.setExpr('smile', { hold: 2.5 });
      PIX.Director.say(PIX.LINES.greet[0], { hold: 2.6 });
    }, 900);

    global.__PIX_READY = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);
</script>
