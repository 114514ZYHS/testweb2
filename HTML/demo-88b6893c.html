<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>曲水园 · 江南宋明私家园林</title>
<style>
  :root {
    --ink: #1d1f21;
    --paper: #e9e3d6;
    --jade: #7d9b8a;
    --gold: #c9a15a;
    --line: rgba(233, 227, 214, 0.22);
    --panel: rgba(18, 20, 22, 0.46);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0d0e; overflow: hidden;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #scene { display: block; width: 100vw; height: 100vh; }
  canvas { outline: none; }

  /* ---------------------------------------------------------------- 载入 */
  #loader {
    position: fixed; inset: 0; z-index: 90;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #1b2023 0%, #0a0c0d 72%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  #loader .seal {
    font-size: 30px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: #ded6c4; margin-bottom: 26px; opacity: 0.92;
  }
  #loader .sub {
    font-size: 12.5px; letter-spacing: 0.34em; color: #8b8f8c; margin-bottom: 34px;
  }
  #bar {
    width: 216px; height: 1px; background: rgba(222, 214, 196, 0.18); overflow: hidden;
  }
  #bar i {
    display: block; height: 100%; width: 12%;
    background: linear-gradient(90deg, transparent, #c9a15a, transparent);
    animation: sweep 1.9s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(920%); } }
  #loader .tip { margin-top: 22px; font-size: 11.5px; color: #6e7370; letter-spacing: 0.18em; height: 1em; }

  /* ---------------------------------------------------------------- HUD */
  .hud { position: fixed; z-index: 40; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  body.idle .hud { opacity: 0.14; transition: opacity 1.4s ease; }
  .hud { transition: opacity 0.5s ease; }

  /* 标题 */
  #title {
    top: 26px; left: 30px; display: flex; align-items: flex-start; gap: 14px;
  }
  #title .name {
    font-size: 25px; letter-spacing: 0.30em; text-indent: 0.30em; line-height: 1.1;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
  }
  #title .meta {
    font-size: 10.5px; letter-spacing: 0.26em; color: #9aa09b; margin-top: 9px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
  }
  #title .stamp {
    width: 34px; height: 34px; margin-top: 2px; border: 1px solid rgba(201, 161, 90, 0.55);
    border-radius: 3px; display: grid; place-items: center; font-size: 13px;
    color: #c9a15a; letter-spacing: 0; background: rgba(140, 40, 30, 0.16);
    box-shadow: inset 0 0 12px rgba(201, 161, 90, 0.14);
  }

  /* 控制面板 */
  #panel {
    bottom: 26px; left: 30px; width: 318px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border-radius: 5px; padding: 15px 17px 13px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  }
  #panel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  #panel .row:last-child { margin-bottom: 2px; }
  .lbl { font-size: 11px; letter-spacing: 0.2em; color: #a9aeaa; min-width: 40px; }
  #clock {
    font-size: 15px; letter-spacing: 0.16em; color: #e6dfd0; min-width: 104px;
    font-variant-numeric: tabular-nums;
  }
  #daybadge {
    font-size: 10.5px; letter-spacing: 0.18em; padding: 2px 8px; border-radius: 2px;
    border: 1px solid var(--line); color: #b9c2bb;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 18px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 1.5px; background: rgba(233, 227, 214, 0.26);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4.8px;
    border-radius: 50%; background: #d8cfba; border: 1px solid rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 8px rgba(201, 161, 90, 0.6);
  }
  input[type="range"]::-moz-range-track { height: 1.5px; background: rgba(233, 227, 214, 0.26); }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #d8cfba; border: 1px solid rgba(0,0,0,0.5);
  }

  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.12em;
    color: #cfc9ba; background: rgba(233, 227, 214, 0.06);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px; cursor: pointer;
    transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease;
  }
  button:hover { background: rgba(233, 227, 214, 0.14); color: #f2ece0; }
  button.on {
    background: rgba(201, 161, 90, 0.20); border-color: rgba(201, 161, 90, 0.62); color: #f0dcb4;
  }
  .sep { height: 1px; background: var(--line); margin: 12px 0 12px; }

  /* 帮助 */
  #help {
    top: 26px; right: 30px; width: 246px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 5px; padding: 13px 15px; font-size: 11.5px; line-height: 1.95;
    color: #b6bbb6; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  }
  #help h4 {
    margin: 0 0 8px; font-size: 11px; font-weight: 400; letter-spacing: 0.26em; color: #9aa09b;
  }
  #help kbd {
    display: inline-block; min-width: 19px; text-align: center;
    padding: 0 4px; margin-right: 6px; border: 1px solid var(--line); border-radius: 2px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #d8d2c4;
  }
  #help .k { color: #d8cfba; }

  /* 状态条 */
  #status {
    bottom: 28px; right: 30px; font-size: 11px; letter-spacing: 0.16em; color: #8b918c;
    text-align: right; line-height: 1.8; text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    font-variant-numeric: tabular-nums;
  }
  #status b { color: #cfc9ba; font-weight: 400; }

  /* 提示 */
  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
    z-index: 60; font-size: 12.5px; letter-spacing: 0.2em; color: #e8e2d4;
    background: rgba(16, 18, 19, 0.62); border: 1px solid var(--line);
    padding: 7px 18px; border-radius: 3px; opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease; pointer-events: none;
    backdrop-filter: blur(10px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 准星（第一人称） */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 15px; height: 15px;
    transform: translate(-50%, -50%); z-index: 45; opacity: 0; transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #crosshair.show { opacity: 0.62; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(233, 227, 214, 0.85);
  }
  #crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }

  /* 点击进入提示 */
  #clickhint {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 44;
    background: rgba(8, 10, 11, 0.42); backdrop-filter: blur(2px);
    font-size: 13.5px; letter-spacing: 0.3em; color: #e2dbcb; cursor: pointer;
    opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s;
  }
  #clickhint.show { opacity: 1; visibility: visible; }
  #clickhint span { padding: 14px 30px; border: 1px solid var(--line); border-radius: 3px; background: rgba(16,18,19,0.5); }

  @media (max-width: 760px) {
    #panel { width: calc(100vw - 40px); left: 20px; bottom: 18px; }
    #help { display: none; }
    #title .name { font-size: 19px; }
    #status { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loader">
  <div class="seal">曲水園</div>
  <div class="sub">江南宋明私家园林 · 实时渲染</div>
  <div id="bar"><i></i></div>
  <div class="tip" id="tip">正在生成本材与石材纹理…</div>
</div>

<div id="crosshair"></div>
<div id="clickhint"><span>点击进入 · 第一人称漫游</span></div>
<div id="toast"></div>

<div class="hud" id="title">
  <div class="stamp">曲</div>
  <div>
    <div class="name">曲水園</div>
    <div class="meta">宋明 · 江南 · 私家园林</div>
  </div>
</div>

<div class="hud" id="help">
  <h4>游园指引</h4>
  <div><kbd>拖拽</kbd><span class="k">旋转</span>　<kbd>滚轮</kbd><span class="k">远近</span></div>
  <div><kbd>右键</kbd><span class="k">平移</span></div>
  <div><kbd>V</kbd><span class="k">切换 环绕 / 漫游</span></div>
  <div><kbd>W A S D</kbd><span class="k">行走</span></div>
  <div><kbd>Shift</kbd><span class="k">疾行</span>　<kbd>F</kbd><span class="k">开合门扇</span></div>
  <div><kbd>Esc</kbd><span class="k">退出漫游</span>　<kbd>H</kbd><span class="k">隐藏面板</span></div>
</div>

<div class="hud" id="panel">
  <div class="row">
    <span class="lbl">时辰</span>
    <span id="clock">辰时 09:24</span>
    <span id="daybadge">昼</span>
  </div>
  <div class="row">
    <input id="timeSlider" type="range" min="0" max="24" step="0.02" value="9.4" />
  </div>
  <div class="row btns">
    <button id="btnAuto" class="on">自动流转</button>
    <button id="btnDawn">卯时</button>
    <button id="btnNoon">午时</button>
    <button id="btnDusk">酉时</button>
    <button id="btnNight">子时</button>
  </div>
  <div class="sep"></div>
  <div class="row btns">
    <button id="btnOrbit" class="on">环绕视角</button>
    <button id="btnFps">入内漫游</button>
  </div>
  <div class="row btns">
    <button id="btnViewOverview" class="on">全景</button>
    <button id="btnViewHall">厅堂</button>
    <button id="btnViewPond">池畔</button>
  </div>
  <div class="sep"></div>
  <div class="row">
    <span class="lbl">细雨</span>
    <input id="rainSlider" type="range" min="0" max="1" step="0.01" value="0.42" />
  </div>
  <div class="row btns">
    <button id="btnRain0">雨后</button>
    <button id="btnRain1" class="on">细雨</button>
    <button id="btnRain2">雨密</button>
  </div>
  <div class="sep"></div>
  <div class="row btns">
    <button id="btnQualHigh" class="on">高画质</button>
    <button id="btnQualMed">中</button>
    <button id="btnQualLow">流畅</button>
  </div>
</div>

<div class="hud" id="status">
  <div><b id="fps">–</b> fps</div>
  <div id="hintline">曲水绕庭 · 粉墙黛瓦</div>
</div>

<script type="module" src="./src/main.js"></script>

<!-- source: deepdemos.top | author: abs123456 | title: 听雨轩 -->
</body>
</html>
