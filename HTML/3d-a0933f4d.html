<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b5c" />
    <meta name="description" content="Pelican Rider — 一只骑自行车的鹈鹕，在阳光海岛栈道上的 3D 跑酷冒险。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='30' cy='36' rx='20' ry='14' fill='%23fbfaf4'/%3E%3Ccircle cx='42' cy='23' r='10' fill='%23fbfaf4'/%3E%3Cpath d='M50 21q12-2 14 4-10 4-14 2z' fill='%23f5a742'/%3E%3Cpath d='M50 26q9 3 13 2-8 4-13 1z' fill='%23ffcf6b'/%3E%3Cpath d='M29 15a12 12 0 0 1 20 0z' fill='%23e8483f'/%3E%3Ccircle cx='46' cy='22' r='2.4' fill='%232a2320'/%3E%3Cpath d='M12 32q-9-7-11 3 7 2 11 0z' fill='%23e8e6dc'/%3E%3C/svg%3E"
    />
    <title>Pelican Rider · 鹈鹕骑行记</title>
    <style>
      /* =========================================================================
   鹈鹕骑行记 — 界面样式
   ========================================================================= */

:root {
  --deep: #072338;
  --ocean: #0e4f74;
  --teal: #12a4c0;
  --sky: #7fd0f2;
  --sand: #f3d9a4;
  --wood: #c9924f;
  --coral: #ff5d5d;
  --sun: #ffcf4d;
  --cream: #fbfaf4;
  --ink: #10222f;
  --glass: rgba(8, 36, 56, 0.62);
  --stroke: rgba(255, 255, 255, 0.16);
  --font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system,
    'Helvetica Neue', Arial, sans-serif;
  --display: 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #071c2c;
  color: var(--cream);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

body {
  touch-action: none;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  touch-action: none;
}

.layer {
  position: fixed;
  inset: 0;
  display: flex;
  pointer-events: none;
  z-index: 10;
}

.layer.hidden {
  display: none !important;
}

button {
  font-family: inherit;
  cursor: pointer;
  pointer-events: auto;
  border: none;
  background: none;
  color: inherit;
}

kbd {
  display: inline-block;
  min-width: 26px;
  padding: 3px 7px;
  margin-right: 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-bottom-width: 2px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-align: center;
  color: #fff;
  font-family: var(--display);
}

/* ============================== 加载页 ============================== */
.overlay-solid {
  z-index: 80;
  align-items: center;
  justify-content: center;
  background: radial-gradient(120% 90% at 50% 12%, #1b6f9c 0%, #0d3f5e 45%, #061a29 100%);
  transition: opacity 0.65s ease;
}

.overlay-solid.fade-out {
  opacity: 0;
  pointer-events: none;
}

.loader-box {
  text-align: center;
  padding: 24px;
}

.loader-bird {
  animation: bob 1.7s ease-in-out infinite;
  margin-bottom: 8px;
}

@keyframes bob {
  0%,
  100% {
    transform: translateY(0) rotate(-2deg);
  }
  50% {
    transform: translateY(-9px) rotate(3deg);
  }
}

.loader-title {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.28em;
  margin: 6px 0 20px;
  color: #fff;
  text-shadow: 0 4px 22px rgba(0, 0, 0, 0.45);
}

.loader-bar {
  width: min(280px, 62vw);
  height: 8px;
  margin: 0 auto;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.loader-bar i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--sun), #ffa62e, var(--coral));
  box-shadow: 0 0 14px rgba(255, 176, 46, 0.7);
  transition: width 0.35s ease;
}

.loader-hint {
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.5);
}

/* ============================== HUD ============================== */
#hud {
  z-index: 20;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(14px + var(--safe-t)) calc(16px + var(--safe-r)) calc(18px + var(--safe-b))
    calc(16px + var(--safe-l));
}

.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.hud-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.score-box {
  display: flex;
  flex-direction: column;
  padding: 8px 16px 9px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.25);
}

.lbl {
  font-size: 10px;
  letter-spacing: 0.22em;
  color: rgba(255, 255, 255, 0.62);
  font-weight: 600;
}

.score {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 800;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
}

.combo {
  align-self: flex-start;
  padding: 3px 12px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 15px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.12);
  color: rgba(255, 255, 255, 0.75);
  transition: transform 0.18s ease, background 0.25s ease, color 0.25s ease;
}

.combo.hot {
  background: linear-gradient(100deg, var(--sun), var(--coral));
  color: #3a1b0c;
  box-shadow: 0 4px 18px rgba(255, 122, 61, 0.55);
  transform-origin: left center;
}

.hud-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
}

.stat-pill {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 13px;
  border-radius: 12px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.stat-pill b {
  font-family: var(--display);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: #fff;
}

.lives {
  position: absolute;
  left: 50%;
  top: calc(16px + var(--safe-t));
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  color: var(--coral);
}

.lives .heart {
  display: block;
  filter: drop-shadow(0 2px 8px rgba(255, 93, 93, 0.6));
  animation: heartIn 0.32s cubic-bezier(0.2, 1.5, 0.4, 1);
}

@keyframes heartIn {
  from {
    transform: scale(0.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.fish-counter {
  position: absolute;
  left: calc(20px + var(--safe-l));
  bottom: calc(22px + var(--safe-b));
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 15px 7px 11px;
  border-radius: 99px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: var(--display);
  font-weight: 800;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  color: var(--sun);
}

.boost-wrap {
  position: absolute;
  left: 50%;
  bottom: calc(20px + var(--safe-b));
  transform: translateX(-50%);
  width: min(300px, 52vw);
}

.boost-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}

.boost-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.65);
}

.boost-key {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.13);
  color: rgba(255, 255, 255, 0.7);
}

.boost-bar {
  height: 11px;
  border-radius: 99px;
  background: rgba(4, 22, 36, 0.6);
  border: 1px solid var(--stroke);
  overflow: hidden;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
}

.boost-bar i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #6fe3ff, #4bb8ff, #b6f2ff);
  box-shadow: 0 0 12px rgba(90, 200, 245, 0.8);
  transition: width 0.16s linear;
}

.boost-wrap.ready .boost-bar i {
  background: linear-gradient(90deg, #ffd45e, #ff9d2e, #fff0b8);
  box-shadow: 0 0 20px rgba(255, 200, 70, 0.95);
  animation: boostReady 0.9s ease-in-out infinite;
}

.boost-wrap.ready .boost-label {
  color: var(--sun);
}

@keyframes boostReady {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.45);
  }
}

.countdown {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%) scale(0.6);
  font-family: var(--display);
  font-size: clamp(64px, 16vw, 150px);
  font-weight: 900;
  color: #fff;
  opacity: 0;
  text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 207, 77, 0.55);
  transition: opacity 0.2s ease;
}

.countdown.show {
  opacity: 1;
}

.countdown.pop {
  animation: cdPop 0.42s cubic-bezier(0.15, 1.5, 0.35, 1) forwards;
}

@keyframes cdPop {
  0% {
    transform: translate(-50%, -50%) scale(1.6);
    opacity: 0;
  }
  40% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 27%;
  transform: translate(-50%, 14px);
  padding: 9px 20px;
  border-radius: 99px;
  background: rgba(6, 28, 44, 0.78);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #fff;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.hud-mute {
  position: absolute;
  right: calc(18px + var(--safe-r));
  bottom: calc(22px + var(--safe-b));
  width: 42px;
  height: 42px;
  color: rgba(255, 255, 255, 0.8);
}

.fps {
  position: absolute;
  right: calc(18px + var(--safe-r));
  bottom: calc(70px + var(--safe-b));
  font-family: var(--display);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.35);
  letter-spacing: 0.08em;
}

/* ============================== 通用面板 ============================== */
.ghost-btn {
  padding: 10px 20px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: rgba(255, 255, 255, 0.88);
  font-size: 14px;
  font-weight: 600;
  transition: background 0.18s ease, transform 0.12s ease, color 0.18s ease;
}

.ghost-btn:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
}

.ghost-btn:active {
  transform: scale(0.96);
}

.ghost-btn.off {
  opacity: 0.42;
  text-decoration: line-through;
}

.ghost-btn.wide {
  width: 100%;
}

.icon-btn {
  padding: 8px 14px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 12.5px;
  font-weight: 600;
  transition: background 0.18s ease, opacity 0.18s ease;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.icon-btn.off {
  opacity: 0.4;
  text-decoration: line-through;
}

.primary-btn {
  position: relative;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 15px 46px;
  border-radius: 18px;
  background: linear-gradient(105deg, #ffd45e 0%, #ffa62e 45%, #ff7a3d 100%);
  color: #3b1d06;
  font-family: var(--display);
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 0.1em;
  box-shadow: 0 10px 30px rgba(255, 140, 40, 0.42), inset 0 -3px 0 rgba(150, 60, 0, 0.28);
  transition: transform 0.14s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.18s ease;
}

.primary-btn em {
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  font-weight: 700;
  opacity: 0.62;
}

.primary-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 36px rgba(255, 150, 50, 0.55), inset 0 -3px 0 rgba(150, 60, 0, 0.28);
}

.primary-btn:active {
  transform: translateY(1px) scale(0.98);
}

.primary-btn.small {
  padding: 13px 38px;
  font-size: 18px;
  width: 100%;
}

.panel {
  margin: auto;
  width: min(430px, 88vw);
  padding: 30px 30px 26px;
  border-radius: 26px;
  background: linear-gradient(160deg, rgba(12, 48, 72, 0.9), rgba(6, 26, 42, 0.94));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  pointer-events: auto;
  text-align: center;
  animation: panelIn 0.3s cubic-bezier(0.2, 1.2, 0.4, 1);
}

@keyframes panelIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.panel-title {
  margin: 0 0 20px;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: #fff;
}

.panel-actions {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 18px;
}

.badge {
  display: inline-block;
  margin-bottom: 12px;
  padding: 5px 16px;
  border-radius: 99px;
  background: linear-gradient(100deg, var(--sun), var(--coral));
  color: #3a1b0c;
  font-family: var(--display);
  font-size: 12.5px;
  font-weight: 900;
  letter-spacing: 0.18em;
  box-shadow: 0 6px 20px rgba(255, 140, 60, 0.5);
  animation: heartIn 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
}

.over-stats {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 16px;
}

.stat-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 9px 15px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.stat-line span {
  font-size: 12.5px;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.6);
}

.stat-line b {
  font-family: var(--display);
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  color: #fff;
}

.best {
  font-size: 12.5px;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.55);
}

.quality {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.quality.center {
  margin-top: 16px;
}

.quality button {
  padding: 8px 16px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.72);
  transition: all 0.18s ease;
}

.quality button:hover {
  background: rgba(255, 255, 255, 0.16);
}

.quality button.active {
  background: linear-gradient(100deg, var(--sun), #ff9d2e);
  color: #3a1b0c;
  font-weight: 800;
  border-color: transparent;
}

/* ============================== 标题页 ============================== */
.menu-layer {
  z-index: 30;
  align-items: center;
  justify-content: center;
  background: radial-gradient(120% 80% at 50% 30%, rgba(4, 24, 40, 0.05) 0%, rgba(3, 18, 30, 0.55) 75%);
  overflow-y: auto;
  padding: 26px 16px;
}

.menu-inner {
  margin: auto;
  width: min(600px, 92vw);
  text-align: center;
  pointer-events: auto;
}

.brand {
  margin-bottom: 22px;
}

.brand-bird {
  animation: bob 3s ease-in-out infinite;
  filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
}

.title {
  margin: 12px 0 4px;
  font-family: var(--display);
  font-size: clamp(38px, 9vw, 68px);
  font-weight: 900;
  letter-spacing: 0.1em;
  line-height: 1;
  background: linear-gradient(180deg, #ffffff 12%, #ffd45e 62%, #ff9d2e 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 6px 22px rgba(255, 160, 60, 0.4));
}

.title-en {
  font-family: var(--display);
  font-size: clamp(11px, 2.4vw, 15px);
  font-weight: 800;
  letter-spacing: 0.62em;
  color: rgba(255, 255, 255, 0.62);
  margin-bottom: 14px;
  text-indent: 0.62em;
}

.tagline {
  margin: 0 auto;
  max-width: 30em;
  font-size: 13.5px;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.66);
}

.menu-inner .primary-btn {
  margin: 6px auto 24px;
}

.keys {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px 12px;
  margin-bottom: 22px;
}

.key-item {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  border-radius: 13px;
  background: rgba(8, 36, 56, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-align: left;
}

.key-item span {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.78);
  white-space: nowrap;
}

.menu-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.toggles {
  display: flex;
  gap: 8px;
  align-items: center;
}

.tips {
  margin-top: 16px;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.4);
}

/* ============================== 触摸按键 ============================== */
#touch {
  z-index: 25;
}

.tbtn {
  position: absolute;
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(8, 36, 56, 0.42);
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  color: rgba(255, 255, 255, 0.9);
  font-family: var(--display);
  font-size: 13px;
  font-weight: 800;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  touch-action: none;
}

.tbtn:active {
  background: rgba(255, 255, 255, 0.28);
}

.tbtn-left,
.tbtn-right {
  width: 68px;
  height: 68px;
  bottom: calc(30px + var(--safe-b));
  font-size: 20px;
}

.tbtn-left {
  left: calc(20px + var(--safe-l));
}

.tbtn-right {
  left: calc(100px + var(--safe-l));
}

.tbtn-jump {
  width: 82px;
  height: 82px;
  right: calc(22px + var(--safe-r));
  bottom: calc(28px + var(--safe-b));
}

.tbtn-slide {
  width: 64px;
  height: 64px;
  right: calc(112px + var(--safe-r));
  bottom: calc(18px + var(--safe-b));
}

.tbtn-boost {
  width: 62px;
  height: 62px;
  right: calc(36px + var(--safe-r));
  bottom: calc(122px + var(--safe-b));
  border-color: rgba(255, 207, 77, 0.7);
  color: var(--sun);
}

/* ============================== 响应式 ============================== */
@media (max-width: 640px), (max-height: 620px) {
  .keys {
    grid-template-columns: 1fr;
    gap: 7px;
  }
  .menu-inner .primary-btn {
    margin-bottom: 18px;
  }
  .score {
    font-size: 24px;
  }
  .stat-pill b {
    font-size: 13px;
  }
  .boost-wrap {
    width: min(220px, 46vw);
  }
  .brand-bird svg {
    width: 88px;
    height: 56px;
  }
  .tagline {
    display: none;
  }
  .tips {
    display: none;
  }
}

  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- ============ 加载 ============ -->
    <div id="loader" class="layer overlay-solid">
      <div class="loader-box">
        <div class="loader-bird">
          <svg viewBox="0 0 64 40" width="86" height="54" aria-hidden="true">
            <ellipse cx="26" cy="24" rx="16" ry="11" fill="#fbfaf4" />
            <path d="M40 18 q10 -2 16 3 q-8 5 -16 3z" fill="#f5a742" />
            <path d="M40 21 q8 3 14 2 q-6 4 -14 1z" fill="#ffcf6b" />
            <circle cx="35" cy="16" r="7" fill="#fbfaf4" />
            <circle cx="37" cy="14" r="1.8" fill="#2a2320" />
            <path d="M13 20 q-8 -6 -10 2 q6 2 10 1z" fill="#e8e6dc" />
          </svg>
        </div>
        <div class="loader-title">鹈鹕骑行记</div>
        <div class="loader-bar"><i id="loaderBar"></i></div>
        <div class="loader-hint">正在编织海风与木栈道…</div>
      </div>
    </div>

    <!-- ============ HUD ============ -->
    <div id="hud" class="layer hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div class="score-box">
            <span class="lbl">得分</span>
            <span id="score" class="score">0</span>
          </div>
          <div id="combo" class="combo">x1</div>
        </div>

        <div class="hud-right">
          <div class="stat-pill"><span class="lbl">距离</span><b id="dist">0 m</b></div>
          <div class="stat-pill"><span class="lbl">速度</span><b id="speed">0 km/h</b></div>
        </div>
      </div>

      <div id="lives" class="lives"></div>

      <div id="boostWrap" class="boost-wrap">
        <div class="boost-head">
          <span class="boost-label">冲刺能量</span>
          <span class="boost-key">SHIFT</span>
        </div>
        <div class="boost-bar"><i id="boostFill"></i></div>
      </div>

      <div class="fish-counter">
        <svg viewBox="0 0 32 20" width="26" height="17" aria-hidden="true">
          <ellipse cx="16" cy="10" rx="9" ry="6" fill="#ffd45e" />
          <path d="M4 10 l-4 -5 v10z" fill="#ffa62e" />
          <circle cx="20" cy="8" r="1.6" fill="#3a2b12" />
        </svg>
        <span id="fishCount">0</span>
      </div>

      <div id="countdown" class="countdown"></div>
      <div id="toast" class="toast"></div>

      <button id="muteBtn" class="ghost-btn hud-mute" title="音乐开关 (M)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor" />
          <path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" />
        </svg>
      </button>
      <div id="fps" class="fps">60 FPS</div>
    </div>

    <!-- ============ 触摸按键 ============ -->
    <div id="touch" class="layer hidden">
      <button id="btnLeft" class="tbtn tbtn-left">◀</button>
      <button id="btnRight" class="tbtn tbtn-right">▶</button>
      <button id="btnSlide" class="tbtn tbtn-slide">滑铲</button>
      <button id="btnJump" class="tbtn tbtn-jump">跳跃</button>
      <button id="btnBoost" class="tbtn tbtn-boost">冲刺</button>
    </div>

    <!-- ============ 标题 ============ -->
    <div id="menu" class="layer menu-layer">
      <div class="menu-inner">
        <div class="brand">
          <div class="brand-bird">
            <svg viewBox="0 0 64 40" width="118" height="74" aria-hidden="true">
              <ellipse cx="26" cy="25" rx="16" ry="11" fill="#fbfaf4" />
              <path d="M40 18 q10 -2 17 4 q-9 5 -17 3z" fill="#f5a742" />
              <path d="M40 22 q8 3 15 2 q-7 4 -15 1z" fill="#ffcf6b" />
              <circle cx="35" cy="16" r="7.4" fill="#fbfaf4" />
              <path d="M28 12 a8 8 0 0 1 14 0z" fill="#e8483f" />
              <circle cx="37.5" cy="15" r="1.9" fill="#2a2320" />
              <path d="M12 22 q-8 -6 -10 3 q6 2 10 0z" fill="#e8e6dc" />
            </svg>
          </div>
          <h1 class="title">鹈鹕骑行记</h1>
          <div class="title-en">PELICAN&nbsp;RIDER</div>
          <p class="tagline">阳光、海风、木栈道 —— 以及一只绝不想迟到的鹈鹕。</p>
        </div>

        <button id="startBtn" class="primary-btn">
          <span>开始骑行</span>
          <em>ENTER / 点击</em>
        </button>

        <div class="keys">
          <div class="key-item"><kbd>A</kbd><kbd>D</kbd><span>左右变道</span></div>
          <div class="key-item"><kbd>SPACE</kbd><span>跳跃 / 二段跳</span></div>
          <div class="key-item"><kbd>S</kbd><span>滑铲 / 空中俯冲</span></div>
          <div class="key-item"><kbd>SHIFT</kbd><span>冲刺（耗能量）</span></div>
          <div class="key-item"><kbd>ESC</kbd><span>暂停</span></div>
          <div class="key-item"><kbd>M</kbd><span>音乐开关</span></div>
        </div>

        <div class="menu-foot">
          <div id="menuBest" class="best">最高分 0　最远 0 m</div>
          <div class="toggles">
            <div class="quality" role="group" aria-label="画质">
              <button data-quality="low">低</button>
              <button data-quality="medium">中</button>
              <button data-quality="high">高</button>
            </div>
            <button id="musicBtn" class="icon-btn" title="音乐">音乐</button>
            <button id="sfxBtn" class="icon-btn" title="音效">音效</button>
          </div>
        </div>
        <div class="tips">收集小鱼填满能量条 → SHIFT 冲刺可获得短暂无敌。</div>
      </div>
    </div>

    <!-- ============ 暂停 ============ -->
    <div id="pause" class="layer hidden">
      <div class="panel">
        <h2 class="panel-title">暂停</h2>
        <div class="panel-actions">
          <button id="resumeBtn" class="primary-btn small"><span>继续</span><em>ESC</em></button>
          <button id="restartBtn" class="ghost-btn wide">重新开始（R）</button>
          <button id="quitBtn" class="ghost-btn wide">回到标题</button>
        </div>
        <div class="quality center">
          <button data-quality="low">低画质</button>
          <button data-quality="medium">中画质</button>
          <button data-quality="high">高画质</button>
        </div>
      </div>
    </div>

    <!-- ============ 结算 ============ -->
    <div id="over" class="layer hidden">
      <div class="panel">
        <div id="overBadge" class="badge hidden">新纪录</div>
        <h2 class="panel-title">本次骑行结束</h2>
        <div id="overStats" class="over-stats"></div>
        <div id="overBest" class="best"></div>
        <div class="panel-actions">
          <button id="againBtn" class="primary-btn small"><span>再来一次</span><em>ENTER</em></button>
          <button id="menuBtn" class="ghost-btn wide">回到标题</button>
        </div>
      </div>
    </div>
