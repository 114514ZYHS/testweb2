<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>体素中式建筑群 · Voxel Chinese Temple Complex</title>
  <style>
    :root {
      --ink: #f2ead9;
      --gold: #e2c073;
      --panel: rgba(18, 14, 12, 0.62);
      --line: rgba(226, 192, 115, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f18; }
    body {
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", Georgia, serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    .panel {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    #hud {
      left: 16px; top: 16px; padding: 12px 16px 12px; max-width: 340px;
    }
    #hud h1 {
      margin: 0 0 4px; font-size: 19px; letter-spacing: 2px; color: var(--gold); font-weight: 700;
    }
    #hud .sub { font-size: 11.5px; opacity: 0.72; letter-spacing: 0.5px; margin-bottom: 8px; }
    #hud-stats { font-size: 12px; line-height: 1.7; font-family: ui-monospace, Consolas, monospace; opacity: 0.9; }
    #hud-stats b { color: var(--gold); font-size: 14px; }

    #ui { right: 16px; top: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
    #ui .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #ui .label { font-size: 11px; opacity: 0.6; letter-spacing: 1px; }
    button {
      font-family: inherit; font-size: 12.5px; color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(226, 192, 115, 0.28);
      border-radius: 4px; padding: 5px 11px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover { background: rgba(226, 192, 115, 0.18); }
    button.active { background: rgba(226, 192, 115, 0.28); border-color: var(--gold); color: #fff5dd; }

    #tips {
      left: 16px; bottom: 16px; padding: 9px 14px; font-size: 11.5px; line-height: 1.75; opacity: 0.9;
    }
    #tips kbd {
      font-family: ui-monospace, Consolas, monospace; font-size: 11px;
      border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin: 0 2px;
      background: rgba(255, 255, 255, 0.06);
    }

    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #0b0f18; z-index: 50;
      transition: opacity 0.6s ease; font-size: 14px; letter-spacing: 3px; color: var(--gold);
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .bar { width: 180px; height: 2px; background: rgba(226, 192, 115, 0.2); overflow: hidden; }
    #loading .bar i { display: block; width: 40%; height: 100%; background: var(--gold); animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }

    #error {
      display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
      max-width: 80vw; padding: 8px 14px; background: rgba(120, 20, 20, 0.9);
      border: 1px solid #ff8a8a; border-radius: 4px; font-size: 12px; z-index: 60;
      white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    }
    #diag { display: none; }
