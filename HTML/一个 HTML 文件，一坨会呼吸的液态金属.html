<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>实时元球雕塑 · Real-time Metaball Sculpture</title>
<style>
  :root{
    --fg:#e9f2ff; --dim:#8fa3bd; --accent:#6fd3ff; --warm:#ffb066;
    --glass:rgba(10,14,22,.62); --line:rgba(140,180,220,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl.dragging{cursor:grabbing}
  .ui{position:fixed;z-index:10;color:var(--fg);pointer-events:none;
      text-shadow:0 1px 10px rgba(0,0,0,.85);user-select:none;-webkit-user-select:none}
  #hud{left:18px;top:16px;max-width:min(46vw,420px);transition:opacity .35s ease}
  #title{font-size:15px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}
  #title b{color:var(--accent);font-weight:650}
  #subtitle{font-size:10.5px;color:var(--dim);letter-spacing:.3em;margin-top:3px}
  #stats{margin-top:10px;font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         color:var(--dim);letter-spacing:.02em}
  #stats b{color:var(--fg);font-weight:600}
  #stats .k{color:#6b7f99}
  #stats .acc{color:var(--accent)}
  #stats .warm{color:var(--warm)}
  #hints{margin-top:9px;font-size:11px;line-height:1.75;color:var(--dim)}
  #hints kbd{display:inline-block;padding:0 5px;margin:0 1px;border-radius:4px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cfe2f7;
    font:10.5px/16px ui-monospace,Menlo,monospace}
  #panel{left:18px;bottom:16px;pointer-events:auto;background:var(--glass);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 10px 40px rgba(0,0,0,.5);transition:opacity .35s ease;min-width:250px}
  .row{display:flex;align-items:center;gap:10px;margin:5px 0}
  .row label{font-size:11px;color:var(--dim);width:82px;flex:none;letter-spacing:.06em}
  .row input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:20px;background:transparent;margin:0}
  .row input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;
    background:linear-gradient(90deg,rgba(111,211,255,.85),rgba(255,176,102,.8))}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;
    border-radius:50%;background:#eaf4ff;border:1px solid rgba(0,0,0,.4);box-shadow:0 0 10px rgba(111,211,255,.75);cursor:pointer}
  .row input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(150,190,230,.5)}
  .row input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#eaf4ff;cursor:pointer}
  .row .v{font:11px/1 ui-monospace,Menlo,monospace;color:var(--fg);width:42px;text-align:right;flex:none}
  #panel .sep{height:1px;background:var(--line);margin:9px 0 7px}
  #panel .ops{font-size:10.5px;color:var(--dim);line-height:1.7}
  #panel .ops i{color:var(--accent);font-style:normal}
  #badge{position:fixed;right:16px;top:16px;z-index:10;pointer-events:none;
    font:10.5px/1 ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.14em;
    border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--glass);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:12;
    font-size:12px;color:#dceaff;background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;opacity:0;transition:opacity .4s ease;pointer-events:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #toast.on{opacity:1}
  body.noui .ui,body.noui #panel,body.noui #badge{opacity:0;pointer-events:none}
  @media (max-width:720px){
    #hud{max-width:62vw;left:12px;top:12px}
    #hints{display:none}
    #panel{left:12px;right:12px;bottom:12px;min-width:0;padding:10px 12px 8px}
    .row label{width:70px;font-size:10.5px}
    #title{font-size:13px}
    #badge{right:10px;top:10px;font-size:9.5px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="ui">
  <div id="title">实时<b>元球</b>雕塑</div>
  <div id="subtitle">METABALL SCULPTURE / MC REALTIME</div>
  <div id="stats">
    <span class="k">FPS</span> <b id="s-fps">--</b>
    <span class="k">·</span> <span class="k">后端</span> <b id="s-api" class="acc">--</b><br>
    <span class="k">网格</span> <b id="s-res">--</b>
    <span class="k">·</span> <span class="k">顶点</span> <b id="s-vert">--</b>
    <span class="k">·</span> <span class="k">三角形</span> <b id="s-tri">--</b><br>
    <span class="k">元球</span> <b id="s-balls">--</b>
    <span class="k">·</span> <span class="k">重建</span> <b id="s-build" class="warm">--</b>
  </div>
  <div id="hints">
    拖拽 <kbd>旋转</kbd> · 滚轮 <kbd>缩放</kbd> · 点击空白 <kbd>加球</kbd><br>
    拖拽球体 <kbd>移动</kbd> · 右键/长按 <kbd>删除</kbd><br>
    <kbd>空格</kbd> 爆炸重组 · <kbd>R</kbd> 重置 · <kbd>H</kbd> 隐藏 UI · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 分辨率
  </div>
</div>

<div id="badge">WEBGL2 · REALTIME</div>

<div id="panel" class="ui">
  <div class="row"><label>等值面阈值</label><input id="p-iso" type="range" min="0.10" max="1.40" step="0.01" value="0.52"><span class="v" id="v-iso">0.52</span></div>
  <div class="row"><label>融合强度</label><input id="p-fuse" type="range" min="0.70" max="1.70" step="0.01" value="1.00"><span class="v" id="v-fuse">1.00</span></div>
  <div class="row"><label>金属度</label><input id="p-metal" type="range" min="0" max="1" step="0.01" value="1.00"><span class="v" id="v-metal">1.00</span></div>
  <div class="row"><label>粗糙度</label><input id="p-rough" type="range" min="0.03" max="0.70" step="0.01" value="0.14"><span class="v" id="v-rough">0.14</span></div>
  <div class="sep"></div>
  <div class="ops">空格 <i>爆炸</i> · R <i>重置</i> · H <i>隐藏</i> · 1/2/3 <i>32³/48³/64³</i></div>
</div>

<div id="toast"></div>
