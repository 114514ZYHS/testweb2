<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/preview/ds-flash-0908-52b45484/v880d6342e4dc/">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>双子塔 · 3D 物理倒塌模拟</title>
<link rel="stylesheet" href="src/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="head">
    <div class="titles">
      <h1>双子塔 · 3D 物理倒塌</h1>
      <p>Rapier 刚体物理 · 逐层失效的连续倒塌</p>
    </div>
    <button id="panel-toggle" title="收起/展开">–</button>
  </div>

  <div class="body">
    <div class="row">
      <label for="stories">结构规模</label>
      <select id="stories">
        <option value="50">50 层 · 流畅</option>
        <option value="80" selected>80 层 · 推荐</option>
        <option value="110">110 层 · 真实</option>
      </select>
    </div>

    <div class="row">
      <label for="cut">断裂起始层 <span class="val" id="cut-val">第 56 层</span></label>
      <input type="range" id="cut" min="8" max="92" value="70" step="1" />
    </div>

    <div class="row">
      <label for="thresh">结构强度阈值 <span class="val" id="thresh-val">4.5 m/s</span></label>
      <input type="range" id="thresh" min="1.5" max="14" value="4.5" step="0.1" />
    </div>

    <div class="row">
      <label for="timescale">时间流速 <span class="val" id="timescale-val">1.00×</span></label>
      <input type="range" id="timescale" min="0.1" max="2" value="1" step="0.05" />
    </div>

    <div class="row">
      <label for="gravity">重力加速度 <span class="val" id="gravity-val">9.8 m/s²</span></label>
      <input type="range" id="gravity" min="1" max="25" value="9.81" step="0.1" />
    </div>

    <div class="grid">
      <button id="btn-left" class="primary">引爆 A 塔</button>
      <button id="btn-right" class="primary">引爆 B 塔</button>
      <button id="btn-both" class="primary wide">同时引爆（Enter）</button>
      <button id="btn-reset">重置（R）</button>
      <button id="btn-pause">暂停（空格）</button>
    </div>

    <div class="grid small">
      <button data-cam="wide">远景</button>
      <button data-cam="base">塔基</button>
      <button data-cam="top">塔顶</button>
      <button data-cam="street">街面</button>
    </div>
  </div>
</div>

<div id="hud">
  <div><span>状态</span><b id="hud-state">加载中…</b></div>
  <div><span>FPS</span><b id="hud-fps">–</b></div>
  <div><span>动态刚体</span><b id="hud-bodies">0</b></div>
  <div><span>已失效楼层</span><b id="hud-collapsed">0 / 160</b></div>
  <div><span>残存高度</span><b id="hud-height">0 m</b></div>
  <div><span>模拟时间</span><b id="hud-time">0.0 s</b></div>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

<script type="module" src="src/main.js"></script>
