<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微观城市交通十字路口 · 数字孪生仿真系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div class="btxt">
        <div class="t1">微观城市交通十字路口数字孪生仿真系统</div>
        <div class="t2">IDM 跟驰模型 · MOBIL 换道决策 · 行人过街 · 多相位自适应信号 · 绿波带协调</div>
      </div>
    </div>
    <div class="actions">
      <button id="btnPlay" class="btn">暂停</button>
      <button id="btnStep" class="btn ghost">单步 +5s</button>
      <button id="btnReset" class="btn ghost">重置</button>
      <button id="btnFit" class="btn ghost">全局视图</button>
      <label class="spd">仿真速度
        <select id="selSpeed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
    </div>
  </header>

  <main id="main">
    <section id="stage">
      <canvas id="cvMain"></canvas>
      <div class="hint">滚轮缩放 · 拖拽平移 · 双击聚焦路口 · 空格暂停</div>
    </section>
    <aside id="panel">
      <div id="tabs"></div>
      <div id="tabbody"></div>
    </aside>
  </main>

  <footer id="charts">
    <div class="cbox">
      <div class="ctitle">进口道排队长度（近 120 s）</div>
      <canvas id="cvQueue"></canvas>
    </div>
    <div class="cbox">
      <div class="ctitle">路口通行流量（近 120 s）</div>
      <canvas id="cvFlow"></canvas>
    </div>
    <div class="cbox wide">
      <div class="ctitle">绿波时距图 —— 车辆轨迹 / 绿灯窗口 / 绿波带</div>
      <canvas id="cvTS"></canvas>
    </div>
  </footer>
</div>

<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/ped.js"></script>
<script src="js/signal.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

<!-- source: deepdemos.top | author: public | title: 微观城市交通十字路口数字孪生仿真系统 -->
</body>
</html>
