<script type="module">
import * as THREE from 'three';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础场景 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf3ead6, 50, 230);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 700);

/* ================= 灯光（跟随主角，保证身边始终有影子） ================= */
const hemi = new THREE.HemisphereLight(0xcfe5ff, 0x9a8a6a, 0.85);

const SUN_DIR = new THREE.Vector3(6, 10, 5).normalize();
const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 90 });
sun.shadow.bias = -0.0004;

const rim = new THREE.DirectionalLight(0xffd2a0, 1.3);
rim.position.set(-4, 5.5, -6);

const lampBulbs = [];

/* ================= 合成音效（WebAudio，无素材） ================= */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
addEventListener('pointerdown', audio);
function sfx(kind) {
  const c = audio(); if (!c || c.state !== 'running') return;
  const t0 = c.currentTime;
  const g = c.createGain(); g.connect(c.destination);
  try {
    if (kind === 'swing') {
      const len = Math.floor(0.12 * c.sampleRate);
      const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
      f.frequency.setValueAtTime(900, t0);
      f.frequency.exponentialRampToValueAtTime(2600, t0 + 0.1);
      g.gain.setValueAtTime(0.12, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
      src.connect(f); f.connect(g); src.start(t0);
    } else if (kind === 'hit') {
      const o = c.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(220, t0);
      o.frequency.exponentialRampToValueAtTime(70, t0 + 0.14);
      g.gain.setValueAtTime(0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.connect(g); o.start(t0); o.stop(t0 + 0.17);
    } else if (kind === 'move') {
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(520, t0);
      o.frequency.exponentialRampToValueAtTime(780, t0 + 0.06);
      g.gain.setValueAtTime(0.06, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
      o.connect(g); o.start(t0); o.stop(t0 + 0.1);
    } else if (kind === 'hurt' || kind === 'down') {
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(kind === 'down' ? 220 : 300, t0);
      o.frequency.exponentialRampToValueAtTime(kind === 'down' ? 60 : 110, t0 + (kind === 'down' ? 0.5 : 0.2));
      g.gain.setValueAtTime(0.13, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + (kind === 'down' ? 0.55 : 0.22));
      o.connect(g); o.start(t0); o.stop(t0 + 0.6);
    } else if (kind === 'level') {
      [[660, 0], [990, 0.09], [1320, 0.18]].forEach(([fr, dl]) => {
        const o = c.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(fr, t0 + dl);
        const gg = c.createGain();
        gg.gain.setValueAtTime(0.001, t0 + dl);
        gg.gain.exponentialRampToValueAtTime(0.14, t0 + dl + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.001, t0 + dl + 0.3);
        o.connect(gg); gg.connect(c.destination);
        o.start(t0 + dl); o.stop(t0 + dl + 0.32);
      });
    }
  } catch (e) {}
}

/* ================= 低多边形工具 ================= */
function hash(x, y, z, s = 0) {
  const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + s * 53.17) * 43758.5453;
  return n - Math.floor(n);
}
let seedSeq = 0;
function jitter(geo, amount = 0.025, seed = seedSeq++) {
  geo.deleteAttribute('uv');
  geo.deleteAttribute('normal');
  const g = mergeVertices(geo);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i,
      x + (hash(x, y, z, seed)     - 0.5) * 2 * amount,
      y + (hash(x, y, z, seed + 1) - 0.5) * 2 * amount,
      z + (hash(x, y, z, seed + 2) - 0.5) * 2 * amount);
  }
  g.computeVertexNormals();
  return g;
}

const allMats = [];
const M = (color, opt = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.92, metalness: 0.04, ...opt });
  allMats.push(m);
  return m;
};

const C = {
  skin: 0xf1c19d, skinLight: 0xf7cfa9,
  hair: 0x4a2c1a, eye: 0x2a2a2e, mouth: 0x8a4a3a, blush: 0xf2a484,
  armor: 0x2f8f83, armorDark: 0x1f6b62, pants: 0x4a5268,
  boot: 0x5a3a26, leather: 0x6e4d2f,
  gold: 0xe2a93e, gem: 0xd8434f,
  cape: 0xb8433f, steel: 0xe8edf3, steelDark: 0x9fb0c0,
  wood: 0x8a5a34, grass1: 0xa3cf70, grass2: 0x749f4a,
  rock: 0x9aa1a8, trunk: 0x6e4b2e, leaf: 0x4f8f4f, leaf2: 0x5ea055,
  dirt: 0x9b7f56
};

/* ================= 球形星球世界 ================= */
const R = 80;                       // 行星半径：绕行一周约 500 步距
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const dirAt = (az, y = 0.05) => new THREE.Vector3(Math.cos(az), y, Math.sin(az)).normalize();
const randDir = () => {
  const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - z * z);
  return new THREE.Vector3(r * Math.cos(a), z, r * Math.sin(a));
};
function tangentBasis(dir) {
  const n = dir.clone().normalize();
  const t1 = new THREE.Vector3().crossVectors(n, Math.abs(n.y) < 0.9 ? Y_AXIS : new THREE.Vector3(1, 0, 0)).normalize();
  const t2 = new THREE.Vector3().crossVectors(n, t1).normalize();
  return { n, t1, t2 };
}
function offsetDir(dir, u, v) { // 沿切平面偏移后的新方向
  const { n, t1, t2 } = tangentBasis(dir);
  return n.clone().multiplyScalar(R).addScaledVector(t1, u).addScaledVector(t2, v).normalize();
}
function surfaceQuat(dir) {
  return new THREE.Quaternion().setFromUnitVectors(Y_AXIS, dir.clone().normalize());
}
function placeOnPlanet(obj, dir, yaw = 0, lift = 0) {
  const d = dir.clone().normalize();
  obj.position.copy(d).multiplyScalar(terrainHeight(d) + lift);
  obj.quaternion.copy(surfaceQuat(d));
  if (yaw) obj.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(Y_AXIS, yaw));
  scene.add(obj);
}
function faceTangent(obj, dir, target) { // 让物体局部 +Z 朝向切面上的 target
  const up = dir.clone().normalize();
  const z = target.clone().sub(up.clone().multiplyScalar(target.dot(up))).normalize();
  const x = new THREE.Vector3().crossVectors(up, z);
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, up, z));
}

// 兴趣点分布：均匀绕星球一圈
const SITE = {
  hero:      dirAt(0, 0.06),
  nestSlime: dirAt(0.8, 0.18),
  villageA:  dirAt(1.9, 0.2),
  town:      dirAt(3.0, -0.18),
  nestShroom: dirAt(4.0, -0.3),
  villageB:  dirAt(5.1, 0.28),
  nestImp:   dirAt(5.9, -0.15)
};
const zones = [
  { dir: SITE.town, r: 9, color: new THREE.Color(0xc9b48a) },
  { dir: SITE.villageA, r: 6.5, color: new THREE.Color(0xbfa87e) },
  { dir: SITE.villageB, r: 6.5, color: new THREE.Color(0xbfa87e) },
  { dir: SITE.nestSlime, r: 4.2, color: new THREE.Color(0x5e6e46) },
  { dir: SITE.nestImp, r: 4.2, color: new THREE.Color(0x54583e) },
  { dir: SITE.nestShroom, r: 4.2, color: new THREE.Color(0x6b5a3e) }
];
function nearSite(dir) { // 是否落在某个兴趣点的空地内（散布时避让）
  return zones.some(z => dir.dot(z.dir) > Math.cos(z.r / R + 0.015));
}

/* ---- 地形高度场：大陆起伏 + 山脉 + 河流 + 聚落平整 ---- */
const SEA_R = R - 1.6; // 海平面：低于它的洼地成为湖泊
const X_AXIS = new THREE.Vector3(1, 0, 0);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
function vnoise(x, y, z) { // 平滑值噪声（网格 hash + 三线性插值）
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const h = (i, j, k) => hash(xi + i, yi + j, zi + k, 7.3);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(h(0, 0, 0), h(1, 0, 0), u), l(h(0, 1, 0), h(1, 1, 0), u), v),
    l(l(h(0, 0, 1), h(1, 0, 1), u), l(h(0, 1, 1), h(1, 1, 1), u), v), w);
}
// 山脉：远离所有聚落，高大醒目
const MOUNTAINS = [];
for (let i = 0; i < 8; i++) {
  for (let tries = 0; tries < 60; tries++) {
    const d = randDir();
    if (!zones.some(z => d.dot(z.dir) > Math.cos((z.r + 22) / R))) {
      MOUNTAINS.push({ dir: d, cosR: Math.cos(16 / R), h: 9 + Math.random() * 5, s: Math.random() * 20 });
      break;
    }
  }
}
// 海盆：两大片真正的海洋
const OCEANS = [];
for (let i = 0; i < 2; i++) {
  for (let tries = 0; tries < 80; tries++) {
    const d = randDir();
    if (zones.some(z => d.dot(z.dir) > Math.cos((z.r + 48) / R))) continue;
    if (OCEANS.some(o => d.dot(o.dir) > Math.cos(85 / R))) continue;
    OCEANS.push({ dir: d, cosR: Math.cos(40 / R), depth: 6 + Math.random() * 2.5 });
    break;
  }
}
// 河流：发源于山地半坡，沿最陡下坡蜿蜒追踪直到入海（水往低处流）
const RIVERS = [];        // { pts: [单位方向路径], w: [各点半宽] }
const riverSegs = [];     // { a, b, hw, dep } 河道线段（单位向量）
const riverGrid = new Map();
const RGRID = 16;
function rCell(v) {
  const ix = THREE.MathUtils.clamp(Math.floor((v.x * 0.5 + 0.5) * RGRID), 0, RGRID - 1);
  const iy = THREE.MathUtils.clamp(Math.floor((v.y * 0.5 + 0.5) * RGRID), 0, RGRID - 1);
  const iz = THREE.MathUtils.clamp(Math.floor((v.z * 0.5 + 0.5) * RGRID), 0, RGRID - 1);
  return ix + iy * RGRID + iz * RGRID * RGRID;
}
function chaikin(pts, iter) { // 切角平滑 → 天然蜿蜒
  for (let it = 0; it < iter; it++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      out.push(new THREE.Vector3().copy(a).lerp(b, 0.27).normalize(),
               new THREE.Vector3().copy(a).lerp(b, 0.73).normalize());
    }
    out.push(pts[pts.length - 1]);
    pts = out;
  }
  return pts;
}
for (let n = 0; n < 5; n++) {
  for (let tries = 0; tries < 90; tries++) {
    const src = randDir();
    const h0 = baseHeight(src);
    if (h0 < R + 2.5 || h0 > R + 7.5) continue;          // 只从山地半坡发源
    if (nearSite(src)) continue;
    if (RIVERS.some(r => r.pts[0].angleTo(src) * R < 30)) continue; // 河源彼此远离
    let cur = src.clone();
    const pts = [cur.clone()];
    let stuck = 0;
    for (let step = 0; step < 520; step++) {
      const { t1, t2 } = tangentBasis(cur);
      const seedA = step * 0.7 + n * 2.4;
      let best = null, bestH = Infinity;
      for (let k = 0; k < 12; k++) {
        const a = seedA + k / 12 * Math.PI * 2;
        const cand = new THREE.Vector3().copy(cur).multiplyScalar(R)
          .addScaledVector(t1, Math.cos(a) * 1.5).addScaledVector(t2, Math.sin(a) * 1.5).normalize();
        if (nearSite(cand)) continue;                     // 绕开聚落
        const hh = baseHeight(cand);
        if (hh < bestH) { bestH = hh; best = cand; }
      }
      if (!best) break;
      if (bestH > baseHeight(cur) - 0.004) {              // 无更低邻域
        if (++stuck > 2) break;                           // 陷入洼地，河流止于此
      } else stuck = 0;
      pts.push(best.clone());
      cur = best;
      if (baseHeight(cur) < SEA_R + 0.12) break;          // 入海
    }
    if (pts.length < 40) continue;                        // 太短不成河
    const smooth = chaikin(pts, 2);
    const len = smooth.length;
    const w = smooth.map((_, i) => (0.55 + (i / (len - 1)) * 1.5) * // 越下游越宽
      (i > len - 7 ? Math.max(0.3, (len - 1 - i) / 6) : 1));          // 消失端收窄

// 展开成线段，登记到空间网格（包围盒外扩 5m，保证邻近查询命中）
for (const r of RIVERS) {
  for (let i = 0; i < r.pts.length - 1; i++) {
    const seg = {
      a: r.pts[i], b: r.pts[i + 1],
      hw: (r.w[i] + r.w[i + 1]) / 2,
      dep: 1.0 + (i / r.pts.length) * 1.5 // 越下游切得越深
    };
    riverSegs.push(seg);
    const mrg = 5 / R / 2;
    const x0 = Math.floor((Math.min(seg.a.x, seg.b.x) * 0.5 + 0.5 - mrg) * RGRID),
          x1 = Math.floor((Math.max(seg.a.x, seg.b.x) * 0.5 + 0.5 + mrg) * RGRID);
    const y0 = Math.floor((Math.min(seg.a.y, seg.b.y) * 0.5 + 0.5 - mrg) * RGRID),
          y1 = Math.floor((Math.max(seg.a.y, seg.b.y) * 0.5 + 0.5 + mrg) * RGRID);
    const z0 = Math.floor((Math.min(seg.a.z, seg.b.z) * 0.5 + 0.5 - mrg) * RGRID),
          z1 = Math.floor((Math.max(seg.a.z, seg.b.z) * 0.5 + 0.5 + mrg) * RGRID);
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) for (let gz = z0; gz <= z1; gz++) {
      if (gx < 0 || gy < 0 || gz < 0 || gx >= RGRID || gy >= RGRID || gz >= RGRID) continue;
      const key = gx + gy * RGRID + gz * RGRID * RGRID;
      let list = riverGrid.get(key);
      if (!list) riverGrid.set(key, list = []);
      list.push(seg);

function baseHeight(d) { // 基础地形（不含河流/平整）
  let h = (vnoise(d.x * 1.35 + 7, d.y * 1.35 + 3, d.z * 1.35 + 11) - 0.5) * 8.5
        + (vnoise(d.x * 3.6 + 2, d.y * 3.6 + 9, d.z * 3.6 + 5) - 0.5) * 3.1
        + (vnoise(d.x * 9 + 4, d.y * 9 + 1, d.z * 9 + 8) - 0.5) * 1.0;
  for (const m of MOUNTAINS) {
    const k = (d.dot(m.dir) - m.cosR) / (1 - m.cosR);
    if (k > 0) {
      const ridge = 1 - Math.abs(vnoise(d.x * 6 + m.s, d.y * 6 + m.s * 1.7, d.z * 6 - m.s) - 0.5) * 2;
      h += m.h * k * k * (0.5 + 0.5 * ridge);
    }
  }
  for (const o of OCEANS) {
    const k = (d.dot(o.dir) - o.cosR) / (1 - o.cosR);
    if (k > 0) {
      const kk = Math.min(k * 1.5, 1);
      h -= o.depth * (kk * kk * (3 - 2 * kk));
    }
  }
  return R + h;
}
const zoneFlat = zones.map(z => ({
  dir: z.dir, h: Math.max(baseHeight(z.dir), SEA_R + 0.55),
  cosIn: Math.cos((z.r + 2.2) / R), cosOut: Math.cos(z.r / R)
}));
function terrainHeight(d) { // 单位方向 → 地表半径（所有物件/角色共用地形函数）
  let h = baseHeight(d);
  h -= riverCarve(d); // 河道下切
  for (const z of zoneFlat) {
    const a = d.dot(z.dir);
    if (a > z.cosOut) {
      const k = THREE.MathUtils.smoothstep(a, z.cosOut, z.cosIn); // 边缘 0 → 中心 1
      h += (z.h - h) * k;
    }
  }
  return h;
}
const rd1 = new THREE.Vector3(), rd2 = new THREE.Vector3();
function riverCarve(d) { // d 到最近河段的下切深度（无河道返回 0）
  const list = riverGrid.get(rCell(d));
  if (!list) return 0;
  let best = 0;
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    rd1.subVectors(s.b, s.a);
    const L2 = rd1.lengthSq();
    rd2.subVectors(d, s.a);
    const tt = THREE.MathUtils.clamp(rd2.dot(rd1) / L2, 0, 1);
    rd2.subVectors(d, s.a).addScaledVector(rd1, tt);
    const dist = rd2.length() * R;
    const k = 1 - dist / (s.hw * 2.1);
    if (k > 0) best = Math.max(best, s.dep * k * k * (3 - 2 * k));
  }
  return best;
}
function riverDist(d) { // 到最近河道中心线的地表距离（米），附近无河返回 Infinity
  const list = riverGrid.get(rCell(d));
  if (!list) return Infinity;
  let best = Infinity;
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    rd1.subVectors(s.b, s.a);
    const L2 = rd1.lengthSq();
    rd2.subVectors(d, s.a);
    const tt = THREE.MathUtils.clamp(rd2.dot(rd1) / L2, 0, 1);
    rd2.subVectors(d, s.a).addScaledVector(rd1, tt);
    best = Math.min(best, rd2.length() * R);
  }
  return best;
}

/* ---- 贴地水带/道路通用构建：dirFn(u) 给出路径方向 ---- */
function surfaceRibbon(dirFn, steps, halfW, mat, lift = 0.06) {
  const pos = [], idx = [];
  const up = new THREE.Vector3(), side = new THREE.Vector3(),
        prev = new THREE.Vector3(), next = new THREE.Vector3(), pd = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    up.copy(dirFn(u)).normalize();
    prev.copy(dirFn(u - 0.004)).normalize();
    next.copy(dirFn(u + 0.004)).normalize();
    side.crossVectors(up, next.sub(prev)).normalize();
    const hw = typeof halfW === 'function' ? halfW(u) : halfW;
    for (const s of [-1, 1]) {
      pd.copy(up).addScaledVector(side, s * hw / R).normalize();
      const h = terrainHeight(pd) + lift;
      pos.push(pd.x * h, pd.y * h, pd.z * h);
    }
  }
  for (let i = 0; i < steps; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, mat);
  scene.add(mesh);
  return mesh;
}

function polyDir(pts, u) {
  const f = THREE.MathUtils.clamp(u, 0, 1) * (pts.length - 1);
  const i = Math.min(Math.floor(f), pts.length - 2);
  return new THREE.Vector3().copy(pts[i]).lerp(pts[i + 1], f - i);
}

    u => {

}

function addRoad(a, b) {

  if (n.lengthSq() < 1e-6) return;
  ROADS.push({ a: a.clone(), b: b.clone(), arcLen: arc, n });
  surfaceRibbon(u => new THREE.Vector3().copy(a).lerp(b, u), Math.max(24, Math.ceil(arc * 26)), 1.0, mRoad, 0.05);
}

/* ---- 散布自然元素（共享材质+合并几何：整片森林只占几个 draw call） ---- */
function scatterMerged(makeFn, count, minScale, maxScale, opts = {}) {
  const buckets = new Map();
  for (let i = 0; i < count; i++) {
    const dir = randDir();
    if (nearSite(dir)) continue;
    if (roadDist(dir) < 2.2) continue; // 不长在路中央
    const h = terrainHeight(dir);
    if (h < SEA_R + 0.3) continue; // 水下不种
    if (riverDist(dir) < 2.8) continue; // 河道避让
    if (opts.maxSlope != null) {
      const s1 = Math.abs(terrainHeight(offsetDir(dir, 0.6, 0)) - h);
      const s2 = Math.abs(terrainHeight(offsetDir(dir, 0, 0.6)) - h);
      if (Math.max(s1, s2) / 0.6 > opts.maxSlope) continue; // 陡坡不长
    }
    if (opts.tree && h > R + 4.8) continue; // 树线以上不长树
    if (opts.forest &&
        vnoise(dir.x * 1.9 + 9, dir.y * 1.9 + 4, dir.z * 1.9 + 2) < 0.42 && Math.random() < 0.7) continue;
    const obj = makeFn(minScale + Math.random() * (maxScale - minScale));
    placeOnPlanet(obj, dir, Math.random() * Math.PI * 2, 0);
    obj.updateMatrixWorld(true);
    obj.traverse(o => {
      if (!o.isMesh) return;
      let arr = buckets.get(o.material);
      if (!arr) buckets.set(o.material, arr = []);
      const geo = o.geometry.clone();
      geo.applyMatrix4(o.matrixWorld);
      arr.push(geo);
    });
    scene.remove(obj); // 模板烘进合并结果，原物不再渲染
  }
  for (const [mat, geos] of buckets) {
    const merged = mergeGeometries(geos, false);
    if (merged) scene.add(new THREE.Mesh(merged, mat));
  }
}

function doAttackHit() {
  const q = new THREE.Quaternion().setFromAxisAngle(Y_AXIS, facing).premultiply(heroRoot.quaternion);
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
  for (const m of monsters) {
    if (m.dead) continue;
    const to = new THREE.Vector3().subVectors(m.g.position, heroRoot.position);
    if (to.length() < 2.3 && to.normalize().dot(fwd) > 0.25) {
      m.hp--;
      m.hitT = 0.3;
      m.angryT = 7;
      m.bar.fg.scale.x = Math.max(m.hp / m.maxHp, 0.001);
      m.kb.copy(to).multiplyScalar(2.4);
      spawnShards(m.g.position.clone(), 6, 0xffc966);
      sfx('hit');
      for (const near of monsters) { // 同伴仇恨
        if (!near.dead && near !== m && near.g.position.distanceTo(m.g.position) < 6) near.angryT = Math.max(near.angryT, 6);
      }
      if (m.hp <= 0) {
        if (attackTarget === m) attackTarget = null;
        m.dead = true;
        m.respawnT = 5;
        m.g.visible = false;
        m.bar.g.visible = false;
        spawnShards(m.g.position.clone(), 12, 0xff8866);
        kills++;
        killsEl.textContent = `👹 击败 ${kills}`;
        spawnOrbs(m.g.position, 4);
        saveGame();
      }
    }
  }
}

      const mid = p1.clone().add(p2).multiplyScalar(0.5);
      const dropLen = p1.distanceTo(p2) + 0.4;
      const w = (r.w[i] + r.w[i + 1]) * 1.2;
      const sheet = new THREE.Mesh(new THREE.PlaneGeometry(w, dropLen), new THREE.MeshBasicMaterial(mFallBase));
      sheet.position.copy(mid);
      const side = new THREE.Vector3().crossVectors(p2.clone().sub(p1), mid.clone().normalize()).normalize();
      sheet.lookAt(mid.clone().add(side));
      scene.add(sheet);
      const foam = new THREE.Mesh(new THREE.CircleGeometry(w * 0.85, 12), new THREE.MeshBasicMaterial(mFoamBase));
      foam.position.copy(p2).addScaledVector(mid.clone().normalize(), 0.06);
      foam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), mid.clone().normalize());
      scene.add(foam);
      waterfalls.push({ sheet, foam, phase: Math.random() * 6.28 });
    }
  }
}

/* ---- 野鹿：林间出没，见人就跑 ---- */
const deers = [];
function makeDeer(dir) {
  const g = new THREE.Group();
  const c = M(0xb98a5a), cd = M(0x8a6238);
  const body = new THREE.Mesh(jitter(new THREE.SphereGeometry(0.22, 7, 5), 0.015), c);
  body.scale.set(0.9, 0.9, 1.5);
  body.position.y = 0.42;
  const neck = new THREE.Mesh(jitter(new THREE.CylinderGeometry(0.05, 0.07, 0.28, 5), 0.008), c);
  neck.position.set(0, 0.62, 0.24);
  neck.rotation.x = -0.5;
  const head = new THREE.Mesh(jitter(new THREE.SphereGeometry(0.09, 6, 5), 0.008), cd);
  head.position.set(0, 0.74, 0.34);
  g.add(body, neck, head);
  for (const sx of [-0.045, 0.045]) { // 鹿的眼睛
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.028, 0.01), mEyeS);
    eye.position.set(sx, 0.75, 0.41);
    g.add(eye);
  }
  for (const sx of [-1, 1]) {
    const ant = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.18, 4), cd);
    ant.position.set(0.05 * sx, 0.86, 0.3);
    ant.rotation.z = 0.35 * sx;
    g.add(ant);
  }
  for (const [lx, lz] of [[-0.09, 0.16], [0.09, 0.16], [-0.09, -0.16], [0.09, -0.16]]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.025, 0.3, 4), cd);
    leg.position.set(lx, 0.15, lz);
    g.add(leg);
  }
  g.scale.setScalar(1.25);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  placeOnPlanet(g, dir, Math.random() * Math.PI * 2, 0);
  deers.push({ g, dir: dir.clone(), home: dir.clone(), state: 'idle', stateT: 1 + Math.random() * 2,
    target: null, flee: false, bob: Math.random() * 6.28 });
}
for (let i = 0; i < 8; i++) {
  for (let tries = 0; tries < 50; tries++) {
    const dir = randDir();
    if (nearSite(dir) || terrainHeight(dir) < SEA_R + 0.4 || riverDist(dir) < 2.5) continue;
    if (vnoise(dir.x * 1.9 + 9, dir.y * 1.9 + 4, dir.z * 1.9 + 2) < 0.5) continue; // 只出没于森林

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
let shown = false;
const heroUp = new THREE.Vector3();
// 热循环复用的临时对象（避免每帧分配触发 GC 卡顿）
const TV1 = new THREE.Vector3(), TV2 = new THREE.Vector3(), TV3 = new THREE.Vector3(),
      TV4 = new THREE.Vector3(), TV5 = new THREE.Vector3(), TV6 = new THREE.Vector3(),
      TV7 = new THREE.Vector3();
const TQ1 = new THREE.Quaternion();
const TM1 = new THREE.Matrix4();
const RIM_DIR = new THREE.Vector3(-4, 5.5, -6).normalize();
const FILL_DIR = new THREE.Vector3(-5, 4, -4).normalize();

function flutter(geo, base, amp, swayX, t, speed, freq) {
  const pos = geo.attributes.position, h = geo.parameters.height;
  for (let i = 0; i < pos.count; i++) {
    const x = base[i * 3], y = base[i * 3 + 1];
    const fall = (h / 2 - y) / h;
    const s = Math.sin(t * speed + y * freq + x * 1.8) * 0.5 + 0.5;
    pos.setXYZ(i, x + Math.sin(t * 1.5 + y * 1.4) * swayX * fall, y, -(s * amp) * fall * fall);
  }
  pos.needsUpdate = true;
}

const P = { aLx: 0, aLz: 0.14, eL: 0, aRx: 0, aRz: -0.14, eR: 0,
            lLx: 0, kL: 0, lRx: 0, kR: 0, hLx: 0, hRy: 0, hLz: 0, lean: 0, bob: 0.04, squash: 1 };

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  modeT += dt;

  heroUp.copy(heroRoot.position).normalize();

  /* ---- 主角生命计时：无敌帧 / 脱战回血 / 倒下流程 ---- */
  if (heroInv > 0) heroInv -= dt;
  if (heroHp < heroHpMax && heroDownT < 0) {
    heroRegenT -= dt;
    if (heroRegenT <= 0) { heroHp++; heroRegenT = 6; updateHearts(); }
  }
  if (heroDownT >= 0) {
    heroDownT -= dt;
    if (!heroDownMoved && heroDownT < 0.8) { heroDownMoved = true; heroRespawn(); }
    if (heroDownT <= 0) { heroDownT = -1; downEl.style.opacity = 0; }
  }
  /* ---- 点击目标移动（纯鼠标） ---- */
  if (attackTarget && attackTarget.dead) attackTarget = null;
  let ordered = false;
  if (heroDownT < 0 && (hasMoveTarget || attackTarget) && (mode === 'idle' || mode === 'run' || mode === 'air' ||
      ((mode === 'dance' || mode === 'nap' || mode === 'stretch') && grounded))) {
    if (mode === 'dance' || mode === 'nap' || mode === 'stretch') {
      mode = 'run'; modeT = 0;
      document.getElementById('btnDance').classList.remove('on');
    }
    ordered = true;
    const tgtPos = attackTarget ? attackTarget.g.position : TV7.copy(moveTarget).multiplyScalar(terrainHeight(moveTarget));
    const arrive = attackTarget ? 2.0 : 0.45;
    TV6.copy(tgtPos).sub(heroRoot.position);
    TV6.addScaledVector(heroUp, -TV6.dot(heroUp)); // 切面水平距离（忽略地形高差）
    if (grounded && TV6.length() <= arrive) {
      if (attackTarget) startAttack(); // 走到怪物身边再出手
      hasMoveTarget = false; attackTarget = null;
    } else {
      // 沿球面朝目标切向移动
      TV3.copy(tgtPos).sub(heroRoot.position).addScaledVector(heroUp, -TV3.dot(heroUp)).normalize();
      TV4.crossVectors(heroRoot.position, TV3).normalize();
      heroRoot.position.applyAxisAngle(TV4, WALK_SPEED * speedBoost() * dt / R);
      heroRoot.quaternion.setFromUnitVectors(Y_AXIS, heroUp.copy(heroRoot.position).normalize());
      if (grounded && mode === 'idle') { mode = 'run'; modeT = 0; }
      // 面朝移动方向
      TV5.set(0, 0, 1).applyQuaternion(heroRoot.quaternion).applyAxisAngle(heroUp, facing);
      TV2.crossVectors(TV5, TV3);
      const ang = Math.atan2(TV2.dot(heroUp), TV5.dot(TV3));
      facing = lerpAngle(facing, facing + ang, Math.min(dt * 12, 1));
    }
  } else if (mode === 'run' && grounded) {
    mode = 'idle'; modeT = 0;
  }
  // 静止时保持最后朝向，不自动转向相机

  /* ---- 跳跃物理 ---- */
  if (!grounded) {
    vy -= 20 * dt;
    jumpY += vy * dt;
    if (jumpY <= 0) {
      jumpY = 0; vy = 0; grounded = true;
      squashCur = 0.86;
      mode = ordered ? 'run' : 'idle'; modeT = 0;
    }
  }

  /* ---- 攻击前滑（沿面向小幅突进） ---- */
  if (mode === 'attack' && grounded) {
    const slide = Math.sin(Math.min(modeT / DUR.attack, 1) * Math.PI) * 1.5;
    if (slide > 0.01) {
      TV3.set(0, 0, 1).applyQuaternion(heroRoot.quaternion).applyAxisAngle(heroUp, facing);
      TV4.crossVectors(heroRoot.position, TV3).normalize();
      heroRoot.position.applyAxisAngle(TV4, slide * dt / R);
    }
  }

  /* ---- 贴合地形高度（湖泊里则趟水） ---- */
  TV6.copy(heroRoot.position).normalize();
  heroRoot.position.setLength(Math.max(terrainHeight(TV6), SEA_R - 0.35) + 0.02);

  /* ---- 一次性动作计时 ---- */
  if (mode === 'attack' && !attackHitDone && modeT > 0.22) { attackHitDone = true; doAttackHit(); }
  if ((mode === 'attack' && modeT > DUR.attack) ||
      (mode === 'stretch' && modeT > DUR.stretch) ||
      (mode === 'nap' && modeT > DUR.nap)) {
    mode = (hasMoveTarget || attackTarget) ? 'run' : 'idle'; modeT = 0;
  }
  if (waveT >= 0) { waveT += dt; if (waveT > 2.4) waveT = -1; }

  /* ---- 各模式姿势 ---- */
  const rt = t * 11;
  P.aLx = 0; P.aLz = 0.14; P.eL = 0; P.aRx = 0; P.aRz = -0.14; P.eR = 0;
  P.lLx = 0; P.kL = 0; P.lRx = 0; P.kR = 0; P.hLx = 0; P.hRy = 0; P.hLz = 0;
  P.lean = 0; P.bob = 0.04; P.squash = 1;

  if (mode === 'idle') {
    P.bob = 0.04 + Math.sin(t * 1.7) * 0.04;
    P.aLz = 0.14 + Math.sin(t * 1.7 + 0.6) * 0.045;
    P.aLx = Math.sin(t * 1.7 + 1.1) * 0.06;
    P.aRz = -0.14 - Math.sin(t * 1.7 + 0.2) * 0.045;
    P.aRx = Math.sin(t * 1.7 + 0.5) * 0.06;
    P.hRy = Math.sin(t * 0.5) * 0.16;
    P.hLx = Math.sin(t * 0.83) * 0.05;
  } else if (mode === 'run') {
    P.lLx = Math.sin(rt) * 0.75; P.lRx = -Math.sin(rt) * 0.75;
    P.kL = Math.max(0, -Math.sin(rt)) * 0.9; P.kR = Math.max(0, Math.sin(rt)) * 0.9;
    P.aLx = -Math.sin(rt) * 0.6; P.aRx = Math.sin(rt) * 0.6;
    P.eL = P.eR = -0.7;
    P.bob = Math.abs(Math.sin(rt)) * 0.07;
    P.lean = 0.14;
  } else if (mode === 'air') {
    const f = THREE.MathUtils.clamp(vy / 6.8, -1, 1); // 1 上升 → -1 下落
    if (hasMoveTarget || attackTarget) {
      // 带速度的前跃：迈步腾空、身体前倾、手臂后摆
      P.lLx = -0.75 + (1 - f) * 0.3;
      P.kL = 0.4 + (1 - f) * 0.55;
      P.lRx = 0.4; P.kR = 1.35;
      P.aLx = 0.5 + Math.max(-f, 0) * 0.4;
      P.aRx = 0.5 + Math.max(-f, 0) * 0.4;
      P.eL = P.eR = -0.25;
      P.aLz = 0.3; P.aRz = -0.3;
      P.lean = 0.2;
    } else {
      // 原地跳：收腿、双臂上举
      P.lLx = P.lRx = -0.5 + (1 - f) * 0.3;
      P.kL = P.kR = 1.3 - (1 - f) * 0.9;
      P.aLz = 1.2 + Math.max(f, 0) * 1.1;
      P.aRz = -1.2 - Math.max(f, 0) * 1.1;
      P.eL = P.eR = -0.3;
      P.lean = -0.05;
    }
  } else if (mode === 'attack') {
    // 劈砍：手臂在矢状面内举剑过头 → 向前下方挥落（X 轴旋转）
    const w = Math.min(modeT / 0.15, 1);
    const s = THREE.MathUtils.clamp((modeT - 0.15) / 0.2, 0, 1);
    const rec = THREE.MathUtils.clamp((modeT - 0.35) / 0.2, 0, 1);
    const raise = -2.5 * w * (1 - s);
    const chop = 0.35 * s;
    P.aRx = 0.14 + raise + chop;
    P.aRz = -0.12 - 0.12 * w * (1 - rec);
    P.eR = -0.3 - 0.2 * w * (1 - s);
    P.aLx = 0.5 * w * (1 - s) - 0.35 * s;   // 左臂后摆平衡
    P.aLz = 0.14;
    P.lean = 0.08 * w + 0.16 * s * (1 - rec);
    P.hLx = 0.08 * s;
    P.lLx = 0.25 * s; P.lRx = -0.25 * s;    // 弓步
  } else if (mode === 'stretch') {
    const env = Math.sin(Math.min(modeT / DUR.stretch, 1) * Math.PI);
    P.aLz = 0.14 + env * 2.6; P.aRz = -0.14 - env * 2.6;
    P.eL = P.eR = 0;
    P.lean = -env * 0.16;
    P.hLx = -env * 0.25;
    P.bob = 0.04 + env * 0.03;
  } else if (mode === 'nap') {
    const env = Math.min(modeT / 0.8, 1) * THREE.MathUtils.clamp((DUR.nap - modeT) / 0.6, 0, 1);
    P.hLx = env * 0.42;
    P.lean = env * 0.1;
    P.aLz = 0.14 - env * 0.1; P.aRz = -0.14 + env * 0.1;
    P.eL = P.eR = -env * 0.06;
    P.bob = 0.03 + Math.sin(t * 1.2) * 0.025 * env;
  } else if (mode === 'dance') {
    const ph = modeT * 7;
    P.bob = Math.abs(Math.sin(ph)) * 0.09;
    P.aRz = -2.3 + Math.sin(ph) * 0.45;
    P.aLz = 2.3 + Math.sin(ph + Math.PI) * 0.45;
    P.eR = -0.5 + Math.sin(ph) * 0.2;
    P.eL = -0.5 - Math.sin(ph) * 0.2;
    P.lLx = Math.max(0, Math.sin(ph)) * 0.5;
    P.lRx = Math.max(0, -Math.sin(ph)) * 0.5;
    P.kL = Math.max(0, Math.sin(ph)) * 0.8;
    P.kR = Math.max(0, -Math.sin(ph)) * 0.8;
    P.hLz = Math.sin(ph * 0.5) * 0.18;
    P.hLx = Math.sin(ph) * 0.08;
    P.lean = Math.sin(ph) * 0.04;
  }
  if (waveT >= 0) {
    const p = waveT / 2.4;
    const env = Math.sin(Math.min(p, 1) * Math.PI);
    P.aRz = -0.14 - env * 2.5 - Math.sin(waveT * 11) * 0.22 * env;
    P.eR = -0.15;
  }

  /* ---- 姿势阻尼逼近 ---- */
  window.__mode = mode; window.__grounded = grounded;
  window.__monsters = monsters; window.__heroRoot = heroRoot;
  window.__camera = camera; window.__planetMesh = planetMesh;
  window.__navMove = hasMoveTarget; window.__navAtk = attackTarget;
  window.__humans = humans; window.__sheeps = sheeps; window.__campfires = campfires;
  window.__rivers = RIVERS; window.__terrainHeight = terrainHeight; window.__SEA_R = SEA_R;
  const k = 1 - Math.exp(-dt * 14);
  armL.rotation.x += (P.aLx - armL.rotation.x) * k;
  armL.rotation.z += (P.aLz - armL.rotation.z) * k;
  armL.elbow.rotation.x += (P.eL - armL.elbow.rotation.x) * k;
  armR.rotation.x += (P.aRx - armR.rotation.x) * k;
  armR.rotation.z += (P.aRz - armR.rotation.z) * k;
  armR.elbow.rotation.x += (P.eR - armR.elbow.rotation.x) * k;
  legL.hip.rotation.x += (P.lLx - legL.hip.rotation.x) * k;
  legL.knee.rotation.x += (P.kL - legL.knee.rotation.x) * k;
  legR.hip.rotation.x += (P.lRx - legR.hip.rotation.x) * k;
  legR.knee.rotation.x += (P.kR - legR.knee.rotation.x) * k;
  headGrp.rotation.x += (P.hLx - headGrp.rotation.x) * k;
  headGrp.rotation.y += (P.hRy - headGrp.rotation.y) * k;
  headGrp.rotation.z += (P.hLz - headGrp.rotation.z) * k;
  leanCur += (P.lean - leanCur) * k;
  bobCur += (P.bob - bobCur) * k;
  squashCur += (P.squash - squashCur) * (1 - Math.exp(-dt * 10));

  hero.rotation.y = facing;
  hero.rotation.x = leanCur;
  hero.position.y = jumpY + bobCur;
  hero.scale.set(1 + (1 - squashCur) * 0.5, squashCur, 1 + (1 - squashCur) * 0.5);

  const blink = (mode === 'nap' && modeT > 0.8) ? 0.1 : ((t % 3.7) < 0.12 ? 0.12 : 1);
  eyeL.scale.y = eyeR.scale.y = blink;
  ahoge.rotation.z = 0.25 + Math.sin(t * 2.1) * 0.12;

  flutter(capeGeo, capeBase, 0.3, 0.06, t, 2.4, 2.6);
  ribbons.forEach(({ mesh, base }, i) => {
    flutter(mesh.geometry, base, 0.16, 0.05, t + i * 1.7, 3.1, 3.2);
  });

  if (mode === 'nap' && modeT > 0.9 && modeT < DUR.nap - 0.7) {
    headGrp.getWorldPosition(tmpV);
    zzz.forEach((s, i) => {
      const tt = (t * 0.45 + i / 3) % 1;
      s.position.set(tmpV.x + 0.3 + Math.sin(t + i * 2) * 0.06, tmpV.y + 0.35 + tt * 0.8, tmpV.z);
      s.material.opacity = Math.sin(tt * Math.PI) * 0.85;
      const sc = 0.22 + tt * 0.16;
      s.scale.set(sc, sc, 1);
    });
  } else {
    zzz.forEach(s => s.material.opacity = 0);
  }

  /* ---- 怪物（球面巡逻） ---- */
  for (const m of monsters) {
    if (m.dead) {
      m.respawnT -= dt;
      if (m.respawnT <= 0) {
        m.dead = false; m.hp = m.maxHp; m.bar.fg.scale.x = 1;
        m.g.visible = true; m.bar.g.visible = true;
        m.dir.copy(m.home);
        m.target = randomTarget(m);
      }
      continue;
    }
    if (m.hitT > 0) {
      m.hitT -= dt;
      TV1.crossVectors(m.dir, m.kb).normalize();
      m.dir.applyAxisAngle(TV1, m.kb.length() * dt / R);
      m.kb.multiplyScalar(Math.max(0, 1 - dt * 5));
      m.bodyMat.emissive.setHex(0xff5533);
      m.bodyMat.emissiveIntensity = Math.max(m.hitT, 0) * 3;
    } else {
      m.bodyMat.emissiveIntensity = 0;
      m.retarget -= dt;
      if (m.angryT > 0) m.angryT -= dt;
      const dh = m.g.position.distanceTo(heroRoot.position);
      if ((dh < (m.aggro || 4.5) || m.angryT > 0) && dh < 20 && heroDownT < 0) {
        // 追击主角：面向并逼近，贴近就动手
        TV1.copy(heroRoot.position).sub(TV2.copy(m.dir).multiplyScalar(R));
        TV1.addScaledVector(m.dir, -TV1.dot(m.dir));
        if (TV1.lengthSq() > 1e-8) {
          TV1.normalize();
          TV2.crossVectors(m.dir, TV1).normalize();
          m.dir.applyAxisAngle(TV2, m.speed * 1.8 * dt / R);
          TV3.copy(m.dir).normalize();
          TV4.crossVectors(TV3, TV1).normalize();
          TV5.crossVectors(TV1, TV4);
          m.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV5, TV1));
        }
        m.atkCd -= dt;
        if (dh < 1.35 && m.atkCd <= 0) {
          m.atkCd = 1.35;
          heroHurt();
        }
      } else {
        // 目标方向（切平面内）
        TV1.copy(m.target).multiplyScalar(R).sub(TV2.copy(m.dir).multiplyScalar(R));
        TV1.addScaledVector(m.dir, -TV1.dot(m.dir));
        if (TV1.length() < 0.4 || m.retarget <= 0) { m.target = randomTarget(m); m.retarget = 3 + Math.random() * 4; }
        else {
          TV1.normalize();
          TV2.crossVectors(m.dir, TV1).normalize();
          m.dir.applyAxisAngle(TV2, m.speed * dt / R);
          // 朝移动方向
          TV3.copy(m.dir).normalize();            // up
          TV4.crossVectors(TV3, TV1).normalize(); // x = up × z
          TV5.crossVectors(TV1, TV4);             // y = z × x
          m.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV5, TV1));
        }
      }
    }
    m.dir.normalize();
    // 类型高度与动画
    if (m.type === 'slime') {
      m.hopPhase += dt * 6;
      m.hover = Math.abs(Math.sin(m.hopPhase)) * 0.3;
      m.body.scale.y = 0.74 + Math.sin(m.hopPhase * 2) * 0.05;
    } else if (m.type === 'imp') {
      m.hover = 1.55 + Math.sin(t * 2 + m.phase) * 0.25;
      const flap = 0.35 + Math.sin(t * 13 + m.phase) * 0.55;
      m.wings[0].rotation.z = flap;
      m.wings[1].rotation.z = -flap;
    } else if (m.type === 'shroom') {
      m.hover = 0;
      m.body.rotation.z = Math.sin(t * 7 + m.phase) * 0.07;
    }
    m.g.position.copy(m.dir).multiplyScalar(Math.max(terrainHeight(m.dir), SEA_R - 0.35) + m.hover);
    // 血条面向相机
    m.bar.g.visible = true;
    m.bar.g.position.copy(m.g.position).addScaledVector(m.dir, m.barY);
    m.bar.g.quaternion.copy(camera.quaternion);
  }

  /* ---- 碎片粒子 ---- */
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.life -= dt;
    if (s.life <= 0) { scene.remove(s.mesh); shards.splice(i, 1); continue; }
    s.v.y -= 12 * dt;
    s.mesh.position.addScaledVector(s.v, dt);
    s.mesh.rotation.x += s.rv * dt;
    s.mesh.rotation.y += s.rv * 0.8 * dt;
    s.mesh.scale.setScalar(Math.max(s.size * Math.min(s.life / 0.3, 1), 0.001));
  }

  /* ---- 经验魂球：盘旋片刻后飞向主角 ---- */
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt;
    o.m.rotation.y += dt * 5;
    o.m.scale.setScalar(0.85 + Math.sin(t * 8 + o.spin) * 0.2);
    if (o.t < 0) continue;
    TV1.copy(heroRoot.position).addScaledVector(heroUp, 0.9);
    o.m.position.lerp(TV1, 1 - Math.exp(-dt * (3 + Math.max(o.t, 0) * 4)));
    if (o.m.position.distanceTo(TV1) < 0.45) {
      scene.remove(o.m);
      orbs.splice(i, 1);
      gainXp(10);
      sfx('move');
    }
  }

  /* ---- 脚印：行走时落下并渐隐 ---- */
  if (grounded && mode === 'run' && heroDownT < 0) {
    footT -= dt;
    if (footT <= 0) {
      footT = 0.17;
      footSide *= -1;
      const f = footPool[footI++ % footPool.length];
      TV1.copy(heroRoot.position).normalize();
      TV3.set(0, 0, 1).applyQuaternion(heroRoot.quaternion).applyAxisAngle(TV1, facing);
      TV2.crossVectors(TV3, TV1).normalize();
      f.position.copy(heroRoot.position).addScaledVector(TV1, 0.045).addScaledVector(TV3, 0.14).addScaledVector(TV2, 0.1 * footSide);
      f.quaternion.setFromUnitVectors(Z_AXIS, TV1);
      f.rotateZ(facing);
      f.userData.life = 4;
      f.visible = true;
    }
  }
  for (const f of footPool) {
    if (!f.visible) continue;
    f.userData.life -= dt;
    f.material.opacity = Math.min(f.userData.life / 4, 1) * 0.4;
    if (f.userData.life <= 0) f.visible = false;
  }

  /* ---- 瀑布水帘脉动 ---- */
  for (const wf of waterfalls) {
    wf.sheet.material.opacity = 0.55 + Math.sin(t * 3 + wf.phase) * 0.12;
    wf.foam.material.opacity = 0.45 + Math.sin(t * 5 + wf.phase) * 0.15;
  }

  /* ---- 野鹿：林间游荡，见人远遁 ---- */
  for (const dr of deers) {
    dr.stateT -= dt;
    let moving = false;
    TV4.copy(dr.dir).multiplyScalar(terrainHeight(dr.dir));
    TV3.copy(heroRoot.position).sub(TV4);
    if (TV3.length() < 6) {
      TV3.addScaledVector(TV4, -TV3.dot(TV4));
      if (TV3.lengthSq() > 1e-6) {
        dr.target = TV4.clone().multiplyScalar(R).addScaledVector(TV3.normalize(), 14);
        dr.state = 'walk';
        dr.flee = true;
        dr.stateT = 2.5;
      }
    } else if (dr.state === 'flee' && dr.stateT <= 0) {
      dr.flee = false; dr.state = 'idle'; dr.stateT = 2;
    }
    if (dr.state === 'walk') {
      if (!dr.target || dr.stateT <= 0) {
        dr.target = offsetDir(dr.home, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12).multiplyScalar(R);
        dr.stateT = 10;
      }
      TV1.copy(dr.target).sub(TV2.copy(dr.dir).multiplyScalar(R));
      TV1.addScaledVector(dr.dir, -TV1.dot(dr.dir));
      if (TV1.length() < 0.6) { dr.state = 'idle'; dr.flee = false; dr.stateT = 1 + Math.random() * 3; }
      else {
        TV1.normalize();
        TV2.crossVectors(dr.dir, TV1).normalize();
        dr.dir.applyAxisAngle(TV2, (dr.flee ? 2.0 : 0.6) * dt / R).normalize();
        moving = true;
      }
    }
    dr.g.position.copy(dr.dir).multiplyScalar(Math.max(terrainHeight(dr.dir), SEA_R - 0.35)
      + (moving ? Math.abs(Math.sin(t * 9 + dr.bob)) * 0.05 : 0));
    if (moving) {
      TV3.copy(dr.dir).normalize();
      TV4.crossVectors(TV3, TV1).normalize();
      TV5.crossVectors(TV1, TV4);
      dr.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV5, TV1));
    }
  }

  /* ---- 四季流转 ---- */
  const seasonF = (t / SEASON_T) % 4;
  const si = Math.floor(seasonF), sf = seasonF - si;
  const smRaw = sf < 0.72 ? 0 : (sf - 0.72) / 0.28; // 季末 28% 平滑过渡到下一季
  const sm = smRaw * smRaw * (3 - 2 * smRaw);
  const sn = (si + 1) % 4;
  const effSeason = sm > 0.5 ? sn : si;
  const snowy = effSeason === 3;
  mLeaf1.color.lerpColors(seasonLeafA[si], seasonLeafA[sn], sm);
  mLeaf2.color.lerpColors(seasonLeafB[si], seasonLeafB[sn], sm);
  planetMesh.material.color.lerpColors(seasonTint[si], seasonTint[sn], sm);
  snowShell.material.opacity = THREE.MathUtils.lerp(seasonSnow[si], seasonSnow[sn], sm);

  /* ---- 天气循环：晴 ↔ 雨/雪（天色变暗 + 闪电） ---- */
  weatherT -= dt;
  if (weatherT <= 0) {
    raining = !raining;
    weatherT = raining ? 15 + Math.random() * 12 : 26 + Math.random() * 22;
  }
  rainAmt += ((raining ? 1 : 0) - rainAmt) * Math.min(dt / 2.2, 1);
  if (rainAmt > 0.01) {
    rainG.visible = true;
    rainMat.color.setHex(snowy ? 0xffffff : 0xaecbe8);
    rainMat.size = snowy ? 0.14 : 0.09;
    const rp = rainGeo.attributes.position;
    for (let i = 0; i < RAIN_N; i++) {
      let y = rp.getY(i) - (snowy ? 3.2 + (i % 7) * 0.35 : 15 + (i % 7)) * dt;
      if (y < 0.1) {
        y = 11 + Math.random() * 2;
        rp.setX(i, (Math.random() - 0.5) * 22);
        rp.setZ(i, (Math.random() - 0.5) * 22);
      }
      rp.setY(i, y);
    }
    rp.needsUpdate = true;
    rainMat.opacity = 0.5 * rainAmt;
    if (rainAmt > 0.6 && !snowy) {
      boltT -= dt;
      if (boltT <= 0) {
        boltT = 4 + Math.random() * 8;
        flashEl.style.transition = 'opacity .05s';
        flashEl.style.opacity = 0.5;
        setTimeout(() => { flashEl.style.transition = 'opacity .45s'; flashEl.style.opacity = 0; }, 80);
      }
    }
  } else rainG.visible = false;
  fogSeasonC.copy(seasonFog[si]).lerp(seasonFog[sn], sm);
  scene.fog.color.copy(fogSeasonC).lerp(snowy ? FOG_SNOW : FOG_RAIN, rainAmt);
  skyEl.style.opacity = (rainAmt * 0.5).toFixed(3);
  seasonSunK = THREE.MathUtils.lerp(seasonSun[si], seasonSun[sn], sm);

  /* ---- 云朵环球 ---- */
  for (const c of clouds) {
    c.position.applyAxisAngle(c.userData.axis, c.userData.speed * dt);
  }
  /* ---- 花瓣（主角身边的局部空间） ---- */
  for (const m of petals) {
    const u = m.userData;
    m.position.y -= u.speed * dt;
    m.position.x += Math.sin(t * 0.8 + u.phase) * 0.12 * dt;
    m.rotation.x += u.rs * dt;
    m.rotation.y += u.rs * 0.7 * dt;
    if (m.position.y < 0.1) {
      m.position.set((Math.random() - 0.5) * 9, 3.2 + Math.random() * 1.5, (Math.random() - 0.5) * 9);
    }
  }

  /* ---- 村民与旅人：散步 / 走村串镇 / 打招呼挥手 ---- */
  for (const h of humans) {
    h.stateT -= dt;
    let moving = false;
    if (h.greetT > 0) {
      h.greetT -= dt;
    } else if (h.state === 'walk') {
      if (!h.target || h.stateT <= 0) { h.target = humanTarget(h); h.stateT = 6 + Math.random() * 6; }
      TV1.copy(h.target).sub(TV2.copy(h.dir).multiplyScalar(R));
      TV1.addScaledVector(h.dir, -TV1.dot(h.dir));
      if (TV1.length() < 0.5) { h.state = 'idle'; h.stateT = 1.5 + Math.random() * 3; }
      else {
        TV1.normalize();
        TV2.crossVectors(h.dir, TV1).normalize();
        h.dir.applyAxisAngle(TV2, h.speed * dt / R).normalize();
        moving = true;
      }
    } else if (h.stateT <= 0) {
      h.state = 'walk';
      h.stateT = 8;
      h.target = humanTarget(h);
    }
    if (moving) h.walkPhase += dt * 8;
    if (moving) { // 面朝前进方向
      TV3.copy(h.dir).normalize();
      TV4.crossVectors(TV3, TV1).normalize();
      TV5.crossVectors(TV1, TV4);
      h.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV5, TV1));
    }
    h.g.position.copy(h.dir).multiplyScalar(Math.max(terrainHeight(h.dir), SEA_R - 0.35) + 0.01);
    // 眨眼与表情：打招呼时笑得更开
    h.blinkT -= dt;
    if (h.blinkT <= 0) h.blinkT = 1.6 + Math.random() * 3.4;
    const eyeK = h.blinkT < 0.12 ? 0.12 : 1;
    if (h.eyes) for (const e of h.eyes) e.scale.y += (eyeK - e.scale.y) * 0.55;
    if (h.mouth) h.mouth.scale.y += ((h.greetT > 0 ? 2.2 : 1) - h.mouth.scale.y) * 0.15;
    // 四肢动画（走路摆动 / 待机呼吸张望 / 打招呼挥手）
    const k10 = Math.min(dt * 10, 1), k8 = Math.min(dt * 8, 1);
    h.legL.rotation.x += ((moving ? Math.sin(h.walkPhase) * 0.55 : 0) - h.legL.rotation.x) * k10;
    h.legR.rotation.x += ((moving ? -Math.sin(h.walkPhase) * 0.55 : 0) - h.legR.rotation.x) * k10;
    h.armL.rotation.x += ((moving ? -Math.sin(h.walkPhase) * 0.4 : Math.sin(t * 1.5 + h.walkPhase) * 0.06) - h.armL.rotation.x) * k8;
    if (h.greetT > 0) {
      h.armR.rotation.z += ((-1.9 + Math.sin(t * 10) * 0.5) - h.armR.rotation.z) * k10;
      h.armR.rotation.x += (0 - h.armR.rotation.x) * k10;
    } else {
      h.armR.rotation.z += (0 - h.armR.rotation.z) * k8;
      h.armR.rotation.x += ((moving ? Math.sin(h.walkPhase) * 0.4 : 0) - h.armR.rotation.x) * k8;
      h.head.rotation.y = Math.sin(t * 0.5 + h.walkPhase) * (moving ? 0 : 0.45);
    }
  }

  /* ---- 羊群：慢悠悠吃草溜达 ---- */
  for (const s of sheeps) {
    s.stateT -= dt;
    let moving = false;
    if (s.state === 'walk') {
      TV1.copy(s.target).sub(TV2.copy(s.dir).multiplyScalar(R));
      TV1.addScaledVector(s.dir, -TV1.dot(s.dir));
      if (TV1.length() < 0.4) { s.state = 'idle'; s.stateT = 2 + Math.random() * 4; s.graze = Math.random() < 0.6 ? 1 : 0; }
      else {
        TV1.normalize();
        TV2.crossVectors(s.dir, TV1).normalize();
        s.dir.applyAxisAngle(TV2, 0.35 * dt / R).normalize();
        moving = true;
      }
    } else if (s.stateT <= 0) {
      s.state = 'walk';
      s.stateT = 10;
      s.target = offsetDir(s.home, (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7).multiplyScalar(R);
    }
    s.g.position.copy(s.dir).multiplyScalar(Math.max(terrainHeight(s.dir), SEA_R - 0.35) + 0.01);
    if (moving) {
      TV3.copy(s.dir).normalize();
      TV4.crossVectors(TV3, TV1).normalize();
      TV5.crossVectors(TV1, TV4);
      s.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV5, TV1));
    }
    s.head.rotation.x += (((s.state === 'idle' && s.graze) ? 0.8 : 0) - s.head.rotation.x) * Math.min(dt * 4, 1);
  }

  /* ---- 篝火：火苗摇曳 + 烟气升腾 ---- */
  for (const cf of campfires) {
    const fl = 0.85 + Math.sin(t * 11 + cf.phase) * 0.15 + Math.sin(t * 23 + cf.phase * 2) * 0.08;
    cf.fire1.scale.set(fl, 0.9 + Math.sin(t * 13 + cf.phase) * 0.2, fl);
    cf.fire2.scale.setScalar(0.9 + Math.sin(t * 17 + cf.phase * 3) * 0.2);
    cf.light.intensity = 1.0 + Math.sin(t * 9 + cf.phase) * 0.25;
    cf.puffs.forEach((p, i) => {
      const ph = (t * 0.35 + i * 0.2) % 1;
      p.position.y = 0.45 + ph * 1.2;
      p.material.opacity = 0.32 * (1 - ph);
      p.scale.setScalar(0.7 + ph * 1.3);
    });
  }

  /* ---- 聊天气泡跟随 ---- */
  if (chatT > 0 && chatHuman) {
    chatT -= dt;
    TV1.copy(chatHuman.g.position).addScaledVector(chatHuman.dir, 1.35).project(camera);
    if (TV1.z < 1) {
      chatEl.style.left = ((TV1.x + 1) / 2 * innerWidth) + 'px';
      chatEl.style.top = ((1 - (TV1.y + 1) / 2) * innerHeight) + 'px';
      chatEl.style.opacity = Math.min(chatT * 2, 1);
    } else chatEl.style.opacity = 0;
    if (chatT <= 0) { chatEl.style.opacity = 0; chatHuman = null; }
  }

  /* ---- 目标指示箭头（目标出屏时贴边指向） ---- */
  if (hasMoveTarget || attackTarget) {
    if (attackTarget) TV1.copy(attackTarget.g.position);
    else TV1.copy(TV2.copy(moveTarget).multiplyScalar(terrainHeight(moveTarget)));
    TV1.project(camera);
    if (TV1.z > 1 || Math.abs(TV1.x) > 0.98 || Math.abs(TV1.y) > 0.95) {
      let ax = TV1.x, ay = TV1.y;
      if (TV1.z > 1) { ax = -ax; ay = -ay; }
      const ang = Math.atan2(ay, ax);
      navArrow.style.left = ((Math.cos(ang) * 0.9 + 1) / 2 * innerWidth) + 'px';
      navArrow.style.top = ((1 - (Math.sin(ang) * 0.82 + 1) / 2) * innerHeight) + 'px';
      navArrow.style.transform = `translate(-50%,-50%) rotate(${-ang}rad)`;
      navArrow.style.opacity = 0.9;
    } else navArrow.style.opacity = 0;
  } else navArrow.style.opacity = 0;

  /* ---- 飞鸟（群绕游走中心盘旋） ---- */
  for (const f of flocks) {
    f.center.applyAxisAngle(f.axis, f.speed * dt).normalize();
    f.t1.crossVectors(f.center, Math.abs(f.center.y) < 0.9 ? Y_AXIS : X_AXIS).normalize();
    f.t2.crossVectors(f.center, f.t1).normalize();
  }
  for (const b of birds) {
    const a = t * b.sp + b.ph, f = b.flock;
    TV1.copy(f.center).multiplyScalar(f.alt)
      .addScaledVector(f.t1, Math.cos(a) * b.r).addScaledVector(f.t2, Math.sin(a) * b.r)
      .addScaledVector(f.center, Math.sin(t * 0.9 + b.bob) * 0.5);
    const a2 = a + 0.06;
    TV2.copy(f.center).multiplyScalar(f.alt)
      .addScaledVector(f.t1, Math.cos(a2) * b.r).addScaledVector(f.t2, Math.sin(a2) * b.r);
    b.g.position.copy(TV1);
    b.g.lookAt(TV2);
    const flap = Math.sin(t * 11 + b.ph) * 0.55;
    b.p1.rotation.z = flap; b.p2.rotation.z = -flap;
  }

  /* ---- 兔子（蹦跳，见主角靠近就逃跑） ---- */
  for (const bn of bunnies) {
    if (bn.hopP >= 0) {
      bn.hopP += dt / 0.42;
      if (bn.hopP >= 1) { bn.hopP = -1; bn.hopT = 0.8 + Math.random() * 2.4; }
      else {
        TV2.crossVectors(bn.dir, bn.mv).normalize();
        bn.dir.applyAxisAngle(TV2, 1.7 * dt).normalize();
      }
    } else {
      bn.hopT -= dt;
      if (bn.hopT <= 0) {
        TV4.copy(bn.dir).multiplyScalar(terrainHeight(bn.dir));
        TV3.copy(heroRoot.position).sub(TV4);
        if (TV3.length() < 5) {
          TV3.addScaledVector(TV4, -TV3.dot(TV4)); // 切面远离方向
          bn.mv.copy(TV3.normalize());
          bn.hopP = 0;
        } else if (Math.random() < 0.6) {
          const { t1, t2 } = tangentBasis(bn.dir);
          const a = Math.random() * Math.PI * 2;
          bn.mv.copy(t1).multiplyScalar(Math.cos(a)).addScaledVector(t2, Math.sin(a));
          bn.hopP = 0;
        } else bn.hopT = 1 + Math.random() * 2;
      }
    }
    const hop = bn.hopP >= 0 ? Math.sin(bn.hopP * Math.PI) * 0.32 : 0;
    bn.g.position.copy(bn.dir).multiplyScalar(Math.max(terrainHeight(bn.dir), SEA_R - 0.2) + hop);
    if (bn.hopP >= 0) { // 蹦跳时朝移动方向
      TV3.copy(bn.dir).normalize();
      TV4.crossVectors(TV3, bn.mv).normalize();
      TV2.crossVectors(bn.mv, TV4);
      bn.g.quaternion.setFromRotationMatrix(TM1.makeBasis(TV4, TV2, bn.mv));
    }
  }

  /* ---- 蝴蝶（贴地游荡扑翅） ---- */
  for (const fl of flies) {
    TV1.crossVectors(fl.dir, Y_AXIS);
    if (TV1.lengthSq() < 1e-6) TV1.copy(X_AXIS);
    fl.dir.applyAxisAngle(TV1.normalize(), Math.sin(t * 0.5 + fl.ph) * 0.3 * dt).normalize();
    fl.g.position.copy(fl.dir).multiplyScalar(Math.max(terrainHeight(fl.dir), SEA_R) + 0.55 + Math.sin(t * 2.2 + fl.ph) * 0.25);
    fl.g.rotation.set(0, t * 1.3 + fl.ph, 0);
    const flap = Math.sin(t * 22 + fl.ph) * 0.9;
    fl.h1.rotation.z = flap; fl.h2.rotation.z = -flap;
  }

  /* ---- 相机跟随（刚体跟随主角 + 注视角色居中） ---- */
  {
    // 主角本帧在球面上转过的角度 → 相机做同样的刚体旋转，保持相对方位
    TV1.crossVectors(prevHeroPos, heroRoot.position);
    if (TV1.lengthSq() > 1e-10) {
      const ang = Math.asin(Math.min(TV1.length() / (R * R), 1));
      camPos.applyAxisAngle(TV1.normalize(), ang);
    }
    prevHeroPos.copy(heroRoot.position);
    const up = heroUp.copy(heroRoot.position).normalize();
    // 俯仰角与距离规整
    TV2.copy(camPos).sub(heroRoot.position);
    const v = TV2.dot(up);
    TV3.copy(TV2).addScaledVector(up, -v);
    const hLen = Math.max(TV3.length(), 0.001);
    const pitch = THREE.MathUtils.clamp(Math.atan2(v, hLen), 0.08, 1.25);
    camPos.copy(heroRoot.position)
      .addScaledVector(TV3.normalize(), Math.cos(pitch) * camDist)
      .addScaledVector(up, Math.sin(pitch) * camDist);
    // 相机不入地：沿视线从主角向机位步进，地形高出视线就拉近
    TV5.copy(camPos).sub(heroRoot.position).normalize();
    let allow = camDist;
    for (let s = 1; s <= 8; s++) {
      const f = camDist * s / 8;
      TV6.copy(heroRoot.position).addScaledVector(TV5, f);
      const rr = TV6.length();
      TV6.divideScalar(rr);
      if (terrainHeight(TV6) > rr + 0.3) { allow = Math.max(f - camDist / 8, 2.2); break; }
    }
    if (allow < camDist) camPos.copy(heroRoot.position).addScaledVector(TV5, allow);
    camera.position.lerp(camPos, 1 - Math.exp(-dt * 14));
    camera.up.copy(up);
    camera.lookAt(TV4.copy(heroRoot.position).addScaledVector(up, 0.9)); // 注视身体中部，角色整体居中
  }

  /* ---- 昼夜流转：太阳升落 / 夜晚月亮星空 / 灯窗点亮 ---- */
  const dayP = (t / DAY_LEN) % 1;
  const skyP = dayP < 0.6 ? dayP / 0.6 * 0.55 : 0.55 + (dayP - 0.6) / 0.4 * 0.45;
  const elev = Math.sin(skyP * Math.PI * 2);
  dayAmt = THREE.MathUtils.smoothstep(elev, -0.18, 0.14);
  let k0 = skyKeys[0], k1 = skyKeys[skyKeys.length - 1];
  for (let k = 0; k < skyKeys.length - 1; k++) {
    if (skyP >= skyKeys[k][0] && skyP <= skyKeys[k + 1][0]) { k0 = skyKeys[k]; k1 = skyKeys[k + 1]; break; }
  }
  const kf = k1[0] > k0[0] ? THREE.MathUtils.clamp((skyP - k0[0]) / (k1[0] - k0[0]), 0, 1) : 0;
  const mixStop = (a, b) => { skyA.setHex(a); skyB.setHex(b); skyA.lerp(skyB, kf); return '#' + skyA.getHexString(); };
  const skyStr = `linear-gradient(180deg, ${mixStop(k0[1], k1[1])}, ${mixStop(k0[2], k1[2])} 55%, ${mixStop(k0[3], k1[3])} 100%)`;
  if (skyStr !== skyLast) { document.body.style.background = skyStr; skyLast = skyStr; }
  TV6.copy(heroRoot.position).normalize();
  TV1.crossVectors(TV6, Math.abs(TV6.y) < 0.9 ? Y_AXIS : X_AXIS).normalize();
  TV2.crossVectors(TV6, TV1).normalize();
  TV3.copy(TV1).multiplyScalar(0.77).addScaledVector(TV2, 0.64).normalize(); // 太阳东升西落的方位
  sunDirW.copy(TV6).multiplyScalar(elev).addScaledVector(TV3, Math.sqrt(Math.max(1 - elev * elev, 1e-4))).normalize();
  if (dayAmt >= 0.5) {
    sun.color.copy(C_SUN_LOW).lerp(C_SUN_NOON, THREE.MathUtils.clamp(elev * 2.2, 0, 1));
    sun.intensity = SUN_I * (0.2 + 0.8 * dayAmt) * seasonSunK * (1 - 0.6 * rainAmt);
    sun.position.copy(heroRoot.position).addScaledVector(sunDirW, 38);
  } else {
    sun.color.copy(C_MOON);
    sun.intensity = 0.55 * (1 - dayAmt);
    sun.position.copy(heroRoot.position).addScaledVector(sunDirW, -38);
  }
  sun.target.position.copy(heroRoot.position);
  sun.target.updateMatrixWorld();
  rim.intensity = 1.3 * (0.25 + 0.75 * dayAmt);
  fill.intensity = 0.35 * (0.2 + 0.8 * dayAmt);
  hemi.intensity = HEMI_I * (0.16 + 0.84 * dayAmt) * (1 - 0.25 * rainAmt);
  scene.fog.color.lerp(C_NIGHTFOG, (1 - dayAmt) * 0.85);
  starMat.opacity = (1 - dayAmt) * 0.9;
  stars.visible = starMat.opacity > 0.02;
  stars.rotation.y += dt * 0.004;
  moon.material.opacity = (1 - dayAmt) * 0.95;
  moonGlow.material.opacity = (1 - dayAmt) * 0.25;
  moonGlow.visible = moon.visible = moon.material.opacity > 0.02;
  if (moon.visible) {
    moon.position.copy(heroRoot.position).addScaledVector(sunDirW, -80);
    moonGlow.position.copy(moon.position);
    moon.lookAt(heroRoot.position);
    moonGlow.lookAt(heroRoot.position);
  }
  for (const b of lampBulbs) {
    b.material.color.copy(C_LAMP_DIM).lerp(C_LAMP_BRIGHT, 1 - dayAmt);
    b.scale.setScalar(1 + (1 - dayAmt) * 0.2);
  }
  mWinGlass.emissiveIntensity = 0.4 + (1 - dayAmt) * 1.5;
  // 环境 HUD（季节 + 时段）
  const phaseName = elev > 0.5 ? '☀️ 白天' : (elev > -0.12 ? (Math.cos(skyP * Math.PI * 2) > 0 ? '🌅 黎明' : '🌆 黄昏') : '🌙 夜晚');
  const envStr = seasonEmojis[effSeason] + ' ' + seasonNames[effSeason] + ' · ' + phaseName;
  if (envStr !== envLast) { envEl.textContent = envStr; envLast = envStr; }

  /* ---- 灯光跟随 ---- */
  rim.position.copy(heroRoot.position).addScaledVector(RIM_DIR, 30);
  rim.target.position.copy(heroRoot.position);
  rim.target.updateMatrixWorld();
  fill.position.copy(heroRoot.position).addScaledVector(FILL_DIR, 30);
  fill.target.position.copy(heroRoot.position);
  fill.target.updateMatrixWorld();

  renderer.render(scene, camera);

  if (!shown) {
    shown = true;
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 600);
  }
}

// rAF 停摆看门狗：rAF 被节流（如页面被遮挡）时用定时器兜底驱动动画。
// 注意：兜底只调用 tick()，不再排新的 rAF 回调，否则回调链会随时间无限累积
let lastTick = performance.now();
function frame() {
  requestAnimationFrame(frame);
  lastTick = performance.now();
  tick();
}
setInterval(() => {
  if (performance.now() - lastTick > 250) tick();
}, 100);
frame();
</script>
