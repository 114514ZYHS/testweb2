<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLO-EARTH // 全息地球投影系统</title>
<style>
  :root{
    --green: #00ff88;
    --green-dim: #0a8f52;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;
    font-family: "SF Mono", "Consolas", "Courier New", "Noto Sans Mono CJK SC", monospace;
    color:var(--green);
    cursor: crosshair;
    user-select:none;
  }
  body{
    background:
      radial-gradient(circle at 50% 48%, rgba(0,28,17,.75) 0%, rgba(0,8,5,.92) 45%, #000 75%),
      #000;
  }
  #stage{position:fixed;inset:0;z-index:1}
  canvas{display:block}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;inset:0;z-index:20;pointer-events:none;
    font-size:12px;letter-spacing:1.2px;line-height:1.75;
    text-shadow:0 0 5px rgba(0,255,136,.55);
  }
  .corner{position:absolute;padding:18px 22px}
  .tl{top:0;left:0}
  .tr{top:0;right:0;text-align:right}
  .bl{bottom:0;left:0}
  .br{bottom:0;right:0;text-align:right}

  .title{
    font-size:20px;letter-spacing:6px;font-weight:700;
    color:#6dffb2;
    text-shadow:0 0 8px rgba(0,255,136,.65);
  }
  .sub{
    font-size:11px;letter-spacing:2px;color:rgba(0,255,136,.45);
    margin-top:4px;
  }
  .line{white-space:nowrap;color:rgba(0,255,136,.72)}
  .line .k{color:rgba(0,255,136,.38)}
  .line .v{color:#8dffc0}
  .ok{color:#5ce89a}

  /* 边框装饰 */
  .frame{
    position:absolute;inset:14px;border:1px solid rgba(0,255,136,.12);
    pointer-events:none;
  }
  .frame::before,.frame::after{
    content:"";position:absolute;width:26px;height:26px;
    border:1px solid rgba(0,255,136,.45);
  }
  .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  /* 终端日志 */
  .log{
    position:absolute;left:22px;bottom:86px;
    font-size:11px;line-height:1.6;color:rgba(0,255,136,.38);
    max-width:340px;
  }
  .log div{opacity:.85;animation:appear .4s ease}
  @keyframes appear{from{opacity:0;transform:translateX(-6px)}to{opacity:.85;transform:none}}

  /* 扫描线（大幅减弱） */
  .scanlines{
    position:fixed;inset:0;z-index:30;pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,255,136,.028) 0px,
      rgba(0,255,136,.028) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:screen;
    animation:scanmove 9s linear infinite;
  }
  @keyframes scanmove{from{background-position:0 0}to{background-position:0 60px}}

  .scanbar{
    position:fixed;left:0;width:100%;height:140px;z-index:31;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(0,255,136,.032),transparent);
    animation:scanbar 7s linear infinite;
  }
  @keyframes scanbar{0%{top:-140px}100%{top:100%}}

  /* 暗角 */
  .vignette{
    position:fixed;inset:0;z-index:25;pointer-events:none;
    background:radial-gradient(circle at 50% 50%, transparent 38%, rgba(0,0,0,.82) 100%);
  }

  .cursor{display:inline-block;width:7px;height:13px;background:var(--green);
    vertical-align:-2px;margin-left:3px;animation:blink 1.05s steps(1) infinite;
    box-shadow:0 0 6px var(--green);}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* 启动遮罩 */
  #boot{
    position:fixed;inset:0;z-index:100;background:#000;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;color:var(--green);
    font-size:13px;letter-spacing:3px;
    transition:opacity .8s ease;
  }
  #boot.hide{opacity:0;pointer-events:none}
  #boot .bar{
    width:220px;height:2px;background:rgba(0,255,136,.12);overflow:hidden;
  }
  #boot .bar i{
    display:block;height:100%;width:0%;background:var(--green);
    box-shadow:0 0 10px var(--green);animation:load 1.4s ease forwards;
  }
  @keyframes load{to{width:100%}}

  @media (max-width:720px){
    .title{font-size:15px;letter-spacing:3px}
    .hud{font-size:10px}
    .log{display:none}
    .corner{padding:12px 14px}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="frame"></div>

  <div class="corner tl">
    <div class="title">◤ HOLO-EARTH</div>
    <div class="sub">全息投影地球模型 · 终端 v2.4.2</div>
  </div>

  <div class="corner tr">
    <div class="line"><span class="k">LAT </span><span class="v" id="v-lat">00.00</span><span class="k">°</span></div>
    <div class="line"><span class="k">LON </span><span class="v" id="v-lon">00.00</span><span class="k">°</span></div>
    <div class="line"><span class="k">ALT </span><span class="v" id="v-alt">35786</span><span class="k"> km</span></div>
    <div class="line"><span class="k">ZOOM </span><span class="v" id="v-zoom">1.00</span><span class="k">x</span></div>
  </div>

  <div class="log" id="log"></div>

  <div class="corner bl">
    <div class="line">&gt; 投影状态: <span class="ok">● 在线</span></div>
    <div class="line">&gt; 点云节点: <span class="v" id="v-nodes">0</span></div>
    <div class="line">&gt; 信号稳定: <span class="v" id="v-stab">99.7</span>%</div>
    <div class="line">&gt; 数据吞吐: <span class="v" id="v-rate">2.42</span> GB/s<span class="cursor"></span></div>
  </div>

  <div class="corner br">
    <div class="line"><span class="k">[ 拖动 ] </span>旋转视角</div>
    <div class="line"><span class="k">[ 滚轮 ] </span>缩放模型</div>
    <div class="line"><span class="k">[ 双击 ] </span>重置方位</div>
  </div>
</div>

<div class="scanlines"></div>
<div class="scanbar"></div>
<div class="vignette"></div>

<div id="boot">
  <div>INITIALIZING HOLOGRAM…</div>
  <div class="bar"><i></i></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================
     1. 简化大陆轮廓数据  [经度, 纬度]
     ========================================================= */
  const LAND = [
    [[-17,15],[-17,21],[-13,28],[-10,32],[-6,36],[10,37],[20,32],[25,31],[32,31],
     [35,23],[38,18],[43,12],[51,12],[48,5],[42,-1],[40,-11],[35,-19],[33,-26],
     [27,-34],[19,-35],[12,-18],[9,-1],[9,4],[3,6],[-8,4],[-13,9],[-17,15]],
    [[-10,37],[-9,43],[-4,48],[0,49],[3,51],[8,54],[8,57],[11,59],[5,61],[13,69],
     [29,71],[42,67],[55,71],[70,73],[90,76],[110,77],[130,72],[145,72],[160,69],
     [178,67],[178,60],[162,60],[150,59],[142,52],[135,45],[130,42],[126,37],
     [122,31],[110,21],[108,11],[105,9],[100,13],[97,17],[92,22],[88,21],[80,13],
     [77,8],[72,20],[68,24],[62,25],[57,26],[50,30],[48,38],[44,41],[37,44],
     [28,41],[24,38],[19,40],[14,38],[8,38],[3,37],[-2,36],[-10,37]],
    [[-168,66],[-160,71],[-140,70],[-125,70],[-110,69],[-95,68],[-85,70],[-70,63],
     [-60,55],[-65,48],[-70,42],[-76,36],[-81,26],[-88,30],[-95,29],[-98,26],
     [-105,22],[-115,30],[-125,40],[-125,48],[-135,58],[-150,60],[-165,60],[-168,66]],
    [[-81,7],[-75,10],[-62,11],[-52,5],[-45,-2],[-35,-6],[-38,-14],[-48,-25],
     [-58,-35],[-62,-40],[-65,-45],[-68,-53],[-75,-52],[-73,-42],[-71,-30],
     [-70,-18],[-76,-14],[-81,-5],[-81,7]],
    [[113,-22],[114,-31],[118,-35],[129,-32],[138,-35],[147,-38],[153,-28],
     [153,-25],[146,-19],[142,-11],[136,-12],[130,-12],[125,-14],[117,-20],[113,-22]],
    [[-45,60],[-52,65],[-55,70],[-50,76],[-40,83],[-25,83],[-20,76],[-25,70],
     [-38,64],[-45,60]],
    [[43,-12],[50,-15],[50,-25],[45,-25],[43,-12]],
    [[130,31],[136,35],[141,40],[145,44],[142,45],[138,37],[133,33],[130,31]],
    [[-6,50],[-2,53],[-3,58],[-5,58],[-6,54],[-6,50]],
    [[173,-34],[178,-38],[174,-42],[167,-46],[166,-45],[172,-40],[173,-34]],
    (function () {
      const a = [];
      for (let lon = -180; lon <= 180; lon += 12) a.push([lon, -69 - 7 * Math.cos(lon * Math.PI / 60)]);
      for (let lon = 180; lon >= -180; lon -= 12) a.push([lon, -86]);
      return a;
    })()
  ];

  LAND.forEach(function (poly) {
    let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
    for (let i = 0; i < poly.length; i++) {
      a = Math.min(a, poly[i][0]); b = Math.max(b, poly[i][0]);
      c = Math.min(c, poly[i][1]); d = Math.max(d, poly[i][1]);
    }
    poly._bb = [a, b, c, d];
  });

  function inPoly(lon, lat, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      if (((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function isLand(lon, lat) {
    for (let i = 0; i < LAND.length; i++) {
      const p = LAND[i], bb = p._bb;
      if (lon < bb[0] || lon > bb[1] || lat < bb[2] || lat > bb[3]) continue;
      if (inPoly(lon, lat, p)) return true;
    }
    return false;
  }

  /* =========================================================
     2. 基础工具
     ========================================================= */
  const R = 1;
  const DEG = Math.PI / 180;

  function ll2v(lat, lon, r) {
    const phi = (90 - lat) * DEG;
    const theta = (lon + 180) * DEG;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  /* =========================================================
     3. 场景 / 相机 / 渲染器
     ========================================================= */
  const stage = document.getElementById('stage');

  const scene = new THREE.Scene();   // 不使用雾，避免整体泛白

  const camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 300
  );
  camera.position.set(0, 0.55, 3.15);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: true, powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  /* =========================================================
     4. 层级：tiltGroup → spinner
     ========================================================= */
  const tiltGroup = new THREE.Group();
  tiltGroup.rotation.z = 0.16;
  scene.add(tiltGroup);

  const spinner = new THREE.Group();
  tiltGroup.add(spinner);

  /* =========================================================
     5. 深色内核（关键：挡住背面点云，消除“恒星”光团感）
     ========================================================= */
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(R * 0.965, 64, 48),
    new THREE.MeshBasicMaterial({ color: 0x00070a })   // 近黑，几乎不可见
  );
  spinner.add(core);

  /* =========================================================
     6. 地球点云（陆地亮 / 海洋极暗）
     ========================================================= */
  const positions = [];
  const colors = [];
  const sizes = [];

  const STEP = 1.8;

  for (let lat = -89; lat <= 89; lat += STEP) {
    const latR = lat * DEG;
    const n = Math.max(8, Math.round(360 / STEP * Math.cos(latR)));
    const dlon = 360 / n;

    for (let i = 0; i < n; i++) {
      const lon = -180 + i * dlon;
      const land = isLand(lon, lat);
      const v = ll2v(lat, lon, R);
      positions.push(v.x, v.y, v.z);

      if (land) {
        // 陆地：中等亮度的青绿，带随机变化
        const g = 0.72 + Math.random() * 0.28;
        colors.push(0.03 * g, 0.62 * g, 0.33 * g);
        sizes.push(0.0058 + Math.random() * 0.0026);
      } else {
        // 海洋：极暗的墨绿，作为底纹而非发光体
        colors.push(0.0, 0.085 + Math.random() * 0.045, 0.045);
        sizes.push(0.0028 + Math.random() * 0.0012);
      }
    }
  }

  const pointsGeo = new THREE.BufferGeometry();
  pointsGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  pointsGeo.setAttribute('aColor',   new THREE.Float32BufferAttribute(colors, 3));
  pointsGeo.setAttribute('aSize',    new THREE.Float32BufferAttribute(sizes, 1));

  const pointsMat = new THREE.ShaderMaterial({
    uniforms: {
      uScale: { value: 1000.0 }
    },
    vertexShader: [
      'attribute float aSize;',
      'attribute vec3 aColor;',
      'uniform float uScale;',
      'varying vec3 vColor;',
      'void main(){',
      '  vColor = aColor;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  float s = aSize * uScale / max(-mv.z, 0.0001);',
      '  gl_PointSize = clamp(s, 0.6, 5.5);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vColor;',
      'void main(){',
      '  vec2 c = gl_PointCoord - vec2(0.5);',
      '  float d = length(c);',
      '  if (d > 0.5) discard;',
      '  float a = smoothstep(0.5, 0.12, d);',
      '  gl_FragColor = vec4(vColor, a * 0.9);',
      '}'
    ].join('\n'),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true
  });

  const earthPoints = new THREE.Points(pointsGeo, pointsMat);
  spinner.add(earthPoints);

  /* =========================================================
     7. 大陆轮廓线
     ========================================================= */
  const coastGroup = new THREE.Group();
  spinner.add(coastGroup);

  const coastMatMain = new THREE.LineBasicMaterial({
    color: 0x3fd98c, transparent: true, opacity: 0.48,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const coastMatGlow = new THREE.LineBasicMaterial({
    color: 0x00ff88, transparent: true, opacity: 0.07,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  LAND.forEach(function (poly) {
    const pts = poly.map(function (p) { return ll2v(p[1], p[0], R * 1.004); });
    coastGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts), coastMatMain));

    const pts2 = poly.map(function (p) { return ll2v(p[1], p[0], R * 1.011); });
    coastGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts2), coastMatGlow));
  });

  /* =========================================================
     8. 经纬网格
     ========================================================= */
  (function graticule() {
    const mat = new THREE.LineBasicMaterial({
      color: 0x00ff88, transparent: true, opacity: 0.045,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const g = new THREE.Group();
    const rr = R * 1.001;

    for (let lat = -60; lat <= 60; lat += 30) {
      const pts = [];
      for (let lon = -180; lon <= 180; lon += 4) pts.push(ll2v(lat, lon, rr));
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    }
    for (let lon = -180; lon < 180; lon += 30) {
      const pts = [];
      for (let lat = -90; lat <= 90; lat += 4) pts.push(ll2v(lat, lon, rr));
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    }
    spinner.add(g);
  })();

  /* =========================================================
     9. 大气辉光（修正菲涅尔：边缘亮、中心暗）
     ========================================================= */
  const glowMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x00ff88) },
      uPower: { value: 3.0 },
      uIntensity: { value: 0.30 },
      uAlpha: { value: 0.55 }
    },
    vertexShader: [
      'varying vec3 vNormal;',
      'void main(){',
      '  vNormal = normalize(normalMatrix * normal);',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 uColor;',
      'uniform float uPower;',
      'uniform float uIntensity;',
      'uniform float uAlpha;',
      'varying vec3 vNormal;',
      'void main(){',
      // 关键修正：1 - |N·V|  → 只在球体边缘发亮
      '  float fres = 1.0 - abs(dot(normalize(vNormal), vec3(0.0, 0.0, 1.0)));',
      '  float rim = pow(fres, uPower);',
      '  gl_FragColor = vec4(uColor * rim * uIntensity, rim * uAlpha);',
      '}'
    ].join('\n'),
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });

  const glow = new THREE.Mesh(new THREE.SphereGeometry(R * 1.18, 64, 48), glowMat);
  tiltGroup.add(glow);

  /* =========================================================
     10. 轨道环 + 卫星点
     ========================================================= */
  const ringGroup = new THREE.Group();
  tiltGroup.add(ringGroup);

  function makeRing(radius, tilt, opacity) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.0016, 6, 220),
      new THREE.MeshBasicMaterial({
        color: 0x00ff88, transparent: true, opacity: opacity,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ring.rotation.x = Math.PI / 2;
    const holder = new THREE.Group();
    holder.rotation.z = tilt;
    holder.add(ring);
    ringGroup.add(holder);
    return holder;
  }

  const ringA = makeRing(1.34, 0.0, 0.15);
  const ringB = makeRing(1.55, 0.55, 0.09);
  const ringC = makeRing(1.20, -0.42, 0.07);

  const satGeo = new THREE.SphereGeometry(0.010, 8, 8);
  const satMat = new THREE.MeshBasicMaterial({
    color: 0x8dffc0, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sats = [];
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(satGeo, satMat);
    ringGroup.add(s);
    sats.push({
      mesh: s,
      radius: 1.20 + i * 0.115,
      speed: 0.28 + i * 0.13,
      phase: i * 1.9,
      tilt: [0.0, 0.55, -0.42, 0.28][i]
    });
  }

  /* =========================================================
     11. 星空背景
     ========================================================= */
  (function stars() {
    const N = 900;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 14 + Math.random() * 46;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      pos[i * 3]     = r * Math.sin(p) * Math.cos(t);
      pos[i * 3 + 1] = r * Math.cos(p);
      pos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      const b = 0.18 + Math.random() * 0.42;
      col[i * 3]     = b * 0.35;
      col[i * 3 + 1] = b;
      col[i * 3 + 2] = b * 0.62;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({
      size: 0.07, vertexColors: true, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    scene.add(new THREE.Points(g, m));
  })();

  /* =========================================================
     12. 尺寸同步
     ========================================================= */
  function syncPointScale() {
    const h = renderer.domElement.height;
    const fov = camera.fov * DEG;
    pointsMat.uniforms.uScale.value = h / (2 * Math.tan(fov / 2));
  }
  syncPointScale();

  window.addEventListener('resize', function () {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    syncPointScale();
  });

  /* =========================================================
     13. 交互
     ========================================================= */
  const state = {
    autoRot: 0,
    dragY: 0,
    tiltX: 0,
    dragging: false,
    lastX: 0,
    lastY: 0,
    velY: 0,
    targetZ: 3.15
  };

  const dom = renderer.domElement;

  function onDown(e) {
    state.dragging = true;
    state.lastX = (e.touches ? e.touches[0].clientX : e.clientX);
    state.lastY = (e.touches ? e.touches[0].clientY : e.clientY);
    dom.style.cursor = 'grabbing';
  }

  function onMove(e) {
    if (!state.dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dx = x - state.lastX;
    const dy = y - state.lastY;
    state.lastX = x;
    state.lastY = y;

    state.dragY += dx * 0.005;
    state.velY = dx * 0.005;
    state.tiltX = Math.max(-0.85, Math.min(0.85, state.tiltX + dy * 0.004));
  }

  function onUp() {
    state.dragging = false;
    dom.style.cursor = 'crosshair';
  }

  dom.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  dom.addEventListener('touchstart', function (e) { onDown(e); }, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onUp);

  dom.addEventListener('wheel', function (e) {
    e.preventDefault();
    state.targetZ = Math.max(1.75, Math.min(6.0, state.targetZ + e.deltaY * 0.0016));
  }, { passive: false });

  dom.addEventListener('dblclick', function () {
    state.dragY = 0;
    state.tiltX = 0;
    state.targetZ = 3.15;
    pushLog('视角已重置 → 基准方位');
  });

  /* =========================================================
     14. HUD
     ========================================================= */
  const el = {
    lat: document.getElementById('v-lat'),
    lon: document.getElementById('v-lon'),
    alt: document.getElementById('v-alt'),
    zoom: document.getElementById('v-zoom'),
    nodes: document.getElementById('v-nodes'),
    stab: document.getElementById('v-stab'),
    rate: document.getElementById('v-rate'),
    log: document.getElementById('log')
  };

  const totalNodes = positions.length / 3;
  el.nodes.textContent = totalNodes.toLocaleString('en-US');

  function pushLog(text) {
    const d = document.createElement('div');
    const t = new Date();
    const hh = String(t.getHours()).padStart(2, '0');
    const mm = String(t.getMinutes()).padStart(2, '0');
    const ss = String(t.getSeconds()).padStart(2, '0');
    d.textContent = '[' + hh + ':' + mm + ':' + ss + '] ' + text;
    el.log.appendChild(d);
    while (el.log.childElementCount > 6) el.log.removeChild(el.log.firstChild);
  }

  const LOG_POOL = [
    '同步轨道数据包 … OK',
    '扫描地表拓扑节点 … OK',
    '校验点云完整性 … 100%',
    '激光阵列校准完成',
    '大气散射参数已更新',
    '接收遥测信号 · 稳定',
    '渲染管线刷新 · 60FPS',
    '投影矩阵重算完成'
  ];

  setTimeout(function () { pushLog('全息投影阵列启动'); }, 400);
  setInterval(function () {
    if (Math.random() > 0.45) {
      pushLog(LOG_POOL[Math.floor(Math.random() * LOG_POOL.length)]);
    }
  }, 2600);

  let hudTimer = 0;

  function updateHUD(dt) {
    hudTimer += dt;
    if (hudTimer < 0.12) return;
    hudTimer = 0;

    const rotY = (spinner.rotation.y * 180 / Math.PI) % 360;
    const lon = ((rotY % 360) + 540) % 360 - 180;
    const lat = state.tiltX * 90;

    el.lat.textContent = (lat >= 0 ? '+' : '') + lat.toFixed(2);
    el.lon.textContent = (lon >= 0 ? '+' : '') + lon.toFixed(2);
    el.zoom.textContent = (3.15 / camera.position.z).toFixed(2);
    el.alt.textContent = Math.round(35786 + (camera.position.z - 3.15) * 42000);
    el.stab.textContent = (99.4 + Math.random() * 0.59).toFixed(2);
    el.rate.textContent = (2.1 + Math.random() * 0.8).toFixed(2);
  }

  /* =========================================================
     15. 主循环
     ========================================================= */
  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (!state.dragging) {
      state.velY *= 0.94;
      state.dragY += state.velY;
      state.autoRot += dt * 0.085;
    }
    spinner.rotation.y = state.autoRot + state.dragY;

    tiltGroup.rotation.x += (state.tiltX - tiltGroup.rotation.x) * 0.08;
    tiltGroup.rotation.z = 0.16 + Math.sin(elapsed * 0.28) * 0.02;

    camera.position.z += (state.targetZ - camera.position.z) * 0.09;
    camera.position.y = 0.55 + Math.sin(elapsed * 0.35) * 0.05;
    camera.lookAt(0, 0, 0);

    // 极轻微的呼吸感（幅度很小，避免闪烁）
    glowMat.uniforms.uIntensity.value = 0.28 + Math.sin(elapsed * 1.2) * 0.045;

    ringA.rotation.y += dt * 0.10;
    ringB.rotation.y -= dt * 0.07;
    ringC.rotation.y += dt * 0.13;

    for (let i = 0; i < sats.length; i++) {
      const s = sats[i];
      const a = elapsed * s.speed + s.phase;
      const x = Math.cos(a) * s.radius;
      const z = Math.sin(a) * s.radius;
      const y = Math.sin(a * 1.7) * 0.05;
      const c = Math.cos(s.tilt), sn = Math.sin(s.tilt);
      s.mesh.position.set(x * c - y * sn, x * sn + y * c, z);
      s.mesh.scale.setScalar(0.8 + Math.sin(elapsed * 3 + i) * 0.25);
    }

    scene.rotation.y += dt * 0.004;

    updateHUD(dt);
    renderer.render(scene, camera);
  }

  animate();

  /* =========================================================
     16. 启动完成
     ========================================================= */
  window.addEventListener('load', function () {
    setTimeout(function () {
      document.getElementById('boot').classList.add('hide');
    }, 900);
  });
  setTimeout(function () {
    document.getElementById('boot').classList.add('hide');
  }, 2200);

})();
</script>
