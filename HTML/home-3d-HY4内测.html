<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>温馨家居 · 3D 室内建模</title>
<style>
  :root{
    --panel:rgba(255,255,255,.88);
    --line:rgba(24,38,60,.10);
    --txt:#25303e;
    --sub:#68768a;
    --accent:#3f7cff;
    --accent-soft:rgba(63,124,255,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe5ee;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--txt)}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #c.drag{cursor:grabbing}
  .panel{position:absolute;background:var(--panel);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 10px 34px rgba(22,38,64,.13);padding:12px 14px}
  .title{font-size:15px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
  #brand{left:16px;top:16px;max-width:268px}
  #views{left:16px;top:104px;width:268px}
  #opts{right:16px;top:16px;width:214px}
  #help{left:16px;bottom:16px;width:268px;font-size:11.5px;color:var(--sub);line-height:1.85}
  #help b{color:var(--txt);font-weight:600}
  .sec{font-size:11px;color:var(--sub);margin:0 0 7px;font-weight:600;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  button{font:inherit;font-size:11.5px;color:var(--txt);background:rgba(255,255,255,.72);
    border:1px solid var(--line);border-radius:9px;padding:7px 4px;cursor:pointer;
    transition:.16s;white-space:nowrap}
  button:hover{background:#fff;border-color:rgba(63,124,255,.45);color:var(--accent);transform:translateY(-1px)}
  button.on{background:var(--accent-soft);border-color:rgba(63,124,255,.5);color:var(--accent);font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
  .row:first-of-type{margin-top:0}
  .row label{font-size:11.5px;color:var(--sub)}
  .sw{position:relative;width:38px;height:21px;border-radius:20px;background:rgba(20,32,52,.16);
    cursor:pointer;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.24);transition:.2s}
  .sw.on{background:var(--accent)}
  .sw.on::after{left:19.5px}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
  #hud{right:16px;bottom:16px;font-size:11px;color:var(--sub);padding:8px 12px;border-radius:10px}
  #hud span{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  #load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#eaf0f8,#dfe6f0);z-index:50;transition:opacity .5s}
  #load .ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(63,124,255,.18);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #load p{margin-top:16px;font-size:13px;color:var(--sub)}
  #load.err .ring{display:none}
  #load .errbox{display:none;max-width:460px;text-align:center;line-height:1.7;font-size:13px;color:#b0392f}
  #load.err .errbox{display:block}
  #load.err p{display:none}
  @media (max-width:900px){
    #help,#views{display:none}
    #opts{width:180px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="brand" class="panel">
  <div class="title">温馨家居 · 3D 室内建模</div>
  <div class="sub">三室格局 · 完整家具 · 可自由漫游<br>全程序化建模，无任何外部资源依赖</div>
</div>

<div id="views" class="panel">
  <div class="sec">视角预设</div>
  <div class="grid" id="viewGrid">
    <button data-view="top">鸟瞰</button>
    <button data-view="all">全景</button>
    <button data-view="living">客厅</button>
    <button data-view="dining">餐厅</button>
    <button data-view="kitchen">厨房</button>
    <button data-view="master">主卧</button>
    <button data-view="kids">儿童房</button>
    <button data-view="bath">卫生间</button>
    <button data-view="hall">玄关</button>
  </div>
</div>

<div id="opts" class="panel">
  <div class="sec">显示与光照</div>
  <div class="row"><label>夜间模式</label><div class="sw" id="swNight"></div></div>
  <div class="row"><label>室内灯光</label><div class="sw on" id="swLamp"></div></div>
  <div class="row"><label>天花板</label><div class="sw on" id="swCeil"></div></div>
  <div class="row"><label>墙体</label><div class="sw on" id="swWall"></div></div>
  <div class="row" style="display:block"><label>画面亮度</label>
    <input type="range" id="rngExp" min="0.55" max="1.9" step="0.01" value="1.12"></div>
  <div class="row" style="display:block"><label>移动速度</label>
    <input type="range" id="rngSpd" min="1" max="8" step="0.1" value="3.2"></div>
  <div class="grid two" style="margin-top:11px">
    <button id="btnMode" class="on">环绕视角</button>
    <button id="btnReset">重置</button>
  </div>
</div>

<div id="help" class="panel">
  <b>环绕模式</b> 左键拖拽旋转 · 右键/中键平移 · 滚轮缩放（触屏：单指旋转、双指缩放平移）<br>
  <b>行走模式</b> 左键拖拽转头 · <b>W A S D</b> 移动 · <b>Shift</b> 加速 · <b>Q/E</b> 升降<br>
  <b>F</b> 切换模式 · <b>N</b> 昼夜 · <b>R</b> 复位 · 数字键 <b>1-9</b> 切换预设视角
</div>

<div id="hud" class="panel">渲染 <span id="fps">--</span> FPS · <span id="cnt">0</span> 个物件 · <span id="modeTxt">环绕</span></div>

<div id="load">
  <div class="ring"></div>
  <p>正在加载 3D 引擎并构建房屋…</p>
  <div class="errbox" id="errbox"></div>
</div>

<script type="module">


/* =========================================================
   温馨家居 · 单文件 3D 室内建模
   ========================================================= */


/* ---------- 10_core.js ---------- */

/* =========================================================
   0. 载入 three.js（多 CDN 兜底）
   ========================================================= */
const CDN_LIST = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0',
  'https://cdn.skypack.dev/three@0.160.0'
];
let THREE = null;
for (const url of CDN_LIST) {
  try {
    const mod = await import(url);
    if (mod && mod.WebGLRenderer) { THREE = mod; break; }
  } catch (e) { console.warn('[three] 源不可用:', url, e && e.message); }
}
if (!THREE) {
  const box = document.getElementById('errbox');
  box.innerHTML = '无法加载 three.js。本页面需要联网获取 3D 引擎（约 1.2MB）。<br>请检查网络后刷新，或把 three.module.js 放到本地并修改 CDN_LIST。';
  document.getElementById('load').classList.add('err');
  throw new Error('three.js load failed');
}

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const box = document.getElementById('errbox');
  box.textContent = '当前浏览器/显卡不支持 WebGL，无法渲染 3D 场景。';
  document.getElementById('load').classList.add('err');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const MAXANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.05, 400);
camera.position.set(7.5, 9, 17);

/* =========================================================
   2. 随机 / 数学工具
   ========================================================= */
let _seed = 20260828;
function rand() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length) % arr.length]; }
const clamp = THREE.MathUtils.clamp;

/* =========================================================
   3. 程序化贴图
   ========================================================= */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mkTex(cv, rx, ry) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAXANISO;
  if (rx) t.repeat.set(rx, ry || rx);
  return t;
}

/* 木地板：错缝拼花 + 木纹 */
function woodFloorTex() {
  const S = 512, cv = mkCanvas(S, S), g = cv.getContext('2d');
  const rows = 10, ph = S / rows;
  g.fillStyle = '#9d7346'; g.fillRect(0, 0, S, S);
  for (let r = 0; r < rows; r++) {
    let x = -(r % 2) * 90;
    while (x < S) {
      const w = 150 + Math.random() * 90;
      const s = 0.86 + Math.random() * 0.26;
      g.fillStyle = 'rgb(' + (163 * s | 0) + ',' + (120 * s | 0) + ',' + (78 * s | 0) + ')';
      g.fillRect(x + 1, r * ph + 1, w - 2, ph - 2);
      g.strokeStyle = 'rgba(78,52,30,.16)'; g.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        const y0 = r * ph + Math.random() * ph;
        g.beginPath(); g.moveTo(x + 2, y0);
        g.bezierCurveTo(x + w * .3, y0 + rr(-4, 4), x + w * .7, y0 + rr(-4, 4), x + w - 3, y0 + rr(-3, 3));
        g.stroke();
      }
      g.fillStyle = 'rgba(60,38,22,.30)';
      g.fillRect(x, r * ph, w, 1.6); g.fillRect(x, r * ph, 1.6, ph);
      x += w;
    }
  }
  return cv;
}

/* 瓷砖 */
function tileTex(n, base, grout, glossy) {
  const S = 256, cv = mkCanvas(S, S), g = cv.getContext('2d'), u = S / n;
  g.fillStyle = grout; g.fillRect(0, 0, S, S);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const s = 0.93 + Math.random() * 0.14;
    g.fillStyle = 'rgb(' + (base[0] * s | 0) + ',' + (base[1] * s | 0) + ',' + (base[2] * s | 0) + ')';
    g.fillRect(i * u + 1.6, j * u + 1.6, u - 3.2, u - 3.2);
    if (glossy) {
      g.strokeStyle = 'rgba(255,255,255,.20)'; g.lineWidth = 1;
      g.strokeRect(i * u + 3, j * u + 3, u - 6, u - 6);
    }
  }
  return cv;
}

/* 地毯 */
function rugTex(c1, c2, c3, style) {
  const S = 256, cv = mkCanvas(S, S), g = cv.getContext('2d');
  g.fillStyle = c1; g.fillRect(0, 0, S, S);
  g.strokeStyle = c2; g.lineWidth = 10; g.strokeRect(14, 14, S - 28, S - 28);
  g.strokeStyle = c3; g.lineWidth = 3; g.strokeRect(28, 28, S - 56, S - 56);
  g.strokeStyle = c2; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(46, 46); g.lineTo(S - 46, S - 46);
  g.moveTo(S - 46, 46); g.lineTo(46, S - 46); g.stroke();
  if (style === 'dot') {
    g.fillStyle = c3;
    for (let i = 0; i < 26; i++) {
      g.beginPath(); g.arc(rr(50, S - 50), rr(50, S - 50), rr(3, 7), 0, 7); g.fill();
    }
  }
  return cv;
}

/* 天空（等距圆柱投影，用作背景与环境光） */
function skyTex(night) {
  const W = 1024, H = 512, cv = mkCanvas(W, H), g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, H);
  if (night) {
    grd.addColorStop(0, '#0a1424'); grd.addColorStop(.42, '#1b2c46');
    grd.addColorStop(.52, '#39496a'); grd.addColorStop(.56, '#20262f'); grd.addColorStop(1, '#0d0f12');
  } else {
    grd.addColorStop(0, '#4d8fd6'); grd.addColorStop(.38, '#a8cbe8');
    grd.addColorStop(.5, '#e9f0f4'); grd.addColorStop(.53, '#c9c3b4'); grd.addColorStop(1, '#6d6558');
  }
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  if (night) {
    for (let i = 0; i < 320; i++) {
      const a = rr(.25, .95);
      g.fillStyle = 'rgba(255,255,255,' + a + ')';
      g.fillRect(rr(0, W), rr(0, H * .48), rr(1, 2.2), rr(1, 2.2));
    }
    const m = g.createRadialGradient(W * .72, H * .2, 4, W * .72, H * .2, 90);
    m.addColorStop(0, 'rgba(255,250,235,.95)'); m.addColorStop(1, 'rgba(255,250,235,0)');
    g.fillStyle = m; g.fillRect(W * .72 - 100, H * .2 - 100, 200, 200);
  } else {
    const s = g.createRadialGradient(W * .3, H * .26, 6, W * .3, H * .26, 260);
    s.addColorStop(0, 'rgba(255,250,230,1)'); s.addColorStop(.25, 'rgba(255,238,200,.55)');
    s.addColorStop(1, 'rgba(255,238,200,0)');
    g.fillStyle = s; g.fillRect(W * .3 - 270, H * .26 - 270, 540, 540);
    g.globalAlpha = .5; g.fillStyle = '#fff';
    for (let i = 0; i < 22; i++) {
      const cx = rr(0, W), cy = rr(20, 190), r = rr(22, 66);
      g.beginPath();
      for (let k = 0; k < 5; k++) { g.arc(cx + k * r * .5, cy + Math.sin(k) * 6, r * (.7 - k * .07), 0, 7); }
      g.fill();
    }
    g.globalAlpha = 1;
  }
  return cv;
}

/* 装饰画 */
function artTex(kind) {
  const W = 320, H = 400, cv = mkCanvas(W, H), g = cv.getContext('2d');
  if (kind === 'mount') {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#f6e7cf'); gr.addColorStop(1, '#e2c9a6');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const sun = g.createRadialGradient(W * .62, H * .3, 6, W * .62, H * .3, 70);
    sun.addColorStop(0, '#f0a35e'); sun.addColorStop(1, 'rgba(240,163,94,0)');
    g.fillStyle = sun; g.fillRect(0, 0, W, H * .7);
    g.fillStyle = '#8d6a63'; g.beginPath();
    g.moveTo(0, H * .72); g.lineTo(W * .3, H * .42); g.lineTo(W * .52, H * .68);
    g.lineTo(W * .74, H * .38); g.lineTo(W, H * .72); g.closePath(); g.fill();
    g.fillStyle = '#5f4b4a'; g.beginPath();
    g.moveTo(0, H * .8); g.lineTo(W * .38, H * .6); g.lineTo(W * .68, H * .78);
    g.lineTo(W, H * .62); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
  } else if (kind === 'block') {
    g.fillStyle = '#f7f4ee'; g.fillRect(0, 0, W, H);
    const cols = ['#d9534f', '#3f6fb5', '#e8b73f', '#3f8f6d', '#2f3640', '#e07a5f'];
    const cells = [[0, 0, 2, 2], [2, 0, 2, 1], [2, 1, 2, 3], [0, 2, 1, 2], [1, 2, 1, 1], [1, 3, 1, 1]];
    cells.forEach((c, i) => {
      g.fillStyle = cols[i % cols.length];
      g.fillRect(c[0] * W / 4 + 7, c[1] * H / 4 + 7, c[2] * W / 4 - 14, c[3] * H / 4 - 14);
    });
  } else {
    g.fillStyle = '#f2f5ef'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#7d8f6a'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W / 2, H - 40); g.bezierCurveTo(W / 2, H * .6, W / 2, H * .5, W / 2, 60); g.stroke();
    g.fillStyle = '#8fa377';
    for (let i = 0; i < 9; i++) {
      const y = 70 + i * 32, s = i % 2 ? 1 : -1, L = 44 + i * 6;
      g.beginPath(); g.ellipse(W / 2 + s * L, y + 10, L, 15, s * .45, 0, 7); g.fill();
    }
    g.fillStyle = '#c9d6b8';
    for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(W / 2 + rr(-30, 30), rr(80, H - 70), rr(6, 12), 0, 7); g.fill(); }
  }
  return cv;
}

/* 家庭照片（剪影） */
function personSil(g, x, y, h, col) {
  g.fillStyle = col;
  g.beginPath(); g.arc(x, y - h * .78, h * .21, 0, 7); g.fill();
  g.beginPath();
  g.moveTo(x - h * .26, y); g.lineTo(x - h * .26, y - h * .55);
  g.quadraticCurveTo(x, y - h * .72, x + h * .26, y - h * .55);
  g.lineTo(x + h * .26, y); g.closePath(); g.fill();
}
function photoTex(i) {
  const S = 256, cv = mkCanvas(S, S), g = cv.getContext('2d');
  const sets = [['#cfe4f2', '#8fb6d6'], ['#f6e3cf', '#d9b48c'], ['#dfe9d5', '#a9c293'], ['#ece0f0', '#bb9fcd']];
  const c = sets[i % sets.length];
  const gr = g.createLinearGradient(0, 0, 0, S);
  gr.addColorStop(0, c[0]); gr.addColorStop(1, c[1]);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  g.fillStyle = 'rgba(255,255,255,.45)';
  g.beginPath(); g.ellipse(S / 2, S * .96, S * .62, S * .3, 0, 0, 7); g.fill();
  const n = 2 + (i % 2);
  for (let k = 0; k < n; k++) {
    const h = rr(.42, .58) * S, x = S * (0.32 + k * 0.3) + rr(-10, 10);
    personSil(g, x, S * .93, h, 'rgba(52,66,84,.82)');
  }
  g.fillStyle = 'rgba(255,255,255,.25)';
  g.beginPath(); g.arc(rr(30, 90), rr(30, 80), rr(10, 26), 0, 7); g.fill();
  return cv;
}

/* 电视画面 */
function tvTex() {
  const W = 512, H = 288, cv = mkCanvas(W, H), g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#1b2a4a'); gr.addColorStop(.45, '#e0703f');
  gr.addColorStop(.62, '#f2b263'); gr.addColorStop(.64, '#26384f'); gr.addColorStop(1, '#0f1826');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,225,170,.95)';
  g.beginPath(); g.arc(W * .62, H * .6, 26, 0, 7); g.fill();
  g.fillStyle = 'rgba(20,30,50,.85)';
  g.beginPath(); g.moveTo(0, H * .64); g.lineTo(W * .22, H * .48); g.lineTo(W * .44, H * .64); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(W * .5, H * .64); g.lineTo(W * .74, H * .42); g.lineTo(W, H * .64); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,190,120,.35)';
  for (let i = 0; i < 16; i++) g.fillRect(W * .58, H * .64 + i * 4, rr(20, 120) - i * 5, 2);
  return cv;
}

/* 冰箱贴 / 便签 */
function noteTex() {
  const S = 128, cv = mkCanvas(S, S), g = cv.getContext('2d');
  g.fillStyle = '#fdf6d8'; g.fillRect(0, 0, S, S);
  g.strokeStyle = '#e4d79a'; g.lineWidth = 2; g.strokeRect(6, 6, S - 12, S - 12);
  g.strokeStyle = '#9aa4b0'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(22, 34 + i * 15); g.lineTo(rr(60, 104), 34 + i * 15); g.stroke(); }
  g.fillStyle = '#e07a5f'; g.beginPath(); g.arc(96, 30, 10, 0, 7); g.fill();
  return cv;
}

/* =========================================================
   4. 环境贴图（PMREM）
   ========================================================= */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
function makeEnv(night) {
  const t = new THREE.CanvasTexture(skyTex(night));
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  const env = pmrem.fromEquirectangular(t).texture;
  return { bg: t, env: env };
}
let SKY = makeEnv(false);
scene.background = SKY.bg;
scene.environment = SKY.env;

/* =========================================================
   6. 几何助手（y = 物体底面高度）
   ========================================================= */
function G(x, y, z, ry) {
  const g = new THREE.Group();
  g.position.set(x || 0, y || 0, z || 0);
  if (ry) g.rotation.y = ry;
  return g;
}
function B(w, h, d, m, x, y, z, parent, ry) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x || 0, (y || 0) + h / 2, z || 0);
  if (ry) mesh.rotation.y = ry;
  if (parent) parent.add(mesh);
  return mesh;
}
function CY(rt, rb, h, m, x, y, z, parent, seg, open) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20, 1, !!open), m);
  mesh.position.set(x || 0, (y || 0) + h / 2, z || 0);
  if (parent) parent.add(mesh);
  return mesh;
}
function SP(r, m, x, y, z, parent, seg) {
  const s = seg || 18;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, s, Math.max(8, s >> 1)), m);
  mesh.position.set(x || 0, y || 0, z || 0);
  if (parent) parent.add(mesh);
  return mesh;
}
function PL(w, h, m, x, y, z, parent, rx, ry, rz) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  mesh.position.set(x || 0, y || 0, z || 0);
  mesh.rotation.set(rx || 0, ry || 0, rz || 0);
  if (parent) parent.add(mesh);
  return mesh;
}
function TO(r, tube, m, x, y, z, parent, rx, ry, seg) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, seg || 24), m);
  mesh.position.set(x || 0, y || 0, z || 0);
  mesh.rotation.set(rx || 0, ry || 0, 0);
  if (parent) parent.add(mesh);
  return mesh;
}
/* 圆角盒（用缩放球体代替时也很实用）——这里用薄板+圆柱拼出圆角矩形桌面 */
function roundSlab(w, h, d, r, m, x, y, z, parent) {
  const g = G(x, y, z);
  const inner = new THREE.Shape();
  const W = w / 2 - r, D = d / 2 - r;
  inner.moveTo(-W - r, -D); inner.lineTo(-W - r, D);
  inner.absarc(-W, D, r, Math.PI, Math.PI / 2, true);
  inner.lineTo(W, D + r); inner.absarc(W, D, r, Math.PI / 2, 0, true);
  inner.lineTo(W + r, -D); inner.absarc(W, -D, r, 0, -Math.PI / 2, true);
  inner.lineTo(-W, -D - r); inner.absarc(-W, -D, r, -Math.PI / 2, Math.PI, true);
  const geo = new THREE.ExtrudeGeometry(inner, { depth: h, bevelEnabled: false, curveSegments: 8 });
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, m);
  g.add(mesh); if (parent) parent.add(g);
  return g;
}

function addSlab(room, matFloor) {
  const x0 = room.x[0], x1 = room.x[1], z0 = room.z[0], z1 = room.z[1];
  const w = x1 - x0, d = z1 - z0;
  const g = new THREE.PlaneGeometry(w, d);
  const uv = g.attributes.uv;                       // 按实际尺寸铺贴图，避免各房间纹理尺度不一致
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 2, uv.getY(i) * d / 2);
  const f = new THREE.Mesh(g, matFloor);
  f.rotation.x = -Math.PI / 2;
  f.position.set((x0 + x1) / 2, 0, (z0 + z1) / 2);
  f.receiveShadow = true; f.userData.noShadow = true;
  floorGroup.add(f);
  const c = new THREE.Mesh(new THREE.PlaneGeometry(w, d), MAT.ceil);
  c.rotation.x = Math.PI / 2;
  c.position.set((x0 + x1) / 2, WH, (z0 + z1) / 2);
  c.userData.noShadow = true;
  ceilGroup.add(c);
  // 阴角线
  const corn = MAT.trim;
  B(w, 0.06, 0.06, corn, (x0 + x1) / 2, WH - 0.06, z0 + 0.03, ceilGroup).userData.noShadow = true;
  B(w, 0.06, 0.06, corn, (x0 + x1) / 2, WH - 0.06, z1 - 0.03, ceilGroup).userData.noShadow = true;
  B(0.06, 0.06, d, corn, x0 + 0.03, WH - 0.06, (z0 + z1) / 2, ceilGroup).userData.noShadow = true;
  B(0.06, 0.06, d, corn, x1 - 0.03, WH - 0.06, (z0 + z1) / 2, ceilGroup).userData.noShadow = true;
}

/* ---- 墙体 ---- */
const WALLS = [];   // 碰撞用：{ax,az,bx,bz,y0}
function buildWall(axis, fixed, from, to, holes, opt) {
  opt = opt || {};
  const h = opt.height || WH, m = opt.mat || MAT.wall, t = WT;
  const segs = [];
  let cur = from;
  const hs = (holes || []).slice().sort((p, q) => p.a - q.a);
  for (let i = 0; i < hs.length; i++) {
    const o = hs[i];
    if (o.a > cur + 0.001) segs.push({ a: cur, b: o.a, y0: 0, y1: h });
    if (o.y0 > 0.001) segs.push({ a: o.a, b: o.b, y0: 0, y1: o.y0 });
    if (o.y1 < h - 0.001) segs.push({ a: o.a, b: o.b, y0: o.y1, y1: h });
    cur = o.b;
  }
  if (cur < to - 0.001) segs.push({ a: cur, b: to, y0: 0, y1: h });

  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], len = s.b - s.a, hh = s.y1 - s.y0, mid = (s.a + s.b) / 2;
    if (len <= 0.001 || hh <= 0.001) continue;
    let mesh;
    if (axis === 'x') mesh = B(len, hh, t, m, mid, s.y0, fixed, wallGroup);
    else mesh = B(t, hh, len, m, fixed, s.y0, mid, wallGroup);
    mesh.castShadow = true; mesh.receiveShadow = true;
    // 踢脚线
    if (s.y0 < 0.001) {
      const sk = MAT.skirt, sh = 0.095;
      if (axis === 'x') {
        B(len, sh, 0.024, sk, mid, 0, fixed + t / 2 + 0.011, wallGroup);
        B(len, sh, 0.024, sk, mid, 0, fixed - t / 2 - 0.011, wallGroup);
      } else {
        B(0.024, sh, len, sk, fixed + t / 2 + 0.011, 0, mid, wallGroup);
        B(0.024, sh, len, sk, fixed - t / 2 - 0.011, 0, mid, wallGroup);
      }
    }
    // 顶线
    if (s.y1 > h - 0.001) {
      const sk = MAT.trim;
      if (axis === 'x') B(len, 0.05, t + 0.05, sk, mid, h - 0.05, fixed, wallGroup);
      else B(t + 0.05, 0.05, len, sk, fixed, h - 0.05, mid, wallGroup);
    }
    if (s.y0 < 1.7) {
      if (axis === 'x') WALLS.push({ ax: s.a, az: fixed, bx: s.b, bz: fixed, y0: s.y0 });
      else WALLS.push({ ax: fixed, az: s.a, bx: fixed, bz: s.b, y0: s.y0 });
    }
  }
}

/* ---- 门 ---- */
function addDoor(axis, fixed, a, b, y1, openAngle, hingeA) {
  const w = (b - a) - 0.08, h = y1 - 0.05, t = 0.045;
  const mid = (a + b) / 2;
  // 门套
  if (axis === 'x') {
    B(0.075, y1 + 0.05, WT + 0.05, MAT.trim, a + 0.037, 0, fixed, propGroup);
    B(0.075, y1 + 0.05, WT + 0.05, MAT.trim, b - 0.037, 0, fixed, propGroup);
    B(b - a, 0.07, WT + 0.05, MAT.trim, mid, y1 - 0.01, fixed, propGroup);
  } else {
    B(WT + 0.05, y1 + 0.05, 0.075, MAT.trim, fixed, 0, a + 0.037, propGroup);
    B(WT + 0.05, y1 + 0.05, 0.075, MAT.trim, fixed, 0, b - 0.037, propGroup);
    B(WT + 0.05, 0.07, b - a, MAT.trim, fixed, y1 - 0.01, mid, propGroup);
  }
  // 门扇
  const pivot = new THREE.Group();
  const hingeP = hingeA ? a + 0.05 : b - 0.05;
  if (axis === 'x') pivot.position.set(hingeP, 0, fixed);
  else pivot.position.set(fixed, 0, hingeP);
  const dir = hingeA ? 1 : -1;
  const leaf = axis === 'x'
    ? B(w, h, t, MAT.woodW, 0, 0, 0, pivot)
    : B(t, h, w, MAT.woodW, 0, 0, 0, pivot);
  if (axis === 'x') leaf.position.set(dir * (w / 2 + 0.022), h / 2, 0);
  else leaf.position.set(0, h / 2, dir * (w / 2 + 0.022));
  leaf.castShadow = true;
  // 门芯板造型
  const panel = axis === 'x'
    ? B(w - 0.18, h - 0.30, 0.012, MAT.trim, dir * (w / 2 + 0.022), h / 2, t / 2 + 0.006, pivot)
    : B(0.012, h - 0.30, w - 0.18, MAT.trim, t / 2 + 0.006, h / 2, dir * (w / 2 + 0.022), pivot);
  panel.userData.noShadow = true;
  // 门把手
  const hx = axis === 'x' ? dir * (w - 0.12) : 0, hz = axis === 'x' ? 0 : dir * (w - 0.12);
  const knob = CY(0.026, 0.026, 0.11, MAT.metal, hx, h / 2 - 0.14, hz, pivot, 12);
  if (axis === 'x') knob.rotation.set(Math.PI / 2, 0, 0);   // 柱轴 → 门法线 Z
  else knob.rotation.set(0, 0, Math.PI / 2);                // 柱轴 → 门法线 X
  knob.castShadow = true;
  pivot.rotation.y = openAngle || 0;
  propGroup.add(pivot);
  return pivot;
}

const GLOWS = [];
function glowMat() {
  const m = std(0xffffff, 1, 0, {
    transparent: true, opacity: 0.42, emissive: 0xffffff,
    emissiveIntensity: 0.55, side: THREE.DoubleSide
  });
  GLOWS.push(m); return m;
}
function wavyPlane(w, h, color, folds, amp) {
  const g = new THREE.PlaneGeometry(w, h, folds * 2, 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i);
    p.setZ(i, Math.sin(x / w * Math.PI * folds) * amp);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, std(color, 0.96, 0, { side: THREE.DoubleSide }));
}
function addWindow(axis, fixed, a, b, y0, y1, ry, curtainColor) {
  const w = b - a, h = y1 - y0;
  const g = G(axis === 'x' ? (a + b) / 2 : fixed, 0, axis === 'x' ? fixed : (a + b) / 2, ry);
  propGroup.add(g);
  // 玻璃
  const gl = PL(w - 0.06, h - 0.06, MAT.glass, 0, (y0 + y1) / 2, 0.004, g);
  gl.userData.noShadow = true;
  // 窗外亮片（模拟天光）
  const glow = PL(w - 0.06, h - 0.06, glowMat(), 0, (y0 + y1) / 2, -0.10, g);
  glow.userData.noShadow = true;
  // 窗框
  const fm = MAT.white;
  B(w, 0.055, WT + 0.04, fm, 0, y0 - 0.028, 0, g);
  B(w, 0.055, WT + 0.04, fm, 0, y1 - 0.028, 0, g);
  B(0.055, h, WT + 0.04, fm, -w / 2 + 0.028, y0, 0, g);
  B(0.055, h, WT + 0.04, fm, w / 2 - 0.028, y0, 0, g);
  B(0.042, h, WT + 0.02, fm, 0, y0, 0, g);
  // 窗台石
  B(w + 0.26, 0.05, WT + 0.18, MAT.marble, 0, y0 - 0.05, 0.03, g);
  // 窗帘
  if (curtainColor) {
    const ch = y1 + 0.34 - 0.02, cy = 0.02;
    const c1 = wavyPlane(0.66, ch, curtainColor, 7, 0.045);
    c1.position.set(-(w / 2 + 0.30), cy + ch / 2, 0.10); g.add(c1);
    const c2 = wavyPlane(0.66, ch, curtainColor, 7, 0.045);
    c2.position.set((w / 2 + 0.30), cy + ch / 2, 0.10); g.add(c2);
    // 纱帘
    const s1 = wavyPlane(0.9, ch - 0.1, 0xffffff, 9, 0.03);
    s1.material = std(0xffffff, 0.9, 0, { transparent: true, opacity: 0.32, side: THREE.DoubleSide });
    s1.position.set(-(w / 2 + 0.12), cy + (ch - 0.1) / 2, 0.055); g.add(s1);
    const s2 = s1.clone(); s2.position.x = (w / 2 + 0.12); g.add(s2);
    // 帘杆
    const rod = CY(0.022, 0.022, w + 1.1, MAT.metalD, 0, 0, 0.11, g, 10);
    rod.rotation.z = Math.PI / 2; rod.position.y = y1 + 0.34;
    const cap1 = SP(0.036, MAT.metalD, -(w + 1.1) / 2, y1 + 0.34, 0.11, g, 10);
    const cap2 = SP(0.036, MAT.metalD, (w + 1.1) / 2, y1 + 0.34, 0.11, g, 10);
    cap1.userData.noShadow = cap2.userData.noShadow = true;
  }
  return g;
}

function tilePanel(w, h, n, base, grout, x, y, z) {
  const t = mkTex(tileTex(n, base, grout, true));
  t.repeat.set(w / (n * 0.12), h / (n * 0.12));
  const p = PL(w, h, std(0xffffff, 0.25, 0.03, { map: t }), x, y + h / 2, z, propGroup);
  p.userData.noShadow = true;
  return p;

function lathe(pts, m, x, y, z, parent, seg, dbl) {
  const v = pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); });
  const g = new THREE.LatheGeometry(v, seg || 24);
  if (dbl) m = m.clone(), m.side = THREE.DoubleSide;

  mesh.position.set(x || 0, y || 0, z || 0);
  if (parent) parent.add(mesh);
  return mesh;
}

function addBooks(parent, x, y, z, width, ry, hMax, deep, lean) {
  const g = G(x, y, z, ry);
  parent.add(g);
  const d = deep || 0.16;
  let cx = -width / 2 + 0.005;
  let guard = 0;
  while (cx < width / 2 - 0.03 && guard++ < 60) {
    const bw = rr(0.022, 0.045), bh = (hMax || 0.26) * rr(0.72, 1.0);
    if (cx + bw > width / 2) break;
    const b = B(bw, bh, d, bookMat(), cx + bw / 2, 0, 0, g);
    if (lean && rand() > 0.72) { b.rotation.z = rr(0.10, 0.22); b.position.y += bh * 0.06; }
    B(bw * 0.7, bh * 0.86, d + 0.004, std(0xf2efe6, 0.9), cx + bw / 2, bh * 0.07, 0, g).userData.noShadow = true;
    cx += bw + 0.004;
  }
  return g;
}
function bookStack(parent, x, y, z, n, ry) {
  const g = G(x, y, z, ry); parent.add(g);

  for (let i = 0; i < n; i++) {

const VIEWS = {
  top:    [[6.50, 0.20, 6.00], [6.50, 22.0, 6.90]],
  all:    [[6.20, 0.90, 5.20], [8.50, 9.50, 17.5]],
  living: [[3.40, 1.00, 3.00], [6.30, 2.30, 0.78]],
  dining: [[10.0, 1.00, 4.85], [12.50, 2.10, 3.85]],
  kitchen:[[10.0, 1.10, 1.60], [8.30, 2.10, 3.30]],
  master: [[2.60, 0.90, 9.40], [5.10, 2.00, 11.35]],
  kids:   [[11.0, 0.90, 9.60], [9.55, 2.00, 11.45]],
  bath:   [[7.20, 1.00, 10.30], [8.55, 1.95, 8.05]],
  hall:   [[3.00, 1.20, 6.90], [0.95, 1.70, 6.25]]
};
const orbit = { target: new THREE.Vector3(), theta: 0, phi: 0.9, radius: 12 };
const cur = { target: new THREE.Vector3(), theta: 0, phi: 0.9, radius: 12 };
const walk = { pos: new THREE.Vector3(1.0, 1.65, 6.9), yaw: -Math.PI / 2, pitch: 0 };
let MODE = 'orbit';

function viewFrom(t, p) {
  const dx = p[0] - t[0], dy = p[1] - t[1], dz = p[2] - t[2];
  const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
  return {
    target: new THREE.Vector3(t[0], t[1], t[2]),
    radius: r,
    phi: Math.acos(clamp(dy / r, -1, 1)),
    theta: Math.atan2(dx, dz)
  };
}
function setView(name, instant) {
  const v = VIEWS[name] || VIEWS.all;
  const s = viewFrom(v[0], v[1]);
  orbit.target.copy(s.target); orbit.theta = s.theta; orbit.phi = s.phi; orbit.radius = s.radius;
  if (instant) { cur.target.copy(s.target); cur.theta = s.theta; cur.phi = s.phi; cur.radius = s.radius; }
  if (MODE === 'walk') { MODE = 'orbit'; syncModeBtn(); }
}
function applyCamera() {
  if (MODE === 'orbit') {
    const sp = Math.sin(cur.phi), cp = Math.cos(cur.phi);
    camera.position.set(
      cur.target.x + cur.radius * sp * Math.sin(cur.theta),
      cur.target.y + cur.radius * cp,
      cur.target.z + cur.radius * sp * Math.cos(cur.theta));
    camera.up.set(0, 1, 0);
    camera.lookAt(cur.target);
  } else {
    camera.position.copy(walk.pos);
    camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
  }
}
setView('all', true);

/* ---- 碰撞：墙体线段 ---- */
function distToSeg(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const wx = px - ax, wz = pz - az;
  const L = vx * vx + vz * vz;
  let t = L > 0 ? (wx * vx + wz * vz) / L : 0;
  t = clamp(t, 0, 1);
  const cx = ax + vx * t, cz = az + vz * t;
  return Math.hypot(px - cx, pz - cz);
}
function freeAt(x, z) {
  if (x < 0.30 || x > 12.70 || z < 0.30 || z > 11.70) return false;
  for (let i = 0; i < WALLS.length; i++) {
    const w = WALLS[i];
    if (w.y0 > 1.6) continue;
    if (distToSeg(x, z, w.ax, w.az, w.bx, w.bz) < 0.30) return false;
  }
  return true;
}

/* ---- 输入 ---- */
const pointers = new Map();
let dragBtn = -1, lastX = 0, lastY = 0, pinchD = 0;
let keyState = {};
let SPEED = 3.2;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragBtn = e.button; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('drag');
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchD > 0 && MODE === 'orbit') orbit.radius = clamp(orbit.radius * (pinchD / d), 1.2, 40);
    pinchD = d;
    return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (MODE === 'orbit') {
    if (dragBtn === 0) {
      orbit.theta -= dx * 0.0052;
      orbit.phi = clamp(orbit.phi - dy * 0.0052, 0.06, 1.52);
    } else {
      const k = orbit.radius * 0.0016;
      const rt = new THREE.Vector3(Math.cos(orbit.theta), 0, -Math.sin(orbit.theta));
      const fw = new THREE.Vector3(Math.sin(orbit.theta), 0, Math.cos(orbit.theta));
      orbit.target.addScaledVector(rt, -dx * k);
      orbit.target.addScaledVector(fw, -dy * k);
      orbit.target.y = clamp(orbit.target.y, 0.05, 2.6);
      orbit.target.x = clamp(orbit.target.x, -1, 14);
      orbit.target.z = clamp(orbit.target.z, -1, 13);
    }
  } else {
    walk.yaw -= dx * 0.0028;
    walk.pitch = clamp(walk.pitch - dy * 0.0028, -1.35, 1.35);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId); dragBtn = -1; pinchD = 0;
  canvas.classList.remove('drag');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (MODE === 'orbit') orbit.radius = clamp(orbit.radius * Math.pow(1.0015, e.deltaY), 1.2, 40);
  else SPEED = clamp(SPEED + e.deltaY * 0.002, 1, 8);
}, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keyState[k] = true;
  if (k === 'f') toggleMode();
  if (k === 'n') { setNight(!NIGHT); syncSw('swNight', NIGHT); }
  if (k === 'r') { setView('all'); if (MODE === 'walk') { walk.pos.set(1.0, 1.65, 6.9); walk.yaw = -Math.PI / 2; walk.pitch = 0; } }
  const num = '123456789';
  if (num.indexOf(k) >= 0) setView(Object.keys(VIEWS)[parseInt(k, 10) - 1]);
  if ([' ', 'w', 'a', 's', 'd', 'q', 'e'].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener('keyup', e => { keyState[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { keyState = {}; });

function toggleMode() {
  if (MODE === 'orbit') {
    MODE = 'walk';
    const dir = new THREE.Vector3().subVectors(cur.target, camera.position);
    if (dir.lengthSq() < 0.01) dir.set(0, 0, -1);
    walk.yaw = Math.atan2(-dir.x, -dir.z);
    walk.pitch = Math.asin(clamp(dir.y / dir.length(), -1, 1));
    walk.pos.copy(camera.position);
    walk.pos.y = clamp(walk.pos.y, 0.35, 2.65);
    if (!freeAt(walk.pos.x, walk.pos.z)) walk.pos.set(1.0, 1.65, 6.9);
  } else {
    MODE = 'orbit';
    const fw = new THREE.Vector3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw));
    orbit.target.copy(walk.pos).addScaledVector(fw, 3.0);
    orbit.target.y = clamp(walk.pos.y + fw.y * 0, 0.05, 2.6);
    const s = viewFrom([orbit.target.x, orbit.target.y, orbit.target.z], [walk.pos.x, walk.pos.y, walk.pos.z]);
    orbit.theta = s.theta; orbit.phi = clamp(s.phi, 0.06, 1.52); orbit.radius = 3.0;
    cur.target.copy(orbit.target); cur.theta = orbit.theta; cur.phi = orbit.phi; cur.radius = orbit.radius;
  }
  syncModeBtn();
}

function updateWalk(dt) {
  const fwd = (keyState['w'] || keyState['arrowup'] ? 1 : 0) - (keyState['s'] || keyState['arrowdown'] ? 1 : 0);
  const side = (keyState['d'] || keyState['arrowright'] ? 1 : 0) - (keyState['a'] || keyState['arrowleft'] ? 1 : 0);
  const up = (keyState['e'] ? 1 : 0) - (keyState['q'] ? 1 : 0);
  const sp = SPEED * (keyState['shift'] ? 2.1 : 1);
  if (fwd || side) {
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
    const rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw);
    let mx = (fx * fwd + rx * side), mz = (fz * fwd + rz * side);
    const L = Math.hypot(mx, mz) || 1;
    mx = mx / L * sp * dt; mz = mz / L * sp * dt;
    const nx = walk.pos.x + mx, nz = walk.pos.z + mz;
    if (freeAt(nx, nz)) { walk.pos.x = nx; walk.pos.z = nz; }
    else if (freeAt(nx, walk.pos.z)) walk.pos.x = nx;
    else if (freeAt(walk.pos.x, nz)) walk.pos.z = nz;
  }
  if (up) walk.pos.y = clamp(walk.pos.y + up * sp * 0.6 * dt, 0.35, 2.65);
}

/* =========================================================
   16. 昼夜 / 开关
   ========================================================= */
const SKY_N = makeEnv(true), SKY_D = SKY;
let NIGHT = false, LAMP_ON = true;
function applyLamps() {
  for (let i = 0; i < LAMPS.length; i++) {
    const L = LAMPS[i];
    L.light.intensity = LAMP_ON ? (NIGHT ? L.night : L.day) : 0;
    L.bulb.material = LAMP_ON ? MAT.bulb : MAT.bulbOff;
  }
}
function setNight(v) {
  NIGHT = v;
  scene.background = v ? SKY_N.bg : SKY_D.bg;
  scene.environment = v ? SKY_N.env : SKY_D.env;
  hemi.intensity = v ? 0.18 : 0.55;
  hemi.color.setHex(v ? 0x2c3d5c : 0xdbe9ff);
  hemi.groundColor.setHex(v ? 0x191c22 : 0x6b5c4a);
  sun.intensity = v ? 0.32 : 2.5;
  sun.color.setHex(v ? 0xa9c2ea : 0xffeed4);
  fill.intensity = v ? 0.10 : 0.45;
  fill2.intensity = v ? 0.06 : 0.30;
  scene.fog.color.setHex(v ? 0x0d121c : 0xc9d6e4);
  for (let i = 0; i < GLOWS.length; i++) {
    const m = GLOWS[i];
    m.opacity = v ? 0.20 : 0.42;
    m.emissiveIntensity = v ? 0.14 : 0.55;
    m.color.setHex(v ? 0x2c3a58 : 0xffffff);
  }
  for (let i = 0; i < TV_SCREENS.length; i++) TV_SCREENS[i].emissiveIntensity = v ? 1.15 : 0.35;
  applyLamps();
}
applyLamps();

/* =========================================================
   17. UI
   ========================================================= */
const $ = id => document.getElementById(id);
function syncSw(id, on) { $(id).classList.toggle('on', !!on); }
function syncModeBtn() {
  $('btnMode').textContent = MODE === 'orbit' ? '环绕视角' : '行走漫游';
  $('btnMode').classList.toggle('on', MODE === 'orbit');
  $('modeTxt').textContent = MODE === 'orbit' ? '环绕' : '行走';
}
$('btnMode').onclick = toggleMode;
$('btnReset').onclick = () => { setView('all'); };
$('swNight').onclick = () => { setNight(!NIGHT); syncSw('swNight', NIGHT); };
$('swLamp').onclick = () => { LAMP_ON = !LAMP_ON; syncSw('swLamp', LAMP_ON); applyLamps(); };
$('swCeil').onclick = () => { ceilGroup.visible = !ceilGroup.visible; syncSw('swCeil', ceilGroup.visible); };
$('swWall').onclick = () => { wallGroup.visible = !wallGroup.visible; syncSw('swWall', wallGroup.visible); };
$('rngExp').oninput = e => { renderer.toneMappingExposure = parseFloat(e.target.value); };
$('rngSpd').oninput = e => { SPEED = parseFloat(e.target.value); };
document.querySelectorAll('#viewGrid button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#viewGrid button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    setView(b.dataset.view);
  };
});
syncModeBtn();
syncSw('swNight', false); syncSw('swLamp', true); syncSw('swCeil', true); syncSw('swWall', true);
document.querySelector('#viewGrid button[data-view="all"]').classList.add('on');

/* 物件统计 */
let meshCount = 0;
scene.traverse(o => { if (o.isMesh) meshCount++; });
$('cnt').textContent = meshCount;

/* =========================================================
   18. 主循环
   ========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, fpsTime = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (MODE === 'walk') {
    updateWalk(dt);
  } else {
    const k = 1 - Math.exp(-dt * 9);
    cur.target.lerp(orbit.target, k);
    cur.theta += (orbit.theta - cur.theta) * k;
    cur.phi += (orbit.phi - cur.phi) * k;
    cur.radius += (orbit.radius - cur.radius) * k;
  }
  applyCamera();
  renderer.render(scene, camera);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc > 0.6) { $('fps').textContent = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
  fpsTime += dt;
}
applyCamera();
renderer.render(scene, camera);
tick();
setTimeout(() => {
  const l = document.getElementById('load');
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 520);
}, 260);

</script>
