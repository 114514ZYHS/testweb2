<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="用体素建模的三维太阳系：JPL 真实轨道根数、NASA 物理/太阳参数，可点击查看天体资料">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%9E%3C/text%3E%3C/svg%3E">
<title>体素太阳系（离线版 · 双击即用）</title>
<style>
:root {
  --panel-bg: rgba(10, 14, 30, 0.88);
  --border: rgba(120, 160, 255, 0.25);
  --accent: #ffce54;
  --text: #dbe6ff;
  --dim: #8fa3cf;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #03040a;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--text);
}

#app { position: fixed; inset: 0; }
#app canvas { display: block; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.body-label {
  color: rgba(200, 216, 255, 0.85);
  font-size: 12px;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,1);
  pointer-events: auto;
  cursor: pointer;
  white-space: nowrap;
  transform: translate(8px, -14px);
  user-select: none;
}
.body-label b { color: #fff; font-weight: 600; }
.body-label.moon-label { font-size: 10px; color: rgba(170, 190, 230, 0.75); }
.body-label.sun-label { color: #ffd76e; font-size: 13px; }
.body-label:hover b { color: var(--accent); }
.body-label.focused, .body-label.focused b { color: var(--accent) !important; text-shadow: 0 0 10px rgba(255, 206, 84, 0.55); }

/* ---------- 顶栏 ---------- */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 14px 18px;
  pointer-events: none;
  z-index: 10;
}
#title-block h1 {
  font-size: 20px; font-weight: 700; color: #fff;
  text-shadow: 0 0 18px rgba(255, 190, 80, 0.45);
}
#title-block h1 span {
  font-size: 11px; font-weight: 400; color: var(--dim);
  margin-left: 8px; letter-spacing: 3px;
}
#title-block .src { font-size: 10.5px; color: var(--dim); margin-top: 4px; opacity: .85; }

#time-block { text-align: right; pointer-events: auto; }
#event-badge {
  display: none;
  margin-bottom: 6px;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12.5px;
  letter-spacing: 1px;
  background: rgba(20, 28, 55, 0.9);
  border: 1px solid var(--border);
  color: var(--text);
}
#event-badge.show { display: inline-block; animation: badgePulse 2s infinite; }
#event-badge.solar { border-color: rgba(255, 206, 84, 0.7); color: var(--accent); }
#event-badge.lunar { border-color: rgba(140, 190, 255, 0.7); color: #a9cdff; }
@keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
#date-display { margin-bottom: 6px; }
#sim-date { font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
#sim-speed-label { font-size: 11px; color: var(--dim); margin-left: 10px; }
#time-controls { display: flex; gap: 6px; justify-content: flex-end; }
#time-controls button {
  background: rgba(20, 28, 55, 0.8);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
#time-controls button:hover { border-color: var(--accent); color: var(--accent); }
#time-controls button.active { background: rgba(255, 206, 84, 0.18); border-color: var(--accent); color: var(--accent); }
#date-jump {
  background: rgba(20, 28, 55, 0.8);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 12px;
  color-scheme: dark;
  cursor: pointer;
}
#date-jump:hover { border-color: var(--accent); }

/* ---------- 底栏 ---------- */
#bottombar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; flex-direction: column; gap: 8px;
  align-items: center;
  padding: 12px 14px 14px;
  pointer-events: none;
  z-index: 10;
}
#planet-nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
#planet-nav button {
  background: rgba(20, 28, 55, 0.8);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
#planet-nav button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
#planet-nav button.active { background: rgba(255, 206, 84, 0.18); border-color: var(--accent); color: var(--accent); }

#settings {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center;
  background: rgba(10, 14, 30, 0.7);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 16px;
  pointer-events: auto;
  font-size: 12px;
  color: var(--dim);
}
#settings label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
#settings input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
#settings input[type="range"] { width: 90px; accent-color: var(--accent); cursor: pointer; }

#hint {
  position: fixed; left: 18px; bottom: 14px;
  font-size: 11px; color: var(--dim);
  background: rgba(10, 14, 30, 0.6);
  padding: 5px 10px; border-radius: 8px;
  z-index: 9;
}
#hint b { color: var(--accent); }

/* ---------- 资料面板 ---------- */
#info-panel {
  position: fixed; top: 76px; right: 14px; bottom: 90px;
  width: 340px;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  z-index: 20;
  overflow-y: auto;
  padding: 20px 20px 16px;
  transition: transform .35s cubic-bezier(.2,.9,.3,1), opacity .3s;
  box-shadow: 0 8px 40px rgba(0,0,0,0.55);
}
#info-panel.hidden { transform: translateX(380px); opacity: 0; pointer-events: none; }
#panel-close {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none; color: var(--dim);
  font-size: 16px; cursor: pointer; z-index: 2;
}
#panel-close:hover { color: #fff; }

#panel-content h2 { font-size: 21px; color: #fff; }
#panel-content .en-name { font-size: 11px; color: var(--dim); letter-spacing: 2px; margin: 2px 0 4px; }
#panel-content .type-tag {
  display: inline-block; font-size: 10.5px; color: var(--accent);
  border: 1px solid rgba(255, 206, 84, 0.4); border-radius: 4px;
  padding: 1px 8px; margin-bottom: 12px;
}
#panel-content .desc { font-size: 12.5px; line-height: 1.75; color: #c6d4f2; margin-bottom: 14px; }
#panel-content h3 {
  font-size: 12px; color: var(--accent); margin: 14px 0 8px;
  letter-spacing: 1px; border-left: 3px solid var(--accent); padding-left: 8px;
}
#panel-content table { width: 100%; border-collapse: collapse; font-size: 12px; }
#panel-content td { padding: 4px 2px; border-bottom: 1px dashed rgba(120,160,255,0.12); line-height: 1.5; }
#panel-content td:first-child { color: var(--dim); width: 42%; white-space: nowrap; }
#panel-content td:last-child { color: #e8eeff; }

#panel-content .moon-list { display: flex; flex-wrap: wrap; gap: 6px; }
#panel-content .moon-list button {
  background: rgba(30, 42, 80, 0.8);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 12px;
  font-size: 11.5px;
  padding: 4px 11px;
  cursor: pointer;
  transition: all .15s;
}
#panel-content .moon-list button:hover { border-color: var(--accent); color: var(--accent); }
#panel-content .note { font-size: 10.5px; color: var(--dim); margin-top: 10px; line-height: 1.6; }
#panel-content .sources { font-size: 10px; color: #5f6f96; margin-top: 8px; line-height: 1.6; }
#panel-content .back-btn {
  width: 100%; margin-top: 14px;
  background: rgba(255, 206, 84, 0.12);
  border: 1px solid rgba(255, 206, 84, 0.5);
  color: var(--accent);
  border-radius: 8px;
  padding: 8px;
  font-size: 12.5px;
  cursor: pointer;
}
#panel-content .back-btn:hover { background: rgba(255, 206, 84, 0.22); }

/* ---------- tooltip ---------- */
#tooltip {
  position: fixed; z-index: 30;
  background: rgba(8, 12, 26, 0.92);
  border: 1px solid var(--border);
  color: #fff; font-size: 12px;
  padding: 4px 10px; border-radius: 6px;
  pointer-events: none;
  transform: translate(12px, -26px);
}
#tooltip .en { color: var(--dim); font-size: 10px; margin-left: 6px; }
#tooltip .dist { color: var(--accent); font-size: 10px; margin-left: 6px; }
#tooltip.hidden { display: none; }

/* ---------- loading ---------- */
#loading {
  position: fixed; inset: 0; z-index: 100;
  background: #03040a;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .6s;
}
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { text-align: center; color: var(--dim); font-size: 13px; letter-spacing: 2px; }
.vox-spinner { display: grid; grid-template-columns: repeat(3, 14px); gap: 5px; width: max-content; margin: 0 auto 18px; }
.vox-spinner span {
  width: 14px; height: 14px; background: var(--accent);
  animation: pulse 1.2s infinite ease-in-out;
}
.vox-spinner span:nth-child(2) { animation-delay: .15s; background: #ff9a3d; }
.vox-spinner span:nth-child(3) { animation-delay: .3s; background: #ffce54; }
.vox-spinner span:nth-child(4) { animation-delay: .45s; background: #e07030; }
.vox-spinner span:nth-child(5) { animation-delay: .6s; background: #ffd98a; }
.vox-spinner span:nth-child(6) { animation-delay: .75s; background: #ff8c2e; }
.vox-spinner span:nth-child(7) { animation-delay: .9s; background: #ffb347; }
.vox-spinner span:nth-child(8) { animation-delay: 1.05s; background: #f4a300; }
.vox-spinner span:nth-child(9) { animation-delay: 1.2s; background: #ffe9b0; }
@keyframes pulse { 0%, 70%, 100% { transform: scale(0.55); opacity: .35; } 35% { transform: scale(1); opacity: 1; } }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: rgba(120,160,255,0.25); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 窄屏适配 ---------- */
@media (max-width: 760px) {
  #title-block .src { display: none; }
  #hint { display: none; }
  #info-panel {
    left: 10px; right: 10px; width: auto;
    top: auto; bottom: 108px; max-height: 42vh;
  }
  #info-panel.hidden { transform: translateY(120%); }
  #sim-date { font-size: 13px; }
  #planet-nav button { padding: 4px 9px; font-size: 11px; }
  #settings { gap: 10px; padding: 5px 10px; font-size: 11px; }
}

</style>

</script>

<body>
<div id="app"></div>

<!-- 顶部信息栏 -->
<header id="topbar">
  <div id="title-block">
    <h1>体素太阳系 <span>VOXEL SOLAR SYSTEM</span></h1>
    <p class="src">轨道数据：NASA/JPL（J2000 历元开普勒根数 + 世纪变率）· 物理/太阳参数：NASA NSSDC Fact Sheets</p>
  </div>
  <div id="time-block">
    <div id="event-badge"></div>
    <div id="date-display">
      <span id="sim-date">----年--月--日</span>
      <span id="sim-speed-label"></span>
    </div>
    <div id="time-controls">
      <button id="btn-pause" title="暂停 / 继续">⏸</button>
      <button id="btn-slower" title="减速（←）">◀◀</button>
      <button id="btn-faster" title="加速（→）">▶▶</button>
      <button id="btn-today" title="回到今天">今天</button>
      <input type="date" id="date-jump" title="跳转到指定日期">
      <button id="btn-shot" title="保存当前画面截图">📷</button>
    </div>
  </div>
</header>

<!-- 底部导航 / 设置 -->
<nav id="bottombar">
  <div id="planet-nav"></div>
  <div id="settings">
    <label><input type="checkbox" id="chk-orbits" checked> 轨道线</label>
    <label><input type="checkbox" id="chk-labels" checked> 名称标签</label>
    <label><input type="checkbox" id="chk-belt" checked> 小行星带</label>
    <label><input type="checkbox" id="chk-real-dist"> 真实距离比例</label>
    <label class="slider">天体大小
      <input type="range" id="rng-size" min="60" max="220" value="100">
    </label>
  </div>
</nav>

<div id="hint">🖱 拖动旋转 · 滚轮缩放 · <b>点击任意天体</b>查看资料 · ESC 返回全景 · 空格暂停</div>

<!-- 资料面板 -->
<aside id="info-panel" class="hidden">
  <button id="panel-close" title="关闭">✕</button>
  <div id="panel-content"></div>
</aside>

<div id="tooltip" class="hidden"></div>

<div id="loading">
  <div class="box">
    <div class="vox-spinner"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <p>正在用体素搭建太阳系…</p>
  </div>
</div>

});
</script>
