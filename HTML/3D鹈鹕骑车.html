<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>鹈鹕骑士 · 海岸抓鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0914;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:linear-gradient(170deg,#241f3d,#12101e 55%,#0b0a16);z-index:50;transition:opacity .6s}
#boot h1{font-size:clamp(22px,4.6vw,38px);letter-spacing:.16em;font-weight:800;
  background:linear-gradient(96deg,#ffd7a0,#ff9aa8 42%,#8fd8c8);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot p{font-size:12.5px;color:#a9a4c4;letter-spacing:.1em}
#boot .ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.14);
  border-top-color:#ffd28a;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot small{position:absolute;bottom:26px;color:#6d688a;font-size:11px}
#boot.err h1{background:linear-gradient(96deg,#ff9aa8,#ff6b6b);-webkit-background-clip:text;background-clip:text}
.hide{opacity:0!important;pointer-events:none!important}

/* ---------- hud ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:1;transition:opacity .4s}
.panel{position:absolute;background:rgba(20,18,32,.44);border:1px solid rgba(255,255,255,.13);
  border-radius:14px;padding:9px 12px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
#stats{top:12px;left:12px;min-width:152px}
#stats .row{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
#stats .k{font-size:10px;color:#a9a4c4;letter-spacing:.08em;min-width:32px}
#stats .v{font-size:17px;font-weight:700;letter-spacing:.02em}
#stats .u{font-size:9.5px;color:#7d7899}
#stats .bar{margin:5px 0 6px;height:5px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden}
#stats .bar i{display:block;height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,#8fd8c8,#ffd28a 62%,#ff9aa8);transition:width .08s linear}

#score{top:12px;right:12px;text-align:right;min-width:132px}
#score .fish{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;margin-bottom:4px}
#score .fish span{font-size:25px;font-weight:800;color:#9fe6d4;line-height:1;
  text-shadow:0 0 14px rgba(143,216,200,.5)}
#score .fish small{font-size:10px;color:#a9a4c4}
#score .row{display:flex;justify-content:flex-end;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums}
#score .k{font-size:10px;color:#a9a4c4}
#score .v{font-size:13.5px;font-weight:700}
#combo{color:#ffd28a}
#combo.hot{color:#ff9aa8;text-shadow:0 0 12px rgba(255,154,168,.75)}

#clock{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 13px}
#clock .orb{width:20px;height:20px;border-radius:50%;position:relative;overflow:hidden;flex:0 0 auto;
  background:radial-gradient(circle at 50% 50%,#ffd28a,#ff8a4c 55%,rgba(255,138,76,0) 72%);
  box-shadow:0 0 12px rgba(255,190,120,.55);transition:background .8s,box-shadow .8s}
#clock .orb.night{background:radial-gradient(circle at 38% 38%,#eef2ff,#9aa8d8 58%,rgba(154,168,216,0) 74%);
  box-shadow:0 0 14px rgba(170,190,255,.45)}
#clock .txt{font-size:11px;letter-spacing:.09em;color:#dcd8f0;font-variant-numeric:tabular-nums}

#toasts{position:absolute;top:78px;left:50%;transform:translateX(-50%);display:flex;
  flex-direction:column;align-items:center;gap:8px;width:min(92vw,420px)}
.toast{display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:13px;
  background:linear-gradient(100deg,rgba(255,210,138,.2),rgba(20,18,32,.82));
  border:1px solid rgba(255,210,138,.44);backdrop-filter:blur(10px);
  box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 22px rgba(255,210,138,.16);
  animation:toastIn .42s cubic-bezier(.16,1.1,.3,1) both;white-space:nowrap;max-width:100%}
.toast.out{animation:toastOut .45s ease forwards}
.toast .ic{font-size:19px}
.toast .tt{font-size:12.5px;font-weight:700;color:#ffe9c4;letter-spacing:.04em}
.toast .ds{font-size:10px;color:#b9b3d4}
.toast .col{display:flex;flex-direction:column;gap:1px;overflow:hidden}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}

#camName{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);font-size:11.5px;
  letter-spacing:.2em;color:rgba(255,255,255,.72);text-shadow:0 2px 10px rgba(0,0,0,.7);
  opacity:0;transition:opacity .3s}
#camName.show{opacity:1}

#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;
  letter-spacing:.06em;color:rgba(255,255,255,.46);text-align:center;line-height:1.7;pointer-events:none}
#hint b{color:#ffd28a;font-weight:600}
#qinfo{position:absolute;top:148px;left:15px;font-size:10px;color:#8f89ad;letter-spacing:.07em;
  text-shadow:0 1px 7px rgba(0,0,0,.75);transition:opacity .5s}

/* ---------- touch ---------- */
#pad{position:absolute;inset:auto 0 0 0;height:190px;pointer-events:none;display:none}
#pad.on{display:block}
.btn{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:50%;background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.24);backdrop-filter:blur(7px);

.btn.act{transform:scale(.9);background:rgba(255,210,138,.42);border-color:rgba(255,210,138,.75)}
#bL{left:16px;bottom:74px;width:62px;height:62px}
#bR{left:92px;bottom:74px;width:62px;height:62px}
#bUp{left:54px;bottom:146px;width:56px;height:56px}
#bDn{left:54px;bottom:20px;width:56px;height:56px}

#bWing{right:26px;bottom:88px;width:62px;height:62px;font-size:14px}
#bCam{right:26px;bottom:16px;width:50px;height:50px;font-size:12px}

<script>
/* =========================================================================
   鹈鹕骑士 · 海岸抓鱼  —  单文件实现
   Part 1 : 工具 / 配置 / 环境曲线 / 成就 / 音频
   ========================================================================= */
(function (global) {
'use strict';

/* ---------------- 数学工具 ---------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const TAU = Math.PI * 2;
global.__PK = { clamp, lerp, rand, randInt, pick, smoothstep, damp, TAU };

/* ---------------- 全局配置 ---------------- */
const CFG = {
  laneX: [-5.6, -2.8, 0, 2.8, 5.6],   // 5 条车道
  laneCenter: 2,                       // 起始车道
  roadHalf: 7.4,                       // 路面半宽
  shoreX: 13.5,                        // 岸线 X
  seaMinX: 12.5,
  maxSpeed: 34.5,                      // m/s  ≈124 km/h
  cruiseSpeed: 17,
  minSpeed: 5.5,
  accel: 11,
  brake: 18,
  drag: 0.42,
  gravity: 27,
  jumpV: 10.2,
  camTransition: 0.55
};
global.__CFG = CFG;

/* ---------------- 昼夜环境关键帧 ----------------
   t: 0 = 黄昏 (太阳贴海面) → 夜 → 黎明 → 正午 → 回到黄昏
------------------------------------------------- */
const ENV_KEYS = [
  { t: 0.00, sunY: 0.07, sunI: 1.45, ambI: 0.60, star: 0.00, moon: 0.00, name: '黄昏',
    sunC: 0xff9b52, ambC: 0x8a7ab0, top: 0x3a2a6e, hor: 0xff9a5c, fog: 0xd98a6a, deep: 0x1b2440, shal: 0x3a5a6a },
  { t: 0.07, sunY: -0.03, sunI: 0.85, ambI: 0.46, star: 0.04, moon: 0.07, name: '日落',
    sunC: 0xff6a3a, ambC: 0x6a5a90, top: 0x2a2154, hor: 0xe8623c, fog: 0x9c5a52, deep: 0x161c34, shal: 0x2e4456 },
  { t: 0.18, sunY: -0.15, sunI: 0.30, ambI: 0.31, star: 0.32, moon: 0.36, name: '暮色',
    sunC: 0xc06a8a, ambC: 0x4a5a90, top: 0x151a44, hor: 0x8a4a6e, fog: 0x4e3a5e, deep: 0x101830, shal: 0x22344e },
  { t: 0.30, sunY: -0.36, sunI: 0.06, ambI: 0.21, star: 0.80, moon: 0.82, name: '入夜',
    sunC: 0x7080c0, ambC: 0x38487a, top: 0x070c26, hor: 0x1c2a52, fog: 0x1a2440, deep: 0x0a1224, shal: 0x14243c },
  { t: 0.47, sunY: -0.82, sunI: 0.00, ambI: 0.15, star: 1.00, moon: 1.00, name: '深夜',
    sunC: 0x6070b0, ambC: 0x2a3a66, top: 0x03050f, hor: 0x0c1530, fog: 0x0b1226, deep: 0x060c1c, shal: 0x0e1c30 },
  { t: 0.62, sunY: -0.95, sunI: 0.00, ambI: 0.15, star: 1.00, moon: 1.00, name: '月夜',
    sunC: 0x6070b0, ambC: 0x2a3a66, top: 0x03050f, hor: 0x0d1734, fog: 0x0c1328, deep: 0x060c1c, shal: 0x0e1c30 },
  { t: 0.74, sunY: -0.48, sunI: 0.10, ambI: 0.22, star: 0.72, moon: 0.56, name: '黎明前',
    sunC: 0x9a8ac0, ambC: 0x34426e, top: 0x0a1430, hor: 0x2e3a66, fog: 0x1c2748, deep: 0x081222, shal: 0x142438 },
  { t: 0.84, sunY: -0.02, sunI: 0.60, ambI: 0.40, star: 0.16, moon: 0.10, name: '日出',
    sunC: 0xffb070, ambC: 0x6a7aa8, top: 0x1e2a5e, hor: 0xe08a6a, fog: 0x8a7a80, deep: 0x14243c, shal: 0x3a5468 },
  { t: 0.91, sunY: 0.62, sunI: 1.35, ambI: 0.64, star: 0.00, moon: 0.00, name: '上午',
    sunC: 0xfff0d0, ambC: 0x8aa0c8, top: 0x2f6ab0, hor: 0xbcd8f0, fog: 0xb0c8dc, deep: 0x123a5c, shal: 0x2f8fa8 },
  { t: 0.955, sunY: 0.48, sunI: 1.25, ambI: 0.60, star: 0.00, moon: 0.00, name: '下午',
    sunC: 0xffe0b0, ambC: 0x8898c0, top: 0x3a6aa8, hor: 0xd8b49a, fog: 0xc8a890, deep: 0x163a58, shal: 0x35707e },
  { t: 1.00, sunY: 0.07, sunI: 1.45, ambI: 0.60, star: 0.00, moon: 0.00, name: '黄昏',
    sunC: 0xff9b52, ambC: 0x8a7ab0, top: 0x3a2a6e, hor: 0xff9a5c, fog: 0xd98a6a, deep: 0x1b2440, shal: 0x3a5a6a }
];


/* ---------------- 成就 (14) ---------------- */
const ACHIEVEMENTS = [
  { id: 'first_fish', icon: '🐟', name: '初尝鲜',     desc: '抓到第一条鱼' },
  { id: 'fish_25',    icon: '🎣', name: '满载而归',   desc: '累计捕获 25 条鱼' },
  { id: 'fish_100',   icon: '🐠', name: '鱼群噩梦',   desc: '累计捕获 100 条鱼' },
  { id: 'air_catch',  icon: '🕊️', name: '空中截击',   desc: '在跳跃过程中抓到一条鱼' },
  { id: 'combo5',     icon: '🔥', name: '五连击',     desc: '连续捕获 5 条鱼不中断' },
  { id: 'combo12',    icon: '⚡', name: '势不可挡',   desc: '连续捕获 12 条鱼不中断' },
  { id: 'night_hunt', icon: '🌙', name: '夜行者',     desc: '在夜幕下捕获 8 条鱼' },
  { id: 'sunset_25',  icon: '🌅', name: '追日者',     desc: '黄昏时段保持 25 秒无碰撞' },
  { id: 'speed_100',  icon: '💨', name: '疾风骑士',   desc: '时速突破 100 km/h' },
  { id: 'wheelie3',   icon: '🦅', name: '展翅高飞',   desc: '连续抬头滑行 3 秒' },
  { id: 'no_hit_1k',  icon: '🛡️', name: '一路顺风',   desc: '无碰撞骑行 1000 米' },
  { id: 'dist_5k',    icon: '🗺️', name: '海岸远征',   desc: '累计骑行 5 公里' },
  { id: 'moon_30',    icon: '🌕', name: '月光浴',     desc: '深夜满月下骑行 30 秒' },
  { id: 'master',     icon: '👑', name: '鹈鹕之王',   desc: '解锁其余全部成就' }
];

/* ---------------- 音频合成器 ---------------- */
class AudioSys {
  constructor() { this.ctx = null; this.on = true; this.ready = false; }

  init() {
    if (this.ready) return;
    try {
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) { this.on = false; return; }
      const ctx = this.ctx = new AC();
      const master = this.master = ctx.createGain();
      master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 22; comp.ratio.value = 3.4;
      comp.attack.value = 0.004; comp.release.value = 0.22;
      master.connect(comp).connect(ctx.destination);

      this.mus = ctx.createGain(); this.mus.gain.value = 0.0;
      this.mus.connect(master);
      this.sfx = ctx.createGain(); this.sfx.gain.value = 0.5;
      this.sfx.connect(master);

      // 白噪声缓冲
      const len = Math.floor(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;

      // 音乐状态
      this.bpm = 84; this.step = 0; this.nextT = ctx.currentTime + 0.1;
      this.root = 55; this.scale = [0, 3, 5, 7, 10];
      this.arpV = 0; this.intensity = 0.4;
      this.ready = true;
      this.mus.gain.linearRampToValueAtTime(0.34, ctx.currentTime + 2.2);
    } catch (e) {
      this.on = false; this.ready = false;
    }
  }

  resume() {
    try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { }
  }
  toggle() { this.on = !this.on; if (this.master) this.master.gain.value = this.on ? 0.9 : 0; return this.on; }

  /* ---- 基础发声单元 ---- */
  _env(node, t, a, d, peak) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(peak, t + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  tone(type, f0, f1, t, dur, gain, dest, filt) {
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain();
    this._env(g, t, Math.min(0.012, dur * 0.2), dur, gain);
    let node = o;
    if (filt) {
      const bq = c.createBiquadFilter();
      bq.type = filt.type || 'lowpass'; bq.frequency.value = filt.f || 800; bq.Q.value = filt.q || 1;
      o.connect(bq); node = bq;
    }
    node.connect(g).connect(dest || this.sfx);
    o.start(t); o.stop(t + dur + 0.05);
    return o;

/* =========================================================================
   Part 2 : 世界 —— 昼夜环境 / 天空 / 海面 / 海岸公路
   ========================================================================= */

const S = {};                 // 全局状态
const ENV = {                 // 环境输出（颜色在 initEnv 中创建）
  name: '黄昏', sunY: 0, sunI: 1.4, ambI: 0.6, star: 0, moon: 0, night: 0,
  sunDir: null, moonDir: null, sunC: null, ambC: null, top: null, hor: null,
  fog: null, deep: null, shal: null
};
const TILE = 32;              // 路面纹理一个循环的世界长度

function initEnv(T) {
  tmpC = new T.Color();
  ENV.sunDir = new T.Vector3(0.9, 0.1, 0.3);
  ENV.moonDir = new T.Vector3(-0.55, 0.62, -0.55).normalize();
  ENV.sunC = new T.Color(); ENV.ambC = new T.Color();
  ENV.top = new T.Color(); ENV.hor = new T.Color(); ENV.fog = new T.Color();
  ENV.deep = new T.Color(); ENV.shal = new T.Color();
}

/* 关键帧插值（缓入缓出，色值在线性空间混合） */
function evalEnv(t) {
  const K = ENV_KEYS;
  let i = 0;
  while (i < K.length - 2 && t >= K[i + 1].t) i++;
  const a = K[i], b = K[i + 1];
  const raw = clamp((t - a.t) / (b.t - a.t || 1), 0, 1);
  const k = raw * raw * (3 - 2 * raw);
  ENV.sunY = lerp(a.sunY, b.sunY, k);
  ENV.sunI = lerp(a.sunI, b.sunI, k);
  ENV.ambI = lerp(a.ambI, b.ambI, k);
  ENV.star = lerp(a.star, b.star, k);
  ENV.moon = lerp(a.moon, b.moon, k);
  ENV.name = raw < 0.5 ? a.name : b.name;
  ENV.sunC.setHex(a.sunC).lerp(tmpC.setHex(b.sunC), k);
  ENV.ambC.setHex(a.ambC).lerp(tmpC.setHex(b.ambC), k);
  ENV.top.setHex(a.top).lerp(tmpC.setHex(b.top), k);
  ENV.hor.setHex(a.hor).lerp(tmpC.setHex(b.hor), k);
  ENV.fog.setHex(a.fog).lerp(tmpC.setHex(b.fog), k);
  ENV.deep.setHex(a.deep).lerp(tmpC.setHex(b.deep), k);
  ENV.shal.setHex(a.shal).lerp(tmpC.setHex(b.shal), k);
  const h = Math.sqrt(Math.max(0, 1 - ENV.sunY * ENV.sunY));
  ENV.sunDir.set(h * 0.93, ENV.sunY, h * 0.36).normalize();
  ENV.night = smoothstep(-0.02, -0.34, ENV.sunY);

}
let tmpC = null;

/* ---------------- 程序化纹理 ---------------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  ctx.save();
  for (let i = 0; i < amount; i++) {
    const x = Math.random() * w, y = Math.random() * h, s = rand(size * 0.4, size);
    const v = Math.random() < 0.5 ? 0 : 255;
    ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (alpha * Math.random()) + ')';
    ctx.fillRect(x, y, s, s);
  }

}
function roadTexture(T) {
  const W = 512, H = 512, c = makeCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#38363f'; g.fillRect(0, 0, W, H);
  // 沥青斑驳
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * W, y = Math.random() * H, s = rand(1, 5) | 0;
    g.fillStyle = 'rgba(' + (38 + Math.random() * 62 | 0) + ',' + (38 + Math.random() * 60 | 0) + ',' + (44 + Math.random() * 60 | 0) + ',0.5)';
    g.fillRect(x, y, s, s);
  }
  // 中央黄色虚线：世界 0.30 宽 / 4.5 长（tile = 20）
  const yw = 0.30 / 15 * W, yl = 12.0 / TILE * H;
  g.fillStyle = '#e8c657';
  g.fillRect(W / 2 - yw / 2, H * 0.05, yw, yl);
  // 两侧白实线
  const lw = 0.16 / 15 * W;
  g.fillStyle = 'rgba(232,232,238,.86)';
  for (const u of [0.07, 0.93]) g.fillRect(u * W - lw / 2, 0, lw, H);
  // 裂缝
  g.strokeStyle = 'rgba(20,20,26,.5)'; g.lineWidth = 1.4;
  for (let i = 0; i < 16; i++) {
    g.beginPath();
    let x = Math.random() * W, y = Math.random() * H;
    g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += rand(-30, 30); y += rand(-40, 40); g.lineTo(x, y); }
    g.stroke();
  }

  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.anisotropy = S.maxAniso || 4;
  tex.colorSpace = T.SRGBColorSpace;

  const N = 256, c = makeCanvas(N, N), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, N, N);
  for (let i = 0; i < dots; i++) {
    const x = Math.random() * N, y = Math.random() * N, s = rand(1, size);
    const d = (Math.random() * 46 - 23) | 0;
    g.fillStyle = 'rgba(' + (128 + d) + ',' + (120 + d) + ',' + (110 + d) + ',0.24)';
    g.fillRect(x, y, s, s);
  }
  const tex = new T.CanvasTexture(c);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.anisotropy = Math.min(8, S.maxAniso || 8);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;

/* ---------------- 天空 ---------------- */
const SKY_VS = `
varying vec3 vDir;
void main(){
  vDir = normalize(position);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const SKY_FS = `
precision highp float;
varying vec3 vDir;
uniform vec3 uTop, uHor, uSunDir, uMoonDir, uSunC, uMoonC;
uniform float uStar, uMoon, uTime, uSunI;

float hash31(vec3 p){
  p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float starLayer(vec3 d, float scale, float keep, float size, float seed){
  vec3 p = d * scale + seed;
  vec3 id = floor(p), f = fract(p) - 0.5;
  float h = hash31(id);
  if (h < keep) return 0.0;
  float dd = length(f);
  float tw = 0.62 + 0.38 * sin(uTime * (2.2 + h * 5.0) + h * 43.0);
  return smoothstep(size, 0.0, dd) * (0.35 + 0.65 * hash31(id + 5.3)) * tw;
}
vec3 linearToSRGB(vec3 c){
  c = max(c, vec3(0.0));
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c));
}
void main(){
  vec3 d = normalize(vDir);
  float up = clamp(d.y, 0.0, 1.0);
  vec3 col = mix(uHor, uTop, pow(up, 0.52));
  // 地平线以下：压暗并偏冷
  col = mix(col, uHor * 0.30, smoothstep(0.0, -0.22, d.y));
  // 高空略微加深，避免顶部死板
  col *= 1.0 - 0.16 * smoothstep(0.55, 1.0, d.y);

  // 太阳：本体 + 多层辉光
  float sd = max(dot(d, uSunDir), 0.0);
  float sunVis = smoothstep(-0.10, 0.05, uSunDir.y);
  vec3 sun = uSunC * (pow(sd, 1400.0) * 3.2 + pow(sd, 260.0) * 0.7 + pow(sd, 26.0) * 0.30 + pow(sd, 6.0) * 0.11);
  col += sun * sunVis;

  // 月亮（有相位）
  float md = max(dot(d, uMoonDir), 0.0);
  float phase = smoothstep(0.9975, 0.9993, md);
  float halo = pow(md, 1200.0) * 0.9 + pow(md, 60.0) * 0.16 + pow(md, 8.0) * 0.05;
  vec3 moonCol = vec3(0.86, 0.90, 1.0);
  col += moonCol * (phase * 1.7 + halo) * uMoon;

  // 星空
  if (uStar > 0.002) {
    float s = 0.0;
    s += starLayer(d, 150.0, 0.9825, 0.46, 0.0);
    s += starLayer(d, 290.0, 0.9880, 0.42, 11.0);
    s += starLayer(d, 560.0, 0.9920, 0.38, 27.0) * 0.6;
    float vis = smoothstep(-0.02, 0.25, d.y) * (1.0 - smoothstep(0.14, 0.42, sd));
    // 银河带
    float gal = smoothstep(0.72, 0.0, abs(dot(d, normalize(vec3(0.4, 0.34, -0.85))))) ;
    gal *= 0.10 + 0.12 * starLayer(d, 26.0, 0.55, 0.5, 3.0);
    col += vec3(0.62, 0.68, 0.95) * s * uStar * vis * 1.5;
    col += vec3(0.30, 0.34, 0.58) * gal * uStar * vis;

function buildSky(T) {
  const geo = new T.SphereGeometry(4200, 40, 24);
  const mat = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    vertexShader: SKY_VS, fragmentShader: SKY_FS,
    uniforms: {
      uTop: { value: ENV.top }, uHor: { value: ENV.hor },
      uSunDir: { value: ENV.sunDir }, uMoonDir: { value: ENV.moonDir },
      uSunC: { value: ENV.sunC }, uMoonC: { value: new T.Color(0.86, 0.9, 1.0) },
      uStar: { value: 0 }, uMoon: { value: 0 }, uSunI: { value: 1 }, uTime: { value: 0 }
    }
  });
  const mesh = new T.Mesh(geo, mat);
  mesh.renderOrder = -1000;
  mesh.frustumCulled = false;
  return mesh;
}

/* ---------------- 海面 ---------------- */
const SEA_VS = `
precision highp float;
uniform float uTime, uR, uShoreX;
varying vec3 vWorld;
varying vec3 vNrm;
varying float vH;
varying float vDist;

float seaH(vec2 p, float t){

  h += sin(dot(p, vec2(-0.029, 0.052)) + t * 1.55) * 0.40;

precision highp float;
uniform vec3 uDeep, uShal, uHor, uTop, uSunC, uMoonC, uFog;

  float moonPath = pow(max(dot(reflect(-V, N), uMoonDir), 0.0), 22.0);
  col += uMoonC * moonPath * 0.6 * uMoon;
  float moonWide = pow(max(dot(reflect(-V, N), uMoonDir), 0.0), 5.0);
  col += uMoonC * moonWide * 0.07 * uMoon;

  // 泡沫：用高频噪声打散规则波带，避免出现"条纹"感
  float nA = fbm(p * 0.16 + vec2(uTime * 0.28, -uTime * 0.16));
  float nB = fbm(p * 0.34 + vec2(-uTime * 0.44, uTime * 0.22));
  float crest = smoothstep(0.72, 1.32, vH) * (0.35 + 0.75 * vnoise(p * 1.1 + uTime * 0.5));
  float band = sin(toShore * 0.55 - uTime * 1.5 + nA * 9.5);
  float band2 = sin(toShore * 0.29 - uTime * 0.9 + nB * 12.0);
  float shoreEdge = smoothstep(42.0, 11.0, toShore) * smoothstep(-4.0, 2.5, toShore);
  float breakUp = smoothstep(0.36, 0.74, fbm(p * 0.26 + vec2(uTime * 0.55, uTime * 0.35)));
  float surf = (smoothstep(0.40, 0.97, band) * 0.8 + smoothstep(0.72, 0.99, band2) * 0.6) * shoreEdge;
  surf *= 0.10 + 1.05 * breakUp;
  float foam = clamp(crest * 0.55 + surf * 1.2, 0.0, 1.0);
  vec3 foamC = mix(vec3(0.62, 0.66, 0.72), vec3(1.0, 1.0, 1.0), 1.0 - uNight * 0.45);
  col = mix(col, foamC * (1.0 - uNight * 0.35), foam * (0.55 + 0.45 * (1.0 - uNight * 0.5)));

  // 雾
  float d = length(uCamPos - vWorld);
  float fg = 1.0 - exp(-pow(d * uFogD, 2.0));
  col = mix(col, uFog, clamp(fg, 0.0, 1.0));

  gl_FragColor = vec4(linearToSRGB(col), 1.0);
}`;

function buildSeaGeo(T, N, R) {
  const nx = N + 1, nz = N + 1;
  const pos = new Float32Array(nx * nz * 3);
  const idx = new Uint32Array(N * N * 6);
  const fx = u => Math.pow(u, 1.62) * R;
  const fz = u => { const s = u * 2 - 1; return Math.sign(s) * Math.pow(Math.abs(s), 1.5) * R * 0.92; };
  let p = 0;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      pos[p++] = fx(i / N); pos[p++] = 0; pos[p++] = fz(j / N);
    }
  }
  let k = 0;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
      idx[k++] = a; idx[k++] = c; idx[k++] = b;
      idx[k++] = b; idx[k++] = c; idx[k++] = d;
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setIndex(new T.BufferAttribute(idx, 1));
  g.boundingSphere = new T.Sphere(new T.Vector3(R * 0.5, 0, 0), R * 1.6);
  return g;
}

function buildSea(T, seg, R) {
  const mat = new T.ShaderMaterial({
    vertexShader: SEA_VS, fragmentShader: SEA_FS, fog: false,
    uniforms: {
      uTime: { value: 0 }, uR: { value: R }, uShoreX: { value: CFG.shoreX },
      uDeep: { value: ENV.deep }, uShal: { value: ENV.shal },
      uHor: { value: ENV.hor }, uTop: { value: ENV.top },
      uSunC: { value: ENV.sunC }, uMoonC: { value: new T.Color(0.86, 0.9, 1) },
      uSunDir: { value: ENV.sunDir }, uMoonDir: { value: ENV.moonDir },
      uCamPos: { value: new T.Vector3() }, uSunI: { value: 1 }, uMoon: { value: 0 },
      uNight: { value: 0 }, uFog: { value: ENV.fog }, uFogD: { value: 0.0009 },
      uDetail: { value: 1 }
    }
  });
  const mesh = new T.Mesh(buildSeaGeo(T, seg, R), mat);
  mesh.position.x = CFG.shoreX;
  mesh.frustumCulled = false;
  return mesh;
}

  const trunks = new T.InstancedMesh(trunkGeo, trunkMat, 22);
  addPool(trunks, 22, 34, (i, m) => {

  const crownMat = new T.MeshStandardMaterial({ color: 0x2b4830, roughness: 0.9, side: T.DoubleSide, flatShading: true });
  const crownGeo = new T.SphereGeometry(2.0, 8, 6);

  /* 岸边礁石 */
  const rockMat = new T.MeshStandardMaterial({ color: 0x54514d, roughness: 0.95, flatShading: true });
  const rockGeo = new T.IcosahedronGeometry(1, 0);

/* 池子推进：把实例摆到玩家前方（含身后缓冲），外观按槽位固定 → 复用时无跳变 */
let _dummy = null;
function updateDecor(pz, quality) {
  if (!_dummy) _dummy = new THREE.Object3D();
  const d = _dummy;
  for (const g of S.decor.groups) {
    const n = Math.max(4, Math.round(g.n * quality));
    g.mesh.count = n;
    const base = Math.floor((pz + 40) / g.spacing) * g.spacing;
    for (let i = 0; i < n; i++) {
      d.position.set(0, 0, 0);
      d.rotation.set(0, 0, 0);
      d.scale.set(1, 1, 1);
      g.layout(i, d);
      d.position.z += base - i * g.spacing;
      d.updateMatrix();
      g.mesh.setMatrixAt(i, d.matrix);
    }
    g.mesh.instanceMatrix.needsUpdate = true;
  }
}

function cyl(T, a, b, r, mat, seg) {
  const dir = new T.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new T.Mesh(new T.CylinderGeometry(r, r, len, seg || 7), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.normalize());
  return m;
}
function ball(T, r, mat, sx, sy, sz) {
  const m = new T.Mesh(new T.SphereGeometry(r, 16, 12), mat);
  m.scale.set(sx || 1, sy || 1, sz || 1);
  return m;
}
/* 骨骼：一段圆柱，可被 set3 摆放到任意两点之间（局部坐标） */
let _vA = null, _qA = null, _upV = null;
function makeBone(T, r, mat, baseLen) {
  const m = new T.Mesh(new T.CylinderGeometry(r, r * 0.86, baseLen, 7), mat);
  if (!_vA) { _vA = new T.Vector3(); _qA = new T.Quaternion(); _upV = new T.Vector3(0, 1, 0); }
  m.userData.baseLen = baseLen;
  m.userData.set3 = (ax, ay, az, bx, by, bz) => {
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len = Math.max(0.001, Math.sqrt(dx * dx + dy * dy + dz * dz));
    m.position.set((ax + bx) * 0.5, (ay + by) * 0.5, (az + bz) * 0.5);
    m.scale.set(1, len / baseLen, 1);
    _vA.set(dx / len, dy / len, dz / len);
    _qA.setFromUnitVectors(_upV, _vA);
    m.quaternion.copy(_qA);
  };
  return m;
}

/* ---------------- 自行车 ---------------- */
function buildBike(T, M) {
  const g = new T.Group();
  const wheelR = 0.355, tw = 0.055;
  const mk = (z) => {
    const spin = new T.Group();
    spin.position.set(0, wheelR, z);
    const outer = new T.Group();
    outer.rotation.y = Math.PI / 2;
    const tire = new T.Mesh(new T.TorusGeometry(wheelR, tw, 6, 20), M.tire);
    outer.add(tire);
    const rim = new T.Mesh(new T.TorusGeometry(wheelR - tw * 0.95, 0.022, 5, 20), M.rim);
    outer.add(rim);
    spin.add(outer);
    // 辐条
    for (let i = 0; i < 6; i++) {
      const s = new T.Mesh(new T.BoxGeometry(0.014, (wheelR - tw) * 2, 0.014), M.chrome);
      s.rotation.z = i * Math.PI / 6;
      spin.add(s);
    }
    return spin;
  };
  const rear = mk(0.62), front = mk(-0.62);
  g.add(rear, front);

  const A = new T.Vector3(0, 1.00, 0.44);      // 座管顶
  const B = new T.Vector3(0, 0.40, 0.62);      // 后轮轴
  const C = new T.Vector3(0, 0.42, 0.06);      // 五通
  const D = new T.Vector3(0, 0.98, -0.42);     // 头管上
  const E = new T.Vector3(0, 0.42, -0.62);     // 前轮轴
  g.add(cyl(T, A, B, 0.032, M.frame));
  g.add(cyl(T, A, C, 0.036, M.frame));
  g.add(cyl(T, B, C, 0.032, M.frame));
  g.add(cyl(T, C, D, 0.034, M.frame));
  g.add(cyl(T, D, E, 0.028, M.chrome));
  g.add(cyl(T, A, new T.Vector3(0, 0.98, 0.72), 0.026, M.frame));
  // 座垫
  const saddle = ball(T, 0.16, M.saddle, 0.62, 0.30, 1.25);
  saddle.position.set(0, 1.06, 0.42);
  g.add(saddle);
  // 车把
  const bar = cyl(T, new T.Vector3(-0.32, 1.10, -0.40), new T.Vector3(0.32, 1.10, -0.40), 0.026, M.chrome);
  g.add(bar);
  g.add(cyl(T, new T.Vector3(0, 1.10, -0.40), new T.Vector3(0, 1.10, -0.30), 0.028, M.frame2));
  for (const s of [-1, 1]) {
    const grip = ball(T, 0.055, M.frame2, 1, 1, 1.5);
    grip.position.set(s * 0.30, 1.10, -0.40);
    g.add(grip);
  }
  // 前叉
  g.add(cyl(T, new T.Vector3(-0.06, 1.06, -0.42), new T.Vector3(-0.06, 0.42, -0.60), 0.022, M.chrome));
  g.add(cyl(T, new T.Vector3(0.06, 1.06, -0.42), new T.Vector3(0.06, 0.42, -0.60), 0.022, M.chrome));
  // 曲柄 + 踏板
  const crank = new T.Group();
  crank.position.copy(C);
  const armGeo = new T.BoxGeometry(0.05, 0.34, 0.055);
  for (const s of [-1, 1]) {
    const arm = new T.Mesh(armGeo, M.chrome);
    arm.position.set(s * 0.10, 0, 0);
    arm.rotation.z = s > 0 ? 0 : Math.PI;
    crank.add(arm);
    const pd = new T.Mesh(new T.BoxGeometry(0.11, 0.03, 0.16), M.dark);
    pd.position.set(s * 0.155, s > 0 ? 0.17 : -0.17, 0);
    crank.add(pd);
  }
  g.add(crank);
  // 链条
  g.add(cyl(T, new T.Vector3(0.09, 0.42, 0.06), new T.Vector3(0.09, 0.40, 0.62), 0.014, M.dark));
  g.add(cyl(T, new T.Vector3(-0.09, 0.42, 0.06), new T.Vector3(-0.09, 0.40, 0.62), 0.014, M.dark));
  // 挡泥板/尾灯
  const mud = new T.Mesh(new T.CylinderGeometry(0.42, 0.42, 0.14, 12, 1, true, Math.PI * 0.05, Math.PI * 0.62), M.frame2);
  mud.rotation.z = Math.PI / 2;
  mud.position.set(0, wheelR, 0.62);
  mud.material.side = T.DoubleSide;
  g.add(mud);
  // 车筐（装鱼用）
  const basket = new T.Mesh(new T.CylinderGeometry(0.20, 0.15, 0.24, 10, 1, true), M.frame2);
  basket.position.set(0, 1.24, -0.34);
  basket.material.side = T.DoubleSide;
  g.add(basket);

  g.userData = { rear, front, crank, C, basket };
  return g;
}

/* ---------------- 鹈鹕 ---------------- */
function buildPelican(T, M) {
  const g = new T.Group();
  const headParts = [];
  const addH = m => { g.add(m); headParts.push(m); return m; };

  const body = ball(T, 0.36, M.feather, 1.0, 0.90, 1.30);
  body.position.set(0, 1.30, 0.34);
  g.add(body);
  const belly = ball(T, 0.30, M.feather2, 0.95, 0.80, 1.1);
  belly.position.set(0, 1.16, 0.36);
  g.add(belly);

  // 脖子：曲线管道
  const neckPts = [
    new T.Vector3(0, 1.42, 0.14),
    new T.Vector3(0, 1.58, 0.02),
    new T.Vector3(0, 1.72, -0.08),
    new T.Vector3(0, 1.80, -0.18)
  ];
  const neckCurve = new T.CatmullRomCurve3(neckPts);
  const neck = new T.Mesh(new T.TubeGeometry(neckCurve, 18, 0.115, 8, false), M.feather);
  g.add(neck);

  const head = ball(T, 0.215, M.feather, 1, 0.98, 1.08);
  head.position.set(0, 1.83, -0.20);
  addH(head);
  // 冠羽
  for (let i = 0; i < 5; i++) {
    const f = new T.Mesh(new T.ConeGeometry(0.022, 0.13, 5), M.feather2);
    f.position.set((i - 2) * 0.032, 1.97, -0.13 + Math.abs(i - 2) * 0.02);
    f.rotation.set(-0.5, 0, (i - 2) * 0.22);
    addH(f);
  }
  // 喙（上喙 + 长喉囊）
  const upper = new T.Mesh(new T.ConeGeometry(0.095, 0.62, 10), M.beak);
  upper.rotation.x = -Math.PI / 2;
  upper.position.set(0, 1.83, -0.58);
  upper.scale.set(1, 1, 0.72);
  addH(upper);
  const upperTip = new T.Mesh(new T.ConeGeometry(0.035, 0.30, 8), M.beak);
  upperTip.rotation.x = -Math.PI / 2;
  upperTip.position.set(0, 1.80, -0.92);
  upperTip.scale.set(1, 1, 0.6);
  addH(upperTip);
  const pouch = ball(T, 0.13, M.pouch, 0.92, 0.86, 2.05);
  pouch.position.set(0, 1.72, -0.60);
  addH(pouch);

  // 眼睛 + 墨镜
  for (const s of [-1, 1]) {
    const eye = ball(T, 0.048, M.dark, 1, 1, 1);
    eye.position.set(s * 0.13, 1.89, -0.30);
    addH(eye);
    const lens = new T.Mesh(new T.CylinderGeometry(0.108, 0.108, 0.022, 14), M.lens);
    lens.rotation.x = Math.PI / 2;
    lens.rotation.z = s * 0.12;
    lens.position.set(s * 0.125, 1.885, -0.365);
    lens.scale.set(1.06, 1, 0.92);
    addH(lens);
  }
  const bridge = new T.Mesh(new T.BoxGeometry(0.10, 0.030, 0.03), M.dark);
  bridge.position.set(0, 1.90, -0.36);
  addH(bridge);
  for (const s of [-1, 1]) {
    const tpl = new T.Mesh(new T.BoxGeometry(0.02, 0.02, 0.20), M.dark);
    tpl.position.set(s * 0.19, 1.90, -0.26);
    tpl.rotation.y = s * 0.30;
    addH(tpl);
  }
  // 头盔
  const helm = new T.Mesh(new T.SphereGeometry(0.245, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.46), M.helmet);
  helm.position.set(0, 1.855, -0.19);
  helm.scale.set(1.04, 1.0, 1.12);
  addH(helm);
  const stripe = new T.Mesh(new T.SphereGeometry(0.250, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.46), M.helmetTrim);
  stripe.position.copy(helm.position);
  stripe.scale.set(0.17, 1.0, 1.13);
  addH(stripe);
  const brim = new T.Mesh(new T.BoxGeometry(0.34, 0.030, 0.16), M.helmet);
  brim.position.set(0, 1.885, -0.40);
  brim.rotation.x = -0.16;
  addH(brim);
  for (const s of [-1, 1]) {
    const strap = new T.Mesh(new T.BoxGeometry(0.028, 0.20, 0.026), M.helmetTrim);
    strap.position.set(s * 0.155, 1.74, -0.24);
    strap.rotation.z = s * 0.22;
    addH(strap);
  }

  // 围脖环 + 结
  const ring = new T.Mesh(new T.TorusGeometry(0.185, 0.062, 8, 16), M.scarfKnot);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = 0.06;
  ring.position.set(0, 1.44, 0.06);
  g.add(ring);
  const knot = ball(T, 0.075, M.scarfKnot, 1.1, 0.9, 0.9);
  knot.position.set(0, 1.46, 0.20);
  g.add(knot);

  // 翅膀
  const wings = {};
  for (const s of [-1, 1]) {
    const pivot = new T.Group();
    pivot.position.set(s * 0.30, 1.42, 0.20);
    const parts = [];
    for (let i = 0; i < 3; i++) {
      const len = 0.72 - i * 0.14;
      const f = ball(T, 1, i === 1 ? M.feather2 : M.feather, len, 0.055 - i * 0.006, 0.20 - i * 0.03);
      f.position.set(s * (0.26 + i * 0.16), -0.04 - i * 0.05, 0.06 + i * 0.10);
      f.rotation.z = s * (0.10 + i * 0.10);
      f.rotation.y = s * (0.22 + i * 0.16);
      pivot.add(f);
      parts.push(f);
    }
    pivot.userData.parts = parts;
    pivot.userData.side = s;
    pivot.rotation.z = s * -0.20;
    pivot.rotation.y = s * 0.55;
    pivot.rotation.x = 0.10;
    g.add(pivot);
    wings[s > 0 ? 'L' : 'R'] = pivot;
  }

  // 尾羽
  for (let i = 0; i < 4; i++) {
    const f = ball(T, 1, M.feather2, 0.30, 0.035, 0.10);
    f.position.set((i - 1.5) * 0.07, 1.24 + i * 0.012, 0.82);
    f.rotation.y = 0.15;
    f.rotation.x = -0.12;
    g.add(f);
  }

  // 腿（两段 + IK）：直接挂在 pel 下，坐标统一为 pel 局部坐标
  const legs = [];
  for (const s of [-1, 1]) {
    const thigh = makeBone(T, 0.062, M.foot, 0.40);
    const shin = makeBone(T, 0.048, M.foot, 0.40);
    const knee = ball(T, 0.060, M.foot, 1, 1, 1);
    const foot = ball(T, 0.072, M.foot, 1.35, 0.42, 1.85);
    g.add(thigh, shin, knee, foot);
    legs.push({ s, thigh, shin, knee, foot, hip: new T.Vector3(s * 0.135, 1.13, 0.26) });
  }

  g.userData = { body, head, wings, legs, neck: ring, knot, pouch, headParts };
  return g;
}

/* ---------------- 玩家总装 ---------------- */

  inner.position.set(0, 0, -0.62);
  pivot.add(inner);
  tilt.add(pivot);
  root.add(tilt);

  const bike = buildBike(T, M);
  const pel = buildPelican(T, M);
  inner.add(bike, pel);
  // 第一人称时一并隐藏车筐，避免遮挡视线
  pel.userData.headParts.push(bike.userData.basket);

  const neckAnchor = new T.Object3D();
  neckAnchor.position.set(0, 1.50, 0.18);
  pel.add(neckAnchor);

  // 地面阴影贴片（独立于 root，避免跟随跳跃抬高）
  const shadow = new T.Mesh(
    new T.CircleGeometry(1.05, 24),
    new T.MeshBasicMaterial({ color: 0x0a0a12, transparent: true, opacity: 0.34, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  S.scene.add(shadow);

  // 夜间车灯光斑（加性混合，随夜幕淡入）
  const beam = new T.Mesh(
    new T.CircleGeometry(2.1, 22),
    new T.MeshBasicMaterial({
      color: 0xffd9a0, transparent: true, opacity: 0, depthWrite: false,
      blending: T.AdditiveBlending
    })
  );
  beam.rotation.x = -Math.PI / 2;
  S.scene.add(beam);

  S.scene.add(root);

  const P = S.player = {
    root, tilt, pivot, inner, bike, pel, neckAnchor, shadow, beam, M,
    x: CFG.laneX[CFG.laneCenter], y: 0, vy: 0, onGround: true,
    speed: CFG.cruiseSpeed, lane: CFG.laneCenter, laneCD: 0, laneV: 0, lanePulse: 0,
    wheelie: 0, wheelT: 0, airT: 0, crank: 0, wheelSpin: 0, shake: 0, hitCD: 0,
    cadence: 0, dist: 0, hurt: 0, z: 0, score: 0, fish: 0, combo: 1, bestCombo: 1
  };
  return P;
}

/* 两段式 IK：把腿摆到踏板位置（全部在 pel 局部坐标里算） */
const L1 = 0.40, L2 = 0.40;
function solveLeg(leg, fx, fy, fz) {
  const hx = leg.hip.x, hy = leg.hip.y, hz = leg.hip.z;
  let dx = fx - hx, dy = fy - hy, dz = fz - hz;
  let d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (d < 1e-4) d = 1e-4;
  dx /= d; dy /= d; dz /= d;
  const dc = clamp(d, 0.05, L1 + L2 - 0.004);
  const a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc);
  const hh = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const mx = hx + dx * a, my = hy + dy * a, mz = hz + dz * a;
  // 膝盖朝前（局部 -Z）
  let px = 0, py = 0, pz = -1;
  const dp = px * dx + py * dy + pz * dz;
  px -= dx * dp; py -= dy * dp; pz -= dz * dp;
  let pl = Math.sqrt(px * px + py * py + pz * pz);
  if (pl < 1e-3) { px = 0; py = -1; pz = 0; pl = 1; }
  px /= pl; py /= pl; pz /= pl;
  const kx = mx + px * hh, ky = my + py * hh, kz = mz + pz * hh;
  leg.thigh.userData.set3(hx, hy, hz, kx, ky, kz);
  leg.shin.userData.set3(kx, ky, kz, fx, fy, fz);
  leg.knee.position.set(kx, ky, kz);
  leg.foot.position.set(fx + dx * 0.04, fy + 0.02, fz + dz * 0.04);
}

/* =========================================================================
   Part 3B : 围巾布料（Verlet 质点-约束）+ 玩家物理与姿态
   ========================================================================= */

function buildScarf(T, P) {
  const cols = 8, rows = 22, N = cols * rows;
  const stepW = 0.34 / (cols - 1), stepV = 0.072;
  const diagD = Math.sqrt(stepW * stepW + stepV * stepV);

  const geo = new T.BufferGeometry();
  const posArr = new Float32Array(N * 3);
  const attr = new T.BufferAttribute(posArr, 3);
  attr.setUsage(T.DynamicDrawUsage);
  geo.setAttribute('position', attr);
  const idx = [];
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  }
  geo.setIndex(idx);
  const mat = P.M.scarf.clone();
  const mesh = new T.Mesh(geo, mat);
  mesh.frustumCulled = false;
  S.scene.add(mesh);

  const pts = [];
  for (let i = 0; i < N; i++) pts.push({ p: new T.Vector3(), q: new T.Vector3(), pin: false, j: i * 0.37 });
  const anchorLocal = [];
  for (let c = 0; c < cols; c++) {
    const u = c / (cols - 1) - 0.5;
    anchorLocal.push(new T.Vector3(u * 0.34, -0.015 - Math.abs(u) * 0.035, 0.055 + (0.5 - Math.abs(u)) * 0.09));
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const pt = pts[r * cols + c], an = anchorLocal[c];
      pt.p.set(an.x, an.y - r * 0.020, an.z + r * 0.0693);
      pt.q.copy(pt.p);
      if (r === 0) pt.pin = true;
    }
  }
  const cons = [];
  const addC = (i, j, rest, st) => { if (i >= 0 && j >= 0 && i < N && j < N) cons.push({ i, j, rest, st }); };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (c < cols - 1) addC(i, i + 1, stepW, 1);
      if (r < rows - 1) addC(i, i + cols, stepV, 1);
      if (c < cols - 1 && r < rows - 1) addC(i, i + cols + 1, diagD, 0.30);
      if (c > 0 && r < rows - 1) addC(i, i + cols - 1, diagD, 0.30);
      if (c < cols - 2) addC(i, i + 2, stepW * 2, 0.14);
      if (r < rows - 2) addC(i, i + 2 * cols, stepV * 2, 0.14);
    }
  }
  S.scarf = { geo, attr, mesh, pts, cons, anchorLocal, N, cols, rows, tmp: new T.Vector3() };
  return S.scarf;
}

function updateScarf(dt, time, speed) {
  const C = S.scarf, P = S.player;
  if (!C) return;
  const pts = C.pts, N = C.N, cons = C.cons;
  const dtc = Math.min(Math.max(dt, 0.001), 1 / 40);
  const dt2 = dtc * dtc;

  // 锚点 → 世界坐标
  const anc = C.anchorLocal, tmp = C.tmp;
  const mw = P.neckAnchor.matrixWorld;
  for (let c = 0; c < C.cols; c++) {
    tmp.copy(anc[c]).applyMatrix4(mw);
    const pt = pts[c];
    pt.p.copy(tmp); pt.q.copy(tmp);
  }

  const ax0 = speed * 0.070, az0 = speed * 1.06, ay0 = speed * 0.50;
  for (let i = C.cols; i < N; i++) {
    const pt = pts[i];
    const j = pt.j;
    const vx = (pt.p.x - pt.q.x) * 0.986;
    const vy = (pt.p.y - pt.q.y) * 0.986;
    const vz = (pt.p.z - pt.q.z) * 0.986;
    pt.q.copy(pt.p);
    const ax = Math.sin(time * 3.1 + j) * 1.5 + ax0 * Math.sin(time * 1.7 + j * 0.3);
    const ay = -6.6 + ay0 + Math.sin(time * 4.2 + j * 1.3) * 1.5;
    const az = az0 * (0.82 + 0.18 * Math.sin(time * 2.3 + j));
    pt.p.x += vx + ax * dt2;
    pt.p.y += vy + ay * dt2;
    pt.p.z += vz + az * dt2;
  }
  // 约束松弛
  for (let it = 0; it < 3; it++) {
    for (let k = 0; k < cons.length; k++) {
      const c = cons[k], a = pts[c.i], b = pts[c.j];
      let dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z;
      let d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < 1e-6) continue;
      const diff = ((d - c.rest) / d) * 0.5 * c.st;
      dx *= diff; dy *= diff; dz *= diff;
      if (!a.pin) { a.p.x += dx; a.p.y += dy; a.p.z += dz; }
      if (!b.pin) { b.p.x -= dx; b.p.y -= dy; b.p.z -= dz; }
    }
    // 固定行重新锁回
    for (let c = 0; c < C.cols; c++) {
      tmp.copy(anc[c]).applyMatrix4(mw);
      pts[c].p.copy(tmp);
    }
  }
  // 写回几何
  const arr = C.attr.array;
  for (let i = 0; i < N; i++) {
    const p = pts[i].p;
    arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z;
  }
  C.attr.needsUpdate = true;
  C.geo.computeVertexNormals();
  C.geo.computeBoundingSphere();
}

/* ---------------- 玩家物理 ---------------- */
function updatePlayer(dt) {
  const P = S.player, IN = S.input, K = CFG;
  // 速度
  if (IN.throttle > 0) P.speed += K.accel * dt * (1 + P.wheelie * 0.5);
  else if (IN.throttle < 0) P.speed -= K.brake * dt;
  else P.speed = damp(P.speed, K.cruiseSpeed, 0.55, dt);
  P.speed -= P.speed * 0.045 * dt;                    // 空气阻力
  const maxS = K.maxSpeed * (1 + P.wheelie * 0.09);
  P.speed = clamp(P.speed, 0, maxS);

  // 变道
  P.laneCD -= dt;
  if (IN.steer !== 0 && P.laneCD <= 0) {
    const nl = clamp(P.lane + IN.steer, 0, K.laneX.length - 1);
    if (nl !== P.lane) { P.lane = nl; P.laneCD = 0.19; P.lanePulse = 1; S.audio.sLane(); }
    else P.laneCD = 0.10;
  }
  const tx = K.laneX[P.lane];
  const dx = tx - P.x;
  P.x += dx * (1 - Math.exp(-7.5 * dt));
  P.laneV = dx;

  // 位移
  P.z -= P.speed * dt;

  // 跳跃 / 重力
  if (IN.jump && P.onGround) {
    P.vy = K.jumpV * (1 + P.wheelie * 0.12);
    P.onGround = false; P.airT = 0; S.audio.sJump();
  }
  if (!P.onGround) {
    P.vy -= K.gravity * dt;
    P.y += P.vy * dt;
    P.airT += dt;
    if (P.y <= 0) { P.y = 0; P.vy = 0; P.onGround = true; S.audio.sLand(P.airT > 0.35); }
  }

  // 展翅抬前轮
  const wT = IN.wing ? 1 : 0;
  P.wheelie = damp(P.wheelie, wT, wT ? 4.6 : 3.0, dt);
  if (P.wheelie > 0.55) P.wheelT += dt; else P.wheelT = 0;

  // 里程 / 姿态时间累积
  P.dist += P.speed * dt;
  P.shake = Math.max(0, P.shake - dt * 3.2);
  P.hurt = Math.max(0, P.hurt - dt * 2.2);
  if (P.lanePulse > 0) P.lanePulse = Math.max(0, P.lanePulse - dt * 4);
}

/* ---------------- 玩家视觉 ---------------- */
function updatePlayerVisual(dt, time) {
  const P = S.player;
  const cadence = clamp(28 + P.speed * 3.55, 0, 168);
  P.cadence = cadence;
  P.crank += cadence / 60 * TAU * dt;
  const th = -P.crank;
  P.bike.userData.crank.rotation.x = th;
  P.wheelSpin -= P.speed / 0.355 * dt;
  P.bike.userData.rear.rotation.x = P.wheelSpin;
  P.bike.userData.front.rotation.x = P.wheelSpin;

  // 双腿 IK 跟随踏板
  const C = P.bike.userData.C;
  for (const leg of P.pel.userData.legs) {
    const yz = leg.s > 0 ? 0.17 : -0.17;
    const py = C.y + yz * Math.cos(th);
    const pz = C.z + yz * Math.sin(th);
    solveLeg(leg, C.x + leg.s * 0.155, py, pz);
  }

  // 抬头 / 倾斜 / 颠簸
  P.pivot.rotation.x = P.wheelie * 0.40;
  P.tilt.rotation.z = damp(P.tilt.rotation.z, clamp(-P.laneV * 0.10, -0.30, 0.30), 6, dt);
  const bob = Math.sin(time * (cadence / 60 * TAU) * 0.5) * 0.016 * clamp(P.speed / 20, 0, 1.2);
  P.root.position.set(P.x, P.y + bob + P.shake * Math.sin(time * 42) * 0.05, P.z);
  P.root.rotation.y = damp(P.root.rotation.y, clamp(-P.laneV * 0.035, -0.22, 0.22), 7, dt);

  // 翅膀
  const w = P.wheelie;
  const flap = Math.sin(time * 13.5) * (0.10 + w * 0.24);
  const air = P.onGround ? 0 : clamp(P.airT * 2.4, 0, 1);
  for (const s of [-1, 1]) {
    const g = P.pel.userData.wings[s > 0 ? 'L' : 'R'];
    g.rotation.z = s * (-0.20 - (w * 1.05) - air * 0.55);
    g.rotation.x = 0.10 + w * 0.34 + flap + air * 0.30;
    g.rotation.y = s * (0.55 - w * 0.42 - air * 0.30);
  }

  // 影子
  const sh = P.shadow;
  sh.position.set(P.x, 0.02, P.z + 0.1);
  const h = clamp(P.y / 6, 0, 1);
  sh.scale.setScalar(1 + h * 0.9);
  sh.material.opacity = 0.34 * (1 - h * 0.7);

  // 夜间车灯
  P.beam.position.set(P.x, 0.19, P.z - 5.6);
  P.beam.material.opacity = ENV.night * 0.42;

  // 车灯（夜间）
  if (S.lampHeadMat) {
    const on = ENV.night;
    S.lampHeadMat.color.setRGB(1.0 * (0.12 + on * 0.88), 0.85 * (0.12 + on * 0.88), 0.62 * (0.12 + on * 0.88));
  }
}

/* =========================================================================
   Part 4 : 鱼 / 障碍 / 粒子 / 镜头
   ========================================================================= */

/* ---------------- 粒子 ---------------- */
function buildParticles(T, n) {
  const geo = new T.BufferGeometry();
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  geo.setAttribute('position', new T.BufferAttribute(pos, 3).setUsage(T.DynamicDrawUsage));
  geo.setAttribute('color', new T.BufferAttribute(col, 3).setUsage(T.DynamicDrawUsage));
  const mat = new T.PointsMaterial({
    size: 0.26, sizeAttenuation: true, vertexColors: true,
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: 0.95
  });
  const pts = new T.Points(geo, mat);
  pts.frustumCulled = false;
  S.scene.add(pts);
  const P = [];
  for (let i = 0; i < n; i++) P.push({ x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, r: 1, g: 1, b: 1 });
  S.parts = { geo, pos, col, P, n, cursor: 0 };
  return S.parts;
}
function emitBurst(x, y, z, count, opt) {
  const S_ = S.parts; if (!S_) return;
  opt = opt || {};
  const spread = opt.spread || 7, up = opt.up || 6, life = opt.life || 0.75;
  const cr = opt.r === undefined ? 0.85 : opt.r, cg = opt.g === undefined ? 0.95 : opt.g, cb = opt.b === undefined ? 1.0 : opt.b;
  for (let i = 0; i < count; i++) {
    const p = S_.P[S_.cursor];
    S_.cursor = (S_.cursor + 1) % S_.n;
    p.x = x; p.y = y; p.z = z;
    const a = Math.random() * TAU, e = Math.random();
    const sp = spread * (0.3 + Math.random() * 0.9);
    p.vx = Math.cos(a) * sp;
    p.vz = Math.sin(a) * sp * 0.8;
    p.vy = up * (0.25 + e) * (opt.spreadY || 1);
    p.max = life * (0.6 + Math.random() * 0.7);
    p.life = p.max;
    p.r = cr * (0.7 + Math.random() * 0.5);
    p.g = cg * (0.7 + Math.random() * 0.5);
    p.b = cb * (0.7 + Math.random() * 0.5);
  }
}
function updateParticles(dt) {
  const S_ = S.parts; if (!S_) return;
  const pos = S_.pos, col = S_.col, P = S_.P;
  for (let i = 0; i < S_.n; i++) {
    const p = P[i];
    if (p.life > 0) {
      p.life -= dt;
      p.vy -= 11 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vx *= 0.985; p.vz *= 0.985;
      if (p.y < 0.12) p.life = 0;      // 触地即消失
      const k = Math.max(0, p.life / p.max);
      pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
      col[i * 3] = p.r * k; col[i * 3 + 1] = p.g * k; col[i * 3 + 2] = p.b * k;
    } else {
      pos[i * 3 + 1] = -999;
      col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0;
    }
  }
  S_.geo.attributes.position.needsUpdate = true;
  S_.geo.attributes.color.needsUpdate = true;
}

/* ---------------- 鱼 ---------------- */
function buildFishPool(T, n) {
  const bodyMat = new T.MeshStandardMaterial({ color: 0xa8c8dc, roughness: 0.34, metalness: 0.34, flatShading: false });
  const finMat = new T.MeshStandardMaterial({ color: 0x7fa8c4, roughness: 0.5, metalness: 0.2, side: T.DoubleSide });
  const eyeMat = new T.MeshStandardMaterial({ color: 0x14161f, roughness: 0.3 });
  const glowMat = new T.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.18, blending: T.AdditiveBlending, depthWrite: false });
  const pool = [];
  for (let i = 0; i < n; i++) {
    const g = new T.Group();
    const body = new T.Mesh(new T.SphereGeometry(0.26, 10, 8), bodyMat);
    body.scale.set(0.72, 0.86, 2.05);
    g.add(body);
    const tail = new T.Mesh(new T.ConeGeometry(0.19, 0.36, 4), finMat);
    tail.rotation.x = -Math.PI / 2;
    tail.position.z = 0.66;
    tail.scale.set(1, 1, 0.42);
    g.add(tail);
    const dorsal = new T.Mesh(new T.ConeGeometry(0.13, 0.26, 4), finMat);
    dorsal.position.set(0, 0.26, -0.08);
    dorsal.scale.set(1, 1, 0.36);
    g.add(dorsal);
    for (const s of [-1, 1]) {
      const eye = new T.Mesh(new T.SphereGeometry(0.045, 6, 5), eyeMat);
      eye.position.set(s * 0.135, 0.07, -0.36);
      g.add(eye);
      const pec = new T.Mesh(new T.ConeGeometry(0.10, 0.22, 4), finMat);
      pec.position.set(s * 0.17, -0.06, -0.05);
      pec.rotation.z = s * 1.2;
      pec.scale.set(1, 1, 0.3);
      g.add(pec);
    }
    const halo = new T.Mesh(new T.SphereGeometry(0.55, 8, 6), glowMat);
    g.add(halo);
    g.visible = false;
    S.scene.add(g);
    pool.push({
      g, body, tail, alive: false, caught: false,
      p: new T.Vector3(), v: new T.Vector3(), spin: 0, phase: Math.random() * 6.28, grounded: 0
    });
  }
  S.fishPool = pool;
  return pool;
}

function spawnFish() {
  const P = S.player;
  let f = null;
  for (const q of S.fishPool) if (!q.alive) { f = q; break; }
  if (!f) return;
  // 让“玩家到达鱼所在位置”的时刻落进鱼的滞空窗口内
  const lead = P.speed * rand(0.75, 1.95) + rand(3, 10);
  const x0 = CFG.shoreX + rand(2, 20);
  f.alive = true; f.caught = false; f.grounded = 0;
  f.p.set(x0, rand(0.1, 0.9), P.z - lead);
  f.v.set(-rand(12.5, 17.5), rand(11.8, 14.2), rand(-1.5, 2.5));
  f.spin = rand(-4, 4);
  f.g.visible = true;
  f.g.scale.setScalar(rand(0.85, 1.3));
}

function updateFish(dt) {
  const P = S.player;
  const FWD = _fv1.set(0, 0, -1);
  for (const f of S.fishPool) {
    if (!f.alive) continue;
    f.v.y -= 13.2 * dt;
    f.p.addScaledVector(f.v, dt);
    f.phase += dt * 13;
    // 朝向速度方向 + 摆动尾巴
    _fv2.copy(f.v).normalize();
    f.g.quaternion.setFromUnitVectors(FWD, _fv2);
    f.g.rotateZ(Math.sin(f.phase) * 0.22);
    f.tail.rotation.z = Math.sin(f.phase) * 0.5;
    f.g.position.copy(f.p);

    // 抓取判定（鹈鹕嘴尖）
    if (!f.caught) {
      const mouth = S.mouthPos;
      const d = f.p.distanceTo(mouth);
      if (d < 2.15) { catchFish(f); continue; }
      // 轻微吸附，提升手感
      if (d < 6.5) {
        _fv3.copy(mouth).sub(f.p).multiplyScalar(dt * 2.2);
        f.p.add(_fv3);
      }
    }
    // 落地 / 落海
    if (f.p.y < 0.12) {
      const overSea = f.p.x > CFG.shoreX;
      f.p.y = 0.12;
      if (overSea) {
        emitBurst(f.p.x, 0.15, f.p.z, 12, { spread: 4.2, up: 7.5, life: 0.7, r: 0.8, g: 0.92, b: 1 });
        S.audio.sLand(false);
      } else {
        emitBurst(f.p.x, 0.2, f.p.z, 9, { spread: 3.4, up: 5, life: 0.55, r: 0.75, g: 0.72, b: 0.66 });
        // 在玩家近处漏掉 → 断连击
        const near = Math.abs(f.p.z - P.z) < 14 && Math.abs(f.p.x - P.x) < 6.5;
        if (near && P.combo > 1) { P.combo = 1; S.hud.flash('连击中断'); }
      }
      f.grounded += dt;
      if (f.grounded > 0.4) { f.alive = false; f.g.visible = false; }
    }
    if (f.p.z > P.z + 30 || f.p.x < -40) { f.alive = false; f.g.visible = false; }
  }
}
let _fv1 = null, _fv2 = null, _fv3 = null;

function catchFish(f) {
  const P = S.player, A = S.audio, G = S.game;
  f.caught = true; f.alive = false; f.g.visible = false;
  P.fish++;
  G.totalFish++;
  P.combo = Math.min(P.combo + 1, 40);
  P.bestCombo = Math.max(P.bestCombo, P.combo);
  G.comboMax = Math.max(G.comboMax, P.combo);
  const gain = 10 * Math.min(P.combo, 10);
  P.score += gain;
  G.score = P.score;
  G.lastCatchT = G.time;
  if (!P.onGround) G.airCatches++;
  if (ENV.night > 0.5) G.nightFish++;
  emitBurst(f.p.x, f.p.y, f.p.z, 20, { spread: 6.5, up: 8, life: 0.85, r: 0.85, g: 0.95, b: 1.0 });
  emitBurst(f.p.x, f.p.y, f.p.z, 8, { spread: 3.5, up: 4.5, life: 0.6, r: 1.0, g: 0.85, b: 0.55 });
  A.sFish(P.combo);
  S.hud.popScore(gain);
  S.flashT = 0.18;
}

const CAMS = [
  { id: 'chase', name: '追尾跟拍', fov: 62 },
  { id: 'wide', name: '海岸全景', fov: 55 },
  { id: 'cinema', name: '电影运镜', fov: 48 },
  { id: 'fpv', name: '鹈鹕之眼', fov: 76 },
  { id: 'low', name: '贴地冲刺', fov: 70 }
];

function initCam(T) {
  const cam = new T.PerspectiveCamera(62, 16 / 9, 0.1, 6000);
  S.camera = cam;
  S.camState = {
    mode: 0, pos: new T.Vector3(0, 5, 14), tgt: new T.Vector3(),
    fov: 62, shot: 0, shotT: 0, blend: 1, trans: 1
  };
  return cam;
}

function updateCamera(dt, time) {
  const P = S.player, C = S.camState, T = THREE;
  const speed01 = clamp(P.speed / CFG.maxSpeed, 0, 1);
  const mode = CAMS[C.mode].id;
  const px = P.x, py = P.y, pz = P.z;
  const goalP = _cp1, goalT = _cp2;

  if (mode === 'chase') {
    goalP.set(px - P.laneV * 0.55, py + 3.5, pz + 8.4);
    goalT.set(px, py + 1.6, pz - 10);
  } else if (mode === 'wide') {
    goalP.set(px + 17, py + 9.0, pz + 16);
    goalT.set(px - 1, py + 1.2, pz - 6);
  } else if (mode === 'cinema') {
    C.shotT -= dt;
    if (C.shotT <= 0) { C.shot = (C.shot + 1) % 5; C.shotT = rand(6.5, 10.5); }
    const a = time * 0.22;
    switch (C.shot) {
      case 0:  // 环绕侧移
        goalP.set(px + Math.cos(a) * 9.5, py + 2.0 + Math.sin(a * 0.7) * 1.4, pz + Math.sin(a) * 9.5 + 3);
        goalT.set(px, py + 1.3, pz - 1);
        break;
      case 1:  // 高空俯冲
        goalP.set(px - 6, py + 22 - ((10.5 - Math.max(C.shotT, 0)) * 0.9), pz + 20);
        goalT.set(px, py + 1.0, pz - 6);
        break;
      case 2:  // 迎面低机位
        goalP.set(px + 2.4, py + 1.05, pz - 12);
        goalT.set(px, py + 1.55, pz + 2);
        break;
      case 3:  // 前轮特写
        goalP.set(px + 1.5, py + 0.62, pz - 2.4);
        goalT.set(px * 0.4, py + 1.35, pz + 1.8);
        break;
      default: // 大远景
        goalP.set(px + 34, py + 15, pz + 30);
        goalT.set(px, py + 2, pz - 4);
        break;
    }
  } else if (mode === 'fpv') {
    P.pel.updateMatrixWorld(true);
    _hp.set(0, 1.88, -0.42).applyMatrix4(P.pel.matrixWorld);
    goalP.copy(_hp);
    _hp2.set(P.laneV * 0.10, -0.05 - P.wheelie * 0.22, -1).normalize();
    goalT.copy(goalP).addScaledVector(_hp2, 22);
    goalT.y += Math.sin(time * 1.4) * 0.06;
  } else { // low
    goalP.set(px * 0.7, py + 0.72, pz + 4.7);
    goalT.set(px, py + 1.35, pz - 16);
  }
  if (goalP.y < 0.45) goalP.y = 0.45;

  // 切换镜头时更慢地跟随，形成运镜
  const follow = mode === 'fpv' ? 26 : (mode === 'cinema' ? 2.6 : 8.5);
  const k = 1 - Math.exp(-follow * dt);
  C.pos.lerp(goalP, k);
  C.tgt.lerp(goalT, mode === 'cinema' ? Math.min(1, k * 2.2) : Math.min(1, k * 1.6));

  // 震屏
  const sh = P.shake * 0.32;
  const shakeX = sh * Math.sin(time * 57.3), shakeY = sh * Math.cos(time * 41.7);
  S.camera.position.set(C.pos.x + shakeX, C.pos.y + shakeY, C.pos.z);
  S.camera.lookAt(C.tgt.x, C.tgt.y + shakeY * 0.4, C.tgt.z);

  const baseFov = CAMS[C.mode].fov;
  const targetFov = baseFov + speed01 * 9 + (P.wheelie * 3);
  C.fov = damp(C.fov, targetFov, 4, dt);
  S.camera.fov = C.fov;
  S.camera.updateProjectionMatrix();

  // 第一人称时隐藏喙与头部，避免遮住视线
  const hide = mode === 'fpv';
  const hp = P.pel.userData.headParts;
  for (let i = 0; i < hp.length; i++) hp[i].visible = !hide;
}

/* ---------------- 成就 ---------------- */
function unlockAch(id) {
  const G = S.game;
  if (G.ach[id]) return;
  G.ach[id] = true; G.unlocked++;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) HUD.toast(a.icon, a.name, a.desc);
  S.audio.sAchieve();
  try { localStorage.setItem('pelican_ach', JSON.stringify(G.ach)); } catch (e) { }
}

function checkAchievements(dt) {
  const P = S.player, G = S.game;
  const tryA = (id, cond) => { if (cond && !G.ach[id]) unlockAch(id); };

  tryA('first_fish', G.totalFish >= 1);
  tryA('fish_25', G.totalFish >= 25);
  tryA('fish_100', G.totalFish >= 100);
  tryA('air_catch', G.airCatches >= 1);
  tryA('combo5', G.comboMax >= 5);
  tryA('combo12', G.comboMax >= 12);
  tryA('night_hunt', G.nightFish >= 8);
  tryA('speed_100', P.speed * 3.6 >= 100);
  tryA('wheelie3', P.wheelT >= 3);
  tryA('dist_5k', P.dist >= 5000);
  tryA('no_hit_1k', G.noHitDist >= 1000);

  // 深夜满月下坚持骑行
  if (ENV.night > 0.8 && ENV.moon > 0.85 && P.speed > 8) G.moonT += dt;
  else G.moonT = Math.max(0, G.moonT - dt * 2.5);
  tryA('moon_30', G.moonT >= 30);

  // 黄昏时段（太阳仍未完全落下）无碰撞骑行
  const dusk = ENV.sunY > -0.09 && ENV.star < 0.22;
  if (dusk && P.speed > 9) G.sunsetT += dt;
  else if (!dusk) G.sunsetT = 0;
  tryA('sunset_25', G.sunsetT >= 25);

  // 大满贯
  if (!G.ach.master) {
    let all = true;
    for (const a of ACHIEVEMENTS) if (a.id !== 'master' && !G.ach[a.id]) { all = false; break; }
    if (all) unlockAch('master');
  }
}

/* ---------------- 输入 ---------------- */
function setupInput(T) {
  const K = S.keys = {};
  const map = {
    KeyW: 'w', KeyS: 's', KeyA: 'a', KeyD: 'd', Space: 'space', KeyT: 't',
    ArrowUp: 'w', ArrowDown: 's', ArrowLeft: 'a', ArrowRight: 'd'
  };
  window.addEventListener('keydown', e => {
    const k = map[e.code];
    if (k) { K[k] = true; e.preventDefault(); S.autoT = 0; }
    if (e.code === 'KeyC') cycleCam(1);
    else if (e.code === 'KeyR') resetRun();
    else if (e.code === 'KeyM') HUD.flash(S.audio.toggle() ? '音乐 开' : '音乐 关');
    else if (/^Digit[1-5]$/.test(e.code)) setCam(+e.code.slice(5) - 1);
    if (e.repeat) return;
  }, { passive: false });
  window.addEventListener('keyup', e => { const k = map[e.code]; if (k) K[k] = false; });
  window.addEventListener('blur', () => { for (const k in K) K[k] = false; });

  // 触屏按钮
  const bind = (id, down, up) => {
    const el = document.getElementById(id);
    if (!el) return;
    const on = e => { e.preventDefault(); el.classList.add('act'); S.autoT = 0; down(); };
    const off = e => { el.classList.remove('act'); if (up) up(); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  bind('bL', () => K.a = true, () => K.a = false);
  bind('bR', () => K.d = true, () => K.d = false);
  bind('bUp', () => K.w = true, () => K.w = false);
  bind('bDn', () => K.s = true, () => K.s = false);
  bind('bJump', () => K.space = true, () => K.space = false);
  bind('bWing', () => K.t = true, () => K.t = false);
  bind('bCam', () => cycleCam(1), null);
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('pad').classList.add('on');
  }
}

function readInput(dt) {
  const K = S.keys, IN = S.input;
  let act = false;
  IN.throttle = 0; IN.steer = 0;
  if (K.w) { IN.throttle = 1; act = true; }
  if (K.s) { IN.throttle = -1; act = true; }
  if (K.a) { IN.steer = -1; act = true; }
  if (K.d) { IN.steer = 1; act = true; }
  IN.jump = !!K.space; IN.wing = !!K.t;
  if (K.space || K.t) act = true;

  if (act) S.autoT = 0; else S.autoT += dt;
  S.auto = S.autoT > 1.5;
  if (S.auto) autoPilot(dt);
}

/* ---------------- 自动巡航：追鱼 + 避障 ---------------- */
function autoPilot(dt) {
  const P = S.player, IN = S.input;
  let best = null, bestScore = -1e9;
  for (const f of S.fishPool) {
    if (!f.alive || f.caught) continue;
    const dz = P.z - f.p.z;
    if (dz < 3 || dz > 120) continue;
    const tt = dz / Math.max(P.speed, 4);
    if (tt > 4.5) continue;
    const fx = f.p.x + f.v.x * tt;
    const fy = f.p.y + f.v.y * tt - 0.5 * 13.2 * tt * tt;
    if (fy < -0.4 || fx > CFG.shoreX + 6) continue;
    const sc = -Math.abs(fx - P.x) * 2.2 - Math.abs(tt - 1.15) * 3.0;
    if (sc > bestScore) { bestScore = sc; best = { fx: fx, fy: fy, tt: tt }; }
  }
  // 避障优先
  let danger = 0;
  for (const o of S.obsPool) {
    if (!o.alive) continue;
    const dz = P.z - o.z;
    if (dz > 3 && dz < 44 && Math.abs(o.x - CFG.laneX[P.lane]) < 1.7) {
      danger = o.x > CFG.laneX[P.lane] ? -1 : 1;
      break;
    }
  }

  if (best) {
    let li = 0, bd = 1e9;
    for (let i = 0; i < CFG.laneX.length; i++) {
      const d = Math.abs(CFG.laneX[i] - best.fx);
      if (d < bd) { bd = d; li = i; }
    }
    if (danger !== 0 && li === P.lane) li = clamp(P.lane + danger, 0, CFG.laneX.length - 1);
    if (li !== P.lane) IN.steer = Math.sign(li - P.lane);
    IN.throttle = best.tt > 1.8 ? 1 : (best.tt < 0.85 ? -1 : 0);
    if (best.fy > 1.15 && best.tt < 0.62 && P.onGround) IN.jump = true;
    if (best.tt > 2.4 && P.wheelie < 0.1) IN.wing = true;
  } else if (danger !== 0) {
    IN.steer = danger;
  }
}

/* ---------------- 镜头切换 ---------------- */
function setCam(i) {
  i = ((i % CAMS.length) + CAMS.length) % CAMS.length;
  S.camState.mode = i;
  S.camState.shotT = 0.01;
  HUD.camName(i);
}
function cycleCam(d) {
  setCam((S.camState.mode + (d || 1) + CAMS.length) % CAMS.length);
  S.audio.sWhoosh();
}

/* ---------------- 重置 ---------------- */
function resetRun() {
  const P = S.player;
  P.x = CFG.laneX[CFG.laneCenter]; P.lane = CFG.laneCenter;
  P.y = 0; P.vy = 0; P.onGround = true;
  P.speed = CFG.cruiseSpeed; P.wheelie = 0; P.wheelT = 0;
  P.dist = 0; P.score = 0; P.fish = 0; P.combo = 1;
  P.hitCD = 0; P.shake = 0;
  for (const f of S.fishPool) { f.alive = false; f.g.visible = false; }
  for (const o of S.obsPool) { o.alive = false; o.g.visible = false; }
  S.game.totalFish = 0; S.game.hits = 0; S.game.noHitDist = 0;
  S.game.comboMax = 1; S.game.airCatches = 0; S.game.nightFish = 0;
  S.game.sunsetT = 0; S.game.moonT = 0;
  HUD.flash('已重置');
}

/* ---------------- 画质自适应 ---------------- */
function setQuality(i) {
  i = clamp(i, 0, QUALITY.length - 1);
  S.qIdx = i;
  const q = QUALITY[i];
  S.renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, q.pr));
  onResize();
  if (S.sea) {
    const old = S.sea.geometry;
    S.sea.geometry = buildSeaGeo(THREE, q.sea, SEA_R);
    old.dispose();
  }
  const el = document.getElementById('qinfo');
  if (el) {
    el.textContent = '画质 · ' + q.name;
    clearTimeout(S._qt);
    S._qt = setTimeout(() => { el.style.opacity = 0.35; }, 1500);
  }
}
function updateQuality(dt) {
  if (S.simulating) return;
  const Q = S.qStat;
  Q.acc += dt; Q.frames++;
  if (Q.acc < 1) return;
  const fps = Q.frames / Q.acc;
  Q.acc = 0; Q.frames = 0;
  Q.hist.push(fps);
  if (Q.hist.length > 3) Q.hist.shift();
  let sum = 0; for (const v of Q.hist) sum += v;
  const avg = sum / Q.hist.length;
  if (avg < 44 && S.qIdx > 0) { setQuality(S.qIdx - 1); Q.good = 0; Q.hist.length = 0; }
  else if (avg > 58 && S.qIdx < QUALITY.length - 1) {
    Q.good = (Q.good || 0) + 1;
    if (Q.good >= 5) { setQuality(S.qIdx + 1); Q.good = 0; Q.hist.length = 0; }
  } else Q.good = 0;
}

/* ---------------- 环境应用 ---------------- */
function applyEnv(time) {
  evalEnv(S.dayT);
  const sun = S.sun, moonL = S.moonL, amb = S.amb;
  sun.position.copy(ENV.sunDir).multiplyScalar(400);
  sun.color.copy(ENV.sunC);
  sun.intensity = ENV.sunI * 1.2;
  moonL.position.copy(ENV.moonDir).multiplyScalar(400);
  moonL.intensity = ENV.moon * 0.62;
  amb.color.copy(ENV.ambC);
  amb.intensity = ENV.ambI * 0.45;
  // 天空光：让路面/物体在日出日落时不至于纯黑
  S.hemi.color.copy(ENV.hor).lerp(ENV.top, 0.45).multiplyScalar(1.35);
  S.hemi.groundColor.setHex(0x3a3228);
  S.hemi.intensity = 0.12 + ENV.ambI * 0.9;

  const fog = S.scene.fog;
  fog.color.copy(ENV.fog);
  fog.density = lerp(0.00115, 0.00075, ENV.night);

  const su = S.sky.material.uniforms;
  su.uStar.value = ENV.star; su.uMoon.value = ENV.moon;
  su.uSunI.value = clamp(ENV.sunI, 0, 2); su.uTime.value = time;

  const gu = S.sea.material.uniforms;
  gu.uTime.value = time; gu.uSunI.value = ENV.sunI;
  gu.uMoon.value = ENV.moon; gu.uNight.value = ENV.night;
  gu.uFogD.value = fog.density;
  gu.uCamPos.value.copy(S.camera.position);
  gu.uDetail.value = QUALITY[S.qIdx].detail;
}

/* ---------------- 单步推进（与渲染解耦，便于定步长模拟/测试） ---------------- */
function step(dt) {
  S.game.time += dt;
  const time = S.game.time;
  const P = S.player;

  S.dayT = (S.dayT + dt / DAY_PERIOD) % 1;
  applyEnv(time);

  readInput(dt);
  updatePlayer(dt);
  P.hitCD = Math.max(0, P.hitCD - dt);
  updatePlayerVisual(dt, time);

  S.ground.position.z = P.z;
  S.roadTex.offset.y = (-P.z / TILE) % 1;
  S.sea.position.z = P.z;
  updateDecor(P.z, QUALITY[S.qIdx].deco);

  P.root.updateMatrixWorld(true);
  S.mouthPos.set(0, 1.78, -0.98).applyMatrix4(P.pel.matrixWorld);

  updateScarf(dt, time, P.speed);
  updateFish(dt);
  updateObstacles(dt);
  updateParticles(dt);

  S.spawnFishT -= dt;
  if (S.spawnFishT <= 0) { spawnFish(); S.spawnFishT = clamp(3.4 - P.speed * 0.075, 0.75, 3.0); }
  S.spawnObsT -= dt;
  if (S.spawnObsT <= 0) { spawnObstacle(); S.spawnObsT = rand(4.5, 9.5); }

  if (P.hitCD <= 0) S.game.noHitDist += P.speed * dt;

  updateCamera(dt, time);
  S.sky.position.copy(S.camera.position);

  S.audio.sync(dt, P.cadence, clamp(P.speed / CFG.maxSpeed, 0, 1), ENV.night);
  S.audio.schedule();

  S.hudT -= dt;
  if (S.hudT <= 0) { S.hudT = 0.1; HUD.text(); }
  checkAchievements(dt);
  updateQuality(dt);
  S.frames++;
}

/* ---------------- 主循环 ---------------- */
function loop() {
  S.raf = requestAnimationFrame(loop);
  const raw = S.clock.getDelta();
  const dt = Math.min(raw, 1 / 20);
  step(dt);
  S.renderer.render(S.scene, S.camera);
}

function onResize() {
  const w = Math.max(1, global.innerWidth || 1), h = Math.max(1, global.innerHeight || 1);
  if (!S.renderer) return;
  S.renderer.setSize(w, h, false);
  if (S.camera) { S.camera.aspect = w / h; S.camera.updateProjectionMatrix(); }
}

/* ---------------- 装配 ---------------- */
function startGame(T) {
  const canvas = document.getElementById('c');
  const isMobile = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent || '');

  const renderer = new T.WebGLRenderer({
    canvas: canvas, antialias: !isMobile, powerPreference: 'high-performance',
    stencil: false, alpha: false, depth: true
  });
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = T.SRGBColorSpace;
  else if ('outputEncoding' in renderer) renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.NoToneMapping;
  S.renderer = renderer;
  S.maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy() || 1);

  S.scene = new T.Scene();
  S.scene.fog = new T.FogExp2(0x4e3a5e, 0.001);
  initEnv(T);
  initTmp(T);

  S.clock = new T.Clock();
  S.audio = new AudioSys();
  S.dayT = 0;
  S.input = { throttle: 0, steer: 0, jump: false, wing: false };
  S.autoT = 0; S.auto = true; S.hudT = 0; S.spawnFishT = 1.2; S.spawnObsT = 6;
  S.game = {
    time: 0, score: 0, totalFish: 0, hits: 0, airCatches: 0, nightFish: 0,
    comboMax: 1, noHitDist: 0, sunsetT: 0, moonT: 0, ach: {}, unlocked: 0, lastCatchT: -99
  };
  try { const raw = localStorage.getItem('pelican_ach'); if (raw) S.game.ach = JSON.parse(raw) || {}; } catch (e) { }
  S.qStat = { acc: 0, frames: 0, hist: [], good: 0 };

  // 灯光
  S.sun = new T.DirectionalLight(0xffffff, 1.4);
  S.scene.add(S.sun);
  S.moonL = new T.DirectionalLight(0x9ab0ff, 0);
  S.scene.add(S.moonL);
  S.amb = new T.AmbientLight(0x8a7ab0, 0.6);
  S.scene.add(S.amb);
  S.hemi = new T.HemisphereLight(0x8899cc, 0x3a3228, 0.6);
  S.scene.add(S.hemi);

  // 世界
  S.sky = buildSky(T); S.scene.add(S.sky);
  S.sea = buildSea(T, QUALITY[2].sea, SEA_R); S.scene.add(S.sea);
  S.ground = buildGround(T); S.scene.add(S.ground);
  buildDecor(T);

  // 角色
  buildPlayer(T);
  buildScarf(T, S.player);
  buildParticles(T, 260);
  buildFishPool(T, 16);
  buildObstacles(T, 12);
  initCam(T);

  HUD.init();
  setupInput(T);
  S.hud = HUD;

  setQuality(isMobile ? 1 : 2);
  onResize();
  global.addEventListener('resize', onResize);
  global.addEventListener('orientationchange', () => setTimeout(onResize, 120));

  // URL 调试参数：?dayt=0.5(昼夜相位) &cam=3(初始镜头) &q=4(画质) &skip=1(跳过开场)
  try {
    const qs = new URLSearchParams(global.location.search);
    if (qs.has('dayt')) S.dayT = clamp(parseFloat(qs.get('dayt')) || 0, 0, 0.999);
    if (qs.has('cam')) setCam((parseInt(qs.get('cam'), 10) || 1) - 1);
    if (qs.has('q')) setQuality((parseInt(qs.get('q'), 10) || 3) - 1);
    S.skipIntro = qs.has('skip');
  } catch (e) { }

  S.dayT = S.dayT || 0.0;
  // 定步长预演（测试/跳过热身用）：?sim=600 表示先推进 600 帧
  try {
    const qs2 = new URLSearchParams(global.location.search);
    if (qs2.has('sim')) {
      const n = clamp(parseInt(qs2.get('sim'), 10) || 0, 0, 20000);
      S.simulating = true;
      for (let i = 0; i < n; i++) step(1 / 60);
      S.simulating = false;
      S.clock.getDelta();
      console.log('[sim] frames=' + n + ' fish=' + S.player.fish + ' score=' + S.player.score +
        ' dist=' + S.player.dist.toFixed(1) + ' hits=' + S.game.hits +
        ' air=' + S.game.airCatches + ' comboMax=' + S.game.comboMax +
        ' unlocked=' + Object.keys(S.game.ach).length + '/' + ACHIEVEMENTS.length +
        ' night=' + ENV.night.toFixed(2) + ' dayT=' + S.dayT.toFixed(3));
      const bb = S.scarf.geo.boundingSphere;
      const p0 = S.scarf.pts[0].p, pl = S.scarf.pts[S.scarf.N - 1].p;
      console.log('[scarf] pin=' + p0.x.toFixed(2) + ',' + p0.y.toFixed(2) + ',' + p0.z.toFixed(2) +
        ' tip=' + pl.x.toFixed(2) + ',' + pl.y.toFixed(2) + ',' + pl.z.toFixed(2) +
        ' meshPos=' + S.scarf.mesh.position.toArray().join(',') +
        ' vis=' + S.scarf.mesh.visible +
        ' playerZ=' + S.player.z.toFixed(1));
    }
  } catch (e) { }
  applyEnv(0);
  loop();
}

/* ---------------- CDN 加载（多源回退） ---------------- */
const THREE_CDN = [
  './three.min.js',                                              // 本地优先：放在同目录即可完全离线运行
  'https://lib.baomitu.com/three.js/0.152.2/three.min.js',       // 360 前端静态资源库
  'https://cdn.staticfile.org/three.js/0.152.2/three.min.js',    // 七牛 staticfile
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.152.2/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js',
  'https://unpkg.com/three@0.152.2/build/three.min.js'
];

function loadThree(cb) {
  let i = 0;
  const boot = document.getElementById('bootMsg');
  const next = () => {
    if (i >= THREE_CDN.length) return cb(new Error('all cdn failed'));
    const url = THREE_CDN[i++];
    if (boot) boot.textContent = '加载 3D 引擎 … (' + i + '/' + THREE_CDN.length + ')';
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    s.onload = () => { if (global.THREE) cb(null); else { s.remove(); next(); } };
    s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s);
  };
  next();
}

loadThree(function (err) {
  const boot = document.getElementById('boot');
  if (err || !global.THREE) {
    if (boot) {
      boot.classList.add('err');
      boot.innerHTML = '<h1>3D 引擎加载失败</h1>' +
        '<p>所有 CDN 源均不可达，请检查网络后刷新页面</p>' +
        '<small>提示：也可下载 three.min.js 放在同目录并在 CDN 列表首位改为相对路径</small>';
    }
    return;
  }
  try {
    startGame(global.THREE);
  } catch (e) {
    if (boot) {
      boot.classList.add('err');
      boot.innerHTML = '<h1>启动失败</h1><p style="max-width:80vw;text-align:center">' +
        String(e && e.message ? e.message : e) + '</p>';
    }
    throw e;
  }
  if (boot) { boot.classList.add('hide'); setTimeout(() => boot.remove(), 700); }

  const splash = document.getElementById('splash');
  if (splash) {
    if (S.skipIntro) { splash.remove(); S.autoT = 0; }
    else {
      splash.classList.remove('hide');
      const go = () => {
        try { S.audio.init(); S.audio.resume(); } catch (e) { }
        splash.classList.add('hide');
        S.autoT = 0;
        setTimeout(() => splash.remove(), 620);
      };
      splash.addEventListener('pointerdown', go, { once: true });
    }
  }
});

})(window);
</script>
