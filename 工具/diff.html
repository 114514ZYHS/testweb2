<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub { color: #57606a; font-size: 16px; margin-bottom: 24px; }
    .back-link {
        display: inline-block; margin-bottom: 16px;
        color: #0969da; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .card {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        padding: 18px 20px; margin-bottom: 16px;
    }
    label.tag {
        display: block; font-size: 13px; font-weight: 600;
        color: #57606a; margin-bottom: 6px;
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea {
        width: 100%; min-height: 160px; resize: vertical;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px; line-height: 1.6;
        padding: 8px 10px; border: 1px solid #d0d7de;
        background: #ffffff; color: #1e1e1e;
    }
    textarea:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .btns { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
        font-family: inherit; font-size: 14px; font-weight: 500;
        padding: 8px 18px; border: 1px solid #d0d7de;
        background: rgba(246, 248, 250, 0.9); color: #1e1e1e; cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.primary { background: #2da44e; border-color: #2da44e; color: #ffffff; }
    button.primary:hover { background: #22863a; border-color: #22863a; }
    .opt { font-size: 13px; color: #57606a; display: flex; align-items: center; gap: 6px; }
    .summary { margin-top: 6px; font-size: 14px; color: #57606a; }
    .summary .add { color: #1a7f37; font-weight: 600; }
    .summary .del { color: #cf222e; font-weight: 600; }
    .diff {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px; line-height: 1.7;
        border: 1px solid #d0d7de;
        background: #ffffff; overflow-x: auto;
    }
    .diff .ln {
        display: flex;
    }
    .diff .no {
        flex: 0 0 52px; text-align: right; padding: 0 10px;
        color: #8b949e; background: #f6f8fa;
        border-right: 1px solid #e1e4e8;
        user-select: none; font-size: 12px;
    }
    .diff .tx { flex: 1 1 auto; padding: 0 10px; white-space: pre-wrap; word-break: break-all; }
    .diff .same { }
    .diff .add { background: #e6ffec; }
    .diff .add .no { background: #ccffd8; color: #1a7f37; }
    .diff .del { background: #ffebe9; }
    .diff .del .no { background: #ffd7d5; color: #cf222e; }
    .diff .emp { color: #8b949e; font-style: normal; }
    .empty-tip { padding: 20px; color: #8b949e; font-size: 14px; }
    .footer {
        margin-top: 40px; text-align: center; font-size: 14px;
        color: #8b949e; border-top: 1px solid #d0d7de; padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .card { background: rgba(22, 27, 34, 0.85); border-color: #30363d; }
        label.tag { color: #8b949e; }
        textarea { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        button { background: rgba(28, 33, 40, 0.9); border-color: #30363d; color: #c9d1d9; }
        button:hover { background: #21262d; }
        button.primary { background: #238636; border-color: #238636; color: #ffffff; }
        .opt { color: #8b949e; }
        .summary { color: #8b949e; }
        .summary .add { color: #3fb950; }
        .summary .del { color: #f85149; }
        .diff { background: #0d1117; border-color: #30363d; }
        .diff .no { background: #161b22; color: #8b949e; border-right-color: #30363d; }
        .diff .add { background: rgba(46, 160, 67, 0.15); }
        .diff .add .no { background: rgba(46, 160, 67, 0.3); color: #3fb950; }
        .diff .del { background: rgba(248, 81, 73, 0.15); }
        .diff .del .no { background: rgba(248, 81, 73, 0.3); color: #f85149; }
        .diff .emp { color: #8b949e; }
        .empty-tip { color: #8b949e; }
        .footer { border-top-color: #30363d; }
    }
    @media (max-width: 640px) {
        .two { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    <h1>文本对比</h1>
    <div class="sub">逐行比对两段文本，标出新增和删除的行</div>

    <div class="card">
        <div class="two">
            <div>
                <label class="tag">原文</label>
                <textarea id="a" placeholder="粘贴第一段文本"></textarea>
            </div>
            <div>
                <label class="tag">对比文本</label>
                <textarea id="b" placeholder="粘贴第二段文本"></textarea>
            </div>
        </div>

        <div class="btns">
            <button class="primary" id="run">开始对比</button>
            <button id="clear">清空</button>
            <button id="swap">交换两侧</button>
            <span class="opt"><input type="checkbox" id="ign" style="width:auto"> 忽略首尾空白</span>
            <span class="opt"><input type="checkbox" id="case" style="width:auto"> 忽略大小写</span>
        </div>
        <div class="summary" id="summary"></div>
    </div>

    <div class="card">
        <label class="tag">对比结果</label>
        <div class="diff" id="diff"><div class="empty-tip">结果会显示在这里。</div></div>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>

<script>
(function () {
    var aEl = document.getElementById('a');
    var bEl = document.getElementById('b');
    var out = document.getElementById('diff');
    var sum = document.getElementById('summary');
    var ign = document.getElementById('ign');
    var cs = document.getElementById('case');

    function norm(s) {
        if (ign.checked) s = s.replace(/^\s+|\s+$/g, '');
        if (cs.checked) s = s.toLowerCase();
        return s;
    }
    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 标准 LCS 动态规划（行数多时用滚动数组求长度，再回溯）
    function diffLines(a, b) {
        var n = a.length, m = b.length;
        if (n * m > 4000000) return null; // 太大就拒绝，避免卡死
        var dp = [];
        for (var i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
        for (var i2 = n - 1; i2 >= 0; i2--) {
            for (var j = m - 1; j >= 0; j--) {
                dp[i2][j] = a[i2] === b[j]
                    ? dp[i2 + 1][j + 1] + 1
                    : Math.max(dp[i2 + 1][j], dp[i2][j + 1]);
            }
        }
        var res = [];
        var x = 0, y = 0;
        while (x < n && y < m) {
            if (a[x] === b[y]) { res.push({ t: 'same', v: a[x] }); x++; y++; }
            else if (dp[x + 1][y] >= dp[x][y + 1]) { res.push({ t: 'del', v: a[x] }); x++; }
            else { res.push({ t: 'add', v: b[y] }); y++; }
        }
        while (x < n) { res.push({ t: 'del', v: a[x] }); x++; }
        while (y < m) { res.push({ t: 'add', v: b[y] }); y++; }
        return res;
    }

    function run() {
        var rawA = aEl.value, rawB = bEl.value;
        if (!rawA && !rawB) {
            out.innerHTML = '<div class="empty-tip">两边都没内容，先粘点东西进来。</div>';
            sum.textContent = ''; return;
        }
        var A = rawA.split('\n').map(norm);
        var B = rawB.split('\n').map(norm);
        var r = diffLines(A, B);
        if (r === null) {
            out.innerHTML = '<div class="empty-tip">行数太多了（超过约 2000 × 2000），浏览器算不动，请分段对比。</div>';
            sum.textContent = ''; return;
        }
        var add = 0, del = 0, same = 0;
        var html = '';
        var na = 0, nb = 0;
        for (var i = 0; i < r.length; i++) {
            var row = r[i];
            var no, cls;
            if (row.t === 'same') {
                same++; na++; nb++;
                no = na + ' ' + nb;
                cls = 'same';
            } else if (row.t === 'del') {
                del++; na++;
                no = na + ' ';
                cls = 'del';
            } else {
                add++; nb++;
                no = ' ' + nb;
                cls = 'add';
            }
            var tx = esc(row.v);
            if (tx === '') tx = '<span class="emp">（空行）</span>';
            html += '<div class="ln ' + cls + '"><span class="no">' + no + '</span><span class="tx">' + tx + '</span></div>';
        }
        out.innerHTML = html;
        sum.innerHTML = '共 ' + r.length + ' 行：' +
            '<span class="add">+' + add + '</span> 新增，' +
            '<span class="del">-' + del + '</span> 删除，' +
            same + ' 行相同。' +
            (add === 0 && del === 0 ? ' <span style="color:#1a7f37">两边完全一样。</span>' : '');
    }

    document.getElementById('run').addEventListener('click', run);
    document.getElementById('clear').addEventListener('click', function () {
        aEl.value = ''; bEl.value = '';
        out.innerHTML = '<div class="empty-tip">结果会显示在这里。</div>';
        sum.textContent = '';
    });
    document.getElementById('swap').addEventListener('click', function () {
        var t = aEl.value; aEl.value = bEl.value; bEl.value = t;
        run();
    });
    ign.addEventListener('change', run);
    cs.addEventListener('change', run);
    aEl.addEventListener('input', run);
    bEl.addEventListener('input', run);
})();
</script>
</body>
</html>
