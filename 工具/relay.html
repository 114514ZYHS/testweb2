<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Relay AI API Studio - ZYHS</title>
<style>
    /* 配色照抄原生版 MainForm 里的常量，不自己调:
       Primary #185d46 / PrimarySoft #e5f1eb / Background #f4f5f2
       TextColor #1c1f1c / Muted #677068
       全站规矩：直角、无阴影、无 emoji。 */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f5f2;
        color: #1c1f1c;
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-size: 14px;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.62)),
            url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
    }
    .back-link {
        display: inline-block;
        margin: 12px 0 0 18px;
        color: #0969da;
        text-decoration: none;
        font-size: 13px;
    }
    .back-link:hover { text-decoration: underline; }

    /* ---------- 顶栏（对应原生版的 header，高 58） ---------- */
    .app {
        max-width: 1220px;
        width: calc(100% - 36px);
        margin: 10px auto 22px;
        background: #ffffff;
        border: 1px solid #dde2dd;
        display: flex;
        flex-direction: column;
        min-height: 620px;
    }
    .header {
        height: 58px;
        display: flex;
        align-items: center;
        padding: 0 18px;
        border-bottom: 1px solid #dde2dd;
        background: #ffffff;
        flex: 0 0 auto;
    }
    .mark {
        width: 32px; height: 32px;
        background: #185d46;
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 32px;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; margin-left: 12px; min-width: 0; }
    .brand b { font-size: 15px; color: #1c1f1c; }
    .brand span { font-size: 10.5px; color: #677068; letter-spacing: 0.04em; }
    .header-status { margin-left: auto; font-size: 12.5px; color: #185d46; flex: 0 0 auto; padding-left: 10px; }
    .header-status.busy { color: #bf8700; }
    .header-status.err { color: #b42318; }

    /* 手机上用来收起/展开侧栏的两个小按钮，桌面隐藏 */
    .mob-tabbar { display: none; }

    /* ---------- 三栏主体 ---------- */
    .body-row {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 330px;
        flex: 1 1 auto;
        min-height: 0;
        background: #dde2dd;
        gap: 1px;
    }
    .col { background: #f8f9f7; min-width: 0; display: flex; flex-direction: column; }
    .col.center { background: #ffffff; }
    .col.right { background: #f9faf8; overflow-y: auto; }

    /* 左栏：服务商 */
    .provider-col { padding: 12px 12px; }
    .btn-newchat {
        height: 40px;
        width: 100%;
        border: 0;
        background: #185d46;
        color: #ffffff;
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
    }
    .btn-newchat:hover { background: #14684f; }
    .field-cap { font-size: 12px; color: #677068; padding: 12px 4px 8px; }
    .provider-list { flex: 1 1 auto; overflow-y: auto; }
    .pv-item {
        min-height: 47px;
        padding: 7px 10px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
    }
    .pv-item:hover { background: #eef1ec; }
    .pv-item.on { background: #e5f1eb; }
    .pv-item .nm { font-size: 13.5px; font-weight: 600; color: #1c1f1c; }
    .pv-item.on .nm { color: #185d46; }
    .pv-item .pr { font-size: 10.5px; color: #677068; }

    /* 中栏：对话 */
    .tabs {
        display: flex;
        border-bottom: 1px solid #dde2dd;
        background: #ffffff;
        flex: 0 0 auto;
    }
    .tab {
        flex: 1 1 auto;
        text-align: center;
        padding: 9px 16px;
        font-size: 13px;
        color: #677068;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
    }
    .tab.on { color: #185d46; border-bottom-color: #185d46; font-weight: 600; }
    .pane { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px; display: none; }
    .pane.on { display: block; }
    .pane.mono { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }

    .msg { margin-bottom: 14px; }
    .msg .who { font-size: 12.5px; font-weight: 600; color: #414842; margin-bottom: 4px; }
    .msg.assistant .who { color: #185d46; }
    .msg .txt { font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }

    /* 引用来源（联网搜索带回来的） */
    .cites { margin-top: 7px; border-top: 1px solid #eef1ec; padding-top: 6px; }
    .cites .cap { font-size: 11px; color: #677068; margin-bottom: 3px; }
    .cites a {
        display: block;
        font-size: 11.5px;
        color: #0969da;
        text-decoration: none;
        line-height: 1.7;
        word-break: break-all;
    }
    .cites a:hover { text-decoration: underline; }

    .chat-empty { color: #8b949e; font-size: 13px; padding: 20px 0; line-height: 1.8; }

    /* 输入区（原生版高 156） */
    .composer {
        flex: 0 0 auto;
        border-top: 1px solid #dde2dd;
        background: #f9faf8;
        padding: 12px 16px 14px;
        display: flex;
        gap: 10px;
    }
    .composer textarea {
        flex: 1 1 auto;
        min-height: 108px;
        resize: vertical;
        font: inherit;
        font-size: 13.5px;
        padding: 9px 10px;
        border: 1px solid #cdd4cd;
        background: #ffffff;
        color: #1c1f1c;
    }
    .composer textarea:focus { outline: 2px solid #185d46; outline-offset: -1px; }
    .composer-actions { width: 116px; flex: 0 0 116px; display: flex; flex-direction: column; gap: 8px; }
    .btn-send {
        height: 42px;
        border: 0;
        background: #185d46;
        color: #ffffff;
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
        margin-top: auto;
    }
    .btn-send:hover { background: #14684f; }
    .btn-send:disabled { background: #9db3a8; cursor: not-allowed; }
    .btn-send.stop { background: #b42318; }
    .btn-sec {
        height: 38px;
        border: 1px solid #cdd4cd;
        background: #ffffff;
        color: #1c1f1c;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
    }
    .btn-sec:hover { background: #f0f2ef; }
    .btn-sec:disabled { color: #9aa39c; cursor: not-allowed; background: #f4f5f2; }

    /* 右栏：连接与参数 */
    .settings { padding: 14px 16px 20px; }
    .settings h2 { font-size: 15px; font-weight: 700; margin: 0 0 6px; color: #1c1f1c; }
    .fld { margin-bottom: 11px; }
    .fld > label { display: block; font-size: 12px; color: #677068; margin-bottom: 4px; }
    .fld input[type="text"], .fld input[type="password"], .fld select, .fld textarea {
        width: 100%;
        font: inherit;
        font-size: 13px;
        padding: 7px 9px;
        border: 1px solid #cdd4cd;
        background: #ffffff;
        color: #1c1f1c;
    }
    .fld textarea { min-height: 66px; resize: vertical; font-size: 12.5px; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid #185d46; outline-offset: -1px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 模型行：一个真下拉 + 同步按钮，下面再挂一个可写的手填框 */
    .model-row { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 8px; }
    .model-row select { width: 100%; }
    .model-row .btn-sec { height: 100%; }
    .model-edit { margin-top: 7px; }
    .model-edit input { width: 100%; }
    .hint { font-size: 11px; color: #677068; line-height: 1.6; margin-top: 6px; }
    .model-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: #677068; margin-top: 5px; gap: 8px; }
    .model-meta b { color: #185d46; font-weight: 600; white-space: nowrap; }
    .chk { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-bottom: 11px; }
    .chk input { width: 15px; height: 15px; accent-color: #185d46; flex: 0 0 auto; }
    /* 「联网搜索」的说明紧贴在勾选框下面（说的就是它）。
       注意别用 .chk + .hint 这种宽选择器，会连带命中密钥那处提示，
       把两行字压重叠（实测间隙 -6px）。用 id 精确限定。 */
    #searchHint { margin-top: -4px; margin-bottom: 12px; }

    .keyrow { display: grid; grid-template-columns: minmax(0, 1fr) 62px; gap: 8px; }
    .keyrow .btn-sec { height: 100%; min-height: 34px; }

    .statusbar {
        flex: 0 0 auto;
        border-top: 1px solid #dde2dd;
        background: #ffffff;
        padding: 5px 14px;
        font-size: 12px;
        color: #677068;
        line-height: 1.7;
    }

    /* 提示词库弹层 */
    .modal-bg {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 500;
        padding: 12px;
    }
    .modal-bg.on { display: flex; }
    .modal {
        width: min(760px, 100%);
        max-height: 86vh;
        background: #ffffff;
        border: 1px solid #cdd4cd;
        display: flex;
        flex-direction: column;
    }
    .modal-hd {
        padding: 12px 16px;
        border-bottom: 1px solid #dde2dd;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .modal-hd b { font-size: 14px; }
    .modal-hd input {
        margin-left: auto;
        font: inherit; font-size: 13px;
        padding: 6px 9px;
        border: 1px solid #cdd4cd;
        width: 220px;
        max-width: 100%;
    }
    .modal-bd { overflow-y: auto; padding: 10px 16px 16px; }
    .tpl { border-bottom: 1px solid #eef1ec; padding: 10px 0; cursor: pointer; }
    .tpl:hover { background: #f8faf8; }
    .tpl .t { font-size: 13.5px; font-weight: 600; color: #185d46; }
    .tpl .c { font-size: 11px; color: #677068; margin-left: 8px; }
    .tpl .d { font-size: 12.5px; color: #677068; margin-top: 3px; }
    .modal-ft { padding: 10px 16px; border-top: 1px solid #dde2dd; text-align: right; }

    @media (max-width: 1000px) {
        .body-row { grid-template-columns: 190px minmax(0, 1fr); }
        .col.right { grid-column: 1 / -1; }
    }

    /* ==========================================================
       手机：不再三栏硬挤，改成单列 + 顶部切换
       站长要的是"单列铺满、切换式布局"
       ========================================================== */
    @media (max-width: 720px) {
        body { font-size: 15px; }
        .back-link { margin: 10px 0 0 14px; }
        /* 手机上让整个 app 撑满一屏，对话区吃掉剩余高度。
           写成 dvh（动态视口高），能避开 iOS Safari 地址栏伸缩导致的跳动；
           老浏览器不认 dvh，所以先用 vh 兜底。 */
        .app {
            width: 100%;
            margin: 8px 0 0;
            border-left: 0;
            border-right: 0;
            min-height: calc(100vh - 40px);
            min-height: calc(100dvh - 40px);
            flex: 1 1 auto;
        }
        .header { padding: 0 14px; height: 52px; }
        .brand span { display: none; }
        /* 手机上不显示"待填密钥"这类状态，省纵向空间 */
        .header-status { font-size: 12px; }

        /* 顶部三个切换按钮 */
        .mob-tabbar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1px;
            background: #dde2dd;
            border-bottom: 1px solid #dde2dd;
            flex: 0 0 auto;
        }
        .mob-tabbar button {
            border: 0;
            /* 底部留 2px 透明边，选中时变绿，避免选中态导致按钮高度跳动 */
            border-bottom: 2px solid transparent;
            background: #f8f9f7;
            color: #414842;
            font: inherit;
            font-size: 13px;
            padding: 10px 4px;
            cursor: pointer;
        }
        .mob-tabbar button.on {
            background: #ffffff;
            color: #185d46;
            font-weight: 600;
            border-bottom-color: #185d46;
        }

        /* 单列铺满：一次只显示一栏。
           用 flex 列而不是 block，好让选中的那栏能撑满剩下的高度。 */
        .body-row {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            grid-template-columns: none;
            background: #ffffff;
        }
        .col { display: none; }
        .col.mob-show { display: flex; flex: 1 1 auto; min-height: 0; }
        .col.center { display: none; }
        .col.center.mob-show { display: flex; flex: 1 1 auto; min-height: 0; }

        /* 参数栏内容多，让它自己滚，别把整个页面顶长 */
        .col.right.mob-show { overflow-y: auto; }

        .provider-col { padding: 12px 14px; }
        .btn-newchat { height: 46px; font-size: 15px; }
        .pv-item { min-height: 54px; padding: 9px 12px; }
        .pv-item .nm { font-size: 15px; }
        .pv-item .pr { font-size: 11.5px; }

        /* 对话区要占满剩下的高度 */
        .col.center { flex: 1 1 auto; min-height: 0; }
        .pane { padding: 12px 14px; }
        .tab { padding: 11px 6px; font-size: 14px; }

        /* 输入区：手机上竖排，发送按钮整行好点 */
        .composer {
            flex-direction: column;
            gap: 8px;
            padding: 10px 14px 14px;
        }
        .composer textarea { min-height: 92px; font-size: 15px; }
        .composer-actions {
            width: auto;
            flex: 0 0 auto;
            flex-direction: row;
            gap: 8px;
        }
        .composer-actions .btn-sec,
        .composer-actions .btn-send {
            flex: 1 1 auto;
            height: 48px;
            font-size: 15px;
            margin-top: 0;
        }

        .settings { padding: 14px 14px 22px; }
        /* 手机上输入框加大，避免 iOS 聚焦缩放（字号 >= 16px） */
        .fld input[type="text"], .fld input[type="password"], .fld select, .fld textarea { font-size: 16px; padding: 9px 10px; }
        .fld textarea { font-size: 15px; }
        .chk { font-size: 15px; margin-bottom: 13px; }
        .chk input { width: 19px; height: 19px; }
        /* 手机上说明文字别太小，11px 在手机上基本看不清 */
        .hint, #searchHint { font-size: 12.5px; line-height: 1.65; }
        .btn-sec { height: 44px; font-size: 15px; }
        .model-row { grid-template-columns: minmax(0, 1fr) 96px; }
        .row2 { grid-template-columns: 1fr; }
        .modal-hd input { margin-left: 0; width: 100%; }
        .modal-hd { gap: 8px; }
    }
</style>
</head>
<body>
<a href="../index.html" class="back-link">&larr; 返回主页</a>

<div class="app">
    <div class="header">
        <div class="mark">R</div>
        <div class="brand"><b>Relay</b><span>NATIVE API STUDIO · WEB</span></div>
        <div class="header-status" id="hdrStatus">就绪</div>
    </div>

    <!-- 手机上才显示：三栏切换 -->
    <div class="mob-tabbar" id="mobTabbar">
        <button type="button" data-col="provider">服务商</button>
        <button type="button" data-col="center" class="on">对话</button>
        <button type="button" data-col="settings">参数</button>
    </div>

    <div class="body-row">
        <!-- 左：服务商 -->
        <div class="col provider-col" data-col="provider">
            <button class="btn-newchat" id="btnNewChat">新建会话</button>
            <div class="field-cap">服务商</div>
            <div class="provider-list" id="providerList"></div>
        </div>

        <!-- 中：对话 / 请求体 / 原始响应 -->
        <div class="col center mob-show" data-col="center">
            <div class="tabs">
                <div class="tab on" data-pane="paneChat">对话</div>
                <div class="tab" data-pane="paneReq">请求体</div>
                <div class="tab" data-pane="paneRaw">原始响应</div>
            </div>
            <div class="pane on" id="paneChat"></div>
            <div class="pane mono" id="paneReq"></div>
            <div class="pane mono" id="paneRaw"></div>
            <div class="composer">
                <textarea id="promptBox" placeholder="输入内容，Ctrl+Enter 发送"></textarea>
                <div class="composer-actions">
                    <button class="btn-sec" id="btnTpl">提示词库</button>
                    <button class="btn-send" id="btnSend">发送</button>
                </div>
            </div>
        </div>

        <!-- 右：连接与参数 -->
        <div class="col right" data-col="settings">
            <div class="settings">
                <h2>连接与参数</h2>

                <div class="fld">
                    <label>协议</label>
                    <select id="protocolBox">
                        <option value="chat">Chat Completions</option>
                        <option value="responses">Responses API</option>
                    </select>
                </div>

                <div class="fld">
                    <label>Base URL</label>
                    <input type="text" id="baseUrlBox" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false">
                </div>

                <div class="fld">
                    <label>API Key</label>
                    <div class="keyrow">
                        <input type="password" id="apiKeyBox" placeholder="sk-..." autocomplete="off" spellcheck="false">
                        <button class="btn-sec" id="btnShowKey" title="显示/隐藏">显示</button>
                    </div>
                    <label class="chk" style="margin-top:8px;margin-bottom:0;">
                        <input type="checkbox" id="rememberKey">记住密钥（存在本机浏览器）
                    </label>
                    <div class="hint" id="keyHint">不勾选时密钥只留在内存，刷新即清空。</div>
                </div>

                <div class="fld">
                    <label>模型</label>
                    <div class="model-row">
                        <select id="modelSelect"></select>
                        <button class="btn-sec" id="btnSync">同步模型</button>
                    </div>
                    <div class="model-edit">
                        <input type="text" id="modelBox" placeholder="也可直接手填模型名" autocomplete="off" spellcheck="false">
                        <div class="hint">上面下拉里选，或在这里手填一个不在列表里的模型名，两边是同一个值。</div>
                    </div>
                    <div class="model-meta">
                        <span id="modelCount">—</span>
                        <b id="modelType">未选择</b>
                    </div>
                </div>

                <div class="fld">
                    <label>System Prompt</label>
                    <textarea id="systemPromptBox">你是一个专业、准确、简洁的 AI 助手。</textarea>
                </div>

                <div class="row2">
                    <div class="fld">
                        <label>Temperature</label>
                        <input type="text" id="temperatureBox" value="0.7" autocomplete="off">
                    </div>
                    <div class="fld">
                        <label>Max Tokens</label>
                        <input type="text" id="maxTokensBox" value="4096" autocomplete="off">
                    </div>
                </div>

                <div class="fld">
                    <label>Reasoning</label>
                    <select id="reasoningBox">
                        <option>none</option>
                        <option>low</option>
                        <option selected>medium</option>
                        <option>high</option>
                        <option>xhigh</option>
                        <option>max</option>
                    </select>
                </div>

                <label class="chk"><input type="checkbox" id="streamCheck" checked>流式输出</label>

                <label class="chk"><input type="checkbox" id="searchCheck">联网搜索</label>
                <div class="hint" id="searchHint">—</div>

                <div class="fld">
                    <label>自定义 Headers (JSON)</label>
                    <textarea id="customHeadersBox" placeholder='{"X-Title": "Relay"}' spellcheck="false"></textarea>
                </div>

                <div class="fld">
                    <button class="btn-sec" id="btnClear" style="width:100%;">清空当前会话</button>
                </div>
            </div>
        </div>
    </div>

    <div class="statusbar" id="statusbar">网页版 · 密钥默认只存在浏览器内存 · 请求由你的浏览器直连服务商</div>
</div>

<!-- 提示词库 -->
<div class="modal-bg" id="tplModal">
    <div class="modal">
        <div class="modal-hd">
            <b>提示词库</b>
            <input type="text" id="tplSearch" placeholder="搜索标题或说明…">
        </div>
        <div class="modal-bd" id="tplList"></div>
        <div class="modal-ft"><button class="btn-sec" id="tplClose" style="padding:0 18px;">关闭</button></div>
    </div>
</div>

<script>
/* ============================================================
   数据部分与原生版 RelayAIStudio.cs 保持一致：
   - 服务商预设（CreateProviders）
   - 提示词模板（CreateTemplates）
   - 协议 / 模型判定 / 请求体构造（BuildRequestBody）
   改数据之前请回查仓库里那份 C#，别在这里单独改。

/* ---------- 模型类型判定（对应 IsImageModel / GetModelType） ---------- */
function isImageModel(m) {
    m = (m || "").toLowerCase();
    return m.indexOf("image") >= 0 || m.indexOf("dall") >= 0 || m.indexOf("flux") >= 0;
}
function modelType(m) {
    if (isImageModel(m)) return "图像模型";
    var l = (m || "").toLowerCase();
    if (l.indexOf("codex") >= 0 || l.indexOf("coder") >= 0) return "代码模型";
    if (l.indexOf("gpt-5") >= 0 || l.indexOf("reason") >= 0) return "推理模型";
    return m ? "文本模型" : "未选择";
}

<script>
/* ============================================================
   交互与网络
   ============================================================ */
var $ = function (id) { return document.getElementById(id); };

var LS_KEY = "relay.keys.v1";        // 存密钥（仅在用户勾选后）
var LS_MISC = "relay.misc.v1";       // 存记住密钥这个开关本身

var state = {
    current: null,        // 当前服务商
    messages: [],         // [{role, content, cites}]
    keys: {},             // providerId -> key，内存缓存
    abort: null,          // 正在进行的请求
    synced: {}            // providerId -> 同步回来的模型 id 数组
};

/* ---------- 本地存储（失败要静默降级，隐私模式会抛） ---------- */
function storeGet(name) {
    try { return JSON.parse(localStorage.getItem(name) || "null"); }
    catch (e) { return null; }
}
function storeSet(name, obj) {
    try { localStorage.setItem(name, JSON.stringify(obj)); return true; }
    catch (e) { return false; }
}
function storeDel(name) {
    try { localStorage.removeItem(name); } catch (e) { /* 无视 */ }
}

/* ---------- 提示条 ---------- */
function setStatus(text, kind) {
    var el = $("hdrStatus");
    el.textContent = text;
    el.className = "header-status" + (kind ? " " + kind : "");
}

/* ---------- 左栏服务商列表 ---------- */
function renderProviders() {
    var box = $("providerList");
    box.innerHTML = "";
    PROVIDERS.forEach(function (p) {
        var d = document.createElement("div");
        d.className = "pv-item" + (state.current && state.current.id === p.id ? " on" : "");
        d.setAttribute("data-pid", p.id);
        d.innerHTML = '<span class="nm">' + p.name + '</span>' +
                      '<span class="pr">' + (p.proto === "responses" ? "Responses API" : "Chat Completions") + '</span>';
        d.addEventListener("click", function () { selectProvider(p.id); });
        box.appendChild(d);
    });
}

function selectProvider(id) {
    var p = PROVIDERS.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    // 切走之前先把当前 key 记住（原生版是 keys[provider.Id] = 输入框内容）
    if (state.current) state.keys[state.current.id] = $("apiKeyBox").value;
    state.current = p;

    $("baseUrlBox").value = p.base;
    $("protocolBox").value = p.proto;
    $("apiKeyBox").value = state.keys[p.id] || "";
    $("apiKeyBox").placeholder = p.key ? "sk-..." : "本地服务无需密钥";

    // 模型下拉：优先用同步回来的列表，没有就用预设
    var list = state.synced[p.id] || p.models;
    fillModelSelect(list);
    if (list.length) {
        setModel(list[0], list);
    } else {
        setModel("", []);
    }

    renderProviders();
    refreshSearchUI();
    updatePreview();
    setStatus(p.key ? (state.keys[p.id] ? "就绪" : "待填密钥") : "就绪",
              p.key && !state.keys[p.id] ? "busy" : "");
}

/* 模型下拉：真 <select>，不是 <datalist>。
   上一版用 datalist，它在桌面上只是"输入时补全"，手机上很多浏览器根本不弹，
   表现就是"同步完选不了、只能有一个"——这次换成实打实的下拉。 */
function fillModelSelect(list) {
    var sel = $("modelSelect");
    sel.innerHTML = "";
    if (!list || !list.length) {
        var o = document.createElement("option");
        o.value = "";
        o.textContent = "（无预设，请手填或点同步）";
        sel.appendChild(o);
        return;
    }
    list.forEach(function (m) {
        var o = document.createElement("option");
        o.value = m;
        o.textContent = m;
        sel.appendChild(o);
    });
}

function modelList() {
    var p = state.current;
    if (!p) return [];
    var sel = $("modelSelect");
    var arr = [];
    Array.prototype.forEach.call(sel.options, function (o) {
        if (o.value) arr.push(o.value);
    });
    return arr.length ? arr : (state.synced[p.id] || p.models || []);
}

/* 统一入口：给"不是用户在输入框里打字"的场景用
   （切服务商、同步模型、选下拉），会写回输入框。 */
function setModel(name, list) {
    $("modelBox").value = name || "";
    syncSelectToTyped(name || "");
    updateModelMeta();
    updatePreview();
}

/* 手填模型名时，只更新下拉的高亮，绝不回写输入框 ——
   否则 input 事件里改 input.value 会把光标顶到末尾，边打字边乱跳。 */
function syncSelectToTyped(name) {
    var sel = $("modelSelect");
    var hit = false;
    Array.prototype.forEach.call(sel.options, function (o) { if (o.value === name) hit = true; });
    if (hit) { sel.value = name; return; }
    // 不在列表里：加一个临时项并选中，但不碰输入框
    var tmp = null;
    Array.prototype.forEach.call(sel.options, function (o) {
        if (o.getAttribute("data-tmp") === "1") tmp = o;
    });
    if (!name) {
        if (tmp) tmp.remove();
        return;
    }
    if (!tmp) {
        tmp = document.createElement("option");
        tmp.setAttribute("data-tmp", "1");
        sel.appendChild(tmp);
    }
    tmp.value = name;
    tmp.textContent = name + "（手填）";
    sel.value = name;
}

function updateModelMeta() {
    var m = $("modelBox").value.trim();
    var known = modelList();
    $("modelCount").textContent = known.length ? ("共 " + known.length + " 个可选模型") : "未同步模型列表";
    $("modelType").textContent = modelType(m);
    $("btnSend").disabled = isImageModel(m);
}

/* ---------- 联网搜索：按服务商决定可用性与用法 ---------- */
var SEARCH_INFO = {
    online:  { ok: true,  tip: "OpenRouter：模型名自动加 :online 后缀，由平台联网检索。" },
    enable:  { ok: true,  tip: "通义千问：请求体加 enable_search:true，由百炼联网检索。" },
    builtin: { ok: true,  tip: "Moonshot：用内置 \$web_search 工具。官方已公告该方式 2026-10-20 下线，届时会失效。" },
    native:  { ok: true,  tip: "该服务商模型天生联网。" },
    openai:  { ok: false, tip: "OpenAI 官方接口不允许浏览器直连（跨域被拦），本页无法联网。" },
    null:    { ok: false, tip: "这家没有浏览器端可用的联网方式。" }
};

function refreshSearchUI() {
    var p = state.current;
    var key = p ? (p.search === null ? "null" : p.search) : "null";
    var info = SEARCH_INFO[key] || SEARCH_INFO["null"];
    // 已实测：只有这几家能跨域直连，其余即使有联网参数也用不了
    var reachable = { deepseek: 1, moonshot: 1, siliconflow: 1, openrouter: 1, qwen: 1 };
    var canUse = info.ok && !!reachable[p ? p.id : ""];
    var box = $("searchCheck");
    box.disabled = !canUse;
    if (!canUse) box.checked = false;
    box.dataset.mode = canUse ? key : "";
    $("searchHint").textContent = canUse
        ? info.tip
        : "不可用：" + (reachable[p ? p.id : ""] ? info.tip : "该服务商接口不允许浏览器跨域直连，本页发不出请求。");
}

/* ---------- 请求体预览（对应 UpdateRequestPreview） ---------- */
function buildRequestBody(protocol, newPrompt) {
    var conv = state.messages.map(function (m) { return { role: m.role, content: m.content }; });
    if (newPrompt) conv.push({ role: "user", content: newPrompt });

    var model = $("modelBox").value.trim();
    var stream = $("streamCheck").checked;
    var useSearch = $("searchCheck").checked && !$("searchCheck").disabled;
    var mode = $("searchCheck").dataset.mode;

    // 联网只在 chat 协议下做（本页支持的三种用法都是 chat 形态）
    if (useSearch && mode === "online") {
        model = model.replace(/:online$/, "") + ":online";
    }

    if (protocol === "responses") {
        var body = {
            model: model,
            input: conv,
            instructions: $("systemPromptBox").value,
            max_output_tokens: parseInt($("maxTokensBox").value, 10) || 4096,
            stream: stream,
            reasoning: { effort: $("reasoningBox").value }
        };
        if ($("reasoningBox").value === "none") {
            body.temperature = parseFloat($("temperatureBox").value) || 0;
        }
        return body;
    }

    var msgs = [];
    if ($("systemPromptBox").value.trim().length > 0) {
        msgs.push({ role: "system", content: $("systemPromptBox").value });
    }
    msgs = msgs.concat(conv);
    var out = {
        model: model,
        messages: msgs,
        temperature: parseFloat($("temperatureBox").value) || 0,
        max_tokens: parseInt($("maxTokensBox").value, 10) || 4096,
        stream: stream
    };

    if (useSearch) {
        if (mode === "enable") out.enable_search = true;                 // 通义千问
        if (mode === "builtin") {                                        // Moonshot
            out.tools = [{ type: "builtin_function", function: { name: "$web_search" } }];
        }
        if (mode === "native") out.search_mode = "auto";                 // Perplexity（本页用不到，保留）
    }
    return out;
}

function currentProtocol() {
    return $("protocolBox").value === "responses" ? "responses" : "chat";
}

function updatePreview() {
    try {
        $("paneReq").textContent = JSON.stringify(buildRequestBody(currentProtocol(), $("promptBox").value.trim() || null), null, 2);
    } catch (e) {
        $("paneReq").textContent = "(预览生成失败: " + e.message + ")";
    }
}

/* ---------- 对话渲染 ---------- */
function renderChat() {
    var box = $("paneChat");
    if (!state.messages.length) {
        box.innerHTML = '<div class="chat-empty">还没有对话。选好服务商、填上密钥，在下面输入内容发送。</div>';
        return;
    }
    box.innerHTML = state.messages.map(function (m) {
        var who = m.role === "user" ? "你" : (state.current ? state.current.name : "助手");
        var cites = "";
        if (m.cites && m.cites.length) {
            cites = '<div class="cites"><div class="cap">来源</div>' +
                m.cites.map(function (c) {
                    return '<a href="' + escapeHtml(c.url) + '" target="_blank" rel="noopener noreferrer">' +
                           escapeHtml(c.title || c.url) + '</a>';
                }).join("") + '</div>';
        }
        return '<div class="msg ' + (m.role === "user" ? "user" : "assistant") + '">' +
               '<div class="who">' + who + '</div>' +
               '<div class="txt">' + escapeHtml(m.content) + '</div>' + cites + '</div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
}

/* ---------- 同步模型（对应 SyncModelsAsync） ---------- */
async function syncModels() {
    var p = state.current;
    if (!p) return;
    var base = $("baseUrlBox").value.trim().replace(/\/+$/, "");
    if (!base) { setStatus("请先填写 Base URL", "err"); return; }
    if (p.key && !$("apiKeyBox").value.trim()) { setStatus("请先填 API Key", "err"); return; }

    setStatus("同步中", "busy");
    try {
        var headers = {};
        var k = $("apiKeyBox").value.trim();
        if (k) headers["Authorization"] = "Bearer " + k;
        var res = await fetch(base + "/models", { headers: headers });
        if (!res.ok) { setStatus("同步失败 HTTP " + res.status, "err"); return; }
        var json = await res.json();
        var src = json.data || json.models || [];
        var ids = [];
        src.forEach(function (it) {
            var id = typeof it === "string" ? it : (it.id || it.name || "");
            if (id.toLowerCase().indexOf("models/") === 0) id = id.slice(7);
            if (id && ids.indexOf(id) < 0) ids.push(id);
        });
        ids.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
        if (!ids.length) { setStatus("接口没返回模型", "err"); return; }

        // 记住这家同步回来的列表，切走再切回来还在
        state.synced[p.id] = ids;
        var keep = $("modelBox").value.trim();
        fillModelSelect(ids);
        // 尽量保留当前选中的模型；不在列表里就退回第一个
        setModel(ids.indexOf(keep) >= 0 ? keep : ids[0], ids);
        setStatus("已同步 " + ids.length + " 个模型");
        $("modelSelect").focus();
    } catch (e) {
        // 跨域被拦也会走到这里，要如实说明，不能说成"网络错误"
        setStatus("同步失败：" + (e.message || e), "err");
        $("paneRaw").textContent = "同步模型出错：\n" + (e && e.stack ? e.stack : e) +
            "\n\n若提示 Failed to fetch，多半是这个服务商不允许浏览器直接跨域访问。";
    }
}

/* ---------- 发送（对应 SendAsync / ReadStreamAsync） ---------- */
async function send() {
    var p = state.current;
    if (!p) return;
    var prompt = $("promptBox").value.trim();
    if (!prompt) return;

    var base = $("baseUrlBox").value.trim().replace(/\/+$/, "");
    var model = $("modelBox").value.trim();
    if (!base || !model) { setStatus("请填 Base URL 并选模型", "err"); return; }
    if (p.key && !$("apiKeyBox").value.trim()) { setStatus("请填 API Key", "err"); return; }
    if (isImageModel(model)) { setStatus("图像模型不支持对话接口", "err"); return; }

    var useSearch = $("searchCheck").checked && !$("searchCheck").disabled;
    var searchMode = useSearch ? $("searchCheck").dataset.mode : "";
    var protocol = currentProtocol();
    var endpoint = base + (protocol === "responses" ? "/responses" : "/chat/completions");

    // Moonshot 的 $web_search 要走 tool_calls 循环，单独一支
    if (useSearch && searchMode === "builtin") {
        return sendMoonshotWithSearch(prompt, endpoint, model, base);
    }

    var body = buildRequestBody(protocol, prompt);
    var reqJson = JSON.stringify(body);

    $("paneReq").textContent = JSON.stringify(body, null, 2);
    $("paneRaw").textContent = "";
    state.messages.push({ role: "user", content: prompt });
    renderChat();
    $("promptBox").value = "";

    var btn = $("btnSend");
    btn.textContent = "停止";
    btn.classList.add("stop");
    state.abort = new AbortController();
    setStatus(useSearch ? "请求中（联网）" : "请求中", "busy");

    var headers = { "Content-Type": "application/json" };
    var k = $("apiKeyBox").value.trim();
    if (k) headers["Authorization"] = "Bearer " + k;
    // 自定义 Headers 允许覆盖，对应 ApplyHeaders 里的 TryAddWithoutValidation
    var ch = $("customHeadersBox").value.trim();
    if (ch) {
        try {
            var extra = JSON.parse(ch);
            Object.keys(extra).forEach(function (key) { headers[key] = String(extra[key]); });
        } catch (e) {
            setStatus("自定义 Headers 不是合法 JSON", "err");
        }
    }

    var answer = "";
    try {
        var res = await fetch(endpoint, {
            method: "POST",
            headers: headers,
            body: reqJson,
            signal: state.abort.signal
        });

        if (!res.ok) {
            var fail = await res.text();
            $("paneRaw").textContent = fail;
            throw new Error("HTTP " + res.status + ": " + fail.slice(0, 400));
        }

        if ($("streamCheck").checked && res.body && res.body.getReader) {
            // 流式：逐行读 SSE，data: 开头的取 delta
            setStatus("接收中", "busy");
            state.messages.push({ role: "assistant", content: "" });
            renderChat();
            var lastTxt = $("paneChat").querySelectorAll(".msg.assistant .txt");
            var el = lastTxt[lastTxt.length - 1];
            var cites = [];

            var reader = res.body.getReader();
            var decoder = new TextDecoder("utf-8");
            var buf = "";
            while (true) {
                var r = await reader.read();
                if (r.done) break;
                buf += decoder.decode(r.value, { stream: true });
                var lines = buf.split("\n");
                buf = lines.pop();
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    $("paneRaw").textContent += line + "\n";
                    if (line.indexOf("data:") !== 0) continue;
                    var data = line.slice(5).trim();
                    if (!data || data === "[DONE]") continue;
                    var delta = extractDelta(data, protocol);
                    if (delta) {
                        answer += delta;
                        state.messages[state.messages.length - 1].content = answer;
                        if (el) { el.textContent = answer; $("paneChat").scrollTop = $("paneChat").scrollHeight; }
                    }
                    // OpenRouter 的来源在流里以 annotation 形式下发
                    collectCites(data, cites);
                }
            }
            if (cites.length) {
                state.messages[state.messages.length - 1].cites = dedupeCites(cites);
                renderChat();
            }
            if (!answer) {
                state.messages[state.messages.length - 1].content = "(流式响应里没有解析到文本，可切到「原始响应」看原文)";
                renderChat();
            }
            setStatus("完成");
        } else {
            var json = await res.json();
            $("paneRaw").textContent = JSON.stringify(json, null, 2);
            answer = extractText(json, protocol);
            var c2 = [];
            collectCites(JSON.stringify(json), c2);
            state.messages.push({
                role: "assistant",
                content: answer || "请求完成，但响应中没有可显示的文本。",
                cites: dedupeCites(c2)
            });
            renderChat();
            setStatus("完成");
        }
    } catch (e) {
        if (e && e.name === "AbortError") {
            setStatus("已停止");
        } else {
            setStatus("请求失败", "err");
            var tip = "";
            if (String(e.message).indexOf("Failed to fetch") >= 0) {
                tip = "\n\n这类报错常见于两种情况：\n" +
                      "1. 该服务商不允许浏览器跨域直连（OpenAI 的接口就是这样）；\n" +
                      "2. http 页面上请求 http 接口被浏览器拦（本地 Ollama 要注意）。\n" +
                      "这跟原生桌面版不同 —— 原生版没有跨域限制，网页版有这个先天限制。";
            }
            $("paneRaw").textContent = "请求出错：" + e.message + tip;
        }
    } finally {
        state.abort = null;
        btn.textContent = "发送";
        btn.classList.remove("stop");
        btn.disabled = isImageModel($("modelBox").value);
    }
}

/* ---------- Moonshot 的 $web_search：tool_calls 多轮循环 ----------
   流程（照官方文档）：声明 builtin_function $web_search →
   模型返回 finish_reason=tool_calls → 把 arguments 原样当作 tool 结果回传 →
   模型拿到搜索结果后给出最终回答。最多循环 5 轮，防止死转。 */
async function sendMoonshotWithSearch(prompt, endpoint, model, base) {
    var p = state.current;
    var btn = $("btnSend");
    state.abort = new AbortController();
    btn.textContent = "停止";
    btn.classList.add("stop");
    setStatus("请求中（联网）", "busy");

    $("paneReq").textContent = JSON.stringify({
        model: model,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "builtin_function", function: { name: "$web_search" } }]
    }, null, 2);
    $("paneRaw").textContent = "";

    state.messages.push({ role: "user", content: prompt });
    renderChat();
    $("promptBox").value = "";

    var headers = { "Content-Type": "application/json" };
    var k = $("apiKeyBox").value.trim();
    if (k) headers["Authorization"] = "Bearer " + k;

    // 组装对话：system + 历史 + 本次提问
    var conv = [];
    var sys = $("systemPromptBox").value.trim();
    if (sys) conv.push({ role: "system", content: sys });
    conv.push({ role: "user", content: prompt });

    var answer = "";
    try {
        for (var round = 0; round < 5; round++) {
            var body = {
                model: model,
                messages: conv,
                temperature: parseFloat($("temperatureBox").value) || 0,
                max_tokens: parseInt($("maxTokensBox").value, 10) || 4096,
                tools: [{ type: "builtin_function", function: { name: "$web_search" } }]
            };
            var res = await fetch(endpoint, {
                method: "POST", headers: headers,
                body: JSON.stringify(body), signal: state.abort.signal
            });
            var txt = await res.text();
            $("paneRaw").textContent += "\n--- 第 " + (round + 1) + " 轮 ---\n" + txt + "\n";
            if (!res.ok) throw new Error("HTTP " + res.status + ": " + txt.slice(0, 400));

            var json = JSON.parse(txt);
            var choice = (json.choices || [])[0];
            if (!choice) throw new Error("响应里没有 choices");

            if (choice.finish_reason === "tool_calls" && choice.message && choice.message.tool_calls) {
                conv.push(choice.message);
                choice.message.tool_calls.forEach(function (tc) {
                    var args = tc.function.arguments;
                    // 官方说明：把 arguments 原样回传，搜索由模型侧执行
                    conv.push({
                        role: "tool",
                        tool_call_id: tc.id,
                        name: tc.function.name,
                        content: typeof args === "string" ? args : JSON.stringify(args)
                    });
                });
                setStatus("联网检索中（第 " + (round + 2) + " 轮）", "busy");
                continue;
            }

            answer = String((choice.message || {}).content || "");
            break;
        }
        state.messages.push({
            role: "assistant",
            content: answer || "（联网流程结束，但没有取到文本，可切「原始响应」看每轮返回）"
        });
        renderChat();
        setStatus("完成");
    } catch (e) {
        if (e && e.name === "AbortError") {
            setStatus("已停止");
        } else {
            setStatus("请求失败", "err");
            $("paneRaw").textContent += "\n请求出错：" + e.message;
        }
    } finally {
        state.abort = null;
        btn.textContent = "发送";
        btn.classList.remove("stop");
        btn.disabled = isImageModel($("modelBox").value);
    }
}

/* 响应解析：与 C# 的 ExtractText / ExtractResponseOutput 同逻辑 */
function extractText(json, protocol) {
    if (protocol === "responses") {
        if (json.output_text) return String(json.output_text);
        var out = "";
        (json.output || []).forEach(function (item) {
            (item.content || []).forEach(function (part) {
                if (part.type === "output_text") out += String(part.text || "");
            });
        });
        return out;
    }
    var ch = json.choices || [];
    if (!ch.length) return "";
    return String((ch[0].message || {}).content || "");
}

function extractDelta(data, protocol) {
    var j;
    try { j = JSON.parse(data); } catch (e) { return ""; }
    if (protocol === "responses") {
        if (j.type === "response.output_text.delta") return String(j.delta || "");
        return "";
    }
    var ch = j.choices || [];
    if (!ch.length) return "";
    return String((ch[0].delta || {}).content || "");
}

/* ---------- 引用来源（OpenRouter 的 url_citation 注解） ---------- */
function collectCites(dataStr, out) {
    var j;
    try { j = JSON.parse(dataStr); } catch (e) { return; }
    var ch = j.choices || [];
    ch.forEach(function (c) {
        var ann = (c.message && c.message.annotations) || (c.delta && c.delta.annotations) || [];
        ann.forEach(function (a) {
            if (a.type === "url_citation" && a.url_citation && a.url_citation.url) {
                out.push({ url: a.url_citation.url, title: a.url_citation.title || a.url_citation.url });
            }
        });
    });
}
function dedupeCites(list) {
    var seen = {}, out = [];
    list.forEach(function (c) {
        if (!seen[c.url]) { seen[c.url] = 1; out.push(c); }
    });
    return out.slice(0, 8);
}

/* ---------- 提示词库 ---------- */
function renderTemplates(query) {
    var q = (query || "").trim().toLowerCase();
    var box = $("tplList");
    var list = TEMPLATES.filter(function (t) {
        if (!q) return true;
        return (t.t + t.d + t.c).toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) { box.innerHTML = '<div class="chat-empty">没有匹配的模板</div>'; return; }
    box.innerHTML = list.map(function (t, i) {
        return '<div class="tpl" data-i="' + TEMPLATES.indexOf(t) + '">' +
               '<span class="t">' + t.t + '</span><span class="c">' + t.c + '</span>' +
               '<div class="d">' + t.d + '</div></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".tpl"), function (el) {
        el.addEventListener("click", function () {
            var t = TEMPLATES[parseInt(el.getAttribute("data-i"), 10)];
            $("promptBox").value = t.x;
            $("tplModal").classList.remove("on");
            updatePreview();
            $("promptBox").focus();
        });
    });
}

/* ---------- 手机上：单列切换 ---------- */
function mobSwitch(col) {
    Array.prototype.forEach.call(document.querySelectorAll(".mob-tabbar button"), function (b) {
        b.classList.toggle("on", b.getAttribute("data-col") === col);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".body-row .col"), function (c) {
        c.classList.toggle("mob-show", c.getAttribute("data-col") === col);
    });
}

/* ---------- 密钥记住开关 ---------- */
// 注意：形参不能叫 state，会遮蔽上面那个全局 state 对象
//
// 这里曾经有个坑：开关打开时写成 state.keys = storeGet(...) || {}，
// 会把用户刚敲进去、还只在内存里的密钥直接抹掉（因为磁盘上还没有）。
// 所以「从磁盘读回」只在页面启动时做一次，切开关时只负责存/删。
function applyRemember(on, mergeFromStore) {
    var misc = storeGet(LS_MISC) || {};
    misc.remember = on;
    storeSet(LS_MISC, misc);

    if (on) {
        // 启动时才把磁盘里的合并进来（磁盘优先，避免空值覆盖已输入的）
        if (mergeFromStore) {
            var saved = storeGet(LS_KEY) || {};
            Object.keys(saved).forEach(function (k) {
                if (!state.keys[k]) state.keys[k] = saved[k];
            });
        }
        // 把当前已填的密钥立刻落盘，不然要等下一次按键才存
        persistKeys();
    } else {
        // 关掉就把磁盘上那份删掉，别留在那儿
        storeDel(LS_KEY);
    }
    $("keyHint").textContent = on
        ? "已开启：密钥存在本机浏览器（localStorage），换设备或清缓存后需重填。"
        : "不勾选时密钥只留在内存，刷新即清空。";
    $("statusbar").textContent = on
        ? "网页版 · 密钥存在本机浏览器，不会上传 · 请求由你的浏览器直连服务商"
        : "网页版 · 密钥只存在浏览器内存 · 请求由你的浏览器直连服务商";
}

function persistKeys() {
    if ($("rememberKey").checked) storeSet(LS_KEY, state.keys);
}

/* ---------- 绑定 ---------- */
$("btnSend").addEventListener("click", function () {
    if (state.abort) { state.abort.abort(); return; }   // 按钮变"停止"后点它就是中断
    send();
});
$("btnSync").addEventListener("click", syncModels);
$("btnNewChat").addEventListener("click", function () {
    state.messages = [];
    renderChat();
    setStatus("已新建会话");
    mobSwitch("center");
});
$("btnClear").addEventListener("click", function () {
    state.messages = [];
    renderChat();
    setStatus("已清空会话");
});
$("btnTpl").addEventListener("click", function () {
    renderTemplates("");
    $("tplSearch").value = "";
    $("tplModal").classList.add("on");
    $("tplSearch").focus();
});
$("tplClose").addEventListener("click", function () { $("tplModal").classList.remove("on"); });
$("tplModal").addEventListener("click", function (e) {
    if (e.target === $("tplModal")) $("tplModal").classList.remove("on");
});
$("tplSearch").addEventListener("input", function () { renderTemplates(this.value); });

document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("on"); });
        document.querySelectorAll(".pane").forEach(function (p) { p.classList.remove("on"); });
        tab.classList.add("on");
        $(tab.getAttribute("data-pane")).classList.add("on");
    });
});

// 手机端切换按钮
Array.prototype.forEach.call(document.querySelectorAll(".mob-tabbar button"), function (b) {
    b.addEventListener("click", function () { mobSwitch(b.getAttribute("data-col")); });
});

// 模型：下拉选 → 写回手填框；手填框改了 → 同步下拉
$("modelSelect").addEventListener("change", function () {
    setModel(this.value, modelList());
});
$("modelBox").addEventListener("input", function () {
    syncSelectToTyped(this.value.trim());
    updateModelMeta();
    updatePreview();
});

$("protocolBox").addEventListener("change", function () { refreshSearchUI(); updatePreview(); });
$("baseUrlBox").addEventListener("input", updatePreview);
$("systemPromptBox").addEventListener("input", updatePreview);
$("streamCheck").addEventListener("change", updatePreview);
$("reasoningBox").addEventListener("change", updatePreview);
$("customHeadersBox").addEventListener("input", updatePreview);
$("temperatureBox").addEventListener("input", updatePreview);
$("maxTokensBox").addEventListener("input", updatePreview);
$("promptBox").addEventListener("input", updatePreview);
$("searchCheck").addEventListener("change", updatePreview);
$("promptBox").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

// 密钥
$("apiKeyBox").addEventListener("input", function () {
    if (state.current) state.keys[state.current.id] = this.value;
    persistKeys();
    if (state.current && state.current.key) {
        setStatus(this.value.trim() ? "就绪" : "待填密钥", this.value.trim() ? "" : "busy");
    }
});
$("btnShowKey").addEventListener("click", function () {
    var box = $("apiKeyBox");
    var showing = box.type === "text";
    box.type = showing ? "password" : "text";
    this.textContent = showing ? "显示" : "隐藏";
});
$("rememberKey").addEventListener("change", function () {
    applyRemember(this.checked, false);
});

/* ---------- 启动 ---------- */
(function boot() {
    var misc = storeGet(LS_MISC) || {};
    $("rememberKey").checked = !!misc.remember;
    // 只有启动这一次才从磁盘把密钥读回来
    applyRemember(!!misc.remember, true);

    renderProviders();
    selectProvider("deepseek");
    renderChat();
    mobSwitch("center");
})();
</script>
