<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码工具 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub { color: #57606a; font-size: 16px; margin-bottom: 24px; }
    .back-link {
        display: inline-block; margin-bottom: 16px;
        color: #0969da; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .card {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        padding: 18px 20px;
        margin-bottom: 16px;
    }
    label.tag {
        display: block; font-size: 13px; font-weight: 600;
        color: #57606a; margin-bottom: 6px;
    }
    textarea, input[type="text"], select {
        width: 100%; font-family: inherit; font-size: 14px;
        padding: 8px 10px; border: 1px solid #d0d7de;
        background: #ffffff; color: #1e1e1e;
    }
    textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
    textarea:focus, input:focus, select:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
    .row > div { flex: 1 1 130px; }
    .btns { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
        font-family: inherit; font-size: 14px; font-weight: 500;
        padding: 8px 18px; border: 1px solid #d0d7de;
        background: rgba(246, 248, 250, 0.9); color: #1e1e1e; cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.primary { background: #2da44e; border-color: #2da44e; color: #ffffff; }
    button.primary:hover { background: #22863a; border-color: #22863a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .out {
        margin-top: 18px; display: flex; gap: 24px;
        align-items: flex-start; flex-wrap: wrap;
    }
    #qrbox {
        background: #ffffff; padding: 12px; border: 1px solid #d0d7de;
        line-height: 0; min-width: 140px; min-height: 140px;
        display: flex; align-items: center; justify-content: center;
    }
    #qrbox canvas, #qrbox img { display: block; }
    .meta { flex: 1 1 200px; font-size: 14px; color: #57606a; line-height: 1.9; }
    .meta b { color: #1e1e1e; }
    .err { color: #cf222e; font-weight: 500; }
    .ok { color: #1a7f37; }
    .footer {
        margin-top: 40px; text-align: center; font-size: 14px;
        color: #8b949e; border-top: 1px solid #d0d7de; padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .card { background: rgba(22, 27, 34, 0.85); border-color: #30363d; }
        label.tag { color: #8b949e; }
        textarea, input, select { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        button { background: rgba(28, 33, 40, 0.9); border-color: #30363d; color: #c9d1d9; }
        button:hover { background: #21262d; }
        button.primary { background: #238636; border-color: #238636; color: #ffffff; }
        #qrbox { background: #ffffff; border-color: #30363d; }
        .meta { color: #8b949e; }
        .meta b { color: #c9d1d9; }
        .err { color: #f85149; }
        .ok { color: #3fb950; }
        .footer { border-top-color: #30363d; }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    <h1>二维码工具</h1>
    <div class="sub">文本转二维码，本地生成，可存成 PNG</div>

    <div class="card">
        <label class="tag">内容</label>
        <textarea id="txt" placeholder="输入网址、文字等">https://www.4444442.xyz</textarea>

        <div class="row">
            <div>
                <label class="tag">纠错级别</label>
                <select id="ecc">
                    <option value="L">L 低 7%</option>
                    <option value="M">M 中 15%</option>
                    <option value="Q">Q 较高 25%</option>
                    <option value="H" selected>H 高 30%</option>
                </select>
            </div>
            <div>
                <label class="tag">尺寸（像素）</label>
                <select id="px">
                    <option value="160">160</option>
                    <option value="240">240</option>
                    <option value="320" selected>320</option>
                    <option value="480">480</option>
                    <option value="640">640</option>
                </select>
            </div>
            <div>
                <label class="tag">前景色</label>
                <input type="text" id="fg" value="#000000" style="font-family:ui-monospace,Consolas,monospace">
            </div>
            <div>
                <label class="tag">背景色</label>
                <input type="text" id="bg" value="#ffffff" style="font-family:ui-monospace,Consolas,monospace">
            </div>
        </div>

        <div class="btns">
            <button class="primary" id="gen">生成二维码</button>
            <button id="save">存为 PNG</button>
        </div>
    </div>

    <div class="out">
        <div id="qrbox"></div>
        <div class="meta" id="meta">
            <div>输入内容后点「生成二维码」。</div>
        </div>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function () {
    var box = document.getElementById('qrbox');
    var meta = document.getElementById('meta');
    var txt = document.getElementById('txt');
    var eccEl = document.getElementById('ecc');
    var pxEl = document.getElementById('px');
    var fgEl = document.getElementById('fg');
    var bgEl = document.getElementById('bg');
    var genBtn = document.getElementById('gen');
    var saveBtn = document.getElementById('save');
    var qr = null;

    function say(html, cls) {
        meta.innerHTML = '<div' + (cls ? ' class="' + cls + '"' : '') + '>' + html + '</div>';
    }

    if (typeof QRCode === 'undefined') {
        say('二维码库加载失败。<span class="err">本页依赖外部脚本，断网时打不开。</span>');
        genBtn.disabled = true; saveBtn.disabled = true;
        return;
    }

    var ECC = {
        L: QRCode.CorrectLevel.L,
        M: QRCode.CorrectLevel.M,
        Q: QRCode.CorrectLevel.Q,
        H: QRCode.CorrectLevel.H
    };

    function isHex(s) { return /^#[0-9a-fA-F]{6}$/.test(s) || /^#[0-9a-fA-F]{3}$/.test(s); }

    function generate() {
        var content = txt.value;
        if (!content) { say('<span class="err">内容不能为空。</span>'); box.innerHTML = ''; qr = null; return; }
        var size = parseInt(pxEl.value, 10);
        box.innerHTML = '';
        try {
            qr = new QRCode(box, {
                text: content,
                width: size,
                height: size,
                colorDark: isHex(fgEl.value) ? fgEl.value : '#000000',
                colorLight: isHex(bgEl.value) ? bgEl.value : '#ffffff',
                correctLevel: ECC[eccEl.value]
            });
        } catch (e) {
            say('<span class="err">生成失败：' + e.message + '</span>');
            qr = null;
            return;
        }
        var bytes = new TextEncoder().encode(content).length;
        var got = box.querySelector('canvas');
        say('<b>内容长度：</b>' + content.length + ' 字符 / ' + bytes + ' 字节<br>' +
            '<b>纠错级别：</b>' + eccEl.value + '<br>' +
            '<b>输出尺寸：</b>' + (got ? got.width + ' × ' + got.height : size + ' × ' + size) + ' px<br>' +
            '<span class="ok">生成成功</span>');
    }

    function pickCanvas() {
        var c = box.querySelector('canvas');
        if (c) return c;
        // 兜底：库可能输出 img，画到 canvas 上
        var img = box.querySelector('img');
        if (!img || !img.src) return null;
        var size = parseInt(pxEl.value, 10);
        var nc = document.createElement('canvas');
        nc.width = size; nc.height = size;
        var ctx = nc.getContext('2d');
        ctx.fillStyle = isHex(bgEl.value) ? bgEl.value : '#ffffff';
        ctx.fillRect(0, 0, size, size);
        try { ctx.drawImage(img, 0, 0, size, size); } catch (e) { return null; }
        return nc;
    }

    genBtn.addEventListener('click', generate);
    saveBtn.addEventListener('click', function () {
        var c = pickCanvas();
        if (!c) { say('<span class="err">还没有可保存的二维码，先生成一次。</span>'); return; }
        var a = document.createElement('a');
        a.download = 'qrcode.png';
        a.href = c.toDataURL('image/png');
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        say('<span class="ok">已触发下载 qrcode.png</span>');
    });

    var live = ['input', 'change'];
    live.forEach(function (ev) {
        txt.addEventListener(ev, generate);
        eccEl.addEventListener(ev, generate);
        pxEl.addEventListener(ev, generate);
        fgEl.addEventListener(ev, generate);
        bgEl.addEventListener(ev, generate);
    });

    generate();
})();
</script>
</body>
</html>
