<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }
    h1 {
        font-size: 30px; font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px; margin-bottom: 8px;
    }
    .sub { color: #57606a; font-size: 15px; margin-bottom: 22px; }
    .back-link {
        display: inline-block; margin-bottom: 16px;
        color: #0969da; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }

    .search-box {
        display: flex; gap: 10px; margin-bottom: 26px;
    }
    .search-box input {
        flex: 1; font: inherit; font-size: 14px;
        padding: 9px 12px; border: 1px solid #c6ccd4;
        border-radius: 0; background: rgba(255,255,255,0.9);
        color: #1e1e1e;
    }
    .search-box input:focus { outline: none; border-color: #0969da; }

    .grp-title {
        font-size: 16px; font-weight: 600;
        margin: 26px 0 10px; padding-left: 10px;
        border-left: 3px solid #0969da;
    }
    .site-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 8px;
    }
    .site {
        display: block; padding: 10px 12px;
        background: rgba(255,255,255,0.82);
        border: 1px solid #d0d7de;
        text-decoration: none; color: inherit;
    }
    .site:hover { background: rgba(246,248,250,0.95); }
    .site .n { font-size: 14px; font-weight: 500; color: #0969da; }
    .site .u { font-size: 11px; color: #8b949e; font-family: ui-monospace, Consolas, monospace;
               margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .g {
        display: none; font-size: 11px; color: #8b949e;
        font-family: ui-monospace, Consolas, monospace; margin-top: 3px;
    }
    body.no-favicon .site .g { display: block; }

    .empty-tip { color: #8b949e; font-size: 14px; padding: 20px 0; }
    .footer {
        margin-top: 40px; text-align: center; font-size: 13px;
        color: #8b949e; border-top: 1px solid #d0d7de; padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { filter: brightness(0.32); }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link, .site .n { color: #58a6ff; }
        .search-box input { background: #161b22; border-color: #30363d; color: #c9d1d9; }
        .site { background: rgba(22,27,34,0.85); border-color: #30363d; }
        .site:hover { background: rgba(28,33,40,0.95); }
        .footer { border-top-color: #30363d; }
    }
    @media (max-width: 600px) {
        .site-grid { grid-template-columns: 1fr; }
    }
</style>

function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
}

function render(kw) {
    kw = (kw || "").trim().toLowerCase();
    var wrap = document.getElementById("wrap");
    var html = "", shown = 0;

    GROUPS.forEach(function (g) {
        var hits = g.list.filter(function (s) {
            if (!kw) return true;
            return (s.n + " " + s.u).toLowerCase().indexOf(kw) >= 0;
        });
        if (!hits.length) return;
        shown += hits.length;
        html += '<div class="grp-title">' + esc(g.t) + ' <span style="font-weight:400;color:#8b949e;font-size:12px;">'
              + hits.length + '</span></div><div class="site-grid">';
        hits.forEach(function (s) {
            var host = "";
            try { host = new URL(s.u).hostname; } catch (e) { host = s.u; }
            html += '<a class="site" href="' + esc(s.u) + '" target="_blank" rel="noopener noreferrer">'
                  + '<div class="n">' + esc(s.n) + '</div>'
                  + '<div class="u">' + esc(host) + '</div>'
                  + '<div class="g">' + esc(s.u) + '</div>'
                  + '</a>';
        });
        html += '</div>';
    });

    wrap.innerHTML = html;
    document.getElementById("empty").style.display = shown ? "none" : "block";
}

document.getElementById("q").addEventListener("input", function () { render(this.value); });
