<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试台 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0; padding: 0;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed; inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    .page { max-width: 900px; margin: 0 auto; padding: 24px 20px 40px; }
    h1 {
        font-size: 26px; font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 10px; margin: 0 0 6px;
    }
    .sub { color: #57606a; font-size: 14px; margin-bottom: 16px; }
    .back-link {
        display: inline-block; margin-bottom: 12px;
        color: #0969da; text-decoration: none;
        font-weight: 500; font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    .toolbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        background: rgba(255,255,255,0.82);
        border: 1px solid #d0d7de;
        padding: 8px 10px; margin-bottom: 14px;
    }
    .tb-btn {
        font: inherit; font-size: 13px; color: #24292f;
        background: #f6f8fa; border: 1px solid #d0d7de;
        padding: 5px 12px; cursor: pointer;
    }
    .tb-btn:hover { background: #eef1f4; }
    .tb-btn.primary { background: #2da44e; border-color: #2da44e; color: #fff; }
    .tb-btn.primary:hover { background: #22863a; }
    .tb-spacer { flex: 1 1 auto; }
    .tb-note { font-size: 12px; color: #8b949e; font-family: monospace; }

    .card {
        background: rgba(255,255,255,0.9);
        border: 1px solid #d0d7de;
        margin-bottom: 14px;
    }
    .card > h2 {
        font-size: 15px; font-weight: 600;
        margin: 0; padding: 10px 14px;
        border-bottom: 1px solid #e1e4e8;
        background: rgba(246,248,250,0.9);
        color: #24292f;
    }
    .card .body { padding: 4px 0; }

    .kv {
        display: flex; gap: 10px;
        padding: 7px 14px;
        border-bottom: 1px solid #eef0f3;
        font-size: 13px;
        align-items: baseline;
    }
    .kv:last-child { border-bottom: none; }
    .kv .k {
        flex: 0 0 190px;
        color: #57606a;
        word-break: break-word;
    }
    .kv .v {
        flex: 1 1 auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
        color: #1e1e1e;
    }
    .v.ok  { color: #1a7f37; }
    .v.no  { color: #cf222e; }
    .v.warn { color: #bf8700; }
    .v.muted { color: #8b949e; }

    .badge {
        display: inline-block;
        font-size: 11px;
        font-family: monospace;
        padding: 1px 6px;
        border: 1px solid currentColor;
        margin-left: 6px;
        vertical-align: middle;
    }

    #liveBox { padding: 10px 14px; }
    #liveBox canvas { border: 1px solid #d0d7de; display: block; margin-top: 8px; background: #fff; }

    .log {
        max-height: 220px;
        overflow: auto;
        padding: 8px 14px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.7;
    }
    .log div { border-bottom: 1px dashed #eef0f3; padding: 2px 0; }
    .log .err { color: #cf222e; }
    .log .ok  { color: #1a7f37; }

    .netgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 1px; background: #e1e4e8; }
    .netcell { background: #fff; padding: 10px 12px; font-size: 13px; }
    .netcell .n { color: #57606a; font-size: 12px; word-break: break-all; }
    .netcell .s { font-family: monospace; font-weight: 600; margin-top: 3px; }

    .force-hint {
        margin: 10px 14px 0;
        padding: 10px 12px;
        border-left: 3px solid #bf8700;
        background: #fdf8ec;
        font-size: 12.5px;
        line-height: 1.8;
        color: #57606a;
    }
    .force-hint b { color: #bf8700; }
    .force-btns {
        padding: 12px 14px 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .fb {
        font-family: inherit;
        font-size: 13px;
        padding: 7px 14px;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        color: #1e1e1e;
        cursor: pointer;
        white-space: nowrap;
    }
    .fb:hover { background: #eef1f4; }
    .fb:disabled { opacity: 0.45; cursor: not-allowed; }
    .fb.good { border-color: #2da44e; color: #1a7f37; background: #eafaef; }
    .fb.bad  { border-color: #cf222e; color: #cf222e; background: #ffebe9; }
    .fb.warn { border-color: #bf8700; color: #bf8700; background: #fdf8ec; }
    .fb small { display: block; font-size: 11px; color: #8b949e; font-weight: normal; margin-top: 1px; }
    .fb.good small { color: #1a7f37; }
    .fb.bad small  { color: #cf222e; }
    .fb.warn small { color: #bf8700; }

    .footer {
        margin-top: 28px; text-align: center;
        font-size: 13px; color: #8b949e;
        border-top: 1px solid #d0d7de; padding-top: 14px;
    }
    .footer b { color: #cf222e; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .toolbar { background: rgba(22,27,34,0.85); border-color: #30363d; }
        .tb-btn { background: #21262d; border-color: #30363d; color: #c9d1d9; }
        .tb-btn:hover { background: #30363d; }
        .card { background: rgba(22,27,34,0.9); border-color: #30363d; }
        .card > h2 { background: rgba(13,17,23,0.6); border-bottom-color: #30363d; color: #c9d1d9; }
        .kv { border-bottom-color: #21262d; }
        .kv .k { color: #8b949e; }
        .kv .v { color: #c9d1d9; }
        .v.ok { color: #3fb950; }
        .v.no { color: #f85149; }
        .v.warn { color: #d29922; }
        .netgrid { background: #30363d; }
        .netcell { background: #161b22; }
        .netcell .n { color: #8b949e; }
        .force-hint { background: rgba(210, 153, 34, 0.08); border-left-color: #d29922; color: #8b949e; }
        .force-hint b { color: #d29922; }
        .fb { background: #161b22; border-color: #30363d; color: #c9d1d9; }
        .fb:hover { background: #21262d; }
        .fb.good { border-color: #238636; color: #3fb950; background: rgba(35, 134, 54, 0.15); }
        .fb.bad  { border-color: #da3633; color: #f85149; background: rgba(218, 54, 51, 0.15); }
        .fb.warn { border-color: #9e6a03; color: #d29922; background: rgba(210, 153, 34, 0.1); }
        .fb small { color: #8b949e; }
        .fb.good small { color: #3fb950; }
        .fb.bad small  { color: #f85149; }
        .fb.warn small { color: #d29922; }
        .log div { border-bottom-color: #21262d; }
        .log .err { color: #f85149; }
        .log .ok { color: #3fb950; }
        .footer { border-top-color: #30363d; }
        #liveBox canvas { background: #0d1117; border-color: #30363d; }
    }
</style>
</head>
<body>
<div class="page">
    <a href="../index.html" class="back-link">&larr; 返回主页</a>
    <h1>测试台</h1>
    <div class="sub">浏览器能力与环境检测 &mdash; 全部在本地运行，不上传任何数据</div>

    <div class="toolbar">
        <button type="button" class="tb-btn primary" id="btnRun">重新检测</button>
        <button type="button" class="tb-btn" id="btnCopy">复制结果</button>
        <span class="tb-spacer"></span>
        <span class="tb-note" id="runTime">—</span>
    </div>

    <div class="card">
        <h2>屏幕与窗口</h2>
        <div class="body" id="secScreen"></div>
    </div>

    <div class="card">
        <h2>浏览器与系统</h2>
        <div class="body" id="secBrowser"></div>
    </div>

    <div class="card">
        <h2>CPU 与内存</h2>
        <div class="body" id="secCpu"></div>
    </div>

    <div class="card">
        <h2>网络</h2>
        <div class="body" id="secNet"></div>
        <div class="netgrid" id="netGrid"></div>
    </div>

    <div class="card">
        <h2>图形与渲染</h2>
        <div class="body" id="secGfx"></div>
        <div id="liveBox"></div>
    </div>

    <div class="card">
        <h2>强制与受限能力</h2>
        <div class="body" id="secForce"></div>
        <div class="force-hint">
            下面这些绿色/红色的按钮会真的去调用一次对应的浏览器接口。
            <b>「接口存在」不等于「能成功」</b>——能不能成功取决于浏览器、是否 HTTPS、有没有用户点击、
            以及系统/显卡限制。点一下就知道你这台机器行不行。
        </div>
        <div class="force-btns" id="forceBtns"></div>
    </div>

    <div class="card">
        <h2>媒体能力</h2>
        <div class="body" id="secMedia"></div>
    </div>

    <div class="card">
        <h2>存储与权限</h2>
        <div class="body" id="secStore"></div>
    </div>

    <div class="card">
        <h2>实时状态</h2>
        <div class="body" id="secLive"></div>
    </div>

    <div class="card">
        <h2>检测日志</h2>
        <div class="log" id="logBox"></div>
    </div>

    <div class="footer">4444442.xyz · ZYHS &nbsp;|&nbsp; 若某项显示 <b>不支持</b>，多半是浏览器或本机限制，不代表网页出错</div>
</div>

<script>
(function () {
    "use strict";

    function $(id) { return document.getElementById(id); }

    function log(msg, cls) {
        var box = $("logBox");
        var d = document.createElement("div");
        d.className = cls || "";
        var t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        d.textContent = "[" + t + "] " + msg;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    function row(container, key, val, cls) {
        var d = document.createElement("div");
        d.className = "kv";
        var k = document.createElement("div");
        k.className = "k";
        k.textContent = key;
        var v = document.createElement("div");
        v.className = "v" + (cls ? " " + cls : "");
        v.textContent = (val === undefined || val === null || val === "") ? "—" : String(val);
        d.appendChild(k); d.appendChild(v);
        container.appendChild(d);
        return v;
    }

    function section(id) {
        var el = $(id);
        el.innerHTML = "";
        return el;
    }

    /* ============ 1. 屏幕与窗口 ============ */
    function testScreen() {
        var c = section("secScreen");
        var s = window.screen;
        row(c, "物理分辨率", s.width + " × " + s.height, "ok");
        row(c, "可用区域", s.availWidth + " × " + s.availHeight);
        row(c, "浏览器窗口内尺寸", window.innerWidth + " × " + window.innerHeight);
        row(c, "色彩深度", s.colorDepth + " 位");
        row(c, "像素比 DPR", window.devicePixelRatio || 1);
        row(c, "方向", (s.orientation ? s.orientation.type : "未知"));
        row(c, "页面缓冲尺寸", window.outerWidth + " × " + window.outerHeight);
        var zoom = Math.round((window.devicePixelRatio || 1) * 100);
        row(c, "推测缩放", zoom + "%");
        log("屏幕检测完成 " + s.width + "×" + s.height + " @" + (window.devicePixelRatio || 1) + "x", "ok");
    }

    /* ============ 2. 浏览器与系统 ============ */
    function testBrowser() {
        var c = section("secBrowser");
        var ua = navigator.userAgent;
        var uad = navigator.userAgentData;

        row(c, "User-Agent", ua);
        row(c, "平台 platform", navigator.platform || "—");
        row(c, "语言", navigator.language);
        row(c, "全部语言", (navigator.languages || []).join(", "));
        row(c, "时区", Intl.DateTimeFormat().resolvedOptions().timeZone || "—");
        row(c, "本地时间", new Date().toString());
        row(c, "UTC 偏移", "UTC" + (new Date().getTimezoneOffset() > 0 ? "-" : "+") +
            Math.abs(new Date().getTimezoneOffset() / 60));
        row(c, "在线状态", navigator.onLine ? "在线" : "离线", navigator.onLine ? "ok" : "no");
        row(c, "Cookie 可用", navigator.cookieEnabled ? "是" : "否", navigator.cookieEnabled ? "ok" : "no");
        row(c, "Do Not Track", navigator.doNotTrack || "未设置", "muted");

        if (uad) {
            row(c, "品牌", (uad.brands || []).map(function (b) {
                return b.brand + " " + b.version;
            }).join(" / "));
            row(c, "移动设备", uad.mobile ? "是" : "否");
            row(c, "平台(新版)", uad.platform || "—");
        } else {
            row(c, "User-Agent Client Hints", "不支持", "warn");
        }

        var uaMatch = ua.match(/Chrome\/(\d+)/) || ua.match(/Firefox\/(\d+)/) ||
                      ua.match(/Version\/(\d+).*Safari/);
        row(c, "内核版本推测", uaMatch ? uaMatch[1] : "无法识别");

        // Chrome 特有 API 探测
        row(c, "Chrome 扩展运行时", (typeof chrome !== "undefined" && chrome.runtime) ? "存在" : "无");
        row(c, "navigator.clipboard", navigator.clipboard ? "支持" : "不支持",
            navigator.clipboard ? "ok" : "no");
        row(c, "navigator.share", navigator.share ? "支持" : "不支持",
            navigator.share ? "ok" : "muted");
        row(c, "navigator.vibrate", navigator.vibrate ? "支持" : "不支持",
            navigator.vibrate ? "ok" : "muted");
        row(c, "navigator.geolocation", navigator.geolocation ? "支持" : "不支持",
            navigator.geolocation ? "ok" : "muted");
        row(c, "触摸支持", ("ontouchstart" in window) ? "是" : "否");
        row(c, "最大触摸点", navigator.maxTouchPoints || 0);
        log("浏览器检测完成", "ok");
    }

    /* ============ 3. CPU 与内存 ============ */
    function testCpu() {
        var c = section("secCpu");
        row(c, "逻辑核心数", navigator.hardwareConcurrency
            ? navigator.hardwareConcurrency + " 核" : "浏览器未提供", 
            navigator.hardwareConcurrency ? "ok" : "warn");

        if (navigator.deviceMemory) {
            row(c, "设备内存(近似)", navigator.deviceMemory + " GB", "ok");
        } else {
            row(c, "设备内存(近似)", "浏览器未提供", "warn");
        }

        if (performance.memory) {
            var m = performance.memory;
            row(c, "JS 堆上限", (m.jsHeapSizeLimit / 1048576).toFixed(1) + " MB");
            row(c, "已用堆", (m.usedJSHeapSize / 1048576).toFixed(1) + " MB");
            row(c, "分配总堆", (m.totalJSHeapSize / 1048576).toFixed(1) + " MB");
        } else {
            row(c, "性能内存 API", "不支持（Firefox/Safari 常见）", "warn");
        }

        // 简易 CPU 基准测试
        var t0 = performance.now();
        var acc = 0;
        for (var i = 0; i < 3000000; i++) { acc += i % 7; }
        var dt = performance.now() - t0;
        var ops = Math.round(3000000 / (dt / 1000));
        row(c, "整数运算基准", Math.round(ops / 1000) + " 千次/秒（耗时 " + dt.toFixed(1) + " ms）",
            dt < 30 ? "ok" : (dt < 80 ? "warn" : "no"));
        window.__bench = acc;

        var t1 = performance.now();
        var s = "";
        for (var j = 0; j < 60000; j++) { s += "x"; }
        var dt2 = performance.now() - t1;
        row(c, "字符串拼接基准", dt2.toFixed(1) + " ms", dt2 < 40 ? "ok" : "warn");
        window.__bench2 = s.length;

        log("CPU 基准: " + Math.round(ops / 1000) + "k ops/s, 拼接 " + dt2.toFixed(1) + "ms", "ok");
    }

    /* ============ 4. 网络 ============ */
    function testNet() {
        var c = section("secNet");
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

        if (conn) {
            row(c, "有效类型", conn.effectiveType || "—", "ok");
            row(c, "下行估算", conn.downlink ? conn.downlink + " Mbps" : "—");
            row(c, "往返延迟估算", conn.rtt !== undefined ? conn.rtt + " ms" : "—");
            row(c, "数据节省模式", conn.saveData ? "开启" : "关闭");
        } else {
            row(c, "Network Information API", "不支持", "warn");
        }

        row(c, "当前地址", window.location.href);
        row(c, "协议", window.location.protocol);
        row(c, "主机名", window.location.hostname);
        row(c, "端口", window.location.port || "(默认)");
        row(c, "来源 Origin", window.location.origin);
        row(c, "Referrer", document.referrer || "(直接访问)", "muted");
        row(c, "显示模式", window.matchMedia("(display-mode: standalone)").matches
            ? "独立应用" : "浏览器标签页");
        row(c, "安全上下文", window.isSecureContext ? "是 (HTTPS)" : "否 (HTTP)",
            window.isSecureContext ? "ok" : "warn");
        log("网络检测完成，在线=" + navigator.onLine, "ok");

        // 连通性探测
        var targets = [
            { n: "本站首页", u: "../index.html", m: "GET" },
            { n: "背景图 bg.png", u: "../bg.png", m: "GET" },
            { n: "小游戏索引", u: "../HTML/index.html", m: "GET" },
            { n: "点歌台", u: "../Music/index.html", m: "GET" },
            { n: "下载中心", u: "../Download/index.html", m: "GET" }
        ];
        var grid = $("netGrid");
        grid.innerHTML = "";
        targets.forEach(function (t) {
            var cell = document.createElement("div");
            cell.className = "netcell";
            var n = document.createElement("div");
            n.className = "n"; n.textContent = t.n;
            var s = document.createElement("div");
            s.className = "s"; s.textContent = "检测中…";
            cell.appendChild(n); cell.appendChild(s);
            grid.appendChild(cell);

            var start = performance.now();
            fetch(t.u, { method: t.m, cache: "no-store" })
                .then(function (r) {
                    var ms = Math.round(performance.now() - start);
                    s.textContent = r.status + " · " + ms + " ms";
                    s.style.color = r.ok ? "#1a7f37" : "#bf8700";
                    log(t.n + " → HTTP " + r.status + " (" + ms + "ms)", r.ok ? "ok" : "err");
                })
                .catch(function () {
                    var ms = Math.round(performance.now() - start);
                    s.textContent = "失败 · " + ms + " ms";
                    s.style.color = "#cf222e";
                    log(t.n + " → 请求失败（可能是本地打开或跨域限制）", "err");
                });
        });
    }

    /* ============ 5. 图形与渲染 ============ */
    function testGfx() {
        var c = section("secGfx");
        var box = $("liveBox");
        box.innerHTML = "";

        // WebGL1
        var gl = null, gl2 = null;
        var testCanvas = document.createElement("canvas");
        try { gl = testCanvas.getContext("webgl") || testCanvas.getContext("experimental-webgl"); }
        catch (e) { gl = null; }
        try { gl2 = testCanvas.getContext("webgl2"); } catch (e) { gl2 = null; }

        row(c, "WebGL 1.0", gl ? "支持" : "不支持", gl ? "ok" : "no");
        row(c, "WebGL 2.0", gl2 ? "支持" : "不支持", gl2 ? "ok" : "warn");

        // Canvas 2D
        var cv2 = document.createElement("canvas");
        var ctx2 = cv2.getContext("2d");
        row(c, "Canvas 2D", ctx2 ? "支持" : "不支持", ctx2 ? "ok" : "no");
        row(c, "离屏画布 OffscreenCanvas", typeof OffscreenCanvas !== "undefined" ? "支持" : "不支持",
            typeof OffscreenCanvas !== "undefined" ? "ok" : "warn");

        if (gl) {
            var dbg = gl.getExtension("WEBGL_debug_renderer_info");
            if (dbg) {
                row(c, "显卡型号 (GPU)", gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL), "ok");
                row(c, "显卡厂商", gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
            } else {
                row(c, "显卡信息", "驱动未暴露（隐私设置）", "warn");
            }
            row(c, "WebGL 版本字符串", gl.getParameter(gl.VERSION));
            row(c, "GLSL 版本", gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
            row(c, "最大纹理尺寸", gl.getParameter(gl.MAX_TEXTURE_SIZE) + " px");
            row(c, "最大顶点属性", gl.getParameter(gl.MAX_VERTEX_ATTRIBS));

            var exts = gl.getSupportedExtensions() || [];
            row(c, "扩展数量", exts.length + " 个", "ok");
            row(c, "常用扩展",
                ["OES_texture_float", "OES_element_index_uint", "WEBGL_depth_texture",
                 "EXT_texture_filter_anisotropic", "OES_standard_derivatives"]
                .map(function (n) { return n + (exts.indexOf(n) >= 0 ? " ✔" : " ✘"); }).join("  "));

            // 绘制一个测试三角形
            drawGLDemo(gl, box);
        } else {

    function drawGLDemo(gl, box) {
        var label = document.createElement("div");
        label.style.cssText = "font-size:12px;color:#8b949e;margin-top:6px;";
        label.textContent = "WebGL 实时渲染测试（转动三角）：";
        box.appendChild(label);

        var cv = document.createElement("canvas");
        cv.width = 220; cv.height = 140;
        box.appendChild(cv);
        var g = cv.getContext("webgl");
        if (!g) return;

        var vs = "attribute vec2 p; uniform float a; void main(){ float c=cos(a),s=sin(a);" +
                 " gl_Position=vec4(p.x*c-p.y*s, p.x*s+p.y*c, 0.0, 1.0); }";
        var fs = "precision mediump float; void main(){ gl_FragColor=vec4(0.0,0.41,0.85,1.0); }";
        function sh(type, src) {
            var s = g.createShader(type);
            g.shaderSource(s, src); g.compileShader(s); return s;
        }
        var prog = g.createProgram();
        g.attachShader(prog, sh(g.VERTEX_SHADER, vs));
        g.attachShader(prog, sh(g.FRAGMENT_SHADER, fs));
        g.linkProgram(prog); g.useProgram(prog);

        var buf = g.createBuffer();
        g.bindBuffer(g.ARRAY_BUFFER, buf);
        g.bufferData(g.ARRAY_BUFFER, new Float32Array([0,0.7, -0.7,-0.5, 0.7,-0.5]), g.STATIC_DRAW);
        var loc = g.getAttribLocation(prog, "p");
        g.enableVertexAttribArray(loc);
        g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
        var aLoc = g.getUniformLocation(prog, "a");

        var ang = 0, frames = 0;
        (function loop() {
            if (!document.body.contains(cv)) return;
            ang += 0.02;
            g.uniform1f(aLoc, ang);
            g.clearColor(0.96, 0.96, 0.96, 1.0);
            g.clear(g.COLOR_BUFFER_BIT);
            g.drawArrays(g.TRIANGLES, 0, 3);
            frames++;
            requestAnimationFrame(loop);
        })();
        window.__glFrames = 0;
        setInterval(function () { window.__glFrames = frames; }, 500);
    }

    function drawCanvasDemo(ctx, cv, box) {
        var label = document.createElement("div");
        label.style.cssText = "font-size:12px;color:#8b949e;margin-top:10px;";
        label.textContent = "Canvas 2D 渲染测试：";
        box.appendChild(label);
        cv.width = 320; cv.height = 110;
        cv.style.marginTop = "6px";
        box.appendChild(cv);

        var t0 = performance.now();
        // 渐变
        var grd = ctx.createLinearGradient(0, 0, 320, 110);
        grd.addColorStop(0, "#0969da");
        grd.addColorStop(1, "#2da44e");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 320, 110);
        // 文字
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px monospace";
        ctx.fillText("Canvas OK  " + new Date().toLocaleTimeString("zh-CN", { hour12: false }), 14, 34);
        // 图形
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var i = 0; i <= 320; i += 4) {
            var y = 80 + Math.sin(i / 22 + t0 / 400) * 16;
            if (i === 0) ctx.moveTo(i, y); else ctx.lineTo(i, y);
        }
        ctx.stroke();
        // 圆点
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        for (var k = 0; k < 60; k++) {
            ctx.fillRect(10 + k * 5, 56 + (k % 3) * 4, 2, 2);
        }

        // 测量 1000 次矩形绘制耗时
        var c2 = document.createElement("canvas");
        c2.width = 100; c2.height = 100;
        var g2 = c2.getContext("2d");
        var s = performance.now();
        for (var n = 0; n < 1000; n++) {
            g2.fillStyle = "hsl(" + (n % 360) + ",60%,50%)";
            g2.fillRect(0, 0, 12, 12);
        }
        var d = performance.now() - s;
        var sec = document.createElement("div");
        sec.style.cssText = "font-size:12px;color:#57606a;margin-top:6px;font-family:monospace;";
        sec.textContent = "1000 次矩形绘制耗时 " + d.toFixed(1) + " ms" +
                          (d < 30 ? "  ✔ 流畅" : (d < 100 ? "  尚可" : "  偏慢"));
        box.appendChild(sec);
    }

        var upRow = row(c, "页面已运行", "0 秒", "");

        var startT = performance.now();
        var frames = 0, lastT = startT, lastFrames = 0;
        var worst = 0;

        (function tick(now) {
            frames++;
            var delta = now - lastT;
            if (delta > worst && frames > 3) worst = delta;
            requestAnimationFrame(tick);
        })(startT);

        var es = 0;
        function measureEventLoop() {
            var t = performance.now();
            setTimeout(function () {
                es = performance.now() - t;
            }, 0);
        }

        setInterval(function () {
            var now = performance.now();
            var dt = (now - lastT) / 1000;
            var dFrames = frames - lastFrames;
            var fps = dt > 0 ? Math.round(dFrames / dt) : 0;
            fpsRow.textContent = fps + " FPS" + (fps >= 50 ? "（流畅）" : (fps >= 25 ? "（一般）" : "（卡顿）"));
            fpsRow.className = "v " + (fps >= 50 ? "ok" : (fps >= 25 ? "warn" : "no"));

            var jank = (fps > 0 && worst > 1000 / fps * 2);
            dropRow.textContent = jank ? ("最长单帧 " + worst.toFixed(0) + " ms（有卡顿）") : "无明显卡顿";
            dropRow.className = "v " + (jank ? "warn" : "ok");

            measureEventLoop();
            setTimeout(function () {
                var cls = es < 30 ? "ok" : (es < 120 ? "warn" : "no");
                idleRow.textContent = es.toFixed(1) + " ms" +
                    (es < 30 ? "（响应良好）" : (es < 120 ? "（略有阻塞）" : "（明显阻塞）"));
                idleRow.className = "v " + cls;
            }, 30);

            if (performance.memory) {
                var mb = performance.memory.usedJSHeapSize / 1048576;
                heapRow.textContent = mb.toFixed(1) + " MB";
                heapRow.className = "v " + (mb < 200 ? "ok" : (mb < 600 ? "warn" : "no"));
            } else {
                heapRow.textContent = "不支持";
                heapRow.className = "v muted";
            }

            upRow.textContent = ((now - startT) / 1000).toFixed(0) + " 秒";

            lastT = now; lastFrames = frames; worst = 0;
        }, 1000);
    }

    /* ============ 启动 ============ */
    function runAll() {
        $("logBox").innerHTML = "";
        log("开始检测…", "ok");
        var t0 = performance.now();
        try { testScreen(); }   catch (e) { log("屏幕检测出错: " + e.message, "err"); }
        try { testBrowser(); }  catch (e) { log("浏览器检测出错: " + e.message, "err"); }
        try { testCpu(); }      catch (e) { log("CPU 检测出错: " + e.message, "err"); }
        try { testNet(); }      catch (e) { log("网络检测出错: " + e.message, "err"); }
        try { testGfx(); }      catch (e) { log("图形检测出错: " + e.message, "err"); }
        try { testMedia(); }    catch (e) { log("媒体检测出错: " + e.message, "err"); }
        try { testForce(); }    catch (e) { log("强制能力检测出错: " + e.message, "err"); }
        try { testStore(); }    catch (e) { log("能力检测出错: " + e.message, "err"); }
        try { testLive(); }     catch (e) { log("实时检测出错: " + e.message, "err"); }
        var dt = Math.round(performance.now() - t0);
        $("runTime").textContent = "检测耗时 " + dt + " ms";
        log("全部检测完成，共 " + dt + " ms", "ok");
    }

    $("btnRun").addEventListener("click", runAll);

    $("btnCopy").addEventListener("click", function () {
        var lines = [];
        lines.push("=== 4444442.xyz 测试台报告 ===");
        lines.push("时间: " + new Date().toString());
        lines.push("URL: " + location.href);
        Array.prototype.forEach.call(document.querySelectorAll(".card"), function (card) {
            var title = card.querySelector("h2");
            lines.push("");
            lines.push("[" + title.textContent + "]");
            Array.prototype.forEach.call(card.querySelectorAll(".kv"), function (kv) {
                var k = kv.querySelector(".k").textContent;
                var v = kv.querySelector(".v").textContent;
                lines.push("  " + k + ": " + v);
            });
        });
        var txt = lines.join("\n");
        var done = function () {
            var btn = $("btnCopy");
            var old = btn.textContent;
            btn.textContent = "已复制";
            setTimeout(function () { btn.textContent = old; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopy(txt, done); });
        } else {
            fallbackCopy(txt, done);
        }
    });

    function fallbackCopy(txt, cb) {
        var ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        if (cb) cb();
    }

    window.addEventListener("error", function (e) {
        log("页面错误: " + e.message, "err");
    });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", runAll);
    } else {
        runAll();
    }
})();
</script>
</body>
</html>
