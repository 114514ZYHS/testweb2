<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub {
        color: #57606a;
        font-size: 16px;
        margin-bottom: 30px;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 16px;
        color: #0969da;
        text-decoration: none;
        font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .nav-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    .nav-item {
        display: block;
        background: #ffffff;
        border: 1px solid #d0d7de;
        padding: 16px 20px;
        text-decoration: none;
        color: #0969da;
        font-weight: 500;
        transition: background 0.15s;
        background: rgba(255, 255, 255, 0.82);
    }
    .nav-item:hover {
        background: #f6f8fa;
        background: rgba(246, 248, 250, 0.92);
    }
    .nav-item .desc {
        display: block;
        font-weight: normal;
        font-size: 14px;
        color: #57606a;
        margin-top: 4px;
    }
    .nav-item.wide { grid-column: 1 / -1; }
    .note {
        margin-top: 26px;
        padding: 14px 18px;
        border: 1px solid #d0d7de;
        border-left: 3px solid #bf8700;
        background: rgba(255, 255, 255, 0.82);
        font-size: 14px;
        line-height: 1.8;
        color: #57606a;
    }
    .note b { color: #bf8700; font-weight: 600; }
    .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 14px;
        color: #8b949e;
        border-top: 1px solid #d0d7de;
        padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .nav-item { background: #161b22; border-color: #30363d; color: #58a6ff; background: rgba(22, 27, 34, 0.85); }
        .nav-item:hover { background: #1c2128; background: rgba(28, 33, 40, 0.92); }
        .nav-item .desc { color: #8b949e; }
        .note { background: rgba(22, 27, 34, 0.85); border-color: #30363d; border-left-color: #d29922; color: #8b949e; }
        .note b { color: #d29922; }
        .footer { border-top-color: #30363d; color: #8b949e; }
    }
    @media (max-width: 500px) {
        .nav-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    <h1>工具箱</h1>
    <div class="sub">一些自己用的小工具 · 全部在浏览器本地运行</div>

    <div class="nav-grid">
        <a href="test.html" class="nav-item wide">
            浏览器测试台
            <span class="desc">检测浏览器能力与环境，含显卡、网络、性能、权限等 100 多项</span>
        </a>
        <a href="2fa.html" class="nav-item wide">
            F2A 验证器
            <span class="desc">谷歌两步验证码生成，密钥不上传，纯本地计算</span>
        </a>
    </div>

    <div class="note">
        <b>说明：</b>这两页都不会往服务器发送任何数据，可以放心使用。
        F2A 验证器依赖外部脚本库，<b>断网时打不开</b>；
        测试台的检测结果可以一键复制出来。
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>
</body>
</html>
