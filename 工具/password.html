<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - 工具箱 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }
    h1 {
        font-size: 30px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 6px;
    }
    .sub { color: #57606a; font-size: 15px; margin-bottom: 26px; }
    .back-link {
        display: inline-block;
        margin-bottom: 14px;
        color: #0969da;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    .card {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #d0d7de;
        padding: 18px 20px;
        margin-bottom: 14px;
    }
    .card h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 14px;
        color: #57606a;
        padding-bottom: 8px;
        border-bottom: 1px solid #e1e4e8;
    }

    .output-wrap { position: relative; }
    .output {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 20px;
        line-height: 1.5;
        padding: 16px 14px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        word-break: break-all;
        min-height: 64px;
        user-select: all;
        letter-spacing: 0.5px;
    }
    .output.empty { color: #8b949e; font-size: 15px; letter-spacing: 0; }

    .strength-bar {
        height: 6px;
        background: #e1e4e8;
        margin-top: 10px;
        display: flex;
    }
    .strength-bar span { flex: 1; }
    .strength-label {
        font-size: 13px;
        color: #57606a;
        margin-top: 7px;
        display: flex;
        justify-content: space-between;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
        font-size: 14px;
    }
    .row label { flex: 0 0 110px; color: #57606a; }
    .row input[type=range] { flex: 1; accent-color: #0969da; }
    .row .val {
        flex: 0 0 44px;
        text-align: right;
        font-family: monospace;
        font-weight: 600;
        color: #0969da;
    }
    .row input[type=text], .row input[type=number] {
        flex: 1;
        font: inherit;
        font-size: 14px;
        padding: 6px 9px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        color: inherit;
    }
    .row input:focus { outline: 2px solid #0969da; outline-offset: -1px; }

    .checks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 18px;
        font-size: 14px;
    }
    .checks label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: #24292f;
    }
    .checks input { accent-color: #0969da; cursor: pointer; }
    .checks .hint {
        color: #8b949e;
        font-size: 12px;
        font-family: monospace;
    }

    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn {
        font: inherit;
        font-size: 14px;
        color: #24292f;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        padding: 8px 18px;
        cursor: pointer;
    }
    .btn:hover { background: #eef1f4; }
    .btn.primary {
        background: #2da44e;
        border-color: #2da44e;
        color: #fff;
        font-weight: 500;
    }
    .btn.primary:hover { background: #22863a; }

    .batch {
        font-family: monospace;
        font-size: 14px;
        line-height: 2;
        padding: 12px 14px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        min-height: 60px;
        word-break: break-all;
    }
    .batch div { user-select: all; }

    .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 14px;
        color: #8b949e;
        border-top: 1px solid #d0d7de;
        padding-top: 16px;
    }
    .tip {
        font-size: 13px;
        color: #57606a;
        line-height: 1.8;
        margin-top: 10px;
    }
    .tip b { color: #bf8700; }

    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { filter: brightness(0.32); }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .card { background: rgba(22, 27, 34, 0.88); border-color: #30363d; }
        .card h2 { color: #8b949e; border-bottom-color: #30363d; }
        .output { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .output.empty { color: #8b949e; }
        .strength-bar { background: #30363d; }
        .strength-label { color: #8b949e; }
        .row label { color: #8b949e; }
        .row .val { color: #58a6ff; }
        .row input[type=text] { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .checks label { color: #c9d1d9; }
        .btn { background: #21262d; border-color: #30363d; color: #c9d1d9; }
        .btn:hover { background: #30363d; }
        .batch { background: #0d1117; border-color: #30363d; }
        .footer { border-top-color: #30363d; color: #8b949e; }
        .tip { color: #8b949e; }
    }
    @media (max-width: 560px) {
        .checks { grid-template-columns: 1fr; }
        .row label { flex: 0 0 84px; }
    }
</style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回工具箱</a>
    <h1>密码生成器</h1>
    <div class="sub">用浏览器的加密随机数生成，不联网、不留痕</div>

    <div class="card">
        <h2>生成结果</h2>
        <div class="output-wrap">
            <div class="output empty" id="out">点下面的按钮生成</div>
        </div>
        <div class="strength-bar" id="bar">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="strength-label">
            <span id="stext">强度：—</span>
            <span id="entropy">— 位熵</span>
        </div>
        <div class="btns" style="margin-top:14px;">
            <button type="button" class="btn primary" id="gen">生成密码</button>
            <button type="button" class="btn" id="copy">复制</button>
        </div>
    </div>

    <div class="card">
        <h2>选项</h2>
        <div class="row">
            <label>长度</label>
            <input type="range" id="len" min="4" max="128" value="20">
            <span class="val" id="lenVal">20</span>
        </div>
        <div class="checks">
            <label><input type="checkbox" id="cUpper" checked> 大写字母 <span class="hint">A-Z</span></label>
            <label><input type="checkbox" id="cLower" checked> 小写字母 <span class="hint">a-z</span></label>
            <label><input type="checkbox" id="cDigit" checked> 数字 <span class="hint">0-9</span></label>
            <label><input type="checkbox" id="cSymbol"> 符号 <span class="hint">!@#$%^&amp;*</span></label>
            <label><input type="checkbox" id="cNoAmbig"> 排除易混字符 <span class="hint">0O1lI</span></label>
            <label><input type="checkbox" id="cNoRepeat"> 不允许重复字符</label>
        </div>
        <div class="row" style="margin-top:14px;">
            <label>自定义字符</label>
            <input type="text" id="custom" placeholder="可选：追加自己想用的字符，如 中文或特殊符号">
        </div>
        <div class="tip">
            <b>提示：</b>「不允许重复字符」需要长度不超过可用字符数，否则会自动放宽限制。
        </div>
    </div>

    <div class="card">
        <h2>批量生成</h2>
        <div class="row">
            <label>数量</label>
            <input type="range" id="cnt" min="2" max="50" value="10">
            <span class="val" id="cntVal">10</span>
            <button type="button" class="btn" id="genBatch" style="flex:0 0 auto;">生成一批</button>
            <button type="button" class="btn" id="copyBatch" style="flex:0 0 auto;">复制全部</button>
        </div>
        <div class="batch" id="batchOut" style="color:#8b949e;">还没生成</div>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>

<script>
(function () {
    "use strict";

    var SETS = {
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lower: "abcdefghijklmnopqrstuvwxyz",
        digit: "0123456789",
        symbol: "!@#$%^&*()-_=+[]{};:,.<>/?"
    };
    var AMBIG = "0O1lI|`'\"";

    var $ = function (id) { return document.getElementById(id); };

    /* 加密级随机整数（不取模偏差） */
    function randInt(max) {
        if (max <= 0) return 0;
        if (!(window.crypto && crypto.getRandomValues)) {
            return Math.floor(Math.random() * max);   // 降级
        }
        var limit = Math.floor(4294967296 / max) * max;
        var arr = new Uint32Array(1);
        var v;
        do { crypto.getRandomValues(arr); v = arr[0]; } while (v >= limit);
        return v % max;
    }

    function buildPool() {
        var pool = "";
        if ($("cUpper").checked) pool += SETS.upper;
        if ($("cLower").checked) pool += SETS.lower;
        if ($("cDigit").checked) pool += SETS.digit;
        if ($("cSymbol").checked) pool += SETS.symbol;
        var custom = $("custom").value;
        if (custom) pool += custom;
        if ($("cNoAmbig").checked) {
            pool = pool.split("").filter(function (c) { return AMBIG.indexOf(c) < 0; }).join("");
        }
        // 去重
        var seen = {}, uniq = "";
        for (var i = 0; i < pool.length; i++) {
            if (!seen[pool[i]]) { seen[pool[i]] = 1; uniq += pool[i]; }
        }
        return uniq;
    }

    function generate() {
        var pool = buildPool();
        if (!pool.length) return { pw: "", err: "请至少勾选一种字符类型" };

        var len = parseInt($("len").value, 10);
        var noRepeat = $("cNoRepeat").checked;

        if (noRepeat && len > pool.length) {
            len = pool.length;   // 自动放宽
        }

        var out = "";
        if (noRepeat) {
            var avail = pool.split("");
            for (var i = 0; i < len; i++) {
                var idx = randInt(avail.length);
                out += avail[idx];
                avail.splice(idx, 1);
            }
        } else {
            for (var j = 0; j < len; j++) {
                out += pool[randInt(pool.length)];
            }
        }
        return { pw: out, poolSize: pool.length, len: len };
    }

    /* 熵 = 长度 × log2(字符集大小) */
    function entropyOf(len, poolSize) {
        if (!len || !poolSize) return 0;
        return Math.round(len * (Math.log(poolSize) / Math.LN2));
    }

    function strengthClass(bits) {
        if (bits >= 128) return { n: 4, text: "很强", color: "#1a7f37" };
        if (bits >= 80)  return { n: 3, text: "强",   color: "#2da44e" };
        if (bits >= 50)  return { n: 2, text: "中等", color: "#bf8700" };
        return { n: 1, text: "偏弱", color: "#cf222e" };
    }

    function paintStrength(bits) {
        var s = strengthClass(bits);
        var spans = $("bar").children;
        for (var i = 0; i < spans.length; i++) {
            spans[i].style.background = (i < s.n) ? s.color : "";
        }
        $("stext").textContent = "强度：" + s.text;
        $("stext").style.color = s.color;
        $("entropy").textContent = bits + " 位熵";
        $("entropy").style.color = "";
    }

    function doGenerate() {
        var r = generate();
        var out = $("out");
        if (r.err) {
            out.textContent = r.err;
            out.className = "output empty";
            paintStrength(0);
            return;
        }
        out.textContent = r.pw;
        out.className = "output";
        paintStrength(entropyOf(r.len, r.poolSize));
    }

    function doBatch() {
        var n = parseInt($("cnt").value, 10);
        var box = $("batchOut");
        var lines = [];
        for (var i = 0; i < n; i++) {
            var r = generate();
            if (r.err) { box.textContent = r.err; box.style.color = "#cf222e"; return; }
            lines.push(r.pw);
        }
        box.style.color = "";
        box.innerHTML = "";
        lines.forEach(function (l) {
            var d = document.createElement("div");
            d.textContent = l;
            box.appendChild(d);
        });
    }

    function copyText(txt, btn, okMsg) {
        var done = function () {
            var old = btn.textContent;
            btn.textContent = okMsg || "已复制";
            setTimeout(function () { btn.textContent = old; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done).catch(function () { fb(txt, done); });
        } else {
            fb(txt, done);
        }
    }
    function fb(txt, cb) {
        var ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        if (cb) cb();
    }

    $("gen").addEventListener("click", doGenerate);
    $("genBatch").addEventListener("click", doBatch);

    $("copy").addEventListener("click", function () {
        var t = $("out").textContent;
        if (!t || $("out").className.indexOf("empty") >= 0) return;
        copyText(t, this);
    });
    $("copyBatch").addEventListener("click", function () {
        var box = $("batchOut");
        var lines = Array.prototype.map.call(box.querySelectorAll("div"), function (d) { return d.textContent; });
        if (!lines.length) return;
        copyText(lines.join("\n"), this, "已复制全部");
    });

    $("len").addEventListener("input", function () {
        $("lenVal").textContent = this.value;
        if ($("out").className.indexOf("empty") < 0) doGenerate();
    });
    $("cnt").addEventListener("input", function () { $("cntVal").textContent = this.value; });

    ["cUpper", "cLower", "cDigit", "cSymbol", "cNoAmbig", "cNoRepeat"].forEach(function (id) {
        $(id).addEventListener("change", function () {
            if ($("out").className.indexOf("empty") < 0) doGenerate();
        });
    });
    $("custom").addEventListener("input", function () {
        if ($("out").className.indexOf("empty") < 0) doGenerate();
    });

    doGenerate();
})();
</script>
</body>
</html>
