<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格式化工具 - 工具箱 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 1000px;
        margin: 34px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        opacity: 0.5;
        z-index: -1;
        pointer-events: none;
    }
    h1 {
        font-size: 30px; font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px; margin-bottom: 6px;
    }
    .sub { color: #57606a; font-size: 15px; margin-bottom: 22px; }
    .back-link {
        display: inline-block; margin-bottom: 14px;
        color: #0969da; text-decoration: none;
        font-weight: 500; font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    .tabs { display: flex; gap: 0; margin-bottom: 0; }
    .tab {
        font: inherit; font-size: 14px;
        padding: 9px 20px;
        border: 1px solid #d0d7de;
        border-bottom: none;
        background: rgba(246, 248, 250, 0.9);
        color: #57606a;
        cursor: pointer;
        margin-right: -1px;
    }
    .tab.active {
        background: rgba(255, 255, 255, 0.94);
        color: #0969da;
        font-weight: 600;
        position: relative;
        z-index: 1;
    }

    .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #d0d7de;
        padding: 18px 20px;
        display: none;
    }
    .panel.active { display: block; }

    .io { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .io-col { display: flex; flex-direction: column; }
    .io-col label {
        font-size: 13px;
        color: #57606a;
        margin-bottom: 6px;
        font-weight: 500;
    }
    textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.6;
        padding: 11px 12px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        color: inherit;
        resize: vertical;
        min-height: 300px;
        width: 100%;
    }
    textarea:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    textarea[readonly] { background: #f6f8fa; }

    .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
    .btn {
        font: inherit; font-size: 13px;
        color: #24292f;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        padding: 7px 15px;
        cursor: pointer;
    }
    .btn:hover { background: #eef1f4; }
    .btn.primary { background: #2da44e; border-color: #2da44e; color: #fff; font-weight: 500; }
    .btn.primary:hover { background: #22863a; }
    .btn.danger { color: #cf222e; }

    .status {
        font-size: 13px;
        font-family: monospace;
        padding: 7px 12px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        margin-bottom: 12px;
        display: none;
    }
    .status.show { display: block; }
    .status.ok { border-left: 3px solid #2da44e; color: #1a7f37; }
    .status.err { border-left: 3px solid #cf222e; color: #cf222e; }

    .opts {
        display: flex; flex-wrap: wrap; gap: 8px 18px;
        font-size: 13px; margin-bottom: 14px; align-items: center;
    }
    .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #24292f; }
    .opts input[type=checkbox] { accent-color: #0969da; cursor: pointer; }
    .opts select {
        font: inherit; font-size: 13px;
        padding: 4px 7px; border: 1px solid #d0d7de;
        background: #fff; color: inherit;
    }

    .single-io { display: flex; flex-direction: column; gap: 12px; }
    .single-io textarea { min-height: 150px; }

    .time-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
    }
    .time-box {
        border: 1px solid #d0d7de;
        background: #ffffff;
        padding: 13px 15px;
    }
    .time-box .t {
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 7px;
    }
    .time-box .v {
        font-family: monospace;
        font-size: 19px;
        color: #0969da;
        word-break: break-all;
    }
    .time-box .v.sm { font-size: 15px; }

    .footer {
        margin-top: 28px; text-align: center;
        font-size: 14px; color: #8b949e;
        border-top: 1px solid #d0d7de; padding-top: 16px;
    }

    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { opacity: 0.3; }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .tab { background: #161b22; border-color: #30363d; color: #8b949e; }
        .tab.active { background: #0d1117; color: #58a6ff; }
        .panel { background: rgba(22, 27, 34, 0.9); border-color: #30363d; }
        .io-col label { color: #8b949e; }
        textarea { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        textarea[readonly] { background: #161b22; }
        .btn { background: #21262d; border-color: #30363d; color: #c9d1d9; }
        .btn:hover { background: #30363d; }
        .status { background: #0d1117; border-color: #30363d; }
        .status.ok { color: #3fb950; }
        .status.err { color: #f85149; }
        .opts label { color: #c9d1d9; }
        .opts select { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .time-box { background: #161b22; border-color: #30363d; }
        .time-box .v { color: #58a6ff; }
        .footer { border-top-color: #30363d; }
    }
    @media (max-width: 720px) {
        .io { grid-template-columns: 1fr; }
        textarea { min-height: 180px; }
    }
</style>
</head>
<body>
    <a href="index.html" class="back-link">← 返回工具箱</a>
    <h1>格式化工具</h1>
    <div class="sub">JSON 格式化 · Base64 编解码 · URL 编解码 · 时间戳转换</div>

    <div class="tabs">
        <button type="button" class="tab active" data-tab="json">JSON</button>
        <button type="button" class="tab" data-tab="b64">Base64</button>
        <button type="button" class="tab" data-tab="url">URL</button>
        <button type="button" class="tab" data-tab="time">时间戳</button>
    </div>

    <!-- ===================== JSON ===================== -->
    <div class="panel active" id="p-json">
        <div class="opts">
            <label><input type="checkbox" id="jSort" > 按键名排序</label>
            <label>缩进
                <select id="jIndent">
                    <option value="2" selected>2 空格</option>
                    <option value="4">4 空格</option>
                    <option value="1">1 空格</option>
                    <option value="0">压缩成一行</option>
                    <option value="\t">Tab</option>
                </select>
            </label>
        </div>
        <div class="status" id="jStatus"></div>
        <div class="btns">
            <button type="button" class="btn primary" id="jFormat">格式化</button>
            <button type="button" class="btn" id="jMinify">压缩</button>
            <button type="button" class="btn" id="jCopy">复制结果</button>
            <button type="button" class="btn" id="jClear">清空</button>
            <button type="button" class="btn" id="jSample">示例</button>
        </div>
        <div class="io">
            <div class="io-col">
                <label>输入（原始 JSON）</label>
                <textarea id="jIn" placeholder='{"name":"ZYHS","tools":["test","2fa"]}'></textarea>
            </div>
            <div class="io-col">
                <label>输出（格式化后）</label>
                <textarea id="jOut" readonly placeholder="结果会显示在这里"></textarea>
            </div>
        </div>
    </div>

    <!-- ===================== Base64 ===================== -->
    <div class="panel" id="p-b64">
        <div class="status" id="bStatus"></div>
        <div class="btns">
            <button type="button" class="btn primary" id="bEncode">编码 →</button>
            <button type="button" class="btn primary" id="bDecode">← 解码</button>
            <button type="button" class="btn" id="bCopy">复制结果</button>
            <button type="button" class="btn" id="bClear">清空</button>
        </div>
        <div class="io">
            <div class="io-col">
                <label>明文（支持中文）</label>
                <textarea id="bIn" placeholder="要编码的文字"></textarea>
            </div>
            <div class="io-col">
                <label>Base64</label>
                <textarea id="bOut" placeholder="编码结果 / 要解码的内容"></textarea>
            </div>
        </div>
    </div>

    <!-- ===================== URL ===================== -->
    <div class="panel" id="p-url">
        <div class="status" id="uStatus"></div>
        <div class="btns">
            <button type="button" class="btn primary" id="uEncode">编码 →</button>
            <button type="button" class="btn primary" id="uDecode">← 解码</button>
            <button type="button" class="btn" id="uCopy">复制结果</button>
            <button type="button" class="btn" id="uClear">清空</button>
        </div>
        <div class="io">
            <div class="io-col">
                <label>原文</label>
                <textarea id="uIn" placeholder="https://example.com/搜索?q=中文 参数"></textarea>
            </div>
            <div class="io-col">
                <label>编码后</label>
                <textarea id="uOut" placeholder="%E4%B8%AD%E6%96%87..."></textarea>
            </div>
        </div>
        <div class="opts" style="margin-top:12px;">
            <label><input type="checkbox" id="uComponent" checked> 用 encodeURIComponent（更彻底，推荐）</label>
        </div>
    </div>

    <!-- ===================== 时间戳 ===================== -->
    <div class="panel" id="p-time">
        <div class="status" id="tStatus"></div>
        <div class="time-grid" id="timeGrid">
            <div class="time-box">
                <div class="t">当前 Unix 秒</div>
                <div class="v" id="tNow">—</div>
            </div>
            <div class="time-box">
                <div class="t">当前 Unix 毫秒</div>
                <div class="v sm" id="tNowMs">—</div>
            </div>
            <div class="time-box">
                <div class="t">本地时间</div>
                <div class="v sm" id="tLocal">—</div>
            </div>
            <div class="time-box">
                <div class="t">UTC 时间</div>
                <div class="v sm" id="tUtc">—</div>
            </div>
        </div>
        <div class="btns">
            <button type="button" class="btn primary" id="tConv">转换</button>
            <button type="button" class="btn" id="tNowBtn">填入当前</button>
            <button type="button" class="btn" id="tCopy">复制结果</button>
            <button type="button" class="btn" id="tClear">清空</button>
        </div>
        <div class="io">
            <div class="io-col">
                <label>输入（时间戳 或 日期字符串，两种都认）</label>
                <textarea id="tIn" style="min-height:110px;" placeholder="1737000000&#10;或&#10;2026-09-14 12:34:56"></textarea>
            </div>
            <div class="io-col">
                <label>转换结果</label>
                <textarea id="tOut" readonly style="min-height:110px;" placeholder="结果显示在这里"></textarea>
            </div>
        </div>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>

<script>
(function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };

    /* ---------- 标签切换 ---------- */
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
        tab.addEventListener("click", function () {
            var name = tab.getAttribute("data-tab");
            Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
                t.classList.toggle("active", t === tab);
            });
            Array.prototype.forEach.call(document.querySelectorAll(".panel"), function (p) {
                p.classList.toggle("active", p.id === "p-" + name);
            });
        });
    });

    function setStatus(el, msg, cls) {
        el.textContent = msg;
        el.className = "status show " + (cls || "");
    }
    function hideStatus(el) { el.className = "status"; }

    function copyText(txt, btn, okMsg) {
        var done = function () {
            var old = btn.textContent;
            btn.textContent = okMsg || "已复制";
            setTimeout(function () { btn.textContent = old; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done).catch(function () { fb(txt, done); });
        } else { fb(txt, done); }
    }
    function fb(txt, cb) {
        var ta = document.createElement("textarea");
        ta.value = txt; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        if (cb) cb();
    }

    /* ---------- 按键名递归排序 ---------- */
    function sortDeep(v) {
        if (Array.isArray(v)) return v.map(sortDeep);
        if (v && typeof v === "object") {
            var out = {};
            Object.keys(v).sort().forEach(function (k) { out[k] = sortDeep(v[k]); });
            return out;
        }
        return v;
    }

    function indentStr() {
        var v = $("jIndent").value;
        if (v === "\\t") return "\t";
        var n = parseInt(v, 10);
        return n === 0 ? 0 : new Array(n + 1).join(" ");
    }

    /* ---------- JSON ---------- */
    function jsonFormat(minify) {
        var src = $("jIn").value.trim();
        if (!src) { setStatus($("jStatus"), "请输入 JSON 内容", "err"); return; }
        var data;
        try {
            data = JSON.parse(src);
        } catch (e) {
            var m = e.message;
            // 补充行号，方便定位
            var mm = /position (\d+)/.exec(m);
            if (mm) {
                var pos = parseInt(mm[1], 10);
                var line = src.slice(0, pos).split("\n").length;
                m += "（大约在第 " + line + " 行附近）";
            }
            setStatus($("jStatus"), "解析失败：" + m, "err");
            $("jOut").value = "";
            return;
        }
        if ($("jSort").checked) data = sortDeep(data);

        var out;
        if (minify) {
            out = JSON.stringify(data);
        } else {
            var ind = indentStr();
            out = JSON.stringify(data, null, ind === 0 ? 0 : ind);
        }
        $("jOut").value = out;

        var sizeIn = new Blob([src]).size;
        var sizeOut = new Blob([out]).size;
        var lines = out.split("\n").length;
        setStatus($("jStatus"),
            "✓ 解析成功 · 输入 " + sizeIn + " 字节 → 输出 " + sizeOut + " 字节 · " +
            lines + " 行" + (minify ? "（已压缩）" : ""), "ok");
    }

    $("jFormat").addEventListener("click", function () { jsonFormat(false); });
    $("jMinify").addEventListener("click", function () { jsonFormat(true); });
    $("jClear").addEventListener("click", function () {
        $("jIn").value = ""; $("jOut").value = ""; hideStatus($("jStatus"));
    });
    $("jCopy").addEventListener("click", function () {
        if (!$("jOut").value) return;
        copyText($("jOut").value, this);
    });
    $("jSample").addEventListener("click", function () {
        $("jIn").value = '{"site":"4444442.xyz","owner":"ZYHS","nav":[{"name":"小游戏合集","count":262},{"name":"工具箱","tools":3}],"online":true,"since":2026}';
        jsonFormat(false);
    });
    $("jIn").addEventListener("input", function () {
        if (this.value.trim()) jsonFormat(false); else hideStatus($("jStatus"));
    });

    /* ---------- Base64（支持中文） ---------- */
    function utf8ToB64(str) {
        var bytes = new TextEncoder().encode(str);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }
    function b64ToUtf8(b64) {
        var bin = atob(b64.replace(/\s+/g, ""));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
    }

    $("bEncode").addEventListener("click", function () {
        var s = $("bIn").value;
        if (!s) { setStatus($("bStatus"), "请先输入要编码的文字", "err"); return; }
        try {
            var r = utf8ToB64(s);
            $("bOut").value = r;
            setStatus($("bStatus"), "✓ 编码成功 · " + new Blob([s]).size + " 字节 → " + r.length + " 字符", "ok");
        } catch (e) {
            setStatus($("bStatus"), "编码失败：" + e.message, "err");
        }
    });

    $("bDecode").addEventListener("click", function () {
        // 优先解码「输出框」，如果输出框空就用输入框里的
        var src = ($("bOut").value || $("bIn").value).trim();
        if (!src) { setStatus($("bStatus"), "请把 Base64 贴到任一输入框", "err"); return; }
        try {
            var r = b64ToUtf8(src);
            $("bIn").value = r;
            setStatus($("bStatus"), "✓ 解码成功 · " + r.length + " 字符", "ok");
        } catch (e) {
            setStatus($("bStatus"), "解码失败：不是合法的 Base64，或不是 UTF-8 文本", "err");
        }
    });

    $("bClear").addEventListener("click", function () {
        $("bIn").value = ""; $("bOut").value = ""; hideStatus($("bStatus"));
    });
    $("bCopy").addEventListener("click", function () {
        var t = $("bOut").value || $("bIn").value;
        if (!t) return;
        copyText(t, this);
    });

    /* ---------- URL ---------- */
    $("uEncode").addEventListener("click", function () {
        var s = $("uIn").value;
        if (!s) { setStatus($("uStatus"), "请先输入要编码的内容", "err"); return; }
        try {
            var r = $("uComponent").checked ? encodeURIComponent(s) : encodeURI(s);
            $("uOut").value = r;
            setStatus($("uStatus"), "✓ 编码成功 · " + s.length + " 字符 → " + r.length + " 字符", "ok");
        } catch (e) {
            setStatus($("uStatus"), "编码失败：" + e.message, "err");
        }
    });
    $("uDecode").addEventListener("click", function () {
        var src = ($("uOut").value || $("uIn").value).trim();
        if (!src) { setStatus($("uStatus"), "请输入要解码的内容", "err"); return; }
        try {
            var r = decodeURIComponent(src);
            $("uIn").value = r;
            setStatus($("uStatus"), "✓ 解码成功 · " + r.length + " 字符", "ok");
        } catch (e) {
            setStatus($("uStatus"), "解码失败：含有不完整的转义序列，如 %E4 这种残缺编码", "err");
        }
    });
    $("uClear").addEventListener("click", function () {
        $("uIn").value = ""; $("uOut").value = ""; hideStatus($("uStatus"));
    });
    $("uCopy").addEventListener("click", function () {
        var t = $("uOut").value || $("uIn").value;
        if (!t) return;
        copyText(t, this);
    });

    /* ---------- 时间戳 ---------- */
    function pad(n, w) {
        var s = String(n);
        while (s.length < (w || 2)) s = "0" + s;
        return s;
    }
    function fmtLocal(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
               pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function fmtUtc(d) {
        return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " +
               pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()) + " UTC";
    }

    function tickNow() {
        var d = new Date();
        $("tNow").textContent = Math.floor(d.getTime() / 1000);
        $("tNowMs").textContent = d.getTime();
        $("tLocal").textContent = fmtLocal(d);
        $("tUtc").textContent = fmtUtc(d);
    }
    tickNow();
    setInterval(tickNow, 1000);

    $("tConv").addEventListener("click", function () {
        var s = $("tIn").value.trim();
        if (!s) { setStatus($("tStatus"), "请输入时间戳或日期字符串", "err"); return; }
        var d = null, note = "";

        if (/^-?\d+$/.test(s)) {
            var n = parseInt(s, 10);
            var abs = Math.abs(n);
            if (abs < 1e11) { d = new Date(n * 1000); note = "按秒解析"; }
            else { d = new Date(n); note = "按毫秒解析"; }
        } else {
            // 把 "2026-09-14 12:34:56" 里的空格换成 T，兼容性更好
            var norm = s.replace(/^(\d{4}-\d{2}-\d{2})\s+/, "$1T");
            d = new Date(norm);
            note = "按日期字符串解析（本机时区）";
        }

        if (!d || isNaN(d.getTime())) {
            setStatus($("tStatus"), "无法识别，请检查格式", "err");
            $("tOut").value = "";
            return;
        }

        var lines = [
            "解析方式：" + note,
            "",
            "Unix 秒：   " + Math.floor(d.getTime() / 1000),
            "Unix 毫秒： " + d.getTime(),
            "",
            "本地时间：  " + fmtLocal(d),
            "UTC 时间：  " + fmtUtc(d),
            "ISO 8601：  " + d.toISOString(),
            "",
            "相对现在：  " + relTime(d.getTime() - Date.now()),
            "星期：      " + ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()]
        ];
        $("tOut").value = lines.join("\n");
        setStatus($("tStatus"), "✓ 转换成功", "ok");
    });

    function relTime(ms) {
        var past = ms < 0;
        var a = Math.abs(ms) / 1000;
        var unit, val;
        if (a < 60) { unit = "秒"; val = Math.round(a); }
        else if (a < 3600) { unit = "分钟"; val = Math.round(a / 60); }
        else if (a < 86400) { unit = "小时"; val = Math.round(a / 3600); }
        else if (a < 2592000) { unit = "天"; val = Math.round(a / 86400); }
        else if (a < 31536000) { unit = "个月"; val = Math.round(a / 2592000); }
        else { unit = "年"; val = Math.round(a / 31536000); }
        return val + " " + unit + (past ? "前" : "后");
    }

    $("tNowBtn").addEventListener("click", function () {
        $("tIn").value = Math.floor(Date.now() / 1000);
        $("tConv").click();
    });
    $("tClear").addEventListener("click", function () {
        $("tIn").value = ""; $("tOut").value = ""; hideStatus($("tStatus"));
    });
    $("tCopy").addEventListener("click", function () {
        if (!$("tOut").value) return;
        copyText($("tOut").value, this);
    });

    $("jSample").click();
})();
</script>
</body>
</html>
