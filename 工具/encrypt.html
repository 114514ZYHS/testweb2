<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本加密 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }
    h1 {
        font-size: 32px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    .sub { color: #57606a; font-size: 16px; margin-bottom: 24px; }
    .back-link {
        display: inline-block; margin-bottom: 16px;
        color: #0969da; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    .tabs {
        display: flex; gap: 0; margin-bottom: 0;
        border-bottom: 1px solid #d0d7de;
    }
    .tab {
        padding: 9px 20px; font-size: 14px; font-weight: 500;
        background: transparent; border: 1px solid transparent;
        border-bottom: none; cursor: pointer; color: #57606a;
        font-family: inherit;
    }
    .tab:hover { color: #1e1e1e; }
    .tab.on {
        background: rgba(255, 255, 255, 0.82);
        border-color: #d0d7de; color: #1e1e1e;
        margin-bottom: -1px;
    }
    .card {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de; border-top: none;
        padding: 18px 20px; margin-bottom: 16px;
    }
    label.tag {
        display: block; font-size: 13px; font-weight: 600;
        color: #57606a; margin-bottom: 6px;
    }
    textarea, input[type="text"], input[type="password"], select {
        width: 100%; font-family: inherit; font-size: 14px;
        padding: 8px 10px; border: 1px solid #d0d7de;
        background: #ffffff; color: #1e1e1e;
    }
    textarea { min-height: 100px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
    textarea:focus, input:focus, select:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; align-items: flex-end; }
    .row > div { flex: 1 1 150px; }
    .btns { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
        font-family: inherit; font-size: 14px; font-weight: 500;
        padding: 8px 18px; border: 1px solid #d0d7de;
        background: rgba(246, 248, 250, 0.9); color: #1e1e1e; cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.primary { background: #2da44e; border-color: #2da44e; color: #ffffff; }
    button.primary:hover { background: #22863a; border-color: #22863a; }
    .status { margin-top: 12px; font-size: 14px; color: #57606a; min-height: 22px; }
    .status.err { color: #cf222e; font-weight: 500; }
    .status.ok { color: #1a7f37; }
    .hint { font-size: 13px; color: #8b949e; margin-top: 6px; line-height: 1.7; }
    .footer {
        margin-top: 40px; text-align: center; font-size: 14px;
        color: #8b949e; border-top: 1px solid #d0d7de; padding-top: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { filter: brightness(0.32); }
        h1 { border-bottom-color: #30363d; }
        .sub { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .tabs { border-bottom-color: #30363d; }
        .tab { color: #8b949e; }
        .tab:hover { color: #c9d1d9; }
        .tab.on { background: rgba(22, 27, 34, 0.85); border-color: #30363d; color: #c9d1d9; }
        .card { background: rgba(22, 27, 34, 0.85); border-color: #30363d; }
        label.tag { color: #8b949e; }
        textarea, input, select { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        button { background: rgba(28, 33, 40, 0.9); border-color: #30363d; color: #c9d1d9; }
        button:hover { background: #21262d; }
        button.primary { background: #238636; border-color: #238636; color: #ffffff; }
        .status { color: #8b949e; }
        .status.err { color: #f85149; }
        .status.ok { color: #3fb950; }
        .hint { color: #8b949e; }
        .footer { border-top-color: #30363d; }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回主页</a>
    <h1>文本加密</h1>
    <div class="sub">AES-256 加解密，密码只在本机参与运算</div>

    <div class="tabs">
        <button class="tab on" data-mode="enc">加密</button>
        <button class="tab" data-mode="dec">解密</button>
    </div>

    <div class="card">
        <label class="tag" id="inLabel">明文</label>
        <textarea id="input" placeholder="要加密的内容"></textarea>

        <div class="row">
            <div>
                <label class="tag">密码</label>
                <input type="password" id="pwd" placeholder="自行设定，务必记住">
            </div>
            <div>
                <label class="tag">输出编码</label>
                <select id="enc">
                    <option value="base64" selected>Base64</option>
                    <option value="hex">Hex</option>
                </select>
            </div>
        </div>

        <div class="btns">
            <button class="primary" id="run">加密</button>
            <button id="swap">结果转回输入框</button>
            <button id="clear">清空</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <div class="card">
        <label class="tag" id="outLabel">结果</label>
        <textarea id="output" readonly placeholder="结果显示在这里"></textarea>
        <div class="hint">
            加密用 AES-256-CBC，密钥由密码经 SHA-256 派生，随机 IV 会附在密文开头，所以同一段文字每次加密结果都不同——这是正常的。
        </div>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>

<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<script>
(function () {
    var mode = 'enc';
    var inputEl = document.getElementById('input');
    var outputEl = document.getElementById('output');
    var pwdEl = document.getElementById('pwd');
    var encEl = document.getElementById('enc');
    var statusEl = document.getElementById('status');
    var runBtn = document.getElementById('run');
    var inLabel = document.getElementById('inLabel');
    var outLabel = document.getElementById('outLabel');
    var tabs = document.querySelectorAll('.tab');

    function say(msg, cls) {
        statusEl.className = 'status' + (cls ? ' ' + cls : '');
        statusEl.textContent = msg;
    }

    if (typeof CryptoJS === 'undefined') {
        say('加密库加载失败。本页依赖外部脚本，断网时打不开。', 'err');
        runBtn.disabled = true;
        return;
    }

    function setMode(m) {
        mode = m;
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].className = 'tab' + (tabs[i].getAttribute('data-mode') === m ? ' on' : '');
        }
        if (m === 'enc') {
            inLabel.textContent = '明文';
            outLabel.textContent = '结果';
            inputEl.placeholder = '要加密的内容';
            outputEl.placeholder = '结果显示在这里';
            runBtn.textContent = '加密';
            document.title = '文本加密 - ZYHS';
        } else {
            inLabel.textContent = '密文';
            outLabel.textContent = '结果';
            inputEl.placeholder = '粘贴要解密的内容';
            outputEl.placeholder = '结果显示在这里';
            runBtn.textContent = '解密';
            document.title = '文本解密 - ZYHS';
        }
        outputEl.value = '';
        say('');
    }

    for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener('click', function () {
            setMode(this.getAttribute('data-mode'));
        });
    }

    function run() {
        var text = inputEl.value;
        var pwd = pwdEl.value;
        if (!text) { say(mode === 'enc' ? '请输入要加密的内容。' : '请输入要解密的内容。', 'err'); return; }
        if (!pwd) { say('请输入密码。', 'err'); return; }

        var key = CryptoJS.SHA256(pwd);
        try {
            if (mode === 'enc') {
                var iv = CryptoJS.lib.WordArray.random(16);
                var ct = CryptoJS.AES.encrypt(text, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                var out = iv.concat(ct.ciphertext);
                outputEl.value = encEl.value === 'hex' ? out.toString(CryptoJS.enc.Hex) : out.toString(CryptoJS.enc.Base64);
                say('加密完成，共 ' + outputEl.value.length + ' 个字符。', 'ok');
            } else {
                var raw = encEl.value === 'hex' ? CryptoJS.enc.Hex.parse(text.trim()) : CryptoJS.enc.Base64.parse(text.trim());
                if (raw.sigBytes <= 16) { say('密文长度不足，格式可能不对。', 'err'); return; }
                var iv2 = CryptoJS.lib.WordArray.create(raw.words.slice(0, 4), 16);
                var body = CryptoJS.lib.WordArray.create(raw.words.slice(4), raw.sigBytes - 16);
                var pt = CryptoJS.AES.decrypt({ ciphertext: body }, key, { iv: iv2, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                var s = pt.toString(CryptoJS.enc.Utf8);
                if (!s) { say('解密失败：密码不对，或者密文格式不对。', 'err'); outputEl.value = ''; return; }
                outputEl.value = s;
                say('解密完成。', 'ok');
            }
        } catch (e) {
            say('出错了：' + e.message, 'err');
        }
    }

    runBtn.addEventListener('click', run);
    document.getElementById('swap').addEventListener('click', function () {
        inputEl.value = outputEl.value;
        outputEl.value = '';
        say('已把结果放回输入框。', 'ok');
    });
    document.getElementById('clear').addEventListener('click', function () {
        inputEl.value = ''; outputEl.value = ''; say('');
    });

    setMode('enc');
})();
</script>
</body>
</html>
