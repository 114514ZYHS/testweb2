<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说阅读</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 14px 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }

    /* ============ 顶部控制条：所有控件集中在这一行 ============ */
    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 7px 0;
        background: #f7f8fa;
        border-bottom: 1px solid #d0d7de;
        font-size: 13px;
        color: #57606a;
    }
    .topbar .home {
        color: #0969da;
        text-decoration: none;
        font-size: 13px;
        white-space: nowrap;
    }
    .topbar .home:hover { text-decoration: underline; }
    .topbar .sep { color: #d0d7de; }
    .topbar label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    select, button {
        font: inherit;
        font-size: 12px;
        color: #24292f;
        background: transparent;
        border: 1px solid #c6ccd4;
        padding: 2px 6px;
        cursor: pointer;
        border-radius: 0;
    }
    select { padding: 2px 4px; }
    button:hover { background: #eaeef2; }
    button:disabled { color: #a8b0b8; cursor: default; background: transparent; }
    button.now { color: #0969da; border-color: #0969da; }

    /* 翻页条：顶部和底部各一条，样式一致 */
    .pager {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }
    .pager .info {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #57606a;
        white-space: nowrap;
        min-width: 92px;
    }
    .topbar .spacer { flex: 1 1 auto; }

    /* 书库下拉：藏在 select 里，不占地方 */
    #bookSel { max-width: 190px; }

    /* 章节跳转：只在认得出章节的书里显示，短篇自动隐藏 */
    #chapBar { display: none; }
    #chapSel {
        max-width: 200px;
        font-size: 12px;
    }
    #chapBar button { font-size: 12px; }

    /* ============ 正文区：没有框，尽可能占满 ============ */
    .reader {
        flex: 1 1 auto;
        padding: 16px 4px 4px;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    /* 正文底下垫一层不透明的底，保证在背景图上也能看清。
       它是铺满的、没有边框的，视觉上不算"框"。 */
    .reader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #f7f8fa;
        z-index: -1;
        pointer-events: none;
    }
    #content {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.9;
        color: #1e1e1e;
        margin: 0;
        flex: 1 1 auto;
        font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
        padding: 4px 16px 0;
    }

    /* 底部翻页条 */
    .pager.bottom {
        padding: 8px 0 4px;
        border-top: 1px solid #d0d7de;
        margin-top: 12px;
    }

    /* 进度条（细线，不算框） */
    .bar {
        height: 3px;
        background: #d0d7de;
        cursor: pointer;
        margin: 0;
    }
    .bar-fill { height: 100%; background: #0969da; width: 0; }

    .warn {
        font-size: 12px;
        color: #57606a;
        padding: 5px 0;
        border-bottom: 1px solid #d0d7de;
    }
    .warn.hide { display: none; }

    .footer {
        text-align: center;
        font-size: 12px;
        color: #8b949e;
        padding: 10px 0 0;
    }

    @media (max-width: 700px) {
        .topbar { font-size: 12px; gap: 5px 8px; }
        #bookSel { max-width: 140px; }
        .pager .info { min-width: 74px; }
    }

    /* ============ 夜间模式 ============ */
    body.night { background: #0d1117; color: #c9d1d9; }
    body.night::before { filter: brightness(0.22); }
    body.night .topbar { background: #0d1117; border-bottom-color: #30363d; color: #8b949e; }
    body.night .home { color: #58a6ff; }
    body.night .sep { color: #30363d; }
    body.night select, body.night button {
        background: transparent;
        border-color: #30363d;
        color: #c9d1d9;
    }
    body.night button:hover { background: #21262d; }
    body.night button.now { color: #58a6ff; border-color: #58a6ff; }
    body.night #content { color: #c9d1d9; }
    body.night .reader::before { background: #0d1117; }
    body.night .pager .info { color: #8b949e; }
    body.night .pager.bottom { border-top-color: #30363d; }
    body.night .bar { background: #30363d; }
    body.night .bar-fill { background: #58a6ff; }
    body.night .warn { color: #8b949e; border-bottom-color: #30363d; }
</style>
</head>
<body>

<!-- ===== 顶部：所有控件都在这一条里 ===== -->
<div class="topbar">
    <a href="../index.html" class="home">&larr; 主页</a>
    <span class="sep">|</span>

    <select id="bookSel" title="选择小说"></select>

    <span class="pager">
        <button type="button" id="tFirst">首页</button>
        <button type="button" id="tPrev">上一页</button>
        <span class="info" id="tInfo">—</span>
        <button type="button" id="tNext">下一页</button>
        <button type="button" id="tLast">末页</button>
    </span>

    <span class="sep">|</span>

    <span class="pager chap" id="chapBar">
        <button type="button" id="cPrev" title="上一章">上一章</button>
        <select id="chapSel" title="跳转章节"><option>（无章节）</option></select>
        <button type="button" id="cNext" title="下一章">下一章</button>
    </span>

    <span class="sep">|</span>

    <label>字号
        <select id="fontSize">
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="26">26</option>
            <option value="30">30</option>
            <option value="36">36</option>
        </select>
    </label>

    <label>字数
        <select id="perPage">
            <option value="100">100</option>
            <option value="250">250</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="5000">5000</option>
            <option value="10000">10000</option>
            <option value="999999">整章</option>
        </select>
    </label>

    <label>行距
        <select id="lineHeight">
            <option value="1.5">紧</option>
            <option value="1.8" selected>中</option>
            <option value="2.1">松</option>
        </select>
    </label>

    <button type="button" id="btnNight">夜间</button>
    <button type="button" id="btnLocal" title="打开电脑里的 txt 文件">本地</button>
    <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
</div>

<div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
<div class="warn hide" id="scanWarn"></div>

<!-- ===== 正文 ===== -->
<div class="reader">
    <pre id="content"></pre>

    <div class="pager bottom">
        <button type="button" id="bFirst">首页</button>
        <button type="button" id="bPrev">上一页</button>
        <span class="info" id="bInfo">—</span>
        <button type="button" id="bNext">下一页</button>
        <button type="button" id="bLast">末页</button>
        <span class="spacer" style="flex:1 1 auto;"></span>
        <span class="info" id="bProg"></span>
    </div>
</div>

<div class="footer">4444442.xyz · ZYHS</div>

<script>
/* =========================================================================
   小说阅读器
   -------------------------------------------------------------------------
   书库来源：同目录 books.json（由脚本生成），拿不到时回退内置书单。
   新增小说：把 txt 丢进 TXT/，重跑一次生成脚本（见维护手册 4.10 节）。

   阅读进度：按书名分别存，各篇互不影响。换每页字数时以"当前页中间位置"
   的字符偏移为锚点重新定位，避免跳页。
   ========================================================================= */

var FALLBACK_BOOKS = [
    { "file": "夜航（示例小说）.txt", "title": "夜航（示例小说）" },
    { "file": "桃花源记.txt", "title": "桃花源记" },
    { "file": "井（原创短篇）.txt", "title": "井（原创短篇）" },
    { "file": "API是什么（科普）.txt", "title": "API是什么（科普）" }
];

var state = {
    books: [], idx: -1, text: "",
    page: 0, font: 18, per: 1000, lh: 1.8, night: false,
    local: false,          /* 当前看的是不是本地文件 */
    chaps: []              /* 章节表：[{pos, num, title}]，短篇为空 */
};

var PROG_KEY = "novel.prog";        /* 阅读进度表：{ 书名: 字符偏移 } */

function $(id) { return document.getElementById(id); }
function encName(n) { return encodeURI(n); }

/* ---------- 书库 ---------- */
function loadBooks() {
    return fetch("books.json", { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .then(function (list) {
            if (!Array.isArray(list) || !list.length) throw new Error("清单为空");
            return list;
        })
        .catch(function (e) {
            var w = $("scanWarn");
            w.classList.remove("hide");
            w.textContent = "读取 books.json 失败（" + e.message +
                "），当前显示内置书单。本地双击打开时浏览器会拦截读取，放到网站上即正常。";
            return FALLBACK_BOOKS;
        });
}

/* ---------- 阅读进度：按书分别记 ---------- */
function readProg() {
    try { return JSON.parse(localStorage.getItem(PROG_KEY) || "{}"); }
    catch (e) { return {}; }
}
function progKey() {
    if (state.local) return "local:" + (state.localName || "");
    var b = state.books[state.idx];
    return b ? "book:" + b.file : "";
}
function saveProg() {
    var k = progKey();
    if (!k) return;
    var m = readProg();
    m[k] = state.text ? state.page * state.per : 0;
    try { localStorage.setItem(PROG_KEY, JSON.stringify(m)); } catch (e) {}
}
function loadProgFor(key) {
    var m = readProg();
    var off = m[key];
    if (typeof off !== "number" || off < 0) return 0;
    return Math.min(Math.floor(off / state.per), Math.max(0, totalPages() - 1));
}

function renderBookSelect() {
    var sel = $("bookSel");
    sel.innerHTML = "";
    if (!state.books.length) {
        var o = document.createElement("option");
        o.textContent = "（书库为空）";
        sel.appendChild(o);
        return;
    }
    state.books.forEach(function (b, i) {
        var o = document.createElement("option");
        o.value = String(i);
        o.textContent = b.title || b.file;
        sel.appendChild(o);
    });
    sel.value = String(Math.max(0, state.idx));
}

/* ---------- 打开 ---------- */
function openBook(i) {
    var b = state.books[i];
    if (!b) return;
    state.idx = i;
    state.local = false;
    state.localName = "";
    renderBookSelect();

    fetch(encName(b.file), { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
        })
        .then(function (t) {
            state.text = t.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
            scanChapters();
            state.page = loadProgFor("book:" + b.file);   /* 各篇分别接着上次看 */
            renderPage();
            try { localStorage.setItem("novel.last", b.file); } catch (e) {}
        })
        .catch(function (e) {
            state.text = "读取失败：" + e.message +
                "\n\n如果是本地双击打开的，浏览器会拦截读取同目录文件，放到网站上即可。";
            state.chaps = [];
            state.page = 0;
            renderPage();
        });
}

/* ---------- 打开本地文件 ---------- */
function openLocalFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
        state.text = String(fr.result).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
        state.local = true;
        state.localName = file.name;
        state.idx = -1;
        scanChapters();          /* 本地长篇一样能按章跳 */
        /* 下拉框里加/选中"本地"这一项 */
        var sel = $("bookSel");
        var o = document.getElementById("optLocal");
        if (!o) {
            o = document.createElement("option");
            o.id = "optLocal";
            sel.appendChild(o);
        }
        o.value = "__local__";
        o.textContent = "[本地] " + file.name;
        sel.value = "__local__";
        state.page = loadProgFor(progKey());
        renderPage();
    };
    fr.onerror = function () {
        state.text = "本地文件读取失败。";
        state.page = 0;
        renderPage();
    };
    fr.readAsText(file, "UTF-8");
}

/* ---------- 分页 ---------- */
function totalPages() {
    if (!state.text) return 1;
    return Math.max(1, Math.ceil(state.text.length / state.per));
}

/* ---------- 章节 ----------
   长篇（几百章）靠翻页根本没法用，所以要能按章跳。
   章节靠正则从正文里认，认不出就自动隐藏这组控件，短篇不受影响。

   源文件里的标题写法很不统一，下面三种都要认：
     1) "第99章 某标题"      阿拉伯数字 + 空格
     2) "第99章某标题"       阿拉伯数字，紧贴着
     3) "第一百二十三章 某标题"  中文数字（老书常见）
     4) "  12 第12章 某标题"   行首还有一个无关的序号，要忽略掉
   只认第一种的话，中文数字那本书会一章都认不出来。 */

/* 行首可选的裸序号，例如 " 12 第12章 xxx" 里的 "12 "，属于源文件杂质 */
var CHAP_LINE_RE = /^\s*(?:\d+\s+)?(第\s*[0-9一二三四五六七八九十百千零两]+\s*章[^\n]*)$/gm;
/* 不捕获章号数字本身，只取原文标题，避免中文数字还要转阿拉伯数字 */
var CHAP_RE = /^第\s*[0-9一二三四五六七八九十百千零两]+\s*章[\s\u3000]*(.*)$/;

function scanChapters() {
    state.chaps = [];
    if (!state.text) return;
    CHAP_LINE_RE.lastIndex = 0;
    var m;
    while ((m = CHAP_LINE_RE.exec(state.text)) !== null) {
        var line = m[1];
        var g = CHAP_RE.exec(line);
        if (!g) continue;
        /* 序号用「第几个被扫到」而不是章号本身：
           中文数字不必转换，且源文件偶尔跳号也不会让下拉框错位 */
        state.chaps.push({
            pos: m.index + m[0].indexOf(line),
            num: String(state.chaps.length + 1),
            title: g[1].trim(),
            label: line.trim()
        });
    }
}

function renderChapControls() {
    var bar = $("chapBar");
    var sel = $("chapSel");
    var has = state.chaps.length > 1;
    bar.style.display = has ? "flex" : "none";
    if (!has) return;

    // 只在章节列表变了的时候重建 option，避免每次翻页都重排
    if (sel.options.length !== state.chaps.length) {
        sel.innerHTML = "";
        state.chaps.forEach(function (c, i) {
            var o = document.createElement("option");
            o.value = String(i);
            /* 直接用原文标题行，不要自己拼「第N章」——
               中文数字的书拼出来会变成「第1章」和原文对不上 */
            o.textContent = c.label || ("第" + c.num + "章" + (c.title ? " " + c.title : ""));
            sel.appendChild(o);
        });
    }

    var ci = currentChapIndex();
    sel.value = String(ci < 0 ? 0 : ci);
    var isLastChap = ci >= state.chaps.length - 1;
    $("cPrev").disabled = ci <= 0;
    /* 末章且已到全文结尾时，才真正没有下一章可去 */
    $("cNext").disabled = ci < 0 || (isLastChap && state.page >= totalPages() - 1);
}

/* 当前读的是哪一章：取"这一页里出现过的最后一个章标题"。
   为什么要这样算：章标题常常落在某一页的中间（页边界和章边界不重合），
   这时候把这一页整页看成"新章节"更符合直觉——读者已经看见标题了。
   分页时不会把标题劈开（renderPage 会往后补到句读），所以一页里最多一个标题。 */
function currentChapIndex() {
    if (!state.chaps.length) return -1;
    var start = state.page * state.per;
    var end = start + state.per;               /* 本页覆盖的字符区间 */
    var lo = 0, hi = state.chaps.length - 1, ans = -1;
    /* 找最后一个 pos < end 的章节（即本页内出现过的） */
    while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        if (state.chaps[mid].pos < end) { ans = mid; lo = mid + 1; }
        else { hi = mid - 1; }
    }
    if (ans < 0) ans = 0;
    /* 再确认它确实在本页范围内（pos >= start 或者就是上一章延续下来） */
    return ans;
}

/* 把全文某个字符位置换算成「该位置所在的那一页」。
   不能直接用 Math.floor(pos / per)：renderPage 为了不在半句话里断开，
   会把每页结尾往后补到最近的句读，实际翻页位置比 per 要靠后。
   所以按「页首不超过 pos 的最后一页」来找，才不会偏一页。 */
function pageForPos(pos) {
    var total = totalPages();
    var lo = 0, hi = total - 1, ans = 0;
    while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        if (mid * state.per <= pos) { ans = mid; lo = mid + 1; }
        else { hi = mid - 1; }
    }
    return ans;
}

/* 「下一章」：跳到下一章标题所在的那一页。 */
function nextChapter() {
    var ci = currentChapIndex();
    if (ci < 0 || ci >= state.chaps.length - 1) return;
    state.page = pageForPos(state.chaps[ci + 1].pos);
    renderPage();
    saveProg();
    window.scrollTo(0, 0);
}

/* 「上一章」：如果在本章中间（标题已经翻过去了），先回本章开头；
   如果本页开头就在本章标题处，说明已经在章首，则退到上一章。 */
function prevChapter() {
    var ci = currentChapIndex();
    if (ci < 0) return;
    var thisPos = state.chaps[ci].pos;
    var pageStart = state.page * state.per;
    var atChapStart = pageStart <= thisPos;
    var target = atChapStart ? (ci > 0 ? state.chaps[ci - 1].pos : thisPos) : thisPos;
    state.page = pageForPos(target);
    renderPage();
    saveProg();
    window.scrollTo(0, 0);
}

/* 下拉框直接跳章：和「下一章」用同一套对齐规则，
   否则会出现「选了第 100 章，但页面上还是第 99 章的尾巴」。 */
function gotoChapter(i) {
    if (i < 0 || i >= state.chaps.length) return;
    state.page = pageForPos(state.chaps[i].pos);
    renderPage();
    saveProg();
    window.scrollTo(0, 0);
}

/* 当前页的中间位置对应全文第几个字符（换档位时用它当锚点）。
   注意不能用 per/2 硬算：最后一页往往不满，那算出来的位置会越过正文末尾。 */
function anchorOffset() {
    var start = state.page * state.per;
    var len = Math.min(state.per, Math.max(0, state.text.length - start));
    return start + Math.floor(len / 2);
}

function renderPage() {
    var total = totalPages();
    if (state.page >= total) state.page = total - 1;
    if (state.page < 0) state.page = 0;

    var start = state.page * state.per;
    var seg = state.text.substr(start, state.per);

    // 尽量不在半句话里断开
    if (state.page < total - 1 && seg.length === state.per && state.per < 999999) {
        var tail = state.text.substr(start + state.per, 80);
        var m = tail.match(/^[^\n]*[\n。！？…”」]/);
        if (m && m[0].length < 80) seg += m[0];
    }

    $("content").textContent = seg;

    var label = "第 " + (state.page + 1) + " / " + total + " 页";
    $("tInfo").textContent = label;
    $("bInfo").textContent = label;

    var pct = total <= 1 ? 100 : Math.round((state.page + 1) / total * 100);
    $("barFill").style.width = pct + "%";
    $("bProg").textContent = state.text.length.toLocaleString() + " 字 · " + pct + "%";

    var first = state.page === 0;
    var last = state.page >= total - 1;
    ["tFirst", "bFirst"].forEach(function (id) { $(id).disabled = first; });
    ["tPrev", "bPrev"].forEach(function (id) { $(id).disabled = first; });
    ["tNext", "bNext"].forEach(function (id) { $(id).disabled = last; });
    ["tLast", "bLast"].forEach(function (id) { $(id).disabled = last; });

    renderChapControls();
}

function go(p) {
    state.page = p;
    renderPage();
    saveProg();
    window.scrollTo(0, 0);
}

/* ---------- 设置 ---------- */
$("bookSel").addEventListener("change", function () {
    if (this.value === "__local__") return;      /* 本地项只能通过按钮进入 */
    openBook(parseInt(this.value, 10) || 0);
});
$("fontSize").addEventListener("change", function () {
    state.font = parseInt(this.value, 10) || 18;
    $("content").style.fontSize = state.font + "px";
    savePrefs();
});
$("perPage").addEventListener("change", function () {
    // 以"当前页中间"那个字的位置为锚点，换完档位后让这个字仍落在页中间附近，
    // 这样读完半页再换档位不会跳回去重看。
    var anchor = anchorOffset();
    state.per = parseInt(this.value, 10) || 1000;
    state.page = Math.min(Math.floor(anchor / state.per), Math.max(0, totalPages() - 1));
    renderPage();
    saveProg();
    savePrefs();
});
$("lineHeight").addEventListener("change", function () {
    state.lh = parseFloat(this.value) || 1.8;
    $("content").style.lineHeight = state.lh;
    savePrefs();
});

/* ---------- 本地文件 ---------- */
$("btnLocal").addEventListener("click", function () { $("fileInput").click(); });
$("fileInput").addEventListener("change", function () {
    if (this.files && this.files[0]) openLocalFile(this.files[0]);
    this.value = "";                             /* 允许重复选同一个文件 */
});

function setNight(on) {
    state.night = !!on;
    document.body.classList.toggle("night", state.night);
    $("btnNight").textContent = state.night ? "白天" : "夜间";
    savePrefs();
}
$("btnNight").addEventListener("click", function () { setNight(!state.night); });

/* ---------- 翻页按钮（上下两条同时绑） ---------- */
[["tFirst","bFirst",0], ["tLast","bLast",null]].forEach(function (trio) {
    trio.slice(0, 2).forEach(function (id) {
        $(id).addEventListener("click", function () {
            go(trio[2] === null ? totalPages() - 1 : trio[2]);
        });
    });
});
["tPrev", "bPrev"].forEach(function (id) {
    $(id).addEventListener("click", function () { go(state.page - 1); });
});
["tNext", "bNext"].forEach(function (id) {
    $(id).addEventListener("click", function () { go(state.page + 1); });
});

/* ---------- 章节跳转 ---------- */
$("cPrev").addEventListener("click", prevChapter);
$("cNext").addEventListener("click", nextChapter);
$("chapSel").addEventListener("change", function () {
    gotoChapter(parseInt(this.value, 10) || 0);
});
/* 键盘：左右方向键翻章（在有章节的书里） */
document.addEventListener("keydown", function (e) {
    if (!state.chaps.length) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "input" || tag === "textarea") return;
    if (e.key === "ArrowLeft") prevChapter();
    else if (e.key === "ArrowRight") nextChapter();
});
$("bar").addEventListener("click", function (ev) {
    var r = this.getBoundingClientRect();
    var pct = (ev.clientX - r.left) / r.width;
    go(Math.min(totalPages() - 1, Math.max(0, Math.floor(pct * totalPages()))));
});

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", function (ev) {
    var t = ev.target.tagName;
    if (t === "SELECT" || t === "INPUT") return;
    if (ev.key === "ArrowLeft") { go(state.page - 1); ev.preventDefault(); }
    else if (ev.key === "ArrowRight") { go(state.page + 1); ev.preventDefault(); }
    else if (ev.key === "Home") { go(0); ev.preventDefault(); }
    else if (ev.key === "End") { go(totalPages() - 1); ev.preventDefault(); }
});

/* ---------- 偏好 ---------- */
function savePrefs() {
    try {
        localStorage.setItem("novel.prefs", JSON.stringify({
            font: state.font, per: state.per, lh: state.lh, night: state.night
        }));
    } catch (e) {}
}
function loadPrefs() {
    var raw = null;
    try { raw = localStorage.getItem("novel.prefs"); } catch (e) {}
    if (!raw) return;
    try {
        var p = JSON.parse(raw);
        if (p.font) { state.font = p.font; $("fontSize").value = String(p.font); }
        if (p.per) { state.per = p.per; $("perPage").value = String(p.per); }
        if (p.lh) { state.lh = p.lh; $("lineHeight").value = String(p.lh); }
        if (p.night) setNight(true);
    } catch (e) {}
}

/* ---------- 启动 ---------- */
loadPrefs();
$("content").style.fontSize = state.font + "px";
$("content").style.lineHeight = state.lh;

loadBooks().then(function (list) {
    state.books = list;
    var last = null;
    try { last = localStorage.getItem("novel.last"); } catch (e) {}
    var i = 0;
    if (last) {
        for (var k = 0; k < list.length; k++) {
            if (list[k].file === last) { i = k; break; }
        }
    }
    state.idx = i;
    renderBookSelect();
    if (list.length) openBook(i);
});
</script>
</body>
</html>
