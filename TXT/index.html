<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说阅读</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 14px 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }

    /* ============ 顶部控制条：所有控件集中在这一行 ============ */
    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 7px 0;
        background: #f7f8fa;
        border-bottom: 1px solid #d0d7de;
        font-size: 13px;
        color: #57606a;
    }
    .topbar .home {
        color: #0969da;
        text-decoration: none;
        font-size: 13px;
        white-space: nowrap;
    }
    .topbar .home:hover { text-decoration: underline; }
    .topbar .sep { color: #d0d7de; }
    .topbar label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    select, button {
        font: inherit;
        font-size: 12px;
        color: #24292f;
        background: transparent;
        border: 1px solid #c6ccd4;
        padding: 2px 6px;
        cursor: pointer;
        border-radius: 0;
    }
    select { padding: 2px 4px; }
    button:hover { background: #eaeef2; }
    button:disabled { color: #a8b0b8; cursor: default; background: transparent; }
    button.now { color: #0969da; border-color: #0969da; }

    /* 翻页条：顶部和底部各一条，样式一致 */
    .pager {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }
    .pager .info {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #57606a;
        white-space: nowrap;
        min-width: 92px;
    }
    .topbar .spacer { flex: 1 1 auto; }

    /* 书库下拉：藏在 select 里，不占地方 */
    #bookSel { max-width: 190px; }

    /* ============ 正文区：没有框，尽可能占满 ============ */
    .reader {
        flex: 1 1 auto;
        padding: 16px 4px 4px;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    /* 正文底下垫一层不透明的底，保证在背景图上也能看清。
       它是铺满的、没有边框的，视觉上不算"框"。 */
    .reader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #f7f8fa;
        z-index: -1;
        pointer-events: none;
    }
    #content {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.9;
        color: #1e1e1e;
        margin: 0;
        flex: 1 1 auto;
        font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
        padding: 4px 16px 0;
    }

    /* 底部翻页条 */
    .pager.bottom {
        padding: 8px 0 4px;
        border-top: 1px solid #d0d7de;
        margin-top: 12px;
    }

    /* 进度条（细线，不算框） */
    .bar {
        height: 3px;
        background: #d0d7de;
        cursor: pointer;
        margin: 0;
    }
    .bar-fill { height: 100%; background: #0969da; width: 0; }

    .warn {
        font-size: 12px;
        color: #57606a;
        padding: 5px 0;
        border-bottom: 1px solid #d0d7de;
    }
    .warn.hide { display: none; }

    .footer {
        text-align: center;
        font-size: 12px;
        color: #8b949e;
        padding: 10px 0 0;
    }

    @media (max-width: 700px) {
        .topbar { font-size: 12px; gap: 5px 8px; }
        #bookSel { max-width: 140px; }
        .pager .info { min-width: 74px; }
    }

    /* ============ 夜间模式 ============ */
    body.night { background: #0d1117; color: #c9d1d9; }
    body.night::before { filter: brightness(0.22); }
    body.night .topbar { background: #0d1117; border-bottom-color: #30363d; color: #8b949e; }
    body.night .home { color: #58a6ff; }
    body.night .sep { color: #30363d; }
    body.night select, body.night button {
        background: transparent;
        border-color: #30363d;
        color: #c9d1d9;
    }
    body.night button:hover { background: #21262d; }
    body.night button.now { color: #58a6ff; border-color: #58a6ff; }
    body.night #content { color: #c9d1d9; }
    body.night .reader::before { background: #0d1117; }
    body.night .pager .info { color: #8b949e; }
    body.night .pager.bottom { border-top-color: #30363d; }
    body.night .bar { background: #30363d; }
    body.night .bar-fill { background: #58a6ff; }
    body.night .warn { color: #8b949e; border-bottom-color: #30363d; }
</style>
</head>
<body>

<!-- ===== 顶部：所有控件都在这一条里 ===== -->
<div class="topbar">
    <a href="../index.html" class="home">&larr; 主页</a>
    <span class="sep">|</span>

    <select id="bookSel" title="选择小说"></select>

    <span class="pager">
        <button type="button" id="tFirst">首页</button>
        <button type="button" id="tPrev">上一页</button>
        <span class="info" id="tInfo">—</span>
        <button type="button" id="tNext">下一页</button>
        <button type="button" id="tLast">末页</button>
    </span>

    <span class="sep">|</span>

    <label>字号
        <select id="fontSize">
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="26">26</option>
            <option value="30">30</option>
            <option value="36">36</option>
        </select>
    </label>

    <label>字数
        <select id="perPage">
            <option value="100">100</option>
            <option value="250">250</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="5000">5000</option>
            <option value="10000">10000</option>
            <option value="999999">整章</option>
        </select>
    </label>

    <label>行距
        <select id="lineHeight">
            <option value="1.5">紧</option>
            <option value="1.8" selected>中</option>
            <option value="2.1">松</option>
        </select>
    </label>

    <button type="button" id="btnNight">夜间</button>
</div>

<div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
<div class="warn hide" id="scanWarn"></div>

<!-- ===== 正文 ===== -->
<div class="reader">
    <pre id="content"></pre>

    <div class="pager bottom">
        <button type="button" id="bFirst">首页</button>
        <button type="button" id="bPrev">上一页</button>
        <span class="info" id="bInfo">—</span>
        <button type="button" id="bNext">下一页</button>
        <button type="button" id="bLast">末页</button>
        <span class="spacer" style="flex:1 1 auto;"></span>
        <span class="info" id="bProg"></span>
    </div>
</div>

<div class="footer">4444442.xyz · ZYHS</div>

<script>
/* =========================================================================
   小说阅读器（紧凑版）
   -------------------------------------------------------------------------
   书库来源：同目录 books.json（由脚本生成）。
   拿不到时回退内置示例书单，避免白屏。

   新增小说：把 txt 丢进 TXT/，再跑一次生成脚本（见维护手册 4.10 节）。
   ========================================================================= */

var FALLBACK_BOOKS = [
    { "file": "夜航（示例小说）.txt", "title": "夜航（示例小说）" },
    { "file": "桃花源记.txt", "title": "桃花源记" },
    { "file": "井（原创短篇）.txt", "title": "井（原创短篇）" },
    { "file": "API是什么（科普）.txt", "title": "API是什么（科普）" }
];

var state = {
    books: [], idx: -1, text: "",
    page: 0, font: 18, per: 1000, lh: 1.8, night: false
};

function $(id) { return document.getElementById(id); }
function encName(n) { return encodeURI(n); }

/* ---------- 书库 ---------- */
function loadBooks() {
    return fetch("books.json", { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .then(function (list) {
            if (!Array.isArray(list) || !list.length) throw new Error("清单为空");
            return list;
        })
        .catch(function (e) {
            var w = $("scanWarn");
            w.classList.remove("hide");
            w.textContent = "读取 books.json 失败（" + e.message +
                "），当前显示内置示例书单。本地双击打开时浏览器会拦截读取，放到网站上即正常。";
            return FALLBACK_BOOKS;
        });
}

function renderBookSelect() {
    var sel = $("bookSel");
    sel.innerHTML = "";
    if (!state.books.length) {
        var o = document.createElement("option");
        o.textContent = "（书库为空）";
        sel.appendChild(o);
        return;
    }
    state.books.forEach(function (b, i) {
        var o = document.createElement("option");
        o.value = String(i);
        o.textContent = b.title || b.file;
        sel.appendChild(o);
    });
    sel.value = String(Math.max(0, state.idx));
}

/* ---------- 打开 ---------- */
function openBook(i) {
    var b = state.books[i];
    if (!b) return;
    state.idx = i;
    state.page = 0;
    renderBookSelect();

    fetch(encName(b.file), { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
        })
        .then(function (t) {
            state.text = t.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
            renderPage();
            try { localStorage.setItem("novel.last", b.file); } catch (e) {}
        })
        .catch(function (e) {
            state.text = "读取失败：" + e.message +
                "\n\n如果是本地双击打开的，浏览器不允许读取同目录文件，这是安全限制。放到网站上访问即可。";
            renderPage();
        });
}

/* ---------- 分页 ---------- */
function totalPages() {
    if (!state.text) return 1;
    return Math.max(1, Math.ceil(state.text.length / state.per));
}

function renderPage() {
    var total = totalPages();
    if (state.page >= total) state.page = total - 1;
    if (state.page < 0) state.page = 0;

    var start = state.page * state.per;
    var seg = state.text.substr(start, state.per);

    // 尽量不在半句话里断开
    if (state.page < total - 1 && seg.length === state.per && state.per < 999999) {
        var tail = state.text.substr(start + state.per, 80);
        var m = tail.match(/^[^\n]*[\n。！？…”」]/);
        if (m && m[0].length < 80) seg += m[0];
    }

    $("content").textContent = seg;

    var label = "第 " + (state.page + 1) + " / " + total + " 页";
    $("tInfo").textContent = label;
    $("bInfo").textContent = label;

    var pct = total <= 1 ? 100 : Math.round((state.page + 1) / total * 100);
    $("barFill").style.width = pct + "%";
    $("bProg").textContent = state.text.length.toLocaleString() + " 字 · " + pct + "%";

    var first = state.page === 0;
    var last = state.page >= total - 1;
    ["tFirst", "bFirst"].forEach(function (id) { $(id).disabled = first; });
    ["tPrev", "bPrev"].forEach(function (id) { $(id).disabled = first; });
    ["tNext", "bNext"].forEach(function (id) { $(id).disabled = last; });
    ["tLast", "bLast"].forEach(function (id) { $(id).disabled = last; });
}

function go(p) {
    state.page = p;
    renderPage();
    window.scrollTo(0, 0);
}

/* ---------- 设置 ---------- */
$("bookSel").addEventListener("change", function () {
    openBook(parseInt(this.value, 10) || 0);
});
$("fontSize").addEventListener("change", function () {
    state.font = parseInt(this.value, 10) || 18;
    $("content").style.fontSize = state.font + "px";
    savePrefs();
});
$("perPage").addEventListener("change", function () {
    var oldTotal = totalPages();
    var ratio = oldTotal > 1 ? state.page / oldTotal : 0;
    state.per = parseInt(this.value, 10) || 1000;
    // 换了每页字数，按原进度比例定位，避免跳得太突然
    state.page = Math.min(Math.round(ratio * totalPages()), totalPages() - 1);
    renderPage();
    savePrefs();
});
$("lineHeight").addEventListener("change", function () {
    state.lh = parseFloat(this.value) || 1.8;
    $("content").style.lineHeight = state.lh;
    savePrefs();
});

function setNight(on) {
    state.night = !!on;
    document.body.classList.toggle("night", state.night);
    $("btnNight").textContent = state.night ? "白天" : "夜间";
    savePrefs();
}
$("btnNight").addEventListener("click", function () { setNight(!state.night); });

/* ---------- 翻页按钮（上下两条同时绑） ---------- */
[["tFirst","bFirst",0], ["tLast","bLast",null]].forEach(function (trio) {
    trio.slice(0, 2).forEach(function (id) {
        $(id).addEventListener("click", function () {
            go(trio[2] === null ? totalPages() - 1 : trio[2]);
        });
    });
});
["tPrev", "bPrev"].forEach(function (id) {
    $(id).addEventListener("click", function () { go(state.page - 1); });
});
["tNext", "bNext"].forEach(function (id) {
    $(id).addEventListener("click", function () { go(state.page + 1); });
});
$("bar").addEventListener("click", function (ev) {
    var r = this.getBoundingClientRect();
    var pct = (ev.clientX - r.left) / r.width;
    go(Math.min(totalPages() - 1, Math.max(0, Math.floor(pct * totalPages()))));
});

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", function (ev) {
    var t = ev.target.tagName;
    if (t === "SELECT" || t === "INPUT") return;
    if (ev.key === "ArrowLeft") { go(state.page - 1); ev.preventDefault(); }
    else if (ev.key === "ArrowRight") { go(state.page + 1); ev.preventDefault(); }
    else if (ev.key === "Home") { go(0); ev.preventDefault(); }
    else if (ev.key === "End") { go(totalPages() - 1); ev.preventDefault(); }
});

/* ---------- 偏好 ---------- */
function savePrefs() {
    try {
        localStorage.setItem("novel.prefs", JSON.stringify({
            font: state.font, per: state.per, lh: state.lh, night: state.night
        }));
    } catch (e) {}
}
function loadPrefs() {
    var raw = null;
    try { raw = localStorage.getItem("novel.prefs"); } catch (e) {}
    if (!raw) return;
    try {
        var p = JSON.parse(raw);
        if (p.font) { state.font = p.font; $("fontSize").value = String(p.font); }
        if (p.per) { state.per = p.per; $("perPage").value = String(p.per); }
        if (p.lh) { state.lh = p.lh; $("lineHeight").value = String(p.lh); }
        if (p.night) setNight(true);
    } catch (e) {}
}

/* ---------- 启动 ---------- */
loadPrefs();
$("content").style.fontSize = state.font + "px";
$("content").style.lineHeight = state.lh;

loadBooks().then(function (list) {
    state.books = list;
    var last = null;
    try { last = localStorage.getItem("novel.last"); } catch (e) {}
    var i = 0;
    if (last) {
        for (var k = 0; k < list.length; k++) {
            if (list[k].file === last) { i = k; break; }
        }
    }
    state.idx = i;
    renderBookSelect();
    if (list.length) openBook(i);
});
</script>
</body>
</html>
