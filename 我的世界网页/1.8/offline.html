<!DOCTYPE html>

<meta charset="UTF-8">

<title>我的世界 1.8.8 离线版 - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
        line-height: 1.8;
    }
    body::before {
        content: "";
        position: fixed; inset: 0;
        background: url("../../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1; z-index: -1; pointer-events: none;
        filter: brightness(0.42);
    }
    .back-link {
        display: inline-block; margin-bottom: 16px;
        color: #0969da; text-decoration: none;
        font-weight: 500; font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
    h1 {
        font-size: 26px; font-weight: 600;
        border-bottom: 2px solid #d0d7de; padding-bottom: 12px; margin-bottom: 8px;
    }
    .sub { color: #57606a; font-size: 15px; margin-bottom: 24px; }
    .panel {
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid #d0d7de; padding: 24px 26px;
    }
    .row {
        display: flex; justify-content: space-between;
        font-size: 14px; padding: 7px 0;
        border-bottom: 1px solid #e1e4e8;
    }
    .row:last-of-type { border-bottom: none; }
    .row .k { color: #57606a; }
    .row .v { font-family: ui-monospace, Consolas, monospace; }
    #bar-track {
        height: 22px; background: #eef1f4;
        border: 1px solid #d0d7de; margin: 16px 0 6px;

    }
    #bar {
        height: 100%; width: 0%; background: #0969da;

    }
    #status { font-size: 13.5px; color: #57606a; font-family: ui-monospace, Consolas, monospace; }
    #go {
        display: none; margin-top: 20px; padding: 12px 26px;

    }
    #go:hover { background: #0860ca; }
    .hint {
        font-size: 13.5px; color: #8b949e; margin-top: 14px; line-height: 1.75;
    }

    .footer {
        margin-top: 36px; text-align: center; font-size: 13px;

    }
    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }

        h1 { border-bottom-color: #30363d; }
        .back-link { color: #58a6ff; }
        .panel { background: rgba(22, 27, 34, 0.85); border-color: #30363d; }
        .row { border-bottom-color: #30363d; }
        .row .k { color: #8b949e; }
        #bar-track { background: #21262d; border-color: #30363d; }
        #bar { background: #58a6ff; }
        #status { color: #8b949e; }
        #go { background: #1f6feb; }
        #go:hover { background: #388bfd; }

    }
    @media (max-width: 640px) { .panel { padding: 18px 16px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<a href="../../launcher.html" class="back-link">← 返回版本选择</a>
<a href="../../../index.html" class="back-link" style="margin-left:18px;">主页</a>
<h1>我的世界 1.8.8 网页版</h1>
<div class="sub">PvP 手感最经典的一代。三个版本里功能、服务器资源和玩法模组都最丰富的一档。</div>
<div class="panel">
    <div class="row"><span class="k">版本</span><span class="v">1.8.8</span></div>
    <div class="row"><span class="k">客户端</span><span class="v">EaglercraftX u53</span></div>
    <div class="row"><span class="k">文件名</span><span class="v" id="mName">…</span></div>
    <div class="row"><span class="k">大小</span><span class="v" id="mSize">…</span></div>
    <div class="row"><span class="k">分片</span><span class="v" id="mCount">…</span></div>
    <div class="row"><span class="k">分片大小</span><span class="v" id="mChunk">…</span></div>
    <div id="bar-track"><div id="bar"></div></div>
    <div id="status">准备中…</div>
    <button id="go">开始游戏</button>
    <div class="hint">游戏文件是加载时从本站分片拼出来的，第一次进要等一会儿，之后浏览器会缓存。
    中途刷新页面可以重来。</div>
</div>
<script>
/* 从 parts/ 目录拉分片，在浏览器里拼成完整的游戏 HTML，再用 Blob URL 打开。
   不这么做的话就得把 152MB 的成品文件直接放仓库，那是不行的。 */
var MANIFEST = "../parts/manifest-mc18.json";
var BASE = MANIFEST.substring(0, MANIFEST.lastIndexOf("/") + 1);
var AUTO = false;

function $(id) { return document.getElementById(id); }

function human(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
}

async function sha256(buf) {
    var d = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(d))
        .map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}

async function load() {
    var st = $("status"), bar = $("bar");
    var m;
    try {
        var r = await fetch(MANIFEST, { cache: "no-store" });
        if (!r.ok) throw new Error("清单拉取失败 HTTP " + r.status);
        m = await r.json();
    } catch (e) {
        st.innerHTML = '<span class="err">读不到分片清单：</span>' + e.message +
            '<br>如果你是把单个文件下载到本地双击打开的，这个页面用不了，' +
            '请改用上面的离线版下载按钮。';
        return;
    }

    $("mName").textContent = m.name;
    $("mSize").textContent = human(m.size);
    $("mCount").textContent = m.parts.length + " 片";
    $("mChunk").textContent = human(m.chunkSize) + " / 片";

    var bufs = new Array(m.parts.length).fill(null);
    var done = 0, received = 0;
    var conc = m.concurrency || 4, next = 0;

    function tick() {
        var pct = (received / m.size * 100).toFixed(1);
        bar.style.width = pct + "%";
        st.textContent = "已加载 " + done + "/" + m.parts.length + " 片 · " +
            human(received) + " / " + human(m.size) + " · " + pct + "%";
    }
    st.textContent = "开始加载…";

    async function one(i) {
        var p = m.parts[i];
        var res = await fetch(BASE + p.name, { cache: "no-store" });
        if (!res.ok) throw new Error("分片 " + p.name + " HTTP " + res.status);
        var buf = await res.arrayBuffer();
        if (p.sha256) {
            var h = await sha256(buf);
            if (h !== p.sha256) throw new Error("分片 " + p.name + " 校验不通过");
        }
        bufs[i] = buf; received += buf.byteLength; done++; tick();
    }

    async function worker() {
        while (next < m.parts.length) {
            var i = next++;
            var attempt = 0;
            for (;;) {
                try { await one(i); break; }
                catch (e) {
                    if (++attempt >= 4) throw e;
                    await new Promise(function (z) { setTimeout(z, 600); });
                }
            }
        }
    }

    try {
        var ws = [];
        for (var i = 0; i < conc; i++) ws.push(worker());
        await Promise.all(ws);
    } catch (e) {
        st.innerHTML = '<span class="err">加载失败：</span>' + e.message +
            '<br>刷新页面可以重试。';
        bar.style.background = "#cf222e";
        return;
    }

    var blob = new Blob(bufs, { type: "text/html" });
    var url = URL.createObjectURL(blob);
    window.__gameUrl = url;
    received = m.size; tick();
    st.textContent = "加载完成，共 " + human(m.size) + "。";

    if (AUTO) {
        location.replace(url);
    } else {
        var b = $("go");
        b.style.display = "inline-block";
        b.onclick = function () { location.replace(url); };
        st.textContent = "加载完成。" + (m.size > 5e7 ? "这么大的文件在浏览器里跑，第一次可能要等几秒。" : "");
    }
}

window.addEventListener("load", load);
</script></body>
</html>
