<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download - ZYHS</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #f0f2f5;
        color: #1e1e1e;
        position: relative;
        min-height: 100vh;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../bg.png") center center / cover no-repeat;
        background-color: #000000;
        opacity: 1;
        z-index: -1;
        pointer-events: none;
        filter: brightness(0.42);
    }
    .page {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px 20px 40px;
    }
    h1 {
        font-size: 26px;
        font-weight: 600;
        border-bottom: 2px solid #d0d7de;
        padding-bottom: 10px;
        margin: 0 0 6px;
    }
    .sub {
        color: #57606a;
        font-size: 14px;
        margin-bottom: 16px;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 12px;
        color: #0969da;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    /* ---------- 工具栏 ---------- */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-bottom: none;
        padding: 8px 10px;
    }
    .tb-btn {
        font: inherit;
        font-size: 13px;
        color: #24292f;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        padding: 5px 12px;
        cursor: pointer;
        user-select: none;
    }
    .tb-btn:hover { background: #eef1f4; }
    .tb-btn.active {
        background: #0969da;
        border-color: #0969da;
        color: #ffffff;
    }
    .tb-sep {
        width: 1px;
        align-self: stretch;
        background: #d0d7de;
        margin: 2px 2px;
    }
    .tb-spacer { flex: 1 1 auto; }
    .search-box {
        font: inherit;
        font-size: 13px;
        padding: 5px 9px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        color: inherit;
        width: 190px;
    }
    .search-box:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .path-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-bottom: none;
        padding: 7px 12px;
        font-size: 13px;
        font-family: monospace;
        color: #57606a;
    }
    .path-bar .crumb { color: #0969da; text-decoration: none; }
    .path-bar .crumb:hover { text-decoration: underline; }

    /* ---------- 主区域 ---------- */
    .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #d0d7de;
        min-height: 340px;
    }
    .status-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-top: none;
        padding: 6px 12px;
        font-size: 12px;
        color: #57606a;
        font-family: monospace;
    }

    /* 图标视图 */
    .icon-view {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 4px;
        padding: 14px;
    }
    .icon-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: inherit;
        padding: 10px 6px 8px;
        border: 1px solid transparent;
        cursor: pointer;
        text-align: center;
    }
    .icon-cell:hover {
        background: #eaf2fd;
        border-color: #b6d4fb;
    }
    .icon-thumb {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8fa;
        border: 1px solid #e1e4e8;
        overflow: hidden;
        margin-bottom: 8px;
    }
    .icon-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .icon-thumb .glyph { font-size: 40px; line-height: 1; }

    /* 列表视图 */
    .list-view { display: none; width: 100%; border-collapse: collapse; font-size: 13px; }
    .list-view th {
        text-align: left;
        font-weight: 600;
        padding: 8px 12px;
        border-bottom: 1px solid #d0d7de;
        background: #f6f8fa;
        color: #57606a;
        white-space: nowrap;
        user-select: none;
    }
    .list-view th.sortable { cursor: pointer; }
    .list-view th.sortable:hover { color: #0969da; }
    .list-view td {
        padding: 7px 12px;
        border-bottom: 1px solid #e1e4e8;
        vertical-align: middle;
    }
    .list-view tr:last-child td { border-bottom: none; }
    .list-view tr.row:hover { background: #eaf2fd; cursor: pointer; }
    .list-name { display: flex; align-items: center; gap: 8px; }
    .list-name .glyph { font-size: 16px; width: 20px; text-align: center; flex: 0 0 20px; }
    .list-name .mini-thumb {
        width: 22px; height: 22px; object-fit: cover;
        border: 1px solid #e1e4e8; flex: 0 0 22px;
    }
    .col-size, .col-date { color: #57606a; font-family: monospace; white-space: nowrap; }
    .col-type { color: #57606a; white-space: nowrap; }

    /* 单元格里的文件名 */
    .cell-name {
        margin-top: 2px;
        font-size: 13px;
        color: #1e1e1e;
        word-break: break-all;
        line-height: 1.35;
    }
    .cell-meta {
        font-size: 11px;
        color: #8b949e;
        font-family: monospace;
        margin-top: 3px;
    }
    .icon-view.is-hidden, .list-view.is-hidden { display: none; }

    .empty-tip {
        padding: 60px 20px;
        text-align: center;
        color: #8b949e;
        font-size: 14px;
    }

    .footer {
        margin-top: 28px;
        text-align: center;
        font-size: 13px;
        color: #8b949e;
        border-top: 1px solid #d0d7de;
        padding-top: 14px;
    }

    @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #c9d1d9; }
        body::before { filter: brightness(0.32); }
        h1 { border-bottom-color: #30363d; }
        .sub, .back-link { color: #8b949e; }
        .back-link { color: #58a6ff; }
        .toolbar, .path-bar, .panel, .status-bar {
            background: rgba(22, 27, 34, 0.85);
            border-color: #30363d;
        }
        .tb-btn { background: #21262d; border-color: #30363d; color: #c9d1d9; }
        .tb-btn:hover { background: #30363d; }
        .tb-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .tb-sep, .path-bar .crumb { border-color: #30363d; }
        .path-bar .crumb { color: #58a6ff; }
        .search-box { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .icon-thumb { background: #0d1117; border-color: #30363d; }
        .icon-cell:hover { background: #1c2b3a; border-color: #1f6feb; }
        .list-view th { background: #161b22; border-bottom-color: #30363d; color: #8b949e; }
        .list-view td { border-bottom-color: #30363d; }
        .list-view tr.row:hover { background: #1c2b3a; }
        .list-name .mini-thumb { border-color: #30363d; }
        .col-size, .col-date, .col-type { color: #8b949e; }
        .cell-name { color: #c9d1d9; }
        .footer { border-top-color: #30363d; }
    }
    @media (max-width: 620px) {
        .search-box { width: 100%; }
        .col-type { display: none; }
        .list-view th.col-type { display: none; }
    }
</style>
</head>
<body>
<div class="page">
    <a href="../index.html" class="back-link">&larr; 返回主页</a>
    <h1>Download</h1>
    <div class="sub">文件浏览与下载 &mdash; 图片带缩略图，各种格式都会显示</div>

    <div class="toolbar">
        <button type="button" class="tb-btn" id="btnBack">↑ 上一级</button>
        <button type="button" class="tb-btn" id="btnRefresh">刷新</button>
        <span class="tb-sep"></span>
        <button type="button" class="tb-btn active" id="btnIcon">图标</button>
        <button type="button" class="tb-btn" id="btnList">列表</button>
        <span class="tb-spacer"></span>
        <input type="text" class="search-box" id="search" placeholder="搜索文件名…">
    </div>

    <div class="path-bar">
        <span>位置:</span>
        <a href="../index.html" class="crumb">ZYHS</a>
        <span>/</span>
        <span class="crumb" style="color:#1e1e1e;text-decoration:none;">Download</span>
    </div>

    <div class="panel">
        <div class="icon-view" id="iconView"></div>
        <table class="list-view" id="listView">
            <thead>
                <tr>
                    <th class="sortable" data-sort="name">名称</th>
                    <th class="sortable col-size" data-sort="size">大小</th>
                    <th class="col-type">类型</th>
                    <th class="sortable col-date" data-sort="date">修改日期</th>
                </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
        <div class="empty-tip" id="emptyTip" style="display:none;">没有匹配的文件</div>
    </div>

    <div class="status-bar">
        <span id="statCount">0 个项目</span>
        <span id="statSize"></span>
        <span id="statSel"></span>
    </div>

    <div class="footer">4444442.xyz · ZYHS</div>
</div>

<script>
/* =========================================================================

   要新增一个可下载文件，只需两步：
   1) 把文件放进本目录（Download/）；
   2) 在下面 FILES 数组里加一条记录。
   图片只要写 type:"image" 就会自动生成缩略图，不用额外准备小图。
   拿不到精确大小时 size 可以留 0，页面会显示为 "—"。
   ========================================================================= */
var FILES = [

    },
    {

    },

    },
    {

    },
    {

        type: "html",

    {

    },
    {

    {

        type: "html",

    },
    {
        name: "2c.html",
        title: "3D 太阳系模拟",
        desc: "行星轨道实时 3D 渲染，单文件无依赖。显卡性能一般时可以看帧率变化。",
        type: "html",
        size: 37744,

    },
    {
        name: "822.html",
        title: "俄罗斯方块",

        type: "html",
        size: 42746,
        date: "2026-09-15"
    }
];

/* ---------- 文件类型识别 ---------- */
var TYPE_MAP = {
    image:   { label: "图片",   glyph: "🖼️" },
    html:    { label: "网页",   glyph: "🌐" },
    video:   { label: "视频",   glyph: "🎬" },
    audio:   { label: "音频",   glyph: "🎵" },
    pdf:     { label: "PDF",    glyph: "📕" },
    archive: { label: "压缩包", glyph: "🗜️" },
    text:    { label: "文本",   glyph: "📄" },
    code:    { label: "代码",   glyph: "📜" },
    doc:     { label: "文档",   glyph: "📘" },
    sheet:   { label: "表格",   glyph: "📊" },
    slides:  { label: "幻灯片", glyph: "📽️" },
    font:    { label: "字体",   glyph: "🔤" },
    exe:     { label: "程序",   glyph: "⚙️" },
    other:   { label: "文件",   glyph: "📄" }
};
var EXT_MAP = {
    jpg:"image", jpeg:"image", png:"image", gif:"image", webp:"image", bmp:"image",
    svg:"image", ico:"image", avif:"image", tif:"image", tiff:"image",
    html:"html", htm:"html",
    mp4:"video", webm:"video", mkv:"video", mov:"video", avi:"video", m4v:"video",
    mp3:"audio", wav:"audio", ogg:"audio", flac:"audio", m4a:"audio", aac:"audio", opus:"audio",
    pdf:"pdf",
    zip:"archive", rar:"archive", "7z":"archive", tar:"archive", gz:"archive", xz:"archive", bz2:"archive",
    txt:"text", log:"text", md:"text", json:"text", csv:"text",
    js:"code", css:"code", py:"code", ts:"code", c:"code", cpp:"code", h:"code", java:"code", sh:"code", xml:"code",
    doc:"doc", docx:"doc", rtf:"doc",
    xls:"sheet", xlsx:"sheet", ods:"sheet",
    ppt:"slides", pptx:"slides", odp:"slides",
    ttf:"font", otf:"font", woff:"font", woff2:"font",
    exe:"exe", msi:"exe", apk:"exe", dmg:"exe", deb:"exe", appimage:"exe"
};

function extOf(name) {
    var i = name.lastIndexOf(".");
    return i < 0 ? "" : name.slice(i + 1).toLowerCase();
}
function typeOf(item) {
    if (item.type && TYPE_MAP[item.type]) return item.type;
    return EXT_MAP[extOf(item.name)] || "other";
}
function fmtSize(bytes) {
    if (!bytes) return "—";
    var u = ["B", "KB", "MB", "GB"];
    var i = 0, n = bytes;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + u[i];
}
function humanLabel(item) {
    if (item.title) return item.title;
    return item.name;
}

/* ---------- 渲染 ---------- */
var state = { view: "icon", sortKey: "name", sortAsc: true, query: "" };

function visibleFiles() {
    var q = state.query.trim().toLowerCase();
    var list = FILES.filter(function (it) {
        if (!q) return true;
        return it.name.toLowerCase().indexOf(q) >= 0 ||
               (it.title || "").toLowerCase().indexOf(q) >= 0 ||
               (it.desc || "").toLowerCase().indexOf(q) >= 0;
    });
    var dir = state.sortAsc ? 1 : -1;
    var key = state.sortKey;
    list.sort(function (a, b) {
        var va, vb;
        if (key === "size") { va = a.size || 0; vb = b.size || 0; }
        else if (key === "date") { va = a.date || ""; vb = b.date || ""; }
        else { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
    });
    return list;
}

function iconCellHtml(it) {
    var t = typeOf(it), meta = TYPE_MAP[t];
    var inner;
    if (t === "image") {
        inner = '<div class="icon-thumb"><img src="' + encodeURI(it.name) +
                '" alt="" loading="lazy"></div>';
    } else {
        inner = '<div class="icon-thumb"><span class="glyph">' + meta.glyph + '</span></div>';
    }
    var sizeTxt = fmtSize(it.size);
    var dim = (it.w && it.h) ? " · " + it.w + "×" + it.h : "";
    return '<a class="icon-cell" href="' + encodeURI(it.name) + '" download title="' +
           (it.desc || it.name).replace(/"/g, "&quot;") + '">' +
           inner +
           '<div class="cell-name">' + humanLabel(it) + '</div>' +
           '<div class="cell-meta">' + sizeTxt + dim + '</div>' +
           '</a>';
}

function listRowHtml(it) {
    var t = typeOf(it), meta = TYPE_MAP[t];
    var lead;
    if (t === "image") {
        lead = '<img class="mini-thumb" src="' + encodeURI(it.name) + '" alt="" loading="lazy">';
    } else {
        lead = '<span class="glyph">' + meta.glyph + '</span>';
    }
    return '<tr class="row" data-href="' + encodeURI(it.name) + '">' +
           '<td><div class="list-name">' + lead + '<span>' + humanLabel(it) + '</span></div></td>' +
           '<td class="col-size">' + fmtSize(it.size) + '</td>' +
           '<td class="col-type">' + meta.label + '</td>' +
           '<td class="col-date">' + (it.date || "—") + '</td>' +
           '</tr>';
}

function render() {
    var list = visibleFiles();
    var iconView = document.getElementById("iconView");
    var listBody = document.getElementById("listBody");
    var emptyTip = document.getElementById("emptyTip");

    iconView.innerHTML = list.map(iconCellHtml).join("");
    listBody.innerHTML = list.map(listRowHtml).join("");
    emptyTip.style.display = list.length ? "none" : "block";
    document.querySelector(".panel").querySelector(".icon-view").style.display =
        (state.view === "icon" && list.length) ? "" : "none";
    document.getElementById("listView").style.display =
        (state.view === "list" && list.length) ? "table" : "none";

    var total = 0;
    list.forEach(function (it) { total += it.size || 0; });
    document.getElementById("statCount").textContent = list.length + " 个项目";
    document.getElementById("statSize").textContent = list.length ? ("合计 " + fmtSize(total)) : "";

    // 列表行点击跳转
    Array.prototype.forEach.call(listBody.querySelectorAll("tr.row"), function (tr) {
        tr.addEventListener("click", function () {
            window.location.href = tr.getAttribute("data-href");
        });
    });
}

/* ---------- 交互绑定 ---------- */
document.getElementById("btnIcon").addEventListener("click", function () {
    state.view = "icon";
    this.classList.add("active");
    document.getElementById("btnList").classList.remove("active");
    render();
});
document.getElementById("btnList").addEventListener("click", function () {
    state.view = "list";
    this.classList.add("active");
    document.getElementById("btnIcon").classList.remove("active");
    render();
});
document.getElementById("btnBack").addEventListener("click", function () {
    window.location.href = "../index.html";
});
document.getElementById("btnRefresh").addEventListener("click", function () {
    window.location.reload();
});
document.getElementById("search").addEventListener("input", function () {
    state.query = this.value;
    render();
});
Array.prototype.forEach.call(document.querySelectorAll(".list-view th.sortable"), function (th) {
    th.addEventListener("click", function () {
        var k = th.getAttribute("data-sort");
        if (state.sortKey === k) state.sortAsc = !state.sortAsc;
        else { state.sortKey = k; state.sortAsc = true; }
        render();
    });
});
document.getElementById("statSel").textContent = "网站: 4444442.xyz";

render();
</script>
