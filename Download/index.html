<style>
    * { box-sizing: border-box; }
    body {

        margin: 0;

    body::before {

    .page {

    h1 {

        font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    /* ---------- 工具栏 ---------- */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-bottom: none;
        padding: 8px 10px;
    }
    .tb-btn {
        font: inherit;
        font-size: 13px;
        color: #24292f;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        padding: 5px 12px;
        cursor: pointer;
        user-select: none;
    }
    .tb-btn:hover { background: #eef1f4; }
    .tb-btn.active {
        background: #0969da;
        border-color: #0969da;
        color: #ffffff;
    }
    .tb-sep {
        width: 1px;
        align-self: stretch;
        background: #d0d7de;
        margin: 2px 2px;
    }
    .tb-spacer { flex: 1 1 auto; }
    .search-box {
        font: inherit;
        font-size: 13px;
        padding: 5px 9px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        color: inherit;
        width: 190px;
    }
    .search-box:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .path-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-bottom: none;

    }
    .path-bar .crumb { color: #0969da; text-decoration: none; }
    .path-bar .crumb:hover { text-decoration: underline; }

    /* ---------- 主区域 ---------- */
    .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #d0d7de;
        min-height: 340px;
    }
    .status-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d0d7de;
        border-top: none;
        padding: 6px 12px;
        font-size: 12px;
        color: #57606a;
        font-family: monospace;
    }

    /* ---------- 列表视图（唯一的视图，横排列表） ---------- */
    .list-view { display: table; width: 100%; border-collapse: collapse; font-size: 13px; }
    .list-view th {
        text-align: left;
        font-weight: 600;
        padding: 8px 12px;
        border-bottom: 1px solid #d0d7de;
        background: #f6f8fa;
        color: #57606a;
        white-space: nowrap;
        user-select: none;
    }
    .list-view th.sortable { cursor: pointer; }
    .list-view th.sortable:hover { color: #0969da; }
    .list-view td {
        padding: 7px 12px;
        border-bottom: 1px solid #e1e4e8;
        vertical-align: middle;
    }
    .list-view tr:last-child td { border-bottom: none; }
    .list-view tr.row:hover { background: #eaf2fd; cursor: pointer; }
    .list-name { display: flex; align-items: center; gap: 10px; }
    .list-name .glyph { font-size: 22px; width: 44px; text-align: center; flex: 0 0 44px; }

    /* 横排预览缩略图：图片显示真实小图，其他格式显示大图标 */
    .list-name .mini-thumb {
        width: 44px; height: 44px; object-fit: cover;
        border: 1px solid #e1e4e8; flex: 0 0 44px; display: block;
    }
    .name-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .name-main { color: #1e1e1e; }
    .name-sub { font-size: 11px; color: #8b949e; }

    .col-size, .col-date { color: #57606a; font-family: monospace; white-space: nowrap; }
    .col-type { color: #57606a; white-space: nowrap; }
    .col-act { width: 1%; white-space: nowrap; text-align: right; }

    /* 行尾的下载按钮：点击只下载，不触发行点击跳转 */
    .dl-btn {
        font: inherit;
        font-size: 12px;
        color: #0969da;
        background: #ffffff;
        border: 1px solid #d0d7de;
        padding: 4px 12px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        white-space: nowrap;
    }
    .dl-btn:hover { background: #0969da; border-color: #0969da; color: #ffffff; }

    .empty-tip {

        color: #8b949e;

    .footer {
        margin-top: 28px;

        font-size: 13px;
        color: #8b949e;

    @media (prefers-color-scheme: dark) {

        h1 { border-bottom-color: #30363d; }
        .sub, .back-link { color: #8b949e; }

        .toolbar, .path-bar, .panel, .status-bar {

        .tb-sep, .path-bar .crumb { border-color: #30363d; }
        .path-bar .crumb { color: #58a6ff; }
        .search-box { background: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .list-view th { background: #161b22; border-bottom-color: #30363d; color: #8b949e; }

        .list-name .mini-thumb { border-color: #30363d; }
        .name-main { color: #c9d1d9; }
        .col-size, .col-date, .col-type { color: #8b949e; }

        .dl-btn:hover { background: #1f6feb; border-color: #1f6feb; color: #ffffff; }
        .footer { border-top-color: #30363d; }

    @media (max-width: 620px) {
        .search-box { width: 100%; }
        .col-type { display: none; }
        .list-view th.col-type { display: none; }
    }
</style>

<body>
<div class="page">

    <div class="status-bar">

</div>

<script>
/* =========================================================================

   图片只要写 type:"image" 就会自动生成缩略图，不用额外准备小图。

   ========================================================================= */
var FILES = [

    },
    {

        type: "archive",

    {

    },
    {

        type: "html",

    },
    {
        name: "2c.html",
        title: "3D 太阳系模拟",
        desc: "行星轨道实时 3D 渲染，单文件无依赖。显卡性能一般时可以看帧率变化。",
        type: "html",

    },
    {

        date: "2026-09-15"
    }
];

/* ---------- 文件类型识别 ---------- */
var TYPE_MAP = {
    image:   { label: "图片",   glyph: "🖼️" },
    html:    { label: "网页",   glyph: "🌐" },
    video:   { label: "视频",   glyph: "🎬" },
    audio:   { label: "音频",   glyph: "🎵" },
    pdf:     { label: "PDF",    glyph: "📕" },
    archive: { label: "压缩包", glyph: "🗜️" },
    text:    { label: "文本",   glyph: "📄" },
    code:    { label: "代码",   glyph: "📜" },
    doc:     { label: "文档",   glyph: "📘" },
    sheet:   { label: "表格",   glyph: "📊" },
    slides:  { label: "幻灯片", glyph: "📽️" },
    font:    { label: "字体",   glyph: "🔤" },
    exe:     { label: "程序",   glyph: "⚙️" },
    other:   { label: "文件",   glyph: "📄" }
};
var EXT_MAP = {
    jpg:"image", jpeg:"image", png:"image", gif:"image", webp:"image", bmp:"image",
    svg:"image", ico:"image", avif:"image", tif:"image", tiff:"image",
    html:"html", htm:"html",
    mp4:"video", webm:"video", mkv:"video", mov:"video", avi:"video", m4v:"video",
    mp3:"audio", wav:"audio", ogg:"audio", flac:"audio", m4a:"audio", aac:"audio", opus:"audio",
    pdf:"pdf",
    zip:"archive", rar:"archive", "7z":"archive", tar:"archive", gz:"archive", xz:"archive", bz2:"archive",
    txt:"text", log:"text", md:"text", json:"text", csv:"text",
    js:"code", css:"code", py:"code", ts:"code", c:"code", cpp:"code", h:"code", java:"code", sh:"code", xml:"code",
    doc:"doc", docx:"doc", rtf:"doc",
    xls:"sheet", xlsx:"sheet", ods:"sheet",
    ppt:"slides", pptx:"slides", odp:"slides",
    ttf:"font", otf:"font", woff:"font", woff2:"font",
    exe:"exe", msi:"exe", apk:"exe", dmg:"exe", deb:"exe", appimage:"exe"
};

function extOf(name) {
    var i = name.lastIndexOf(".");
    return i < 0 ? "" : name.slice(i + 1).toLowerCase();
}
function typeOf(item) {
    if (item.type && TYPE_MAP[item.type]) return item.type;
    return EXT_MAP[extOf(item.name)] || "other";
}
function fmtSize(bytes) {
    if (!bytes) return "—";
    var u = ["B", "KB", "MB", "GB"];
    var i = 0, n = bytes;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + u[i];
}
function humanLabel(item) {
    if (item.title) return item.title;
    return item.name;
}

/* ---------- 渲染 ---------- */
var state = { sortKey: "name", sortAsc: true, query: "" };

function visibleFiles() {
    var q = state.query.trim().toLowerCase();
    var list = FILES.filter(function (it) {
        if (!q) return true;
        return it.name.toLowerCase().indexOf(q) >= 0 ||
               (it.title || "").toLowerCase().indexOf(q) >= 0 ||
               (it.desc || "").toLowerCase().indexOf(q) >= 0;
    });
    var dir = state.sortAsc ? 1 : -1;
    var key = state.sortKey;
    list.sort(function (a, b) {
        var va, vb;
        if (key === "size") { va = a.size || 0; vb = b.size || 0; }
        else if (key === "date") { va = a.date || ""; vb = b.date || ""; }
        else { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
    });
    return list;
}

/* 列表行：左侧预览（图片显示真实小图，其他格式显示图标），
   中间是名称/说明，最右一列是下载按钮。
   点整行 = 打开；点按钮 = 下载（按钮里 stopPropagation，不会同时打开）。 */
function listRowHtml(it) {
    var t = typeOf(it), meta = TYPE_MAP[t];
    var url = encodeURI(it.name);
    var lead;
    if (t === "image") {
        lead = '<img class="mini-thumb" src="' + url + '" alt="" loading="lazy">';
    } else {
        lead = '<span class="glyph">' + meta.glyph + '</span>';
    }
    var sub = it.desc ? '<span class="name-sub">' + it.desc + '</span>' : "";
    return '<tr class="row" data-href="' + url + '" data-name="' +
           it.name.replace(/"/g, "&quot;") + '" title="点击打开">' +
           '<td><div class="list-name">' + lead +
               '<span class="name-text"><span class="name-main">' + humanLabel(it) +
               '</span>' + sub + '</span></div></td>' +
           '<td class="col-size">' + fmtSize(it.size) + '</td>' +
           '<td class="col-type">' + meta.label + '</td>' +
           '<td class="col-date">' + (it.date || "—") + '</td>' +
           '<td class="col-act"><a class="dl-btn" href="' + url +
               '" download="' + it.name.replace(/"/g, "&quot;") + '">下载</a></td>' +
           '</tr>';
}

function render() {
    var list = visibleFiles();
    var listBody = document.getElementById("listBody");
    var emptyTip = document.getElementById("emptyTip");

    listBody.innerHTML = list.map(listRowHtml).join("");
    emptyTip.style.display = list.length ? "none" : "block";
    document.getElementById("listView").style.display = list.length ? "table" : "none";

    var total = 0;
    list.forEach(function (it) { total += it.size || 0; });
    document.getElementById("statCount").textContent = list.length + " 个项目";
    document.getElementById("statSize").textContent = list.length ? ("合计 " + fmtSize(total)) : "";

    // 整行点击 = 打开文件
    Array.prototype.forEach.call(listBody.querySelectorAll("tr.row"), function (tr) {
        tr.addEventListener("click", function () {
            window.open(tr.getAttribute("data-href"), "_blank");
        });
    });
    // 下载按钮：阻止冒泡，避免同时触发「打开」
    Array.prototype.forEach.call(listBody.querySelectorAll(".dl-btn"), function (btn) {
        btn.addEventListener("click", function (ev) {
            ev.stopPropagation();
        });
    });
}

/* ---------- 交互绑定 ---------- */
document.getElementById("btnBack").addEventListener("click", function () {
    window.location.href = "../index.html";
});
document.getElementById("btnRefresh").addEventListener("click", function () {
    window.location.reload();
});
document.getElementById("search").addEventListener("input", function () {
    state.query = this.value;
    render();
});
Array.prototype.forEach.call(document.querySelectorAll(".list-view th.sortable"), function (th) {
    th.addEventListener("click", function () {
        var k = th.getAttribute("data-sort");
        if (state.sortKey === k) state.sortAsc = !state.sortAsc;
        else { state.sortKey = k; state.sortAsc = true; }
        render();
    });
});
render();
document.getElementById("statSel").textContent = "网站: 4444442.xyz";

render();
</script>
